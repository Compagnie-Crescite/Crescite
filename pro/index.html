<!doctype html>
<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="description" content="L’espace des salles de la compagnie Crescite : les captations et les documents de ses spectacles, sur invitation.">
<!-- la nuit par défaut, quel que soit l'appareil (data-theme="nuit" sur <html>, comme le site public) ; le jour reste dans
     la feuille de style, sous data-theme="jour" seulement -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1117">
<!-- l'icône d'onglet : celle des espaces réservés, à la couleur de la saison (faite par site/build.py, equipe(dest)) -->
<link rel="icon" href="../equipe/icones/192.png" type="image/png">
<link rel="apple-touch-icon" href="../equipe/icones/180.png">
<meta name="format-detection" content="telephone=no">
<title>Espace des salles · Compagnie Crescite</title>
<link rel="preconnect" href="https://fwjgyfzcbcmfyfkhhtuh.supabase.co" crossorigin>
<link rel="stylesheet" href="../polices/polices.css">
<style>
/* L'espace des salles (pro/) : les programmateurs et les directeurs de salle invités y trouvent les captations et les
   documents des spectacles que la compagnie leur ouvre. Sobre, à la charte du site public : ses polices (Ubuntu, Open
   Sans, Raleway), ses neutres, sa nuit, et pour accent la couleur de la saison (règle 22 du contrat : --saison-*, que
   site/build.py pose après cette feuille ; sans lui, un gris neutre) ; chaque spectacle dans la police et la couleur
   de son univers. La nuit par défaut, quel que soit l'appareil ; le jour sous data-theme="jour" seulement. */
:root {
  --saison: #4f4850; --saison-vive: #b7b0ae; --saison-porteur: #5c545d; --saison-profond: #2b272c; --saison-texte: #4f4850;
  --saison-fonce: #3f3940; --saison-doux: #efebe6; --saison-texte-nuit: #b7b0ae; --saison-fonce-nuit: #d0cbc9; --saison-doux-nuit: #2e2629;
  --papier: #f6f2eb; --surface: #fffdf9; --surface-2: #ece5da; --encre: #1d1418; --gris: #5f565a; --filet: #dcd3c6;
  --bord-champ: #8c8085; --magenta: var(--saison-texte); --magenta-fonce: var(--saison-fonce); --magenta-doux: var(--saison-doux);
  --sur-magenta: #fff; --pieuvre: var(--saison); --alerte: #a4231b; --alerte-doux: #fbe7e5;
  --serif: "Ubuntu", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --etiq: "Raleway", "Open Sans", system-ui, sans-serif;
  --rayon: 18px; --rayon-s: 12px;
  --ombre: 0 1px 2px rgba(29, 20, 24, .05), 0 12px 30px -20px rgba(29, 20, 24, .35);
  --gs: env(safe-area-inset-left, 0px); --ds: env(safe-area-inset-right, 0px);
}
/* la nuit, par défaut (data-theme="nuit", ou rien) ; le jour seulement sous data-theme="jour" */
:root:not([data-theme="jour"]) {
  color-scheme: dark;
  --papier: #1b1117; --surface: #2e2128; --surface-2: #23171e; --encre: #f3eee9; --gris: #b7b0ae; --filet: #3b3036;
  --bord-champ: #8a8085; --magenta: var(--saison-texte-nuit); --magenta-fonce: var(--saison-fonce-nuit); --magenta-doux: var(--saison-doux-nuit);
  --sur-magenta: #1b1117; --pieuvre: var(--saison-texte-nuit); --alerte: #ff8f86; --alerte-doux: #3d1f1d;
  --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -20px rgba(0, 0, 0, .8);
}
:root[data-theme="jour"] { color-scheme: light; }
/* la couleur d'un spectacle, lisible le jour comme la nuit (pro.js pose --ul et --us) */
.spectacle { --u: var(--ul, var(--magenta)); }
:where(:root:not([data-theme="jour"])) .spectacle { --u: var(--us, var(--magenta)); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--papier); color: var(--encre); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
a { color: var(--magenta); text-underline-offset: .18em; }
a:hover { color: var(--magenta-fonce); }
button, input { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.sr { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; clip-path: inset(50%) !important; white-space: nowrap !important; }
.evitement { position: absolute; left: 8px; top: -80px; z-index: 90; padding: 10px 14px; border-radius: 10px; background: var(--encre); color: var(--papier); font-weight: 600; }
.evitement:focus { top: 8px; color: var(--papier); }
.ic { width: 20px; height: 20px; flex: none; }

/* l'en-tête */
.barre { display: flex; align-items: center; gap: 12px; max-width: 1120px; margin: 0 auto; padding: 18px calc(20px + var(--ds)) 6px calc(20px + var(--gs)); }
/* la marque de l'en-tête, comme dans l'administration et l'espace de l'équipe : la pieuvre (../admin/tentacules.js la pose
   dans [data-pieuvre], d'après ../admin/logo.js), « Compagnie Crescite », et dessous le nom de l'espace ; elle mène au site */
.marque { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--encre); text-decoration: none; min-width: 0; }
.marque:hover { color: var(--encre); }
.marque .pieuvre { display: inline-block; flex: none; width: 46px; height: 26px; color: var(--pieuvre); }
.marque .pieuvre:empty { display: none; }
.marque .pieuvre svg { display: block; width: 100%; height: 100%; overflow: visible; }
.marque-texte { display: grid; gap: 4px; line-height: 1.1; min-width: 0; }
.marque-nom { font: 500 1.12rem/1.1 var(--serif); }
.marque small { font: 700 .66rem/1 var(--etiq); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
/* le pied commun des espaces réservés : sobre, en fin de contenu */
.pied-espace { display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; border-top: 1px solid var(--filet); color: var(--gris); font-size: .84rem; }
.pied-espace .pied-nom { margin: 0; font: 500 .95rem/1.3 var(--serif); color: var(--encre); }
.pied-espace nav { display: flex; flex-wrap: wrap; gap: 0 16px; }
/* chaque lien du pied, une cible de 44 px (la ligne reste sobre : la hauteur ne se voit pas) */
.pied-espace a { display: inline-flex; align-items: center; min-height: 44px; color: var(--gris); }
.pied-espace a:hover { color: var(--magenta); }
.barre .ecrire { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--filet); background: var(--surface); color: var(--encre); text-decoration: none; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.barre .ecrire:hover { border-color: var(--magenta); color: var(--magenta); }

main { max-width: 1120px; margin: 0 auto; padding: 8px calc(20px + var(--ds)) 40px calc(20px + var(--gs)); }
.chargement { padding: 60px 0; color: var(--gris); text-align: center; }

/* l'accueil d'une salle invitée */
.accueil { padding: 26px 0 18px; border-bottom: 1px solid var(--filet); margin-bottom: 26px; }
.accueil .sur { color: var(--magenta); font: 700 .78rem/1.3 var(--etiq); letter-spacing: .14em; text-transform: uppercase; }
.accueil h1 { font: 500 clamp(1.7rem, 4.6vw, 2.6rem)/1.12 var(--serif); margin: 8px 0 6px; letter-spacing: -.01em; }
.accueil .structure { font-weight: 600; font-size: 1.08rem; }
.accueil .fin { color: var(--gris); margin-top: 2px; }
.accueil .intro { margin-top: 12px; max-width: 640px; }

/* les spectacles */
.spectacles { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .spectacles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.spectacle { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); overflow: hidden; box-shadow: var(--ombre); }
.spectacle .photo { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
.spectacle .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* sans photo : la couleur de l'univers (une lueur montée du bas, comme la scène) et la pieuvre de la compagnie au milieu */
.spectacle .sans-photo { display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 110%, color-mix(in srgb, var(--u) 42%, transparent), transparent 70%), linear-gradient(160deg, color-mix(in srgb, var(--u) 16%, var(--surface-2)), var(--surface-2) 70%); }
.spectacle .pieuvre-cadre { display: block; width: min(44%, 220px); color: color-mix(in srgb, var(--u) 78%, transparent); filter: drop-shadow(0 10px 22px color-mix(in srgb, var(--u) 30%, transparent)); }
.spectacle .pieuvre-cadre svg { display: block; width: 100%; height: auto; overflow: visible; }
.spectacle .photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--u); }
.spectacle .corps { padding: 18px 20px 20px; display: grid; gap: 4px; }
.spectacle h2 { font: 600 1.7rem/1.1 var(--serif); color: var(--u); letter-spacing: -.005em; }
.spectacle .sous { color: var(--gris); font-size: .98rem; }
.spectacle .creation { color: var(--gris); font-size: .86rem; font-weight: 600; letter-spacing: .02em; }
.groupe { margin-top: 14px; }
.groupe h3 { font: 700 .74rem/1.2 var(--etiq); letter-spacing: .13em; text-transform: uppercase; color: var(--gris); margin-bottom: 6px; }
.docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.doc { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--rayon-s); border: 1px solid var(--filet); background: var(--papier); text-align: left; cursor: pointer; transition: border-color .15s ease, background-color .15s ease, transform .15s ease; }
.doc:hover { border-color: var(--u); }
.doc:active { transform: scale(.995); }
.doc .pastille { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--u) 13%, transparent); color: var(--u); }
.doc .pastille .ic { width: 21px; height: 21px; }
.doc .texte { display: grid; min-width: 0; flex: 1; }
.doc .titre { font-weight: 600; line-height: 1.3; }
.doc .genre { color: var(--gris); font-size: .84rem; }
.doc .aller { color: var(--gris); }
.doc[aria-busy="true"] { cursor: progress; border-color: var(--u); }
.doc[aria-busy="true"] .aller { animation: tourne .9s linear infinite; color: var(--u); }
@keyframes tourne { to { transform: rotate(360deg); } }
.secours { margin: 4px 0 0 52px; font-size: .92rem; }
.vide { color: var(--gris); }

/* le contact */
.contact { margin-top: 30px; padding: 18px 20px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--filet); display: grid; gap: 4px; }
.contact h2 { font: 600 1.2rem/1.2 var(--serif); }
.contact .coords { display: flex; flex-wrap: wrap; gap: 0 18px; }
.contact .coords a { display: inline-flex; align-items: center; min-height: 44px; }
.reserve { margin-top: 16px; color: var(--gris); font-size: .88rem; }

/* sans code, ou avec un lien refusé */
.porte { max-width: 520px; margin: 30px auto 0; padding: 26px 24px; background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); box-shadow: var(--ombre); }
.porte h1 { font: 500 1.9rem/1.15 var(--serif); margin: 6px 0 10px; }
.porte .sur { color: var(--magenta); font: 700 .78rem/1.3 var(--etiq); letter-spacing: .14em; text-transform: uppercase; }
.porte form { margin-top: 18px; display: grid; gap: 8px; }
.porte label { font-weight: 600; }
.porte .ligne { display: flex; gap: 8px; flex-wrap: wrap; }
/* le code d'accès : lu comme il est écrit dans l'invitation, en capitales espacées */
.porte input.code { font: 600 1.25rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
.porte input.code::placeholder { letter-spacing: .14em; text-transform: none; }
.porte input { flex: 1 1 220px; min-width: 0; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--bord-champ); background: var(--papier); font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .95rem; }
.porte input:focus-visible { outline-offset: 0; }
.bouton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--magenta); background: var(--magenta); color: var(--sur-magenta); font-weight: 600; cursor: pointer; text-decoration: none; }
.bouton:hover { background: var(--magenta-fonce); border-color: var(--magenta-fonce); color: var(--sur-magenta); }
.bouton.second { background: transparent; color: var(--magenta); }
.bouton.second:hover { background: var(--magenta-doux); color: var(--magenta-fonce); }
.porte .aide { color: var(--gris); font-size: .9rem; }
.porte .demander { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--filet); display: grid; gap: 8px; justify-items: start; }
.message { padding: 12px 14px; border-radius: 12px; background: var(--alerte-doux); color: var(--alerte); font-weight: 600; }
.message.neutre { background: var(--surface-2); color: var(--encre); font-weight: 500; }

.pied-espace { max-width: 1120px; margin: 0 auto; padding: 14px calc(20px + var(--ds)) 30px calc(20px + var(--gs)); }

/* le mouvement, discret : les blocs paraissent en montant un peu, l'un après l'autre (rien si le visiteur demande moins
   d'animations, ou avec ?anim=0) */
.parait { animation: parait .42s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes parait { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .parait, .doc[aria-busy="true"] .aller { animation: none; } .doc { transition: none; } }
.sans-mouvement .parait, .sans-mouvement .doc[aria-busy="true"] .aller { animation: none; }

@media (max-width: 520px) {
  .barre { padding-top: 14px; }
  .barre .ecrire .mot { display: none; }
  .accueil { padding-top: 16px; }
  .spectacle .corps { padding: 16px 16px 18px; }
  .spectacle h2 { font-size: 1.5rem; }
  .porte { padding: 22px 18px; margin-top: 18px; }
  .secours { margin-left: 0; }
}
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header class="barre">
  <a class="marque" href="../"><span class="pieuvre" data-pieuvre aria-hidden="true"></span><span class="marque-texte"><span class="marque-nom">Compagnie Crescite</span><small>Espace des salles</small></span><span class="sr"> : le site de la compagnie</span></a>

</header>
<main id="contenu" tabindex="-1"><p class="chargement" role="status">Chargement…</p></main>

<script src="../admin/logo.js" defer></script>
<script src="../admin/tentacules.js" defer></script>
<script src="pro.js" defer></script>
</body>
</html>
