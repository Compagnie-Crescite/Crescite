<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="description" content="L’espace des salles de la compagnie Crescite : les captations et les documents de ses spectacles, sur invitation.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141016" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>Crescite · Espace des salles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://omekkqjinvppadsoinvj.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" crossorigin>
<style>
/* L'espace des salles (pro/) : les programmateurs et les directeurs de salle invités y trouvent les captations et les
   documents des spectacles que la compagnie leur ouvre. Sobre : papier, encre et magenta de la compagnie ; chaque
   spectacle dans la police et la couleur de son univers. Le mode sombre suit le réglage de l'appareil. */
:root {
  --papier: #f6f2eb; --surface: #fffdf9; --surface-2: #efe8dd; --encre: #1d1418; --gris: #5f565a; --filet: #ded4c6;
  --bord-champ: #8c8085; --magenta: #a3306b; --magenta-fonce: #87245a; --magenta-doux: #f5e4ec; --alerte: #a4231b; --alerte-doux: #fbe7e5;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --rayon: 18px; --rayon-s: 12px;
  --ombre: 0 1px 2px rgba(29, 20, 24, .05), 0 12px 30px -20px rgba(29, 20, 24, .35);
  --gs: env(safe-area-inset-left, 0px); --ds: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --papier: #141016; --surface: #1f1921; --surface-2: #2a222d; --encre: #f4eef2; --gris: #b9aeb6; --filet: #3a3140;
    --bord-champ: #8a7f8c; --magenta: #f08cc0; --magenta-fonce: #f7aed3; --magenta-doux: #3a1f30; --alerte: #ff8f86; --alerte-doux: #3d1f1d;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -20px rgba(0, 0, 0, .8);
  }
}
/* la couleur d'un spectacle, lisible en clair comme en sombre (pro.js pose --ul et --us) */
.spectacle { --u: var(--ul, var(--magenta)); }
@media (prefers-color-scheme: dark) { .spectacle { --u: var(--us, var(--magenta)); } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--papier); color: var(--encre); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
a { color: var(--magenta); text-underline-offset: .18em; }
a:hover { color: var(--magenta-fonce); }
button, input { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.sr { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; clip-path: inset(50%) !important; white-space: nowrap !important; }
.evitement { position: absolute; left: 8px; top: -80px; z-index: 90; padding: 10px 14px; border-radius: 10px; background: var(--encre); color: var(--papier); font-weight: 600; }
.evitement:focus { top: 8px; color: var(--papier); }
.ic { width: 20px; height: 20px; flex: none; }

/* l'en-tête */
.barre { display: flex; align-items: center; gap: 12px; max-width: 1120px; margin: 0 auto; padding: 18px calc(20px + var(--ds)) 6px calc(20px + var(--gs)); }
.marque { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
.logo { width: 44px; height: 44px; flex: none; display: block; }
.badge-logo { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1d1d1b; color: #fff; font: 700 9.5px/1 var(--sans); letter-spacing: .02em; }
@media (prefers-color-scheme: dark) { .logo:not(.badge-logo) { filter: invert(1) hue-rotate(180deg); } .badge-logo { background: #f4eef2; color: #141016; } }
.marque-texte { display: grid; line-height: 1.15; min-width: 0; }
.marque-texte b { font: 600 1.05rem/1.2 var(--serif); }
.marque-texte span { color: var(--gris); font-size: .86rem; }
.barre .ecrire { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--surface); color: var(--encre); text-decoration: none; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.barre .ecrire:hover { border-color: var(--magenta); color: var(--magenta); }

main { max-width: 1120px; margin: 0 auto; padding: 8px calc(20px + var(--ds)) 40px calc(20px + var(--gs)); }
.chargement { padding: 60px 0; color: var(--gris); text-align: center; }

/* l'accueil d'une salle invitée */
.accueil { padding: 26px 0 18px; border-bottom: 1px solid var(--filet); margin-bottom: 26px; }
.accueil .sur { color: var(--magenta); font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
.accueil h1 { font: 600 clamp(1.7rem, 4.6vw, 2.6rem)/1.12 var(--serif); margin: 8px 0 6px; letter-spacing: -.01em; }
.accueil .structure { font-weight: 600; font-size: 1.08rem; }
.accueil .fin { color: var(--gris); margin-top: 2px; }
.accueil .intro { margin-top: 12px; max-width: 640px; }

/* les spectacles */
.spectacles { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .spectacles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.spectacle { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); overflow: hidden; box-shadow: var(--ombre); }
.spectacle .photo { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
.spectacle .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.spectacle .photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--u); }
.spectacle .corps { padding: 18px 20px 20px; display: grid; gap: 4px; }
.spectacle h2 { font: 600 1.7rem/1.1 var(--serif); color: var(--u); letter-spacing: -.005em; }
.spectacle .sous { color: var(--gris); font-size: .98rem; }
.spectacle .creation { color: var(--gris); font-size: .86rem; font-weight: 600; letter-spacing: .02em; }
.groupe { margin-top: 14px; }
.groupe h3 { font: 700 .74rem/1.2 var(--sans); letter-spacing: .13em; text-transform: uppercase; color: var(--gris); margin-bottom: 6px; }
.docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.doc { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--rayon-s); border: 1px solid var(--filet); background: var(--papier); text-align: left; cursor: pointer; transition: border-color .15s ease, background-color .15s ease, transform .15s ease; }
.doc:hover { border-color: var(--u); }
.doc:active { transform: scale(.995); }
.doc .pastille { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--u) 13%, transparent); color: var(--u); }
.doc .pastille .ic { width: 21px; height: 21px; }
.doc .texte { display: grid; min-width: 0; flex: 1; }
.doc .titre { font-weight: 600; line-height: 1.3; }
.doc .genre { color: var(--gris); font-size: .84rem; }
.doc .aller { color: var(--gris); }
.doc[aria-busy="true"] { cursor: progress; border-color: var(--u); }
.doc[aria-busy="true"] .aller { animation: tourne .9s linear infinite; color: var(--u); }
@keyframes tourne { to { transform: rotate(360deg); } }
.secours { margin: 4px 0 0 52px; font-size: .92rem; }
.vide { color: var(--gris); }

/* le contact */
.contact { margin-top: 30px; padding: 18px 20px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--filet); display: grid; gap: 4px; }
.contact h2 { font: 600 1.2rem/1.2 var(--serif); }
.contact .coords { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.reserve { margin-top: 16px; color: var(--gris); font-size: .88rem; }

/* sans code, ou avec un lien refusé */
.porte { max-width: 520px; margin: 30px auto 0; padding: 26px 24px; background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); box-shadow: var(--ombre); }
.porte h1 { font: 600 1.9rem/1.15 var(--serif); margin: 6px 0 10px; }
.porte .sur { color: var(--magenta); font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
.porte form { margin-top: 18px; display: grid; gap: 8px; }
.porte label { font-weight: 600; }
.porte .ligne { display: flex; gap: 8px; flex-wrap: wrap; }
.porte input { flex: 1 1 220px; min-width: 0; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--bord-champ); background: var(--papier); font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .95rem; }
.porte input:focus-visible { outline-offset: 0; }
.bouton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--magenta); background: var(--magenta); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; }
@media (prefers-color-scheme: dark) { .bouton { color: #1a1014; } }
.bouton:hover { background: var(--magenta-fonce); border-color: var(--magenta-fonce); color: #fff; }
@media (prefers-color-scheme: dark) { .bouton:hover { color: #1a1014; } }
.bouton.second { background: transparent; color: var(--magenta); }
.bouton.second:hover { background: var(--magenta-doux); color: var(--magenta-fonce); }
.porte .aide { color: var(--gris); font-size: .9rem; }
.porte .demander { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--filet); display: grid; gap: 8px; justify-items: start; }
.message { padding: 12px 14px; border-radius: 12px; background: var(--alerte-doux); color: var(--alerte); font-weight: 600; }
.message.neutre { background: var(--surface-2); color: var(--encre); font-weight: 500; }

footer { max-width: 1120px; margin: 0 auto; padding: 14px calc(20px + var(--ds)) 30px calc(20px + var(--gs)); color: var(--gris); font-size: .84rem; border-top: 1px solid var(--filet); }

/* le mouvement, discret : les blocs paraissent en montant un peu, l'un après l'autre (rien si le visiteur demande moins
   d'animations, ou avec ?anim=0) */
.parait { animation: parait .42s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes parait { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .parait, .doc[aria-busy="true"] .aller { animation: none; } .doc { transition: none; } }
.sans-mouvement .parait, .sans-mouvement .doc[aria-busy="true"] .aller { animation: none; }

@media (max-width: 520px) {
  .barre { padding-top: 14px; }
  .barre .ecrire .mot { display: none; }
  .accueil { padding-top: 16px; }
  .spectacle .corps { padding: 16px 16px 18px; }
  .spectacle h2 { font-size: 1.5rem; }
  .porte { padding: 22px 18px; margin-top: 18px; }
  .secours { margin-left: 0; }
}
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header class="barre">
  <span class="marque"><img class="logo" src="../admin/logo-feuille.svg" alt="" width="44" height="44"><span class="marque-texte"><b>Compagnie Crescite</b><span>Espace des salles</span></span></span>
  <a class="ecrire" id="ecrire" href="mailto:contact@crescite.fr" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><span class="mot">Nous écrire</span><span class="sr"> à la compagnie</span></a>
</header>
<main id="contenu" tabindex="-1"><p class="chargement" role="status">Chargement…</p></main>
<footer><p>Compagnie Crescite · Espace des salles, sur invitation.</p></footer>
<p class="sr" role="status" aria-live="polite" id="annonce"></p>
<script src="pro.js" defer></script>
</body>
</html>
