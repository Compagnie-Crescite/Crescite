<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Crescite · administration</title>
<style>
:root {
  --fond: #f6f3f0; --carte: #ffffff; --encre: #1d1720; --gris: #675e6b; --trait: #e4dde3; --doux: #f1ecf0;
  --accent: #a8306f; --accent-fonce: #8a2259; --accent-doux: #f7e6ef; --ok: #1d6f47; --ok-doux: #e3f3ea;
  --alerte: #b3261e; --alerte-doux: #fbe7e5; --option: #7a5a10; --option-doux: #f8efd9; --ombre: 0 1px 2px rgba(30, 20, 30, .06), 0 4px 18px rgba(30, 20, 30, .06);
  --rayon: 12px; --police: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  /* les tentacules (tentacules.js) : à l'encre de l'administration, empreintes et confirmations à la couleur d'accent */
  --tt-encre: var(--encre); --tt-accent: var(--accent); --tt-neutre: var(--gris); --tt-fond: var(--carte); --tt-epaisseur: 2.2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #17131a; --carte: #211b24; --encre: #f1ebf2; --gris: #b3a8b7; --trait: #3a3140; --doux: #2a222e;
    --accent: #e27ab3; --accent-fonce: #f29ac9; --accent-doux: #3a2032; --ok: #6fd3a0; --ok-doux: #1d3329;
    --alerte: #ff8a80; --alerte-doux: #3a1f1d; --option: #e9c46a; --option-doux: #352b17; --ombre: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fond); color: var(--encre); font: 15px/1.5 var(--police); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* en-tête */
.barre { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: var(--carte); border-bottom: 1px solid var(--trait); }
.marque { display: flex; align-items: baseline; gap: 8px; font-weight: 800; letter-spacing: .02em; text-decoration: none; color: var(--encre); white-space: nowrap; }
.marque small { font-weight: 500; color: var(--gris); letter-spacing: 0; }
.marque .pieuvre { display: inline-block; flex: none; align-self: center; width: 32px; height: 26px; color: var(--accent); }
.marque .pieuvre:empty { display: none; }
.marque .pieuvre svg { display: block; width: 100%; height: 100%; overflow: visible; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav a { padding: 7px 12px; border-radius: 999px; text-decoration: none; color: var(--gris); font-weight: 600; white-space: nowrap; }
.nav a:hover { background: var(--doux); color: var(--encre); }
.nav a[aria-current="page"] { background: var(--accent); color: #fff; }
.qui { display: flex; align-items: center; gap: 10px; color: var(--gris); font-size: 13px; white-space: nowrap; }
.direct { display: inline-flex; align-items: center; gap: 6px; }
.direct::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #b9b0bb; }
.direct.on::before { background: #2bb673; box-shadow: 0 0 0 3px rgba(43, 182, 115, .18); }
/* dix rubriques : sous 1 940 px l'adresse du compte se retire ; sous 1 740 px les rubriques passent sur une seconde ligne ;
   entre 861 et 1 099 px, elles s'y rangent sur deux rangs ; au téléphone, elles défilent (la rubrique courante en vue) */
@media (max-width: 1939px) { .qui .moi { display: none; } }
@media (max-width: 1739px) { .barre { flex-wrap: wrap; row-gap: 6px; } .nav { order: 3; flex-basis: 100%; } .qui { margin-left: auto; } .qui .moi { display: inline; } }
@media (min-width: 861px) and (max-width: 1099px) { .nav { flex-wrap: wrap; row-gap: 2px; overflow: visible; } }
@media (max-width: 860px) { .qui .moi { display: none; } .barre { flex-wrap: wrap; gap: 8px 14px; padding: 8px 12px; } .nav { order: 3; flex-basis: 100%; padding-right: 28px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); } }
@media (max-width: 520px) { .qui { gap: 10px; font-size: 12.5px; } .qui .long, .direct .mot { display: none; } }

/* boutons et champs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--trait); background: var(--carte); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--encre); white-space: nowrap; }
.btn:hover { border-color: var(--gris); }
.btn.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.principal:hover { background: var(--accent-fonce); }
.btn.danger { color: var(--alerte); }
.btn.petit { padding: 4px 9px; font-size: 13px; border-radius: 7px; }
.btn.lien { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
.btn[disabled] { opacity: .5; cursor: default; }
.champ { display: grid; gap: 5px; margin: 0 0 14px; }
.champ > label, .champ > .lib { font-weight: 650; font-size: 13.5px; }
.champ .aide { color: var(--gris); font-size: 12.5px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=search], input[type=date], input[type=time], input[type=number], select, textarea, .riche {
  width: 100%; padding: 8px 10px; border: 1px solid var(--trait); border-radius: 8px; background: var(--carte); min-height: 38px; }
textarea { min-height: 76px; resize: vertical; }
.riche { min-height: 60px; line-height: 1.55; }
.riche:empty::before { content: attr(data-vide); color: var(--gris); }
input:focus, select:focus, textarea:focus, .riche:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-doux); }
.case { display: flex; align-items: center; gap: 9px; font-weight: 600; cursor: pointer; }
.case input { width: 18px; height: 18px; accent-color: var(--accent); }
.rangee { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.bloc { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 18px 20px; box-shadow: var(--ombre); }
.bloc + .bloc { margin-top: 16px; }
.bloc h3 { margin: 0 0 12px; font-size: 15px; }
.outils-riche { display: flex; gap: 4px; margin-bottom: 4px; }
.outils-riche button { border: 1px solid var(--trait); background: var(--carte); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 13px; }
.item { border: 1px solid var(--trait); border-radius: 10px; padding: 10px 12px 2px; margin-bottom: 8px; background: var(--doux); }
.item-tete { display: flex; justify-content: flex-end; gap: 4px; margin: -4px -6px 4px 0; }
.couleur { display: flex; gap: 8px; align-items: center; }
.couleur input[type=color] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--trait); border-radius: 8px; background: var(--carte); }
.pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }

/* mise en page */
main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.tete { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 4px 0 16px; }
.tete h1 { margin: 0 auto 0 0; font-size: 22px; }
.deux { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 18px; align-items: start; }
.deux > .liste { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
@media (max-width: 1100px) { .deux { grid-template-columns: 1fr; } .deux > .liste { position: static; max-height: none; } .deux.edition > .liste { display: none; } }
@media (max-width: 1100px) { .deux:not(.edition) > .editeur { display: none; } }
@media (min-width: 1101px) and (max-width: 1739px) { .deux > .liste { top: 104px; max-height: calc(100vh - 124px); } }
.filtres { display: grid; gap: 8px; padding: 12px; background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--trait); border-radius: 9px; overflow: hidden; background: var(--carte); }
.seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-weight: 600; color: var(--gris); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gris); }
.puce[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--encre); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--carte)); }
.mois { margin: 14px 4px 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.ligne { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; background: var(--carte); border: 1px solid var(--trait); text-decoration: none; color: var(--encre); border-left: 4px solid var(--c, var(--accent)); }
.ligne:hover { border-color: var(--gris); border-left-color: var(--c, var(--accent)); }
.ligne[aria-current="true"] { box-shadow: 0 0 0 3px var(--accent-doux); border-color: var(--accent); }
.ligne .jj { font-weight: 800; font-size: 13px; line-height: 1.2; text-align: center; color: var(--gris); }
.ligne .jj b { display: block; font-size: 20px; color: var(--encre); }
.ligne .corps { min-width: 0; }
.ligne .t { font-weight: 700; display: block; }
.ligne .ou { color: var(--gris); font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne .reps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.rep { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--doux); color: var(--gris); font-weight: 600; }
.rep.sco { background: #e6f0fb; color: #1e4f8a; }
.rep.ann { text-decoration: line-through; }
.badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.badge { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--doux); color: var(--gris); white-space: nowrap; }
.badge.option { background: var(--option-doux); color: var(--option); }
.badge.annulee, .badge.masquee { background: var(--alerte-doux); color: var(--alerte); }
.badge.sco { background: #e6f0fb; color: #1e4f8a; }
.badge.ok { background: var(--ok-doux); color: var(--ok); }
.vide { padding: 30px 16px; text-align: center; color: var(--gris); }
.compte { color: var(--gris); font-size: 13px; }

/* éditeur */
.editeur .titre-ed { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 14px; }
.editeur h2 { margin: 0; font-size: 20px; line-height: 1.25; flex: 1; }
.pied-ed { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--carte) 92%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--trait); border-radius: var(--rayon); }
.pied-ed .etat-ed { margin-right: auto; color: var(--gris); font-size: 13px; }
.pied-ed .etat-ed.sale { color: var(--option); font-weight: 700; }
.apercu { padding: 12px 14px; border-radius: 10px; background: var(--doux); border: 1px dashed var(--trait); }
.apercu .l { font-weight: 700; }
.apercu .d { color: var(--gris); font-size: 14px; }
table.reps { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
table.reps th { text-align: left; font-size: 12px; color: var(--gris); font-weight: 700; padding: 0 6px; }
table.reps td { padding: 0 3px; vertical-align: middle; }
table.reps td:first-child { padding-left: 0; }
@media (max-width: 700px) {
  table.reps thead { display: none; }
  table.reps tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border: 1px solid var(--trait); border-radius: 10px; margin-bottom: 8px; }
  table.reps td { padding: 0; }
  /* un tableau ne descend pas sous la largeur de ses champs de date : en blocs, les colonnes rétrécissent */
  table.reps, table.reps tbody { display: block; }
  table.reps tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  table.reps input, table.reps select { min-width: 0; }
}
.combo { position: relative; }
.suggestions { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: var(--ombre); max-height: 300px; overflow: auto; }
.suggestions button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; }
.suggestions button:hover, .suggestions button.actif { background: var(--accent-doux); }
.suggestions small { color: var(--gris); }
.onglets-ed { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.onglets-ed button { border: 1px solid var(--trait); background: var(--carte); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; color: var(--gris); }
.onglets-ed button[aria-selected="true"] { background: var(--encre); color: var(--carte); border-color: var(--encre); }
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.carte-sp { display: grid; grid-template-rows: 120px auto; border-radius: var(--rayon); overflow: hidden; background: var(--carte); border: 1px solid var(--trait); text-decoration: none; color: var(--encre); box-shadow: var(--ombre); }
.carte-sp .img { background: var(--fondU, #333) center/cover; position: relative; }
.carte-sp .img::after { content: ""; position: absolute; inset: auto 0 0 0; height: 5px; background: var(--c, var(--accent)); }
.carte-sp .txt { padding: 10px 12px; display: grid; gap: 6px; }
.carte-sp .txt b { font-size: 16px; }
.miniatures { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mini { border: 1px solid var(--trait); border-radius: 10px; overflow: hidden; background: var(--doux); }
.mini img { width: 100%; height: 110px; object-fit: cover; display: block; background: #ccc; }
.contraste { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.contraste.bon { background: var(--ok-doux); color: var(--ok); }
.contraste.faible { background: var(--alerte-doux); color: var(--alerte); }
/* sous un champ : appeler, écrire, d'où vient la valeur ; le lieu d'une date ; ses dates */
.sous-champ { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 12.5px; }
.sous-champ[hidden] { display: none; }
.sous-champ a.coord, .lieu-resume a { font-weight: 650; }
.appris { color: var(--ok); }
.appris a { color: inherit; }
.lieu-resume { display: grid; gap: 3px; margin-top: 8px; padding: 8px 11px; border-radius: 9px; background: var(--doux); font-size: 13.5px; overflow-wrap: anywhere; }
.lieu-resume .manque { color: var(--gris); font-style: italic; }
.journal-ligne { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--trait); align-items: start; }
.journal-ligne .quand { color: var(--gris); font-size: 13px; }
.journal-ligne .quoi b { display: block; }
.journal-ligne .diff { color: var(--gris); font-size: 13px; }
@media (max-width: 700px) { .journal-ligne { grid-template-columns: 1fr; } }
table.simple { width: 100%; border-collapse: collapse; background: var(--carte); border-radius: var(--rayon); overflow: hidden; }
table.simple th, table.simple td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--trait); vertical-align: top; }
table.simple th { font-size: 12.5px; color: var(--gris); }
table.simple tr.cliquable { cursor: pointer; }
table.simple tr.cliquable:hover td { background: var(--doux); }

/* connexion */
.connexion { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.connexion form { width: min(400px, 100%); }
.connexion h1 { font-size: 22px; margin: 0 0 4px; }
.connexion p { color: var(--gris); margin: 0 0 18px; }
.chargement { padding: 60px 20px; text-align: center; color: var(--gris); }

/* annonces */
#annonces { position: fixed; z-index: 50; left: 50%; bottom: 18px; transform: translateX(-50%); display: grid; gap: 8px; width: min(460px, calc(100% - 24px)); }
.annonce { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 11px; background: #1d1720; color: #fff; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.annonce.erreur { background: #8c1d16; }
.annonce button { margin-left: auto; border: 1px solid rgba(255, 255, 255, .4); background: none; color: #fff; border-radius: 7px; padding: 3px 10px; cursor: pointer; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .annonce { animation: monte .2s ease-out; } @keyframes monte { from { transform: translateY(8px); opacity: 0; } } }

/* une commande segmentée dans un champ (le statut d'une date) passe à la ligne plutôt que de sortir de sa colonne */
.champ .seg { display: flex; flex-wrap: wrap; width: fit-content; max-width: 100%; }
.champ .seg button { flex: 1 1 auto; }
/* au téléphone (360 px) : des marges plus serrées, des boutons segmentés qui tiennent sur la largeur */
@media (max-width: 520px) { main { padding: 14px 12px; } .bloc { padding: 14px; } .seg { max-width: 100%; } .seg button { padding: 6px 7px; font-size: 14px; } .rangee > .champ:has(.seg) { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div id="app"><p class="chargement">Chargement…</p></div>
<div id="annonces" aria-live="polite"></div>
<script src="vendor/supabase.js"></script>
<script src="agenda.js"></script>
<script src="tentacules.js"></script>
<script>
'use strict';
/* L'administration du site de la compagnie Crescite : les spectacles, les dates et leurs représentations, les ateliers,
   les lieux et les textes. Chaque enregistrement va dans la base (Supabase, tables crescite_) et change aussitôt le site
   en ligne, qui écoute la base en temps réel. Seuls les comptes de crescite_admins peuvent enregistrer.
   Une date montre son lieu tel que sa fiche le connaît (adresse, itinéraire, contact, jauge) et mène à elle ; un lieu,
   ses dates. Sous les champs des fiches, les numéros et les adresses électroniques s'ouvrent d'un geste (sousChamp :
   « Appeler le … », « Écrire à … »), et une valeur apprise d'une feuille de route dit d'où elle vient (equipe.js). */
const BASE = 'https://omekkqjinvppadsoinvj.supabase.co';
const CLE = 'sb_publishable_TODW6NdmDly8eR9UxjG-6g_eyAa4gjB';
const SITE = '../synthese.html';
const sb = supabase.createClient(BASE, CLE, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'crescite-admin', detectSessionInUrl: true } });
// les tentacules (tentacules.js) : courtes et près du bouton, jamais devant un champ ; absentes, rien ne change
const TT = typeof TENTACULES !== 'undefined' ? TENTACULES : null;
if (TT) TT.regler({ profil: 'admin', style: 'encre', remontee: false, soulever: false });
const tt = (f, ...a) => { if (TT && typeof TT[f] === 'function') { try { return TT[f](...a); } catch (e) { /* le décor ne doit rien casser */ } } };
// un enregistrement réussi : la tentacule s'enroule autour du bouton (après l'enregistrement, jamais avant)
const bravo = () => requestAnimationFrame(() => { const b = $('[data-enregistrer]'); if (b) tt('confirmer', b); });

// ===================================================================================================== état
const E = { session: null, admin: false, pret: false, direct: false, sale: false, hash: location.hash,
  spectacles: [], lieux: [], dates: [], reps: [], suivis: [], lieuxSuivi: [], ateliers: [], seances: [], textes: [], admins: [], journal: [] };
const TABLES = {
  crescite_spectacles: ['spectacles', 'id'], crescite_lieux: ['lieux', 'id'], crescite_dates: ['dates', 'id'],
  crescite_representations: ['reps', 'id'], crescite_dates_suivi: ['suivis', 'date_id'], crescite_lieux_suivi: ['lieuxSuivi', 'lieu_id'],
  crescite_ateliers: ['ateliers', 'id'], crescite_seances: ['seances', 'id'], crescite_textes: ['textes', 'cle'],
};
const NOMS_TABLES = { crescite_spectacles: 'Spectacle', crescite_lieux: 'Lieu', crescite_dates: 'Date', crescite_representations: 'Représentation',
  crescite_dates_suivi: 'Suivi d’une date', crescite_lieux_suivi: 'Suivi d’un lieu', crescite_ateliers: 'Atelier', crescite_seances: 'Séance d’atelier', crescite_textes: 'Texte du site',
  crescite_personnes: 'Fiche d’une personne', crescite_personnes_privees: 'Coordonnées d’une personne', crescite_personnes_suivi: 'Notes sur une personne',
  crescite_distributions: 'Distribution', crescite_equipes: 'Équipe d’une date', crescite_documents: 'Document de l’équipe', crescite_feuilles: 'Feuille de route' };

// ===================================================================================================== outils
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// électronique « Écrire à … » (mailto:), reconnus comme dans les feuilles de route (FEUILLE.jetons, feuille.js)

const liensCoordonnees = texte => jetonsContact(texte).filter(j => j.href).map(j => `<a class="coord" href="${esc(j.href)}">${j.genre === 'tel' ? `Appeler le ${esc(FEUILLE.telTexte(j.t))}` : `Écrire à ${esc(j.t)}`}</a>`).join('');

// sous le champ d'une fiche : ces liens, et ce que mention(valeur) y ajoute (d'où vient la valeur), tenus à jour à la saisie
function sousChamp(input, mention = () => '') {
  if (!input) return;
  const el = document.createElement('span');
  el.className = 'sous-champ';
  input.after(el);
  const maj = () => { el.innerHTML = liensCoordonnees(input.value) + mention(input.value); el.hidden = !el.innerHTML; };
  input.addEventListener('input', maj);
  maj();
}

// un HTML propre : gras, italique, liens, retours à la ligne, intertitres et listes ; rien d'autre
function propre(html) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const sortie = n => {
    if (n.nodeType === 3) return esc(n.textContent).replace(/&#39;/g, '’');
    if (n.nodeType !== 1) return '';
    const tag = n.tagName.toLowerCase(), d = [...n.childNodes].map(sortie).join('');
    if (tag === 'b' || tag === 'strong') return d.trim() ? `<strong>${d}</strong>` : d;
    if (tag === 'i' || tag === 'em') return d.trim() ? `<em>${d}</em>` : d;
    if (tag === 'br') return '<br/>';
    if (['h2', 'h3', 'ul', 'ol', 'li'].includes(tag)) return `<${tag}>${d}</${tag}>`;
    if (tag === 'a') { const h = n.getAttribute('href') || ''; return /^(https?:|mailto:|#\/)/.test(h) ? `<a href="${esc(h)}">${d}</a>` : d; }
    if (tag === 'div' || tag === 'p') return d + '<br/>';
    return d;
  };
  return [...t.content.childNodes].map(sortie).join('').replace(/(<br\/>\s*)+$/, '').replace(/&nbsp;/g, ' ').trim();
}

// des photos plus légères avant l'envoi : 2 000 px au plus, en WebP
async function optimiser(fichier) {
  try {
    const img = await createImageBitmap(fichier);
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.84));
    return blob && blob.size < fichier.size ? blob : fichier;
  } catch { return fichier; }
}
async function envoyerPhoto(fichier, dossier) {
  const blob = await optimiser(fichier);
  const ext = blob.type === 'image/webp' ? 'webp' : (fichier.name.split('.').pop() || 'jpg').toLowerCase();
  const chemin = `${dossier}/${Date.now().toString(36)}-${slugifier(fichier.name.replace(/\.[^.]+$/, '')) || 'photo'}.${ext}`;
  const { error } = await sb.storage.from('crescite').upload(chemin, blob, { contentType: blob.type || fichier.type, upsert: false, cacheControl: '31536000' });
  if (error) throw error;
  return chemin;
}

  $('#app').innerHTML = `<div class="connexion"><form class="bloc" id="f-mdp"><h1>Nouveau mot de passe</h1>

let demarre = false;
async function demarrer() {
  // feuille.js et equipe.js se chargent après ce script : on les attend
  if (document.readyState === 'loading') return void document.addEventListener('DOMContentLoaded', demarrer, { once: true });
  if (!E.session) { demarre = false; return ecranConnexion(); }
  if (demarre) return;
  demarre = true;
  $('#app').innerHTML = '<p class="chargement">Chargement de la base…</p>';
  const { data, error } = await sb.from('crescite_admins').select('user_id').eq('user_id', E.session.user.id);
  if (error) { demarre = false; return ecranConnexion(/crescite_admins/.test(error.message) ? 'La base de la compagnie n’est pas encore installée.' : error.message); }
  if (!data.length) {
    demarre = false;
    $('#app').innerHTML = `<div class="connexion"><div class="bloc"><h1>Accès réservé</h1><p>Le compte ${esc(E.session.user.email)} n’administre pas le site de la compagnie.</p><button class="btn" id="b-sortir">Se déconnecter</button></div></div>`;
    $('#b-sortir').addEventListener('click', () => sb.auth.signOut());
    return;
  }
  try { await chargerTout(); } catch (e) { demarre = false; return ecranConnexion('Chargement impossible : ' + e.message); }
  E.pret = true;
  ecouter();
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/representations');
  E.hash = location.hash;
  router();
  if (versAdmin) { versAdmin = false; requestAnimationFrame(() => tt('page', getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#a8306f')); }
}

async function tout(table, ordre) {
  const out = [];
  for (let a = 0; ; a += 1000) {
    let q = sb.from(table).select('*').range(a, a + 999);
    if (ordre) q = q.order(ordre, { ascending: true });
    const { data, error } = await q;
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function chargerTout() {
  const equipe = chargerEquipe();   // l'équipe (equipe.js) : ne lève jamais d'erreur, même quand la base ne l'a pas encore
  const [sp, li, da, re, su, ls, at, se, tx, ad] = await Promise.all([
    tout('crescite_spectacles', 'ordre'), tout('crescite_lieux', 'id'), tout('crescite_dates', 'debut'), tout('crescite_representations', 'jour'),
    tout('crescite_dates_suivi'), tout('crescite_lieux_suivi'), tout('crescite_ateliers', 'ordre'), tout('crescite_seances', 'jour'),
    tout('crescite_textes'), tout('crescite_admins')]);
  Object.assign(E, { spectacles: sp, lieux: li, dates: da, reps: re, suivis: su, lieuxSuivi: ls, ateliers: at, seances: se, textes: tx, admins: ad });
  await equipe;
}

// le temps réel : chaque enregistrement, d'ici ou d'ailleurs, met l'écran à jour
let rendrePlusTard = null;
function ecouter() {
  const ch = sb.channel('crescite-admin');
  Object.keys(TABLES).forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, p => changement(t, p)));
  ch.subscribe(st => { E.direct = st === 'SUBSCRIBED'; const d = $('.direct'); if (d) { d.classList.toggle('on', E.direct); d.title = E.direct ? 'Connecté en temps réel' : 'Temps réel interrompu'; } });
  ecouterEquipe();
}
function changement(t, p) {
  const [k, pk] = TABLES[t] || TABLES_EQUIPE[t];
  // la clé : une colonne, ou plusieurs (l'équipe d'une date : date_id et personne_id)
  const coll = E[k], ligne = p.eventType === 'DELETE' ? p.old : p.new, cles = [].concat(pk);
  const i = coll.findIndex(x => cles.every(c => x[c] === ligne[c]));
  if (p.eventType === 'DELETE') { if (i >= 0) coll.splice(i, 1); } else if (i >= 0) coll[i] = p.new; else coll.push(p.new);
  clearTimeout(rendrePlusTard);
  rendrePlusTard = setTimeout(() => { if (!E.sale) rafraichirListes(); }, 200);
}

// un champ décrit par {k: chemin, t: type, l: libellé, aide, choix, champs (pour les listes d'objets)}
const lire = (o, p) => p.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o);
function ecrire(o, p, v) {
  const ks = p.split('.');
  let x = o;
  ks.slice(0, -1).forEach((k, i) => { if (x[k] == null || typeof x[k] !== 'object') x[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; x = x[k]; });
  x[ks[ks.length - 1]] = v;
}
let nChamp = 0;
function champ(c, F, base = '') {
  const p = base ? `${base}.${c.k}` : c.k, v = lire(F, p), id = `ch${++nChamp}`;
  const lib = c.l ? `<label for="${id}">${esc(c.l)}</label>` : '';
  const aide = c.aide ? `<span class="aide">${esc(c.aide)}</span>` : '';
  const attr = `id="${id}" data-chemin="${esc(p)}" data-type="${c.t}"`;
  switch (c.t) {
    case 'texte': case 'url': case 'nombre':
      return `<div class="champ">${lib}<input ${attr} type="${c.t === 'nombre' ? 'number' : c.t === 'url' ? 'url' : 'text'}" value="${esc(v ?? '')}"${c.ph ? ` placeholder="${esc(c.ph)}"` : ''}>${aide}</div>`;
    case 'long':
      return `<div class="champ">${lib}<textarea ${attr} rows="${c.lignes || 3}">${esc(v ?? '')}</textarea>${aide}</div>`;
    case 'lignes':
      return `<div class="champ">${lib}<textarea ${attr} rows="${Math.max(2, (v || []).length + 1)}">${esc((v || []).join('\n'))}</textarea>${aide}</div>`;
    case 'case':
      return `<div class="champ"><label class="case"><input ${attr} type="checkbox"${v ? ' checked' : ''}> ${esc(c.l)}</label>${aide}</div>`;
    case 'choix':
      return `<div class="champ">${lib}<select ${attr}>${c.choix.map(([val, txt]) => `<option value="${esc(val)}"${String(v ?? '') === String(val) ? ' selected' : ''}>${esc(txt)}</option>`).join('')}</select>${aide}</div>`;
    case 'couleur':
      return `<div class="champ">${lib}<div class="couleur"><input type="color" data-jumeau="${id}" value="${/^#[0-9a-f]{6}$/i.test(v || '') ? v : '#000000'}"><input ${attr} type="text" value="${esc(v ?? '')}" spellcheck="false"></div>${aide}</div>`;
    case 'html':
      return `<div class="champ"><span class="lib">${esc(c.l || '')}</span>${barreRiche()}<div class="riche" contenteditable="true" ${attr} data-vide="${esc(c.ph || '')}">${v || ''}</div>${aide}</div>`;
    case 'paragraphes': {
      const xs = v || [];
      return `<div class="champ" data-bloc="${esc(p)}"><span class="lib">${esc(c.l || '')}</span>${aide}
        ${xs.map((x, i) => `<div class="item"><div class="item-tete">${outilsItem(p, i, xs.length)}</div>${barreRiche()}<div class="riche" contenteditable="true" data-chemin="${esc(p)}.${i}" data-type="html">${x || ''}</div><div style="height:8px"></div></div>`).join('')}
        <div><button type="button" class="btn petit" data-action="ajouter" data-cible="${esc(p)}" data-modele='""'>＋ ${esc(c.ajout || 'Paragraphe')}</button></div></div>`;
    }
    case 'objets': {
      const xs = v || [];
      const modele = JSON.stringify(Object.fromEntries(c.champs.map(s => [s.k, s.t === 'lignes' ? [] : s.t === 'case' ? false : ''])));
      return `<div class="champ" data-bloc="${esc(p)}"><span class="lib">${esc(c.l || '')}</span>${aide}
        ${xs.map((x, i) => `<div class="item"><div class="item-tete">${outilsItem(p, i, xs.length)}</div>${c.champs.map(s => champ(s, F, `${p}.${i}`)).join('')}</div>`).join('')}

// relie un formulaire à son objet F : chaque saisie écrit dans F ; ajouter, retirer, déplacer redessinent la liste
function relier(racine, F, specs, onChange = () => {}) {
  const trouver = chemin => {
    const parcours = (cs, base) => { for (const c of cs) { const p = base ? `${base}.${c.k}` : c.k; if (p === chemin) return c; if (c.t === 'objets' && chemin.startsWith(p + '.')) { const rest = chemin.slice(p.length + 1).split('.'); const sub = parcours(c.champs, `${p}.${rest[0]}`); if (sub) return sub; } } return null; };
    return parcours(specs, '');
  };
  const maj = el => { if (!el.dataset.chemin) return; ecrire(F, el.dataset.chemin, valeur(el)); marquerSale(); onChange(el.dataset.chemin); };
  racine.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.jumeau) { const j = $('#' + el.dataset.jumeau, racine); j.value = el.value; maj(j); return; }
    if (el.dataset.type === 'couleur') { const pick = $(`[data-jumeau="${el.id}"]`, racine); if (pick && /^#[0-9a-f]{6}$/i.test(el.value)) pick.value = el.value; }
    if (el.dataset.type !== 'html') maj(el);
  });
  racine.addEventListener('change', e => { if (e.target.dataset.type === 'case' || e.target.tagName === 'SELECT') maj(e.target); });
  racine.addEventListener('focusout', e => { if (e.target.dataset?.type === 'html') maj(e.target); });
  racine.addEventListener('keyup', e => { if (e.target.dataset?.type === 'html') { ecrire(F, e.target.dataset.chemin, valeur(e.target)); marquerSale(); } });
  racine.addEventListener('mousedown', e => { if (e.target.closest('[data-cmd]')) e.preventDefault(); });
  racine.addEventListener('click', e => {
    const cmd = e.target.closest('[data-cmd]');
    if (cmd) {
      const ed = cmd.closest('.champ, .item').querySelector('.riche');
      ed?.focus();
      if (cmd.dataset.cmd === 'createLink') { const u = prompt('Adresse du lien (https://…)'); if (u) document.execCommand('createLink', false, u); }
      else document.execCommand(cmd.dataset.cmd);
      if (ed) { ecrire(F, ed.dataset.chemin, valeur(ed)); marquerSale(); }
      return;
    }
    const b = e.target.closest('[data-action]');
    if (!b || !b.dataset.cible) return;
    $$('.riche', racine).forEach(ed => ecrire(F, ed.dataset.chemin, valeur(ed)));
    const p = b.dataset.cible, xs = clone(lire(F, p) || []), i = +b.dataset.i;
    if (b.dataset.action === 'ajouter') xs.push(JSON.parse(b.dataset.modele));
    if (b.dataset.action === 'retirer') xs.splice(i, 1);
    if (b.dataset.action === 'monter') [xs[i - 1], xs[i]] = [xs[i], xs[i - 1]];
    if (b.dataset.action === 'descendre') [xs[i + 1], xs[i]] = [xs[i], xs[i + 1]];
    ecrire(F, p, xs);
    const c = trouver(p), bloc = b.closest(`[data-bloc="${CSS.escape(p)}"]`);
    if (c && bloc) {
      const base = p.includes('.') ? p.slice(0, p.lastIndexOf('.')) : '';
      bloc.outerHTML = champ({ ...c, k: p.slice(base ? base.length + 1 : 0) }, F, base);
      if (b.dataset.action === 'ajouter') { const n = $(`[data-bloc="${CSS.escape(p)}"] .item:last-of-type [data-chemin]`, racine); n?.focus(); }

}

async function enregistrerDate(F, d0, bouton) {
  const reps = F.representations.filter(r => r.jour);
  if (!F.spectacle_id) return annoncer('Choisissez le spectacle.', { erreur: true });
  if (F.representations.some(r => !r.jour)) return annoncer('Chaque représentation a besoin de son jour (ou retirez la ligne vide).', { erreur: true });
  const js = reps.map(r => r.jour).sort();
  const debut = js[0] || F.debut;
  if (!debut) return annoncer('Indiquez au moins un jour.', { erreur: true });
  const ps = new Set(reps.map(r => r.public));
  const charge = {
    id: F.id, spectacle_id: +F.spectacle_id, lieu_id: F.lieu_id, debut, fin: js[js.length - 1] || F.fin || debut, precision: reps.length ? 'jour' : F.precision,
    saison: d0 && d0.debut === debut ? d0.saison : null, public: ps.size > 1 ? 'mixte' : ps.size ? [...ps][0] : (F.public || 'tout_public'),
    statut: F.statut, visible: F.visible, intitule: $('#d-libre').checked ? (F.intitule || '').trim() || null : null,
    details: F.details.filter(x => texteSeul(x.texte).trim()).map(x => ({ texte: x.texte, lien: x.lien || null })), lien: (F.lien || '').trim() || null,
    nb_representations: reps.length ? null : F.nb_representations,
    representations: reps.map(r => ({ id: r.id, jour: r.jour, heure: r.heure || null, public: r.public, annulee: !!r.annulee, lien: (r.lien || '').trim() || null, note: (r.note || '').trim() || null,
      ...(E.sql3 ? { fin: r.fin || null } : {}) })),
    suivi: F.suivi,
    // la nature et l'heure de fin : seulement quand la base les a (troisième script SQL)
    ...(E.sql3 ? { nature: F.nature || 'representations' } : {}),
  };
  if (E.sql3 && charge.nature !== 'representations') charge.visible = false;
  bouton.disabled = true;
  const { data: id, error } = await sb.rpc('crescite_enregistrer_date', { d: charge });
  bouton.disabled = false;
  if (error) return erreur(error);
  // l'équipe de la date (ce qui change de la distribution en tournée), après la date elle-même
  const equipeOk = await enregistrerEquipeDate(id, F);
  await rechargerDate(id);
  if (!equipeOk) { F.id = id; history.replaceState(null, '', `#/representations/${id}`); E.hash = location.hash; return; }
  E.sale = false;
  annoncer(F.statut === 'option' || !F.visible ? 'Enregistré (non publié sur le site).' : 'Enregistré : le site est à jour.');
  if (!F.id) { history.replaceState(null, '', `#/representations/${id}`); E.hash = location.hash; }
  ouvertureMuette = true;
  vueDates(id);
  bravo();
}
async function rechargerDate(id) {
  const [a, b, c] = await Promise.all([sb.from('crescite_dates').select('*').eq('id', id), sb.from('crescite_representations').select('*').eq('date_id', id), sb.from('crescite_dates_suivi').select('*').eq('date_id', id)]);
  const remplacer = (k, pk, rows, filtre) => { E[k] = E[k].filter(x => !filtre(x)).concat(rows || []); };
  remplacer('dates', 'id', a.data, x => x.id === id);
  remplacer('reps', 'id', b.data, x => x.date_id === id);
  remplacer('suivis', 'date_id', c.data, x => x.date_id === id);
}
async function supprimerDate(d) {
  const s = spectacle(d.spectacle_id);
  if (!confirm(`Supprimer la date « ${s?.titre} · ${jourCourt(d.debut)} », ses représentations${avecFeuille(d.id) ? ' et sa feuille de route' : ''} ?`)) return;
  const copie = { date: clone(d), reps: clone(E.reps.filter(r => r.date_id === d.id)), suivi: clone(E.suivis.find(x => x.date_id === d.id)), equipe: copieEquipeDate(d.id) };
  const { error } = await sb.from('crescite_dates').delete().eq('id', d.id);
  if (error) return erreur(error, 'Suppression impossible');
  E.dates = E.dates.filter(x => x.id !== d.id); E.reps = E.reps.filter(x => x.date_id !== d.id); E.suivis = E.suivis.filter(x => x.date_id !== d.id);
  E.equipes = E.equipes.filter(x => x.date_id !== d.id); E.feuilles = E.feuilles.filter(x => x.date_id !== d.id);
  E.sale = false;
  location.hash = '#/representations';
  annoncer('Date supprimée.', { action: async () => {
    const sans = o => { const x = { ...o }; delete x.modifie_le; delete x.modifie_par; return x; };
    let r = await sb.from('crescite_dates').insert(sans(copie.date));
    if (!r.error && copie.reps.length) r = await sb.from('crescite_representations').insert(copie.reps.map(sans));
    if (!r.error && copie.suivi) r = await sb.from('crescite_dates_suivi').insert(sans(copie.suivi));
    if (!r.error) { const e2 = await retablirEquipeDate(copie.equipe); if (e2) r = { error: e2 }; }
    if (r.error) return erreur(r.error, 'Rétablissement impossible');
    await rechargerDate(copie.date.id);
    annoncer('Date rétablie.');
    location.hash = `#/representations/${copie.date.id}`;
  }, libelle: 'Annuler', delai: 9000 });
}

function editeurSpectacle(slug) {
  const s0 = E.spectacles.find(s => s.slug === slug);

  const onglets = [...Object.keys(SPEC_SPECTACLE), 'Photos', ...ONGLETS_EQUIPE];
  let onglet = sessionStorage.getItem('crescite-onglet-sp') || 'Général';
  if (!onglets.includes(onglet)) onglet = 'Général';

  cadre('spectacles', `<div class="tete"><a class="btn petit" data-tt="retour" href="#/spectacles">←</a><h1>${esc(F.titre)}</h1>
      <a class="btn" href="${SITE}#/spectacle/${esc(F.slug)}" target="_blank" rel="noopener">Voir sa page ↗</a></div>

    const lum = hex => { if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return null; const f = v => (v /= 255) <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(parseInt(hex.slice(1, 3), 16)) + 0.7152 * f(parseInt(hex.slice(3, 5), 16)) + 0.0722 * f(parseInt(hex.slice(5, 7), 16)); };
    const r = (a, b) => { const x = lum(a), y = lum(b); if (x === null || y === null) return null; const [h, l] = [x, y].sort((p, q) => q - p); return (h + 0.05) / (l + 0.05); };
    const ligne = (n, a, b) => { const v = r(a, b); return v === null ? '' : `<span class="contraste ${v >= 4.5 ? 'bon' : 'faible'}">${n} ${v.toFixed(1)}:1</span>`; };
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px">${ligne('texte sur fond', c.texte, c.fond)}${ligne('texte secondaire', c.texte2, c.fond)}${ligne('accent pour du texte', c.accent2, c.fond)}</div>

  };
  const dessiner = () => {
    nChamp = 0;
    if (onglet === 'Photos') { zone.innerHTML = ongletPhotos(F) + pied(); }
    else if (ONGLETS_EQUIPE.includes(onglet)) ongletEquipe(onglet, zone, F, s0);   // equipe.js : distribution, déroulé type, documents
    else {
      const specs = SPEC_SPECTACLE[onglet].concat(onglet === 'Action culturelle' ? [{ k: 'dossier', t: 'choix', l: 'Dossier scolaire', choix: [['', 'Aucun'], ...dossiers] }] : []);
      zone.innerHTML = `<div class="bloc">${onglet === 'Univers' ? '<div id="sp-contrastes"></div>' : ''}${specs.map(c => champ(c, F)).join('')}</div>${pied()}`;
      if (onglet === 'Univers') $('#sp-contrastes').innerHTML = contrastes();
    }
  };
  dessiner();
  const toutesSpecs = Object.values(SPEC_SPECTACLE).flat().concat([{ k: 'dossier', t: 'choix', choix: [] }]);
  relier(zone, F, toutesSpecs, p => { if (onglet === 'Univers' && $('#sp-contrastes')) $('#sp-contrastes').innerHTML = contrastes(); });
  $$('[data-onglet]').forEach(b => b.addEventListener('click', () => {

  }));

  $('#li-geo').addEventListener('click', async () => {
    const v = (F.commune || '').trim(); if (!v) return annoncer('Écrivez d’abord le nom de la commune.');
    try {
      const r = await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(v)}&fields=nom,code,codeDepartement,centre&boost=population&limit=1`);
      const [c] = r.ok ? await r.json() : [];
      if (!c) return annoncer('Commune introuvable : remplissez département et position à la main.', { erreur: true });
      Object.assign(F, { commune: c.nom, departement: c.codeDepartement, code_insee: c.code, latitude: c.centre.coordinates[1], longitude: c.centre.coordinates[0] });
      ['commune', 'departement', 'latitude', 'longitude'].forEach(k => { const el = $(`[data-chemin="${k}"]`, zone); if (el) el.value = F[k]; });
      marquerSale(); annoncer(`${c.nom} (${c.codeDepartement}) : position trouvée.`);
    } catch { annoncer('Recherche impossible pour le moment.', { erreur: true }); }
  });
  if (l0) comboLieu(zone, 'li-fusion', null, async cible => {
    if (cible === id) return;
    const c = lieu(cible);
    if (!confirm(`Fusionner « ${lieuTexte(l0)} » dans « ${lieuTexte(c)} » ?`)) return;
    const r1 = await sb.from('crescite_dates').update({ lieu_id: cible }).eq('lieu_id', id);
    const r2 = r1.error ? r1 : await sb.from('crescite_seances').update({ lieu_id: cible }).eq('lieu_id', id);
    const r3 = r2.error ? r2 : await sb.from('crescite_lieux').delete().eq('id', id);
    if (r3.error) return erreur(r3.error, 'Fusion incomplète');
    E.dates.forEach(d => { if (d.lieu_id === id) d.lieu_id = cible; }); E.seances.forEach(s => { if (s.lieu_id === id) s.lieu_id = cible; }); E.lieux = E.lieux.filter(x => x.id !== id);
    E.sale = false; location.hash = `#/lieux/${cible}`; annoncer('Lieux fusionnés.');
  });
  $('#li-suppr')?.addEventListener('click', async () => { if (!confirm('Supprimer ce lieu ?')) return; const { error } = await sb.from('crescite_lieux').delete().eq('id', id); if (error) return erreur(error); E.lieux = E.lieux.filter(x => x.id !== id); E.sale = false; location.hash = '#/lieux'; annoncer('Lieu supprimé.'); });
  $('[data-enregistrer]', zone).addEventListener('click', async e => {
    if (!(F.commune || '').trim() || !(F.departement || '').trim()) return annoncer('La commune et le département sont nécessaires.', { erreur: true });
    const ligneLi = { nom: (F.nom || '').trim() || null, type: F.type, commune: F.commune.trim(), departement: String(F.departement).trim(), pays: F.pays || 'FR', code_insee: F.code_insee || null,
      adresse: F.adresse || null, site_web: F.site_web || null, latitude: F.latitude, longitude: F.longitude };
    e.target.disabled = true;
    const r = l0 ? await sb.from('crescite_lieux').update(ligneLi).eq('id', id).select().single() : await sb.from('crescite_lieux').insert(ligneLi).select().single();
    if (r.error) { e.target.disabled = false; return erreur(r.error); }
    const r2 = await sb.from('crescite_lieux_suivi').upsert({ lieu_id: r.data.id, contact: G.contact || null, jauge: G.jauge, plateau: G.plateau || null, notes: G.notes || null }).select().single();
    e.target.disabled = false;
    if (r2.error) return erreur(r2.error, 'Suivi non enregistré');
    const i = E.lieux.findIndex(x => x.id === r.data.id); if (i >= 0) E.lieux[i] = r.data; else E.lieux.push(r.data);
    E.lieuxSuivi = E.lieuxSuivi.filter(x => x.lieu_id !== r.data.id).concat([r2.data]);
    E.sale = false; annoncer('Lieu enregistré.');
    if (!l0) location.hash = `#/lieux/${r.data.id}`; else vueLieux(id);
    bravo();
  });
}

const TEXTES = {
  compagnie: ['Présentation de la compagnie', [{ k: 'titre', t: 'texte', l: 'Titre' }, { k: 'paragraphes', t: 'paragraphes', l: 'Paragraphes' }, { k: 'datesTitre', t: 'texte', l: 'Titre de la frise' },
    { k: 'dates', t: 'objets', l: 'Frise', ajout: 'Année', champs: [{ k: 'annee', t: 'texte', l: 'Année' }, { k: 'titre', t: 'html', l: 'Spectacle(s)' }] },
    { k: 'directeur.titre', t: 'texte', l: 'Portrait : titre' }, { k: 'directeur.chapeau', t: 'texte', l: 'Portrait : chapeau' }, { k: 'directeur.paragraphes', t: 'paragraphes', l: 'Portrait : texte' }]],
  actions: ['Actions culturelles', [{ k: 'titre', t: 'texte', l: 'Titre' }, { k: 'blocs', t: 'paragraphes', l: 'Texte', ajout: 'Bloc' }, { k: 'credit', t: 'texte', l: 'Crédit photo' }]],
  ecole: ['Les publics scolaires', [{ k: 'texte', t: 'html', l: 'La position de la compagnie (en tête de « Je représente un établissement scolaire »)' }]],
  diaporama: ['Bandeau d’accueil', null],
  donateurs: ['Remerciements aux donateurs', null],
  partenaires: ['Partenaires', null],
  coordonnees: ['Coordonnées', [{ k: 'nom', t: 'texte', l: 'Nom' }, { k: 'adresse', t: 'lignes', l: 'Adresse' }, { k: 'legal', t: 'lignes', l: 'Mentions (Siret, APE, licence)' }]],
  // le contact diffusion de « Je souhaite programmer » (troisième script SQL : sans lui, ce texte n'existe pas encore)
  programmation: ['Je souhaite programmer : le contact', [{ k: 'contact.nom', t: 'texte', l: 'Nom' }, { k: 'contact.role', t: 'texte', l: 'Rôle', ph: 'Administratrice' },
    { k: 'contact.email', t: 'texte', l: 'Adresse électronique', ph: 'contact@…' }, { k: 'contact.telephone', t: 'texte', l: 'Téléphone', aide: 'Facultatif : sans numéro, la page n’en montre pas.' }]],
};
function vueTextes(cle) {
  const noms = Object.fromEntries(Object.entries(TEXTES).map(([k, v]) => [k, v[0]]));
  const autres = E.textes.map(t => t.cle).filter(k => !noms[k]).sort();
  const nom = k => noms[k] || (k.startsWith('dossier:') ? `Dossier scolaire : ${k.slice(8)}` : k);
  cadre('textes', `<div class="tete"><h1>Textes du site</h1></div><div class="deux${cle ? ' edition' : ''}"><div class="liste">
      ${[...Object.keys(TEXTES).filter(k => E.textes.some(t => t.cle === k)), ...autres].map(k => `<a class="ligne" style="grid-template-columns:1fr" href="#/textes/${encodeURIComponent(k)}"${k === cle ? ' aria-current="true"' : ''}><span class="corps"><span class="t">${esc(nom(k))}</span></span></a>`).join('')}</div>
    <section class="editeur" id="ed-txt">${cle ? '' : '<div class="vide bloc">Les textes du site qui ne dépendent d’aucun spectacle.</div>'}</section></div>`);
  if (!cle) return;
  const t0 = E.textes.find(t => t.cle === cle);
  if (!t0) { $('#ed-txt').innerHTML = '<div class="vide bloc">Ce texte n’existe pas.</div>'; return; }
  const zone = $('#ed-txt'), def = TEXTES[cle];
  let F = clone(t0.valeur);
  nChamp = 0;
  let corps;
  if (def && def[1]) corps = `<div class="bloc" id="t-f">${def[1].map(c => champ(c, F)).join('')}</div>`;
  else if (typeof F === 'string') corps = `<div class="bloc" id="t-f">${champ({ k: 'v', t: 'html', l: nom(cle) }, { v: F })}</div>`;
  else corps = `<div class="bloc"><p class="aide">Texte structuré : modifiez-le avec soin, la forme doit rester du JSON valide.</p><textarea id="t-json" rows="24" spellcheck="false" style="font:13px/1.5 ui-monospace,monospace">${esc(JSON.stringify(F, null, 2))}</textarea></div>`;
  zone.innerHTML = `<div class="titre-ed"><a class="btn petit" data-tt="retour" href="#/textes">←</a><h2>${esc(nom(cle))}</h2></div>${corps}${pied()}`;
  const brut = typeof F === 'string';
  const W = brut ? { v: F } : F;
  if ($('#t-f')) relier($('#t-f'), W, def && def[1] ? def[1] : [{ k: 'v', t: 'html' }]);
  $('#t-json')?.addEventListener('input', () => marquerSale());
  $('[data-enregistrer]', zone).addEventListener('click', async e => {
    let v;
    if ($('#t-json')) { try { v = JSON.parse($('#t-json').value); } catch (err) { return annoncer('Le JSON n’est pas valide : ' + err.message, { erreur: true }); } }
    else { $$('.riche', zone).forEach(ed => ecrire(W, ed.dataset.chemin, valeur(ed))); v = brut ? W.v : W; }
    e.target.disabled = true;
    const { data, error } = await sb.from('crescite_textes').update({ valeur: v }).eq('cle', cle).select().single();
    e.target.disabled = false;
    if (error) return erreur(error);
    t0.valeur = data.valeur; E.sale = false; marquerSale(false); annoncer('Enregistré : le site est à jour.');
    bravo();
  });
}

// ===================================================================================================== journal
function resume(j) {
  const x = j.apres || j.avant || {};
  if (RESUMES_EQUIPE[j.table_nom]) return RESUMES_EQUIPE[j.table_nom](x);
  if (j.table_nom === 'crescite_dates') { const s = spectacle(x.spectacle_id); return `${s?.titre || 'Date'} · ${jourCourt(x.debut)}${x.intitule ? ` · ${x.intitule.split(' — ')[1] || ''}` : ''}`; }
  if (j.table_nom === 'crescite_representations') { const d = E.dates.find(y => y.id === x.date_id); const s = d && spectacle(d.spectacle_id); return `${s?.titre || ''} · ${jourCourt(x.jour)}${x.heure ? ' · ' + AGENDA.heureTexte(h5(x.heure)) : ''}`; }
  if (j.table_nom === 'crescite_spectacles') return x.titre;
  if (j.table_nom === 'crescite_lieux') return lieuTexte(x);
  if (j.table_nom === 'crescite_ateliers') return x.titre;
  if (j.table_nom === 'crescite_seances') return `${jourCourt(x.jour)} · ${x.classe || ''}`;
  if (j.table_nom === 'crescite_textes') return x.cle;
  if (j.table_nom === 'crescite_lieux_suivi') return lieuTexte(lieu(x.lieu_id)) || j.ligne;
  if (j.table_nom === 'crescite_dates_suivi') { const d = E.dates.find(y => y.id === x.date_id); return d ? `${spectacle(d.spectacle_id)?.titre || 'Date'} · ${jourCourt(d.debut)}` : j.ligne; }
  return j.ligne;
}
const champsChanges = j => j.avant && j.apres ? Object.keys(j.apres).filter(k => !['modifie_le', 'modifie_par'].includes(k) && JSON.stringify(j.avant[k]) !== JSON.stringify(j.apres[k])) : [];
async function vueJournal() {
  cadre('journal', '<div class="tete"><h1>Journal</h1><span class="compte">Les 300 dernières modifications. « Revenir » remet la ligne telle qu’elle était juste avant.</span></div><div class="bloc" style="padding:0" data-liste id="l-journal"><p class="vide">Chargement…</p></div>');
  await rechargerJournal();
  const zone = $('#l-journal');
  const qui = id => { const a = E.admins.find(x => x.user_id === id); return a?.nom || (id === E.session.user.id ? E.session.user.email : id ? 'un administrateur' : 'import'); };
  const OPS = { INSERT: 'Ajout', UPDATE: 'Modification', DELETE: 'Suppression' };
  zone.rafraichir = async () => { await rechargerJournal(); dessiner(); };
  const dessiner = () => {
    zone.innerHTML = E.journal.map(j => { const ch = champsChanges(j), ap = apprisDuJournal(j); if (j.operation === 'UPDATE' && !ch.length) return '';
      return `<div class="journal-ligne"><span class="quand">${new Date(j.quand).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })}<br>${esc(qui(j.qui))}</span>
        <span class="quoi"><b>${OPS[j.operation]} · ${esc(NOMS_TABLES[j.table_nom] || j.table_nom)}</b>${esc(resume(j) || '')}${ch.length ? `<span class="diff"> — ${esc(ch.join(', '))}</span>` : ''}${ap.length ? `<span class="diff appris"> — gardé dans les fiches : ${esc(ap.join(', '))}</span>` : ''}</span>
        <span>${j.operation === 'INSERT' ? `<button class="btn petit" data-j="${j.id}" data-tt="retour">Retirer</button>` : `<button class="btn petit" data-j="${j.id}" data-tt="retour">Revenir</button>`}</span></div>`; }).join('') || '<p class="vide">Rien encore.</p>';
  };
  dessiner();
  zone.addEventListener('click', async e => {
    const b = e.target.closest('[data-j]'); if (!b) return;
    const j = E.journal.find(x => x.id === +b.dataset.j), [, pk] = TABLES[j.table_nom] || TABLES_EQUIPE[j.table_nom] || [null, 'id'];
    const sans = o => { const x = { ...o }; delete x.modifie_le; delete x.modifie_par; return x; };
    const ligne = (q, o) => [].concat(pk).reduce((q2, c) => q2.eq(c, o[c]), q);   // une clé d'une ou plusieurs colonnes
    let r;
    if (j.operation === 'INSERT') { if (!confirm('Retirer cette ligne ajoutée ?')) return; r = await ligne(sb.from(j.table_nom).delete(), j.apres); }
    else if (j.operation === 'UPDATE') { if (!confirm('Remettre cette ligne telle qu’elle était avant cette modification ?')) return; r = await ligne(sb.from(j.table_nom).update(sans(j.avant)), j.avant); }
    else {
      if (!confirm('Rétablir cette ligne supprimée ?')) return;
      r = await sb.from(j.table_nom).insert(sans(j.avant));
      if (!r.error && j.table_nom === 'crescite_dates') {
        const liees = E.journal.filter(x => x.operation === 'DELETE' && ['crescite_representations', 'crescite_dates_suivi', 'crescite_equipes', 'crescite_feuilles'].includes(x.table_nom) && x.avant?.date_id === j.avant.id);
        for (const x of liees) { const r2 = await sb.from(x.table_nom).insert(sans(x.avant)); if (r2.error) { r = r2; break; } }
      }
    }
    if (r.error) return erreur(r.error, 'Retour impossible');
    await chargerTout(); annoncer('C’est fait.'); zone.rafraichir();
  });
}
