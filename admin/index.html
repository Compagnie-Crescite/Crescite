// L'impression (sa feuille @media print est à la fin de habillage.js) : en tête de la page imprimée, posée juste avant
// (beforeprint) hors de #app, ce qu'on imprime (la rubrique, la fiche ouverte), les filtres en cours de la liste ou du
// planning, lus dans la vue (la recherche, un choix qui n'est pas le premier, une puce ou une commande segmentée choisie
// autre que la première), le compte de la liste, la compagnie et le jour. À l'écran, rien (display: none).
function teteImpression() {
  const vue = $('#vue');
  let t = document.getElementById('imp-tete');
  if (!t) { t = document.createElement('div'); t.id = 'imp-tete'; t.setAttribute('aria-hidden', 'true'); document.body.prepend(t); }
  if (!vue) { t.innerHTML = ''; return; }
  const net = s => String(s || '').replace(/\s+/g, ' ').trim();
  const rubrique = net($('.tete h1', vue)?.innerText) || net($('.barre .nav [aria-current="page"]')?.textContent);
  const fiche = $('.deux.edition .editeur h2, .titre-ed h2', vue);
  const zones = $$('.filtres, .journal-filtres, .tab-filtres, .pl-vues, .pl-filtres', vue).filter(z => !(fiche && z.closest('.liste')));
  const mots = [];
  zones.forEach(z => {
    $$('input[type="search"], input[type="text"]', z).forEach(i => { if (net(i.value)) mots.push(`« ${net(i.value)} »`); });
    $$('input[type="date"]', z).forEach(i => { if (i.value) mots.push(`${net(i.closest('label')?.textContent) || 'jour'} ${jourCourt(i.value)}`); });
    $$('select', z).forEach(s => { if (s.selectedIndex > 0) mots.push(net(s.options[s.selectedIndex].textContent)); });
    $$('.puces [aria-pressed="true"]', z).forEach(p => mots.push(net(p.textContent)));
    $$('.seg, [role="group"]', z).forEach(g => { const b = $$('button', g), x = b.find(y => y.getAttribute('aria-pressed') === 'true'); if (x && x !== b[0]) mots.push(net(x.textContent)); });
  });
  const compte = zones.map(z => net($('.compte', z)?.textContent)).find(Boolean) || '';
  const filtres = zones.length ? `${mots.length ? `Filtres : ${[...new Set(mots)].join(' · ')}` : 'Sans filtre'}${compte ? ` — ${compte}` : ''}` : '';
  const jour = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  t.innerHTML = `<p class="imp-quoi">${esc(rubrique)}${fiche ? ` · ${esc(net(fiche.innerText))}` : ''}</p>${filtres ? `<p class="imp-filtres">${esc(filtres)}</p>` : ''}<p class="imp-qui">Compagnie Crescite · Administration · ${esc(jour)}</p>`;
}
addEventListener('beforeprint', teteImpression);

// une annonce en bas de l'écran : elle part seule ; on la renvoie avant d'une croix, ou d'un geste (la glisser de côté ou
// vers le bas), quand elle couvre un bouton ; tenue sous le doigt ou survolée, elle attend
function annoncer(msg, { erreur = false, action = null, libelle = 'Annuler', delai = 5000 } = {}) {
  const el = document.createElement('div');
  el.className = 'annonce' + (erreur ? ' erreur' : '');
  el.setAttribute('role', erreur ? 'alert' : 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-tt="retour">${esc(libelle)}</button>` : ''}<button type="button" class="annonce-fermer" aria-label="Fermer l’annonce" title="Fermer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  let partie = false, tenue = false, reste = erreur ? 9000 : delai, depuis = Date.now(), minuteur = null;
  const partir = (dx = 0, dy = 0) => {
    if (partie) return; partie = true; clearTimeout(minuteur);
    if (dx || dy) { el.style.transition = 'transform .18s ease-in, opacity .18s ease-in'; el.style.transform = `translate(${dx}px, ${dy}px)`; el.style.opacity = '0'; }
    else el.classList.add('part');
    setTimeout(() => el.remove(), 200);
  };
  const attendre = () => { clearTimeout(minuteur); depuis = Date.now(); minuteur = setTimeout(() => { if (!tenue) partir(); }, reste); };
  const suspendre = () => { tenue = true; clearTimeout(minuteur); reste = Math.max(1500, reste - (Date.now() - depuis)); };
  const reprendre = () => { tenue = false; if (!partie) attendre(); };
  if (action) $('[data-tt="retour"]', el).addEventListener('click', () => { el.remove(); partie = true; clearTimeout(minuteur); action(); });
  $('.annonce-fermer', el).addEventListener('click', () => partir());
  el.addEventListener('mouseenter', suspendre);
  el.addEventListener('mouseleave', reprendre);
  // le geste : on la tire du doigt (ou de la souris) ; au-delà d'un tiers de sa largeur de côté, ou de 40 px vers le bas, elle part
  let x0 = null, y0 = 0, dx = 0, dy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.button || e.target.closest('button')) return;
    x0 = e.clientX; y0 = e.clientY; dx = dy = 0; suspendre();
    el.setPointerCapture?.(e.pointerId); el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0; dy = Math.max(0, e.clientY - y0);
    const vertical = dy > Math.abs(dx);
    el.style.transform = vertical ? `translateY(${dy}px)` : `translateX(${dx}px)`;
    el.style.opacity = String(Math.max(.3, 1 - (vertical ? dy / 80 : Math.abs(dx) / el.offsetWidth)));
  });
  const lacher = () => {
    if (x0 === null) return;
    x0 = null;
    const vertical = dy > Math.abs(dx);
    if (vertical ? dy > 40 : Math.abs(dx) > el.offsetWidth / 3) { partir(vertical ? 0 : Math.sign(dx) * el.offsetWidth, vertical ? 60 : 0); return; }
    el.style.transition = 'transform .2s, opacity .2s'; el.style.transform = ''; el.style.opacity = '';
    if (!el.matches(':hover')) reprendre();
  };
  el.addEventListener('pointerup', lacher);
  el.addEventListener('pointercancel', lacher);
  $('#annonces').append(el);
  attendre();
}
const erreur = (e, quoi = 'L’enregistrement a échoué') => { console.error(e); annoncer(`${quoi} : ${e?.message || e}`, { erreur: true }); };
// les coordonnées écrites dans un champ deviennent des liens : chaque numéro « Appeler le … » (tel:), chaque adresse
// électronique « Écrire à … » (mailto:), reconnus comme dans les feuilles de route (FEUILLE.jetons, feuille.js)

// sous le champ d'une fiche : ces liens, et ce que mention(valeur) y ajoute (d'où vient la valeur), tenus à jour à la saisie

// un HTML propre : gras, italique, liens, retours à la ligne, intertitres et listes ; rien d'autre
function propre(html) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const sortie = n => {
    if (n.nodeType === 3) return esc(n.textContent).replace(/&#39;/g, '’');
    if (n.nodeType !== 1) return '';
    const tag = n.tagName.toLowerCase(), d = [...n.childNodes].map(sortie).join('');
    if (tag === 'b' || tag === 'strong') return d.trim() ? `<strong>${d}</strong>` : d;
    if (tag === 'i' || tag === 'em') return d.trim() ? `<em>${d}</em>` : d;
    if (tag === 'br') return '<br/>';
    if (['h2', 'h3', 'ul', 'ol', 'li'].includes(tag)) return `<${tag}>${d}</${tag}>`;
    if (tag === 'a') { const h = n.getAttribute('href') || ''; return /^(https?:|mailto:|#\/)/.test(h) ? `<a href="${esc(h)}">${d}</a>` : d; }
    if (tag === 'div' || tag === 'p') return d + '<br/>';
    return d;
  };
  return [...t.content.childNodes].map(sortie).join('').replace(/(<br\/>\s*)+$/, '').replace(/&nbsp;/g, ' ').trim();
}

// des photos plus légères avant l'envoi : 2 000 px au plus, en WebP
async function optimiser(fichier) {
  try {
    const img = await createImageBitmap(fichier);
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.84));
    return blob && blob.size < fichier.size ? blob : fichier;
  } catch { return fichier; }
}
async function envoyerPhoto(fichier, dossier) {
  const blob = await optimiser(fichier);
  const ext = blob.type === 'image/webp' ? 'webp' : (fichier.name.split('.').pop() || 'jpg').toLowerCase();
  const chemin = `${dossier}/${Date.now().toString(36)}-${slugifier(fichier.name.replace(/\.[^.]+$/, '')) || 'photo'}.${ext}`;
  const { error } = await sb.storage.from('crescite').upload(chemin, blob, { contentType: blob.type || fichier.type, upsert: false, cacheControl: '31536000' });
  if (error) throw error;
  return chemin;
}

// en attendant la base : l'en-tête tel qu'il sera (inerte), et la vue de l'adresse dessinée à sa forme, qui luit. Le
// tableau de bord : le bandeau, ses boutons, la grande tuile puis les autres ; une rubrique à liste : son titre, la liste
// et la place de la fiche ; le journal : ses filtres et ses lignes ; les spectacles : leurs cartes ; le planning, sa grille ;
// la diffusion : ses chiffres et ses colonnes. Les mêmes marges que la page : le contenu prend la place du squelette sans
// pousser l'en-tête ni le titre. Le squelette ne paraît qu'au bout de 0,15 s (une base rapide ne le fait pas clignoter).
const SQ = (cls, style = '') => `<span class="sq ${cls}"${style ? ` style="${style}"` : ''}></span>`;
const sqTete = (boutons = 1, titre = 200) => `<div class="tete sq-tete">${SQ('sq-titre', `width:${titre}px`)}${Array.from({ length: boutons }, (_, i) => SQ('sq-pilule', `width:${i ? 110 : 150}px`)).join('')}</div>`;
const sqLignes = n => SQ('sq-ligne').repeat(n);
// une zone qui attend sa lecture (le journal, la corbeille, un fil de notes, le journal d'une invitation) : ses lignes en
// squelette, et « Chargement… » pour les lecteurs d'écran
const attenteLignes = (n = 4, hauteur = 58) => `<div class="ad-squelette sq-pile sq-zone" aria-hidden="true">${SQ('sq-ligne', `height:${hauteur}px`).repeat(n)}</div><p class="sr" role="status">Chargement…</p>`;
function corpsSquelette(rub) {
  switch (rub) {
    case 'accueil': return `${SQ('sq-salut')}<div class="tete sq-tete sq-tb-outils">${SQ('sq-pilule', 'width:272px')}${SQ('sq-pilule', 'width:87px')}${SQ('sq-pilule', 'width:130px')}</div>
      <div class="sq-tuiles">${SQ('sq-tuile sq-tuile-g')}${SQ('sq-tuile sq-tuile-m')}${SQ('sq-tuile')}${SQ('sq-tuile')}</div>`;
    case 'journal': return `${sqTete(1, 98)}${SQ('sq-filtres')}<div class="sq-pile">${sqLignes(7)}</div>`;
    case 'spectacles': return `${sqTete(1, 144)}<div class="sq-cartes">${SQ('sq-carte').repeat(5)}</div>`;
    case 'planning': return `${sqTete(2, 113)}${SQ('sq-grille')}`;
    case 'diffusion': return `${sqTete(2, 300)}<div class="sq-kpi">${SQ('sq-chiffre').repeat(3)}</div><div class="sq-colonnes">${SQ('sq-colonne').repeat(5)}</div>`;
    case 'feuilles': return `${sqTete(0, 212)}<div class="sq-etroit">${SQ('sq-filtres')}<div class="sq-pile">${sqLignes(6)}</div></div>`;
    default: return `${sqTete(rub === 'textes' ? 0 : 1)}<div class="sq-deux"><div class="sq-pile">${sqLignes(7)}</div>${SQ('sq-fiche')}</div>`;
  }
}

let demarre = false;
async function demarrer() {
  // feuille.js et equipe.js se chargent après ce script : on les attend
  if (document.readyState === 'loading') return void document.addEventListener('DOMContentLoaded', demarrer, { once: true });

    $('#b-sortir').addEventListener('click', () => sb.auth.signOut());

  }
  try { await chargerTout(); } catch (e) { demarre = false; return ecranConnexion('Chargement impossible : ' + e.message); }
  E.luLe = Date.now();

// la clé de chaque table qu'on lit en entier (id, sinon celle-ci) : l'ordre des pages de 1 000 doit être total, sans quoi
// deux pages se chevauchent ou se manquent dès qu'une table dépasse 1 000 lignes (trier sur debut ou jour ne suffit pas)
const CLES_TABLES = { crescite_dates_suivi: ['date_id'], crescite_lieux_suivi: ['lieu_id'], crescite_dates_chiffres: ['date_id'], crescite_textes: ['cle'],
  crescite_admins: ['user_id'], crescite_equipes: ['date_id', 'personne_id'], crescite_personnes_privees: ['personne_id'], crescite_personnes_suivi: ['personne_id'] };
async function tout(table, ordre) {
  const out = [];
  for (let a = 0; ; a += 1000) {
    let q = sb.from(table).select('*').range(a, a + 999);
    if (ordre) q = q.order(ordre, { ascending: true });
    for (const k of CLES_TABLES[table] || ['id']) if (k !== ordre) q = q.order(k, { ascending: true });
    const { data, error } = await q;
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function chargerTout() {
  const equipe = chargerEquipe();   // l'équipe (equipe.js) : ne lève jamais d'erreur, même quand la base ne l'a pas encore
  const chiffres = tout('crescite_dates_chiffres').then(x => x, () => null);   // null : la base n'a pas encore le dixième script
  const prefs = typeof PREFS !== 'undefined' ? PREFS.charger() : null;         // les préférences du compte (prefs.js) : ne lève jamais d'erreur ; le tableau de bord et le planning s'en servent
  const tableau = typeof TABLEAU !== 'undefined' ? TABLEAU.charger() : null;   // la disposition du tableau de bord (tableau.js) : ne lève jamais d'erreur
  const documents = typeof MODELES !== 'undefined' ? MODELES.charger() : null;   // les documents générés (modeles.js) : ne lève jamais d'erreur
  const carnet = typeof CARNET !== 'undefined' ? CARNET.charger() : null;      // le carnet des lieux (carnet.js) : ne lève jamais d'erreur
  let ideale = false;               // la base a les tables de TABLES_IDEALE (une au moins se lit)
  const facultative = table => tout(table, 'id').then(x => { ideale = true; return x; }, () => []);   // (par id : des pages de 1 000 qui ne se chevauchent pas)
  const [sp, li, da, re, su, ls, at, se, tx, ad, pr, fr, mt, dv] = await Promise.all([
    tout('crescite_spectacles', 'ordre'), tout('crescite_lieux', 'id'), tout('crescite_dates', 'debut'), tout('crescite_representations', 'jour'),
    tout('crescite_dates_suivi'), tout('crescite_lieux_suivi'), tout('crescite_ateliers', 'ordre'), tout('crescite_seances', 'jour'),
    tout('crescite_textes'), tout('crescite_admins'),
    ...Object.keys(TABLES_IDEALE).map(facultative),
  ]).catch(async e => { await equipe; throw e; });   // (une lecture qui échoue attend l'équipe : actualiser rend ce qu'on en savait)
  Object.assign(E, { spectacles: sp, lieux: li, dates: da, reps: re, suivis: su, lieuxSuivi: ls, ateliers: at, seances: se, textes: tx, admins: ad,
    prospects: pr, frais: fr, materiel: mt, devis: dv, ideale });
  await equipe;
  const c = await chiffres;
  E.chiffres = c || []; E.chiffresInstalles = !!c;
  if (ideale) await lireAlertes();

const CHIFFRES = [['jauge', 'Jauge (places)', 1, 100000], ['spectateurs', 'Spectateurs', 1, 1000000], ['heures_ateliers', 'Heures d’ateliers', .5, 100000]];
const chiffresDe = id => (E.chiffres || []).find(x => x.date_id === id) || {};
const chiffresVersForm = id => { const c = chiffresDe(id); return Object.fromEntries(CHIFFRES.map(([k]) => [k, c[k] == null ? '' : Number(c[k])])); };
const nombreFr = n => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 1 });   // « 1 456 », « 12,5 »
// les écrire (l'administration seule) : rien quand ils n'ont pas changé, la ligne effacée quand ils sont tous vides
async function ecrireChiffres(id, F) {
  if (!E.chiffresInstalles || !F.chiffres) return;
  const avant = chiffresVersForm(id), ligne = { date_id: id };
  CHIFFRES.forEach(([k]) => { const v = F.chiffres[k]; ligne[k] = v === '' || v == null || !Number.isFinite(Number(v)) ? null : Number(v); });
  if (CHIFFRES.every(([k]) => (avant[k] === '' ? null : avant[k]) === ligne[k])) return;
  const vide = CHIFFRES.every(([k]) => ligne[k] == null);
  const { error } = vide ? await sb.from('crescite_dates_chiffres').delete().eq('date_id', id)
    : await sb.from('crescite_dates_chiffres').upsert(ligne, { onConflict: 'date_id' });
  if (error) { error.message = `La date est enregistrée, mais pas ses chiffres : ${error.message}`; throw error; }
  E.chiffres = (E.chiffres || []).filter(x => x.date_id !== id).concat(vide ? [] : [{ ...chiffresDe(id), ...ligne }]);
}

  function ecartsPour(d, ids, spId = d.spectacle_id) {
    const voulus = new Set(ids), actuels = ecartsDate(d.id), base = tourneeIds(spId), out = [];
    base.forEach(p => { if (!voulus.has(p)) out.push({ personne_id: p, present: false, fonction: '', note: null }); else { const e = actuels.find(x => x.personne_id === p && x.present); if (e) out.push(e); } });

  // niveau : 'seance' (la ligne), 'date' (toutes les séances de la date), 'lieu' (lu dans la fiche du lieu). val : la valeur

    const vus = new Set();
    ecrire(chs.filter(ch => { const k = ch.col.niveau === 'seance' ? `${ch.x.cle}|${ch.col.k}` : `${ch.x.d.id}|${ch.col.k}`; if (vus.has(k)) return false; vus.add(k); return true; }));
  }

  // ———— une fenêtre posée sur la case (le lieu, la distribution) : Échap la ferme ; un clic à côté la ferme aussi
  function poser(td, html, { large = false, label = '' } = {}) {
    fermerPop(false);
    const pop = document.createElement('div');
    pop.className = `tab-pop${large ? ' large' : ''}`;
    pop.setAttribute('role', 'dialog');
    if (label) pop.setAttribute('aria-label', label);
    pop.innerHTML = html;
    document.body.append(pop);
    const placer = () => {
      if (!td.isConnected) return;
      const r = td.getBoundingClientRect(), w = Math.min(pop.offsetWidth, innerWidth - 16), h = pop.offsetHeight;
      let top = r.bottom + 4;
      if (top + h > innerHeight - 8 && r.top - h - 4 > 8) top = r.top - h - 4;
      pop.style.left = `${Math.min(Math.max(8, r.left), innerWidth - w - 8)}px`;
      pop.style.top = `${Math.max(8, Math.min(top, innerHeight - h - 8))}px`;
    };
    placer();
    const dehors = e => { if (!pop.contains(e.target) && !e.target.closest('.suggestions')) { const v = T.pop?.valider; if (v) v(); else fermerPop(false); } };
    const echap = e => { if (e.key === 'Escape' && T.pop?.el === pop) { e.preventDefault(); e.stopPropagation(); fermerPop(); } };
    setTimeout(() => document.addEventListener('mousedown', dehors, true), 0);
    pop.addEventListener('keydown', echap);
    window.addEventListener('resize', placer); $('#tab-cadre')?.addEventListener('scroll', placer);
    T.pop = { el: pop, td, valider: null, nettoyer: () => { document.removeEventListener('mousedown', dehors, true); window.removeEventListener('resize', placer); $('#tab-cadre')?.removeEventListener('scroll', placer); }, placer };
    return pop;
  }
  function fermerPop(rendre = true) {
    const p = T.pop; if (!p) return;
    T.pop = null; p.nettoyer(); p.el.remove();
    if (T.aRafraichir) { T.aRafraichir = false; dessiner({ garder: true }); }
    if (rendre) marquer(true);
  }
  // le lieu : la recherche des lieux de l'administration (et « Nouveau lieu »)
  function editerLieu(x, c, initial) {

      <div class="tab-pop-pied">${x.d.lieu_id != null ? '<button type="button" class="btn petit" data-sans-lieu>Sans lieu</button>' : ''}<button type="button" class="btn petit lien" data-fermer>Fermer</button></div>`, { label: 'Lieu de la date' });
    comboLieu(pop, 'tab-lieu', x.d.lieu_id, id => { fermerPop(); if (id !== x.d.lieu_id) ecrire([{ x, col: c, v: id }]); });
    const inp = $('#tab-lieu input', pop);
    T.pop.placer();
    inp.focus();
    if (initial) { inp.value = initial; inp.dispatchEvent(new Event('input')); } else inp.select();
    pop.addEventListener('click', e => {
      if (e.target.closest('[data-fermer]')) fermerPop();

  // la distribution : des pastilles (✕ pour retirer), un champ pour ajouter (la distribution du spectacle en tête)
  function editerEquipe(x, c, initial) {
    const td = cellule(T.actif.l, T.actif.c), d = x.d, s = spectacle(d.spectacle_id);
    const avant = equipeIds(d);
    let ids = [...avant], actifS = 0, deroulee = false;   // la liste s'ouvre en tapant (ou par ↓), se referme à l'ajout
    const pop = poser(td, `<p class="tab-pop-titre" id="tab-eq-titre">Distribution · ${esc(jourCourt(x.r?.jour || d.debut))}${x.n > 1 ? ` <small>pour les ${x.n} séances de la date</small>` : ''}</p>
      <ul class="tab-pastilles" id="tab-eq-pastilles" aria-label="Qui part"></ul>
      <div class="tab-eq-ajout"><input type="text" id="tab-eq-q" role="combobox" aria-expanded="false" aria-controls="tab-eq-liste" aria-autocomplete="list" aria-label="Ajouter quelqu’un" placeholder="Ajouter quelqu’un…" autocomplete="off" spellcheck="false">
        <ul class="tab-eq-liste" id="tab-eq-liste" role="listbox" aria-label="Personnes" hidden></ul></div>
      <p class="aide">${s ? `La distribution « en tournée » de ${esc(s.titre)} part par défaut ; ` : ''}ce qui change ici ne vaut que pour cette date. Entrée ajoute, Retour arrière retire la dernière, Échap renonce.</p>
      <div class="tab-pop-pied"><button type="button" class="btn principal petit" data-eq-ok>Enregistrer</button><button type="button" class="btn petit" data-eq-etendre>Étendre à…</button><button type="button" class="btn petit lien" data-fermer>Annuler</button></div>`, { large: true });
    pop.setAttribute('aria-labelledby', 'tab-eq-titre');
    const q = $('#tab-eq-q', pop), liste = $('#tab-eq-liste', pop), pastilles = $('#tab-eq-pastilles', pop);
    const dist = d.spectacle_id ? distributionDe(d.spectacle_id) : [];
    const fonctions = id => [...new Set(dist.filter(y => y.personne_id === id).map(fonctionDistribution))].join(', ');
    const candidats = () => {
      const n = norm(q.value).trim(), deDist = [...new Set(dist.map(y => y.personne_id))];
      const autres = E.personnes.filter(p => !deDist.includes(p.id)).sort((a, b) => norm(nomDe(a)).localeCompare(norm(nomDe(b)))).map(p => p.id);
      return [...deDist, ...autres].filter(id => !ids.includes(id) && personne(id) && (!n || norm(`${nomDe(personne(id))} ${fonctions(id)}`).includes(n))).slice(0, 12);
    };
    const dessinerP = () => {
      pastilles.innerHTML = ids.map(id => `<li class="tab-pastille">${esc(nomDe(personne(id)))}<button type="button" data-retirer="${id}" aria-label="Retirer ${esc(nomDe(personne(id)))}">✕</button></li>`).join('') || '<li class="tab-gris">Personne pour l’instant.</li>';
      const xs = candidats(), deDist = new Set(dist.map(y => y.personne_id));
      actifS = Math.min(actifS, Math.max(0, xs.length - 1));
      liste.innerHTML = xs.map((id, i) => `<li role="option" id="tab-eq-o${i}" data-id="${id}" aria-selected="${i === actifS}">${esc(nomDe(personne(id)))}<small>${deDist.has(id) ? esc(fonctions(id) || 'distribution') : 'hors distribution'}</small></li>`).join('');
      const ouvert = document.activeElement === q && xs.length > 0 && (deroulee || q.value.trim() !== '');
      liste.hidden = !ouvert; q.setAttribute('aria-expanded', String(ouvert));
      if (ouvert) q.setAttribute('aria-activedescendant', `tab-eq-o${actifS}`); else q.removeAttribute('aria-activedescendant');
      T.pop?.placer();
    };
    const ajouter = id => { if (id && !ids.includes(id)) ids.push(id); q.value = ''; actifS = 0; deroulee = false; dessinerP(); q.focus(); };
    const valider = () => { fermerPop(); if (JSON.stringify([...ids].sort()) !== JSON.stringify([...avant].sort())) return ecrire([{ x, col: c, v: ids }]); return Promise.resolve(true); };
    T.pop.valider = valider;
    pop.addEventListener('click', e => {
      const r = e.target.closest('[data-retirer]'); if (r) { ids = ids.filter(id => id !== +r.dataset.retirer); dessinerP(); q.focus(); return; }
      const o = e.target.closest('[role=option]'); if (o) { ajouter(+o.dataset.id); return; }
      if (e.target.closest('[data-eq-ok]')) return valider();
      if (e.target.closest('[data-fermer]')) return fermerPop();
      if (e.target.closest('[data-eq-etendre]')) { const garder = [...ids]; valider().then(ok => { if (ok) etendre(x, garder); }); }
    });
    pop.addEventListener('mousedown', e => { if (e.target.closest('[role=option]')) e.preventDefault(); });
    q.addEventListener('input', () => { actifS = 0; deroulee = q.value.trim() !== ''; dessinerP(); });
    q.addEventListener('focus', dessinerP);
    q.addEventListener('blur', () => setTimeout(() => { if (T.pop?.el === pop && document.activeElement !== q) { liste.hidden = true; q.setAttribute('aria-expanded', 'false'); } }, 120));
    q.addEventListener('keydown', e => {
      const xs = candidats();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (xs.length) { if (!deroulee && !q.value.trim()) { deroulee = true; actifS = 0; } else actifS = (actifS + (e.key === 'ArrowDown' ? 1 : -1) + xs.length) % xs.length; dessinerP(); $(`#tab-eq-o${actifS}`, pop)?.scrollIntoView({ block: 'nearest' }); } }
      else if (e.key === 'Enter') { e.preventDefault(); if ((q.value.trim() || deroulee) && xs.length) ajouter(xs[actifS]); else if (!q.value.trim()) valider(); }
      else if (e.key === 'Backspace' && !q.value && ids.length) { ids.pop(); dessinerP(); }
    });
    pastilles.addEventListener('keydown', e => { const b = e.target.closest('[data-retirer]'); if (b && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); ids = ids.filter(id => id !== +b.dataset.retirer); dessinerP(); q.focus(); } });
    dessinerP();
    q.focus();
    if (initial) { q.value = initial; dessinerP(); }
  }

  // ———— « Étendre à… » : la même distribution sur d'autres dates du même spectacle
  function etendre(x, ids) {
    const d0 = E.dates.find(y => y.id === x.d.id) || x.d, sp = d0.spectacle_id, s = spectacle(sp), an = d0.debut.slice(0, 4);
    const p = plage(), choisies = T.ancre ? [...new Set(T.lignes.slice(p.l0, p.l1 + 1).map(y => y.d.id))] : [];
    const portees = [['saison', `les dates de ${s ? `« ${s.titre} »` : 'ce spectacle'} de la saison ${d0.saison || ''}`, dd => dd.saison === d0.saison],
      ['annee', `les dates de ${s ? `« ${s.titre} »` : 'ce spectacle'} de l’année ${an}`, dd => dd.debut.slice(0, 4) === an || (dd.fin || dd.debut).slice(0, 4) === an],
      ...(choisies.length ? [['lignes', `les lignes choisies (${pl(choisies.length, 'date')})`, dd => choisies.includes(dd.id)]] : [])];
    const noms = xs => listeEt(xs.map(id => nomDe(personne(id))).filter(Boolean));
    const dlg = document.createElement('dialog');

    dlg.setAttribute('aria-labelledby', 'tab-et-titre');
    dlg.innerHTML = `<form method="dialog" class="tab-dialogue-boite"><h2 id="tab-et-titre">Étendre la distribution</h2>
      <p>${ids.length ? `<b>${esc(noms(ids))}</b>` : '<b>Personne</b>'}${s ? ` · ${esc(s.titre)}` : ''}</p>
      <fieldset><legend>Sur</legend>${portees.map(([k, l], i) => `<label class="case"><input type="radio" name="portee" value="${k}"${i === 0 ? ' checked' : ''}> ${esc(l)}</label>`).join('')}</fieldset>
      <label class="case"><input type="checkbox" id="tab-et-passees"> y compris les dates passées</label>
      <div class="tab-et-apercu" id="tab-et-apercu" aria-live="polite"></div>
      <div class="fm-boutons"><button type="button" class="btn principal" id="tab-et-ok">Appliquer</button><button type="button" class="btn" id="tab-et-non">Annuler</button></div></form>`;
    document.body.append(dlg);
    let cibles = [];
    const apercu = () => {
      const k = $('input[name=portee]:checked', dlg).value, passees = $('#tab-et-passees', dlg).checked, filtre = portees.find(y => y[0] === k)[2];
      const tous = E.dates.filter(dd => dd.spectacle_id === sp && filtre(dd) && (passees || (dd.fin || dd.debut) >= AUJ));
      const autresSp = k === 'lignes' ? choisies.filter(id => E.dates.find(dd => dd.id === id)?.spectacle_id !== sp).length : 0;
      const voulu = JSON.stringify([...ids].sort((a, b) => a - b));
      cibles = tous.filter(dd => JSON.stringify(equipeIds(dd).sort((a, b) => a - b)) !== voulu);
      const base = tourneeIds(sp);
      const poses = cibles.map(dd => { const e = ecartsDate(dd.id); return { dd, plus: e.filter(y => y.present && !base.includes(y.personne_id)).map(y => y.personne_id), moins: e.filter(y => !y.present).map(y => y.personne_id) }; }).filter(y => y.plus.length || y.moins.length);
      $('#tab-et-apercu', dlg).innerHTML = `<p><b>${cibles.length ? `${pl(cibles.length, 'date')} ${cibles.length > 1 ? 'changeront' : 'changera'}` : 'Aucune date ne changera'}</b>${tous.length - cibles.length ? ` ; ${pl(tous.length - cibles.length, 'date')} ${tous.length - cibles.length > 1 ? 'sont' : 'est'} déjà à jour` : ''}.${autresSp ? ` ${pl(autresSp, 'ligne')} d’un autre spectacle ${autresSp > 1 ? 'restent' : 'reste'} de côté.` : ''}</p>
        ${poses.length ? `<p class="tab-et-alerte">Des remplaçants sont posés à la main ; ils seront remplacés :</p><ul class="tab-et-liste">${poses.map(y => `<li>${esc(jourCourt(y.dd.debut))} : ${[y.plus.length ? `${esc(noms(y.plus))} ${y.plus.length > 1 ? 'ajoutés' : 'ajouté·e'}` : '', y.moins.length ? `${esc(noms(y.moins))} ${y.moins.length > 1 ? 'ne partent pas' : 'ne part pas'}` : ''].filter(Boolean).join(' ; ')}</li>`).join('')}</ul>` : ''}`;
      $('#tab-et-ok', dlg).textContent = cibles.length ? `Appliquer à ${pl(cibles.length, 'date')}` : 'Appliquer';
      $('#tab-et-ok', dlg).disabled = !cibles.length;

      const b = $('#tab-et-ok', dlg), xs = [...cibles], avants = xs.map(dd => ({ id: dd.id, sp: dd.spectacle_id, equipe: ecartsDate(dd.id) }));
      b.disabled = true;
      let n = 0, rates = 0;
      for (const dd of xs) {
        b.textContent = `${n + 1} / ${xs.length}…`;
        T.recents.set(dd.id, Date.now());
        const ok = await enregistrerEquipeDate(dd.id, { spectacle_id: dd.spectacle_id, equipe: ecartsPour(dd, ids) });
        if (ok) n++; else rates++;
      }
      dlg.close();
      T.pile.push({ libelle: `distribution étendue à ${pl(n, 'date')}`, defaire: async () => { for (const a of avants) { T.recents.set(a.id, Date.now()); await enregistrerEquipeDate(a.id, { spectacle_id: a.sp, equipe: a.equipe }); } } });
      etat(`Distribution posée sur ${pl(n, 'date')}${rates ? ` ; ${rates} n’ont pas pu l’être` : ''}.`, rates ? 'erreur' : 'ok', true);
      annoncer(`Distribution posée sur ${pl(n, 'date')}.`, { libelle: 'Annuler', delai: 9000, action: () => annuler() });

  // ———— ajouter une séance : à la date du même spectacle au même lieu qui touche ce jour (le même, la veille ou le
  // lendemain), sinon à une nouvelle date. → { id (la date), nouvelle, texte } ; une erreur de la base est levée
  const ecartJours = (d, j) => (j < d.debut ? (Date.parse(d.debut) - Date.parse(j)) : j > (d.fin || d.debut) ? (Date.parse(j) - Date.parse(d.fin || d.debut)) : 0) / 864e5;
  const dateVoisine = (sp, lieuId, jour) => E.dates.filter(d => d.spectacle_id === sp && d.statut !== 'annulee' && (d.lieu_id ?? null) === (lieuId ?? null) && ecartJours(d, jour) <= 1).sort((a, b) => ecartJours(a, jour) - ecartJours(b, jour))[0] || null;
  const ouDit = lieuId => { const l = lieu(lieuId); return l ? `${l.nom ? `${l.nom}, ` : ''}${l.commune}` : 'lieu à préciser'; };
  async function ajouterSeance({ jour, heure = '', fin = '', spectacle_id, lieu_id = null, seance = {}, date = {}, suivi = {}, equipe = null }) {
    const d = dateVoisine(spectacle_id, lieu_id, jour);
    const rep = { jour, heure, fin, public: 'tout_public', annulee: false, lien: '', note: '', ...seance };
    if (d) {
      const F = dateVersForm(d);
      if (F.representations.some(r => r.jour === jour && (r.heure || '') === (heure || ''))) return { id: d.id, nouvelle: false, rien: true, texte: `déjà là : ${jourCourt(jour)}${heure ? ` à ${heureT(heure)}` : ''} (${ouDit(lieu_id)})` };
      const ids = new Set(F.representations.map(r => r.id));
      F.representations.push(rep);
      T.recents.set(d.id, Date.now());
      await ecrireDate(F, d, { libre: !!(d.intitule || '').trim() });
      const nouvelle = E.reps.find(r => r.date_id === d.id && !ids.has(r.id));
      // (ce que la ligne disait de la date elle-même, son statut, son suivi, son équipe, ne remplace pas celle qui existe : on le dit)
      const ignore = Object.keys(date).length || Object.values(suivi).some(v => v != null && v !== '') || (Array.isArray(equipe) && equipe.length);
      return { id: d.id, nouvelle: false, rep: nouvelle?.id, texte: `séance ajoutée à la date du ${jourCourt(d.debut)}${d.fin && d.fin !== d.debut ? ` au ${jourCourt(d.fin)}` : ''} (${ouDit(lieu_id)})${ignore ? ' ; le statut, le suivi et l’équipe de la ligne ne sont pas repris : la date existait, ils se règlent dans sa fiche' : ''}` };
    }
    const F = Object.assign(nouvelleDate(), { spectacle_id, lieu_id, debut: jour, fin: jour, representations: [rep] }, date);
    F.suivi = { ...F.suivi, ...suivi };
    if (equipe) F.equipe = ecartsPour({ id: -1, spectacle_id }, equipe, spectacle_id);
    const { id } = await ecrireDate(F, null);
    T.recents.set(id, Date.now());
    return { id, nouvelle: true, texte: `nouvelle date : ${jourCourt(jour)}, ${spectacle(spectacle_id)?.titre || ''} (${ouDit(lieu_id)})` };
  }
  // ce qu'on vient d'ajouter doit se voir : les filtres qui le cachent (eux seuls) se relâchent, et leurs boutons le montrent
  function montrerAjouts(ids) {
    const neutres = { periode: 'toutes', spectacle: '', saison: '', q: '' }, f0 = { ...T.f };
    const vus = f => { Object.assign(T.f, f); const xs = lignes(); return ids.every(id => xs.some(x => x.d.id === id)); };
    const cachent = Object.keys(neutres).filter(k => !vus({ ...neutres, [k]: f0[k] }));
    Object.assign(T.f, f0, ...cachent.map(k => ({ [k]: neutres[k] })));
    garderFiltres();
    $('#tab-q').value = T.f.q; $('#tab-saison').value = T.f.saison; $('#tab-sp').value = T.f.spectacle;
    $$('[data-tab-periode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tabPeriode === T.f.periode)));
  }
  // défaire un ajout : la date créée s'efface, ou la séance ajoutée part
  async function defaireAjout(a) {
    const d = E.dates.find(y => y.id === a.id); if (!d) return;
    T.recents.set(d.id, Date.now());
    if (a.nouvelle) { await effacerDate(d); return; }
    if (!a.rep) return;
    const F = dateVersForm(d);
    F.representations = F.representations.filter(r => r.id !== a.rep);
    if (F.representations.length) await ecrireDate(F, d, { libre: !!(d.intitule || '').trim() });
  }
  function formAjout() {
    const form = $('#tab-ajout'), b = $('#tab-plus');
    if (!form.hidden) { form.hidden = true; b.setAttribute('aria-expanded', 'false'); b.focus(); return; }
    form.hidden = false; b.setAttribute('aria-expanded', 'true');
    const sp0 = String(T.f.spectacle || (E.spectacles.slice().sort((x, y) => (y.page - x.page) || x.ordre - y.ordre)[0] || {}).id || '');
    form.innerHTML = `<h3>Ajouter une séance</h3><div class="tab-ajout-champs">
      <div class="champ"><label for="ta-jour">Jour</label><input id="ta-jour" ${natif() ? 'type="date"' : 'type="text" placeholder="jj/mm/aaaa"'} autocomplete="off"></div>
      <div class="champ"><label for="ta-heure">Heure</label><input id="ta-heure" ${natif() ? 'type="time" step="300"' : 'type="text" placeholder="20h30"'} autocomplete="off"></div>
      <div class="champ"><label for="ta-sp">Spectacle</label><select id="ta-sp">${choixSpectacles().map(([v, l]) => `<option value="${v}"${v === sp0 ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="champ ta-lieu"><span class="lib">Lieu</span><div id="ta-lieu"></div></div></div>
      <p class="aide">Une date du même spectacle au même lieu qui touche ce jour (le même, la veille ou le lendemain) reçoit la séance ; sinon une nouvelle date se crée.</p>
      <div class="fm-boutons"><button type="submit" class="btn principal">Ajouter</button><button type="button" class="btn" data-fermer>Fermer</button></div>`;
    let lieuId = null;
    comboLieu(form, 'ta-lieu', null, id => { lieuId = id; });
    $('#ta-lieu input', form).addEventListener('input', e => { if (!e.target.value.trim()) lieuId = null; });
    $('[data-fermer]', form).addEventListener('click', () => formAjout());
    form.onkeydown = e => { if (e.key === 'Escape' && !e.target.closest('.combo')) { e.preventDefault(); formAjout(); } };
    form.onsubmit = async e => {
      e.preventDefault();
      const jour = natif() ? $('#ta-jour', form).value : lireJour($('#ta-jour', form).value, AUJ), heure = natif() ? $('#ta-heure', form).value : lireHeure($('#ta-heure', form).value);
      if (!jour) { etat('Le jour n’est pas reconnu : écrivez par exemple 5/11/2026.', 'erreur'); return $('#ta-jour', form).focus(); }
      if (heure === undefined) { etat('L’heure n’est pas reconnue : écrivez par exemple 20h30.', 'erreur'); return $('#ta-heure', form).focus(); }
      const sp = +$('#ta-sp', form).value;
      if (!sp) { etat('Choisissez le spectacle.', 'erreur'); return; }
      const bouton = $('button[type=submit]', form);
      bouton.disabled = true;
      etat('Enregistrement…', 'encours');
      const tache = T.file.then(() => ajouterSeance({ jour, heure, spectacle_id: sp, lieu_id: lieuId }));
      T.file = tache.catch(() => {});
      try {
        const a = await tache;
        bouton.disabled = false;

  // ———— supprimer les séances choisies (Ctrl+Suppr) : une date sans plus de séance part entière, après confirmation
  async function supprimerLignes() {

    if (!xs.length) return;
    const parDate = new Map();
    xs.forEach(x => { if (!parDate.has(x.d.id)) parDate.set(x.d.id, { d: x.d, reps: new Set(), entiere: !x.r }); const g = parDate.get(x.d.id); if (x.r) g.reps.add(x.r.id); else g.entiere = true; });
    const groupes = [...parDate.values()].map(g => ({ ...g, entiere: g.entiere || repsDe(g.d.id).every(r => g.reps.has(r.id)) }));

      });
      delete suivi.modifie_le; delete suivi.modifie_par;
    }
    const r1 = await sb.from('crescite_dates').update({ lieu_id: cible }).eq('lieu_id', id);
    const r2 = r1.error ? r1 : await sb.from('crescite_seances').update({ lieu_id: cible }).eq('lieu_id', id);
    const r2b = r2.error || !suivi ? r2 : await sb.from('crescite_lieux_suivi').upsert(suivi, { onConflict: 'lieu_id' });

    const r2d = r2c.error || !E.carnetInstalle ? r2c : await sb.from('crescite_contacts').update({ lieu_id: cible }).eq('lieu_id', id).then(r => (r.error ? r : sb.from('crescite_hebergements').update({ lieu_id: cible }).eq('lieu_id', id)));
    const r3 = r2d.error ? r2d : await sb.from('crescite_lieux').delete().eq('id', id);
    if (r3.error) return erreur(r3.error, 'Fusion incomplète');
    E.dates.forEach(d => { if (d.lieu_id === id) d.lieu_id = cible; }); E.seances.forEach(s => { if (s.lieu_id === id) s.lieu_id = cible; }); E.lieux = E.lieux.filter(x => x.id !== id);
    [...(E.contacts || []), ...(E.hebergements || [])].forEach(x => { if (x.lieu_id === id) x.lieu_id = cible; });
    E.lieuxSuivi = E.lieuxSuivi.filter(x => x.lieu_id !== id && x.lieu_id !== cible).concat(suivi ? [suivi] : sc ? [sc] : []);

  $('[data-enregistrer]', zone).addEventListener('click', async e => {

    const r2 = await sb.from('crescite_lieux_suivi').upsert({ lieu_id: r.data.id, contact: G.contact || null, jauge: G.jauge, plateau: G.plateau || null, notes: G.notes || null }).select().single();

    E.lieuxSuivi = E.lieuxSuivi.filter(x => x.lieu_id !== r.data.id).concat([r2.data]);
    E.sale = false; annoncer('Lieu enregistré.');
    if (!l0) location.hash = `#/lieux/${r.data.id}`; else redessinerFiche(vueLieux, id);

}

function creerDateDepuisPiste(p) {
  const G = nouvelleDate();

const brancherParties = () => $$('[data-di-partie]').forEach(b => b.addEventListener('click', () => { location.hash = '#/diffusion' + (b.dataset.diPartie ? '/' + b.dataset.diPartie : ''); }));

function vueDiffusion(partie, id) {

          <div class="crm-colonne" data-colonne="${code}">

      ${p.contact_nom || p.contact_email ? `<div class="crm-carte-contact">👤 ${esc(p.contact_nom || '')} ${p.contact_email ? `· <a href="mailto:${esc(p.contact_email)}" class="btn lien" style="padding:0;font-size:12px">${esc(p.contact_email)}</a>` : ''}</div>` : ''}
      ${montantTxt ? `<div class="crm-carte-cession">${montantTxt}</div>` : ''}
      <div class="crm-carte-pied">

          <button type="button" class="btn petit" data-crm-perdue="${p.id}" title="Marquer perdue : la piste sort du pipeline (elle se rouvre)">Perdue</button>
          <button type="button" class="btn petit" data-crm-editer="${p.id}" title="Modifier">✎</button>

// une piste passe à une autre étape (ses flèches, son menu, la carte glissée d'une colonne à l'autre : menus.js) ; la carte
// glisse jusqu'à sa nouvelle colonne
async function deplacerProspect(id, etape) {
  const p = (E.prospects || []).find(x => x.id === id), e = ETAPES_CRM.find(x => x[0] === etape) || (etape === 'refus' ? ETAPE_PERDUE : null);
  if (!p || !e || p.etape === etape) return false;
  try {
    const { error } = await sb.from('crescite_diffusion_prospects').update({ etape, date_dernier_contact: aujourdhui() }).eq('id', id);
    if (error) throw error;
    p.etape = etape; p.date_dernier_contact = aujourdhui();
    if (etape === 'contrat_signe' && !p.date_convertie_id) annoncer(`Cession confirmée : ${p.structure}.`, { libelle: 'Créer la date', delai: 12000, action: () => creerDateDepuisPiste(p) });
    else annoncer(etape === 'refus' ? `Piste perdue : ${p.structure} (elle reste dans « Pistes perdues »).` : `Opportunité déplacée vers « ${e[1]} ».`);
    if (location.hash === '#/diffusion') { const places = reperer($('#kanban-zone') || document); vueDiffusion(); glisserVers(places, $('#kanban-zone')); } else rafraichirListes();
    return true;
  } catch (err) { erreur(err, 'Déplacement impossible'); return false; }
}
function brancherDiffusion() {
  $('#b-nouveau-prospect')?.addEventListener('click', () => ouvrirModaleProspect(null));

  $$('[data-crm-editer]').forEach(b => {
    b.addEventListener('click', () => {
      const p = E.prospects.find(x => x.id === +b.dataset.crmEditer);
      if (p) ouvrirModaleProspect(p);
    });
  });

  $$('[data-crm-deplacer]').forEach(b => {
    b.addEventListener('click', async () => {
      const p = E.prospects.find(x => x.id === +b.dataset.id);
      if (!p) return;
      const i = ETAPES_CRM.findIndex(e => e[0] === p.etape) + +b.dataset.crmDeplacer;
      if (i < 0 || i >= ETAPES_CRM.length) return;
      b.disabled = true;
      if (!(await deplacerProspect(p.id, ETAPES_CRM[i][0]))) b.disabled = false;
    });
  });

  $$('[data-crm-perdue]').forEach(b => b.addEventListener('click', async () => { b.disabled = true; if (!(await deplacerProspect(+b.dataset.crmPerdue, 'refus'))) b.disabled = false; }));
  $$('[data-crm-rouvrir]').forEach(b => b.addEventListener('click', async () => { b.disabled = true; if (!(await deplacerProspect(+b.dataset.crmRouvrir, 'contact_pris'))) b.disabled = false; }));
  $$('[data-crm-date]').forEach(b => b.addEventListener('click', () => { const p = E.prospects.find(x => x.id === +b.dataset.crmDate); if (p) creerDateDepuisPiste(p); }));

  $$('[data-crm-email]').forEach(b => {
    b.addEventListener('click', () => {
      const p = E.prospects.find(x => x.id === +b.dataset.crmEmail);
      if (p) ouvrirModaleEmailRelance(p);
    });
  });

  $$('[data-crm-supprimer]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = +b.dataset.crmSupprimer, p = E.prospects.find(x => x.id === id);
      if (!p) return;
      b.disabled = true;
      const fait = await CORBEILLE.ligne({ table: 'crescite_diffusion_prospects', ligne: p, quoi: `Opportunité supprimée : ${p.structure}.`, retabli: 'Opportunité rétablie.',
        apres: () => { const idx = E.prospects.findIndex(x => x.id === id); if (idx >= 0) E.prospects.splice(idx, 1); if (location.hash === '#/diffusion') vueDiffusion(); },
        apresRetour: x => { E.prospects.push(x); if (location.hash === '#/diffusion') vueDiffusion(); } });
      if (!fait) b.disabled = false;
    });
  });
}

function ouvrirModaleProspect(p) {
  const zone = $('#crm-modale-zone');
  if (!zone) return;
  const nouveau = !p;
  const spList = E.spectacles || [];

  zone.innerHTML = `
    <div style="position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;padding:16px;">
      <div role="dialog" aria-modal="true" aria-labelledby="t-mod-crm" style="background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:var(--ombre);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 id="t-mod-crm" style="margin:0;font-size:18px;">${nouveau ? 'Nouvelle opportunité' : 'Modifier l’opportunité'}</h2>
          <button type="button" class="btn petit" id="b-fermer-mod-crm" aria-label="Fermer" title="Fermer (Échap)">✕</button>
        </div>
        <form id="f-prospect-crm" novalidate${p ? ` data-piste-id="${p.id}"` : ''}>
          <div class="champ">
            <label for="crm-structure">Lieu / Structure / Festival *</label>
            <input type="text" id="crm-structure" value="${esc(p?.structure || '')}" required placeholder="Ex. Le Rayon Vert, Théâtre de Saint-Lô">
          </div>
          <div class="rangee">
            <div class="champ">
              <label for="crm-commune">Commune *</label>
              <input type="text" id="crm-commune" value="${esc(p?.commune || '')}" required placeholder="Ex. Saint-Valery-en-Caux">
            </div>
            <div class="champ">
              <label for="crm-dep">Département</label>
              <input type="text" id="crm-dep" value="${esc(p?.departement || '')}" placeholder="Ex. 76">
            </div>
          </div>
          <div class="rangee">
            <div class="champ">
              <label for="crm-sp">Spectacle ciblé</label>
              <select id="crm-sp">
                <option value="">-- Non spécifié --</option>
                ${spList.map(s => `<option value="${s.id}"${p && p.spectacle_id === s.id ? ' selected' : ''}>${esc(s.titre)}</option>`).join('')}
              </select>
            </div>
            <div class="champ">
              <label for="crm-etape">Étape dans le pipeline</label>
              <select id="crm-etape">
                ${[...ETAPES_CRM, ETAPE_PERDUE].map(([code, lib]) => `<option value="${code}"${p && p.etape === code ? ' selected' : ''}>${esc(lib)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="rangee">
            <div class="champ">
              <label for="crm-montant">Montant de cession estimé (€)</label>
              <input type="number" id="crm-montant" value="${p?.montant_estime || ''}" placeholder="Ex. 3200">
            </div>
            <div class="champ">
              <label for="crm-prochaine">Prochaine relance</label>
              <input type="date" id="crm-prochaine" value="${p?.date_prochaine_relance || ''}">
            </div>
          </div>
          <div class="rangee">
            ${E.diffusionReliee ? `<div class="champ">
              <label for="crm-lieu">Lieu (sa fiche)</label>
              <select id="crm-lieu"><option value="">— Pas encore de fiche —</option>${E.lieux.slice().sort((a, b) => norm(a.commune).localeCompare(norm(b.commune)) || norm(a.nom || '').localeCompare(norm(b.nom || ''))).map(l => `<option value="${l.id}"${p && p.lieu_id === l.id ? ' selected' : ''}>${esc(`${l.commune} — ${l.nom || 'lieu sans nom'}`)}</option>`).join('')}</select>
            </div>` : ''}
            <div class="champ">
              <label for="crm-dernier">Dernier contact</label>
              <input type="date" id="crm-dernier" value="${p?.date_dernier_contact || aujourdhui()}">
            </div>
          </div>
          <div class="rangee">
            <div class="champ">
              <label for="crm-contact-nom">Nom du contact</label>
              <input type="text" id="crm-contact-nom" value="${esc(p?.contact_nom || '')}" placeholder="Prénom Nom">
            </div>
            <div class="champ">
              <label for="crm-contact-email">Email du contact</label>
              <input type="email" id="crm-contact-email" value="${esc(p?.contact_email || '')}" placeholder="direction@theatre.fr">
            </div>
          </div>
          <div class="champ">
            <label for="crm-contact-tel">Téléphone du contact</label>
            <input type="tel" id="crm-contact-tel" value="${esc(p?.contact_tel || '')}" placeholder="02 35 00 00 00">
          </div>
          <div class="champ">
            <label for="crm-notes">Notes de suivi & échanges</label>
            <textarea id="crm-notes" rows="3" placeholder="Historique des discussions, conditions d'accueil souhaitées...">${esc(p?.notes || '')}</textarea>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" class="btn" id="b-annuler-crm">Annuler</button>
            <button type="submit" class="btn principal" id="b-sauver-crm">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  `;

  // une opportunité commencée ne se perd pas : ✕, Annuler, changer de rubrique posent la question si un champ a changé
  if (typeof GESTES !== 'undefined') GESTES.garder($('#f-prospect-crm'));
  const fermer = async () => { if (await partirSansPerdre({ titre: 'Fermer sans enregistrer ?', ok: 'Fermer sans enregistrer', dans: zone, avecFiche: false })) zone.innerHTML = ''; };
  $('#b-fermer-mod-crm')?.addEventListener('click', fermer);
  $('#b-annuler-crm')?.addEventListener('click', fermer);
  // Échap la ferme aussi, comme les fenêtres de l'équipe et le tiroir (la question d'abord si elle est commencée)
  zone.firstElementChild?.addEventListener('keydown', e => { if (e.key === 'Escape' && !e.defaultPrevented) { e.preventDefault(); e.stopPropagation(); fermer(); } });
  $('#crm-structure')?.focus({ preventScroll: true });

  $('#f-prospect-crm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const structure = ($('#crm-structure').value || '').trim();
    const commune = ($('#crm-commune').value || '').trim();
    if (!structure || !commune) return;

    const b = $('#b-sauver-crm');
    b.disabled = true;
    b.textContent = 'Enregistrement…';

    const donnes = {
      structure,
      commune,
      departement: ($('#crm-dep').value || '').trim() || null,
      spectacle_id: $('#crm-sp').value ? +$('#crm-sp').value : null,
      etape: $('#crm-etape').value || 'contact_pris',
      montant_estime: $('#crm-montant').value ? parseFloat($('#crm-montant').value) : null,
      date_prochaine_relance: $('#crm-prochaine').value || null,
      contact_nom: ($('#crm-contact-nom').value || '').trim() || null,
      contact_email: ($('#crm-contact-email').value || '').trim() || null,
      contact_tel: ($('#crm-contact-tel').value || '').trim() || null,
      notes: ($('#crm-notes').value || '').trim() || null,
      // (le dernier contact : ce que dit le champ ; corriger une faute ne le remet plus à aujourd'hui)
      date_dernier_contact: $('#crm-dernier').value || aujourdhui(),
      ...($('#crm-lieu') ? { lieu_id: $('#crm-lieu').value ? +$('#crm-lieu').value : null } : {})
    };

    try {
      if (nouveau) {
        const { data, error } = await sb.from('crescite_diffusion_prospects').insert(donnes).select();
        if (error) throw error;
        if (data && data.length) E.prospects.push(data[0]);
      } else {
        const { error } = await sb.from('crescite_diffusion_prospects').update(donnes).eq('id', p.id);
        if (error) throw error;
        Object.assign(p, donnes);
      }
      zone.innerHTML = '';
      const cible = nouveau ? E.prospects[E.prospects.length - 1] : p;
      if (donnes.etape === 'contrat_signe' && (nouveau || p.etape !== 'contrat_signe') && cible && !cible.date_convertie_id) annoncer('Opportunité enregistrée : cession confirmée.', { libelle: 'Créer la date', delai: 12000, action: () => creerDateDepuisPiste(cible) });
      else annoncer('Opportunité enregistrée.');
      vueDiffusion();
    } catch (err) {
      erreur(err, 'Enregistrement impossible');
      b.disabled = false;
      b.textContent = 'Enregistrer';
    }
  });
}

  const sp = E.spectacles.find(s => s.id === p.spectacle_id);

  const prenomContact = (p.contact_nom || '').split(' ')[0] || 'Madame, Monsieur';
  // signé par le contact diffusion de la compagnie (Textes du site → programmation) ; avec le lien personnel de l'invitation
  // à l'espace pro reliée à la piste, quand il y en a une, encore valable
  const pr = (E.textes.find(t => t.cle === 'programmation')?.valeur || {}).contact || {};
  const inv = (E.acces || []).find(a => a.prospect_id === p.id && a.actif && a.expire_le >= aujourdhui());
  const lien = inv && typeof lienPro === 'function' ? lienPro(inv) : `${new URL('../', location.href).href}#/espace-pro/programmer`;
  const objet = `Compagnie Crescite · Tournée « ${titreSp} »`;
  const corps = `Bonjour ${prenomContact},\n\n`
    + `Je me permets de revenir vers vous suite à nos échanges concernant la possible programmation de notre spectacle « ${titreSp} » au sein de ${p.structure}.\n\n`
    + `Nous finalisons actuellement notre calendrier de tournée et serions ravis de collaborer avec votre équipe sur cette saison.\n\n`
    + (inv ? `Les captations, la fiche technique et le dossier artistique vous attendent dans votre espace personnel :\n` : `Vous pouvez consulter les extraits vidéos, la fiche technique et le dossier artistique sur notre espace professionnel dédié :\n`)
    + `${lien}\n\n`
    + `Seriez-vous disponible cette semaine pour un court point téléphonique afin de faire le point sur vos créneaux et contraintes d'accueil ?\n\n`
    + `Bien chaleureusement,\n\n`
    + `${pr.nom ? `${pr.nom}${pr.role ? `, ${pr.role}` : ''}` : 'L’équipe de diffusion'}\nCompagnie Crescite · Rouen\n${pr.email || 'contact@crescite.fr'}${pr.telephone ? ` · ${pr.telephone}` : ''}`;

  zone.innerHTML = `
    <div style="position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;padding:16px;">
      <div style="background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);max-width:620px;width:100%;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:var(--ombre);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;font-size:18px;">Modèle de courriel de relance</h2>
          <button type="button" class="btn petit" id="b-fermer-mod-mel">✕</button>
        </div>
        <div class="champ">
          <label>Destinataire</label>
          <input type="text" readonly value="${esc(p.contact_email || 'Adresse non renseignée')}">
        </div>
        <div class="champ">
          <label>Objet</label>
          <input type="text" id="mel-objet" value="${esc(objet)}">
        </div>
        <div class="champ">
          <label>Message</label>
          <textarea id="mel-corps" rows="12">${esc(corps)}</textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:16px;">
          <button type="button" class="btn" id="b-copier-mel">📋 Copier le texte</button>
          ${p.contact_email ? `<a class="btn principal" id="b-mailto-mel" href="mailto:${encodeURIComponent(p.contact_email)}?subject=${encodeURIComponent(objet)}&body=${encodeURIComponent(corps)}" target="_blank" rel="noopener">✉ Ouvrir dans ma messagerie</a>` : ''}
          <button type="button" class="btn" id="b-relance-faite" title="Dernier contact : aujourd’hui ; prochaine relance dans quinze jours">Relance faite</button>
          <button type="button" class="btn" id="b-fermer-mel">Fermer</button>
        </div>
      </div>
    </div>
  `;

  const fermer = () => { zone.innerHTML = ''; };
  $('#b-fermer-mod-mel')?.addEventListener('click', fermer);
  $('#b-fermer-mel')?.addEventListener('click', fermer);
  $('#b-relance-faite')?.addEventListener('click', async () => {
    const maj = { date_dernier_contact: aujourdhui(), date_prochaine_relance: AGENDA.iso(new Date(Date.now() + 15 * 864e5)) };
    const { error } = await sb.from('crescite_diffusion_prospects').update(maj).eq('id', p.id);
    if (error) return erreur(error);
    Object.assign(p, maj); fermer(); annoncer(`Relance notée : prochaine le ${jourCourt(maj.date_prochaine_relance)}.`);

      annoncer('Texte copié dans le presse-papier.');

  });
}

// ===================================================================================================== demandes de devis
// Les demandes de proposition de cession déposées sur le site (« Je souhaite programmer », le simulateur d'accueil) : la
// demande telle que le programmateur l'a écrite, et son suivi (le statut, les notes internes), qu'il ne voit jamais. Elles
// arrivent en direct (le canal du septième script).
const STATUTS_DEVIS = [['nouveau', 'Nouvelle', 'option'], ['en_cours', 'En cours', 'sco'], ['devis_envoye', 'Devis envoyé', 'sco'],
  ['confirme', 'Confirmée', 'ok'], ['sans_suite', 'Sans suite', '']];
const TYPES_LIEU_DEVIS = { theatre: 'Théâtre, scène équipée', polyvalente: 'Salle polyvalente', etablissement: 'Établissement scolaire, in situ',
  exterieur: 'Cour, extérieur', autre: 'Autre lieu, tiers-lieu' };
const badgeDevis = s => { const [, l, c] = STATUTS_DEVIS.find(x => x[0] === s) || [s, s || 'Nouvelle', 'option']; return `<span class="badge${c ? ` ${c}` : ''}">${esc(l)}</span>`; };
function vueDevis(id) {
  const f = session.devis = Object.assign({ q: '', statut: '' }, session.devis || {});
  cadre('diffusion', `<div class="tete"><h1>Diffusion · Demandes de devis</h1>${partiesDiffusion('devis')}</div>
    <div class="deux${id ? ' edition' : ''}"><div class="liste"><div class="filtres">
      <input type="search" id="dv-q" placeholder="Chercher une structure, une commune, un contact" value="${esc(f.q)}" aria-label="Chercher une demande">
      <select id="dv-statut" aria-label="Statut"><option value="">Tous les statuts</option>${STATUTS_DEVIS.map(([k, l]) => `<option value="${k}"${f.statut === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <span class="compte" id="dv-compte"></span></div><div data-liste id="l-devis"></div></div>
    <section class="editeur" id="ed-devis">${id ? '' : '<div class="vide bloc">Les demandes de proposition déposées sur le site par les programmateurs (« Je souhaite programmer ») : à qui répondre, et où en est chacune. Le statut et les notes ne sont jamais montrés au programmateur.</div>'}</section></div>`);
  brancherParties();
  const zone = $('#l-devis');
  zone.rafraichir = () => listeDevis(zone, id);
  zone.rafraichir();
  $('#dv-q').addEventListener('input', e => { f.q = e.target.value; garderFiltres(); zone.rafraichir(); });
  $('#dv-statut').addEventListener('change', e => { f.statut = e.target.value; garderFiltres(); zone.rafraichir(); });
  if (id) editeurDevis(id);
}
// les nouvelles d'abord, puis les plus récentes
function listeDevis(zone, actif) {
  const f = session.devis, q = norm(f.q).trim();
  const xs = (E.devis || []).filter(d => (!f.statut || d.statut === f.statut)
      && (!q || norm(`${d.structure_nom} ${d.commune} ${d.departement || ''} ${d.contact_nom} ${d.contact_email} ${spectacle(d.spectacle_id)?.titre || ''}`).includes(q)))
    .sort((a, b) => (a.statut === 'nouveau' ? 0 : 1) - (b.statut === 'nouveau' ? 0 : 1) || String(b.cree_le).localeCompare(String(a.cree_le)));
  $('#dv-compte').textContent = `${xs.length} demande${xs.length > 1 ? 's' : ''}`;
  zone.innerHTML = xs.map(d => {
    const sp = spectacle(d.spectacle_id), j = String(d.cree_le || '').slice(0, 10);
    return `<a class="ligne" href="#/diffusion/devis/${d.id}" style="--c:${sp ? couleurSp(sp) : 'var(--gris)'}"${String(actif) === String(d.id) ? ' aria-current="true"' : ''}>
      <span class="jj">${j ? `<b>${+j.slice(8, 10)}</b>${MC[+j.slice(5, 7) - 1]}` : ''}</span>
      <span class="corps"><span class="t">${esc(d.structure_nom)}</span><span class="ou">${esc([d.commune, sp?.titre, d.contact_nom].filter(Boolean).join(' · '))}</span></span>
      <span class="badges">${badgeDevis(d.statut)}</span></a>`;
  }).join('') || listeVide((E.devis || []).length > 0, { rien: 'Aucune demande ne correspond.', aucun: 'Aucune demande pour l’instant.' });
}
function editeurDevis(id) {
  const d0 = (E.devis || []).find(x => x.id === id);
  const zone = zoneNeuve('#ed-devis');
  if (!d0) { zone.innerHTML = '<div class="vide bloc">Cette demande n’existe plus.</div>'; return; }
  requestAnimationFrame(() => tt('ouvrir', zone, { sens: 'gauche' }));
  const F = { statut: d0.statut || 'nouveau', notes_internes: d0.notes_internes || '' };
  const sp = spectacle(d0.spectacle_id), recue = d0.cree_le ? new Date(d0.cree_le) : null;
  const fiche = (l, v) => (v ? `<dt>${esc(l)}</dt><dd>${v}</dd>` : '');
  const SPEC = [{ k: 'statut', t: 'choix', l: 'Statut', choix: STATUTS_DEVIS.map(([k, l]) => [k, l]) },
    { k: 'notes_internes', t: 'long', l: 'Notes internes', lignes: 5, ph: 'Appel du …, devis envoyé le …, conditions…' }];
  nChamp = 0;
  zone.innerHTML = `<div class="titre-ed"><a class="btn petit" data-tt="retour" href="#/diffusion/devis" title="Retour à la liste">←</a><h2>${esc(d0.structure_nom)}</h2></div>
    <div class="bloc"><h3>La demande</h3><dl class="dv-fiche">
      ${fiche('Reçue le', recue ? esc(recue.toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short' })) : '')}
      ${fiche('Spectacle', esc(sp ? sp.titre : 'Pas précisé'))}
      ${fiche('Lieu', esc([TYPES_LIEU_DEVIS[d0.type_lieu] || d0.type_lieu, `${d0.commune}${d0.departement ? ` (${d0.departement})` : ''}`].filter(Boolean).join(' · ')))}
      ${fiche('Plateau', esc(d0.dimensions_plateau || ''))}
      ${fiche('Jauge', d0.jauge_estimee != null ? esc(`${d0.jauge_estimee} places`) : '')}
      ${fiche('Période', esc(d0.periode_souhaitee || ''))}
      ${fiche('Contact', `${esc(d0.contact_nom)}<span class="sous-champ">${liensCoordonnees([d0.contact_email, d0.contact_tel].filter(Boolean).join(' '))}</span>`)}
    </dl>${d0.message ? `<p class="dv-message">${esc(d0.message)}</p>` : ''}</div>
    <div class="bloc" id="dv-suite"></div>
    ${typeof MODELES !== 'undefined' ? '<div class="bloc" id="dv-documents"></div>' : ''}
    <div class="bloc" id="dv-suivi"><h3>Le suivi <span class="aide" style="font-weight:400">— jamais montré au programmateur</span></h3>${SPEC.map(c => champ(c, F)).join('')}</div>
    ${pied('Tout est enregistré', '<button type="button" class="btn danger" id="dv-suppr">Supprimer</button>')}`;
  relier($('#dv-suivi', zone), F, SPEC);
  // la suite d'une demande, d'un geste : la piste de diffusion qu'elle devient, la fiche de son lieu, le devis (modeles.js)
  const piste = () => (d0.prospect_id ? (E.prospects || []).find(p => p.id === d0.prospect_id) : null);
  const dessinerSuite = () => {
    const p = piste(), l = d0.lieu_id != null ? lieu(d0.lieu_id) : null;
    $('#dv-suite', zone).innerHTML = `<h3>Et ensuite</h3><div class="fm-boutons">
      ${p ? `<a class="btn" href="#/diffusion/piste/${p.id}">La piste : ${esc(etapeLib(p.etape))}</a>` : `<button type="button" class="btn principal" data-dv="piste">Créer la piste de diffusion</button>`}
      ${l ? `<a class="btn" href="#/lieux/${l.id}">Le lieu : ${esc(l.nom || l.commune)}</a>` : `<button type="button" class="btn" data-dv="lieu">Créer la fiche du lieu</button>`}</div>
      <p class="aide">La piste reprend la structure, le contact, le spectacle et la demande ; le lieu, sa commune et son type. Le devis se génère ci-dessous, rempli depuis la demande.</p>`;
  };
  dessinerSuite();
  if ($('#dv-documents', zone)) MODELES.bloc($('#dv-documents', zone), { demande: d0 });
  $('#dv-suite', zone).addEventListener('click', async e => {
    const b = e.target.closest('[data-dv]'); if (!b) return;
    b.disabled = true;
    try {
      if (b.dataset.dv === 'piste') {
        const ligne = { structure: d0.structure_nom, commune: d0.commune, departement: d0.departement || null, spectacle_id: d0.spectacle_id ?? null, contact_nom: d0.contact_nom || null,
          contact_email: d0.contact_email || null, contact_tel: d0.contact_tel || null, etape: 'contact_pris', date_dernier_contact: aujourdhui(),
          notes: [`Demande de devis du ${d0.cree_le ? jourCourt(String(d0.cree_le).slice(0, 10)) : 'site'}.`, d0.periode_souhaitee ? `Période : ${d0.periode_souhaitee}.` : '', d0.message || ''].filter(Boolean).join(' '),
          ...(E.diffusionReliee && d0.lieu_id != null ? { lieu_id: d0.lieu_id } : {}) };
        const { data: p, error } = await sb.from('crescite_diffusion_prospects').insert(ligne).select().single();
        if (error) throw error;
        E.prospects.push(p);
        const maj = { ...(E.diffusionReliee ? { prospect_id: p.id } : {}), ...((d0.statut || 'nouveau') === 'nouveau' ? { statut: 'en_cours' } : {}) };
        if (Object.keys(maj).length) { const r = await sb.from('crescite_devis_demandes').update(maj).eq('id', d0.id); if (r.error) throw r.error; Object.assign(d0, maj); F.statut = d0.statut; }
        annoncer(`Piste créée : ${p.structure}.`, { libelle: 'Voir', action: () => { location.hash = `#/diffusion/piste/${p.id}`; } });
      } else {
        if (!(d0.departement || '').trim()) { annoncer('La demande ne dit pas le département : créez le lieu dans Lieux.', { erreur: true }); b.disabled = false; return; }
        const type = { etablissement: 'etablissement', theatre: 'salle', polyvalente: 'salle', exterieur: 'autre', autre: 'autre' }[d0.type_lieu] || 'salle';

const secteurAlerte = a => {

const champsChanges = j => j.avant && j.apres ? Object.keys(j.apres).filter(k => !['modifie_le', 'modifie_par'].includes(k) && JSON.stringify(j.avant[k]) !== JSON.stringify(j.apres[k])) : [];
// le journal : les dernières modifications, filtrées sans requête : une rubrique ou une table, un auteur, une période
// (aujourd'hui, 7 ou 30 jours, ou deux dates), et des mots cherchés dans ce que dit chaque ligne (son résumé, les champs
// changés et leurs valeurs avant et après, ce qui est allé dans les fiches, l'auteur). Les filtres restent le temps de la
// session. « Lire plus ancien » ajoute 300 modifications ; quand une période remonte plus loin que ce qui est lu, le dit.
const RUBRIQUES_JOURNAL = [['representations', 'Représentations', ['crescite_dates', 'crescite_representations', 'crescite_dates_suivi', 'crescite_dates_chiffres', 'crescite_equipes']],
  ['feuilles', 'Feuilles de route', ['crescite_feuilles']], ['spectacles', 'Spectacles', ['crescite_spectacles', 'crescite_distributions', 'crescite_documents']],
  ['equipe', 'Équipe', ['crescite_personnes']], ['ateliers', 'Ateliers', ['crescite_ateliers', 'crescite_seances']], ['lieux', 'Lieux', ['crescite_lieux', 'crescite_lieux_suivi', 'crescite_contacts', 'crescite_hebergements']],
  ['diffusion', 'Diffusion', ['crescite_diffusion_prospects', 'crescite_devis_demandes', 'crescite_documents_generes', 'crescite_acces_pro']],
  ['planning', 'Planning', ['crescite_propositions']], ['frais', 'Frais et matériel', ['crescite_notes_frais', 'crescite_materiel']], ['notes', 'Notes internes', ['crescite_notes']],

      return `${enTeteJour(j)}<div class="journal-ligne"><span class="quand">${new Date(j.quand).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })}<br>${esc(qui(j.qui))}</span>
        <span class="quoi"><b>${OPS_JOURNAL[j.operation]} · ${esc(NOMS_TABLES[j.table_nom] || j.table_nom)}</b>${surlignerRch(resume(j) || '', mots)}${ch.length ? `<span class="diff"> — ${surlignerRch(ch.join(', '), mots)}</span>` : ''}${ap.length ? `<span class="diff appris"> — gardé dans les fiches : ${esc(ap.join(', '))}</span>` : ''}</span>
        <span>${j.operation === 'INSERT' ? `<button class="btn petit" data-j="${j.id}" data-tt="retour">Retirer</button>` : `<button class="btn petit" data-j="${j.id}" data-tt="retour">Revenir</button>`}</span></div>`; }).join('')
      || listeVide(total > 0, { rien: 'Aucune modification ne correspond.', aucun: 'Rien encore.' });
    if (premier && !CALME_ADMIN()) zone.classList.add('ad-neuf');       // la première liste se pose
    const plusVieux = E.journal.length ? jourDe(E.journal[E.journal.length - 1]) : AUJ, de = debutPeriode();
    $('#j-compte').textContent = `${filtre ? `${xs.length} sur ${total}` : total} modification${total > 1 ? 's' : ''}${E.journalFin ? '' : `, depuis le ${jourCourt(plusVieux)}`}`;
    $('#j-effacer').hidden = !filtre;
    $('#j-plus-zone').innerHTML = E.journalFin ? '' : `${filtre && (!de || de < plusVieux) ? `<span class="aide">Le journal lu remonte au ${esc(jourCourt(plusVieux))} : il y a plus ancien.</span>` : ''}<button type="button" class="btn" id="j-plus">Lire ${PAGE_JOURNAL} modifications plus anciennes</button>`;
    clearTimeout(dessiner.minuteur);
    dessiner.minuteur = setTimeout(() => { const a = $('#j-annonce'); if (a && filtre) a.textContent = $('#j-compte')?.textContent || ''; }, 500);
  };
  zone.rafraichir = async () => { await rechargerJournal(); if (zone.isConnected) dessiner(); };
  dessiner();
  const maj = () => { garderFiltres(); dessiner(); };
  $('#j-q').addEventListener('input', e => { f.q = e.target.value; maj(); });
  $('#j-quoi').addEventListener('change', e => { f.quoi = e.target.value; maj(); });
  $('#j-qui').addEventListener('change', e => { f.qui = e.target.value; maj(); });
  $('#j-periode').addEventListener('change', e => { f.periode = e.target.value; $('.j-dates').hidden = f.periode !== 'choisir'; maj(); if (f.periode === 'choisir') $('#j-du').focus(); });
  $('#j-du').addEventListener('change', e => { f.du = e.target.value; maj(); });
  $('#j-au').addEventListener('change', e => { f.au = e.target.value; maj(); });
  $('#j-effacer').addEventListener('click', () => {
    Object.assign(f, { q: '', quoi: '', qui: '', periode: '', du: '', au: '' });
    ['#j-q', '#j-quoi', '#j-qui', '#j-periode', '#j-du', '#j-au'].forEach(k => { $(k).value = ''; });
    $('.j-dates').hidden = true; maj(); $('#j-q').focus();
  });
  $('#j-plus-zone').addEventListener('click', async e => {
    const b = e.target.closest('#j-plus'); if (!b) return;
    b.disabled = true; b.textContent = 'Lecture…';
    try { await journalPlusAncien(); remplirAuteurs(); dessiner(); $('#j-plus')?.focus(); } catch (err) { erreur(err, 'Lecture impossible'); b.disabled = false; }
  });
  zone.addEventListener('click', async e => {
    const b = e.target.closest('[data-j]'); if (!b) return;
    const j = E.journal.find(x => x.id === +b.dataset.j); if (!j) return;
    b.disabled = true;
    // sans confirmation : la ligne revient comme avant, et l'annonce porte « Rétablir » (corbeille.js)
    await CORBEILLE.inverser(j, { annonce: j.operation === 'INSERT' ? 'Ligne retirée.' : j.operation === 'UPDATE' ? 'La ligne est revenue comme avant la modification.' : 'Ligne rétablie.', apres: () => zone.rafraichir() });
    b.disabled = false;
  });
}
</script>
