<!doctype html>
<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<!-- la nuit par défaut, quel que soit l'appareil (data-theme="nuit" sur <html>, comme le site public) ; le jour reste dans
     la feuille de style, sous data-theme="jour" seulement -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1117">
<!-- l'icône d'onglet : celle des espaces réservés, à la couleur de la saison (faite par site/build.py, equipe(dest)) -->
<link rel="icon" href="../equipe/icones/192.png" type="image/png">
<link rel="apple-touch-icon" href="../equipe/icones/180.png">
<!-- l'administration installable sur le téléphone (manifest.webmanifest, sw.js, que mobile.js enregistre) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin Crescite">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Administration · Compagnie Crescite</title>
<!-- les polices de la compagnie (celles du site) : Ubuntu pour les titres, Open Sans pour le texte, Raleway pour les étiquettes ; sans réseau, le système -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Open+Sans:wght@400;500;600;700&family=Raleway:wght@600;700;800&display=swap" crossorigin>
<style>
/* La charte du site public (site/src/index.html) : ses neutres (le papier, l'encre, le filet), ses polices, sa
   nuit par défaut ; l'accent est la couleur de la saison (règle 22 du contrat), que site/build.py pose après cette
   feuille (poser_saison : --saison, --saison-texte, --saison-porteur…). Sans le build, un gris neutre à sa place.
   habillage.js, chargé en dernier, en tire l'apparence de l'administration. */
:root {
  --saison: #4f4850; --saison-vive: #b7b0ae; --saison-porteur: #5c545d; --saison-profond: #2b272c; --saison-texte: #4f4850;
  --saison-fonce: #3f3940; --saison-doux: #efebe6; --saison-texte-nuit: #b7b0ae; --saison-fonce-nuit: #d0cbc9; --saison-doux-nuit: #2e2629;
  --fond: #f6f2eb; --carte: #fffdf9; --encre: #1d1418; --gris: #5f565a; --trait: #dcd3c6; --doux: #ece5da;
  --accent: var(--saison-texte); --accent-fonce: var(--saison-fonce); --accent-doux: var(--saison-doux); --sur-accent: #fff; --ok: #1d6f47; --ok-doux: #e3f3ea;
  --alerte: #b3261e; --alerte-doux: #fbe7e5; --option: #7a5a10; --option-doux: #f8efd9; --ombre: 0 1px 2px rgba(30, 20, 30, .06), 0 4px 18px rgba(30, 20, 30, .06);
  --rayon: 12px; --police: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --titres: "Ubuntu", "Open Sans", system-ui, sans-serif; --etiq: "Raleway", "Open Sans", system-ui, sans-serif;
  color-scheme: light;
  /* les tentacules (tentacules.js) : à l'encre de l'administration, empreintes et confirmations à la couleur d'accent */
  --tt-encre: var(--encre); --tt-accent: var(--accent); --tt-neutre: var(--gris); --tt-fond: var(--carte); --tt-epaisseur: 2.2;
}
/* la nuit, par défaut (data-theme="nuit", ou rien) ; le jour seulement sous data-theme="jour" */
:root:not([data-theme="jour"]) {
  --fond: #1b1117; --carte: #2e2128; --encre: #f3eee9; --gris: #b7b0ae; --trait: #3b3036; --doux: #23171e;
  --accent: var(--saison-texte-nuit); --accent-fonce: var(--saison-fonce-nuit); --accent-doux: var(--saison-doux-nuit);
  --sur-accent: #1b1117;   /* le texte posé sur l'accent : la nuit, l'accent est clair */ --ok: #6fd3a0; --ok-doux: #1d3329;
  --alerte: #ff8a80; --alerte-doux: #3a1f1d; --option: #e9c46a; --option-doux: #352b17; --ombre: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fond); color: var(--encre); font: 15px/1.5 var(--police); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* le lien d'évitement, comme sur le site et dans l'équipe : hors de l'écran, il paraît au premier Tab */
.evitement { position: absolute; left: 8px; top: -80px; z-index: 90; padding: 10px 14px; border-radius: 10px; background: var(--encre); color: var(--carte); font-weight: 600; text-decoration: none; }
.evitement:focus { top: 8px; }

/* le pied commun des espaces réservés (PIED) : sobre, en fin de contenu */
.pied-espace { display: flex; flex-wrap: wrap; align-items: center; gap: 0 22px; max-width: 1500px; margin: 8px auto 0; padding: 18px 20px 26px; border-top: 1px solid var(--trait); color: var(--gris); font-size: 13px; }
.pied-espace .pied-nom { margin: 0; font-family: var(--titres); font-weight: 500; color: var(--encre); }
.pied-espace nav { display: flex; flex-wrap: wrap; gap: 0 18px; }
/* chaque lien du pied, une cible de 44 px (la ligne reste sobre : la hauteur ne se voit pas) */
.pied-espace a { display: inline-flex; align-items: center; min-height: 44px; color: var(--gris); text-underline-offset: .2em; }
.pied-espace a:hover { color: var(--accent); }
.connexion:has(+ .pied-espace) { min-height: calc(100vh - 80px); }
.connexion + .pied-espace, .connexion + .pied-espace nav { justify-content: center; margin-top: 0; border-top: 0; text-align: center; }

/* en-tête */
.barre { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: var(--carte); border-bottom: 1px solid var(--trait); }
.marque { display: flex; align-items: baseline; gap: 8px; font-weight: 800; letter-spacing: .02em; text-decoration: none; color: var(--encre); white-space: nowrap; }
.marque small { font-weight: 500; color: var(--gris); letter-spacing: 0; }
.marque .pieuvre { display: inline-block; flex: none; align-self: center; width: 42px; height: 24px; color: var(--pieuvre, var(--accent)); }
.marque .pieuvre:empty { display: none; }
.marque .pieuvre svg { display: block; width: 100%; height: 100%; overflow: visible; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav a { padding: 7px 12px; border-radius: 999px; text-decoration: none; color: var(--gris); font-weight: 600; white-space: nowrap; }
.nav a:hover { background: var(--doux); color: var(--encre); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--sur-accent, #fff); }
.qui { display: flex; align-items: center; gap: 10px; color: var(--gris); font-size: 13px; white-space: nowrap; }
.direct { display: inline-flex; align-items: center; gap: 6px; }
.direct::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #b9b0bb; flex: none; }
.direct.on::before { background: #2bb673; box-shadow: 0 0 0 3px rgba(43, 182, 115, .18); }
/* le témoin de la connexion (majTemoin) : la pastille (à jour, lu il y a…, reconnexion, hors ligne), le mot, l'icône ;
   le tout est le bouton qui relit la base. L'en-tête est de nuit : des couleurs qui s'y lisent */
.temoin { min-height: 32px; padding: 4px 9px 4px 10px; border: 1px solid transparent; border-radius: 999px; background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
.temoin:hover { border-color: rgba(255, 255, 255, .25); color: #fff; }
.temoin-ic { flex: none; opacity: .75; }
.temoin[data-etat="ajour"]::before { background: #4fd68e; }
.temoin[data-etat="lu"]::before { background: #e9c46a; }
.temoin[data-etat="horsligne"] { color: #f2d48c; border-color: rgba(233, 196, 106, .45); }
.temoin[data-etat="horsligne"]::before { background: transparent; box-shadow: inset 0 0 0 2px #e9c46a; }
.temoin[data-etat="reconnexion"]::before, .temoin[data-etat="lecture"]::before { background: #e9c46a; }
@media (prefers-reduced-motion: no-preference) {
  .temoin:is([data-etat="reconnexion"], [data-etat="lecture"])::before { animation: temoin-cherche 1.2s ease-in-out infinite; }
  .temoin[data-etat="lecture"] .temoin-ic { animation: temoin-tourne .9s linear infinite; }
  @keyframes temoin-cherche { 50% { opacity: .3; } }
  @keyframes temoin-tourne { to { transform: rotate(360deg); } }
}
/* hors ligne ou à la reconnexion, le témoin prend la place de l'adresse du compte (l'en-tête garde ses lignes) */
.qui:has(.temoin:is([data-etat="horsligne"], [data-etat="reconnexion"])) .moi { display: none !important; }
@media (max-width: 860px) { .temoin-detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .temoin { padding: 4px 8px; } .temoin:is([data-etat="horsligne"], [data-etat="reconnexion"]) .temoin-ic { display: none; } }
/* l'aide (« ? ») : un bouton discret dans l'en-tête, à l'ordinateur */
.barre .aide-b { min-width: 32px; padding-left: 0; padding-right: 0; font-weight: 800; }
/* L'en-tête tient sur une ligne, ou sur deux, à toutes les largeurs (rangerBarre le mesure, à chaque rendu et quand la
   fenêtre change) : la marque, la recherche, les rubriques, le compte. Quand tout ne tient pas sur une ligne, les rubriques
   passent sur la seconde (.deux-lignes). Ce qui ne tient pas encore se replie, dans cet ordre : l'adresse du compte
   (.r-moi), le mot « Rechercher » (.r-mot), les mots longs (.r-long), les liens du compte, qui passent dans « Plus »
   (.r-compte), « Administration » sous le nom (.r-marque), la loupe seule (.r-loupe) ; les rubriques qui ne tiennent pas
   sur leur ligne passent dans « Plus », comme au téléphone, la rubrique courante restant en vue. Un écran bas (500 px de
   haut au plus : un téléphone couché) garde une seule ligne, arrimée si elle tient dans 64 px (sinon .defile : elle défile
   avec la page). Au téléphone en portrait (mobile.js), les rubriques sont dans la barre du bas. */
/* (les rubriques ne débordent jamais : overflow coupe au cas où ; un peu d'air autour garde l'ombre de la rubrique
   courante et l'anneau du focus, sans changer la hauteur) */
.barre .nav { flex: 1 1 auto; min-width: 0; overflow: hidden; align-items: center; padding: 6px 4px 12px; margin: -6px -4px -12px; }
.barre .qui { margin-left: auto; }
.barre.deux-lignes { flex-wrap: wrap; row-gap: 6px; }
.barre.deux-lignes .nav { order: 3; flex-basis: 100%; }
.barre.defile { position: relative; }
.barre.r-moi .qui .moi, .barre.r-mot .chercher .mot, .barre.r-long .long, .barre.r-loupe .chercher kbd { display: none; }
.barre.r-compte .qui > :not(.direct) { display: none; }
.barre.r-marque .marque { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 8px; row-gap: 2px; line-height: 1.1; }
.barre.r-marque .marque .pieuvre { grid-row: span 2; }
.barre.r-marque .marque small { font-size: 10.5px; }
.barre.r-loupe .chercher { width: 40px; height: 40px; padding: 0; justify-content: center; border-radius: 50%; }
/* au doigt (une tablette, un téléphone couché), chaque rubrique et « Plus » sont des cibles de 44 px */
@media (pointer: coarse) { .barre .nav a, .barre .nav-plus { display: inline-flex; align-items: center; min-height: 44px; } .barre.r-loupe .chercher { width: 44px; height: 44px; } }
/* « Plus » : au bout des rubriques, il ouvre sous lui les rubriques qui n'ont pas tenu, puis le compte (.r-compte) */
.nav-plus { display: inline-flex; align-items: center; gap: 6px; flex: none; margin-left: 2px; padding: 7px 12px; border: 0; border-radius: 999px; background: none; color: inherit; font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer; }
.barre .nav > [hidden] { display: none !important; }
.nav-plus svg { transition: transform .15s; }
.nav-plus[aria-expanded="true"] svg { transform: rotate(180deg); }
.nav-autres { position: absolute; z-index: 40; display: none; flex-direction: column; gap: 2px; width: max-content; min-width: 230px; max-width: calc(100vw - 16px); overflow: auto; overscroll-behavior: contain; padding: 6px; background: var(--carte); color: var(--encre); border: 1px solid var(--trait); border-radius: 12px; box-shadow: 0 14px 40px rgba(10, 5, 10, .35); text-transform: none; letter-spacing: 0; }
.nav-autres.ouvert { display: flex; }
.nav-autres .na-titre { margin: 6px 12px 2px; }
.nav-autres .na-item + .na-titre { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--trait); }
.nav-autres .na-titre { font: 700 11px/1.2 var(--etiq, inherit); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.nav-autres .na-moi { margin: 0 12px 4px; font-size: 12.5px; color: var(--gris); overflow-wrap: anywhere; }
.nav-autres .na-item { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 0; border-radius: 9px; background: none; color: var(--encre); font: inherit; font-weight: 650; text-align: left; text-decoration: none; cursor: pointer; }
.nav-autres .na-item:hover, .nav-autres .na-item:focus-visible { background: var(--doux); }
.nav-autres .na-item[aria-current="page"] { background: var(--accent-doux); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
@media (max-width: 860px) { .barre { gap: 8px 14px; padding: 8px 12px; } }
@media (max-width: 520px) { .qui { gap: 10px; font-size: 12.5px; } .qui .long, .direct .mot { display: none; } }
/* la recherche rapide : le bouton de l'en-tête (la loupe, « Rechercher », le raccourci Ctrl K ou ⌘K) et sa fenêtre.
   La loupe, le mot et le raccourci, tant qu'ils tiennent (rangerBarre : .r-mot, .r-loupe) ; au téléphone, la loupe seule,
   au bout de la ligne de la marque */
.chercher { display: inline-flex; align-items: center; gap: 8px; flex: none; min-height: 34px; padding: 4px 6px 4px 10px; border: 1px solid var(--trait); border-radius: 9px; background: var(--doux); color: var(--gris); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.chercher:hover { border-color: var(--gris); color: var(--encre); }
.chercher svg { flex: none; }
.chercher .mot { padding-right: 22px; }
/* le raccourci s'écrit par la feuille de style : ce que montre le bouton reste dans son nom (« Rechercher ») */
.chercher kbd[data-touche]::before { content: attr(data-touche); }
kbd { font: 650 11.5px/1 var(--police); padding: 3px 5px 2px; border: 1px solid var(--trait); border-bottom-width: 2px; border-radius: 5px; background: var(--carte); color: var(--gris); white-space: nowrap; }
dialog.recherche { width: min(640px, calc(100% - 24px)); max-width: none; max-height: min(580px, calc(100dvh - 24px)); margin: max(12px, 9vh) auto auto; padding: 0; border: 1px solid var(--trait); border-radius: 14px; background: var(--carte); color: var(--encre); box-shadow: 0 18px 60px rgba(20, 10, 20, .3); overflow: hidden; }
dialog.recherche[open] { display: flex; }
dialog.recherche::backdrop { background: rgba(23, 15, 26, .4); }
.rch-boite { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.rch-tete { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-bottom: 2px solid var(--trait); }
.rch-tete:focus-within { border-bottom-color: var(--accent); }
.rch-tete svg { flex: none; color: var(--gris); }
.rch-tete input[type=text] { flex: 1; min-width: 0; border: 0; background: none; font-size: 17px; padding: 6px 0; min-height: 42px; box-shadow: none; }
.rch-entete { margin: 0; padding: 10px 18px 4px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); }
.rch-liste { list-style: none; margin: 0; padding: 2px 8px 8px; overflow: auto; overscroll-behavior: contain; flex: 1; min-height: 0; }
.rch-liste [role=option] { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.rch-liste [role=option][aria-selected=true] { background: var(--accent-doux); }
.rch-liste .pastille { --c: var(--trait); }
.rch-corps { flex: 1; min-width: 0; display: grid; }
.rch-corps b, .rch-corps small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rch-corps small { color: var(--gris); font-size: 13px; }
.rch-type { flex: none; font-size: 12px; font-weight: 700; color: var(--gris); }
.rch-liste mark { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 3px; color: inherit; text-decoration: underline 2px var(--accent); text-underline-offset: 3px; }
/* le passage qui a trouvé la fiche (un téléphone, une adresse, un jour), sous sa ligne ; l'intitulé du second groupe */
.rch-corps .rch-passage { font-size: 12.5px; }
.rch-passage > span { font-weight: 700; }
.rch-liste .rch-groupe { margin: 10px 10px 2px; padding-top: 8px; border-top: 1px solid var(--trait); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); list-style: none; }
@media (pointer: coarse) { .rch-liste [role=option] { min-height: 52px; } .rch-tete [data-fermer] { min-height: 44px; padding: 8px 12px; } }
.rch-aide { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 8px 18px; border-top: 1px solid var(--trait); font-size: 12.5px; color: var(--gris); }
@media (max-width: 520px) { dialog.recherche { width: calc(100% - 16px); margin-top: 8px; max-height: calc(100dvh - 16px); } .rch-aide { display: none; } }

/* boutons et champs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--trait); background: var(--carte); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--encre); white-space: nowrap; }
.btn:hover { border-color: var(--gris); }
.btn.principal { background: var(--accent); border-color: var(--accent); color: var(--sur-accent, #fff); }
.btn.principal:hover { background: var(--accent-fonce); }
.btn.danger { color: var(--alerte); }
.btn.petit { padding: 4px 9px; font-size: 13px; border-radius: 7px; }
.btn.lien { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
.btn[disabled] { opacity: .5; cursor: default; }
.champ { display: grid; gap: 5px; margin: 0 0 14px; }
.champ > label, .champ > .lib { font-weight: 650; font-size: 13.5px; }
.champ .aide { color: var(--gris); font-size: 12.5px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=search], input[type=date], input[type=time], input[type=number], select, textarea, .riche {
  width: 100%; padding: 8px 10px; border: 1px solid var(--trait); border-radius: 8px; background: var(--carte); min-height: 38px; }
textarea { min-height: 76px; resize: vertical; }
.riche { min-height: 60px; line-height: 1.55; }
.riche:empty::before { content: attr(data-vide); color: var(--gris); }
input:focus, select:focus, textarea:focus, .riche:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-doux); }
.case { display: flex; align-items: center; gap: 9px; font-weight: 600; cursor: pointer; }
.case input { width: 18px; height: 18px; accent-color: var(--accent); }
.rangee { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.bloc { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 18px 20px; box-shadow: var(--ombre); }
.bloc + .bloc { margin-top: 16px; }
.bloc h3 { margin: 0 0 12px; font-size: 15px; }
.outils-riche { display: flex; gap: 4px; margin-bottom: 4px; }
.outils-riche button { border: 1px solid var(--trait); background: var(--carte); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 13px; }
.item { border: 1px solid var(--trait); border-radius: 10px; padding: 10px 12px 2px; margin-bottom: 8px; background: var(--doux); }
.item-tete { display: flex; justify-content: flex-end; gap: 4px; margin: -4px -6px 4px 0; }
.couleur { display: flex; gap: 8px; align-items: center; }
.couleur input[type=color] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--trait); border-radius: 8px; background: var(--carte); }
.pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }

/* mise en page */
main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.tete { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 4px 0 16px; }
.tete h1 { margin: 0 auto 0 0; font-size: 22px; }
/* la fiche prend la place qui reste, jamais plus (minmax(0, 1fr)) : ce qu'elle contient s'y range, la page ne déborde pas */
.deux { display: grid; grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); gap: 18px; align-items: start; }
/* la liste colle sous l'en-tête, quelle que soit sa hauteur (une, deux, trois lignes ; --haut-barre, mesurée) */
.deux > .liste { position: sticky; top: calc(var(--haut-barre, 60px) + 10px); max-height: calc(100vh - var(--haut-barre, 60px) - 30px); overflow: auto; }
@media (max-width: 1100px) { .deux { grid-template-columns: 1fr; } .deux > .liste { position: static; max-height: none; } .deux.edition > .liste { display: none; } }
@media (max-width: 1100px) { .deux:not(.edition) > .editeur { display: none; } }
.filtres { display: grid; gap: 8px; padding: 12px; background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--trait); border-radius: 9px; overflow: hidden; background: var(--carte); }
.seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-weight: 600; color: var(--gris); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sur-accent, #fff); }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gris); }
.puce[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--encre); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--carte)); }
.mois { margin: 14px 4px 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
/* au bureau, une longue liste qui défile à côté de sa fiche garde en vue l'en-tête de ce qu'on parcourt : le mois (ou « À
   venir »), collé en haut de la liste jusqu'au suivant */
@media (min-width: 1101px) { .deux > .liste .mois { position: sticky; top: 0; z-index: 2; margin: 0 0 6px; padding: 10px 4px 6px; background: color-mix(in srgb, var(--fond) 92%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); } }
/* une liste qui défile avec la page (les Feuilles de route, le Journal ; jusqu'à 1 100 px et au téléphone, celles qui sont
   d'habitude à côté de leur fiche) garde de même son mois, ou son jour, en vue : collé sous l'en-tête arrimé, dont
   --haut-barre est la hauteur mesurée (poserHautBarre) */
.fr-liste [data-liste] .mois, #l-journal .j-jour { position: sticky; top: var(--haut-barre, 0px); z-index: 3; margin: 0 0 6px; padding: 10px 4px 6px; background: color-mix(in srgb, var(--fond) 92%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.fr-liste [data-liste] .mois:not(:first-child) { margin-top: 8px; }
#l-journal .j-jour { margin: 0; padding: 9px 12px 7px; background: color-mix(in srgb, var(--carte) 94%, transparent); border-bottom: 1px solid var(--trait); }
#l-journal .j-jour:first-child { border-radius: var(--rayon) var(--rayon) 0 0; }
@media (max-width: 1100px) { .deux > .liste { overflow: visible; } .deux > .liste .mois { position: sticky; top: var(--haut-barre, 0px); z-index: 3; margin: 0 0 6px; padding: 10px 4px 6px; background: color-mix(in srgb, var(--fond) 92%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); } }
.ligne { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; background: var(--carte); border: 1px solid var(--trait); text-decoration: none; color: var(--encre); border-left: 4px solid var(--c, var(--accent)); }
.ligne:hover { border-color: var(--gris); border-left-color: var(--c, var(--accent)); }
.ligne[aria-current="true"] { box-shadow: 0 0 0 3px var(--accent-doux); border-color: var(--accent); }
.ligne .jj { font-weight: 800; font-size: 13px; line-height: 1.2; text-align: center; color: var(--gris); }
.ligne .jj b { display: block; font-size: 20px; color: var(--encre); }
.ligne .corps { min-width: 0; }
.ligne .t { font-weight: 700; display: block; }
.ligne .ou { color: var(--gris); font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne .reps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.rep { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--doux); color: var(--gris); font-weight: 600; }
.rep.sco { background: #e6f0fb; color: #1e4f8a; }
.rep.ann { text-decoration: line-through; }
.badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.badge { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--doux); color: var(--gris); white-space: nowrap; }
.badge.option { background: var(--option-doux); color: var(--option); }
.badge.annulee, .badge.masquee { background: var(--alerte-doux); color: var(--alerte); }
.badge.sco { background: #e6f0fb; color: #1e4f8a; }
.badge.ok { background: var(--ok-doux); color: var(--ok); }
.mini.ph-interne img { opacity: .45; filter: grayscale(1); }
.vide { padding: 30px 16px; text-align: center; color: var(--gris); }
/* une liste vide dit pourquoi (listeVide) : une phrase, puis le geste utile (« Effacer les filtres », « ＋ Nouvelle date ») */
.vide.liste-vide { display: grid; justify-items: center; gap: 12px; margin: 0; }
.vide.liste-vide p { margin: 0; }
.vide.liste-vide .btn { min-height: 44px; }
td.tab-vide .btn { margin-top: 10px; min-height: 44px; }
/* une colonne du Kanban sans piste le dit, à la place où une carte se dépose (et s'efface dès qu'une carte y arrive) */
.crm-cartes:not(:has(.crm-carte))::before { content: 'Aucune piste à cette étape'; display: block; padding: 14px 10px; border: 1.5px dashed var(--trait); border-radius: 10px; color: var(--gris); font-size: 13px; text-align: center; }
.compte { color: var(--gris); font-size: 13px; }

/* le fil d'Ariane d'une fiche (poserFil) : les niveaux au-dessus en liens, la fiche en dernier ; au téléphone, le seul
   retour vers le niveau d'au-dessus, une cible de 44 px, à la place du bouton ← */
.fil-ariane { margin: 0 0 6px; font: 600 12.5px/1.35 var(--etiq); letter-spacing: .02em; color: var(--gris); }
.fil-ariane ol { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; margin: 0; padding: 0; list-style: none; }
.fil-ariane li { display: inline-flex; align-items: center; min-width: 0; }
.fil-ariane li + li::before { content: "›"; content: "›" / ""; margin: 0 7px; color: var(--gris); opacity: .8; }
.fil-ariane a { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); text-decoration: none; border-radius: 6px; }
.fil-ariane a:hover span, .fil-ariane li:not(.fil-parent) a:hover { text-decoration: underline; text-underline-offset: .18em; }
.fil-ariane a svg { display: none; }
.fil-ariane .fil-ici { color: var(--encre); overflow: hidden; }
.fil-ariane .fil-ici span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (pointer: coarse) { .fil-ariane a { min-height: 44px; } }
@media (max-width: 640px) {
  .fil-ariane { margin: -6px 0 2px; font-size: 14px; }
  .fil-ariane li { display: none; }
  .fil-ariane li.fil-parent { display: inline-flex; }
  .fil-ariane li + li::before { content: none; }
  .fil-ariane a { min-height: 44px; padding: 0 10px 0 0; }
  .fil-ariane a svg { display: block; margin-left: -4px; }
  .avec-fil > a[data-tt="retour"] { display: none; }
}
/* éditeur */
.editeur .titre-ed { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 14px; }
.editeur h2 { margin: 0; font-size: 20px; line-height: 1.25; flex: 1; }
.pied-ed { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--carte) 92%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--trait); border-radius: var(--rayon); }
.pied-ed .etat-ed { margin-right: auto; color: var(--gris); font-size: 13px; }
.pied-ed .etat-ed.sale { color: var(--option); font-weight: 700; }
/* le menu « Plus » du pied (pied(…, { replier: true })) : tant que tout tient sur une rangée, ses actions s'alignent comme
   les autres (l'état se resserre d'abord) ; sinon (au téléphone, dans une colonne étroite), .replie : l'état, « Plus »,
   « Enregistrer », et les autres actions dans le menu (ajusterPied, à chaque changement de largeur) */
.pied-plus { display: none; }
.pied-menu, .pied-autres { display: contents; }
.pied-plus svg { transition: transform .15s; }
.pied-plus[aria-expanded="true"] svg { transform: rotate(180deg); }
.pied-plus .a-completer.nombre { padding: 1px 7px; font-size: 11.5px; }
.pied-ed.a-plus .etat-ed { flex: 1 1 70px; min-width: 0; margin-right: 0; }
.pied-ed.a-plus:not(.replie) .btn { padding-left: 12px; padding-right: 12px; }
.pied-ed.a-plus.replie { flex-wrap: nowrap; padding: 10px 12px; }
.pied-ed.a-plus.replie .etat-ed { flex: 1 1 auto; font-size: 12.5px; line-height: 1.25; }
.pied-ed.a-plus.replie .pied-menu { display: block; flex: none; }
.pied-ed.a-plus.replie .pied-plus { display: inline-flex; }
.pied-ed.a-plus.replie .pied-autres { display: none; position: absolute; right: 8px; bottom: calc(100% + 8px); z-index: 30; width: max-content; min-width: 210px; max-width: calc(100% - 16px); flex-direction: column; align-items: stretch; gap: 2px; padding: 6px; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; box-shadow: 0 10px 34px rgba(20, 10, 20, .22); }
.pied-ed.a-plus.replie .pied-autres.ouvert { display: flex; }
.pied-ed.a-plus.replie .pied-autres .btn { justify-content: flex-start; border-color: transparent; padding: 10px 12px; }
.pied-ed.a-plus.replie .pied-autres .btn:hover, .pied-ed.a-plus.replie .pied-autres .btn:focus-visible { background: var(--doux); }
.pied-ed.a-plus.replie [data-enregistrer] { flex: none; }
@media (max-width: 420px) { .pied-ed.a-plus.replie { gap: 6px; } .pied-ed.a-plus.replie > .btn, .pied-ed.a-plus.replie .pied-plus { padding: 8px 10px; } }
.apercu { padding: 12px 14px; border-radius: 10px; background: var(--doux); border: 1px dashed var(--trait); }
.d-depuis { margin: -4px 0 14px; padding: 10px 14px; border-radius: 10px; background: var(--accent-doux); font-size: 14px; }
.d-depuis a { font-weight: 700; white-space: nowrap; }
.apercu .l { font-weight: 700; }
.apercu .d { color: var(--gris); font-size: 14px; }
table.reps { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
table.reps th { text-align: left; font-size: 12px; color: var(--gris); font-weight: 700; padding: 0 6px; }
table.reps td { padding: 0 3px; vertical-align: middle; }
table.reps td:first-child { padding-left: 0; }
/* les séances en blocs d'après la place de la fiche, pas celle de l'écran (une requête de conteneur) : à côté de la liste
   (une tablette couchée, 1 180 px), dans un tiroir, la ligne de sept champs (près de 780 px) poussait la fiche hors de
   l'écran ; le cadre ne prend que la largeur qu'on lui donne */
.reps-cadre { container-type: inline-size; }
@container (max-width: 800px) {
  table.reps thead { display: none; }
  table.reps tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border: 1px solid var(--trait); border-radius: 10px; margin-bottom: 8px; }
  table.reps td { padding: 0; }
  /* un tableau ne descend pas sous la largeur de ses champs de date : en blocs, les colonnes rétrécissent */
  table.reps, table.reps tbody { display: block; }
  table.reps tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  table.reps input, table.reps select { min-width: 0; }
}
.combo { position: relative; }
.suggestions { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: var(--ombre); max-height: 300px; overflow: auto; }
.suggestions button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; }
.suggestions button:hover, .suggestions button.actif { background: var(--accent-doux); }
.suggestions small { color: var(--gris); }
.onglets-ed { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.onglets-ed button { border: 1px solid var(--trait); background: var(--carte); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; color: var(--gris); }
.onglets-ed button[aria-selected="true"] { background: var(--encre); color: var(--carte); border-color: var(--encre); }
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.carte-sp { display: grid; grid-template-rows: 120px auto; border-radius: var(--rayon); overflow: hidden; background: var(--carte); border: 1px solid var(--trait); text-decoration: none; color: var(--encre); box-shadow: var(--ombre); }
.carte-sp .img { background: var(--fondU, #333) center/cover; position: relative; }
.carte-sp .img::after { content: ""; position: absolute; inset: auto 0 0 0; height: 5px; background: var(--c, var(--accent)); }
.carte-sp .txt { padding: 10px 12px; display: grid; gap: 6px; }
.carte-sp .txt b { font-size: 16px; }
.miniatures { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mini { border: 1px solid var(--trait); border-radius: 10px; overflow: hidden; background: var(--doux); }
.mini img { width: 100%; height: 110px; object-fit: cover; display: block; background: #ccc; }
.contraste { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.contraste.bon { background: var(--ok-doux); color: var(--ok); }
.contraste.faible { background: var(--alerte-doux); color: var(--alerte); }
/* sous un champ : appeler, écrire, d'où vient la valeur ; le lieu d'une date ; ses dates */
.sous-champ { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 12.5px; }
.sous-champ[hidden] { display: none; }
.sous-champ a.coord, .lieu-resume a { font-weight: 650; }
.appris { color: var(--ok); }
.appris a { color: inherit; }
.lieu-resume { display: grid; gap: 3px; margin-top: 8px; padding: 8px 11px; border-radius: 9px; background: var(--doux); font-size: 13.5px; overflow-wrap: anywhere; }
.lieu-resume .manque { color: var(--gris); font-style: italic; }
/* le journal : ses filtres (chercher, rubrique ou table, auteur, période), puis ses lignes */
.journal-filtres .j-choix { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.journal-filtres .j-choix select { flex: 1 1 180px; width: auto; min-width: 0; }
.journal-filtres .j-dates { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; }
.journal-filtres .j-dates[hidden] { display: none; }
.journal-filtres .j-dates label { display: flex; align-items: center; gap: 6px; flex: 1 1 160px; font-size: 13.5px; color: var(--gris); }
.journal-filtres .j-dates input { flex: 1; min-width: 0; }
.j-compte { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0; }
.j-plus { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 14px 0 0; }
.j-plus:empty { display: none; }
.journal-ligne mark { background: none; color: inherit; text-decoration: underline 2px var(--accent); text-underline-offset: 3px; }
.journal-ligne { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--trait); align-items: start; }
.journal-ligne .quand { color: var(--gris); font-size: 13px; }
.journal-ligne .quoi b { display: block; }
.journal-ligne .diff { color: var(--gris); font-size: 13px; }
@media (max-width: 700px) { .journal-ligne { grid-template-columns: 1fr; } }
table.simple { width: 100%; border-collapse: collapse; background: var(--carte); border-radius: var(--rayon); overflow: hidden; }
.f-periode { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--gris); } .f-periode label { display: inline-flex; gap: 4px; align-items: center; } .f-periode input { min-height: 34px; padding: 4px 6px; }
.lieu-bilan { margin: 0 0 10px; } .lieu-saisons { margin: 4px 0 12px; } .lieu-plus summary { cursor: pointer; margin: 8px 0; font-weight: 650; }
.budget-l { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin: 0; } .budget-l dt { color: var(--gris); } .budget-l dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.budget-l .total { font-weight: 800; border-top: 1px solid var(--trait); padding-top: 4px; }
table.simple th, table.simple td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--trait); vertical-align: top; }
table.simple th { font-size: 12.5px; color: var(--gris); }
table.simple tr.cliquable { cursor: pointer; }
table.simple tr.cliquable:hover td { background: var(--doux); }

/* connexion */
.connexion { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.connexion form { width: min(400px, 100%); }
.connexion h1 { font-size: 22px; margin: 0 0 4px; }
.connexion p { color: var(--gris); margin: 0 0 18px; }
/* (avant que les scripts ne soient là : le mot n'apparaît qu'au bout de 0,6 s, sans marge qui décale la page ensuite) */
.chargement { margin: 0; padding: 60px 20px; text-align: center; color: var(--gris); animation: sq-attend 0s linear .6s both; }

/* annonces */
#annonces { position: fixed; z-index: 50; left: 50%; bottom: 18px; transform: translateX(-50%); display: grid; gap: 8px; width: min(460px, calc(100% - 24px)); }
.annonce { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 11px; background: #1d1720; color: #fff; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.annonce.erreur { background: #8c1d16; }
.annonce button { margin-left: auto; border: 1px solid rgba(255, 255, 255, .4); background: none; color: #fff; border-radius: 7px; padding: 3px 10px; cursor: pointer; font-weight: 700; }
/* la croix : une cible de 36 px, au bout ; l'annonce se tire du doigt (touch-action : le geste est pour elle) */
.annonce { touch-action: none; user-select: none; -webkit-user-select: none; }
.annonce > span { flex: 1; min-width: 0; }
.annonce .annonce-fermer { flex: none; display: grid; place-items: center; width: 36px; height: 36px; margin: -8px -8px -8px 0; padding: 0; border: 0; border-radius: 50%; color: rgba(255, 255, 255, .75); }
.annonce [data-tt="retour"] + .annonce-fermer { margin-left: -4px; }
.annonce .annonce-fermer:hover, .annonce .annonce-fermer:focus-visible { background: rgba(255, 255, 255, .14); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .annonce { animation: monte .2s ease-out; } @keyframes monte { from { transform: translateY(8px); opacity: 0; } } }

/* à compléter avant la tournée (en tête de Représentations) */
.avant { margin-bottom: 10px; background: var(--carte); border: 1px solid var(--trait); border-left: 4px solid var(--option); border-radius: var(--rayon); }
.avant > summary { display: flex; align-items: center; gap: 8px; padding: 11px 14px; cursor: pointer; list-style: none; font-weight: 750; }
.avant > summary::-webkit-details-marker { display: none; }
.avant-titre { margin: 0; font: inherit; letter-spacing: inherit; }
.avant > summary::before { content: ""; width: 7px; height: 7px; border: solid var(--gris); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; margin: 0 2px; }
.avant[open] > summary::before { transform: rotate(45deg); }
.avant-corps { display: grid; gap: 6px; padding: 0 12px 12px; }
.avant-fenetre { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 2px; font-size: 13px; color: var(--gris); }
.avant-fenetre select { width: auto; min-height: 30px; padding: 2px 6px; }
.avant-rien { margin: 2px; color: var(--ok); font-weight: 600; font-size: 14px; }
.avant h3 { margin: 6px 2px 0; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); }
.avant ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.avant li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 6px 9px; border-radius: 8px; background: var(--doux); font-size: 14px; }
.avant li a { font-weight: 650; }
.avant li .badge { margin-left: auto; }

/* une commande segmentée dans un champ (le statut d'une date) passe à la ligne plutôt que de sortir de sa colonne */
.champ .seg { display: flex; flex-wrap: wrap; width: fit-content; max-width: 100%; }
.champ .seg button { flex: 1 1 auto; }
/* au téléphone (360 px) : des marges plus serrées, des boutons segmentés qui tiennent sur la largeur */
@media (max-width: 520px) { main { padding: 14px 12px; } .bloc { padding: 14px; } .seg { max-width: 100%; } .seg button { padding: 6px 7px; font-size: 14px; } .rangee > .champ:has(.seg) { grid-column: 1 / -1; } }
/* CRM Kanban */
.crm-tableau { display: grid; grid-template-columns: repeat(5, minmax(260px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 16px; }
.crm-colonne { background: var(--doux); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 12px; display: flex; flex-direction: column; min-height: 480px; }
.crm-col-tete { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; font-weight: 700; font-size: 14px; }
/* le Kanban suit la page, sans cadre qui défile de côté (un cadre qui défile garderait pour lui le nom des colonnes) : les
   cinq colonnes côte à côte quand elles tiennent, sinon sur plusieurs rangs, puis l'une sous l'autre au téléphone ; le nom
   de chaque colonne reste collé sous l'en-tête arrimé pendant qu'on fait défiler ses cartes */
.crm-tableau { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); overflow: visible; }
.crm-col-tete { position: sticky; top: var(--haut-barre, 0px); z-index: 2; margin: -12px -12px 12px; padding: 12px 12px 7px; background: inherit; border-radius: var(--rayon) var(--rayon) 0 0; }
@media (max-width: 640px) { .crm-tableau { grid-template-columns: minmax(0, 1fr); } .crm-colonne { min-height: 0; } }
.crm-carte-pied { flex-wrap: wrap; }
.crm-badge-nb { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--carte); color: var(--gris); }
.crm-cartes { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.crm-carte { background: var(--carte); border: 1.5px solid var(--trait); border-radius: 10px; padding: 12px; box-shadow: var(--ombre); transition: transform .15s, border-color .15s; }
.crm-carte:hover { border-color: var(--accent); transform: translateY(-1px); }
.crm-carte-spectacle { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.crm-carte-structure { font-weight: 700; font-size: 15px; margin: 0 0 2px; }
.crm-carte-lieu { color: var(--gris); font-size: 13px; margin-bottom: 6px; }
.crm-carte-contact { font-size: 12.5px; margin-bottom: 8px; color: var(--encre); }
.crm-carte-cession { font-weight: 800; font-size: 14px; color: var(--accent); }
.crm-carte-pied { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--trait); }
.crm-carte-relance { font-size: 11.5px; color: var(--gris); }
.crm-carte-relance.retard { color: var(--alerte); font-weight: 700; }
.crm-carte-actions { display: flex; gap: 4px; }
.crm-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.crm-kpi-boite { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px; box-shadow: var(--ombre); }
.crm-kpi-boite span { font-size: 12.5px; color: var(--gris); font-weight: 600; display: block; }
.crm-kpi-boite b { font-size: 22px; font-weight: 800; color: var(--encre); }

/* la Diffusion : ses parties (les pistes, les demandes de devis, les alertes de tournée) ; une demande de devis ; le résumé
   des alertes (leurs chiffres, par département et par spectacle, la liste) */
.di-parties { flex-wrap: wrap; }
.di-nb { display: inline-block; min-width: 18px; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--option-doux); color: var(--option); font-size: 11.5px; font-weight: 800; line-height: 18px; text-align: center; }
.seg button[aria-pressed="true"] .di-nb { background: var(--carte); color: var(--accent); }
.dv-fiche { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; }
.dv-fiche dt { color: var(--gris); font-size: 13.5px; font-weight: 650; }
.dv-fiche dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dv-fiche .sous-champ { display: flex; margin-top: 2px; }
.dv-message { margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--doux); white-space: pre-line; overflow-wrap: anywhere; }
@media (max-width: 520px) { .dv-fiche { grid-template-columns: minmax(0, 1fr); gap: 1px; } .dv-fiche dd { margin-bottom: 8px; } }
.al-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .al-kpi { gap: 8px; } .al-kpi .crm-kpi-boite { padding: 10px; } .al-kpi .crm-kpi-boite span { font-size: 12px; } }
.al-note { margin: -6px 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--option-doux); color: var(--encre); font-size: 14px; }
.di-deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-bottom: 16px; }
.di-deux .bloc + .bloc { margin-top: 0; }
.al-table th:not(:first-child), .al-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.al-table td:first-child { overflow-wrap: anywhere; }
.al-liste { list-style: none; margin: 0; padding: 0; }
.al-ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 11px 2px; border-top: 1px solid var(--trait); }
.al-corps { flex: 1 1 260px; min-width: 0; display: grid; gap: 3px; }
.al-corps b { overflow-wrap: anywhere; }
.al-quoi { color: var(--gris); font-size: 13px; }
.al-quoi .badge { margin-right: 4px; }
.al-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.al-plus { color: var(--gris); font-size: 13.5px; }

/* Frais et matériel */
.frais-table-photo { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--trait); cursor: pointer; }
/* le tableau des notes de frais défile de côté au téléphone, sans pousser la page */
.frais-defile { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--rayon); }   /* relative : ce qu'il porte de caché (.sr) défile avec lui */
.frais-defile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.frais-defile table.simple { min-width: 820px; }
/* au bureau, une longue liste de notes défile dans son cadre, ses titres de colonne restent en vue */
@media (min-width: 1101px) { .frais-defile { max-height: calc(100vh - 220px); overflow: auto; overscroll-behavior: contain; } .frais-defile table.simple { overflow: visible; } .frais-defile thead th { position: sticky; top: 0; z-index: 1; background: var(--carte); box-shadow: 0 1px 0 var(--trait); } }
.frais-table-actions { display: flex; gap: 4px; }
.mat-groupe { margin-bottom: 18px; }
.mat-groupe h4 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
/* le tableur des représentations : un cadre qui défile dans les deux sens, l'en-tête collé en haut, le jour et le
   spectacle collés à gauche ; une bande par date ; la case active encadrée, la plage choisie teintée, la même case de la
   date éclairée sur ses autres séances ; ce qui arrive d'ailleurs clignote */
.seg a { display: inline-flex; align-items: center; padding: 6px 11px; font-weight: 600; color: var(--gris); text-decoration: none; }
.seg a[aria-current="page"] { background: var(--accent); color: var(--sur-accent, #fff); }
.tab-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tab-menu { position: relative; }
.tab-export { position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; display: grid; gap: 4px; width: min(290px, calc(100vw - 24px)); padding: 8px; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 10, 20, .22); }
.tab-export[hidden] { display: none; }
.tab-export .btn { justify-content: flex-start; }
.tab-export .aide { margin: 4px 2px 0; font-size: 12px; color: var(--gris); white-space: normal; }
.tab-filtres .tab-choix { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tab-filtres select { width: auto; flex: 1 1 170px; min-width: 0; }
.tab-vides { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.tab-ligne-etat { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-height: 30px; margin: 0 2px 6px; }
.tab-etat { font-size: 13px; color: var(--gris); }
.tab-etat.encours { color: var(--option); }
.tab-etat.ok { color: var(--ok); font-weight: 600; }
.tab-etat.erreur { color: var(--alerte); font-weight: 600; }
.tab-etat kbd { margin-left: 2px; }
.btn.tab-suppr { margin-left: auto; color: var(--alerte); }
.btn.tab-suppr[hidden] { display: none; }
.tab-cadre { --w-jour: 138px; --w-spectacle: 178px; position: relative; overflow: auto; overscroll-behavior: contain; max-height: 70vh; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--carte); }
table.tableur { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13.5px; }
.tableur th, .tableur td { box-sizing: border-box; padding: 6px 9px; border-bottom: 1px solid var(--trait); border-right: 1px solid var(--trait); text-align: left; vertical-align: top; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tableur thead th { position: sticky; top: 0; z-index: 3; background: var(--doux); color: var(--gris); font-size: 12.5px; font-weight: 750; }
.tableur thead th.de-date { text-decoration: underline dotted color-mix(in srgb, var(--gris) 60%, transparent); text-underline-offset: 3px; }
.tableur .tab-tri { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.tableur .c-jour { position: sticky; left: 0; z-index: 2; }
.tableur .c-spectacle { position: sticky; left: var(--w-jour); z-index: 2; box-shadow: 2px 0 0 var(--trait); }
.tableur thead .c-jour, .tableur thead .c-spectacle { z-index: 4; }
.tableur tbody tr.b0 td { background: var(--carte); }
.tableur tbody tr.b1 td { background: color-mix(in srgb, var(--doux) 60%, var(--carte)); }
.tableur tbody tr.premier:not(:first-child) td { border-top: 1px solid color-mix(in srgb, var(--gris) 45%, transparent); }
.tableur td.repete { color: color-mix(in srgb, var(--gris) 90%, var(--carte)); }
.tableur td.repete .pastille, .tableur td.repete .badge, .tableur td.repete .tab-pastille { opacity: .72; }
.tableur td.choisie { background: var(--accent-doux) !important; }
.tableur td.meme-date { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
.tableur td.c-spectacle.meme-date { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent), 2px 0 0 var(--trait); }
.tableur td:focus, .tableur td:focus-visible { outline: none; }
.tableur td.actif { box-shadow: inset 0 0 0 2px var(--accent); }
.tableur td.c-spectacle.actif { box-shadow: inset 0 0 0 2px var(--accent), 2px 0 0 var(--trait); }
.tableur td.en-edition { overflow: visible; }
.tableur td.en-edition:not(.c-jour):not(.c-spectacle) { position: relative; }
.tableur td.en-cours { color: var(--option); font-style: italic; }
.tableur td.vient-d-ailleurs { animation: tab-ailleurs 2s ease-out; }
@keyframes tab-ailleurs { 0%, 30% { background: color-mix(in srgb, var(--ok) 32%, var(--carte)); } }
@media (prefers-reduced-motion: reduce) { .tableur td.vient-d-ailleurs { animation: none; box-shadow: inset 0 0 0 2px var(--ok); } }
.tableur tr.barree td.c-jour, .tableur tr.barree td.c-heure { text-decoration: line-through; }
.tableur .pastille { margin-right: 6px; vertical-align: 1px; }
.tableur .badge { font-size: 11px; }
.tab-pastille { display: inline-flex; align-items: center; gap: 4px; margin: 0 4px 2px 0; padding: 1px 8px; border-radius: 999px; background: var(--accent-doux); color: var(--encre); font-size: 12.5px; font-weight: 600; }
.tab-gris { color: var(--gris); font-style: italic; }
.tableur td.tab-vide { padding: 30px; text-align: center; color: var(--gris); white-space: normal; }
.tab-ed { position: absolute; left: 0; top: 0; z-index: 6; width: max(100%, 190px); min-height: 100%; padding: 4px 8px; border: 2px solid var(--accent); border-radius: 4px; background: var(--carte); color: var(--encre); font-size: 14px; box-shadow: 0 6px 18px rgba(20, 10, 20, .2); }
select.tab-ed { width: max(100%, 200px); }
textarea.tab-ed { width: max(100%, 320px); min-height: 130px; resize: both; }
.tableur .c-jour { width: var(--w-jour); min-width: var(--w-jour); max-width: var(--w-jour); }
.tableur .c-spectacle { width: var(--w-spectacle); min-width: var(--w-spectacle); max-width: var(--w-spectacle); }
.tableur .c-heure { width: 78px; min-width: 78px; max-width: 78px; }
.tableur .c-fin { width: 68px; min-width: 68px; max-width: 68px; }
.tableur .c-lieu { width: 190px; min-width: 190px; max-width: 190px; }
.tableur .c-commune { width: 150px; min-width: 150px; max-width: 150px; }
.tableur .c-public { width: 110px; min-width: 110px; max-width: 110px; }
.tableur .c-statut { width: 112px; min-width: 112px; max-width: 112px; }
.tableur .c-nature { width: 136px; min-width: 136px; max-width: 136px; }
.tableur .c-distribution { width: 250px; min-width: 250px; max-width: 250px; }
.tab-pastille.plus { background: none; border: 1px solid var(--trait); color: var(--gris); }
.tableur .c-billetterie { width: 190px; min-width: 190px; max-width: 190px; }
.tableur .c-precisions { width: 180px; min-width: 180px; max-width: 180px; }
.tableur .c-organisateur { width: 180px; min-width: 180px; max-width: 180px; }
.tableur .c-contact { width: 210px; min-width: 210px; max-width: 210px; }
.tableur .c-contrat { width: 104px; min-width: 104px; max-width: 104px; }
.tableur .c-notes { width: 240px; min-width: 240px; max-width: 240px; }
.tableur .c-annulee { width: 112px; min-width: 112px; max-width: 112px; }
.tableur .c-site { width: 90px; min-width: 90px; max-width: 90px; }
.tab-aide { margin: 10px 2px 0; font-size: 12.5px; color: var(--gris); }
.tab-ajout { margin-bottom: 12px; }
.tab-ajout h3 { margin: 0 0 10px; }
.tab-ajout-champs { display: grid; grid-template-columns: 150px 110px minmax(160px, 1fr) minmax(220px, 2fr); gap: 0 12px; align-items: start; }
.tab-ajout .champ { margin-bottom: 8px; }
.tab-pop { position: fixed; z-index: 40; width: min(340px, calc(100vw - 16px)); padding: 12px; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; box-shadow: 0 14px 40px rgba(20, 10, 20, .28); }
.tab-pop.large { width: min(430px, calc(100vw - 16px)); }
.tab-pop-titre { margin: 0 0 8px; font-weight: 750; }
.tab-pop-titre small { color: var(--gris); font-weight: 500; }
.tab-pop .aide { margin: 8px 0 0; font-size: 12.5px; color: var(--gris); }
.tab-pop-pied { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tab-pastilles { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
.tab-pastilles .tab-pastille { margin: 0; padding: 2px 4px 2px 10px; font-size: 13.5px; }
.tab-pastilles .tab-pastille button { border: 0; background: none; padding: 1px 5px; border-radius: 999px; color: var(--gris); cursor: pointer; font-size: 12px; }
.tab-pastilles .tab-pastille button:hover, .tab-pastilles .tab-pastille button:focus-visible { background: var(--carte); color: var(--alerte); }
.tab-eq-ajout { position: relative; }
.tab-eq-liste { position: absolute; left: 0; right: 0; top: calc(100% + 2px); z-index: 2; max-height: 230px; margin: 0; padding: 4px; overflow: auto; list-style: none; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: 0 8px 24px rgba(20, 10, 20, .18); }
.tab-eq-liste[hidden] { display: none; }
.tab-eq-liste [role=option] { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.tab-eq-liste [role=option][aria-selected=true] { background: var(--accent-doux); }
.tab-eq-liste small { color: var(--gris); text-align: right; }
dialog.tab-dialogue { width: min(560px, calc(100% - 24px)); max-width: none; padding: 0; border: 1px solid var(--trait); border-radius: 14px; background: var(--carte); color: var(--encre); box-shadow: 0 18px 60px rgba(20, 10, 20, .3); }
dialog.tab-dialogue.large { width: min(900px, calc(100% - 24px)); }
dialog.tab-dialogue::backdrop { background: rgba(23, 15, 26, .4); }
.tab-dialogue-boite { display: grid; gap: 10px; padding: 18px 20px; }
.tab-dialogue h2 { margin: 0; font-size: 18px; }
.tab-dialogue p { margin: 0; }
.tab-dialogue fieldset { display: grid; gap: 6px; margin: 0; padding: 8px 12px 10px; border: 1px solid var(--trait); border-radius: 10px; }
.tab-dialogue legend { padding: 0 4px; font-weight: 700; font-size: 13.5px; }
.tab-et-alerte { margin-top: 6px !important; color: var(--option); font-weight: 650; }
.tab-et-liste { max-height: 160px; margin: 4px 0 0; padding-left: 18px; overflow: auto; font-size: 13.5px; }
.tab-im-cadre { max-height: 320px; overflow: auto; margin-top: 8px; }
.tab-im-non td { color: var(--gris); }
.tab-im-erreur { color: var(--alerte); }
@media (max-width: 700px) {
  .tab-ajout-champs { grid-template-columns: 1fr 1fr; }
  .tab-ajout-champs .ta-lieu { grid-column: 1 / -1; }
  .tab-cadre { --w-jour: 104px; --w-spectacle: 120px; }
  .tableur { font-size: 13px; }
  .tableur td.c-jour, .tableur td.c-spectacle { white-space: normal; }
}
/* au téléphone, les colonnes collées se resserrent : le reste du tableau garde de la place pour défiler */
@media (max-width: 520px) { .tab-cadre { --w-jour: 86px; --w-spectacle: 98px; } .tableur th, .tableur td { padding: 5px 7px; } .tableur td.c-spectacle .pastille { display: none; } }
/* ———————————————— le mouvement de l'administration : les vues qui s'enchaînent (changerVueAdmin), les listes et les
   fiches qui arrivent (main.entree, le temps du premier rendu), le pied qui dit l'état, la liste « à compléter » qui se
   vide, la recherche qui s'ouvre, la pastille « direct » qui bat, la case du tableur qui s'enregistre, la liste qui
   glisse (glisserVers), le champ visé qui s'allume (visee). Rien de tout cela si l'appareil demande moins d'animations,
   ni avec ?anim=0 (html.still) ; l'en-tête et les annonces restent en place pendant une transition. */
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }
.barre { view-transition-name: barre; }
#annonces { view-transition-name: annonces; }
::view-transition-old(barre), ::view-transition-old(annonces) { display: none; }
::view-transition-new(barre), ::view-transition-new(annonces) { animation: none; }
::view-transition-group(barre), ::view-transition-group(annonces) { animation: none; }
.pied-ed::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--option); transform: scaleX(0); transform-origin: 0 50%; transition: transform .3s cubic-bezier(.2, .8, .2, 1), background-color .3s; }
.pied-ed.sale::before { transform: scaleX(1); }
.pied-ed.ok::before { transform: scaleX(1); background: var(--ok); }
.pied-ed.sale [data-enregistrer] { box-shadow: 0 0 0 3px var(--accent-doux); }
.avant-faits li.fait { overflow: hidden; background: var(--ok-doux); color: var(--ok); }
.avant-faits li.fait .badge { margin-left: auto; }
.onglets-ed button { transition: background-color .2s, color .2s, border-color .2s; }
.carte-sp { transition: transform .2s, box-shadow .2s; }
.carte-sp:hover { transform: translateY(-2px); box-shadow: 0 2px 6px rgba(30, 20, 30, .06), 0 16px 32px -16px rgba(30, 20, 30, .35); }
.carte-sp .img::after { transition: height .2s; }
.carte-sp:hover .img::after { height: 9px; }
.ligne { transition: box-shadow .15s, border-color .15s; }
.nav a, .seg button, .puce { transition: background-color .2s, color .2s, border-color .2s; }
.champ input, .champ select, .champ textarea, .riche, input[type=search], .filtres input, .filtres select { transition: border-color .15s, box-shadow .15s; }
/* le squelette du chargement (squeletteAdmin) : l'en-tête tel qu'il sera, puis la vue à sa forme, aux mesures de la page
   (le titre et ses boutons de 41 px, le bandeau du tableau de bord, les lignes d'une liste, les cartes…), qui luisent ; le
   contenu paraît ensuite à sa place (main.fondu). Il attend 0,15 s avant de paraître, sans mouvement si l'appareil en
   demande moins (une base rapide ne le fait pas clignoter) */
.ad-squelette { --h: 16px; animation: sq-attend 0s linear .15s both; }
@keyframes sq-attend { from { visibility: hidden; } }
.sq { position: relative; display: block; height: var(--h); border-radius: 8px; background: var(--doux); overflow: hidden; }
.sq-tete { min-height: 41px; }
.sq-titre { height: 34px; max-width: 60%; margin-right: auto; border-radius: 9px; }
.sq-pilule { height: 41px; max-width: 100%; border-radius: 10px; }
.sq-tb-outils { justify-content: flex-end; }
.sq-tb-outils .sq-pilule:first-child { margin-right: 0; }
.sq-salut { height: 175px; margin-bottom: 14px; border-radius: 22px; }
.sq-tuiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sq-tuile { height: 490px; border-radius: var(--rayon); }
.sq-tuile-g { grid-column: 1 / -1; height: 171px; }
.sq-tuile-m { grid-column: span 2; }
.sq-deux { display: grid; grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); gap: 18px; align-items: start; }
.sq-pile { display: grid; gap: 8px; align-content: start; }
.sq-ligne { height: 64px; border-radius: 10px; }
.sq-fiche { height: 84px; border-radius: var(--rayon); }
.sq-filtres { height: 149px; margin-bottom: 10px; border-radius: var(--rayon); }
.sq-etroit { max-width: 920px; }
.sq-zone { padding: 8px; }
.sq-cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.sq-carte { height: 234px; border-radius: var(--rayon); }
.sq-grille { height: 320px; border-radius: var(--rayon); }

<script>
'use strict';
/* L'administration du site de la compagnie Crescite : les spectacles, les dates et leurs représentations, les ateliers,
   les lieux et les textes. Chaque enregistrement va dans la base (Supabase, tables crescite_) et change aussitôt le site
   en ligne, qui écoute la base en temps réel. Seuls les comptes de crescite_admins peuvent enregistrer.
   Une date montre son lieu tel que sa fiche le connaît (adresse, itinéraire, contact, jauge) et mène à elle ; un lieu,
   ses dates. Sous les champs des fiches, les numéros et les adresses électroniques s'ouvrent d'un geste (sousChamp :
   « Appeler le … », « Écrire à … »), et une valeur apprise d'une feuille de route dit d'où elle vient (equipe.js).
   Partout : la recherche rapide (Ctrl K, ⌘K, la loupe de l'en-tête : dates, personnes, lieux, spectacles, feuilles,
   rubriques, dans ce qui est déjà chargé). En tête de Représentations : « À compléter avant la tournée » (téléphones de
   l'équipe, adresses et contacts des lieux, feuilles de route, pour les prochaines dates confirmées). Un lien peut viser
   le champ à remplir dans ce qu'il ouvre (data-viser). Le pied d'une date replie ses actions dans « Plus » quand elles
   ne tiennent pas sur une rangée (ajusterPied). Le Journal se filtre (rubrique ou table, auteur, période) et se cherche.
   Représentations → Tableur (TABLEUR) : une ligne par séance, branché sur la base dans les deux sens, par le même chemin
   que la fiche d'une date (chargeDate, ecrireDate, effacerDate) ; exports Excel, CSV, Google Sheets ; import.
   La diffusion, les notes de frais et le matériel (le script « Compagnie Idéale ») se masquent quand la base n'a pas
   leurs tables (E.ideale). La Diffusion a trois parties : les pistes, les demandes de devis déposées sur le site (statut
   et notes internes), et le résumé des alertes de tournée, qui demande aussi le onzième script (E.alertesInstallees).
   Le tableau de bord (#/accueil, admin/tableau.js : TABLEAU) ouvre l'administration : des tuiles sur ce qui presse et ce
   qui vient, chacune menant au geste en un clic, entièrement personnalisables (ordre, taille, réglages, masquage), la
   disposition gardée avec le compte (crescite_preferences, clé accueil.tableau). */
const BASE = 'https://fwjgyfzcbcmfyfkhhtuh.supabase.co';
const CLE = 'sb_publishable__SvO0qVI2BvcBK5vYgxjZQ_U-evgPKD';
const SITE = '../';
// le pied commun aux quatre espaces réservés (administration, équipe, salles, réponse) : la compagnie, le site public, lui
// écrire, ses pages légales ; en fin de contenu, jamais fixé (au téléphone, la barre des rubriques reste seule en bas)
const PIED = `<footer class="pied-espace"><p class="pied-nom">Compagnie Crescite</p><nav aria-label="La compagnie"><a href="../">Le site</a><a href="mailto:contact@crescite.fr">Écrire à la compagnie</a><a href="../#/mentions-legales">Mentions légales</a><a href="../#/politique-de-confidentialite">Politique de confidentialité</a></nav></footer>`;
const sb = supabase.createClient(BASE, CLE, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'crescite-admin', detectSessionInUrl: true } });
// les tentacules (tentacules.js) : courtes et près du bouton, jamais devant un champ ; absentes, rien ne change
const TT = typeof TENTACULES !== 'undefined' ? TENTACULES : null;
if (TT) TT.regler({ profil: 'admin', style: 'encre', remontee: false, soulever: false });
const tt = (f, ...a) => { if (TT && typeof TT[f] === 'function') { try { return TT[f](...a); } catch (e) { /* le décor ne doit rien casser */ } } };
// un enregistrement réussi : la tentacule s'enroule autour du bouton (après l'enregistrement, jamais avant)
// moins d'animations : le réglage de l'appareil, ou ?anim=0 (captures et essais : html.still arrête aussi la feuille de style)
const SANS_ANIM = /[?&]anim=0\b/.test(location.search);
if (SANS_ANIM) document.documentElement.classList.add('still');
const CALME_ADMIN = () => SANS_ANIM || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
const bravo = () => requestAnimationFrame(() => {
  const b = $('[data-enregistrer]'); if (b) tt('confirmer', b);
  const p = $('.pied-ed'); if (p) { p.classList.remove('sale'); p.classList.add('ok'); setTimeout(() => p.classList.remove('ok'), 1600); }
});

// ===================================================================================================== état
const E = { session: null, admin: false, pret: false, direct: false, sale: false, hash: location.hash,
  spectacles: [], lieux: [], dates: [], reps: [], suivis: [], lieuxSuivi: [], ateliers: [], seances: [], textes: [], admins: [], journal: [],
  prospects: [], frais: [], materiel: [], devis: [], alertes: [], alertesInstallees: false };
const TABLES = {
  crescite_spectacles: ['spectacles', 'id'], crescite_lieux: ['lieux', 'id'], crescite_dates: ['dates', 'id'],
  crescite_representations: ['reps', 'id'], crescite_dates_suivi: ['suivis', 'date_id'], crescite_lieux_suivi: ['lieuxSuivi', 'lieu_id'],
  crescite_ateliers: ['ateliers', 'id'], crescite_seances: ['seances', 'id'], crescite_textes: ['textes', 'cle'],
};
// la diffusion, les frais, le matériel et les devis (supabase/migrations/20261026_crescite_ideale.sql) : sur leur propre
// canal, et seulement quand la base les a ; un canal qui écoute une table absente ne reçoit plus rien, des autres non plus
const TABLES_IDEALE = {
  crescite_diffusion_prospects: ['prospects', 'id'], crescite_notes_frais: ['frais', 'id'], crescite_materiel: ['materiel', 'id'], crescite_devis_demandes: ['devis', 'id'],
};
const NOMS_TABLES = { crescite_spectacles: 'Spectacle', crescite_lieux: 'Lieu', crescite_dates: 'Date', crescite_representations: 'Représentation',
  crescite_dates_suivi: 'Suivi d’une date', crescite_lieux_suivi: 'Suivi d’un lieu', crescite_ateliers: 'Atelier', crescite_seances: 'Séance d’atelier', crescite_textes: 'Texte du site',
  crescite_personnes: 'Fiche d’une personne', crescite_personnes_privees: 'Coordonnées d’une personne', crescite_personnes_suivi: 'Notes sur une personne',
  crescite_distributions: 'Distribution', crescite_equipes: 'Équipe d’une date', crescite_documents: 'Document', crescite_feuilles: 'Feuille de route',
  crescite_diffusion_prospects: 'Opportunité de diffusion', crescite_notes_frais: 'Note de frais', crescite_materiel: 'Matériel de tournée', crescite_devis_demandes: 'Demande de devis',
  crescite_acces_pro: 'Invitation à l’espace pro', crescite_propositions: 'Proposition de dates', crescite_notes: 'Note interne' };
// les chiffres des dates (la jauge, les spectateurs, les heures d'ateliers : supabase/migrations/20261029_crescite_chiffres.sql),
// jamais publiés : lus et écoutés à part, et seulement quand la base les a (E.chiffresInstalles)
const TABLES_CHIFFRES = { crescite_dates_chiffres: ['chiffres', 'date_id'] };
// les documents générés (le vingtième script, modeles.js) : E.docsGeneres, sans leur page
const TABLES_DOCUMENTS = { crescite_documents_generes: ['docsGeneres', 'id'] };
NOMS_TABLES.crescite_documents_generes = 'Document généré';
// le carnet des lieux (le vingt-troisième script, carnet.js) : E.contacts, E.hebergements
const TABLES_CARNET = { crescite_contacts: ['contacts', 'id'], crescite_hebergements: ['hebergements', 'id'] };
NOMS_TABLES.crescite_contacts = 'Contact d’un lieu'; NOMS_TABLES.crescite_hebergements = 'Hébergement près d’un lieu';
NOMS_TABLES.crescite_dates_chiffres = 'Chiffres d’une date';

// ===================================================================================================== outils
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const texteSeul = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent; };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const AUJ = AGENDA.iso(new Date());
const aujourdhui = () => AGENDA.iso(new Date());   // le jour d'aujourd'hui, à l'appel (la diffusion s'en sert)
const JS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MC = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const jourCourt = j => { if (!j) return ''; const d = new Date(j + 'T12:00:00'); return `${JS[d.getDay()]} ${d.getDate()} ${MC[d.getMonth()]} ${d.getFullYear()}`; };
const photoUrl = f => f ? `${BASE}/storage/v1/object/public/crescite/${String(f).split('/').map(encodeURIComponent).join('/')}` : '';
const slugifier = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
const parId = (coll, id) => E[coll].find(x => x.id === id);
const spectacle = id => parId('spectacles', id);
const lieu = id => parId('lieux', id);
const lieuTexte = l => l ? `${l.nom ? l.nom + ' — ' : ''}${l.commune} (${l.departement})` : '';
const couleurSp = s => s?.univers?.couleurs?.scene || s?.univers?.couleurs?.accent || getComputedStyle(document.documentElement).getPropertyValue('--saison').trim() || '#5f565a';
const repsDe = id => E.reps.filter(r => r.date_id === id).sort((a, b) => a.jour < b.jour ? -1 : a.jour > b.jour ? 1 : String(a.heure || '99').localeCompare(String(b.heure || '99')));
const h5 = h => h ? String(h).slice(0, 5) : '';
let session = {};
try { session = JSON.parse(sessionStorage.getItem('crescite-admin-filtres') || '{}'); } catch { session = {}; }
const garderFiltres = () => { try { sessionStorage.setItem('crescite-admin-filtres', JSON.stringify(session)); } catch { /* navigation privée */ } ecrireFiltres(); };
// Les listes gardent leur état, et le portent dans leur adresse : la recherche, les filtres et le tri en cours d'une liste
// s'écrivent dans la partie ?… de l'adresse à mesure (?statut=option&q=caen#/representations, sans nouveau pas dans
// l'historique, seulement ce qui diffère de la valeur d'office) et la suivent dans ses fiches (#/lieux/5 garde ?type=salle) :
// le retour d'une fiche, le précédent du navigateur, un rechargement, un lien partagé rouvrent la liste telle qu'on l'a
// laissée. Rouvrir la rubrique plus tard depuis l'en-tête la retrouve aussi (session, gardée dans l'onglet), et la réécrit
// dans l'adresse ; une autre rubrique retire ces filtres de l'adresse. ?tiroir=… (tiroir.js) et ?anim=0 n'y sont pas touchés.
// [l'adresse de la liste et de ses fiches, sa clé dans session, ce qui va dans l'adresse avec sa valeur d'office]
const LISTES_ADRESSE = [
  [/^#\/representations\/tableur$/, 'tableur', { q: '', saison: '', spectacle: '', periode: 'avenir', tri: 'asc' }],
  [/^#\/representations(?:\/(?:nouvelle|\d+))?$/, 'dates', { q: '', spectacle: '', public: '', statut: '' }],
  [/^#\/feuilles(?:\/\d+)?$/, 'feuilles', { q: '', etat: '' }],
  [/^#\/equipe(?:\/(?:nouvelle|\d+))?$/, 'equipe', { q: '', categorie: '' }],
  [/^#\/lieux(?:\/(?:nouveau|\d+))?$/, 'lieux', { q: '', type: '' }],
  [/^#\/pro(?:\/(?:nouvelle|\d+))?$/, 'pro', { q: '', etat: '' }],
  [/^#\/diffusion\/devis(?:\/\d+)?$/, 'devis', { q: '', statut: '' }],
  [/^#\/diffusion\/alertes$/, 'alertes', { q: '', etat: '' }],
  [/^#\/planning\/(?:propositions|proposition\/\d+)$/, 'propositions', { q: '', etat: '' }],
  [/^#\/ateliers(?:\/seances(?:\/(?:nouvelle|\d+))?)?$/, 'seances', { periode: 'avenir', saison: '' }],
  [/^#\/journal$/, 'journal', { q: '', quoi: '', qui: '', periode: '', du: '', au: '' }],
];
const CLES_FILTRES = [...new Set(LISTES_ADRESSE.flatMap(x => Object.keys(x[2])))];
const listeDeHash = h => LISTES_ADRESSE.find(([re]) => re.test(h || '')) || null;
// la liste ouverte écrit ses filtres dans l'adresse (à chaque changement, et après chaque vue) ; ailleurs, ils s'en vont
function ecrireFiltres() {
  const l = listeDeHash(location.hash), q = new URLSearchParams(location.search);
  CLES_FILTRES.forEach(k => q.delete(k));
  if (l) { const [, cle, defauts] = l, f = session[cle] || {}; Object.entries(defauts).forEach(([k, d]) => { const v = f[k] ?? d; if (v != null && v !== '' && String(v) !== String(d)) q.set(k, String(v)); }); }
  const s = q.toString().replace(/%2F/gi, '/').replace(/%2C/gi, ','), url = `${location.pathname}${s ? `?${s}` : ''}${location.hash}`;
  if (url === location.pathname + location.search + location.hash) return;
  history.replaceState(history.state, '', url);
  if (typeof E !== 'undefined' && E.n != null) noterAdresse();
}
// l'adresse ouverte à l'arrivée, au rechargement, au précédent ou au suivant donne ses filtres à sa liste, avant qu'elle se
// dessine (ce qu'elle n'a pas reprend sa valeur d'office) ; un lien suivi, lui, hérite de la partie ?… de la page qu'on
// quitte : la liste reprend alors ce que l'onglet gardait pour elle, et le réécrit
function lireFiltres() {
  const l = listeDeHash(location.hash); if (!l) return;
  const [, cle, defauts] = l, q = new URLSearchParams(location.search);
  if (!Object.keys(defauts).some(k => q.has(k))) return;
  session[cle] = { ...(session[cle] || {}), ...Object.fromEntries(Object.entries(defauts).map(([k, d]) => [k, q.has(k) ? q.get(k) : d])) };
  try { sessionStorage.setItem('crescite-admin-filtres', JSON.stringify(session)); } catch { /* navigation privée */ }
}
// Les listes vides disent pourquoi, en une phrase, et proposent le geste utile : filtrée (filtree vrai) et sans résultat,
// « Effacer les filtres » ; encore vide, ce qui l'ouvre (ajouter : [l'adresse, le libellé], ou rien quand la liste se
// remplit d'ailleurs : les demandes de devis viennent du site). balise : 'li' dans une liste <ul>.
function listeVide(filtree, { rien, aucun, ajouter = null, balise = 'div' }) {
  const geste = filtree ? '<button type="button" class="btn" data-effacer-filtres>Effacer les filtres</button>'
    : ajouter ? `<a class="btn principal" href="${esc(ajouter[0])}">${esc(ajouter[1])}</a>` : '';
  return `<${balise} class="vide liste-vide"><p>${esc(filtree ? rien : aucun)}</p>${geste}</${balise}>`;
}
// « Effacer les filtres » : chaque filtre de la vue reprend sa valeur d'office par son propre chemin (l'événement que la vue
// écoute : la liste se refait, l'adresse suit), puis le focus va à la recherche. La vue d'un tiroir n'est pas touchée.
function effacerFiltres() {
  const vue = $('#vue');
  if (!vue) return;
  const changer = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  $$('.filtres', vue).forEach(f => {
    $$('input[type="search"], input[type="date"]', f).forEach(i => { if (i.value) changer(i, ''); });
    $$('select', f).forEach(s => { const d = s.options[0]; if (d && s.value !== d.value) changer(s, d.value); });
    $$('.puces [aria-pressed="true"]', f).forEach(p => p.click());
    $$('.seg', f).forEach(g => { const b = g.querySelector('button'); if (b && b.getAttribute('aria-pressed') !== 'true') b.click(); });
