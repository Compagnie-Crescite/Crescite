<script>
/* Le dossier d'un spectacle, en PDF, composé à la demande depuis les données du site (D) : pour les programmateurs et
   les directeurs de salle. Toujours à jour avec la base, sans fichier à refaire. build.py l'ajoute aux outils communs ;
   pdfmake (admin/vendor/, publié avec le site) n'est chargé qu'au premier clic.

   DOSSIER.telecharger(slug)   compose le PDF du spectacle et le télécharge (« dossier-<slug>.pdf ») ; rend une promesse
   DOSSIER.pdf(slug)           la même chose, rendue en Blob
   DOSSIER.vendor              le dossier de pdfmake (par défaut admin/vendor/, à côté des maquettes)

   Ce qu'il contient, tiré de D : la couverture (titre, sous-titre, création, photo, couleur de l'univers), le spectacle
   (sa présentation), la distribution (D.shows[].equipe ou « avec », puis la fiche), les conditions d'accueil (format,
   durée, jauge, équipe, et la fiche technique quand le dossier du spectacle l'a), la diffusion (représentations, lieux),
   la production, et le contact diffusion (D.site.programmation). Aucun texte n'est inventé : seuls les intitulés
   viennent de D.site.libelles. */
const DOSSIER = (() => {
  'use strict';
  const L = () => (D.site && D.site.libelles) || {};
  const ENCRE = '#1d1720', GRIS = '#5f5763', TRAIT = '#dcd5db', LARGEUR = 595.28 - 2 * 52;
  let chargement = null;
  const script = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(`impossible de charger ${src}`)); document.head.append(s); });
  function charger() {
    if (typeof pdfMake !== 'undefined' && pdfMake.vfs && pdfMake.vfs['Roboto-Regular.ttf']) return Promise.resolve();
    if (!chargement) {
      const dossier = String(api.vendor).replace(/\/?$/, '/');
      chargement = (typeof pdfMake !== 'undefined' ? Promise.resolve() : script(dossier + 'pdfmake.min.js'))
        .then(() => (pdfMake.vfs && pdfMake.vfs['Roboto-Regular.ttf'] ? null : script(dossier + 'vfs_fonts.js')))
        .catch(e => { chargement = null; throw e; });
    }
    return chargement;
  }
  // la police du PDF (Roboto) n'a pas certains signes : on les remplace
  const pt = s => String(s ?? '').replace(/ /g, ' ').replace(/[→⟶]/g, '–');
  // du HTML des sources vers des morceaux de texte pdfmake : italique, gras, retours à la ligne
  function morceaux(html) {
    const doc = new DOMParser().parseFromString(`<div>${String(html ?? '')}</div>`, 'text/html');
    const out = [];
    const marcher = (n, st) => {
      if (n.nodeType === 3) { if (n.textContent) out.push({ text: pt(n.textContent), ...st }); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase();
      if (t === 'br') { out.push({ text: '\n' }); return; }
      const s2 = { ...st, ...(t === 'em' || t === 'i' ? { italics: true } : {}), ...(t === 'strong' || t === 'b' ? { bold: true } : {}) };
      n.childNodes.forEach(c => marcher(c, s2));
      if (t === 'p' || t === 'li') out.push({ text: '\n' });
    };
    doc.body.firstChild.childNodes.forEach(c => marcher(c, {}));
    while (out.length && out[out.length - 1].text === '\n') out.pop();
    return out.length ? out : [{ text: '' }];
  }
  const brut = html => morceaux(html).map(x => x.text).join('').trim();
  const maj = t => pt(t).charAt(0).toUpperCase() + pt(t).slice(1);
  // une photo en JPEG (pdfmake ne lit ni le WebP ni les adresses), recadrée au centre : au rapport largeur/hauteur « ratio »,
  // ou au moins « large » (une photo en hauteur ne mange pas la couverture) ; rien si elle ne se charge pas
  async function image(url, { max = 1400, ratio = 0, large = 0 } = {}) {
    if (!url) return null;
    try {
      const r = await fetch(url, { mode: 'cors' });
      if (!r.ok) return null;
      const bmp = await createImageBitmap(await r.blob());
      let sx = 0, sy = 0, sl = bmp.width, sh = bmp.height;
      const voulu = ratio || (large && sl / sh < large ? large : 0);
      if (voulu && sl / sh > voulu) { sl = Math.round(sh * voulu); sx = Math.round((bmp.width - sl) / 2); }
      else if (voulu) { sh = Math.round(sl / voulu); sy = Math.round((bmp.height - sh) / 2); }
      const k = Math.min(1, max / Math.max(sl, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sl * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(bmp, sx, sy, sl, sh, 0, 0, c.width, c.height);
      return { data: c.toDataURL('image/jpeg', 0.86), l: c.width, h: c.height };
    } catch { return null; }
  }
  const titreSection = (t, couleur) => ({ intitule: true, stack: [{ text: pt(t).toUpperCase(), fontSize: 8.5, bold: true, characterSpacing: 1.3, color: couleur },
    { canvas: [{ type: 'line', x1: 0, y1: 3, x2: LARGEUR, y2: 3, lineWidth: 0.6, lineColor: TRAIT }] }], margin: [0, 20, 0, 6] });
  const sobre = { hLineWidth: (i, n) => (i === 0 || i === n.table.body.length ? 0 : 0.5), vLineWidth: () => 0, hLineColor: () => TRAIT,
    paddingLeft: i => (i === 0 ? 0 : 10), paddingRight: () => 0, paddingTop: () => 4, paddingBottom: () => 4 };

  async function definition(slug) {
    const s = (D.shows || []).find(x => x.slug === slug);
    if (!s) throw new Error(`spectacle inconnu : ${slug}`);
    const lib = L(), couleur = s.couleurTexteClair || s.couleur || '#a3306b';
    const nom = (D.site && D.site.nom) || 'Compagnie Crescite';
    const photos = D.photos || {};
    const [principale, ...galerie] = await Promise.all([image(photos[s.slug], { max: 1600, large: 1.4 }),
      ...(s.photos || []).slice(0, 2).map(p => image(photos[p.cle], { max: 1000, ratio: 3 / 2 }))]);
    const contenu = [];
    // la couverture
    contenu.push({ canvas: [{ type: 'rect', x: 0, y: 0, w: LARGEUR, h: 5, color: couleur }] });
    contenu.push({ text: pt(nom).toUpperCase(), fontSize: 8.5, bold: true, characterSpacing: 1.4, color: GRIS, margin: [0, 14, 0, 0] });
    contenu.push({ text: pt((s.titreLignes || [s.titre]).join(' ')), fontSize: 30, bold: true, color: couleur, margin: [0, 8, 0, 0], lineHeight: 1.02 });
    if (s.sousTitre) contenu.push({ text: morceaux(s.sousTitre), fontSize: 12.5, color: ENCRE, margin: [0, 4, 0, 0] });
    const sous = [s.creation, s.duree].filter(Boolean).map(x => maj(brut(x))).join('   ·   ');
    if (sous) contenu.push({ text: pt(sous), fontSize: 10, color: GRIS, margin: [0, 8, 0, 0] });
    if (principale) contenu.push({ image: principale.data, width: LARGEUR, margin: [0, 16, 0, 0] });
    if (s.credit) contenu.push({ text: morceaux(s.credit), fontSize: 7.5, color: GRIS, alignment: 'right', margin: [0, 3, 0, 0] });
    if (s.accroche) contenu.push({ text: morceaux(s.accroche), fontSize: 13, italics: true, margin: [0, 16, 0, 0], lineHeight: 1.3 });
    // le spectacle
    if ((s.texte || []).length) {
      contenu.push(titreSection(lib.leSpectacle || 'Le spectacle', couleur));
      s.texte.forEach((p, i) => contenu.push({ text: morceaux(p), margin: [0, i ? 6 : 0, 0, 0], alignment: 'justify' }));
    }
    if (galerie.filter(Boolean).length) {
      const g = galerie.filter(Boolean), l = (LARGEUR - 10 * (g.length - 1)) / g.length;
      contenu.push({ columns: g.map(x => ({ image: x.data, width: l })), columnGap: 10, margin: [0, 14, 0, 0] });
    }
    // la distribution
    const equipe = s.equipe || [], P = D.personnes || {};
    const nomDe = x => { const p = P[x.personne] || {}; return [p.prenom, p.nom].filter(Boolean).join(' '); };
    const jeu = equipe.filter(x => x.categorie === 'jeu');
    // un spectacle en création n'a parfois que l'équipe de création annoncée (« Mise en scène : … ») : elle remplace la fiche
    const creation = (s.programmer && s.programmer.equipeCreation) || [];
    const fiche = (s.fiche || []).filter(f => f.valeur && (f.libelle || !creation.length));
    if (jeu.length || s.avec || fiche.length || creation.length) {
      contenu.push(titreSection(lib.distribution || 'Distribution', couleur));
      if (jeu.length) contenu.push({ text: jeu.map((x, i) => [{ text: (i ? ', ' : '') + pt(nomDe(x)), bold: true }, ...(x.alternance ? [{ text: pt(` (${x.alternance})`), color: GRIS }] : [])]).flat(), margin: [0, 0, 0, 6] });
      else if (s.avec) contenu.push({ text: [{ text: pt(brut(s.avec.libelle)) + ' ', color: GRIS }, ...morceaux(s.avec.valeur)], margin: [0, 0, 0, 6] });
      creation.forEach(x => { const [l, ...v] = brut(x).split(' : ');
        contenu.push({ text: v.length ? [{ text: pt(l) + ' : ', color: GRIS }, { text: pt(v.join(' : ')) }] : pt(l), margin: [0, 0, 0, 3] }); });
      const avecLibelle = fiche.filter(f => f.libelle), sans = fiche.filter(f => !f.libelle);
      if (avecLibelle.length) contenu.push({ table: { widths: [150, '*'], body: avecLibelle.map(f => [{ text: pt(brut(f.libelle)), color: GRIS }, { text: morceaux(f.valeur) }]) }, layout: sobre });
      sans.forEach(f => contenu.push({ text: morceaux(f.valeur), margin: [0, 2, 0, 0] }));
    }
    // les conditions d'accueil
    const pr = s.programmer || {}, accueil = s.dossier && D.dossiers && D.dossiers[s.dossier] && D.dossiers[s.dossier].accueil;
    // la fiche technique du dossier reprend déjà la durée, la jauge et l'équipe : on ne les écrit pas deux fois
    const lignes = (accueil ? [pr.format] : [pr.format, pr.duree || s.duree, pr.jauge, pr.equipe]).filter(Boolean);
    if (lignes.length || accueil) {
      contenu.push(titreSection(lib.conditionsAccueil || 'Conditions d’accueil', couleur));
      lignes.forEach((x, i) => contenu.push({ text: maj(brut(x)), bold: i === 0 && x === pr.format, margin: [0, 0, 0, 3] }));
      // chaque bloc de la fiche technique (« PLATEAU : », « MATÉRIEL… ») reste d'un seul tenant
      if (accueil) (accueil.blocs || []).forEach(b => contenu.push({ unbreakable: true, stack: [
        ...(b.titre ? [{ text: pt(brut(b.titre)), bold: true, fontSize: 9.5, margin: [0, 8, 0, 2] }] : []),
        ...(b.lignes || []).map(x => ({ text: morceaux(x), margin: [0, 0, 0, 2] }))] }));
      if (lib.conditionsFinancieres) contenu.push({ text: pt(lib.conditionsFinancieres), color: GRIS, margin: [0, 8, 0, 0] });
    }
    // la diffusion
    if (pr.representations || pr.lieux || pr.actualite) {
      contenu.push(titreSection(lib.representations || 'Représentations', couleur));
      if (pr.representations) contenu.push({ text: maj(brut(pr.representations)), bold: true, margin: [0, 0, 0, 4] });
      if (pr.actualite) contenu.push({ text: maj(brut(pr.actualite)), margin: [0, 0, 0, 4] });
      if (pr.lieux) contenu.push({ text: [{ text: pt(lib.lieuxDiffusion || '') + (lib.lieuxDiffusion ? ' : ' : ''), color: GRIS }, ...morceaux(pr.lieux)] });
    }
    // la production
    if ((s.production || []).length) {
      contenu.push(titreSection(lib.production || 'Production', couleur));
      s.production.forEach(x => contenu.push({ text: morceaux(x), fontSize: 9, margin: [0, 0, 0, 3] }));
    }
    // le contact
    const c = (D.site && D.site.programmation && D.site.programmation.contact) || {};
    if (c.nom || c.email) {
      contenu.push(titreSection(lib.contactDiffusion || 'Contact', couleur));
      contenu.push({ text: [{ text: pt(c.nom || ''), bold: true }, ...(c.role ? [{ text: pt(`, ${c.role}`), color: GRIS }] : [])] });
      if (c.email) contenu.push({ text: pt(c.email), link: `mailto:${c.email}`, color: couleur });
      if (c.telephone) contenu.push({ text: pt(c.telephone), link: `tel:${String(c.telephone).replace(/[^\d+]/g, '')}` });
      const co = D.site.coordonnees || {};
      const adresse = [co.nom, ...(co.adresse || [])].filter(Boolean).map(brut);
      if (adresse.length) contenu.push({ text: pt(adresse.join(' · ')), color: GRIS, fontSize: 8.5, margin: [0, 6, 0, 0] });
    }
    // un intitulé de section n'est jamais seul en bas de page : il part avec l'élément qui le suit
    for (let i = contenu.length - 2; i >= 0; i--) {
      if (contenu[i].intitule) contenu.splice(i, 2, { unbreakable: true, stack: [contenu[i], contenu[i + 1]] });
    }
    return {
      pageSize: 'A4', pageMargins: [52, 54, 52, 50],
      info: { title: pt(`${s.titre} · ${nom}`), author: pt(nom) },
      defaultStyle: { font: 'Roboto', fontSize: 9.8, lineHeight: 1.28, color: ENCRE },
      header: page => (page === 1 ? null : { margin: [52, 24, 52, 0], columns: [
        { text: pt(nom), fontSize: 7.5, color: GRIS }, { text: pt(s.titre), fontSize: 7.5, color: GRIS, alignment: 'right' }] }),
      footer: (page, pages) => ({ margin: [52, 18, 52, 0], columns: [
        { text: pt(`${nom} · ${s.titre}`), fontSize: 7.5, color: GRIS }, { text: `${page} / ${pages}`, fontSize: 7.5, color: GRIS, alignment: 'right' }] }),
      content: contenu,
    };
  }
  async function pdf(slug) {
    await charger();
    const dd = await definition(slug);
    return new Promise((ok, ko) => { try { pdfMake.createPdf(dd).getBlob(ok); } catch (e) { ko(e); } });
  }
  async function telecharger(slug) {
    const blob = await pdf(slug);
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `dossier-${slug}.pdf`; a.rel = 'noopener';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return blob;
  }
  const api = { telecharger, pdf, definition, vendor: 'admin/vendor/' };
  return api;
})();
</script>
<script>
/* Les frises chronologiques, communes aux maquettes (règle 15 D du contrat) : un moteur de frise, comme carte.js l'est pour
   la carte. Partout où il y a un calendrier, une frise le rend lisible d'un regard : les mois (ou les années), les dates
   aux couleurs de leur spectacle, « aujourd'hui » qui respire. Chaque maquette l'habille dans son univers (variables
   --fr-* et classes, voir plus bas). build.py l'ajoute après dossier.js et le copie à côté de l'administration.

   FRISE.creer(conteneur, options) → frise          (la frise est ajoutée dans le conteneur)
   options
     echelle      'saison'   de septembre à août de `saison` ('2026-2027')
                  'annees'   plusieurs saisons, en bandes : de `debut` à `fin` ('2016-2017', '2026-2027' ou 'AAAA-MM-JJ')
                  'periode'  de `debut` à `fin` ('AAAA-MM-JJ'), libres ; sans eux, les mois (ou les années) des points
     aujourdhui   'AAAA-MM-JJ' (D.aujourdhui) : le repère « aujourd'hui » (libellé D.site.libelles.aujourdhui), qui respire
     points       [{ id, jour, fin, couleur, titre, quand, texte, lien, slug, l, scolaire, annulee, etat, annee }]
                    jour, fin  'AAAA-MM-JJ' (fin : le dernier jour ; une date longue devient un trait)
                    quand      la date écrite comme l'agenda (d.ligneDate…) ; sans elle, AGENDA.quand ; annee : une année seule
                    titre      le spectacle ; l : la commune (CARTE.lieux[l]) ; texte : une ligne de plus dans la bulle
                    lien       le repère est un lien ; sinon un bouton (choix)
                    scolaire, annulee (barrée), etat (« date annulée » : écrit dans la bulle)
                    id         la clé du repère : relie la liste ([data-frise-id] ou [data-date-id]) et fait glisser (maj)
     bandes       [{ id, debut, fin, titre, n, lien, etiquette }] : une saison et sa densité (échelle annees) ;
                    etiquette : le nom court sous la bande (par défaut les années de la saison, « 2019-2020 »)
     orientation  'auto' (horizontale ; au doigt, elle défile, aimantée aux mois) · 'horizontale' · 'verticale'
     regrouper    14 (px) : des repères d'un jour plus proches que cela forment une grappe, avec leur nombre
     couloirs     3 : les repères qui se chevauchent passent en couloirs (au-delà, ils se superposent)
     etiquettes   false · true : le titre de chaque repère est écrit au-dessus de lui (une frise historique) ; les points restent
                  sur l'axe, les étiquettes montent en couloirs, un filet les relie ; largeurCar (6.6 px par caractère) et
                  largeurMax (170 px) : la place d'une étiquette, si la maquette les écrit plus grandes
     relier       { liste, carte } (réglé à la création)
                    liste  un élément : survoler un repère allume sa ligne [data-frise-id="<id>"] (ou [data-date-id="<id>"]),
                           et survoler une ligne allume son repère
                    carte  le SVG d'une carte (communes .carte-lieu[data-l]) : survoler un repère allume sa commune
                           (classe est-allume), survoler une commune allume ses repères ; ou une fonction (l | null)
     survol(p)    au survol et au focus d'un repère (p ; null en sortant) ; choix(p) au clic et à Entrée
     libelle      le nom de la liste pour les lecteurs d'écran (un texte de D)
     largeur      la largeur attendue en px (sinon estimée, puis mesurée par ResizeObserver)
     moisMin, anMin   76 et 72 (px) : la place d'un mois, d'une année, sous laquelle la frise défile au doigt
     immediat     true : la frise est là d'emblée, sans son entrée (une vue refaite en place quand D change)
     classe       une classe de plus sur .frise
   frise.maj(options)          change les points, les bandes ou les options : les repères glissent à leur place (FLIP),
                               ceux qui arrivent paraissent, ceux qui partent s'effacent
   frise.allumer(id | { l })   allume un repère (ou les repères d'une commune) ; frise.eteindre() ; frise.points (le modèle)
   frise.aller(id)             fait défiler la frise jusqu'au repère et l'allume
   frise.detruire()            retire la frise et ses observateurs ; frise.el : l'élément .frise
   FRISE.jour('AAAA-MM-JJ')    le numéro du jour (UTC) ; FRISE.permis() : faux si moins d'animations est demandé ou ?anim=0

   Le rendu : une vraie liste ordonnée dans l'ordre du temps (<ol>), un lien ou un bouton par repère ; les flèches passent
   d'un repère à l'autre (Début, Fin) ; chaque repère a pour nom la date écrite comme l'agenda, le titre et la commune ;
   une bulle les montre au survol et au focus. Les mois et les années viennent des dates (AGENDA.MOIS), « aujourd'hui »
   de D.site.libelles.aujourdhui : aucun autre texte. Un seul innerHTML, positions en pourcentage, mouvements par
   transform et opacity, délégation d'évènements ; la largeur se lit par ResizeObserver (jamais de lecture en boucle).
   Le mouvement : l'axe se trace quand la frise entre dans l'écran et les repères arrivent dans l'ordre du temps : ils sont
   dévoilés de gauche à droite avec lui (une seule animation par conteneur, 840 ms en tout) ; « aujourd'hui » respire.
   prefers-reduced-motion ou ?anim=0 : immobile et complète tout de suite.

   L'habillage (des styles de base sobres, injectés une fois en tête de <head>, sans poids : :where(), donc la moindre
   règle de la maquette les remplace) :
     variables  --fr-encre (les libellés), --fr-trait (l'axe, les graduations), --fr-fond (le fond sous les repères),
                --fr-accent (allumé, aujourd'hui), --fr-passe (l'opacité du passé, .38), --fr-point (10px),
                --fr-couloir (16px), --fr-haut (la marge haute, 26px), --fr-taille (12px), --fr-police, --fr-courbe,
                --fr-bande-h (46px), --fr-marge (14px), --fr-bulle-fond, --fr-bulle-encre ; par repère : --fr-c (sa couleur),
                --fr-x (sa place, en %), --fr-y (son couloir), --fr-t (0 → 1 : son rang dans le temps, pour un décalage à la
                maquette) ; par bande : --fr-d (sa densité, 0 → 1)
     classes    .frise (+ .frise--saison/--annees/--periode, .frise--h/--v, .frise--mois/--ans, .est-vue, .est-immobile)
                .frise-piste (ce qui défile) .frise-toile .frise-axe .frise-mois (> li, .frise-mois-nom, .frise-an)
                .frise-points (> li.frise-point) .frise-repere (le lien ou bouton ; son ::before est le point dessiné)
                .frise-etiquette .frise-grappe (.frise-grappe-n) .frise-bandes (> li.frise-bande, .frise-bande-barre,
                .frise-bande-n, .frise-bande-nom) .frise-aujourdhui (.frise-aujourdhui-nom) .frise-bulle
                états : .est-passe .est-allume .est-annule .est-scolaire .est-duree .est-groupe .est-focus .est-a-droite
                (une étiquette tournée vers la gauche) ; .est-deja (sans entrée) ; .frise-partants (ceux qui s'effacent, maj)
   Attention : m03, m04 et m06 ont déjà une classe .frise à elles ; les styles de base ne visent que .frise[data-frise]. */
const FRISE = (() => {
  'use strict';
  const MOIS = typeof AGENDA !== 'undefined' && AGENDA.MOIS ? AGENDA.MOIS
    : ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const COUPE = (() => { try { return new URLSearchParams(location.search).get('anim') === '0'; } catch (e) { return false; } })();
  const permis = () => !COUPE && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }, A_ESC = /[&<>"]/;
  const esc = s => { s = String(s ?? ''); return A_ESC.test(s) ? s.replace(/[&<>"]/g, c => ESC[c]) : s; };
  const f3 = x => String(Math.round(x * 1000) / 1000);
  // le numéro du jour d'une date 'AAAA-MM-JJ' (UTC), gardé en mémoire : les mêmes dates reviennent à chaque rendu
  const memo = new Map();
  const jour = iso => {
    if (typeof iso !== 'string' || iso.length < 10) return NaN;
    let v = memo.get(iso);
    if (v === undefined) {
      v = /^\d{4}-\d{2}-\d{2}/.test(iso) ? Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5 : NaN;
      if (memo.size > 6000) memo.clear();
      memo.set(iso, v);
    }
    return v;
  };
  const jourDe = (a, m, j = 1) => Date.UTC(a, m - 1, j) / 864e5;
  const isoDe = n => new Date(n * 864e5).toISOString().slice(0, 10);
  const COURBE = 'cubic-bezier(.2, .7, .2, 1)';
  const libelleAujourdhui = () => (typeof D !== 'undefined' && D && D.site && D.site.libelles && D.site.libelles.aujourdhui) || '';

  /* ---------------------------------------------------------------------------------------------- les styles de base */
  const STYLE = `
:where(.frise[data-frise]) { --fr-encre: currentColor; --fr-trait: color-mix(in srgb, currentColor 30%, transparent); --fr-fond: #fff;
  --fr-accent: currentColor; --fr-passe: .38; --fr-point: 10px; --fr-couloir: 16px; --fr-haut: 26px; --fr-taille: 12px; --fr-police: inherit;
  --fr-courbe: ${COURBE}; --fr-bande-h: 46px; --fr-bulle-fond: #1d1418; --fr-bulle-encre: #fff; --fr-pied: 40px; --fr-marge: 14px;
  position: relative; display: block; font-family: var(--fr-police); color: var(--fr-encre); }
:where(.frise[data-frise]) :where(.frise-piste) { position: relative; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
  scroll-snap-type: x proximity; scroll-padding-inline: var(--fr-marge); padding: 0 var(--fr-marge); scrollbar-width: thin; -webkit-overflow-scrolling: touch; outline: none; }
:where(.frise[data-frise]) :where(.frise-toile) { position: relative; width: 100%; min-width: calc(var(--fr-n) * var(--fr-unite));
  --fr-axe: calc(var(--fr-haut) + var(--fr-nc) * var(--fr-couloir)); height: calc(var(--fr-axe) + var(--fr-pied)); }
:where(.frise[data-frise].frise--annees) :where(.frise-toile) { --fr-axe: calc(var(--fr-haut) + var(--fr-bande-h)); }
:where(.frise[data-frise].frise--etiquettes) { --fr-couloir: 40px; }
:where(.frise[data-frise]) :where(.frise-axe) { position: absolute; left: 0; right: 0; top: var(--fr-axe); height: 1px; margin-top: -.5px;
  background: var(--fr-trait); transform-origin: 0 50%; }
:where(.frise[data-frise]) :where(.frise-mois, .frise-points, .frise-bandes, .frise-grappes) { list-style: none; margin: 0; padding: 0; }
:where(.frise[data-frise]) :where(.frise-points, .frise-bandes, .frise-grappes) { position: absolute; inset: 0; pointer-events: none; }
:where(.frise[data-frise]) :where(.frise-mois) > li { position: absolute; top: var(--fr-axe); left: calc(var(--fr-x) * 1%); height: 6px;
  border-left: 1px solid var(--fr-trait); scroll-snap-align: start; white-space: nowrap; font-size: var(--fr-taille); line-height: 1.2; }
:where(.frise[data-frise]) :where(.frise-mois) > li > span:first-child { position: absolute; left: 5px; top: 8px; }
:where(.frise[data-frise]) :where(.frise-mois) > li.est-mineur { height: 4px; scroll-snap-align: none; }
:where(.frise[data-frise]) :where(.frise-an) { display: block; opacity: .6; font-size: .92em; }
:where(.frise[data-frise]) :where(.frise-point, .frise-grappe, .frise-bande) { position: absolute; left: calc(var(--fr-x) * 1%);
  top: calc(var(--fr-axe) - var(--fr-y, 0) * var(--fr-couloir)); width: 0; height: 0; pointer-events: none; }
:where(.frise[data-frise]) :where(.frise-point.est-duree, .frise-bande) { width: calc(var(--fr-w) * 1%); }
:where(.frise[data-frise]) :where(.frise-repere) { position: absolute; left: 0; top: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px; padding: 0;
  display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: inherit; font: inherit; cursor: pointer;
  pointer-events: auto; text-decoration: none; -webkit-tap-highlight-color: transparent; }
:where(.frise[data-frise]) :where(.frise-repere):focus-visible { outline: 2px solid var(--fr-accent); outline-offset: 1px; }
:where(.frise[data-frise]) :where(.frise-point) > :where(.frise-repere)::before { content: ""; display: block; width: var(--fr-point); height: var(--fr-point);
  border-radius: 50%; background: var(--fr-c, currentColor); box-shadow: 0 0 0 2px var(--fr-fond); transition: scale .16s var(--fr-courbe), opacity .16s; }
:where(.frise[data-frise]) :where(.frise-point) > :where(.frise-repere:hover, .frise-repere:focus-visible)::before,
:where(.frise[data-frise]) :where(.frise-point.est-allume, .frise-point.est-focus) > :where(.frise-repere)::before { scale: 1.45; }
:where(.frise[data-frise]) :where(.frise-point.est-passe) > :where(.frise-repere)::before { opacity: var(--fr-passe); }
:where(.frise[data-frise]) :where(.frise-point.est-passe.est-allume, .frise-point.est-passe.est-focus) > :where(.frise-repere)::before { opacity: 1; }
:where(.frise[data-frise]) :where(.frise-point.est-scolaire:not(.est-duree)) > :where(.frise-repere)::before { border-radius: 2px; rotate: 45deg; width: calc(var(--fr-point) * .86); height: calc(var(--fr-point) * .86); }
:where(.frise[data-frise]) :where(.frise-point.est-annule) > :where(.frise-repere)::before { background: var(--fr-fond); box-shadow: inset 0 0 0 1.5px var(--fr-c, currentColor), 0 0 0 2px var(--fr-fond); }
:where(.frise[data-frise]) :where(.frise-point.est-annule) > :where(.frise-repere)::after { content: ""; position: absolute; left: 50%; top: 50%; width: calc(var(--fr-point) + 6px);

    f.mesure = w => {
      if (!w || o.orientation === 'verticale') return;
      largeurLue = w;
      if (Math.abs(w - largeur) < 1 && f.modele) { centrer(); return; }
      largeur = w;
      const avant = f.modele && f.modele.sig;
      // la largeur a changé : on refait seulement si les grappes ou les couloirs changent
      if (f.modele) {
        const lus = lire(o.points), [t0, t1] = bornes(o, lus), G = graduations(t0, t1, o), W = Math.max(largeur, G.unites * (G.mois ? o.moisMin : o.anMin));
        f.W = W;
        // refaite (les grappes ou les couloirs changent avec la largeur) : on centre à l'image suivante, sans lecture forcée
        if (lus.length && signature(placer(o, W, t0, t1, lus)) !== avant) { rendre(false); requestAnimationFrame(centrer); return; }
      }
      centrer();
    };
    f.voir = () => { if (!f.vu) { f.vu = true; el.classList.add('est-vue'); } requestAnimationFrame(centrer); };
    f.fin = () => {
      if (io) io.unobserve(el);
      if (ro) ro.unobserve(piste);
      f.ecouteurs.forEach(([c, t, fn, opt]) => c.removeEventListener(t, fn, opt));
      f.ecouteurs = [];
      vivantes.delete(f);
    };

    rendre(false);
    conteneur.appendChild(el);
    relier();
    observer(f);
    const api = {
      el,
      get points() { return f.modele ? f.modele.M.pts.map(q => q.p) : []; },
      maj(nouvelles = {}) { o = Object.assign({}, o, nouvelles); rendre(true); return api; },
      allumer: (cle) => allumer(cle),
      eteindre: () => { eteindre(); cacher(); },
      aller(cle) {
        const M = f.modele && f.modele.M; if (!M) return;
        const q = M.pts.find(x => String(x.p.id) === String(cle) || x.cle === cle);
        if (!q) return;
        const x = q.grappe ? q.xg : q.x;
        if (largeurLue && f.W > largeurLue + 1) piste.scrollTo({ left: x / 100 * f.W - largeurLue / 2, behavior: permis() ? 'smooth' : 'auto' });
        allumer(q.cle);
      },
      detruire() { f.fin(); el.remove(); },
    };
    return api;
  }

  return { creer, jour, iso: isoDe, permis };
})();

<script>
/* Le mouvement, commun aux maquettes (règle 15 B du contrat) : la boîte à outils dont chaque maquette tire SA signature.
   Rien ne retarde une navigation ni un rendu : les écouteurs sont passifs, seuls transform et opacity bougent (et clip-path
   pour un masque), une transition en cours se termine proprement au geste suivant. prefers-reduced-motion ou ?anim=0 :
   rien ne bouge, tout est là tout de suite. build.py l'ajoute après frise.js et le copie à côté de l'administration.

   MOUVEMENT.permis()
     false si le visiteur a demandé moins d'animations, ou avec ?anim=0 dans l'adresse.

   MOUVEMENT.transition(rendre, { type, depuis }) → promesse (résolue quand rendre() a été appelée)
     Enveloppe un changement de page : document.startViewTransition si le navigateur l'a et que le mouvement est permis ;
     sinon un fondu court (180 ms) de <main>. rendre() s'exécute toujours, et tout de suite si le mouvement est coupé ;
     avec View Transitions, elle s'exécute dans le rappel de la transition (une image plus tard) : mettez-y tout le
     changement (le contenu, document.title, le focus, le défilement).
     type    posé en data-mv-transition sur <html> le temps de la transition : la maquette écrit ses
             html[data-mv-transition="spectacle"]::view-transition-old(root) { … } (styles de base : un fondu de 240 ms).
     depuis  un élément qui porte data-mv-nom="…" (la carte cliquée) : il reçoit view-transition-name: mv-partage, et
             après rendre(), l'élément de la nouvelle page qui porte le même data-mv-nom le reçoit à son tour : la carte
             devient l'en-tête (::view-transition-group(mv-partage) pour l'habiller).
     Interruptible : un nouveau geste (pointeur, clavier, molette) termine la transition aussitôt ; un clic donné pendant
     la transition (le navigateur l'adresse alors à <html>) est relancé sur l'élément qui est sous le doigt.

   MOUVEMENT.reveler(racine, { immediat })
     Les éléments [data-mv] de racine apparaissent quand ils entrent dans l'écran, une seule fois :
       data-mv="monte"    il monte de 14 px en paraissant        data-mv="fondu"   il paraît
       data-mv="trace"    il se trace de gauche à droite (un filet : transform scaleX ; un SVG : ses tracés pathLength="1")
       data-mv="masque"   il se découvre de haut en bas (clip-path)
       data-mv="cascade"  ses enfants l'un après l'autre (45 ms, douze au plus ; --mv-i est posé sur chacun)
       data-mv="compte"   le nombre qu'il affiche compte jusqu'à sa valeur (MOUVEMENT.compter)
       data-mv-delai="120" un retard en ms.
     { immediat: true } : tout est montré sans mouvement (une vue refaite en place quand D change).
     Classes : .mv-attente (en attente, l'état de départ), .mv-vu (montré) ; variables --mv-courbe, --mv-i, --mv-delai.

   MOUVEMENT.cascade(el, { selecteur, pas, max, duree, decalage })
     Les enfants de el (ou ceux du sélecteur) paraissent l'un après l'autre, tout de suite : un contenu qui se déplie
     (une saison qu'on ouvre, un menu). pas 22 ms, max 14 (les suivants sont là d'emblée), duree 260 ms, decalage -6 px.

   MOUVEMENT.flip(conteneur, changer, { cle, duree })
     Les positions avant, changer() (le nouveau rendu), les positions après : les éléments glissent à leur nouvelle place,
     ceux qui arrivent paraissent, ceux qui partent s'effacent sur place. cle : '[data-mv-cle]' (par défaut) ou un autre
     attribut ('[data-date-id]') : la valeur de l'attribut est la clé. Seuls les éléments proches de l'écran bougent ; un
     nouveau flip sur le même conteneur reprend depuis les positions à l'écran. duree 280 ms.

   MOUVEMENT.compter(el, { duree })
     Le premier nombre du texte de el compte de 0 à sa valeur (900 ms) ; le texte final est celui de D, rendu tel quel
     à la fin, et les lecteurs d'écran ne lisent que lui (le nombre qui compte est aria-hidden).

   MOUVEMENT.presse(racine)
     La classe .mv-presse sur le lien ou le bouton pressé, dès le pointerdown (dans la même image), retirée au pointerup,
     au pointercancel ou en quittant ; Entrée et Espace aussi. La maquette écrit le style de la pression. */
const MOUVEMENT = (() => {
  'use strict';
  const COUPE = (() => { try { return new URLSearchParams(location.search).get('anim') === '0'; } catch (e) { return false; } })();
  const reduit = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const permis = () => !COUPE && !(reduit && reduit.matches);
  const COURBE = 'cubic-bezier(.2, .7, .2, 1)';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const STYLE = `
:root { --mv-courbe: ${COURBE}; }
:where(.mv-lecteur) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:where([data-mv].mv-attente) { transition: opacity .5s var(--mv-courbe), transform .6s var(--mv-courbe), clip-path .7s var(--mv-courbe);
  transition-delay: var(--mv-delai, 0ms); }
:where([data-mv="fondu"].mv-attente:not(.mv-vu)) { opacity: 0; }
:where([data-mv="monte"].mv-attente:not(.mv-vu)) { opacity: 0; transform: translateY(14px); }
:where([data-mv="masque"].mv-attente:not(.mv-vu)) { clip-path: inset(0 0 100% 0); }
:where([data-mv="trace"].mv-attente:not(svg):not(.mv-vu)) { transform: scaleX(0); transform-origin: 0 50%; }
:where(svg[data-mv="trace"].mv-attente) :where([pathLength]) { transition: stroke-dashoffset .9s var(--mv-courbe); transition-delay: var(--mv-delai, 0ms);
  stroke-dasharray: 1 1; }
:where(svg[data-mv="trace"].mv-attente:not(.mv-vu)) :where([pathLength]) { stroke-dashoffset: 1; }
:where([data-mv="cascade"].mv-attente) > * { transition: opacity .45s var(--mv-courbe), transform .5s var(--mv-courbe);
  transition-delay: calc(var(--mv-delai, 0ms) + min(var(--mv-i, 0), 12) * 45ms); }
:where([data-mv="cascade"].mv-attente:not(.mv-vu)) > * { opacity: 0; transform: translateY(10px); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .24s; animation-timing-function: ${COURBE}; }
::view-transition-group(mv-partage) { animation-duration: .38s; animation-timing-function: ${COURBE}; overflow: clip; }
::view-transition-old(mv-partage), ::view-transition-new(mv-partage) { height: 100%; object-fit: cover; animation-duration: .38s; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  :where([data-mv]), :where([data-mv]) > *, :where([data-mv]) [pathLength] { transition: none !important; } }`;
  function styles() {
    if (document.getElementById('mouvement-style') || !document.head) return;
    const s = document.createElement('style');
    s.id = 'mouvement-style';
    s.textContent = STYLE;
    document.head.insertBefore(s, document.head.firstChild);   // en tête : la maquette passe après
  }
  styles();

  /* ---------------------------------------------------------------------------------------------- les transitions de page */
  let enCours = null, fondu = null, relance = null;
  const html = document.documentElement;
  // un geste pendant la transition la termine ; un clic adressé à <html> (le navigateur le fait pendant une View
  // Transition) est relancé sur l'élément qui est sous le doigt
  const ACTION = 'a[href], button, summary, label, input, select, textarea, [role="button"], [role="link"], [role="tab"], [tabindex]';
  function surGeste(e) {
    if (!enCours) return;
    if (e.type === 'pointerdown' && e.target === html) relance = { x: e.clientX, y: e.clientY, t: performance.now() };
    try { enCours.skipTransition(); } catch (err) { /* déjà finie */ }
  }
  function surClic(e) {
    const r = relance;
    if (!r || e.target !== html || performance.now() - r.t > 1500) return;
    relance = null;
    const el = document.elementFromPoint(r.x, r.y), c = el && el.closest(ACTION);
    if (!c || c === html) return;
    if (c.matches('input, select, textarea')) c.focus(); else c.click();
  }
  let ecoute = false;
  function ecouter(oui) {
    if (oui === ecoute) return;
    ecoute = oui;
    const f = oui ? 'addEventListener' : 'removeEventListener', o = { capture: true, passive: true };
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => window[f](t, surGeste, o));
  }
  window.addEventListener('click', surClic, { capture: true, passive: true });

  function transition(rendre, { type = 'page', depuis = null } = {}) {
    // une transition en cours se termine tout de suite (son rendu a lieu quand même)
    if (enCours) { try { enCours.skipTransition(); } catch (e) { /* finie */ } }
    if (fondu) { try { fondu.finish(); } catch (e) { /* finie */ } fondu = null; }
    if (!permis() || document.hidden) { rendre(); return Promise.resolve(); }
    const nom = depuis && depuis.getAttribute ? depuis.getAttribute('data-mv-nom') : null;
    if (typeof document.startViewTransition === 'function') {
      html.setAttribute('data-mv-transition', type);
      if (nom) depuis.style.viewTransitionName = 'mv-partage';
      let cible = null;
      let vt;
      try {
        vt = document.startViewTransition(() => {
          if (nom) depuis.style.viewTransitionName = '';
          rendre();
          if (nom) {
            cible = document.querySelector(`[data-mv-nom="${CSS.escape(nom)}"]`);
            if (cible && cible !== depuis) cible.style.viewTransitionName = 'mv-partage';
          }
        });
      } catch (e) {
        html.removeAttribute('data-mv-transition');
        if (nom) depuis.style.viewTransitionName = '';
        rendre(); return Promise.resolve();
      }
      enCours = vt;
      ecouter(true);
      const fin = () => {
        if (cible) cible.style.viewTransitionName = '';
        if (enCours === vt) { enCours = null; html.removeAttribute('data-mv-transition'); ecouter(false); }
      };
      vt.finished.then(fin, fin);
      vt.ready.catch(() => {});
      return vt.updateCallbackDone.catch(() => {});
    }
    // sans View Transitions : un fondu court de la page
    rendre();
    const m = document.querySelector('main');
    if (m && m.animate) fondu = m.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' });
    return Promise.resolve();
  }

  /* ---------------------------------------------------------------------------------------------- l'apparition au défilement */
  let io = null;
  function montrer(e) {
    if (e.classList.contains('mv-vu')) return;
    e.classList.add('mv-vu');
    if (e.getAttribute('data-mv') === 'compte') compter(e);
    // la transition finie, l'élément redevient ordinaire (ses propres transitions reprennent la main)
    const d = (parseFloat(e.getAttribute('data-mv-delai')) || 0) + (e.getAttribute('data-mv') === 'cascade' ? 1300 : 950);
    setTimeout(() => { if (e.isConnected) e.classList.remove('mv-attente'); }, d);
  }
  function reveler(racine = document, { immediat = false } = {}) {
    const els = [...(racine.querySelectorAll ? racine.querySelectorAll('[data-mv]') : [])];
    if (racine.matches && racine.matches('[data-mv]')) els.unshift(racine);
    if (immediat || !permis() || !('IntersectionObserver' in window)) {
      els.forEach(e => { e.classList.remove('mv-attente'); e.classList.add('mv-vu'); });
      return;
    }
    if (!io) io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { io.unobserve(x.target); montrer(x.target); } }), { rootMargin: '0px 0px -6% 0px' });
    els.forEach(e => {
      if (e.classList.contains('mv-vu')) return;
      const d = e.getAttribute('data-mv-delai');
      if (d) e.style.setProperty('--mv-delai', `${parseFloat(d) || 0}ms`);
      if (e.getAttribute('data-mv') === 'cascade') [...e.children].forEach((c, i) => c.style.setProperty('--mv-i', String(i)));
      if (e.getAttribute('data-mv') !== 'compte') e.classList.add('mv-attente');
      io.observe(e);
    });
  }

  /* ---------------------------------------------------------------------------------------------- la cascade (ce qui se déplie) */
  function cascade(el, { selecteur = null, pas = 22, max = 14, duree = 260, decalage = -6 } = {}) {
    if (!el || !permis()) return;
    const enfants = selecteur ? [...el.querySelectorAll(selecteur)] : [...el.children];
    enfants.slice(0, max).forEach((c, i) => {
      if (!c.animate) return;
      c.animate([{ opacity: 0, transform: `translateY(${decalage}px)` }, { opacity: 1, transform: 'none' }],
        { duration: duree, delay: i * pas, easing: COURBE, fill: 'backwards' });
    });
  }

  /* ---------------------------------------------------------------------------------------------- FLIP */
  const enVol = new WeakMap();
  const attrDe = cle => { const m = /^\[([\w-]+)/.exec(cle || ''); return m ? m[1] : (cle || 'data-mv-cle'); };
  function flip(conteneur, changer, { cle = '[data-mv-cle]', duree = 280 } = {}) {
    if (!conteneur || !permis()) { changer(); return; }
    const attr = attrDe(cle), sel = `[${attr}]`, H = innerHeight, marge = 160;
    const pres = r => r.bottom > -marge && r.top < H + marge && r.width > 0;
    // avant : les positions à l'écran (transform compris : un flip interrompu repart de là où l'on voit les éléments)
    const avant = new Map();
    conteneur.querySelectorAll(sel).forEach(e => { const k = e.getAttribute(attr); if (!k || avant.has(k)) return; const r = e.getBoundingClientRect(); if (pres(r)) avant.set(k, { r, e }); });
    (enVol.get(conteneur) || []).forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } });
    changer();
    const anims = [];
    const apres = new Map();
    conteneur.querySelectorAll(sel).forEach(e => { const k = e.getAttribute(attr); if (!k || apres.has(k)) return; apres.set(k, { e, r: e.getBoundingClientRect() }); });
    apres.forEach(({ e, r }, k) => {
      if (!pres(r)) return;
      const a = avant.get(k);
      if (a) {
        const dx = a.r.left - r.left, dy = a.r.top - r.top;
        if (Math.abs(dx) < .5 && Math.abs(dy) < .5) return;
        anims.push(e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: duree, easing: COURBE }));
      } else {
        anims.push(e.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: duree * .8, delay: duree * .25, easing: COURBE, fill: 'backwards' }));
      }
    });
    // ceux qui partent : ils s'effacent à leur place, dans une coquille du même genre que leur ancien parent
    avant.forEach(({ r, e }, k) => {
      if (apres.has(k) || e.isConnected) return;
      const parent = e.__mvParent;
      const coque = (parent ? parent.cloneNode(false) : document.createElement('div'));
      coque.removeAttribute('id');
      coque.setAttribute('aria-hidden', 'true');
      coque.inert = true;
      coque.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;padding:0;border:0;background:none;pointer-events:none;z-index:2;list-style:none;overflow:visible`;
      e.style.margin = '0';
      coque.appendChild(e);
      conteneur.appendChild(coque);
      const a = coque.animate([{ opacity: 1 }, { opacity: 0 }], { duration: duree * .6, easing: 'ease-in', fill: 'forwards' });
      a.onfinish = a.oncancel = () => coque.remove();
      anims.push(a);
    });
    enVol.set(conteneur, anims);
  }
  // FLIP a besoin de connaître le parent d'un élément qui part (changer() l'a détaché) : on le note avant
  const flipAvecParents = flip;
  function flipPublic(conteneur, changer, o = {}) {
    if (conteneur && permis()) { const attr = attrDe(o.cle); conteneur.querySelectorAll(`[${attr}]`).forEach(e => { e.__mvParent = e.parentElement; }); }
    return flipAvecParents(conteneur, changer, o);
  }

  /* ---------------------------------------------------------------------------------------------- les chiffres qui comptent */
  function compter(el, { duree = 900 } = {}) {
    if (!el || el.__mvCompte || !permis()) return;
    const texte = el.textContent, m = /\d(?:[\d   ]*\d)?/.exec(texte);
    if (!m) return;
    const cible = +m[0].replace(/\D/g, '');
    if (!(cible > 1)) return;
    const sep = (/[   ]/.exec(m[0]) || [''])[0];
    const avant = texte.slice(0, m.index), apres = texte.slice(m.index + m[0].length);
    const format = n => sep ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep) : String(n);
    const origine = el.innerHTML;
    el.__mvCompte = true;
    el.innerHTML = `<span aria-hidden="true">${esc(avant)}<span class="mv-chiffre">${format(0)}</span>${esc(apres)}</span><span class="mv-lecteur">${esc(texte)}</span>`;
    const chiffre = el.querySelector('.mv-chiffre'), t0 = performance.now();
    const pas = now => {
      if (!el.isConnected) return;
      const u = Math.min(1, (now - t0) / duree), v = 1 - (1 - u) ** 3;
      if (u < 1) { chiffre.textContent = format(Math.round(cible * v)); requestAnimationFrame(pas); }
      else { el.innerHTML = origine; el.__mvCompte = false; }
    };
    requestAnimationFrame(pas);
  }

  /* ---------------------------------------------------------------------------------------------- la pression */
  const PRESSABLE = 'a[href], button, summary, [role="button"], [role="tab"], label, .mv-pressable';
  let presse = null;
  const lacher = () => { if (presse) { presse.classList.remove('mv-presse'); presse = null; } };
  function presser(racine = document) {
    if (!racine || racine.__mvPresse) return;
    racine.__mvPresse = true;
    racine.addEventListener('pointerdown', e => {
      if (e.button) return;
      const el = e.target.closest && e.target.closest(PRESSABLE);
      if (!el || el.disabled) return;
      lacher(); el.classList.add('mv-presse'); presse = el;
    }, { passive: true });
    racine.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches(PRESSABLE)) { lacher(); e.target.classList.add('mv-presse'); presse = e.target; }
    }, { passive: true });
    if (!window.__mvLacher) {
      window.__mvLacher = true;
      ['pointerup', 'pointercancel', 'keyup', 'blur', 'dragstart'].forEach(t => window.addEventListener(t, lacher, { passive: true, capture: true }));
      document.addEventListener('pointerleave', lacher, { passive: true });
    }
  }

  return { permis, transition, reveler, cascade, flip: flipPublic, compter, presse: presser };
})();
</script>
<script>
/* Réserver une date, d'un geste (règle 17 du contrat), commun aux maquettes : les dates où l'on peut réserver, la bande de
   leurs boutons (l'horaire écrit sur chacun), la carte de réservation de la date choisie, le clavier. Chaque maquette
   l'habille dans son style (classes .rs-*, variables --rs-*) et y joue sa transition (le crochet effet). build.py l'ajoute
   après mouvement.js. Aucune dépendance (AGENDA, s'il est là, écrit les dates comme l'agenda). D est relu à chaque appel.

   Les données : D.dates[] { id, slug, titre, ligneDate, ligneLieu, details, lien, iso, fin, precision, scolaire, etat,
   commune, l, lieu (le nom du lieu, de la base), representations: [{ jour, heure, public, annulee, lien }] } ; D.shows
   (titre, univers) ; D.photos ; les libellés de D.site.libelles : reserver, surLeSiteDuLieu, horaireAPreciser,
   reservationAupresDuLieu, choisirUneDate, representations, scolaire, joursCourts, moisCourts. Rien d'inventé : un lien
   ne s'affiche que s'il est dans les données (http ou https), une heure que si la base la donne.

   RESERVER.dates(slug)        les dates réservables, dans l'ordre du temps : à venir (fin ≥ D.aujourdhui), tout public ou
                               mixtes (pas scolaires), ni annulées ni toutes leurs séances annulées ; d'un spectacle (slug),
                               ou de toute la saison (sans slug)
   RESERVER.cle(d)             la clé d'une date : son id dans la base, sinon « slug~iso~l » (l'instantané n'a pas d'id)
   RESERVER.trouver(cle)       la date réservable de cette clé, ou null
   RESERVER.seances(d)         [{ jour, heure ('20h30', ou '' si la base ne la donne pas), scolaire, lien }] : ses représentations
                               non annulées, dans l'ordre ; lien : celui de la séance (sa billetterie), sinon celui de la date ;
                               une séance scolaire n'a jamais de lien
   RESERVER.heures(d)          ['14h', '20h'] : les heures des séances tout public, sans doublon ; [] si aucune n'est connue
   RESERVER.lien(d)            où l'on réserve : le lien de la date, sinon celui de sa première séance tout public qui en a un ;
                               null s'il n'y en a pas (la carte dit alors « Réservation auprès du lieu », sans faux bouton)

<script>
/* La troupe, commune aux maquettes (règle 20 du contrat) : toutes les personnes publiées de l'équipe (D.personnes), rangées
   par catégories de métiers (D.site.troupe), leurs places reliées, et une icône dessinée par catégorie. Chaque maquette
   compose la troupe dans son univers (entre un organigramme et la pieuvre du logo) ; l'outil donne le modèle, les liens,
   les icônes et de quoi tracer des bras. build.py l'ajoute après mouvement.js. Tout se relit dans D à chaque appel
   (règle 9 : la base peut changer les personnes, leurs métiers, leurs photos et les titres).

   LE MODÈLE
   TROUPE.titre()                le titre de la section (D.site.troupe.titre)
   TROUPE.categories()           [{ cle, titre, i, metiers, places }] dans l'ordre de D.site.troupe.categories (i : son rang,
                                 pour data-edit="site.troupe.categories.<i>.titre") ; une catégorie sans personne est gardée
                                 (places vide : à la maquette de la taire)
     place = { cle ('<catégorie>:<personne>'), personne (slug), prenom, nom, nomComplet, photo (adresse ou null : la photo
               n'y est que si sa publication est accordée), credit, metiers (ses métiers dans cette catégorie, tels quels),
               evident (vrai si le métier se lit déjà dans la catégorie : « Jeu » dans le jeu), n (le nombre de places de la
               personne), rang (sa place dans la catégorie) }
     Une personne paraît une fois dans chaque catégorie de ses métiers, dans l'ordre de D.personnes (celui de la base).
     Un métier inconnu des listes va dans la catégorie qui partage le plus de mots avec lui (les mots rares comptent plus),
     puis par les alias de la catégorie (jamais affichés), sinon dans la catégorie D.site.troupe.defaut ; une personne
     sans métier prend ceux de ses distributions (show.equipe), sinon la catégorie par défaut : personne ne se perd.
   TROUPE.classer(metier)        la clé de la catégorie d'un métier
   TROUPE.personnes()            [{ personne, nomComplet, photo, places: [place…] }] : chaque personne et ses places
   TROUPE.spectacles(slug)       les spectacles d'une personne : [{ slug, titre }] (D.shows[].equipe)
   TROUPE.equipe(slugSpectacle)  les personnes d'un spectacle : [slug]

   LES LIENS
   TROUPE.relier(racine, { liens, clavier, surAllumer, surChoix }) → { allumer(slug, depuis), allumerGroupe([slug]),
       eteindre(), choisir(slug | null), choisirGroupe([slug] | null), choisi(), groupe(), retracer(), detruire(),
       apresImage(fn) (fn après la prochaine image : ce qui repeint beaucoup ne retient pas le geste) }
     racine (positionnée : position relative ; marquée data-troupe) contient les places, chacune un bouton portant
     data-troupe-place et data-troupe-personne="<slug>" (son point d'accroche : l'élément [data-troupe-ancre] qu'il
     contient, sinon lui-même), groupées par [data-troupe-categorie] (chaque catégorie : un titre h2/h3 et une liste).
     Survoler ou focaliser une place allume toutes les places de la personne (classe est-allume ; la place survolée :
     est-source ; racine : est-allume) et les relie : des bras partent de la place survolée vers chacune des autres
     (calque <svg class="troupe-liens"> ajouté dans racine), tracés en 380 ms, une lueur court le long de chacun
     (offset-path) ; un clic ou Entrée choisit la personne (aria-pressed="true" sur ses places ; elle reste allumée), un
     second clic, Échap ou un clic ailleurs la relâche (pas la bascule jour/nuit, [data-theme-bouton] : le choix reste). allumerGroupe : les places de plusieurs personnes (l'équipe d'un
     spectacle, TROUPE.equipe(slug) ; racine : est-groupe), sans liens ; choisirGroupe les garde allumées (eteindre y
     revient) jusqu'à choisirGroupe(null), Échap, un clic ailleurs ou le choix d'une personne. Au clavier (clavier: true) : un arrêt de tabulation par catégorie, les
     flèches passent d'une personne à l'autre dans la catégorie, Début et Fin. surAllumer(slug | null, { groupe }) et
     surChoix(slug | null, { groupe }) préviennent la maquette. Les liens se retracent quand racine change de taille. Le
     calque des liens est sous les places : que les catégories soient positionnées au-dessus (z-index 2).
     Moins d'animations demandé (ou ?anim=0) : les liens sont là d'emblée, sans lueur.

   LES ICÔNES
   TROUPE.icone(cle)             le SVG de la catégorie (aria-hidden) : jeu (deux masques qui se balancent), mise-en-scene
                                 (le regard qui cligne dans son cadre), ecriture (la plume qui trace l'onde), decors (le
                                 cintre et sa robe qui se balancent), lumiere-son (le projecteur et ses ondes, lumière ou
                                 son), production (le billet et son étoile) ; une clé inconnue : une ventouse. Trait en
                                 currentColor ; --troupe-ic-fond remplit ce qui doit cacher le trait de derrière (le masque
                                 de devant) : la couleur du fond de la maquette. Elles s'animent quand leur catégorie est
                                 survolée ou allumée, ou quand la maquette leur pose la classe est-vivant (à l'arrivée).

   LES BRAS (géométrie, en px ou dans n'importe quel repère)
   TROUPE.courbe(a, b, { courbe, sens })  une courbe en S de a vers b : { d, point(t), tangente(t), longueur }
   TROUPE.lisse(points)                   une courbe douce qui passe par les points : { d, point(t), tangente(t), longueur }
   TROUPE.effile(c, { w0, w1, n })        le contour plein d'un bras effilé le long de la courbe c (de w0 à w1 de large)
   TROUPE.spirale(p, angle, { r, tours, sens })  une petite spirale qui enroule le bout d'un bras (à tracer)

   L'habillage : des styles de base sans poids (:where()), injectés une fois en tête de <head> : le calque des liens
   (.troupe-liens, .troupe-lien, .troupe-ventouse, .troupe-lueur ; leur couleur : --troupe-lien), les icônes
   (.troupe-icone et ses parties .tr-ic-*) et leurs mouvements (@keyframes troupe-*). Aucun autre texte que ceux de D. */
const TROUPE = (() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const COUPE = (() => { try { return new URLSearchParams(location.search).get('anim') === '0'; } catch (e) { return false; } })();
  const permis = () => !COUPE && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f1 = x => (Math.round(x * 10) / 10).toString();

  /* ---------------------------------------------------------------------------------------------- le modèle */
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const VIDES = new Set(['de', 'la', 'le', 'les', 'des', 'du', 'a', 'au', 'aux', 'et', 'en', 'l', 'd', 'un', 'une', 'pour', 'sur', 'avec']);
  const racineMot = w => (w.length > 3 ? w.replace(/(s|x)$/, '') : w);   // « lumières » et « lumière » : le même mot
  const mots = s => [...new Set(norm(s).split(' ').filter(w => w && !VIDES.has(w)).map(racineMot))];
  const T = () => (typeof D !== 'undefined' && D.site && D.site.troupe) || { titre: '', categories: [] };
  const cats = () => (T().categories || []).filter(c => c && c.cle);

  // l'index des métiers, refait quand D.site.troupe change (sa forme sert de clé)
  let index = null, cleIndex = '';
  function indexer() {
    const cs = cats(), cle = JSON.stringify(cs.map(c => [c.cle, c.metiers, c.alias])) + '|' + T().defaut;
    if (index && cle === cleIndex) return index;
    const exact = new Map(), parMot = new Map(), alias = [];
    cs.forEach(c => {
      (c.metiers || []).forEach(m => { exact.set(norm(m), c.cle); mots(m).forEach(w => { if (!parMot.has(w)) parMot.set(w, new Set()); parMot.get(w).add(c.cle); }); });
      (c.alias || []).forEach(a => { const n = norm(a); if (n) alias.push([n, c.cle]); });
    });
    const defaut = cs.some(c => c.cle === T().defaut) ? T().defaut : (cs.length ? cs[cs.length - 1].cle : null);
    index = { exact, parMot, alias, defaut, ordre: cs.map(c => c.cle) };
    cleIndex = cle;
    return index;
  }
  function classer(metier) {
    const I = indexer(), n = norm(metier);
    if (!n) return I.defaut;
    if (I.exact.has(n)) return I.exact.get(n);
    const score = new Map();
    // les mots en commun avec les métiers connus : un mot que partagent deux catégories compte moitié
    mots(metier).forEach(w => { const s = I.parMot.get(w); if (s) s.forEach(k => score.set(k, (score.get(k) || 0) + 1 / s.size)); });
    // les alias : un mot (ou une suite de mots) du métier
    const dedans = ` ${n} `;
    I.alias.forEach(([a, k]) => { if (dedans.includes(` ${a} `) || dedans.includes(` ${racineMot(a)} `)) score.set(k, (score.get(k) || 0) + 1); });
    let best = null, max = 0;
    I.ordre.forEach(k => { const s = score.get(k) || 0; if (s > max + 1e-9) { max = s; best = k; } });
    return best || I.defaut;
  }
  // les métiers d'une personne ; sans métier : ceux de ses distributions (fonction, ou « Jeu » pour le jeu)
  function metiersDe(slug, p) {
    const ms = (p.metiers || []).map(m => String(m || '').trim()).filter(Boolean);
    if (ms.length) return ms;
    const out = [];
    (typeof D !== 'undefined' ? D.shows || [] : []).forEach(s => (s.equipe || []).forEach(e => {
      if (e.personne !== slug) return;
      const m = String(e.fonction || '').trim() || (e.categorie === 'jeu' ? 'Jeu' : '');
      if (m && !out.includes(m)) out.push(m);
    }));
    return out;
  }
  const nomComplet = p => [p.prenom, p.nom].map(x => String(x || '').trim()).filter(Boolean).join(' ');
  function modele() {
    const I = indexer(), cs = cats(), P = (typeof D !== 'undefined' && D.personnes) || {};
    const places = new Map(cs.map(c => [c.cle, []])), personnes = [];
    Object.entries(P).forEach(([slug, p]) => {
      if (!p) return;
      const parCat = new Map();
      metiersDe(slug, p).forEach(m => { const k = classer(m); if (!k) return; if (!parCat.has(k)) parCat.set(k, []); if (!parCat.get(k).includes(m)) parCat.get(k).push(m); });
      if (!parCat.size && I.defaut) parCat.set(I.defaut, []);
      const ks = [...parCat.keys()].sort((a, b) => I.ordre.indexOf(a) - I.ordre.indexOf(b));
      const moi = { personne: slug, nomComplet: nomComplet(p), photo: p.photo || null, places: [] };
      ks.forEach(k => {
        const c = cs.find(x => x.cle === k), ms = parCat.get(k);
        const evident = !!c && (c.metiers || []).length === 1 && ms.length === 1 && norm(ms[0]) === norm(c.metiers[0]);
        const place = { cle: `${k}:${slug}`, categorie: k, personne: slug, prenom: p.prenom || '', nom: p.nom || '', nomComplet: moi.nomComplet,
          photo: p.photo || null, credit: p.photo ? p.credit || null : null, metiers: ms, evident, n: ks.length, rang: places.get(k).length };
        places.get(k).push(place);
        moi.places.push(place);
      });
      personnes.push(moi);
    });
    return { cs, places, personnes };
  }
  const categories = () => { const M = modele(); return M.cs.map((c, i) => ({ cle: c.cle, titre: c.titre || '', i, metiers: c.metiers || [], places: M.places.get(c.cle) || [] })); };
  const personnes = () => modele().personnes;
  const spectacles = slug => (typeof D !== 'undefined' ? D.shows || [] : []).filter(s => (s.equipe || []).some(e => e.personne === slug)).map(s => ({ slug: s.slug, titre: s.titre }));
  const equipe = slugSp => { const s = (typeof D !== 'undefined' ? D.shows || [] : []).find(x => x.slug === slugSp); return s ? [...new Set((s.equipe || []).map(e => e.personne).filter(x => (D.personnes || {})[x]))] : []; };

  /* ---------------------------------------------------------------------------------------------- la géométrie des bras */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], add = (a, b) => [a[0] + b[0], a[1] + b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
  const lon = v => Math.hypot(v[0], v[1]) || 1;
  // une courbe faite de segments de Bézier cubiques [p0, c1, c2, p1] : ses points, ses tangentes, sa longueur
  function outillee(segs) {
    const pt = ([p0, c1, c2, p1], t) => { const u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0], u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]]; };
    const tg = ([p0, c1, c2, p1], t) => { const u = 1 - t; const v = [3 * u * u * (c1[0] - p0[0]) + 6 * u * t * (c2[0] - c1[0]) + 3 * t * t * (p1[0] - c2[0]), 3 * u * u * (c1[1] - p0[1]) + 6 * u * t * (c2[1] - c1[1]) + 3 * t * t * (p1[1] - c2[1])]; const l = lon(v); return [v[0] / l, v[1] / l]; };
    const longs = segs.map(s => { let L = 0, q = s[0]; for (let k = 1; k <= 16; k++) { const r = pt(s, k / 16); L += Math.hypot(r[0] - q[0], r[1] - q[1]); q = r; } return L; });
    const total = longs.reduce((a, b) => a + b, 0) || 1;
    const ou = t => { let x = Math.max(0, Math.min(1, t)) * total, i = 0; while (i < segs.length - 1 && x > longs[i]) { x -= longs[i]; i++; } return [segs[i], longs[i] ? Math.min(1, x / longs[i]) : 0]; };
    const d = segs.length ? `M${f1(segs[0][0][0])} ${f1(segs[0][0][1])}` + segs.map(([, c1, c2, p1]) => `C${f1(c1[0])} ${f1(c1[1])} ${f1(c2[0])} ${f1(c2[1])} ${f1(p1[0])} ${f1(p1[1])}`).join('') : '';
    return { d, segs, longueur: total, point: t => { const [s, u] = ou(t); return pt(s, u); }, tangente: t => { const [s, u] = ou(t); return tg(s, u); } };
  }
  // un S de a vers b : les deux points de contrôle s'écartent de part et d'autre du trajet (courbe : l'écart, en part du trajet)
  function courbe(a, b, { courbe: k = 0.22, sens = 1 } = {}) {
    const v = sub(b, a), L = lon(v), n = [-v[1] / L * sens, v[0] / L * sens];
    return outillee([[a, add(add(a, mul(v, 0.3)), mul(n, k * L)), add(add(a, mul(v, 0.7)), mul(n, -k * L)), b]]);
  }
  // une courbe douce par les points (Catmull-Rom centripète, en cubiques)
  function lisse(points) {
    const P = (points || []).filter(p => p && isFinite(p[0]) && isFinite(p[1]));
    if (P.length < 2) return outillee([]);
    const segs = [];
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || sub(mul(P[i], 2), P[i + 1]), p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || sub(mul(P[i + 1], 2), P[i]);
      segs.push([p1, add(p1, mul(sub(p2, p0), 1 / 6)), sub(p2, mul(sub(p3, p1), 1 / 6)), p2]);
    }
    return outillee(segs);
  }
  // le contour plein d'un bras effilé : de w0 (au départ) à w1 (au bout)
  function effile(c, { w0 = 6, w1 = 1, n = 32 } = {}) {
    if (!c || !c.segs || !c.segs.length) return '';
    const g = [], dr = [];
    for (let k = 0; k <= n; k++) {
      const t = k / n, p = c.point(t), tg = c.tangente(t), w = (w0 * (1 - t) + w1 * t) / 2;
      g.push(`${f1(p[0] - tg[1] * w)} ${f1(p[1] + tg[0] * w)}`); dr.push(`${f1(p[0] + tg[1] * w)} ${f1(p[1] - tg[0] * w)}`);
    }
    return `M${g.join('L')}L${dr.reverse().join('L')}Z`;
  }
  // une spirale au bout d'un bras : part de p dans la direction angle (radians) et s'enroule (sens 1 : à droite)
  function spirale(p, angle, { r = 6, tours = 1.2, sens = 1 } = {}) {
    const cx = p[0] + Math.cos(angle + sens * Math.PI / 2) * r, cy = p[1] + Math.sin(angle + sens * Math.PI / 2) * r;
    const a0 = Math.atan2(p[1] - cy, p[0] - cx), N = 30, pts = [];
    for (let k = 0; k <= N; k++) { const t = k / N, a = a0 + sens * t * tours * 2 * Math.PI, rr = r * (1 - 0.7 * t); pts.push(`${f1(cx + Math.cos(a) * rr)} ${f1(cy + Math.sin(a) * rr)}`); }
    return `M${pts.join('L')}`;
  }

  /* ---------------------------------------------------------------------------------------------- les icônes */
  // 32 × 32, un trait ; les parties qui bougent portent une classe tr-ic-*
  const MASQUE = 'M-7 -6.5C-7 -8.6 7 -8.6 7 -6.5V-.5C7 5.6 3.3 9 0 9S-7 5.6-7 -.5Z';
  const ICONES = {
    jeu: `<g class="tr-ic-arriere"><g transform="translate(20.2 12.6) rotate(15)"><path class="tr-ic-plein" d="${MASQUE}"/><path d="M-4.6-1.4q1.5 1.3 3 0M1.6-1.4q1.5 1.3 3 0M-3 5.2q3-2.4 6 0"/></g></g>`
      + `<g class="tr-ic-avant"><g transform="translate(12.2 17.6) rotate(-11)"><path class="tr-ic-plein" d="${MASQUE}"/><path d="M-4.6-.8q1.5-1.5 3 0M1.6-.8q1.5-1.5 3 0M-3.6 3q3.6 3.3 7.2 0"/></g></g>`,
    'mise-en-scene': '<path d="M5 10.5V6h4.5M22.5 6H27v4.5M27 21.5V26h-4.5M9.5 26H5v-4.5"/>'
      + '<g class="tr-ic-oeil"><path class="tr-ic-plein" d="M8 16c3.6-4.9 12.4-4.9 16 0-3.6 4.9-12.4 4.9-16 0Z"/><g class="tr-ic-iris"><circle cx="16" cy="16" r="3.1"/><circle class="tr-ic-point" cx="16" cy="16" r="1.25"/></g></g>',
    ecriture: '<path class="tr-ic-onde" pathLength="1" d="M3.5 26.2c2.6-3 4.6-3 6.4-.4s3.8 2.6 5.8.1"/>'
      + '<g class="tr-ic-plume"><path class="tr-ic-plein" d="M27.6 4.2C19.4 5.8 14.5 11.8 13 20.4l2.5-2.6c5.6-1.3 9.8-5.9 12.1-13.6Z"/><path d="M13 20.4l-1.6 2.8M15.5 17.8c2.9-3.7 6.6-7.2 10.4-11.6"/></g>',
    decors: '<g class="tr-ic-cintre"><path d="M16 9.6c0-2.9 3.6-3 3.6-.4 0 1.5-1.6 1.8-3.6 3.4L4.8 18.6c-1.1.8-.6 2.2.7 2.2h21c1.3 0 1.8-1.4.7-2.2L16 12.6"/>'
      + '<path class="tr-ic-plein" d="M11.4 20.8l-2.6 7.4h14.4l-2.6-7.4M13.4 20.8c.4 1.5 1.5 2.3 2.6 2.3s2.2-.8 2.6-2.3"/></g>',

<script>
/* Les tentacules, communes aux maquettes et à l'administration : la pieuvre du logo, dans l'en-tête, et ses tentacules.
   Règle 15 du contrat : la tentacule n'est plus la réponse à chaque geste. PAR DÉFAUT, ELLE NE RÉPOND À RIEN : ni aux clics,
   ni aux changements de page ; aucun écouteur n'est posé, aucune boucle ne tourne. Elle devient un MOMENT rare et
   signifiant, que la maquette joue à la main, là où il dit quelque chose (au plus deux par maquette : la tournée qui
   pousse, l'entrée dans un spectacle, un dossier composé…). Un seul code : chaque maquette l'habille dans son style.
   build.py l'ajoute après mouvement.js dans chaque maquette et le copie à côté de l'index.html de l'administration.

   Les moments (à appeler à la main) : une tentacule fine part de la pieuvre, s'enroule sur un point et y laisse l'empreinte
   d'une ventouse (toucher) ; une tentacule « remonte » l'écran à la couleur d'une page (page) ; elle se déroule le long de ce
   qui s'ouvre (ouvrir), s'enroule quand ça se ferme (fermer), glisse d'un onglet à l'autre (onglet), s'enroule autour d'un
   bouton (enrouler, confirmer, retour) ; la pieuvre seule se contracte et ondule (guide).

   Les gestes automatiques d'avant restent possibles, mais seulement si on les demande explicitement :
     TENTACULES.regler({ clic: true })    chaque clic lui répond (les gestes se reconnaissent seuls, voir plus bas)
     TENTACULES.regler({ pages: true })   chaque changement d'adresse (hashchange) remonte une tentacule
   Le profil 'admin' (l'administration et l'espace de l'équipe) garde ses gestes : clic et pages y valent true, sauf
   clic: false ou pages: false dans le même appel. regler({ clic: false, pages: false }) retire les écouteurs.

   RIEN N'EST RETARDÉ NI BLOQUÉ : écouteurs passifs en phase de capture (seulement si clic ou pages), jamais de
   preventDefault, un seul calque fixe (pointer-events: none, aria-hidden), un seul requestAnimationFrame, arrêté quand plus
   rien ne joue et quand l'onglet est caché. Aucun texte n'est ajouté. Un moment rejoué remplace l'animation en cours, sans
   file d'attente. Rien ne joue dans un champ en cours d'écriture, ni tant que INTRO.ouverte() est vrai.
   prefers-reduced-motion : au plus un fondu bref, aucune tentacule qui voyage. ?anim=0 dans l'adresse : aucune animation.

   Le vérificateur (onglets.mjs) clique les liens du menu et attend TENTACULES.actives() === 0 juste après : un lien ou un
   bouton qui joue un moment le déclare avec l'attribut data-moment (sur lui ou un parent).

   Ce que la maquette fournit
   - data-pieuvre sur l'élément du logo de l'en-tête (le <span> ou <a> qui contient D.logo.mark, D.logo.octopus ou son
     propre dessin de la pieuvre). L'outil y retrouve les quatre tracés de D.logo.octopusPaths et les anime EN PLACE
     (bras, tête) ; les bras de D.arms donnent le point de départ des tentacules (celui du spectacle visé, quand on va vers
     sa page : D.arms.armOf). Hôte vide : l'outil y met la pieuvre (D.logo.octopus, ou un dessin neutre), même sans
     mouvement. Hôte sans tracé reconnu : il pulse en entier. Pas d'hôte visible : les tentacules partent du bord le plus proche.
   - TENTACULES.regler({ clic, pages, style, encre, accent, ventouse, neutre, epaisseur, duree, … }), à appeler une fois :
       clic        false (défaut) · true : chaque clic lui répond        pages   false (défaut) · true : chaque changement de page
       style       'encre' (défaut : tentacule pleine et effilée, ventouses) · 'trait' (un trait gravé, à hachures)
                   · 'lumiere' (un filet de lumière, avec halo) · 'fil' (un fil très fin) · 'ventouses' (deux rangées)
       encre       la couleur des tentacules                      accent   l'empreinte, les enroulements, les confirmations
       ventouse    la couleur des ventouses (défaut : un voile)    neutre   la remontée des pages sans couleur propre
       epaisseur   l'épaisseur de la tentacule fine, en px (2.2)   duree    facteur de durée (1 = normal)
       pieuvre     sélecteur du guide ('[data-pieuvre]')           page     sélecteur de ce que la remontée soulève ('main')
       entrees     'auto' (défaut), 'vive' ou 'couleur' : quelle couleur de D.site.entrees prend la remontée
       couleurDe   function (hash) → couleur CSS, ou rien : la destination à la main ; false : la maquette a son propre geste pour
                   cette page, la pieuvre seule répond (pas de tentacule de page)
       voie        'bas' (défaut) : la tentacule de page part de sous l'écran, à la hauteur du clic ; 'clic' : elle sort du point
                   cliqué lui-même et remonte
       remontee    false : pas de tentacule de page    soulever  true : la page se soulève de 24 px et paraît, en 460 ms,
                   quand la tentacule remonte. Un transform sur <main> déplace ses descendants position: fixed pendant ce
                   temps : à n'activer que si <main> n'en contient pas (hors de la page : une barre, une photo de fond, ça va)
       profil      'admin' : tout dure 350 ms au plus, les tentacules restent près du bouton (jamais devant un champ)
       detail      retouche le style choisi : { page (finesse de la tentacule de page : 1 = pleine, .1 = un fil), ventouses (0, 1 ou 2
                   rangées), hachures, halo, empreinte ('anneau', 'grande', 'etoile', 'lueur', 'point'), corps, opa }
   - des variables CSS, sur :root (ou sur une région : l'outil lit celles de l'élément cliqué) :
       --tt-encre  --tt-accent  --tt-ventouse  --tt-neutre  --tt-epaisseur  --tt-duree  --tt-style
       --tt-fond   le liseré qui détache la tentacule d'un fond sombre (défaut : la couleur de la page)
   - des attributs : data-moment (ce lien ou ce bouton joue un moment, voir plus haut) ; et, pour les gestes automatiques
     (clic: true) : data-tt="rien" (aucune animation ici) ou le genre d'un geste : "onglet", "ouvre", "bascule", "case",
     "route", "retour", "clic" ; data-tt-couleur="#…" sur un lien (la couleur de sa remontée) ; data-tt-cible="x,y" sur un
     élément de la page qui arrive (x et y : fractions de sa boîte, .5,.5 par défaut) : la tentacule de page y finit, au lieu de la
     pieuvre (une porte à ouvrir, un titre à atteindre) ; data-tt-local sur un
     conteneur dont les boutons n'ont que des tentacules courtes (la barre d'édition, un panneau) ; data-tt-zone sur la
     fiche qu'un lien « retour » referme (par défaut .editeur).
   Avec clic: true, les gestes se reconnaissent seuls : un lien #/… (remontée de page), un onglet (aria-current,
   aria-selected, role="tab" : la tentacule glisse de l'onglet quitté à l'onglet choisi), un <summary> ou un bouton
   aria-expanded (elle se déroule quand ça s'ouvre, s'enroule quand ça se ferme), un bouton aria-pressed ou une case, un envoi
   de formulaire (elle s'enroule autour du bouton), le panneau de date et l'enregistrement de l'édition sur place.

   Les moments
   TENTACULES.toucher(el | [x, y])      une tentacule fine jusqu'à ce point, et son empreinte
   TENTACULES.page(destination)         la remontée d'une page ('#/voir', une couleur CSS ou {couleur, slug}) ; automatique
                                        à chaque changement d'adresse seulement avec pages: true
   TENTACULES.ouvrir(el)  .fermer(el)   la tentacule se déroule le long de ce qui s'ouvre ; elle s'enroule à la fermeture
   TENTACULES.enrouler(el)              elle s'enroule autour d'un bouton : un envoi, un enregistrement réussi (= confirmer)
   TENTACULES.retour(el)                elle s'enroule à l'envers (revenir en arrière)
   TENTACULES.onglet(de, vers)          elle glisse d'un onglet à l'autre   TENTACULES.ajouter(el)   une ligne qui s'ajoute
   TENTACULES.guide(genre)              la pieuvre seule se contracte et ondule ('clic', 'page', 'ouvre', 'ferme'…)
   Le reste
   TENTACULES.pieuvre()                 met la pieuvre dans les hôtes data-pieuvre vides (fait seul au chargement)
   TENTACULES.actives()                 le nombre d'animations en cours (0 au repos) : pour le vérificateur
   TENTACULES.arreter()                 coupe tout   TENTACULES.actif   faux avec ?anim=0 */
const TENTACULES = (() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const COUPE = (() => { try { return new URLSearchParams(location.search).get('anim') === '0'; } catch (e) { return false; } })();
  const reduit = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  function regler(o = {}) {

    if (x.profil === 'admin') { if (!('clic' in x)) x.clic = true; if (!('pages' in x)) x.pages = true; }
    Object.assign(R, x);

  const admin = () => R.profil === 'admin';

  // ce que chaque style change : la finesse de la tentacule de page, les décors (ventouses, hachures, halo), l'empreinte
  const STYLES = {
    encre: { page: 1, ventouses: 1, hachures: false, halo: 0, empreinte: 'anneau', corps: 1, opa: .94 },
    ventouses: { page: 1.1, ventouses: 2, hachures: false, halo: 0, empreinte: 'grande', corps: 1.15, opa: .95 },
    trait: { page: .15, ventouses: 0, hachures: true, halo: 0, empreinte: 'etoile', corps: .8, opa: 1 },
    lumiere: { page: .24, ventouses: 0, hachures: false, halo: 1, empreinte: 'lueur', corps: .8, opa: 1, contre: false },
    fil: { page: .08, ventouses: 0, hachures: false, halo: 0, empreinte: 'point', corps: .65, opa: 1 },
  };

  const lireCss = (nom, el) => { try { return getComputedStyle(el || document.documentElement).getPropertyValue(nom).trim(); } catch (e) { return ''; } };
  function rgb(c) {
    c = String(c || '').trim();
    let m = /^#([0-9a-f]{3})$/i.exec(c);
    if (m) return [...m[1]].map(h => parseInt(h + h, 16));
    m = /^#([0-9a-f]{6})/i.exec(c);
    if (m) return [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16));
    m = /^rgba?\(\s*([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)/i.exec(c);

  const lum = c => { const v = rgb(c); if (!v) return .5; const f = x => ((x /= 255) <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4); return .2126 * f(v[0]) + .7152 * f(v[1]) + .0722 * f(v[2]); };
  const avecAlpha = (c, a) => { const v = rgb(c); return v ? `rgba(${v[0]},${v[1]},${v[2]},${a})` : c; };
  function fondPage() {
    for (const e of [document.body, document.documentElement]) {

  }
  // la palette d'un geste : les variables --tt-* de l'élément (ou de la page), puis les réglages
  function palette(el) {
    const e = el && el.nodeType === 1 ? el : document.documentElement, v = n => lireCss(n, e);
    const encre = v('--tt-encre') || R.encre || (document.body ? getComputedStyle(document.body).color : '#141414');
    const accent = v('--tt-accent') || R.accent || encre;
    const nomStyle = v('--tt-style') || R.style, style = STYLES[nomStyle] ? nomStyle : 'encre';
    const sombre = lum(fondPage()) < .3;
    const duree = (parseFloat(v('--tt-duree')) || R.duree || 1) * (admin() ? .75 : 1);
    return { encre, accent, neutre: v('--tt-neutre') || R.neutre || encre, ventouse: v('--tt-ventouse') || R.ventouse || (sombre ? 'rgba(0,0,0,.36)' : 'rgba(255,255,255,.5)'),
      contre: v('--tt-fond') || R.fond || avecAlpha(fondPage(), .85), ep: parseFloat(v('--tt-epaisseur')) || R.epaisseur || 2.2, duree, sombre, S: R.detail ? Object.assign({}, STYLES[style], R.detail) : STYLES[style], style };
  }
  // la durée d'un geste : 320 ms au plus dans l'administration (350 ms avec la dernière image)
  const dureeDe = (ms, P) => Math.round(admin() ? Math.min(320, ms * P.duree) : ms * P.duree);

  /* ------------------------------------------------------------------------------------------------ géométrie */
  const creer = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  function mesurer(p) { const s = [0]; for (let i = 1; i < p.length; i++) s.push(s[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])); return s; }
  // un point tous les `pas` px, le long de la courbe
  function regulier(p, pas) {
    const s = mesurer(p), L = s[s.length - 1], n = Math.max(2, Math.round(L / pas)), out = [];
    for (let k = 0, j = 0; k <= n; k++) {
      const d = L * k / n;
      while (j < s.length - 2 && s[j + 1] < d) j++;
      const u = s[j + 1] > s[j] ? (d - s[j]) / (s[j + 1] - s[j]) : 0;
      out.push([lerp(p[j][0], p[j + 1][0], u), lerp(p[j][1], p[j + 1][1], u)]);
    }
    return out;
  }
  function bezier(p0, c1, c2, p1) {
    const out = [];
    for (let i = 0; i <= 90; i++) {
      const u = i / 90, v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
      out.push([a * p0[0] + b * c1[0] + c * c2[0] + d * p1[0], a * p0[1] + b * c1[1] + c * c2[1] + d * p1[1]]);
    }
    return out;
  }
  // une crosse : la tentacule s'enroule sur elle-même, le rayon se resserre (sens +1 : dans le sens des aiguilles d'une montre)
  function spirale(dep, th0, sens, r0, r1, tours) {
    const total = tours * 2 * Math.PI, n = Math.max(6, Math.ceil(total / .17)), out = [];
    let [x, y] = dep, th = th0;
    for (let i = 1; i <= n; i++) {
      const r = lerp(r0, r1, i / n), d = total / n, ds = r * d;
      th += sens * d / 2; x += Math.cos(th) * ds; y += Math.sin(th) * ds; th += sens * d / 2;
      out.push([x, y]);
