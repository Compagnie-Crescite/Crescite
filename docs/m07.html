.date--etat .date-ligne{color:var(--gris);text-decoration:line-through;text-decoration-color:rgba(244,238,233,.45)}

/* Spectacles : un titre éclaire sa photo, en grand derrière la liste, teintée de la lumière de son univers */
.page--rep{position:relative;isolation:isolate;min-height:100vh;background:none}
.rep-fond{position:fixed;inset:0;z-index:0;pointer-events:none}
/* chaque photo porte sa gélatine (la couleur du spectacle, fondue dans la photo) ; on passe de l'une à l'autre en fondu d'opacité */
.rep-ph{position:absolute;inset:0;opacity:0;isolation:isolate;transition:opacity .9s var(--ease)}
.rep-ph.on{opacity:1}
.rep-fond .ph{opacity:1;filter:brightness(.55) saturate(.9);transition:none}
.rep-teinte{position:absolute;inset:0;mix-blend-mode:color;opacity:.55}
.rep-ombre{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,8,9,.95) 0,rgba(11,8,9,.74) 40%,rgba(11,8,9,.2) 78%,rgba(11,8,9,.35) 100%),linear-gradient(0deg,rgba(11,8,9,.85),rgba(11,8,9,0) 45%),linear-gradient(180deg,rgba(11,8,9,.85),rgba(11,8,9,0) 12rem)}
.rep-corps{position:relative;z-index:1;padding-bottom:clamp(4rem,8vw,7rem)}
.rep{max-width:64rem;border-top:1px solid var(--trait)}
.rep a{position:relative;display:grid;grid-template-columns:9rem minmax(0,1fr);gap:.25rem 2rem;align-items:baseline;padding:1.3rem 0 1.4rem;border-bottom:1px solid var(--trait);text-decoration:none;color:var(--blanc);transition:opacity .35s var(--ease)}
.rep a::before{content:"";position:absolute;left:-1.4rem;top:2.2rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--c);opacity:.45;transition:opacity .3s,box-shadow .3s}
.rep a:hover::before,.rep a:focus-visible::before,.rep a.on::before{opacity:1;box-shadow:0 0 16px 4px color-mix(in srgb,var(--c) 60%,transparent)}
.rep-img{display:none}
.rep-c{grid-row:1/span 2;font-size:.8125rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.rep-t{font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:clamp(1.75rem,3.3vw,3.125rem);line-height:1.05;letter-spacing:-.005em;color:var(--blanc);transition:color .35s,text-shadow .35s}
.rep-s{grid-column:2;display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem 1rem;color:var(--blanc-doux)}
.rep-lt{font-style:italic;color:var(--c)}
.rep-statut{display:inline-flex;align-items:center;gap:.5rem;font-size:.8125rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.rep-statut::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--c);box-shadow:0 0 10px 2px var(--c)}
.rep.survol a:not(.on){opacity:.38}
.rep a:hover .rep-t,.rep a:focus-visible .rep-t,.rep a.on .rep-t{color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 55%,transparent)}

/* La page d'un spectacle : sa lumière éclaire le noir */
.u{--u-style:normal}
.sp{position:relative;background:var(--u-fond);color:var(--u-texte)}
.scene--spectacle{height:auto;min-height:max(86vh,38rem);min-height:max(86svh,38rem);--spot:color-mix(in srgb,var(--u-lum) 55%,#fff3e6)}
.scene--spectacle .scene-titre{font-size:clamp(3rem,7.6vw,7.25rem);line-height:.96;text-shadow:0 0 46px var(--u-lueur)}
.scene--spectacle .scene-titre.n2{font-size:clamp(2.75rem,6.2vw,5.75rem)}
.scene--spectacle .scene-titre.n3{font-size:clamp(2.5rem,5vw,4.5rem)}
.scene--spectacle .scene-txt{max-width:60rem}
.scene--spectacle .scene-sur::before{background:var(--u-lum);box-shadow:0 0 10px var(--u-lum)}
.scene--spectacle .btn:hover{background:var(--u-lum);border-color:var(--u-lum)}
.gobo{position:absolute;z-index:1;right:max(var(--pad),5vw);top:calc(var(--tete) + 3vh);width:min(42vmin,30rem);color:var(--u-lum);opacity:.3;mix-blend-mode:screen;filter:drop-shadow(0 0 7px var(--u-lum)) blur(.3px);pointer-events:none;--motif-trait:1.7px}
.motif{width:100%;height:auto;overflow:visible}
.motif *{vector-effect:non-scaling-stroke;stroke-width:var(--motif-trait,1.4px)}
.motif text{font:600 15px/1 ui-monospace,'SFMono-Regular',Menlo,monospace;stroke:none}
.onglets{position:relative;z-index:2;border-top:1px solid var(--trait);background:linear-gradient(0deg,rgba(11,8,9,.92),rgba(11,8,9,.5))}
.onglets ul{display:flex;flex-wrap:wrap;gap:0 clamp(1.25rem,3vw,3rem)}
.onglet{padding-block:1.05rem 1.15rem;font-size:1rem}
.sp-corps{position:relative;overflow:hidden;padding-block:clamp(3.5rem,7vw,6.5rem) clamp(4rem,8vw,7rem)}
.filigrane{position:absolute;top:clamp(1.5rem,4vw,3.5rem);right:-5rem;width:min(34rem,72vw);color:var(--u-trace);opacity:.08;pointer-events:none;--motif-trait:1.2px}
.u-corps{--blanc:var(--u-texte);--blanc-doux:var(--u-texte);--gris:var(--u-texte2);--trait:color-mix(in srgb,var(--u-texte) 15%,transparent);--trait-fort:color-mix(in srgb,var(--u-texte) 32%,transparent);--lumiere:var(--u-trace);--c:var(--u-trace);color:var(--u-texte)}
.u-corps :focus-visible{outline-color:var(--u-texte)}
.u-corps ::selection{background:var(--u-trace);color:var(--u-fond)}
.u-corps .cl{--lum:var(--u-vif);--pays:color-mix(in srgb,var(--u-texte) 7%,var(--u-fond));--pays-t:color-mix(in srgb,var(--u-texte) 24%,transparent);--voisin:color-mix(in srgb,var(--u-texte) 3%,var(--u-fond));--voisin-t:color-mix(in srgb,var(--u-texte) 10%,transparent);--fx:color-mix(in srgb,var(--u-vif) 55%,#fff);--nom:var(--u-texte);--nom-t:var(--u-fond)}
.u--clair .u-corps .cl,.u--clair.u-corps .cl{--lum:var(--u-trace);--fx:var(--u-trace);--lampe-c:var(--u-trace);--coeur:var(--u-texte);--anneau:var(--u-texte);--pulse-c:var(--u-texte)}
.u--clair{--ed-accent-d:var(--u-trace)}
.chap-t{font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:var(--fs-h2);line-height:1.02;letter-spacing:-.005em;color:var(--u-titre,var(--blanc));text-wrap:balance;overflow-wrap:break-word}
.chap-t:focus{outline:none}
.chap{scroll-margin-top:calc(var(--tete) + 1.5rem)}
.chap + .chap{margin-top:clamp(4rem,8vw,7rem)}
.chap > .etiq{margin-bottom:.8rem}
.chap-corps{margin-top:clamp(1.75rem,3vw,2.5rem)}
.sp-voir{display:grid;grid-template-columns:10.5rem minmax(0,1fr);gap:clamp(2rem,5vw,5rem);align-items:start}
.sommaire{position:sticky;top:calc(var(--tete) + 2rem)}
.sommaire ul{display:grid;gap:.15rem}
.sommaire button{display:flex;align-items:center;gap:.7rem;width:100%;padding:.45rem 0;background:none;border:0;cursor:pointer;text-align:left;color:var(--u-texte2);font-size:.75rem;font-weight:600;line-height:1.3;letter-spacing:.14em;text-transform:uppercase;transition:color .3s}
.sommaire button::before{content:"";flex:none;width:1.25rem;height:1px;background:currentColor;transition:width .35s var(--ease),background-color .35s}
.sommaire button:hover,.sommaire button[aria-current]{color:var(--u-texte)}
.sommaire button[aria-current]::before{width:2.5rem;height:2px;background:var(--u-trace);box-shadow:0 0 10px var(--u-lueur)}
.sommaire-signe{width:4.5rem;margin-top:1.75rem;color:var(--u-trace);opacity:.6;--motif-trait:1.2px}
.genre{font-family:var(--u-police);font-weight:var(--u-graisse);font-size:var(--fs-h3);line-height:1.15;color:var(--u-titre)}
.cadre{margin-top:.6rem;font-weight:600;letter-spacing:.04em;color:var(--u-texte2)}
.affirm{max-width:54rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.6rem,3vw,2.6rem);line-height:1.2;color:var(--u-texte);text-wrap:pretty}
.affirm + .affirm,.cadre + .affirm,.genre + .affirm{margin-top:1.5rem}
.affirm + .affirm{font-size:clamp(1.25rem,2vw,1.6rem);line-height:1.35;color:var(--u-texte2)}
.texte-u{max-width:46rem;font-size:1.125rem;line-height:1.78}
.texte-u > :first-child{font-size:1.25rem;line-height:1.7}
.citations{display:grid;gap:2.25rem;max-width:52rem;margin-top:clamp(2.75rem,5vw,4rem)}
.citation blockquote{padding-left:1.6rem;border-left:2px solid var(--u-trace)}
.citation .vers{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.3rem,2.3vw,1.9rem);line-height:1.32}
.citation--prose .vers{display:inline}
.citation--prose blockquote p::before{content:"« "}
.citation--prose blockquote p::after{content:" »"}
.citation figcaption{margin-top:.6rem;padding-left:1.6rem;font-size:.875rem;letter-spacing:.04em;color:var(--u-texte2)}
.cartons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.25rem 1.5rem}
.carton{min-width:0}
.carton:first-child:not(:last-child),.carton--seul{grid-column:1/-1}
.carton img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#000}
.carton:first-child:not(:last-child) img,.carton--seul img{aspect-ratio:16/8}
.carton figcaption{position:relative;margin:-1.75rem 1rem 0 1.25rem;padding:.85rem 1.1rem;background:var(--u-fond2);color:var(--u-texte);border-left:3px solid var(--u-trace);font-size:.9375rem;line-height:1.5;box-shadow:0 18px 40px -24px rgba(0,0,0,.75)}
.credit-u{margin-top:1rem;font-size:.8125rem;color:var(--u-texte2)}
.video{display:inline-flex;align-items:center;gap:1.1rem;text-decoration:none;color:var(--u-texte,var(--blanc))}
.video-ico{display:grid;place-items:center;flex:none;width:4.25rem;height:4.25rem;border-radius:50%;background:var(--u-aplat,var(--blanc));color:var(--u-sur,var(--noir));box-shadow:0 0 0 6px color-mix(in srgb,var(--u-aplat,#fff) 18%,transparent),0 0 40px var(--u-lueur,rgba(255,217,168,.3));transition:transform .35s var(--ease)}
.video-ico svg{width:1.3rem;height:1.3rem;fill:currentColor;margin-left:.2rem}
.video-t{display:flex;flex-direction:column;gap:.2rem}
.video-l{font-weight:700;font-size:1.0625rem}
.video-titre{font-size:.9375rem;color:var(--u-texte2,var(--gris))}
.video:hover .video-ico{transform:scale(1.06)}
.video--petit .video-ico{width:2.6rem;height:2.6rem;box-shadow:none}
.video--petit .video-ico svg{width:.9rem;height:.9rem}
.tournee-txt{margin-top:1.1rem;font-size:1.25rem;color:var(--u-texte2)}
.distrib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem clamp(2rem,5vw,5rem)}
.fiche{display:grid;gap:.7rem;font-size:.9688rem;line-height:1.5}
.fiche-k{display:block;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--u-vif,var(--gris))}
.fiche-avec{margin-top:.5rem;padding-top:1rem;border-top:1px solid var(--trait)}
/* la distribution en portraits (D.personnes, show.equipe) : chaque comédien dans sa lumière, la photo qui sort du noir ou, sans elle, ses initiales éclairées ; ceux qui alternent vont par deux */
.cast{--g:clamp(1rem,2vw,1.75rem);--pw:9.5rem;--pmax:15.5rem;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:2.75rem var(--g);max-width:calc(var(--n,4) * var(--pmax) + (var(--n,4) - 1) * var(--g));margin:0 0 clamp(2.5rem,4vw,3.75rem);padding:0}
.cast>li{min-width:0}
.cast>.cast-paire{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.cast-pt{margin:0;min-width:0;text-align:center}
.cast-cadre{position:relative;display:block;aspect-ratio:4/5;container-type:inline-size;background:radial-gradient(ellipse 64% 54% at 50% 44%,var(--u-lueur),transparent 100%)}
.cast-cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:contrast(1.05) saturate(.95);-webkit-mask-image:radial-gradient(ellipse 62% 57% at 50% 42%,#000 50%,transparent 100%);mask-image:radial-gradient(ellipse 62% 57% at 50% 42%,#000 50%,transparent 100%)}
.cast-cadre::after{content:"";position:absolute;left:14%;right:14%;bottom:-3%;height:11%;background:radial-gradient(closest-side,var(--u-lueur),transparent);pointer-events:none}
.cast-mono{position:absolute;inset:0;display:grid;place-items:center}
.cast-mono b{font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:2.6rem;font-size:30cqw;line-height:1;text-transform:uppercase;color:var(--u-vif);text-shadow:0 0 .55em var(--u-lum),0 0 .12em color-mix(in srgb,var(--u-lum) 55%,transparent)}
.u--clair .cast-mono b{text-shadow:none}
.cast-cr{display:block;min-height:1.6rem;margin-top:.15rem;font-size:.75rem;line-height:1.4;color:var(--u-texte2)}
.cast-nom{display:block;margin-top:.5rem;font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:clamp(1.15rem,1rem + .5vw,1.45rem);line-height:1.1;color:var(--u-texte);text-wrap:balance}
.cast-alt,.cast-role{display:block;margin-top:.3rem;font-size:.9375rem;line-height:1.4;color:var(--u-texte2)}
.cast-role{font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.duree{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.5rem;color:var(--u-titre,var(--blanc))}
.prod{margin-top:1rem;font-size:.9375rem;color:var(--u-texte2,var(--gris))}
.prod strong{color:var(--u-texte,var(--blanc))}
.mention{margin-top:.9rem;font-size:.9375rem;color:var(--u-texte2)}
.signe{display:flex;align-items:center;gap:.9rem;margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--trait);font-weight:600;letter-spacing:.04em}
.signe-logo{width:3.4rem;color:var(--u-trace)}
.signe-logo svg{width:100%;height:auto}
.encadre{padding:1.35rem 1.5rem;background:var(--u-fond2);border:1px solid var(--trait);border-left:4px solid var(--u-trace)}
.faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:1rem 1.75rem}
.fait{padding-top:.8rem;border-top:1px solid var(--trait-fort);font-size:1rem;line-height:1.45}
.fait .etiq{margin-bottom:.3rem}
.fait--fort .fait-v{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.375rem;line-height:1.2;color:var(--u-titre)}
.sp-prog > .chap .faits{margin-top:clamp(1.75rem,3vw,2.5rem)}
.prog-video{margin-top:2rem}
/* le contact diffusion, le dossier PDF et les documents (règle 13) : une lumière posée sur le noir */
.cd{display:grid;gap:.4rem;max-width:38rem;margin-top:clamp(1.75rem,3.2vw,2.75rem);padding:1.5rem 1.75rem 1.35rem;border:1px solid var(--trait-fort);border-left:3px solid var(--e,var(--c));background:linear-gradient(100deg,color-mix(in srgb,var(--e,var(--c)) 16%,transparent),rgba(244,238,233,.03) 75%);box-shadow:0 0 80px -20px color-mix(in srgb,var(--e,var(--c)) 60%,transparent)}
.cd .etiq{color:var(--e,var(--gris))}
.cd-nom b{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.75rem,3vw,2.5rem);line-height:1.06;color:var(--blanc)}
.cd-role{display:block;margin-top:.15rem;font-size:1rem;color:var(--gris)}
.cd-liens{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.75rem;margin-top:.9rem}
.cd-mail{display:inline-flex;align-items:center;gap:.85rem;padding:1rem 1.5rem;border:1px solid var(--blanc);background:var(--blanc);color:var(--noir);font-weight:700;font-size:1rem;line-height:1;text-decoration:none;overflow-wrap:anywhere;transition:background-color .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)}
.cd-mail:hover{background:var(--c);border-color:var(--c);box-shadow:0 0 34px color-mix(in srgb,var(--c) 55%,transparent)}
.cd-mail:hover .fl{transform:translateX(.25rem)}
.cd-tel{font-weight:600;text-decoration:none}
html:not(.ed-actif) .cd-tel.vide{display:none}
.cd-cond{margin-top:.7rem;font-size:.875rem;color:var(--gris)}
.cd--s{max-width:none;gap:.3rem;margin-top:clamp(2rem,4vw,3rem);padding:1.15rem 1.5rem;border-left-color:var(--u-vif,var(--c));background:linear-gradient(100deg,color-mix(in srgb,var(--u-vif,var(--c)) 14%,transparent),transparent 80%);box-shadow:none}
.cd--s .cd-nom b{display:inline;font-size:clamp(1.35rem,2vw,1.75rem)}
.cd--s .cd-role{display:inline;margin-left:.6rem}
.cd--s .cd-liens{margin-top:.6rem}
.cd--s .cd-mail{padding:.8rem 1.25rem;background:var(--u-aplat,var(--blanc));border-color:var(--u-aplat,var(--blanc));color:var(--u-sur,var(--noir))}
.dos-bt{position:relative;overflow:hidden;text-align:left;cursor:pointer}
.dos-bt .ico{flex:none;width:1.05rem;height:1.05rem}
.dos-bt[aria-busy="true"]{cursor:progress;box-shadow:0 0 34px color-mix(in srgb,var(--c) 45%,transparent)}
.dos-bt[aria-busy="true"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);background-size:260% 100%;background-position:130% 0;animation:faisceau 1.05s linear infinite}
@keyframes faisceau{to{background-position:-130% 0}}
@media (prefers-reduced-motion:reduce){.dos-bt[aria-busy="true"]::after{animation:none;background-position:50% 0;opacity:.45}}
.prog-actions{display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem 2.25rem}
.prog-actions .plus{margin-top:0}
.docs{display:grid;gap:.8rem}
.docs li{display:flex;align-items:center;gap:.8rem}
.docs li>.ico{flex:none;width:1.1rem;height:1.1rem;color:var(--u-vif,var(--c))}
.docs a{font-weight:600;text-decoration:underline;text-decoration-color:var(--trait-fort);text-underline-offset:.28em;transition:text-decoration-color .3s}
.docs a:hover{text-decoration-color:var(--c)}
.docs .plus{margin-top:0}
.ft-docs{margin-top:clamp(1.5rem,3vw,2.25rem)}
.fu-docs{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--trait)}
.fu-docs .etiq{margin-bottom:.7rem}
details.lieux{margin-top:1.5rem;border-top:1px solid var(--trait-fort);border-bottom:1px solid var(--trait-fort)}
details.lieux summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.95rem 0;cursor:pointer;list-style:none;font-weight:700;letter-spacing:.02em}
details.lieux summary::-webkit-details-marker{display:none}
details.lieux summary::after{content:"";flex:none;width:.6rem;height:.6rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-.15rem);transition:transform .3s var(--ease)}
details.lieux[open] summary::after{transform:rotate(-135deg)}
details.lieux p{padding-bottom:1.2rem;font-size:.9375rem;line-height:1.7;color:var(--u-texte2,var(--blanc-doux))}
.ft-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:1.25rem;margin-top:clamp(1.75rem,3vw,2.5rem)}
.ft-bloc--tete{grid-column:1/-1}
.ft-bloc--tete ul{display:flex;flex-wrap:wrap;gap:.5rem 2.5rem}
.ft-bloc--tete li{font-size:1.0625rem}
.ft-bloc--tete li+li{margin-top:0}
.ft-bloc{padding:1.25rem 1.35rem;background:var(--u-fond2);border-top:4px solid var(--u-trace)}
.ft-t{margin-bottom:.7rem;font-size:.75rem;font-weight:700;letter-spacing:.14em;color:var(--u-titre)}
.ft-bloc li{position:relative;padding-left:1rem;font-size:.9375rem;line-height:1.5}
.ft-bloc li+li{margin-top:.45rem}
.ft-bloc li::before{content:"";position:absolute;left:0;top:.6em;width:.35rem;height:.35rem;background:var(--u-trace)}
.alerte{margin-top:1.5rem;padding:1.1rem 1.35rem;background:var(--u-aplat);color:var(--u-sur);font-size:1.0625rem}
.alerte strong{color:inherit}
.fiche-tech .carton{margin-top:2rem}
/* l'action culturelle : son type, en grand, sur un aplat */
.ac-type{display:inline-block;margin-top:.7rem;padding:.55rem 1.05rem .65rem;background:var(--u-aplat);color:var(--u-sur);font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:clamp(1.9rem,4vw,3.4rem);line-height:1.04;text-wrap:balance}
.ac-meta{display:flex;flex-wrap:wrap;gap:.6rem 1.25rem;margin-top:1.25rem;align-items:baseline}
.ac-meta li{display:flex;flex-wrap:wrap;align-items:baseline;gap:.45rem;font-weight:600}
.ac-pill{display:inline-block;padding:.25rem .7rem;border:1px solid var(--trait-fort);font-size:.8125rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.ac-grille{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:2rem clamp(2rem,5vw,4.5rem);margin-top:clamp(2rem,4vw,3rem);align-items:start}
.formule li{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;line-height:1.3;color:var(--u-titre)}
.formule li+li{margin-top:.35rem}
.dispositifs{margin-top:1.5rem}
.dispositifs li{position:relative;padding-left:1rem;margin-top:.5rem;font-size:.9375rem;line-height:1.55}
.dispositifs li::before{content:"";position:absolute;left:0;top:.62em;width:.35rem;height:.35rem;border-radius:50%;background:var(--u-trace)}
.dispositifs a{color:inherit;text-underline-offset:.2em}
.a-completer{margin-top:.7rem;padding:1.25rem 1.5rem;border:1px dashed var(--trait-fort);font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.15;color:var(--u-texte2,var(--gris))}
/* le dossier scolaire : la charte de la compagnie (aplats, encadrés, tableau net) */
.dossier{margin-top:clamp(4.5rem,9vw,8rem)}
.dossier-couv{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem 3rem;align-items:end;padding:clamp(1.75rem,4vw,3.25rem);background:var(--u-aplat);color:var(--u-sur);overflow:hidden}
.dossier-couv .motif{position:absolute;right:-3rem;top:-3rem;width:18rem;opacity:.22;--motif-trait:1.4px}
.dossier-couv .chap-t{color:inherit;font-size:clamp(1rem,1.4vw,1.125rem);font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.dossier-titre{margin-top:.6rem;font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,700);font-size:clamp(3rem,8vw,6.5rem);line-height:.95;letter-spacing:.02em}
.dossier-auteur{margin-top:.5rem;font-size:1.25rem;font-style:italic}
.dossier-faits{display:flex;flex-wrap:wrap;gap:.5rem;position:relative}
.dossier-faits li{padding:.35rem .75rem;border:1px solid currentColor;font-size:.75rem;font-weight:700;letter-spacing:.14em}
.dossier-formule{margin-top:.9rem;font-weight:700;position:relative}
.dos-sec{margin-top:clamp(3rem,6vw,5rem)}
.dos-t{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:var(--fs-h3);line-height:1.12;color:var(--u-titre);text-wrap:balance}
.pourquoi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem;margin-top:1.75rem}
.pourquoi > div{padding:1.4rem 1.5rem 1.6rem;background:var(--u-fond2);border-top:4px solid var(--u-trace)}
.pourquoi h4{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;line-height:1.25;color:var(--u-titre)}
.pourquoi .prose{margin-top:.8rem;font-size:.9688rem;line-height:1.65}
.table-s{margin-top:1.75rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.prog{width:100%;min-width:40rem;border-collapse:collapse;font-size:.9375rem;line-height:1.5;background:var(--u-fond2)}
.prog th,.prog td{padding:.8rem 1rem;border:1px solid var(--trait-fort);vertical-align:top;text-align:left}
.prog th[scope="rowgroup"]{width:5.5rem;background:var(--u-aplat);color:var(--u-sur);font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;text-align:center;vertical-align:middle}
.prog th[scope="row"]{width:8.5rem;font-weight:700;color:var(--u-titre)}
.prog td:last-child{color:var(--u-texte2)}
.consignes{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.5rem 3rem;margin-top:1.75rem;align-items:start}
.note{display:inline-block;padding:.3rem .7rem;background:var(--u-aplat);color:var(--u-sur);font-size:.75rem;font-weight:700;letter-spacing:.16em}
.demandes{margin-top:1rem;display:grid;gap:.5rem}
.demandes li{padding:.7rem 1rem;border:2px solid var(--u-trace);font-weight:700;font-size:.9375rem;letter-spacing:.04em;color:var(--u-titre)}
.axes{margin-top:.8rem;display:grid;gap:.6rem}
.axes li{position:relative;padding-left:1.1rem;font-size:.9688rem}
.axes li::before{content:"";position:absolute;left:0;top:.65em;width:.4rem;height:.4rem;border-radius:50%;background:var(--u-trace)}
.ateliers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem;margin-top:1.75rem}
.atelier{padding:1.5rem 1.6rem 1.7rem;background:var(--u-fond2);border-top:4px solid var(--u-trace)}
.atelier h4{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.375rem;line-height:1.2;color:var(--u-titre)}
.atelier h4 strong{font-weight:inherit}
.atelier .prose{margin-top:.8rem;font-size:.9688rem;line-height:1.65}
.etapes{display:grid;gap:.9rem;margin-top:1rem}
.etapes h5{font-size:.9375rem;color:var(--u-titre)}
.etapes h5 strong{font-weight:700}
.etapes p{margin-top:.25rem;font-size:.9375rem;line-height:1.6;color:var(--u-texte2)}
.points{display:grid;gap:.5rem;margin-top:1rem}
.points li{position:relative;padding-left:1.1rem;font-size:.9375rem;line-height:1.6}
.points li::before{content:"";position:absolute;left:0;top:.62em;width:.4rem;height:.4rem;background:var(--u-trace)}
.ateliers-ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1.5rem}
.ateliers-ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.plus-loin{margin-top:1.75rem}
.plus-loin details{border-top:1px solid var(--trait-fort)}
.plus-loin details:last-child{border-bottom:1px solid var(--trait-fort)}
.plus-loin summary{padding:1rem 0;cursor:pointer;font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;color:var(--u-titre)}
.plus-loin .prose{padding-bottom:1.25rem;max-width:48rem;font-size:.9688rem;line-height:1.7}
.suivant{position:relative;display:grid;align-items:end;height:min(68vh,40rem);min-height:20rem;overflow:hidden;text-decoration:none;color:var(--blanc);isolation:isolate;background:var(--noir)}
.suivant img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(.38);transition:filter .9s var(--ease),transform 1.2s var(--ease)}
.suivant::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(11,8,9,.92) 0,rgba(11,8,9,.3) 50%,rgba(11,8,9,.55) 100%)}
.suivant:hover img,.suivant:focus-visible img{filter:brightness(.82);transform:scale(1.02)}
.suivant-in{display:block;padding-bottom:clamp(2.5rem,6vh,4rem)}
.suivant-t{display:block;max-width:22ch;font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:var(--fs-scene);line-height:1;text-wrap:balance}
.suivant-t .fl{margin-left:.35em;font-family:var(--sans);font-style:normal;font-weight:400;font-size:.5em;color:var(--c)}
.suivant:hover .suivant-t .fl{transform:translateX(.5rem)}

/* Je souhaite programmer : le catalogue, une fiche par spectacle dans sa lumière */
.catalogue{display:grid;gap:clamp(1.25rem,2.5vw,2rem)}
.fiche-u{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--u-fond);color:var(--u-texte);overflow:hidden;isolation:isolate}
.fiche-u:nth-child(even){grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.fiche-u:nth-child(even) .fu-ph{order:2}
.fu-ph{position:relative;min-height:24rem;background:#000;overflow:hidden}
.fu-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.68) saturate(.9);transition:filter .9s var(--ease)}
.fiche-u:hover .fu-ph img{filter:brightness(.92) saturate(1)}
.fu-ph .motif{position:absolute;left:1.25rem;bottom:1.25rem;width:4.5rem;color:var(--u-lum);opacity:.8;--motif-trait:1.3px;filter:drop-shadow(0 0 5px var(--u-lum))}
.fu-corps{padding:clamp(1.75rem,3.5vw,3rem)}
.fu-sur{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.fu-t{margin-top:.7rem;font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(2rem,3.4vw,3.25rem);line-height:1.02;color:var(--u-titre);text-wrap:balance}
.fu-t a{text-decoration:none}
.fu-t a:hover{text-shadow:0 0 30px var(--u-lueur)}
.fu-sous{margin-top:.5rem;color:var(--u-texte2)}
.fu-corps .faits{margin-top:1.5rem}
.fu-corps .fiche{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1.5rem;margin-top:1.5rem;font-size:.875rem}
.fu-corps .fiche-avec{grid-column:1/-1}
.fu-actions{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem;margin-top:1.75rem}
.fu-actions .plus{margin-top:0}
.prog-carte{margin-top:clamp(2rem,4vw,3rem)}
.partenaires{max-width:52rem;font-size:1.0625rem;line-height:1.75;color:var(--blanc-doux)}

/* Je représente un établissement scolaire */
.ecole{max-width:54rem;margin-top:clamp(1.75rem,3vw,2.5rem);padding-left:1.5rem;border-left:2px solid var(--e);font-size:clamp(1.125rem,1.45vw,1.3125rem);line-height:1.72;color:var(--blanc-doux)}
.groupe{padding-top:clamp(2.5rem,5vw,4rem)}
.groupe-t{display:flex;align-items:center;gap:.9rem;font-size:.875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.groupe-t::after{content:"";flex:1;height:1px;background:var(--trait)}
.cartes-ac{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,24rem),1fr));gap:clamp(1rem,2vw,1.5rem);margin-top:1.5rem}
.carte-ac{display:flex;flex-direction:column;background:var(--u-fond);color:var(--u-texte);overflow:hidden}
.cac-ph{position:relative;aspect-ratio:16/6.5;background:#000;overflow:hidden}
.cac-ph img{width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(.85);transition:filter .8s var(--ease)}
.carte-ac:hover .cac-ph img{filter:brightness(.9) saturate(1)}
.cac-ph .motif{position:absolute;right:1rem;top:1rem;width:3.4rem;color:var(--u-lum);opacity:.85;--motif-trait:1.25px;filter:drop-shadow(0 0 4px var(--u-lum))}
.cac-t{margin-bottom:1rem;font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(1.75rem,2.6vw,2.4rem);line-height:1.04;color:var(--u-titre);text-wrap:balance}
.cac-t a{text-decoration:none}
.cac-t a:hover{text-shadow:0 0 28px var(--u-lueur)}
.cac-corps{display:flex;flex-direction:column;flex:1;padding:1.4rem 1.5rem 1.6rem}
.cac-corps .ac-type{font-size:clamp(1.4rem,2.2vw,1.9rem)}
.cac-corps > p:not(.etiq):not(.ac-type):not(.cac-liens),.cac-corps > div:not(.dispositifs){margin-top:1rem;font-size:.9688rem;line-height:1.65}
.cac-corps .formule{margin-top:1rem}
.cac-corps .formule li{font-size:1.0625rem}
.cac-liens{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:auto;padding-top:1.5rem}
.cac-liens .plus{margin-top:0}
.plus--plein{background:var(--u-aplat);border-color:var(--u-aplat);color:var(--u-sur)}
.actions-grille{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2.5rem clamp(2rem,5vw,5rem);align-items:start}
.actions{max-width:48rem;margin-top:2rem;font-size:1.0625rem;line-height:1.75;color:var(--blanc-doux)}
.actions h2,.legal-txt h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:var(--fs-h3);line-height:1.15;color:var(--blanc);margin:2.75rem 0 1.1rem}
.actions > :first-child h2,.legal-txt > :first-child h2{margin-top:0}
.actions li{position:relative;padding-left:1.5rem}
.actions li + li{margin-top:.9rem}
.actions li::before{content:"";position:absolute;left:0;top:.72em;width:.45rem;height:.45rem;border-radius:50%;background:var(--lumiere);box-shadow:0 0 10px 2px rgba(255,217,168,.5)}
.actions-ph{position:sticky;top:calc(var(--tete) + 1.5rem)}
.actions-ph .grande{width:100%;aspect-ratio:4/3;object-fit:cover}
.actions-ph .mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-top:.5rem}
.actions-ph .mini img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(.2)}
.actions-ph .credit-u{color:var(--gris)}

/* La compagnie : le texte, la rampe des années, le directeur */
.cie{padding-bottom:clamp(2rem,4vw,3rem)}
.cie-txt{max-width:46rem;font-size:1.125rem;line-height:1.75;color:var(--blanc-doux)}
.cie-txt > :first-child{font-size:1.3125rem;line-height:1.65;color:var(--blanc)}
.rampe{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));margin-top:clamp(2.5rem,4.5vw,3.5rem);border-top:1px solid var(--trait-fort)}
.rampe li{min-width:0}
.rampe a,.rampe .rampe-in{position:relative;display:block;height:100%;padding:2rem 1.25rem 1.5rem 0;text-decoration:none;color:var(--blanc)}
.rampe-lampe{position:absolute;top:-.32rem;left:0;width:.6rem;height:.6rem;border-radius:50%;background:var(--c);box-shadow:0 0 12px 2px color-mix(in srgb,var(--c) 45%,transparent);transition:box-shadow .4s}
.rampe-annee{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2rem,3.2vw,2.75rem);line-height:1}
.rampe-t{display:block;margin-top:.6rem;font-family:var(--u-police,var(--sans));font-weight:var(--u-graisse,500);font-size:1.0625rem;line-height:1.3;color:var(--c);transition:color .3s}
.rampe a:hover .rampe-lampe,.rampe a:focus-visible .rampe-lampe{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 0 26px 8px color-mix(in srgb,var(--c) 65%,transparent)}
.rampe a:hover .rampe-t,.rampe a:focus-visible .rampe-t{color:#fff}
.dir-grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:2rem clamp(2.5rem,6vw,6rem);align-items:start}
.dir-chapeau{margin-top:1.25rem;font-size:1.25rem;color:var(--lumiere)}
.cie-part{padding-bottom:clamp(4rem,8vw,7rem)}
.legal{max-width:52rem;padding-block:clamp(3.5rem,7vw,6rem)}
.legal-txt{margin-top:2.5rem;font-size:1rem;line-height:1.7;color:var(--blanc-doux)}
.legal-txt > * + *{margin-top:1rem}

/* Formulaires */
.form label{display:block;margin-bottom:.45rem;font-size:.875rem;font-weight:600;letter-spacing:.04em;color:var(--blanc-doux)}
.form input:not([type="checkbox"]),.form textarea{width:100%;padding:.85rem 1rem;background:rgba(244,238,233,.04);border:1px solid var(--trait-fort);border-radius:0;color:var(--blanc);transition:border-color .3s,box-shadow .3s}
.form textarea{resize:vertical;min-height:9rem}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--lumiere);box-shadow:0 0 0 3px rgba(255,217,168,.14),0 0 26px rgba(255,217,168,.12)}
.btn--plein{margin-top:1.75rem;background:var(--blanc);border-color:var(--blanc);color:var(--noir)}
.btn--plein:hover{background:var(--lumiere);border-color:var(--lumiere)}
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:3rem clamp(2.5rem,6vw,6rem);align-items:start;padding-block:clamp(3.5rem,7vw,6rem) clamp(4rem,8vw,7rem)}
.contact-coord{display:flex;flex-direction:column;margin-top:2rem;font-style:normal;color:var(--blanc-doux)}
.contact-nom{font-weight:600;color:var(--blanc)}
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem 1.5rem}
.champ{min-width:0}
.champ--large{grid-column:1/-1}
.consent{display:flex;align-items:flex-start;gap:.75rem;margin-top:1.5rem}
.consent input{flex:none;width:1.15rem;height:1.15rem;margin:.3rem 0 0;accent-color:var(--lumiere)}
.consent label{margin:0;font-size:1rem;font-weight:400;letter-spacing:0}
.calcul{display:flex;align-items:center;gap:.9rem;margin-top:1.25rem}
.calcul label{margin:0;font-size:1rem}
.form .calcul input{width:4.5rem}

/* Pied de page */
.pied{position:relative;z-index:1;background:var(--noir);border-top:1px solid var(--trait);padding-block:clamp(3.5rem,6vw,5.5rem) 2.25rem}
.pied-grille{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,3fr) minmax(0,2fr) minmax(0,5fr);gap:2.5rem 2rem;align-items:start}
.pied-logo{display:block;width:8.5rem;color:var(--blanc)}
.pied-logo svg{width:100%;height:auto}
.pied-coord{display:flex;flex-direction:column;font-style:normal;color:var(--blanc-doux)}
.pied-nom{font-weight:600;color:var(--blanc)}
.pied-liens li + li{margin-top:.35rem}
.pied-fb{color:var(--blanc-doux)}
.pied-part{font-size:.9375rem;line-height:1.65;color:var(--gris)}
.pied-bas{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem 2rem;margin-top:clamp(2.5rem,5vw,4rem);padding-top:1.5rem;border-top:1px solid var(--trait);font-size:.875rem;color:var(--gris)}
.pied-legal span{white-space:nowrap}
.pied-legal span + span::before{content:"·";margin-inline:.6rem}
.pied-legaux{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem}
.pied-legaux .lien{color:var(--gris)}
.pied-legaux .lien:hover{color:var(--blanc)}
.modifier{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .8rem;background:none;border:1px solid var(--trait-fort);color:var(--gris);font-size:.8125rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:color .3s,border-color .3s,box-shadow .3s}
.modifier::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--lumiere);opacity:.6}
.modifier:hover{color:var(--blanc);border-color:var(--lumiere);box-shadow:0 0 18px rgba(255,217,168,.2)}

/* L'édition sur place, dans le noir et la lumière */
.ed-barre{border-radius:2px!important;box-shadow:0 0 0 1px rgba(255,217,168,.16),0 18px 50px rgba(0,0,0,.6),0 0 40px rgba(255,217,168,.1)!important}
.ed-bt{border-radius:2px!important}
.ed-actif .revele .ligne,.ed-actif .scene-accroche.revele{animation:none}

/* ———————————— le mouvement (règle 15) : l'éclairage ; voir le bloc « Mouvement » en tête du script ———————————— */
html{view-transition-name:none}
html.attend-polices body>:not(.intro){visibility:hidden}
main{display:block;min-height:100vh}
/* la salle : entre deux pages, le noir se fait sur la scène (l'en-tête reste éclairé) ; puis la lumière remonte d'un point */
.salle{position:fixed;inset:0;z-index:45;pointer-events:none}
.salle[hidden]{display:none}
.salle-noir{position:absolute;inset:0;background:var(--noir);opacity:0}
/* la lueur : un calque modeste (60vmax, sa lumière va jusqu'au bord) que l'animation agrandit : peu de pixels à peindre */
.salle-spot{position:absolute;left:var(--lx,24%);top:var(--ly,32%);width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,217,168,.3),rgba(255,217,168,.1) 50%,rgba(255,217,168,0));opacity:0;transform:scale(.2)}
/* la pression : la lumière baisse sous le doigt */
:is(.entree,.onglet,.porte,.btn,.plus,.appel,.chip,.idx,.idx-tout,.titre,.pause,.affiche,.fiche-u .fu-t a,.rep a,.carte-ac,.modifier,.second a,.sommaire button,.ep-porte).mv-presse{opacity:.72;transform:scale(.985);transition:opacity .08s,transform .08s}
.sai>summary.mv-presse{background:linear-gradient(90deg,rgba(255,217,168,.14),transparent 70%)}
/* survol et focus : 120 à 200 ms */
.chip,.idx,.idx-tout,.plus,.btn,.date,.rep a,.saisons a,.entree,.onglet,.second a{transition-duration:.18s}
/* une ligne vers laquelle la frise mène : la lumière passe sur elle */
.date.est-vise{animation:vise 1.2s var(--ease)}
@keyframes vise{0%,30%{background:linear-gradient(90deg,color-mix(in srgb,var(--c,#ffd9a8) 22%,transparent),transparent 80%)}}
.date.est-allume{background:linear-gradient(90deg,color-mix(in srgb,var(--c,#ffd9a8) 12%,transparent),transparent 75%)}
.date.est-allume::before{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 16px 4px color-mix(in srgb,var(--c) 55%,transparent)}
.sai.est-allume>summary{background:linear-gradient(90deg,rgba(255,217,168,.1),transparent 70%)}
.cl .carte-lieu.est-allume .cl-aura{transform:scale(1.8)}
/* une carte de beaucoup de communes : des faisceaux fins, sans halo flou ni pulsation, qui paraissent ensemble */
.cl--fin .cl-faisceau{stroke-opacity:.5;stroke-width:calc(var(--e) * .8)}
.cl--fin.attend .cl-faisceaux{opacity:0}
.cl--fin .cl-faisceaux{transition:opacity 1.2s var(--ease)}
.cl--fin.attend .cl-lieu{opacity:1}
.cl--fin .cl-lieu,.cl--fin .cl-aura{animation:none!important}
/* ———— les frises (FRISE) : la lumière dans le noir ; l'axe est un filet de lumière, chaque date une lampe à la couleur de
   son spectacle (éteinte quand elle est passée), « aujourd'hui » la lumière chaude qui respire ———— */
.frise[data-frise]{--fr-fond:var(--noir);--fr-encre:var(--blanc-doux);--fr-trait:rgba(255,217,168,.42);--fr-accent:var(--lumiere);--fr-police:var(--sans);
  --fr-bulle-fond:#1d1617;--fr-bulle-encre:var(--blanc);--fr-point:10px;--fr-couloir:17px;--fr-haut:28px;--fr-taille:12px;--fr-passe:.34;--fr-courbe:var(--ease)}
.frise[data-frise] .frise-axe{height:1px;background:var(--lumiere);box-shadow:0 0 10px 1px rgba(255,217,168,.4)}
.frise[data-frise] .frise-point>.frise-repere::before{box-shadow:0 0 0 2px var(--fr-fond),0 0 14px 3px color-mix(in srgb,var(--fr-c,#ffd9a8) 55%,transparent)}
.frise[data-frise] .frise-point.est-passe>.frise-repere::before{box-shadow:0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-mois-nom{font-family:var(--serif);font-style:italic;font-weight:600;font-size:.95rem;letter-spacing:0}
.frise[data-frise] .frise-an{font-size:.72rem;font-weight:600;letter-spacing:.14em;color:var(--gris)}
/* les mois et les années : un peu plus bas que les lampes (une lampe groupée, sur l'axe, ne touche pas leur nom) */
.frise[data-frise].frise--mois{--fr-pied:46px}
.frise[data-frise] .frise-mois>li>span:first-child{top:13px}
.frise[data-frise] .frise-aujourdhui::before{width:1px;background:var(--lumiere);box-shadow:0 0 12px 2px rgba(255,217,168,.55);opacity:1}
.frise[data-frise] .frise-aujourdhui-nom{font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
.frise[data-frise] .frise-bulle{border:1px solid var(--trait-fort);border-radius:0;box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 30px rgba(255,217,168,.12)}
.frise[data-frise] .frise-bulle b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.1rem}
.frise[data-frise] .frise-repere:focus-visible{outline:2px solid var(--lumiere);outline-offset:2px}
/* la prochaine date : sa lampe bat */
.frise[data-frise] :is(.frise-point.est-passe+.frise-point:not(.est-passe),.frise-point:first-child:not(.est-passe))>.frise-repere::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--fr-c,var(--lumiere));opacity:0;animation:prochaine 2.4s ease-out 1.2s infinite;pointer-events:none}
@keyframes prochaine{0%{opacity:.6;scale:1}80%,100%{opacity:0;scale:2.8}}
.frise-hote{min-height:112px;margin-top:clamp(1.5rem,3vw,2.25rem)}
#v-frise{min-height:126px}
.u-corps .frise[data-frise]{--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-trace) 50%,transparent);--fr-accent:var(--u-trace);--fr-bulle-fond:var(--u-fond2);--fr-bulle-encre:var(--u-texte)}
.u-corps .frise[data-frise] .frise-axe{background:var(--u-trace);box-shadow:0 0 10px 1px color-mix(in srgb,var(--u-lueur,#ffd9a8) 70%,transparent)}
.frise-saisons{--fr-bande-h:48px;--fr-haut:20px;--fr-pied:30px}
.frise-saisons .frise-bande-barre{margin:0 3px;background:linear-gradient(0deg,rgba(255,217,168,.08),var(--lumiere));opacity:.8;box-shadow:0 0 18px rgba(255,217,168,.22)}
.frise-saisons .frise-bande:is(:hover,.est-allume) .frise-bande-barre{opacity:1;box-shadow:0 0 26px rgba(255,217,168,.45)}
.frise-saisons .frise-bande-n{font-family:var(--serif);font-style:italic;font-weight:600;font-size:.9rem}
.frise-saisons .frise-bande-nom{font-size:.7rem;letter-spacing:.08em;color:var(--gris)}
.ag-frise{min-height:118px;margin:1.25rem 0 .5rem}
.frise-diffusion{--fr-bande-h:30px;--fr-haut:14px;--fr-pied:26px;--fr-taille:10px}
.frise-diffusion .frise-bande-barre{margin:0 1px;background:var(--u-trace,var(--lumiere));opacity:.85}
.frise-diffusion .frise-bande-nom{opacity:.8;letter-spacing:-.02em}
.diffusion{min-height:92px;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--trait)}
.histoire{min-height:180px;margin-top:clamp(2rem,4vw,3rem)}
.frise-compagnie .frise-etiquette{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1rem}
/* les titres de l'histoire : un couloir par ligne de texte ; le titre d'en bas passe devant le filet de celui d'au-dessus (et devant
   « aujourd'hui ») : le filet s'interrompt derrière lui au lieu de le barrer */
.frise[data-frise].frise-compagnie{--fr-couloir:24px}
.frise-compagnie .frise-point{z-index:calc(10 - var(--fr-y,0))}
.frise-compagnie .frise-etiquette{max-width:13.6em;padding:0 .3em;margin:0 -.3em;background:var(--fr-fond)}
/* l'espace pro : trois portes dans le noir ; la lumière les éclaire au survol */
.ep-portes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.ep-portes li+li .ep-porte{border-left:1px solid var(--trait)}
.ep-porte{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:.9rem;height:100%;min-height:clamp(16rem,42vh,24rem);padding:clamp(1.75rem,3.5vw,3rem) clamp(1.25rem,3vw,2.75rem);overflow:hidden;isolation:isolate;text-decoration:none;color:var(--blanc)}
.ep-porte::after{content:"";position:absolute;left:-20%;right:-20%;top:-12%;height:95%;z-index:-1;background:radial-gradient(48% 62% at 50% 0,color-mix(in srgb,var(--e) 40%,transparent),transparent 72%);mix-blend-mode:screen;opacity:.25;transition:opacity .2s}
.ep-porte:hover::after,.ep-porte:focus-visible::after{opacity:1}
.ep-porte:focus-visible{outline-offset:-6px}
.ep-porte .lampe{width:.75rem;height:.75rem;opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--e) 22%,transparent),0 0 24px 6px color-mix(in srgb,var(--e) 55%,transparent)}
.ep-t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.75rem,2.6vw,2.5rem);line-height:1.06;text-wrap:balance}
.ep-x{max-width:28rem;color:var(--blanc-doux)}
.ep-porte .fl{font-size:1.5rem;color:var(--e)}
.ep-porte:hover .fl,.ep-porte:focus-visible .fl{transform:translateX(.4rem)}
@media (max-width:900px){.ep-portes{grid-template-columns:1fr}.ep-portes li+li .ep-porte{border-left:0;border-top:1px solid var(--trait)}}
/* le dossier composé : la lumière le traverse une fois */
.dos-bt.dos-pret::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,250,240,.55),transparent);transform:translateX(-100%);animation:balaye .7s var(--ease) both}
@keyframes balaye{to{transform:translateX(100%)}}
/* ce qui attend sa suite (sous le pli) garde la hauteur d'un écran : rien de visible ne bouge quand elle se remplit */
[data-suite-attend]{min-height:100vh}

/* L'ouverture, habillée : le noir, une photo à peine éclairée, le logo blanc */
.intro.m07-intro .intro-image{opacity:.42}
.intro.m07-intro::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 58% at 50% 47%,rgba(11,8,9,0) 0,rgba(11,8,9,.3) 46%,rgba(11,8,9,.93) 100%)}
.intro.m07-intro .intro-indice,.intro.m07-intro .intro-logo{z-index:1}
.intro.m07-intro .intro-indice{color:var(--lumiere)}

@media (max-width:1099px){
  :root{--tete:4.5rem;--barre:4.4rem}
  body{padding-bottom:calc(var(--barre) + env(safe-area-inset-bottom))}
  .marque-pieuvre{width:3.6rem}
  .marque-mot{width:4.6rem}
  .tete-in{justify-content:space-between}
  /* les trois entrées restent à portée : une barre fixe en bas de l'écran */
  .entrees{position:fixed;left:0;right:0;bottom:0;z-index:5;display:block;overflow:visible;background:rgba(11,8,9,.97);border-top:1px solid var(--trait);padding-block:0 env(safe-area-inset-bottom)}
  .entrees ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
  .entree{flex-direction:column;justify-content:center;gap:.45rem;height:var(--barre);padding:.5rem .35rem;white-space:normal;text-align:center;font-size:.8125rem;line-height:1.2}
  .entree .long{display:none}
  .entree .court{display:inline}
  .entree::after{left:24%;right:24%;top:0;bottom:auto}
  .menu-btn{position:relative;z-index:4;display:inline-flex;align-items:center;gap:.7rem;padding:.6rem 0;background:none;border:0;cursor:pointer;font-weight:600;font-size:1rem;letter-spacing:.02em}
  .menu-ico{position:relative;width:1.5rem;height:.6rem}
  .menu-ico::before,.menu-ico::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .35s var(--ease),top .35s var(--ease)}
  .menu-ico::before{top:0}
  .menu-ico::after{top:calc(100% - 1.5px)}
  .tete.ouvert .menu-ico::before{top:calc(50% - .75px);transform:rotate(45deg)}
  .tete.ouvert .menu-ico::after{top:calc(50% - .75px);transform:rotate(-45deg)}
  .second{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:6rem var(--pad) calc(var(--barre) + 3rem);overflow-y:auto;border:0;background:radial-gradient(60rem 40rem at 20% 30%,rgba(255,217,168,.08),transparent 70%),var(--noir);visibility:hidden;opacity:0;transition:opacity .35s var(--ease),visibility 0s .35s}
  .tete.ouvert .second{visibility:visible;opacity:1;transition:opacity .35s var(--ease)}
  .second ul{flex-direction:column;gap:.15rem}
  .second a{display:inline-block;padding:.3rem 0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2rem,7.5vw,3.25rem);line-height:1.2;letter-spacing:0;color:var(--blanc);white-space:normal}
  .second a[aria-current]::after{bottom:.25rem;height:2px}
  .tete.ouvert{background:var(--noir)}
  .pied-grille{grid-template-columns:repeat(2,minmax(0,1fr))}
  .distrib,.ac-grille,.consignes,.dir-grille,.actions-grille,.dossier-couv{grid-template-columns:minmax(0,1fr)}
  .actions-ph{position:static}
  .pourquoi{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .tournee-grille,.agenda-grille,.contact,.carte-boite--seule{grid-template-columns:minmax(0,1fr)}
  .agenda-carte{position:static;order:-1}
  .sai-corps:not(:empty){grid-template-columns:minmax(0,1fr)}
  .carte-boite--seule .cl-legende{margin-bottom:0}
  .choix{grid-template-columns:1fr}
  .choix li+li .porte{border-left:0;border-top:1px solid var(--trait)}
  .porte{min-height:clamp(15rem,40vh,20rem)}
  .sp-voir{grid-template-columns:minmax(0,1fr)}
  .sommaire{display:none}
  .fiche-u,.fiche-u:nth-child(even){grid-template-columns:minmax(0,1fr)}
  .fiche-u:nth-child(even) .fu-ph{order:0}
  .fu-ph{min-height:0;aspect-ratio:16/9}
  .ateliers{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .sai>summary{grid-template-columns:4.25rem minmax(0,1fr) auto;padding:1rem .1rem}
  .sai-n{gap:.4rem}
  .sai-corps{padding:.5rem .1rem 2rem}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--pad));padding:2px var(--pad) 4px;scrollbar-width:none}
  .chip,#choix-lieu{flex:none}
  .recherche{max-width:none}
  .scene{display:block;height:auto;min-height:0}
  .scene-visuel{position:relative;height:62vh;height:62svh;min-height:20rem}
  .spot{display:none}
  .ombre{background:linear-gradient(180deg,rgba(11,8,9,.7) 0,rgba(11,8,9,0) 7rem),linear-gradient(0deg,var(--noir) 0,rgba(11,8,9,.8) 20%,rgba(11,8,9,.2) 50%,rgba(11,8,9,0) 62%)}
  .credit,.scene--accueil .credit,.scene--spectacle .credit{top:calc(var(--tete) + .75rem);bottom:auto}
  .scene-corps{margin-top:-8.5rem;padding-top:0;padding-bottom:1.75rem}
  .scene--spectacle{min-height:0}
  .scene--spectacle .scene-corps{margin-top:-9rem;padding-bottom:2rem}
  .scene--spectacle .scene-titre,.scene--spectacle .scene-titre.n2,.scene--spectacle .scene-titre.n3{font-size:clamp(2.4rem,11vw,3.4rem)}
  .gobo{top:calc(var(--tete) + 1rem);right:1rem;width:9.5rem}
  .scene-sous{font-size:1.125rem}
  .btn{margin-top:1.3rem}

<script>const D = {"saison":"2026-2027","aujourdhui":"2026-10-21","site":{"nom":"Compagnie Crescite","titreSuffixe":"crescite","accueil":"Accueil","entrees":[{"cle":"voir","texte":"Je viens voir un spectacle","court":"Voir un spectacle","href":"#/voir","couleur":"#c2306f","couleurVive":"#f07ab6"},{"cle":"programmer","texte":"Je souhaite programmer","court":"Programmer","href":"#/programmer","couleur":"#8a6410","couleurVive":"#e8bc5c"},{"cle":"etablissement","texte":"Je représente un établissement scolaire","court":"Établissement scolaire","href":"#/etablissement","couleur":"#127a6a","couleurVive":"#5fd0bd"}],"menu":[{"id":"spectacles","texte":"Spectacles","href":"#/spectacles"},{"id":"compagnie","texte":"La compagnie","href":"#/compagnie"},{"id":"contact","texte":"Contact","href":"#/contact"}],"redirections":{"#/agenda":"#/voir","#/actions-culturelles":"#/etablissement"},"diaporama":[{"slug":"cleophene","surtitre":"EN TOURNÉE","titre":["Cléophène"],"bouton":"découvrir","credit":"@Arnaud Bertereau","href":"#/spectacle/cleophene"},{"slug":"ci-gisait-cyrano","surtitre":"EN TOURNÉE","titre":["Ci-gisait Cyrano"],"bouton":"découvrir","credit":"@Arnaud Bertereau","href":"#/spectacle/ci-gisait-cyrano"},{"slug":"berenice","surtitre":"EN TOURNÉE","titre":["Bérénice"],"bouton":"découvrir","credit":"©Olivier Héron","href":"#/spectacle/berenice"},{"slug":"mon-royaume","surtitre":"EN TOURNÉE","titre":["Mon royaume pour un cheval","Romeo & Juliet"],"bouton":"découvrir","credit":"©Thomas Cartron","href":"#/spectacle/mon-royaume"},{"slug":"imaginaire-force","surtitre":"EN TOURNÉE","titre":["L'imaginaire forcé"],"bouton":"découvrir","credit":"©Thomas Cartron","href":"#/spectacle/imaginaire-force"}],"donateurs":"Merci à nos donateurs pour le festival off d’Avignon 2025 : Agnès Resse, Jean-Marc Talbot, Lou Valentini, Mandy-Lou Jossec, Julien Lenne, Clémence Carry, Alain Voisin, Pierre Benoit, Marion Casabianca, Sylvie Beltrami, Annie Jeanne, Gaëlle Bidault, Karine et Gilles Lioult Mary, Sabine Genel, Brigitte Deflandre, Marie-Emmanuelle Volcke, Chantal Tois, Cara Robert, Marc Toulin, Clarisse Gourmaud, Bruno Le Garjan, Hélène Allain, Hélène Charron, Violaine Le Naour, Catherine Dewitt, Jean-François Levistre, Sophie Caritté, Emeline Revelard, Lydie Jossec, Esther Martin, les spectateurs de Flamanville, et quelques anonymes…","compagnie":{"titre":"Présentation de la compagnie","paragraphes":["La compagnie <strong>Crescite<\/strong> naît en 2012 à Rouen et se caractérise depuis sa création par le désir de mettre l’acteur au centre de son travail. « J’ai l’intime conviction que c’est ce que l’on vient chercher au théâtre : un « shoot » d’humanité dans la réciprocité. L’on vient voir un autre être humain vivre des choses auxquelles, possiblement, nous serons nous-même confrontés un jour. S’y reconnaître, mieux s’y comprendre et mieux comprendre l’autre. Et si le but du théâtre a été un jour de raconter le monde, alors je crois qu’il est toujours nécessaire d’utiliser le récit ou la fable pour éviter l’écueil d’un prêche moralisateur. »","Les <strong>Crescite<\/strong> poursuivent le travail amorcé dès leurs débuts en multipliant les endroits de rencontres avec « les » publics. Ils seront toujours pluriels, les ponts étant de longues et laborieuses entreprises. Pour ce faire, la compagnie se questionne constamment sur les formes diverses que nécessitent ce croisement des publics : des formes tantôt destinées aux théâtres en « dur », tantôt destinées aux lieux non-dédiés dans l’espoir de participer à toujours plus de décentralisation.","Le projet esthétique de la compagnie est constamment en interrogation au regard de l’œuvre en travail, et d’elle — d’abord — naît la forme qui semble la plus juste. Une attention particulière est toujours apportée au public. L’accompagner, le « séduire » — toujours — dans le but de l’amener à l’exigence des thèmes que l’on s’impose. Être dans le divertissement de qualité, un théâtre qui enseigne et interroge.","« Crescite » pourrait se traduire par « excroissances » en italien ou encore par l’impératif latin « grandissez ! ». C’est avec ces deux prérogatives que la compagnie tend à se construire. Tenter un théâtre perméable, tenter un théâtre qui éduque par le divertissement."],"datesTitre":"En quelques dates","dates":[{"annee":"2012","titre":"L’Imaginaire forcé"},{"annee":"2013","titre":"Mon Royaume pour un cheval – Romeo and Juliet –"},{"annee":"2016","titre":"Macbeth – fatum –"},{"annee":"2018","titre":"Bérénice"},{"annee":"2021","titre":"La Folle Idée"},{"annee":"2023","titre":"Ci-gisait Cyrano"},{"annee":"2024","titre":"Cléophène"},{"annee":"2027","titre":"Cassandre(s)"}],"directeur":{"titre":"Angelo Jossec, directeur artistique","chapeau":"Comédien, auteur et metteur en scène.","paragraphes":["Après une Licence 3 en Biologie Moléculaire à l’université de Rennes 2 et un DEUG en Arts du Spectacle à l’université de Caen, Angelo Jossec se forme pendant 3 ans à l’ACTEA - La cité Théâtre (CFA à Caen) puis en tant que comédien-compagnon au CDN de Rouen en 2010. A travers ces formations il rencontre notamment, Thomas Jolly, Serge Tranvouez, Brigitte Jacques-Wajeman, Elisabeth Maccoco et David Bobée.","En tant que comédien, il travaille avec Amélie Clément, Olivier Lopez, Bernard Rozet (<em>Portrait de groupe<\/em> d’après Molière et <em>Déjeunons sur l’herbe<\/em> d’après <em>L’Oeuvre<\/em> d’E. Zola en 2010, CDR Rouen), Annie Pican (<em>La Ronde<\/em> en 2011, cieThéâtre de la Rampe), Elisabeth Maccoco (<em>Le saut de la Tortue<\/em> en 2011, CDR Rouen), Catherine Delattres (<em>L’étourdi<\/em> de Molière en 2014, cie Catherine Delattre) et David Bobée (<em>Paris<\/em> d’après <em>Mélo<\/em> de Frédéric Ciriez en 2015, CDN Normandie Rouen). Il assiste par ailleurs Olivier Lopez à la mise en scène de <em>La Griffe<\/em> de H. Barker en 2010 ; Jérôme Hankins pour le projet <em>Everyman<\/em> en 2012 (CDR Rouen) et David Bobée sur <em>Paris<\/em> en 2015 (CDN de Rouen).","Suite au premier confinement il fonde avec Amélie Chalmey le festival 55. Celui-ci se déroule du 30 juin au 23 août 2020 et rassemble plus de 200 artistes du territoire normand.","En 2012, il crée la compagnie <em>Crescite<\/em> pour y mettre en scène ses spectacles dans lesquels il est également comédien."]}},"actions":{"titre":"Actions culturelles","blocs":["<h2>En lien avec les spectacles :<\/h2>","Sur la saison 2023-2024, ce sont plus de 260 heures d’éducation artistique qui vont être menées par les différents intervenants de la compagnie auprès des collèges, lycées et théâtres accueillants <em>Ci-gisait Cyrano<\/em>, <em>Bérénice<\/em>, <em>L’imaginaire forcé<\/em> ou <em>Mon Royaume pour un cheval<\/em>.","<h2>Autres interventions :<\/h2>","<ul><li><strong>de 2020 à 2022<\/strong>, Angelo Jossec et Lauren Toulin ont mené des ateliers autour de la nouvelle création <em>La Folle Idée<\/em> au Collège Francis Yard de Buchy, au Collège De Gaulle Anthonioz du Neubourg et au Lycée Pierre de Coubertin à Bolbec ;<\/li> <li><strong>en 2021-2022<\/strong>, la compagnie est intervenue auprès de 5 lycées normands autour des spectacles <em>Bérénice<\/em> et <em>La Folle Idée<\/em> dans le cadre du dispositif Regards de la Région Normandie ;<\/li> <li><strong>en 2022<\/strong>, Alice Lestienne mène des ateliers de sensibilisation autour de Molière au Collège d’Etrepagny;<\/li> <li><strong>en 2022, 2023 et 2024 <\/strong>, la compagnie est en résidence de création autour de <em>Ci-gisait Cyrano<\/em> et mènera des actions culturelles au collège Challemel Lacour d’Avranches et au Lycée Guillaume Le Conquérant de Lillebonne (en partenariat avec Juliobona) dans le cadre du jumelage – résidence d’artistes avec la DRAC Normandie.<\/li><\/ul>"],"credit":"©Lauren Toulin"},"ecole":{"texte":"Aussi, Les Crescite ont toujours porté une attention particulière aux publics jeunes, en intervenant directement dans les établissements scolaires afin de participer à « l’école du spectateur ». En effet, à l’exclusion des concerts ou one-man-shows, nous serons peut-être leur « unique » rencontre avec le spectacle vivant. De fait, notre mission est citoyenne, et si l’on soutient la formule vilardienne de « service public » de la culture, nous nous devons d’assumer notre part d’éducation populaire. Ainsi, les formes proposées aux scolaires sont les mêmes que celles proposées aux spectateurs adultes. A notre sens, il n’y a pas de théâtre dédié à la jeunesse ; il n’y a que des propositions tout public à partir d’un certain âge.","source":"drac"},"contact":{"titre":"Envoyez-nous un message","champs":["Nom","Adresse e-mail","Téléphone","Ville","Message"],"consentement":"J'accepte votre politique de confidentialité","calcul":"2 + 6 =","bouton":"envoyer"},"programmation":{"contact":{"nom":"Barbara Daussy","role":"Administratrice","email":"contact@crescite.fr","telephone":null}},"espacePro":{"titre":"Espace pro","texte":"Les espaces réservés de la compagnie.","portes":[{"cle":"equipe","titre":"Comédiens et techniciens","href":"equipe/","texte":"Votre tournée, vos horaires, vos feuilles de route et vos documents."},{"cle":"salles","titre":"Programmateurs et directeurs de salle","href":"pro/","texte":"Les captations et les documents que la compagnie vous a ouverts."},{"cle":"admin","titre":"Administration","href":"admin/","texte":"La gestion du site, des dates, de l’équipe et des feuilles de route."}]},"troupe":{"titre":"La troupe","defaut":"production","categories":[{"cle":"jeu","titre":"Le jeu","metiers":["Jeu"],"alias":["comédien","comédienne","acteur","actrice","interprète","chant","chanteur","chanteuse","danse","marionnette"]},{"cle":"mise-en-scene","titre":"La mise en scène","metiers":["Mise en scène","Direction artistique","Assistanat à la mise en scène","Collaboration artistique","Conseil artistique"],"alias":["metteur","metteuse","chorégraphie","regard extérieur","assistant","assistante","direction"]},{"cle":"ecriture","titre":"L’écriture","metiers":["Texte","Traduction"],"alias":["écriture","auteur","autrice","adaptation","dramaturgie","dramaturge","traducteur","traductrice"]},{"cle":"decors","titre":"Les décors, costumes et accessoires","metiers":["Scénographie","Construction des décors","Accessoires","Costumes","Maquillage"],"alias":["décor","scénographe","costumière","costumier","habillage","perruques","coiffure","construction","plasticien","plasticienne"]},{"cle":"lumiere-son","titre":"La lumière et le son","metiers":["Création lumières","Régie générale","Régie","Régie son","Création sonore et musicale"],"alias":["lumière","éclairagiste","son","sonore","musique","musicien","musicienne","vidéo","régisseur","régisseuse","technique","machiniste"]},{"cle":"production","titre":"La production","metiers":["Administration","Action culturelle"],"alias":["production","diffusion","communication","médiation","administrateur","administratrice","chargé","chargée","presse"]}]},"coordonnees":{"nom":"Compagnie Crescite","adresse":["72 boulevard d'Orléans","76100 Rouen"],"legal":["Siret 749 941 761 00035","APE 9001Z","Licence L-R-24-002837 - Catégorie 2"]},"ecrire":{"texte":"nous écrire","href":"#/contact"},"facebook":{"texte":"Facebook","href":null},"partenaires":"La compagnie Crescite est conventionnée la Ville de Rouen, et est régulièrement soutenue par la DRAC et la Région Normandie,<br/>le Département de Seine-Maritime et l'ODIA Normandie / Office de Diffusion et d'Information Artistique","liensLegaux":[{"texte":"Mentions légales","href":"#/mentions-legales"},{"texte":"Politique de confidentialité","href":"#/politique-de-confidentialite"}],"legal":{"mentions-legales":{"titre":"Mentions légales","blocs":["<h2>Présentation du site<\/h2>","<strong>Propriétaire<\/strong><br/>Théâtre des Crescite<br/>72 d d’Orléans 76100 ROUEN<br/>SIRET : 749 941 761 000 35 – APE : 9001Z<br/>Responsable de la publication : Barbara Daussy","<strong>Hébergeur<\/strong><br/>● WP serveur – SARL au capital de 10 000 €<br/>● Siège social : 134 Avenue du président W
