  }
  /* L'épine d'une tentacule : de `de` (tangente de départ dir0) jusqu'à `vers`, avec en bout, si `crosse`, une spirale qui
     se resserre autour de `vers`. courbe (-1 à 1) : le côté et l'ampleur du S. ctrl(E, tangente) : les points de contrôle. */
  function fil({ de, dir0 = null, vers, crosse = null, courbe = 1, raideur = .38, ctrl = null }) {
    const dx = vers[0] - de[0], dy = vers[1] - de[1], d0 = Math.hypot(dx, dy) || 1, ux = dx / d0, uy = dy / d0;
    let thE = Math.atan2(dy, dx), E = vers;
    if (crosse) { thE += -crosse.sens * .25; E = [vers[0] + crosse.sens * crosse.r0 * Math.sin(thE), vers[1] - crosse.sens * crosse.r0 * Math.cos(thE)]; }
    const dE = Math.hypot(E[0] - de[0], E[1] - de[1]) || 1, te = crosse ? [Math.cos(thE), Math.sin(thE)] : [ux, uy];
    let c1, c2;
    if (ctrl) [c1, c2] = ctrl(E, te);
    else {
      const t0 = dir0 || [ux * Math.cos(courbe * .6) - uy * Math.sin(courbe * .6), ux * Math.sin(courbe * .6) + uy * Math.cos(courbe * .6)];
      const nx = -uy, ny = ux, k = dE * raideur;
      c1 = [de[0] + t0[0] * k + nx * courbe * dE * .16, de[1] + t0[1] * k + ny * courbe * dE * .16];
      c2 = [E[0] - te[0] * k * .9 - nx * courbe * dE * .14, E[1] - te[1] * k * .9 - ny * courbe * dE * .14];
    }
    let p = regulier(bezier(de, c1, c2, E), 6);
    const nb = p.length - 1;
    if (crosse) p = p.concat(spirale(E, thE, crosse.sens, crosse.r0, crosse.r1, crosse.tours));
    return epine(p, nb);
  }
  function epine(p, nb) {
    const s = mesurer(p), n = p.length, nx = [], ny = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)], tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1;
      nx.push(-ty / m); ny.push(tx / m);
    }
    return { p, s, L: s[n - 1], nx, ny, nb, Lb: s[nb] };
  }
  // le point i de l'épine, avec l'ondulation qui parcourt la tentacule (sur la partie lisse seulement : la crosse reste en place)
  function pointI(sp, i, ond) {
    let x = sp.p[i][0], y = sp.p[i][1];
    if (ond && sp.Lb > 0 && i <= sp.nb) { const e = Math.sin(Math.PI * sp.s[i] / sp.Lb) * ond.A * Math.sin(ond.k * sp.s[i] - ond.ph); x += sp.nx[i] * e; y += sp.ny[i] * e; }
    return { x, y, nx: sp.nx[i], ny: sp.ny[i], s: sp.s[i] };
  }
  function pointA(sp, sv, ond) {
    let j = 0;
    const n = sp.p.length;
    while (j < n - 2 && sp.s[j + 1] < sv) j++;
    const u = clamp((sv - sp.s[j]) / ((sp.s[j + 1] - sp.s[j]) || 1)), a = pointI(sp, j, ond), b = pointI(sp, j + 1, ond);
    const nx = lerp(a.nx, b.nx, u), ny = lerp(a.ny, b.ny, u), m = Math.hypot(nx, ny) || 1;
    return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), nx: nx / m, ny: ny / m, s: sv };
  }
  // les points de s0 à s1 (abscisse curviligne), avec leur normale
  function fenetre(sp, s0, s1, ond) {
    s0 = clamp(s0, 0, sp.L); s1 = clamp(s1, 0, sp.L);
    const out = [pointA(sp, s0, ond)];
    for (let i = 0; i < sp.p.length; i++) if (sp.s[i] > s0 + .5 && sp.s[i] < s1 - .5) out.push(pointI(sp, i, ond));
    if (s1 - s0 > .5) out.push(pointA(sp, s1, ond));
    return out;

  // un contour fermé, lissé par les milieux des côtés (courbes de Bézier quadratiques)
  function lisseFerme(p) {
    const n = p.length, m = i => [(p[i][0] + p[(i + 1) % n][0]) / 2, (p[i][1] + p[(i + 1) % n][1]) / 2], a = m(n - 1);
    let d = `M${f1(a[0])} ${f1(a[1])}`;
    for (let i = 0; i < n; i++) { const b = m(i); d += `Q${f1(p[i][0])} ${f1(p[i][1])} ${f1(b[0])} ${f1(b[1])}`; }

    const l = P[P.length - 1];
    return d + `L${f1(l.x)} ${f1(l.y)}`;
  }
  // le corps effilé : un côté, le bout arrondi, l'autre côté
  function contour(P, larg) {
    if (P.length < 2) return '';
    const g = [], dr = [];
    for (const q of P) { const h = Math.max(.05, larg(q.s)) / 2; g.push([q.x + q.nx * h, q.y + q.ny * h]); dr.push([q.x - q.nx * h, q.y - q.ny * h]); }
    const b = P[P.length - 1], h = Math.max(.05, larg(b.s)) / 2, tx = b.ny, ty = -b.nx, cap = [];
    if (h > .35) for (const phi of [Math.PI / 6, Math.PI / 2, 5 * Math.PI / 6]) cap.push([b.x + b.nx * h * Math.cos(phi) + tx * h * Math.sin(phi), b.y + b.ny * h * Math.cos(phi) + ty * h * Math.sin(phi)]);
    return lisseFerme(g.concat(cap, dr.reverse()));
  }
  // des petits cercles : les ventouses, d'un seul tracé
  function cercles(c) { return c.map(([x, y, r]) => `M${f1(x - r)} ${f1(y)}a${f1(r)} ${f1(r)} 0 1 0 ${f1(2 * r)} 0a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2 * r)} 0`).join(''); }
  function ventousesDe(P, larg, cote, rangs) {
    const c = [];
    if (P.length < 2) return '';
    const sFin = P[P.length - 1].s;
    let j = 0;
    for (let s = P[0].s + 10, g = 0; s < sFin - 6 && g < 70; g++) {
      const w = larg(s);
      if (w < 6) break;
      while (j < P.length - 2 && P[j + 1].s < s) j++;
      const q = P[j];
      if (rangs === 1) c.push([q.x + q.nx * cote * w * .27, q.y + q.ny * cote * w * .27, w * .095]);
      else { c.push([q.x + q.nx * w * .24, q.y + q.ny * w * .24, w * .085]); c.push([q.x - q.nx * w * .24, q.y - q.ny * w * .24, w * .085]); }
      s += w * .95 + 4;
    }
    return cercles(c);
  }
  // des hachures de graveur, d'un seul côté
  function hachuresDe(P, larg, cote) {
    let d = '';
    if (P.length < 2) return d;
    const sFin = P[P.length - 1].s;
    let j = 0;
    for (let s = P[0].s + 5, g = 0; s < sFin - 3 && g < 160; g++, s += 7) {

<script>

     2. Ouvrir une saison : ses dates s'allument l'une après l'autre (cascade), les faisceaux de sa carte partent de Rouen.
     3. Filtrer, chercher : les dates gardées glissent à leur place (MOUVEMENT.flip), les lampes des communes sans date

  /* ---------- La carte des tournées : des faisceaux de lumière de Rouen vers chaque commune, les communes comme des lampes ---------- */
  const R = CARTE.rouen;
  const loin = xy => Math.hypot(xy[0] - R[0], xy[1] - R[1]) >= 6;
  let nSvg = 0, nBoite = 0, nettoyer = [];

  function carteSvg({ lieux = [], passe = [], poussiere = false, titre = '', teinte: teinteC = false, souvenir = false }) {
    // beaucoup de communes (tous les lieux de diffusion) : des faisceaux fins qui paraissent ensemble, sans halo flou ni pulsation
    const id = 'cl' + (++nSvg), anime = ANIMER && CARTE.mouvement() && lieux.length > 0, fin = lieux.length > 40;

    const pas = Math.min(.03, .3 / Math.max(1, lieux.length));
    const tempo = lieux.map((x, i) => {
      const L = loin(x.xy) ? CARTE.longueur(x.xy) + 2 : 0;
      return { L, d: +(.08 + i * pas).toFixed(2), t: +(L ? .25 + (L / e) / 2600 : .15).toFixed(2) };

    const etiquette = x => `${CARTE.nom(x)}${x.dates && x.dates.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    // le halo flou des faisceaux ne se trace pas (un flou qui bouge se repeint à chaque image) : il s'allume d'un coup quand les
    // faisceaux sont arrivés, avec les lampes
    const halos = fin ? '' : lieux.map((x, j) => tempo[j].L ? `<path class="cl-halo" data-l="${x.l}" d="${CARTE.trait(x.xy)}"/>` : '').join('');

    const lampes = lieux.map((x, j) => {
      const [cx, cy] = x.xy;
      if (fin) return `<g class="carte-lieu cl-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="cl-lampe" cx="${cx}" cy="${cy}" r="${k(2)}"/><circle cx="${cx}" cy="${cy}" r="${k(8)}" fill="transparent"/></g>`;
      return `<g class="carte-lieu cl-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}" style="${st(j)};--r:${((x.l * 37) % 23) / 10}s">
        <circle class="cl-aura" cx="${cx}" cy="${cy}" r="${k(13)}" fill="url(#${id}-a)"/>
        <circle class="cl-anneau" cx="${cx}" cy="${cy}" r="${k(6.5)}"/>

    }).join('');
    const pris = new Set([...lieux, ...passe].map(x => x.l));
    const pous = poussiere ? `<g class="cl-poussiere" aria-hidden="true">${CARTE.lieux.map((x, l) => pris.has(l) ? '' : `<circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${k(1.25)}"/>`).join('')}</g>` : '';
    const passes = passe.length ? `<g aria-hidden="true">${passe.filter(x => loin(x.xy)).map(x => `<path class="cl-passe" d="${CARTE.trait(x.xy)}"/>`).join('')}${passe.map(x => `<circle class="cl-passe-pt" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${k(1.6)}"/>`).join('')}</g>` : '';
    return `<svg class="cl${teinteC ? ' cl--teinte' : ''}${souvenir ? ' cl--souvenir' : ''}${fin ? ' cl--fin' : ''}${anime ? ' attend' : ''}" viewBox="${vb}" style="--e:${e.toFixed(3)}"${anime && halos ? ` data-fin="${finMs}"` : ''} role="group" aria-label="${esc(titre)}">
      <defs>

  function boiteCarte(o) {

  }
  const ligneLegende = d => d.ligneDate
    ? `<span class="cl-ll"><span>${esc(d.ligneDate)}</span><span class="cl-t">${esc(d.titre)}</span></span>`
    : `<span class="cl-ll"><span>${esc(d.ligne)}</span>${d.spectacle ? `<span class="cl-t">${esc(d.spectacle)}</span>` : ''}</span>`;

  // les lampes d'une carte écoutées une fois, par délégation (survol, focus, clic, clavier)
  function lierLampes(svg, { survol, choix }) {
    const lampe = e => { const c = e.target.closest && e.target.closest('.carte-lieu[data-l]'); return c && svg.contains(c) ? c : null; };

  function brancherCarte({ id, lieux = [], liste, defaut = null, choix: surChoix = null }) {

    if (!boite) return;
    const svg = $('svg', boite), leg = $('.cl-legende', boite);
    const ul = liste ? doc.getElementById(liste) : null;
    const parL = new Map(lieux.map(x => [x.l, x]));

    const montrer = l => {
      const vise = l ?? garde;
      const actif = vise ?? (parL.has(defaut) ? defaut : null);
      $$('[data-l]', svg).forEach(n => n.classList.toggle('on', actif !== null && +n.dataset.l === actif));
      svg.classList.toggle('choisi', vise != null);
      if (ul) {
        const lies = vise != null ? $$(`[data-l="${vise}"]`, ul) : [];
        ul.classList.toggle('choisi', lies.length > 0);
        $$('[data-l]', ul).forEach(n => n.classList.toggle('on', lies.includes(n)));

      survol: l => montrer(l),

  /* ---------- les frises (FRISE) : chaque calendrier allumé dans le noir, relu dans D à chaque rendu ---------- */
  let frises = [];
  // la largeur d'une frise posée dans .wrap (sa piste a 14 px de marge de chaque côté), calculée sans rien lire de la page
  const padPx = () => Math.min(64, Math.max(16, LF * .042));
  const largeurWrap = () => Math.min(LF, 86 * 16 + 2 * padPx()) - 2 * padPx() - 28;
  function frise(conteneur, o) {
    if (!FR || !conteneur) return null;
    const f = FR.creer(conteneur, Object.assign({ aujourdhui: D.aujourdhui, immediat: !ANIMER, largeur: largeurWrap(), moisMin: 76 }, o));
    frises.push(f);
    return f;
  }
  // la clé d'un repère, posée aussi sur sa ligne (data-frise-id) : l'id de la base, sinon la date et le lieu
  const cleBase = d => d && d.id != null && d.id !== '' ? `d${d.id}` : null;
  const cleProchaine = d => cleBase(d) || `p|${d.slug || d.titre}|${d.iso}|${d.l}`;
  const cleLigne = (d, saison, i) => cleBase(d) || `l|${saison}|${i}`;
  const annulee = d => /annul/i.test(d.etat || '');

  const repereProchaine = (d, couleur) => ({ id: cleProchaine(d), jour: d.iso, fin: d.fin, couleur: couleur || lumiereDe(d.slug), titre: d.titre,

  const repereLigne = (d, saison, i, slug, titre, couleur) => { const k = d.iso || cleDate(d, saison);
    return k ? { id: cleLigne(d, saison, i), jour: k, fin: d.fin || k, couleur: couleur || lumiereDe(slug), titre,

  // une saison en bande de frise ; son nom court, sous la bande, vient de ses années (« 16-17 »)
  const bandeSaison = (k, n) => ({ id: k, debut: `${k.slice(0, 4)}-09-01`, fin: `${k.slice(5)}-08-31`, titre: D.saisons[k].titre, n, etiquette: `${k.slice(2, 4)}-${k.slice(7, 9)}` });
  const saisonsConnues = () => Object.keys(D.saisons || {}).filter(k => /^\d{4}-\d{4}$/.test(k) && k <= D.saison).sort();
  const nDates = (k, slug) => (D.saisons[k].spectacles || []).filter(g => !slug || g.slug === slug).reduce((a, g) => a + (g.dates || []).length, 0);
  function diffusion(s) {
    const ks = saisonsConnues(), premiere = ks.find(k => nDates(k, s.slug));
    return premiere ? ks.filter(k => k >= premiere).map(k => bandeSaison(k, nDates(k, s.slug))) : [];
  }
  const diffusionHtml = s => diffusion(s).length ? `<div class="diffusion"><p class="etiq">${esc(LIB.lieuxDiffusion)}</p><div data-diffusion="${esc(s.slug)}"></div></div>` : '';
  // les frises de diffusion d'un spectacle : créées quand leur fiche arrive près de l'écran ; d'emblée quand la vue est refaite
  let ioDiffusion = null;
  function frisesDiffusion(racine) {
    const creer = c => { const s = PAR_SLUG[c.dataset.diffusion], bs = s ? diffusion(s) : [];
      if (bs.length && c.isConnected && !c.querySelector('.frise')) frise(c, { echelle: 'annees', debut: bs[0].id, fin: bs[bs.length - 1].id, bandes: bs, libelle: `${s.titre} – ${LIB.lieuxDiffusion}`, classe: 'frise-diffusion', anMin: 26, largeur: undefined, choix: () => {} }); };
    const cs = $$('[data-diffusion]', racine);
    if (ioDiffusion) { ioDiffusion.disconnect(); ioDiffusion = null; }

    cs.forEach(c => ioDiffusion.observe(c));
  }
  // un clic sur un repère mène à sa ligne, que la lumière balaie
  function allerLigne(id) {
    const li = id ? $(`[data-frise-id="${CSS.escape(id)}"]`, main) : null; if (!li) return;
    li.scrollIntoView({ behavior: doux() ? 'smooth' : 'auto', block: 'center' });

  }
  // la carte d'une boîte (ses lampes .carte-lieu[data-l]) : la frise et elle s'allument ensemble
  const svgDe = id => { const b = id && doc.getElementById(id); return b ? $('svg.cl', b) : null; };

  /* ---------- ce qui est sous le pli : la page arrive par son premier écran ; le reste à la tâche qui suit sa première image ---------- */
  // pendant le rendu d'une vue après un geste, differer(f) pose une place vide (<template>) et garde f ; apres(g) attend que ces
  // places soient remplies (une par image) ; quand la vue est refaite en place, tout est rendu d'emblée
  let suites = null, attentes = null, tours = 0;
  const differer = f => { if (!suites) return f(); suites.push(f); return `<template data-suite="${suites.length - 1}"></template>`; };
  const apres = g => { if (attentes) attentes.push(g); else g(); };
  const par = (l, n) => { const o = []; for (let i = 0; i < l.length; i += n) o.push(l.slice(i, i + n)); return o; };
  function completer(tour, reste, g) {
    if (tour !== tours) return;
    const t = $('template[data-suite]', main);
    if (t) {
      const f = reste[+t.dataset.suite], parent = t.parentElement;

      suites = reste;

      t.remove();

      if ($('template[data-suite]', main)) { requestAnimationFrame(() => setTimeout(() => completer(tour, reste, g), 0)); return; }
    }

  }
  // les titres montent du noir, les affiches et les fiches s'allument l'une après l'autre ; posé avant toute lecture de mise en page
  function decorer(enPlace) {
    $$('.bloc-titre, .chap-t, .sai-t', main).forEach(e => { if (!e.closest('[data-mv]') && !e.closest('summary') && !e.closest('.scene')) e.setAttribute('data-mv', 'monte'); });

  }

  /* ---------- la salle : le noir se fait sur la scène, puis la lumière remonte d'un point ---------- */
  let salleEl = null, salleAnims = [];
  const finirSalle = () => { salleAnims.forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } }); salleAnims = []; if (salleEl) salleEl.hidden = true; };
  function salle() {
    if (!salleEl) { doc.body.insertAdjacentHTML('beforeend', '<div class="salle" aria-hidden="true" hidden><i class="salle-noir"></i><i class="salle-spot"></i></div>'); salleEl = doc.body.lastElementChild; }
    return salleEl;
  }
  // le noir : 80 ms, la scène s'éteint (l'en-tête reste éclairé)
  function noir() {
    finirSalle();
    if (!doux() || !doc.body.animate) return false;
    const el = salle(); el.hidden = false;
    salleAnims = [el.firstElementChild.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 80, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' })];

  // de la page, le geste est fini en moins de 450 ms)
  function lumiere(x, y) {

    salleAnims.forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } });

      n.animate([{ opacity: 1 }, { opacity: 1, offset: .1 }, { opacity: 0 }], { duration: 290, easing: courbe, fill: 'forwards' }),

    salleAnims[1].onfinish = finirSalle;
  }

  /* ---------- Les lignes de date, telles quelles ---------- */
  const MOIS = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}/gi;
  const moisDe = d => ((d.ligneDate || '').match(MOIS) || [d.ligneDate || '']).pop();

  // titre : le titre du spectacle (dans sa police) mène à sa page, dans l'entrée où l'on lit ; tag : « Scolaire »
  function uneDate(d, { titre = true, hn = 3, entree = null, tag = false } = {}) {
    const s = PAR_SLUG[d.slug];
    const st = titre ? (s ? styleMini(s) : `--c:${LUM}`) : '';

  /* ---------- La scène : la photo plein écran, le halo qui suit la main ---------- */
  function visuel(src, focale, credit, double, edPhoto) {
    const img = on => `<img class="ph${on ? ' on' : ''}"${on ? ` src="${src}"` : ''} alt="" style="object-position:${focale}% 35%" decoding="async"${on && edPhoto ? ` data-edit-photo="${esc(edPhoto)}"` : ''}>`;

  }
  // la poursuite : un disque de lumière déplacé par transform (rien n'est repeint), qui rattrape la main avec un peu de retard
  // elle ne prend la main qu'une fois la salle éclairée (600 ms après l'arrivée) : pendant que la page se pose, rien ne la bouge
  function halo(sc) {
    const spot = $('.spot', sc), pret = performance.now() + 600;
    let x = 50, y = 40, tx = 50, ty = 40, raf = 0, W = LF, H = innerHeight;
    const poser = () => { spot.style.transform = `translate(${(x / 100 * W).toFixed(1)}px,${(y / 100 * H).toFixed(1)}px)`; };
    const repos = () => { x = tx = +(sc.dataset.focale || 50); y = ty = 38; poser(); };

  }

  /* ---------- Accueil : le bandeau d'origine, une photo à la fois, chaque titre dans la police de son spectacle ---------- */
  let actif = 0, pauseVoulue = false;
  const ICO_PAUSE = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="2.6" height="10"/><rect x="7.4" y="1" width="2.6" height="10"/></svg>';

  const diapos = () => (S.diaporama || []).filter(x => D.photos[x.slug]);
  const prochainePublique = slug => D.dates.find(d => d.slug === slug && !d.scolaire) || null;
  function texteScene(x) {

    return `<p class="scene-sur">${esc(x.surtitre)}</p>

  function sceneAccueil(slides) {

    return `<section class="scene scene--accueil" id="scene" aria-label="${esc(x.surtitre)}" data-focale="${s ? s.focale ?? 50 : 50}" style="${esc(styleDiapo(x))}">

        <div class="titres" role="tablist" data-tt="clic" aria-label="${esc(LIB.spectacles)}">

  function brancherCarrousel(sc, slides) {
    const onglets = $$('.titre', sc), panneau = $('#scene-panneau', sc), calques = $$('.ph', sc);
    const rangee = $('.titres', sc), btnPause = $('#pause', sc), credit = $('.credit', sc);
    const lumiere = halo(sc);

      setTimeout(() => { occupe = false; if (attente !== null) { const a = attente; attente = null; file(a); } }, reduit.matches ? 0 : 640);
    };

      t.addEventListener('click', () => choisir(i));
      t.addEventListener('focus', () => choisir(i));

      t.addEventListener('pointerleave', () => clearTimeout(survolT));
      t.addEventListener('keydown', e => {

    sc.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { pauses.survol = false; etat(); } });
    sc.addEventListener('focusin', () => { pauses.focus = true; etat(); });
    sc.addEventListener('focusout', e => { if (!sc.contains(e.relatedTarget)) { pauses.focus = false; etat(); } });

      pauseVoulue = pauses.user = !pauses.user;

    if (io) io.observe(sc);
    const visible = () => { pauses.page = doc.hidden; etat(); };
    const finIntro = () => { pauses.intro = false; etat(); };
    doc.addEventListener('visibilitychange', visible);
    addEventListener('intro:fin', finIntro);
    reduit.addEventListener('change', etat);
    etat();
    versOnglet(actif);
    nettoyer.push(() => { arret = true; etat(); if (io) io.disconnect(); doc.removeEventListener('visibilitychange', visible); removeEventListener('intro:fin', finIntro); reduit.removeEventListener('change', etat); clearTimeout(survolT); });
  }
  // les trois portes : chacune s'éclaire de la couleur de son entrée, sur une photo de la compagnie
  function portes() {
    const pub = D.dates.find(d => !d.scolaire);
    const nb = s => parseInt(String((s.programmer || {}).representations || '').replace(/\D+/g, ' ').trim().split(' ')[0], 10) || 0;
    const tournee = D.shows.slice().sort((a, b) => nb(b) - nb(a))[0];
    const ecole = D.photos['actions-culturelles'] ? 'actions-culturelles' : null;
    // voir : le public autour de l'arène ; programmer : le spectacle le plus joué ; établissement : un atelier
    const prem = (...cles) => cles.find(k => k && D.photos[k]) || null;
    const img = { voir: prem('berenice/av-2', pub && photoCarte(PAR_SLUG[pub.slug])), programmer: prem(tournee && tournee.slug), etablissement: ecole };
    return (S.entrees || []).map(e => `<li><a class="porte" href="${esc(e.href)}" style="--e:${esc(e.couleurVive || e.couleur)}">${img[e.cle] ? `<img class="porte-ph" src="${photo(img[e.cle])}" alt="" loading="lazy" decoding="async">` : ''}<span class="lampe" aria-hidden="true"></span><span class="porte-t">${esc(e.texte)}</span>${FL}</a></li>`).join('');
  }
  // la photo d'une carte : la première photo de scène de la galerie ; en création, l'image principale
  const photoCarte = s => { if (!s) return null; const g = !s.statut && (s.photos || []).find(p => !p.etablissement && !p.atelier && D.photos[p.cle]); return g ? g.cle : (D.photos[s.slug] ? s.slug : null); };
  // une affiche : le spectacle dans son univers (fond, couleurs, police de titre, motif)
  function affiche(s, { lien = null, accroche = false } = {}) {

        <span class="affiche-sur"><span${ed(`shows.${slug}.creation`)}>${esc(s.creation)}</span>${s.statut ? `<span${ed(`shows.${slug}.statut`)}>${esc(s.statut)}</span>` : ''}</span>

  function accueil() {

  /* ---------- Je viens voir un spectacle : la saison tout public, sa carte, les spectacles en tournée ---------- */
  /* ---------- L'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const NOMS_MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const MOIS_ALT = NOMS_MOIS_FR.join('|');
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();
  /* ---------- l'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const MOIS_NOMS = MOIS_ALT.split('|');
  const MOIS_TOK = `${MOIS_ALT}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)
  const RE_JOUR = new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS_TOK})\\.?(?:\\s+(\\d{4}))?`, 'gi');
  const RE_MOIS_AN = new RegExp(`(${MOIS_TOK})\\.?\\s+(\\d{4})`, 'i');
  const RE_LIGNE = new RegExp(`^(.*?)\\s*((?:${MOIS_TOK})\\.?\\s+\\d{4})([\\s\\S]*)$`, 'i');
  const p2 = n => String(n).padStart(2, '0');
  // la date de fin d'une ligne, « 2020-03-04 » : iso/fin quand la base les a, sinon lue dans la ligne (le dernier jour cité)
  function cleDate(d, saison) {
    const fin = d.fin || d.iso; if (fin) return fin;
    const tete = String(d.ligne || '').split(/—|\s:\s/)[0], a0 = +saison.slice(0, 4), mois = x => { const t = x.toLowerCase(); return MOIS_NOMS.findIndex(n => n.startsWith(t) || t.startsWith(n.slice(0, 4))) + 1; };
    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];
    if (dern) { const mm = mois(dern[2]); return `${dern[3] ? +dern[3] : mm >= 9 ? a0 : a0 + 1}-${p2(mm)}-${p2(+dern[1])}`; }
    const ma = tete.match(RE_MOIS_AN);
    return ma ? `${ma[2]}-${p2(mois(ma[1]))}-31` : null;
  }
  // « 24 janvier 2020 à 20h — Théâtre en Seine, Duclair (76) » → { jour: « 24 », heure: « à 20h », lieu: « Théâtre en Seine, Duclair (76) » }
  function decoupeLigne(ligne) {
    const t = String(ligne || ''), m = t.match(RE_LIGNE);
    if (!m) return { jour: '', mois: '', heure: '', lieu: t.trim() };
    const reste = m[3], k = reste.indexOf('—'), c = reste.search(/\s:\s/);
    const [h, l] = k >= 0 ? [reste.slice(0, k), reste.slice(k + 1)] : c >= 0 ? [reste.slice(0, c), reste.slice(c + 3)] : ['', reste];
    const net = x => x.replace(/^[\s:,–-]+|[\s:]+$/g, '');
    return { jour: m[1] || m[2], mois: m[2], heure: net(h), lieu: net(l) };
  }
  const titreMois = m => m ? `${MOIS_NOMS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '';
  // toutes les saisons passées : [{k, titre, rows: [{d, g, k, i, suite, cle, txt}], titres, lieux}], la plus récente d'abord
  function agendaPasse() {
    const out = [];
    S.saisons.forEach(x => {
      const SA = D.saisons[x.saison]; if (!SA || x.saison > D.saison) return;
      const rows = []; let i = 0;
      (SA.spectacles || []).forEach(g => {
        let prev = null;
        (g.dates || []).forEach(d => {
          let k = cleDate(d, x.saison); const suite = !k; if (suite) k = prev; else prev = k;
          const sp = g.slug && PAR_SLUG[g.slug], titre = sp ? sp.titre : g.titre, n = i++;
          rows.push({ d, g, k: k || '', i: n, fid: cleLigne(d, x.saison, n), suite, titre, cle: g.slug || `titre:${g.titre}`,
            txt: norm(`${titre} ${d.ligne} ${(d.details || []).map(y => y.texte).join(' ')} ${d.l != null && CARTE.lieux[d.l] ? CARTE.nom(CARTE.lieux[d.l]) : ''}`) });
        });
      });
      const passees = (x.saison === D.saison ? rows.filter(r => r.k && r.k < D.aujourdhui) : rows).sort((a, b) => a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i);
      if (!passees.length) return;
      out.push({ k: x.saison, titre: SA.titre, rows: passees, titres: [...new Set(passees.map(r => r.titre))], lieux: CARTE.saison(x.saison) });
    });

  function brancherRep() {

    const voir = i => calques.forEach(c => c.classList.toggle('on', +c.dataset.i === i));

  /* ---------- La page d'un spectacle : sa lumière éclaire le noir ; trois onglets, un par entrée ---------- */
  const credits = (s, phs) => {

  const photosDe = (s, garde) => (s.photos || []).map((p, i) => ({ ...p, i })).filter(p => D.photos[p.cle] && garde(p));
  function cartons(s, phs, seul) {
    return `<div class="cartons">${phs.map(p => `<figure class="carton${seul ? ' carton--seul' : ''}"><img src="${D.photos[p.cle]}" alt="${esc(p.legende || s.titre)}" loading="lazy" decoding="async" data-edit-photo="shows.${esc(s.slug)}.photos.${p.i}">${p.legende ? `<figcaption${ed(`shows.${s.slug}.photos.${p.i}.legende`)}>${esc(p.legende)}</figcaption>` : ''}</figure>`).join('')}</div>${credits(s, phs)}`;

  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;

  const portrait = ({ e, p, lignes }, credits) => {
    const nom = nomDe(p), k = `personnes.${e.personne}`;
    return `<figure class="cast-pt"><span class="cast-cadre" data-edit-photo="${esc(k)}.photo"><span class="cast-mono" aria-hidden="true"><b>${esc(initiales(p))}</b></span>${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(nom)}" width="320" height="400" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span>
      <figcaption>${credits ? `<small class="cast-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="cast-nom"><span${ed(`${k}.prenom`)}>${esc(p.prenom)}</span> <span${ed(`${k}.nom`)}>${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="cast-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="cast-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';

    L.forEach((x, i) => {

      if (j < 0) blocs.push(`<li>${portrait(x, credits)}</li>`);

    return `<ul class="cast" style="--n:${L.length}${pris.size > blocs.length ? ';--pw:8.25rem' : ''}">${blocs.join('')}</ul>`;   // avec des paires : de quoi en tenir trois sur une ligne
  }
  function distribution(s, sansDuree, avecPortraits) {

  // la carte et les dates tout public ; sans date à venir, les tournées passées ; en création, l'annonce
  function chapitreDates(s, pub) {
