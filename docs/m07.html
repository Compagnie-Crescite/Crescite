 des dommages indirects (tels par exemple qu’une perte de marché ou perte d’une chance) consécutifs à l’utilisation du site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>.","Des espaces interactifs (possibilité de poser des questions dans l’espace contact) sont à la disposition des utilisateurs. <strong>Théâtre des Crescite<\/strong> se réserve le droit de supprimer, sans mise en demeure préalable, tout contenu déposé dans cet espace qui contreviendrait à la législation applicable en France, en particulier aux dispositions relatives à la protection des données. Le cas échéant, <strong>Théâtre des Crescite<\/strong> se réserve également la possibilité de mettre en cause la responsabilité civile et/ou pénale de l’utilisateur, notamment en cas de message à caractère raciste, injurieux, diffamant, ou pornographique, quel que soit le support utilisé (texte, photographie…).","<h2>Gestion des données personnelles<\/h2>","A l’occasion de l’utilisation du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>, peuvent êtres recueillies : l’URL des liens par l’intermédiaire desquels l’utilisateur a accédé au site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>, le fournisseur d’accès de l’utilisateur, l’adresse de protocole Internet (IP) de l’utilisateur.","En tout état de cause <strong>Théâtre des Crescite<\/strong> ne collecte des informations personnelles relatives à l’utilisateur que pour le besoin de certains services proposés par le site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>. L’utilisateur fournit ces informations en toute connaissance de cause, notamment lorsqu’il procède par lui-même à leur saisie. Il est alors précisé à l’utilisateur du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> l’obligation ou non de fournir ces informations.","Tout utilisateur dispose d’un droit d’accès, de rectification et d’opposition aux données personnelles le concernant, en effectuant sa demande écrite et signée, accompagnée d’une copie du titre d’identité avec signature du titulaire de la pièce, en précisant l’adresse à laquelle la réponse doit être envoyée.","Aucune information personnelle de l’utilisateur du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> n’est publiée à l’insu de l’utilisateur, échangée, transférée, cédée ou vendue sur un support quelconque à des tiers. Seule l’hypothèse du rachat de <strong>Théâtre des Crescite<\/strong> et de ses droits permettrait la transmission des dites informations à l’éventuel acquéreur qui serait à son tour tenu de la même obligation de conservation et de modification des données vis à vis de l’utilisateur du site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>.","<h2>Liens hypertextes et cookies<\/h2>","Le site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> contient un certain nombre de liens hypertextes vers d’autres sites, mis en place avec l’autorisation de <strong>Théâtre des Crescite<\/strong>. Cependant, <strong>Théâtre des Crescite<\/strong> n’a pas la possibilité de vérifier le contenu des sites ainsi visités, et n’assumera en conséquence aucune responsabilité de ce fait.","La navigation sur le site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a> est susceptible de provoquer l’installation de cookie(s) sur l’ordinateur de l’utilisateur. Un cookie est un fichier de petite taille, qui ne permet pas l’identification de l’utilisateur, mais qui enregistre des informations relatives à la navigation d’un ordinateur sur un site. Les données ainsi obtenues visent à faciliter la navigation ultérieure sur le site, et ont également vocation à permettre diverses mesures de fréquentation.","Le refus d’installation d’un cookie peut entraîner l’impossibilité d’accéder à certains services. L’utilisateur peut toutefois configurer son ordinateur de la manière suivante, pour refuser l’installation des cookies :","Sous Firefox : en haut de la fenêtre du navigateur, cliquez sur le bouton Firefox, puis aller dans l’onglet Options. Cliquer sur l’onglet Vie privée.<br/>Paramétrez les Règles de conservation sur : utiliser les paramètres personnalisés pour l’historique. Enfin décochez-la pour désactiver les cookies.","Sous Safari : Cliquez en haut à droite du navigateur sur le pictogramme de menu (symbolisé par un rouage). Sélectionnez Paramètres. Cliquez sur Afficher les paramètres avancés. Dans la section “Confidentialité”, cliquez sur Paramètres de contenu. Dans la section “Cookies”, vous pouvez bloquer les cookies.","Sous Chrome : Cliquez en haut à droite du navigateur sur le pictogramme de menu (symbolisé par trois lignes horizontales). Sélectionnez Paramètres. Cliquez sur Afficher les paramètres avancés. Dans la section “Confidentialité”, cliquez sur préférences. Dans l’onglet “Confidentialité”, vous pouvez bloquer les cookies.","<h2>Droit applicable et attribution de juridiction<\/h2>","Tout litige en relation avec l’utilisation du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> est soumis au droit français."]},"politique-de-confidentialite":{"titre":"Politique de confidentialité","blocs":["Nous savons que vous êtes attentifs à l’utilisation et au partage de vos informations personnelles et vous remercions de votre confiance pour les traiter scrupuleusement, avec précaution, et à bon escient. <strong>En visitant le site <a href=\"https://crescite.fr/\">crescite.fr<\/a>, vous acceptez que Théâtre des Crescite collecte, traite et utilise les informations personnelles visées comme indiqué ci-après<\/strong>.","<strong>&gt; Responsable du traitement et Informations de contact<\/strong><br/><strong>&gt; Utilisation des données personnelles collectées<\/strong><br/><strong>&gt; Qu’en est-il des cookies et de leurs dates d’expiration ?<\/strong><br/><strong>&gt; Partage de vos données personnelles<\/strong><br/><strong>&gt; Protection de vos données personnelles<\/strong><br/><strong>&gt; Durées de stockage de vos données<\/strong><br/><strong>&gt; Les droits que vous avez sur vos données<\/strong>","<h2>Responsable du traitement et Informations de contact<\/h2>","L’adresse de notre site Web est : <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>.<br/>Tout traitement des informations personnelles communiquées à <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> est effectué sous la responsabilité de la Compagnie Théâtre des Crescite située au 72, boulevard d’Orléans 76100 ROUEN.<br/>Vous pouvez nous contacter à cette adresse postale ou par e-mail à <a href=\"mailto:contact@crescite.fr?Subject=Un%20visiteur%20du%20site%20Crescite.fr%20vous%20adresse%20un%20message\">contact@crescite.fr<\/a>.","<h2>Utilisation des données personnelles collectées<\/h2>","<strong>Vous trouverez ci-après les types d’information collectés :<\/strong>","<h3>1 – Informations que vous nous fournissez pour utiliser notre site/nos services<\/h3>","<strong>Nous demandons et collectons les informations personnelles suivantes à votre sujet lorsque vous souhaitez utiliser notre site et/ou nos services via notre site Web ou par d’autres biais.<\/strong><br/>Vous nous fournissez des informations quand vous effectuez une recherche, naviguez sur le site, vous prenez part à un jeu concours ou à un questionnaire ou communiquez avec notre Service Client.<br/>C’est par exemple le cas lorsque vous recherchez un produit, quand vous complétez «Votre compte» (vous pouvez d’ailleurs disposer de plusieurs comptes si vous vous êtes inscrit en donnant différentes adresses e-mail) ou la rubrique «Votre profil», quand vous nous contactez par téléphone, par e-mail, ou par tout autre moyen, complétez un questionnaire ou un bulletin de participation à un concours, utilisez nos services, participez à des forums de discussion ou autres modes de communication en commun, quand vous rédigez et postez des commentaires en ligne.<br/>Ces informations peuvent être votre nom, adresse et numéro de téléphone, le contenu des commentaires et des e-mails que vous nous avez adressés, votre description personnelle dans la rubrique «Votre profil».","<strong>Vous pouvez choisir de ne pas nous communiquer certaines informations, cette décision risque néanmoins de vous priver de nombreux services et fonctionnalités que nous vous proposons. Nous utilisons les informations que vous nous communiquez, notamment afin de répondre à vos demandes, de personnaliser vos futurs achats, d’améliorer nos boutiques et de communiquer avec vous.<\/strong>","<h3>2 – Informations collectées automatiquement<\/h3>","<strong>À chaque fois que vous entrez en contact avec nous, nous recevons et enregistrons certains types d’informations. Comme de nombreux autres sites Internet, nous utilisons notamment des “cookies” et obtenons certains types d’informations lorsque votre navigateur accède au site <a href=\"https://crescite.fr/\">crescite.fr<\/a> ou à des publicités et autres contenus affichés sur d’autres sites Internet par <a href=\"https://crescite.fr/\">crescite.fr<\/a> ou pour son compte.<\/strong>","Quelques exemples d’informations que nous collectons et analysons :<br/>l’adresse IP qui relie votre ordinateur à Internet, les confirmations de réception et de lecture d’e-mails, les données de connexion, les adresses e-mail, votre mot de passe, les informations sur votre ordinateur et sur votre connexion Internet (par exemple : le type et la version de votre navigateur, votre système d’exploitation et votre plate-forme, les catégories et versions de plug-ins de votre navigateur), le réglage des fuseaux horaires, le cheminement URL complet vers, via et depuis notre site Internet, y compris les date et heure, les numéros de “cookies”, les produits que vous avez consultés ou recherchés, les numéros de téléphone que vous avez utilisés pour appeler notre Service Client.<br/>Nous utilisons aussi les informations relatives à votre navigateur, tels que les cookies, les Flash cookies (aussi connus sous le nom de Flash Local Shared Objects) ou d’autres informations similaires sur certaines parties de nos sites Internet afin de prévenir la fraude et à d’autres fins. Au cours de certaines visites, nous pouvons être amenés à utiliser des outils logiciels tels que JavaScript pour mesurer et collecter des informations sur la session, notamment les temps de réponse d’une page, les erreurs de téléchargement, la durée de visites sur certaines pages, les informations concernant les interactions sur une page (« scrolling » (défilement sur une page), clics, mouvements de souris) et les méthodes utilisées pour naviguer à partir d’une page. Nous pouvons aussi collecter des informations techniques qui nous aident à identifier votre appareil à des fins de prévention de la fraude et de diagnostic.","<h3>3 – Appareils portables<\/h3>","La plupart des appareils portables donnent la possibilité aux utilisateurs de désactiver les services de localisation. La plupart du temps, cette fonction est située dans le menu « réglages » de l’appareil. Si vous avez des questions relatives à la désactivation des services de localisation de votre appareil, nous vous recommandons de contacter votre opérateur de téléphonie mobile ou le fabricant de votre appareil.","<h3>4 – Informations recueillies pour les commentaires<\/h3>","Quand vous laissez un commentaire sur notre site web, les données inscrites dans le formulaire de commentaire, mais aussi votre adresse IP et l’agent utilisateur de votre navigateur sont collectés pour nous aider à la détection des commentaires indésirables à l’aide d’un service automatisé de détection .","<h3>5 – Opérations de marketing automatisé et/ou de profilage réalisées à l’aide des données personnelles<\/h3>","Nous sommes susceptibles d’utiliser et de compiler vos données à des fins de profilage. Le profilage correspond au traitement automatisé de vos données personnelles. Ces données sont utilisées pour évaluer, analyser et prédire vos préférences, vos intérêts et votre comportement. Nous utilisons ces données pour vous fournir des informations personnalisées sur les offres susceptibles de vous intéresser. Nous ne divulguerons pas les profils établis sur la base de vos données à des tiers autres que notre compagnie.","<ul><li>Nous sommes susceptibles d’utiliser et de compiler vos données pour vous envoyer des newsletters promotionnelles, de la publicité et d’autres informations susceptibles de vous intéresser, et de la publicité sur les médias sociaux par le biais de plates-formes (telles que Twitter).<\/li> <li>Afin de personnaliser, mesurer et améliorer notre publicité.<\/li><\/ul>","Vous pouvez choisir de ne pas recevoir de communication marketing de notre part en suivant les instructions de désabonnement incluses dans nos communications marketing ou en modifiant vos paramètres de notification dans votre compte ou en envoyant un e-mail à <a href=\"mailto:contact@crescite.fr?Subject=Un%20visiteur%20du%20site%20Crescite.fr%20vous%20adresse%20un%20message\">contact@crescite.fr<\/a>.","<h3>6 – Statistiques et mesures d’audience<\/h3>","Nous utilisons des données anonymes pour générer des statistiques et des analyses concernant l’audience du site.","<h2>Qu’en est-il des cookies et de leurs dates d’expiration ?<\/h2>","Si vous déposez un commentaire sur notre site, il vous sera proposé d’enregistrer votre nom, adresse de messagerie et site web dans des cookies. C’est uniquement pour votre confort afin de ne pas avoir à saisir ces informations si vous déposez un autre commentaire plus tard. Ces cookies expirent au bout d’un an.","Si vous avez un compte et que vous vous connectez sur ce site, un cookie temporaire sera créé afin de déterminer si votre navigateur accepte les cookies. Il ne contient pas de données personnelles et sera supprimé automatiquement à la fermeture de votre navigateur.","Lorsque vous vous connecterez, nous mettrons en place un certain nombre de cookies pour enregistrer vos informations de connexion et vos préférences d’écran. La durée de vie d’un cookie de connexion est de deux jours, celle d’un cookie d’option d’écran est d’un an. Si vous cochez « Se souvenir de moi », votre cookie de connexion sera conservé pendant deux semaines. Si vous vous déconnectez de votre compte, le cookie de connexion sera effacé.","En modifiant ou en publiant un article, un cookie supplémentaire sera enregistré dans votre navigateur. Ce cookie ne comprend aucune donnée personnelle. Il indique simplement l’identifiant de l’article que vous venez de modifier. Il expire au bout d’un jour.","<h2>Partage de vos données personnelles<\/h2>","<h3>Prestataires de services tiers<\/h3>","Nous avons recours à d’autres sociétés ou personnes indépendantes lesquelles fournissent certains services pour notre compte. En voici quelques exemples : l’envoi du courrier postal ou électronique, la suppression d’information redondante de nos listes utilisateurs/clients, la gestion de nos fichiers utilisateurs/clients, l’analyse de nos bases de données, la fourniture d’une assistance marketing, la fourniture de résultats de recherche et de liens (y compris des liens et listings payants), les données nécessaires à la comptabilité et la fourniture du service client. Ces prestataires ont accès aux informations personnelles nécessaires à l’exécution de leurs prestations mais ne sont pas autorisés à les utiliser à d’autres fins. De plus, ils sont tenus de traiter ces informations personnelles en application des lois applicables à la protection des données personnelles.<br/>Les commentaires des visiteurs peuvent être vérifiés à l’aide d’un service automatisé de détection des commentaires indésirables.<br/>Certains de nos outils utilisent Google Analytics et Google Adwords. L’utilisation de Google Analytics et Google Adwords est soumise aux règles de confidentialité de Google, aux conditions générales AdWords et aux conditions générales de Google Analytics.","<h3>Service Gravatar<\/h3>","Une chaîne anonymisée créée à partir de votre adresse de messagerie (également appelée hash) peut être envoyée au service Gravatar pour vérifier si vous utilisez ce dernier. Les clauses de confidentialité du service Gravatar sont disponibles ici : <a href=\"https://automattic.com/privacy/\">https://automattic.com/privacy/<\/a>. Après validation de votre commentaire, votre photo de profil sera visible publiquement à côté de votre commentaire.","<h3>Contenu embarqué depuis d’autres sites<\/h3>","Les articles de ce site peuvent inclure des contenus intégrés (par exemple des vidéos, images, articles…). Le contenu intégré depuis d’autres sites se comporte de la même manière que si le visiteur se rendait sur cet autre site.","Ces sites web pourraient collecter des données sur vous, utiliser des cookies, embarquer des outils de suivis tiers, suivre vos interactions avec ces contenus embarqués si vous disposez d’un compte connecté sur leur site web.","<h3>Transfert d’activités<\/h3>","Dans le cadre du développement de nos activités, nous pouvons être amenés à vendre ou acquérir des segments d’activité. À l’occasion de telles transactions, les informations relatives aux clients et aux utilisateurs font généralement partie des actifs transférés mais demeurent sujettes à toute politique de confidentialité pré-existante (sauf, bien entendu, accord contraire de l’utilisateur). Par ailleurs, dans le cas, peu probable, où Théâtre des Crescite ou une part substantielle de ses actifs seraient acquises, les informations relatives aux clients et utilisateurs seraient bien entendu également transmises à l’acquéreur comme faisant partie des actifs transférés.","<h3>Protection de <a href=\"https://crescite.fr/\">crescite.fr<\/a> et des tiers<\/h3>","Nous divulguons le contenu des comptes utilisateurs et autres informations personnelles lorsque nous y sommes légalement obligés, ou pour protéger les droits, la propriété ou la sécurité de <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>, ceux des utilisateurs des sites appartenant à Théâtre des Crescite ou d’autres personnes.","<h3>Avec votre accord<\/h3>","Dans tous les autres cas, vous serez averti si vos informations venaient à être transmises à un tiers et vous aurez la possibilité de ne pas donner votre accord à une telle transmission.","<h2>Protection de vos données personnelles<\/h2>","<h3>Mesures de sécurité<\/h3>","Nous maintenons des mesures de sécurité physiques, électroniques et des procédures de sauvegarde en rapport avec la collecte, la conservation et la communication d’informations personnelles de nos clients. Nos procédures de sécurité peuvent nous amener à vous demander une preuve de votre identité avant de pouvoir vous communiquer vos informations personnelles.<br/>Théâtre des Crescite utilise la technologie de cryptage SSL qui vous offre une sécurité maximale.<br/>ll est important de vous protéger contre l’accès non autorisé à votre mot de passe et à votre ordinateur. Si vous partagez un ordinateur, vous devez vous déconnecter après chaque utilisation.","<h3>Médias<\/h3>","Si vous êtes un utilisateur ou une utilisatrice enregistré·e et que vous téléversez des images sur le site web, nous vous conseillons d’éviter de téléverser des images contenant des données EXIF de coordonnées GPS. Les visiteurs de notre site web peuvent télécharger et extraire des données de localisation depuis ces images.","<h3>Procédure en cas de fuite de données<\/h3>","Notre première préoccupation est d’éviter la fuite de données en maintenant un bon niveau de sécurité de notre site grâce à une veille constante, la mise à jour régulière de notre site et un serveur de qualité.<br/>Dans le cas d’une fuite de données, nous mettrions tout en œuvre pour en limiter l’impact autant que possible. Si le risque de fuite de données présentait un risque élevé d’atteinte à la confidentialité des données nous en informerions les personnes concernées.","En cas de violation ou suspicion de violation de données à caractères personnels, Théâtre des Crescite et ses sous-traitants notifieront la CNIL, 72h au plus tard, après en avoir pris connaissance.","<h2>Durées de stockage de vos données<\/h2>","Pour les utilisateurs et utilisatrices qui s’enregistrent sur notre site (si cela est possible), nous stockons également les données personnelles indiquées dans leur profil. Tous les utilisateurs et utilisatrices peuvent voir, modifier ou supprimer leurs informations personnelles à tout moment (à l’exception de leur nom d’utilisateur·rice). Les gestionnaires du site peuvent aussi voir et modifier ces informations.","Conformément aux dispositions en vigueur vous disposez d’un droit d’accès, de modification, de rectification et de suppression des informations vous concernant. Si vous mettez une information à jour, nous conservons généralement une copie de vos informations initiales dans nos dossiers.","<h2>Les droits que vous avez sur vos données<\/h2>","<h3>Rectification d’informations inexactes ou incomplètes<\/h3>","Vous pouvez accéder et mettre à jour certaines de vos informations par le biais des paramètres de votre compte.","<h3>Objection et suppression des données<\/h3>","Si vous avez un compte ou si vous avez laissé des commentaires sur le site, vous pouvez demander à recevoir un fichier contenant toutes les données personnelles que nous possédons à votre sujet, incluant celles que vous nous avez fournies. Vous pouvez également demander la suppression des données personnelles vous concernant. Cela ne prend pas en compte les données stockées à des fins administratives, légales ou pour des raisons de sécurité.","Vos données ne seront plus visibles sur le site mais peuvent cependant toujours être présentes dans des dossiers archivés tels que sauvegardes de site, boîte mail, base de données des extensions wordpress qui n’ont pas encore implémenté de mesures. Si nous n’avons pas les moyens techniques aujourd’hui de les faire disparaitre de ces dossiers, nous prendrons cependant en compte votre demande très sérieusement et nous nous engageons à ne plus les utiliser si vous demandez un droit à l’oubli.","L’utilisateur qui laisse un commentaire doit se connecter pour être en mesure d’accéder aux mêmes possibilités.","<h3>Procédure pour exporter ou supprimer vos données<\/h3>","Vous pouvez nous envoyer une demande par e-mail à <a href=\"mailto:contact@crescite.fr?Subject=Un%20visiteur%20du%20site%20Crescite.fr%20vous%20adresse%20un%20message\">contact@crescite.fr<\/a> précisant :","<ul><li>Votre nom d’utilisateur ou votre adresse mail de connexion.<\/li> <li>L’action que vous souhaitez effectuer :<br/>– exporter vos données<br/>– supprimer vos données<br/>Vous recevrez un mail provenant de <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> avec un lien à suivre pour garantir que vous êtes bien le demandeur de l’action. Si vous ne le voyez pas dans votre boîte de réception dans les 72h suivant votre demande, veuillez vérifier dans votre boîte de courriers indésirables.<\/li><\/ul>"]}},"libelles":{"enTournee":"EN TOURNÉE","decouvrir":"découvrir","actuellementEnTournee":"Actuellement en tournée","menu":"Menu","rechercher":"Rechercher …","spectacles":"Spectacles","saison":"Saison","saisonsPrecedentes":"Saisons précédentes","toutPublic":"Tout public","scolaire":"Scolaire","enEtablissement":"En établissement scolaire","lieu":{"etablissement":"Dans l’établissement","salle":"En salle"},"actionCulturelle":"Action culturelle","aCompleter":"À compléter par la compagnie","dispositifs":"Dispositifs","public":"Public","ateliers":"Ateliers","duree":"Durée","jauge":"Jauge","format":"Format","distribution":"Distribution","representations":"Représentations","lieuxDiffusion":"Lieux de diffusion","ficheTechnique":"Fiche technique","conditionsAccueil":"Conditions d’accueil","bandeAnnonce":"Bande-annonce","ecrire":"Écrire à la compagnie","leSpectacle":"Le spectacle","lesSpectacles":"Les spectacles","ouverture":"Ouverture","dat t de Seine-Maritime."],"credit":"© Arnaud Bertereau","medias":[{"type":"video","url":"https://player.vimeo.com/video/1181866854","titre":"Bande-annonce ''Cléophène''","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/cleophene/"},{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","titreLignes":["Ci-gisait Cyrano"],"creation":"création 2023","annee":2023,"fiche":[{"libelle":null,"valeur":"d’après « Cyrano » d’Edmond Rostand"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Création accessoires et maquillage :","valeur":"Emmanuelle Hérondelle"},{"libelle":"Régisseur général :","valeur":"Thomas Janeczko"},{"libelle":"Régisseur :","valeur":"Adrián Noguera"}],"texte":["Si Molière est l’auteur dramatique français le plus monté au monde, <em>Cyrano de Bergerac<\/em> est la pièce la plus représentée depuis sa création.<br/>Chacun a développé avec elle un rapport particulier, mélange de réminiscences scolaires ou adolescentes, d’émois théâtraux ou cinématographiques, d’une certaine forme d’identification dont on ne peut guère se défendre…<br/>C’est ainsi : à part Roxane… Tout le monde aime Cyrano. Personne ne se risquera à critiquer ouvertement la pièce… personne ne se risque non plus à l’encenser sans réserve. Cyrano, notre péché mignon… notre plaisir coupable…<br/>Pourtant, si nous sommes nombreux à en avoir vu diverses adaptations scéniques, s’il est vrai que le film de Jean-Paul Rappeneau est encore largement diffusé, qu’une adaptation américaine s’est risquée sur nos écrans, que la pièce a intégré les programmes scolaires…ne nous y trompons pas : ils sont encore nombreux ceux qui n’en connaissent que des bribes, quelques expressions ou tournures de phrases tombées dans le bagage culturel élémentaire.<br/>Transmettre <em>Cyrano<\/em>, aujourd’hui ou demain, n’est jamais chose inutile. C’est permettre à une œuvre poétique de 1897 de passer de générations en générations, emmenant avec elle un jeu avec la langue et le vers, une certaine idée du grand siècle et plus largement de la grandeur, un goût pour le théâtre et sa mise en abîme… grâce à des vecteurs attachants et consensuels : la beauté, la jubilation et la tendresse.<br/>Que l’on se rassure : il y aura une démarche dramaturgique, une réflexion scénographique, des choix esthétiques… et l’on justifiera tout avec esprit. Mais il faut bien le confesser : je monte <em>Cyrano de Bergerac<\/em> parce que cela me fait plaisir. Et que le plaisir est communicatif.<br/>Je m’y engage : pas un spectateur ne piquera du nez… pas un élève n’aura le nez en l’air !"],"enTournee":true,"prochaine":{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"12 novembre 2026 — Eu (76)","ligneDate":"12 novembre 2026","ligneLieu":"Eu (76)","details":[{"texte":"2 représentations au Collège Louis Philippe","lien":null}],"lien":null,"iso":"2026-11-12","fin":"2026-11-12","precision":"day","scolaire":true,"commune":"Eu","dep":"76","xy":[344.2,130.9],"l":5},"nbDates":21,"couleur":"#8fb3ff","couleurTexteClair":"#5c73a6","fondSombre":"#0a1124","palette":{"fond":"#0a1124","fond2":"#111b37","texte":"#eef2ff","texte2":"#b3bedf","accent":"#f2c14e","accent2":"#d04a52","scene":"#8fb3ff","lueur":"rgba(143,179,255,0.28)"},"clair":false,"motif":"nez","focale":50,"univers":{"nom":"La tirade du nez","source":"prototype","clair":false,"motif":"nez","couleurs":{"fond":"#0a1124","fond2":"#111b37","texte":"#eef2ff","texte2":"#b3bedf","accent":"#f2c14e","accent2":"#d04a52","scene":"#8fb3ff","lueur":"rgba(143,179,255,0.28)"},"polices":{"titre":"Bodoni Moda","titreGraisse":700,"texte":"Source Serif 4","etiquette":"Inter"}},"lieuTemps":null,"accroche":"C’est ainsi : à part Roxane… Tout le monde aime Cyrano.","affirmations":[{"texte":"Je m’y engage : pas un spectateur ne piquera du nez… pas un élève n’aura le nez en l e-du-cred76/culture/theatre/ci-gisait-cyrano/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 1h10","production":["<strong>Production :<\/strong> Crescite","Coproduction : Juliobona – Lillebonne, Théâtre les 3 Chênes – Laval Agglomération, Ville de Grand-Quevilly<br/>avec le soutien de la DRAC Normandie pour l’EAC, la Région Normandie, le Département de Seine Maritime, la Ville de Rouen, l’Etincelle Théâtre(s) de la Ville de Rouen et l’Odia Normandie – agence régionale au service du développement du spectacle vivant"],"credit":"© Arnaud Bertereau","medias":[{"type":"video","url":"https://player.vimeo.com/video/1081831996","titre":"Bande-annonce Ci-gisait Cyrano","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/ci-gisait-cyrano/"},{"slug":"la-folle-idee","titre":"La Folle Idée","titreLignes":["La Folle Idée"],"creation":"création 2021","annee":2021,"fiche":[{"libelle":"Texte :","valeur":"Angelo Jossec et Corinne Meyniel"},{"libelle":"Mise en scène :","valeur":"Angelo Jossec"},{"libelle":"Assistanat mise en scène :","valeur":"Amélie Chalmey"},{"libelle":"Création lumières et régie générale :","valeur":"Jérôme Hardouin"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Régie son :","valeur":"Renaud Aubin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"},{"libelle":"Création accessoires :","valeur":"Emmanuelle Hérondelle"},{"libelle":"Construction décors :","valeur":"Olivier Leroy"}],"texte":["Un huis-clos en salle des professeurs.","En France, la grève des enseignants s’est généralisée depuis l’annonce d’une énième réforme du collège.","Pour le noyau dur du piquet de grève du collège René Haby, le silence du ministère n’est plus supportable. Pour eux, c’est la confirmation qu’ils ne sont que les outils subalternes d’une idéologie, qu’ils ne cautionnent pas. Qu’ils ne cautionneront plus. Alors l’idée leur vient…","Puisque la contestation pacifique n’a aucun effet, il ne reste qu’une solution : l’insurrection. Le chef d’établissement et quelques professeurs, décident alors d’organiser une prise d’otage au sein du collège afin de faire entendre leurs revendications avec force et éclat.","Mais la folle idée dégénère : alors qu’ils étaient soudés dans la contestation, ils ne parviennent à se mettre d’accord sur rien. Et cette journée d’émulation se conclut de façon macabre.","<em>La Folle Idée<\/em> fait entendre la parole d’individus au point de non-retour. Des professionnels qui, ayant la volonté d’être constructifs, tentent le difficile exercice de s’écouter et de se mettre d’accord. Mais exaspérés par la sensation de ne jamais être entendus, ils glissent peu à peu dans la violence ordinaire. Celle qui bout ça et là. Celle qui monte un peu partout."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ffd447","couleurTexteClair":"#7f6922","fondSombre":"#10201a","palette":{"fond":"#10201a","fond2":"#172a20","texte":"#eef5ee","texte2":"#b6cab9","accent":"#ffd447","accent2":"#ff6b3d","scene":"#ffd447","lueur":"rgba(255,212,71,0.22)"},"clair":false,"motif":"horloge","focale":50,"univers":{"nom":"L’horloge","source":"prototype","clair":false,"motif":"horloge","couleurs":{"fond":"#10201a","fond2":"#172a20","texte":"#eef5ee","texte2":"#b6cab9","accent":"#ffd447","accent2":"#ff6b3d","scene":"#ffd447","lueur":"rgba(255,212,71,0.22)"},"polices":{"titre":"Anton","titreGraisse":400,"texte":"Inter","etiquette":"Inter"}},"lieuTemps":null,"accroche":"Un huis-clos en salle des professeurs.","affirmations":[{"texte":"La Folle Idée fait entendre la parole d’individus au point de non-retour.","source":"site"}],"citations":[],"video":{"titre":"Bande-annonce \"La Folle Idée\" - création 2021","url":"https://player.vimeo.com/video/544583862","source":"site"},"photo":"la-folle-idee.webp","photos":[{"id":"g-1","legende":null,"source":"site","cle":"la-folle-idee/g-1","fichier":"la-folle-idee/g-1.we ":null},{"personne":"jerome-hardouin","categorie":"creation","fonction":"Création lumières","role":null,"alternance":null},{"personne":"jane-avezou","categorie":"creation","fonction":"Création costumes","role":null,"alternance":null}],"statut":null,"sousTitre":"de Racine","avec":{"libelle":"avec :","valeur":"Angelo Jossec, Manon Rivier, Lauren Toulin, et Adrien Vada."},"mentions":["spectacle disponible dans les offres collectives du Pass Culture"],"duree":"durée : 1h25","production":["<strong>Production :<\/strong> Crescite","<strong>Coproduction :<\/strong> l’Archipel de Granville.","Avec le soutien de la DRAC et de la Région Normandie, de la Ville de Rouen et du Département de Seine-Maritime.","Avec l’aide de la DRAC Normandie dans le cadre du plan de relance 2021/mesure 5 du plan théâtre 2021."],"credit":"© Olivier Héron / Alban Van Wassenhove / Thomas Cartron","medias":[],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/berenice/"},{"slug":"macbeth-fatum","titre":"Macbeth – Fatum","titreLignes":["Macbeth","Fatum"],"creation":"création 2016","annee":2016,"fiche":[{"libelle":null,"valeur":"d’après Shakespeare"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Assistante :","valeur":"Lauren Toulin"},{"libelle":"Traduction :","valeur":"Alexis Magenham"},{"libelle":"Conseillère artistique, doublure et accessoiriste :","valeur":"Lisa Peyron"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"}],"texte":["Macbeth et Lady Macbeth, couple sans enfant, n’ont d’autre dieu que leur intérêt commun : lui voulant devenir monarque absolu et elle, alimentant ce désir de pouvoir. Le couple est prêt à tout pour triompher. Au-delà du versant politique de cette histoire, c’est la question de l’humanité qui ont intéressé le jeune metteur en scène et comédien Angelo Jossec et sa compagnie. Comment l’homme peut-il se résoudre à tant de cruauté et d’horreurs ?","Le Théâtre des Crescite revendique le souhait de pratiquer un « théâtre pauvre » au sens noble du terme. Un théâtre sans fioritures qui s’en tient à l’essentiel et met l’acteur eu centre de la scène, comme pilier le plus important de l’édifice. Pour ce nouveau spectacle, le défi est de raconter <em>Macbeth<\/em> en 1h40, avec cinq comédiens pour jouer plus de trente personnages ! Comme dans ses précédentes créations, la compagnie crée tous les effets à vue pour mettre le spectateur dans la confidence. Il s’agit de rendre compte des artifices et de ce qui fait « théâtre ». Avec ingéniosité, folie et pour tout décor quelques tables, chaises et draps, les acteurs passent d’un rôle à l’autre, oscillant entre tragédie et comédie, bouffonnerie et romance, pour donner à voir la richesse et l’étendue des registres et des genres propres à l’écriture de Shakespeare."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ff3b3f","couleurTexteClair":"#d73134","fondSombre":"#0b0808","palette":{"fond":"#0b0808","fond2":"#171010","texte":"#efe6da","texte2":"#bdae9b","accent":"#e0262d","accent2":"#7d8471","scene":"#ff3b3f","lueur":"rgba(224,38,45,0.25)"},"clair":false,"motif":"fil","focale":50,"univers":{"nom":"Le fil rouge","source":"prototype","clair":false,"motif":"fil","couleurs":{"fond":"#0b0808","fond2":"#171010","texte":"#efe6da","texte2":"#bdae9b","accent":"#e0262d","accent2":"#7d8471","scene":"#ff3b3f","lueur":"rgba(224,38,45,0.25)"},"polices":{"titre":"Grenze Gotisch","titreGraisse":600,"texte":"Source Serif 4","etiquette":"Inter"}},"lieuTemps":null,"accroche":"Comment l’homme peut-il se résoudre à tant de cruauté et d’horreurs ?","affirmations":[{"texte":"Le Théâtre des Crescite revendique le souhait de pratiquer un « théâtre pauvre » au sens noble du terme.","source":"site"}],"citations":[],"video":{"titre":"Bande-annonce ''Macbeth - Fatum'' - création 2016","url":"https://player.vimeo.com/vid lès-Rouen, Festival le Curieux Printemps à Rouen, Festival Saint-Valéry-sur-Somme, Festival de Flers, Festival de Saint-Romain de Colbosc, + collèges et lycées normands."},"dossier":null,"equipe":[{"personne":"alice-lestienne","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"charles-levasseur","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"louisa-travers","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"angelo-jossec","categorie":"creation","fonction":"Mise en scène et adaptation","role":null,"alternance":null},{"personne":"alexis-magenham","categorie":"creation","fonction":"Traduction","role":null,"alternance":null},{"personne":"eric-guilbaud","categorie":"creation","fonction":"Création lumières","role":null,"alternance":null},{"personne":"william-langlois","categorie":"creation","fonction":"Création sonore","role":null,"alternance":null},{"personne":"lisa-peyron","categorie":"creation","fonction":"Création accessoires","role":null,"alternance":null},{"personne":"manon-rivier","categorie":"creation","fonction":"Création accessoires","role":null,"alternance":null},{"personne":"thomas-janeczko","categorie":"technique","fonction":"Régisseur général","role":null,"alternance":null}],"statut":null,"sousTitre":"d’après Shakespeare","avec":{"libelle":"avec :","valeur":"Alice Lestienne, Charles Levasseur et Louisa Travers"},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/nos-actions/education-college/guide-du-cred76/immersion-linguistique/mon-royaume-pour-un-cheval-romeo-and-juliet-dapres-shakespeare/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 1h10","production":["<strong>Production :<\/strong> Crescite","Le spectacle a été créé avec le soutien de la Ville de Rouen et du GEIQ-Théâtre en Haute-Normandie en 2013.<br/>Avec le soutien de l’ODIA Normandie – Agence au service du développement du spectacle vivant, pour l’aide à la reprise en 2026."],"credit":"© Thomas Cartron","medias":[{"type":"video","url":"https://player.vimeo.com/video/273701402","titre":"Bande-annonce \"Mon Royaume pour un cheval - Romeo and Juliet\" Avignon 2018","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/mon-royaume-pour-un-cheval-romeo-and-juliet/"},{"slug":"imaginaire-force","titre":"L’imaginaire forcé","titreLignes":["L’imaginaire forcé"],"creation":"création 2012","annee":2012,"fiche":[{"libelle":"Texte :","valeur":"d’après « Le Mariage forcé » de Molière"},{"libelle":"Mise en scène :","valeur":"Angelo Jossec"}],"texte":["L’idée est de partager, de transmettre l’univers et la vitalité du théâtre que faisait Molière. Il s’agit moins d’un spectacle que d’un prétexte pour discuter Molière, sa langue et le théâtre du 17<sup>e<\/sup> siècle.","Le spectateur pourra expérimenter cette langue au travers de cette intervention puis d’un atelier de pratique théâtrale. Il s’agit donc d’une forme hybride où la pièce, l’histoire choisie, vaut tout autant que la découverte de l’homme qu’était Molière, le théâtre de son époque, ses conditions de travail, une vue d’ensemble sur les thématiques chères à Molière et une explication des intrigues aux vue de l’époque à laquelle elles se font. Prenons pour exemple le mariage, qui est au centre de la plupart, pour ne pas dire toutes, des intrigues de Molière.","Comment se sentir concerné par ces histoires si nous ne savons pas qu’à l’époque le mariage ne se fait que par intérêt et qu’une loi stipule que celui-ci est considéré comme nul si le père n’y consent pas… Il ne s’agit que d’un exemple, mais il montre l’enjeu de ce projet : une forme sans cesse interrompue par de brèves recontextualisations historiques et sociales. Ces recontextualisations sont moins là pour inscrire l’intervention dans une perspective historique que pour donner les clefs d’une langue vieille de plusieurs siècles.","Nous avons choisi <em>Le Mariage Forcé<\/em>, pièce de 1664. Une pièce courte mais contenant toute la virtuosité de Molière, tant dans l’écriture que dans les thèmes abordés. La brièveté de cette pièce laisse la place à de nombreux lazzi (« aux à côté »), c’est à dire aux arrêts de jeu, aux parenthèses sur Molière, sa vie, son œuvre, son époque."],"enTournee":true,"prochaine":{"slug":"imaginaire-force","titre":"L’imaginaire forcé","ligne":"8 avril 2027 — Rouen (76)","ligneDate":"8 avril 2027","ligneLieu":"Rouen (76)","details":[{"texte":"2 représentations au Collège Sainte-Marie","lien":null}],"lien":null,"iso":"2027-04-08","fin":"2027-04-08","precision":"day","scolaire":true,"commune":"Rouen","dep":"76","xy":[327.1,174.8],"l":24},"nbDates":1,"couleur":"#d4823c","couleurTexteClair":"#a4642e","fondSombre":"#160f0a","palette":{"fond":"#160f0a","fond2":"#241811","texte":"#f6ead8","texte2":"#b79b7d","accent":"#d4823c","accent2":"#e39a58","scene":"#d4823c","lueur":"rgba(212,130,60,0.30)"},"clair":false,"motif":"annotations","focale":50,"univers":{"nom":"Les annotations","source":"adrienvada","clair":false,"motif":"annotations","couleurs":{"fond":"#160f0a","fond2":"#241811","texte":"#f6ead8","texte2":"#b79b7d","accent":"#d4823c","accent2":"#e39a58","scene":"#d4823c","lueur":"rgba(212,130,60,0.30)"},"polices":{"titre":"IM Fell French Canon","titreGraisse":400,"texte":"Source Serif 4","etiquette":"Inter"}},"lieuTemps":null,"accroche":"Quand la censure académique leur impose Le Mariage forcé à la place du Malade imaginaire, des comédiens font déraper la lecture jusqu’à transformer la classe en un chantier théâtral et musical jubilatoire.","affirmations":[{"texte":"Il s’agit moins d’un spectacle que d’un prétexte pour discuter Molière, sa langue et le théâtre du 17e siècle.","source":"site"}],"citations":[],"video":{"titre":"Teaser - l'Imaginaire Forcé","url":"https://www.youtube.com/embed/URov8sJFUew","source":"site"},"photo":"imaginaire-force.webp","photos":[{"id":"g-2","legende":null,"source":"site","cle":"imaginaire-force/g-2","fichier":"imaginaire-force/g-2.webp"},{"id":"g-3","legende":null,"source":"site","cle":"imaginaire-force/g-3","fichier":"imaginaire-force/g-3.webp"},{"id":"g-5","legende":null,"source":"site","cle":"imaginaire-force/g-5","fichier":"imaginaire-force/g-5.webp"}],"creditPhotos":"© Lauren Toulin","creditDossier":null,"actionCulturelle":{"type":"Forme hybride","public":null,"lieu":"etablissement","textes":[{"texte":"Le spectateur pourra expérimenter cette langue au travers de cette intervention puis d’un atelier de pratique théâtrale. Il s’agit donc d’une forme hybride où la pièce, l’histoire choisie, vaut tout autant que la découverte de l’homme qu’était Molière, le théâtre de son époque, ses conditions de travail, une vue d’ensemble sur les thématiques chères à Molière et une explication des intrigues aux vue de l’époque à laquelle elles se font. Prenons pour exemple le mariage, qui est au centre de la plupart, pour ne pas dire toutes, des intrigues de Molière.","source":"site"}],"dispositifs":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/mon-quotidien/colleges/guide-du-cred76/limaginaire-force/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"]},"programmer":{"format":null,"duree":"durée : 55 minutes","representations":"492 représentations au 31 juillet 2026","lieux":"L'Athanor à Guérande, centre culturel de Sarzeau, Espace Culturel de Méricourt, Festival Curieux Printemps à Rouen, centre culturel d'Amfreville La Mivoie, + collèges normands.","actualite":"re-création automne 2026 pour Avignon 2027"},"dossier":null,"equipe":[{"personne":"angelo-jossec","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"manon-rivier","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"adrien-vada","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"angelo-jossec","categorie":"creation","fonction":"Mise en scène","role":null,"alternance":null}],"statut":null,"sousTitre":"d’après Molière","avec":{"libelle":"avec :","valeur":"Angelo Jossec, Manon Rivier et Adrien Vada."},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/mon-quotidien/colleges/guide-du-cred76/limaginaire-force/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 55 minutes","production":["<strong>Production :<\/strong> Crescite"],"credit":"© Lauren Toulin","medias":[{"type":"video","url":"https://www.youtube.com/embed/URov8sJFUew","titre":"Teaser - l'Imaginaire Forcé","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/l-imaginaire-force/"}],"dossiers":{"berenice":{"source":"Dossier scolaire Bérénice 2026, Compagnie Crescite","titre":"BÉRÉNICE","auteur":"de Jean Racine","creation":"CRÉATION 2018","type":"DOSSIER SCOLAIRE","duree":"DURÉE 1 H 25","format":"SPECTACLE IN SITU","public":"À PARTIR DE LA SECONDE","cession":{"formule":["6 classes : 2 représentations","6 ateliers de 1h (1/cl)"]},"fiche":[["Mise en scène et adaptation :","Angelo Jossec"],["Musique live et régie :","William Langlois"],["Création lumières :","Jérôme Hardouin"],["Création costumes :","Jane Avezou"],["Distribution :","Angelo Jossec, Manon Rivier, Lauren Toulin et Adrien Vada"]],"production":["Production : Compagnie Crescite","Coproduction : l’Archipel - Granville","Avec les aides à la création 2018 de la DRAC et de la Région Normandie et du Département de Seine-Maritime, et en 2021 de la DRAC Normandie dans le cadre du plan de relance / mesure 5 du plan théâtre"],"partenaires":"Le Théâtre des Crescite est conventionné par la Ville de Rouen et est soutenu par la DRAC et la Région Normandie, le Département de Seine-Maritime et l'ODIA Normandie","pourquoi":{"titre":"Pourquoi étudier Bérénice au lycée ?","sections":[{"titre":"Une poésie à hauteur de jeunes adultes : l’amour face au devoir","texte":"Étudier Bérénice dès la seconde, c'est explorer un triangle amoureux où la passion se heurte au devoir, à la morale et aux lois de la cité. Jean Racine y élève la douleur d’une séparation au rang de la <strong>tragédie<\/strong> et crée <strong>l’un des plus beaux poèmes sur les tensions de la relation amoureuse de la littérature française<\/strong>. Ces tensions deviennent directement sensibles, et peuvent offrir aux élèves des mots et de la nuance pour appréhender leurs propres passions et vivre leurs sentiments face aux pressions sociales, morales ou culturelles."},{"titre":"Faire vivre l'alexandrin","texte":"Loin d'être une langue figée, l'alexandrin racinien est pour la compagnie un idiome de théâtre fluide et <strong>profondément vivant<\/strong>. Présenté au centre d'une arène circulaire au plus près des spectateurs, plongés dans une ambiance sonore et musicale, l<strong>e dispositif est immersif et brise la distance des salles traditionnelles<\/strong>. Porté par l’expérience du vers des comédiens et l’accompagnement musical live, l'alexandrin retrouve toute son oralité et devient <strong>une expérience émotionnelle directe<\/strong> pour les élèves."},{"titre":"Transmettre un héritage vivant, une priorité pour la compagnie","texte":"Dans l'esprit du service public cher à Jean Vilar, transmettre les grands classiques s'inscrit dans une démarche citoyenne de démocratisation culturelle. <strong>En offrant un travail exigeant tout en créant un spectacle volontairement accessible<\/strong>, le Théâtre des Crescite cherche à dépasser les a priori sur le théâtre et à transmettre ce patrimoine universel sans imposer de pensée unique."}]},"programmes":{"titre":"La place du spectacle dans les programmes scolaires","niveaux":[{"niveau":"2nde","lignes":[{"matiere":"Français","intitule":"Le théâtre du XVIIᵉ siècle au XXIᵉ siècle, texte et représentation","objectif":"Étudier la tragédie classique, l'alexandrin et la mise en scène"},{"matiere":"Histoire","intitule":"la Méditerranée antique : empreintes romaines","objectif":"Replacer l'intrigue dans la Rome antique de l'an 79, interroger la mise en scène du pouvoir et sa représentation au XVIIᵉ siècle"},{"matiere":"EMC","intitule":"Droit, liberté et responsablité","objectif":"Interroger le choix des personnages qui sacrifient leur passion personnelle au profit du droit de la communauté"},{"matiere":"LCA","intitule":"Différences de cultures, différences de conditions : Grecs, Romains et barbares ; hommes libres et esclaves.","objectif":"Analyser le statut politique des souverains et des étrangers de l'empire romain."}]},{"niveau":"1ère","lignes":[{"matiere":"Français","intitule":"Le théâtre du XVIIe siècle au XXIe siècle","objectif":"Approfondir l'analyse d'un chef-d'œuvre du répertoire classique et de sa poésie tragique."},{"matiere":"HLP","intitule":"les pouvoirs de la parole, les métamorphoses du moi","objectif":"Étudier la rhétorique passionnelle et l'épreuve des sentiments face aux obstacles extérieures (sociaux, moraux, religieux)."}]},{"niveau":"Tale","lignes":[{"matiere":"Philosophie","intitule":"le devoir et la morale, la liberté et la passion, l'État et la politique, l'art","objectif":"Mettre en perspective les dilemmes éthiques, le sacrifice civique et la fonction cathartique de l'art."},{"matiere":"HLP","intitule":"la recherche de soi, l'humanité en question","objectif":"L'expérience de la solitude décisionnelle, la transmission des textes classiques pour aborder ce qu'il y a d'universel dans la condition humaine."}]}]},"synopsis":{"titre":"Synopsis","chapeau":"Rome, an 79. Huit jours après la mort soudaine de l'empereur Vespasien, le destin de Bérénice, Titus et Antiochus bascule.","paragraphes":["Titus et Antiochus sont compagnons de guerre et amis. Tous deux aiment Bérénice mais Bérénice n’aime que Titus. Il s’agit d’un triangle amoureux classique pris dans les enjeux politiques de la cité romaine : Titus est le fils de l’empereur de Rome, Vespasien, Bérénice est reine de Palestine, et Antiochus, leur ami, est roi de Comagène...","Jusqu'ici, les amants fermaient les yeux sur le couperet qui les menaçait : la loi romaine interdit formellement à un empereur d'épouser une reine étrangère. Il s’agit de deux systèmes politiques distincts. À la mort soudaine de l'empereur Vespasien, l'illusion vole en éclats. Titus doit affronter son devoir et se résoudre à répudier Bérénice, qui refuse d'abord d'y croire. De son côté, Antiochus oscille entre loyauté et secret espoir.","En une seule demi-journée, l’action se précipite vers le destin de nos trois personnages : au lieu de succomber au désespoir, ils sacrifieront leur bonheur individuel au bien commun, élevant leur renoncement tragique en “exemple à l'univers”."]},"adaptation":{"titre":"Une adaptation resserrée","paragraphes":["Pour maintenir une tension dramatique constante et placer l'émotion au cœur de la représentation, la compagnie a fait le choix d’adapter le texte de 1506 alexandrins dans une version resserrée et dynamisée.","En élaguant les tirades explicatives et les récits de faits passés, <strong>le travail de réécriture conserve le cœur battant de la pièce avec une grande fidélité<\/strong> : les dilemmes personnels, les confrontations directes, le choc des vérités, et l'intensité des échanges passionnés.","Les trois confidents originaux sont par exemple fusionnés en un seul personnage. Celui-ci crée un contact direct avec le public et l’accompagne dans la fiction. Entre autres, il lui rappelle en début de spectacle les éléments essentiels de la situation initiale.","<strong>D'une durée de 1 h 25, le spectacle ne perd rien de l'intrigue originelle ni de sa clarté narrative.<\/strong> Au contraire. Ce rythme resserré insuffle à la tragédie une urgence moderne où chaque seconde compte et où le spectateur se concentre sur les enjeux de chaque personnage."]},"espace":{"titre":"Un espace scénique immersif","paragraphes":["La scène est une arène. Un espace <strong>circulaire de 5 mètres de diamètre<\/strong> fermé par les spectateurs.","Les seuls éléments de décor sont un polygone, trônant au centre, surmonté d’un revolver. Un tapis blanc délimite l’espace scénique au sol.","Le jeu des acteurs est appuyé par un éclairage à LED qui évolue avec la narration de <strong>manière imperceptible<\/strong>. C'est un soutien à l’action qui se déroule et apporte le ’’sfumato’’ qui nous accompagne dans l’irréel, le poème.","Ceci est enfin appuyé par un travail sur le <strong>son et la musique en live<\/strong>, omniprésents, tantôt discrets, tantôt furieux, accompagnant les émotions intérieures des personnages, leurs passions, et la musicalité de leurs vers."]},"alexandrin":{"titre":"Le traitement de l’alexandrin classique","paragraphes":["Avec Bérénice, un des objectifs fondamentaux du Théâtre des Crescite est d'offrir <strong>la pureté, la clarté mais également l’intensité émotionelle de la langue racinienne<\/strong> en la défaisant de toute lourdeur académique. L'alexandrin classique, souvent perçu comme une langue corsetée ou désuète, se révèle ici dans toute son évidence théâtrale : un dialecte vivant, fluide et organique.","Travaillé par la compagnie avec rigueur et précision sur la base du traité <em>Dire le vers,<\/em> de Jean-Claude Milner et François Regnault, le vers devient <strong>une parole orale.<\/strong> Cette méthode habitue graduellement l’oreille en résolvant certaines contradictions entre la langue parlée contemporaine et le respect des règles de prosodie classiques.","Une matière sonore vibrant entre le dialogue parlé et le slam. Il ne s'agit pas de déclamer un texte poétique, mais d'<strong>incarner une langue de théâtre taillée pour le jeu et l'émotion,<\/strong> imposée à la virgule près par la métrique virtuose de l’alexandrin racinien.","Petit à petit, l’oreille du spectateur – même non averti – arrive à oublier que cette langue a pu lui paraître étrangère."]},"consignes":{"titre":"Consignes de préparation au spectacle","note":"NOTE IMPORTANTE","intro":"Afin de préserver la surprise de l’intrigue et de laisser les élèves découvrir les rebondissements du récit, nous choisissons de nous charger de la phase de préparation au spectacle. Nous demandons de veiller à :","demandes":["DEMANDER AUX ÉLÈVES DE NE PAS LIRE LE TEXTE DE BÉRÉNICE","NE PAS LES PRÉPARER AU TEXTE","NE SURTOUT PAS DÉVOILER L’ABSENCE DE MORT DANS LA PIÈCE"],"apres":"Si un travail approfondi sur la pièce est envisagé, il est préférable de l’effectuer <strong>après les représentations.<\/strong> Les seuls axes de préparation peuvent être les suivants :","axes":["Clarification de l’intrigue qui <strong>précède<\/strong> le commencement de la pièce : la situation initiale, le triangle amoureux, les fonctions de chaque personnage, la situation géopologique...","Introduction aux règles de la tragédie classique, les trois unités, la nécessité d’une mort...","Révision de ce qu’est un alexandrin classique"],"atelier":"Nous demandons dans tous les cas à ce que <strong>chaque classe effectue un atelier d’une heure de préparation au spectacle<\/strong> avec un intervenant de la compagnie."},"ateliers":{"titre":"Ateliers","liste":[{"titre":"Atelier de préparation (obligatoire) - 1h","paragraphes":["Le but de la première heure d'atelier est avant tout de susciter l'envie, la curiosité, et de donner les quelques clés indispensables à une expérience de spectateur sereine et intéressée.","L'accent est mis sur le fait de briser le carcan magistral. En instaurant une dynamique familière et participative."],"etapes":[{"titre":"Étape 1 : <strong>clarifier l'intrigue (20 min)<\/strong>","texte":"En s'appuyant sur des schémas au tableau et sur les références culturelles des élèves (Game of Thrones, Gladiator, Rome...), l'atelier reconstruit l'histoire survenue cinq ans avant le début de la pièce : la situation géopolitique, le triangle amoureux, la loi romaine vis à vis des reines étrangères, le devoir de Titus, analogie avec des dilemmes moraux contemporains (religion, familles...), le concept de la \"friendzone\" en identifiant Antiochus..."},{"titre":"Étape 2 : <strong>l'alexandrin classique, de la culture pop à Racine (40 min<\/strong>)","texte":"Pour faire comprendre la mécanique de l'alexandrin, l'atelier part d'une pratique d'écoute quotidienne : le Rap, les publicités, les dictons. En s'appuyant sur des vers sélectionnés, les élèves sont invité à faire émerger intuitivement les règles classiques (les 12 syllabes, le rôle du « e » muet, l'emplacement de la césure et la structure en deux hémistiches...). Puis les vers basculent sans transition au vers raciniens possédant l'ultime rigueur métrique. Ces vers sont l'occasion de mises en voix collectives."}]},{"titre":"Atelier d'écriture d'alexandrins - 1h","paragraphes":["Placés dans la posture du dramaturge, les élèves s'essaient à la rédaction de distiques ou de quatrains en alexandrins."],"points":["Thématiques d'écriture : choix parmi des sujets à forte charge émotionnelle (déclarer un amour caché, annoncer une séparation, exprimer l'angoisse d'une nuit blanche, faire une mise en garde).","Manipulation des contraintes : utilisation guidée des outils de prosodie (alternance des rimes féminines et masculines, respect de la césure, élisions).","Partage et mise en voix : Lecture sur volontariat à voix haute des écrits."]},{"titre":"Atelier d'initiation au jeu - 1h","paragraphes":["Avec cette heure de pratique sur le plateau, accompagnés de bandes sons sélectionnées, les élèves expérimentent par le corps les enjeux de la tragédie.","Après des exercices d'échauffement/de préparation à l'exposition au regard des autres, les élèves peuvent être invités à parcourir par exemple :"],"points":["des démarches et postures royales : déambulations dans l'espace en explorant différents états physiques (la noblesse du port d'épée, le doute décisionnel, l'urgence amoureuse, la gravité d'un secret).","la création de tableaux vivants collectifs : création de poses de groupe immortalisant des situations de pouvoir ou de tension (un couronnement, une foule hostile, un conseil de guerre).","un exercice individuel d'incarnation : l'épreuve du trône"]},{"titre":"Atelier de sensibilisation à la création - 1h","paragraphes":["En lien avec un intervenant de l'équipe de création du spectacle, les élèves sont amenés à échanger de manière informelle sur le travail de recherche que demande une mise en scène.","<strong>Il est possible d'effectuer cette atelier à la place de l'atelier de préparation obligatoire. Dans ce cas l'intervenant fera une clarification accélérée de l'intrigue qui précède Bérénice et des règles de l'alexandrin pour préparer les élèves au spectacle en 20min avant de se concentrer sur le processus de création.<\/strong>","Exemples de thèmes abordés :"],"points":["les différents postes techniques et artistiques au théâtre. Analogies avec les autres arts collectifs tels que le cinéma, le jeu vidéo, la musique...","l'historique d'une production théâtrale","le rôle du costume, ce qu'il raconte, sa conception. Analogies avec les styles vestimentaires contemporains."]}]},"accueil":{"titre":"Conditions d’accueil","fiche":"Fiche technique","blocs":[{"titre":null,"lignes":["Effectifs de l’équipe (repas et hébergement) : <strong>5 personnes<\/strong>","Durée : <strong>1h25<\/strong>","Jauge par représentation : <strong>100 à 120 places<\/strong>"]},{"titre":"PLANNING DE MONTAGE ET PERSONNEL :","lignes":["Durée : <strong>6 heures de montage<\/strong>, effectué par la compagnie","<strong>Présence d’un régisseur général d’accueil souhaitée<\/strong>"]},{"titre":"PLATEAU :","lignes":["Aire de jeu (gradins compris) : <strong>idéale 15 m x 15 m / minimum 11 m x 11 m<\/strong>","Hauteur sous plafond minimale : <strong>3 m<\/strong>","<strong>Nécessité de pouvoir occulter la pièce pour la placer dans le noir<\/strong>","Les spectateurs seront placés sur les gradins en cercle qui fermeront l’espace de jeu"]},{"titre":"MATÉRIEL À FOURNIR PAR L'ORGANISATEUR :","lignes":["5 chaises pour l’équipe","1 échelle en parisienne montant à hauteur de plafond","1 aspirateur, 1 balai, 1 pelle et 1 serpillère","3 sources d’alimentation 16A différentes pour la régie, le son, la lumière"]},{"titre":"COMPOSITION DU DÉCOR AMENÉ PAR LA COMPAGNIE :","lignes":["3 gradins (traverses de 2 m, placés de manière à former un cercle de 6 m de diamètre)","3 pieds d’une hauteur allant jusqu’à 4m et 3 PAR LED","3 pieds d’enceintes supportant chacun deux enceintes, placés derrière les pieds de lumières","3 tissus (de 3,50m de haut et de 2m de large)","1 sol recouvert de moquette blanche en forme de rond","1 élément central d’une hauteur de 60 cm","1 table de 2m de long x 70cm de large pour la musique/régie lumière"]}],"alerte":"<strong>Un coup de feu à blanc est tiré pendant la pièce,<\/strong> à une heure environ du début du spectacle.","photos":"Photos de l’implantation dans différents établissements scolaires"}}},"dates":[{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"12 novembre 2026 — Eu (76)","ligneDate":"12 novembre 2026","ligneLieu":"Eu (76)","details":[{"texte":"2 représentations au Collège Louis Philippe","lien":null}],"lien":null,"iso":"2026-11-12","fin":"2026-11-12","precision":"day","scolaire":true,"commune":"Eu","dep":"76","xy":[344.2,130.9],"l":5},{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"16 novembre 2026 — Saint-Valéry-en-Caux (76)","ligneDate":"16 novembre 2026","ligneLieu":"Saint-Valéry-en-Caux (76)","details":[{"texte":"2 représentations scolaires au Collège Jehan Le Povremoyne","lien":null}],"lien":null,"iso":"2026-11-16","fin":"2026-11-16","precision":"day","scolaire":true,"commune":"Saint-Valery-en-Caux","dep":"76","xy":[309.8,143.6],"l":6},{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"19 et 20 novembre 2026 — Eu (76)","ligneDate":"19 et 20 novembre 2026","ligneLieu":"Eu (76)","details":[{"texte":"3 représentations au Théâtre des Charmes","lien":null}],"lien"
