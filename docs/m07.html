sur les données techniques<\/h2>","Le site utilise la technologie JavaScript.","Le site Internet ne pourra être tenu responsable de dommages matériels liés à l’utilisation du site. De plus, l’utilisateur du site s’engage à accéder au site en utilisant un matériel récent, ne contenant pas de virus et avec un navigateur de dernière génération mis-à-jour.","<h2>Propriété intellectuelle et contrefaçons<\/h2>","<strong>Théâtre des Crescite<\/strong> est propriétaire des droits de propriété intellectuelle ou détient les droits d’usage sur tous les éléments accessibles sur le site, notamment les textes, images, graphismes, logo, icônes, sons, logiciels.","Toute reproduction, représentation, modification, publication, adaptation de tout ou partie des éléments du site, quel que soit le moyen ou le procédé utilisé, est interdite, sauf autorisation écrite préalable de <strong>Théâtre des Crescite<\/strong>.","Toute exploitation non autorisée du site ou de l’un quelconque des éléments qu’il contient sera considérée comme constitutive d’une contrefaçon.","<h2>Limitations de responsabilité<\/h2>","<strong>Théâtre des Crescite<\/strong> ne pourra être tenue responsable des dommages directs et indirects causés au matériel de l’utilisateur, lors de l’accès au site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>, et résultant soit de l’utilisation d’un matériel ne répondant pas aux spécifications indiquées au point 4, soit de l’apparition d’un bug ou d’une incompatibilité.","<strong>Théâtre des Crescite<\/strong> ne pourra également être tenue responsable des dommages indirects (tels par exemple qu’une perte de marché ou perte d’une chance) consécutifs à l’utilisation du site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>.","Des espaces interactifs (possibilité de poser des questions dans l’espace contact) sont à la disposition des utilisateurs. <strong>Théâtre des Crescite<\/strong> se réserve le droit de supprimer, sans mise en demeure préalable, tout contenu déposé dans cet espace qui contreviendrait à la législation applicable en France, en particulier aux dispositions relatives à la protection des données. Le cas échéant, <strong>Théâtre des Crescite<\/strong> se réserve également la possibilité de mettre en cause la responsabilité civile et/ou pénale de l’utilisateur, notamment en cas de message à caractère raciste, injurieux, diffamant, ou pornographique, quel que soit le support utilisé (texte, photographie…).","<h2>Gestion des données personnelles<\/h2>","A l’occasion de l’utilisation du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>, peuvent êtres recueillies : l’URL des liens par l’intermédiaire desquels l’utilisateur a accédé au site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>, le fournisseur d’accès de l’utilisateur, l’adresse de protocole Internet (IP) de l’utilisateur.","En tout état de cause <strong>Théâtre des Crescite<\/strong> ne collecte des informations personnelles relatives à l’utilisateur que pour le besoin de certains services proposés par le site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>. L’utilisateur fournit ces informations en toute connaissance de cause, notamment lorsqu’il procède par lui-même à leur saisie. Il est alors précisé à l’utilisateur du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> l’obligation ou non de fournir ces informations.","Tout utilisateur dispose d’un droit d’accès, de rectification et d’opposition aux données personnelles le concernant, en effectuant sa demande écrite et signée, accompagnée d’une copie du titre d’identité avec signature du titulaire de la pièce, en précisant l’adresse à laquelle la réponse doit être envoyée.","Aucune information personnelle de l’utilisateur du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> n’est publiée à l’insu de l’utilisateur, échangée, transférée, cédée ou vendue sur un support quelconque à des tiers. Seule l’hypothèse du rachat de <strong>Théâtre des Crescite<\/strong> et de ses droits permettrait la transmission des dites informations à l’éventuel acquéreur qui serait à son tour tenu de la même obligation de conservation et de modification des données vis à vis de l’utilisateur du site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a>.","<h2>Liens hypertextes et cookies<\/h2>","Le site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> contient un certain nombre de liens hypertextes vers d’autres sites, mis en place avec l’autorisation de <strong>Théâtre des Crescite<\/strong>. Cependant, <strong>Théâtre des Crescite<\/strong> n’a pas la possibilité de vérifier le contenu des sites ainsi visités, et n’assumera en conséquence aucune responsabilité de ce fait.","La navigation sur le site <a href=\"https://crescite.fr/\"><strong>crescite.fr<\/strong><\/a> est susceptible de provoquer l’installation de cookie(s) sur l’ordinateur de l’utilisateur. Un cookie est un fichier de petite taille, qui ne permet pas l’identification de l’utilisateur, mais qui enregistre des informations relatives à la navigation d’un ordinateur sur un site. Les données ainsi obtenues visent à faciliter la navigation ultérieure sur le site, et ont également vocation à permettre diverses mesures de fréquentation.","Le refus d’installation d’un cookie peut entraîner l’impossibilité d’accéder à certains services. L’utilisateur peut toutefois configurer son ordinateur de la manière suivante, pour refuser l’installation des cookies :","Sous Firefox : en haut de la fenêtre du navigateur, cliquez sur le bouton Firefox, puis aller dans l’onglet Options. Cliquer sur l’onglet Vie privée.<br/>Paramétrez les Règles de conservation sur : utiliser les paramètres personnalisés pour l’historique. Enfin décochez-la pour désactiver les cookies.","Sous Safari : Cliquez en haut à droite du navigateur sur le pictogramme de menu (symbolisé par un rouage). Sélectionnez Paramètres. Cliquez sur Afficher les paramètres avancés. Dans la section “Confidentialité”, cliquez sur Paramètres de contenu. Dans la section “Cookies”, vous pouvez bloquer les cookies.","Sous Chrome : Cliquez en haut à droite du navigateur sur le pictogramme de menu (symbolisé par trois lignes horizontales). Sélectionnez Paramètres. Cliquez sur Afficher les paramètres avancés. Dans la section “Confidentialité”, cliquez sur préférences. Dans l’onglet “Confidentialité”, vous pouvez bloquer les cookies.","<h2>Droit applicable et attribution de juridiction<\/h2>","Tout litige en relation avec l’utilisation du site <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> est soumis au droit français."]},"politique-de-confidentialite":{"titre":"Politique de confidentialité","blocs":["Nous savons que vous êtes attentifs à l’utilisation et au partage de vos informations personnelles et vous remercions de votre confiance pour les traiter scrupuleusement, avec précaution, et à bon escient. <strong>En visitant le site <a href=\"https://crescite.fr/\">crescite.fr<\/a>, vous acceptez que Théâtre des Crescite collecte, traite et utilise les informations personnelles visées comme indiqué ci-après<\/strong>.","<strong>&gt; Responsable du traitement et Informations de contact<\/strong><br/><strong>&gt; Utilisation des données personnelles collectées<\/strong><br/><strong>&gt; Qu’en est-il des cookies et de leurs dates d’expiration ?<\/strong><br/><strong>&gt; Partage de vos données personnelles<\/strong><br/><strong>&gt; Protection de vos données personnelles<\/strong><br/><strong>&gt; Durées de stockage de vos données<\/strong><br/><strong>&gt; Les droits que vous avez sur vos données<\/strong>","<h2>Responsable du traitement et Informations de contact<\/h2>","L’adresse de notre site Web est : <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>.<br/>Tout traitement des informations personnelles communiquées à <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> est effectué sous la responsabilité de la Compagnie Théâtre des Crescite située au 72, boulevard d’Orléans 76100 ROUEN.<br/>Vous pouvez nous contacter à cette adresse postale ou par e-mail à <a href=\"mailto:contact@crescite.fr?Subject=Un%20visiteur%20du%20site%20Crescite.fr%20vous%20adresse%20un%20message\">contact@crescite.fr<\/a>.","<h2>Utilisation des données personnelles collectées<\/h2>","<strong>Vous trouverez ci-après les types d’information collectés :<\/strong>","<h3>1 – Informations que vous nous fournissez pour utiliser notre site/nos services<\/h3>","<strong>Nous demandons et collectons les informations personnelles suivantes à votre sujet lorsque vous souhaitez utiliser notre site et/ou nos services via notre site Web ou par d’autres biais.<\/strong><br/>Vous nous fournissez des informations quand vous effectuez une recherche, naviguez sur le site, vous prenez part à un jeu concours ou à un questionnaire ou communiquez avec notre Service Client.<br/>C’est par exemple le cas lorsque vous recherchez un produit, quand vous complétez «Votre compte» (vous pouvez d’ailleurs disposer de plusieurs comptes si vous vous êtes inscrit en donnant différentes adresses e-mail) ou la rubrique «Votre profil», quand vous nous contactez par téléphone, par e-mail, ou par tout autre moyen, complétez un questionnaire ou un bulletin de participation à un concours, utilisez nos services, participez à des forums de discussion ou autres modes de communication en commun, quand vous rédigez et postez des commentaires en ligne.<br/>Ces informations peuvent être votre nom, adresse et numéro de téléphone, le contenu des commentaires et des e-mails que vous nous avez adressés, votre description personnelle dans la rubrique «Votre profil».","<strong>Vous pouvez choisir de ne pas nous communiquer certaines informations, cette décision risque néanmoins de vous priver de nombreux services et fonctionnalités que nous vous proposons. Nous utilisons les informations que vous nous communiquez, notamment afin de répondre à vos demandes, de personnaliser vos futurs achats, d’améliorer nos boutiques et de communiquer avec vous.<\/strong>","<h3>2 – Informations collectées automatiquement<\/h3>","<strong>À chaque fois que vous entrez en contact avec nous, nous recevons et enregistrons certains types d’informations. Comme de nombreux autres sites Internet, nous utilisons notamment des “cookies” et obtenons certains types d’informations lorsque votre navigateur accède au site <a href=\"https://crescite.fr/\">crescite.fr<\/a> ou à des publicités et autres contenus affichés sur d’autres sites Internet par <a href=\"https://crescite.fr/\">crescite.fr<\/a> ou pour son compte.<\/strong>","Quelques exemples d’informations que nous collectons et analysons :<br/>l’adresse IP qui relie votre ordinateur à Internet, les confirmations de réception et de lecture d’e-mails, les données de connexion, les adresses e-mail, votre mot de passe, les informations sur votre ordinateur et sur votre connexion Internet (par exemple : le type et la version de votre navigateur, votre système d’exploitation et votre plate-forme, les catégories et versions de plug-ins de votre navigateur), le réglage des fuseaux horaires, le cheminement URL complet vers, via et depuis notre site Internet, y compris les date et heure, les numéros de “cookies”, les produits que vous avez consultés ou recherchés, les numéros de téléphone que vous avez utilisés pour appeler notre Service Client.<br/>Nous utilisons aussi les informations relatives à votre navigateur, tels que les cookies, les Flash cookies (aussi connus sous le nom de Flash Local Shared Objects) ou d’autres informations similaires sur certaines parties de nos sites Internet afin de prévenir la fraude et à d’autres fins. Au cours de certaines visites, nous pouvons être amenés à utiliser des outils logiciels tels que JavaScript pour mesurer et collecter des informations sur la session, notamment les temps de réponse d’une page, les erreurs de téléchargement, la durée de visites sur certaines pages, les informations concernant les interactions sur une page (« scrolling » (défilement sur une page), clics, mouvements de souris) et les méthodes utilisées pour naviguer à partir d’une page. Nous pouvons aussi collecter des informations techniques qui nous aident à identifier votre appareil à des fins de prévention de la fraude et de diagnostic.","<h3>3 – Appareils portables<\/h3>","La plupart des appareils portables donnent la possibilité aux utilisateurs de désactiver les services de localisation. La plupart du temps, cette fonction est située dans le menu « réglages » de l’appareil. Si vous avez des questions relatives à la désactivation des services de localisation de votre appareil, nous vous recommandons de contacter votre opérateur de téléphonie mobile ou le fabricant de votre appareil.","<h3>4 – Informations recueillies pour les commentaires<\/h3>","Quand vous laissez un commentaire sur notre site web, les données inscrites dans le formulaire de commentaire, mais aussi votre adresse IP et l’agent utilisateur de votre navigateur sont collectés pour nous aider à la détection des commentaires indésirables à l’aide d’un service automatisé de détection .","<h3>5 – Opérations de marketing automatisé et/ou de profilage réalisées à l’aide des données personnelles<\/h3>","Nous sommes susceptibles d’utiliser et de compiler vos données à des fins de profilage. Le profilage correspond au traitement automatisé de vos données personnelles. Ces données sont utilisées pour évaluer, analyser et prédire vos préférences, vos intérêts et votre comportement. Nous utilisons ces données pour vous fournir des informations personnalisées sur les offres susceptibles de vous intéresser. Nous ne divulguerons pas les profils établis sur la base de vos données à des tiers autres que notre compagnie.","<ul><li>Nous sommes susceptibles d’utiliser et de compiler vos données pour vous envoyer des newsletters promotionnelles, de la publicité et d’autres informations susceptibles de vous intéresser, et de la publicité sur les médias sociaux par le biais de plates-formes (telles que Twitter).<\/li> <li>Afin de personnaliser, mesurer et améliorer notre publicité.<\/li><\/ul>","Vous pouvez choisir de ne pas recevoir de communication marketing de notre part en suivant les instructions de désabonnement incluses dans nos communications marketing ou en modifiant vos paramètres de notification dans votre compte ou en envoyant un e-mail à <a href=\"mailto:contact@crescite.fr?Subject=Un%20visiteur%20du%20site%20Crescite.fr%20vous%20adresse%20un%20message\">contact@crescite.fr<\/a>.","<h3>6 – Statistiques et mesures d’audience<\/h3>","Nous utilisons des données anonymes pour générer des statistiques et des analyses concernant l’audience du site.","<h2>Qu’en est-il des cookies et de leurs dates d’expiration ?<\/h2>","Si vous déposez un commentaire sur notre site, il vous sera proposé d’enregistrer votre nom, adresse de messagerie et site web dans des cookies. C’est uniquement pour votre confort afin de ne pas avoir à saisir ces informations si vous déposez un autre commentaire plus tard. Ces cookies expirent au bout d’un an.","Si vous avez un compte et que vous vous connectez sur ce site, un cookie temporaire sera créé afin de déterminer si votre navigateur accepte les cookies. Il ne contient pas de données personnelles et sera supprimé automatiquement à la fermeture de votre navigateur.","Lorsque vous vous connecterez, nous mettrons en place un certain nombre de cookies pour enregistrer vos informations de connexion et vos préférences d’écran. La durée de vie d’un cookie de connexion est de deux jours, celle d’un cookie d’option d’écran est d’un an. Si vous cochez « Se souvenir de moi », votre cookie de connexion sera conservé pendant deux semaines. Si vous vous déconnectez de votre compte, le cookie de connexion sera effacé.","En modifiant ou en publiant un article, un cookie supplémentaire sera enregistré dans votre navigateur. Ce cookie ne comprend aucune donnée personnelle. Il indique simplement l’identifiant de l’article que vous venez de modifier. Il expire au bout d’un jour.","<h2>Partage de vos données personnelles<\/h2>","<h3>Prestataires de services tiers<\/h3>","Nous avons recours à d’autres sociétés ou personnes indépendantes lesquelles fournissent certains services pour notre compte. En voici quelques exemples : l’envoi du courrier postal ou électronique, la suppression d’information redondante de nos listes utilisateurs/clients, la gestion de nos fichiers utilisateurs/clients, l’analyse de nos bases de données, la fourniture d’une assistance marketing, la fourniture de résultats de recherche et de liens (y compris des liens et listings payants), les données nécessaires à la comptabilité et la fourniture du service client. Ces prestataires ont accès aux informations personnelles nécessaires à l’exécution de leurs prestations mais ne sont pas autorisés à les utiliser à d’autres fins. De plus, ils sont tenus de traiter ces informations personnelles en application des lois applicables à la protection des données personnelles.<br/>Les commentaires des visiteurs peuvent être vérifiés à l’aide d’un service automatisé de détection des commentaires indésirables.<br/>Certains de nos outils utilisent Google Analytics et Google Adwords. L’utilisation de Google Analytics et Google Adwords est soumise aux règles de confidentialité de Google, aux conditions générales AdWords et aux conditions générales de Google Analytics.","<h3>Service Gravatar<\/h3>","Une chaîne anonymisée créée à partir de votre adresse de messagerie (également appelée hash) peut être envoyée au service Gravatar pour vérifier si vous utilisez ce dernier. Les clauses de confidentialité du service Gravatar sont disponibles ici : <a href=\"https://automattic.com/privacy/\">https://automattic.com/privacy/<\/a>. Après validation de votre commentaire, votre photo de profil sera visible publiquement à côté de votre commentaire.","<h3>Contenu embarqué depuis d’autres sites<\/h3>","Les articles de ce site peuvent inclure des contenus intégrés (par exemple des vidéos, images, articles…). Le contenu intégré depuis d’autres sites se comporte de la même manière que si le visiteur se rendait sur cet autre site.","Ces sites web pourraient collecter des données sur vous, utiliser des cookies, embarquer des outils de suivis tiers, suivre vos interactions avec ces contenus embarqués si vous disposez d’un compte connecté sur leur site web.","<h3>Transfert d’activités<\/h3>","Dans le cadre du développement de nos activités, nous pouvons être amenés à vendre ou acquérir des segments d’activité. À l’occasion de telles transactions, les informations relatives aux clients et aux utilisateurs font généralement partie des actifs transférés mais demeurent sujettes à toute politique de confidentialité pré-existante (sauf, bien entendu, accord contraire de l’utilisateur). Par ailleurs, dans le cas, peu probable, où Théâtre des Crescite ou une part substantielle de ses actifs seraient acquises, les informations relatives aux clients et utilisateurs seraient bien entendu également transmises à l’acquéreur comme faisant partie des actifs transférés.","<h3>Protection de <a href=\"https://crescite.fr/\">crescite.fr<\/a> et des tiers<\/h3>","Nous divulguons le contenu des comptes utilisateurs et autres informations personnelles lorsque nous y sommes légalement obligés, ou pour protéger les droits, la propriété ou la sécurité de <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong>, ceux des utilisateurs des sites appartenant à Théâtre des Crescite ou d’autres personnes.","<h3>Avec votre accord<\/h3>","Dans tous les autres cas, vous serez averti si vos informations venaient à être transmises à un tiers et vous aurez la possibilité de ne pas donner votre accord à une telle transmission.","<h2>Protection de vos données personnelles<\/h2>","<h3>Mesures de sécurité<\/h3>","Nous maintenons des mesures de sécurité physiques, électroniques et des procédures de sauvegarde en rapport avec la collecte, la conservation et la communication d’informations personnelles de nos clients. Nos procédures de sécurité peuvent nous amener à vous demander une preuve de votre identité avant de pouvoir vous communiquer vos informations personnelles.<br/>Théâtre des Crescite utilise la technologie de cryptage SSL qui vous offre une sécurité maximale.<br/>ll est important de vous protéger contre l’accès non autorisé à votre mot de passe et à votre ordinateur. Si vous partagez un ordinateur, vous devez vous déconnecter après chaque utilisation.","<h3>Médias<\/h3>","Si vous êtes un utilisateur ou une utilisatrice enregistré·e et que vous téléversez des images sur le site web, nous vous conseillons d’éviter de téléverser des images contenant des données EXIF de coordonnées GPS. Les visiteurs de notre site web peuvent télécharger et extraire des données de localisation depuis ces images.","<h3>Procédure en cas de fuite de données<\/h3>","Notre première préoccupation est d’éviter la fuite de données en maintenant un bon niveau de sécurité de notre site grâce à une veille constante, la mise à jour régulière de notre site et un serveur de qualité.<br/>Dans le cas d’une fuite de données, nous mettrions tout en œuvre pour en limiter l’impact autant que possible. Si le risque de fuite de données présentait un risque élevé d’atteinte à la confidentialité des données nous en informerions les personnes concernées.","En cas de violation ou suspicion de violation de données à caractères personnels, Théâtre des Crescite et ses sous-traitants notifieront la CNIL, 72h au plus tard, après en avoir pris connaissance.","<h2>Durées de stockage de vos données<\/h2>","Pour les utilisateurs et utilisatrices qui s’enregistrent sur notre site (si cela est possible), nous stockons également les données personnelles indiquées dans leur profil. Tous les utilisateurs et utilisatrices peuvent voir, modifier ou supprimer leurs informations personnelles à tout moment (à l’exception de leur nom d’utilisateur·rice). Les gestionnaires du site peuvent aussi voir et modifier ces informations.","Conformément aux dispositions en vigueur vous disposez d’un droit d’accès, de modification, de rectification et de suppression des informations vous concernant. Si vous mettez une information à jour, nous conservons généralement une copie de vos informations initiales dans nos dossiers.","<h2>Les droits que vous avez sur vos données<\/h2>","<h3>Rectification d’informations inexactes ou incomplètes<\/h3>","Vous pouvez accéder et mettre à jour certaines de vos informations par le biais des paramètres de votre compte.","<h3>Objection et suppression des données<\/h3>","Si vous avez un compte ou si vous avez laissé des commentaires sur le site, vous pouvez demander à recevoir un fichier contenant toutes les données personnelles que nous possédons à votre sujet, incluant celles que vous nous avez fournies. Vous pouvez également demander la suppression des données personnelles vous concernant. Cela ne prend pas en compte les données stockées à des fins administratives, légales ou pour des raisons de sécurité.","Vos données ne seront plus visibles sur le site mais peuvent cependant toujours être présentes dans des dossiers archivés tels que sauvegardes de site, boîte mail, base de données des extensions wordpress qui n’ont pas encore implémenté de mesures. Si nous n’avons pas les moyens techniques aujourd’hui de les faire disparaitre de ces dossiers, nous prendrons cependant en compte votre demande très sérieusement et nous nous engageons à ne plus les utiliser si vous demandez un droit à l’oubli.","L’utilisateur qui laisse un commentaire doit se connecter pour être en mesure d’accéder aux mêmes possibilités.","<h3>Procédure pour exporter ou supprimer vos données<\/h3>","Vous pouvez nous envoyer une demande par e-mail à <a href=\"mailto:contact@crescite.fr?Subject=Un%20visiteur%20du%20site%20Crescite.fr%20vous%20adresse%20un%20message\">contact@crescite.fr<\/a> précisant :","<ul><li>Votre nom d’utilisateur ou votre adresse mail de connexion.<\/li> <li>L’action que vous souhaitez effectuer :<br/>– exporter vos données<br/>– supprimer vos données<br/>Vous recevrez un mail provenant de <strong><a href=\"https://crescite.fr/\">crescite.fr<\/a><\/strong> avec un lien à suivre pour garantir que vous êtes bien le demandeur de l’action. Si vous ne le voyez pas dans votre boîte de réception dans les 72h suivant votre demande, veuillez vérifier dans votre boîte de courriers indésirables.<\/li><\/ul>"]}},"libelles":{"enTournee":"EN TOURNÉE","decouvrir":"découvrir","actuellementEnTournee":"Actuellement en tournée","menu":"Menu","rechercher":"Rechercher …","spectacles":"Spectacles","saison":"Saison"},"saisons":[{"saison":"2026-2027","titre":"Saison 2026-2027","menu":"Saison 26-27","href":"#/agenda"},{"saison":"2025-2026","titre":"Saison 2025-2026","menu":"Saison 2025-2026","href":"#/agenda/2025-2026"},{"saison":"2024-2025","titre":"Saison 2024-2025","menu":"Saison 2024-2025","href":"#/agenda/2024-2025"},{"saison":"2023-2024","titre":"Saison 2023-2024","menu":"Saison 2023-2024","href":"#/agenda/2023-2024"},{"saison":"2022-2023","titre":"Saison 2022-2023","menu":"Saison 2022-2023","href":"#/agenda/2022-2023"},{"saison":"2021-2022","titre":"Saison 2021-2022","menu":"Saison 2021-2022","href":"#/agenda/2021-2022"},{"saison":"2020-2021","titre":"Saison 2020-2021","menu":"Saison 2020-2021","href":"#/agenda/2020-2021"},{"saison":"2019-2020","titre":"Saison 2019-2020","menu":"Saison 2019-2020","href":"#/agenda/2019-2020"},{"saison":"2018-2019","titre":"Saison 2018-2019","menu":"Saison 2018-2019","href":"#/agenda/2018-2019"},{"saison":"2017-2018","titre":"Saison 2017-2018","menu":"Saison 2017-2018","href":"#/agenda/2017-2018"},{"saison":"2016-2017","titre":"Saison 2016-2017","menu":"Saison 2016-2017","href":"#/agenda/2016-2017"}]},"shows":[{"slug":"cassandres","titre":"Cassandres","titreLignes":["Cassandres"],"creation":"création 2027","annee":2027,"fiche":[{"libelle":null,"valeur":"Angelo Jossec"}],"texte":["Sous couvert d’une enquête policière, Cassandre(s) imagine le quotidien de la génération 2000 arrivée au terme de son espérance de vie : la forme est au service du divertissement quand le fond est l’objet de la diversion. Pour que l’anticipation ne soit pas reçue comme de la science-fiction, le spectacle s’ouvre sur une chronologie de notre développement agro-industriel, de 1850 à 2077 — un générique qui fait basculer la fiction du côté du probable."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ff7a2f","couleurTexteClair":"#b55620","fondSombre":"#0b1018","palette":{"fond":"#0b1018","fond2":"#121b28","texte":"#e8edf3","texte2":"#9fb0c3","accent":"#ff7a2f","accent2":"#3d6fb6","scene":"#ff7a2f"},"clair":false,"motif":"chronologie","focale":50,"statut":"En création","genre":"Fiction d’anticipation","cadre":"Grand-Paris · 27 millions d’habitants · Espérance de vie : 51,2 ans","extraits":[{"citation":"« Il fait chaud. Mais on s’en accommode avec cette docilité morne qu’on observe souvent chez les animaux d’élevage. »","source":"Narrateur, partie 2 — Paris, août 2077, trente-huit degrés"},{"citation":"« Tout ce qui est dit ici n’est pas du domaine de la fiction. »","source":"Premier carton, partie 1"},{"citation":"« Les “progrès agricoles” du XXᵉ siècle n’auront consisté qu’à doubler les rendements des cultures pour en bazarder le tiers. »","source":"Rémi, partie 1"},{"citation":"« La fin ou la faim ? » — « Les deux. »","source":"Charline et Rémi, prologue"},{"citation":"« Dans les abattoirs, ils mettent de la musique douce pour attendrir les chairs. »","source":"Lauren, prologue"}],"tournee":{"titre":"Spectacle en création","texte":"Les dates de tournée seront annoncées ici."},"source":"https://adrienvada.fr/spectacles/cassandres/","sousTitre":"Fiction d’anticipation","avec":null,"mentions":[],"duree":null,"production":[],"credit":null,"medias":[]},{"slug":"cleophene","titre":"Cléophène","titreLignes":["Cléophène"],"creation":"création 2024","annee":2024,"fiche":[{"libelle":"Texte :","valeur":"d’après <em>Rodogune<\/em> de Pierre Corneille"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Création musicale :","valeur":"William Langlois"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"},{"libelle":"Création accessoires :","valeur":"Emmanuelle Hérondelle"},{"libelle":"Régisseur général :","valeur":"Thomas Janeczko"},{"libelle":"Régisseur :","valeur":"Adrián Noguera"}],"texte":["Lorsqu’un roi meurt et qu’il est père de jumeaux, lequel des deux héritiers est l’aîné et doit prendre sa place ?","Tragédie de Corneille que l’auteur considérait comme l’une de ses meilleures pièces, <em>Rodogune<\/em> est un drame familial de l’amour et de la haine qui décrit avec noirceur les mécanismes de la vengeance, de la jalousie et de la soif de pouvoir.","Corneille déploie ici une machinerie dramatique redoutable qui fait s’enchaîner rebondissements et péripéties avec un coup de théâtre final qui fit dire à Stendhal  » <em>Rodogune<\/em> ? Shakespeare n’a rien écrit de plus beau. »"],"enTournee":true,"prochaine":{"slug":"cleophene","titre":"Cléophène","ligne":"18 décembre 2026 — Pont-Audemer (27)","ligneDate":"18 décembre 2026","ligneLieu":"Pont-Audemer (27)","details":[{"texte":"14h et 20h : représentations à L’Eclat de Pont-Audemer","lien":null}],"lien":null,"iso":"2026-12-18","fin":"2026-12-18","precision":"day","commune":"Pont-Audemer","dep":"27","xy":[299.9,180.9],"l":0},"nbDates":4,"couleur":"#e3b75b","couleurTexteClair":"#886c34","fondSombre":"#0e0b07","palette":{"fond":"#0e0b07","fond2":"#1a140b","texte":"#f4ead4","texte2":"#cdbd97","accent":"#d9ab4f","accent2":"#9b2226","scene":"#e3b75b"},"clair":false,"motif":"jumeaux","focale":50,"statut":null,"sousTitre":"d’après <em>Rodogune<\/em> de Pierre Corneille","avec":{"libelle":"avec :","valeur":"Johann Abiola, Angelo Jossec, Manon Rivier, Lauren Toulin, et Adrien Vada"},"mentions":[],"duree":"durée : 1h30","production":["<strong>Production :<\/strong> Crescite","<strong>Coproduction : <\/strong>Scène Conventionnée le Rayon Vert de Saint-Valéry-en-Caux et l’Etincelle Théâtre(s) de la Ville de Rouen<br/>avec le soutien du Sillon – Ville de Petit-Couronne et de la Maison de l’Université de Mont-Saint-Aignan","Avec les aides de la DRAC et de la Région Normandie, de la Ville de Rouen et du Département de Seine-Maritime."],"credit":"© Arnaud Bertereau","medias":[{"type":"video","url":"https://player.vimeo.com/video/1181866854","titre":"Bande-annonce ''Cléophène''","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/cleophene/"},{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","titreLignes":["Ci-gisait Cyrano"],"creation":"création 2023","annee":2023,"fiche":[{"libelle":null,"valeur":"d’après « Cyrano » d’Edmond Rostand"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Création accessoires et maquillage :","valeur":"Emmanuelle Hérondelle"},{"libelle":"Régisseur général :","valeur":"Thomas Janeczko"},{"libelle":"Régisseur :","valeur":"Adrián Noguera"}],"texte":["Si Molière est l’auteur dramatique français le plus monté au monde, <em>Cyrano de Bergerac<\/em> est la pièce la plus représentée depuis sa création.<br/>Chacun a développé avec elle un rapport particulier, mélange de réminiscences scolaires ou adolescentes, d’émois théâtraux ou cinématographiques, d’une certaine forme d’identification dont on ne peut guère se défendre…<br/>C’est ainsi : à part Roxane… Tout le monde aime Cyrano. Personne ne se risquera à critiquer ouvertement la pièce… personne ne se risque non plus à l’encenser sans réserve. Cyrano, notre péché mignon… notre plaisir coupable…<br/>Pourtant, si nous sommes nombreux à en avoir vu diverses adaptations scéniques, s’il est vrai que le film de Jean-Paul Rappeneau est encore largement diffusé, qu’une adaptation américaine s’est risquée sur nos écrans, que la pièce a intégré les programmes scolaires…ne nous y trompons pas : ils sont encore nombreux ceux qui n’en connaissent que des bribes, quelques expressions ou tournures de phrases tombées dans le bagage culturel élémentaire.<br/>Transmettre <em>Cyrano<\/em>, aujourd’hui ou demain, n’est jamais chose inutile. C’est permettre à une œuvre poétique de 1897 de passer de générations en générations, emmenant avec elle un jeu avec la langue et le vers, une certaine idée du grand siècle et plus largement de la grandeur, un goût pour le théâtre et sa mise en abîme… grâce à des vecteurs attachants et consensuels : la beauté, la jubilation et la tendresse.<br/>Que l’on se rassure : il y aura une démarche dramaturgique, une réflexion scénographique, des choix esthétiques… et l’on justifiera tout avec esprit. Mais il faut bien le confesser : je monte <em>Cyrano de Bergerac<\/em> parce que cela me fait plaisir. Et que le plaisir est communicatif.<br/>Je m’y engage : pas un spectateur ne piquera du nez… pas un élève n’aura le nez en l’air !"],"enTournee":true,"prochaine":{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"12 novembre 2026 — Eu (76)","ligneDate":"12 novembre 2026","ligneLieu":"Eu (76)","details":[{"texte":"2 représentations au Collège Louis Philippe","lien":null}],"lien":null,"iso":"2026-11-12","fin":"2026-11-12","precision":"day","commune":"Eu","dep":"76","xy":[344.2,130.9],"l":5},"nbDates":21,"couleur":"#8fb3ff","couleurTexteClair":"#5c73a6","fondSombre":"#0a1124","palette":{"fond":"#0a1124","fond2":"#111b37","texte":"#eef2ff","texte2":"#b3bedf","accent":"#f2c14e","accent2":"#d04a52","scene":"#8fb3ff"},"clair":false,"motif":"nez","focale":78,"statut":null,"sousTitre":"d’après Edmond Rostand","avec":{"libelle":"avec :","valeur":"Garance Morel ou Lauren Toulin<br/>Angelo Jossec ou Bryan Chivot<br/>Vladimir Delaye ou Charles Levasseur"},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/nos-actions/education-college/guide-du-cred76/culture/theatre/ci-gisait-cyrano/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 1h10","production":["<strong>Production :<\/strong> Crescite","Coproduction : Juliobona – Lillebonne, Théâtre les 3 Chênes – Laval Agglomération, Ville de Grand-Quevilly<br/>avec le soutien de la DRAC Normandie pour l’EAC, la Région Normandie, le Département de Seine Maritime, la Ville de Rouen, l’Etincelle Théâtre(s) de la Ville de Rouen et l’Odia Normandie – agence régionale au service du développement du spectacle vivant"],"credit":"© Arnaud Bertereau","medias":[{"type":"video","url":"https://player.vimeo.com/video/1081831996","titre":"Bande-annonce Ci-gisait Cyrano","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/ci-gisait-cyrano/"},{"slug":"la-folle-idee","titre":"La Folle Idée","titreLignes":["La Folle Idée"],"creation":"création 2021","annee":2021,"fiche":[{"libelle":"Texte :","valeur":"Angelo Jossec et Corinne Meyniel"},{"libelle":"Mise en scène :","valeur":"Angelo Jossec"},{"libelle":"Assistanat mise en scène :","valeur":"Amélie Chalmey"},{"libelle":"Création lumières et régie générale :","valeur":"Jérôme Hardouin"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Régie son :","valeur":"Renaud Aubin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"},{"libelle":"Création accessoires :","valeur":"Emmanuelle Hérondelle"},{"libelle":"Construction décors :","valeur":"Olivier Leroy"}],"texte":["Un huis-clos en salle des professeurs.","En France, la grève des enseignants s’est généralisée depuis l’annonce d’une énième réforme du collège.","Pour le noyau dur du piquet de grève du collège René Haby, le silence du ministère n’est plus supportable. Pour eux, c’est la confirmation qu’ils ne sont que les outils subalternes d’une idéologie, qu’ils ne cautionnent pas. Qu’ils ne cautionneront plus. Alors l’idée leur vient…","Puisque la contestation pacifique n’a aucun effet, il ne reste qu’une solution : l’insurrection. Le chef d’établissement et quelques professeurs, décident alors d’organiser une prise d’otage au sein du collège afin de faire entendre leurs revendications avec force et éclat.","Mais la folle idée dégénère : alors qu’ils étaient soudés dans la contestation, ils ne parviennent à se mettre d’accord sur rien. Et cette journée d’émulation se conclut de façon macabre.","<em>La Folle Idée<\/em> fait entendre la parole d’individus au point de non-retour. Des professionnels qui, ayant la volonté d’être constructifs, tentent le difficile exercice de s’écouter et de se mettre d’accord. Mais exaspérés par la sensation de ne jamais être entendus, ils glissent peu à peu dans la violence ordinaire. Celle qui bout ça et là. Celle qui monte un peu partout."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ffd447","couleurTexteClair":"#7f6922","fondSombre":"#10201a","palette":{"fond":"#10201a","fond2":"#172a20","texte":"#eef5ee","texte2":"#b6cab9","accent":"#ffd447","accent2":"#ff6b3d","scene":"#ffd447"},"clair":false,"motif":"horloge","focale":46,"statut":null,"sousTitre":"d’Angelo Jossec et Corinne Meyniel","avec":{"libelle":"avec :","valeur":"Steeve Brunet, Hélène Cabot, Sophie Caritté, Elsa Delmas, Rémi Dessenoix, Jean-François Levistre, Jean-Marc Talbot, Lauren Toulin et Lou Valentini."},"mentions":[],"duree":null,"production":["<strong>Production :<\/strong> Crescite","<strong>Coproductions :<\/strong> CDN Normandie-Rouen, Scène conventionnée La Barcarolle de Saint-Omer, Expansion artistique Théâtre Charles Dullin – Grand Quevilly, DSN Dieppe Scène Nationale, Archipel – Granville, Théâtre Juliobona – Lillebonne, Le Sillon – Petit-Couronne, Commédiamuse / La Rotonde – Petit-Couronne, L’Etincelle Théâtre de la Ville de Rouen.","Avec le soutien de la Région et de la DRAC Normandie, du Département de la Seine-Maritime, de la Ville de Rouen, de l’ODIA Normandie / Office de Diffusion et d’Information Artistique, de la Cité Théâtre/Actéa de Caen et de la Spedidam."],"credit":"© Arnaud Bertereau – Agence Mona","medias":[{"type":"video","url":"https://player.vimeo.com/video/544583862","titre":"Bande-annonce \"La Folle Idée\" - création 2021","groupe":null},{"type":"audio","titre":"La Folle Idée - Ça n'engage à rien","par":"par Radio HDR / CDN de Normandie-Rouen | podcast","url":"https://crescite.fr/wp-content/uploads/2022/02/Ca-nengage-a-rien-LFI-180.mp3?_=1"}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/la-folle-idee/"},{"slug":"berenice","titre":"Bérénice","titreLignes":["Bérénice"],"creation":"création 2018","annee":2018,"fiche":[{"libelle":"Texte :","valeur":"Racine"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Création musicale et régisseur son :","valeur":"William Langlois"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"}],"texte":["Avec <em>Bérénice<\/em>, Jean Racine, élève la douleur d’une séparation au rang de la tragédie et crée, peut-être, l’un des plus beau poème de la littérature française. Un triangle amoureux – en proie aux enjeux politiques de la cité Romaine et du devoir de son Empereur – se jouant au cœur d’un gradin circulaire dans une grande proximité avec les comédiens.","Titus c’est l’ami d’Antiochus ; Bérénice c’est l’amie d’Antiochus. Titus aime Bérénice, Bérénice aime Titus, Antiochus aime Bérénice qui fait semblant de ne pas le savoir… Titus est empereur et Bérénice est Reine et une Reine à Rome ne devient pas Impératrice. C’est ainsi, c’est comme ça. Ici-bas les Reines n’entendent pas, les rivaux se chérissent, les Empereurs sanglotent, chacun se sacrifie, mais tout le monde est sublime."],"enTournee":true,"prochaine":{"slug":"berenice","titre":"Bérénice","ligne":"29 et 30 janvier 2027 — Saint-Lô (50)","ligneDate":"29 et 30 janvier 2027","ligneLieu":"Saint-Lô (50)","details":[{"texte":"29 janvier à 10h et 30 janvier à 18h : représentation au Théâtre Roger Ferdinand de Saint-Lô","lien":null}],"lien":null,"iso":"2027-01-29","fin":"2027-01-30","precision":"day","commune":"Saint-Lô","dep":"50","xy":[222.1,195],"l":2},"nbDates":2,"couleur":"#c79ff2","couleurTexteClair":"#81679e","fondSombre":"#120a1d","palette":{"fond":"#120a1d","fond2":"#1e1131","texte":"#f6effc","texte2":"#c9b6e0","accent":"#bf93ec","accent2":"#e9d7b0","scene":"#c79ff2"},"clair":false,"motif":"cercle","focale":64,"statut":null,"sousTitre":"de Racine","avec":{"libelle":"avec :","valeur":"Angelo Jossec, Manon Rivier, Lauren Toulin, et Adrien Vada."},"mentions":["spectacle disponible dans les offres collectives du Pass Culture"],"duree":"durée : 1h20","production":["<strong>Production :<\/strong> Crescite","<strong>Coproduction :<\/strong> l’Archipel de Granville.","Avec le soutien de la DRAC et de la Région Normandie, de la Ville de Rouen et du Département de Seine-Maritime.","Avec l’aide de la DRAC Normandie dans le cadre du plan de relance 2021/mesure 5 du plan théâtre 2021."],"credit":"© Olivier Héron / Alban Van Wassenhove / Thomas Cartron","medias":[],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/berenice/"},{"slug":"macbeth-fatum","titre":"Macbeth – Fatum","titreLignes":["Macbeth","Fatum"],"creation":"création 2016","annee":2016,"fiche":[{"libelle":null,"valeur":"d’après Shakespeare"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Assistante :","valeur":"Lauren Toulin"},{"libelle":"Traduction :","valeur":"Alexis Magenham"},{"libelle":"Conseillère artistique, doublure et accessoiriste :","valeur":"Lisa Peyron"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"}],"texte":["Macbeth et Lady Macbeth, couple sans enfant, n’ont d’autre dieu que leur intérêt commun : lui voulant devenir monarque absolu et elle, alimentant ce désir de pouvoir. Le couple est prêt à tout pour triompher. Au-delà du versant politique de cette histoire, c’est la question de l’humanité qui ont intéressé le jeune metteur en scène et comédien Angelo Jossec et sa compagnie. Comment l’homme peut-il se résoudre à tant de cruauté et d’horreurs ?","Le Théâtre des Crescite revendique le souhait de pratiquer un « théâtre pauvre » au sens noble du terme. Un théâtre sans fioritures qui s’en tient à l’essentiel et met l’acteur eu centre de la scène, comme pilier le plus important de l’édifice. Pour ce nouveau spectacle, le défi est de raconter <em>Macbeth<\/em> en 1h40, avec cinq comédiens pour jouer plus de trente personnages ! Comme dans ses précédentes créations, la compagnie crée tous les effets à vue pour mettre le spectateur dans la confidence. Il s’agit de rendre compte des artifices et de ce qui fait « théâtre ». Avec ingéniosité, folie et pour tout décor quelques tables, chaises et draps, les acteurs passent d’un rôle à l’autre, oscillant entre tragédie et comédie, bouffonnerie et romance, pour donner à voir la richesse et l’étendue des registres et des genres propres à l’écriture de Shakespeare."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ff3b3f","couleurTexteClair":"#d73134","fondSombre":"#0b0808","palette":{"fond":"#0b0808","fond2":"#171010","texte":"#efe6da","texte2":"#bdae9b","accent":"#e0262d","accent2":"#7d8471","scene":"#ff3b3f"},"clair":false,"motif":"fil","focale":40,"statut":null,"sousTitre":"d’après Shakespeare","avec":{"libelle":"avec :","valeur":"Pierre Delmotte, Angelo Jossec, Alice Lestienne, Lisa Peyron et Lauren Toulin."},"mentions":[],"duree":"durée : 1h40","production":["<strong>Production :<\/strong> Crescite","<strong>Coproduction :<\/strong> CDN de Normandie Rouen, le Quai des Arts à Argentan, le Théâtre Durance à Château-Arnoux.","Avec le soutien de la DRAC et de la Région Normandie, des Départements de Seine-Maritime et de l’Orne, et de la Ville de Rouen."],"credit":"©Arnaud Bertereau – Agence Mona et Thomas Cartron","medias":[{"type":"video","url":"https://player.vimeo.com/video/194313759","titre":"Bande-annonce ''Macbeth - Fatum'' - création 2016","groupe":null},{"type":"video","url":"https://www.youtube.com/embed/2m_UI5QKE6Q","titre":"Scottish 1","groupe":"Teasers"},{"type":"video","url":"https://www.youtube.com/embed/HgiaaMvewFY","titre":"Scottish 2","groupe":"Teasers"},{"type":"video","url":"https://www.youtube.com/embed/uTlZvkou9XE","titre":"Scottish 3","groupe":"Teasers"},{"type":"video","url":"https://www.youtube.com/embed/VYpg_P6PWtc","titre":"Scottish 4","groupe":"Teasers"},{"type":"video","url":"https://www.youtube.com/embed/dW1EJjZIwiE","titre":"Scottish 5","groupe":"Teasers"},{"type":"video","url":"https://www.youtube.com/embed/5sa-LUZ5VIw","titre":"Scottish 6","groupe":"Teasers"}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/macbeth-fatum/"},{"slug":"mon-royaume","titre":"Mon Royaume pour un cheval – Romeo & Juliet","titreLignes":["Mon Royaume","pour un cheval","Romeo and Juliet"],"creation":"création 2013","annee":2013,"fiche":[{"libelle":null,"valeur":"d’après « Roméo et Juliette » de Shakespeare"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Traduction :","valeur":"Alexis Magenham"},{"libelle":"Création lumières :","valeur":"Eric Guilbaud"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Création accessoires :","valeur":"Lisa Peyron et Manon Rivier"},{"libelle":"Régisseur général :","valeur":"Thomas Janeczko"}],"texte":["Si Shakespeare vous effraie, alors cette pièce est faite pour vous ! Avec <em>Mon Royaume pour un cheval – Romeo and Juliet<\/em>, le Théâtre des Crescite imagine une version condensée et commentée de <em>Roméo et Juliette<\/em>, dans un spectacle tout-terrain, y mêlant aux détours quelques répliques d’<em>Hamlet<\/em>, du <em>Roi Lear<\/em> ou bien encore de <em>Macbeth<\/em>. Cette pièce, à la forme atypique, est une invitation à découvrir Shakespeare, sa langue, son théâtre, son époque… Vous plongerez avec délectation dans l’univers shakespearien et ne voudrez plus en revenir !"],"enTournee":true,"prochaine":{"slug":"mon-royaume","titre":"Mon Royaume pour un cheval – Romeo & Juliet","ligne":"du 12 au 20 février 2027 — Ostwald (67)","ligneDate":"du 12 au 20 février 2027","ligneLieu":"Ostwald (67)","details":[{"texte":"représentations en diptyque avec »Ci-gisait Cyrano » au Point d’Eau","lien":"https://lepointdeau.com/agenda/mon-royaume-pour-un-cheval-romeo-and-juliet/"}],"lien":"https://lepointdeau.com/agenda/mon-royaume-pour-un-cheval-romeo-and-juliet/","iso":"2027-02-12","fin":"2027-02-20","precision":"range","commune":"Ostwald","dep":"67","xy":[647.4,234.8],"l":13},"nbDates":3,"couleur":"#ff5a5f","couleurTexteClair":"#c54549","fondSombre":"#1a1016","palette":{"fond":"#f5f0e6","fond2":"#e9e1d1","texte":"#15192e","texte2":"#4a5068","accent":"#c8102e","accent2":"#1d3a8a","scene":"#ff5a5f"},"clair":true,"motif":"paperboard","focale":52,"statut":null,"sousTitre":"d’après Shakespeare","avec":{"libelle":"avec :","valeur":"Alice Lestienne, Charles Levasseur et Louisa Travers"},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/nos-actions/education-college/guide-du-cred76/immersion-linguistique/mon-royaume-pour-un-cheval-romeo-and-juliet-dapres-shakespeare/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 1h10","production":["<strong>Production :<\/strong> Crescite","Le spectacle a été créé avec le soutien de la Ville de Rouen et du GEIQ-Théâtre en Haute-Normandie en 2013.<br/>Avec le soutien de l’ODIA Normandie – Agence au service du développement du spectacle vivant, pour l’aide à la reprise en 2026."],"credit":"© Thomas Cartron","medias":[{"type":"video","url":"https://player.vimeo.com/video/273701402","titre":"Bande-annonce \"Mon Royaume pour un cheval - Romeo and Juliet\" Avignon 2018","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/mon-royaume-pour-un-cheval-romeo-and-juliet/"},{"slug":"imaginaire-force","titre":"L’imaginaire forcé","titreLignes":["L’imaginaire forcé"],"creation":"création 2012","annee":2012,"fiche":[{"libelle":"Texte :","valeur":"d’après « Le Mariage forcé » de Molière"},{"libelle":"Mise en scène :","valeur":"Angelo Jossec"}],"texte":["L’idée est de partager, de transmettre l’univers et la vitalité du théâtre que faisait Molière. Il s’agit moins d’un spectacle que d’un prétexte pour discuter Molière, sa langue et le théâtre du 17<sup>e<\/sup> siècle.","Le spectateur pourra expérimenter cette langue au travers de cette intervention puis d’un atelier de pratique théâtrale. Il s’agit donc d’une forme hybride où la pièce, l’histoire choisie, vaut tout autant que la découverte de l’homme qu’était Molière, le théâtre de son époque, ses conditions de travail, une vue d’ensemble sur les thématiques chères à Molière et une explication des intrigues aux vue de l’époque à laquelle elles se font. Prenons pour exemple le mariage, qui est au centre de la plupart, pour ne pas dire toutes, des intrigues de Molière.","Comment se sentir concerné par ces histoires si nous ne savons pas qu’à l’époque le mariage ne se fait que par intérêt et qu’une loi stipule que celui-ci est considéré comme nul si le père n’y consent pas… Il ne s’agit que d’un exemple, mais il montre l’enjeu de ce projet : une forme sans cesse interrompue par de brèves recontextualisations historiques et sociales. Ces recontextualisations sont moins là pour inscrire l’intervention dans une perspective historique que pour donner les clefs d’une langue vieille de plusieurs siècles.","Nous avons choisi <em>Le Mariage Forcé<\/em>, pièce de 1664. Une pièce courte mais contenant toute la virtuosité de Molière, tant dans l’écriture que dans les thèmes abordés. La brièveté de cette pièce laisse la place à de nombreux lazzi (« aux à côté »), c’est à dire aux arrêts de jeu, aux parenthèses sur Molière, sa vie, son œuvre, son époque."],"enTournee":true,"prochaine":{"slug":"imaginaire-force","titre":"L’imaginaire forcé","ligne":"8 avril 2027 — Rouen (76)","ligneDate":"8 avril 2027","ligneLieu":"Rouen (76)","details":[{"texte":"2 représentations au Collège Sainte-Marie","lien":null}],"lien":null,"iso":"2027-04-08","fin":"2027-04-08","precision":"day","commune":"Rouen","dep":"76","xy":[327.1,174.8],"l":24},"nbDates":1,"couleur":"#e9c99a","couleurTexteClair":"#7e6d53","fondSombre":"#1a1016","palette":{"fond":"#f1e8d4","fond2":"#e5d8bc","texte":"#2b2117","texte2":"#5d4c38","accent":"#b0221b","accent2":"#2f4f8f","scene":"#e9c99a"},"clair":true,"motif":"annotations","focale":50,"statut":null,"sousTitre":"d’après Molière","avec":{"libelle":"avec :","valeur":"Louison Bayeux, Claire Le Plomb Martin et Louis Le Plomb Martin."},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/mon-quotidien/colleges/guide-du-cred76/limaginaire-force/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 55 minutes","production":["<strong>Production :<\/strong> Crescite"],"credit":"© Lauren Toulin","medias":[{"type":"video","url":"https://www.youtube.com/embed/URov8sJFUew","titre":"Teaser - l'Imaginaire Forcé","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/l-imaginaire-force/"}],"dates":[{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"12 novembre 2026 — Eu (76)","ligneDate":"12 novembre 2026","ligneLieu"
