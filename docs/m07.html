<script>
/* L'agenda de la compagnie, commun aux maquettes (donnees.js) et à l'administration : composer, à partir d'une date
   de la base et de ses représentations, la ligne d'agenda et ses précisions, dans le style du site d'origine.

   AGENDA.ligne(date, reps, lieu)        « 18 décembre 2026 — Pont-Audemer (27) » (ou date.intitule s'il est écrit)
   AGENDA.quand(date, jours)             « 19 et 20 novembre 2026 », « du 12 au 20 février 2027 », « mars 2027 »
   AGENDA.precisions(date, reps, lieu)   [{texte, lien}] : date.details, ou « 14h et 20h : représentations au Forum »
   AGENDA.chez(nom)                      « au Théâtre des Charmes », « à L’Eclat », « à la Ferme de Bel Ebat »
   AGENDA.saisonDe('2026-10-12')         « 2026-2027 » ; AGENDA.heureTexte('20:30') « 20h30 » ; AGENDA.iso(new Date())
   AGENDA.court('2026-12-18', noms)      { semaine: 'ven.', jour: '18', mois: 'déc.', an: '2026', texte: 'ven. 18 déc.' } : un
                                         bouton de date (réserver) ; noms = { semaine, mois } pour d'autres libellés (D.site.libelles)
                                         que AGENDA.SEMAINE (lun. … dim.) et AGENDA.MOIS_COURTS (janv. … déc.)
   date = {debut, fin, precision: 'jour'|'periode'|'mois'|'saison', intitule, details, lien, nb_representations}
   reps = [{jour, heure, public, annulee}], lieu = {nom, commune, departement} */
const AGENDA = (() => {
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const saisonDe = j => { const a = +j.slice(0, 4), m = +j.slice(5, 7); return m >= 9 ? `${a}-${a + 1}` : `${a - 1}-${a}`; };
  const jourTexte = j => { const n = +j.slice(8, 10); return n === 1 ? '1er' : String(n); };
  const heureTexte = h => { if (!h) return ''; const [hh, mm] = h.split(':'); return `${+hh}h${mm !== '00' ? mm : ''}`; };
  // les noms courts d'un bouton de date (« ven. 18 déc. ») ; la semaine commence le lundi
  const SEMAINE = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
  const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  function court(j, noms = {}) {
    const s = noms.semaine && noms.semaine.length === 7 ? noms.semaine : SEMAINE, m = noms.mois && noms.mois.length === 12 ? noms.mois : MOIS_COURTS;
    const w = (new Date(Date.UTC(+j.slice(0, 4), +j.slice(5, 7) - 1, +j.slice(8, 10))).getUTCDay() + 6) % 7;
    const x = { semaine: s[w], jour: jourTexte(j), mois: m[+j.slice(5, 7) - 1], an: j.slice(0, 4) };
    x.texte = `${x.semaine} ${x.jour} ${x.mois}`;
    return x;
  }
  const liste = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} et ${xs[xs.length - 1]}`;
  // « 18 décembre 2026 », « 19 et 20 novembre 2026 », « du 12 au 20 février 2027 », « mars 2027 »
  function quand(date, jours) {
    if (date.precision === 'mois') return `${MOIS[+date.debut.slice(5, 7) - 1]} ${date.debut.slice(0, 4)}`;
    if (date.precision === 'periode' || !jours.length) {
      const a = date.debut, b = date.fin || date.debut;
      if (a === b) return `${jourTexte(a)} ${MOIS[+a.slice(5, 7) - 1]} ${a.slice(0, 4)}`;
      const memeAn = a.slice(0, 4) === b.slice(0, 4), memeMois = memeAn && a.slice(5, 7) === b.slice(5, 7);
      return `du ${jourTexte(a)}${memeMois ? '' : ` ${MOIS[+a.slice(5, 7) - 1]}${memeAn ? '' : ` ${a.slice(0, 4)}`}`} au ${jourTexte(b)} ${MOIS[+b.slice(5, 7) - 1]} ${b.slice(0, 4)}`;
    }
    const js = [...new Set(jours)].sort();
    const suivis = js.length >= 3 && js.every((j, i) => !i || (Date.parse(j) - Date.parse(js[i - 1])) === 864e5);
    if (suivis) return quand({ precision: 'periode', debut: js[0], fin: js[js.length - 1] }, []);
    // les jours, groupés par mois : « 30 janvier et 2 février 2027 »
    const groupes = [];
    js.forEach(j => { const k = j.slice(0, 7), g = groupes[groupes.length - 1]; if (g && g.k === k) g.j.push(j); else groupes.push({ k, j: [j] }); });
    const an = js[js.length - 1].slice(0, 4), memeAn = js[0].slice(0, 4) === an;
    const morceaux = groupes.map((g, i) => {
      const fin = i === groupes.length - 1;
      return `${liste(g.j.map(jourTexte))} ${MOIS[+g.k.slice(5, 7) - 1]}${!fin && !memeAn ? ` ${g.k.slice(0, 4)}` : ''}`;
    });
    return `${groupes.length > 1 ? liste(morceaux) : morceaux[0]} ${an}`;
  }
  const ou = lieu => lieu ? `${lieu.commune} (${lieu.departement})` : '';
  function ligne(date, reps = [], lieu = null) {
    if (date.intitule) return date.intitule;
    const q = quand(date, reps.map(r => r.jour));
    return lieu ? `${q} — ${ou(lieu)}` : q;
  }
  // « au Théâtre des Charmes », « à L’Eclat », « à la Ferme de Bel Ebat », « à l’Espace culturel »
  function chez(nom) {
    const n = (nom || '').trim();
    if (!n) return '';
    if (/^le\s/i.test(n)) return `au ${n.slice(3)}`;
    if (/^les\s/i.test(n)) return `aux ${n.slice(4)}`;
    if (/^(la\s|l[’'])/i.test(n)) return `à ${n}`;
    if (/^(théâtre|collège|lycée|centre|forum|relais|point|château|conservatoire|musée|cinéma|foyer|festival|domaine|cloître|palais|parc|quai|carré|siroco|sillon|moulin)\b/i.test(n)) return `au ${n}`;
    if (/^(salle|maison|ferme|scène|médiathèque|halle|chapelle|cité|grange|mairie|ville|communauté|chartreuse|comédie|commanderie|abbaye)\b/i.test(n)) return `à la ${n}`;
    if (/^[aeéèêiîoôuy]/i.test(n)) return `à l’${n}`;
    return `à ${n}`;
  }
  // les précisions sous la ligne, quand l'administration n'en a pas écrit : « 14h et 20h : représentations au Forum »
  function precisions(date, reps, lieu) {
    if (date.details && date.details.length) return date.details;
    const vivantes = reps.filter(r => !r.annulee);
    if (!vivantes.length && !lieu?.nom) return [];
    const avecHeure = vivantes.filter(r => r.heure);
    const jours = [...new Set(vivantes.map(r => r.jour))];
    let heures = '';
    if (avecHeure.length) {
      heures = jours.length === 1 ? liste(avecHeure.map(r => heureTexte(r.heure)))
        : liste(jours.map(j => { const h = avecHeure.filter(r => r.jour === j).map(r => heureTexte(r.heure)); return h.length ? `${jourTexte(j)} ${MOIS[+j.slice(5, 7) - 1]} à ${liste(h)}` : null; }).filter(Boolean));
    }
    const n = vivantes.length || date.nb_representations || 0;
    const scol = vivantes.length && vivantes.every(r => r.public === 'scolaire');
    const mot = `représentation${n > 1 ? 's' : ''}${scol ? ` scolaire${n > 1 ? 's' : ''}` : ''}`;
    const texte = heures ? `${heures} : ${mot} ${chez(lieu?.nom)}`.trim() : `${n > 1 ? `${n} ` : ''}${mot} ${chez(lieu?.nom)}`.trim();
    return [{ texte, lien: date.lien || null }];
  }

  return { MOIS, SEMAINE, MOIS_COURTS, iso, saisonDe, jourTexte, heureTexte, court, liste, quand, ou, ligne, chez, precisions };
})();
</script>
<script>
/* Les données vivantes, communes aux maquettes (build.py l'ajoute après les données D, avant la carte).
   D est d'abord l'instantané du dépôt, pour un premier affichage immédiat ; quand la base de la compagnie répond, D est
   remplacé EN PLACE par son contenu (mêmes objets de premier niveau : D.site, D.shows, D.dates, D.saisons, D.carte…),
   puis de nouveau à chaque enregistrement fait dans l'administration (temps réel).

   DONNEES.surChangement(fn)   fn() est appelée après chaque mise à jour de D : refais la vue courante en place, sans
                               remonter en haut, sans voler le focus, sans rejouer l'ouverture ni les animations d'entrée.
                               Le rendu de chaque vue relit donc D à chaque fois (aucune copie figée au chargement).
   DONNEES.etat                'instantane' (données du dépôt), 'base' (à jour avec la base) ou 'hors-ligne'.
   DONNEES.recharger({force})  relit la base ; DONNEES.suspendre(oui) met les nouvelles en attente (édition en cours).

   Les lignes d'agenda se composent avec AGENDA (agenda.js), comme dans l'administration.
   La base : le projet Supabase de la compagnie (tables crescite_, lecture publique de ce qui est publié). Adresse
   ?base=0 : rester sur l'instantané (tests, hors connexion). */
const DONNEES = (() => {
  const BASE = 'https://omekkqjinvppadsoinvj.supabase.co';
  const CLE = 'sb_publishable_TODW6NdmDly8eR9UxjG-6g_eyAa4gjB';
  const TABLES = ['crescite_spectacles', 'crescite_lieux', 'crescite_dates', 'crescite_representations', 'crescite_ateliers', 'crescite_textes',
                  'crescite_personnes', 'crescite_distributions'];
  const abonnes = [];
  const moi = { etat: 'instantane' };
  let actif = true;
  try { actif = new URLSearchParams(location.search).get('base') !== '0' && typeof fetch === 'function' && !window.CRESCITE_SANS_BASE; } catch { actif = false; }

  // ce qui ne vient pas de la base : la navigation, le fond de carte, les photos du dépôt, les positions des communes connues
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, "'").toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const cleCommune = (c, dep) => `${norm(c)}|${dep}`;
  const S = {
    site: { titreSuffixe: D.site.titreSuffixe, accueil: D.site.accueil, entrees: D.site.entrees, menu: D.site.menu,
            redirections: D.site.redirections, libelles: D.site.libelles },
    carte: { viewBox: D.carte.viewBox, contour: D.carte.contour, belgique: D.carte.belgique, luxembourg: D.carte.luxembourg,
             rouen: D.carte.rouen, projection: D.carte.projection },
    xy: new Map(D.carte.lieux.map(l => [cleCommune(l.c, l.dep), l.xy])),
    photos: Object.assign({}, D.photos),
    // l'équipe de l'instantané : gardée tant que la base n'a pas encore ses tables d'équipe
    personnes: D.personnes || {}, equipes: Object.fromEntries((D.shows || []).map(s => [s.slug, s.equipe || []])),
  };

  // ------------------------------------------------------------------------------------------- outils
  const { MOIS, iso, saisonDe, jourTexte, heureTexte, liste, quand, ligne, chez, precisions } = AGENDA;
  const lum = hex => { const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; return 0.2126 * f(parseInt(hex.slice(1, 3), 16)) + 0.7152 * f(parseInt(hex.slice(3, 5), 16)) + 0.0722 * f(parseInt(hex.slice(5, 7), 16)); };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  function pourFondClair(hex, fond = '#ffffff', cible = 4.6) {       // comme for_light dans build.py
    if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return hex;
    let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), c = hex;
    while (contraste(c, fond) < cible && r + g + b > 0) { r = Math.floor(r * 0.92); g = Math.floor(g * 0.92); b = Math.floor(b * 0.92); c = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''); }
    return c;
  }
  // la projection de la carte (conique conforme de Lambert recalée, comme projection() dans build.py)
  function projeter(lon, lat) {
    const P = S.carte.projection;
    if (!P || lon == null || lat == null) return null;
    const rad = Math.PI / 180, f1 = 44 * rad, f2 = 49 * rad, f0 = 46.5 * rad;
    const n = Math.log(Math.cos(f1) / Math.cos(f2)) / Math.log(Math.tan(Math.PI / 4 + f2 / 2) / Math.tan(Math.PI / 4 + f1 / 2));
    const F = Math.cos(f1) * Math.tan(Math.PI / 4 + f1 / 2) ** n / n, rho = f => F / Math.tan(Math.PI / 4 + f / 2) ** n;
    const r = rho(lat * rad), th = n * (lon - 3) * rad, u = r * Math.sin(th), v = rho(f0) - r * Math.cos(th);
    const arr = x => Math.round(x * 10) / 10;
    return [arr(P.cx[0] * u + P.cx[1] * v + P.cx[2]), arr(P.cy[0] * u + P.cy[1] * v + P.cy[2])];
  }
  const photo = fichier => {
    if (!fichier) return null;
    const cle = fichier.replace(/\.[a-z0-9]+$/i, '');
    return S.photos[cle] || `${BASE}/storage/v1/object/public/crescite/${fichier.split('/').map(encodeURIComponent).join('/')}`;
  };

  // ------------------------------------------------------------------------------------------- lire la base
  async function lireTable(table, select, ordre, signal) {
    const out = [];
    for (let debut = 0; ; debut += 1000) {                 // l'API rend 1 000 lignes au plus par appel
      const r = await fetch(`${BASE}/rest/v1/${table}?select=${select}${ordre ? `&order=${ordre}` : ''}&limit=1000&offset=${debut}`,
        { headers: { apikey: CLE, Accept: 'application/json' }, signal, cache: 'no-store' });
      if (!r.ok) throw new Error(`${table} : ${r.status}`);
      const lot = await r.json();
      out.push(...lot);
      if (lot.length < 1000) return out;
    }
  }
  async function lire() {
    const ctl = new AbortController(), minuteur = setTimeout(() => ctl.abort(), 20000);
    try {
      const [sp, li, da, re, at, tx] = await Promise.all([
        lireTable('crescite_spectacles', '*', 'ordre.asc,id.asc', ctl.signal),
        lireTable('crescite_lieux', 'id,nom,type,commune,departement,pays,latitude,longitude,site_web', 'id.asc', ctl.signal),
        lireTable('crescite_dates', 'id,spectacle_id,lieu_id,debut,fin,precision,saison,public,statut,intitule,details,lien,nb_representations', 'debut.asc,id.asc', ctl.signal),
        lireTable('crescite_representations', 'id,date_id,jour,heure,public,annulee,lien,note', 'jour.asc,heure.asc.nullslast,id.asc', ctl.signal),
        lireTable('crescite_ateliers', '*', 'ordre.asc,id.asc', ctl.signal),
        lireTable('crescite_textes', 'cle,valeur', null, ctl.signal),
      ]);
      // l'équipe : facultative (une base sans ses tables d'équipe garde celle de l'instantané)
      let pe, di, dc;
      try {             // les documents publics : facultatifs aussi (une base qui ne les a pas encore garde ceux de l'instantané)
        dc = await lireTable('crescite_documents', 'spectacle_id,type,titre,fichier,url,pour,ordre&pour=in.(pros,scolaires)', 'ordre.asc,id.asc', ctl.signal);
      } catch { dc = undefined; }
      try {
        [pe, di] = await Promise.all([
          lireTable('crescite_personnes', 'id,slug,prenom,nom,metiers,photo,photo_credit,photo_publique,ordre', 'ordre.asc,id.asc', ctl.signal),
          lireTable('crescite_distributions', 'spectacle_id,personne_id,categorie,fonction,role,alternance,ordre', 'ordre.asc,id.asc', ctl.signal)]);
      } catch { pe = di = undefined; }
      return { sp, li, da, re, at, tx, pe, di, dc };
    } finally { clearTimeout(minuteur); }
  }

  // ------------------------------------------------------------------------------------------- composer D
  function composer({ sp, li, da, re, at, tx, pe, di, dc }) {
    const aujourdhui = iso(new Date()), saison = saisonDe(aujourdhui);
    const texte = Object.fromEntries(tx.map(t => [t.cle, t.valeur]));
    const spId = new Map(sp.map(s => [s.id, s])), lieuId = new Map(li.map(l => [l.id, l]));
    const repsDe = new Map();
    re.forEach(r => { if (!repsDe.has(r.date_id)) repsDe.set(r.date_id, []); repsDe.get(r.date_id).push({ ...r, heure: r.heure ? r.heure.slice(0, 5) : null }); });
    const pages = sp.filter(s => s.page && s.publie);
    const slugDe = s => (s && s.page ? s.slug : null);
    const ordre = new Map(sp.map((s, i) => [s.id, i]));

    // les communes de la carte : une par commune et département, à la place des communes du dépôt quand on les connaît
    const lieux = [], index = new Map();
    const communeDe = l => {
      if (!l) return null;
      const k = cleCommune(l.commune, l.departement);
      if (!index.has(k)) {
        const xy = S.xy.get(k) || projeter(l.longitude, l.latitude);
        if (!xy) { index.set(k, null); return null; }
        index.set(k, lieux.length);
        lieux.push({ c: l.commune, dep: l.departement, xy });
      }
      return index.get(k);
    };
    const precisionAncienne = { jour: 'day', periode: 'range', mois: 'month', saison: 'range' };
    const etatDe = d => d.statut === 'annulee' ? 'date annulée' : d.statut === 'reportee' ? 'date reportée' : null;
    const lignes = da.filter(d => spId.has(d.spectacle_id)).map(d => {
      const s = spId.get(d.spectacle_id), lieu = lieuId.get(d.lieu_id) || null, reps = repsDe.get(d.id) || [];
      const l = communeDe(lieu), txt = ligne(d, reps, lieu), [ligneDate, ligneLieu = ''] = txt.split(' — ');
      return {
        d, s, lieu, reps, l, ligne: txt, ligneDate: ligneDate.trim(), ligneLieu: ligneLieu.trim(),
        details: precisions(d, reps, lieu), etat: etatDe(d), iso: d.debut, fin: d.fin || d.debut,
        precision: precisionAncienne[d.precision] || 'day', scolaire: d.public === 'scolaire',
        representations: reps.map(r => ({ jour: r.jour, heure: r.heure, public: r.public, annulee: r.annulee, lien: r.lien, note: r.note })),
      };
    });

    // les dates à venir, et les saisons
    const aVenir = lignes.filter(x => x.fin >= aujourdhui).sort((a, b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : ordre.get(a.s.id) - ordre.get(b.s.id));
    const dates = aVenir.map(x => ({
      id: x.d.id, slug: slugDe(x.s), titre: x.s.titre, ligne: x.ligne, ligneDate: x.ligneDate, ligneLieu: x.ligneLieu,
      details: x.details, lien: x.d.lien, iso: x.iso, fin: x.fin, precision: x.precision, scolaire: x.scolaire, etat: x.etat,
      commune: x.l != null ? lieux[x.l].c : null, dep: x.l != null ? lieux[x.l].dep : null, xy: x.l != null ? lieux[x.l].xy : null,
      // lieu : le nom du lieu qui accueille (où l'on réserve, règle 17) ; representations : ses séances (jour, heure, lien…)
      l: x.l, lieu: x.lieu && x.lieu.nom ? x.lieu.nom : null, representations: x.representations,
    }));
    const cles = [...new Set([saison, ...lignes.map(x => x.d.saison)])].sort().reverse();
    const saisons = {};
    cles.forEach(k => { saisons[k] = { titre: `Saison ${k}`, spectacles: [] }; });
    [...lignes].sort((a, b) => ordre.get(a.s.id) - ordre.get(b.s.id) || (a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : a.d.id - b.d.id)).forEach(x => {
      const S2 = saisons[x.d.saison];
      let g = S2.spectacles.find(y => y._id === x.s.id);
      if (!g) { g = { _id: x.s.id, titre: x.s.titre, sousTitre: x.s.sous_titre, creation: x.s.creation, slug: slugDe(x.s), dates: [] }; S2.spectacles.push(g); }
      g.dates.push({ id: x.d.id, ligne: x.ligne, details: x.details, etat: x.etat, lien: x.d.lien, iso: x.iso, fin: x.fin,
                     precision: x.precision, scolaire: x.scolaire, l: x.l, representations: x.representations });
    });
    Object.values(saisons).forEach(S2 => S2.spectacles.forEach(g => delete g._id));

    // les spectacles, dans le format des maquettes
    const photos = Object.assign({}, S.photos);
    // l'équipe : les fiches publiées (la photo seulement si sa publication est accordée) et la distribution de chaque spectacle
    const avecEquipe = Array.isArray(pe) && Array.isArray(di);
    const personnes = avecEquipe ? Object.fromEntries(pe.map(p => [p.slug, { prenom: p.prenom, nom: p.nom, metiers: p.metiers || [],
      photo: p.photo_publique && p.photo ? photo(p.photo) : null, credit: p.photo_publique && p.photo ? p.photo_credit || null : null }])) : S.personnes;
    const slugPersonne = new Map((pe || []).map(p => [p.id, p.slug]));
    const equipeDe = s => (avecEquipe
      ? di.filter(x => x.spectacle_id === s.id && slugPersonne.has(x.personne_id)).map(x => ({ personne: slugPersonne.get(x.personne_id),
          categorie: x.categorie, fonction: x.fonction || '', role: x.role || null, alternance: x.alternance || null }))
      : S.equipes[s.slug] || []);
    const shows = pages.map(s => {
      const u = s.univers || {}, c = u.couleurs || {};
      const mine = dates.filter(d => d.slug === s.slug);
      if (s.photo) photos[s.slug] = photo(s.photo);
      const ph = (s.photos || []).map(p => { const cle = (p.fichier || '').replace(/\.[a-z0-9]+$/i, ''); photos[cle] = photo(p.fichier); return { ...p, cle }; });
      return {
        slug: s.slug, titre: s.titre, titreLignes: s.titre_lignes || [s.titre], creation: s.creation,
        annee: +((s.creation || '').match(/\d{4}/) || [0])[0], fiche: s.fiche || [], texte: s.texte || [], enTournee: !!s.en_tournee,
        prochaine: mine[0] || null, nbDates: mine.length,
        couleur: c.scene, couleurTexteClair: pourFondClair(c.scene), fondSombre: u.clair ? '#1a1016' : c.fond,
        palette: c, clair: !!u.clair, motif: u.motif, focale: 50, univers: u, lieuTemps: s.lieu_temps, accroche: s.accroche,
        affirmations: s.affirmations || [], citations: s.citations || [], video: s.video, photo: s.photo, photos: ph,
        creditPhotos: s.credit_photos || s.credit, creditDossier: s.credit_dossier,
        // une action culturelle vide ou « masquee » (pas encore construite) n'est pas publiée : null (règle 14 du contrat)
        actionCulturelle: s.action_culturelle && Object.keys(s.action_culturelle).length && !s.action_culturelle.masquee ? s.action_culturelle : null,
        programmer: s.programmer || {},
        dossier: s.dossier ? s.dossier.replace(/^dossier:/, '') : null,
        statut: s.statut, sousTitre: s.sous_titre, avec: s.avec, mentions: s.mentions || [], duree: s.duree,
        production: s.production || [], credit: s.credit, medias: s.medias || [], tournee: s.tournee || {}, source: s.source,
        genre: s.genre, cadre: s.cadre, extraits: s.extraits || [], equipe: equipeDe(s),
      };
    });

    // les ateliers, et les dossiers scolaires qui les reprennent
    const ateliers = at.map(a => ({ id: a.id, slug: slugDe(spId.get(a.spectacle_id)), titre: a.titre, duree: a.duree,
      obligatoire: a.obligatoire, public: a.public, paragraphes: a.paragraphes || [], etapes: a.etapes || [], points: a.points || [] }));
    const dossiers = {};
    Object.entries(texte).filter(([k]) => k.startsWith('dossier:')).forEach(([k, v]) => {
      const cle = k.slice(8), s = sp.find(x => x.dossier === k);
      const liste = at.filter(a => s && a.spectacle_id === s.id).map(a => {
        const x = { titre: a.titre, paragraphes: a.paragraphes || [] };
        if ((a.etapes || []).length) x.etapes = a.etapes;
        if ((a.points || []).length) x.points = a.points;
        return x;
      });
      dossiers[cle] = { ...v, ateliers: { ...(v.ateliers || {}), liste } };
    });

    // la carte
    const compte = ls => { const n = new Map(); ls.forEach(l => { if (l != null) n.set(l, (n.get(l) || 0) + 1); }); return [...n.entries()].sort((a, b) => a[0] - b[0]); };
    const parSaison = {};
    lignes.forEach(x => { (parSaison[x.d.saison] = parSaison[x.d.saison] || []).push(x.l); });
    Object.keys(parSaison).forEach(k => { parSaison[k] = compte(parSaison[k]); });
    const parSpectacle = {};
    pages.forEach(s => {
      parSpectacle[s.slug] = { passe: compte(lignes.filter(x => x.s.id === s.id && x.fin < aujourdhui).map(x => x.l)),
                               aVenir: compte(dates.filter(d => d.slug === s.slug).map(d => d.l)) };
    });
    const carte = { ...S.carte, lieux, parSaison, parSpectacle, aVenir: compte(dates.map(d => d.l)),
                    aVenirPublic: compte(dates.filter(d => !d.scolaire).map(d => d.l)),
                    aVenirScolaire: compte(dates.filter(d => d.scolaire).map(d => d.l)), tout: compte(lignes.map(x => x.l)) };

    // le site : la navigation du dépôt, les textes de la base
    const site = { ...S.site };
    ['nom', 'diaporama', 'donateurs', 'compagnie', 'actions', 'ecole', 'contact', 'coordonnees', 'ecrire', 'facebook',
     'partenaires', 'liensLegaux', 'legal', 'programmation', 'espacePro', 'troupe'].forEach(k => { site[k] = k in texte ? texte[k] : D.site[k]; });
    site.saisons = cles.map(k => ({ saison: k, titre: `Saison ${k}`, menu: k === saison ? `Saison ${k.slice(2, 4)}-${k.slice(7, 9)}` : `Saison ${k}`,
                                    href: k === saison ? '#/agenda' : `#/agenda/${k}` }));
    // les documents publics : un fichier du stockage public (documents/…), ou un lien
    const documents = Array.isArray(dc) ? dc.map(x => ({ spectacle: slugDe(spId.get(x.spectacle_id)) || null, type: x.type, titre: x.titre,
      url: (/^https?:\/\//i.test(x.url || '') ? x.url : null) || (x.fichier ? `${BASE}/storage/v1/object/public/crescite/${x.fichier.split('/').map(encodeURIComponent).join('/')}` : null), pour: x.pour }))
      .filter(x => x.url) : (D.documents || []);
    return { saison, aujourdhui, site, shows, dossiers, ateliers, dates, saisons, carte, photos, personnes, documents };
  }

  // ------------------------------------------------------------------------------------------- appliquer, prévenir
  const empreinte = n => { try { return JSON.stringify(n); } catch { return String(Math.random()); } };
  let derniere = null;
  function appliquer(n) {
    Object.keys(n).forEach(k => {
      const a = D[k], b = n[k];
      if (Array.isArray(a) && Array.isArray(b)) a.splice(0, a.length, ...b);
      else if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
        Object.keys(a).forEach(kk => { if (!(kk in b)) delete a[kk]; });
        Object.assign(a, b);
      } else D[k] = b;
    });
  }
  const prevenir = () => abonnes.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  // pendant une édition en cours (edition.js), les nouvelles de la base attendent : on ne perd rien de ce qui s'écrit
  let suspendu = false, enAttente = null;
  async function recharger({ force = false } = {}) {
    try {
      const n = composer(await lire());
      const e = empreinte(n);
      moi.etat = 'base';
      if (e === derniere && !force) return;
      if (suspendu) { enAttente = { n, e }; return; }
      derniere = e;
      appliquer(n);
      prevenir();
    } catch (err) {
      if (moi.etat !== 'base') moi.etat = 'hors-ligne';
      console.warn('Données de la compagnie indisponibles :', err.message || err);
    }
  }
  let attente = null;
  const bientot = (ms = 250) => { clearTimeout(attente); attente = setTimeout(recharger, ms); };

  // ------------------------------------------------------------------------------------------- temps réel
  // le canal de Supabase, par son client officiel (celui de l'administration, chargé après le premier affichage) :
  // chaque enregistrement dans une table crescite_ publiée relance la lecture
  const CLIENT = 'admin/vendor/supabase.js';
  let connecte = false, version = null;
  const chargerClient = () => window.supabase?.createClient ? Promise.resolve(window.supabase) : new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = CLIENT; s.async = true;
    s.onload = () => (window.supabase?.createClient ? ok(window.supabase) : ko(new Error('client absent')));
    s.onerror = () => ko(new Error('client introuvable'));
    document.head.append(s);
  });
  function ecouter() {
    chargerClient().then(sbjs => {
      const client = sbjs.createClient(BASE, CLE, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      const canal = client.channel('crescite-site');
      TABLES.forEach(table => canal.on('postgres_changes', { event: '*', schema: 'public', table }, () => bientot()));
      canal.subscribe(st => { connecte = st === 'SUBSCRIBED'; });
    }).catch(() => { connecte = false; });
  }
  // secours : si le canal est coupé, la version publiée est relue de temps en temps (et au retour sur l'onglet)
  async function verifier() {
    if (connecte && document.visibilityState === 'visible') return;
    try {
      const r = await fetch(`${BASE}/rest/v1/rpc/crescite_version`, { method: 'POST', headers: { apikey: CLE, 'Content-Type': 'application/json' }, body: '{}', cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (version !== null && v !== version) bientot(0);
      version = v;
    } catch { /* hors connexion : on réessaiera */ }
  }

  if (actif) {
    // la première lecture : si la base ne répond pas (réseau lent, coupure), la page garde l'instantané et réessaie
    let branche = false, essai = 0;
    const brancher = () => { if (branche) return; branche = true; ecouter(); verifier(); setInterval(verifier, 60000); };
    const premiere = () => recharger().then(() => {
      if (moi.etat === 'base') brancher();
      else setTimeout(premiere, [5000, 15000, 45000][essai++] || 120000);
    });
    premiere();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { verifier(); if (!connecte) bientot(0); } });
  }
  moi.surChangement = fn => { if (typeof fn === 'function') abonnes.push(fn); };
  moi.suspendre = oui => {
    suspendu = !!oui;
    if (!suspendu && enAttente) { const { n, e } = enAttente; enAttente = null; derniere = e; appliquer(n); prevenir(); }
  };
  moi.prevenir = prevenir;
  moi.recharger = recharger;
  moi.composer = composer;
  return moi;
})();
</script>
<script>
/* La carte des tournées, commune aux maquettes (build.py l'ajoute après les données D).
   Le fond (la France, la Belgique, le Luxembourg), Rouen, et un bras par commune, de Rouen jusqu'à elle.
   Chaque maquette l'habille dans son univers : couleurs, tracé, mouvement, interactions.

   CARTE.viewBox, CARTE.rouen ([x, y]), CARTE.fond.{pays, belgique, luxembourg} : chemins SVG (attribut d)
   CARTE.lieux                          toutes les communes [{c, dep, xy}] ; « l » est l'indice dans ce tableau
   (aVenir, tout, saison et spectacle ramènent l'outre-mer dans un encart en bas à gauche : x.encart, x.xyReel ; CARTE.ENCART)
   CARTE.aVenir()                       les communes des dates à venir : [{l, c, dep, xy, n, dates: [D.dates…]}]
   CARTE.aVenir('public')               les mêmes, sans les dates scolaires (« Je viens voir un spectacle ») ;
   CARTE.aVenir('scolaire')             seulement les dates scolaires (« Je représente un établissement scolaire »)
   CARTE.tout()                         toutes les communes de toutes les saisons (« Je souhaite programmer ») :
                                        [{l, c, dep, xy, n, dates: [lignes de D.saisons, avec spectacle, slug, saison]}]
   CARTE.saison('2019-2020')            les communes d'une saison : [{l, c, dep, xy, n, dates: [lignes de D.saisons]}]
   CARTE.spectacle(slug)                {aVenir: [...], passe: [...]} : les communes d'un spectacle, à venir et passées
   CARTE.nom(lieu)                      « Pont-Audemer (27) »
   CARTE.bras(xy, {w0, w1, courbe, depart})   un bras plein effilé (à remplir), de Rouen (ou depart) jusqu'à xy
   CARTE.trait(xy, {courbe, depart})          la même courbe, en trait (à tracer) : « M… Q… »
   CARTE.bout(xy, {r, tours, courbe})         une petite spirale qui enroule le bout du bras (à tracer)
   CARTE.longueur(xy, {courbe})               la longueur du trait, pour stroke-dasharray
   CARTE.cadre(lieux, {marge, min})           un viewBox serré autour de Rouen et de ces communes : "x y l h"
   CARTE.svg({...})                     une carte complète, à habiller en CSS (classes .carte-*) : voir plus bas
   CARTE.lier(racine, {survol, choix})  relie les communes d'une carte (data-l) au survol, au clic et au clavier
   CARTE.mouvement()                    false si le visiteur a demandé moins d'animations */
const CARTE = (() => {
  // D.carte se relit à chaque appel : la base de la compagnie peut remplacer ses communes et ses comptes (donnees.js)
  const C = () => D.carte, R = D.carte.rouen;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // une commune hors du cadre de la France (l'outre-mer : Saint-Denis de La Réunion) est ramenée dans un encart,
  // en bas à gauche : x.encart vaut alors true, et x.xyReel garde sa position projetée
  const VB = C().viewBox.split(/\s+/).map(Number), ENCART = [VB[0] + 66, VB[1] + VB[3] - 74];
  const dansCadre = ([x, y]) => x >= VB[0] && x <= VB[0] + VB[2] && y >= VB[1] && y <= VB[1] + VB[3];
  function regroupe(paires, datesDe) {
    return paires.map(([l, n]) => { const p = C().lieux[l], hors = !dansCadre(p.xy); return { l, ...p, xy: hors ? ENCART : p.xy, xyReel: p.xy, encart: hors, n, dates: datesDe(l) }; })
      .sort((a, b) => Math.hypot(a.xy[0] - R[0], a.xy[1] - R[1]) - Math.hypot(b.xy[0] - R[0], b.xy[1] - R[1]));
  }
  const aVenir = filtre => {
    const garde = d => filtre === 'public' ? !d.scolaire : filtre === 'scolaire' ? !!d.scolaire : true;
    const paires = filtre === 'public' ? C().aVenirPublic : filtre === 'scolaire' ? C().aVenirScolaire : C().aVenir;
    return regroupe(paires, l => D.dates.filter(d => d.l === l && garde(d)));
  };
  const tout = () => regroupe(C().tout, l => Object.entries(D.saisons).flatMap(([saison, S]) => S.spectacles.flatMap(g =>
    g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug, saison })))));
  const saison = s => regroupe(C().parSaison[s] || [], l => (D.saisons[s]?.spectacles || []).flatMap(g => g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug }))));
  const spectacle = slug => {
    const p = C().parSpectacle[slug] || { passe: [], aVenir: [] };
    const passees = l => Object.values(D.saisons).flatMap(S => S.spectacles.filter(g => g.slug === slug).flatMap(g => g.dates.filter(d => d.l === l && !(d.fin && d.fin >= D.aujourdhui))));
    return { aVenir: regroupe(p.aVenir, l => D.dates.filter(d => d.slug === slug && d.l === l)), passe: regroupe(p.passe, passees) };
  };
  const nom = x => `${x.c} (${x.dep})`;

  // le point de contrôle de la courbe : à mi-chemin, écarté sur le côté (courbe > 0 : vers la gauche du trajet)
  function controle([x, y], courbe = 0.24, depart = R) {
    const [rx, ry] = depart, dx = x - rx, dy = y - ry;
    return [(rx + x) / 2 - dy * courbe, (ry + y) / 2 + dx * courbe];
  }
  function bras(xy, { w0 = 4, w1 = 0.5, courbe = 0.24, depart = R } = {}) {
    const [rx, ry] = depart, [x, y] = xy;
    if (Math.hypot(x - rx, y - ry) < 6) return '';
    const [qx, qy] = controle(xy, courbe, depart), N = 26, G = [], Dr = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, c = t * t;
      const px = a * rx + b * qx + c * x, py = a * ry + b * qy + c * y;
      let tx = 2 * (1 - t) * (qx - rx) + 2 * t * (x - qx), ty = 2 * (1 - t) * (qy - ry) + 2 * t * (y - qy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = (w0 * (1 - t) + w1 * t) / 2;
      G.push(`${(px - ty * w).toFixed(1)} ${(py + tx * w).toFixed(1)}`); Dr.push(`${(px + ty * w).toFixed(1)} ${(py - tx * w).toFixed(1)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  function trait(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    return `M${depart[0]} ${depart[1]}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${xy[0]} ${xy[1]}`;
  }
  function longueur(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    let L = 0, px = depart[0], py = depart[1];
    for (let k = 1; k <= 24; k++) {
      const t = k / 24, x = (1 - t) ** 2 * depart[0] + 2 * (1 - t) * t * qx + t * t * xy[0], y = (1 - t) ** 2 * depart[1] + 2 * (1 - t) * t * qy + t * t * xy[1];
      L += Math.hypot(x - px, y - py); px = x; py = y;
    }
    return Math.round(L);
  }
  // une spirale au bout du bras, dans le sens de la courbe
  function bout(xy, { r = 5, tours = 1.25, courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart), [x, y] = xy;
    let a = Math.atan2(y - qy, x - qx), pts = [];
    const sens = courbe >= 0 ? 1 : -1, N = 28;
    const cx = x + Math.cos(a + sens * Math.PI / 2) * r, cy = y + Math.sin(a + sens * Math.PI / 2) * r;
    const a0 = Math.atan2(y - cy, x - cx);
    for (let k = 0; k <= N; k++) {
      const t = k / N, ang = a0 + sens * t * tours * 2 * Math.PI, rr = r * (1 - 0.72 * t);
      pts.push(`${(cx + Math.cos(ang) * rr).toFixed(1)} ${(cy + Math.sin(ang) * rr).toFixed(1)}`);
    }
    return `M${pts.join('L')}`;
  }
  function cadre(lieux, { marge = 40, min = 160 } = {}) {
    const xs = [R[0], ...lieux.map(l => l.xy[0])], ys = [R[1], ...lieux.map(l => l.xy[1])];
    let x0 = Math.min(...xs) - marge, x1 = Math.max(...xs) + marge, y0 = Math.min(...ys) - marge, y1 = Math.max(...ys) + marge;
    if (x1 - x0 < min) { const m = (x0 + x1) / 2; x0 = m - min / 2; x1 = m + min / 2; }
    if (y1 - y0 < min) { const m = (y0 + y1) / 2; y0 = m - min / 2; y1 = m + min / 2; }
    return `${Math.round(x0)} ${Math.round(y0)} ${Math.round(x1 - x0)} ${Math.round(y1 - y0)}`;
  }

  /* Une carte complète.
     lieux    : les communes en avant (CARTE.aVenir(), CARTE.saison(s), CARTE.spectacle(slug).aVenir…)
     passe    : des communes en retrait (les tournées passées), tracées plus fines
     forme    : 'bras' (plein effilé), 'trait' (ligne), 'pointille'
     courbe   : l'écart de la courbe ; spirale : un enroulement au bout de chaque bras
     cadre    : 'france' (par défaut) ou 'serre' (autour des communes), ou un viewBox
     pousse   : les bras poussent depuis Rouen à l'affichage (si le visiteur accepte le mouvement)
     interactif : chaque commune devient un bouton (data-l), à relier avec CARTE.lier
     noms     : true pour écrire le nom des communes en avant ; titre : le libellé pour les lecteurs d'écran
     Classes : .carte, .carte-voisin, .carte-pays, .carte-bras(-passe), .carte-bout(-passe), .carte-spirale,
               .carte-lieu (g[data-l]), .carte-point, .carte-nom, .carte-rouen, .carte-rouen-nom */
  let n = 0;
  function svg({ lieux = [], passe = [], forme = 'bras', courbe = 0.24, spirale = false, cadre: vb = 'france', pousse = true,
    interactif = false, noms = false, titre = '', classe = '', largeur = 1 } = {}) {
    const id = 'carte-pousse-' + (++n), anime = pousse && mouvement();
    const box = vb === 'france' ? C().viewBox : vb === 'serre' ? cadre([...lieux, ...passe]) : vb;
    const [bx, by, bw, bh] = box.split(/\s+/).map(Number), echelle = Math.max(bw, bh) / 800;
    const tracer = (x, w0, w1) => forme === 'bras' ? `d="${bras(x.xy, { w0: w0 * echelle, w1: w1 * echelle, courbe })}"` : `d="${trait(x.xy, { courbe })}"`;
    const largeurBras = x => Math.min(7, 1.6 + Math.sqrt(x.n) * 1.1) * largeur;
    const rayon = Math.hypot(bw, bh) * 1.2;
    const etiquette = x => `${nom(x)}${x.dates?.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    return `<svg class="carte ${esc(classe)}" viewBox="${box}" ${interactif ? `aria-label="${esc(titre)}"` : `role="img" aria-label="${esc(titre)}"`} data-forme="${forme}">
      <defs><clipPath id="${id}"><circle cx="${R[0]}" cy="${R[1]}" r="${anime ? 0 : rayon}">${anime ? `<animate attributeName="r" from="0" to="${rayon}" dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>` : ''}</circle></clipPath></defs>
      <path class="carte-voisin" d="${C().belgique}"/><path class="carte-voisin" d="${C().luxembourg}"/><path class="carte-pays" d="${C().contour}"/>
      ${[...lieux, ...passe].some(x => x.encart) ? `<circle class="carte-encart" cx="${ENCART[0]}" cy="${ENCART[1]}" r="${(24 * echelle).toFixed(1)}" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 4"/>` : ''}
      <g clip-path="url(#${id})">
        ${passe.map(x => `<path class="carte-bras-passe" ${forme === 'bras' ? tracer(x, 1.6, 0.4) : `d="${trait(x.xy, { courbe })}"`}/>`).join('')}
        ${passe.map(x => `<circle class="carte-bout-passe" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(1.8 * echelle).toFixed(2)}"/>`).join('')}
        ${lieux.map(x => `<path class="carte-bras" data-l="${x.l}" ${forme === 'bras' ? tracer(x, largeurBras(x), 0.5) : `d="${trait(x.xy, { courbe })}"`}${forme === 'pointille' ? ' stroke-dasharray="1 4"' : ''}/>`).join('')}
        ${spirale ? lieux.map(x => `<path class="carte-spirale" data-l="${x.l}" d="${bout(x.xy, { r: 4.5 * echelle, courbe })}"/>`).join('') : ''}
        ${lieux.map(x => interactif
          ? `<g class="carte-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(4 * echelle).toFixed(2)}"/><circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(12 * echelle).toFixed(2)}" fill="transparent"/><title>${esc(etiquette(x))}</title></g>`
          : `<g class="carte-lieu" data-l="${x.l}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(3.6 * echelle).toFixed(2)}"/><title>${esc(etiquette(x))}</title></g>`).join('')}
        ${noms ? lieux.map(x => `<text class="carte-nom" data-l="${x.l}" x="${x.xy[0] + 7 * echelle}" y="${x.xy[1] + 3.5 * echelle}">${esc(x.c)}</text>`).join('') : ''}
      </g>
      <circle class="carte-rouen" cx="${R[0]}" cy="${R[1]}" r="${(5.5 * echelle).toFixed(2)}"/><text class="carte-rouen-nom" x="${R[0] + 10 * echelle}" y="${R[1] - 9 * echelle}">Rouen</text>
    </svg>`;
  }
  // relie les communes d'une carte : survol(l | null) au survol et au focus, choix(l) au clic et à Entrée / Espace
  function lier(racine, { survol = () => {}, choix = () => {} } = {}) {
    racine.querySelectorAll('.carte-lieu[data-l]').forEach(g => {
      const l = +g.dataset.l;
      g.addEventListener('mouseenter', () => survol(l)); g.addEventListener('mouseleave', () => survol(null));
      g.addEventListener('focus', () => survol(l)); g.addEventListener('blur', () => survol(null));
      g.addEventListener('click', () => choix(l));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choix(l); } });
    });
  }
  return { get K() { return C(); }, viewBox: C().viewBox, rouen: R, ENCART, fond: { pays: C().contour, belgique: C().belgique, luxembourg: C().luxembourg }, get lieux() { return C().lieux; },
    aVenir, tout, saison, spectacle, nom, bras, trait, bout, longueur, cadre, svg, lier, mouvement };
})();
</script>
<script>
/* L'ouverture des maquettes : le logo en grand. Au clic (ou au toucher), à la molette ou au glissé vers le bas, au
   clavier (Entrée, Espace, flèche bas, Page suivante), ses tentacules ondulent et s'écartent, il grossit à toute
   vitesse et le site apparaît à travers lui. Si le visiteur a demandé moins d'animations : un simple fondu.
   build.py l'ajoute après les données D ; chaque maquette l'habille dans son univers.

   INTRO.ouvrir({ fond, degrade, image, encre, tache, mot, sortie, classe, apres })
     à appeler une fois, au chargement ; l'ouverture ne s'affiche que si l'adresse est celle de l'accueil
     fond    : la couleur du fond (par défaut #14070f)
     degrade : un dégradé radial à la place du fond : [[0, '#3a1030'], [1, '#0d0710']] (du centre vers les bords)
     image   : une image (data URL) sous le logo, en couverture, par exemple une photo assombrie
     encre   : la couleur du logo (par défaut #fff) ; tache : true pour poser le logo sur sa tache magenta
     mot     : false pour la pieuvre seule, sans « crescite »
     sortie  : 'zoom' (par défaut : le site apparaît à travers le logo qui grossit) ou 'fondu'
     classe  : une classe en plus sur .intro, pour l'habiller en CSS (.intro, .intro-logo, .intro-indice)
     apres   : appelée quand le site est révélé (le focus va ensuite au titre h1 de la page)
   INTRO.ouverte()  vrai tant que l'ouverture est affichée ; l'évènement « intro:fin » est émis sur window à la fin
   ?intro=0 dans l'adresse : pas d'ouverture (captures, tests). Changer d'adresse ferme l'ouverture sans animation. */
const INTRO = (() => {
  const L = D.logo, [TG, TETE_G, TETE_D, TD] = L.octopusPaths;
  const CIBLE = [702, 706];                         // un point plein de la tête, où le zoom s'enfonce
  const PIVOT_G = [505, 840], PIVOT_D = [1030, 840]; // là où les tentacules extérieurs rejoignent la tête
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ease = { inOut: t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2, out: t => 1 - (1 - t) ** 3, in: t => t ** 3 };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  let el = null, etat = 'ferme', opts = {}, raf = 0, inertes = [];

  function css() {
    if (document.getElementById('intro-style')) return;
    const s = document.createElement('style');
    s.id = 'intro-style';
    s.textContent = `
      html.intro-active, html.intro-active body { overflow: hidden !important; }
      .intro { position: fixed; inset: 0; z-index: 2147483000; color: #fff; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
      .intro-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .intro-logo { position: absolute; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; border-radius: 28px; color: inherit; }
      .intro-logo:focus { outline: none; }
      .intro-logo:focus-visible { outline: 2px solid currentColor; outline-offset: 10px; }
      .intro-indice { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); width: 48px; height: 48px; margin-left: -24px;
        border: 0; background: transparent; color: inherit; opacity: .85; cursor: pointer; padding: 8px; }
      .intro-indice svg { width: 100%; height: 100%; display: block; animation: intro-rebond 1.8s ease-in-out infinite; }
      @keyframes intro-rebond { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      .intro.part .intro-indice { opacity: 0; transition: opacity .2s; }
      h1[tabindex="-1"]:focus { outline: none; }
      @media (prefers-reduced-motion: reduce) { .intro-indice svg { animation: none; } }`;
    document.head.appendChild(s);
  }

  function dessin(remplissage, trou) {
    const o = opts, f = trou ? '' : ' filter="url(#intro-onde)"';
    const tache = o.tache ? `<path class="i-tache" d="${L.tachePath}" fill="${trou ? '#000' : '#BC3E80'}"/>` : '';
    if (trou && o.tache) return tache;            // posé sur sa tache, le site apparaît à travers la tache entière
    return `${tache}
      <g class="i-tg"${f}><path d="${TG}" fill="${remplissage}" fill-rule="evenodd"/></g>
      <g class="i-tete"${trou ? '' : ' filter="url(#intro-onde-tete)"'}><path d="${TETE_G}" fill="${remplissage}" fill-rule="evenodd"/><path d="${TETE_D}" fill="${remplissage}" fill-rule="evenodd"/></g>
      <g class="i-td"${f}><path d="${TD}" fill="${remplissage}" fill-rule="evenodd"/></g>
      ${o.mot === false ? '' : `<path class="i-mot" d="${L.motPath}" fill="${remplissage}"/>`}`;
  }

  // la boîte du logo, en unités du dessin
  const boite = () => opts.tache ? [63, 65, 1408, 1405] : opts.mot === false ? [250, 340, 1042, 576] : [250, 340, 1042, 780];

  function ouvrir(o = {}) {
    if (el || etat !== 'ferme') return;
    const route = location.hash.replace(/^#\/?/, '').split('?')[0];
    if (route || new URLSearchParams(location.search).get('intro') === '0') return;
    opts = o;
    css();
    const encre = o.encre || '#fff', fond = o.fond || '#14070f';
    el = document.createElement('div');
    el.className = 'intro' + (o.classe ? ' ' + o.classe : '');
    el.style.color = encre;
    const degrade = o.degrade ? `<radialGradient id="intro-degrade" cx="50%" cy="46%" r="75%">${o.degrade.map(([p, c]) => `<stop offset="${p}" stop-color="${c}"/>`).join('')}</radialGradient>` : '';
    el.innerHTML = `<svg class="intro-scene" aria-hidden="true" focusable="false">
        <defs>${degrade}
          <filter id="intro-onde" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.0085 0.012" numOctaves="2" seed="11" result="bruit"/>
            <feOffset in="bruit" dx="0" dy="0" result="flot"/>
            <feDisplacementMap in="SourceGraphic" in2="flot" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="intro-onde-tete" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="1" seed="4" result="bruit"/>
            <feOffset in="bruit" dx="0" dy="0" result="flot"/>
            <feDisplacementMap in="SourceGraphic" in2="flot" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <mask id="intro-trou" maskUnits="userSpaceOnUse" x="-100" y="-100" width="100000" height="100000">
            <rect x="-100" y="-100" width="100000" height="100000" fill="#fff"/>
            <g class="intro-monde" data-role="trou" visibility="hidden">${dessin('#000', true)}</g>
          </mask>
        </defs>
        <g mask="url(#intro-trou)">
          <rect class="intro-fond" x="-100" y="-100" width="100000" height="100000" fill="${o.degrade ? 'url(#intro-degrade)' : fond}"/>
          ${o.image ? `<image class="intro-image" href="${o.image}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"/>` : ''}
        </g>
        <circle class="intro-choc" cx="50%" cy="50%" r="0" fill="none" stroke="currentColor" stroke-width="0" style="opacity:0"/>
        <g class="intro-monde" data-role="dessin">${dessin('currentColor', false)}</g>
      </svg>
      <button class="intro-logo" type="button" aria-label="${(D.site && D.site.nom) || 'Crescite'}"></button>
      <button class="intro-indice" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>`;
    document.body.appendChild(el);
    document.documentElement.classList.add('intro-active');
    inertes = [...document.body.children].filter(n => n !== el && !n.inert && n.tagName !== 'SCRIPT');
    inertes.forEach(n => { n.inert = true; });
    etat = 'ouvert';
    placer(0);
    addEventListener('resize', surRedim);
    el.addEventListener('click', partir);
    el.addEventListener('wheel', surMolette, { passive: false });
    el.addEventListener('touchstart', surToucher, { passive: true });
    el.addEventListener('touchmove', surGlisser, { passive: false });
    addEventListener('keydown', surTouche);
    addEventListener('hashchange', fermerVite);
    if (mouvement()) repos(performance.now());
  }

  /* la mise en place : échelle de départ, position, et pour l'animation la pose de chaque partie */
  let geo = null;
  function surRedim() { if (etat === 'ouvert') placer(0); }
  function placer() {
    const W = innerWidth, H = innerHeight, [bx, by, bw, bh] = boite();
    const s0 = Math.min(W * (W < 700 ? .84 : .62) / bw, H * (opts.tache ? .7 : .56) / bh);
    const cx = W / 2, cy = H / 2 - (W < 700 ? H * .03 : 0);
    geo = { W, H, s0, cx, cy, bx, by, bw, bh };
    poser({ s: 1, aG: 0, aD: 0, ondes: 0, flot: 0, vers: 0 });
    const b = el.querySelector('.intro-logo');
    Object.assign(b.style, { left: `${cx - bw * s0 / 2}px`, top: `${cy - bh * s0 / 2}px`, width: `${bw * s0}px`, height: `${bh * s0}px` });
  }
  // s : échelle en plus de s0 ; aG, aD : rotation des tentacules (degrés) ; ondes : ampleur des ondulations ;
  // flot : défilement des ondes ; vers : 0 → 1, la cible du zoom glisse vers le centre de l'écran
  function poser({ s, aG, aD, ondes, flot, vers, rot = 0 }) {
    const { s0, cx, cy, bx, by, bw, bh, W, H } = geo, S = s0 * s;
    const centre = [bx + bw / 2, by + bh / 2];
    const cible = opts.tache ? centre : CIBLE;
    // position écran de la cible : celle du logo centré, puis glisse vers le centre de l'écran
    const ex0 = cx + (cible[0] - centre[0]) * s0, ey0 = cy + (cible[1] - centre[1]) * s0;
    const ex = ex0 + (W / 2 - ex0) * vers, ey = ey0 + (H / 2 - ey0) * vers;
    const t = `translate(${ex.toFixed(2)} ${ey.toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${S.toFixed(5)}) translate(${-cible[0]} ${-cible[1]})`;
    el.querySelectorAll('.intro-monde').forEach(g => {
      g.setAttribute('transform', t);
      g.querySelector('.i-tg')?.setAttribute('transform', `rotate(${aG.toFixed(2)} ${PIVOT_G[0]} ${PIVOT_G[1]})`);
      g.querySelector('.i-td')?.setAttribute('transform', `rotate(${aD.toFixed(2)} ${PIVOT_D[0]} ${PIVOT_D[1]})`);
    });
    const d1 = el.querySelector('#intro-onde feDisplacementMap'), o1 = el.querySelector('#intro-onde feOffset');
    const d2 = el.querySelector('#intro-onde-tete feDisplacementMap'), o2 = el.querySelector('#intro-onde-tete feOffset');
    d1.setAttribute('scale', ondes.toFixed(2)); d2.setAttribute('scale', (ondes * .35).toFixed(2));
    o1.setAttribute('dx', (flot * 1.3).toFixed(1)); o1.setAttribute('dy', (-flot).toFixed(1));
    o2.setAttribute('dx', (-flot * .6).toFixed(1)); o2.setAttribute('dy', (flot * .4).toFixed(1));
  }

  // au repos : les tentacules respirent, les ondes passent lentement
  function repos(t0) {

  const RICHE = /(^|\.)(texte|paragraphes|blocs|mentions|production|dispositifs|textes|sections|points|etapes|valeur|sousTitre|donateurs|partenaires|chapeau|apres|intro|atelier|alerte|lignes|axes)(\.|$)/;
  const estRiche = (chemin, v) => /<[a-z]/i.test(String(v || '')) || RICHE.test(chemin);

  // ----------------------------------------------------------------------------------------------- le mode édition
  function armer(el) {
    if (el.dataset.edArme) return;
    const v = resoudre(el.dataset.edit).valeur;
    if (typeof v !== 'string' && v != null) return;          // seulement les textes
    el.dataset.edArme = '1';
    el.dataset.edRiche = estRiche(el.dataset.edit, v) ? '1' : '';
    // le contenu exact de D (sans les découpages en lettres ou en mots des animations)
    if (!modifies.has(el.dataset.edit)) el.innerHTML = el.dataset.edRiche ? (v || '') : esc(v || '');
    el.contentEditable = 'true';
    el.spellcheck = true;
  }
  function armerTout() { if (moi.actif) $$('[data-edit]').forEach(armer); }
  function desarmerTout() { $$('[data-edit]').forEach(el => { delete el.dataset.edArme; el.removeAttribute('contenteditable'); el.classList.remove('ed-modifie'); }); }
  function majBarre() {
    if (!barre) return;
    const n = modifies.size;
    $('.ed-nb', barre).textContent = n ? `${n} modification${n > 1 ? 's' : ''} à enregistrer` : 'Cliquez un texte pour l’écrire, une date pour la modifier';
    $('[data-ed="enregistrer"]', barre).disabled = !n;
    $('[data-ed="annuler"]', barre).disabled = !n;
  }
  function entrer() {
    styles();
    moi.actif = true;
    document.documentElement.classList.add('ed-actif');
    barre = document.createElement('div');
    barre.className = 'ed-barre ed-boite';
    barre.setAttribute('role', 'region');
    barre.setAttribute('aria-label', 'Édition du site');
    barre.innerHTML = `<span class="ed-etat">Édition</span><span class="ed-nb"></span>
      <button type="button" class="ed-bt" data-ed="ajouter-date">＋ Date</button>
      <button type="button" class="ed-bt ed-plein" data-ed="enregistrer">Enregistrer</button>
      <button type="button" class="ed-bt" data-ed="annuler">Annuler</button>
      <a class="ed-bt" href="${ADMIN}" target="_blank" rel="noopener" title="Ateliers, lieux, journal…">Administration ↗</a>
      <button type="button" class="ed-bt" data-ed="quitter">Quitter</button>`;
    document.body.append(barre);
    barre.addEventListener('click', e => {
      const b = e.target.closest('[data-ed]'); if (!b) return;
      if (b.dataset.ed === 'enregistrer') enregistrer();
      if (b.dataset.ed === 'annuler') abandonner();
      if (b.dataset.ed === 'quitter') quitter();
      if (b.dataset.ed === 'ajouter-date') ouvrirDate(null);
    });
    majBarre();
    armerTout();
    boutonsAgenda();
    observateur = new MutationObserver(() => { cancelAnimationFrame(observateur.raf); observateur.raf = requestAnimationFrame(() => { armerTout(); boutonsAgenda(); }); });
    observateur.observe(document.body, { childList: true, subtree: true });
    annoncer('Mode édition : cliquez un texte pour l’écrire. Enregistrer publie aussitôt.');
  }
  function quitter() {
    if (modifies.size && !confirm('Des modifications ne sont pas enregistrées. Quitter l’édition quand même ?')) return;
    if (modifies.size) { modifies.clear(); DONNEES.suspendre(false); DONNEES.recharger({ force: true }); }
    moi.actif = false;
    observateur?.disconnect();
    barre?.remove(); barre = null; outils?.remove(); outils = null; outilPhoto?.remove(); outilPhoto = null;
    $$('.ed-ajout').forEach(b => b.remove());
    desarmerTout();
    document.documentElement.classList.remove('ed-actif');
    DONNEES.prevenir();
  }
  function abandonner() {
    if (!modifies.size || !confirm('Abandonner les modifications non enregistrées ?')) return;
    modifies.clear(); majBarre();
    desarmerTout();
    DONNEES.suspendre(false);
    DONNEES.recharger({ force: true }).then(() => { DONNEES.prevenir(); armerTout(); });
  }
  function noter(chemin) {
    modifies.add(chemin);
    DONNEES.suspendre(true);
    majBarre();
  }
  async function enregistrer() {
    if (!modifies.size) return;
    const rangees = new Map(), creations = new Map();
    for (const ch of modifies) {
      const b = versBase(ch);
      if (!b) continue;
      if (!rangees.has(b.rangee)) rangees.set(b.rangee, new Map());
      rangees.get(b.rangee).set(b.colonne, b.valeur);
      if (b.creer) creations.set(b.rangee, b.creer);
    }
    const bt = $('[data-ed="enregistrer"]', barre); if (bt) bt.disabled = true;
    try {
      for (const [rangee, colonnes] of rangees) {
        const corps = Object.fromEntries([...colonnes].map(([c, f]) => [c, f()]));
        let r = await requete('PATCH', `/rest/v1/${rangee}`, corps, { Prefer: 'return=representation' });
        // un texte du site qui n'est pas encore dans la base (une rubrique nouvelle, comme « programmation ») : on le crée
        const c = creations.get(rangee);
        if (Array.isArray(r) && !r.length && c) r = await requete('POST', `/rest/v1/${c.table}`, { cle: c.cle, ...corps }, { Prefer: 'return=representation' });
        if (!Array.isArray(r) || !r.length) throw new Error('la base n’a rien modifié (droits du compte ?)');
      }
      modifies.clear();
      $$('.ed-modifie').forEach(el => el.classList.remove('ed-modifie'));
      majBarre();
      DONNEES.suspendre(false);
      await DONNEES.recharger({ force: true });
      annoncer('Enregistré : le site est à jour.');
    } catch (e) {
      if (bt) bt.disabled = false;
      annoncer(`L’enregistrement a échoué : ${e.message}`, { erreur: true });
    }
  }

  // la petite barre de mise en forme, au-dessus du texte qu'on écrit
  function montrerOutils(el) {
    styles();
    if (!outils) {
      outils = document.createElement('div');
      outils.className = 'ed-outils ed-boite';
      outils.addEventListener('mousedown', e => e.preventDefault());
      outils.addEventListener('click', e => {
        const b = e.target.closest('button'), cible = outils.cible; if (!b || !cible) return;
        if (b.dataset.cmd === 'createLink') { const u = prompt('Adresse du lien (https://…)'); if (u) document.execCommand('createLink', false, u); }
        else if (b.dataset.cmd) document.execCommand(b.dataset.cmd);
        else if (b.dataset.liste === 'ajouter') return ajouterApres(cible.dataset.edit);
        else if (b.dataset.liste === 'retirer') return retirer(cible.dataset.edit);
        saisir(cible);
      });
      document.body.append(outils);
    }
    outils.cible = el;
    const liste = /\.\d+$/.test(el.dataset.edit) && Array.isArray(resoudre(el.dataset.edit.replace(/\.\d+$/, '')).valeur);
    outils.innerHTML = (el.dataset.edRiche ? '<button type="button" data-cmd="bold" title="Gras"><b>G</b></button><button type="button" data-cmd="italic" title="Italique"><i>I</i></button><button type="button" data-cmd="createLink" title="Lien">lien</button>' : '')
      + (liste ? '<button type="button" data-liste="ajouter" title="Ajouter un paragraphe après celui-ci">＋ après</button><button type="button" data-liste="retirer" title="Retirer ce paragraphe">✕</button>' : '');
    outils.hidden = !outils.innerHTML;
    const r = el.getBoundingClientRect();
    outils.style.left = `${Math.max(8, Math.min(innerWidth - 260, r.left))}px`;
    outils.style.top = `${r.top > 52 ? r.top - 44 : r.bottom + 8}px`;
  }
  function saisir(el) {
    const v = el.dataset.edRiche ? propre(el.innerHTML) : el.textContent.replace(/\s+/g, ' ').trim();
    if (v === resoudre(el.dataset.edit).valeur) return;
    ecrireD(el.dataset.edit, v);
    el.classList.add('ed-modifie');
    noter(el.dataset.edit);
  }
  const vider = o => typeof o === 'string' ? '' : Array.isArray(o) ? [] : o && typeof o === 'object' ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, vider(v)])) : o;
  function ajouterApres(chemin) {
    const i = +chemin.split('.').pop(), parent = chemin.replace(/\.\d+$/, ''), arr = resoudre(parent).valeur;
    if (!Array.isArray(arr)) return;
    arr.splice(i + 1, 0, vider(clone(arr[i])));
    noter(`${parent}.${i + 1}`);
    if (document.activeElement?.blur) document.activeElement.blur();
    DONNEES.prevenir();
    // la maquette s'est redessinée : on écrit aussitôt dans le nouveau paragraphe
    const viser = () => { armerTout(); const n = $(`[data-edit="${CSS.escape(`${parent}.${i + 1}`)}"]`); if (n) { n.classList.add('ed-modifie'); n.focus(); } return !!n; };
    if (!viser()) requestAnimationFrame(viser);
  }
  function retirer(chemin) {
    const i = +chemin.split('.').pop(), parent = chemin.replace(/\.\d+$/, ''), arr = resoudre(parent).valeur;
    if (!Array.isArray(arr) || !confirm('Retirer ce paragraphe ?')) return;
    arr.splice(i, 1);
    noter(parent + '.0');
    if (outils) outils.hidden = true;
    DONNEES.prevenir();
    requestAnimationFrame(armerTout);
  }

  // les photos : on clique, on choisit, elle est allégée puis envoyée
  async function optimiser(f) {
    try {
      const img = await createImageBitmap(f), k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/webp', 0.84));
      return b && b.size < f.size ? b : f;
    } catch { return f; }
  }
  function changerPhoto(el) {
    const chemin = el.dataset.editPhoto, k = chemin.split('.');
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      annoncer('Envoi de la photo…');
      try {
        const blob = await optimiser(f);
        const dossier = k[0] === 'personnes' ? `equipe/${k[1]}-` : `${k[1]}/`;
        const nom = `${dossier}${Date.now().toString(36)}-${norm(f.name.replace(/\.[^.]+$/, '')).replace(/[^a-z0-9]+/g, '-').slice(0, 40) || 'photo'}.${blob.type === 'image/webp' ? 'webp' : (f.name.split('.').pop() || 'jpg')}`;
        await requete('POST', `/storage/v1/object/crescite/${nom.split('/').map(encodeURIComponent).join('/')}`, blob, { 'Content-Type': blob.type || f.type, 'x-upsert': 'false', 'cache-control': '31536000' });
        const url = `${BASE}/storage/v1/object/public/crescite/${nom.split('/').map(encodeURIComponent).join('/')}`;
        const cle = nom.replace(/\.[a-z0-9]+$/i, '');
        if (k[0] === 'personnes') {                // la photo d'une personne : choisie ici, elle est montrée sur le site
          const p = (D.personnes || {})[k[1]]; if (!p) throw new Error('fiche inconnue');
          p.photo = url; p._chemin = nom; noter(`personnes.${k[1]}.photo`); noter(`personnes.${k[1]}.photoPublique`);
        } else if (k[2] === 'photo') { ecrireD(`shows.${k[1]}.photo`, nom); D.photos[k[1]] = url; noter(`shows.${k[1]}.photo`); }
        else { const p = resoudre(chemin).valeur; if (p) { p.fichier = nom; p.cle = cle; D.photos[cle] = url; noter(`shows.${k[1]}.photos`); } }
        DONNEES.prevenir();
        annoncer('Photo remplacée : enregistrez pour la publier.');
      } catch (e) { annoncer(`Envoi impossible : ${e.message}`, { erreur: true }); }
    });
    inp.click();
  }

  // ----------------------------------------------------------------------------------------------- les dates
  function boutonsAgenda() {
    if (!moi.actif) return;
    // un seul « Ajouter une date » par agenda (une valeur de data-agenda) : sur sa première liste visible
    const choisies = new Map();
    $$('[data-agenda]').forEach(z => {
      const cle = z.dataset.agenda || '', vue = z.getClientRects().length > 0, c = choisies.get(cle);
      if (!c || (!c.vue && vue)) choisies.set(cle, { z, vue });
    });
    const garder = new Set([...choisies.values()].map(c => c.z));
    $$('.ed-ajout').forEach(b => { if (!garder.has(b.parentElement)) b.remove(); });
    garder.forEach(z => {
      if (z.querySelector(':scope > .ed-ajout')) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ed-bt ed-plein ed-ajout ed-boite'; b.textContent = '＋ Ajouter une date';
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); ouvrirDate(null, z.dataset.agenda || null); });
      z.prepend(b);
    });
  }

        + '<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="ed-bt" data-x="det-plus">＋ Précision</button><button type="button" class="ed-bt" data-x="det-auto">Proposer d’après les représentations</button></div>';

    // le lieu : chercher, ou créer (commune trouvée par geo.api.gouv.fr)

        <label class="ed-champ"><span>Département</span><input type="text" data-n="dep" placeholder="76"></label></div><div class="ed-sugg" data-n="sugg" hidden style="position:static"></div>

      n('creer').addEventListener('click', async () => {
        const l = { nom: n('nom').value.trim() || null, commune: n('commune').value.trim(), departement: n('dep').value.trim(), code_insee: geo?.code || null,
          latitude: geo?.centre?.coordinates?.[1] ?? null, longitude: geo?.centre?.coordinates?.[0] ?? null, type: /coll[eè]ge|lyc[ée]e|[ée]cole/i.test(n('nom').value) ? 'etablissement' : 'salle' };
        if (!l.commune || !l.departement) return annoncer('Indiquez la commune et le département.', { erreur: true });
        try {

    const fermer = () => { if (sale && !confirm('Fermer sans enregistrer ?')) return; voile.remove(); };
    voile.addEventListener('mousedown', e => { if (e.target === voile) fermer(); });
    voile.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(); });
    P.addEventListener('input', e => {
      const t = e.target, tr = t.closest('tr[data-i]');

      if (x === 'dupliquer') {

          annoncer('Date supprimée.', { action: async () => {

            } catch (er) { annoncer(`Rétablissement impossible : ${er.message}`, { erreur: true }); }
          }, delai: 9000 });
        } catch (er) { annoncer(`Suppression impossible : ${er.message}`, { erreur: true }); }
        return;
      }
      if (x === 'enregistrer') {
        const rs = F.representations.filter(r => r.jour);
        if (F.representations.some(r => !r.jour)) return annoncer('Chaque représentation a besoin de son jour (ou retirez la ligne vide).', { erreur: true });
        const js = rs.map(r => r.jour).sort(), debut = js[0] || F.debut;
        if (!debut) return annoncer('Indiquez au moins un jour.', { erreur: true });
        const ps = new Set(rs.map(r => r.public));
        const charge = { id: F.id, spectacle_id: +F.spectacle_id, lieu_id: F.lieu_id, debut, fin: js[js.length - 1] || F.fin || debut, precision: rs.length ? 'jour' : F.precision,
          saison: d && d.debut === debut ? d.saison : null, public: ps.size > 1 ? 'mixte' : ps.size ? [...ps][0] : (F.public || 'tout_public'), statut: F.statut, visible: F.visible,
          intitule: libre ? (F.intitule || '').trim() || null : null, details: (F.details || []).filter(y => (y.texte || '').replace(/<[^>]+>/g, '').trim()).map(y => ({ texte: y.texte, lien: y.lien || null })),
          lien: (F.lien || '').trim() || null, nb_representations: rs.length ? null : F.nb_representations,
          representations: rs.map(r => ({ id: r.id, jour: r.jour, heure: r.heure || null, public: r.public, annulee: !!r.annulee, lien: (r.lien || '').trim() || null, note: (r.note || '').trim() || null })), suivi: F.suivi };
        t.disabled = true;
        try {
          await requete('POST', '/rest/v1/rpc/crescite_enregistrer_date', { d: charge });
          voile.remove(); await DONNEES.recharger({ force: true });
          annoncer(F.statut === 'option' || !F.visible ? 'Enregistré (non publié sur le site).' : 'Enregistré : le site est à jour.');
        } catch (er) { t.disabled = false; annoncer(`L’enregistrement a échoué : ${er.message}`, { erreur: true }); }
      }
    });
    if (depart) sale = true;
    (d ? q('#ed-d-sp') : q('#ed-d-lieu')).focus();
  }

  // ----------------------------------------------------------------------------------------------- écouteurs, en mode édition
  document.addEventListener('click', e => {

  document.addEventListener('focusin', e => { if (moi.actif && e.target.closest?.('[data-edit]')) montrerOutils(e.target.closest('[data-edit]')); });
  document.addEventListener('focusout', e => { const el = e.target.closest?.('[data-edit]'); if (moi.actif && el) { saisir(el); setTimeout(() => { if (outils && !outils.contains(document.activeElement) && !document.activeElement?.closest?.('[data-edit]')) outils.hidden = true; }, 120); } });

  window.addEventListener('beforeunload', e => { if (moi.actif && modifies.size) { e.preventDefault(); e.returnValue = ''; } });

  // ----------------------------------------------------------------------------------------------- connexion
  function ecranConnexion() {
    styles();
    const voile = document.createElement('div');
    voile.className = 'ed-voile ed-boite';
    voile.innerHTML = `<form class="ed-panneau ed-petit" role="dialog" aria-modal="true" aria-labelledby="ed-c-titre">
      <div class="ed-tete"><h2 id="ed-c-titre">Modifier le site</h2><button type="button" class="ed-bt" data-x="fermer">Fermer</button></div>
      <div class="ed-corps"><p class="ed-aide" style="margin:0 0 12px">Réservé à la compagnie : connectez-vous avec le compte de l’administration.</p>
        <label class="ed-champ"><span>Adresse électronique</span><input type="email" id="ed-c-mel" autocomplete="username" required></label>
        <label class="ed-champ"><span>Mot de passe</span><input type="password" id="ed-c-mdp" autocomplete="current-password" required></label>
        <p class="ed-aide" id="ed-c-err" role="alert" style="color:#b3261e;margin:0 0 8px"></p></div>
      <div class="ed-pied"><a class="ed-note" href="${ADMIN}" target="_blank" rel="noopener">Mot de passe oublié ?</a><button type="submit" class="ed-bt ed-plein">Se connecter</button></div></form>`;
    document.body.append(voile);
    $('#ed-c-mel', voile).focus();
    $('[data-x="fermer"]', voile).addEventListener('click', () => voile.remove());
    voile.addEventListener('keydown', e => { if (e.key === 'Escape') voile.remove(); });
    $('form', voile).addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('button[type=submit]', voile); b.disabled = true;
      try {
        session = await auth('password', { email: $('#ed-c-mel', voile).value.trim(), password: $('#ed-c-mdp', voile).value });
        garderSession(session);
        if (!(await estAdmin())) throw new Error('Ce compte n’administre pas le site de la compagnie.');
        voile.remove(); entrer();
      } catch (err) { b.disabled = false; $('#ed-c-err', voile).textContent = /invalid/i.test(err.message) ? 'Adresse ou mot de passe incorrect.' : err.message; }

  moi.ouvrir = async () => {
    if (moi.actif) return;
    styles();
    if (typeof DONNEES === 'undefined' || DONNEES.etat !== 'base') {
      if (typeof DONNEES !== 'undefined' && DONNEES.etat === 'instantane') await DONNEES.recharger();

    }

    if (session) { try { await jeton(); if (await estAdmin()) return entrer(); } catch { session = null; garderSession(null); } }
    ecranConnexion();
  };
  // #edition dans l'adresse (lien depuis l'administration) ouvre directement l'édition
  if (/[?&]edition\b/.test(location.search)) setTimeout(() => moi.ouvrir(), 600);
  return moi;
})();
