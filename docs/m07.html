   CARTE.viewBox, CARTE.rouen ([x, y]), CARTE.fond.{pays, belgique, luxembourg} : chemins SVG (attribut d)
   CARTE.lieux                          toutes les communes [{c, dep, xy}] ; « l » est l'indice dans ce tableau
   (aVenir, saison et spectacle ramènent l'outre-mer dans un encart en bas à gauche : x.encart, x.xyReel ; CARTE.ENCART)
   CARTE.aVenir()                       les communes des dates à venir : [{l, c, dep, xy, n, dates: [D.dates…]}]
   CARTE.saison('2019-2020')            les communes d'une saison : [{l, c, dep, xy, n, dates: [lignes de D.saisons]}]
   CARTE.spectacle(slug)                {aVenir: [...], passe: [...]} : les communes d'un spectacle, à venir et passées
   CARTE.nom(lieu)                      « Pont-Audemer (27) »
   CARTE.bras(xy, {w0, w1, courbe, depart})   un bras plein effilé (à remplir), de Rouen (ou depart) jusqu'à xy
   CARTE.trait(xy, {courbe, depart})          la même courbe, en trait (à tracer) : « M… Q… »
   CARTE.bout(xy, {r, tours, courbe})         une petite spirale qui enroule le bout du bras (à tracer)
   CARTE.longueur(xy, {courbe})               la longueur du trait, pour stroke-dasharray
   CARTE.cadre(lieux, {marge, min})           un viewBox serré autour de Rouen et de ces communes : "x y l h"
   CARTE.svg({...})                     une carte complète, à habiller en CSS (classes .carte-*) : voir plus bas
   CARTE.lier(racine, {survol, choix})  relie les communes d'une carte (data-l) au survol, au clic et au clavier
   CARTE.mouvement()                    false si le visiteur a demandé moins d'animations */
const CARTE = (() => {
  const K = D.carte, R = K.rouen;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // une commune hors du cadre de la France (l'outre-mer : Saint-Denis de La Réunion) est ramenée dans un encart,
  // en bas à gauche : x.encart vaut alors true, et x.xyReel garde sa position projetée
  const VB = K.viewBox.split(/\s+/).map(Number), ENCART = [VB[0] + 66, VB[1] + VB[3] - 74];
  const dansCadre = ([x, y]) => x >= VB[0] && x <= VB[0] + VB[2] && y >= VB[1] && y <= VB[1] + VB[3];
  function regroupe(paires, datesDe) {
    return paires.map(([l, n]) => { const p = K.lieux[l], hors = !dansCadre(p.xy); return { l, ...p, xy: hors ? ENCART : p.xy, xyReel: p.xy, encart: hors, n, dates: datesDe(l) }; })
      .sort((a, b) => Math.hypot(a.xy[0] - R[0], a.xy[1] - R[1]) - Math.hypot(b.xy[0] - R[0], b.xy[1] - R[1]));
  }
  const aVenir = () => regroupe(K.aVenir, l => D.dates.filter(d => d.l === l));
  const saison = s => regroupe(K.parSaison[s] || [], l => (D.saisons[s]?.spectacles || []).flatMap(g => g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug }))));
  const spectacle = slug => {
    const p = K.parSpectacle[slug] || { passe: [], aVenir: [] };
    const passees = l => Object.values(D.saisons).flatMap(S => S.spectacles.filter(g => g.slug === slug).flatMap(g => g.dates.filter(d => d.l === l && !(d.fin && d.fin >= D.aujourdhui))));
    return { aVenir: regroupe(p.aVenir, l => D.dates.filter(d => d.slug === slug && d.l === l)), passe: regroupe(p.passe, passees) };
  };
  const nom = x => `${x.c} (${x.dep})`;

  // le point de contrôle de la courbe : à mi-chemin, écarté sur le côté (courbe > 0 : vers la gauche du trajet)
  function controle([x, y], courbe = 0.24, depart = R) {
    const [rx, ry] = depart, dx = x - rx, dy = y - ry;
    return [(rx + x) / 2 - dy * courbe, (ry + y) / 2 + dx * courbe];
  }
  function bras(xy, { w0 = 4, w1 = 0.5, courbe = 0.24, depart = R } = {}) {
    const [rx, ry] = depart, [x, y] = xy;
    if (Math.hypot(x - rx, y - ry) < 6) return '';
    const [qx, qy] = controle(xy, courbe, depart), N = 26, G = [], Dr = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, c = t * t;
      const px = a * rx + b * qx + c * x, py = a * ry + b * qy + c * y;
      let tx = 2 * (1 - t) * (qx - rx) + 2 * t * (x - qx), ty = 2 * (1 - t) * (qy - ry) + 2 * t * (y - qy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = (w0 * (1 - t) + w1 * t) / 2;
      G.push(`${(px - ty * w).toFixed(1)} ${(py + tx * w).toFixed(1)}`); Dr.push(`${(px + ty * w).toFixed(1)} ${(py - tx * w).toFixed(1)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  function trait(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    return `M${depart[0]} ${depart[1]}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${xy[0]} ${xy[1]}`;
  }
  function longueur(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    let L = 0, px = depart[0], py = depart[1];
    for (let k = 1; k <= 24; k++) {
      const t = k / 24, x = (1 - t) ** 2 * depart[0] + 2 * (1 - t) * t * qx + t * t * xy[0], y = (1 - t) ** 2 * depart[1] + 2 * (1 - t) * t * qy + t * t * xy[1];
      L += Math.hypot(x - px, y - py); px = x; py = y;
    }
    return Math.round(L);
  }
  // une spirale au bout du bras, dans le sens de la courbe
  function bout(xy, { r = 5, tours = 1.25, courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart), [x, y] = xy;
    let a = Math.atan2(y - qy, x - qx), pts = [];
    const sens = courbe >= 0 ? 1 : -1, N = 28;
    const cx = x + Math.cos(a + sens * Math.PI / 2) * r, cy = y + Math.sin(a + sens * Math.PI / 2) * r;
    const a0 = Math.atan2(y - cy, x - cx);
    for (let k = 0; k <= N; k++) {
      const t = k / N, ang = a0 + sens * t * tours * 2 * Math.PI, rr = r * (1 - 0.72 * t);
      pts.push(`${(cx + Math.cos(ang) * rr).toFixed(1)} ${(cy + Math.sin(ang) * rr).toFixed(1)}`);
    }
    return `M${pts.join('L')}`;
  }
  function cadre(lieux, { marge = 40, min = 160 } = {}) {
    const xs = [R[0], ...lieux.map(l => l.xy[0])], ys = [R[1], ...lieux.map(l => l.xy[1])];
    let x0 = Math.min(...xs) - marge, x1 = Math.max(...xs) + marge, y0 = Math.min(...ys) - marge, y1 = Math.max(...ys) + marge;
    if (x1 - x0 < min) { const m = (x0 + x1) / 2; x0 = m - min / 2; x1 = m + min / 2; }
    if (y1 - y0 < min) { const m = (y0 + y1) / 2; y0 = m - min / 2; y1 = m + min / 2; }
    return `${Math.round(x0)} ${Math.round(y0)} ${Math.round(x1 - x0)} ${Math.round(y1 - y0)}`;
  }

  /* Une carte complète.
     lieux    : les communes en avant (CARTE.aVenir(), CARTE.saison(s), CARTE.spectacle(slug).aVenir…)
     passe    : des communes en retrait (les tournées passées), tracées plus fines
     forme    : 'bras' (plein effilé), 'trait' (ligne), 'pointille'
     courbe   : l'écart de la courbe ; spirale : un enroulement au bout de chaque bras
     cadre    : 'france' (par défaut) ou 'serre' (autour des communes), ou un viewBox
     pousse   : les bras poussent depuis Rouen à l'affichage (si le visiteur accepte le mouvement)
     interactif : chaque commune devient un bouton (data-l), à relier avec CARTE.lier
     noms     : true pour écrire le nom des communes en avant ; titre : le libellé pour les lecteurs d'écran
     Classes : .carte, .carte-voisin, .carte-pays, .carte-bras(-passe), .carte-bout(-passe), .carte-spirale,
               .carte-lieu (g[data-l]), .carte-point, .carte-nom, .carte-rouen, .carte-rouen-nom */
  let n = 0;
  function svg({ lieux = [], passe = [], forme = 'bras', courbe = 0.24, spirale = false, cadre: vb = 'france', pousse = true,
    interactif = false, noms = false, titre = '', classe = '', largeur = 1 } = {}) {
    const id = 'carte-pousse-' + (++n), anime = pousse && mouvement();
    const box = vb === 'france' ? K.viewBox : vb === 'serre' ? cadre([...lieux, ...passe]) : vb;
    const [bx, by, bw, bh] = box.split(/\s+/).map(Number), echelle = Math.max(bw, bh) / 800;
    const tracer = (x, w0, w1) => forme === 'bras' ? `d="${bras(x.xy, { w0: w0 * echelle, w1: w1 * echelle, courbe })}"` : `d="${trait(x.xy, { courbe })}"`;
    const largeurBras = x => Math.min(7, 1.6 + Math.sqrt(x.n) * 1.1) * largeur;
    const rayon = Math.hypot(bw, bh) * 1.2;
    const etiquette = x => `${nom(x)}${x.dates?.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    return `<svg class="carte ${esc(classe)}" viewBox="${box}" ${interactif ? `aria-label="${esc(titre)}"` : `role="img" aria-label="${esc(titre)}"`} data-forme="${forme}">
      <defs><clipPath id="${id}"><circle cx="${R[0]}" cy="${R[1]}" r="${anime ? 0 : rayon}">${anime ? `<animate attributeName="r" from="0" to="${rayon}" dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>` : ''}</circle></clipPath></defs>
      <path class="carte-voisin" d="${K.belgique}"/><path class="carte-voisin" d="${K.luxembourg}"/><path class="carte-pays" d="${K.contour}"/>
      ${[...lieux, ...passe].some(x => x.encart) ? `<circle class="carte-encart" cx="${ENCART[0]}" cy="${ENCART[1]}" r="${(24 * echelle).toFixed(1)}" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 4"/>` : ''}
      <g clip-path="url(#${id})">
        ${passe.map(x => `<path class="carte-bras-passe" ${forme === 'bras' ? tracer(x, 1.6, 0.4) : `d="${trait(x.xy, { courbe })}"`}/>`).join('')}
        ${passe.map(x => `<circle class="carte-bout-passe" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(1.8 * echelle).toFixed(2)}"/>`).join('')}
        ${lieux.map(x => `<path class="carte-bras" data-l="${x.l}" ${forme === 'bras' ? tracer(x, largeurBras(x), 0.5) : `d="${trait(x.xy, { courbe })}"`}${forme === 'pointille' ? ' stroke-dasharray="1 4"' : ''}/>`).join('')}
        ${spirale ? lieux.map(x => `<path class="carte-spirale" data-l="${x.l}" d="${bout(x.xy, { r: 4.5 * echelle, courbe })}"/>`).join('') : ''}
        ${lieux.map(x => interactif
          ? `<g class="carte-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(4 * echelle).toFixed(2)}"/><circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(12 * echelle).toFixed(2)}" fill="transparent"/><title>${esc(etiquette(x))}</title></g>`
          : `<g class="carte-lieu" data-l="${x.l}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(3.6 * echelle).toFixed(2)}"/><title>${esc(etiquette(x))}</title></g>`).join('')}
        ${noms ? lieux.map(x => `<text class="carte-nom" data-l="${x.l}" x="${x.xy[0] + 7 * echelle}" y="${x.xy[1] + 3.5 * echelle}">${esc(x.c)}</text>`).join('') : ''}
      </g>
      <circle class="carte-rouen" cx="${R[0]}" cy="${R[1]}" r="${(5.5 * echelle).toFixed(2)}"/><text class="carte-rouen-nom" x="${R[0] + 10 * echelle}" y="${R[1] - 9 * echelle}">Rouen</text>
    </svg>`;
  }
  // relie les communes d'une carte : survol(l | null) au survol et au focus, choix(l) au clic et à Entrée / Espace
  function lier(racine, { survol = () => {}, choix = () => {} } = {}) {
    racine.querySelectorAll('.carte-lieu[data-l]').forEach(g => {
      const l = +g.dataset.l;
      g.addEventListener('mouseenter', () => survol(l)); g.addEventListener('mouseleave', () => survol(null));
      g.addEventListener('focus', () => survol(l)); g.addEventListener('blur', () => survol(null));
      g.addEventListener('click', () => choix(l));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choix(l); } });
    });
  }
  return { K, viewBox: K.viewBox, rouen: R, ENCART, fond: { pays: K.contour, belgique: K.belgique, luxembourg: K.luxembourg }, lieux: K.lieux,
    aVenir, saison, spectacle, nom, bras, trait, bout, longueur, cadre, svg, lier, mouvement };
})();
</script>
<script>
/* L'ouverture des maquettes : le logo en grand. Au clic (ou au toucher), à la molette ou au glissé vers le bas, au
   clavier (Entrée, Espace, flèche bas, Page suivante), ses tentacules ondulent et s'écartent, il grossit à toute
   vitesse et le site apparaît à travers lui. Si le visiteur a demandé moins d'animations : un simple fondu.
   build.py l'ajoute après les données D ; chaque maquette l'habille dans son univers.

   INTRO.ouvrir({ fond, degrade, image, encre, tache, mot, sortie, classe, apres })
     à appeler une fois, au chargement ; l'ouverture ne s'affiche que si l'adresse est celle de l'accueil
     fond    : la couleur du fond (par défaut #14070f)
     degrade : un dégradé radial à la place du fond : [[0, '#3a1030'], [1, '#0d0710']] (du centre vers les bords)
     image   : une image (data URL) sous le logo, en couverture, par exemple une photo assombrie
     encre   : la couleur du logo (par défaut #fff) ; tache : true pour poser le logo sur sa tache magenta
     mot     : false pour la pieuvre seule, sans « crescite »
     sortie  : 'zoom' (par défaut : le site apparaît à travers le logo qui grossit) ou 'fondu'
     classe  : une classe en plus sur .intro, pour l'habiller en CSS (.intro, .intro-logo, .intro-indice)
     apres   : appelée quand le site est révélé (le focus va ensuite au titre h1 de la page)
   INTRO.ouverte()  vrai tant que l'ouverture est affichée ; l'évènement « intro:fin » est émis sur window à la fin
   ?intro=0 dans l'adresse : pas d'ouverture (captures, tests). Changer d'adresse ferme l'ouverture sans animation. */
const INTRO = (() => {
  const L = D.logo, [TG, TETE_G, TETE_D, TD] = L.octopusPaths;
  const CIBLE = [702, 706];                         // un point plein de la tête, où le zoom s'enfonce
  const PIVOT_G = [505, 840], PIVOT_D = [1030, 840]; // là où les tentacules extérieurs rejoignent la tête
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ease = { inOut: t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2, out: t => 1 - (1 - t) ** 3, in: t => t ** 3 };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  let el = null, etat = 'ferme', opts = {}, raf = 0, inertes = [];

  function css() {
    if (document.getElementById('intro-style')) return;
    const s = document.createElement('style');
    s.id = 'intro-style';
    s.textContent = `
      html.intro-active, html.intro-active body { overflow: hidden !important; }
      .intro { position: fixed; inset: 0; z-index: 2147483000; color: #fff; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
      .intro-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .intro-logo { position: absolute; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; border-radius: 28px; color: inherit; }
      .intro-logo:focus { outline: none; }
      .intro-logo:focus-visible { outline: 2px solid currentColor; outline-offset: 10px; }
      .intro-indice { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); width: 48px; height: 48px; margin-left: -24px;
        border: 0; background: transparent; color: inherit; opacity: .85; cursor: pointer; padding: 8px; }
      .intro-indice svg { width: 100%; height: 100%; display: block; animation: intro-rebond 1.8s ease-in-out infinite; }
      @keyframes intro-rebond { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      .intro.part .intro-indice { opacity: 0; transition: opacity .2s; }
      h1[tabindex="-1"]:focus { outline: none; }
      @media (prefers-reduced-motion: reduce) { .intro-indice svg { animation: none; } }`;
    document.head.appendChild(s);
  }

  function dessin(remplissage, trou) {
    const o = opts, f = trou ? '' : ' filter="url(#intro-onde)"';
    const tache = o.tache ? `<path class="i-tache" d="${L.tachePath}" fill="${trou ? '#000' : '#BC3E80'}"/>` : '';
    if (trou && o.tache) return tache;            // posé sur sa tache, le site apparaît à travers la tache entière
    return `${tache}
      <g class="i-tg"${f}><path d="${TG}" fill="${remplissage}" fill-rule="evenodd"/></g>
      <g class="i-tete"${trou ? '' : ' filter="url(#intro-onde-tete)"'}><path d="${TETE_G}" fill="${remplissage}" fill-rule="evenodd"/><path d="${TETE_D}" fill="${remplissage}" fill-rule="evenodd"/></g>
      <g class="i-td"${f}><path d="${TD}" fill="${remplissage}" fill-rule="evenodd"/></g>
      ${o.mot === false ? '' : `<path class="i-mot" d="${L.motPath}" fill="${remplissage}"/>`}`;
  }

  // la boîte du logo, en unités du dessin
  const boite = () => opts.tache ? [63, 65, 1408, 1405] : opts.mot === false ? [250, 340, 1042, 576] : [250, 340, 1042, 780];

  function ouvrir(o = {}) {
    if (el || etat !== 'ferme') return;
    const route = location.hash.replace(/^#\/?/, '').split('?')[0];
    if (route || new URLSearchParams(location.search).get('intro') === '0') return;
    opts = o;
    css();
    const encre = o.encre || '#fff', fond = o.fond || '#14070f';
    el = document.createElement('div');
    el.className = 'intro' + (o.classe ? ' ' + o.classe : '');
    el.style.color = encre;
    const degrade = o.degrade ? `<radialGradient id="intro-degrade" cx="50%" cy="46%" r="75%">${o.degrade.map(([p, c]) => `<stop offset="${p}" stop-color="${c}"/>`).join('')}</radialGradient>` : '';
    el.innerHTML = `<svg class="intro-scene" aria-hidden="true" focusable="false">
        <defs>${degrade}
          <filter id="intro-onde" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.0085 0.012" numOctaves="2" seed="11" result="bruit"/>
            <feOffset in="bruit" dx="0" dy="0" result="flot"/>
            <feDisplacementMap in="SourceGraphic" in2="flot" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="intro-onde-tete" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="1" seed="4" result="bruit"/>
            <feOffset in="bruit" dx="0" dy="0" result="flot"/>
            <feDisplacementMap in="SourceGraphic" in2="flot" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <mask id="intro-trou" maskUnits="userSpaceOnUse" x="-100" y="-100" width="100000" height="100000">
            <rect x="-100" y="-100" width="100000" height="100000" fill="#fff"/>
            <g class="intro-monde" data-role="trou" visibility="hidden">${dessin('#000', true)}</g>
          </mask>
        </defs>
        <g mask="url(#intro-trou)">
          <rect class="intro-fond" x="-100" y="-100" width="100000" height="100000" fill="${o.degrade ? 'url(#intro-degrade)' : fond}"/>
          ${o.image ? `<image class="intro-image" href="${o.image}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"/>` : ''}
        </g>
        <circle class="intro-choc" cx="50%" cy="50%" r="0" fill="none" stroke="currentColor" stroke-width="0" style="opacity:0"/>
        <g class="intro-monde" data-role="dessin">${dessin('currentColor', false)}</g>
      </svg>
      <button class="intro-logo" type="button" aria-label="${(D.site && D.site.nom) || 'Crescite'}"></button>
      <button class="intro-indice" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>`;
    document.body.appendChild(el);
    document.documentElement.classList.add('intro-active');
    inertes = [...document.body.children].filter(n => n !== el && !n.inert && n.tagName !== 'SCRIPT');
    inertes.forEach(n => { n.inert = true; });
    etat = 'ouvert';
    placer(0);
    addEventListener('resize', surRedim);
    el.addEventListener('click', partir);
    el.addEventListener('wheel', surMolette, { passive: false });
    el.addEventListener('touchstart', surToucher, { passive: true });
    el.addEventListener('touchmove', surGlisser, { passive: false });
    addEventListener('keydown', surTouche);
    addEventListener('hashchange', fermerVite);
    if (mouvement()) repos(performance.now());
  }

  /* la mise en place : échelle de départ, position, et pour l'animation la pose de chaque partie */
  let geo = null;
  function surRedim() { if (etat === 'ouvert') placer(0); }
  function placer() {
    const W = innerWidth, H = innerHeight, [bx, by, bw, bh] = boite();
    const s0 = Math.min(W * (W < 700 ? .84 : .62) / bw, H * (opts.tache ? .7 : .56) / bh);
    const cx = W / 2, cy = H / 2 - (W < 700 ? H * .03 : 0);
    geo = { W, H, s0, cx, cy, bx, by, bw, bh };
    poser({ s: 1, aG: 0, aD: 0, ondes: 0, flot: 0, vers: 0 });
    const b = el.querySelector('.intro-logo');
    Object.assign(b.style, { left: `${cx - bw * s0 / 2}px`, top: `${cy - bh * s0 / 2}px`, width: `${bw * s0}px`, height: `${bh * s0}px` });
  }
  // s : échelle en plus de s0 ; aG, aD : rotation des tentacules (degrés) ; ondes : ampleur des ondulations ;
  // flot : défilement des ondes ; vers : 0 → 1, la cible du zoom glisse vers le centre de l'écran
  function poser({ s, aG, aD, ondes, flot, vers, rot = 0 }) {
    const { s0, cx, cy, bx, by, bw, bh, W, H } = geo, S = s0 * s;
    const centre = [bx + bw / 2, by + bh / 2];
    const cible = opts.tache ? centre : CIBLE;
    // position écran de la cible : celle du logo centré, puis glisse vers le centre de l'écran
    const ex0 = cx + (cible[0] - centre[0]) * s0, ey0 = cy + (cible[1] - centre[1]) * s0;
    const ex = ex0 + (W / 2 - ex0) * vers, ey = ey0 + (H / 2 - ey0) * vers;
    const t = `translate(${ex.toFixed(2)} ${ey.toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${S.toFixed(5)}) translate(${-cible[0]} ${-cible[1]})`;
    el.querySelectorAll('.intro-monde').forEach(g => {
      g.setAttribute('transform', t);
      g.querySelector('.i-tg')?.setAttribute('transform', `rotate(${aG.toFixed(2)} ${PIVOT_G[0]} ${PIVOT_G[1]})`);
      g.querySelector('.i-td')?.setAttribute('transform', `rotate(${aD.toFixed(2)} ${PIVOT_D[0]} ${PIVOT_D[1]})`);
    });
    const d1 = el.querySelector('#intro-onde feDisplacementMap'), o1 = el.querySelector('#intro-onde feOffset');
    const d2 = el.querySelector('#intro-onde-tete feDisplacementMap'), o2 = el.querySelector('#intro-onde-tete feOffset');
    d1.setAttribute('scale', ondes.toFixed(2)); d2.setAttribute('scale', (ondes * .35).toFixed(2));
    o1.setAttribute('dx', (flot * 1.3).toFixed(1)); o1.setAttribute('dy', (-flot).toFixed(1));
    o2.setAttribute('dx', (-flot * .6).toFixed(1)); o2.setAttribute('dy', (flot * .4).toFixed(1));
  }

  // au repos : les tentacules respirent, les ondes passent lentement
  function repos(t0) {
    const pas = now => {
      if (etat !== 'ouvert') return;
      const t = (now - t0) / 1000;
      poser({ s: 1 + Math.sin(t * 1.1) * .008, aG: Math.sin(t * .9) * 1.6, aD: -Math.sin(t * .9 + .5) * 1.6, ondes: 5 + Math.sin(t * .7) * 2, flot: t * 22, vers: 0 });
      raf = requestAnimationFrame(pas);
    };
    raf = requestAnimationFrame(pas);
  }

  /* le départ */
  function partir(e) {
    if (e) e.preventDefault?.();
    if (etat !== 'ouvert') return;
    etat = 'part';
    cancelAnimationFrame(raf);
    el.classList.add('part');
    if (!mouvement() || opts.sortie === 'fondu') return fondu(mouvement() ? 520 : 320);
    const T0 = performance.now(), TC = 520, TZ = 1250, trou = el.querySelector('[data-role="trou"]'), dessinG = el.querySelector('[data-role="dessin"]');
    const flot0 = 0;
    const pas = now => {
      const t = now - T0;
      if (t < TC) {                                        // la contraction : il se ramasse, les ondes montent
        const u = ease.inOut(t / TC);
        poser({ s: 1 - .08 * u, aG: 8 * u, aD: -8 * u, ondes: 6 + 30 * u, flot: flot0 + t * .12, vers: 0 });
      } else {                                             // l'élan : les tentacules s'ouvrent, il fonce vers nous
        const v = clamp((t - TC) / TZ), u = ease.inOut(v);
        trou.setAttribute('visibility', 'visible');
        const S = Math.exp(Math.log(.93) + u * (Math.log(opts.tache ? 14 : 46) - Math.log(.93)));
        poser({ s: S, aG: 8 - 30 * ease.out(clamp(v * 1.6)), aD: -8 + 30 * ease.out(clamp(v * 1.6)), ondes: 36 * (1 - clamp(v * 2.4)),
          flot: flot0 + t * .12, vers: ease.inOut(clamp(v * 1.4)), rot: -7 * ease.inOut(v) });
        const c = clamp(v / .55), choc = el.querySelector('.intro-choc');           // l'onde de choc
        if (choc) { choc.setAttribute('r', (geo.bw * geo.s0 * .35 + c * Math.hypot(geo.W, geo.H)).toFixed(1)); choc.style.opacity = String(.55 * (1 - c)); choc.setAttribute('stroke-width', (2.5 * (1 - c) + .5).toFixed(2)); }
        dessinG.style.opacity = String(1 - ease.out(clamp(v * 3.2)));
        if (v > .3) dessinG.querySelectorAll('[filter]').forEach(n => n.removeAttribute('filter'));   // plus d'ondes à cette échelle
        if (v > .78) el.style.opacity = String(1 - ease.in(clamp((v - .78) / .22)));
        if (v >= 1) return finir();
      }
      raf = requestAnimationFrame(pas);
    };
    raf = requestAnimationFrame(pas);
  }
  function fondu(ms) {
    el.style.transition = `opacity ${ms}ms ease`;
    requestAnimationFrame(() => { el.style.opacity = '0'; });
    setTimeout(finir, ms + 30);
  }
  function finir() {
    if (!el) return;
    cancelAnimationFrame(raf);
    removeEventListener('resize', surRedim);
    removeEventListener('hashchange', fermerVite);
    removeEventListener('keydown', surTouche);
    el.remove(); el = null; etat = 'ferme';
    document.documentElement.classList.remove('intro-active');
    inertes.forEach(n => { n.inert = false; }); inertes = [];
    try { opts.apres && opts.apres(); } catch (err) { console.error(err); }
    dispatchEvent(new Event('intro:fin'));
    const h1 = document.querySelector('main h1, h1');
    if (h1 && !location.hash.replace(/^#\/?/, '')) { if (!h1.hasAttribute('tabindex')) h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  }
  function fermerVite() { if (el) { el.style.transition = 'none'; finir(); } }

  /* les gestes */
  function surMolette(e) { e.preventDefault(); if (e.deltaY > 2) partir(); }
  let y0 = null;
  function surToucher(e) { y0 = e.touches[0].clientY; }
  function surGlisser(e) { e.preventDefault(); if (y0 !== null && y0 - e.touches[0].clientY > 24) { y0 = null; partir(); } }
  function surTouche(e) {
    if (['Enter', ' ', 'Spacebar', 'ArrowDown', 'PageDown', 'End'].includes(e.key)) { e.preventDefault(); partir(); }
  }

  return { ouvrir, ouverte: () => etat !== 'ferme', partir };
})();
</script>
<script>
(() => {
  'use strict';
  const doc = document, root = doc.documentElement;
  const $ = (s, r = doc) => r.querySelector(s);
  const $$ = (s, r = doc) => Array.from(r.querySelectorAll(s));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
  const reduit = matchMedia('(prefers-reduced-motion: reduce)');
  const souris = matchMedia('(hover: hover) and (pointer: fine)');
  const mobile = matchMedia('(max-width: 760px)');
  const replie = matchMedia('(max-width: 1279px)');
  const doux = () => !reduit.matches;

  // Tout le texte vient de D (le site d'origine)
  const S = D.site, LIB = S.libelles, SHOWS = D.shows;
  const PAR_SLUG = Object.assign(Object.create(null), Object.fromEntries(SHOWS.map(s => [s.slug, s])));
  const MENU = Object.fromEntries(S.menu.map(m => [m.id, m]));
  const SAISON = S.saisons[0];
  const SLIDES = S.diaporama.filter(x => D.photos[x.slug]);
  const LUM = '#ffd9a8';
  const FL = '<span class="fl" aria-hidden="true">→</span>';
  const photo = slug => D.photos[slug] || '';
  const cadrage = s => `${s && s.focale != null ? s.focale : 50}% 35%`;
  const couleur = slug => (PAR_SLUG[slug] && PAR_SLUG[slug].couleur) || LUM;
  const bloc = h => /^\s*<(h\d|ul|ol|p|div|blockquote)\b/i.test(h) ? h : `<p>${h}</p>`;
  const ext = url => `href="${esc(url)}" rel="noopener"`;

  /* En-tête : la pieuvre, le mot, les six onglets */
  $('#marque').setAttribute('aria-label', S.nom);
  $('#marque-pieuvre').innerHTML = D.logo.octopus;
  (function mot() {
    const cible = $('#marque-mot'), NS = 'http://www.w3.org/2000/svg';
    const tmp = doc.createElementNS(NS, 'svg');
    tmp.setAttribute('style', 'position:absolute;left:-9999px;top:0;width:10px;height:10px;visibility:hidden');
    const p = doc.createElementNS(NS, 'path');
    p.setAttribute('d', D.logo.motPath);
    tmp.appendChild(p);
    doc.body.appendChild(tmp);
    let svg = '';
    try {
      const b = p.getBBox();
      if (b.width > 0) svg = `<svg viewBox="${b.x - 2} ${b.y - 2} ${b.width + 4} ${b.height + 4}" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="${D.logo.motPath}"/></svg>`;
    } catch (e) { svg = ''; }
    tmp.remove();
    if (svg) cible.innerHTML = svg;
    else { cible.textContent = S.titreSuffixe; cible.classList.add('texte'); }
  })();
  const icone = doc.createElement('link');
  icone.rel = 'icon';
  icone.href = 'data:image/svg+xml,' + encodeURIComponent(D.logo.mark);
  doc.head.appendChild(icone);
  $('#nav').setAttribute('aria-label', LIB.menu);
  $('#nav-liste').innerHTML = S.menu.map(m => `<li><a href="${esc(m.href)}" data-nav="${esc(m.id)}">${esc(m.texte)}</a></li>`).join('');
  $('#menu-txt').textContent = LIB.menu;

  /* Pied de page */
  const CO = S.coordonnees;
  $('#pied').innerHTML = `<div class="wrap">
    <div class="pied-grille">
      <a class="pied-logo" href="#/" aria-label="${esc(S.nom)}"><span aria-hidden="true">${D.logo.octopusWord}</span></a>
      <address class="pied-coord"><span class="pied-nom">${esc(CO.nom)}</span>${CO.adresse.map(l => `<span>${esc(l)}</span>`).join('')}</address>
      <ul class="pied-liens">
        <li><a class="lien" href="${esc(S.ecrire.href)}">${esc(S.ecrire.texte)}</a></li>
        <li>${S.facebook.href ? `<a class="lien" ${ext(S.facebook.href)}>${esc(S.facebook.texte)}</a>` : `<span class="pied-fb">${esc(S.facebook.texte)}</span>`}</li>
      </ul>
      <p class="pied-part">${S.partenaires}</p>
    </div>
    <div class="pied-bas">
      <p class="pied-legal">${CO.legal.map(l => `<span>${esc(l)}</span>`).join('')}</p>
      <ul class="pied-legaux">${S.liensLegaux.map(l => `<li><a class="lien" href="${esc(l.href)}">${esc(l.texte)}</a></li>`).join('')}</ul>
    </div>
  </div>`;

  /* La carte des tournées : des faisceaux de lumière de Rouen vers chaque commune, les communes comme des lampes de scène */
  const R = CARTE.rouen;
  const loin = xy => Math.hypot(xy[0] - R[0], xy[1] - R[1]) >= 6;
  let nSvg = 0, nBoite = 0;
  const aBrancher = [];
  function carteSvg({ lieux = [], passe = [], poussiere = false, titre = '', teinte = false, souvenir = false }) {
    const id = 'cl' + (++nSvg), anime = CARTE.mouvement() && lieux.length > 0;
    const vb = CARTE.cadre([...lieux, ...passe], { marge: 44, min: 220 });
    const [bx, by, bw, bh] = vb.split(/\s+/).map(Number);
    const e = Math.max(bw, bh) / 800, k = n => +(n * e).toFixed(2);
    const pas = Math.min(.075, 1.6 / Math.max(1, lieux.length));
    const tempo = lieux.map((x, i) => {
      const L = loin(x.xy) ? CARTE.longueur(x.xy) + 2 : 0;
      return { L, d: +(.15 + i * pas).toFixed(2), t: +(L ? .45 + (L / e) / 900 : .2).toFixed(2) };
    });
    const st = j => `--d:${tempo[j].d}s;--t:${tempo[j].t}s`;
    const etiquette = x => `${CARTE.nom(x)}${x.dates && x.dates.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    const halos = lieux.map((x, j) => tempo[j].L ? `<path class="cl-halo cl-trace" data-l="${x.l}" d="${CARTE.trait(x.xy)}" style="--L:${tempo[j].L};${st(j)}"/>` : '').join('');
    const coeurs = lieux.map((x, j) => tempo[j].L ? `<path class="cl-faisceau cl-trace" data-l="${x.l}" d="${CARTE.trait(x.xy)}" style="--L:${tempo[j].L};${st(j)}"/><path class="cl-pulse" data-l="${x.l}" d="${CARTE.trait(x.xy)}" style="--L:${tempo[j].L};--p:${k(18)}"/>` : '').join('');
    const lampes = lieux.map((x, j) => {
      const [cx, cy] = x.xy;
      return `<g class="carte-lieu cl-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}" style="${st(j)};--r:${((x.l * 37) % 23) / 10}s">
        <circle class="cl-aura" cx="${cx}" cy="${cy}" r="${k(13)}" fill="url(#${id}-a)"/>
        <circle class="cl-anneau" cx="${cx}" cy="${cy}" r="${k(6.5)}"/>
        <circle class="cl-lampe" cx="${cx}" cy="${cy}" r="${k(2.3)}"/>
        <circle cx="${cx}" cy="${cy}" r="${k(11)}" fill="transparent"/>
      </g>`;
    }).join('');
    const pris = new Set([...lieux, ...passe].map(x => x.l));
    const pous = poussiere ? `<g class="cl-poussiere" aria-hidden="true">${CARTE.lieux.map((x, l) => pris.has(l) ? '' : `<circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${k(1.25)}"/>`).join('')}</g>` : '';
    const passes = passe.length ? `<g aria-hidden="true">${passe.filter(x => loin(x.xy)).map(x => `<path class="cl-passe" d="${CARTE.trait(x.xy)}"/>`).join('')}${passe.map(x => `<circle class="cl-passe-pt" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${k(1.6)}"/>`).join('')}</g>` : '';
    return `<svg class="cl${teinte ? ' cl--teinte' : ''}${souvenir ? ' cl--souvenir' : ''}${anime ? ' attend' : ''}" viewBox="${vb}" style="--e:${e.toFixed(3)}" role="group" aria-label="${esc(titre)}">
      <defs>
        <radialGradient id="${id}-a"><stop offset="0" stop-color="#fffaf0"/><stop offset=".16" class="cl-s1"/><stop offset=".45" class="cl-s2"/><stop offset="1" class="cl-s3"/></radialGradient>
        <filter id="${id}-f" filterUnits="userSpaceOnUse" x="${bx - 60}" y="${by - 60}" width="${bw + 120}" height="${bh + 120}"><feGaussianBlur stdDeviation="${k(2.8)}"/></filter>
      </defs>
      <path class="cl-voisin" d="${CARTE.fond.belgique}"/><path class="cl-voisin" d="${CARTE.fond.luxembourg}"/><path class="cl-pays" d="${CARTE.fond.pays}"/>
      ${pous}${passes}
      <g filter="url(#${id}-f)" aria-hidden="true">${halos}</g>
      <g aria-hidden="true">${coeurs}</g>
      <g aria-hidden="true"><circle class="cl-rouen-aura" cx="${R[0]}" cy="${R[1]}" r="${k(30)}" fill="url(#${id}-a)"/><circle class="cl-rouen-coeur" cx="${R[0]}" cy="${R[1]}" r="${k(3.4)}"/></g>
      <text class="cl-rouen-nom" x="${(R[0] + k(8)).toFixed(1)}" y="${(R[1] - k(10)).toFixed(1)}" font-size="${k(15)}">Rouen</text>
      <g>${lampes}</g>
    </svg>`;
  }
  function boiteCarte(o) {
    const id = 'carte-' + (++nBoite);
    aBrancher.push({ id, ...o });
    return `<figure class="carte-boite${o.seule ? ' carte-boite--seule' : ''}" id="${id}">${carteSvg(o)}<figcaption class="cl-legende" aria-hidden="true"></figcaption></figure>`;
  }
  const ligneLegende = d => d.ligneDate
    ? `<span class="cl-ll"><span>${esc(d.ligneDate)}</span><span class="cl-t">${esc(d.titre)}</span></span>`
    : `<span class="cl-ll"><span>${esc(d.ligne)}</span>${d.spectacle ? `<span class="cl-t">${esc(d.spectacle)}</span>` : ''}</span>`;
  const legende = x => x ? `<span class="cl-legende-nom">${esc(CARTE.nom(x))}</span>${(x.dates || []).slice(0, 3).map(ligneLegende).join('')}` : '';
  function brancherCarte({ id, lieux = [], liste, defaut = null }) {
    const boite = doc.getElementById(id);
    if (!boite) return;
    const svg = $('svg', boite), leg = $('.cl-legende', boite);
    const ul = liste ? doc.getElementById(liste) : null;
    const parL = new Map(lieux.map(x => [x.l, x]));
    let garde = null;
    const montrer = l => {
      const vise = l ?? garde;
      const actif = vise ?? (parL.has(defaut) ? defaut : null);
      $$('[data-l]', svg).forEach(n => n.classList.toggle('on', actif !== null && +n.dataset.l === actif));
      svg.classList.toggle('choisi', vise != null);
      if (ul) {
        const lies = vise != null ? $$(`[data-l="${vise}"]`, ul) : [];
        ul.classList.toggle('choisi', lies.length > 0);
        $$('[data-l]', ul).forEach(n => n.classList.toggle('on', lies.includes(n)));
      }
      leg.innerHTML = legende(parL.get(actif));
    };
    CARTE.lier(svg, {
      survol: l => montrer(l),
      choix: l => {
        garde = garde === l ? null : l;
        montrer(null);
        const li = garde !== null && ul ? $(`[data-l="${garde}"]`, ul) : null;
        if (li) li.scrollIntoView({ block: 'nearest', behavior: doux() ? 'smooth' : 'auto' });
      },
    });
    boite.addEventListener('keydown', e => { if (e.key === 'Escape' && garde !== null) { garde = null; montrer(null); } });
    if (ul) $$('[data-l]', ul).forEach(li => {
      const l = +li.dataset.l;
      if (!parL.has(l)) return;
      li.addEventListener('mouseenter', () => montrer(l));
      li.addEventListener('mouseleave', () => montrer(null));
      li.addEventListener('focusin', () => montrer(l));
      li.addEventListener('focusout', () => montrer(null));
    });
    montrer(null);
    if (svg.classList.contains('attend')) {           // les faisceaux partent de Rouen quand la carte entre en scène
      const go = () => { svg.classList.remove('attend'); svg.classList.add('joue'); };
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { io.disconnect(); go(); } }, { threshold: .3 });
        io.observe(svg);
        nettoyer.push(() => io.disconnect());
      } else go();
    }
  }

  /* Les lignes de date, telles quelles */
  const MOIS = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}/gi;
  const moisDe = d => ((d.ligneDate || '').match(MOIS) || [d.ligneDate || '']).pop();
  const detail = x => `<p class="date-d">${x.lien ? `<a class="lien" ${ext(x.lien)}>${esc(x.texte)}</a>` : esc(x.texte)}</p>`;
  function uneDate(d, { titre = true, hn = 3 } = {}) {
    return `<li class="date"${d.l != null ? ` data-l="${d.l}"` : ''} style="--c:${esc(couleur(d.slug))}">
      <div class="date-a"><p class="date-quand">${esc(d.ligneDate)}</p><p class="date-ou">${esc(d.ligneLieu)}</p></div>
      <div class="date-b">${titre ? `<h${hn} class="date-t"><a href="#/spectacle/${esc(d.slug)}">${esc(d.titre)}</a></h${hn}>` : ''}${(d.details || []).map(detail).join('')}</div>
    </li>`;
  }
  function parMois(liste) {
    const g = [];
    liste.forEach(d => { const m = moisDe(d); if (!g.length || g[g.length - 1].m !== m) g.push({ m, l: [] }); g[g.length - 1].l.push(d); });
    return g.map(x => `<div class="mois"><h2 class="mois-t">${esc(x.m)}</h2><ol class="dates">${x.l.map(d => uneDate(d)).join('')}</ol></div>`).join('');
  }

  /* La scène : la photo plein écran, le halo qui suit la souris */
  function visuel(src, focale, credit, double) {
    const img = on => `<img class="ph${on ? ' on' : ''}"${on ? ` src="${src}"` : ''} alt="" aria-hidden="true" style="object-position:${focale}% 35%" decoding="async">`;
    return `<div class="scene-visuel">${img(true)}${double ? img(false) : ''}<div class="spot" aria-hidden="true"></div><div class="ombre" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>${credit ? `<p class="credit">${esc(credit)}</p>` : ''}</div>`;
  }
  function halo(sc) {
    const spot = $('.spot', sc);
    let x = 50, y = 40, tx = 50, ty = 40, raf = 0;
    const poser = () => { spot.style.setProperty('--sx', x.toFixed(2) + '%'); spot.style.setProperty('--sy', y.toFixed(2) + '%'); };
    const repos = () => { x = tx = +(sc.dataset.focale || 50); y = ty = 38; poser(); };
    const boucle = () => {
      x += (tx - x) * .1; y += (ty - y) * .1; poser();
      raf = Math.abs(tx - x) + Math.abs(ty - y) > .05 ? requestAnimationFrame(boucle) : 0;
    };
    repos();
    sc.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || !souris.matches || reduit.matches || mobile.matches) return;
      const r = sc.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width * 100; ty = (e.clientY - r.top) / r.height * 100;
      sc.classList.add('lumiere');
      if (!raf) raf = requestAnimationFrame(boucle);
    });
    sc.addEventListener('pointerleave', () => sc.classList.remove('lumiere'));
    return { repos: () => { if (!sc.classList.contains('lumiere')) { cancelAnimationFrame(raf); raf = 0; repos(); } } };
  }

  /* Accueil : le bandeau d'origine, une photo à la fois */
  let actif = 0, pauseVoulue = false, nettoyer = [];
  const ICO_PAUSE = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="2.6" height="10"/><rect x="7.4" y="1" width="2.6" height="10"/></svg>';
  const ICO_LIRE = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.2v9.6L10.6 6z"/></svg>';
  function texteScene(x) {
    const s = PAR_SLUG[x.slug];

  function sceneAccueil() {

  function brancherCarrousel(sc) {
    const onglets = $$('.titre', sc), panneau = $('#scene-panneau', sc), calques = $$('.ph', sc);
    const rangee = $('.titres', sc), btnPause = $('#pause', sc), credit = $('.credit', sc);
    const lumiere = halo(sc);
    let montre = actif, occupe = false, attente = null, survolT = 0, arret = false;
    const pauses = { survol: false, focus: false, vue: false, page: false, user: pauseVoulue, intro: INTRO.ouverte() };
    const etat = () => {
      const joue = !arret && !reduit.matches && !Object.values(pauses).some(Boolean);
      sc.classList.toggle('joue', joue);
      panneau.setAttribute('aria-live', joue ? 'off' : 'polite');
    };
    const versOnglet = i => {
      if (rangee.scrollWidth <= rangee.clientWidth + 2) return;
      const pad = parseFloat(getComputedStyle(rangee).paddingLeft) || 0;
      rangee.scrollTo({ left: Math.max(0, onglets[i].offsetLeft - pad), behavior: doux() ? 'smooth' : 'auto' });
    };
    const peindre = i => {
      montre = i;
      const x = SLIDES[i], s = PAR_SLUG[x.slug];
      const vu = calques.find(c => c.classList.contains('on')) || calques[0], neuf = calques.find(c => c !== vu);
      neuf.src = photo(x.slug);
      neuf.style.objectPosition = cadrage(s);
      const montrer = () => { neuf.classList.add('on'); vu.classList.remove('on'); };
      (neuf.decode ? neuf.decode() : Promise.resolve()).then(montrer, montrer);
      sc.style.setProperty('--c', couleur(x.slug));
      sc.dataset.focale = s && s.focale != null ? s.focale : 50;
      lumiere.repos();
      const ecrire = () => {
        panneau.innerHTML = texteScene(x);
        panneau.setAttribute('aria-labelledby', 'titre-' + i);
        panneau.classList.remove('sort');
        if (credit) credit.textContent = x.credit || '';
      };
      if (reduit.matches) ecrire(); else { panneau.classList.add('sort'); setTimeout(ecrire, 260); }
    };
    const file = i => {
      if (occupe) { attente = i; return; }
      if (i === montre) return;
      occupe = true;
      peindre(i);
      setTimeout(() => { occupe = false; if (attente !== null) { const a = attente; attente = null; file(a); } }, reduit.matches ? 0 : 640);
    };
    const choisir = (i, focus) => {
      if (i !== actif) {
        actif = i;
        onglets.forEach((t, k) => { t.setAttribute('aria-selected', String(k === i)); t.tabIndex = k === i ? 0 : -1; });
        file(i);
        versOnglet(i);
      }
      if (focus) onglets[i].focus();
    };
    onglets.forEach((t, i) => {
      t.addEventListener('click', () => choisir(i));
      t.addEventListener('focus', () => choisir(i));
      t.addEventListener('pointerenter', e => { if (e.pointerType !== 'mouse') return; clearTimeout(survolT); survolT = setTimeout(() => choisir(i), 110); });
      t.addEventListener('pointerleave', () => clearTimeout(survolT));
      t.addEventListener('keydown', e => {
        const n = onglets.length, k = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
        if (k !== undefined) { e.preventDefault(); choisir(k, true); }
      });
    });
    sc.addEventListener('animationend', e => { if (!arret && e.animationName === 'fil' && sc.classList.contains('joue')) choisir((actif + 1) % SLIDES.length); });
    sc.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { pauses.survol = true; etat(); } });
    sc.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { pauses.survol = false; etat(); } });
    sc.addEventListener('focusin', () => { pauses.focus = true; etat(); });
    sc.addEventListener('focusout', e => { if (!sc.contains(e.relatedTarget)) { pauses.focus = false; etat(); } });
    btnPause.addEventListener('click', () => {
      pauseVoulue = pauses.user = !pauses.user;
      btnPause.setAttribute('aria-pressed', String(pauseVoulue));
      btnPause.innerHTML = pauseVoulue ? ICO_LIRE : ICO_PAUSE;

    const io = 'IntersectionObserver' in window ? new IntersectionObserver(([e]) => { pauses.vue = e.intersectionRatio < .4; etat(); }, { threshold: [0, .4, 1] }) : null;
    if (io) io.observe(sc);
    const visible = () => { pauses.page = doc.hidden; etat(); };
    const finIntro = () => { pauses.intro = false; etat(); };
    doc.addEventListener('visibilitychange', visible);
    addEventListener('intro:fin', finIntro);
    reduit.addEventListener('change', etat);
    etat();
    versOnglet(actif);
    nettoyer.push(() => { arret = true; etat(); if (io) io.disconnect(); doc.removeEventListener('visibilitychange', visible); removeEventListener('intro:fin', finIntro); reduit.removeEventListener('change', etat); clearTimeout(survolT); });
  }

    root.classList.remove('fige');
    menuBtn.setAttribute('aria-expanded', 'false');
    if (rendreFocus) menuBtn.focus();
  }
  menuBtn.addEventListener('click', () => {
    const ouvert = !tete.classList.contains('ouvert');
    tete.classList.toggle('ouvert', ouvert);
    root.classList.toggle('fige', ouvert);
    menuBtn.setAttribute('aria-expanded', String(ouvert));
    if (ouvert) $('.nav a', tete).focus();
  });
  doc.addEventListener('keydown', e => { if (e.key === 'Escape') fermerMenu(true); });
  replie.addEventListener('change', () => fermerMenu(false));
  const enTete = () => tete.classList.toggle('plein', !surPhoto || scrollY > 24);
  addEventListener('scroll', enTete, { passive: true });
  main.addEventListener('submit', e => e.preventDefault());   // l'envoi ne fait rien

  function route() {
    const h = location.hash.startsWith('#/') ? location.hash.slice(2).split('?')[0] : '';
    const p = h.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    if (!p.length) return { cle: 'accueil' };
    if (p.length === 1 && p[0] === 'spectacles') return { cle: 'spectacles', nav: 'spectacles' };
    if (p[0] === 'agenda' && p.length === 1) return { cle: 'agenda', nav: 'agenda' };
    if (p[0] === 'agenda' && p.length === 2 && D.saisons[p[1]]) return p[1] === SAISON.saison ? { cle: 'agenda', nav: 'agenda' } : { cle: 'saison:' + p[1], nav: 'agenda', saison: p[1] };
    if (p[0] === 'spectacle' && p.length === 2 && PAR_SLUG[p[1]]) return { cle: 'spectacle:' + p[1], nav: 'spectacles', show: PAR_SLUG[p[1]] };
    if (p.length === 1) {
      const m = S.menu.find(x => x.href === '#/' + p[0]);
      if (m) return { cle: m.id, nav: m.id };
      if (S.legal[p[0]]) return { cle: 'legal:' + p[0], legal: p[0] };
    }
    return { cle: 'accueil', inconnue: true };
  }
  const PAGES = { spectacles: pageSpectacles, agenda: pageAgenda, compagnie: pageCompagnie, actions: pageActions, pro: pagePro, contact: pageContact };
  function router() {
    const h = location.hash;
    if (h && !h.startsWith('#/') && vue) return;
    const r = route();
    if (r.inconnue) history.replaceState(null, '', location.pathname + location.search + '#/');
    fermerMenu(false);
    if (r.cle === vue) { scrollTo({ top: 0, behavior: doux() ? 'smooth' : 'auto' }); return; }
    nettoyer.forEach(f => f()); nettoyer = [];
    aBrancher.length = 0;
    vue = r.cle;
    let titre;
    if (r.cle === 'accueil') { main.innerHTML = accueil(); titre = S.accueil; }
    else if (r.saison) { main.innerHTML = pageSaison(r.saison); titre = (S.saisons.find(x => x.saison === r.saison) || D.saisons[r.saison]).titre; }
    else if (r.show) { main.innerHTML = pageSpectacle(r.show); titre = r.show.titre; }
    else if (r.legal) { main.innerHTML = pageLegal(r.legal); titre = S.legal[r.legal].titre; }
    else { main.innerHTML = PAGES[r.cle](); titre = r.cle === 'pro' ? S.pro.titrePage : MENU[r.cle].texte; }
    doc.title = `${titre} - ${S.titreSuffixe}`;
    $$('.nav a').forEach(a => { if (a.dataset.nav === r.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const sc = $('#scene', main);
    surPhoto = !!sc;
    if (sc && r.cle === 'accueil') brancherCarrousel(sc); else if (sc) halo(sc);
    if (r.cle === 'spectacles') brancherRep();
    aBrancher.splice(0).forEach(brancherCarte);
    scrollTo(0, 0);
    const t = $('h1[tabindex="-1"]', main);
    if (t && !INTRO.ouverte()) t.focus({ preventScroll: true });
    enTete();
  }
  doc.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.getAttribute('href') === location.hash) { e.preventDefault(); router(); }
  });
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  addEventListener('hashchange', router);
  router();

  /* L'ouverture : le noir, une photo à peine éclairée, le logo blanc ; il grossit et la scène s'allume */
  INTRO.ouvrir({
    fond: '#0b0809',
    image: SLIDES.length ? photo(SLIDES[0].slug) : undefined,
    encre: '#f4eee9',
    classe: 'm07-intro',
    apres: () => {
      const sc = $('.scene--accueil', main);
      if (!sc || !doux()) return;
      sc.classList.remove('allumage'); void sc.offsetWidth; sc.classList.add('allumage');
    },
  });
})();
</script>
</body>
</html>
