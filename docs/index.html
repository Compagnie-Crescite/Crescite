<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes · Crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* La planche : une barre d'onglets, une maquette par onglet, chargée en plein écran juste en dessous. */
:root {
  --nuit: #150a11; --nuit-2: #2a1a23; --clair: #f7ecf1; --gris-clair: #c9b7c1; --fond: #f6f1ea; --encre: #1b1216; --gris: #62565c; --filet: #ddd3c6;
  --magenta: #bc3e80; --magenta-vif: #f4a3cc;
  --serif: "Bodoni Moda", Didot, serif; --sans: "Instrument Sans", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); background: #3a3036; color: var(--encre); font: 400 1rem/1.5 var(--sans); overflow: hidden; }
:focus-visible { outline: 2px solid var(--magenta-vif); outline-offset: 2px; }
[hidden] { display: none !important; }

.barre { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px; background: var(--nuit); color: var(--clair); position: relative; z-index: 3; }
.barre .titre { font: italic 500 1.05rem var(--serif); white-space: nowrap; }
.onglets { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.onglets::-webkit-scrollbar { display: none; }
.onglets [role="tab"] { flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 11px; border: 0; border-radius: 7px; background: none; color: var(--gris-clair); font: 600 .9rem var(--sans); cursor: pointer; white-space: nowrap; }
.onglets [role="tab"] small { font-size: .78rem; font-variant-numeric: tabular-nums; opacity: .75; }
.onglets [role="tab"]:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.onglets [role="tab"][aria-selected="true"] { color: var(--nuit); background: var(--clair); }
.onglets [role="tab"].syn { color: var(--magenta-vif); }
.onglets [role="tab"].syn[aria-selected="true"] { color: #fff; background: var(--magenta); }
.outils { display: flex; align-items: center; gap: 6px; flex: none; }
.taille { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .08); }
.taille button, .outil { border: 0; background: none; color: var(--gris-clair); font: 600 .85rem var(--sans); padding: 6px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.taille button[aria-pressed="true"] { background: var(--clair); color: var(--nuit); }
.outil:hover, .taille button:hover { color: #fff; }
.outil[aria-expanded="true"] { background: var(--clair); color: var(--nuit); }

.scene { position: relative; min-height: 0; display: grid; justify-items: center; align-items: start; overflow: auto; }
#cadre { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.scene.tel { padding: 16px 0; }
.scene.tel #cadre { width: 390px; max-width: calc(100% - 24px); height: min(844px, calc(100% - 8px)); border-radius: 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); }

/* le panneau À propos : le mode d'emploi de la maquette affichée, avec des schémas */
.infos { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, 100%); overflow-y: auto; background: var(--fond); box-shadow: -24px 0 60px rgba(0, 0, 0, .35); padding: 26px clamp(18px, 3vw, 34px) 40px; z-index: 2; }
.infos h2 { margin: 0 0 6px; font: italic 500 1.9rem/1.1 var(--serif); }
.infos h3 { display: flex; align-items: center; gap: 10px; margin: 32px 0 12px; font: italic 500 1.35rem/1.2 var(--serif); }
.infos h3 .no { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--encre); color: var(--fond); font: normal 700 .8rem/1 var(--sans); }
.infos .niv { margin: 0; font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.infos .fermer { position: sticky; top: 0; float: right; margin: -10px -10px 0 0; border: 1px solid var(--filet); background: #fff; border-radius: 999px; padding: 6px 12px; font: 600 .85rem var(--sans); cursor: pointer; }
.infos p, .infos li { max-width: 62ch; }
.infos a { color: #a8306f; }
.infos code { font-size: .88em; padding: 1px 5px; border-radius: 5px; background: #fff; border: 1px solid var(--filet); }
.infos .ici { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: #fff; border: 1px solid var(--filet); }
.points { margin: 12px 0 0; padding-left: 1.1em; }
.points li { margin-bottom: 5px; }
.infos .note { margin: 8px 0 0; font-size: .9rem; color: var(--gris); }
.liens { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0 0; font-weight: 600; font-size: .92rem; }
/* les schémas : des boîtes et des traits, qui se rangent en colonne sur un téléphone */
.schema { margin: 0; padding: 16px; border-radius: 14px; background: #fff; border: 1px solid var(--filet); }
.schema small { display: block; margin-top: 2px; font-size: .8rem; line-height: 1.35; color: var(--gris); font-weight: 400; }
.trait { display: block; width: 2px; height: 18px; margin: 6px auto; background: var(--filet); }
.plan .ouverture { margin: 0 auto; max-width: 300px; padding: 10px 14px; border-radius: 999px; text-align: center; font-weight: 700; background: var(--nuit); color: var(--clair); }
.plan .ouverture small { color: var(--gris-clair); }
.entrees { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.entrees li { padding: 10px 12px; border-radius: 10px; background: var(--fond); border-top: 4px solid var(--c); font-weight: 700; line-height: 1.25; }
.entrees .voir { --c: #bc3e80; } .entrees .prog { --c: #b08a1e; } .entrees .etab { --c: #1f7a70; }
.second { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px dashed var(--filet); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.second li { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--filet); font-size: .85rem; font-weight: 600; }
.flux { counter-reset: etape; list-style: none; }
.flux li { position: relative; counter-increment: etape; padding: 2px 0 16px 40px; }
.flux li:last-child { padding-bottom: 0; }
.flux li::before { content: counter(etape); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--magenta); color: #fff; font: 700 .8rem/1 var(--sans); }
.flux li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 30px; bottom: 2px; width: 2px; background: color-mix(in srgb, var(--magenta) 35%, transparent); }
.reseau { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.reseau .esp { padding: 10px 12px; border-radius: 10px; background: var(--fond); border: 1px solid var(--filet); font-weight: 700; line-height: 1.25; }
.reseau .lien-base { grid-column: span 1; display: block; width: 2px; height: 16px; margin: 4px auto; background: var(--magenta); }
.reseau .coeur { grid-column: 1 / -1; padding: 12px 14px; border-radius: 12px; text-align: center; background: var(--magenta); color: #fff; font-weight: 700; }
.reseau .coeur small { color: #fbe3ef; }
.tuiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
.tuiles li { padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--filet); font-size: .85rem; line-height: 1.35; color: var(--gris); }
.tuiles b { display: block; margin-bottom: 2px; font-size: .93rem; color: var(--encre); }

@media (max-width: 900px) { .barre .titre { display: none; } }
@media (max-width: 700px) { .taille { display: none; } }
</style>
</head>
<body>
<header class="barre">
  <span class="titre">Crescite · maquettes</span>
  <div class="onglets" role="tablist" aria-label="Les maquettes" id="onglets"></div>
  <div class="outils">
    <div class="taille" role="group" aria-label="Écran"><button type="button" data-taille="bureau" aria-pressed="true">Ordinateur</button><button type="button" data-taille="tel" aria-pressed="false">Téléphone</button></div>
    <a class="outil" id="direct" href="#" target="_blank" rel="noopener" title="Ouvrir la maquette seule, dans un nouvel onglet" hidden>Seule ↗</a>
    <button class="outil" type="button" id="bouton-infos" aria-expanded="false" aria-controls="infos">À propos</button>
  </div>
</header>
<main class="scene" id="scene" role="tabpanel">
  <iframe id="cadre" title="Maquette"></iframe>
  <aside class="infos" id="infos" aria-labelledby="infos-titre" hidden></aside>
</main>
<script>const P = {"web":true,"pages":["m01","m02","m03","m04","m05","m06","m07","m08","m09","m10","synthese"]};</script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* les dix, de la plus sobre à la plus évoluée, puis la synthèse */
  const M = [
    { n: 'm01', court: 'Programme', nom: 'Le programme de salle', niveau: 'La plus sobre', voit: 'Les trois entrées en tête, chacune avec sa photo, puis la carte gravée' },
    { n: 'm02', court: 'Maison', nom: 'La maison', niveau: 'Sobre', voit: 'Les trois entrées sous le logo, puis le spectacle à l’affiche' },
    { n: 'm03', court: 'Saison', nom: 'La saison', niveau: 'L’agenda d’abord', voit: 'Les trois entrées, puis la saison et sa carte' },
    { n: 'm04', court: 'Trois portes', nom: 'Trois portes', niveau: 'Le public d’abord', voit: 'Trois grandes portes en arche, une par entrée' },
    { n: 'm05', court: 'Magenta', nom: 'Magenta', niveau: 'La marque en grand', voit: 'Le bandeau « EN TOURNÉE », puis trois portes teintées de leur couleur' },
    { n: 'm06', court: 'Tournée', nom: 'Les bras de la tournée', niveau: 'La tentacule comme thème', voit: 'La carte : les tournées partent de Rouen comme des tentacules' },
    { n: 'm07', court: 'Noir', nom: 'Le noir et la lumière', niveau: 'Théâtral', voit: 'Une photo de spectacle en plein écran, puis trois portes qui s’éclairent' },
    { n: 'm08', court: 'Sommaire', nom: 'Le sommaire', niveau: 'Éditorial', voit: 'Le sommaire des trois entrées, et l’aperçu de celle qu’on survole' },
    { n: 'm09', court: 'Chapitres', nom: 'Un spectacle par écran', niveau: 'Chapitres', voit: 'Trois grands panneaux photo, un par entrée, puis un écran par spectacle' },
    { n: 'm10', court: 'Pieuvre', nom: 'La pieuvre vivante, rangée', niveau: 'La plus évoluée', voit: 'La pieuvre : un bras se tend vers l’entrée ou le titre survolé' },
  ];
  const SYN = { n: 'synthese', num: 'S', court: 'Synthèse', nom: 'La synthèse : la 06, enrichie', niveau: 'La proposition retenue, en site complet',
    voit: 'La carte des tournées de la 06, qui part de Rouen, puis les trois entrées en bandes de couleur sur leur photo' };
  const TOUTES = [...M, SYN];
  const num = m => m.num || m.n.slice(1);
  // la planche en fichier embarque chaque maquette ; la planche en ligne (P.web) charge les pages publiées à côté d'elle
  const dispo = n => (P.web ? (P.pages || []).includes(n) : !!(P.sources && P.sources[n]));
  const LISTE = TOUTES.filter(m => dispo(m.n));
  const data = P.web ? '' : JSON.stringify(P.D).replace(/<\//g, '<\\/');
  // dans un cadre srcdoc, les liens « #/… » se résoudraient sur l'adresse de la planche : on fixe la base
  const page = n => P.sources[n].replace('/*__DATA__*/null', () => data).replace(/<head[^>]*>/i, h => h + '<base href="about:srcdoc">');

  const onglets = $('#onglets'), cadre = $('#cadre'), scene = $('#scene'), infos = $('#infos'), boutonInfos = $('#bouton-infos'), direct = $('#direct');
  onglets.innerHTML = LISTE.map(m => `<button type="button" role="tab" id="o-${m.n}" aria-controls="scene" aria-selected="false" tabindex="-1"${m.n === 'synthese' ? ' class="syn"' : ''} title="${esc(num(m) + ' · ' + m.nom)}">${m.n === 'synthese' ? '' : `<small>${num(m)}</small>`}${esc(m.court)}</button>`).join('');
  const tabs = [...onglets.querySelectorAll('[role="tab"]')];
  let courante = null;

  function montrer(n, focus) {
    const m = LISTE.find(x => x.n === n) || LISTE[0];
    if (!m) return;
    courante = m;
    tabs.forEach(t => { const on = t.id === 'o-' + m.n; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on) { t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); if (focus) t.focus(); } });
    scene.setAttribute('aria-labelledby', 'o-' + m.n);
    cadre.title = `Maquette ${num(m)} : ${m.nom}`;
    if (P.web) { cadre.removeAttribute('srcdoc'); cadre.src = `${m.n}.html`; direct.href = `${m.n}.html`; direct.hidden = false; }
    else { cadre.srcdoc = page(m.n); }
    document.title = `${num(m)} · ${m.nom} · Maquettes Crescite`;
    if (location.hash !== '#' + m.n) history.replaceState(null, '', '#' + m.n);
    if (!infos.hidden) remplirInfos();
  }
  tabs.forEach((t, k) => {
    t.addEventListener('click', () => montrer(t.id.slice(2)));
    t.addEventListener('keydown', e => {
      const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key], fin = { Home: 0, End: tabs.length - 1 }[e.key];
      if (d === undefined && fin === undefined) return;
      e.preventDefault();
      const cible = tabs[fin !== undefined ? fin : (k + d + tabs.length) % tabs.length];
      montrer(cible.id.slice(2), true);
    });
  });

  /* ordinateur ou téléphone */
  document.querySelectorAll('[data-taille]').forEach(b => b.addEventListener('click', () => {
    const tel = b.dataset.taille === 'tel';
    scene.classList.toggle('tel', tel);
    document.querySelectorAll('[data-taille]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));

  /* À propos : le mode d'emploi de la maquette affichée, en quelques parties courtes, chacune avec son schéma */
  // les nouveautés qu'une maquette a déjà en ligne (réserver une date, les vidéos dans la page, le jour et la nuit, la
  // troupe) : le mode d'emploi n'en parle que là
  const AVEC = {};
  const a = (m, f) => (AVEC[m.n] || []).includes(f);
  const etapes = l => `<ol class="schema flux">${l.map(x => `<li>${x}</li>`).join('')}</ol>`;
  function remplirInfos() {
    const m = courante;
    const parties = [];
    parties.push(['Naviguer', `<div class="schema plan">
        <p class="ouverture">Le logo en grand<small>un clic, la molette ou glisser vers le bas ouvre le site</small></p>
        <span class="trait" aria-hidden="true"></span>
        <ul class="entrees" aria-label="Les trois entrées">
          <li class="voir">Voir un spectacle<small>les prochaines dates, la carte, tout l’agenda</small></li>
          <li class="prog">Programmer<small>le contact, le catalogue, les dossiers, les fiches techniques</small></li>
          <li class="etab">Établissement scolaire<small>les actions culturelles, les dossiers scolaires</small></li>
        </ul>
        <ul class="second" aria-label="Et aussi"><li>Spectacles</li><li>La compagnie</li><li>Contact</li><li>Espace pro</li></ul>
      </div>
      <ul class="points">
        <li>Les trois entrées sont en tête de chaque page. Au téléphone, elles restent à portée de pouce ; le reste est dans le menu.</li>
        <li>Chaque spectacle a sa page, dans son univers, avec un onglet par entrée.</li>
        <li>Chaque page a son adresse : on peut la copier et l’envoyer.</li>
      </ul>`]);
    parties.push(['Trouver une date', `${a(m, 'reserver') ? etapes([
        '<b>Choisir une date</b> sur la page du spectacle : un bouton par date, avec ses heures et sa ville.',
        '<b>La carte de la date</b> s’ouvre dessous : le lieu, les séances.',
        '<b>« Réserver »</b> ouvre la billetterie du théâtre, dans un nouvel onglet.']) : ''}
      <ul class="points">
        <li>« Voir un spectacle » : les prochaines dates tout public et leur carte, puis l’agenda depuis 2016, saison par saison. Une saison passée s’ouvre d’un clic.</li>
        <li>Le filtre par spectacle et la recherche par ville portent sur tout l’agenda.</li>
        ${a(m, 'reserver') ? '' : '<li>Les dates de la saison renvoient à la page du théâtre qui les accueille.</li>'}
      </ul>`]);
    if (a(m, 'videos') || a(m, 'jour') || a(m, 'troupe')) parties.push(['Regarder', `<ul class="points">
        ${a(m, 'videos') ? '<li>Les vidéos se lisent dans la page : « Plein écran », et « Assombrir », qui éteint le reste de la page.</li>' : ''}
        ${a(m, 'jour') ? '<li>Le bouton du soleil et de la lune, en haut, passe le site en jour ou en nuit ; le choix est gardé.</li>' : ''}
        ${a(m, 'troupe') ? '<li>« La compagnie » présente toute la troupe, par métiers.</li>' : ''}
      </ul>`]);
    parties.push(['Modifier le site', `${etapes([
        '<b>« Modifier le site »</b>, au pied de chaque page (ou <code>?edition</code> au bout de l’adresse).',
        '<b>Se connecter</b> avec un compte administrateur.',
        '<b>Cliquer</b> un texte pour l’écrire, une photo pour la remplacer, une date pour l’ouvrir. « Ajouter une date » est en tête de l’agenda.',
        '<b>« Enregistrer »</b> : c’est en ligne, sur toutes les pages ouvertes, sans les recharger.'])}
      <p class="note">Chaque modification est gardée dans le journal de l’administration : on peut revenir en arrière.</p>`]);
    parties.push(['L’administration', `<p>Tout ce que le site montre s’y gère aussi, avec ce qu’il ne montre pas : les options, le suivi, l’équipe. À l’ordinateur comme au téléphone.</p>
      <ul class="tuiles">
        <li><b>Représentations</b>les dates, leurs séances, leurs heures, leurs billetteries</li>
        <li><b>Planning</b>qui est libre ; proposer des dates à l’équipe</li>
        <li><b>Feuilles de route</b>la feuille de chaque date, composée depuis la base</li>
        <li><b>Spectacles</b>la fiche, l’univers, les photos, la distribution</li>
        <li><b>Équipe</b>les personnes, leurs accès, les documents</li>
        <li><b>Espace pro</b>les invitations des salles</li>
        <li><b>Ateliers</b>le catalogue et les séances dans les établissements</li>
        <li><b>Lieux</b>les salles, leurs adresses ; fusionner les doublons</li>
        <li><b>Textes du site</b>les textes de la compagnie</li>
        <li><b>Journal</b>chaque modification, pour revenir en arrière</li>
      </ul>
      <p class="liens"><a href="admin/" target="_blank" rel="noopener">Ouvrir l’administration ↗</a></p>`]);
    parties.push(['Les espaces', `<p>« Espace pro », dans le menu et en bas de page, mène aux espaces réservés. Tous puisent dans la même base.</p>
      <div class="schema reseau">
        <p class="esp">Le site public<small>tout le monde, sans compte</small></p>
        <p class="esp">L’administration<small>les comptes administrateur</small></p>
        <span class="lien-base" aria-hidden="true"></span><span class="lien-base" aria-hidden="true"></span>
        <p class="coeur">Une seule base de données<small>ce qui change quelque part change partout, sans recharger</small></p>
        <span class="lien-base" aria-hidden="true"></span><span class="lien-base" aria-hidden="true"></span>
        <p class="esp">L’espace de l’équipe<small>chacun avec son compte : sa saison, ses feuilles de route, le planning, ses spectacles. S’installe sur le téléphone.</small></p>
        <p class="esp">L’espace des salles<small>un directeur de salle invité : les dossiers et les fiches techniques</small></p>
      </div>
      <p class="liens"><a href="equipe/" target="_blank" rel="noopener">L’espace de l’équipe ↗</a><a href="pro/" target="_blank" rel="noopener">L’espace des salles ↗</a></p>`]);
    parties.push(['Cette planche', `<ul class="points">
        <li>Les onglets : les dix propositions, de la plus sobre (01) à la plus évoluée (10), puis la synthèse.</li>
        <li>Sur un grand écran, « Ordinateur » et « Téléphone » montrent la même maquette dans les deux écrans.</li>
        ${P.web ? '<li>« Seule ↗ » ouvre la maquette dans un onglet à part.</li>' : ''}
        <li>Les données sont les vraies : chaque maquette lit la base en direct.</li>
      </ul>`]);
    infos.innerHTML = `<button class="fermer" type="button" id="fermer-infos">Fermer</button>
      <p class="niv">${esc(num(m))} · ${esc(m.nom)}</p><h2 id="infos-titre">Mode d’emploi</h2>
      <p class="ici"><b>Sur l’accueil de cette maquette :</b> ${esc(m.voit)}.</p>
      ${parties.map(([titre, corps], k) => `<section aria-labelledby="partie-${k}"><h3 id="partie-${k}"><span class="no" aria-hidden="true">${k + 1}</span>${titre}</h3>${corps}</section>`).join('')}`;
    $('#fermer-infos').addEventListener('click', () => basculerInfos(false));
  }
  function basculerInfos(ouvrir) {
    infos.hidden = !ouvrir;
    boutonInfos.setAttribute('aria-expanded', ouvrir);
    if (ouvrir) { remplirInfos(); $('#fermer-infos').focus(); } else boutonInfos.focus();
  }
  boutonInfos.addEventListener('click', () => basculerInfos(infos.hidden));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !infos.hidden) basculerInfos(false); });
  infos.addEventListener('click', e => { const a = e.target.closest('[data-aller]'); if (!a) return; e.preventDefault(); montrer(a.dataset.aller); basculerInfos(false); });

  addEventListener('hashchange', () => { const n = location.hash.slice(1); if (n && (!courante || n !== courante.n)) montrer(n); });
  montrer(location.hash.slice(1) || LISTE[0].n);
})();
</script>
