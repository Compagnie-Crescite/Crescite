<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes · Crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* La planche : une barre d'onglets, une maquette par onglet, chargée en plein écran juste en dessous. */
:root {
  --nuit: #150a11; --nuit-2: #2a1a23; --clair: #f7ecf1; --gris-clair: #c9b7c1; --fond: #f6f1ea; --encre: #1b1216; --gris: #62565c; --filet: #ddd3c6;
  --magenta: #bc3e80; --magenta-vif: #f4a3cc;
  --serif: "Bodoni Moda", Didot, serif; --sans: "Instrument Sans", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); background: #3a3036; color: var(--encre); font: 400 1rem/1.5 var(--sans); overflow: hidden; }
:focus-visible { outline: 2px solid var(--magenta-vif); outline-offset: 2px; }
[hidden] { display: none !important; }

.barre { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px; background: var(--nuit); color: var(--clair); position: relative; z-index: 3; }
.barre .titre { font: italic 500 1.05rem var(--serif); white-space: nowrap; }
.onglets { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.onglets::-webkit-scrollbar { display: none; }
.onglets [role="tab"] { flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 11px; border: 0; border-radius: 7px; background: none; color: var(--gris-clair); font: 600 .9rem var(--sans); cursor: pointer; white-space: nowrap; }
.onglets [role="tab"] small { font-size: .78rem; font-variant-numeric: tabular-nums; opacity: .75; }
.onglets [role="tab"]:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.onglets [role="tab"][aria-selected="true"] { color: var(--nuit); background: var(--clair); }
.onglets [role="tab"].syn { color: var(--magenta-vif); }
.onglets [role="tab"].syn[aria-selected="true"] { color: #fff; background: var(--magenta); }
.outils { display: flex; align-items: center; gap: 6px; flex: none; }
.taille { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .08); }
.taille button, .outil { border: 0; background: none; color: var(--gris-clair); font: 600 .85rem var(--sans); padding: 6px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.taille button[aria-pressed="true"] { background: var(--clair); color: var(--nuit); }
.outil:hover, .taille button:hover { color: #fff; }
.outil[aria-expanded="true"] { background: var(--clair); color: var(--nuit); }

.scene { position: relative; min-height: 0; display: grid; justify-items: center; align-items: start; overflow: auto; }
#cadre { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.scene.tel { padding: 16px 0; }
.scene.tel #cadre { width: 390px; max-width: calc(100% - 24px); height: min(844px, calc(100% - 8px)); border-radius: 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); }

/* le panneau À propos : la maquette affichée, puis la démarche et la recommandation */
.infos { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, 100%); overflow-y: auto; background: var(--fond); box-shadow: -24px 0 60px rgba(0, 0, 0, .35); padding: 26px clamp(18px, 3vw, 34px) 40px; z-index: 2; }
.infos h2 { margin: 0 0 6px; font: italic 500 1.9rem/1.1 var(--serif); }
.infos h3 { margin: 28px 0 10px; font: italic 500 1.35rem/1.2 var(--serif); }
.infos .niv { margin: 0; font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.infos .fermer { position: sticky; top: 0; float: right; margin: -10px -10px 0 0; border: 1px solid var(--filet); background: #fff; border-radius: 999px; padding: 6px 12px; font: 600 .85rem var(--sans); cursor: pointer; }
.infos p, .infos li { max-width: 62ch; }
.infos a { color: #a8306f; }
.bilan { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 14px; }
.bilan h4 { margin: 0 0 6px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.bilan .plus h4 { color: #1f6b4f; } .bilan .moins h4 { color: #9a3412; }
.bilan ul { margin: 0; padding-left: 1.1em; }
.demarche { margin-top: 30px; padding-top: 6px; border-top: 1px solid var(--filet); }
.demarche ol, .demarche ul { padding-left: 1.2em; }
.demarche li { margin-bottom: 6px; }
.echelle { width: 100%; border-collapse: collapse; font-size: .9rem; }
.echelle th, .echelle td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--filet); vertical-align: baseline; }
.echelle th { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--gris); }
.echelle button { border: 0; background: none; padding: 0; font: italic 500 1rem var(--serif); color: var(--encre); cursor: pointer; text-align: left; }
.echelle button:hover { color: #a8306f; }
.pts { white-space: nowrap; }
.pts i { display: inline-block; width: 9px; height: 9px; margin-right: 3px; border-radius: 50%; border: 1.5px solid var(--encre); }
.pts i.p { background: var(--encre); }

@media (max-width: 900px) { .barre .titre { display: none; } }
@media (max-width: 700px) { .taille { display: none; } .bilan { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="barre">
  <span class="titre">Crescite · maquettes</span>
  <div class="onglets" role="tablist" aria-label="Les maquettes" id="onglets"></div>
  <div class="outils">
    <div class="taille" role="group" aria-label="Écran"><button type="button" data-taille="bureau" aria-pressed="true">Ordinateur</button><button type="button" data-taille="tel" aria-pressed="false">Téléphone</button></div>
    <a class="outil" id="direct" href="#" target="_blank" rel="noopener" title="Ouvrir la maquette seule, dans un nouvel onglet" hidden>Seule ↗</a>
    <button class="outil" type="button" id="bouton-infos" aria-expanded="false" aria-controls="infos">À propos</button>
  </div>
</header>
<main class="scene" id="scene" role="tabpanel">
  <iframe id="cadre" title="Maquette"></iframe>
  <aside class="infos" id="infos" aria-labelledby="infos-titre" hidden></aside>
</main>
<script>const P = {"web":true,"pages":["m01","m02","m03","m04","m05","m06","m07","m08","m09","m10","synthese"]};</script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* les dix, de la plus sobre à la plus évoluée, puis la synthèse */
  const M = [
    { n: 'm01', court: 'Programme', nom: 'Le programme de salle', niveau: 'La plus sobre', voit: 'Le bandeau « EN TOURNÉE », les portes, la carte gravée', mvt: 0, pieuvre: 1, effort: 1,
      principe: 'Le site comme un programme de théâtre imprimé : du papier, de l’encre et des filets, une seule police. On entre par la couverture (le logo dans un double filet). L’accueil présente le bandeau « EN TOURNÉE » comme une affiche, les trois portes, puis la carte des tournées gravée à l’encre : chaque commune porte un numéro de note qui renvoie à ses dates.',
      plus: ['Lecture immédiate, chargement instantané', 'La carte gravée : sobre et exacte, chaque commune renvoie à sa date', 'La plus simple à tenir à jour'],
      moins: ['Peu d’images : l’émotion des spectacles attend les pages intérieures', 'Peut sembler austère au jeune public'] },
    { n: 'm02', court: 'Maison', nom: 'La maison', niveau: 'Sobre', voit: 'Le spectacle à l’affiche, puis les trois portes', mvt: 1, pieuvre: 1, effort: 1,
      principe: 'La clarté d’un théâtre public : le logo sur sa tache magenta s’ouvre sur le spectacle à l’affiche (le bandeau d’origine, « EN TOURNÉE » et « découvrir »), les trois portes juste dessous, puis une large bande de carte aux bras magenta. Chaque onglet a sa page, avec les mêmes repères d’une page à l’autre.',
      plus: ['Des conventions que tout le monde connaît : on trouve sans chercher', 'Les photos portent l’émotion', 'Les trois portes visibles dès le premier écran'],
      moins: ['Ressemble à beaucoup de sites culturels', 'L’identité de la pieuvre passe au second plan'] },
    { n: 'm03', court: 'Saison', nom: 'La saison', niveau: 'L’agenda d’abord', voit: 'Les dates de la saison et leur carte', mvt: 1, pieuvre: 2, effort: 2,
      principe: 'Pour une compagnie qui tourne, la première question est « quand et où ? ». L’accueil est l’agenda : les dates groupées par mois, un filtre par spectacle, la recherche, et une grande carte où chaque bras prend la couleur de son spectacle. Survoler une date allume son bras ; choisir une commune filtre la liste.',
      plus: ['Répond tout de suite à la question des spectateurs et des programmateurs', 'La carte et la liste ne font qu’un : la tournée se lit d’un coup d’œil', 'Recherche et filtres immédiats, sans changer de page'],
      moins: ['Moins de place pour l’univers des spectacles', 'Exige un agenda toujours à jour'] },
    { n: 'm04', court: 'Trois portes', nom: 'Trois portes', niveau: 'Le public d’abord', voit: 'Trois grandes portes en arche', mvt: 2, pieuvre: 2, effort: 2,
      principe: 'Trois grandes portes, chacune dans sa couleur, dont le battant s’entrouvre au survol : « Je viens voir » mène à l’agenda, « Je programme » à l’Espace Pro, « Je fais venir dans mon établissement » aux Actions culturelles. Dessous, la carte de la saison aux bras lumineux sur le prune, puis le bandeau « EN TOURNÉE ».',
      plus: ['Chaque public trouve son chemin en un clic', 'Une identité nocturne et chaleureuse, très lisible au téléphone', 'La carte lumineuse donne envie de suivre la tournée'],
      moins: ['L’accueil montre peu les spectacles : il faut descendre ou passer par un onglet', 'Demande à chacun de se ranger dans une case'] },
    { n: 'm05', court: 'Magenta', nom: 'Magenta', niveau: 'La marque en grand', voit: 'La tache magenta et la pieuvre blanche', mvt: 2, pieuvre: 2, effort: 2,
      principe: 'Le logo 2.0 donne toute l’identité : le magenta en aplat, la pieuvre blanche, une famille de caractères large en capitales, des photos en bichromie. Après l’ouverture, l’accueil commence par le bandeau « EN TOURNÉE » en bichromie ; la carte est une affiche aux bras blancs enroulés sur le magenta. Chaque page spectacle devient une affiche dans sa couleur.',
      plus: ['Identité reconnaissable au premier coup d’œil', 'Une affiche moderne et assumée', 'Se décline facilement : réseaux, affiches, dossiers'],
      moins: ['Le magenta partout peut écraser les couleurs des spectacles', 'Les capitales larges supportent mal les titres longs'] },
    { n: 'm06', court: 'Tournée', nom: 'Les bras de la tournée', niveau: 'La tentacule comme thème', voit: 'La carte : les tournées partent de Rouen comme des tentacules', mvt: 2, pieuvre: 3, effort: 2,
      principe: 'La tentacule devient un thème : quand le logo s’ouvre, ses tentacules deviennent les bras de la tournée, qui poussent de Rouen vers chaque commune de la saison, sur le réseau gris des tournées passées. Une frise des saisons redessine chaque saison sur la carte ; chaque page spectacle a la sienne, sous « Actuellement en tournée ». Pour le reste, un site clair et classique.',
      plus: ['Le thème dit quelque chose de vrai : la compagnie part de Rouen et va chercher son public, jusque dans les classes', 'Une image forte faite de vraies données : toutes les dates publiées depuis 2016', 'La carte sert aussi les programmateurs et les établissements'],
      moins: ['Exige une base de dates tenue à jour, avec des lieux bien localisés', 'Moins de place pour les photos sur le premier écran'] },
    { n: 'm07', court: 'Noir', nom: 'Le noir et la lumière', niveau: 'Théâtral', voit: 'Une photo de spectacle en plein écran', mvt: 3, pieuvre: 1, effort: 2,
      principe: 'La scène dans le noir : le logo s’ouvre sur une photo de spectacle en plein écran ; les titres en bas de l’écran, comme un programme, changent la photo en fondu. La carte est faite de lumière : des faisceaux partent de Rouen et les communes s’allument comme des projecteurs.',
      plus: ['Spectaculaire, met les photos en valeur', 'Navigation évidente : un titre, une photo', 'La carte lumineuse prolonge la scène'],
      moins: ['Dépend de photos en haute définition (celles du site actuel sont petites)', 'La photo change seule toutes les 7 secondes (avec un bouton pause) : à couper pour un site plus calme', 'Le Bodoni italique rend certains signes très fins, comme les traits d’union'] },
    { n: 'm08', court: 'Sommaire', nom: 'Le sommaire', niveau: 'Éditorial', voit: 'La liste des spectacles et l’aperçu de celui qu’on survole', mvt: 2, pieuvre: 1, effort: 2,
      principe: 'Un sommaire et un aperçu : la liste des spectacles en grand à gauche, l’aperçu du spectacle survolé à droite (photo, texte d’origine, prochaine date), qui prend une teinte de sa couleur. La carte est tracée en filets éditoriaux, avec les noms des communes composés comme dans un magazine.',
      plus: ['Élégant comme un magazine, limpide comme une table des matières', 'Tout le répertoire visible d’un coup', 'La même grille partout : on ne se perd jamais'],
      moins: ['Le survol n’existe pas au téléphone : il faut une autre lecture', 'L’aperçu change dès que la souris passe'] },
    { n: 'm09', court: 'Chapitres', nom: 'Un spectacle par écran', niveau: 'Chapitres', voit: 'Un écran par spectacle, puis la saison en carte', mvt: 3, pieuvre: 2, effort: 3,
      principe: 'L’accueil se lit comme une suite de chapitres : après l’ouverture sur le logo, un écran par spectacle, avec son fond, sa couleur et sa photo, et un sommaire en traits fins qui indique où l’on est. Le dernier chapitre raconte la saison en carte : au fil du défilement, les mois passent et les bras poussent de Rouen vers chaque commune.',
      plus: ['Immersif : chaque spectacle a son moment', 'La saison racontée au défilement : la tournée se déroule sous les yeux', 'Le logo en grand dès l’ouverture'],
      moins: ['Neuf écrans à parcourir avant d’arriver aux trois portes (l’agenda reste à un clic, dans le menu)', 'Le défilement aimanté peut gêner certains visiteurs'] },
    { n: 'm10', court: 'Pieuvre', nom: 'La pieuvre vivante, rangée', niveau: 'La plus évoluée', voit: 'La pieuvre : un bras se tend vers le titre survolé', mvt: 3, pieuvre: 3, effort: 3,
      principe: 'Les titres sont posés librement autour de la pieuvre ; c’est le bras le plus proche qui se tend vers le titre survolé, puis l’attire, et l’encre de son univers recouvre l’écran. Aucun bras n’appartient à un spectacle : leur nombre peut changer sans toucher à la pieuvre. La carte est faite de tentacules d’encre ponctuées de ventouses.',
      plus: ['L’idée la plus singulière, et un geste qu’on retient', 'L’univers de chaque spectacle vit dans sa page', 'Le répertoire peut grandir sans redessiner la pieuvre'],
      moins: ['La plus longue à réaliser et à entretenir', 'Le geste « tirer » doit se découvrir (un clic suffit aussi)'] },
  ];
  const SYN = { n: 'synthese', num: 'S', court: 'Synthèse', nom: 'La synthèse : la 06, enrichie', niveau: 'La proposition retenue, en site complet',
    principe: 'Ce que je recommande, assemblé en un site complet : l’ouverture sur le logo, l’accueil et les cartes de la 06 ; l’agenda de la 03 relié à la carte (choisir une commune filtre la liste, survoler une date allume son bras) ; les portes de la 04 ; pour chaque spectacle, une bande à ses couleurs avec l’effet de la 10. Tout le reste est commun.',
    plus: ['Le thème tentaculaire porte une information utile à chaque public', 'Chaque spectacle garde son univers dans une seule bande ; le reste du site ne change pas', 'Une base prête à développer : chaque page, chaque spectacle et chaque saison a son adresse'],
    moins: ['La bande des spectacles est la partie la plus coûteuse : elle peut venir dans un second temps'] };
  const TOUTES = [...M, SYN];
  const num = m => m.num || m.n.slice(1);
  // la planche en fichier embarque chaque maquette ; la planche en ligne (P.web) charge les pages publiées à côté d'elle
  const dispo = n => (P.web ? (P.pages || []).includes(n) : !!(P.sources && P.sources[n]));
  const LISTE = TOUTES.filter(m => dispo(m.n));
  const data = P.web ? '' : JSON.stringify(P.D).replace(/<\//g, '<\\/');
  // dans un cadre srcdoc, les liens « #/… » se résoudraient sur l'adresse de la planche : on fixe la base
  const page = n => P.sources[n].replace('/*__DATA__*/null', () => data).replace(/<head[^>]*>/i, h => h + '<base href="about:srcdoc">');

  const onglets = $('#onglets'), cadre = $('#cadre'), scene = $('#scene'), infos = $('#infos'), boutonInfos = $('#bouton-infos'), direct = $('#direct');
  onglets.innerHTML = LISTE.map(m => `<button type="button" role="tab" id="o-${m.n}" aria-controls="scene" aria-selected="false" tabindex="-1"${m.n === 'synthese' ? ' class="syn"' : ''} title="${esc(num(m) + ' · ' + m.nom)}">${m.n === 'synthese' ? '' : `<small>${num(m)}</small>`}${esc(m.court)}</button>`).join('');
  const tabs = [...onglets.querySelectorAll('[role="tab"]')];
  let courante = null;

  function montrer(n, focus) {
    const m = LISTE.find(x => x.n === n) || LISTE[0];
    if (!m) return;
    courante = m;
    tabs.forEach(t => { const on = t.id === 'o-' + m.n; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on) { t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); if (focus) t.focus(); } });
    scene.setAttribute('aria-labelledby', 'o-' + m.n);
    cadre.title = `Maquette ${num(m)} : ${m.nom}`;
    if (P.web) { cadre.removeAttribute('srcdoc'); cadre.src = `${m.n}.html`; direct.href = `${m.n}.html`; direct.hidden = false; }
    else { cadre.srcdoc = page(m.n); }
    document.title = `${num(m)} · ${m.nom} · Maquettes Crescite`;
    if (location.hash !== '#' + m.n) history.replaceState(null, '', '#' + m.n);
    if (!infos.hidden) remplirInfos();
  }
  tabs.forEach((t, k) => {
    t.addEventListener('click', () => montrer(t.id.slice(2)));
    t.addEventListener('keydown', e => {
      const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key], fin = { Home: 0, End: tabs.length - 1 }[e.key];
      if (d === undefined && fin === undefined) return;
      e.preventDefault();
      const cible = tabs[fin !== undefined ? fin : (k + d + tabs.length) % tabs.length];
      montrer(cible.id.slice(2), true);
    });
  });

  /* ordinateur ou téléphone */
  document.querySelectorAll('[data-taille]').forEach(b => b.addEventListener('click', () => {
    const tel = b.dataset.taille === 'tel';
    scene.classList.toggle('tel', tel);
    document.querySelectorAll('[data-taille]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));

  /* À propos : la maquette affichée, puis la démarche, l'échelle et la recommandation */
  const pts = (v, nom) => `<span class="pts" aria-label="${nom} : ${v} sur 3">${[1, 2, 3].map(k => `<i class="${k <= v ? 'p' : ''}" aria-hidden="true"></i>`).join('')}</span>`;
  function remplirInfos() {
    const m = courante;
    infos.innerHTML = `<button class="fermer" type="button" id="fermer-infos">Fermer</button>
      <p class="niv">${esc(num(m))} · ${esc(m.niveau)}</p><h2 id="infos-titre">${esc(m.nom)}</h2>
      <p>${esc(m.principe)}</p>
      <div class="bilan"><div class="plus"><h4>Ce qui marche</h4><ul>${m.plus.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="moins"><h4>Ce qui coince</h4><ul>${m.moins.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>
      <div class="demarche">
        <h3>La démarche</h3>
        <p>Les dix partent du même contenu : le texte exact de crescite.fr, page par page (les spectacles, les onze saisons et leurs dates, la présentation de la compagnie, les actions culturelles, l’espace pro, le contact), plus Cassandres, création 2027. Rien n’y est réécrit ; seule la carte des tournées s’ajoute, dessinée dans l’univers de chaque maquette. Elles ne diffèrent que par la manière de montrer ce contenu : de la page imprimée à la pieuvre qu’on tire.</p>
        <p>Chacune s’ouvre sur le logo en grand : au clic, à la molette ou en glissant vers le bas, ses tentacules ondulent, il grossit et le site apparaît à travers lui. Chacune est ensuite un petit site à onglets (Spectacles, Agenda, La compagnie, Actions culturelles, Espace Pro, Contact), avec une page par spectacle et par saison.</p>
        <div>
      <div><h4 style="margin:18px 0 6px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase">Pourquoi le prototype semblait « bordélique »</h4><ol>
        <li><b>Trop de choses se disputaient l’attention</b> sur le premier écran : huit étiquettes avec chacune trois lignes (titre, année et durée, prochaine date), une bulle d’aide, un bouton, des bras qui bougeaient seuls.</li>
        <li><b>Un en-tête à deux étages</b> : les trois portes au-dessus, onglets, mode calme, lumière et menu en dessous. Le regard ne savait pas où commencer.</li>
        <li><b>Huit typographies</b>, une par spectacle. Chaque page avait du caractère, mais l’ensemble ne ressemblait plus à un seul site.</li>
      </ol></div>
      <div><h4 style="margin:18px 0 6px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase">Les règles communes aux dix</h4><ul>
        <li>Un seul étage d’en-tête et six onglets : Spectacles, Agenda, La compagnie, Actions culturelles, Espace Pro, Contact.</li>
        <li>Le texte du site d’origine, mot pour mot. Seule la carte des tournées s’ajoute.</li>
        <li>Deux familles de polices au plus. Un spectacle se distingue par sa couleur et sa photo, jamais par sa typographie.</li>
        <li>Un seul message par écran, des alignements stricts, du texte courant d’au moins 16 px et des contrastes suffisants.</li>
        <li>Les trois portes, réduites à leurs libellés : « Je viens voir » mène à l’agenda, « Je programme » à l’Espace Pro, « Je fais venir dans mon établissement » aux Actions culturelles.</li>
        <li>La pieuvre ne compte pas les spectacles : aucun bras n’est attribué à un titre.</li>
        <li>Les prochaines dates à un clic au plus de l’accueil.</li>
        <li>Uniquement la partie publique : ni espace troupe, ni administration.</li>
      </ul></div>
    </div>
        <h3>L’échelle</h3>
        <p>De 0 à 3 : la part de mouvement, la place du thème tentaculaire (au-delà du logo, présent partout), et l’effort de réalisation puis d’entretien.</p>
        <table class="echelle"><thead><tr><th scope="col">N°</th><th scope="col">Maquette</th><th scope="col">Mouvement</th><th scope="col">Tentacules</th><th scope="col">Effort</th></tr></thead>
          <tbody>${M.map(x => `<tr><td>${num(x)}</td><td><button type="button" data-aller="${x.n}">${esc(x.nom)}</button></td><td>${pts(x.mvt, 'Mouvement')}</td><td>${pts(x.pieuvre, 'Tentacules')}</td><td>${pts(x.effort, 'Effort')}</td></tr>`).join('')}</tbody></table>
        <h3>Ce que je recommande</h3>
        <p><b>La 06 comme base.</b> C’est la synthèse : un site aussi clair que la 02, où le thème tentaculaire dit quelque chose de vrai sur la compagnie, qui part de Rouen et va chercher son public jusque dans les classes, au lieu d’être un décor. Les cartes servent aussi les programmateurs et les établissements.</p>
    <ol>
      <li><b>L’accueil de la <a href="#m06" data-aller="m06">06</a></b> : la carte des tournées, qui pousse depuis Rouen quand le logo s’ouvre, puis les spectacles.</li>
      <li><b>L’agenda de la <a href="#m03" data-aller="m03">03</a></b>, sur la page Agenda : filtres par spectacle, recherche par ville, et la carte reliée à la liste.</li>
      <li><b>Les trois portes</b> de la <a href="#m04" data-aller="m04">04</a>, réduites à leurs libellés : elles mènent à l’agenda, à l’Espace Pro et aux Actions culturelles.</li>
      <li><b>Les pages spectacle</b> : la carte des tournées de la 06, sous « Actuellement en tournée » ; plus tard, si le budget le permet, un effet au défilement par spectacle, comme dans la <a href="#m10" data-aller="m10">10</a>.</li>
    </ol>
    <p>La pieuvre de la 10 n’est pas perdue : elle peut vivre ailleurs (une page de saison, une affiche animée, une bande-annonce pour les réseaux) sans porter la navigation du site.</p>
    <p>Si vous voulez la solution la plus sûre et la plus rapide à mettre en ligne : la <a href="#m02" data-aller="m02">02</a>, « La maison ».</p>
    <p><b>Le texte d’origine, tel quel</b>, avec ses incohérences et ses fautes, pour qu’on les voie et qu’on les corrige dans le futur site. Par exemple : L’imaginaire forcé est « création 2012 » sur sa page et « création 2011 » sur les pages de saison ; « conventionnée la Ville de Rouen » (il manque « par ») ; « l’un des plus beau poème » ; les pages spectacle annoncent encore « Actuellement en tournée » des dates de 2025-2026 (les maquettes y mettent les dates à venir des pages de saison). Les chiffres de diffusion du dossier artistique (plus de 1 500 représentations depuis 2011) n’y figurent pas.</p>
    <p><b>À vérifier dans la base des dates.</b> Trois lieux ne sont pas des lieux : « diptyque » à Ostwald et à Briançon, « 20h30 » à Saint-Genest-Lerpt. Les maquettes les affichent proprement, mais il faut corriger la source.</p>
        ${dispo('synthese') ? '<p><button class="outil" type="button" data-aller="synthese" style="color:#a8306f;padding:0;font-size:1rem">Voir la synthèse assemblée →</button></p>' : ''}
      </div>`;
    $('#fermer-infos').addEventListener('click', () => basculerInfos(false));
  }
  function basculerInfos(ouvrir) {
    infos.hidden = !ouvrir;
    boutonInfos.setAttribute('aria-expanded', ouvrir);
    if (ouvrir) { remplirInfos(); $('#fermer-infos').focus(); } else boutonInfos.focus();
  }
  boutonInfos.addEventListener('click', () => basculerInfos(infos.hidden));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !infos.hidden) basculerInfos(false); });
  infos.addEventListener('click', e => { const a = e.target.closest('[data-aller]'); if (!a) return; e.preventDefault(); montrer(a.dataset.aller); basculerInfos(false); });

  addEventListener('hashchange', () => { const n = location.hash.slice(1); if (n && (!courante || n !== courante.n)) montrer(n); });
  montrer(location.hash.slice(1) || LISTE[0].n);
})();
</script>
