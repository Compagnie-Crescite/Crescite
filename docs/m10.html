<script>
/* La carte des tournées, commune aux maquettes (build.py l'ajoute après les données D).
   Le fond (la France, la Belgique, le Luxembourg), Rouen, et un bras par commune, de Rouen jusqu'à elle.
   Chaque maquette l'habille dans son univers : couleurs, tracé, mouvement, interactions.

   CARTE.viewBox, CARTE.rouen ([x, y]), CARTE.fond.{pays, belgique, luxembourg} : chemins SVG (attribut d)
   CARTE.lieux                          toutes les communes [{c, dep, xy}] ; « l » est l'indice dans ce tableau
   (aVenir, tout, saison et spectacle ramènent l'outre-mer dans un encart en bas à gauche : x.encart, x.xyReel ; CARTE.ENCART)
   CARTE.aVenir()                       les communes des dates à venir : [{l, c, dep, xy, n, dates: [D.dates…]}]
   CARTE.aVenir('public')               les mêmes, sans les dates scolaires (« Je viens voir un spectacle ») ;
   CARTE.aVenir('scolaire')             seulement les dates scolaires (« Je représente un établissement scolaire »)
   CARTE.tout()                         toutes les communes de toutes les saisons (« Je souhaite programmer ») :
                                        [{l, c, dep, xy, n, dates: [lignes de D.saisons, avec spectacle, slug, saison]}]
   CARTE.saison('2019-2020')            les communes d'une saison : [{l, c, dep, xy, n, dates: [lignes de D.saisons]}]
   CARTE.spectacle(slug)                {aVenir: [...], passe: [...]} : les communes d'un spectacle, à venir et passées
   CARTE.nom(lieu)                      « Pont-Audemer (27) »
   CARTE.bras(xy, {w0, w1, courbe, depart})   un bras plein effilé (à remplir), de Rouen (ou depart) jusqu'à xy
   CARTE.trait(xy, {courbe, depart})          la même courbe, en trait (à tracer) : « M… Q… »
   CARTE.bout(xy, {r, tours, courbe})         une petite spirale qui enroule le bout du bras (à tracer)
   CARTE.longueur(xy, {courbe})               la longueur du trait, pour stroke-dasharray
   CARTE.cadre(lieux, {marge, min})           un viewBox serré autour de Rouen et de ces communes : "x y l h"
   CARTE.svg({...})                     une carte complète, à habiller en CSS (classes .carte-*) : voir plus bas
   CARTE.lier(racine, {survol, choix})  relie les communes d'une carte (data-l) au survol, au clic et au clavier
   CARTE.mouvement()                    false si le visiteur a demandé moins d'animations */
const CARTE = (() => {
  // D.carte se relit à chaque appel : la base de la compagnie peut remplacer ses communes et ses comptes (donnees.js)
  const C = () => D.carte, R = D.carte.rouen;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // une commune hors du cadre de la France (l'outre-mer : Saint-Denis de La Réunion) est ramenée dans un encart,
  // en bas à gauche : x.encart vaut alors true, et x.xyReel garde sa position projetée
  const VB = C().viewBox.split(/\s+/).map(Number), ENCART = [VB[0] + 66, VB[1] + VB[3] - 74];
  const dansCadre = ([x, y]) => x >= VB[0] && x <= VB[0] + VB[2] && y >= VB[1] && y <= VB[1] + VB[3];
  function regroupe(paires, datesDe) {
    return paires.map(([l, n]) => { const p = C().lieux[l], hors = !dansCadre(p.xy); return { l, ...p, xy: hors ? ENCART : p.xy, xyReel: p.xy, encart: hors, n, dates: datesDe(l) }; })
      .sort((a, b) => Math.hypot(a.xy[0] - R[0], a.xy[1] - R[1]) - Math.hypot(b.xy[0] - R[0], b.xy[1] - R[1]));
  }
  const aVenir = filtre => {
    const garde = d => filtre === 'public' ? !d.scolaire : filtre === 'scolaire' ? !!d.scolaire : true;
    const paires = filtre === 'public' ? C().aVenirPublic : filtre === 'scolaire' ? C().aVenirScolaire : C().aVenir;
    return regroupe(paires, l => D.dates.filter(d => d.l === l && garde(d)));
  };
  const tout = () => regroupe(C().tout, l => Object.entries(D.saisons).flatMap(([saison, S]) => S.spectacles.flatMap(g =>
    g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug, saison })))));
  const saison = s => regroupe(C().parSaison[s] || [], l => (D.saisons[s]?.spectacles || []).flatMap(g => g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug }))));
  const spectacle = slug => {
    const p = C().parSpectacle[slug] || { passe: [], aVenir: [] };
    const passees = l => Object.values(D.saisons).flatMap(S => S.spectacles.filter(g => g.slug === slug).flatMap(g => g.dates.filter(d => d.l === l && !(d.fin && d.fin >= D.aujourdhui))));
    return { aVenir: regroupe(p.aVenir, l => D.dates.filter(d => d.slug === slug && d.l === l)), passe: regroupe(p.passe, passees) };
  };
  const nom = x => `${x.c} (${x.dep})`;

  // le point de contrôle de la courbe : à mi-chemin, écarté sur le côté (courbe > 0 : vers la gauche du trajet)
  function controle([x, y], courbe = 0.24, depart = R) {
    const [rx, ry] = depart, dx = x - rx, dy = y - ry;
    return [(rx + x) / 2 - dy * courbe, (ry + y) / 2 + dx * courbe];
  }
  function bras(xy, { w0 = 4, w1 = 0.5, courbe = 0.24, depart = R } = {}) {
    const [rx, ry] = depart, [x, y] = xy;
    if (Math.hypot(x - rx, y - ry) < 6) return '';
    const [qx, qy] = controle(xy, courbe, depart), N = 26, G = [], Dr = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, c = t * t;
      const px = a * rx + b * qx + c * x, py = a * ry + b * qy + c * y;
      let tx = 2 * (1 - t) * (qx - rx) + 2 * t * (x - qx), ty = 2 * (1 - t) * (qy - ry) + 2 * t * (y - qy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = (w0 * (1 - t) + w1 * t) / 2;
      G.push(`${(px - ty * w).toFixed(1)} ${(py + tx * w).toFixed(1)}`); Dr.push(`${(px + ty * w).toFixed(1)} ${(py - tx * w).toFixed(1)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  function trait(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    return `M${depart[0]} ${depart[1]}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${xy[0]} ${xy[1]}`;
  }
  function longueur(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    let L = 0, px = depart[0], py = depart[1];
    for (let k = 1; k <= 24; k++) {
      const t = k / 24, x = (1 - t) ** 2 * depart[0] + 2 * (1 - t) * t * qx + t * t * xy[0], y = (1 - t) ** 2 * depart[1] + 2 * (1 - t) * t * qy + t * t * xy[1];
      L += Math.hypot(x - px, y - py); px = x; py = y;
    }
    return Math.round(L);
  }
  // une spirale au bout du bras, dans le sens de la courbe
  function bout(xy, { r = 5, tours = 1.25, courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart), [x, y] = xy;
    let a = Math.atan2(y - qy, x - qx), pts = [];
    const sens = courbe >= 0 ? 1 : -1, N = 28;
    const cx = x + Math.cos(a + sens * Math.PI / 2) * r, cy = y + Math.sin(a + sens * Math.PI / 2) * r;
    const a0 = Math.atan2(y - cy, x - cx);
    for (let k = 0; k <= N; k++) {
      const t = k / N, ang = a0 + sens * t * tours * 2 * Math.PI, rr = r * (1 - 0.72 * t);
      pts.push(`${(cx + Math.cos(ang) * rr).toFixed(1)} ${(cy + Math.sin(ang) * rr).toFixed(1)}`);
    }
    return `M${pts.join('L')}`;
  }
  function cadre(lieux, { marge = 40, min = 160 } = {}) {
    const xs = [R[0], ...lieux.map(l => l.xy[0])], ys = [R[1], ...lieux.map(l => l.xy[1])];
    let x0 = Math.min(...xs) - marge, x1 = Math.max(...xs) + marge, y0 = Math.min(...ys) - marge, y1 = Math.max(...ys) + marge;
    if (x1 - x0 < min) { const m = (x0 + x1) / 2; x0 = m - min / 2; x1 = m + min / 2; }
    if (y1 - y0 < min) { const m = (y0 + y1) / 2; y0 = m - min / 2; y1 = m + min / 2; }
    return `${Math.round(x0)} ${Math.round(y0)} ${Math.round(x1 - x0)} ${Math.round(y1 - y0)}`;
  }

  /* Une carte complète.
     lieux    : les communes en avant (CARTE.aVenir(), CARTE.saison(s), CARTE.spectacle(slug).aVenir…)
     passe    : des communes en retrait (les tournées passées), tracées plus fines
     forme    : 'bras' (plein effilé), 'trait' (ligne), 'pointille'
     courbe   : l'écart de la courbe ; spirale : un enroulement au bout de chaque bras
     cadre    : 'france' (par défaut) ou 'serre' (autour des communes), ou un viewBox
     pousse   : les bras poussent depuis Rouen à l'affichage (si le visiteur accepte le mouvement)
     interactif : chaque commune devient un bouton (data-l), à relier avec CARTE.lier
     noms     : true pour écrire le nom des communes en avant ; titre : le libellé pour les lecteurs d'écran
     Classes : .carte, .carte-voisin, .carte-pays, .carte-bras(-passe), .carte-bout(-passe), .carte-spirale,
               .carte-lieu (g[data-l]), .carte-point, .carte-nom, .carte-rouen, .carte-rouen-nom */
  let n = 0;
  function svg({ lieux = [], passe = [], forme = 'bras', courbe = 0.24, spirale = false, cadre: vb = 'france', pousse = true,
    interactif = false, noms = false, titre = '', classe = '', largeur = 1 } = {}) {
    const id = 'carte-pousse-' + (++n), anime = pousse && mouvement();
    const box = vb === 'france' ? C().viewBox : vb === 'serre' ? cadre([...lieux, ...passe]) : vb;
    const [bx, by, bw, bh] = box.split(/\s+/).map(Number), echelle = Math.max(bw, bh) / 800;
    const tracer = (x, w0, w1) => forme === 'bras' ? `d="${bras(x.xy, { w0: w0 * echelle, w1: w1 * echelle, courbe })}"` : `d="${trait(x.xy, { courbe })}"`;
    const largeurBras = x => Math.min(7, 1.6 + Math.sqrt(x.n) * 1.1) * largeur;
    const rayon = Math.hypot(bw, bh) * 1.2;
    const etiquette = x => `${nom(x)}${x.dates?.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    return `<svg class="carte ${esc(classe)}" viewBox="${box}" ${interactif ? `aria-label="${esc(titre)}"` : `role="img" aria-label="${esc(titre)}"`} data-forme="${forme}">
      <defs><clipPath id="${id}"><circle cx="${R[0]}" cy="${R[1]}" r="${anime ? 0 : rayon}">${anime ? `<animate attributeName="r" from="0" to="${rayon}" dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>` : ''}</circle></clipPath></defs>
      <path class="carte-voisin" d="${C().belgique}"/><path class="carte-voisin" d="${C().luxembourg}"/><path class="carte-pays" d="${C().contour}"/>
      ${[...lieux, ...passe].some(x => x.encart) ? `<circle class="carte-encart" cx="${ENCART[0]}" cy="${ENCART[1]}" r="${(24 * echelle).toFixed(1)}" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 4"/>` : ''}
      <g clip-path="url(#${id})">
        ${passe.map(x => `<path class="carte-bras-passe" ${forme === 'bras' ? tracer(x, 1.6, 0.4) : `d="${trait(x.xy, { courbe })}"`}/>`).join('')}
        ${passe.map(x => `<circle class="carte-bout-passe" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(1.8 * echelle).toFixed(2)}"/>`).join('')}
        ${lieux.map(x => `<path class="carte-bras" data-l="${x.l}" ${forme === 'bras' ? tracer(x, largeurBras(x), 0.5) : `d="${trait(x.xy, { courbe })}"`}${forme === 'pointille' ? ' stroke-dasharray="1 4"' : ''}/>`).join('')}
        ${spirale ? lieux.map(x => `<path class="carte-spirale" data-l="${x.l}" d="${bout(x.xy, { r: 4.5 * echelle, courbe })}"/>`).join('') : ''}
        ${lieux.map(x => interactif
          ? `<g class="carte-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(4 * echelle).toFixed(2)}"/><circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(12 * echelle).toFixed(2)}" fill="transparent"/><title>${esc(etiquette(x))}</title></g>`
          : `<g class="carte-lieu" data-l="${x.l}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(3.6 * echelle).toFixed(2)}"/><title>${esc(etiquette(x))}</title></g>`).join('')}
        ${noms ? lieux.map(x => `<text class="carte-nom" data-l="${x.l}" x="${x.xy[0] + 7 * echelle}" y="${x.xy[1] + 3.5 * echelle}">${esc(x.c)}</text>`).join('') : ''}
      </g>
      <circle class="carte-rouen" cx="${R[0]}" cy="${R[1]}" r="${(5.5 * echelle).toFixed(2)}"/><text class="carte-rouen-nom" x="${R[0] + 10 * echelle}" y="${R[1] - 9 * echelle}">Rouen</text>
    </svg>`;
  }
  // relie les communes d'une carte : survol(l | null) au survol et au focus, choix(l) au clic et à Entrée / Espace
  function lier(racine, { survol = () => {}, choix = () => {} } = {}) {
    racine.querySelectorAll('.carte-lieu[data-l]').forEach(g => {
      const l = +g.dataset.l;
      g.addEventListener('mouseenter', () => survol(l)); g.addEventListener('mouseleave', () => survol(null));
      g.addEventListener('focus', () => survol(l)); g.addEventListener('blur', () => survol(null));
      g.addEventListener('click', () => choix(l));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choix(l); } });
    });
  }
  return { get K() { return C(); }, viewBox: C().viewBox, rouen: R, ENCART, fond: { pays: C().contour, belgique: C().belgique, luxembourg: C().luxembourg }, get lieux() { return C().lieux; },
    aVenir, tout, saison, spectacle, nom, bras, trait, bout, longueur, cadre, svg, lier, mouvement };
})();
</script>
<script>
/* L'ouverture des maquettes : le logo en grand. Au clic (ou au toucher), à la molette ou au glissé vers le bas, au
   clavier (Entrée, Espace, flèche bas, Page suivante), ses tentacules ondulent et s'écartent, il grossit à toute
   vitesse et le site apparaît à travers lui. Si le visiteur a demandé moins d'animations : un simple fondu.
   build.py l'ajoute après les données D ; chaque maquette l'habille dans son univers.

   INTRO.ouvrir({ fond, degrade, image, encre, tache, mot, sortie, classe, apres })
     à appeler une fois, au chargement ; l'ouverture ne s'affiche que si l'adresse est celle de l'accueil
     fond    : la couleur du fond (par défaut #14070f)
     degrade : un dégradé radial à la place du fond : [[0, '#3a1030'], [1, '#0d0710']] (du centre vers les bords)
     image   : une image (data URL) sous le logo, en couverture, par exemple une photo assombrie
     encre   : la couleur du logo (par défaut #fff) ; tache : true pour poser le logo sur sa tache magenta
     mot     : false pour la pieuvre seule, sans « crescite »
     sortie  : 'zoom' (par défaut : le site apparaît à travers le logo qui grossit) ou 'fondu'
     classe  : une classe en plus sur .intro, pour l'habiller en CSS (.intro, .intro-logo, .intro-indice)
     apres   : appelée quand le site est révélé (le focus va ensuite au titre h1 de la page)
   INTRO.ouverte()  vrai tant que l'ouverture est affichée ; l'évènement « intro:fin » est émis sur window à la fin
   ?intro=0 dans l'adresse : pas d'ouverture (captures, tests). Changer d'adresse ferme l'ouverture sans animation. */
const INTRO = (() => {
  const L = D.logo, [TG, TETE_G, TETE_D, TD] = L.octopusPaths;
  const CIBLE = [702, 706];                         // un point plein de la tête, où le zoom s'enfonce
  const PIVOT_G = [505, 840], PIVOT_D = [1030, 840]; // là où les tentacules extérieurs rejoignent la tête
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ease = { inOut: t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2, out: t => 1 - (1 - t) ** 3, in: t => t ** 3 };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  let el = null, etat = 'ferme', opts = {}, raf = 0, inertes = [];

  function css() {
    if (document.getElementById('intro-style')) return;
    const s = document.createElement('style');
    s.id = 'intro-style';
    s.textContent = `
      html.intro-active, html.intro-active body { overflow: hidden !important; }
      .intro { position: fixed; inset: 0; z-index: 2147483000; color: #fff; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
      .intro-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .intro-logo { position: absolute; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; border-radius: 28px; color: inherit; }
      .intro-logo:focus { outline: none; }
      .intro-logo:focus-visible { outline: 2px solid currentColor; outline-offset: 10px; }
      .intro-indice { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); width: 48px; height: 48px; margin-left: -24px;
        border: 0; background: transparent; color: inherit; opacity: .85; cursor: pointer; padding: 8px; }
      .intro-indice svg { width: 100%; height: 100%; display: block; animation: intro-rebond 1.8s ease-in-out infinite; }
      @keyframes intro-rebond { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      .intro.part .intro-indice { opacity: 0; transition: opacity .2s; }
      h1[tabindex="-1"]:focus { outline: none; }
      @media (prefers-reduced-motion: reduce) { .intro-indice svg { animation: none; } }`;
    document.head.appendChild(s);
  }

  function dessin(remplissage, trou) {
    const o = opts, f = trou ? '' : ' filter="url(#intro-onde)"';
    const tache = o.tache ? `<path class="i-tache" d="${L.tachePath}" fill="${trou ? '#000' : '#BC3E80'}"/>` : '';
    if (trou && o.tache) return tache;            // posé sur sa tache, le site apparaît à travers la tache entière
    return `${tache}
      <g class="i-tg"${f}><path d="${TG}" fill="${remplissage}" fill-rule="evenodd"/></g>
      <g class="i-tete"${trou ? '' : ' filter="url(#intro-onde-tete)"'}><path d="${TETE_G}" fill="${remplissage}" fill-rule="evenodd"/><path d="${TETE_D}" fill="${remplissage}" fill-rule="evenodd"/></g>
      <g class="i-td"${f}><path d="${TD}" fill="${remplissage}" fill-rule="evenodd"/></g>
      ${o.mot === false ? '' : `<path class="i-mot" d="${L.motPath}" fill="${remplissage}"/>`}`;
  }

  // la boîte du logo, en unités du dessin
  const boite = () => opts.tache ? [63, 65, 1408, 1405] : opts.mot === false ? [250, 340, 1042, 576] : [250, 340, 1042, 780];

  function ouvrir(o = {}) {
    if (el || etat !== 'ferme') return;
    const route = location.hash.replace(/^#\/?/, '').split('?')[0];
    if (route || new URLSearchParams(location.search).get('intro') === '0') return;
    opts = o;
    css();
    const encre = o.encre || '#fff', fond = o.fond || '#14070f';
    el = document.createElement('div');
    el.className = 'intro' + (o.classe ? ' ' + o.classe : '');
    el.style.color = encre;
    const degrade = o.degrade ? `<radialGradient id="intro-degrade" cx="50%" cy="46%" r="75%">${o.degrade.map(([p, c]) => `<stop offset="${p}" stop-color="${c}"/>`).join('')}</radialGradient>` : '';
    el.innerHTML = `<svg class="intro-scene" aria-hidden="true" focusable="false">
        <defs>${degrade}
          <filter id="intro-onde" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.0085 0.012" numOctaves="2" seed="11" result="bruit"/>
            <feOffset in="bruit" dx="0" dy="0" result="flot"/>
            <feDisplacementMap in="SourceGraphic" in2="flot" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="intro-onde-tete" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="1" seed="4" result="bruit"/>
            <feOffset in="bruit" dx="0" dy="0" result="flot"/>
            <feDisplacementMap in="SourceGraphic" in2="flot" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <mask id="intro-trou" maskUnits="userSpaceOnUse" x="-100" y="-100" width="100000" height="100000">
            <rect x="-100" y="-100" width="100000" height="100000" fill="#fff"/>
            <g class="intro-monde" data-role="trou" visibility="hidden">${dessin('#000', true)}</g>
          </mask>
        </defs>
        <g mask="url(#intro-trou)">
          <rect class="intro-fond" x="-100" y="-100" width="100000" height="100000" fill="${o.degrade ? 'url(#intro-degrade)' : fond}"/>
          ${o.image ? `<image class="intro-image" href="${o.image}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"/>` : ''}
        </g>
        <circle class="intro-choc" cx="50%" cy="50%" r="0" fill="none" stroke="currentColor" stroke-width="0" style="opacity:0"/>
        <g class="intro-monde" data-role="dessin">${dessin('currentColor', false)}</g>
      </svg>
      <button class="intro-logo" type="button" aria-label="${(D.site && D.site.nom) || 'Crescite'}"></button>
      <button class="intro-indice" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>`;
    document.body.appendChild(el);
    document.documentElement.classList.add('intro-active');
    inertes = [...document.body.children].filter(n => n !== el && !n.inert && n.tagName !== 'SCRIPT');
    inertes.forEach(n => { n.inert = true; });
    etat = 'ouvert';
    placer(0);
    addEventListener('resize', surRedim);
    el.addEventListener('click', partir);
    el.addEventListener('wheel', surMolette, { passive: false });
    el.addEventListener('touchstart', surToucher, { passive: true });
    el.addEventListener('touchmove', surGlisser, { passive: false });
    addEventListener('keydown', surTouche);
    addEventListener('hashchange', fermerVite);
    if (mouvement()) repos(performance.now());
  }

  /* la mise en place : échelle de départ, position, et pour l'animation la pose de chaque partie */
  let geo = null;
  function surRedim() { if (etat === 'ouvert') placer(0); }
  function placer() {
    const W = innerWidth, H = innerHeight, [bx, by, bw, bh] = boite();
    const s0 = Math.min(W * (W < 700 ? .84 : .62) / bw, H * (opts.tache ? .7 : .56) / bh);
    const cx = W / 2, cy = H / 2 - (W < 700 ? H * .03 : 0);
    geo = { W, H, s0, cx, cy, bx, by, bw, bh };
    poser({ s: 1, aG: 0, aD: 0, ondes: 0, flot: 0, vers: 0 });
    const b = el.querySelector('.intro-logo');
    Object.assign(b.style, { left: `${cx - bw * s0 / 2}px`, top: `${cy - bh * s0 / 2}px`, width: `${bw * s0}px`, height: `${bh * s0}px` });
  }
  // s : échelle en plus de s0 ; aG, aD : rotation des tentacules (degrés) ; ondes : ampleur des ondulations ;
  // flot : défilement des ondes ; vers : 0 → 1, la cible du zoom glisse vers le centre de l'écran
  function poser({ s, aG, aD, ondes, flot, vers, rot = 0 }) {
    const { s0, cx, cy, bx, by, bw, bh, W, H } = geo, S = s0 * s;
    const centre = [bx + bw / 2, by + bh / 2];
    const cible = opts.tache ? centre : CIBLE;
    // position écran de la cible : celle du logo centré, puis glisse vers le centre de l'écran
    const ex0 = cx + (cible[0] - centre[0]) * s0, ey0 = cy + (cible[1] - centre[1]) * s0;
    const ex = ex0 + (W / 2 - ex0) * vers, ey = ey0 + (H / 2 - ey0) * vers;
    const t = `translate(${ex.toFixed(2)} ${ey.toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${S.toFixed(5)}) translate(${-cible[0]} ${-cible[1]})`;
    el.querySelectorAll('.intro-monde').forEach(g => {
      g.setAttribute('transform', t);
      g.querySelector('.i-tg')?.setAttribute('transform', `rotate(${aG.toFixed(2)} ${PIVOT_G[0]} ${PIVOT_G[1]})`);
      g.querySelector('.i-td')?.setAttribute('transform', `rotate(${aD.toFixed(2)} ${PIVOT_D[0]} ${PIVOT_D[1]})`);
    });
    const d1 = el.querySelector('#intro-onde feDisplacementMap'), o1 = el.querySelector('#intro-onde feOffset');
    const d2 = el.querySelector('#intro-onde-tete feDisplacementMap'), o2 = el.querySelector('#intro-onde-tete feOffset');
    d1.setAttribute('scale', ondes.toFixed(2)); d2.setAttribute('scale', (ondes * .35).toFixed(2));
    o1.setAttribute('dx', (flot * 1.3).toFixed(1)); o1.setAttribute('dy', (-flot).toFixed(1));
    o2.setAttribute('dx', (-flot * .6).toFixed(1)); o2.setAttribute('dy', (flot * .4).toFixed(1));
  }

  // au repos : les tentacules respirent, les ondes passent lentement
  function repos(t0) {
    const pas = now => {
      if (etat !== 'ouvert') return;
      const t = (now - t0) / 1000;
      poser({ s: 1 + Math.sin(t * 1.1) * .008, aG: Math.sin(t * .9) * 1.6, aD: -Math.sin(t * .9 + .5) * 1.6, ondes: 5 + Math.sin(t * .7) * 2, flot: t * 22, vers: 0 });
      raf = requestAnimationFrame(pas);
    };
    raf = requestAnimationFrame(pas);
  }

  /* le départ */
  function partir(e) {
    if (e) e.preventDefault?.();
    if (etat !== 'ouvert') return;
    etat = 'part';
    cancelAnimationFrame(raf);
    el.classList.add('part');
    if (!mouvement() || opts.sortie === 'fondu') return fondu(mouvement() ? 520 : 320);
    const T0 = performance.now(), TC = 520, TZ = 1250, trou = el.querySelector('[data-role="trou"]'), dessinG = el.querySelector('[data-role="dessin"]');
    const flot0 = 0;
    const pas = now => {
      const t = now - T0;
      if (t < TC) {                                        // la contraction : il se ramasse, les ondes montent
        const u = ease.inOut(t / TC);
        poser({ s: 1 - .08 * u, aG: 8 * u, aD: -8 * u, ondes: 6 + 30 * u, flot: flot0 + t * .12, vers: 0 });
      } else {                                             // l'élan : les tentacules s'ouvrent, il fonce vers nous
        const v = clamp((t - TC) / TZ), u = ease.inOut(v);
        trou.setAttribute('visibility', 'visible');
        const S = Math.exp(Math.log(.93) + u * (Math.log(opts.tache ? 14 : 46) - Math.log(.93)));
        poser({ s: S, aG: 8 - 30 * ease.out(clamp(v * 1.6)), aD: -8 + 30 * ease.out(clamp(v * 1.6)), ondes: 36 * (1 - clamp(v * 2.4)),
          flot: flot0 + t * .12, vers: ease.inOut(clamp(v * 1.4)), rot: -7 * ease.inOut(v) });
        const c = clamp(v / .55), choc = el.querySelector('.intro-choc');           // l'onde de choc
        if (choc) { choc.setAttribute('r', (geo.bw * geo.s0 * .35 + c * Math.hypot(geo.W, geo.H)).toFixed(1)); choc.style.opacity = String(.55 * (1 - c)); choc.setAttribute('stroke-width', (2.5 * (1 - c) + .5).toFixed(2)); }
        dessinG.style.opacity = String(1 - ease.out(clamp(v * 3.2)));
        if (v > .3) dessinG.querySelectorAll('[filter]').forEach(n => n.removeAttribute('filter'));   // plus d'ondes à cette échelle
        if (v > .78) el.style.opacity = String(1 - ease.in(clamp((v - .78) / .22)));
        if (v >= 1) return finir();
      }
      raf = requestAnimationFrame(pas);
    };
    raf = requestAnimationFrame(pas);
  }
  function fondu(ms) {
    el.style.transition = `opacity ${ms}ms ease`;
    requestAnimationFrame(() => { el.style.opacity = '0'; });
    setTimeout(finir, ms + 30);
  }
  function finir() {
    if (!el) return;
    cancelAnimationFrame(raf);
    removeEventListener('resize', surRedim);
    removeEventListener('hashchange', fermerVite);
    removeEventListener('keydown', surTouche);
    el.remove(); el = null; etat = 'ferme';
    document.documentElement.classList.remove('intro-active');
    inertes.forEach(n => { n.inert = false; }); inertes = [];
    try { opts.apres && opts.apres(); } catch (err) { console.error(err); }
    dispatchEvent(new Event('intro:fin'));
    const h1 = document.querySelector('main h1, h1');
    if (h1 && !location.hash.replace(/^#\/?/, '')) { if (!h1.hasAttribute('tabindex')) h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  }
  function fermerVite() { if (el) { el.style.transition = 'none'; finir(); } }

  /* les gestes */
  function surMolette(e) { e.preventDefault(); if (e.deltaY > 2) partir(); }
  let y0 = null;
  function surToucher(e) { y0 = e.touches[0].clientY; }
  function surGlisser(e) { e.preventDefault(); if (y0 !== null && y0 - e.touches[0].clientY > 24) { y0 = null; partir(); } }
  function surTouche(e) {
    if (['Enter', ' ', 'Spacebar', 'ArrowDown', 'PageDown', 'End'].includes(e.key)) { e.preventDefault(); partir(); }
  }

  return { ouvrir, ouverte: () => etat !== 'ferme', partir };
})();
</script>
<script>
/* L'édition sur place, commune aux maquettes : la compagnie modifie le site en le regardant, comme dans WordPress.
   Chaque enregistrement va dans la base ; toutes les pages ouvertes se mettent à jour (donnees.js, temps réel).

   Ce que la maquette fournit :
   - un lien ou un bouton qui appelle EDITION.ouvrir(), avec le libellé D.site.libelles.modifierSite (pied de page) ;
   - data-edit="<chemin dans D>" sur chaque texte qui vient de D, son contenu étant exactement la valeur de D :
       shows.<slug>.<champ>[.<suite>]   un spectacle   (shows.berenice.texte.0, shows.berenice.accroche)
       site.<clé>[.<suite>]             un texte du site (site.compagnie.paragraphes.2, site.ecole.texte)
       dossiers.<clé>.<suite>           un dossier scolaire (dossiers.berenice.pourquoi.sections.0.texte)
     un chemin qui finit par un rang (…texte.0) est un élément de liste : on peut ajouter un paragraphe après lui, ou le
     retirer, et la maquette se redessine (DONNEES.surChangement) ;
   - data-edit-photo="shows.<slug>.photo" ou "shows.<slug>.photos.<rang>" sur une photo : on la remplace ;
     data-edit-photo="personnes.<slug>.photo" sur le portrait d'une personne de l'équipe (data-edit="personnes.<slug>.<champ>"
     pour ses textes) : choisie ici, la photo est montrée sur le site ;
   - data-date-id="<id>" sur chaque ligne d'agenda (D.dates[].id, et l'id des dates de D.saisons) : on la modifie,

    } catch (e) {

  // la petite barre de mise en forme, au-dessus du texte qu'on écrit
  function montrerOutils(el) {
    styles();
    if (!outils) {
      outils = document.createElement('div');
      outils.className = 'ed-outils ed-boite';
      outils.addEventListener('mousedown', e => e.preventDefault());
      outils.addEventListener('click', e => {
        const b = e.target.closest('button'), cible = outils.cible; if (!b || !cible) return;
        if (b.dataset.cmd === 'createLink') { const u = prompt('Adresse du lien (https://…)'); if (u) document.execCommand('createLink', false, u); }
        else if (b.dataset.cmd) document.execCommand(b.dataset.cmd);
        else if (b.dataset.liste === 'ajouter') return ajouterApres(cible.dataset.edit);
        else if (b.dataset.liste === 'retirer') return retirer(cible.dataset.edit);
        saisir(cible);
      });
      document.body.append(outils);
    }
    outils.cible = el;
    const liste = /\.\d+$/.test(el.dataset.edit) && Array.isArray(resoudre(el.dataset.edit.replace(/\.\d+$/, '')).valeur);
    outils.innerHTML = (el.dataset.edRiche ? '<button type="button" data-cmd="bold" title="Gras"><b>G</b></button><button type="button" data-cmd="italic" title="Italique"><i>I</i></button><button type="button" data-cmd="createLink" title="Lien">lien</button>' : '')
      + (liste ? '<button type="button" data-liste="ajouter" title="Ajouter un paragraphe après celui-ci">＋ après</button><button type="button" data-liste="retirer" title="Retirer ce paragraphe">✕</button>' : '');
    outils.hidden = !outils.innerHTML;
    const r = el.getBoundingClientRect();
    outils.style.left = `${Math.max(8, Math.min(innerWidth - 260, r.left))}px`;
    outils.style.top = `${r.top > 52 ? r.top - 44 : r.bottom + 8}px`;
  }
  function saisir(el) {
    const v = el.dataset.edRiche ? propre(el.innerHTML) : el.textContent.replace(/\s+/g, ' ').trim();
    if (v === resoudre(el.dataset.edit).valeur) return;
    ecrireD(el.dataset.edit, v);
    el.classList.add('ed-modifie');
    noter(el.dataset.edit);
  }
  const vider = o => typeof o === 'string' ? '' : Array.isArray(o) ? [] : o && typeof o === 'object' ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, vider(v)])) : o;
  function ajouterApres(chemin) {
    const i = +chemin.split('.').pop(), parent = chemin.replace(/\.\d+$/, ''), arr = resoudre(parent).valeur;
    if (!Array.isArray(arr)) return;
    arr.splice(i + 1, 0, vider(clone(arr[i])));
    noter(`${parent}.${i + 1}`);
    if (document.activeElement?.blur) document.activeElement.blur();
    DONNEES.prevenir();
    // la maquette s'est redessinée : on écrit aussitôt dans le nouveau paragraphe
    const viser = () => { armerTout(); const n = $(`[data-edit="${CSS.escape(`${parent}.${i + 1}`)}"]`); if (n) { n.classList.add('ed-modifie'); n.focus(); } return !!n; };
    if (!viser()) requestAnimationFrame(viser);
  }
  function retirer(chemin) {
    const i = +chemin.split('.').pop(), parent = chemin.replace(/\.\d+$/, ''), arr = resoudre(parent).valeur;
    if (!Array.isArray(arr) || !confirm('Retirer ce paragraphe ?')) return;
    arr.splice(i, 1);
    noter(parent + '.0');
    if (outils) outils.hidden = true;
    DONNEES.prevenir();
    requestAnimationFrame(armerTout);
  }

  // les photos : on clique, on choisit, elle est allégée puis envoyée
  async function optimiser(f) {
    try {
      const img = await createImageBitmap(f), k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/webp', 0.84));
      return b && b.size < f.size ? b : f;
    } catch { return f; }
  }
  function changerPhoto(el) {
    const chemin = el.dataset.editPhoto, k = chemin.split('.');
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      annoncer('Envoi de la photo…');
      try {
        const blob = await optimiser(f);
        const dossier = k[0] === 'personnes' ? `equipe/${k[1]}-` : `${k[1]}/`;
        const nom = `${dossier}${Date.now().toString(36)}-${norm(f.name.replace(/\.[^.]+$/, '')).replace(/[^a-z0-9]+/g, '-').slice(0, 40) || 'photo'}.${blob.type === 'image/webp' ? 'webp' : (f.name.split('.').pop() || 'jpg')}`;
        await requete('POST', `/storage/v1/object/crescite/${nom.split('/').map(encodeURIComponent).join('/')}`, blob, { 'Content-Type': blob.type || f.type, 'x-upsert': 'false', 'cache-control': '31536000' });
        const url = `${BASE}/storage/v1/object/public/crescite/${nom.split('/').map(encodeURIComponent).join('/')}`;
        const cle = nom.replace(/\.[a-z0-9]+$/i, '');
        if (k[0] === 'personnes') {                // la photo d'une personne : choisie ici, elle est montrée sur le site
          const p = (D.personnes || {})[k[1]]; if (!p) throw new Error('fiche inconnue');
          p.photo = url; p._chemin = nom; noter(`personnes.${k[1]}.photo`); noter(`personnes.${k[1]}.photoPublique`);
        } else if (k[2] === 'photo') { ecrireD(`shows.${k[1]}.photo`, nom); D.photos[k[1]] = url; noter(`shows.${k[1]}.photo`); }
        else { const p = resoudre(chemin).valeur; if (p) { p.fichier = nom; p.cle = cle; D.photos[cle] = url; noter(`shows.${k[1]}.photos`); } }
        DONNEES.prevenir();
        annoncer('Photo remplacée : enregistrez pour la publier.');
      } catch (e) { annoncer(`Envoi impossible : ${e.message}`, { erreur: true }); }
    });
    inp.click();
  }

  // ----------------------------------------------------------------------------------------------- les dates
  function boutonsAgenda() {
    if (!moi.actif) return;
    // un seul « Ajouter une date » par agenda (une valeur de data-agenda) : sur sa première liste visible
    const choisies = new Map();
    $$('[data-agenda]').forEach(z => {
      const cle = z.dataset.agenda || '', vue = z.getClientRects().length > 0, c = choisies.get(cle);
      if (!c || (!c.vue && vue)) choisies.set(cle, { z, vue });
    });
    const garder = new Set([...choisies.values()].map(c => c.z));
    $$('.ed-ajout').forEach(b => { if (!garder.has(b.parentElement)) b.remove(); });
    garder.forEach(z => {
      if (z.querySelector(':scope > .ed-ajout')) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ed-bt ed-plein ed-ajout ed-boite'; b.textContent = '＋ Ajouter une date';
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); ouvrirDate(null, z.dataset.agenda || null); });
      z.prepend(b);
    });
  }

      requete('GET', '/rest/v1/crescite_lieux?select=id,nom,commune,departement,type,latitude,longitude&order=commune&limit=2000')]);
    listes = { sp, li };
    return listes;
  }

      else if (t.id === 'ed-d-sp') F.spectacle_id = +t.value;
      else if (t.id === 'ed-d-visible') F.visible = t.checked;
      else if (t.id === 'ed-d-prec') F.precision = t.value;
      else if (t.id === 'ed-s-contrat') F.suivi.contrat = t.value;
      else if (t.id === 'ed-d-libre') { libre = t.checked; q('#ed-d-int-z').hidden = !libre; F.intitule = libre ? q('#ed-d-int').value : null; }
      else return;
      changer();
    });
    P.addEventListener('click', async e => {
      const t = e.target, x = t.closest('[data-x]')?.dataset.x;
      const st = t.closest('[data-statut]');
      if (st) { F.statut = st.dataset.statut; $$('[data-statut]', P).forEach(b => b.setAttribute('aria-pressed', b === st)); return changer(); }
      if (t.dataset.retirer !== undefined) { F.representations.splice(+t.dataset.retirer, 1); reps_(); return changer(); }
      if (t.dataset.detSuppr !== undefined) { F.details.splice(+t.dataset.detSuppr, 1); details_(); return changer(); }
      if (!x) return;
      if (x === 'fermer') return fermer();
      const der = F.representations[F.representations.length - 1];
      if (x === 'meme-jour' || x === 'lendemain' || x === 'vide') {
        let jour = der?.jour || '', heure = '';
        if (x === 'lendemain' && jour) { const j = new Date(jour + 'T12:00:00'); j.setDate(j.getDate() + 1); jour = AGENDA.iso(j); heure = der.heure; }
        if (x === 'vide') { jour = ''; heure = '20:00'; }
        F.representations.push({ jour, heure, public: der?.public || 'tout_public', annulee: false, lien: '', note: '' });
        reps_(); changer();
        $(`#ed-d-reps tr:last-child [data-r="${x === 'vide' ? 'jour' : 'heure'}"]`, P)?.focus();
        return;
      }
      if (x === 'det-plus') { F.details.push({ texte: '', lien: null }); details_(); return changer(); }
      if (x === 'det-auto') { F.details = AGENDA.precisions({ ...F, details: [] }, F.representations.filter(r => r.jour), lieuDe()).map(p => ({ texte: p.texte, lien: null })); details_(); return changer(); }
      if (x === 'dupliquer') {
        voile.remove(); const G = clone(F); G.id = null; G.intitule = null; G.representations.forEach(r => delete r.id);
        annoncer('Copie prête : changez les jours ou le lieu, puis enregistrez.');
        return ouvrirDate(null, null, G);
      }
      if (x === 'supprimer') {
        if (!confirm('Supprimer cette date et ses représentations ?')) return;
        try {
          await requete('DELETE', `/rest/v1/crescite_dates?id=eq.${d.id}`, undefined, { Prefer: 'return=minimal' });
          voile.remove(); await DONNEES.recharger({ force: true });
          annoncer('Date supprimée.', { action: async () => {
            const sans = o => { const y = { ...o }; delete y.modifie_le; delete y.modifie_par; return y; };
            try {
              await requete('POST', '/rest/v1/crescite_dates', sans(d), { Prefer: 'return=minimal' });
              if (reps.length) await requete('POST', '/rest/v1/crescite_representations', reps.map(sans), { Prefer: 'return=minimal' });
              if (suivi.date_id) await requete('POST', '/rest/v1/crescite_dates_suivi', sans(suivi), { Prefer: 'return=minimal' });
              await DONNEES.recharger({ force: true }); annoncer('Date rétablie.');
            } catch (er) { annoncer(`Rétablissement impossible : ${er.message}`, { erreur: true }); }
          }, delai: 9000 });
        } catch (er) { annoncer(`Suppression impossible : ${er.message}`, { erreur: true }); }
        return;
      }
      if (x === 'enregistrer') {
        const rs = F.representations.filter(r => r.jour);
        if (F.representations.some(r => !r.jour)) return annoncer('Chaque représentation a besoin de son jour (ou retirez la ligne vide).', { erreur: true });
        const js = rs.map(r => r.jour).sort(), debut = js[0] || F.debut;
        if (!debut) return annoncer('Indiquez au moins un jour.', { erreur: true });
        const ps = new Set(rs.map(r => r.public));
        const charge = { id: F.id, spectacle_id: +F.spectacle_id, lieu_id: F.lieu_id, debut, fin: js[js.length - 1] || F.fin || debut, precision: rs.length ? 'jour' : F.precision,
          saison: d && d.debut === debut ? d.saison : null, public: ps.size > 1 ? 'mixte' : ps.size ? [...ps][0] : (F.public || 'tout_public'), statut: F.statut, visible: F.visible,
          intitule: libre ? (F.intitule || '').trim() || null : null, details: (F.details || []).filter(y => (y.texte || '').replace(/<[^>]+>/g, '').trim()).map(y => ({ texte: y.texte, lien: y.lien || null })),
          lien: (F.lien || '').trim() || null, nb_representations: rs.length ? null : F.nb_representations,
          representations: rs.map(r => ({ id: r.id, jour: r.jour, heure: r.heure || null, public: r.public, annulee: !!r.annulee, lien: (r.lien || '').trim() || null, note: (r.note || '').trim() || null })), suivi: F.suivi };
        t.disabled = true;
        try {
          await requete('POST', '/rest/v1/rpc/crescite_enregistrer_date', { d: charge });
          voile.remove(); await DONNEES.recharger({ force: true });
          annoncer(F.statut === 'option' || !F.visible ? 'Enregistré (non publié sur le site).' : 'Enregistré : le site est à jour.');
        } catch (er) { t.disabled = false; annoncer(`L’enregistrement a échoué : ${er.message}`, { erreur: true }); }
      }
    });
    if (depart) sale = true;
    (d ? q('#ed-d-sp') : q('#ed-d-lieu')).focus();
  }

  // ----------------------------------------------------------------------------------------------- écouteurs, en mode édition
  document.addEventListener('click', e => {
    if (!moi.actif) return;
    if (e.target.closest('.ed-boite')) return;
    const ed = e.target.closest('[data-edit]');
    if (ed) { e.preventDefault(); e.stopPropagation(); return; }                 // on écrit, on ne suit pas les liens
    const ph = e.target.closest('[data-edit-photo]');
    if (ph) { e.preventDefault(); e.stopPropagation(); return changerPhoto(ph); }
    const dt = e.target.closest('[data-date-id]');
    if (dt && dt.dataset.dateId) { e.preventDefault(); e.stopPropagation(); return ouvrirDate(+dt.dataset.dateId); }
  }, true);
  document.addEventListener('focusin', e => { if (moi.actif && e.target.closest?.('[data-edit]')) montrerOutils(e.target.closest('[data-edit]')); });
  document.addEventListener('focusout', e => { const el = e.target.closest?.('[data-edit]'); if (moi.actif && el) { saisir(el); setTimeout(() => { if (outils && !outils.contains(document.activeElement) && !document.activeElement?.closest?.('[data-edit]')) outils.hidden = true; }, 120); } });
  document.addEventListener('input', e => { const el = e.target.closest?.('[data-edit]'); if (moi.actif && el) { el.classList.add('ed-modifie'); noter(el.dataset.edit); } });
  document.addEventListener('keydown', e => {
    if (!moi.actif) return;
    const el = e.target.closest?.('[data-edit]');
    if (el && e.key === 'Escape') el.blur();
    if (el && e.key === 'Enter' && !el.dataset.edRiche) { e.preventDefault(); el.blur(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (el) saisir(el); enregistrer(); }
  }, true);
  document.addEventListener('paste', e => {
    const el = e.target.closest?.('[data-edit], .ed-riche');
    if (!moi.actif || !el) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  }, true);
  window.addEventListener('beforeunload', e => { if (moi.actif && modifies.size) { e.preventDefault(); e.returnValue = ''; } });

  // ----------------------------------------------------------------------------------------------- connexion
  function ecranConnexion() {
    styles();
    const voile = document.createElement('div');
    voile.className = 'ed-voile ed-boite';
    voile.innerHTML = `<form class="ed-panneau ed-petit" role="dialog" aria-modal="true" aria-labelledby="ed-c-titre">
      <div class="ed-tete"><h2 id="ed-c-titre">Modifier le site</h2><button type="button" class="ed-bt" data-x="fermer">Fermer</button></div>
      <div class="ed-corps"><p class="ed-aide" style="margin:0 0 12px">Réservé à la compagnie : connectez-vous avec le compte de l’administration.</p>
        <label class="ed-champ"><span>Adresse électronique</span><input type="email" id="ed-c-mel" autocomplete="username" required></label>
        <label class="ed-champ"><span>Mot de passe</span><input type="password" id="ed-c-mdp" autocomplete="current-password" required></label>
        <p class="ed-aide" id="ed-c-err" role="alert" style="color:#b3261e;margin:0 0 8px"></p></div>
      <div class="ed-pied"><a class="ed-note" href="${ADMIN}" target="_blank" rel="noopener">Mot de passe oublié ?</a><button type="submit" class="ed-bt ed-plein">Se connecter</button></div></form>`;
    document.body.append(voile);
    $('#ed-c-mel', voile).focus();
    $('[data-x="fermer"]', voile).addEventListener('click', () => voile.remove());
    voile.addEventListener('keydown', e => { if (e.key === 'Escape') voile.remove(); });
    $('form', voile).addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('button[type=submit]', voile); b.disabled = true;
      try {
        session = await auth('password', { email: $('#ed-c-mel', voile).value.trim(), password: $('#ed-c-mdp', voile).value });
        garderSession(session);
        if (!(await estAdmin())) throw new Error('Ce compte n’administre pas le site de la compagnie.');
        voile.remove(); entrer();
      } catch (err) { b.disabled = false; $('#ed-c-err', voile).textContent = /invalid/i.test(err.message) ? 'Adresse ou mot de passe incorrect.' : err.message; }
    });
  }
  moi.ouvrir = async () => {
    if (moi.actif) return;
    styles();
    if (typeof DONNEES === 'undefined' || DONNEES.etat !== 'base') {
      if (typeof DONNEES !== 'undefined' && DONNEES.etat === 'instantane') await DONNEES.recharger();
      if (typeof DONNEES === 'undefined' || DONNEES.etat !== 'base') return annoncer('La base de la compagnie ne répond pas : la modification est impossible pour l’instant.', { erreur: true });
    }
    session = lireSession();
    if (session) { try { await jeton(); if (await estAdmin()) return entrer(); } catch { session = null; garderSession(null); } }
    ecranConnexion();
  };
  // #edition dans l'adresse (lien depuis l'administration) ouvre directement l'édition
  if (/[?&]edition\b/.test(location.search)) setTimeout(() => moi.ouvrir(), 600);
  return moi;
})();

<script>
/* Le dossier d'un spectacle, en PDF, composé à la demande depuis les données du site (D) : pour les programmateurs et
   les directeurs de salle. Toujours à jour avec la base, sans fichier à refaire. build.py l'ajoute aux outils communs ;
   pdfmake (admin/vendor/, publié avec le site) n'est chargé qu'au premier clic.

   DOSSIER.telecharger(slug)   compose le PDF du spectacle et le télécharge (« dossier-<slug>.pdf ») ; rend une promesse
   DOSSIER.pdf(slug)           la même chose, rendue en Blob
   DOSSIER.vendor              le dossier de pdfmake (par défaut admin/vendor/, à côté des maquettes)

   Ce qu'il contient, tiré de D : la couverture (titre, sous-titre, création, photo, couleur de l'univers), le spectacle
   (sa présentation), la distribution (D.shows[].equipe ou « avec », puis la fiche), les conditions d'accueil (format,
   durée, jauge, équipe, et la fiche technique quand le dossier du spectacle l'a), la diffusion (représentations, lieux),
   la production, et le contact diffusion (D.site.programmation). Aucun texte n'est inventé : seuls les intitulés
   viennent de D.site.libelles. */
const DOSSIER = (() => {
  'use strict';
  const L = () => (D.site && D.site.libelles) || {};
  const ENCRE = '#1d1720', GRIS = '#5f5763', TRAIT = '#dcd5db', LARGEUR = 595.28 - 2 * 52;
  let chargement = null;
  const script = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(`impossible de charger ${src}`)); document.head.append(s); });
  function charger() {
    if (typeof pdfMake !== 'undefined' && pdfMake.vfs && pdfMake.vfs['Roboto-Regular.ttf']) return Promise.resolve();
    if (!chargement) {
      const dossier = String(api.vendor).replace(/\/?$/, '/');
      chargement = (typeof pdfMake !== 'undefined' ? Promise.resolve() : script(dossier + 'pdfmake.min.js'))
        .then(() => (pdfMake.vfs && pdfMake.vfs['Roboto-Regular.ttf'] ? null : script(dossier + 'vfs_fonts.js')))
        .catch(e => { chargement = null; throw e; });
    }
    return chargement;
  }
  // la police du PDF (Roboto) n'a pas certains signes : on les remplace
  const pt = s => String(s ?? '').replace(/ /g, ' ').replace(/[→⟶]/g, '–');
  // du HTML des sources vers des morceaux de texte pdfmake : italique, gras, retours à la ligne
  function morceaux(html) {
    const doc = new DOMParser().parseFromString(`<div>${String(html ?? '')}</div>`, 'text/html');
    const out = [];
    const marcher = (n, st) => {
      if (n.nodeType === 3) { if (n.textContent) out.push({ text: pt(n.textContent), ...st }); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase();
      if (t === 'br') { out.push({ text: '\n' }); return; }
      const s2 = { ...st, ...(t === 'em' || t === 'i' ? { italics: true } : {}), ...(t === 'strong' || t === 'b' ? { bold: true } : {}) };
      n.childNodes.forEach(c => marcher(c, s2));
      if (t === 'p' || t === 'li') out.push({ text: '\n' });
    };
    doc.body.firstChild.childNodes.forEach(c => marcher(c, {}));
    while (out.length && out[out.length - 1].text === '\n') out.pop();
    return out.length ? out : [{ text: '' }];
  }
  const brut = html => morceaux(html).map(x => x.text).join('').trim();
  const maj = t => pt(t).charAt(0).toUpperCase() + pt(t).slice(1);
  // une photo en JPEG (pdfmake ne lit ni le WebP ni les adresses), recadrée au centre : au rapport largeur/hauteur « ratio »,
  // ou au moins « large » (une photo en hauteur ne mange pas la couverture) ; rien si elle ne se charge pas
  async function image(url, { max = 1400, ratio = 0, large = 0 } = {}) {
    if (!url) return null;
    try {
      const r = await fetch(url, { mode: 'cors' });
      if (!r.ok) return null;
      const bmp = await createImageBitmap(await r.blob());
      let sx = 0, sy = 0, sl = bmp.width, sh = bmp.height;
      const voulu = ratio || (large && sl / sh < large ? large : 0);
      if (voulu && sl / sh > voulu) { sl = Math.round(sh * voulu); sx = Math.round((bmp.width - sl) / 2); }
      else if (voulu) { sh = Math.round(sl / voulu); sy = Math.round((bmp.height - sh) / 2); }
      const k = Math.min(1, max / Math.max(sl, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sl * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(bmp, sx, sy, sl, sh, 0, 0, c.width, c.height);
      return { data: c.toDataURL('image/jpeg', 0.86), l: c.width, h: c.height };
    } catch { return null; }
  }
  const titreSection = (t, couleur) => ({ intitule: true, stack: [{ text: pt(t).toUpperCase(), fontSize: 8.5, bold: true, characterSpacing: 1.3, color: couleur },
    { canvas: [{ type: 'line', x1: 0, y1: 3, x2: LARGEUR, y2: 3, lineWidth: 0.6, lineColor: TRAIT }] }], margin: [0, 20, 0, 6] });
  const sobre = { hLineWidth: (i, n) => (i === 0 || i === n.table.body.length ? 0 : 0.5), vLineWidth: () => 0, hLineColor: () => TRAIT,
    paddingLeft: i => (i === 0 ? 0 : 10), paddingRight: () => 0, paddingTop: () => 4, paddingBottom: () => 4 };

  async function definition(slug) {
    const s = (D.shows || []).find(x => x.slug === slug);
    if (!s) throw new Error(`spectacle inconnu : ${slug}`);
    const lib = L(), couleur = s.couleurTexteClair || s.couleur || '#a3306b';
    const nom = (D.site && D.site.nom) || 'Compagnie Crescite';
    const photos = D.photos || {};
    const [principale, ...galerie] = await Promise.all([image(photos[s.slug], { max: 1600, large: 1.4 }),
      ...(s.photos || []).slice(0, 2).map(p => image(photos[p.cle], { max: 1000, ratio: 3 / 2 }))]);
    const contenu = [];
    // la couverture
    contenu.push({ canvas: [{ type: 'rect', x: 0, y: 0, w: LARGEUR, h: 5, color: couleur }] });
    contenu.push({ text: pt(nom).toUpperCase(), fontSize: 8.5, bold: true, characterSpacing: 1.4, color: GRIS, margin: [0, 14, 0, 0] });
    contenu.push({ text: pt((s.titreLignes || [s.titre]).join(' ')), fontSize: 30, bold: true, color: couleur, margin: [0, 8, 0, 0], lineHeight: 1.02 });
    if (s.sousTitre) contenu.push({ text: morceaux(s.sousTitre), fontSize: 12.5, color: ENCRE, margin: [0, 4, 0, 0] });
    const sous = [s.creation, s.duree].filter(Boolean).map(x => maj(brut(x))).join('   ·   ');
    if (sous) contenu.push({ text: pt(sous), fontSize: 10, color: GRIS, margin: [0, 8, 0, 0] });
    if (principale) contenu.push({ image: principale.data, width: LARGEUR, margin: [0, 16, 0, 0] });
    if (s.credit) contenu.push({ text: morceaux(s.credit), fontSize: 7.5, color: GRIS, alignment: 'right', margin: [0, 3, 0, 0] });
    if (s.accroche) contenu.push({ text: morceaux(s.accroche), fontSize: 13, italics: true, margin: [0, 16, 0, 0], lineHeight: 1.3 });
    // le spectacle
    if ((s.texte || []).length) {
      contenu.push(titreSection(lib.leSpectacle || 'Le spectacle', couleur));
      s.texte.forEach((p, i) => contenu.push({ text: morceaux(p), margin: [0, i ? 6 : 0, 0, 0], alignment: 'justify' }));
    }
    if (galerie.filter(Boolean).length) {
      const g = galerie.filter(Boolean), l = (LARGEUR - 10 * (g.length - 1)) / g.length;
      contenu.push({ columns: g.map(x => ({ image: x.data, width: l })), columnGap: 10, margin: [0, 14, 0, 0] });
    }
    // la distribution
    const equipe = s.equipe || [], P = D.personnes || {};
    const nomDe = x => { const p = P[x.personne] || {}; return [p.prenom, p.nom].filter(Boolean).join(' '); };
    const jeu = equipe.filter(x => x.categorie === 'jeu');
    // un spectacle en création n'a parfois que l'équipe de création annoncée (« Mise en scène : … ») : elle remplace la fiche
    const creation = (s.programmer && s.programmer.equipeCreation) || [];
    const fiche = (s.fiche || []).filter(f => f.valeur && (f.libelle || !creation.length));
    if (jeu.length || s.avec || fiche.length || creation.length) {
      contenu.push(titreSection(lib.distribution || 'Distribution', couleur));
      if (jeu.length) contenu.push({ text: jeu.map((x, i) => [{ text: (i ? ', ' : '') + pt(nomDe(x)), bold: true }, ...(x.alternance ? [{ text: pt(` (${x.alternance})`), color: GRIS }] : [])]).flat(), margin: [0, 0, 0, 6] });
      else if (s.avec) contenu.push({ text: [{ text: pt(brut(s.avec.libelle)) + ' ', color: GRIS }, ...morceaux(s.avec.valeur)], margin: [0, 0, 0, 6] });
      creation.forEach(x => { const [l, ...v] = brut(x).split(' : ');
        contenu.push({ text: v.length ? [{ text: pt(l) + ' : ', color: GRIS }, { text: pt(v.join(' : ')) }] : pt(l), margin: [0, 0, 0, 3] }); });
      const avecLibelle = fiche.filter(f => f.libelle), sans = fiche.filter(f => !f.libelle);
      if (avecLibelle.length) contenu.push({ table: { widths: [150, '*'], body: avecLibelle.map(f => [{ text: pt(brut(f.libelle)), color: GRIS }, { text: morceaux(f.valeur) }]) }, layout: sobre });
      sans.forEach(f => contenu.push({ text: morceaux(f.valeur), margin: [0, 2, 0, 0] }));
    }
    // les conditions d'accueil
    const pr = s.programmer || {}, accueil = s.dossier && D.dossiers && D.dossiers[s.dossier] && D.dossiers[s.dossier].accueil;
    // la fiche technique du dossier reprend déjà la durée, la jauge et l'équipe : on ne les écrit pas deux fois
    const lignes = (accueil ? [pr.format] : [pr.format, pr.duree || s.duree, pr.jauge, pr.equipe]).filter(Boolean);
    if (lignes.length || accueil) {
      contenu.push(titreSection(lib.conditionsAccueil || 'Conditions d’accueil', couleur));
      lignes.forEach((x, i) => contenu.push({ text: maj(brut(x)), bold: i === 0 && x === pr.format, margin: [0, 0, 0, 3] }));
      // chaque bloc de la fiche technique (« PLATEAU : », « MATÉRIEL… ») reste d'un seul tenant
      if (accueil) (accueil.blocs || []).forEach(b => contenu.push({ unbreakable: true, stack: [
        ...(b.titre ? [{ text: pt(brut(b.titre)), bold: true, fontSize: 9.5, margin: [0, 8, 0, 2] }] : []),
        ...(b.lignes || []).map(x => ({ text: morceaux(x), margin: [0, 0, 0, 2] }))] }));
      if (lib.conditionsFinancieres) contenu.push({ text: pt(lib.conditionsFinancieres), color: GRIS, margin: [0, 8, 0, 0] });
    }
    // la diffusion
    if (pr.representations || pr.lieux || pr.actualite) {
      contenu.push(titreSection(lib.representations || 'Représentations', couleur));
      if (pr.representations) contenu.push({ text: maj(brut(pr.representations)), bold: true, margin: [0, 0, 0, 4] });
      if (pr.actualite) contenu.push({ text: maj(brut(pr.actualite)), margin: [0, 0, 0, 4] });
      if (pr.lieux) contenu.push({ text: [{ text: pt(lib.lieuxDiffusion || '') + (lib.lieuxDiffusion ? ' : ' : ''), color: GRIS }, ...morceaux(pr.lieux)] });
    }
    // la production
    if ((s.production || []).length) {
      contenu.push(titreSection(lib.production || 'Production', couleur));
      s.production.forEach(x => contenu.push({ text: morceaux(x), fontSize: 9, margin: [0, 0, 0, 3] }));
    }
    // le contact
    const c = (D.site && D.site.programmation && D.site.programmation.contact) || {};
    if (c.nom || c.email) {
      contenu.push(titreSection(lib.contactDiffusion || 'Contact', couleur));
      contenu.push({ text: [{ text: pt(c.nom || ''), bold: true }, ...(c.role ? [{ text: pt(`, ${c.role}`), color: GRIS }] : [])] });
      if (c.email) contenu.push({ text: pt(c.email), link: `mailto:${c.email}`, color: couleur });
      if (c.telephone) contenu.push({ text: pt(c.telephone), link: `tel:${String(c.telephone).replace(/[^\d+]/g, '')}` });
      const co = D.site.coordonnees || {};
      const adresse = [co.nom, ...(co.adresse || [])].filter(Boolean).map(brut);
      if (adresse.length) contenu.push({ text: pt(adresse.join(' · ')), color: GRIS, fontSize: 8.5, margin: [0, 6, 0, 0] });
    }
    // un intitulé de section n'est jamais seul en bas de page : il part avec l'élément qui le suit
    for (let i = contenu.length - 2; i >= 0; i--) {
      if (contenu[i].intitule) contenu.splice(i, 2, { unbreakable: true, stack: [contenu[i], contenu[i + 1]] });
    }
    return {
      pageSize: 'A4', pageMargins: [52, 54, 52, 50],
      info: { title: pt(`${s.titre} · ${nom}`), author: pt(nom) },
      defaultStyle: { font: 'Roboto', fontSize: 9.8, lineHeight: 1.28, color: ENCRE },
      header: page => (page === 1 ? null : { margin: [52, 24, 52, 0], columns: [
        { text: pt(nom), fontSize: 7.5, color: GRIS }, { text: pt(s.titre), fontSize: 7.5, color: GRIS, alignment: 'right' }] }),
      footer: (page, pages) => ({ margin: [52, 18, 52, 0], columns: [
        { text: pt(`${nom} · ${s.titre}`), fontSize: 7.5, color: GRIS }, { text: `${page} / ${pages}`, fontSize: 7.5, color: GRIS, alignment: 'right' }] }),
      content: contenu,
    };
  }
  async function pdf(slug) {
    await charger();
    const dd = await definition(slug);
    return new Promise((ok, ko) => { try { pdfMake.createPdf(dd).getBlob(ok); } catch (e) { ko(e); } });
  }
  async function telecharger(slug) {
    const blob = await pdf(slug);
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `dossier-${slug}.pdf`; a.rel = 'noopener';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return blob;
  }
  const api = { telecharger, pdf, definition, vendor: 'admin/vendor/' };
  return api;
})();

<script>
/* Les frises chronologiques, communes aux maquettes (règle 15 D du contrat) : un moteur de frise, comme carte.js l'est pour
   la carte. Partout où il y a un calendrier, une frise le rend lisible d'un regard : les mois (ou les années), les dates
   aux couleurs de leur spectacle, « aujourd'hui » qui respire. Chaque maquette l'habille dans son univers (variables
   --fr-* et classes, voir plus bas). build.py l'ajoute après dossier.js et le copie à côté de l'administration.

   FRISE.creer(conteneur, options) → frise          (la frise est ajoutée dans le conteneur)
   options
     echelle      'saison'   de septembre à août de `saison` ('2026-2027')
                  'annees'   plusieurs saisons, en bandes : de `debut` à `fin` ('2016-2017', '2026-2027' ou 'AAAA-MM-JJ')
                  'periode'  de `debut` à `fin` ('AAAA-MM-JJ'), libres ; sans eux, les mois (ou les années) des points
     aujourdhui   'AAAA-MM-JJ' (D.aujourdhui) : le repère « aujourd'hui » (libellé D.site.libelles.aujourdhui), qui respire
     points       [{ id, jour, fin, couleur, titre, quand, texte, lien, slug, l, scolaire, annulee, etat, annee }]
                    jour, fin  'AAAA-MM-JJ' (fin : le dernier jour ; une date longue devient un trait)
                    quand      la date écrite comme l'agenda (d.ligneDate…) ; sans elle, AGENDA.quand ; annee : une année seule
                    titre      le spectacle ; l : la commune (CARTE.lieux[l]) ; texte : une ligne de plus dans la bulle
                    lien       le repère est un lien ; sinon un bouton (choix)
                    scolaire, annulee (barrée), etat (« date annulée » : écrit dans la bulle)
                    id         la clé du repère : relie la liste ([data-frise-id] ou [data-date-id]) et fait glisser (maj)
     bandes       [{ id, debut, fin, titre, n, lien, etiquette }] : une saison et sa densité (échelle annees) ;
                    etiquette : le nom court sous la bande (par défaut les années de la saison, « 2019-2020 »)
     orientation  'auto' (horizontale ; au doigt, elle défile, aimantée aux mois) · 'horizontale' · 'verticale'
     regrouper    14 (px) : des repères d'un jour plus proches que cela forment une grappe, avec leur nombre
     couloirs     3 : les repères qui se chevauchent passent en couloirs (au-delà, ils se superposent)
     etiquettes   false · true : le titre de chaque repère est écrit au-dessus de lui (une frise historique) ; les points restent
                  sur l'axe, les étiquettes montent en couloirs, un filet les relie ; largeurCar (6.6 px par caractère) et
                  largeurMax (170 px) : la place d'une étiquette, si la maquette les écrit plus grandes
     relier       { liste, carte } (réglé à la création)
                    liste  un élément : survoler un repère allume sa ligne [data-frise-id="<id>"] (ou [data-date-id="<id>"]),
                           et survoler une ligne allume son repère
                    carte  le SVG d'une carte (communes .carte-lieu[data-l]) : survoler un repère allume sa commune
                           (classe est-allume), survoler une commune allume ses repères ; ou une fonction (l | null)
     survol(p)    au survol et au focus d'un repère (p ; null en sortant) ; choix(p) au clic et à Entrée
     libelle      le nom de la liste pour les lecteurs d'écran (un texte de D)
     largeur      la largeur attendue en px (sinon estimée, puis mesurée par ResizeObserver)
     moisMin, anMin   76 et 72 (px) : la place d'un mois, d'une année, sous laquelle la frise défile au doigt
     immediat     true : la frise est là d'emblée, sans son entrée (une vue refaite en place quand D change)
     classe       une classe de plus sur .frise
   frise.maj(options)          change les points, les bandes ou les options : les repères glissent à leur place (FLIP),
                               ceux qui arrivent paraissent, ceux qui partent s'effacent
   frise.allumer(id | { l })   allume un repère (ou les repères d'une commune) ; frise.eteindre() ; frise.points (le modèle)
   frise.aller(id)             fait défiler la frise jusqu'au repère et l'allume
   frise.detruire()            retire la frise et ses observateurs ; frise.el : l'élément .frise
   FRISE.jour('AAAA-MM-JJ')    le numéro du jour (UTC) ; FRISE.permis() : faux si moins d'animations est demandé ou ?anim=0

   Le rendu : une vraie liste ordonnée dans l'ordre du temps (<ol>), un lien ou un bouton par repère ; les flèches passent
   d'un repère à l'autre (Début, Fin) ; chaque repère a pour nom la date écrite comme l'agenda, le titre et la commune ;
   une bulle les montre au survol et au focus. Les mois et les années viennent des dates (AGENDA.MOIS), « aujourd'hui »
   de D.site.libelles.aujourdhui : aucun autre texte. Un seul innerHTML, positions en pourcentage, mouvements par

   Le mouvement : l'axe se trace quand la frise entre dans l'écran et les repères arrivent dans l'ordre du temps : ils sont
   dévoilés de gauche à droite avec lui (une seule animation par conteneur, 840 ms en tout) ; « aujourd'hui » respire.

     classes    .frise (+ .frise--saison/--annees/--periode, .frise--h/--v, .frise--mois/--ans, .est-vue, .est-immobile)

                .frise-bande-n, .frise-bande-nom) .frise-aujourdhui (.frise-aujourdhui-nom) .frise-bulle
                états : .est-passe .est-allume .est-annule .est-scolaire .est-duree .est-groupe .est-focus .est-a-droite
