        const nomB = b.etiquette != null ? String(b.etiquette) : `${new Date(x.a * 864e5).getUTCFullYear()}-${new Date((x.z) * 864e5).getUTCFullYear()}`;
        const att = `class="frise-repere" tabindex="${k === bandes.length - 1 ? '0' : '-1'}" aria-label="${esc([b.titre || nomB, n ? String(n) : ''].filter(Boolean).join(' : '))}"`;
        const dedans = `<span class="frise-bande-barre"></span>${n ? `<span class="frise-bande-n">${n}</span>` : ''}<span class="frise-bande-nom">${esc(nomB)}</span>`;
        return `<li class="frise-bande${passe ? ' est-passe' : ''}" data-frise-cle="b:${esc(b.id ?? x.i)}"${b.id != null ? ` data-id="${esc(b.id)}"` : ''} style="--fr-x:${f3(pct(x.a))};--fr-w:${f3((x.z + 1 - x.a) / span * 100)};--fr-d:${f3(n / nMax)};--fr-t:${f3(bandes.length > 1 ? k / (bandes.length - 1) : 0)}${b.couleur ? `;--fr-c:${esc(b.couleur)}` : ''}">${b.lien ? `<a ${att} href="${esc(b.lien)}">${dedans}</a>` : `<button type="button" ${att}>${dedans}</button>`}</li>`;
      };
      const xa = dansEchelle ? pct(auj + .5) : 0;
      const aujourdhui = dansEchelle ? `<div class="frise-aujourdhui${xa < 6 ? ' est-bord-g' : xa > 94 ? ' est-bord-d' : ''}" style="--fr-x:${f3(xa)}">${L ? `<span class="frise-aujourdhui-nom">${esc(L)}</span>` : ''}<span class="frise-souffle"></span></div>` : '';
      const libelle = o.libelle ? ` aria-label="${esc(o.libelle)}"` : '';
      toile.style.cssText = `--fr-n:${f3(G.unites)};--fr-unite:${unite}px;--fr-nc:${o.echelle === 'annees' ? 1 : M.nc}`;
      classes();
      // ceux qui partent (maj), gardés pour s'effacer
      const partants = animer && avant ? [...toile.querySelectorAll('[data-frise-cle]')].filter(n => !M.pts.some(q => q.cle === n.dataset.friseCle) && !M.grappes.some(g => g.cle === n.dataset.friseCle) && !n.classList.contains('frise-bande')) : [];
      toile.innerHTML = `<div class="frise-axe"></div><ol class="frise-mois" aria-hidden="true">${ticks}</ol>${aujourdhui}
        ${bandes.length ? `<ol class="frise-bandes"${libelle}>${bandes.map(bande).join('')}</ol>` : ''}
        ${M.pts.length ? `<ol class="frise-points"${bandes.length ? '' : libelle}>${M.pts.map(repere).join('')}</ol>` : ''}
        ${M.grappes.length ? `<ol class="frise-grappes" aria-hidden="true">${M.grappes.map(grappe).join('')}</ol>` : ''}`;
      f.modele = { M, bandes, nc: M.nc, sig: signature(M), dens: new Map(bandes.map(x => [`b:${x.b.id ?? x.i}`, (+x.b.n || 0) / nMax])), pos: new Map([...M.pts.map(q => [q.cle, { x: q.grappe ? q.xg : q.x, y: q.y || 0 }]), ...M.grappes.map(g => [g.cle, { x: g.x, y: g.y || 0 }])]) };
      if (animer && avant && !f.immobile && f.vu) glisser(avant, partants);
      return M;
    }
    // FLIP sans lecture de mise en page : les positions d'avant et d'après sont dans le modèle (en % de la toile, dont la
    // largeur f.W est tenue à jour par ResizeObserver, et en couloirs) ; seuls transform et opacity bougent
    function glisser(avant, partants) {
      if (o.orientation === 'verticale') return;
      const opts = { duration: 320, easing: COURBE }, W = f.W, nc0 = avant.nc, nc1 = f.modele.nc;
      toile.querySelectorAll('[data-frise-cle]').forEach(n => {
        const k = n.dataset.friseCle;
        if (n.classList.contains('frise-bande')) {
          const d0 = avant.dens && avant.dens.get(k), d1 = f.modele.dens.get(k);
          if (d0 == null || d1 == null || d0 === d1) return;
          const barre = n.querySelector('.frise-bande-barre'), nb = n.querySelector('.frise-bande-n');
          if (barre) barre.animate([{ transform: `scaleY(${Math.max(.04, d0)})` }, { transform: `scaleY(${Math.max(.04, d1)})` }], opts);
          if (nb) nb.animate([{ transform: `translateY(calc(${f3(d1 - d0)} * var(--fr-bande-h)))` }, { transform: 'none' }], opts);
          return;
        }
        const a = avant.pos.get(k), b = f.modele.pos.get(k);
        if (a && b) {
          if (a.x === b.x && a.y === b.y && nc0 === nc1) return;
          n.animate([{ transform: `translate(${f3((a.x - b.x) / 100 * W)}px, calc(${(nc0 - nc1) - (a.y - b.y)} * var(--fr-couloir)))` }, { transform: 'none' }], opts);
        } else if (!a) n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out', delay: 60, fill: 'backwards' });
      });
      if (partants.length) {
        const calque = document.createElement('div');
        calque.className = 'frise-partants';
        calque.setAttribute('aria-hidden', 'true');
        calque.style.cssText = 'position:absolute;inset:0;pointer-events:none';
        partants.forEach(n => { n.querySelectorAll('[tabindex]').forEach(x => x.setAttribute('tabindex', '-1')); calque.appendChild(n); });
        toile.appendChild(calque);
        const an = calque.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-in', fill: 'forwards' });
        an.onfinish = () => calque.remove();
      }
    }

    /* la lumière : un repère allumé, sa ligne dans la liste, sa commune sur la carte */
    const R = o.relier || {};
    const ligneDe = id => {
      if (!R.liste || id == null || id === '') return [];
      const e = CSS.escape(String(id));
      const l = R.liste.querySelectorAll(`[data-frise-id="${e}"]`);
      return l.length ? [...l] : [...R.liste.querySelectorAll(`[data-date-id="${e}"]`)];
    };
    function eteindre() {
      f.lumiere.forEach(n => n.classList.remove('est-allume'));
      f.lumiere = [];
    }
    function allumer(cle, { liste = true, carte = true } = {}) {
      eteindre();
      const M = f.modele && f.modele.M; if (!M) return;
      let qs = [];
      if (cle && typeof cle === 'object' && 'l' in cle) qs = M.pts.filter(q => q.p.l != null && q.p.l === cle.l);
      else qs = M.pts.filter(q => String(q.p.id) === String(cle) || q.cle === cle);
      const lis = [];
      qs.forEach(q => {
        const li = toile.querySelector(`[data-frise-cle="${CSS.escape(q.cle)}"]`); if (li) lis.push(li);
        if (q.grappe) { const g = toile.querySelector(`[data-frise-cle="${CSS.escape(q.grappe.cle)}"]`); if (g) lis.push(g); }
        if (liste) lis.push(...ligneDe(q.p.id));
      });
      const bs = (f.modele.bandes || []).filter(x => String(x.b.id) === String(cle));
      bs.forEach(x => { const li = toile.querySelector(`[data-frise-cle="b:${CSS.escape(String(x.b.id ?? x.i))}"]`); if (li) lis.push(li); if (liste) lis.push(...ligneDe(x.b.id)); });
      if (carte && R.carte && typeof R.carte !== 'function' && qs.length) {
        const ls = new Set(qs.map(q => q.p.l).filter(l => l != null));
        ls.forEach(l => R.carte.querySelectorAll(`.carte-lieu[data-l="${l}"]`).forEach(n => lis.push(n)));
      }
      lis.forEach(n => n.classList.add('est-allume'));
      f.lumiere = lis;
    }
    // la bulle, au-dessus du repère (une lecture de mise en page par survol)
    function montrer(cible, qs) {
      if (!qs.length) { bulle.classList.remove('est-ouverte'); return; }
      const ligne = q => { const p = q.p, c = nomLieu(p.l) || p.commune || '';
        return `<b>${esc(quandDe(p))}</b>${p.titre ? `<span>${p.couleur ? `<i style="--fr-c:${esc(p.couleur)}"></i>` : ''}${esc(p.titre)}</span>` : ''}${c ? `<span class="frise-bulle-ou">${esc(c)}</span>` : ''}${p.texte ? `<span class="frise-bulle-ou">${esc(p.texte)}</span>` : ''}${p.etat ? `<span class="frise-bulle-etat">${esc(p.etat)}</span>` : ''}`; };
      bulle.innerHTML = qs.length === 1 ? ligne(qs[0]) : `<ul>${qs.slice(0, 8).map(q => `<li>${ligne(q)}</li>`).join('')}</ul>`;
      const r = cible.getBoundingClientRect(), E = el.getBoundingClientRect(), bw = bulle.offsetWidth, bh = bulle.offsetHeight;
      let x = r.left + r.width / 2 - E.left - bw / 2;
      x = Math.max(-E.left + 8, Math.min(x, innerWidth - E.left - bw - 8));
      let y = r.top - E.top - bh - 10;
      if (r.top - bh - 10 < 8) y = r.bottom - E.top + 10;
      bulle.style.setProperty('--fr-bx', `${Math.round(x)}px`);
      bulle.style.setProperty('--fr-by', `${Math.round(y)}px`);
      bulle.classList.add('est-ouverte');
    }
    const cacher = () => bulle.classList.remove('est-ouverte');
    const qDe = n => {
      const M = f.modele && f.modele.M; if (!M || !n) return null;
      const li = n.closest('[data-frise-cle]'); if (!li) return null;
      const k = li.dataset.friseCle;
      if (k.startsWith('g:')) { const g = M.grappes.find(x => x.cle === k); return g ? { grappe: g } : null; }
      if (k.startsWith('b:')) { const x = (f.modele.bandes || []).find(y => `b:${y.b.id ?? y.i}` === k); return x ? { bande: x.b } : null; }
      const q = M.pts.find(x => x.cle === k); return q ? { q } : null;
    };
    let survole = null;
    function entrer(n, focus) {
      const r = qDe(n); if (!r) return;
      const cle = n.closest('[data-frise-cle]').dataset.friseCle;
      if (survole === cle && !focus) return;
      survole = cle;
      if (r.q) {
        allumer(r.q.cle);
        if (r.q.grappe) { const g = toile.querySelector(`[data-frise-cle="${CSS.escape(r.q.grappe.cle)}"] > span`); montrer(g || n, [r.q]); }
        else montrer(n.closest('.frise-repere') || n, [r.q]);
        if (typeof R.carte === 'function') R.carte(r.q.p.l ?? null);
        if (o.survol) o.survol(r.q.p);
      } else if (r.grappe) {
        eteindre();
        const lis = [n.closest('[data-frise-cle]')];
        r.grappe.membres.forEach(q => { if (R.liste) lis.push(...ligneDe(q.p.id)); });
        if (R.carte && typeof R.carte !== 'function') new Set(r.grappe.membres.map(q => q.p.l).filter(l => l != null)).forEach(l => R.carte.querySelectorAll(`.carte-lieu[data-l="${l}"]`).forEach(x => lis.push(x)));
        lis.forEach(x => x.classList.add('est-allume')); f.lumiere = lis;
        montrer(n.closest('span') || n, r.grappe.membres);
        if (typeof R.carte === 'function') R.carte(r.grappe.membres[0].p.l ?? null);
        if (o.survol) o.survol(r.grappe.membres[0].p);
      } else if (r.bande) {
        allumer(r.bande.id);
        if (o.survol) o.survol(r.bande);
      }
    }
    function sortir() {
      survole = null; eteindre(); cacher();
      if (typeof R.carte === 'function') R.carte(null);
      if (o.survol) o.survol(null);
    }
    const ecoute = (cible, type, fn, opt) => { cible.addEventListener(type, fn, opt); f.ecouteurs.push([cible, type, fn, opt]); };
    ecoute(el, 'pointerover', e => { const n = e.target.closest && e.target.closest('.frise-repere, .frise-grappe > span'); if (n && el.contains(n)) entrer(n); }, { passive: true });
    ecoute(el, 'pointerout', e => { const n = e.target.closest && e.target.closest('.frise-repere, .frise-grappe > span'); if (!n) return; const v = e.relatedTarget; if (v && n.contains(v)) return; if (!(document.activeElement && el.contains(document.activeElement))) sortir(); }, { passive: true });
    ecoute(el, 'focusin', e => {
      const n = e.target.closest && e.target.closest('.frise-repere'); if (!n) return;
      el.querySelectorAll('.est-focus').forEach(x => x.classList.remove('est-focus'));
      const li = n.closest('[data-frise-cle]'); li.classList.add('est-focus');
      const r = qDe(n); if (r && r.q && r.q.grappe) { const g = toile.querySelector(`[data-frise-cle="${CSS.escape(r.q.grappe.cle)}"]`); if (g) g.classList.add('est-focus'); }
      // le repère courant : la tabulation y revient
      el.querySelectorAll('.frise-repere[tabindex="0"]').forEach(x => { if (x !== n) x.setAttribute('tabindex', '-1'); });
      n.setAttribute('tabindex', '0');
      entrer(n, true);
    });
    ecoute(el, 'focusout', e => { if (e.relatedTarget && el.contains(e.relatedTarget)) return; el.querySelectorAll('.est-focus').forEach(x => x.classList.remove('est-focus')); sortir(); });
    ecoute(el, 'click', e => {
      const n = e.target.closest && e.target.closest('.frise-repere, .frise-grappe > span'); if (!n || !el.contains(n)) return;
      const r = qDe(n); if (!r) return;
      if (r.q && o.choix) o.choix(r.q.p);
      else if (r.grappe && o.choix) o.choix(r.grappe.membres[0].p);
      else if (r.bande && o.choix) o.choix(r.bande);
    });
    ecoute(el, 'keydown', e => {
      const n = e.target.closest && e.target.closest('.frise-repere'); if (!n) return;
      const k = e.key, tous = [...el.querySelectorAll('.frise-toile > ol:not(.frise-mois):not(.frise-grappes) .frise-repere')];
      const i = tous.indexOf(n); if (i < 0) return;
      let j = -1;
      if (k === 'ArrowRight' || k === 'ArrowDown') j = Math.min(tous.length - 1, i + 1);
      else if (k === 'ArrowLeft' || k === 'ArrowUp') j = Math.max(0, i - 1);
      else if (k === 'Home') j = 0;
      else if (k === 'End') j = tous.length - 1;
      else if (k === 'Escape') { cacher(); return; }
      if (j < 0) return;
      e.preventDefault();
      tous[j].focus();
    });
    // la liste et la carte reliées : survoler une ligne ou une commune allume son repère
    function relier() {
      if (R.liste) {
        const sur = e => { const n = e.target.closest && e.target.closest('[data-frise-id], [data-date-id]'); if (!n || el.contains(n)) return; const id = n.getAttribute('data-frise-id') || n.getAttribute('data-date-id'); if (id) allumer(id, { liste: false }); };
        ecoute(R.liste, 'pointerover', sur, { passive: true });
        ecoute(R.liste, 'focusin', sur, { passive: true });
        ecoute(R.liste, 'pointerleave', () => { if (!survole) eteindre(); }, { passive: true });
      }
      if (R.carte && typeof R.carte !== 'function') {
        const lieu = e => { const g = e.target.closest && e.target.closest('.carte-lieu[data-l]'); return g && R.carte.contains(g) ? +g.dataset.l : null; };
        const sur = e => { const l = lieu(e); if (l != null) allumer({ l }, { carte: false, liste: false }); };
        // quitter une commune (pas seulement passer d'un de ses tracés à l'autre) éteint ses repères
        const hors = e => { const g = e.target.closest && e.target.closest('.carte-lieu[data-l]');
          if (!g || !R.carte.contains(g) || (e.relatedTarget && g.contains(e.relatedTarget))) return; if (!survole) eteindre(); };
        ecoute(R.carte, 'pointerover', sur, { passive: true });
        ecoute(R.carte, 'focusin', sur, { passive: true });
        ecoute(R.carte, 'pointerout', hors, { passive: true });
        ecoute(R.carte, 'focusout', hors, { passive: true });
      }
    }

    /* le défilement au doigt : ouverte centrée sur aujourd'hui. Les largeurs sont connues (la toile : f.W ; la piste : la
       dernière mesure du ResizeObserver) : rien n'est lu dans la page ; seulement quand la frise est à l'écran */
    let centre = false;
    function centrer() {
      if (centre || o.orientation === 'verticale' || !f.vu || !largeurLue) return;
      centre = true;
      const auj = jour(o.aujourdhui);
      if (!isFinite(auj) || auj < f.t0 || auj >= f.t1 || f.W <= largeurLue + 1) return;
      piste.scrollLeft = (auj - f.t0) / (f.t1 - f.t0) * f.W - largeurLue / 2;
    }
    let largeurLue = 0;
    f.mesure = w => {
      if (!w || o.orientation === 'verticale') return;
      largeurLue = w;
      if (Math.abs(w - largeur) < 1 && f.modele) { centrer(); return; }
      largeur = w;
      const avant = f.modele && f.modele.sig;
      // la largeur a changé : on refait seulement si les grappes ou les couloirs changent
      if (f.modele) {
        const lus = lire(o.points), [t0, t1] = bornes(o, lus), G = graduations(t0, t1, o), W = Math.max(largeur, G.unites * (G.mois ? o.moisMin : o.anMin));
        f.W = W;
        // refaite (les grappes ou les couloirs changent avec la largeur) : on centre à l'image suivante, sans lecture forcée
        if (lus.length && signature(placer(o, W, t0, t1, lus)) !== avant) { rendre(false); requestAnimationFrame(centrer); return; }
      }
      centrer();
    };
    f.voir = () => { if (!f.vu) { f.vu = true; el.classList.add('est-vue'); } requestAnimationFrame(centrer); };
    f.fin = () => {
      if (io) io.unobserve(el);
      if (ro) ro.unobserve(piste);
      f.ecouteurs.forEach(([c, t, fn, opt]) => c.removeEventListener(t, fn, opt));
      f.ecouteurs = [];
      vivantes.delete(f);
    };

    rendre(false);
    conteneur.appendChild(el);
    relier();
    observer(f);
    const api = {
      el,
      get points() { return f.modele ? f.modele.M.pts.map(q => q.p) : []; },
      maj(nouvelles = {}) { o = Object.assign({}, o, nouvelles); rendre(true); return api; },
      allumer: (cle) => allumer(cle),
      eteindre: () => { eteindre(); cacher(); },
      aller(cle) {
        const M = f.modele && f.modele.M; if (!M) return;
        const q = M.pts.find(x => String(x.p.id) === String(cle) || x.cle === cle);
        if (!q) return;
        const x = q.grappe ? q.xg : q.x;
        if (largeurLue && f.W > largeurLue + 1) piste.scrollTo({ left: x / 100 * f.W - largeurLue / 2, behavior: permis() ? 'smooth' : 'auto' });
        allumer(q.cle);
      },
      detruire() { f.fin(); el.remove(); },
    };
    return api;
  }

  return { creer, jour, iso: isoDe, permis };
})();
</script>
<script>
/* Le mouvement, commun aux maquettes (règle 15 B du contrat) : la boîte à outils dont chaque maquette tire SA signature.
   Rien ne retarde une navigation ni un rendu : les écouteurs sont passifs, seuls transform et opacity bougent (et clip-path
   pour un masque), une transition en cours se termine proprement au geste suivant. prefers-reduced-motion ou ?anim=0 :
   rien ne bouge, tout est là tout de suite. build.py l'ajoute après frise.js et le copie à côté de l'administration.

   MOUVEMENT.permis()
     false si le visiteur a demandé moins d'animations, ou avec ?anim=0 dans l'adresse.

   MOUVEMENT.transition(rendre, { type, depuis }) → promesse (résolue quand rendre() a été appelée)
     Enveloppe un changement de page : document.startViewTransition si le navigateur l'a et que le mouvement est permis ;
     sinon un fondu court (180 ms) de <main>. rendre() s'exécute toujours, et tout de suite si le mouvement est coupé ;
     avec View Transitions, elle s'exécute dans le rappel de la transition (une image plus tard) : mettez-y tout le
     changement (le contenu, document.title, le focus, le défilement).
     type    posé en data-mv-transition sur <html> le temps de la transition : la maquette écrit ses
             html[data-mv-transition="spectacle"]::view-transition-old(root) { … } (styles de base : un fondu de 240 ms).
     depuis  un élément qui porte data-mv-nom="…" (la carte cliquée) : il reçoit view-transition-name: mv-partage, et
             après rendre(), l'élément de la nouvelle page qui porte le même data-mv-nom le reçoit à son tour : la carte
             devient l'en-tête (::view-transition-group(mv-partage) pour l'habiller).
     Interruptible : un nouveau geste (pointeur, clavier, molette) termine la transition aussitôt ; un clic donné pendant
     la transition (le navigateur l'adresse alors à <html>) est relancé sur l'élément qui est sous le doigt.

   MOUVEMENT.reveler(racine, { immediat })
     Les éléments [data-mv] de racine apparaissent quand ils entrent dans l'écran, une seule fois :
       data-mv="monte"    il monte de 14 px en paraissant        data-mv="fondu"   il paraît
       data-mv="trace"    il se trace de gauche à droite (un filet : transform scaleX ; un SVG : ses tracés pathLength="1")
       data-mv="masque"   il se découvre de haut en bas (clip-path)
       data-mv="cascade"  ses enfants l'un après l'autre (45 ms, douze au plus ; --mv-i est posé sur chacun)
       data-mv="compte"   le nombre qu'il affiche compte jusqu'à sa valeur (MOUVEMENT.compter)
       data-mv-delai="120" un retard en ms.
     { immediat: true } : tout est montré sans mouvement (une vue refaite en place quand D change).
     Classes : .mv-attente (en attente, l'état de départ), .mv-vu (montré) ; variables --mv-courbe, --mv-i, --mv-delai.

   MOUVEMENT.cascade(el, { selecteur, pas, max, duree, decalage })
     Les enfants de el (ou ceux du sélecteur) paraissent l'un après l'autre, tout de suite : un contenu qui se déplie
     (une saison qu'on ouvre, un menu). pas 22 ms, max 14 (les suivants sont là d'emblée), duree 260 ms, decalage -6 px.

   MOUVEMENT.flip(conteneur, changer, { cle, duree })
     Les positions avant, changer() (le nouveau rendu), les positions après : les éléments glissent à leur nouvelle place,
     ceux qui arrivent paraissent, ceux qui partent s'effacent sur place. cle : '[data-mv-cle]' (par défaut) ou un autre
     attribut ('[data-date-id]') : la valeur de l'attribut est la clé. Seuls les éléments proches de l'écran bougent ; un
     nouveau flip sur le même conteneur reprend depuis les positions à l'écran. duree 280 ms.

   MOUVEMENT.compter(el, { duree })

     à la fin, et les lecteurs d'écran ne lisent que lui (le nombre qui compte est aria-hidden).

   MOUVEMENT.presse(racine)

:where([data-mv="cascade"].mv-attente) > * { transition: opacity .45s var(--mv-courbe), transform .5s var(--mv-courbe);
  transition-delay: calc(var(--mv-delai, 0ms) + min(var(--mv-i, 0), 12) * 45ms); }
:where([data-mv="cascade"].mv-attente:not(.mv-vu)) > * { opacity: 0; transform: translateY(10px); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .24s; animation-timing-function: ${COURBE}; }
::view-transition-group(mv-partage) { animation-duration: .38s; animation-timing-function: ${COURBE}; overflow: clip; }

  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  :where([data-mv]), :where([data-mv]) > *, :where([data-mv]) [pathLength] { transition: none !important; } }`;

  let enCours = null, fondu = null, relance = null;
  const html = document.documentElement;
  // un geste pendant la transition la termine ; un clic adressé à <html> (le navigateur le fait pendant une View
  // Transition) est relancé sur l'élément qui est sous le doigt

    if (fondu) { try { fondu.finish(); } catch (e) { /* finie */ } fondu = null; }
    if (!permis() || document.hidden) { rendre(); return Promise.resolve(); }

      };

    rendre();

    if (m && m.animate) fondu = m.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' });

  /* ---------------------------------------------------------------------------------------------- l'apparition au défilement */
  let io = null;
  function montrer(e) {
    if (e.classList.contains('mv-vu')) return;
    e.classList.add('mv-vu');
    if (e.getAttribute('data-mv') === 'compte') compter(e);

    const d = (parseFloat(e.getAttribute('data-mv-delai')) || 0) + (e.getAttribute('data-mv') === 'cascade' ? 1300 : 950);

    if (racine.matches && racine.matches('[data-mv]')) els.unshift(racine);
    if (immediat || !permis() || !('IntersectionObserver' in window)) {
      els.forEach(e => { e.classList.remove('mv-attente'); e.classList.add('mv-vu'); });
      return;
    }
    if (!io) io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { io.unobserve(x.target); montrer(x.target); } }), { rootMargin: '0px 0px -6% 0px' });

      if (e.classList.contains('mv-vu')) return;

      if (d) e.style.setProperty('--mv-delai', `${parseFloat(d) || 0}ms`);
      if (e.getAttribute('data-mv') === 'cascade') [...e.children].forEach((c, i) => c.style.setProperty('--mv-i', String(i)));

    const pres = r => r.bottom > -marge && r.top < H + marge && r.width > 0;
    // avant : les positions à l'écran (transform compris : un flip interrompu repart de là où l'on voit les éléments)
    const avant = new Map();
    conteneur.querySelectorAll(sel).forEach(e => { const k = e.getAttribute(attr); if (!k || avant.has(k)) return; const r = e.getBoundingClientRect(); if (pres(r)) avant.set(k, { r, e }); });
    (enVol.get(conteneur) || []).forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } });
    changer();
    const anims = [];
    const apres = new Map();
    conteneur.querySelectorAll(sel).forEach(e => { const k = e.getAttribute(attr); if (!k || apres.has(k)) return; apres.set(k, { e, r: e.getBoundingClientRect() }); });
    apres.forEach(({ e, r }, k) => {
      if (!pres(r)) return;
      const a = avant.get(k);
      if (a) {
        const dx = a.r.left - r.left, dy = a.r.top - r.top;
        if (Math.abs(dx) < .5 && Math.abs(dy) < .5) return;
        anims.push(e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: duree, easing: COURBE }));
      } else {
        anims.push(e.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: duree * .8, delay: duree * .25, easing: COURBE, fill: 'backwards' }));
      }
    });
    // ceux qui partent : ils s'effacent à leur place, dans une coquille du même genre que leur ancien parent
    avant.forEach(({ r, e }, k) => {
      if (apres.has(k) || e.isConnected) return;
      const parent = e.__mvParent;
      const coque = (parent ? parent.cloneNode(false) : document.createElement('div'));

      coque.setAttribute('aria-hidden', 'true');
      coque.inert = true;
      coque.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;padding:0;border:0;background:none;pointer-events:none;z-index:2;list-style:none;overflow:visible`;
      e.style.margin = '0';
      coque.appendChild(e);
      conteneur.appendChild(coque);
      const a = coque.animate([{ opacity: 1 }, { opacity: 0 }], { duration: duree * .6, easing: 'ease-in', fill: 'forwards' });
      a.onfinish = a.oncancel = () => coque.remove();
      anims.push(a);
    });
    enVol.set(conteneur, anims);
  }
  // FLIP a besoin de connaître le parent d'un élément qui part (changer() l'a détaché) : on le note avant
  const flipAvecParents = flip;
  function flipPublic(conteneur, changer, o = {}) {
    if (conteneur && permis()) { const attr = attrDe(o.cle); conteneur.querySelectorAll(`[${attr}]`).forEach(e => { e.__mvParent = e.parentElement; }); }
    return flipAvecParents(conteneur, changer, o);
  }

  /* ---------------------------------------------------------------------------------------------- les chiffres qui comptent */
  function compter(el, { duree = 900 } = {}) {
    if (!el || el.__mvCompte || !permis()) return;
    const texte = el.textContent, m = /\d(?:[\d   ]*\d)?/.exec(texte);
    if (!m) return;
    const cible = +m[0].replace(/\D/g, '');
    if (!(cible > 1)) return;
    const sep = (/[   ]/.exec(m[0]) || [''])[0];
    const avant = texte.slice(0, m.index), apres = texte.slice(m.index + m[0].length);
    const format = n => sep ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep) : String(n);
    const origine = el.innerHTML;
    el.__mvCompte = true;
    el.innerHTML = `<span aria-hidden="true">${esc(avant)}<span class="mv-chiffre">${format(0)}</span>${esc(apres)}</span><span class="mv-lecteur">${esc(texte)}</span>`;
    const chiffre = el.querySelector('.mv-chiffre'), t0 = performance.now();
    const pas = now => {
      if (!el.isConnected) return;
      const u = Math.min(1, (now - t0) / duree), v = 1 - (1 - u) ** 3;
      if (u < 1) { chiffre.textContent = format(Math.round(cible * v)); requestAnimationFrame(pas); }
      else { el.innerHTML = origine; el.__mvCompte = false; }

  }

  /* ---------------------------------------------------------------------------------------------- la pression */
  const PRESSABLE = 'a[href], button, summary, [role="button"], [role="tab"], label, .mv-pressable';
  let presse = null;
  const lacher = () => { if (presse) { presse.classList.remove('mv-presse'); presse = null; } };
  function presser(racine = document) {
    if (!racine || racine.__mvPresse) return;

    racine.addEventListener('pointerdown', e => {
      if (e.button) return;
      const el = e.target.closest && e.target.closest(PRESSABLE);
      if (!el || el.disabled) return;
      lacher(); el.classList.add('mv-presse'); presse = el;
    }, { passive: true });
    racine.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches(PRESSABLE)) { lacher(); e.target.classList.add('mv-presse'); presse = e.target; }
    }, { passive: true });

      document.addEventListener('pointerleave', lacher, { passive: true });
    }
  }

  return { permis, transition, reveler, cascade, flip: flipPublic, compter, presse: presser };
})();

<script>
/* Les tentacules, communes aux maquettes et à l'administration : la pieuvre du logo, dans l'en-tête, et ses tentacules.
   Règle 15 du contrat : la tentacule n'est plus la réponse à chaque geste. PAR DÉFAUT, ELLE NE RÉPOND À RIEN : ni aux clics,
   ni aux changements de page ; aucun écouteur n'est posé, aucune boucle ne tourne. Elle devient un MOMENT rare et
   signifiant, que la maquette joue à la main, là où il dit quelque chose (au plus deux par maquette : la tournée qui
   pousse, l'entrée dans un spectacle, un dossier composé…). Un seul code : chaque maquette l'habille dans son style.
   build.py l'ajoute après mouvement.js dans chaque maquette et le copie à côté de l'index.html de l'administration.

   Les moments (à appeler à la main) : une tentacule fine part de la pieuvre, s'enroule sur un point et y laisse l'empreinte
   d'une ventouse (toucher) ; une tentacule « remonte » l'écran à la couleur d'une page (page) ; elle se déroule le long de ce
   qui s'ouvre (ouvrir), s'enroule quand ça se ferme (fermer), glisse d'un onglet à l'autre (onglet), s'enroule autour d'un
   bouton (enrouler, confirmer, retour) ; la pieuvre seule se contracte et ondule (guide).

   Les gestes automatiques d'avant restent possibles, mais seulement si on les demande explicitement :
     TENTACULES.regler({ clic: true })    chaque clic lui répond (les gestes se reconnaissent seuls, voir plus bas)
     TENTACULES.regler({ pages: true })   chaque changement d'adresse (hashchange) remonte une tentacule
   Le profil 'admin' (l'administration et l'espace de l'équipe) garde ses gestes : clic et pages y valent true, sauf
   clic: false ou pages: false dans le même appel. regler({ clic: false, pages: false }) retire les écouteurs.

   RIEN N'EST RETARDÉ NI BLOQUÉ : écouteurs passifs en phase de capture (seulement si clic ou pages), jamais de
   preventDefault, un seul calque fixe (pointer-events: none, aria-hidden), un seul requestAnimationFrame, arrêté quand plus
   rien ne joue et quand l'onglet est caché. Aucun texte n'est ajouté. Un moment rejoué remplace l'animation en cours, sans
   file d'attente. Rien ne joue dans un champ en cours d'écriture, ni tant que INTRO.ouverte() est vrai.
   prefers-reduced-motion : au plus un fondu bref, aucune tentacule qui voyage. ?anim=0 dans l'adresse : aucune animation.

   Le vérificateur (onglets.mjs) clique les liens du menu et attend TENTACULES.actives() === 0 juste après : un lien ou un
   bouton qui joue un moment le déclare avec l'attribut data-moment (sur lui ou un parent).

   Ce que la maquette fournit
   - data-pieuvre sur l'élément du logo de l'en-tête (le <span> ou <a> qui contient D.logo.mark, D.logo.octopus ou son
     propre dessin de la pieuvre). L'outil y retrouve les quatre tracés de D.logo.octopusPaths et les anime EN PLACE
     (bras, tête) ; les bras de D.arms donnent le point de départ des tentacules (celui du spectacle visé, quand on va vers
     sa page : D.arms.armOf). Hôte vide : l'outil y met la pieuvre (D.logo.octopus, ou un dessin neutre), même sans
     mouvement. Hôte sans tracé reconnu : il pulse en entier. Pas d'hôte visible : les tentacules partent du bord le plus proche.
   - TENTACULES.regler({ clic, pages, style, encre, accent, ventouse, neutre, epaisseur, duree, … }), à appeler une fois :
       clic        false (défaut) · true : chaque clic lui répond        pages   false (défaut) · true : chaque changement de page
       style       'encre' (défaut : tentacule pleine et effilée, ventouses) · 'trait' (un trait gravé, à hachures)
                   · 'lumiere' (un filet de lumière, avec halo) · 'fil' (un fil très fin) · 'ventouses' (deux rangées)
       encre       la couleur des tentacules                      accent   l'empreinte, les enroulements, les confirmations
       ventouse    la couleur des ventouses (défaut : un voile)    neutre   la remontée des pages sans couleur propre
       epaisseur   l'épaisseur de la tentacule fine, en px (2.2)   duree    facteur de durée (1 = normal)
       pieuvre     sélecteur du guide ('[data-pieuvre]')           page     sélecteur de ce que la remontée soulève ('main')
       entrees     'auto' (défaut), 'vive' ou 'couleur' : quelle couleur de D.site.entrees prend la remontée
       couleurDe   function (hash) → couleur CSS, ou rien : la destination à la main ; false : la maquette a son propre geste pour
                   cette page, la pieuvre seule répond (pas de tentacule de page)
       voie        'bas' (défaut) : la tentacule de page part de sous l'écran, à la hauteur du clic ; 'clic' : elle sort du point
                   cliqué lui-même et remonte
       remontee    false : pas de tentacule de page    soulever  true : la page se soulève de 24 px et paraît, en 460 ms,
                   quand la tentacule remonte. Un transform sur <main> déplace ses descendants position: fixed pendant ce
                   temps : à n'activer que si <main> n'en contient pas (hors de la page : une barre, une photo de fond, ça va)
       profil      'admin' : tout dure 350 ms au plus, les tentacules restent près du bouton (jamais devant un champ)
       detail      retouche le style choisi : { page (finesse de la tentacule de page : 1 = pleine, .1 = un fil), ventouses (0, 1 ou 2
                   rangées), hachures, halo, empreinte ('anneau', 'grande', 'etoile', 'lueur', 'point'), corps, opa }
   - des variables CSS, sur :root (ou sur une région : l'outil lit celles de l'élément cliqué) :
       --tt-encre  --tt-accent  --tt-ventouse  --tt-neutre  --tt-epaisseur  --tt-duree  --tt-style
       --tt-fond   le liseré qui détache la tentacule d'un fond sombre (défaut : la couleur de la page)
   - des attributs : data-moment (ce lien ou ce bouton joue un moment, voir plus haut) ; et, pour les gestes automatiques
     (clic: true) : data-tt="rien" (aucune animation ici) ou le genre d'un geste : "onglet", "ouvre", "bascule", "case",
     "route", "retour", "clic" ; data-tt-couleur="#…" sur un lien (la couleur de sa remontée) ; data-tt-cible="x,y" sur un
     élément de la page qui arrive (x et y : fractions de sa boîte, .5,.5 par défaut) : la tentacule de page y finit, au lieu de la
     pieuvre (une porte à ouvrir, un titre à atteindre) ; data-tt-local sur un
     conteneur dont les boutons n'ont que des tentacules courtes (la barre d'édition, un panneau) ; data-tt-zone sur la
     fiche qu'un lien « retour » referme (par défaut .editeur).
   Avec clic: true, les gestes se reconnaissent seuls : un lien #/… (remontée de page), un onglet (aria-current,
   aria-selected, role="tab" : la tentacule glisse de l'onglet quitté à l'onglet choisi), un <summary> ou un bouton
   aria-expanded (elle se déroule quand ça s'ouvre, s'enroule quand ça se ferme), un bouton aria-pressed ou une case, un envoi
   de formulaire (elle s'enroule autour du bouton), le panneau de date et l'enregistrement de l'édition sur place.

   Les moments
   TENTACULES.toucher(el | [x, y])      une tentacule fine jusqu'à ce point, et son empreinte
   TENTACULES.page(destination)         la remontée d'une page ('#/voir', une couleur CSS ou {couleur, slug}) ; automatique
                                        à chaque changement d'adresse seulement avec pages: true
   TENTACULES.ouvrir(el)  .fermer(el)   la tentacule se déroule le long de ce qui s'ouvre ; elle s'enroule à la fermeture
   TENTACULES.enrouler(el)              elle s'enroule autour d'un bouton : un envoi, un enregistrement réussi (= confirmer)
   TENTACULES.retour(el)                elle s'enroule à l'envers (revenir en arrière)
   TENTACULES.onglet(de, vers)          elle glisse d'un onglet à l'autre   TENTACULES.ajouter(el)   une ligne qui s'ajoute
   TENTACULES.guide(genre)              la pieuvre seule se contracte et ondule ('clic', 'page', 'ouvre', 'ferme'…)
   Le reste
   TENTACULES.pieuvre()                 met la pieuvre dans les hôtes data-pieuvre vides (fait seul au chargement)
   TENTACULES.actives()                 le nombre d'animations en cours (0 au repos) : pour le vérificateur
   TENTACULES.arreter()                 coupe tout   TENTACULES.actif   faux avec ?anim=0 */
const TENTACULES = (() => {

    addEventListener('pointercancel', e => { if (prise && e.pointerId === prise.id) { const T = prise.T; prise = null; el.classList.remove('is-grabbing'); T.mode = 'ressort'; T.t0 = performance.now(); T.tire0 = { ...T.tire }; reveil(); } });
    function ecouter(T) {
      const b = T.el;
      b.addEventListener('pointerdown', e => saisir(T, e));
      b.addEventListener('click', e => { if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return; e.preventDefault(); if (performance.now() - dernier > 450) activer(T); });
      b.addEventListener('mouseenter', () => { if (!verrou) { survol = T; reveil(); } });
      b.addEventListener('mouseleave', () => { if (survol === T && !verrou) { survol = null; reveil(); } });
      b.addEventListener('focus', () => { T.focus = true; reveil(); });
      b.addEventListener('blur', () => { T.focus = false; reveil(); });
      b.addEventListener('keydown', e => {
        const k = e.key, d = k === 'ArrowRight' || k === 'ArrowDown' ? 1 : k === 'ArrowLeft' || k === 'ArrowUp' ? -1 : 0;
        if (d) { e.preventDefault(); const i = TIT.indexOf(T); TIT[(i + d + TIT.length) % TIT.length].el.focus(); }

    // au téléphone, le libellé qui passe au milieu de l'écran attire le bras le plus proche
    function suivre() {
      sraf = 0;

      let best = null, bd = 110;
      for (const T of TIT) { const d = Math.abs(r.top + T.by + T.th / 2 - mid); if (d < bd) { bd = d; best = T; } }
      if (best !== survol) { survol = best; reveil(); }

    addEventListener('scroll', () => { if (mobile && affiche && !sraf) sraf = requestAnimationFrame(suivre); }, { passive: true });
    new ResizeObserver(() => { if (affiche) mise(); }).observe(el);
    new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; if (visible) { tPrec = 0; reveil(); } }, { threshold: .01 }).observe(el);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { tPrec = 0; reveil(); } });
    if (document.fonts) document.fonts.ready.then(() => { if (affiche) mise(); });

    function eveiller() { if (eveil === null) { eveil = performance.now(); tPrec = 0; reveil(); } }
    function montrer(oui) {
      affiche = oui;
      if (!oui) { cancelAnimationFrame(raf); raf = 0; return; }
      if (signature() !== sig) bati();
      // de retour sur l'accueil : chaque libellé reprend sa place, chaque bras sa souche
      TIT.forEach(T => { T.mode = 'repos'; T.tire = { x: 0, y: 0 }; T.tension = 0; T.parti = false; T.avale = 0; T.focus = false; });
      BRAS.forEach(a => { a.but = null; a.depuis = null; a.q = 1; a.teinte = 0; });
      survol = null; prise = null; verrou = false; el.classList.remove('is-grabbing', 'has-active');
      if (eveil === null && !(typeof INTRO !== 'undefined' && INTRO.ouverte())) eveil = performance.now() - (motionOK() ? 0 : 5000);

    }

    function maj() { tete.textContent = S.nom; if (signature() !== sig) { bati(); if (affiche) mise(); } }
    tete.textContent = S.nom;

  /* ---------- la carte des tournées : des tentacules d'encre ---------- */
  /* De la pieuvre posée sur Rouen, un bras d'encre par commune, ponctué de ventouses sur sa face intérieure ;
     au bout, une goutte d'encre s'étale quand le bras l'atteint. « leger » : beaucoup de communes, des bras fins. */
  const Encre = (() => {
    let n = 0;
    const R = CARTE.rouen, LX = (D.arms.box[0] + D.arms.box[2]) / 2, LB = D.arms.box[3];
    const alea = graine => { let x = (graine * 9301 + 49297) % 233280 || 7; return () => (x = (x * 9301 + 49297) % 233280) / 233280; };
    const courbe = x => (x.l % 2 ? 1 : -1) * (.13 + ((x.l * 7) % 9) / 50);
    function ventouses(xy, c, w0, w1, e, pas) {
      const dx = xy[0] - R[0], dy = xy[1] - R[1], q = [(R[0] + xy[0]) / 2 - dy * c, (R[1] + xy[1]) / 2 + dx * c], N = 64, P = [], cum = [0];
      for (let k = 0; k <= N; k++) {
        const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, d = t * t;
        P.push([a * R[0] + b * q[0] + d * xy[0], a * R[1] + b * q[1] + d * xy[1]]);
        if (k) cum.push(cum[k - 1] + Math.hypot(P[k][0] - P[k - 1][0], P[k][1] - P[k - 1][1]));
      }
      const L = cum[N]; let out = '', u = L * .09, z = 0;
      while (u < L * .93) {
        let k = 1; while (k < N && cum[k] < u) k++;
        const f = (u - cum[k - 1]) / ((cum[k] - cum[k - 1]) || 1), t = (k - 1 + f) / N;
        const x = lerp(P[k - 1][0], P[k][0], f), y = lerp(P[k - 1][1], P[k][1], f);
        let tx = 2 * (1 - t) * (q[0] - R[0]) + 2 * t * (xy[0] - q[0]), ty = 2 * (1 - t) * (q[1] - R[1]) + 2 * t * (xy[1] - q[1]);
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const hw = (w0 * (1 - t) + w1 * t) / 2, r = Math.max(hw * .56, .45 * e), off = hw * (z++ % 2 ? .55 : .92) * Math.sign(c);
        out += `<circle cx="${(x + ty * off).toFixed(1)}" cy="${(y - tx * off).toFixed(1)}" r="${r.toFixed(2)}" stroke-width="${(r * .45).toFixed(2)}"/>`;
        u += Math.max(r * 2.6, pas * e);
      }
      return out;
    }
    function goutte(xy, r, graine) {
      const rnd = alea(graine + 11), N = 10, pts = [], f = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`, m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      for (let k = 0; k < N; k++) { const a = (k + rnd() * .35) / N * 2 * Math.PI, rr = r * (.8 + rnd() * .4); pts.push([xy[0] + Math.cos(a) * rr, xy[1] + Math.sin(a) * rr]); }
      let d = `M${f(m(pts[N - 1], pts[0]))}`;
      for (let k = 0; k < N; k++) d += `Q${f(pts[k])} ${f(m(pts[k], pts[(k + 1) % N]))}`;
      let sat = '';
      for (let k = 0, ns = 1 + Math.floor(rnd() * 3); k < ns; k++) {
        const a = rnd() * 2 * Math.PI, dd = r * (1.5 + rnd() * .8), rs = r * (.12 + rnd() * .16);
        sat += `<circle cx="${(xy[0] + Math.cos(a) * dd).toFixed(1)}" cy="${(xy[1] + Math.sin(a) * dd).toFixed(1)}" r="${rs.toFixed(2)}"/>`;
      }
      return `<path d="${d}Z"/>${sat}`;
    }
    const etiquette = x => `${CARTE.nom(x)}${x.dates?.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    // lieux : les communes en avant (encre pleine, ventouses, gouttes) ; passe : les tournées passées, en retrait
    function svg({ lieux = [], passe = [], cadre = 'france', titre = '', fort = false, noms = false, leger = false } = {}) {
      const id = 'k' + (++n), tous = [...lieux, ...passe];
      const box = cadre === 'france' || !tous.length ? CARTE.viewBox : CARTE.cadre(tous, { marge: 44, min: 220 });
      const [bx, by, bw, bh] = box.split(/\s+/).map(Number), e = Math.max(bw, bh) / 800;
      const longueurs = lieux.map(x => CARTE.longueur(x.xy, { courbe: courbe(x) })), Lmax = Math.max(1, ...longueurs), pas = lieux.length > 30 ? 6 : 4;
      let masques = '', bras = '', fins = '', gouttes = '', noms_ = '';
      lieux.forEach((x, i) => {
        const c = courbe(x), droite = x.xy[0] > bx + bw * .7;
        if (leger) {
          // beaucoup de communes : un bras fin chacune, et une goutte qu'on survole
          const r = (1.5 + Math.sqrt(x.n) * .55) * e;
          fins += `<path data-l="${x.l}" d="${CARTE.bras(x.xy, { w0: (1.3 + Math.sqrt(x.n) * .5) * e, w1: .35 * e, courbe: c })}"/>`;
          gouttes += `<g class="carte-lieu fin" data-l="${x.l}"><g class="g-h"><g class="goutte">${goutte(x.xy, r, x.l)}</g></g><circle class="hit" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${Math.max(r * 1.8, 6 * e).toFixed(1)}"/><title>${esc(CARTE.nom(x))}</title></g>`;
        } else {
          const w0 = ((fort ? 6.5 : 5) + Math.sqrt(x.n) * 1.6) * e, w1 = .9 * e, r = ((fort ? 4.2 : 3.4) + Math.sqrt(x.n) * 1.3) * e;
          const d0 = i * .035, du = .4 + 1.2 * longueurs[i] / Lmax, dg = d0 + du * .88;
          masques += `<mask id="${id}-${x.l}" maskUnits="userSpaceOnUse" x="${bx - 60 * e}" y="${by - 60 * e}" width="${bw + 120 * e}" height="${bh + 120 * e}"><path class="k-trace" d="${CARTE.trait(x.xy, { courbe: c })}" pathLength="1" stroke-width="${(w0 * 2.8).toFixed(1)}" style="--d:${d0.toFixed(3)}s;--t:${du.toFixed(2)}s"/></mask>`;
          bras += `<g class="tent" data-l="${x.l}" mask="url(#${id}-${x.l})"><path class="tent-corps" d="${CARTE.bras(x.xy, { w0, w1, courbe: c })}"/><g class="tent-v">${ventouses(x.xy, c, w0, w1, e, pas)}</g></g>`;
          gouttes += `<g class="carte-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${attr(etiquette(x))}" style="--d:${dg.toFixed(2)}s"><circle class="onde" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(r * 2.4).toFixed(1)}" stroke-width="${(.9 * e).toFixed(2)}"/><g class="g-h"><g class="goutte">${goutte(x.xy, r, x.l)}</g></g><circle class="hit" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${Math.max(r * 1.7, 11 * e).toFixed(1)}"/><title>${esc(etiquette(x))}</title></g>`;
        }
        const rr = leger ? 3 * e : ((fort ? 4.2 : 3.4) + Math.sqrt(x.n) * 1.3) * e;
        noms_ += `<text class="carte-nom${noms ? ' toujours' : ''}" data-l="${x.l}" x="${(x.xy[0] + (droite ? -1 : 1) * (rr * 1.4 + 5 * e)).toFixed(1)}" y="${(x.xy[1] + 4.5 * e).toFixed(1)}" text-anchor="${droite ? 'end' : 'start'}" font-size="${(14 * e).toFixed(1)}" stroke-width="${(3.4 * e).toFixed(1)}">${esc(CARTE.nom(x))}</text>`;
      });
      const kk = (fort ? 46 : 38) * e / 1016;
      return `<svg class="carte encre${fort ? ' fort' : ''}${box !== CARTE.viewBox ? ' serre' : ''}" viewBox="${box}" role="group" aria-label="${attr(titre)}">
        <defs>${masques}</defs>
        <path class="carte-voisin" d="${CARTE.fond.belgique}"/><path class="carte-voisin" d="${CARTE.fond.luxembourg}"/><path class="carte-pays" d="${CARTE.fond.pays}"/>
        ${tous.some(x => x.encart) ? `<circle class="k-encart" cx="${CARTE.ENCART[0]}" cy="${CARTE.ENCART[1]}" r="${(24 * e).toFixed(1)}"/>` : ''}
        <g class="k-passe">${passe.map(x => `<path d="${CARTE.bras(x.xy, { w0: 2.2 * e, w1: .5 * e, courbe: courbe(x) })}"/><circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(1.9 * e).toFixed(2)}"/>`).join('')}</g>
        ${fins ? `<g class="k-fins">${fins}</g>` : ''}
        <g class="k-bras">${bras}</g>
        <g class="k-rouen"><g class="k-pieuvre" transform="translate(${(R[0] - LX * kk).toFixed(1)} ${(R[1] - LB * kk + 3 * e).toFixed(1)}) scale(${kk.toFixed(5)})">${D.logo.octopusPaths.map(d => `<path d="${d}"/>`).join('')}</g>
          <circle class="k-flaque" cx="${R[0]}" cy="${R[1]}" r="${(3.4 * e).toFixed(1)}"/>
          <text class="carte-rouen-nom" x="${(R[0] + (fort ? 28 : 24) * e).toFixed(1)}" y="${(R[1] - 12 * e).toFixed(1)}" font-size="${(16 * e).toFixed(1)}" stroke-width="${(3.4 * e).toFixed(1)}">Rouen</text></g>
        <g class="k-gouttes">${gouttes}</g>
        <g class="k-noms">${noms_}</g>
      </svg>`;
    }
    // l'encre pousse quand la carte entre à l'écran (pas lors d'une mise à jour en place)
    function activer(svgEl) {
      if (!svgEl) return;
      if (!motionOK() || !ANIMER) { svgEl.classList.add('fixe'); return; }
      const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { svgEl.classList.add('pousse'); io.disconnect(); } }, { threshold: .15 });
      io.observe(svgEl);
    }
    function marquer(svgEl, l) {
      svgEl.classList.toggle('survol', l != null);
      $$('.on', svgEl).forEach(x => x.classList.remove('on'));
      if (l != null) $$(`[data-l="${l}"]`, svgEl).forEach(x => x.classList.add('on'));
    }
    // relie une carte et une liste (li[data-l]) : survoler l'une met l'autre en avant ; choisir une commune la retient
    function relier(svgEl, liste) {
      activer(svgEl);

      const allumer = l => {
        marquer(svgEl, l);
        if (!liste) return;
        liste.forEach(ul => { ul.classList.toggle('atenue', l != null); $$('li[data-l]', ul).forEach(li => li.classList.toggle('on', l != null && +li.dataset.l === l)); });
      };
      CARTE.lier(svgEl, {
        survol: l => allumer(l ?? pin),
        choix: l => {
          pin = pin === l ? null : l; allumer(pin);
          const li = pin != null && liste && liste.map(ul => $(`li[data-l="${pin}"]`, ul)).find(Boolean);
          if (li) { const r = li.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight) li.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' }); }

        li.addEventListener('mouseleave', () => allumer(pin));

      return { allumer };

  })();

  /* ---------- l'en-tête, la barre des entrées et le pied de page ---------- */

  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();

    return lignes || avec ? `<div class="fiche">${lignes}${avec}</div>` : '';
  }
  const lienVideo = s => s.video && s.video.url ? `<a class="lien-video" href="${attr(s.video.url)}" target="_blank" rel="noopener">${ICONE.video}${esc(S.libelles.bandeAnnonce)}</a>` : '';
  const lieuxDetails = (s, ouvert = false) => (s.programmer || {}).lieux ? `<details class="lieux"${ouvert ? ' open' : ''}><summary>${esc(S.libelles.lieuxDiffusion)}</summary><p${ed(`shows.${s.slug}.programmer.lieux`)}>${esc(s.programmer.lieux)}</p></details>` : '';

  /* « Je souhaite programmer » : ce qu'il faut à un programmateur (règle 13), relu dans D à chaque rendu */
  const contactPrg = () => ((D.site || {}).programmation || {}).contact || null;
  const mailPrg = objet => { const c = contactPrg(); return c && c.email ? `mailto:${c.email}?subject=${encodeURIComponent(objet)}` : ''; };
  const docsDe = (s, pour) => (D.documents || []).filter(x => x.spectacle === s.slug && x.pour === pour && x.url);
  const ICO_PDF = '<svg class="dos-ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 3v10M5.5 9 10 13.5 14.5 9M4 17h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // le petit bras des entrées, qui s'enroule en se dessinant : l'animation du bouton pendant la composition du dossier
  const BRAS_DOS = BE.replace('<svg class="be"', '<svg class="dos-bras"').replace('<path ', '<path pathLength="1" ');
  const lienDoc = x => `<a href="${attr(x.url)}" target="_blank" rel="noopener">${esc(x.titre)}</a>`;
  const listeDocs = docs => `<ul class="docs">${docs.map(x => `<li>${ICO_PDF}${lienDoc(x)}</li>`).join('')}</ul>`;
  // le contact diffusion : le nom, le rôle, le courriel (lien mailto: avec l'objet), le téléphone s'il existe ; sur un spectacle : compact, aux couleurs de son univers
  function contactHtml(s) {
    const Lb = S.libelles, c = contactPrg(); if (!c) return '';
    const k = 'site.programmation.contact', href = mailPrg(s ? `${Lb.objetProgrammation} – ${s.titre}` : Lb.objetProgrammation), tel = String(c.telephone || '').replace(/[^\d+]/g, '');
    return `<aside class="cd${s ? ' cd--s' : ''}" aria-label="${attr(Lb.contactDiffusion)}">
      <p class="cd-k">${esc(Lb.contactDiffusion)}</p>
      <p class="cd-nom"><b${ed(`${k}.nom`)}>${esc(c.nom)}</b> <span class="cd-role"${ed(`${k}.role`)}>${esc(c.role)}</span></p>
      <p class="cd-liens">${c.email ? `<a class="cta cd-mail" href="${attr(href)}"><span${ed(`${k}.email`)}>${esc(c.email)}</span> ${FLECHE}</a>` : ''}${c.telephone ? `<a class="cd-tel" href="tel:${attr(tel)}"><span${ed(`${k}.telephone`)}>${esc(c.telephone)}</span></a>` : `<span class="cd-tel vide"${ed(`${k}.telephone`)}></span>`}</p>
      <p class="cd-cond">${esc(Lb.conditionsFinancieres)}</p>
    </aside>`;
  }
  // le dossier du spectacle en PDF, composé à la demande (dossier.js) : pendant ce temps le bouton est occupé (aria-busy), le bras s'y dessine, puis il redevient actif
  const OCCUPES = new Set();
  const dossierBouton = slug => `<button type="button" class="cta dos-bt" data-dossier="${attr(slug)}"${OCCUPES.has(slug) ? ' aria-busy="true" disabled' : ''}>${ICO_PDF}${BRAS_DOS}<span>${esc(S.libelles.dossierPdf)}</span></button>`;
  const occuper = (slug, oui) => $$(`[data-dossier="${slug}"]`).forEach(b => { b.disabled = oui; if (oui) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy'); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-dossier]'); if (!b || typeof DOSSIER === 'undefined') return;
    const slug = b.dataset.dossier; if (OCCUPES.has(slug)) return;
    OCCUPES.add(slug); occuper(slug, true);
    DOSSIER.telecharger(slug).then(() => { const c = $(`[data-dossier="${slug}"]`); if (c && typeof TENTACULES !== 'undefined') TENTACULES.confirmer(c); })
      .catch(() => { /* échec : le bouton redevient actif */ }).finally(() => { OCCUPES.delete(slug); occuper(slug, false); });
  });

  // « Je souhaite programmer » : le catalogue, la carte de tous les lieux, les partenaires
  function pageProgrammer() {
    const e = entree('programmer'), Lb = S.libelles;
    const fiches = D.shows.map(s => `<li class="fp" style="${uStyle(s)}">
      <div><h3><a class="etire" href="#/spectacle/${attr(s.slug)}/programmer">${esc(s.titre)}</a></h3>
        ${s.sousTitre ? `<p class="fp-sous"${ed(`shows.${s.slug}.sousTitre`)}>${s.sousTitre}</p>` : ''}
        <p class="fp-crea">${s.statut ? `<span class="tag"${ed(`shows.${s.slug}.statut`)}>${esc(s.statut)}</span>` : ''}<span${ed(`shows.${s.slug}.creation`)}>${esc(s.creation)}</span></p></div>
      ${faitsProg(s)}${equipe(s) || ficheHTML(s)}
      <div class="fp-pied">${dossierBouton(s.slug)}${lienVideo(s)}${docsDe(s, 'pros').length ? `<div class="fp-docs"><p class="lab">${esc(Lb.aTelecharger)}</p>${listeDocs(docsDe(s, 'pros'))}</div>` : ''}${lieuxDetails(s)}</div></li>`).join('');
    return tete(e.texte, e, null, contactHtml(null)) + `
      <section class="bloc" aria-labelledby="h-cat"><div class="wrap"><h2 class="h2" id="h-cat">${esc(Lb.lesSpectacles)}</h2><ul class="catalogue">${fiches}</ul></div></section>
      <section class="bloc" aria-labelledby="h-lieux"><div class="wrap"><h2 class="h2" id="h-lieux">${esc(Lb.lieuxDiffusion)}</h2>${Encre.svg({ lieux: CARTE.tout(), leger: true, titre: Lb.lieuxDiffusion })}</div></section>
      <section class="bloc"><div class="wrap">${S.partenaires ? `<p class="partenaires"${ed('site.partenaires')}>${S.partenaires}</p>` : ''}${ecrire()}</div></section>`;
  }

  // « Je représente un établissement scolaire » : la position de la compagnie, l'action culturelle de chaque spectacle
  function ficheEtab(s) {
    const A = s.actionCulturelle || {}, sl = s.slug, Lb = S.libelles, txt = (A.textes || [])[0];
    return `<li class="fe" style="${uStyle(s)}">
      <h3><a class="etire" href="#/spectacle/${attr(sl)}/etablissement">${esc(s.titre)}</a></h3>
      <p class="lab">${esc(Lb.actionCulturelle)}</p>
      ${A.aCompleter || !A.type ? `<p class="fe-type a-completer">${esc(Lb.aCompleter)}</p>` : `<p class="fe-type"${ed(`shows.${sl}.actionCulturelle.type`)}>${esc(A.type)}</p>`}
      ${A.public || A.statut ? `<ul class="puces">${A.public ? `<li><span class="lib">${esc(Lb.public)}</span> <span${ed(`shows.${sl}.actionCulturelle.public`)}>${esc(A.public)}</span></li>` : ''}${A.statut ? `<li${ed(`shows.${sl}.actionCulturelle.statut`)}>${esc(A.statut)}</li>` : ''}</ul>` : ''}
      ${txt ? `<div class="fe-texte">${bloc(txt.texte, `shows.${sl}.actionCulturelle.textes.0.texte`)}</div>` : ''}
      ${(A.formule || []).length ? `<p class="formule">${A.formule.map((l, k) => `<span${ed(`shows.${sl}.actionCulturelle.formule.${k}`)}>${esc(l)}</span>`).join('')}</p>` : ''}
      ${(A.dispositifs || []).length ? `<div class="fe-disp"><p class="lab">${esc(Lb.dispositifs)}</p><ul>${A.dispositifs.map((h, k) => `<li${ed(`shows.${sl}.actionCulturelle.dispositifs.${k}`)}>${h}</li>`).join('')}</ul></div>` : ''}
      ${s.dossier && D.dossiers && D.dossiers[s.dossier] ? `<p class="fe-dossier"><a href="#/spectacle/${attr(sl)}/etablissement">${esc(Lb.dossierScolaire)} ${FLECHE}</a></p>` : ''}</li>`;
  }
  function pageEtablissement() {
    const e = entree('etablissement'), Lb = S.libelles, A = S.actions || { blocs: [] }, sc = D.dates.filter(d => d.scolaire);
    const g = { etablissement: [], salle: [], autre: [] };
    D.shows.forEach(s => { if (!s.actionCulturelle) return; const l = s.actionCulturelle.lieu; (g[l] || g.autre).push(s); });   // sans action culturelle : pas ici (règle 14)
    const groupe = (titre, liste) => liste.length ? `<div class="groupe-e">${titre ? `<h2 class="h2">${esc(titre)}</h2>` : ''}<ul class="cartes-e">${liste.map(ficheEtab).join('')}</ul></div>` : '';
    const photos = ['actions-culturelles', 'actions-culturelles/g-1', 'actions-culturelles/g-2', 'actions-culturelles/g-3', 'actions-culturelles/g-4'].filter(k => D.photos[k]);
    return tete(e.texte, e) + `
      ${S.ecole ? `<section class="bloc"><div class="wrap"><p class="ecole-texte"${ed('site.ecole.texte')}>${esc(S.ecole.texte)}</p></div></section>` : ''}
      <section class="bloc"><div class="wrap">${groupe(Lb.lieu.etablissement, g.etablissement)}${groupe(Lb.lieu.salle, g.salle)}${groupe('', g.autre)}</div></section>
      <section class="bloc" aria-labelledby="h-actions"><div class="wrap"><h2 class="h2" id="h-actions"${ed('site.actions.titre')}>${esc(A.titre)}</h2><div class="ac-grille">
        <div class="blocs">${(A.blocs || []).map((b, k) => bloc(b, `site.actions.blocs.${k}`)).join('')}</div>
        ${photos.length ? `<div class="ac-photos">${photos.map(k => `<img src="${attr(D.photos[k])}" alt="${attr(A.titre)}" loading="lazy">`).join('')}${A.credit ? `<p class="credit"${ed('site.actions.credit')}>${esc(A.credit)}</p>` : ''}</div>` : ''}
      </div></div></section>
      ${sc.length ? `<section class="bloc" aria-labelledby="h-sc"><div class="wrap"><h2 class="h2" id="h-sc">${esc(Lb.enEtablissement)}</h2>
        <div class="ag-grille"><div class="ag-carte">${Encre.svg({ lieux: CARTE.aVenir('scolaire'), cadre: 'serre', titre: Lb.enEtablissement })}</div>
          <div class="ag-liste" data-agenda="">${parMois(sc).map(([m, ds]) => `<div class="mois"><h3>${esc(m)}</h3><ul class="dl">${ds.map(d => ligneDate(d, { ctx: 'etablissement' })).join('')}</ul></div>`).join('')}</div></div></div></section>` : ''}
      <section class="bloc"><div class="wrap">${ecrire()}</div></section>`;
  }

  // les spectacles : une bande par univers
  function pageSpectacles() {
    const bandes = D.shows.map((s, i) => {
      const sl = s.slug, d = prochainePublique(s);
      return `<li class="bande" style="${uStyle(s)}"><div class="bande-in">
        <div class="bande-ph"><img src="${attr(D.photos[sl] || '')}" alt="" loading="${i < 2 ? 'eager' : 'lazy'}"></div>
        <div class="bande-tx"><span class="bande-embleme">${motif(univers(s).motif)}</span>${s.lieuTemps ? `<p class="bande-lt"${ed(`shows.${sl}.lieuTemps`)}>${esc(s.lieuTemps)}</p>` : ''}
          <h2><a class="etire" href="#/spectacle/${attr(sl)}">${esc(s.titre)}</a></h2>
          ${s.sousTitre ? `<p class="bande-sous"${ed(`shows.${sl}.sousTitre`)}>${s.sousTitre}</p>` : ''}
          <p class="bande-crea"${ed(`shows.${sl}.creation`)}>${esc(s.creation)}</p>
          ${s.accroche ? `<p class="bande-acc"${ed(`shows.${sl}.accroche`)}>${esc(s.accroche)}</p>` : ''}
          ${s.statut || s.enTournee || d ? `<p class="bande-etat">${s.statut ? `<span class="tag">${esc(s.statut)}</span>` : s.enTournee ? `<span class="tag">${esc(S.libelles.enTournee)}</span>` : ''}${d ? `<span class="bande-date">${esc(d.ligne)}</span>` : ''}</p>` : ''}
        </div></div></li>`;
    }).join('');
    return tete(menu('spectacles').texte) + `<ul class="bandes">${bandes}</ul>`;
  }

  // une saison passée : la saison par spectacle, et sa carte
  function pageSaison(k) {
    const sa = D.saisons[k];
    const liens = `<section class="bloc"><div class="wrap"><ul class="saisons">${(S.saisons || []).filter(x => x.saison !== k).map(x => `<li><a href="${attr(x.saison === (S.saisons[0] || {}).saison ? (entree('voir') || {}).href || x.href : x.href)}">${esc(x.titre)} ${FLECHE}</a></li>`).join('')}</ul></div></section>`;
    return tete(sa.titre, entree('voir')) + `<section class="bloc"><div class="wrap ag-grille">
      <div class="ag-carte">${Encre.svg({ lieux: CARTE.saison(k), titre: sa.titre })}</div>
      <div class="ag-liste">${sa.spectacles.map(g => { const s = g.slug && show(g.slug); return `<section class="sa-sp"><h2>${s ? `<a href="#/spectacle/${attr(g.slug)}/voir" style="color:${univers(s).lait}">${esc(g.titre)}</a>` : esc(g.titre)}</h2>
        ${g.sousTitre ? `<p class="sa-sous">${g.sousTitre}</p>` : ''}${g.creation ? `<p class="sa-crea">${esc(g.creation)}</p>` : ''}
        <div data-agenda="${attr(g.slug || '')}"><ul class="dl">${g.dates.map(ligneSaison).join('')}</ul></div></section>`; }).join('')}</div>
    </div></section>${liens}`;
  }

  // la compagnie : sa présentation, ses dates, le portrait de son directeur artistique, ses partenaires
  function pageCompagnie() {
    const C = S.compagnie, Dir = C.directeur;
    return tete(C.titre, null, 'site.compagnie.titre') + `<section class="bloc"><div class="wrap co-grille">
        <div class="co-texte">${(C.paragraphes || []).map((p, k) => bloc(p, `site.compagnie.paragraphes.${k}`)).join('')}</div>
        <aside class="chrono" aria-labelledby="h-dates"><h2 class="h2" id="h-dates"${ed('site.compagnie.datesTitre')}>${esc(C.datesTitre)}</h2>
          <ol>${(C.dates || []).map((d, i) => { const s = D.shows.find(x => String(x.annee) === String(d.annee)); const t = `<span${ed(`site.compagnie.dates.${i}.titre`)}>${esc(d.titre)}</span>`;
            return `<li style="--i:${i}"><b${ed(`site.compagnie.dates.${i}.annee`)}>${esc(d.annee)}</b>${s ? `<a href="#/spectacle/${attr(s.slug)}" style="--c:${univers(s).lait}">${t}</a>` : `<span class="t-date">${t}</span>`}</li>`; }).join('')}</ol>
        </aside></div></section>
      ${Dir ? `<section class="bloc directeur" aria-labelledby="h-dir"><div class="wrap"><h2 class="h2" id="h-dir"${ed('site.compagnie.directeur.titre')}>${esc(Dir.titre)}</h2>
        <div class="dir-texte">${Dir.chapeau ? `<p class="dir-chapeau"${ed('site.compagnie.directeur.chapeau')}>${esc(Dir.chapeau)}</p>` : ''}${(Dir.paragraphes || []).map((p, k) => bloc(p, `site.compagnie.directeur.paragraphes.${k}`)).join('')}</div></div></section>` : ''}
      ${S.partenaires ? `<section class="bloc"><div class="wrap"><p class="partenaires"${ed('site.partenaires')}>${S.partenaires}</p></div></section>` : ''}`;
  }
  function pageContact() {
    const C = S.contact, K = S.coordonnees;
    const champ = (c, i) => {
      const id = 'ct-' + i, type = /mail/i.test(c) ? 'email' : /phone/i.test(c) ? 'tel' : 'text';
      return `<div class="champ"><label for="${id}">${esc(c)}</label>${i === C.champs.length - 1 ? `<textarea id="${id}" rows="6"></textarea>` : `<input id="${id}" type="${type}">`}</div>`;
    };
    const accord = esc(C.consentement).replace(/politique de confidentialité/i, m => `<a href="#/politique-de-confidentialite">${m}</a>`);
    return tete(C.titre) + `<section class="bloc"><div class="wrap ct-grille">
      <form class="form" novalidate>${C.champs.map(champ).join('')}
        <div class="consent"><input type="checkbox" id="ct-ok"><label for="ct-ok">${accord}</label></div>
        <div class="calcul"><label for="ct-calc">${esc(C.calcul)}</label><input id="ct-calc" inputmode="numeric"></div>
        <button class="bouton" type="submit">${esc(C.bouton)}</button></form>
      <aside class="coord"><p><strong>${esc(K.nom)}</strong><br>${K.adresse.map(esc).join('<br>')}</p><p>${K.legal.map(esc).join('<br>')}</p></aside>
    </div></section>`;
  }
  const pageLegal = cle => { const L = S.legal[cle]; return tete(L.titre) + `<section class="bloc"><div class="wrap legal">${L.blocs.map(bloc).join('')}</div></section>`; };

  /* ---------- la page d'un spectacle : son univers, ses trois entrées ---------- */
  // l'accroche s'écrit mot à mot (l'édition remet la phrase entière)
  function mots(txt) {
    if (!ANIMER || !motionOK() || /<[a-z]/i.test(txt)) return esc(txt);
    const ms = String(txt).split(/(\s+)/), n = Math.max(1, ms.filter(m => m.trim()).length);
    let i = 0;
    return ms.map(m => m.trim() ? `<span class="mot" style="--t:${(i++ / n).toFixed(3)}">${esc(m)}</span>` : m).join('');
  }
  const figure = (s, p, k, classe = '') => `<figure class="ph ${classe}"${edp(`shows.${s.slug}.photos.${k}`)}><img src="${attr(D.photos[p.cle] || '')}" alt="${attr(s.titre)}" loading="lazy"><figcaption class="leg"${ed(`shows.${s.slug}.photos.${k}.legende`)}>${p.legende ? esc(p.legende) : ''}</figcaption></figure>`;
  const credits = (s, liste) => {
    const out = [];
    if (liste.some(x => x.p.source !== 'dossier') && s.creditPhotos) out.push(`<span${ed(`shows.${s.slug}.creditPhotos`)}>${esc(s.creditPhotos)}</span>`);
    if (liste.some(x => x.p.source === 'dossier') && s.creditDossier) out.push(`<span${ed(`shows.${s.slug}.creditDossier`)}>${esc(s.creditDossier)}</span>`);
    return out.length ? `<p class="credit">${out.join('')}</p>` : '';
  };
  const photosDe = (s, garde) => (s.photos || []).map((p, k) => ({ p, k })).filter(({ p }) => garde(p));
  function citations(s) {
    return (s.citations || []).map((c, k) => `<blockquote class="vers${c.prose ? ' prose' : ''}"><p>${(c.vers || []).map((v, j) => `<span class="v"${ed(`shows.${s.slug}.citations.${k}.vers.${j}`)}>${esc(v)}</span>`).join(c.prose ? ' ' : '')}</p>${c.source ? `<cite${ed(`shows.${s.slug}.citations.${k}.source`)}>${esc(c.source)}</cite>` : ''}</blockquote>`).join('');
  }
  function medias(s) {
    const l = [...(s.video && s.video.url ? [{ type: 'video', titre: s.video.titre, url: s.video.url, groupe: null }] : []), ...(s.medias || []).filter(m => m.url && (!s.video || m.url !== s.video.url))];
    if (!l.length) return '';
    const groupes = [];
    l.forEach(m => { const g = m.groupe || ''; let G = groupes.find(x => x.g === g); if (!G) groupes.push(G = { g, l: [] }); G.l.push(m); });
    return groupes.map(G => `${G.g ? `<h3>${esc(G.g)}</h3>` : ''}<ul class="medias">${G.l.map(m => `<li>${lienExt(m.url, `${ICONE[m.type] || ICONE.video}<span><b>${esc(m.titre || m.url)}</b>${m.par ? `<small>${esc(m.par)}</small>` : ''}</span>`)}</li>`).join('')}</ul>`).join('');
  }
  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu
  const TACHES = ['63% 37% 54% 46% / 45% 56% 44% 55%', '41% 59% 46% 54% / 58% 42% 58% 42%', '55% 45% 39% 61% / 41% 61% 47% 53%', '37% 63% 52% 48% / 55% 45% 57% 43%'];
  const portrait = ({ e, p, lignes }, credits, i) => {
    const nom = nomDe(p), k = `personnes.${e.personne}`;
    return `<figure class="cast-pt"><span class="cast-cadre" style="--blob:${TACHES[i % TACHES.length]}" data-edit-photo="${attr(k)}.photo"><span class="cast-img"><span class="cast-mono" aria-hidden="true"><b>${esc(initiales(p))}</b></span>${p.photo ? `<img src="${attr(p.photo)}" alt="${attr(nom)}" width="320" height="400" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span></span>
      <figcaption>${credits ? `<small class="cast-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="cast-nom"><span${ed(`${k}.prenom`)}>${esc(p.prenom)}</span> <span${ed(`${k}.nom`)}>${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="cast-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="cast-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];

  /* ---------- le défilement : l'effet de chaque spectacle, et le sommaire qui suit la lecture ---------- */
  let secs = [], chapitres = [], sraf = 0;
  const hautPx = () => haut.offsetHeight;
  function defile() {
    for (const sec of secs) {
      const r = sec.getBoundingClientRect(), h = r.height || 1;
      sec.style.setProperty('--p', (motionOK() ? clamp((hautPx() - r.top) / (h * .85), 0, 1) : 0).toFixed(4));
    }
  }
  function suivreChapitre() {
    if (!chapitres.length) return;
    const lim = innerHeight * .42; let k = 0;
    chapitres.forEach((x, i) => { if (x.sec.getBoundingClientRect().top < lim) k = i; });
    chapitres.forEach((x, i) => { x.li.classList.toggle('on', i === k); if (i === k) x.b.setAttribute('aria-current', 'true'); else x.b.removeAttribute('aria-current'); });
  }
  function sommaire() {
    chapitres = [];
    const nav = $('.sommaire', vPage);
    if (!nav) return;
    chapitres = $$('button[data-chap]', nav).map(b => ({ b, li: b.parentElement, sec: document.getElementById(b.dataset.chap) })).filter(x => x.sec);
    chapitres.forEach(x => x.b.addEventListener('click', () => {
      x.sec.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });

    suivreChapitre();
  }
  addEventListener('scroll', () => { if ((secs.length || chapitres.length) && !sraf) sraf = requestAnimationFrame(() => { sraf = 0; defile(); suivreChapitre(); }); }, { passive: true });
  addEventListener('resize', () => { if (secs.length) defile(); });

    compagnie: () => ({ titre: menu('compagnie').texte, rendu: pageCompagnie }),
    contact: () => ({ titre: menu('contact').texte, rendu: pageContact }),
    'mentions-legales': () => ({ titre: S.legal['mentions-legales'].titre, rendu: () => pageLegal('mentions-legales') }),
    'politique-de-confidentialite': () => ({ titre: S.legal['politique-de-confidentialite'].titre, rendu: () => pageLegal('politique-de-confidentialite') }),
  };
  const MEMO = 'crescite-m10-entree';
  const retenir = c => { try { sessionStorage.setItem(MEMO, c); } catch (e) { /* stockage indisponible */ } };
  const retenue = () => { try { const v = sessionStorage.getItem(MEMO); return entree(v) ? v : null; } catch (e) { return null; } };
  const vAccueil = $('#v-accueil'), vPage = $('#v-page');
  let courant = null, venait = null;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  // ce qu'on garde d'une vue refaite en place : la position, les volets ouverts, les champs, le focus
  const signe = el => !el || el === document.body ? null : el.dataset && el.dataset.edit ? `e:${el.dataset.edit}` : el.id ? `#${el.id}` : el.dataset && el.dataset.chap ? `c:${el.dataset.chap}` : el.getAttribute && el.getAttribute('href') ? `h:${el.getAttribute('href')}:${el.textContent.trim().slice(0, 40)}` : null;
  function etatVue() {
    const a = document.activeElement;
    return { y: scrollY, ouverts: $$('details', vPage).map(d => d.open), champs: $$('input, textarea', vPage).map(c => [c.id, c.type === 'checkbox' ? c.checked : c.value]),
      focus: a && vPage.contains(a) ? signe(a) : null };
  }
  function restaurer(v) {
    const ds = $$('details', vPage);
    if (v.ouverts && ds.length === v.ouverts.length) ds.forEach((d, i) => { d.open = v.ouverts[i]; });
    (v.champs || []).forEach(([id, x]) => { const c = id && document.getElementById(id); if (c) { if (c.type === 'checkbox') c.checked = x; else c.value = x; } });
    if (Math.abs(scrollY - v.y) > 1) scrollTo(0, v.y);
    if (v.focus) { const el = $$('a, button, summary, input, textarea, [tabindex], [data-edit]', vPage).find(x => signe(x) === v.focus); if (el) el.focus({ preventScroll: true }); }
    defile(); suivreChapitre();
  }
  function apres() {
    $$('a[href^="http"]', vPage).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    $$('form', vPage).forEach(f => f.addEventListener('submit', e => e.preventDefault()));
    $$('svg.carte.encre:not([data-gere])', vPage).forEach(svgEl => { const zone = svgEl.closest('.ag-grille, .tour-grille'); Encre.relier(svgEl, zone ? $$('ul.dl', zone) : []); });
    if (courant && courant.cle === 'voir' && AGV) AGV.brancher();
    secs = $$('[data-scrolly]', vPage); defile();
    sommaire();
  }

  // enPlace : D vient de changer (DONNEES) ; la vue courante est refaite sans remonter, sans voler le focus, sans animation
  function route(enPlace = false) {
    chrome(); pied();
    const chemin = location.hash.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
    const red = (S.redirections || {})['#/' + chemin];
    if (red) { location.replace(red); return; }
    const ms = chemin.match(/^spectacle\/([\w-]+)(?:\/([\w-]+))?$/), ma = chemin.match(/^agenda\/([\w-]+)$/);
    // un spectacle sans entrée : l'entrée retenue, sinon « voir »
    if (ms && show(ms[1]) && !entree(ms[2])) { location.replace(`#/spectacle/${ms[1]}/${entreeSp(ms[1], retenue() || 'voir')}`); return; }
    // un spectacle sans action culturelle n'a pas d'onglet établissement : « voir » (remplacement, pas d'historique en plus)
    if (ms && show(ms[1]) && ms[2] === 'etablissement' && !show(ms[1]).actionCulturelle) { location.replace(`#/spectacle/${ms[1]}/voir`); return; }
    let v;
    if (chemin === '') v = { cle: 'accueil', titre: S.accueil };
    else if (ms && show(ms[1])) { const s = show(ms[1]); v = { cle: 'spectacle', slug: ms[1], entree: ms[2], titre: ms[2] === 'voir' ? s.titre : `${s.titre} - ${entree(ms[2]).court}` }; }
    else if (ma && D.saisons[ma[1]]) v = { cle: 'saison', saison: ma[1], titre: D.saisons[ma[1]].titre };
    else if (Object.prototype.hasOwnProperty.call(PAGES, chemin)) v = { cle: chemin, ...PAGES[chemin]() };
    else { location.replace('#/'); return; }
    v.id = v.cle === 'spectacle' ? `spectacle/${v.slug}/${v.entree}` : v.cle === 'saison' ? `saison/${v.saison}` : v.cle;
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    marquerNav(v);
    if (entree(v.cle)) retenir(v.cle);
    if (v.cle === 'spectacle') retenir(v.entree);

    // la même vue, refaite en place
    if (enPlace && courant && courant.id === v.id) {
      const etat = v.cle === 'accueil' ? { y: scrollY } : etatVue();
      ANIMER = false;
      try {
        if (v.cle === 'accueil') { accueilSuite(); Stage.maj(); }
        else { vPage.innerHTML = v.cle === 'spectacle' ? pageSpectacle(v.slug, v.entree) : v.cle === 'saison' ? pageSaison(v.saison) : v.rendu(); apres(); }
      } finally { ANIMER = true; }
      restaurer(etat);
      return;
    }

    fermeMenu();
    const quitte = venait, memeSp = quitte && v.cle === 'spectacle' && quitte === v.slug;
    venait = v.cle === 'spectacle' ? v.slug : null;
    courant = v;
    secs = []; chapitres = [];
    const qs = quitte && show(quitte);
    if (v.cle === 'accueil') {
      // en quittant un spectacle, l'encre se retire vers la pieuvre
      if (qs && motionOK() && !Ink.active()) Ink.fill(univers(qs).fond);
      vPage.hidden = true; vPage.innerHTML = ''; vAccueil.hidden = false;
      accueilSuite();
      scrollTo(0, 0);
      Stage.montrer(true);
      if (qs && motionOK()) { const c = Stage.coeurEcran(); Ink.uncover(c.x, clamp(c.y, 60, innerHeight - 60), null, encreDe(qs)); } else Ink.fadeOut();
      if (!(typeof INTRO !== 'undefined' && INTRO.ouverte())) $('#stage-h').focus({ preventScroll: true });
      return;
    }
    Stage.montrer(false);
    if (qs && !memeSp && motionOK() && !Ink.active() && v.cle !== 'spectacle') Ink.fill(univers(qs).fond);
    vAccueil.hidden = true; vPage.hidden = false; $('#accueil-suite').innerHTML = '';
    vPage.innerHTML = v.cle === 'spectacle' ? pageSpectacle(v.slug, v.entree) : v.cle === 'saison' ? pageSaison(v.saison) : v.rendu();
    scrollTo(0, 0);
    apres();
    if (qs && !memeSp && v.cle !== 'spectacle' && motionOK()) Ink.uncover(innerWidth / 2, innerHeight / 2, null, encreDe(qs)); else Ink.fadeOut();
    const h1 = $('h1', vPage);
    if (h1) h1.focus({ preventScroll: true });
  }
  // un lien vers un spectacle, ailleurs que sur la scène : l'encre de son univers part du clic (pas d'un onglet à l'autre)
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/spectacle/"]');
    if (!a || a.classList.contains('t-label') || e.button > 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || !motionOK()) return;
    if (typeof EDITION !== 'undefined' && EDITION.actif) return;
    const slug = a.getAttribute('href').split('/')[2], s = show(slug);
    if (!s || (courant && courant.cle === 'spectacle' && courant.slug === slug)) return;
    e.preventDefault();
    Ink.cover(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, () => { location.hash = a.getAttribute('href'); }, encreDe(s));
  });
  // les tentacules : comme les bras de la carte, d'encre et de ventouses. Sur la scène, c'est la pieuvre vivante qui répond (data-tt="rien") ;
  // l'outil prolonge : quand l'encre se retire, une tentacule à la couleur de l'univers (ou de l'entrée) remonte jusqu'à la pieuvre de l'en-tête ;
  // le retour à la scène reste à l'encre qui se retire vers la pieuvre
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'ventouses', entrees: 'vive', duree: .9, detail: { page: .85 }, couleurDe: h => (/^(#\/?)?$/.test(h) ? false : null) });
  // l'ouverture : le logo sur la nuit ; à la révélation, la pieuvre de la scène s'éveille et tend ses bras
  INTRO.ouvrir({ degrade: [[0, '#331629'], [.55, '#1b0c16'], [1, '#0b0509']], encre: '#f7ecf1', classe: 'nuit-pieuvre', apres: () => Stage.eveiller() });
  addEventListener('hashchange', () => route());
  route();
  // la base de la compagnie : à chaque enregistrement, D change en place et la vue courante est refaite en place
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(() => route(true));
})();
</script>
</body>
</html>
