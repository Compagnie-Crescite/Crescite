n’a aucun effet, il ne reste qu’une solution : l’insurrection. Le chef d’établissement et quelques professeurs, décident alors d’organiser une prise d’otage au sein du collège afin de faire entendre leurs revendications avec force et éclat.","Mais la folle idée dégénère : alors qu’ils étaient soudés dans la contestation, ils ne parviennent à se mettre d’accord sur rien. Et cette journée d’émulation se conclut de façon macabre.","<em>La Folle Idée<\/em> fait entendre la parole d’individus au point de non-retour. Des professionnels qui, ayant la volonté d’être constructifs, tentent le difficile exercice de s’écouter et de se mettre d’accord. Mais exaspérés par la sensation de ne jamais être entendus, ils glissent peu à peu dans la violence ordinaire. Celle qui bout ça et là. Celle qui monte un peu partout."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ffd447","couleurTexteClair":"#7f6922","fondSombre":"#10201a","palette":{"fond":"#10201a","fond2":"#172a20","texte":"#eef5ee","texte2":"#b6cab9","accent":"#ffd447","accent2":"#ff6b3d","scene":"#ffd447","lueur":"rgba(255,212,71,0.22)"},"clair":false,"motif":"horloge","focale":50,"univers":{"nom":"L’horloge","source":"prototype","clair":false,"motif":"horloge","couleurs":{"fond":"#10201a","fond2":"#172a20","texte":"#eef5ee","texte2":"#b6cab9","accent":"#ffd447","accent2":"#ff6b3d","scene":"#ffd447","lueur":"rgba(255,212,71,0.22)"},"polices":{"titre":"Anton","titreGraisse":400,"texte":"Inter","etiquette":"Inter"}},"lieuTemps":null,"accroche":"Un huis-clos en salle des professeurs.","affirmations":[{"texte":"La Folle Idée fait entendre la parole d’individus au point de non-retour.","source":"site"}],"citations":[],"video":{"titre":"Bande-annonce \"La Folle Idée\" - création 2021","url":"https://player.vimeo.com/video/544583862","source":"site"},"photo":"la-folle-idee.webp","photos":[{"id":"g-1","legende":null,"source":"site","cle":"la-folle-idee/g-1","fichier":"la-folle-idee/g-1.webp"},{"id":"g-2","legende":n hardouin","categorie":"creation","fonction":"Création lumières","role":null,"alternance":null},{"personne":"jane-avezou","categorie":"creation","fonction":"Création costumes","role":null,"alternance":null}],"statut":null,"sousTitre":"de Racine","avec":{"libelle":"avec :","valeur":"Angelo Jossec, Manon Rivier, Lauren Toulin, et Adrien Vada."},"mentions":["spectacle disponible dans les offres collectives du Pass Culture"],"duree":"durée : 1h25","production":["<strong>Production :<\/strong> Crescite","<strong>Coproduction :<\/strong> l’Archipel de Granville.","Avec le soutien de la DRAC et de la Région Normandie, de la Ville de Rouen et du Département de Seine-Maritime.","Avec l’aide de la DRAC Normandie dans le cadre du plan de relance 2021/mesure 5 du plan théâtre 2021."],"credit":"© Olivier Héron / Alban Van Wassenhove / Thomas Cartron","medias":[],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/berenice/"},{"slug":"macbeth-fatum","titre":"Macbeth – Fatum","titreLignes":["Macbeth","Fatum"],"creation":"création 2016","annee":2016,"fiche":[{"libelle":null,"valeur":"d’après Shakespeare"},{"libelle":"Mise en scène et adaptation :","valeur":"Angelo Jossec"},{"libelle":"Assistante :","valeur":"Lauren Toulin"},{"libelle":"Traduction :","valeur":"Alexis Magenham"},{"libelle":"Conseillère artistique, doublure et accessoiriste :","valeur":"Lisa Peyron"},{"libelle":"Création sonore :","valeur":"William Langlois"},{"libelle":"Création lumières :","valeur":"Jérôme Hardouin"},{"libelle":"Création costumes :","valeur":"Jane Avezou"}],"texte":["Macbeth et Lady Macbeth, couple sans enfant, n’ont d’autre dieu que leur intérêt commun : lui voulant devenir monarque absolu et elle, alimentant ce désir de pouvoir. Le couple est prêt à tout pour triompher. Au-delà du versant politique de cette histoire, c’est la question de l’humanité qui ont intéressé le jeune metteur en scène et comédien Angelo Jossec et sa compagnie. Comment l’homme peut-il se résoudre à tant de cruauté et d’horreurs ?","Le Théâtre des Crescite revendique le souhait de pratiquer un « théâtre pauvre » au sens noble du terme. Un théâtre sans fioritures qui s’en tient à l’essentiel et met l’acteur eu centre de la scène, comme pilier le plus important de l’édifice. Pour ce nouveau spectacle, le défi est de raconter <em>Macbeth<\/em> en 1h40, avec cinq comédiens pour jouer plus de trente personnages ! Comme dans ses précédentes créations, la compagnie crée tous les effets à vue pour mettre le spectateur dans la confidence. Il s’agit de rendre compte des artifices et de ce qui fait « théâtre ». Avec ingéniosité, folie et pour tout décor quelques tables, chaises et draps, les acteurs passent d’un rôle à l’autre, oscillant entre tragédie et comédie, bouffonnerie et romance, pour donner à voir la richesse et l’étendue des registres et des genres propres à l’écriture de Shakespeare."],"enTournee":false,"prochaine":null,"nbDates":0,"couleur":"#ff3b3f","couleurTexteClair":"#d73134","fondSombre":"#0b0808","palette":{"fond":"#0b0808","fond2":"#171010","texte":"#efe6da","texte2":"#bdae9b","accent":"#e0262d","accent2":"#7d8471","scene":"#ff3b3f","lueur":"rgba(224,38,45,0.25)"},"clair":false,"motif":"fil","focale":50,"univers":{"nom":"Le fil rouge","source":"prototype","clair":false,"motif":"fil","couleurs":{"fond":"#0b0808","fond2":"#171010","texte":"#efe6da","texte2":"#bdae9b","accent":"#e0262d","accent2":"#7d8471","scene":"#ff3b3f","lueur":"rgba(224,38,45,0.25)"},"polices":{"titre":"Grenze Gotisch","titreGraisse":600,"texte":"Source Serif 4","etiquette":"Inter"}},"lieuTemps":null,"accroche":"Comment l’homme peut-il se résoudre à tant de cruauté et d’horreurs ?","affirmations":[{"texte":"Le Théâtre des Crescite revendique le souhait de pratiquer un « théâtre pauvre » au sens noble du terme.","source":"site"}],"citations":[],"video":{"titre":"Bande-annonce ''Macbeth - Fatum'' - création 2016","url":"https://player.vimeo.com/video/194313759","source":"site ux Printemps à Rouen, Festival Saint-Valéry-sur-Somme, Festival de Flers, Festival de Saint-Romain de Colbosc, + collèges et lycées normands."},"dossier":null,"equipe":[{"personne":"alice-lestienne","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"charles-levasseur","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"louisa-travers","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"angelo-jossec","categorie":"creation","fonction":"Mise en scène et adaptation","role":null,"alternance":null},{"personne":"alexis-magenham","categorie":"creation","fonction":"Traduction","role":null,"alternance":null},{"personne":"eric-guilbaud","categorie":"creation","fonction":"Création lumières","role":null,"alternance":null},{"personne":"william-langlois","categorie":"creation","fonction":"Création sonore","role":null,"alternance":null},{"personne":"lisa-peyron","categorie":"creation","fonction":"Création accessoires","role":null,"alternance":null},{"personne":"manon-rivier","categorie":"creation","fonction":"Création accessoires","role":null,"alternance":null},{"personne":"thomas-janeczko","categorie":"technique","fonction":"Régisseur général","role":null,"alternance":null}],"statut":null,"sousTitre":"d’après Shakespeare","avec":{"libelle":"avec :","valeur":"Alice Lestienne, Charles Levasseur et Louisa Travers"},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/nos-actions/education-college/guide-du-cred76/immersion-linguistique/mon-royaume-pour-un-cheval-romeo-and-juliet-dapres-shakespeare/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 1h10","production":["<strong>Production :<\/strong> Crescite","Le spectacle a été créé avec le soutien de la Ville de Rouen et du GEIQ-Théâtre en Haute-Normandie en 2013.<br/>Avec le soutien de l’ODIA Normandie – Agence au service du développement du spectacle vivant, pour l’aide à la reprise en 2026."],"credit":"© Thomas Cartron","medias":[{"type":"video","url":"https://player.vimeo.com/video/273701402","titre":"Bande-annonce \"Mon Royaume pour un cheval - Romeo and Juliet\" Avignon 2018","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/mon-royaume-pour-un-cheval-romeo-and-juliet/"},{"slug":"imaginaire-force","titre":"L’imaginaire forcé","titreLignes":["L’imaginaire forcé"],"creation":"création 2012","annee":2012,"fiche":[{"libelle":"Texte :","valeur":"d’après « Le Mariage forcé » de Molière"},{"libelle":"Mise en scène :","valeur":"Angelo Jossec"}],"texte":["L’idée est de partager, de transmettre l’univers et la vitalité du théâtre que faisait Molière. Il s’agit moins d’un spectacle que d’un prétexte pour discuter Molière, sa langue et le théâtre du 17<sup>e<\/sup> siècle.","Le spectateur pourra expérimenter cette langue au travers de cette intervention puis d’un atelier de pratique théâtrale. Il s’agit donc d’une forme hybride où la pièce, l’histoire choisie, vaut tout autant que la découverte de l’homme qu’était Molière, le théâtre de son époque, ses conditions de travail, une vue d’ensemble sur les thématiques chères à Molière et une explication des intrigues aux vue de l’époque à laquelle elles se font. Prenons pour exemple le mariage, qui est au centre de la plupart, pour ne pas dire toutes, des intrigues de Molière.","Comment se sentir concerné par ces histoires si nous ne savons pas qu’à l’époque le mariage ne se fait que par intérêt et qu’une loi stipule que celui-ci est considéré comme nul si le père n’y consent pas… Il ne s’agit que d’un exemple, mais il montre l’enjeu de ce projet : une forme sans cesse interrompue par de brèves recontextualisations historiques et sociales. Ces recontextualisations sont moins là pour inscrire l’intervention dans une perspective historique que pour donner les clefs d’une langue vieille de plusieurs siècles.","Nous avons choisi <em>Le Mariage Forcé<\/em>, pièce de 1664. Une pièce courte mais contenant toute la virtuosité de Molière, tant dans l’écriture que dans les thèmes abordés. La brièveté de cette pièce laisse la place à de nombreux lazzi (« aux à côté »), c’est à dire aux arrêts de jeu, aux parenthèses sur Molière, sa vie, son œuvre, son époque."],"enTournee":true,"prochaine":{"slug":"imaginaire-force","titre":"L’imaginaire forcé","ligne":"8 avril 2027 — Rouen (76)","ligneDate":"8 avril 2027","ligneLieu":"Rouen (76)","details":[{"texte":"2 représentations au Collège Sainte-Marie","lien":null}],"lien":null,"iso":"2027-04-08","fin":"2027-04-08","precision":"day","scolaire":true,"commune":"Rouen","dep":"76","xy":[327.1,174.8],"l":24},"nbDates":1,"couleur":"#d4823c","couleurTexteClair":"#a4642e","fondSombre":"#160f0a","palette":{"fond":"#160f0a","fond2":"#241811","texte":"#f6ead8","texte2":"#b79b7d","accent":"#d4823c","accent2":"#e39a58","scene":"#d4823c","lueur":"rgba(212,130,60,0.30)"},"clair":false,"motif":"annotations","focale":50,"univers":{"nom":"Les annotations","source":"adrienvada","clair":false,"motif":"annotations","couleurs":{"fond":"#160f0a","fond2":"#241811","texte":"#f6ead8","texte2":"#b79b7d","accent":"#d4823c","accent2":"#e39a58","scene":"#d4823c","lueur":"rgba(212,130,60,0.30)"},"polices":{"titre":"IM Fell French Canon","titreGraisse":400,"texte":"Source Serif 4","etiquette":"Inter"}},"lieuTemps":null,"accroche":"Quand la censure académique leur impose Le Mariage forcé à la place du Malade imaginaire, des comédiens font déraper la lecture jusqu’à transformer la classe en un chantier théâtral et musical jubilatoire.","affirmations":[{"texte":"Il s’agit moins d’un spectacle que d’un prétexte pour discuter Molière, sa langue et le théâtre du 17e siècle.","source":"site"}],"citations":[],"video":{"titre":"Teaser - l'Imaginaire Forcé","url":"https://www.youtube.com/embed/URov8sJFUew","source":"site"},"photo":"imaginaire-force.webp","photos":[{"id":"g-2","legende":null,"source":"site","cle":"imaginaire-force/g-2","fichier":"imaginaire-force/g-2.webp"},{"id":"g-3","legende":null,"source":"site","cle":"imaginaire-force/g-3","fichier":"imaginaire-force/g-3.webp"},{"id":"g-5","legende":null,"source":"site","cle":"imaginaire-force/g-5","fichier":"imaginaire-force/g-5.webp"}],"creditPhotos":"© Lauren Toulin","creditDossier":null,"actionCulturelle":{"type":"Forme hybride","public":null,"lieu":"etablissement","textes":[{"texte":"Le spectateur pourra expérimenter cette langue au travers de cette intervention puis d’un atelier de pratique théâtrale. Il s’agit donc d’une forme hybride où la pièce, l’histoire choisie, vaut tout autant que la découverte de l’homme qu’était Molière, le théâtre de son époque, ses conditions de travail, une vue d’ensemble sur les thématiques chères à Molière et une explication des intrigues aux vue de l’époque à laquelle elles se font. Prenons pour exemple le mariage, qui est au centre de la plupart, pour ne pas dire toutes, des intrigues de Molière.","source":"site"}],"dispositifs":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/mon-quotidien/colleges/guide-du-cred76/limaginaire-force/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"]},"programmer":{"format":null,"duree":"durée : 55 minutes","representations":"492 représentations au 31 juillet 2026","lieux":"L'Athanor à Guérande, centre culturel de Sarzeau, Espace Culturel de Méricourt, Festival Curieux Printemps à Rouen, centre culturel d'Amfreville La Mivoie, + collèges normands.","actualite":"re-création automne 2026 pour Avignon 2027"},"dossier":null,"equipe":[{"personne":"louison-bayeux","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"claire-le-plomb-martin","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"louis-le-plomb-martin","categorie":"jeu","fonction":"","role":null,"alternance":null},{"personne":"angelo-jossec","categorie":"creation","fonction":"Mise en scène","role":null,"alternance":null}],"statut":null,"sousTitre":"d’après Molière","avec":{"libelle":"avec :","valeur":"Louison Bayeux, Claire Le Plomb Martin et Louis Le Plomb Martin."},"mentions":["spectacle disponible dans <a href=\"https://www.seinemaritime.fr/mon-quotidien/colleges/guide-du-cred76/limaginaire-force/\">le guide du CRED de Seine-Maritime<\/a><br/>et dans les offres collectives du Pass Culture"],"duree":"durée : 55 minutes","production":["<strong>Production :<\/strong> Crescite"],"credit":"© Lauren Toulin","medias":[{"type":"video","url":"https://www.youtube.com/embed/URov8sJFUew","titre":"Teaser - l'Imaginaire Forcé","groupe":null}],"tournee":{"titre":"Actuellement en tournée","texte":null},"source":"https://crescite.fr/l-imaginaire-force/"}],"dossiers":{"berenice":{"source":"Dossier scolaire Bérénice 2026, Compagnie Crescite","titre":"BÉRÉNICE","auteur":"de Jean Racine","creation":"CRÉATION 2018","type":"DOSSIER SCOLAIRE","duree":"DURÉE 1 H 25","format":"SPECTACLE IN SITU","public":"À PARTIR DE LA SECONDE","cession":{"formule":["6 classes : 2 représentations","6 ateliers de 1h (1/cl)"]},"fiche":[["Mise en scène et adaptation :","Angelo Jossec"],["Musique live et régie :","William Langlois"],["Création lumières :","Jérôme Hardouin"],["Création costumes :","Jane Avezou"],["Distribution :","Angelo Jossec, Manon Rivier, Lauren Toulin et Adrien Vada"]],"production":["Production : Compagnie Crescite","Coproduction : l’Archipel - Granville","Avec les aides à la création 2018 de la DRAC et de la Région Normandie et du Département de Seine-Maritime, et en 2021 de la DRAC Normandie dans le cadre du plan de relance / mesure 5 du plan théâtre"],"partenaires":"Le Théâtre des Crescite est conventionné par la Ville de Rouen et est soutenu par la DRAC et la Région Normandie, le Département de Seine-Maritime et l'ODIA Normandie","pourquoi":{"titre":"Pourquoi étudier Bérénice au lycée ?","sections":[{"titre":"Une poésie à hauteur de jeunes adultes : l’amour face au devoir","texte":"Étudier Bérénice dès la seconde, c'est explorer un triangle amoureux où la passion se heurte au devoir, à la morale et aux lois de la cité. Jean Racine y élève la douleur d’une séparation au rang de la <strong>tragédie<\/strong> et crée <strong>l’un des plus beaux poèmes sur les tensions de la relation amoureuse de la littérature française<\/strong>. Ces tensions deviennent directement sensibles, et peuvent offrir aux élèves des mots et de la nuance pour appréhender leurs propres passions et vivre leurs sentiments face aux pressions sociales, morales ou culturelles."},{"titre":"Faire vivre l'alexandrin","texte":"Loin d'être une langue figée, l'alexandrin racinien est pour la compagnie un idiome de théâtre fluide et <strong>profondément vivant<\/strong>. Présenté au centre d'une arène circulaire au plus près des spectateurs, plongés dans une ambiance sonore et musicale, l<strong>e dispositif est immersif et brise la distance des salles traditionnelles<\/strong>. Porté par l’expérience du vers des comédiens et l’accompagnement musical live, l'alexandrin retrouve toute son oralité et devient <strong>une expérience émotionnelle directe<\/strong> pour les élèves."},{"titre":"Transmettre un héritage vivant, une priorité pour la compagnie","texte":"Dans l'esprit du service public cher à Jean Vilar, transmettre les grands classiques s'inscrit dans une démarche citoyenne de démocratisation culturelle. <strong>En offrant un travail exigeant tout en créant un spectacle volontairement accessible<\/strong>, le Théâtre des Crescite cherche à dépasser les a priori sur le théâtre et à transmettre ce patrimoine universel sans imposer de pensée unique."}]},"programmes":{"titre":"La place du spectacle dans les programmes scolaires","niveaux":[{"niveau":"2nde","lignes":[{"matiere":"Français","intitule":"Le théâtre du XVIIᵉ siècle au XXIᵉ siècle, texte et représentation","objectif":"Étudier la tragédie classique, l'alexandrin et la mise en scène"},{"matiere":"Histoire","intitule":"la Méditerranée antique : empreintes romaines","objectif":"Replacer l'intrigue dans la Rome antique de l'an 79, interroger la mise en scène du pouvoir et sa représentation au XVIIᵉ siècle"},{"matiere":"EMC","intitule":"Droit, liberté et responsablité","objectif":"Interroger le choix des personnages qui sacrifient leur passion personnelle au profit du droit de la communauté"},{"matiere":"LCA","intitule":"Différences de cultures, différences de conditions : Grecs, Romains et barbares ; hommes libres et esclaves.","objectif":"Analyser le statut politique des souverains et des étrangers de l'empire romain."}]},{"niveau":"1ère","lignes":[{"matiere":"Français","intitule":"Le théâtre du XVIIe siècle au XXIe siècle","objectif":"Approfondir l'analyse d'un chef-d'œuvre du répertoire classique et de sa poésie tragique."},{"matiere":"HLP","intitule":"les pouvoirs de la parole, les métamorphoses du moi","objectif":"Étudier la rhétorique passionnelle et l'épreuve des sentiments face aux obstacles extérieures (sociaux, moraux, religieux)."}]},{"niveau":"Tale","lignes":[{"matiere":"Philosophie","intitule":"le devoir et la morale, la liberté et la passion, l'État et la politique, l'art","objectif":"Mettre en perspective les dilemmes éthiques, le sacrifice civique et la fonction cathartique de l'art."},{"matiere":"HLP","intitule":"la recherche de soi, l'humanité en question","objectif":"L'expérience de la solitude décisionnelle, la transmission des textes classiques pour aborder ce qu'il y a d'universel dans la condition humaine."}]}]},"synopsis":{"titre":"Synopsis","chapeau":"Rome, an 79. Huit jours après la mort soudaine de l'empereur Vespasien, le destin de Bérénice, Titus et Antiochus bascule.","paragraphes":["Titus et Antiochus sont compagnons de guerre et amis. Tous deux aiment Bérénice mais Bérénice n’aime que Titus. Il s’agit d’un triangle amoureux classique pris dans les enjeux politiques de la cité romaine : Titus est le fils de l’empereur de Rome, Vespasien, Bérénice est reine de Palestine, et Antiochus, leur ami, est roi de Comagène...","Jusqu'ici, les amants fermaient les yeux sur le couperet qui les menaçait : la loi romaine interdit formellement à un empereur d'épouser une reine étrangère. Il s’agit de deux systèmes politiques distincts. À la mort soudaine de l'empereur Vespasien, l'illusion vole en éclats. Titus doit affronter son devoir et se résoudre à répudier Bérénice, qui refuse d'abord d'y croire. De son côté, Antiochus oscille entre loyauté et secret espoir.","En une seule demi-journée, l’action se précipite vers le destin de nos trois personnages : au lieu de succomber au désespoir, ils sacrifieront leur bonheur individuel au bien commun, élevant leur renoncement tragique en “exemple à l'univers”."]},"adaptation":{"titre":"Une adaptation resserrée","paragraphes":["Pour maintenir une tension dramatique constante et placer l'émotion au cœur de la représentation, la compagnie a fait le choix d’adapter le texte de 1506 alexandrins dans une version resserrée et dynamisée.","En élaguant les tirades explicatives et les récits de faits passés, <strong>le travail de réécriture conserve le cœur battant de la pièce avec une grande fidélité<\/strong> : les dilemmes personnels, les confrontations directes, le choc des vérités, et l'intensité des échanges passionnés.","Les trois confidents originaux sont par exemple fusionnés en un seul personnage. Celui-ci crée un contact direct avec le public et l’accompagne dans la fiction. Entre autres, il lui rappelle en début de spectacle les éléments essentiels de la situation initiale.","<strong>D'une durée de 1 h 25, le spectacle ne perd rien de l'intrigue originelle ni de sa clarté narrative.<\/strong> Au contraire. Ce rythme resserré insuffle à la tragédie une urgence moderne où chaque seconde compte et où le spectateur se concentre sur les enjeux de chaque personnage."]},"espace":{"titre":"Un espace scénique immersif","paragraphes":["La scène est une arène. Un espace <strong>circulaire de 5 mètres de diamètre<\/strong> fermé par les spectateurs.","Les seuls éléments de décor sont un polygone, trônant au centre, surmonté d’un revolver. Un tapis blanc délimite l’espace scénique au sol.","Le jeu des acteurs est appuyé par un éclairage à LED qui évolue avec la narration de <strong>manière imperceptible<\/strong>. C'est un soutien à l’action qui se déroule et apporte le ’’sfumato’’ qui nous accompagne dans l’irréel, le poème.","Ceci est enfin appuyé par un travail sur le <strong>son et la musique en live<\/strong>, omniprésents, tantôt discrets, tantôt furieux, accompagnant les émotions intérieures des personnages, leurs passions, et la musicalité de leurs vers."]},"alexandrin":{"titre":"Le traitement de l’alexandrin classique","paragraphes":["Avec Bérénice, un des objectifs fondamentaux du Théâtre des Crescite est d'offrir <strong>la pureté, la clarté mais également l’intensité émotionelle de la langue racinienne<\/strong> en la défaisant de toute lourdeur académique. L'alexandrin classique, souvent perçu comme une langue corsetée ou désuète, se révèle ici dans toute son évidence théâtrale : un dialecte vivant, fluide et organique.","Travaillé par la compagnie avec rigueur et précision sur la base du traité <em>Dire le vers,<\/em> de Jean-Claude Milner et François Regnault, le vers devient <strong>une parole orale.<\/strong> Cette méthode habitue graduellement l’oreille en résolvant certaines contradictions entre la langue parlée contemporaine et le respect des règles de prosodie classiques.","Une matière sonore vibrant entre le dialogue parlé et le slam. Il ne s'agit pas de déclamer un texte poétique, mais d'<strong>incarner une langue de théâtre taillée pour le jeu et l'émotion,<\/strong> imposée à la virgule près par la métrique virtuose de l’alexandrin racinien.","Petit à petit, l’oreille du spectateur – même non averti – arrive à oublier que cette langue a pu lui paraître étrangère."]},"consignes":{"titre":"Consignes de préparation au spectacle","note":"NOTE IMPORTANTE","intro":"Afin de préserver la surprise de l’intrigue et de laisser les élèves découvrir les rebondissements du récit, nous choisissons de nous charger de la phase de préparation au spectacle. Nous demandons de veiller à :","demandes":["DEMANDER AUX ÉLÈVES DE NE PAS LIRE LE TEXTE DE BÉRÉNICE","NE PAS LES PRÉPARER AU TEXTE","NE SURTOUT PAS DÉVOILER L’ABSENCE DE MORT DANS LA PIÈCE"],"apres":"Si un travail approfondi sur la pièce est envisagé, il est préférable de l’effectuer <strong>après les représentations.<\/strong> Les seuls axes de préparation peuvent être les suivants :","axes":["Clarification de l’intrigue qui <strong>précède<\/strong> le commencement de la pièce : la situation initiale, le triangle amoureux, les fonctions de chaque personnage, la situation géopologique...","Introduction aux règles de la tragédie classique, les trois unités, la nécessité d’une mort...","Révision de ce qu’est un alexandrin classique"],"atelier":"Nous demandons dans tous les cas à ce que <strong>chaque classe effectue un atelier d’une heure de préparation au spectacle<\/strong> avec un intervenant de la compagnie."},"ateliers":{"titre":"Ateliers","liste":[{"titre":"Atelier de préparation (obligatoire) - 1h","paragraphes":["Le but de la première heure d'atelier est avant tout de susciter l'envie, la curiosité, et de donner les quelques clés indispensables à une expérience de spectateur sereine et intéressée.","L'accent est mis sur le fait de briser le carcan magistral. En instaurant une dynamique familière et participative."],"etapes":[{"titre":"Étape 1 : <strong>clarifier l'intrigue (20 min)<\/strong>","texte":"En s'appuyant sur des schémas au tableau et sur les références culturelles des élèves (Game of Thrones, Gladiator, Rome...), l'atelier reconstruit l'histoire survenue cinq ans avant le début de la pièce : la situation géopolitique, le triangle amoureux, la loi romaine vis à vis des reines étrangères, le devoir de Titus, analogie avec des dilemmes moraux contemporains (religion, familles...), le concept de la \"friendzone\" en identifiant Antiochus..."},{"titre":"Étape 2 : <strong>l'alexandrin classique, de la culture pop à Racine (40 min<\/strong>)","texte":"Pour faire comprendre la mécanique de l'alexandrin, l'atelier part d'une pratique d'écoute quotidienne : le Rap, les publicités, les dictons. En s'appuyant sur des vers sélectionnés, les élèves sont invité à faire émerger intuitivement les règles classiques (les 12 syllabes, le rôle du « e » muet, l'emplacement de la césure et la structure en deux hémistiches...). Puis les vers basculent sans transition au vers raciniens possédant l'ultime rigueur métrique. Ces vers sont l'occasion de mises en voix collectives."}]},{"titre":"Atelier d'écriture d'alexandrins - 1h","paragraphes":["Placés dans la posture du dramaturge, les élèves s'essaient à la rédaction de distiques ou de quatrains en alexandrins."],"points":["Thématiques d'écriture : choix parmi des sujets à forte charge émotionnelle (déclarer un amour caché, annoncer une séparation, exprimer l'angoisse d'une nuit blanche, faire une mise en garde).","Manipulation des contraintes : utilisation guidée des outils de prosodie (alternance des rimes féminines et masculines, respect de la césure, élisions).","Partage et mise en voix : Lecture sur volontariat à voix haute des écrits."]},{"titre":"Atelier d'initiation au jeu - 1h","paragraphes":["Avec cette heure de pratique sur le plateau, accompagnés de bandes sons sélectionnées, les élèves expérimentent par le corps les enjeux de la tragédie.","Après des exercices d'échauffement/de préparation à l'exposition au regard des autres, les élèves peuvent être invités à parcourir par exemple :"],"points":["des démarches et postures royales : déambulations dans l'espace en explorant différents états physiques (la noblesse du port d'épée, le doute décisionnel, l'urgence amoureuse, la gravité d'un secret).","la création de tableaux vivants collectifs : création de poses de groupe immortalisant des situations de pouvoir ou de tension (un couronnement, une foule hostile, un conseil de guerre).","un exercice individuel d'incarnation : l'épreuve du trône"]},{"titre":"Atelier de sensibilisation à la création - 1h","paragraphes":["En lien avec un intervenant de l'équipe de création du spectacle, les élèves sont amenés à échanger de manière informelle sur le travail de recherche que demande une mise en scène.","<strong>Il est possible d'effectuer cette atelier à la place de l'atelier de préparation obligatoire. Dans ce cas l'intervenant fera une clarification accélérée de l'intrigue qui précède Bérénice et des règles de l'alexandrin pour préparer les élèves au spectacle en 20min avant de se concentrer sur le processus de création.<\/strong>","Exemples de thèmes abordés :"],"points":["les différents postes techniques et artistiques au théâtre. Analogies avec les autres arts collectifs tels que le cinéma, le jeu vidéo, la musique...","l'historique d'une production théâtrale","le rôle du costume, ce qu'il raconte, sa conception. Analogies avec les styles vestimentaires contemporains."]}]},"accueil":{"titre":"Conditions d’accueil","fiche":"Fiche technique","blocs":[{"titre":null,"lignes":["Effectifs de l’équipe (repas et hébergement) : <strong>5 personnes<\/strong>","Durée : <strong>1h25<\/strong>","Jauge par représentation : <strong>100 à 120 places<\/strong>"]},{"titre":"PLANNING DE MONTAGE ET PERSONNEL :","lignes":["Durée : <strong>6 heures de montage<\/strong>, effectué par la compagnie","<strong>Présence d’un régisseur général d’accueil souhaitée<\/strong>"]},{"titre":"PLATEAU :","lignes":["Aire de jeu (gradins compris) : <strong>idéale 15 m x 15 m / minimum 11 m x 11 m<\/strong>","Hauteur sous plafond minimale : <strong>3 m<\/strong>","<strong>Nécessité de pouvoir occulter la pièce pour la placer dans le noir<\/strong>","Les spectateurs seront placés sur les gradins en cercle qui fermeront l’espace de jeu"]},{"titre":"MATÉRIEL À FOURNIR PAR L'ORGANISATEUR :","lignes":["5 chaises pour l’équipe","1 échelle en parisienne montant à hauteur de plafond","1 aspirateur, 1 balai, 1 pelle et 1 serpillère","3 sources d’alimentation 16A différentes pour la régie, le son, la lumière"]},{"titre":"COMPOSITION DU DÉCOR AMENÉ PAR LA COMPAGNIE :","lignes":["3 gradins (traverses de 2 m, placés de manière à former un cercle de 6 m de diamètre)","3 pieds d’une hauteur allant jusqu’à 4m et 3 PAR LED","3 pieds d’enceintes supportant chacun deux enceintes, placés derrière les pieds de lumières","3 tissus (de 3,50m de haut et de 2m de large)","1 sol recouvert de moquette blanche en forme de rond","1 élément central d’une hauteur de 60 cm","1 table de 2m de long x 70cm de large pour la musique/régie lumière"]}],"alerte":"<strong>Un coup de feu à blanc est tiré pendant la pièce,<\/strong> à une heure environ du début du spectacle.","photos":"Photos de l’implantation dans différents établissements scolaires"}}},"dates":[{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"12 novembre 2026 — Eu (76)","ligneDate":"12 novembre 2026","ligneLieu":"Eu (76)","details":[{"texte":"2 représentations au Collège Louis Philippe","lien":null}],"lien":null,"iso":"2026-11-12","fin":"2026-11-12","precision":"day","scolaire":true,"commune":"Eu","dep":"76","xy":[344.2,130.9],"l":5},{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"16 novembre 2026 — Saint-Valéry-en-Caux (76)","ligneDate":"16 novembre 2026","ligneLieu":"Saint-Valéry-en-Caux (76)","details":[{"texte":"2 représentations scolaires au Collège Jehan Le Povremoyne","lien":null}],"lien":null,"iso":"2026-11-16","fin":"2026-11-16","precision":"day","scolaire":true,"commune":"Saint-Valery-en-Caux","dep":"76","xy":[309.8,143.6],"l":6},{"slug":"ci-gisait-cyrano","titre":"Ci-gisait Cyrano","ligne":"19 et 20 novembre 2026 — Eu (76)","ligneDate":"19 et 20 novembre 2026","ligneLieu":"Eu (76)","details":[{"texte":"3 représentations au Théâtre des Charmes","lien" <script>
/* L'agenda de la compagnie, commun aux maquettes (donnees.js) et à l'administration : composer, à partir d'une date
   de la base et de ses représentations, la ligne d'agenda et ses précisions, dans le style du site d'origine.

   AGENDA.ligne(date, reps, lieu)        « 18 décembre 2026 — Pont-Audemer (27) » (ou date.intitule s'il est écrit)
   AGENDA.quand(date, jours)             « 19 et 20 novembre 2026 », « du 12 au 20 février 2027 », « mars 2027 »
   AGENDA.precisions(date, reps, lieu)   [{texte, lien}] : date.details, ou « 14h et 20h : représentations au Forum »
   AGENDA.chez(nom)                      « au Théâtre des Charmes », « à L’Eclat », « à la Ferme de Bel Ebat »
   AGENDA.saisonDe('2026-10-12')         « 2026-2027 » ; AGENDA.heureTexte('20:30') « 20h30 » ; AGENDA.iso(new Date())
   date = {debut, fin, precision: 'jour'|'periode'|'mois'|'saison', intitule, details, lien, nb_representations}
   reps = [{jour, heure, public, annulee}], lieu = {nom, commune, departement} */
const AGENDA = (() => {
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const saisonDe = j => { const a = +j.slice(0, 4), m = +j.slice(5, 7); return m >= 9 ? `${a}-${a + 1}` : `${a - 1}-${a}`; };
  const jourTexte = j => { const n = +j.slice(8, 10); return n === 1 ? '1er' : String(n); };
  const heureTexte = h => { if (!h) return ''; const [hh, mm] = h.split(':'); return `${+hh}h${mm !== '00' ? mm : ''}`; };
  const liste = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} et ${xs[xs.length - 1]}`;
  // « 18 décembre 2026 », « 19 et 20 novembre 2026 », « du 12 au 20 février 2027 », « mars 2027 »
  function quand(date, jours) {
    if (date.precision === 'mois') return `${MOIS[+date.debut.slice(5, 7) - 1]} ${date.debut.slice(0, 4)}`;
    if (date.precision === 'periode' || !jours.length) {
      const a = date.debut, b = date.fin || date.debut;
      if (a === b) return `${jourTexte(a)} ${MOIS[+a.slice(5, 7) - 1]} ${a.slice(0, 4)}`;
      const memeAn = a.slice(0, 4) === b.slice(0, 4), memeMois = memeAn && a.slice(5, 7) === b.slice(5, 7);
      return `du ${jourTexte(a)}${memeMois ? '' : ` ${MOIS[+a.slice(5, 7) - 1]}${memeAn ? '' : ` ${a.slice(0, 4)}`}`} au ${jourTexte(b)} ${MOIS[+b.slice(5, 7) - 1]} ${b.slice(0, 4)}`;
    }
    const js = [...new Set(jours)].sort();
    const suivis = js.length >= 3 && js.every((j, i) => !i || (Date.parse(j) - Date.parse(js[i - 1])) === 864e5);
    if (suivis) return quand({ precision: 'periode', debut: js[0], fin: js[js.length - 1] }, []);
    // les jours, groupés par mois : « 30 janvier et 2 février 2027 »
    const groupes = [];
    js.forEach(j => { const k = j.slice(0, 7), g = groupes[groupes.length - 1]; if (g && g.k === k) g.j.push(j); else groupes.push({ k, j: [j] }); });
    const an = js[js.length - 1].slice(0, 4), memeAn = js[0].slice(0, 4) === an;
    const morceaux = groupes.map((g, i) => {
      const fin = i === groupes.length - 1;
      return `${liste(g.j.map(jourTexte))} ${MOIS[+g.k.slice(5, 7) - 1]}${!fin && !memeAn ? ` ${g.k.slice(0, 4)}` : ''}`;
    });
    return `${groupes.length > 1 ? liste(morceaux) : morceaux[0]} ${an}`;
  }
  const ou = lieu => lieu ? `${lieu.commune} (${lieu.departement})` : '';
  function ligne(date, reps = [], lieu = null) {
    if (date.intitule) return date.intitule;
    const q = quand(date, reps.map(r => r.jour));
    return lieu ? `${q} — ${ou(lieu)}` : q;
  }
  // « au Théâtre des Charmes », « à L’Eclat », « à la Ferme de Bel Ebat », « à l’Espace culturel »
  function chez(nom) {
    const n = (nom || '').trim();
    if (!n) return '';
    if (/^le\s/i.test(n)) return `au ${n.slice(3)}`;
    if (/^les\s/i.test(n)) return `aux ${n.slice(4)}`;
    if (/^(la\s|l[’'])/i.test(n)) return `à ${n}`;
    if (/^(théâtre|collège|lycée|centre|forum|relais|point|château|conservatoire|musée|cinéma|foyer|festival|domaine|cloître|palais|parc|quai|carré|siroco|sillon|moulin)\b/i.test(n)) return `au ${n}`;
    if (/^(salle|maison|ferme|scène|médiathèque|halle|chapelle|cité|grange|mairie|ville|communauté|chartreuse|comédie|commanderie|abbaye)\b/i.test(n)) return `à la ${n}`;
    if (/^[aeéèêiîoôuy]/i.test(n)) return `à l’${n}`;
    return `à ${n}`;
  }
  // les précisions sous la ligne, quand l'administration n'en a pas écrit : « 14h et 20h : représentations au Forum »
  function precisions(date, reps, lieu) {
    if (date.details && date.details.length) return date.details;
    const vivantes = reps.filter(r => !r.annulee);
    if (!vivantes.length && !lieu?.nom) return [];
    const avecHeure = vivantes.filter(r => r.heure);
    const jours = [...new Set(vivantes.map(r => r.jour))];
    let heures = '';
    if (avecHeure.length) {
      heures = jours.length === 1 ? liste(avecHeure.map(r => heureTexte(r.heure)))
        : liste(jours.map(j => { const h = avecHeure.filter(r => r.jour === j).map(r => heureTexte(r.heure)); return h.length ? `${jourTexte(j)} ${MOIS[+j.slice(5, 7) - 1]} à ${liste(h)}` : null; }).filter(Boolean));
    }
    const n = vivantes.length || date.nb_representations || 0;
    const scol = vivantes.length && vivantes.every(r => r.public === 'scolaire');
    const mot = `représentation${n > 1 ? 's' : ''}${scol ? ` scolaire${n > 1 ? 's' : ''}` : ''}`;
    const texte = heures ? `${heures} : ${mot} ${chez(lieu?.nom)}`.trim() : `${n > 1 ? `${n} ` : ''}${mot} ${chez(lieu?.nom)}`.trim();
    return [{ texte, lien: date.lien || null }];
  }

  return { MOIS, iso, saisonDe, jourTexte, heureTexte, liste, quand, ou, ligne, chez, precisions };
})();
</script>
<script>
/* Les données vivantes, communes aux maquettes (build.py l'ajoute après les données D, avant la carte).
   D est d'abord l'instantané du dépôt, pour un premier affichage immédiat ; quand la base de la compagnie répond, D est
   remplacé EN PLACE par son contenu (mêmes objets de premier niveau : D.site, D.shows, D.dates, D.saisons, D.carte…),
   puis de nouveau à chaque enregistrement fait dans l'administration (temps réel).

   DONNEES.surChangement(fn)   fn() est appelée après chaque mise à jour de D : refais la vue courante en place, sans
                               remonter en haut, sans voler le focus, sans rejouer l'ouverture ni les animations d'entrée.
                               Le rendu de chaque vue relit donc D à chaque fois (aucune copie figée au chargement).
   DONNEES.etat                'instantane' (données du dépôt), 'base' (à jour avec la base) ou 'hors-ligne'.
   DONNEES.recharger({force})  relit la base ; DONNEES.suspendre(oui) met les nouvelles en attente (édition en cours).

   Les lignes d'agenda se composent avec AGENDA (agenda.js), comme dans l'administration.
   La base : le projet Supabase de la compagnie (tables crescite_, lecture publique de ce qui est publié). Adresse
   ?base=0 : rester sur l'instantané (tests, hors connexion). */
const DONNEES = (() => {
  const BASE = 'https://omekkqjinvppadsoinvj.supabase.co';
  const CLE = 'sb_publishable_TODW6NdmDly8eR9UxjG-6g_eyAa4gjB';
  const TABLES = ['crescite_spectacles', 'crescite_lieux', 'crescite_dates', 'crescite_representations', 'crescite_ateliers', 'crescite_textes',
                  'crescite_personnes', 'crescite_distributions'];
  const abonnes = [];
  const moi = { etat: 'instantane' };
  let actif = true;
  try { actif = new URLSearchParams(location.search).get('base') !== '0' && typeof fetch === 'function' && !window.CRESCITE_SANS_BASE; } catch { actif = false; }

  // ce qui ne vient pas de la base : la navigation, le fond de carte, les photos du dépôt, les positions des communes connues
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, "'").toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const cleCommune = (c, dep) => `${norm(c)}|${dep}`;
  const S = {
    site: { titreSuffixe: D.site.titreSuffixe, accueil: D.site.accueil, entrees: D.site.entrees, menu: D.site.menu,
            redirections: D.site.redirections, libelles: D.site.libelles },
    carte: { viewBox: D.carte.viewBox, contour: D.carte.contour, belgique: D.carte.belgique, luxembourg: D.carte.luxembourg,
             rouen: D.carte.rouen, projection: D.carte.projection },
    xy: new Map(D.carte.lieux.map(l => [cleCommune(l.c, l.dep), l.xy])),
    photos: Object.assign({}, D.photos),
    // l'équipe de l'instantané : gardée tant que la base n'a pas encore ses tables d'équipe
    personnes: D.personnes || {}, equipes: Object.fromEntries((D.shows || []).map(s => [s.slug, s.equipe || []])),
  };

  // ------------------------------------------------------------------------------------------- outils
  const { MOIS, iso, saisonDe, jourTexte, heureTexte, liste, quand, ligne, chez, precisions } = AGENDA;
  const lum = hex => { const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; return 0.2126 * f(parseInt(hex.slice(1, 3), 16)) + 0.7152 * f(parseInt(hex.slice(3, 5), 16)) + 0.0722 * f(parseInt(hex.slice(5, 7), 16)); };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  function pourFondClair(hex, fond = '#ffffff', cible = 4.6) {       // comme for_light dans build.py
    if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return hex;
    let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), c = hex;
    while (contraste(c, fond) < cible && r + g + b > 0) { r = Math.floor(r * 0.92); g = Math.floor(g * 0.92); b = Math.floor(b * 0.92); c = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''); }
    return c;
  }
  // la projection de la carte (conique conforme de Lambert recalée, comme projection() dans build.py)
  function projeter(lon, lat) {
    const P = S.carte.projection;
    if (!P || lon == null || lat == null) return null;
    const rad = Math.PI / 180, f1 = 44 * rad, f2 = 49 * rad, f0 = 46.5 * rad;
    const n = Math.log(Math.cos(f1) / Math.cos(f2)) / Math.log(Math.tan(Math.PI / 4 + f2 / 2) / Math.tan(Math.PI / 4 + f1 / 2));
    const F = Math.cos(f1) * Math.tan(Math.PI / 4 + f1 / 2) ** n / n, rho = f => F / Math.tan(Math.PI / 4 + f / 2) ** n;
    const r = rho(lat * rad), th = n * (lon - 3) * rad, u = r * Math.sin(th), v = rho(f0) - r * Math.cos(th);
    const arr = x => Math.round(x * 10) / 10;
    return [arr(P.cx[0] * u + P.cx[1] * v + P.cx[2]), arr(P.cy[0] * u + P.cy[1] * v + P.cy[2])];
  }
  const photo = fichier => {
    if (!fichier) return null;
    const cle = fichier.replace(/\.[a-z0-9]+$/i, '');
    return S.photos[cle] || `${BASE}/storage/v1/object/public/crescite/${fichier.split('/').map(encodeURIComponent).join('/')}`;
  };

  // ------------------------------------------------------------------------------------------- lire la base
  async function lireTable(table, select, ordre, signal) {
    const out = [];
    for (let debut = 0; ; debut += 1000) {                 // l'API rend 1 000 lignes au plus par appel
      const r = await fetch(`${BASE}/rest/v1/${table}?select=${select}${ordre ? `&order=${ordre}` : ''}&limit=1000&offset=${debut}`,
        { headers: { apikey: CLE, Accept: 'application/json' }, signal, cache: 'no-store' });
      if (!r.ok) throw new Error(`${table} : ${r.status}`);
      const lot = await r.json();
      out.push(...lot);
      if (lot.length < 1000) return out;
    }
  }
  async function lire() {
    const ctl = new AbortController(), minuteur = setTimeout(() => ctl.abort(), 20000);
    try {
      const [sp, li, da, re, at, tx] = await Promise.all([
        lireTable('crescite_spectacles', '*', 'ordre.asc,id.asc', ctl.signal),
        lireTable('crescite_lieux', 'id,nom,type,commune,departement,pays,latitude,longitude,site_web', 'id.asc', ctl.signal),
        lireTable('crescite_dates', 'id,spectacle_id,lieu_id,debut,fin,precision,saison,public,statut,intitule,details,lien,nb_representations', 'debut.asc,id.asc', ctl.signal),
        lireTable('crescite_representations', 'id,date_id,jour,heure,public,annulee,lien,note', 'jour.asc,heure.asc.nullslast,id.asc', ctl.signal),
        lireTable('crescite_ateliers', '*', 'ordre.asc,id.asc', ctl.signal),
        lireTable('crescite_textes', 'cle,valeur', null, ctl.signal),
      ]);
      // l'équipe : facultative (une base sans ses tables d'équipe garde celle de l'instantané)
      let pe, di, dc;
      try {             // les documents publics : facultatifs aussi (une base qui ne les a pas encore garde ceux de l'instantané)
        dc = await lireTable('crescite_documents', 'spectacle_id,type,titre,fichier,url,pour,ordre&pour=in.(pros,scolaires)', 'ordre.asc,id.asc', ctl.signal);
      } catch { dc = undefined; }
      try {
        [pe, di] = await Promise.all([
          lireTable('crescite_personnes', 'id,slug,prenom,nom,metiers,photo,photo_credit,photo_publique,ordre', 'ordre.asc,id.asc', ctl.signal),
          lireTable('crescite_distributions', 'spectacle_id,personne_id,categorie,fonction,role,alternance,ordre', 'ordre.asc,id.asc', ctl.signal)]);
      } catch { pe = di = undefined; }
      return { sp, li, da, re, at, tx, pe, di, dc };
    } finally { clearTimeout(minuteur); }
  }

  // ------------------------------------------------------------------------------------------- composer D
  function composer({ sp, li, da, re, at, tx, pe, di, dc }) {
    const aujourdhui = iso(new Date()), saison = saisonDe(aujourdhui);
    const texte = Object.fromEntries(tx.map(t => [t.cle, t.valeur]));
    const spId = new Map(sp.map(s => [s.id, s])), lieuId = new Map(li.map(l => [l.id, l]));
    const repsDe = new Map();
    re.forEach(r => { if (!repsDe.has(r.date_id)) repsDe.set(r.date_id, []); repsDe.get(r.date_id).push({ ...r, heure: r.heure ? r.heure.slice(0, 5) : null }); });
    const pages = sp.filter(s => s.page && s.publie);
    const slugDe = s => (s && s.page ? s.slug : null);
    const ordre = new Map(sp.map((s, i) => [s.id, i]));

    // les communes de la carte : une par commune et département, à la place des communes du dépôt quand on les connaît
    const lieux = [], index = new Map();
    const communeDe = l => {
      if (!l) return null;
      const k = cleCommune(l.commune, l.departement);
      if (!index.has(k)) {
        const xy = S.xy.get(k) || projeter(l.longitude, l.latitude);
        if (!xy) { index.set(k, null); return null; }
        index.set(k, lieux.length);
        lieux.push({ c: l.commune, dep: l.departement, xy });
      }
      return index.get(k);
    };
    const precisionAncienne = { jour: 'day', periode: 'range', mois: 'month', saison: 'range' };
    const etatDe = d => d.statut === 'annulee' ? 'date annulée' : d.statut === 'reportee' ? 'date reportée' : null;
    const lignes = da.filter(d => spId.has(d.spectacle_id)).map(d => {
      const s = spId.get(d.spectacle_id), lieu = lieuId.get(d.lieu_id) || null, reps = repsDe.get(d.id) || [];
      const l = communeDe(lieu), txt = ligne(d, reps, lieu), [ligneDate, ligneLieu = ''] = txt.split(' — ');
      return {
        d, s, lieu, reps, l, ligne: txt, ligneDate: ligneDate.trim(), ligneLieu: ligneLieu.trim(),
        details: precisions(d, reps, lieu), etat: etatDe(d), iso: d.debut, fin: d.fin || d.debut,
        precision: precisionAncienne[d.precision] || 'day', scolaire: d.public === 'scolaire',
        representations: reps.map(r => ({ jour: r.jour, heure: r.heure, public: r.public, annulee: r.annulee, lien: r.lien, note: r.note })),
      };
    });

    // les dates à venir, et les saisons
    const aVenir = lignes.filter(x => x.fin >= aujourdhui).sort((a, b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : ordre.get(a.s.id) - ordre.get(b.s.id));
    const dates = aVenir.map(x => ({
      id: x.d.id, slug: slugDe(x.s), titre: x.s.titre, ligne: x.ligne, ligneDate: x.ligneDate, ligneLieu: x.ligneLieu,
      details: x.details, lien: x.d.lien, iso: x.iso, fin: x.fin, precision: x.precision, scolaire: x.scolaire, etat: x.etat,
      commune: x.l != null ? lieux[x.l].c : null, dep: x.l != null ? lieux[x.l].dep : null, xy: x.l != null ? lieux[x.l].xy : null,
      l: x.l, representations: x.representations,
    }));
    const cles = [...new Set([saison, ...lignes.map(x => x.d.saison)])].sort().reverse();
    const saisons = {};
    cles.forEach(k => { saisons[k] = { titre: `Saison ${k}`, spectacles: [] }; });
    [...lignes].sort((a, b) => ordre.get(a.s.id) - ordre.get(b.s.id) || (a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : a.d.id - b.d.id)).forEach(x => {
      const S2 = saisons[x.d.saison];
      let g = S2.spectacles.find(y => y._id === x.s.id);
      if (!g) { g = { _id: x.s.id, titre: x.s.titre, sousTitre: x.s.sous_titre, creation: x.s.creation, slug: slugDe(x.s), dates: [] }; S2.spectacles.push(g); }
      g.dates.push({ id: x.d.id, ligne: x.ligne, details: x.details, etat: x.etat, lien: x.d.lien, iso: x.iso, fin: x.fin,
                     precision: x.precision, scolaire: x.scolaire, l: x.l, representations: x.representations });
    });
    Object.values(saisons).forEach(S2 => S2.spectacles.forEach(g => delete g._id));

    // les spectacles, dans le format des maquettes
    const photos = Object.assign({}, S.photos);
    // l'équipe : les fiches publiées (la photo seulement si sa publication est accordée) et la distribution de chaque spectacle
    const avecEquipe = Array.isArray(pe) && Array.isArray(di);
    const personnes = avecEquipe ? Object.fromEntries(pe.map(p => [p.slug, { prenom: p.prenom, nom: p.nom, metiers: p.metiers || [],
      photo: p.photo_publique && p.photo ? photo(p.photo) : null, credit: p.photo_publique && p.photo ? p.photo_credit || null : null }])) : S.personnes;
    const slugPersonne = new Map((pe || []).map(p => [p.id, p.slug]));
    const equipeDe = s => (avecEquipe
      ? di.filter(x => x.spectacle_id === s.id && slugPersonne.has(x.personne_id)).map(x => ({ personne: slugPersonne.get(x.personne_id),
          categorie: x.categorie, fonction: x.fonction || '', role: x.role || null, alternance: x.alternance || null }))
      : S.equipes[s.slug] || []);
    const shows = pages.map(s => {
      const u = s.univers || {}, c = u.couleurs || {};
      const mine = dates.filter(d => d.slug === s.slug);
      if (s.photo) photos[s.slug] = photo(s.photo);
      const ph = (s.photos || []).map(p => { const cle = (p.fichier || '').replace(/\.[a-z0-9]+$/i, ''); photos[cle] = photo(p.fichier); return { ...p, cle }; });
      return {
        slug: s.slug, titre: s.titre, titreLignes: s.titre_lignes || [s.titre], creation: s.creation,
        annee: +((s.creation || '').match(/\d{4}/) || [0])[0], fiche: s.fiche || [], texte: s.texte || [], enTournee: !!s.en_tournee,
        prochaine: mine[0] || null, nbDates: mine.length,
        couleur: c.scene, couleurTexteClair: pourFondClair(c.scene), fondSombre: u.clair ? '#1a1016' : c.fond,
        palette: c, clair: !!u.clair, motif: u.motif, focale: 50, univers: u, lieuTemps: s.lieu_temps, accroche: s.accroche,
        affirmations: s.affirmations || [], citations: s.citations || [], video: s.video, photo: s.photo, photos: ph,
        creditPhotos: s.credit_photos || s.credit, creditDossier: s.credit_dossier,
        // une action culturelle vide ou « masquee » (pas encore construite) n'est pas publiée : null (règle 14 du contrat)
        actionCulturelle: s.action_culturelle && Object.keys(s.action_culturelle).length && !s.action_culturelle.masquee ? s.action_culturelle : null,
        programmer: s.programmer || {},
        dossier: s.dossier ? s.dossier.replace(/^dossier:/, '') : null,
        statut: s.statut, sousTitre: s.sous_titre, avec: s.avec, mentions: s.mentions || [], duree: s.duree,
        production: s.production || [], credit: s.credit, medias: s.medias || [], tournee: s.tournee || {}, source: s.source,
        genre: s.genre, cadre: s.cadre, extraits: s.extraits || [], equipe: equipeDe(s),
      };
    });

    // les ateliers, et les dossiers scolaires qui les reprennent
    const ateliers = at.map(a => ({ id: a.id, slug: slugDe(spId.get(a.spectacle_id)), titre: a.titre, duree: a.duree,
      obligatoire: a.obligatoire, public: a.public, paragraphes: a.paragraphes || [], etapes: a.etapes || [], points: a.points || [] }));
    const dossiers = {};
    Object.entries(texte).filter(([k]) => k.startsWith('dossier:')).forEach(([k, v]) => {
      const cle = k.slice(8), s = sp.find(x => x.dossier === k);
      const liste = at.filter(a => s && a.spectacle_id === s.id).map(a => {
        const x = { titre: a.titre, paragraphes: a.paragraphes || [] };
        if ((a.etapes || []).length) x.etapes = a.etapes;
        if ((a.points || []).length) x.points = a.points;
        return x;
      });
      dossiers[cle] = { ...v, ateliers: { ...(v.ateliers || {}), liste } };
    });

    // la carte
    const compte = ls => { const n = new Map(); ls.forEach(l => { if (l != null) n.set(l, (n.get(l) || 0) + 1); }); return [...n.entries()].sort((a, b) => a[0] - b[0]); };
    const parSaison = {};
    lignes.forEach(x => { (parSaison[x.d.saison] = parSaison[x.d.saison] || []).push(x.l); });
    Object.keys(parSaison).forEach(k => { parSaison[k] = compte(parSaison[k]); });
    const parSpectacle = {};
    pages.forEach(s => {
      parSpectacle[s.slug] = { passe: compte(lignes.filter(x => x.s.id === s.id && x.fin < aujourdhui).map(x => x.l)),
                               aVenir: compte(dates.filter(d => d.slug === s.slug).map(d => d.l)) };
    });
    const carte = { ...S.carte, lieux, parSaison, parSpectacle, aVenir: compte(dates.map(d => d.l)),
                    aVenirPublic: compte(dates.filter(d => !d.scolaire).map(d => d.l)),
                    aVenirScolaire: compte(dates.filter(d => d.scolaire).map(d => d.l)), tout: compte(lignes.map(x => x.l)) };

    // le site : la navigation du dépôt, les textes de la base
    const site = { ...S.site };
    ['nom', 'diaporama', 'donateurs', 'compagnie', 'actions', 'ecole', 'contact', 'coordonnees', 'ecrire', 'facebook',
     'partenaires', 'liensLegaux', 'legal', 'programmation', 'espacePro'].forEach(k => { site[k] = k in texte ? texte[k] : D.site[k]; });
    site.saisons = cles.map(k => ({ saison: k, titre: `Saison ${k}`, menu: k === saison ? `Saison ${k.slice(2, 4)}-${k.slice(7, 9)}` : `Saison ${k}`,
                                    href: k === saison ? '#/agenda' : `#/agenda/${k}` }));
    // les documents publics : un fichier du stockage public (documents/…), ou un lien
    const documents = Array.isArray(dc) ? dc.map(x => ({ spectacle: slugDe(spId.get(x.spectacle_id)) || null, type: x.type, titre: x.titre,
      url: (/^https?:\/\//i.test(x.url || '') ? x.url : null) || (x.fichier ? `${BASE}/storage/v1/object/public/crescite/${x.fichier.split('/').map(encodeURIComponent).join('/')}` : null), pour: x.pour }))
      .filter(x => x.url) : (D.documents || []);
    return { saison, aujourdhui, site, shows, dossiers, ateliers, dates, saisons, carte, photos, personnes, documents };
  }

  // ------------------------------------------------------------------------------------------- appliquer, prévenir
  const empreinte = n => { try { return JSON.stringify(n); } catch { return String(Math.random()); } };
  let derniere = null;
  function appliquer(n) {
    Object.keys(n).forEach(k => {
      const a = D[k], b = n[k];
      if (Array.isArray(a) && Array.isArray(b)) a.splice(0, a.length, ...b);
      else if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
        Object.keys(a).forEach(kk => { if (!(kk in b)) delete a[kk]; });
        Object.assign(a, b);
      } else D[k] = b;
    });
  }
  const prevenir = () => abonnes.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  // pendant une édition en cours (edition.js), les nouvelles de la base attendent : on ne perd rien de ce qui s'écrit
  let suspendu = false, enAttente = null;
  async function recharger({ force = false } = {}) {
    try {
      const n = composer(await lire());
      const e = empreinte(n);
      moi.etat = 'base';
      if (e === derniere && !force) return;
      if (suspendu) { enAttente = { n, e }; return; }
      derniere = e;
      appliquer(n);
      prevenir();
    } catch (err) {
      if (moi.etat !== 'base') moi.etat = 'hors-ligne';
      console.warn('Données de la compagnie indisponibles :', err.message || err);
    }
  }
  let attente = null;
  const bientot = (ms = 250) => { clearTimeout(attente); attente = setTimeout(recharger, ms); };

  // ------------------------------------------------------------------------------------------- temps réel
  // le canal de Supabase, par son client officiel (celui de l'administration, chargé après le premier affichage) :
  // chaque enregistrement dans une table crescite_ publiée relance la lecture
  const CLIENT = 'admin/vendor/supabase.js';
  let connecte = false, version = null;
  const chargerClient = () => window.supabase?.createClient ? Promise.resolve(window.supabase) : new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = CLIENT; s.async = true;
    s.onload = () => (window.supabase?.createClient ? ok(window.supabase) : ko(new Error('client absent')));
    s.onerror = () => ko(new Error('client introuvable'));
    document.head.append(s);
  });
  function ecouter() {
    chargerClient().then(sbjs => {
      const client = sbjs.createClient(BASE, CLE, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      const canal = client.channel('crescite-site');
      TABLES.forEach(table => canal.on('postgres_changes', { event: '*', schema: 'public', table }, () => bientot()));
      canal.subscribe(st => { connecte = st === 'SUBSCRIBED'; });
    }).catch(() => { connecte = false; });
  }
  // secours : si le canal est coupé, la version publiée est relue de temps en temps (et au retour sur l'onglet)
  async function verifier() {
    if (connecte && document.visibilityState === 'visible') return;
    try {
      const r = await fetch(`${BASE}/rest/v1/rpc/crescite_version`, { method: 'POST', headers: { apikey: CLE, 'Content-Type': 'application/json' }, body: '{}', cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (version !== null && v !== version) bientot(0);
      version = v;
    } catch { /* hors connexion : on réessaiera */ }
  }

  if (actif) {
    // la première lecture : si la base ne répond pas (réseau lent, coupure), la page garde l'instantané et réessaie
    let branche = false, essai = 0;
    const brancher = () => { if (branche) return; branche = true; ecouter(); verifier(); setInterval(verifier, 60000); };
    const premiere = () => recharger().then(() => {
      if (moi.etat === 'base') brancher();
      else setTimeout(premiere, [5000, 15000, 45000][essai++] || 120000);
    });
    premiere();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { verifier(); if (!connecte) bientot(0); } });
  }
  moi.surChangement = fn => { if (typeof fn === 'function') abonnes.push(fn); };
  moi.suspendre = oui => {
    suspendu = !!oui;
    if (!suspendu && enAttente) { const { n, e } = enAttente; enAttente = null; derniere = e; appliquer(n); prevenir(); }
  };
  moi.prevenir = prevenir;
  moi.recharger = recharger;
  moi.composer = composer;
  return moi;
})();
