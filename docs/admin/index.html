.tab-sc input { min-width: 0; width: 100%; box-sizing: border-box; }
.tab-sc input[aria-invalid="true"] { border-color: var(--alerte); }
.tab-sc button { min-width: 40px; min-height: 36px; }
.tab-sc-erreur { margin: 0 0 6px; color: var(--alerte); font-weight: 600; }
.tab-sc-erreur[hidden] { display: none; }
/* les états d'une case qui s'enregistre : en cours (l'italique de .en-cours et un petit anneau dans le coin, qui tourne), enregistrée (le cadre
   vert de tab-ok et une coche dans le coin qui paraît puis s'efface), refusée (un anneau rouge, le message en infobulle ; la barre d'état propose
   « Reprendre » et « Réessayer »), ignorée par un collage (le fond ambre vingt secondes). Les pseudo-éléments sont à elles : la case de la distribution
   garde son ::after (« +n »). Sans mouvement (moins d'animations, ?anim=0), l'anneau reste fixe et la coche ne paraît pas : la barre d'état le dit. */
.tableur td.en-cours:not(.figee), .tableur td.enregistree:not(.figee) { position: relative; }
.tableur td.en-cours::before { content: ""; position: absolute; right: 6px; top: 6px; box-sizing: border-box; width: 11px; height: 11px; border: 2px solid color-mix(in srgb, var(--option) 30%, transparent); border-top-color: var(--option); border-radius: 50%; }
.tableur td.enregistree::before { content: ""; position: absolute; right: 7px; top: 4px; box-sizing: border-box; width: 6px; height: 11px; border: solid var(--ok); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); opacity: 0; }
.tableur td.erreur, .tableur td.erreur.actif { box-shadow: inset 0 0 0 2px var(--alerte); }
.tableur td.erreur { color: var(--alerte); }
.tableur td.ignoree { background: var(--option-doux) !important; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--option) 45%, transparent); }
.tableur td.ignoree.actif { box-shadow: inset 0 0 0 2px var(--accent); }
/* le petit calendrier de la case du jour (tableur.js, poserCal) : accroché à la saisie, lundi en premier, six semaines de 32 px */
.tab-cal { position: fixed; z-index: 41; box-sizing: border-box; width: 246px; padding: 10px; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; box-shadow: 0 14px 40px rgba(20, 10, 20, .28); user-select: none; }
.tab-cal-tete { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px; font: 600 15px/1.2 var(--titres); }
.tab-cal-tete button { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--encre); font-size: 18px; line-height: 1; cursor: pointer; }
.tab-cal-tete button:hover { background: var(--doux); }
.tab-cal-rang { display: grid; grid-template-columns: repeat(7, 32px); }
.tab-cal-sem span { height: 22px; font: 700 10.5px/22px var(--etiq); letter-spacing: .05em; text-transform: uppercase; text-align: center; color: var(--gris); }
.tab-cal-j { display: block; width: 32px; height: 32px; border-radius: 50%; font-size: 13.5px; line-height: 32px; text-align: center; cursor: pointer; }
.tab-cal-j:hover { background: var(--doux); }
.tab-cal-j.hors { opacity: .5; }
.tab-cal-j.auj { box-shadow: inset 0 0 0 1.5px var(--accent); }
.tab-cal-j.choisi { background: var(--principal, var(--accent)); color: #fff; font-weight: 700; opacity: 1; }
@media (max-width: 700px) {
  .tab-ajout-champs, .tab-ajout-champs.sans-heure { grid-template-columns: 1fr 1fr; }
  .tab-ajout-champs .ta-lieu { grid-column: 1 / -1; }
  .tab-cadre { --w-jour: 104px; --w-spectacle: 120px; }
  .tableur { font-size: 13px; }
  .tableur td.c-jour, .tableur td.c-spectacle { white-space: normal; }
}
/* au téléphone, les colonnes collées se resserrent : le reste du tableau garde de la place pour défiler */
@media (max-width: 520px) { .tab-cadre { --w-jour: 86px; --w-spectacle: 98px; } .tableur th, .tableur td { padding: 5px 7px; } .tableur td.c-spectacle .pastille { display: none; } }
/* ———————————————— le mouvement de l'administration : les vues qui s'enchaînent (changerVueAdmin), les listes et les
   fiches qui arrivent (main.entree, le temps du premier rendu), le pied qui dit l'état, la liste « à compléter » qui se
   vide, la recherche qui s'ouvre, la pastille « direct » qui bat, la case du tableur qui s'enregistre, la liste qui
   glisse (glisserVers), le champ visé qui s'allume (visee). Rien de tout cela si l'appareil demande moins d'animations,
   ni avec ?anim=0 (html.still) ; l'en-tête, le menu latéral et les annonces restent en place pendant une transition. */
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }
.barre { view-transition-name: barre; }
.menu:not(.menu-attente) { view-transition-name: menu; }

::view-transition-old(barre), ::view-transition-old(menu), ::view-transition-old(annonces) { display: none; }

'use strict';
/* L'administration du site de la compagnie Crescite : les spectacles, les dates et leurs représentations, les ateliers,
   les lieux et les textes. Chaque enregistrement va dans la base (Supabase, tables crescite_) et change aussitôt le site
   en ligne, qui écoute la base en temps réel. Seuls les comptes de crescite_admins peuvent enregistrer.
   Une date montre son lieu tel que sa fiche le connaît (adresse, itinéraire, contact, jauge) et mène à elle ; un lieu,
   ses dates. Sous les champs des fiches, les numéros et les adresses électroniques s'ouvrent d'un geste (sousChamp :
   « Appeler le … », « Écrire à … »), et une valeur apprise d'une feuille de route dit d'où elle vient (equipe.js).
   Partout : la recherche rapide (Ctrl K, ⌘K, la loupe de l'en-tête : dates, personnes, lieux, spectacles, feuilles,
   rubriques, dans ce qui est déjà chargé). En tête de Représentations : « À compléter avant la tournée » (téléphones de
   l'équipe, adresses et contacts des lieux, feuilles de route, pour les prochaines dates confirmées). Un lien peut viser
   le champ à remplir dans ce qu'il ouvre (data-viser). Le pied d'une date replie ses actions dans « Plus » quand elles

   sens, par le même chemin que la fiche d'une date (chargeDate, ecrireDate, effacerDate) ; exports Excel, CSV, Google
   Sheets ; import.
   La diffusion, les notes de frais et le matériel (le script « Compagnie Idéale ») se masquent quand la base n'a pas
   leurs tables (E.ideale). La Diffusion a trois parties : les pistes, les demandes de devis déposées sur le site (statut
   et notes internes), et le résumé des alertes de tournée, qui demande aussi le onzième script (E.alertesInstallees).
   Le tableau de bord (#/accueil, admin/tableau.js : TABLEAU) ouvre l'administration : des tuiles sur ce qui presse et ce
   qui vient, chacune menant au geste en un clic, entièrement personnalisables (ordre, taille, réglages, masquage), la
   disposition gardée avec le compte (crescite_preferences, clé accueil.tableau). */
const BASE = 'https://fwjgyfzcbcmfyfkhhtuh.supabase.co';
const CLE = 'sb_publishable__SvO0qVI2BvcBK5vYgxjZQ_U-evgPKD';

const sb = supabase.createClient(BASE, CLE, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'crescite-admin', detectSessionInUrl: true } });

const TT = typeof TENTACULES !== 'undefined' ? TENTACULES : null;
if (TT) TT.regler({ profil: 'admin', style: 'encre', remontee: false, soulever: false });
const tt = (f, ...a) => { if (TT && typeof TT[f] === 'function') { try { return TT[f](...a); } catch (e) { /* le décor ne doit rien casser */ } } };

// ===================================================================================================== état
const E = { session: null, admin: false, pret: false, direct: false, sale: false, hash: location.hash,

const TABLES_IDEALE = {

};
const NOMS_TABLES = { crescite_spectacles: 'Spectacle', crescite_lieux: 'Lieu', crescite_dates: 'Date', crescite_representations: 'Représentation',
  crescite_dates_suivi: 'Suivi d’une date', crescite_lieux_suivi: 'Suivi d’un lieu', crescite_ateliers: 'Atelier', crescite_seances: 'Séance d’atelier', crescite_textes: 'Texte du site',
  crescite_personnes: 'Fiche d’une personne', crescite_personnes_privees: 'Coordonnées d’une personne', crescite_personnes_suivi: 'Notes sur une personne',
  crescite_distributions: 'Distribution', crescite_equipes: 'Équipe d’une date', crescite_documents: 'Document', crescite_feuilles: 'Feuille de route',
  crescite_diffusion_prospects: 'Opportunité de diffusion', crescite_notes_frais: 'Note de frais', crescite_materiel: 'Matériel de tournée', crescite_devis_demandes: 'Demande de devis',
  crescite_acces_pro: 'Invitation à l’espace pro', crescite_propositions: 'Proposition de dates', crescite_notes: 'Note interne' };
// les chiffres des dates (la jauge, les spectateurs, les heures d'ateliers : supabase/migrations/20261029_crescite_chiffres.sql),

const TABLES_CHIFFRES = { crescite_dates_chiffres: ['chiffres', 'date_id'] };

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const texteSeul = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent; };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const AUJ = AGENDA.iso(new Date());
const aujourdhui = () => AGENDA.iso(new Date());   // le jour d'aujourd'hui, à l'appel (la diffusion s'en sert)
const JS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MC = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

const FILTRES_DATES_ADRESSE = { q: '', saison: '', spectacle: '', periode: 'avenir', statut: '', public: '', nature: '', dep: '', contrat: '', du: '', au: '' };

const LISTES_ADRESSE = [
  [/^#\/representations\/tableur$/, 'dates', { ...FILTRES_DATES_ADRESSE, mode: 'simple' }, { mode: () => (typeof PREFS !== 'undefined' && PREFS.lire('tableur.mode', null)) || 'simple' }],

const CLES_LUES_SEULEMENT = ['tri'];

function ecrireFiltres() {

  const s = q.toString().replace(/%2F/gi, '/').replace(/%2C/gi, ','), url = `${location.pathname}${s ? `?${s}` : ''}${location.hash}`;

  if (typeof E !== 'undefined' && E.n != null && location.hash === E.hash) noterAdresse();   // (pas quand la page vient de changer d'adresse et que le routage ne l'a pas encore vue : noter cette adresse-là ferait croire à hashchange qu'elle est déjà acceptée, et la vue ne changerait pas)

// l'adresse ouverte à l'arrivée, au rechargement, au précédent ou au suivant donne ses filtres à sa liste, avant qu'elle se

function lireFiltres() {
  const l = listeDeHash(location.hash); if (!l) return;
  const [, cle, defauts] = l, q = new URLSearchParams(location.search);
  // un vieux lien du tableur (?tri=desc) : le tri est lu, pour le tableur seulement ; ecrireFiltres l'ôte de l'adresse
  if (cle === 'dates' && q.has('tri')) { etatVue('tableur').tri = q.get('tri') === 'desc' ? 'desc' : 'asc'; if (!Object.keys(defauts).some(k => q.has(k))) { garderFiltres(); return; } }
  if (!Object.keys(defauts).some(k => q.has(k))) return;
  session[cle] = { ...(session[cle] || {}), ...Object.fromEntries(Object.entries(defauts).map(([k, d]) => [k, q.has(k) ? q.get(k) : (l[3]?.[k]?.() ?? d)])) };
  try { sessionStorage.setItem('crescite-admin-filtres', JSON.stringify(session)); } catch { /* navigation privée */ }
}

// une annonce en bas de l'écran : elle part seule ; on la renvoie avant d'une croix, ou d'un geste (la glisser de côté ou
// vers le bas), quand elle couvre un bouton ; tenue sous le doigt ou survolée, elle attend
function annoncer(msg, { erreur = false, action = null, libelle = 'Annuler', delai = 5000 } = {}) {
  const el = document.createElement('div');
  el.className = 'annonce' + (erreur ? ' erreur' : '');
  el.setAttribute('role', erreur ? 'alert' : 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-tt="retour">${esc(libelle)}</button>` : ''}<button type="button" class="annonce-fermer" aria-label="Fermer l’annonce" title="Fermer">${ICONES.svg('croix', { taille: 16, trait: 2.4 })}</button>`;
  let partie = false, tenue = false, reste = erreur ? 9000 : delai, depuis = Date.now(), minuteur = null;
  const partir = (dx = 0, dy = 0) => {
    if (partie) return; partie = true; clearTimeout(minuteur);
    if (dx || dy) { el.style.transition = 'transform .18s ease-in, opacity .18s ease-in'; el.style.transform = `translate(${dx}px, ${dy}px)`; el.style.opacity = '0'; }
    else el.classList.add('part');
    setTimeout(() => el.remove(), 200);
  };
  const attendre = () => { clearTimeout(minuteur); depuis = Date.now(); minuteur = setTimeout(() => { if (!tenue) partir(); }, reste); };
  const suspendre = () => { tenue = true; clearTimeout(minuteur); reste = Math.max(1500, reste - (Date.now() - depuis)); };
  const reprendre = () => { tenue = false; if (!partie) attendre(); };
  if (action) $('[data-tt="retour"]', el).addEventListener('click', () => { el.remove(); partie = true; clearTimeout(minuteur); action(); });
  $('.annonce-fermer', el).addEventListener('click', () => partir());
  el.addEventListener('mouseenter', suspendre);
  el.addEventListener('mouseleave', reprendre);
  // le geste : on la tire du doigt (ou de la souris) ; au-delà d'un tiers de sa largeur de côté, ou de 40 px vers le bas, elle part
  let x0 = null, y0 = 0, dx = 0, dy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.button || e.target.closest('button')) return;
    x0 = e.clientX; y0 = e.clientY; dx = dy = 0; suspendre();
    el.setPointerCapture?.(e.pointerId); el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0; dy = Math.max(0, e.clientY - y0);
    const vertical = dy > Math.abs(dx);
    el.style.transform = vertical ? `translateY(${dy}px)` : `translateX(${dx}px)`;
    el.style.opacity = String(Math.max(.3, 1 - (vertical ? dy / 80 : Math.abs(dx) / el.offsetWidth)));
  });
  const lacher = () => {
    if (x0 === null) return;
    x0 = null;
    const vertical = dy > Math.abs(dx);
    if (vertical ? dy > 40 : Math.abs(dx) > el.offsetWidth / 3) { partir(vertical ? 0 : Math.sign(dx) * el.offsetWidth, vertical ? 60 : 0); return; }
    el.style.transition = 'transform .2s, opacity .2s'; el.style.transform = ''; el.style.opacity = '';
    if (!el.matches(':hover')) reprendre();
  };
  el.addEventListener('pointerup', lacher);
  el.addEventListener('pointercancel', lacher);
  $('#annonces').append(el);
  attendre();
}

// les coordonnées écrites dans un champ deviennent des liens : chaque numéro « Appeler le … » (tel:), chaque adresse

// sous le champ d'une fiche : ces liens, et ce que mention(valeur) y ajoute (d'où vient la valeur), tenus à jour à la saisie
function sousChamp(input, mention = () => '') {

// un HTML propre : gras, italique, liens, retours à la ligne, intertitres et listes ; rien d'autre
function propre(html) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const sortie = n => {
    if (n.nodeType === 3) return esc(n.textContent).replace(/&#39;/g, '’');
    if (n.nodeType !== 1) return '';
    const tag = n.tagName.toLowerCase(), d = [...n.childNodes].map(sortie).join('');
    if (tag === 'b' || tag === 'strong') return d.trim() ? `<strong>${d}</strong>` : d;
    if (tag === 'i' || tag === 'em') return d.trim() ? `<em>${d}</em>` : d;
    if (tag === 'br') return '<br/>';
    if (['h2', 'h3', 'ul', 'ol', 'li'].includes(tag)) return `<${tag}>${d}</${tag}>`;
    if (tag === 'a') { const h = n.getAttribute('href') || ''; return /^(https?:|mailto:|#\/)/.test(h) ? `<a href="${esc(h)}">${d}</a>` : d; }
    if (tag === 'div' || tag === 'p') return d + '<br/>';
    return d;
  };
  return [...t.content.childNodes].map(sortie).join('').replace(/(<br\/>\s*)+$/, '').replace(/&nbsp;/g, ' ').trim();
}

// des photos plus légères avant l'envoi : 2 000 px au plus, en WebP
async function optimiser(fichier) {
  try {
    const img = await createImageBitmap(fichier);
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.84));
    return blob && blob.size < fichier.size ? blob : fichier;
  } catch { return fichier; }
}
async function envoyerPhoto(fichier, dossier) {
  const blob = await optimiser(fichier);
  const ext = blob.type === 'image/webp' ? 'webp' : (fichier.name.split('.').pop() || 'jpg').toLowerCase();
  const chemin = `${dossier}/${Date.now().toString(36)}-${slugifier(fichier.name.replace(/\.[^.]+$/, '')) || 'photo'}.${ext}`;
  const { error } = await sb.storage.from('crescite').upload(chemin, blob, { contentType: blob.type || fichier.type, upsert: false, cacheControl: '31536000' });
  if (error) throw error;
  return chemin;
}

const CLES_TABLES = { crescite_dates_suivi: ['date_id'], crescite_lieux_suivi: ['lieu_id'], crescite_dates_chiffres: ['date_id'], crescite_textes: ['cle'],

async function tout(table, ordre) {
  const out = [];
  for (let a = 0; ; a += 1000) {
    let q = sb.from(table).select('*').range(a, a + 999);
    if (ordre) q = q.order(ordre, { ascending: true });
    for (const k of CLES_TABLES[table] || ['id']) if (k !== ordre) q = q.order(k, { ascending: true });

    if (avant && !E.direct) { E.luLe = Date.now(); E.directPerdu = true; }

/* Le témoin de l'en-tête (majTemoin), le même que dans l'espace de l'équipe : une pastille et un mot disent la connexion et
   la fraîcheur de ce qu'on lit, et le bouton lui-même relit la base (actualiser). « À jour » : le direct est relié, ou la
   lecture a moins de deux minutes ; « Lu il y a 12 min » : le direct n'est pas relié, rien n'est arrivé depuis ;
   « Reconnexion… » : le réseau est là, le direct revient ; « Hors ligne · lu il y a 3 h » : plus de réseau, l'écran reste
   tel qu'il a été lu (un enregistrement échouerait) ; « Mise à jour… » pendant que la base se relit (les mêmes mots et la
   même icône que le témoin de l'équipe). Au téléphone, la pastille
   et l'icône seules, le mot quand il y a lieu de s'inquiéter. Le passage hors ligne et le retour s'entendent (une région
   polie, hors de #app, que cadre() ne refait pas). Au retour du réseau ou du direct, la base se relit d'elle-même : ce qui
   a changé pendant la coupure ne passe pas par le temps réel. */
const ICONE_ACTUALISER = ICONES.svg('actualiser', { taille: 16, trait: 2.2, classe: 'temoin-ic' });
const heureCourteAd = t => { const d = new Date(t); return `${d.getHours()} h ${String(d.getMinutes()).padStart(2, '0')}`; };
// « à l'instant », « il y a 12 min », « il y a 3 h », « hier à 18 h 05 », « le 25 oct. »
function depuisTexte(t) {
  const s = (Date.now() - t) / 1000, d = new Date(t), hier = new Date(); hier.setDate(hier.getDate() - 1);
  if (s < 60) return 'à l’instant';
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (d.toDateString() === new Date().toDateString()) return `il y a ${Math.floor(s / 3600)} h`;
  if (d.toDateString() === hier.toDateString()) return `hier à ${heureCourteAd(t)}`;
  return `le ${d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}`;
}
function etatConnexion() {

  if (E.horsLigne || navigator.onLine === false) return { k: 'horsligne', mot: 'Hors ligne', detail: `lu ${depuisTexte(lu)}`, long: `Hors ligne : l’écran montre la base telle qu’elle a été lue ${depuisTexte(lu)} ; un enregistrement échouera jusqu’au retour du réseau.` };
  if (E.relit) return { k: 'lecture', mot: 'Mise à jour…', detail: '', long: 'La base se relit.' };
  if (E.directPerdu) return { k: 'reconnexion', mot: 'Reconnexion…', detail: `lu ${depuisTexte(lu)}`, long: `Le direct s’est interrompu ${depuisTexte(lu)} : il se rétablit.` };
  if (E.direct) return { k: 'direct', mot: 'À jour', detail: '', long: 'À jour : chaque changement arrive en direct.' };
  if (Date.now() - lu < 120000) return { k: 'ajour', mot: 'À jour', detail: '', long: `À jour : la base a été lue à ${heureCourteAd(lu)}.` };
  return { k: 'lu', mot: `Lu ${depuisTexte(lu)}`, detail: '', long: `La base a été lue à ${heureCourteAd(lu)} ; le direct n’est pas relié.` };
}
const temoinHtml = () => `<button type="button" class="direct temoin" id="b-temoin" data-temoin><span class="temoin-mot"></span><span class="temoin-detail"></span><span class="sr"> · Actualiser</span>${ICONE_ACTUALISER}</button>`;

async function actualiser({ discret = false } = {}) {

    try { await chargerTout(); await prefsRelues; } catch (e) {

      return false;

    if (!pied.isConnected) return;
    if (document.documentElement.classList.contains('redim')) { attente = setTimeout(mesurer, 150); return; }
    const w = Math.round(pied.getBoundingClientRect().width);
    if (w !== largeur) { largeur = w; ajusterPied(pied); }
  };
  const ro = new ResizeObserver(es => {
    if (!pied.isConnected) { ro.disconnect(); return; }
    if (document.documentElement.classList.contains('redim')) { if (!attente) attente = setTimeout(mesurer, 150); return; }
    const w = Math.round(es[0].contentRect.width);
    if (w !== largeur) { largeur = w; ajusterPied(pied); }
  });
  ro.observe(pied);
}

   et partagent leurs filtres : un seul état, session.dates (la recherche, la période, la saison, le spectacle, le statut,
   le public, et nature, département, contrat, du, au), un seul prédicat (dateRetenue), une seule barre (filtresDates).
   Changer de vue les garde ; l'adresse les porte (LISTES_ADRESSE : ce qui diffère de la valeur d'office). Ce qui est propre
   à une vue reste dans session.vues.<vue>, hors de l'adresse (la liste : ses saisons ouvertes ; le tableur : le tri ; la carte :
   « Autour des dates » et le cadre du zoom, vb, que la carte efface à chaque ouverture). Les colonnes du tableur (vides, ordre,
   masquées, figées, largeurs) sont une préférence du compte. Les trois vues partagent aussi le sélecteur de vues (choixVueDates :
   une pilule de trois liens à icônes). */
const DEFAUTS_DATES = { q: '', saison: '', spectacle: '', periode: 'avenir', statut: '', public: '', nature: '', dep: '', contrat: '', du: '', au: '' };
const DEFAUTS_VUES = { liste: { ouvertes: [] }, tableur: { tri: 'asc' }, carte: { serre: false, vb: null } };   // (les colonnes vides du tableur vivent dans la préférence tableur.colonnes)
const FILTRES_PLUS = ['nature', 'dep', 'contrat', 'du', 'au'];   // ceux que la barre range sous « Plus de filtres »
// l'état propre à une vue (session.vues.<vue>), complété de ses valeurs d'office ; le même objet à chaque appel
function etatVue(nom) {
  const vues = session.vues = session.vues && typeof session.vues === 'object' ? session.vues : {};
  if (!vues[nom] || typeof vues[nom] !== 'object') vues[nom] = {};
  Object.entries(DEFAUTS_VUES[nom] || {}).forEach(([k, d]) => { if (vues[nom][k] === undefined) vues[nom][k] = Array.isArray(d) ? [...d] : d; });
  return vues[nom];
}
// l'état commun des filtres (session.dates), complété de ses valeurs d'office. Migration douce, une fois : ce que le tableur
// (session.tableur) et la carte (session.tournee) gardaient chacun passe dans l'état commun ou dans leur vue, puis s'efface ;
// ce que l'adresse ou la liste avaient déjà écrit l'emporte
function etatDates() {
  const avant = session.dates && typeof session.dates === 'object' ? session.dates : {}, f = session.dates = Object.assign({}, DEFAUTS_DATES, avant);
  const pris = new Set(Object.keys(avant)), prendre = (k, v) => { if (!pris.has(k)) { f[k] = v; pris.add(k); } };
  const t = session.tableur, c = session.tournee;
  delete session.tableur; delete session.tournee;
  if (t && typeof t === 'object') {
    if (typeof t.saison === 'string') prendre('saison', t.saison);
    if (['avenir', 'passees', 'toutes'].includes(t.periode)) prendre('periode', t.periode);
    if (t.tri === 'desc') etatVue('tableur').tri = 'desc';
    if (t.vides === true) etatVue('tableur').vides = true;   // (TABLEUR.vue le prend et l'écrit dans la préférence tableur.colonnes, une fois)
  }
  if (c && typeof c === 'object') {
    if (typeof c.saison === 'string') prendre('saison', c.saison === 'toutes' ? '' : c.saison);
    if (typeof c.avenir === 'boolean') prendre('periode', c.avenir ? 'avenir' : 'toutes');
    if (c.serre === true) etatVue('carte').serre = true;
  }
  if (Array.isArray(f.ouvertes)) { const v = etatVue('liste'); v.ouvertes = [...new Set([...v.ouvertes, ...f.ouvertes])]; }   // (avant : les saisons ouvertes allaient dans l'état commun)
  delete f.ouvertes;
  if (!['avenir', 'passees', 'toutes'].includes(f.periode)) f.periode = DEFAUTS_DATES.periode;
  return f;
}
// ce qu'une date doit à ces filtres : le seul endroit où se lisent leurs sens (masquee = !visible, mixte passe toujours le
// filtre du public…), pour la liste, le tableur et la carte. Ni la recherche (chaque vue cherche dans ce qu'elle montre) ni la
// période (la liste la lit autrement : un bloc « à venir » et des saisons passées) n'y sont
function dateRetenue(d, f) {
  if (f.spectacle && String(d.spectacle_id) !== String(f.spectacle)) return false;
  if (f.saison && d.saison !== f.saison) return false;
  if (f.nature && (d.nature || 'representations') !== f.nature) return false;
  if (f.dep && lieu(d.lieu_id)?.departement !== f.dep) return false;
  if (f.contrat) { const c = (E.suivis.find(x => x.date_id === d.id)?.contrat || '').trim(); if (f.contrat === 'aucun' ? c : c !== f.contrat) return false; }
  if (f.du && (d.fin || d.debut) < f.du) return false;
  if (f.au && d.debut > f.au) return false;
  if (f.public && !(d.public === f.public || (d.public === 'mixte'))) return false;
  if (f.statut === 'masquee' ? d.visible : f.statut && d.statut !== f.statut) return false;
  return true;

// la barre de filtres des trois vues : la recherche, la période, la saison, le statut, le public, les puces des spectacles
// (elles servent de légende), « Plus de filtres » (nature, département, contrat, du … au), le compte (#f-compte : chaque vue y

// les contrôles reprennent ce que dit f (« Effacer les filtres », un filtre relâché pour montrer une ligne, un ajout du tableur)

let BARRE_DATES = null;

// La vue retenue de Représentations (la préférence du compte `representations.vue` : 'liste', 'tableur' ou 'carte'). Elle est

    if (c.niveau === 'seance' && !x?.r) return raté(`« ${c.l} » est le champ d’une séance : dites laquelle.`);
    if (c.niveau === 'equipe' && x?.personne_id == null) return raté(`« ${c.l} » est le champ d’une personne de l’équipe : dites laquelle.`);

// l'univers d'un spectacle qui naît : neutre, aux couleurs de la saison (les --saison* que site/build.py pose dans la
// page, lues au moment de la création ; sans le build, le gris neutre des sources) ; un fond de nuit à peine teinté de
// sa couleur profonde, un texte neutre ; comme l'ancien univers par défaut, l'accent à la couleur qui porte un texte
// blanc (--saison-porteur), l'accent pour du texte et la scène à sa couleur vive (lisible sur ce fond), la lueur à
// l'accent. L'administration le change ensuite comme avant (Univers).
function universSaison() {
  const cs = getComputedStyle(document.documentElement);
  const lire = (v, defaut) => { const x = cs.getPropertyValue(v).trim(); return /^#[0-9a-f]{6}$/i.test(x) ? x.toLowerCase() : defaut; };
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mele = (a, b, t) => `#${rgb(a).map((v, i) => Math.round(v * t + rgb(b)[i] * (1 - t)).toString(16).padStart(2, '0')).join('')}`;
  const profond = lire('--saison-profond', '#2b272c'), vive = lire('--saison-vive', '#b7b0ae'), porteur = lire('--saison-porteur', '#5c545d');
  return { nom: '', clair: false, motif: '', couleurs: { fond: mele(profond, '#141114', .25), fond2: mele(profond, '#201b20', .4), texte: '#efebe7', texte2: '#b9b3ae',
    accent: porteur, accent2: vive, scene: vive, lueur: `rgba(${rgb(porteur).join(',')},0.3)` }, polices: {} };

    const sa = E.lieuxSuivi.find(x => x.lieu_id === id), sc = E.lieuxSuivi.find(x => x.lieu_id === cible);
    let suivi = null;
    if (sa) {
      suivi = { ...(sc || {}), lieu_id: cible };
      Object.keys(sa).filter(k => !['lieu_id', 'modifie_le', 'modifie_par'].includes(k)).forEach(k => {
        const a = sa[k], b = sc ? sc[k] : null, vide = v => v == null || String(v).trim() === '';
        if (k === 'notes' && !vide(a) && !vide(b) && String(a).trim() !== String(b).trim()) suivi.notes = `${String(b).trim()}\n\n(${lieuTexte(l0)}) ${String(a).trim()}`;
        else if (vide(b) && !vide(a)) suivi[k] = a;
      });
      delete suivi.modifie_le; delete suivi.modifie_par;
    }
    const r1 = await sb.from('crescite_dates').update({ lieu_id: cible }).eq('lieu_id', id);
    const r2 = r1.error ? r1 : await sb.from('crescite_seances').update({ lieu_id: cible }).eq('lieu_id', id);
    const r2b = r2.error || !suivi ? r2 : await sb.from('crescite_lieux_suivi').upsert(suivi, { onConflict: 'lieu_id' });
    const r2c = r2b.error ? r2b : await sb.from('crescite_notes').update({ cible_id: cible }).eq('cible_table', 'crescite_lieux').eq('cible_id', id).then(r => (r.error && /crescite_notes/.test(r.error.message || '') ? { error: null } : r));
    const r2d = r2c.error || !E.carnetInstalle ? r2c : await sb.from('crescite_contacts').update({ lieu_id: cible }).eq('lieu_id', id).then(r => (r.error ? r : sb.from('crescite_hebergements').update({ lieu_id: cible }).eq('lieu_id', id)));
    const r3 = r2d.error ? r2d : await sb.from('crescite_lieux').delete().eq('id', id);
    if (r3.error) return erreur(r3.error, 'Fusion incomplète');
    E.dates.forEach(d => { if (d.lieu_id === id) d.lieu_id = cible; }); E.seances.forEach(s => { if (s.lieu_id === id) s.lieu_id = cible; }); E.lieux = E.lieux.filter(x => x.id !== id);
    [...(E.contacts || []), ...(E.hebergements || [])].forEach(x => { if (x.lieu_id === id) x.lieu_id = cible; });
    E.lieuxSuivi = E.lieuxSuivi.filter(x => x.lieu_id !== id && x.lieu_id !== cible).concat(suivi ? [suivi] : sc ? [sc] : []);

  $('#li-suppr')?.addEventListener('click', () => CORBEILLE.ligne({ table: 'crescite_lieux', ligne: l0, quoi: `Lieu supprimé : ${lieuTexte(l0)}.`, retabli: 'Lieu rétabli.',

  $('[data-enregistrer]', zone).addEventListener('click', async e => {

      adresse: F.adresse || null, site_web: F.site_web || null, latitude: F.latitude, longitude: F.longitude };
    e.target.disabled = true;
    const r = l0 ? await sb.from('crescite_lieux').update(ligneLi).eq('id', id).select().single() : await sb.from('crescite_lieux').insert(ligneLi).select().single();
    if (r.error) { e.target.disabled = false; return erreur(r.error); }
    const r2 = await sb.from('crescite_lieux_suivi').upsert({ lieu_id: r.data.id, contact: G.contact || null, jauge: G.jauge, plateau: G.plateau || null, notes: G.notes || null }).select().single();
    e.target.disabled = false;

    E.lieuxSuivi = E.lieuxSuivi.filter(x => x.lieu_id !== r.data.id).concat([r2.data]);
    E.sale = false; annoncer('Lieu enregistré.');

}

function creerDateDepuisPiste(p) {
  const G = nouvelleDate();

  if (p.lieu_id != null && lieu(p.lieu_id)) G.lieu_id = p.lieu_id;

const brancherParties = () => $$('[data-di-partie]').forEach(b => b.addEventListener('click', () => { location.hash = '#/diffusion' + (b.dataset.diPartie ? '/' + b.dataset.diPartie : ''); }));

      ${p.contact_nom || p.contact_email ? `<div class="crm-carte-contact">👤 ${esc(p.contact_nom || '')} ${p.contact_email ? `· <a href="mailto:${esc(p.contact_email)}" class="btn lien" style="padding:0;font-size:12px">${esc(p.contact_email)}</a>` : ''}</div>` : ''}
      ${montantTxt ? `<div class="crm-carte-cession">${montantTxt}</div>` : ''}

// une piste passe à une autre étape (ses flèches, son menu, la carte glissée d'une colonne à l'autre : menus.js) ; la carte
// glisse jusqu'à sa nouvelle colonne
async function deplacerProspect(id, etape) {
  const p = (E.prospects || []).find(x => x.id === id), e = ETAPES_CRM.find(x => x[0] === etape) || (etape === 'refus' ? ETAPE_PERDUE : null);
  if (!p || !e || p.etape === etape) return false;
  try {
    const { error } = await sb.from('crescite_diffusion_prospects').update({ etape, date_dernier_contact: aujourdhui() }).eq('id', id);
    if (error) throw error;
    p.etape = etape; p.date_dernier_contact = aujourdhui();
    if (etape === 'contrat_signe' && !p.date_convertie_id) annoncer(`Cession confirmée : ${p.structure}.`, { libelle: 'Créer la date', delai: 12000, action: () => creerDateDepuisPiste(p) });
    else annoncer(etape === 'refus' ? `Piste perdue : ${p.structure} (elle reste dans « Pistes perdues »).` : `Opportunité déplacée vers « ${e[1]} ».`);
    if (location.hash === '#/diffusion') { const places = reperer($('#kanban-zone') || document); vueDiffusion(); glisserVers(places, $('#kanban-zone')); } else rafraichirListes();
    return true;
  } catch (err) { erreur(err, 'Déplacement impossible'); return false; }
}
function brancherDiffusion() {
  $('#b-nouveau-prospect')?.addEventListener('click', () => ouvrirModaleProspect(null));

  $$('[data-crm-editer]').forEach(b => {
    b.addEventListener('click', () => {
      const p = E.prospects.find(x => x.id === +b.dataset.crmEditer);
      if (p) ouvrirModaleProspect(p);
    });
  });

  $$('[data-crm-deplacer]').forEach(b => {
    b.addEventListener('click', async () => {
      const p = E.prospects.find(x => x.id === +b.dataset.id);
      if (!p) return;
      const i = ETAPES_CRM.findIndex(e => e[0] === p.etape) + +b.dataset.crmDeplacer;
      if (i < 0 || i >= ETAPES_CRM.length) return;
      b.disabled = true;
      if (!(await deplacerProspect(p.id, ETAPES_CRM[i][0]))) b.disabled = false;
    });
  });

  $$('[data-crm-perdue]').forEach(b => b.addEventListener('click', async () => { b.disabled = true; if (!(await deplacerProspect(+b.dataset.crmPerdue, 'refus'))) b.disabled = false; }));
  $$('[data-crm-rouvrir]').forEach(b => b.addEventListener('click', async () => { b.disabled = true; if (!(await deplacerProspect(+b.dataset.crmRouvrir, 'contact_pris'))) b.disabled = false; }));
  $$('[data-crm-date]').forEach(b => b.addEventListener('click', () => { const p = E.prospects.find(x => x.id === +b.dataset.crmDate); if (p) creerDateDepuisPiste(p); }));

  $$('[data-crm-email]').forEach(b => {
    b.addEventListener('click', () => {
      const p = E.prospects.find(x => x.id === +b.dataset.crmEmail);
      if (p) ouvrirModaleEmailRelance(p);
    });
  });

  $$('[data-crm-supprimer]').forEach(b => {

        apres: () => { const idx = E.prospects.findIndex(x => x.id === id); if (idx >= 0) E.prospects.splice(idx, 1); if (location.hash === '#/diffusion') vueDiffusion(); },
        apresRetour: x => { E.prospects.push(x); if (location.hash === '#/diffusion') vueDiffusion(); } });
      if (!fait) b.disabled = false;
    });
  });
}

// La boîte de la diffusion (l'opportunité, le courriel de relance) : un dialog.tab-dialogue posé sur le corps de la page, comme « Étendre » et
// « Importer » — une seule sorte de fenêtre, avec son coin à tirer (FENETRES), que le redessin en direct de la vue Diffusion n'emporte pas.
// titre, contenu : ce qu'elle dit ; idTitre, idFermer : les ids de son titre et de son ✕ ; garder : une saisie commencée ne se perd pas d'un
// Échap (GESTES.garder sur la boîte elle-même, la question « Fermer sans enregistrer ? »). Rend { dlg, fermer, fermerSans } : fermer pose la
// question quand il le faut, fermerSans (un enregistrement réussi, « Relance faite ») non. À la fermeture, la boîte quitte la page ; un
// changement de rubrique la ferme aussi (la question d'abord, si une saisie est commencée).
function boiteCrm(titre, contenu, { garder = false, idTitre = 't-mod-crm', idFermer = 'b-fermer-mod-crm' } = {}) {
  const dlg = document.createElement('dialog');
  dlg.className = 'tab-dialogue crm-boite'; dlg.setAttribute('aria-labelledby', idTitre);
  dlg.innerHTML = `<div class="tab-dialogue-boite"><div class="crm-tete"><h2 id="${idTitre}">${esc(titre)}</h2><button type="button" class="btn petit" id="${idFermer}" aria-label="Fermer" title="Fermer (Échap)">✕</button></div>${contenu}</div>`;
  document.body.append(dlg);
  // (changer de rubrique, le bouton précédent : la page se redessine sous la fenêtre, qui part avec elle — sauf une saisie commencée,
  // qui pose d'abord sa question : la fermeture, alors, est celle de « Quitter sans enregistrer » ; le hashchange du script principal passe avant)
  const surAdresse = () => { if (!dlg.isConnected) window.removeEventListener('hashchange', surAdresse); else if (!(garder && typeof GESTES !== 'undefined' && GESTES.saisie(dlg))) fermerSans(); };
  dlg.addEventListener('close', () => { window.removeEventListener('hashchange', surAdresse); dlg.remove(); });
  window.addEventListener('hashchange', surAdresse);
  const fermerSans = () => { if (dlg.open) dlg.close(); else dlg.remove(); };
  const fermer = async () => { if (!garder || await partirSansPerdre({ titre: 'Fermer sans enregistrer ?', ok: 'Fermer sans enregistrer', dans: dlg, avecFiche: false })) fermerSans(); };
  if (garder && typeof GESTES !== 'undefined') {
    GESTES.garder(dlg);
    dlg.addEventListener('cancel', e => { if (GESTES.saisie(dlg)) { e.preventDefault(); fermer(); } });
  }
  $('#' + idFermer, dlg).addEventListener('click', fermer);
  dlg.showModal();
  return { dlg, fermer, fermerSans };
}

const secteurAlerte = a => {

const etatAlerte = a => (!a.active ? 'desactivee' : a.confirme_le ? 'confirmee' : 'attente');

function resume(j) {

const champsChanges = j => j.avant && j.apres ? Object.keys(j.apres).filter(k => !['modifie_le', 'modifie_par'].includes(k) && JSON.stringify(j.avant[k]) !== JSON.stringify(j.apres[k])) : [];
// le journal : les dernières modifications, filtrées sans requête : une rubrique ou une table, un auteur, une période
// (aujourd'hui, 7 ou 30 jours, ou deux dates), et des mots cherchés dans ce que dit chaque ligne (son résumé, les champs
// changés et leurs valeurs avant et après, ce qui est allé dans les fiches, l'auteur). Les filtres restent le temps de la
// session. « Lire plus ancien » ajoute 300 modifications ; quand une période remonte plus loin que ce qui est lu, le dit.
const RUBRIQUES_JOURNAL = [['representations', 'Représentations', ['crescite_dates', 'crescite_representations', 'crescite_dates_suivi', 'crescite_dates_chiffres', 'crescite_equipes']],
  ['feuilles', 'Feuilles de route', ['crescite_feuilles']], ['spectacles', 'Spectacles', ['crescite_spectacles', 'crescite_distributions', 'crescite_documents']],
  ['equipe', 'Équipe', ['crescite_personnes']], ['ateliers', 'Ateliers', ['crescite_ateliers', 'crescite_seances']], ['lieux', 'Lieux', ['crescite_lieux', 'crescite_lieux_suivi', 'crescite_contacts', 'crescite_hebergements']],
  ['diffusion', 'Diffusion', ['crescite_diffusion_prospects', 'crescite_devis_demandes', 'crescite_documents_generes', 'crescite_acces_pro']],
  ['planning', 'Planning', ['crescite_propositions']], ['frais', 'Frais et matériel', ['crescite_notes_frais', 'crescite_materiel']], ['notes', 'Notes internes', ['crescite_notes']],
  ['textes', 'Textes du site', ['crescite_textes']]];
const PERIODES_JOURNAL = [['', 'Toute la période'], ['jour', 'Aujourd’hui'], ['7', 'Les 7 derniers jours'], ['30', 'Les 30 derniers jours'], ['choisir', 'Choisir les dates…']];
const OPS_JOURNAL = { INSERT: 'Ajout', UPDATE: 'Modification', DELETE: 'Suppression' };
const valeurJournal = v => (v == null ? '' : typeof v === 'object' ? JSON.stringify(v).replace(/["{}\[\]]/g, ' ') : String(v)).slice(0, 1500);
async function vueJournal() {

      return `<div class="mois j-jour">${k === AUJ ? 'Aujourd’hui' : k === hier ? 'Hier' : esc(new Date(j.quand).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</div>`; };
    zone.innerHTML = xs.map(j => { const ch = champsChanges(j), ap = apprisDuJournal(j);
      return `${enTeteJour(j)}<div class="journal-ligne"><span class="quand">${new Date(j.quand).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })}<br>${esc(nomAdmin(j.qui))}</span>
        <span class="quoi"><b>${OPS_JOURNAL[j.operation]} · ${esc(NOMS_TABLES[j.table_nom] || j.table_nom)}</b>${surlignerRch(resume(j) || '', mots)}${ch.length ? `<span class="diff"> — ${surlignerRch(ch.join(', '), mots)}</span>` : ''}${ap.length ? `<span class="diff appris"> — gardé dans les fiches : ${esc(ap.join(', '))}</span>` : ''}</span>
        <span>${j.operation === 'INSERT' ? `<button class="btn petit" data-j="${j.id}" data-tt="retour">Retirer</button>` : `<button class="btn petit" data-j="${j.id}" data-tt="retour">Revenir</button>`}</span></div>`; }).join('')
      || listeVide(total > 0, { rien: 'Aucune modification ne correspond.', aucun: 'Rien encore.' });
    if (premier && !CALME_ADMIN()) zone.classList.add('ad-neuf');       // la première liste se pose
    const plusVieux = E.journal.length ? jourDe(E.journal[E.journal.length - 1]) : AUJ, de = debutPeriode();
    $('#j-compte').textContent = `${filtre ? `${xs.length} sur ${total}` : total} modification${total > 1 ? 's' : ''}${E.journalFin ? '' : `, depuis le ${jourCourt(plusVieux)}`}`;
    $('#j-effacer').hidden = !filtre;
    $('#j-plus-zone').innerHTML = E.journalFin ? '' : `${filtre && (!de || de < plusVieux) ? `<span class="aide">Le journal lu remonte au ${esc(jourCourt(plusVieux))} : il y a plus ancien.</span>` : ''}<button type="button" class="btn" id="j-plus">Lire ${PAGE_JOURNAL} modifications plus anciennes</button>`;
    clearTimeout(dessiner.minuteur);
    dessiner.minuteur = setTimeout(() => { const a = $('#j-annonce'); if (a && filtre) a.textContent = $('#j-compte')?.textContent || ''; }, 500);
  };
  zone.rafraichir = async () => { await rechargerJournal(); if (zone.isConnected) dessiner(); };
  dessiner();
  const maj = () => { garderFiltres(); dessiner(); };
  $('#j-q').addEventListener('input', e => { f.q = e.target.value; maj(); });
  $('#j-quoi').addEventListener('change', e => { f.quoi = e.target.value; maj(); });
  $('#j-qui').addEventListener('change', e => { f.qui = e.target.value; maj(); });
  $('#j-periode').addEventListener('change', e => { f.periode = e.target.value; $('.j-dates').hidden = f.periode !== 'choisir'; maj(); if (f.periode === 'choisir') $('#j-du').focus(); });
  $('#j-du').addEventListener('change', e => { f.du = e.target.value; maj(); });
  $('#j-au').addEventListener('change', e => { f.au = e.target.value; maj(); });
  $('#j-effacer').addEventListener('click', () => {
    Object.assign(f, { q: '', quoi: '', qui: '', periode: '', du: '', au: '' });
    ['#j-q', '#j-quoi', '#j-qui', '#j-periode', '#j-du', '#j-au'].forEach(k => { $(k).value = ''; });
    $('.j-dates').hidden = true; maj(); $('#j-q').focus();
  });
  $('#j-plus-zone').addEventListener('click', async e => {
    const b = e.target.closest('#j-plus'); if (!b) return;
    b.disabled = true; b.textContent = 'Lecture…';
    try { await journalPlusAncien(); remplirAuteurs(); dessiner(); $('#j-plus')?.focus(); } catch (err) { erreur(err, 'Lecture impossible'); b.disabled = false; }
  });
  zone.addEventListener('click', async e => {
    const b = e.target.closest('[data-j]'); if (!b) return;
    const j = E.journal.find(x => x.id === +b.dataset.j); if (!j) return;
    b.disabled = true;
    // sans confirmation : la ligne revient comme avant, et l'annonce porte « Rétablir » (corbeille.js)
    await CORBEILLE.inverser(j, { annonce: j.operation === 'INSERT' ? 'Ligne retirée.' : j.operation === 'UPDATE' ? 'La ligne est revenue comme avant la modification.' : 'Ligne rétablie.', apres: () => zone.rafraichir() });
    b.disabled = false;
  });
}
</script>
