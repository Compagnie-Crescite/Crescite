<!doctype html>
<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<!-- la nuit par défaut, quel que soit l'appareil (data-theme="nuit" sur <html>, comme le site public) ; le jour reste dans
     la feuille de style, sous data-theme="jour" seulement -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1117">
<!-- l'icône d'onglet : celle des espaces réservés, à la couleur de la saison (faite par site/build.py, equipe(dest)) -->
<link rel="icon" href="../equipe/icones/192.png" type="image/png">
<link rel="apple-touch-icon" href="../equipe/icones/180.png">
<meta name="format-detection" content="telephone=no">
<title>Des dates vous sont proposées · Compagnie Crescite</title>
<link rel="preconnect" href="https://fwjgyfzcbcmfyfkhhtuh.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,500&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Raleway:wght@600;700&display=swap" crossorigin>
<style>
/* La page de réponse aux propositions de dates (reponse/?r=…) : les liens des courriels y mènent, avec la clé de la
   personne. Elle lit la proposition et enregistre les réponses par la fonction crescite-courriel. Un lien de courriel
   n'enregistre rien tout seul : le choix arrive prêt, on le confirme d'un bouton. À la charte du site public, comme
   l'espace des salles : ses polices, ses neutres, l'accent à la couleur de la saison (--saison-*, posées par
   site/build.py ; sans lui, un gris neutre), la nuit par défaut (le jour sous data-theme="jour" seulement).
   Les alertes de tournée (reponse/?alerte=<jeton>&action=confirmer|arreter, le onzième script SQL) : la page montre
   l'alerte (son secteur, jamais l'adresse) et fait confirmer d'un bouton, ou arrêter (l'alerte s'efface, ou toutes
   celles de l'adresse) ; là non plus, ouvrir le lien ne fait rien tout seul. */
:root {
  --saison: #4f4850; --saison-vive: #b7b0ae; --saison-porteur: #5c545d; --saison-profond: #2b272c; --saison-texte: #4f4850;
  --saison-fonce: #3f3940; --saison-doux: #efebe6; --saison-texte-nuit: #b7b0ae; --saison-fonce-nuit: #d0cbc9; --saison-doux-nuit: #2e2629;
  --papier: #f6f2eb; --surface: #fffdf9; --encre: #1d1418; --gris: #5f565a; --filet: #dcd3c6;
  --magenta: var(--saison-texte); --magenta-fonce: var(--saison-fonce); --magenta-doux: var(--saison-doux); --sur-magenta: #fff; --pieuvre: var(--saison);
  --serif: "Ubuntu", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --etiq: "Raleway", "Open Sans", system-ui, sans-serif;
  --gs: env(safe-area-inset-left, 0px); --ds: env(safe-area-inset-right, 0px);
}
/* la nuit, par défaut (data-theme="nuit", ou rien) ; le jour seulement sous data-theme="jour" */
:root:not([data-theme="jour"]) {
  color-scheme: dark;
  --papier: #1b1117; --surface: #2e2128; --encre: #f3eee9; --gris: #b7b0ae; --filet: #3b3036;
  --magenta: var(--saison-texte-nuit); --magenta-fonce: var(--saison-fonce-nuit); --magenta-doux: var(--saison-doux-nuit); --sur-magenta: #1b1117; --pieuvre: var(--saison-texte-nuit);
}
:root[data-theme="jour"] { color-scheme: light; }
.sr { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; clip-path: inset(50%) !important; white-space: nowrap !important; }
/* l'en-tête et le pied, comme l'espace des salles */
.barre { max-width: 600px; margin: 0 auto; padding: 18px calc(20px + var(--ds)) 0 calc(20px + var(--gs)); }
.pied-espace { max-width: 600px; margin: 0 auto; padding: 14px calc(20px + var(--ds)) 30px calc(20px + var(--gs)); }
/* la marque de l'en-tête, comme dans l'administration et l'espace de l'équipe : la pieuvre (../admin/tentacules.js la pose
   dans [data-pieuvre], d'après ../admin/logo.js), « Compagnie Crescite », et dessous le nom de l'espace ; elle mène au site */
/* le lien d'évitement, comme sur le site et dans les autres espaces : il paraît au premier Tab */
.evitement { position: absolute; left: 8px; top: -80px; z-index: 90; padding: 10px 14px; border-radius: 10px; background: var(--encre); color: var(--papier); font-weight: 600; text-decoration: none; }
.evitement:focus { top: 8px; color: var(--papier); }
.marque { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--encre); text-decoration: none; min-width: 0; }
.marque:hover { color: var(--encre); }
.marque .pieuvre { display: inline-block; flex: none; width: 46px; height: 26px; color: var(--pieuvre); }
.marque .pieuvre:empty { display: none; }
.marque .pieuvre svg { display: block; width: 100%; height: 100%; overflow: visible; }
.marque-texte { display: grid; gap: 4px; line-height: 1.1; min-width: 0; }
.marque-nom { font: 500 1.12rem/1.1 var(--serif); }
.marque small { font: 700 .66rem/1 var(--etiq); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
/* le pied commun des espaces réservés : sobre, en fin de contenu */
.pied-espace { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; border-top: 1px solid var(--filet); color: var(--gris); font-size: .84rem; }
.pied-espace .pied-nom { margin: 0; font: 500 .95rem/1.3 var(--serif); color: var(--encre); }
.pied-espace nav { display: flex; flex-wrap: wrap; gap: 2px 16px; }
.pied-espace a { display: inline-block; padding: 6px 0; color: var(--gris); }
.pied-espace a:hover { color: var(--magenta); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--papier); color: var(--encre); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
a { color: var(--magenta); text-underline-offset: .18em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
h1, p { margin: 0; }

main { max-width: 600px; margin: 0 auto; padding: 18px calc(20px + var(--ds)) 40px calc(20px + var(--gs)); }
.sur { color: var(--magenta); font: 700 .78rem/1.3 var(--etiq); letter-spacing: .14em; text-transform: uppercase; }
h1 { font: 500 clamp(1.6rem, 6vw, 2.3rem)/1.15 var(--serif); margin: 8px 0 4px; letter-spacing: -.01em; }
.spectacle { font: italic 500 1.12rem/1.3 var(--serif); color: var(--gris); }
.bonjour { margin-top: 18px; }
.message { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--magenta-doux); white-space: pre-line; }
.chargement { padding: 56px 0; color: var(--gris); text-align: center; }

/* le choix venu du courriel, à confirmer */
.confirmer { margin-top: 22px; padding: 18px; border-radius: 18px; background: var(--surface); border: 2px solid var(--magenta); }
.confirmer p { font-weight: 600; }
.confirmer .jour { display: block; font-weight: 400; color: var(--gris); }
.confirmer .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 14px; }
.principal { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--magenta); color: var(--sur-magenta); font-weight: 700; cursor: pointer; }
.principal:hover { background: var(--magenta-fonce); }
.principal:disabled, .secondaire:disabled { opacity: .6; cursor: default; }
.secondaire { padding: 0; border: 0; background: none; color: var(--gris); text-decoration: underline; text-underline-offset: .18em; cursor: pointer; }

.etat { margin-top: 18px; padding: 12px 16px; border-left: 4px solid var(--magenta); border-radius: 0 12px 12px 0; background: var(--surface); font-weight: 600; }
.etat:empty { display: none; }

/* les jours, et les trois réponses de chacun */
.jours { list-style: none; margin: 22px 0 0; padding: 0; border-top: 1px solid var(--filet); }
.jours li { padding: 16px 0; border-bottom: 1px solid var(--filet); }
.jours li.vise { margin: 0 -12px; padding: 16px 12px; border-radius: 14px; background: var(--magenta-doux); border-bottom-color: transparent; }
.jours .j { display: block; font-weight: 650; margin-bottom: 10px; }
.choix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.choix button { min-height: 48px; padding: 6px 8px; border-radius: 14px; border: 1.5px solid var(--magenta); background: transparent; font-weight: 600; line-height: 1.2; cursor: pointer; transition: background-color .15s, color .15s, transform .12s; }
.choix button[aria-pressed="true"] { background: var(--magenta); color: var(--sur-magenta); }
.choix button:active { transform: scale(.96); }
.choix button:disabled { opacity: .5; cursor: default; transform: none; }
.choix button.en-cours { opacity: .7; }
.note { margin-top: 8px; color: var(--magenta); font-weight: 600; font-size: .94rem; }
.note:empty { display: none; }
.close { margin-top: 18px; color: var(--gris); }
.pied { margin-top: 26px; color: var(--gris); font-size: .94rem; }
.pied p + p { margin-top: 6px; }

/* une alerte de tournée : ses secteurs (le spectacle à la ligne), et ce qu'on peut en faire */
.secteurs { list-style: none; margin: 12px 0 0; padding: 0; }
.secteurs li { padding: 10px 14px; border-radius: 12px; background: var(--magenta-doux); font-weight: 600; }
.secteurs li + li { margin-top: 6px; }
.secteurs li span { display: block; font-weight: 400; color: var(--gris); }
.confirmer .note-alerte { margin-top: 12px; font-weight: 400; color: var(--gris); font-size: .94rem; }
.confirmer .actions:first-child { margin-top: 0; }
@media (prefers-reduced-motion: reduce) { .choix button { transition: none; } .choix button:active { transform: none; } }
</style>
<style id="couleurs-saison">/* écrit par site/build.py : les couleurs de la saison (cassandres) */ :root { --saison: #1f3a73; --saison-vive: #7f9fe0; --saison-porteur: #45629f; --saison-profond: #11203f; --saison-texte: #1f3a73; --saison-fonce: #192e5c; --saison-doux: #e4e6e9; --saison-texte-nuit: #7f9fe0; --saison-fonce-nuit: #a5bce9; --saison-doux-nuit: #313043; }</style>
</head>
<body>
<a class="evitement" href="#page">Aller au contenu</a>
<header class="barre">
  <a class="marque" href="../"><span class="pieuvre" data-pieuvre aria-hidden="true"></span><span class="marque-texte"><span class="marque-nom">Compagnie Crescite</span><small>Vos réponses</small></span><span class="sr"> : le site de la compagnie</span></a>
</header>
<main id="page" tabindex="-1" aria-busy="true">
  <p class="chargement">Chargement de la proposition…</p>
</main>
<footer class="pied-espace"><p class="pied-nom">Compagnie Crescite</p><nav aria-label="La compagnie"><a href="mailto:contact@crescite.fr">Écrire à la compagnie</a><a href="../#/mentions-legales">Mentions légales</a><a href="../#/politique-de-confidentialite">Politique de confidentialité</a></nav></footer>
<script src="../admin/logo.js" defer></script>
<script src="../admin/tentacules.js" defer></script>
<script>
(() => {
  'use strict';
  const FONCTION = 'https://fwjgyfzcbcmfyfkhhtuh.supabase.co/functions/v1/crescite-courriel';
  const CLE = 'sb_publishable__SvO0qVI2BvcBK5vYgxjZQ_U-evgPKD';   // la clé publique du projet (celle du site)
  const CONTACT = 'contact@crescite.fr';
  const CHOIX = { oui: 'Disponible', non: 'Pas disponible', peut_etre: 'Peut-être' };
  const main = document.getElementById('page');
  // « Aller au contenu » : le titre reçoit le focus, l'adresse (qui porte la proposition) ne change pas
  document.querySelector('.evitement').addEventListener('click', e => { e.preventDefault(); const h = main.querySelector('h1') || main; if (h !== main) h.setAttribute('tabindex', '-1'); h.focus(); });
  const q = new URLSearchParams(location.search || location.hash.replace(/^#/, ''));
  const r = q.get('r') || '';
  let vise = { j: q.get('j'), c: q.get('c') };          // le choix fait dans le courriel, à confirmer
  let v = null, message = '';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const jourTexte = (debut, fin, journee) => {
    const d = new Date(debut), f = new Date(fin);
    const jour = x => new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Paris' }).format(x);
    const heure = x => new Intl.DateTimeFormat('fr-FR', { hour: 'numeric', minute: '2-digit', timeZone: 'Europe/Paris' }).format(x).replace(':', 'h').replace(/h00$/, 'h');
    let t;
    if (journee) { const dernier = new Date(f.getTime() - 86400e3); t = dernier > d ? `du ${jour(d)} au ${jour(dernier)}` : jour(d); }
    else t = `${jour(d)}, ${heure(d)} – ${heure(f)}`;
    return t.charAt(0).toUpperCase() + t.slice(1);
  };

  async function appeler(corps) {
    const res = await fetch(FONCTION, { method: 'POST', cache: 'no-store', headers: { apikey: CLE, 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`réponse ${res.status}`);
    return res.json();
  }

  // le choix du courriel n'est plus à confirmer : on le retire de l'adresse (un rechargement ne le repropose pas)
  function oublierVise() {
    vise = { j: null, c: null };
    try { history.replaceState(null, '', `${location.pathname}?r=${encodeURIComponent(r)}`); } catch (e) { /* adresse inchangée */ }
  }

  function introuvable() {
    document.title = 'Lien expiré · Compagnie Crescite';
    main.innerHTML = `<p class="sur">Proposition de dates</p><h1>Ce lien n’est plus valable</h1>
      <p class="bonjour">Écrivez-nous pour recevoir de nouveau la proposition : <a href="mailto:${CONTACT}">${CONTACT}</a>.</p>`;
  }

  function panne(fn, titre = 'La proposition n’a pas pu s’ouvrir') {
    main.innerHTML = `<p class="sur">Vos réponses</p><h1>${titre}</h1>
      <p class="bonjour">Vérifiez la connexion, puis réessayez.</p>
      <p class="bonjour"><button class="principal" type="button" data-reessayer>Réessayer</button></p>`;
    main.querySelector('[data-reessayer]').addEventListener('click', fn);
  }

  function rendre() {
    const p = v.proposition, close = p.statut === 'close';
    const jours = v.jours || [];
    const cible = jours.find(j => String(j.id) === vise.j);
    const aConfirmer = !close && cible && CHOIX[vise.c] && cible.reponse !== vise.c;
    if (cible && cible.reponse === vise.c && !message) message = `C’est déjà noté : ${CHOIX[vise.c].toLowerCase()}, ${jourTexte(cible.debut, cible.fin, cible.journee).toLowerCase()}.`;
    document.title = `${p.titre} · Compagnie Crescite`;
    main.innerHTML = `<p class="sur">Des dates vous sont proposées</p>
      <h1>${esc(p.titre)}</h1>
      ${p.spectacle ? `<p class="spectacle">${esc(p.spectacle)}</p>` : ''}
      <p class="bonjour">Bonjour ${esc(v.prenom)}, la compagnie vous propose ${jours.length > 1 ? 'ces dates' : 'cette date'}. Êtes-vous disponible ?</p>
      ${p.message ? `<p class="message">${esc(p.message)}</p>` : ''}
      ${aConfirmer ? `<section class="confirmer" aria-labelledby="confirmer-titre">
        <p id="confirmer-titre">Votre réponse : ${esc(CHOIX[vise.c])}<span class="jour">${esc(jourTexte(cible.debut, cible.fin, cible.journee))}</span></p>
        <div class="actions"><button class="principal" type="button" data-confirmer>Confirmer</button>
        <button class="secondaire" type="button" data-autre>Répondre autrement</button></div></section>` : ''}
      <p class="etat" role="status" aria-live="polite" tabindex="-1">${esc(message)}</p>
      ${close ? '<p class="close">Cette proposition est close : merci.</p>' : ''}
      <ul class="jours">${jours.map(j => {
        const t = jourTexte(j.debut, j.fin, j.journee);
        return `<li data-jour="${j.id}"${aConfirmer && j === cible ? ' class="vise"' : ''}><span class="j" id="j${j.id}">${esc(t)}</span>
          <div class="choix" role="group" aria-labelledby="j${j.id}">${Object.entries(CHOIX).map(([c, l]) =>
            `<button type="button" data-jour="${j.id}" data-c="${c}" aria-pressed="${j.reponse === c}"${close ? ' disabled' : ''}>${l}</button>`).join('')}</div>
          <p class="note" role="status" aria-live="polite"></p></li>`;
      }).join('')}</ul>
      <div class="pied"><p>Vous pouvez aussi répondre dans <a href="../equipe/#/proposition/${encodeURIComponent(p.id)}">votre espace</a>.</p>
      <p>Une question ? <a href="mailto:${CONTACT}">${CONTACT}</a></p></div>`;
    main.removeAttribute('aria-busy');
  }

  // les boutons d'un jour suivent sa réponse
  function majJour(j) {
    main.querySelectorAll(`li[data-jour="${j.id}"] button[data-c]`).forEach(b => {
      b.setAttribute('aria-pressed', String(j.reponse === b.dataset.c));
      b.disabled = v.proposition.statut === 'close';
      b.classList.remove('en-cours');
    });
  }

  async function repondre(j, c, bouton) {
    const li = bouton.closest('li');
    (li ? li.querySelectorAll('button') : [bouton]).forEach(b => { b.disabled = true; });
    bouton.classList.add('en-cours');
    let texte;
    try {
      const w = await appeler({ r, j: Number(j), c });
      if (!w) return introuvable();
      v = w;
      const jour = v.jours.find(x => String(x.id) === String(j));
      texte = w.enregistre
        ? `C’est noté : ${CHOIX[c].toLowerCase()}${jour ? `, ${jourTexte(jour.debut, jour.fin, jour.journee).toLowerCase()}` : ''}. Merci !`
        : (v.proposition.statut === 'close' ? 'Cette proposition est close : la réponse n’a pas été enregistrée.' : 'Cette réponse n’a pas pu être enregistrée.');
    } catch (e) {
      texte = 'La réponse n’a pas pu partir. Vérifiez la connexion, puis réessayez.';
    }
    // le choix venu du courriel, ou une proposition close entre-temps : la page se recompose, la réponse en tête
    if (!li || v.proposition.statut === 'close') {
      oublierVise();
      message = texte;
      rendre();
      main.querySelector('.etat')?.focus();
      return;
    }
    v.jours.forEach(majJour);
    li.querySelector('.note').textContent = texte;
  }

  main.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.hasAttribute('data-confirmer')) return repondre(vise.j, vise.c, b);
    if (b.hasAttribute('data-autre')) {
      const j = vise.j;
      oublierVise(); message = ''; rendre();
      main.querySelector(`li[data-jour="${j}"] button`)?.focus();
      return;
    }
    if (b.dataset.jour && b.getAttribute('aria-pressed') !== 'true') repondre(b.dataset.jour, b.dataset.c, b);
  });

  async function charger() {
    main.setAttribute('aria-busy', 'true');
    main.innerHTML = '<p class="chargement">Chargement de la proposition…</p>';
    if (r.length < 32) return introuvable();
    try {
      v = await appeler({ r });
      if (!v) return introuvable();
      rendre();
    } catch (e) {
      panne(charger);
    }
  }

  // ———— les alertes de tournée : ?alerte=<jeton>&action=confirmer (le courriel de confirmation) ou arreter (le lien
  // au bas de chaque courriel d'alerte). La page montre l'alerte, le bouton agit ; ouvrir le lien ne fait rien
  const jetonAlerte = q.get('alerte') || '';
  const actionAlerte = q.get('action') === 'arreter' ? 'arreter' : 'confirmer';
  const DATES = '../#/saisons';   // les dates de la compagnie, sur le site
  let va = null;                               // l'alerte vue par son jeton : { alerte, attente, autres }
  let faitAlerte = null;                       // ce qui vient d'être fait : { action, n, liste, tout }
  const secteurs = xs => `<ul class="secteurs">${xs.map(a => `<li>${esc(a.secteur)}<span>${esc(a.spectacle || 'Tous les spectacles')}</span></li>`).join('')}</ul>`;
  const piedAlerte = () => `<div class="pied"><p><a href="${DATES}">Les dates de la compagnie</a></p><p>Une question ? <a href="mailto:${CONTACT}">${CONTACT}</a></p></div>`;

  function alerteIntrouvable() {
    document.title = 'Lien expiré · Compagnie Crescite';
    main.innerHTML = `<p class="sur">Alerte de tournée</p><h1 tabindex="-1">Ce lien n’est plus valable</h1>
      <p class="bonjour">L’alerte a peut-être déjà été arrêtée, ou effacée faute de confirmation dans les 30 jours.
      Pour en créer une nouvelle : <a href="${DATES}">les dates de la compagnie</a>.</p>${piedAlerte()}`;
    main.removeAttribute('aria-busy');
  }

  function rendreAlerte(texte = '') {
    const a = va.alerte, attente = va.attente || [], autres = va.autres || 0, plus = attente.length > 1;
    document.title = 'Alerte de tournée · Compagnie Crescite';
    let corps;
    if (faitAlerte && faitAlerte.action === 'arreter') {
      corps = faitAlerte.tout
        ? `<h1 tabindex="-1">Vos alertes sont arrêtées</h1><p class="bonjour">Elles sont effacées, et votre adresse avec elles : vous ne recevrez plus nos courriels d’alerte.</p>`
        : `<h1 tabindex="-1">Votre alerte est arrêtée</h1><p class="bonjour">Elle est effacée : vous ne recevrez plus ses courriels.${autres ? ` ${autres > 1 ? `Vos ${autres} autres alertes continuent` : 'Votre autre alerte continue'}, chacune avec son lien pour l’arrêter.` : ''}</p>`;
    } else if (faitAlerte && faitAlerte.action === 'confirmer') {
      const n = faitAlerte.n;
      corps = `<h1 tabindex="-1">${n > 1 ? 'Vos alertes sont actives' : 'Votre alerte est active'}</h1>
        <p class="bonjour">Merci ! Vous recevrez par courriel les dates de la compagnie confirmées dans ${n > 1 ? 'ces secteurs' : 'ce secteur'} :</p>${secteurs(faitAlerte.liste)}
        <p class="bonjour">Chaque courriel contient un lien pour arrêter l’alerte.</p>`;
    } else if (actionAlerte === 'arreter') {
      corps = `<h1 tabindex="-1">Arrêter votre alerte</h1><p class="bonjour">Cette alerte vous écrit les dates de la compagnie près de chez vous :</p>${secteurs([a])}
        <section class="confirmer" aria-label="Arrêter l’alerte"><p>Vous ne recevrez plus ses courriels, et elle sera effacée.</p>
        <div class="actions"><button class="principal" type="button" data-alerte="arreter">Arrêter cette alerte</button>
        ${autres ? `<button class="secondaire" type="button" data-alerte="arreter-tout">Arrêter toutes mes alertes (${autres + 1})</button>` : ''}</div></section>`;
    } else if (attente.length) {
      corps = `<h1 tabindex="-1">${plus ? 'Confirmez vos alertes' : 'Confirmez votre alerte'}</h1>
        <p class="bonjour">Vous avez demandé à recevoir par courriel les dates de la compagnie près de chez vous :</p>${secteurs(attente)}
        <section class="confirmer" aria-label="Confirmer"><div class="actions"><button class="principal" type="button" data-alerte="confirmer">${plus ? 'Confirmer mes alertes' : 'Confirmer mon alerte'}</button></div>
        <p class="note-alerte">${plus ? 'Tant qu’elles ne sont pas confirmées' : 'Tant qu’elle n’est pas confirmée'}, rien ne vous est envoyé. Ce n’est pas vous ? Fermez simplement cette page.</p></section>`;
    } else if (a.active && a.confirmee) {
      corps = `<h1 tabindex="-1">Votre alerte est déjà active</h1><p class="bonjour">Vous recevez par courriel les dates de la compagnie confirmées dans ce secteur :</p>${secteurs([a])}
        <p class="bonjour"><a href="?alerte=${encodeURIComponent(jetonAlerte)}&amp;action=arreter">Ne plus la recevoir</a></p>`;
    } else {
      corps = `<h1 tabindex="-1">Cette alerte est désactivée</h1><p class="bonjour">La compagnie l’a désactivée : elle ne vous écrit plus.
        Pour en créer une nouvelle : <a href="${DATES}">les dates de la compagnie</a>.</p>`;
    }
    main.innerHTML = `<p class="sur">Alerte de tournée</p>${corps}
      <p class="etat" role="status" aria-live="polite" tabindex="-1">${esc(texte)}</p>${piedAlerte()}`;
    main.removeAttribute('aria-busy');
  }

  async function agirAlerte(action, tout, bouton) {
    main.querySelectorAll('button[data-alerte]').forEach(b => { b.disabled = true; });
    bouton.classList.add('en-cours');
    let texte = '';
    try {
      const w = await appeler({ alerte: jetonAlerte, action, tout });
      if (!w) return alerteIntrouvable();
      if (action === 'confirmer') {
        const liste = va.attente || [];
        va = { alerte: w.alerte, attente: w.attente || [], autres: w.autres || 0 };
        if (w.enregistre) faitAlerte = { action, n: w.confirmees, liste };
        else texte = 'Rien n’attendait sa confirmation : votre alerte était déjà active.';
      } else {
        faitAlerte = { action, n: w.arretees, tout };
      }
    } catch (e) {
      texte = 'Cela n’a pas pu se faire. Vérifiez la connexion, puis réessayez.';
    }
    rendreAlerte(texte);
    (texte ? main.querySelector('.etat') : main.querySelector('h1'))?.focus();
  }

  main.addEventListener('click', e => {
    const b = e.target.closest('button[data-alerte]');
    if (!b || b.disabled || !va) return;
    const quoi = b.dataset.alerte;
    agirAlerte(quoi === 'confirmer' ? 'confirmer' : 'arreter', quoi === 'arreter-tout', b);
  });

  async function chargerAlerte() {
    main.setAttribute('aria-busy', 'true');
    main.innerHTML = '<p class="chargement">Chargement de votre alerte…</p>';
    document.title = 'Alerte de tournée · Compagnie Crescite';
    if (jetonAlerte.length < 32) return alerteIntrouvable();
    try {
      const w = await appeler({ alerte: jetonAlerte });
      if (!w) return alerteIntrouvable();
      va = w;
      rendreAlerte();
    } catch (e) {
      panne(chargerAlerte, 'L’alerte n’a pas pu s’ouvrir');
    }
  }

  if (jetonAlerte) chargerAlerte(); else charger();
})();
</script>
</body>
</html>
