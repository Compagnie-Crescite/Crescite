<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<style>
:root{
  --creme:#f3eee9;
  --creme-2:rgba(243,238,233,.76);
  --papier:#f3eee9;
  --encre:#1a1016;
  --encre-2:#5e5158;
  --trait:rgba(26,16,22,.14);
  --nuit:#140c12;
  --nuit-2:#1d1219;
  --magenta:#bc3e80;
  --magenta-texte:#a8306f;
  --magenta-vif:#ef84b8;
  --muet:var(--creme-2);
  --marge:clamp(16px,4.2vw,64px);
  --interieur:clamp(40px,6.6vw,120px);
  --tete-h:76px;
  --barre-h:0px;
  --ease:cubic-bezier(.22,.7,.12,1);
  --t-ouverture:clamp(2.75rem,min(8.4vw,13.5vh),7.5rem);
  --t-titre:clamp(2.25rem,min(5.6vw,9.4vh),5rem);
  --t-page:clamp(2.125rem,5.2vw,4.75rem);
  --t-grand:clamp(1.875rem,3.6vw,3.25rem);
  --t-moyen:clamp(1.25rem,2vw,1.75rem);
  --t-corps:1.0625rem;
  --t-petit:.875rem;
  /* l'édition sur place (EDITION), dans le style de la 09 : papier crème, encre prune, magenta */
  --ed-fond:#f3eee9;
  --ed-encre:#1a1016;
  --ed-accent:#a8306f;
  --ed-sur-accent:#ffffff;
  --ed-police:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ed-rayon:6px;
  --ed-trait:rgba(26,16,22,.18);
  /* les tentacules (tentacules.js) : la pieuvre du logo guide ; sur la nuit, un magenta vif qui luit ; sur les chapitres clairs, le magenta */
  --tt-encre:#ef84b8;--tt-accent:#ef84b8;--tt-neutre:#bc3e80;--tt-epaisseur:2.4;
}
[data-ton="clair"],.u-clair{--tt-encre:#bc3e80;--tt-accent:#a8306f}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--nuit);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.aimante{scroll-snap-type:y mandatory}
body{margin:0;overflow-x:clip;background:var(--nuit);color:var(--creme);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--t-corps);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
.motif{display:block;pointer-events:none;overflow:visible}

/* l'ouverture commune, dans le dégradé prune de la 09 : le dégradé suit l'écran, pas le grand rectangle */
.intro.m09-intro .intro-fond{x:0;y:0;width:100%;height:100%}
.intro.m09-intro .intro-indice{color:var(--creme)}

/* lien d'évitement */
.evitement{position:fixed;left:var(--marge);top:12px;z-index:100;padding:10px 18px;border-radius:999px;background:var(--creme);color:var(--encre);font-weight:600;text-decoration:none;transform:translateY(-160%);transition:transform .2s}
.evitement:focus{transform:none}

/* ---------- l'en-tête : la marque, les trois entrées (navigation première), le menu second ---------- */
.tete{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--tete-h);display:flex;align-items:center;gap:clamp(12px,1.6vw,28px);padding:0 var(--marge);color:var(--creme);transition:color .45s var(--ease)}
.tete::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(20,12,18,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background-color .45s var(--ease),box-shadow .45s var(--ease)}
.tete[data-ton="clair"]{color:var(--encre)}
.tete[data-ton="clair"]::before{background:rgba(243,238,233,.95);box-shadow:0 1px 0 var(--trait)}
.marque{display:inline-flex;align-items:center;gap:12px;flex:none;text-decoration:none;border-radius:4px}
.marque-pieuvre{width:58px;flex:none;color:#fff;transition:color .45s var(--ease)}
.tete[data-ton="clair"] .marque-pieuvre{color:var(--magenta)}
.marque-pieuvre svg{width:100%;height:auto}
.marque-mot{font-size:1.3125rem;font-weight:600;line-height:1;letter-spacing:-.02em;margin-top:-3px}
.entrees{flex:1;min-width:0;display:flex;justify-content:center}
.entrees ul{display:flex;align-items:center;gap:4px;flex:none}
.entree{--ec:var(--ev);position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;font-size:.875rem;font-weight:500;line-height:1.2;white-space:nowrap;text-decoration:none;transition:background-color .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease)}
.tete[data-ton="clair"] .entree{--ec:var(--e)}
.bras-e{flex:none;width:20px;height:20px;fill:none;stroke:var(--ec,currentColor);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.entree:hover{box-shadow:inset 0 0 0 1px var(--ec)}
.entree[aria-current="page"]{background:var(--ec);color:var(--nuit);font-weight:600}
.tete[data-ton="clair"] .entree[aria-current="page"]{color:#fff}
.entree[aria-current="page"] .bras-e{stroke:currentColor}
.entree[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--ec);font-weight:600}
.entree:focus-visible{outline-offset:2px}
.e-court{display:none}
.tete.court .e-long{display:none}
.tete.court .e-court{display:inline}
.second{flex:none}
.second ul{display:flex;align-items:center;gap:clamp(14px,1.3vw,22px);padding-left:clamp(14px,1.4vw,24px);border-left:1px solid color-mix(in srgb,currentColor 26%,transparent)}
.second a{position:relative;display:block;padding:8px 0;font-size:.8125rem;font-weight:500;letter-spacing:.02em;white-space:nowrap;text-decoration:none;opacity:.86}
.second a:hover{opacity:1;text-decoration:underline}
.second a[aria-current="page"]{opacity:1;font-weight:600}
.second a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--magenta-vif)}
.tete[data-ton="clair"] .second a[aria-current="page"]::after{background:var(--magenta)}
.menu-bouton{display:none;flex:none;align-items:center;gap:10px;padding:10px 2px;font-size:.9375rem;font-weight:500}
.menu-icone{position:relative;display:block;width:22px;height:10px}
.menu-icone::before,.menu-icone::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .35s var(--ease),top .35s var(--ease)}
.menu-icone::before{top:0}
.menu-icone::after{top:8.5px}
.tete.menu-ouvert .menu-icone::before{top:4.25px;transform:rotate(45deg)}
.tete.menu-ouvert .menu-icone::after{top:4.25px;transform:rotate(-45deg)}

/* le sommaire des chapitres (bureau) : l'accueil, et la page d'un spectacle */
.sommaire{display:none}

/* ---------- l'accueil : le choix, puis un spectacle par écran, la saison en carte, les donateurs ---------- */
.choix{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;padding:calc(var(--tete-h) + 12px) var(--marge) calc(14px + var(--barre-h));background:radial-gradient(90% 75% at 50% 42%,#3c1630 0%,#1a0d17 58%,#110a0f 100%);color:var(--creme)}
.portes{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.porte-li{position:relative;display:flex;min-height:0}
.porte{position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:12px;min-height:clamp(150px,calc((100svh - var(--tete-h) - var(--barre-h) - 96px) / 3),420px);padding:20px 20px 22px;overflow:hidden;border-radius:4px;background:var(--nuit-2);color:#fff;text-decoration:none}
.porte::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,color-mix(in srgb,var(--e) 90%,#000) 0%,color-mix(in srgb,var(--e) 62%,transparent) 34%,rgba(12,7,10,.18) 70%,rgba(12,7,10,.52) 100%)}
.porte::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--ev);transform:scaleX(.18);transform-origin:left;transition:transform .7s var(--ease)}
.porte:hover::after,.porte:focus-visible::after{transform:none}
.porte-photo{position:absolute;inset:0;z-index:-2;overflow:hidden}
.porte-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.85);transition:transform 1.4s var(--ease)}
.porte:hover .porte-photo img,.porte:focus-visible .porte-photo img{transform:scale(1.05)}
.porte .bras-e{--ec:var(--ev);width:40px;height:40px;stroke-width:1.6}
.porte-titre{font-family:Gloock,Georgia,serif;font-size:clamp(1.625rem,3vw,3.25rem);line-height:1.04;letter-spacing:-.01em;max-width:11em;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.porte-fleche{position:absolute;top:18px;right:18px;display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(255,255,255,.72);border-radius:50%;transition:transform .5s var(--ease),background-color .4s,border-color .4s,color .4s}
.porte-fleche svg{width:20px;height:20px}
.porte:hover .porte-fleche,.porte:focus-visible .porte-fleche{background:var(--ev);border-color:var(--ev);color:var(--nuit);transform:translateX(4px)}
.porte:focus-visible{outline:3px solid var(--ev);outline-offset:3px}
.porte-credit{position:absolute;left:14px;top:12px;z-index:1;max-width:60%;font-size:.6875rem;line-height:1.3;color:rgba(255,255,255,.84);text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
.choix-suite{align-self:center;display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--creme-2)}
.choix-suite svg{width:20px;height:20px}
.choix-suite:hover{color:var(--creme)}

.chap{position:relative;isolation:isolate;overflow:hidden;background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.chap::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 60% at 50% 100%,var(--u-lueur),transparent 72%)}
.chap-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--u-fond2)}
.chap-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chap-credit{position:absolute;right:14px;bottom:10px;z-index:1;max-width:80%;font-size:.75rem;line-height:1.4;text-align:right;color:rgba(255,255,255,.86);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.chap-motif{position:absolute;z-index:-1;right:-10%;bottom:-8%;width:min(70vw,440px);color:var(--u-vif);opacity:.15;stroke-width:3}
.chap-texte{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:30px var(--marge) 64px}
.chap-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:14px;font-size:var(--t-petit);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.chap-lt{color:var(--u-texte2)}
.chap-lt::before{content:"";display:inline-block;width:18px;height:1px;margin-right:12px;vertical-align:middle;background:currentColor}
.chap-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-titre);line-height:1.02;letter-spacing:-.01em;max-width:10.5em;text-wrap:balance;color:var(--u-vif);text-shadow:0 0 48px var(--u-lueur)}
.chap-titre.long{font-size:clamp(2rem,min(4.4vw,7.4vh),4rem)}
.chap-sous{margin-top:12px;font-size:1.0625rem;color:var(--u-texte2)}
.chap-accroche{margin-top:22px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;max-width:22em;text-wrap:pretty}
.chap-ac{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:22px;padding:9px 16px;border:1px solid color-mix(in srgb,var(--u-vif) 60%,transparent);border-radius:4px}
.chap-ac-lib{font-size:.6875rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--u-texte2)}
.chap-ac-type{font-family:Gloock,Georgia,serif;font-size:1.125rem;line-height:1.25}
.chap-tournee{margin-top:24px;max-width:26rem}
.chap-tournee .surtitre::before{content:"";width:28px;height:2px;background:var(--u-vif)}
.surtitre{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muet)}
.chap-date-quand{margin-top:8px;font-weight:600}
.chap-date-ou,.chap-note{color:var(--u-texte2)}
.chap-note{margin-top:8px}
.chap-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:28px}
.chap-entrees{display:flex;flex-wrap:wrap;gap:2px 16px}
.chap-entrees a{--ec:var(--ev);display:inline-flex;align-items:center;gap:6px;padding:6px 0;font-size:.875rem;font-weight:500;text-decoration:none}
.u-clair .chap-entrees a{--ec:var(--e)}
.chap-entrees a:hover{text-decoration:underline}
.chap-entrees .bras-e{width:18px;height:18px}
.bouton{display:inline-flex;align-items:center;gap:14px;padding:14px 22px 14px 26px;border-radius:999px;background:var(--u-vif,var(--magenta-vif));color:var(--u-sur,var(--nuit));font-weight:600;font-size:1rem;line-height:1.2;text-decoration:none;transition:box-shadow .45s var(--ease)}
.bouton .fleche{display:inline-block;transition:transform .45s var(--ease)}
.bouton:hover{box-shadow:0 14px 34px -14px color-mix(in srgb,var(--u-vif,var(--magenta-vif)) 80%,transparent)}
.bouton:hover .fleche{transform:translateX(5px)}
.pastille{display:inline-block;padding:2px 10px 1px;border:1px solid currentColor;border-radius:999px;font-size:.8125rem;font-weight:500;letter-spacing:.06em;line-height:1.5;white-space:nowrap}

/* le chapitre de la carte : la saison, mois par mois, les bras poussent au fil du défilement */
.chap-carte{position:relative;height:calc(100vh + var(--pas,8) * 42vh + 50vh);height:calc(100svh + var(--pas,8) * 42svh + 50svh);background:var(--nuit);color:var(--creme)}
.cc-scene{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:minmax(0,50fr) minmax(0,50fr)}
.cc-scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 105%,rgba(188,62,128,.14),transparent 70%)}
.cc-carte{position:relative;min-height:0;margin-top:var(--tete-h);-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
.cc-svg{position:absolute;inset:0;width:100%;height:100%;max-width:none;overflow:hidden}
.cc-pays{fill:rgba(243,238,233,.035);stroke:rgba(243,238,233,.32);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cc-voisin{fill:none;stroke:rgba(243,238,233,.15);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 4}
.cc-traces{fill:none;stroke:rgba(243,238,233,.24);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cc-b{opacity:.95;transition:opacity .5s var(--ease)}
.cc-b.est-passe{opacity:.4}
.cc-s{fill:none;stroke:var(--magenta-vif);stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.cc-p{fill:none;stroke:#fff;stroke-width:0;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke-width .4s var(--ease),stroke .4s}
.cc-p.est-pousse{stroke-width:5;stroke:rgba(243,238,233,.72)}
.cc-p.est-actif{stroke-width:10;stroke:#fff}
.cc-rouen{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cc-onde{fill:none;stroke:var(--magenta-vif);stroke-width:11;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
.cc-noms{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cc-nom{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s var(--ease)}
.cc-nom > span{position:absolute;left:12px;top:0;transform:translateY(-52%);white-space:nowrap;font-family:Gloock,Georgia,serif;font-size:1.25rem;line-height:1;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.6)}
.cc-nom.a-gauche > span,.cc-nom.vers-gauche > span{left:auto;right:12px}
.cc-nom.a-gauche.vers-droite > span{left:12px;right:auto}
.cc-nom.est-visible,.cc-nom-rouen{opacity:1}
.cc-nom-rouen > span{left:12px;top:-14px;font-family:Inter,system-ui,sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta-vif)}
.cc-texte{position:relative;display:flex;flex-direction:column;min-height:0;padding:4px var(--marge) calc(22px + var(--barre-h))}
.cc-sur::before{content:"";width:28px;height:2px;background:var(--magenta-vif)}
.cc-titre{margin-top:8px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.875rem,4.2vw,3.5rem);line-height:1;letter-spacing:-.012em}
.cc-rail{position:relative;flex:1;min-height:0;margin-top:14px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 0,#000 70%,transparent)}
.cc-liste{position:absolute;left:0;right:0;top:0;will-change:transform}
.cc-m{padding-bottom:30px;opacity:.2;transition:opacity .5s var(--ease)}
.cc-m.est-actif{opacity:1}
.cc-m-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.5rem,2.4vw,2.25rem);line-height:1.05;color:var(--magenta-vif)}
.cc-lignes{margin-top:10px;max-width:30rem}
.cc-ligne{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;padding:8px 0;border-top:1px solid rgba(243,238,233,.12)}
.cc-quand{font-weight:600}
.cc-ou{color:var(--creme-2)}
.cc-quoi{display:flex;align-items:center;gap:8px;font-size:var(--t-petit);color:var(--creme-2);flex:1 1 60%}
.cc-quoi::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c,currentColor)}
.cc-sco{font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--creme-2);border:1px solid rgba(243,238,233,.3);border-radius:999px;padding:0 8px}
.cc-bouton{align-self:flex-start;margin-top:14px;background:var(--ev);color:var(--nuit)}
.chap-carte.est-statique{height:auto}
.chap-carte.est-statique .cc-scene{position:relative;height:auto;overflow:visible;display:block}
.chap-carte.est-statique .cc-carte{height:min(64vh,540px);-webkit-mask-image:none;mask-image:none}
.chap-carte.est-statique .cc-texte{padding-bottom:72px}
.chap-carte.est-statique .cc-rail{overflow:visible;-webkit-mask-image:none;mask-image:none}
.chap-carte.est-statique .cc-liste{position:static;transform:none!important}
.chap-carte.est-statique .cc-m{opacity:1}

/* la fin de l'accueil : les donateurs, discrets */
.fin{background:var(--papier);color:var(--encre);padding:clamp(56px,10vh,104px) var(--marge)}
.fin-int{max-width:1320px;margin:0 auto}
.donateurs{max-width:64em;font-size:var(--t-petit);line-height:1.75;color:var(--encre-2)}

/* ---------- les pages, sur papier ---------- */
.libre{background:var(--papier);color:var(--encre);--muet:var(--encre-2)}
.bloc{padding:clamp(64px,11vh,120px) var(--marge)}
.bloc + .bloc{padding-top:0}
.grille{display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(16px,2.2vw,32px);max-width:1320px;margin:0 auto}
.page > .bloc:first-child{padding-top:calc(var(--tete-h) + clamp(44px,8vh,96px))}
.page-tete{margin-bottom:clamp(36px,6vh,64px)}
.page-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-page);line-height:1;letter-spacing:-.012em;text-wrap:balance;overflow-wrap:break-word}
.surtitre + .page-titre{margin-top:16px}
.surtitre a{text-decoration:none}
.surtitre a:hover{text-decoration:underline}
.bloc-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-grand);line-height:1.04;letter-spacing:-.01em;text-wrap:balance;margin-bottom:clamp(24px,4vh,40px)}
.prose{max-width:38em;font-size:1.0625rem;line-height:1.72;overflow-wrap:break-word}
.prose > * + *{margin-top:1em}
.prose h2{margin-top:1.8em;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.2}
.prose > :first-child h2,.prose > h2:first-child{margin-top:0}
.prose ul{padding-left:1.2em;list-style:disc}
.prose li + li{margin-top:.55em}
.prose a{color:var(--magenta-texte)}
.partenaires{max-width:42em;font-size:var(--t-petit);line-height:1.75;color:var(--muet)}

/* l'en-tête d'une entrée : un écran de nuit, la couleur de l'entrée, un bras qui la traverse */
.ent-tete{position:relative;isolation:isolate;overflow:hidden;padding:calc(var(--tete-h) + clamp(36px,9vh,110px)) var(--marge) clamp(40px,8vh,96px);background:radial-gradient(70% 120% at 0% 0%,color-mix(in srgb,var(--ev) 22%,transparent),transparent 62%),radial-gradient(60% 90% at 100% 100%,color-mix(in srgb,var(--e) 30%,transparent),transparent 70%),var(--nuit);color:var(--creme)}
.ent-tete::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ev)}
.ent-int{position:relative;max-width:1320px;margin:0 auto}
.ent-bras{position:absolute;z-index:-1;right:-4%;bottom:-8%;width:min(80vw,780px);height:auto;fill:none;stroke:var(--ev);stroke-width:2.4;stroke-linecap:round;opacity:.5}
.ent-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-page);line-height:1;letter-spacing:-.012em;max-width:13em;text-wrap:balance}
.page-entree .bloc-titre::before{content:"";display:block;width:44px;height:3px;margin-bottom:18px;background:var(--e)}
.page-entree .bouton:not(.u *){background:var(--e);color:#fff}
.ecrire-cta{display:inline-flex;align-items:center;gap:16px;padding:16px 26px 16px 30px;border-radius:999px;background:var(--e,var(--u-vif));color:#fff;font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,2vw,1.625rem);line-height:1.2;text-decoration:none;transition:box-shadow .45s var(--ease)}
.ecrire-cta .fleche{transition:transform .45s var(--ease)}
.ecrire-cta:hover{box-shadow:0 16px 36px -16px color-mix(in srgb,var(--e,var(--u-vif)) 85%,transparent)}
.ecrire-cta:hover .fleche{transform:translateX(5px)}
.fiche .ecrire-cta{background:var(--u-vif);color:var(--u-sur)}

/* l'agenda : la carte dans un écran de nuit, reliée à la liste */
.ecran{position:relative;margin-bottom:40px;padding:clamp(12px,2vw,24px);border-radius:6px;background:radial-gradient(70% 55% at 40% 20%,rgba(188,62,128,.3),rgba(188,62,128,0) 72%),var(--nuit);color:var(--creme)}
.ecran .carte{width:100%;height:auto;max-height:calc(100vh - var(--tete-h) - 150px);margin:0 auto}
.carte-filtre{display:flex;align-items:center;min-height:40px;margin-top:6px}
.filtre-puce{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:var(--magenta-vif);color:var(--nuit);font-weight:600;font-size:var(--t-petit)}
.ecran-u .filtre-puce{background:var(--u-bras);color:var(--nuit)}
.dates-groupe + .dates-groupe{margin-top:44px}
.dates-mois{padding-bottom:12px;border-bottom:1px solid currentColor;font-size:var(--t-petit);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.date{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:4px 20px;padding:18px 10px 20px 12px;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent);transition:background-color .3s,box-shadow .3s}
.date.est-survol{background:color-mix(in srgb,var(--point) 12%,transparent);box-shadow:inset 3px 0 0 var(--point)}
.date-quand{min-width:0}
.date-jour{display:block;font-family:Gloock,Georgia,serif;font-size:1.5rem;line-height:1.1;overflow-wrap:break-word}
.date-moisan{display:block;margin-top:4px;font-size:var(--t-petit);color:var(--muet)}
.date-corps{min-width:0}
.date-quoi a,.date-quoi > span{display:inline-flex;align-items:baseline;gap:10px;font-weight:600;text-decoration:none}
.date-quoi a:hover{text-decoration:underline}
.date-point{flex:none;width:9px;height:9px;border-radius:50%;background:var(--point);transform:translateY(-1px)}
.date-ou{font-weight:500}
.date-quoi + .date-ou{font-weight:400}
.date-details{margin-top:4px;color:var(--muet);overflow-wrap:anywhere}
.date-details li + li{margin-top:4px}
.date .pastille{margin-top:6px}
.date.est-annule .date-jour,.date.est-annule .date-ou{text-decoration:line-through}
/* l'agenda passé : une saison par bloc, fermée au départ ; sa petite carte, un écran de nuit aux bras clairs */
.ag-outils{display:grid;gap:14px;margin-bottom:34px}
.recherche{position:relative;display:block;max-width:24rem}
.recherche .ic{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--encre-2)}
.recherche input{width:100%;min-height:46px;padding:0 16px 0 44px;border:1.5px solid var(--encre);border-radius:999px;background:#fff;font:400 1rem Inter,system-ui,sans-serif;color:var(--encre)}
.recherche input:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.cps{display:flex;flex-wrap:wrap;gap:8px}
.cp{display:inline-flex;align-items:center;gap:9px;padding:6px 15px;border:1.5px solid var(--trait);border-radius:999px;background:#fff;font:500 .9rem/1.25 Inter,system-ui,sans-serif;color:var(--encre);cursor:pointer;text-align:left;transition:border-color .2s,background .2s,color .2s}
.cp i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--point,var(--magenta))}
.cp:hover{border-color:var(--encre)}
.cp[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--creme)}
.carte-m09 .hors{opacity:.14}
.ag-index{position:sticky;top:var(--tete-h);z-index:20;display:flex;align-items:center;gap:10px;margin-bottom:4px;padding:10px 0;background:var(--papier);border-bottom:2px solid var(--encre)}
.ag-index ul{flex:1 1 auto;min-width:0;display:flex;gap:8px;margin:0;padding:3px 2px;list-style:none;overflow-x:auto;scrollbar-width:none}
.ag-index li{flex:none}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--trait);background:#fff;color:var(--encre);font:600 .92rem/1.2 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.idx{min-height:40px;padding:0 16px;border-radius:999px}
.idx small{font-size:.8rem;font-weight:500;color:var(--encre-2)}
.idx:hover,.idx-tout:hover{border-color:var(--encre)}
.idx[aria-expanded="true"]{border-color:var(--magenta);color:var(--magenta-texte)}
.idx-actif{background:var(--magenta-texte);border-color:var(--magenta-texte);color:#fff}
.idx .ic{width:12px;height:12px}
.idx-tout{flex:none;justify-content:center;width:42px;height:42px;padding:0;border-radius:50%}
.idx-tout .ic{width:20px;height:20px}
.sai{border-bottom:1px solid var(--trait);scroll-margin-top:calc(var(--tete-h) + 70px)}
.sai>summary{display:grid;grid-template-columns:clamp(84px,10vw,128px) minmax(0,1fr) auto;align-items:center;gap:6px clamp(16px,2.6vw,34px);padding:18px 8px;list-style:none;cursor:pointer;transition:background .25s}
.sai>summary::-webkit-details-marker{display:none}
.sai>summary:hover,.sai[open]>summary{background:color-mix(in srgb,var(--magenta) 7%,transparent)}
.sai-ecran{display:block;padding:7px;border-radius:6px;background:radial-gradient(70% 55% at 40% 20%,rgba(188,62,128,.3),rgba(188,62,128,0) 72%),var(--nuit)}
.sai-mini{display:block;width:100%;height:auto}
.mi-pays{fill:rgba(243,238,233,.05);stroke:rgba(243,238,233,.4);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mi-bras{fill:var(--magenta-vif)}
.mi-rouen{fill:#fff}
.sai-t{font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.75rem);line-height:1.05;letter-spacing:-.01em}
.sai-sp{display:block;margin-top:6px;font-size:.95rem;line-height:1.45;color:var(--encre-2)}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai-n{display:inline-flex;align-items:center;gap:10px;font-family:Gloock,Georgia,serif;font-size:clamp(1.5rem,1.2rem + 1vw,2.25rem);line-height:1;font-variant-numeric:tabular-nums}
.sai-n .chev{width:22px;height:22px;transition:transform .25s}
.sai[open] .sai-n .chev{transform:rotate(180deg)}
.sai-corps{padding:14px 8px 48px}
.sai-corps:empty{display:none}
.sai-corps .ecran{margin-bottom:28px}
.sai-liste .dates-mois{font-size:var(--t-petit)}
.sai-page{margin-top:22px}
.sai-page a{color:var(--magenta-texte);font-weight:600}
.date .date-ou a{color:inherit;text-decoration-color:var(--trait)}
.date .date-ou a:hover{color:var(--magenta-texte)}
.carte-m09 .carte-lieu.hors{pointer-events:none}
@media (min-width:900px){
  .sai-corps:not(:empty){display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.2vw,32px);align-items:start}
  .sai-corps > .ecran{grid-column:1/span 5;position:sticky;top:calc(var(--tete-h) + 80px);margin-bottom:0}
  .sai-corps > .sai-liste{grid-column:7/-1}
}
@media (max-width:759px){
  .sai>summary{grid-template-columns:64px minmax(0,1fr) auto;padding:14px 2px}
  .sai-n{gap:6px}
  .sai-corps{padding:6px 2px 30px}
  .cps{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--marge));padding:2px var(--marge) 4px;scrollbar-width:none}
  .cp{flex:none}
  .recherche{max-width:none}
}
.saisons-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));column-gap:clamp(16px,2.2vw,32px);border-top:1px solid var(--encre)}
.saisons-liste a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--trait);font-family:Gloock,Georgia,serif;font-size:1.375rem;line-height:1.2;text-decoration:none}
.saisons-liste a::after{content:"→";font-family:Inter,system-ui,sans-serif;font-size:1rem;color:var(--magenta-texte);transition:transform .4s var(--ease)}
.saisons-liste a:hover::after{transform:translateX(4px)}
.saison-sp + .saison-sp{margin-top:56px}
.saison-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.12}
.saison-titre a{text-decoration:none}
.saison-titre a:hover{text-decoration:underline}
.saison-sous{margin-top:6px;color:var(--muet)}
.saison-creation{margin-top:2px;font-size:var(--t-petit);color:var(--muet)}
.saison-dates{margin-top:18px;border-top:1px solid var(--encre)}
.ds{padding:14px 10px 14px 12px;border-bottom:1px solid var(--trait);transition:background-color .3s,box-shadow .3s}
.ds.est-survol{background:rgba(188,62,128,.08);box-shadow:inset 3px 0 0 var(--magenta)}
.ds-ligne{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.ds-ligne a{display:contents;color:inherit}
.ds-quand{font-weight:600}
.ds-ou{color:var(--muet)}
.ds-ligne a:hover .ds-ou{text-decoration:underline}
.ds .pastille{margin-top:6px;color:var(--magenta-texte)}
.ds.est-annule .ds-quand,.ds.est-annule .ds-ou{text-decoration:line-through}

/* les spectacles en tournée (voir) : un petit écran par spectacle, dans son univers */
.minis{display:grid;gap:clamp(12px,1.6vw,22px);grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.mini{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;border-radius:4px;background:var(--u-fond);color:var(--u-texte)}
.mini-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--u-fond2)}
.mini-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.mini:hover .mini-photo img{transform:scale(1.04)}
.mini-corps{flex:1;display:flex;flex-direction:column;gap:8px;padding:18px 20px 24px}
.mini-motif{position:absolute;z-index:-1;right:-34px;bottom:-34px;width:170px;color:var(--u-vif);opacity:.16;stroke-width:5}
.mini-lt{font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-texte2)}
.mini-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.75rem;line-height:1.05;color:var(--u-vif)}
.mini-titre a{text-decoration:none}
.mini-titre a::after{content:"";position:absolute;inset:0;z-index:1}
.mini-titre a:focus-visible{outline:none}
.mini:hover .mini-titre a{text-decoration:underline}
.mini:has(a:focus-visible){outline:2px solid var(--encre);outline-offset:4px}
.mini-accroche{font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.4}

/* le catalogue (programmer) : une fiche par spectacle, dans son univers */
.cats{display:grid;gap:clamp(14px,1.8vw,24px)}
.cat{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);border-radius:4px;background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.cat-photo{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--u-fond2)}
.cat-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat-corps{position:relative;display:grid;gap:18px;align-content:start;padding:clamp(22px,3vw,44px)}
.cat-motif{position:absolute;z-index:-1;right:-50px;bottom:-60px;width:250px;color:var(--u-vif);opacity:.12;stroke-width:4}
.cat-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.8125rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.cat-titre{margin-top:-8px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:clamp(1.875rem,3.4vw,3rem);line-height:1.02;color:var(--u-vif);text-wrap:balance}
.cat-sous{margin-top:-10px;color:var(--u-texte2)}
.cat-actu{justify-self:start;padding:7px 14px;border:1px solid var(--u-vif);border-radius:999px;color:var(--u-vif);font-weight:600;font-size:.9375rem;line-height:1.35}
.cat-cols{display:grid;gap:22px}
.faits{border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.fait{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.fait::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--u-vif);transform:translateY(-2px)}
.fait-fort{font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,1.6vw,1.5rem);line-height:1.22}
.fait-fort::before{width:10px;height:10px;transform:translateY(-6px)}
.cat-fiche{font-size:.9375rem;line-height:1.55}
.fl{padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 12%,transparent)}
.fl-lib{color:var(--u-texte2)}
.cat-liens{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.cat-video{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.cat-video svg{flex:none;width:34px;height:34px;padding:9px;border-radius:50%;background:var(--u-vif);color:var(--u-sur)}
.cat-video:hover span{text-decoration:underline}
details.lieux{border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent);padding-top:12px}
details.lieux summary{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;list-style:none}
details.lieux summary::-webkit-details-marker{display:none}
details.lieux summary::before{content:"+";display:grid;place-items:center;flex:none;width:24px;height:24px;border:1px solid currentColor;border-radius:50%;font-weight:400;line-height:1}
details.lieux[open] summary::before{content:"–"}
details.lieux p{margin-top:12px;font-size:.9375rem;line-height:1.65;color:var(--u-texte2)}
.diffusion-texte{display:grid;gap:28px;align-content:start}

/* l'établissement scolaire : la position de la compagnie, puis une carte par spectacle et son action culturelle */
.ecole-texte{max-width:40em;font-family:Gloock,Georgia,serif;font-size:clamp(1.1875rem,1.7vw,1.5rem);line-height:1.5;text-wrap:pretty}
.acs{display:grid;gap:clamp(14px,1.8vw,24px);grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr))}
.ac{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:clamp(22px,2.4vw,32px);border-radius:4px;background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.ac-motif{position:absolute;z-index:-1;right:-44px;bottom:-44px;width:210px;color:var(--u-vif);opacity:.14;stroke-width:4}
.ac-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.5rem;line-height:1.1;color:var(--u-texte)}
.ac-titre a{text-decoration:none}
.ac-titre a:hover{text-decoration:underline}
.ac-lib{margin-top:4px;font-size:.6875rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--u-texte2)}
.ac-type{margin-top:-6px;font-family:Gloock,Georgia,serif;font-size:clamp(1.75rem,2.6vw,2.25rem);line-height:1.08;color:var(--u-vif);text-wrap:balance}
.ac-vide{font-size:1.375rem;color:var(--u-texte2)}
.ac-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.ac-k{font-weight:700;margin-right:6px}
.ac-texte{font-size:.9375rem;line-height:1.62}
.formule{display:grid;gap:2px;padding:10px 16px;border-left:3px solid var(--u-vif);font-weight:600;line-height:1.45}
.ac-dispositifs{display:grid;gap:4px;font-size:.875rem;line-height:1.55;color:var(--u-texte2)}
.ac-dispositifs a{color:var(--u-vif)}
.ac-liens{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:8px}
.bouton-petit{padding:10px 16px 10px 18px;font-size:.9375rem;gap:10px}
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.cd{display:grid;gap:6px;max-width:640px;margin-top:clamp(24px,4vh,40px);padding:24px 28px 22px;border:1px solid color-mix(in srgb,var(--creme) 34%,transparent);border-radius:24px;background:color-mix(in srgb,var(--creme) 8%,transparent);color:var(--creme);position:relative}
.cd-k{margin:0;font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:inherit;opacity:.76}
.cd-nom b{display:block;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.1}
.cd-role{display:block;margin-top:2px;opacity:.86}
.cd-liens{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:14px}
.cd-mail{display:inline-flex;align-items:center;gap:14px;padding:14px 22px 14px 26px;border-radius:999px;background:var(--ev);color:var(--nuit);font-weight:600;line-height:1.2;text-decoration:none;overflow-wrap:anywhere;transition:box-shadow .45s var(--ease)}
.cd-mail .fleche{display:inline-block;transition:transform .45s var(--ease)}
.cd-mail:hover{box-shadow:0 14px 34px -14px var(--ev)}
.cd-mail:hover .fleche{transform:translateX(5px)}
.cd-tel{font-weight:600;color:inherit}
html:not(.ed-actif) .cd-tel.vide{display:none}
.cd-cond{margin:10px 0 0;font-size:var(--t-petit);opacity:.82}
.cd--s{max-width:none;margin-top:clamp(28px,4vh,44px);padding:18px 22px 16px;border-color:color-mix(in srgb,var(--u-texte) 30%,transparent);border-radius:20px;background:transparent;color:var(--u-texte)}
.cd--s .cd-k{color:var(--u-texte);opacity:.72}
.cd--s .cd-nom b{display:inline;font-size:clamp(1.25rem,1.8vw,1.5rem)}
.cd--s .cd-role{display:inline;margin-left:10px}
.cd--s .cd-liens{margin-top:10px}
.cd--s .cd-mail{padding:10px 16px 10px 18px;background:var(--u-vif);color:var(--u-sur);font-size:.9375rem;gap:10px}
.dos-bt{position:relative;font:inherit;font-weight:600;font-size:.9375rem;border:0;cursor:pointer;text-align:left}
.dos-bt .dos-ico,.dos-bt .dos-bras{flex:none;width:18px;height:18px}
.dos-bt .dos-bras{display:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dos-bt[aria-busy="true"]{cursor:progress}
.dos-bt[aria-busy="true"] .dos-ico{display:none}
.dos-bt[aria-busy="true"] .dos-bras{display:block}
.dos-bras path{stroke-dasharray:1;stroke-dashoffset:1;animation:bras-trace 1.15s var(--ease) infinite}
@keyframes bras-trace{0%{stroke-dashoffset:1}65%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.dos-bras path{animation:none;stroke-dashoffset:0}}
.pr-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin:clamp(24px,3vh,36px) 0 0}
.docs{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:12px}
.docs li>.dos-ico{flex:none;width:18px;height:18px;color:var(--u-vif,var(--e))}
.docs a{font-weight:600;text-underline-offset:.26em}
.ft-docs{margin-top:clamp(20px,3vh,32px)}
.cat-docs{margin-top:4px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.cat-docs .cd-k{margin-bottom:10px;color:var(--u-texte);opacity:.72}
.lien-dossier{font-weight:600;color:var(--u-vif);text-underline-offset:.25em}
.actions-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:clamp(32px,5vh,56px)}
.actions-photos img{width:100%;height:100%;aspect-ratio:1;object-fit:cover}
.actions-photos .a-grand{grid-column:1/-1}
.actions-photos .a-grand img{aspect-ratio:3/2}
.actions-photos .credit{grid-column:1/-1;font-size:.75rem;color:var(--muet)}

/* les spectacles : chacun dans son univers */
.vignettes{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,1.8vw,24px)}
.vignette{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;border-radius:4px;background:var(--u-fond);color:var(--u-texte)}
.vignette-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--u-fond2)}
.vignette-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.vignette:hover .vignette-photo img{transform:scale(1.04)}
.vignette-corps{flex:1;display:flex;flex-direction:column;gap:8px;padding:18px 20px 22px}
.vignette-motif{position:absolute;z-index:-1;right:-36px;bottom:-36px;width:170px;color:var(--u-vif);opacity:.15;stroke-width:5}
.vignette-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.vignette-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.75rem;line-height:1.05;color:var(--u-vif);text-wrap:balance}
.vignette-titre a{text-decoration:none}
.vignette-titre a::after{content:"";position:absolute;inset:0;z-index:1}
.vignette-titre a:focus-visible{outline:none}
.vignette:hover .vignette-titre a{text-decoration:underline}
.vignette:has(a:focus-visible){outline:2px solid var(--encre);outline-offset:4px}
.vignette-sous{font-size:.9375rem;color:var(--u-texte2)}
.vignette-ac{margin-top:auto;padding-top:10px;font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.3}

/* la compagnie, les mentions */
.frise{margin-top:24px;border-top:1px solid var(--encre)}
.frise li{display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--trait)}
.frise-annee{font-family:Gloock,Georgia,serif;font-size:1.5rem;line-height:1;color:var(--magenta-texte)}
.cie-dates{margin-top:64px}
.dir-chapeau{margin-top:-8px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.3;color:var(--encre-2)}
.dir-texte{margin-top:32px}

/* formulaires d'origine */
.formulaire{display:grid;gap:22px;max-width:42rem}
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-weight:500}
.champ input,.champ textarea{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--encre);border-radius:0;background:transparent}
.champ textarea{padding:12px;border:1px solid var(--encre);resize:vertical}
.champ input:focus-visible,.champ textarea:focus-visible{outline:2px solid var(--magenta);outline-offset:3px}
.case{display:flex;align-items:flex-start;gap:12px}
.case input{flex:none;width:20px;height:20px;margin:3px 0 0;accent-color:var(--magenta)}
.case a{color:var(--magenta-texte)}
.champ-calcul{flex-direction:row;align-items:center;gap:14px}
.champ-calcul input{width:4.5rem;text-align:center;border:1px solid var(--encre);padding:8px}
.bouton-plein{display:inline-flex;align-items:center;gap:14px;padding:15px 30px;border-radius:999px;background:var(--encre);color:var(--papier);font-weight:600;line-height:1.2;transition:background-color .3s}
.bouton-plein:hover{background:var(--magenta-texte)}
.coordonnees{margin-top:48px;font-style:normal;color:var(--muet)}
.coordonnees strong{display:block;margin-bottom:6px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.2;color:var(--encre)}

/* ---------- le pied de page ---------- */
.pied{background:var(--nuit);color:var(--creme);padding:clamp(80px,13vh,136px) var(--marge) 36px;--muet:var(--creme-2)}
.pied .grille{row-gap:40px}
.pied-ecrire{display:inline-block;font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.04;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease)}
.pied-ecrire:hover{background-size:100% 1px}
.pied-adresse{margin-top:20px;color:var(--creme-2);font-style:normal}
.pied-facebook{margin-top:10px;color:var(--creme-2)}
.pied-entrees{display:grid;gap:4px;align-content:start}
.pied-entrees a{--ec:var(--ev);display:inline-flex;align-items:center;gap:10px;padding:6px 0;font-weight:500;text-decoration:none}
.pied-entrees a:hover{text-decoration:underline}
.pied-partenaires{max-width:34em;font-size:var(--t-petit);line-height:1.7;color:var(--creme-2)}
.pied-legal{font-size:var(--t-petit);color:var(--creme-2)}
.pied-legal li + li{margin-top:4px}
.pied-bas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;margin-top:clamp(40px,7vh,80px);padding-top:26px;border-top:1px solid rgba(243,238,233,.14);color:var(--creme-2);font-size:var(--t-petit)}
.pied-marque{display:flex;align-items:center;gap:14px;text-decoration:none}
.pied-pieuvre{width:44px;color:var(--creme)}
.pied-pieuvre svg{width:100%;height:auto}
.pied-nav{display:flex;flex-wrap:wrap;gap:8px 22px}
.pied-nav a{text-decoration:none}
.pied-nav a:hover{text-decoration:underline}
.pied-modifier{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 7px 12px;border:1px solid rgba(243,238,233,.36);border-radius:999px;color:var(--creme);font-size:.8125rem;font-weight:600;transition:border-color .3s,background-color .3s}
.pied-modifier svg{width:15px;height:15px}
.pied-modifier:hover{border-color:var(--magenta-vif);background:rgba(239,132,184,.1)}

/* ---------- la page d'un spectacle, dans son univers ---------- */
.fiche{background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.ouverture{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:var(--u-fond);color:var(--u-texte)}
.ouv-photo{position:relative;flex:none;height:54vh;height:54svh;overflow:hidden;background:var(--u-fond2)}
.ouv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ouv-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,var(--u-fond) 0%,var(--u-fond) 3%,color-mix(in srgb,var(--u-fond) 0%,transparent) 46%),linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 26%)}
.ouv-motif{position:absolute;z-index:-1;right:-14%;bottom:-8%;width:min(96vw,620px);color:var(--u-vif);opacity:.16;stroke-width:1.6}
.ouv-haut{position:absolute;top:calc(var(--tete-h) + 18px);left:var(--marge);right:var(--marge);z-index:2;display:flex;justify-content:space-between;gap:20px}
.retour{display:inline-flex;align-items:center;gap:10px;font-weight:500;text-decoration:none;border-radius:4px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.55)}
.retour span{transition:transform .45s var(--ease)}
.retour:hover span{transform:translateX(-4px)}
.ouv-contenu{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 var(--marge) 44px}
.ouv-signe{margin-bottom:12px;font-size:.75rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--u-texte2)}
.ouv-sur{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:16px;font-size:var(--t-petit);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.ouv-sur > span:not(.pastille) + span:not(.pastille)::before{content:"";display:inline-block;width:18px;height:1px;margin-right:14px;vertical-align:middle;background:currentColor}
.ouv-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-ouverture);line-height:.98;letter-spacing:-.012em;max-width:11em;color:var(--u-vif);text-shadow:0 0 60px var(--u-lueur);overflow-wrap:break-word}
.ouv-titre .ligne{display:block}
.ouv-titre .mot{display:inline-block;white-space:nowrap}
.ouv-titre .l{display:inline-block}
.ouv-sous{margin-top:16px;font-size:1.125rem;color:var(--u-texte2)}
.ouv-accroche{margin-top:20px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;max-width:24em;text-wrap:pretty}
.ouv-accroche .m{display:inline}
.ouv-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:28px}
.ouv-cta .ecrire-cta{font-family:Inter,system-ui,sans-serif;font-size:1rem;font-weight:600;padding:14px 22px 14px 26px}
.bouton-ligne{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border:1px solid color-mix(in srgb,var(--u-texte) 40%,transparent);border-radius:999px;font-weight:600;text-decoration:none}
.bouton-ligne:hover{border-color:var(--u-texte)}
.bouton-ligne svg{width:18px;height:18px}
.ouv-credit{position:absolute;right:var(--marge);bottom:14px;z-index:2;max-width:70%;text-align:right;font-size:.75rem;color:var(--u-texte2)}

.onglets{position:relative;z-index:30;background:var(--u-fond2);color:var(--u-texte);border-bottom:1px solid color-mix(in srgb,var(--u-texte) 16%,transparent)}
.onglets ul{display:flex;gap:2px;max-width:1320px;margin:0 auto;padding:0 var(--marge);overflow-x:auto;scrollbar-width:none}
.onglets ul::-webkit-scrollbar{display:none}
.onglets a{--ec:var(--ev);display:inline-flex;align-items:center;gap:8px;padding:16px 14px 13px;border-bottom:3px solid transparent;font-size:.9375rem;font-weight:500;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--u-texte2);transition:color .3s,border-color .3s}
.u-clair .onglets a{--ec:var(--e)}
.onglets a:hover{color:var(--u-texte)}
.onglets a[aria-current="page"]{color:var(--u-texte);border-bottom-color:var(--ec);font-weight:600}
.onglets a:focus-visible{outline-offset:-4px}
.o-court{display:none}
.onglets.court .o-long{display:none}
.onglets.court .o-court{display:inline}

.ch{position:relative;isolation:isolate;padding:clamp(64px,11vh,120px) var(--marge);background:var(--u-fond)}
.ch-alt{background:var(--u-fond2)}
.ch-int{max-width:1320px;margin:0 auto}
.ch-sur{margin-bottom:14px;font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--u-texte2)}
.ch-titre{display:flex;align-items:center;gap:.4em;margin-bottom:clamp(28px,5vh,52px);font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-grand);line-height:1.05;letter-spacing:-.005em;color:var(--u-vif);text-wrap:balance}
.ch-titre .motif{flex:none;width:.82em;height:.82em;stroke-width:18;opacity:.9}
.sous-titre{margin:44px 0 16px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-moyen);line-height:1.15;color:var(--u-texte)}
.sous-titre:first-child{margin-top:0}
.cadre-u{display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:44px}
.cadre-u .pastille{color:var(--u-vif)}
.cadre-texte{font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.1;max-width:18em;text-wrap:balance}
.affirmations{display:grid;gap:26px;margin-bottom:clamp(40px,7vh,72px)}
.affirmation{max-width:26em;padding-left:22px;border-left:3px solid var(--u-vif);font-family:Gloock,Georgia,serif;font-size:clamp(1.375rem,2.6vw,2.125rem);line-height:1.24;text-wrap:pretty}
.lecture{display:grid;gap:clamp(36px,6vh,64px)}
.texte-u{display:grid;gap:1.1em;align-content:start;max-width:38em;font-size:1.125rem;line-height:1.72;overflow-wrap:break-word}
.texte-u a{color:var(--u-vif)}
.vers-liste{display:grid;gap:22px;align-content:start}
.vers{padding:6px 0 6px 24px;border-left:1px solid color-mix(in srgb,var(--u-vif) 55%,transparent)}
.vers p{font-family:Gloock,Georgia,serif;font-size:clamp(1.1875rem,1.8vw,1.5rem);line-height:1.42}
.vers .v{display:block}
.vers.prose .v::before{content:"« "}
.vers.prose .v::after{content:" »"}
.vers footer{margin-top:10px;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--u-texte2)}

.cartons{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,2.4vw,32px)}
.carton{position:relative;margin:0}
.carton img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--u-fond)}
.carton.grand img{aspect-ratio:16/9}
.carton figcaption{position:relative;margin:-34px 0 0 16px;max-width:min(30em,90%);padding:13px 18px;background:var(--u-fond);color:var(--u-texte);font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.4;box-shadow:0 18px 40px -24px rgba(0,0,0,.5)}
.ch-alt .carton figcaption{background:var(--u-fond)}
.ch:not(.ch-alt) .carton figcaption{background:var(--u-fond2)}
.credits{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:16px;font-size:.75rem;color:var(--u-texte2)}
.carton-seul{max-width:900px;margin-top:36px}

.video{position:relative;isolation:isolate;display:flex;align-items:flex-end;gap:20px;min-height:clamp(240px,40vw,520px);padding:clamp(20px,3vw,40px);overflow:hidden;border-radius:4px;background:#000;color:#fff;text-decoration:none}
.video img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;opacity:.66;transition:transform 1.2s var(--ease),opacity .5s}
.video::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(0,0,0,.74),rgba(0,0,0,0) 62%)}
.video:hover img{transform:scale(1.03);opacity:.8}
.video-jouer{display:grid;place-items:center;flex:none;width:76px;height:76px;border-radius:50%;background:var(--u-vif);color:var(--u-sur);transition:transform .5s var(--ease)}
.video-jouer svg{width:28px;height:28px;margin-left:3px}
.video:hover .video-jouer{transform:scale(1.08)}
.video-titre{font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.15;text-wrap:balance}
.video-ext{margin-left:auto;align-self:flex-start;font-size:1.25rem}

.tournee-g{display:grid;gap:32px}
.tournee-note{font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.3;max-width:20em;margin-bottom:28px}
.ecran-u{margin-bottom:0;background:radial-gradient(70% 55% at 40% 20%,color-mix(in srgb,var(--u-bras) 22%,transparent),transparent 72%),var(--u-ecran)}
.fiche .date{--point:var(--u-vif);border-color:color-mix(in srgb,var(--u-texte) 16%,transparent)}
.fiche .dates-mois{border-color:color-mix(in srgb,var(--u-texte) 45%,transparent)}
.fiche .date-details a{color:var(--u-texte)}
.lieux-u{max-width:62em;font-size:.9375rem;line-height:1.7;color:var(--u-texte2);margin-bottom:36px}

.distrib{display:grid;gap:36px}
/* la distribution en portraits (D.personnes, show.equipe) : chaque comédien sur son écran, la photo pleine ou, sans elle, l'écran de l'univers et ses initiales ; le nom en bas, sur la photo ; ceux qui alternent vont par deux */
.cast{--g:clamp(10px,1.4vw,18px);--pw:176px;--pmax:336px;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:clamp(24px,3vw,36px) var(--g);max-width:calc(var(--n,4) * var(--pmax) + (var(--n,4) - 1) * var(--g));margin:0 0 clamp(36px,6vh,60px);padding:0}
.cast>li{min-width:0}
.cast>.cast-paire{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g);padding-top:12px;border-top:3px solid var(--u-vif)}
.cast-pt{margin:0;min-width:0}
.cast-cadre{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;container-type:inline-size;background:radial-gradient(70% 55% at 40% 20%,color-mix(in srgb,var(--u-bras) 22%,transparent),transparent 72%),var(--u-ecran)}
.cast-cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.cast-cadre::after{content:"";position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(to top,rgba(10,5,10,.9),rgba(10,5,10,.55) 52%,transparent);pointer-events:none}
.cast-mono{position:absolute;inset:0 0 22%;display:grid;place-items:center}
.cast-mono b{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:3.4rem;font-size:34cqw;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--u-bras)}
.cast-nom{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:0 12px 12px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:clamp(1.1rem,1rem + .5vw,1.45rem);line-height:1.1;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.5);text-wrap:balance}
.cast-pt figcaption{display:block}
.cast-alt,.cast-role,.cast-cr{display:block;margin-top:7px;font-size:.875rem;line-height:1.4;color:var(--u-texte2)}
.cast-role{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--u-vif)}
.cast-cr{margin-top:6px;font-size:.75rem}
.signe{margin-bottom:14px;font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--u-vif)}
.distrib .fl{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 14%,transparent)}
.fl-duree{margin-top:18px;font-weight:600}
.distrib-prod{display:grid;gap:10px;align-content:start}
.prod{font-size:var(--t-petit);line-height:1.65;color:var(--u-texte2)}
.prod strong{color:var(--u-texte);font-weight:600}
.mention{padding:12px 14px;border-left:3px solid var(--u-vif);background:color-mix(in srgb,var(--u-vif) 9%,transparent);font-size:.9375rem}
.mention a{color:var(--u-texte)}
.cta-u{margin-top:clamp(40px,7vh,72px)}

.faits-u{display:grid;gap:0;max-width:52em;border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.faits-u .fait{padding:16px 0;font-size:1.125rem}
.faits-u .fait-fort{font-size:clamp(1.5rem,3vw,2.5rem)}
.actu-u{display:inline-block;margin-bottom:24px;padding:8px 16px;border:1px solid var(--u-vif);border-radius:999px;color:var(--u-vif);font-weight:600}
.equipe-u{margin-top:28px;display:grid;gap:6px}
.tech{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))}
.tech-bloc{padding:20px 22px;background:var(--u-fond);border:1px solid color-mix(in srgb,var(--u-texte) 16%,transparent);border-radius:4px}
.tech-bloc h4{margin-bottom:10px;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.tech-bloc li{padding:7px 0;border-bottom:1px dashed color-mix(in srgb,var(--u-texte) 18%,transparent);font-size:.9375rem;line-height:1.5}
.tech-bloc li:last-child{border-bottom:0}
.alerte{display:flex;align-items:flex-start;gap:14px;margin-top:20px;padding:18px 22px;border-radius:4px;background:var(--u-vif);color:var(--u-sur);font-size:1.0625rem;line-height:1.5}
.alerte svg{flex:none;width:26px;height:26px}

.ac-bandeau{position:relative;isolation:isolate;overflow:hidden;padding:clamp(24px,4vw,52px);border-radius:4px;background:var(--u-vif);color:var(--u-sur)}
.ac-bandeau .motif{position:absolute;z-index:-1;right:-30px;top:-30px;width:min(60vw,320px);color:var(--u-sur);opacity:.16;stroke-width:4}
.ac-bandeau .ac-lib{margin:0;color:inherit;opacity:.9}
.ac-type-grand{margin-top:10px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:clamp(2rem,5.4vw,4.25rem);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.ac-puces{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:22px}
.ac-puce{padding:5px 14px;border:1px solid currentColor;border-radius:999px;font-size:.9375rem;font-weight:600}
.ac-suite{display:grid;gap:32px;margin-top:clamp(32px,5vh,52px)}
.ac-cote{display:grid;gap:22px;align-content:start}
.ac-suite .formule{padding:16px 20px;font-family:Gloock,Georgia,serif;font-size:1.25rem;font-weight:400;border:2px solid var(--u-vif);border-radius:4px}
.ac-suite .ac-dispositifs{font-size:.9375rem}
.ac-suite .ac-k{display:block;margin-bottom:6px;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--u-texte)}

.pq{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.pq-s{padding:24px 24px 28px;background:var(--u-fond);border-top:4px solid var(--u-vif)}
.ch:not(.ch-alt) .pq-s{background:var(--u-fond2)}
.pq-s h3{margin-bottom:12px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.3125rem;line-height:1.2;color:var(--u-vif)}
.pq-s p{font-size:.9375rem;line-height:1.65}
.table-s{max-width:100%}
.prog{width:100%;border-collapse:collapse;font-size:.9375rem;line-height:1.5}
.prog th,.prog td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.prog th[scope="rowgroup"]{width:5.5rem;background:var(--u-vif);color:var(--u-sur);font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.25rem;border-bottom-color:color-mix(in srgb,var(--u-sur) 30%,transparent)}
.prog th[scope="row"]{width:9rem;font-weight:700}
.prog td:last-child{color:var(--u-texte2)}
.consignes{display:grid;gap:18px;max-width:46em}
.note-u{justify-self:start;padding:5px 12px;background:var(--u-vif);color:var(--u-sur);font-size:.75rem;font-weight:700;letter-spacing:.18em}
.demandes{display:grid;gap:8px}
.demandes li{position:relative;padding:12px 16px 12px 46px;border:2px solid var(--u-vif);border-radius:4px;font-weight:700;letter-spacing:.02em}
.demandes li::before{content:"";position:absolute;left:16px;top:50%;width:16px;height:2px;background:var(--u-vif);transform:translateY(-50%) rotate(45deg)}
.demandes li::after{content:"";position:absolute;left:16px;top:50%;width:16px;height:2px;background:var(--u-vif);transform:translateY(-50%) rotate(-45deg)}
.axes{display:grid;gap:8px;padding-left:1.2em;list-style:disc}
.consignes-atelier{padding:16px 20px;background:color-mix(in srgb,var(--u-vif) 10%,transparent);border-left:3px solid var(--u-vif)}
.ateliers-g{display:grid;gap:28px}
.ateliers-l{display:grid;gap:18px}
.atelier{padding:24px;border:1px solid color-mix(in srgb,var(--u-texte) 16%,transparent);border-radius:4px;background:var(--u-fond)}
.ch:not(.ch-alt) .atelier{background:var(--u-fond2)}
.atelier h3{margin-bottom:12px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.375rem;line-height:1.2;color:var(--u-vif)}
.atelier p + p{margin-top:.8em}
.atelier p,.atelier li{font-size:.9375rem;line-height:1.62}
.etapes{display:grid;gap:12px;margin-top:14px}
.etape-t{font-weight:400;color:var(--u-texte)}
.points{display:grid;gap:6px;margin-top:12px;padding-left:1.2em;list-style:disc}
.ateliers-photos{display:grid;gap:14px;align-content:start}
.ateliers-photos img{width:100%;aspect-ratio:4/3;object-fit:cover}

.suivant{background:var(--u-fond);color:var(--u-texte)}
.suivant-lien{position:relative;isolation:isolate;display:flex;flex-direction:column;text-decoration:none}
.suivant-photo{position:relative;overflow:hidden;aspect-ratio:16/10}
.suivant-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.suivant-lien:hover .suivant-photo img{transform:scale(1.04)}
.suivant-texte{display:flex;flex-direction:column;align-items:flex-start;padding:36px var(--marge) 72px}
.suivant-sur{font-size:var(--t-petit);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--u-vif)}
.suivant-titre{margin-top:16px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-titre);line-height:1;letter-spacing:-.012em;color:var(--u-vif);text-wrap:balance}
.suivant-sous{margin-top:14px;color:var(--u-texte2)}
.suivant-fleche{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;margin-top:34px;border-radius:50%;background:var(--u-vif);color:var(--u-sur);font-size:1.5rem;transition:transform .5s var(--ease)}
.suivant-lien:hover .suivant-fleche{transform:translateX(8px)}
.suivant-lien:focus-visible{outline-color:var(--u-texte);outline-offset:-6px}

/* ---------- la carte des tournées, dans l'univers de la 09 (CARTE.svg) ---------- */
.carte-m09{color:var(--creme);--bras:var(--magenta-vif);--point-fond:var(--nuit)}
.carte-m09 .carte-pays{fill:rgba(243,238,233,.04);stroke:rgba(243,238,233,.32);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.carte-m09 .carte-voisin{fill:none;stroke:rgba(243,238,233,.16);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 4}
.carte-m09 .carte-bras{fill:var(--bras);transition:opacity .3s}
.carte-m09 .carte-bras-passe{fill:rgba(243,238,233,.22)}
.carte-m09 .carte-bout-passe{fill:rgba(243,238,233,.45)}
.carte-m09 .carte-spirale{fill:none;stroke:var(--bras);stroke-width:1.3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.carte-m09 .carte-lieu{cursor:pointer;outline:none}
.carte-m09 .carte-point{fill:var(--point-fond);stroke:var(--bras);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;transition:transform .3s var(--ease),fill .3s}
.carte-m09 .carte-lieu:hover .carte-point,.carte-m09 .carte-lieu.est-survol .carte-point,.carte-m09 .carte-lieu.est-choisi .carte-point{fill:#fff;transform:scale(1.7)}
.carte-m09 .carte-lieu:focus-visible .carte-point{fill:#fff;stroke:#fff;stroke-width:3;transform:scale(1.9)}
.carte-m09 .carte-nom{font:500 calc(20px * var(--k,1)) Inter,system-ui,sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(12,7,10,.85);stroke-width:calc(5px * var(--k,1));stroke-linejoin:round;opacity:0;pointer-events:none;transition:opacity .25s}
.carte-m09.noms-visibles .carte-nom,.carte-m09 .carte-nom.est-survol,.carte-m09 .carte-nom.est-choisi{opacity:1}
.carte-m09.a-survol .carte-bras:not(.est-survol),.carte-m09.a-choix .carte-bras:not(.est-choisi){opacity:.28}
.carte-m09 .carte-rouen{fill:#fff}
.carte-m09 .carte-rouen-nom{font:calc(22px * var(--k,1)) Gloock,Georgia,serif;fill:#fff;paint-order:stroke;stroke:rgba(12,7,10,.8);stroke-width:calc(5px * var(--k,1))}
.carte-u{--bras:var(--u-bras);--point-fond:var(--u-ecran)}
.carte-tout .carte-bras{opacity:.78}
.carte-tout .carte-point{stroke-width:1.4}

/* ---------- au-dessous de 1200 px : le menu second se replie derrière « Menu » ---------- */
@media (max-width:1199px){
  .menu-bouton{display:inline-flex}
  .second{position:fixed;left:0;right:0;top:var(--tete-h);display:none;max-height:calc(100vh - var(--tete-h));overflow:auto;padding:12px var(--marge) 32px;background:var(--nuit);color:var(--creme);box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .tete.menu-ouvert .second{display:block}
  .second ul{flex-direction:column;align-items:stretch;gap:0;padding-left:0;border-left:0;max-width:760px}
  .second li{border-bottom:1px solid rgba(243,238,233,.12)}
  .second a{padding:14px 0;font-family:Gloock,Georgia,serif;font-size:clamp(1.5rem,4vw,2.25rem);font-weight:400;line-height:1.2;opacity:1;white-space:normal}
  .second a[aria-current="page"]{color:var(--magenta-vif);font-weight:400}
  .second a[aria-current="page"]::after,.tete[data-ton="clair"] .second a[aria-current="page"]::after{left:auto;right:2px;top:50%;bottom:auto;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);background:var(--magenta-vif)}
}
/* tablette : la pieuvre seule, les entrées resserrées */
@media (min-width:760px) and (max-width:1023px){
  .marque-mot{display:none}
  .entree{gap:6px;padding:8px 10px 8px 8px}
}
.tete.serre .entree .bras-e{display:none}
.tete.serre .entree{padding-left:10px}
/* ---------- téléphone : les trois entrées dans une barre fixe en bas d'écran ---------- */
@media (max-width:759px){
  :root{--tete-h:64px;--barre-h:64px}
  .marque-pieuvre{width:50px}
  .marque-mot{font-size:1.1875rem}
  .menu-bouton{margin-left:auto}
  .entrees{position:fixed;left:0;right:0;bottom:0;z-index:60;display:block;padding:0 0 env(safe-area-inset-bottom);background:var(--nuit);color:var(--creme);border-top:1px solid rgba(243,238,233,.14);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .entrees ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
  .tete .entree,.tete[data-ton="clair"] .entree{--ec:var(--ev);width:100%;height:var(--barre-h);flex-direction:column;justify-content:center;gap:3px;padding:6px 4px 7px;border-radius:0;font-size:.75rem;font-weight:500;line-height:1.15;white-space:normal;text-align:center;color:var(--creme)}
  .tete .entree:hover{box-shadow:none}
  .tete .entree[aria-current="page"],.tete[data-ton="clair"] .entree[aria-current="page"]{background:color-mix(in srgb,var(--ev) 14%,transparent);color:var(--ev);box-shadow:inset 0 3px 0 var(--ev)}
  .tete .entree[aria-current="page"] .bras-e{stroke:var(--ev)}
  .tete .entree[aria-current="true"]{box-shadow:inset 0 3px 0 color-mix(in srgb,var(--ev) 70%,transparent)}
  .e-long{display:none}
  .e-court{display:inline}
  .pied{padding-bottom:calc(36px + var(--barre-h) + env(safe-area-inset-bottom))}
  .date{grid-template-columns:6rem minmax(0,1fr);gap:4px 16px}
  .date-jour{font-size:1.3125rem}
  .o-long{display:none}
  .o-court{display:inline}
  .onglets ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0 8px;overflow:visible}
  .onglets a{flex-direction:column;justify-content:flex-start;gap:3px;height:100%;padding:12px 4px 10px;font-size:.75rem;white-space:normal;text-align:center}
  .ouv-contenu{padding-bottom:calc(36px + var(--barre-h))}
  .prog,.prog tbody,.prog tr,.prog th,.prog td{display:block;width:auto!important}
  .prog tr{padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
  .prog th,.prog td{padding:3px 0;border:0}
  .prog th[scope="rowgroup"]{margin:16px 0 4px;padding:6px 12px}
}

/* tablette et plus */
@media (min-width:760px){
  .portes{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,18px)}
  .porte{min-height:clamp(320px,calc(100svh - var(--tete-h) - 110px),900px);padding:clamp(20px,2.4vw,40px)}
  .date{grid-template-columns:9rem minmax(0,1fr)}
  .vignettes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cartons{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carton.grand{grid-column:1/-1}
  .suivant-lien{display:grid;grid-template-columns:1fr 1fr;min-height:min(80vh,780px)}
  .suivant-photo{aspect-ratio:auto}
  .suivant-texte{justify-content:center;padding:96px var(--marge) 96px var(--interieur)}
  .actions-photos{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:900px){
  .cat{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .cat-photo{aspect-ratio:auto;min-height:100%}
  .cat:nth-child(even) .cat-photo{order:2}
  .cat-cols:has(> :nth-child(2)){grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
}
/* bureau : la grille à douze colonnes */
@media (min-width:960px){
  .grille{grid-template-columns:repeat(12,minmax(0,1fr))}
  .grille > *{grid-column:1/-1}
  .agenda-grille > .ecran{grid-column:1/span 5;position:sticky;top:calc(var(--tete-h) + 24px);align-self:start;margin-bottom:0}
  .agenda-grille > .agenda-liste{grid-column:7/-1}
  .cie-grille > .cie-texte{grid-column:1/span 7}
  .cie-grille > .cie-dates{grid-column:9/-1;margin-top:0;position:sticky;top:calc(var(--tete-h) + 40px);align-self:start}
  .dir-grille > .dir-tete{grid-column:1/span 5}
  .dir-grille > .dir-texte{grid-column:7/-1;margin-top:0}
  .actions-grille > .actions-photos{grid-column:1/span 6;grid-template-columns:repeat(2,minmax(0,1fr));position:sticky;top:calc(var(--tete-h) + 32px);align-self:start;margin-bottom:0}
  .actions-grille > .actions-prose{grid-column:8/-1}
  .diffusion-grille > .ecran{grid-column:1/span 7;margin-bottom:0}
  .diffusion-grille > .diffusion-texte{grid-column:9/-1}
  .form-grille > .formulaire-col{grid-column:1/span 7}
  .form-grille > .coordonnees{grid-column:9/-1;margin-top:0;align-self:end}
  .legal-grille > .prose{grid-column:1/span 8}
  .pied .grille > .pied-contact{grid-column:1/span 4}
  .pied .grille > .pied-entrees{grid-column:5/span 3}
  .pied .grille > .pied-partenaires{grid-column:8/span 3}
  .pied .grille > .pied-legal{grid-column:11/-1}
  .lecture{grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:clamp(32px,5vw,96px)}
  .tournee-g{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5vw,80px);align-items:start}
  .tournee-g > .ecran{position:sticky;top:calc(var(--tete-h) + 70px)}
  .tournee-g.seule{grid-template-columns:minmax(0,1fr)}
  .tournee-g.seule > .ecran{max-width:820px}
  .distrib{grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:clamp(32px,5vw,96px)}
  .ac-suite{grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:clamp(32px,5vw,80px)}
  .ateliers-g{grid-template-columns:minmax(0,8fr) minmax(0,4fr);column-gap:clamp(24px,3vw,48px)}
  .ateliers-photos{position:sticky;top:calc(var(--tete-h) + 70px)}
  .lieux-u{columns:2;column-gap:48px}
}
@media (min-width:1100px){
  .vignettes{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* bureau : un écran par chapitre */
@media (min-width:1024px) and (min-height:600px){
  .tete[data-ton="chapitre"]::before{background:linear-gradient(180deg,rgba(10,6,9,.62),rgba(10,6,9,0));-webkit-backdrop-filter:none;backdrop-filter:none}
  .tete[data-ton="chapitre"] .marque-pieuvre{filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))}
  .tete[data-ton="chapitre"]{text-shadow:0 1px 14px rgba(0,0,0,.35)}
  .tete[data-ton="chapitre"] .entree[aria-current="page"]{text-shadow:none}
  .choix{scroll-snap-align:start;scroll-snap-stop:always}
  .chap{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always}
  .chap::before{background:radial-gradient(60% 70% at var(--lueur-x,72%) 58%,var(--u-lueur),transparent 72%)}
  .chap[data-photo="droite"]{--lueur-x:28%}
  .chap[data-photo="droite"] .chap-photo{order:2}
  .chap-photo{aspect-ratio:auto;min-height:100%}
  .chap-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 22%),linear-gradient(0deg,rgba(0,0,0,.36),rgba(0,0,0,0) 26%)}
  .chap-texte{justify-content:center;padding:calc(var(--tete-h) + 3vh) var(--marge) 7vh var(--interieur)}
  .chap[data-photo="droite"] .chap-texte{padding-left:var(--marge);padding-right:var(--interieur)}
  .chap-motif{top:11%;bottom:auto;width:min(31vw,440px)}
  .chap[data-photo="gauche"] .chap-motif{right:-5%}
  .chap[data-photo="droite"] .chap-motif{right:calc(50% - 6%)}
  .chap-sur{margin-bottom:clamp(14px,2.6vh,26px)}
  .chap-sous{margin-top:clamp(8px,1.6vh,16px)}
  .chap-accroche{margin-top:clamp(16px,3.4vh,32px);font-size:min(var(--t-moyen),3.2vh)}
  .chap-ac{margin-top:clamp(16px,3vh,26px)}
  .chap-tournee{margin-top:clamp(16px,3.2vh,30px)}
  .chap-actions{margin-top:clamp(18px,3.4vh,32px)}
  .chap-carte{scroll-snap-align:start;height:calc(100vh + var(--pas,8) * 42vh + 50vh)}
  .cc-scene{grid-template-columns:minmax(0,40fr) minmax(0,60fr);grid-template-rows:minmax(0,1fr)}
  .cc-carte{order:2;margin-top:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%);mask-image:linear-gradient(90deg,transparent 0,#000 12%)}
  .cc-texte{padding:calc(var(--tete-h) + 5vh) var(--marge) 7vh var(--interieur)}
  .cc-rail{margin-top:clamp(18px,4vh,40px)}
  .cc-m{padding-bottom:6vh}
  .chap-carte.est-statique .cc-scene{display:grid}
  .chap-carte.est-statique .cc-carte{position:sticky;top:0;height:100vh;align-self:start}
  .chap-carte.est-statique .cc-texte{padding-bottom:12vh}
  .fin{scroll-snap-align:start}
  html.aimante .pied{scroll-snap-align:end}

  .sommaire{display:block;position:fixed;right:var(--marge);bottom:clamp(28px,5.5vh,52px);z-index:40;color:var(--creme);transition:opacity .45s var(--ease),visibility .45s,color .45s}
  .sommaire[data-ton="clair"]{color:var(--encre)}
  .sommaire.est-cache{opacity:0;visibility:hidden}
  .sommaire ol{display:flex;flex-direction:column;align-items:flex-end}
  .sommaire button{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:24px;padding-left:18px;color:inherit;border-radius:3px}
  .som-titre{padding:3px 10px;border-radius:999px;background:rgba(12,7,10,.66);color:var(--creme);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:var(--t-petit);font-weight:500;line-height:1.4;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease),transform .5s var(--ease)}
  .som-trait{display:block;width:18px;height:1.5px;border-radius:1px;background:currentColor;opacity:.55;transition:width .55s var(--ease),opacity .35s,background-color .35s}
  .sommaire button:hover .som-trait{width:28px;opacity:.9}
  .sommaire button:hover .som-titre,.sommaire button:focus-visible .som-titre{opacity:1;transform:none}
  .sommaire [aria-current="true"] .som-trait{width:48px;opacity:1;background:var(--som-accent,currentColor)}
  .sommaire button:focus-visible{outline-offset:3px}

  .ouverture{display:block}

/* ---------- le mouvement ---------- */
@media (prefers-reduced-motion:no-preference){
  .choix.attend .porte-li,.choix.attend .choix-suite{opacity:0;transform:translateY(28px)}
  .choix.entre .porte-li,.choix.entre .choix-suite{transition:opacity .8s var(--ease),transform 1s var(--ease)}
  .choix.entre .porte-li:nth-child(2){transition-delay:.08s}
  .choix.entre .porte-li:nth-child(3){transition-delay:.16s}
  .choix.entre .choix-suite{transition-delay:.3s}
  .chap.arme .chap-photo{clip-path:inset(0 100% 0 0)}
  .chap.arme .chap-photo img{transform:scale(1.08)}
  .chap.arme .chap-texte > *{opacity:0;transform:translateY(26px)}
  .chap.arme.vu .chap-photo{clip-path:inset(0);transition:clip-path 900ms cubic-bezier(.77,0,.18,1)}
  .chap.arme.vu .chap-photo img{transform:none;transition:transform 1600ms var(--ease)}
  .chap.arme.vu .chap-texte > *{opacity:1;transform:none;transition:opacity .8s var(--ease),transform 1s var(--ease)}
  .chap.arme.vu .chap-texte > :nth-child(1){transition-delay:.25s}
  .chap.arme.vu .chap-texte > :nth-child(2){transition-delay:.32s}
  .chap.arme.vu .chap-texte > :nth-child(3){transition-delay:.4s}
  .chap.arme.vu .chap-texte > :nth-child(4){transition-delay:.48s}
  .chap.arme.vu .chap-texte > :nth-child(5){transition-delay:.56s}
  .chap.arme.vu .chap-texte > :nth-child(6){transition-delay:.64s}
  .chap.arme.vu .chap-texte > :nth-child(7){transition-delay:.72s}
  .cc-onde{animation:onde 2.6s cubic-bezier(.2,.6,.3,1) infinite}
  .cc-rouen.est-actif + .cc-onde,.cc-onde.est-actif{animation-duration:1.4s}
  .choix-suite svg{animation:rebond 1.8s ease-in-out infinite}
  .page-entree:not(.deja) .ent-bras path{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.8s var(--ease) .15s forwards}
  .page-entree:not(.deja) .ent-titre{animation:entree 1s var(--ease) both .1s}
  .fiche:not(.deja) .ouv-photo{animation:devoile 900ms cubic-bezier(.77,0,.18,1) both .05s}
  .fiche:not(.deja) .ouv-photo img{animation:recule 1.6s var(--ease) both .05s}
  .fiche:not(.deja) .ouv-motif{animation:motif 2.2s var(--ease) both .2s}
  .fiche:not(.deja) .ouv-haut,.fiche:not(.deja) .ouv-signe,.fiche:not(.deja) .ouv-sur,.fiche:not(.deja) .ouv-sous,.fiche:not(.deja) .ouv-cta{animation:entree 1s var(--ease) both .45s}
  .fiche:not(.deja) .ouv-sous,.fiche:not(.deja) .ouv-cta{animation-delay:.7s}
  .fiche:not(.deja) .ouv-titre .l{animation:lettre .7s var(--ease) both;animation-delay:calc(.25s + var(--i) * 32ms)}
  .fiche:not(.deja) .ouv-accroche .m{animation:mot .5s var(--ease) both;animation-delay:calc(.55s + min(var(--j) * 24ms, 1.1s))}
}
@keyframes onde{from{stroke-width:11;opacity:.6}to{stroke-width:54;opacity:0}}
@keyframes entree{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes devoile{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes recule{from{transform:scale(1.08)}to{transform:none}}
@keyframes lettre{from{opacity:0;transform:translateY(.4em) rotate(5deg)}to{opacity:1;transform:none}}
@keyframes mot{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:none}}

@keyframes trace{to{stroke-dashoffset:0}}
@keyframes rebond{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
