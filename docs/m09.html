                                    href: k === saison ? '#/agenda' : `#/agenda/${k}` }));
    // les documents publics : un fichier du stockage public (documents/…), ou un lien
    const documents = Array.isArray(dc) ? dc.map(x => ({ spectacle: slugDe(spId.get(x.spectacle_id)) || null, type: x.type, titre: x.titre,
      url: (/^https?:\/\//i.test(x.url || '') ? x.url : null) || (x.fichier ? `${BASE}/storage/v1/object/public/crescite/${x.fichier.split('/').map(encodeURIComponent).join('/')}` : null), pour: x.pour }))
      .filter(x => x.url) : (D.documents || []);
    return { saison, aujourdhui, site, shows, dossiers, ateliers, dates, saisons, carte, photos, personnes, documents };
  }

  // ------------------------------------------------------------------------------------------- appliquer, prévenir
  const empreinte = n => { try { return JSON.stringify(n); } catch { return String(Math.random()); } };
  let derniere = null;
  function appliquer(n) {
    Object.keys(n).forEach(k => {
      const a = D[k], b = n[k];
      if (Array.isArray(a) && Array.isArray(b)) a.splice(0, a.length, ...b);
      else if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
        Object.keys(a).forEach(kk => { if (!(kk in b)) delete a[kk]; });
        Object.assign(a, b);
      } else D[k] = b;
    });
  }
  const prevenir = () => abonnes.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  // pendant une édition en cours (edition.js), les nouvelles de la base attendent : on ne perd rien de ce qui s'écrit
  let suspendu = false, enAttente = null;
  async function recharger({ force = false } = {}) {
    try {
      const n = composer(await lire());
      const e = empreinte(n);
      moi.etat = 'base';
      if (e === derniere && !force) return;
      if (suspendu) { enAttente = { n, e }; return; }
      derniere = e;
      appliquer(n);
      prevenir();
    } catch (err) {
      if (moi.etat !== 'base') moi.etat = 'hors-ligne';
      console.warn('Données de la compagnie indisponibles :', err.message || err);
    }
  }
  let attente = null;
  const bientot = (ms = 250) => { clearTimeout(attente); attente = setTimeout(recharger, ms); };

  // ------------------------------------------------------------------------------------------- temps réel
  // le canal de Supabase, par son client officiel (celui de l'administration, chargé après le premier affichage) :
  // chaque enregistrement dans une table crescite_ publiée relance la lecture
  const CLIENT = 'admin/vendor/supabase.js';
  let connecte = false, version = null;
  const chargerClient = () => window.supabase?.createClient ? Promise.resolve(window.supabase) : new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = CLIENT; s.async = true;
    s.onload = () => (window.supabase?.createClient ? ok(window.supabase) : ko(new Error('client absent')));
    s.onerror = () => ko(new Error('client introuvable'));
    document.head.append(s);
  });
  function ecouter() {
    chargerClient().then(sbjs => {
      const client = sbjs.createClient(BASE, CLE, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      const canal = client.channel('crescite-site');
      TABLES.forEach(table => canal.on('postgres_changes', { event: '*', schema: 'public', table }, () => bientot()));
      canal.subscribe(st => { connecte = st === 'SUBSCRIBED'; });
    }).catch(() => { connecte = false; });
  }
  // secours : si le canal est coupé, la version publiée est relue de temps en temps (et au retour sur l'onglet)
  async function verifier() {
    if (connecte && document.visibilityState === 'visible') return;
    try {
      const r = await fetch(`${BASE}/rest/v1/rpc/crescite_version`, { method: 'POST', headers: { apikey: CLE, 'Content-Type': 'application/json' }, body: '{}', cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (version !== null && v !== version) bientot(0);
      version = v;
    } catch { /* hors connexion : on réessaiera */ }
  }

  if (actif) {
    // la première lecture : si la base ne répond pas (réseau lent, coupure), la page garde l'instantané et réessaie
    let branche = false, essai = 0;
    const brancher = () => { if (branche) return; branche = true; ecouter(); verifier(); setInterval(verifier, 60000); };
    const premiere = () => recharger().then(() => {
      if (moi.etat === 'base') brancher();
      else setTimeout(premiere, [5000, 15000, 45000][essai++] || 120000);
    });
    premiere();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { verifier(); if (!connecte) bientot(0); } });
  }
  moi.surChangement = fn => { if (typeof fn === 'function') abonnes.push(fn); };
  moi.suspendre = oui => {
    suspendu = !!oui;
    if (!suspendu && enAttente) { const { n, e } = enAttente; enAttente = null; derniere = e; appliquer(n); prevenir(); }
  };
  moi.prevenir = prevenir;
  moi.recharger = recharger;
  moi.composer = composer;
  return moi;
})();
</script>
<script>
/* La carte des tournées, commune aux maquettes (build.py l'ajoute après les données D).
   Le fond (la France, la Belgique, le Luxembourg), Rouen, et un bras par commune, de Rouen jusqu'à elle.
   Chaque maquette l'habille dans son univers : couleurs, tracé, mouvement, interactions.

   CARTE.viewBox, CARTE.rouen ([x, y]), CARTE.fond.{pays, belgique, luxembourg} : chemins SVG (attribut d)
   CARTE.lieux                          toutes les communes [{c, dep, xy}] ; « l » est l'indice dans ce tableau
   (aVenir, tout, saison et spectacle ramènent l'outre-mer dans un encart en bas à gauche : x.encart, x.xyReel ; CARTE.ENCART)
   CARTE.aVenir()                       les communes des dates à venir : [{l, c, dep, xy, n, dates: [D.dates…]}]
   CARTE.aVenir('public')               les mêmes, sans les dates scolaires (« Je viens voir un spectacle ») ;
   CARTE.aVenir('scolaire')             seulement les dates scolaires (« Je représente un établissement scolaire »)
   CARTE.tout()                         toutes les communes de toutes les saisons (« Je souhaite programmer ») :
                                        [{l, c, dep, xy, n, dates: [lignes de D.saisons, avec spectacle, slug, saison]}]
   CARTE.saison('2019-2020')            les communes d'une saison : [{l, c, dep, xy, n, dates: [lignes de D.saisons]}]
   CARTE.spectacle(slug)                {aVenir: [...], passe: [...]} : les communes d'un spectacle, à venir et passées
   CARTE.nom(lieu)                      « Pont-Audemer (27) »
   CARTE.bras(xy, {w0, w1, courbe, depart})   un bras plein effilé (à remplir), de Rouen (ou depart) jusqu'à xy
   CARTE.trait(xy, {courbe, depart})          la même courbe, en trait (à tracer) : « M… Q… »
   CARTE.bout(xy, {r, tours, courbe})         une petite spirale qui enroule le bout du bras (à tracer)
   CARTE.longueur(xy, {courbe})               la longueur du trait, pour stroke-dasharray
   CARTE.cadre(lieux, {marge, min})           un viewBox serré autour de Rouen et de ces communes : "x y l h"
   CARTE.svg({...})                     une carte complète, à habiller en CSS (classes .carte-*) : voir plus bas
   CARTE.lier(racine, {survol, choix})  relie les communes d'une carte (data-l) au survol, au clic et au clavier
   CARTE.mouvement()                    false si le visiteur a demandé moins d'animations */
const CARTE = (() => {
  // D.carte se relit à chaque appel : la base de la compagnie peut remplacer ses communes et ses comptes (donnees.js)
  const C = () => D.carte, R = D.carte.rouen;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // une commune hors du cadre de la France (l'outre-mer : Saint-Denis de La Réunion) est ramenée dans un encart,
  // en bas à gauche : x.encart vaut alors true, et x.xyReel garde sa position projetée
  const VB = C().viewBox.split(/\s+/).map(Number), ENCART = [VB[0] + 66, VB[1] + VB[3] - 74];
  const dansCadre = ([x, y]) => x >= VB[0] && x <= VB[0] + VB[2] && y >= VB[1] && y <= VB[1] + VB[3];
  function regroupe(paires, datesDe) {
    return paires.map(([l, n]) => { const p = C().lieux[l], hors = !dansCadre(p.xy); return { l, ...p, xy: hors ? ENCART : p.xy, xyReel: p.xy, encart: hors, n, dates: datesDe(l) }; })
      .sort((a, b) => Math.hypot(a.xy[0] - R[0], a.xy[1] - R[1]) - Math.hypot(b.xy[0] - R[0], b.xy[1] - R[1]));
  }
  const aVenir = filtre => {
    const garde = d => filtre === 'public' ? !d.scolaire : filtre === 'scolaire' ? !!d.scolaire : true;
    const paires = filtre === 'public' ? C().aVenirPublic : filtre === 'scolaire' ? C().aVenirScolaire : C().aVenir;
    return regroupe(paires, l => D.dates.filter(d => d.l === l && garde(d)));
  };
  const tout = () => regroupe(C().tout, l => Object.entries(D.saisons).flatMap(([saison, S]) => S.spectacles.flatMap(g =>
    g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug, saison })))));
  const saison = s => regroupe(C().parSaison[s] || [], l => (D.saisons[s]?.spectacles || []).flatMap(g => g.dates.filter(d => d.l === l).map(d => ({ ...d, spectacle: g.titre, slug: g.slug }))));
  const spectacle = slug => {
    const p = C().parSpectacle[slug] || { passe: [], aVenir: [] };
    const passees = l => Object.values(D.saisons).flatMap(S => S.spectacles.filter(g => g.slug === slug).flatMap(g => g.dates.filter(d => d.l === l && !(d.fin && d.fin >= D.aujourdhui))));
    return { aVenir: regroupe(p.aVenir, l => D.dates.filter(d => d.slug === slug && d.l === l)), passe: regroupe(p.passe, passees) };
  };
  const nom = x => `${x.c} (${x.dep})`;

  // le point de contrôle de la courbe : à mi-chemin, écarté sur le côté (courbe > 0 : vers la gauche du trajet)
  function controle([x, y], courbe = 0.24, depart = R) {
    const [rx, ry] = depart, dx = x - rx, dy = y - ry;
    return [(rx + x) / 2 - dy * courbe, (ry + y) / 2 + dx * courbe];
  }
  function bras(xy, { w0 = 4, w1 = 0.5, courbe = 0.24, depart = R } = {}) {
    const [rx, ry] = depart, [x, y] = xy;
    if (Math.hypot(x - rx, y - ry) < 6) return '';
    const [qx, qy] = controle(xy, courbe, depart), N = 26, G = [], Dr = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, c = t * t;
      const px = a * rx + b * qx + c * x, py = a * ry + b * qy + c * y;
      let tx = 2 * (1 - t) * (qx - rx) + 2 * t * (x - qx), ty = 2 * (1 - t) * (qy - ry) + 2 * t * (y - qy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = (w0 * (1 - t) + w1 * t) / 2;
      G.push(`${(px - ty * w).toFixed(1)} ${(py + tx * w).toFixed(1)}`); Dr.push(`${(px + ty * w).toFixed(1)} ${(py - tx * w).toFixed(1)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  function trait(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    return `M${depart[0]} ${depart[1]}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${xy[0]} ${xy[1]}`;
  }
  function longueur(xy, { courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart);
    let L = 0, px = depart[0], py = depart[1];
    for (let k = 1; k <= 24; k++) {
      const t = k / 24, x = (1 - t) ** 2 * depart[0] + 2 * (1 - t) * t * qx + t * t * xy[0], y = (1 - t) ** 2 * depart[1] + 2 * (1 - t) * t * qy + t * t * xy[1];
      L += Math.hypot(x - px, y - py); px = x; py = y;
    }
    return Math.round(L);
  }
  // une spirale au bout du bras, dans le sens de la courbe
  function bout(xy, { r = 5, tours = 1.25, courbe = 0.24, depart = R } = {}) {
    const [qx, qy] = controle(xy, courbe, depart), [x, y] = xy;
    let a = Math.atan2(y - qy, x - qx), pts = [];
    const sens = courbe >= 0 ? 1 : -1, N = 28;
    const cx = x + Math.cos(a + sens * Math.PI / 2) * r, cy = y + Math.sin(a + sens * Math.PI / 2) * r;
    const a0 = Math.atan2(y - cy, x - cx);
    for (let k = 0; k <= N; k++) {
      const t = k / N, ang = a0 + sens * t * tours * 2 * Math.PI, rr = r * (1 - 0.72 * t);
      pts.push(`${(cx + Math.cos(ang) * rr).toFixed(1)} ${(cy + Math.sin(ang) * rr).toFixed(1)}`);
    }
    return `M${pts.join('L')}`;
  }
  function cadre(lieux, { marge = 40, min = 160 } = {}) {
    const xs = [R[0], ...lieux.map(l => l.xy[0])], ys = [R[1], ...lieux.map(l => l.xy[1])];
    let x0 = Math.min(...xs) - marge, x1 = Math.max(...xs) + marge, y0 = Math.min(...ys) - marge, y1 = Math.max(...ys) + marge;
    if (x1 - x0 < min) { const m = (x0 + x1) / 2; x0 = m - min / 2; x1 = m + min / 2; }
    if (y1 - y0 < min) { const m = (y0 + y1) / 2; y0 = m - min / 2; y1 = m + min / 2; }
    return `${Math.round(x0)} ${Math.round(y0)} ${Math.round(x1 - x0)} ${Math.round(y1 - y0)}`;
  }

  /* Une carte complète.
     lieux    : les communes en avant (CARTE.aVenir(), CARTE.saison(s), CARTE.spectacle(slug).aVenir…)
     passe    : des communes en retrait (les tournées passées), tracées plus fines
     forme    : 'bras' (plein effilé), 'trait' (ligne), 'pointille'
     courbe   : l'écart de la courbe ; spirale : un enroulement au bout de chaque bras
     cadre    : 'france' (par défaut) ou 'serre' (autour des communes), ou un viewBox
     pousse   : les bras poussent depuis Rouen à l'affichage (si le visiteur accepte le mouvement)
     interactif : chaque commune devient un bouton (data-l), à relier avec CARTE.lier
     noms     : true pour écrire le nom des communes en avant ; titre : le libellé pour les lecteurs d'écran
     Classes : .carte, .carte-voisin, .carte-pays, .carte-bras(-passe), .carte-bout(-passe), .carte-spirale,
               .carte-lieu (g[data-l]), .carte-point, .carte-nom, .carte-rouen, .carte-rouen-nom */
  let n = 0;
  function svg({ lieux = [], passe = [], forme = 'bras', courbe = 0.24, spirale = false, cadre: vb = 'france', pousse = true,
    interactif = false, noms = false, titre = '', classe = '', largeur = 1 } = {}) {
    const id = 'carte-pousse-' + (++n), anime = pousse && mouvement();
    const box = vb === 'france' ? C().viewBox : vb === 'serre' ? cadre([...lieux, ...passe]) : vb;
    const [bx, by, bw, bh] = box.split(/\s+/).map(Number), echelle = Math.max(bw, bh) / 800;
    const tracer = (x, w0, w1) => forme === 'bras' ? `d="${bras(x.xy, { w0: w0 * echelle, w1: w1 * echelle, courbe })}"` : `d="${trait(x.xy, { courbe })}"`;
    const largeurBras = x => Math.min(7, 1.6 + Math.sqrt(x.n) * 1.1) * largeur;
    const rayon = Math.hypot(bw, bh) * 1.2;
    const etiquette = x => `${nom(x)}${x.dates?.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    return `<svg class="carte ${esc(classe)}" viewBox="${box}" ${interactif ? `aria-label="${esc(titre)}"` : `role="img" aria-label="${esc(titre)}"`} data-forme="${forme}">
      <defs><clipPath id="${id}"><circle cx="${R[0]}" cy="${R[1]}" r="${anime ? 0 : rayon}">${anime ? `<animate attributeName="r" from="0" to="${rayon}" dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>` : ''}</circle></clipPath></defs>
      <path class="carte-voisin" d="${C().belgique}"/><path class="carte-voisin" d="${C().luxembourg}"/><path class="carte-pays" d="${C().contour}"/>
      ${[...lieux, ...passe].some(x => x.encart) ? `<circle class="carte-encart" cx="${ENCART[0]}" cy="${ENCART[1]}" r="${(24 * echelle).toFixed(1)}" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 4"/>` : ''}
      <g clip-path="url(#${id})">
        ${passe.map(x => `<path class="carte-bras-passe" ${forme === 'bras' ? tracer(x, 1.6, 0.4) : `d="${trait(x.xy, { courbe })}"`}/>`).join('')}
        ${passe.map(x => `<circle class="carte-bout-passe" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(1.8 * echelle).toFixed(2)}"/>`).join('')}
        ${lieux.map(x => `<path class="carte-bras" data-l="${x.l}" ${forme === 'bras' ? tracer(x, largeurBras(x), 0.5) : `d="${trait(x.xy, { courbe })}"`}${forme === 'pointille' ? ' stroke-dasharray="1 4"' : ''}/>`).join('')}
        ${spirale ? lieux.map(x => `<path class="carte-spirale" data-l="${x.l}" d="${bout(x.xy, { r: 4.5 * echelle, courbe })}"/>`).join('') : ''}
        ${lieux.map(x => interactif
          ? `<g class="carte-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(4 * echelle).toFixed(2)}"/><circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(12 * echelle).toFixed(2)}" fill="transparent"/><title>${esc(etiquette(x))}</title></g>`
          : `<g class="carte-lieu" data-l="${x.l}"><circle class="carte-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(3.6 * echelle).toFixed(2)}"/><title>${esc(etiquette(x))}</title></g>`).join('')}
        ${noms ? lieux.map(x => `<text class="carte-nom" data-l="${x.l}" x="${x.xy[0] + 7 * echelle}" y="${x.xy[1] + 3.5 * echelle}">${esc(x.c)}</text>`).join('') : ''}
      </g>
      <circle class="carte-rouen" cx="${R[0]}" cy="${R[1]}" r="${(5.5 * echelle).toFixed(2)}"/><text class="carte-rouen-nom" x="${R[0] + 10 * echelle}" y="${R[1] - 9 * echelle}">Rouen</text>
    </svg>`;
  }
  // relie les communes d'une carte : survol(l | null) au survol et au focus, choix(l) au clic et à Entrée / Espace
  function lier(racine, { survol = () => {}, choix = () => {} } = {}) {
    racine.querySelectorAll('.carte-lieu[data-l]').forEach(g => {
      const l = +g.dataset.l;
      g.addEventListener('mouseenter', () => survol(l)); g.addEventListener('mouseleave', () => survol(null));
      g.addEventListener('focus', () => survol(l)); g.addEventListener('blur', () => survol(null));
      g.addEventListener('click', () => choix(l));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choix(l); } });
    });
  }
  return { get K() { return C(); }, viewBox: C().viewBox, rouen: R, ENCART, fond: { pays: C().contour, belgique: C().belgique, luxembourg: C().luxembourg }, get lieux() { return C().lieux; },
    aVenir, tout, saison, spectacle, nom, bras, trait, bout, longueur, cadre, svg, lier, mouvement };
})();
</script>
<script>
/* L'ouverture des maquettes : le logo en grand. Au clic (ou au toucher), à la molette ou au glissé vers le bas, au
   clavier (Entrée, Espace, flèche bas, Page suivante), ses tentacules ondulent et s'écartent, il grossit à toute
   vitesse et le site apparaît à travers lui. Si le visiteur a demandé moins d'animations : un simple fondu.
   build.py l'ajoute après les données D ; chaque maquette l'habille dans son univers.

   INTRO.ouvrir({ fond, degrade, image, encre, tache, mot, sortie, classe, apres })
     à appeler une fois, au chargement ; l'ouverture ne s'affiche que si l'adresse est celle de l'accueil
     fond    : la couleur du fond (par défaut #14070f)
     degrade : un dégradé radial à la place du fond : [[0, '#3a1030'], [1, '#0d0710']] (du centre vers les bords)
     image   : une image (data URL) sous le logo, en couverture, par exemple une photo assombrie
     encre   : la couleur du logo (par défaut #fff) ; tache : true pour poser le logo sur sa tache magenta
     mot     : false pour la pieuvre seule, sans « crescite »
     sortie  : 'zoom' (par défaut : le site apparaît à travers le logo qui grossit) ou 'fondu'
     classe  : une classe en plus sur .intro, pour l'habiller en CSS (.intro, .intro-logo, .intro-indice)
     apres   : appelée quand le site est révélé (le focus va ensuite au titre h1 de la page)
   INTRO.ouverte()  vrai tant que l'ouverture est affichée ; l'évènement « intro:fin » est émis sur window à la fin
   ?intro=0 dans l'adresse : pas d'ouverture (captures, tests). Changer d'adresse ferme l'ouverture sans animation. */
const INTRO = (() => {
  const L = D.logo, [TG, TETE_G, TETE_D, TD] = L.octopusPaths;
  const CIBLE = [702, 706];                         // un point plein de la tête, où le zoom s'enfonce
  const PIVOT_G = [505, 840], PIVOT_D = [1030, 840]; // là où les tentacules extérieurs rejoignent la tête
  const mouvement = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ease = { inOut: t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2, out: t => 1 - (1 - t) ** 3, in: t => t ** 3 };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  let el = null, etat = 'ferme', opts = {}, raf = 0, inertes = [];

  function css() {
    if (document.getElementById('intro-style')) return;
    const s = document.createElement('style');
    s.id = 'intro-style';
    s.textContent = `
      html.intro-active, html.intro-active body { overflow: hidden !important; }

    const spSlug = slug && L.sp.find(s => s.slug === slug);

        <div id="ed-d-sans"></div>

        <label class="ed-champ" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ed-d-libre"${libre ? ' checked' : ''}> <span>Écrire la ligne moi-même</span></label>
        <div class="ed-champ" id="ed-d-int-z"${libre ? '' : ' hidden'}><input type="text" id="ed-d-int" value="${esc(F.intitule || '')}" aria-label="Ligne affichée"></div>
        <div class="ed-champ"><span>Précisions sous la ligne</span><div id="ed-d-det"></div><span class="ed-aide">Vide : le site écrit lui-même « 14h et 20h : représentations au … ».</span></div>
        <label class="ed-champ"><span>Lien (billetterie ou page du lieu)</span><input type="url" id="ed-d-lien" value="${esc(F.lien)}" placeholder="https://…"></label>
        <details><summary style="cursor:pointer;font-weight:700;margin-bottom:10px">Suivi interne (jamais publié)</summary><div class="ed-rangee">
          <label class="ed-champ"><span>Organisateur</span><input type="text" id="ed-s-org" value="${esc(F.suivi.organisateur || '')}"></label>
          <label class="ed-champ"><span>Contrat</span><select id="ed-s-contrat">${['', 'à envoyer', 'envoyé', 'signé'].map(x => `<option${(F.suivi.contrat || '') === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label></div>
          <label class="ed-champ"><span>Contact</span><input type="text" id="ed-s-contact" value="${esc(F.suivi.contact || '')}"></label>
          <label class="ed-champ"><span>Notes</span><textarea id="ed-s-notes">${esc(F.suivi.notes || '')}</textarea></label></details>
      </div>
      <div class="ed-pied"><span class="ed-note" id="ed-d-note">${d ? (d.source ? 'Ligne reprise de l’ancien site.' : '') : 'Nouvelle date'}</span>
        ${d ? '<button type="button" class="ed-bt" data-x="dupliquer">Dupliquer</button><button type="button" class="ed-bt ed-danger" data-x="supprimer">Supprimer</button>' : ''}
        <button type="button" class="ed-bt ed-plein" data-x="enregistrer">Enregistrer</button></div></div>`;
    document.body.append(voile);
    const P = voile.querySelector('.ed-panneau');
    const q = s => $(s, P);
    let sale = false;
    const lieuDe = () => L.li.find(l => l.id === F.lieu_id) || null;
    const apercu = () => {
      const rs = F.representations.filter(r => r.jour), js = rs.map(r => r.jour).sort();
      const dd = { ...F, debut: js[0] || F.debut, fin: js[js.length - 1] || F.fin || F.debut, precision: rs.length ? 'jour' : F.precision, intitule: libre ? F.intitule : null, details: (F.details || []).filter(x => (x.texte || '').trim()) };

      const lg = AGENDA.ligne(dd, rs, lieuDe()), pr = AGENDA.precisions(dd, rs, lieuDe());
      q('#ed-d-apercu').innerHTML = `<b>${esc(lg)}</b>${pr.map(p => `<div>${p.texte}</div>`).join('')}<div class="ed-aide">Saison ${esc(AGENDA.saisonDe(dd.debut))}${F.statut === 'option' || !F.visible ? ' · n’apparaît pas sur le site' : ''}</div>`;
      if (!libre) q('#ed-d-int').value = AGENDA.ligne({ ...dd, intitule: null }, rs, lieuDe());

    const reps_ = () => {
      q('#ed-d-reps').innerHTML = F.representations.map((r, i) => `<tr data-i="${i}"><td><input type="date" data-r="jour" value="${esc(r.jour)}" aria-label="Jour"></td>

        <td><select data-r="public" aria-label="Public"><option value="tout_public"${r.public === 'tout_public' ? ' selected' : ''}>Tout public</option><option value="scolaire"${r.public === 'scolaire' ? ' selected' : ''}>Scolaire</option><option value="autre"${r.public === 'autre' ? ' selected' : ''}>Autre</option></select></td>
        <td><input type="text" data-r="note" value="${esc(r.note)}" placeholder="complet…" aria-label="Précision"></td>
        <td style="white-space:nowrap"><label style="font-size:12px"><input type="checkbox" data-r="annulee"${r.annulee ? ' checked' : ''}> annulée</label></td>
        <td><button type="button" class="ed-bt ed-danger" data-retirer="${i}" title="Retirer">✕</button></td></tr>`).join('');
      q('#ed-d-sans').innerHTML = F.representations.length ? '' : `<div class="ed-rangee"><label class="ed-champ"><span>Début</span><input type="date" id="ed-d-debut" value="${esc(F.debut || '')}"></label>
        <label class="ed-champ"><span>Fin</span><input type="date" id="ed-d-fin" value="${esc(F.fin || '')}"></label>
        <label class="ed-champ"><span>Précision</span><select id="ed-d-prec">${[['jour', 'Jour'], ['periode', 'Période'], ['mois', 'Mois']].map(([k, l]) => `<option value="${k}"${F.precision === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label></div>`;
    };
    const details_ = () => {
      F.details = F.details || [];
      q('#ed-d-det').innerHTML = F.details.map((x, i) => `<div class="ed-item"><div class="ed-riche" contenteditable="true" data-det="${i}">${x.texte || ''}</div>
        <div style="display:flex;gap:6px;margin-top:6px"><input type="url" data-det-lien="${i}" value="${esc(x.lien || '')}" placeholder="Lien (facultatif)" aria-label="Lien"><button type="button" class="ed-bt ed-danger" data-det-suppr="${i}">✕</button></div></div>`).join('')
        + '<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="ed-bt" data-x="det-plus">＋ Précision</button><button type="button" class="ed-bt" data-x="det-auto">Proposer d’après les représentations</button></div>';
    };
    const changer = () => { sale = true; apercu(); };
    reps_(); details_(); apercu();
    // le lieu : chercher, ou créer (commune trouvée par geo.api.gouv.fr)
    const inp = q('#ed-d-lieu'), sug = $('.ed-sugg', P);
    const montrer = () => {
      const t = norm(inp.value).trim();
      const xs = L.li.filter(l => !t || norm(`${l.nom || ''} ${l.commune} ${l.departement}`).includes(t)).slice(0, 8);
      sug.innerHTML = xs.map(l => `<button type="button" data-id="${l.id}">${esc(lieuTexte(l))}</button>`).join('') + `<button type="button" data-nouveau>＋ Nouveau lieu${inp.value.trim() ? ` « ${esc(inp.value.trim())} »` : ''}</button>`;
      sug.hidden = false;

    inp.addEventListener('focus', montrer); inp.addEventListener('input', montrer);
    sug.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;

      const nv = q('#ed-d-nv'); nv.hidden = false;
      nv.innerHTML = `<div class="ed-item"><div class="ed-rangee"><label class="ed-champ"><span>Nom du lieu</span><input type="text" data-n="nom" value="${esc(inp.value.trim())}"></label>
        <label class="ed-champ"><span>Commune</span><input type="search" data-n="commune" autocomplete="off" placeholder="Eu, Falaise…"></label>
        <label class="ed-champ"><span>Département</span><input type="text" data-n="dep" placeholder="76"></label></div><div class="ed-sugg" data-n="sugg" hidden style="position:static"></div>
        <button type="button" class="ed-bt ed-plein" data-n="creer">Créer le lieu</button></div>`;
      let geo = null, t = null;
      const n = s => $(`[data-n="${s}"]`, nv);

        clearTimeout(t); geo = null;
        t = setTimeout(async () => {
          const v = n('commune').value.trim(); if (v.length < 2) return;
          try {
            const r = await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(v)}&fields=nom,code,codeDepartement,centre&boost=population&limit=6`);
            const xs = r.ok ? await r.json() : [];
            n('sugg').innerHTML = xs.map((c, i) => `<button type="button" data-i="${i}">${esc(c.nom)} (${esc(c.codeDepartement)})</button>`).join('');
            n('sugg').hidden = !xs.length;
            n('sugg').onclick = ev => { const x = ev.target.closest('[data-i]'); if (!x) return; geo = xs[+x.dataset.i]; n('commune').value = geo.nom; n('dep').value = geo.codeDepartement; n('sugg').hidden = true; };
          } catch { /* hors connexion */ }
        }, 250);
      });
      n('creer').addEventListener('click', async () => {
        const l = { nom: n('nom').value.trim() || null, commune: n('commune').value.trim(), departement: n('dep').value.trim(), code_insee: geo?.code || null,
          latitude: geo?.centre?.coordinates?.[1] ?? null, longitude: geo?.centre?.coordinates?.[0] ?? null, type: /coll[eè]ge|lyc[ée]e|[ée]cole/i.test(n('nom').value) ? 'etablissement' : 'salle' };
        if (!l.commune || !l.departement) return annoncer('Indiquez la commune et le département.', { erreur: true });
        try {
          const [cree] = await requete('POST', '/rest/v1/crescite_lieux', l, { Prefer: 'return=representation' });
          L.li.push(cree); F.lieu_id = cree.id; inp.value = lieuTexte(cree); nv.hidden = true; nv.innerHTML = ''; changer();
        } catch (e) { annoncer(`Lieu non créé : ${e.message}`, { erreur: true }); }
      });
      n('nom').focus();
    });
    const fermer = () => { if (sale && !confirm('Fermer sans enregistrer ?')) return; voile.remove(); };
    voile.addEventListener('mousedown', e => { if (e.target === voile) fermer(); });
    voile.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(); });
    P.addEventListener('input', e => {
      const t = e.target, tr = t.closest('tr[data-i]');
      if (tr && t.dataset.r) F.representations[+tr.dataset.i][t.dataset.r] = t.type === 'checkbox' ? t.checked : t.value;
      else if (t.id === 'ed-d-int') F.intitule = t.value;
      else if (t.id === 'ed-d-lien') F.lien = t.value;
      else if (t.id === 'ed-d-debut') F.debut = t.value;
      else if (t.id === 'ed-d-fin') F.fin = t.value;
      else if (t.dataset.det !== undefined) F.details[+t.dataset.det].texte = propre(t.innerHTML);
      else if (t.dataset.detLien !== undefined) F.details[+t.dataset.detLien].lien = t.value;
      else if (t.id === 'ed-s-org') F.suivi.organisateur = t.value;
      else if (t.id === 'ed-s-contact') F.suivi.contact = t.value;

    P.addEventListener('change', e => {
      const t = e.target, tr = t.closest('tr[data-i]');
      if (tr && t.dataset.r) F.representations[+tr.dataset.i][t.dataset.r] = t.type === 'checkbox' ? t.checked : t.value;
      else if (t.id === 'ed-d-sp') F.spectacle_id = +t.value;
      else if (t.id === 'ed-d-visible') F.visible = t.checked;
      else if (t.id === 'ed-d-prec') F.precision = t.value;
      else if (t.id === 'ed-s-contrat') F.suivi.contrat = t.value;
      else if (t.id === 'ed-d-libre') { libre = t.checked; q('#ed-d-int-z').hidden = !libre; F.intitule = libre ? q('#ed-d-int').value : null; }
      else return;
      changer();
    });
    P.addEventListener('click', async e => {
      const t = e.target, x = t.closest('[data-x]')?.dataset.x;
      const st = t.closest('[data-statut]');
      if (st) { F.statut = st.dataset.statut; $$('[data-statut]', P).forEach(b => b.setAttribute('aria-pressed', b === st)); return changer(); }
      if (t.dataset.retirer !== undefined) { F.representations.splice(+t.dataset.retirer, 1); reps_(); return changer(); }
      if (t.dataset.detSuppr !== undefined) { F.details.splice(+t.dataset.detSuppr, 1); details_(); return changer(); }
      if (!x) return;
      if (x === 'fermer') return fermer();
      const der = F.representations[F.representations.length - 1];
      if (x === 'meme-jour' || x === 'lendemain' || x === 'vide') {
        let jour = der?.jour || '', heure = '';
        if (x === 'lendemain' && jour) { const j = new Date(jour + 'T12:00:00'); j.setDate(j.getDate() + 1); jour = AGENDA.iso(j); heure = der.heure; }
        if (x === 'vide') { jour = ''; heure = '20:00'; }

        $(`#ed-d-reps tr:last-child [data-r="${x === 'vide' ? 'jour' : 'heure'}"]`, P)?.focus();

          await requete('DELETE', `/rest/v1/crescite_dates?id=eq.${d.id}`, undefined, { Prefer: 'return=minimal' });
          voile.remove(); await DONNEES.recharger({ force: true });
          annoncer('Date supprimée.', { action: async () => {
            const sans = o => { const y = { ...o }; delete y.modifie_le; delete y.modifie_par; return y; };
            try {
              await requete('POST', '/rest/v1/crescite_dates', sans(d), { Prefer: 'return=minimal' });
              if (reps.length) await requete('POST', '/rest/v1/crescite_representations', reps.map(sans), { Prefer: 'return=minimal' });
              if (suivi.date_id) await requete('POST', '/rest/v1/crescite_dates_suivi', sans(suivi), { Prefer: 'return=minimal' });
              await DONNEES.recharger({ force: true }); annoncer('Date rétablie.');
            } catch (er) { annoncer(`Rétablissement impossible : ${er.message}`, { erreur: true }); }
          }, delai: 9000 });
        } catch (er) { annoncer(`Suppression impossible : ${er.message}`, { erreur: true }); }
        return;
      }
      if (x === 'enregistrer') {
        const rs = F.representations.filter(r => r.jour);

        const js = rs.map(r => r.jour).sort(), debut = js[0] || F.debut;

          representations: rs.map(r => ({ id: r.id, jour: r.jour, heure: r.heure || null, public: r.public, annulee: !!r.annulee, lien: (r.lien || '').trim() || null, note: (r.note || '').trim() || null })), suivi: F.suivi };

        try {
          await requete('POST', '/rest/v1/rpc/crescite_enregistrer_date', { d: charge });

          annoncer(F.statut === 'option' || !F.visible ? 'Enregistré (non publié sur le site).' : 'Enregistré : le site est à jour.');
        } catch (er) { t.disabled = false; annoncer(`L’enregistrement a échoué : ${er.message}`, { erreur: true }); }
      }
    });
    if (depart) sale = true;
    (d ? q('#ed-d-sp') : q('#ed-d-lieu')).focus();
  }

  // ----------------------------------------------------------------------------------------------- écouteurs, en mode édition
  document.addEventListener('click', e => {
    if (!moi.actif) return;
    if (e.target.closest('.ed-boite')) return;
    const ed = e.target.closest('[data-edit]');
    if (ed) { e.preventDefault(); e.stopPropagation(); return; }                 // on écrit, on ne suit pas les liens
    const ph = e.target.closest('[data-edit-photo]');
    if (ph) { e.preventDefault(); e.stopPropagation(); return changerPhoto(ph); }
    const dt = e.target.closest('[data-date-id]');
    if (dt && dt.dataset.dateId) { e.preventDefault(); e.stopPropagation(); return ouvrirDate(+dt.dataset.dateId); }
  }, true);
  document.addEventListener('focusin', e => { if (moi.actif && e.target.closest?.('[data-edit]')) montrerOutils(e.target.closest('[data-edit]')); });
  document.addEventListener('focusout', e => { const el = e.target.closest?.('[data-edit]'); if (moi.actif && el) { saisir(el); setTimeout(() => { if (outils && !outils.contains(document.activeElement) && !document.activeElement?.closest?.('[data-edit]')) outils.hidden = true; }, 120); } });
  document.addEventListener('input', e => { const el = e.target.closest?.('[data-edit]'); if (moi.actif && el) { el.classList.add('ed-modifie'); noter(el.dataset.edit); } });
  document.addEventListener('keydown', e => {
    if (!moi.actif) return;
    const el = e.target.closest?.('[data-edit]');
    if (el && e.key === 'Escape') el.blur();
    if (el && e.key === 'Enter' && !el.dataset.edRiche) { e.preventDefault(); el.blur(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (el) saisir(el); enregistrer(); }
  }, true);
  document.addEventListener('paste', e => {
    const el = e.target.closest?.('[data-edit], .ed-riche');
    if (!moi.actif || !el) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  }, true);
  window.addEventListener('beforeunload', e => { if (moi.actif && modifies.size) { e.preventDefault(); e.returnValue = ''; } });

  // ----------------------------------------------------------------------------------------------- connexion
  function ecranConnexion() {
    styles();
    const voile = document.createElement('div');
    voile.className = 'ed-voile ed-boite';
    voile.innerHTML = `<form class="ed-panneau ed-petit" role="dialog" aria-modal="true" aria-labelledby="ed-c-titre">
      <div class="ed-tete"><h2 id="ed-c-titre">Modifier le site</h2><button type="button" class="ed-bt" data-x="fermer">Fermer</button></div>
      <div class="ed-corps"><p class="ed-aide" style="margin:0 0 12px">Réservé à la compagnie : connectez-vous avec le compte de l’administration.</p>
        <label class="ed-champ"><span>Adresse électronique</span><input type="email" id="ed-c-mel" autocomplete="username" required></label>
        <label class="ed-champ"><span>Mot de passe</span><input type="password" id="ed-c-mdp" autocomplete="current-password" required></label>
        <p class="ed-aide" id="ed-c-err" role="alert" style="color:#b3261e;margin:0 0 8px"></p></div>
      <div class="ed-pied"><a class="ed-note" href="${ADMIN}" target="_blank" rel="noopener">Mot de passe oublié ?</a><button type="submit" class="ed-bt ed-plein">Se connecter</button></div></form>`;
    document.body.append(voile);
    $('#ed-c-mel', voile).focus();
    $('[data-x="fermer"]', voile).addEventListener('click', () => voile.remove());
    voile.addEventListener('keydown', e => { if (e.key === 'Escape') voile.remove(); });
    $('form', voile).addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('button[type=submit]', voile); b.disabled = true;
      try {
        session = await auth('password', { email: $('#ed-c-mel', voile).value.trim(), password: $('#ed-c-mdp', voile).value });
        garderSession(session);
        if (!(await estAdmin())) throw new Error('Ce compte n’administre pas le site de la compagnie.');
        voile.remove(); entrer();
      } catch (err) { b.disabled = false; $('#ed-c-err', voile).textContent = /invalid/i.test(err.message) ? 'Adresse ou mot de passe incorrect.' : err.message; }
    });
  }
  moi.ouvrir = async () => {
    if (moi.actif) return;
    styles();
    if (typeof DONNEES === 'undefined' || DONNEES.etat !== 'base') {
      if (typeof DONNEES !== 'undefined' && DONNEES.etat === 'instantane') await DONNEES.recharger();
      if (typeof DONNEES === 'undefined' || DONNEES.etat !== 'base') return annoncer('La base de la compagnie ne répond pas : la modification est impossible pour l’instant.', { erreur: true });
    }
    session = lireSession();
    if (session) { try { await jeton(); if (await estAdmin()) return entrer(); } catch { session = null; garderSession(null); } }
    ecranConnexion();
  };
  // #edition dans l'adresse (lien depuis l'administration) ouvre directement l'édition
  if (/[?&]edition\b/.test(location.search)) setTimeout(() => moi.ouvrir(), 600);
  return moi;
})();
</script>
<script>
/* Le dossier d'un spectacle, en PDF, composé à la demande depuis les données du site (D) : pour les programmateurs et
   les directeurs de salle. Toujours à jour avec la base, sans fichier à refaire. build.py l'ajoute aux outils communs ;
   pdfmake (admin/vendor/, publié avec le site) n'est chargé qu'au premier clic.

   DOSSIER.telecharger(slug)   compose le PDF du spectacle et le télécharge (« dossier-<slug>.pdf ») ; rend une promesse
   DOSSIER.pdf(slug)           la même chose, rendue en Blob
   DOSSIER.vendor              le dossier de pdfmake (par défaut admin/vendor/, à côté des maquettes)

   Ce qu'il contient, tiré de D : la couverture (titre, sous-titre, création, photo, couleur de l'univers), le spectacle
   (sa présentation), la distribution (D.shows[].equipe ou « avec », puis la fiche), les conditions d'accueil (format,
   durée, jauge, équipe, et la fiche technique quand le dossier du spectacle l'a), la diffusion (représentations, lieux),
   la production, et le contact diffusion (D.site.programmation). Aucun texte n'est inventé : seuls les intitulés
   viennent de D.site.libelles. */
const DOSSIER = (() => {
  'use strict';
  const L = () => (D.site && D.site.libelles) || {};
  const ENCRE = '#1d1720', GRIS = '#5f5763', TRAIT = '#dcd5db', LARGEUR = 595.28 - 2 * 52;
  let chargement = null;
  const script = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(`impossible de charger ${src}`)); document.head.append(s); });
  function charger() {
    if (typeof pdfMake !== 'undefined' && pdfMake.vfs && pdfMake.vfs['Roboto-Regular.ttf']) return Promise.resolve();
    if (!chargement) {
      const dossier = String(api.vendor).replace(/\/?$/, '/');
      chargement = (typeof pdfMake !== 'undefined' ? Promise.resolve() : script(dossier + 'pdfmake.min.js'))
        .then(() => (pdfMake.vfs && pdfMake.vfs['Roboto-Regular.ttf'] ? null : script(dossier + 'vfs_fonts.js')))
        .catch(e => { chargement = null; throw e; });
    }
    return chargement;
  }
  // la police du PDF (Roboto) n'a pas certains signes : on les remplace
  const pt = s => String(s ?? '').replace(/ /g, ' ').replace(/[→⟶]/g, '–');
  // du HTML des sources vers des morceaux de texte pdfmake : italique, gras, retours à la ligne
  function morceaux(html) {
    const doc = new DOMParser().parseFromString(`<div>${String(html ?? '')}</div>`, 'text/html');
    const out = [];
    const marcher = (n, st) => {
      if (n.nodeType === 3) { if (n.textContent) out.push({ text: pt(n.textContent), ...st }); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase();
      if (t === 'br') { out.push({ text: '\n' }); return; }
      const s2 = { ...st, ...(t === 'em' || t === 'i' ? { italics: true } : {}), ...(t === 'strong' || t === 'b' ? { bold: true } : {}) };
      n.childNodes.forEach(c => marcher(c, s2));
      if (t === 'p' || t === 'li') out.push({ text: '\n' });
    };
    doc.body.firstChild.childNodes.forEach(c => marcher(c, {}));
    while (out.length && out[out.length - 1].text === '\n') out.pop();
    return out.length ? out : [{ text: '' }];
  }
  const brut = html => morceaux(html).map(x => x.text).join('').trim();
  const maj = t => pt(t).charAt(0).toUpperCase() + pt(t).slice(1);
  // une photo en JPEG (pdfmake ne lit ni le WebP ni les adresses), recadrée au centre : au rapport largeur/hauteur « ratio »,
  // ou au moins « large » (une photo en hauteur ne mange pas la couverture) ; rien si elle ne se charge pas
  async function image(url, { max = 1400, ratio = 0, large = 0 } = {}) {
    if (!url) return null;
    try {
      const r = await fetch(url, { mode: 'cors' });
      if (!r.ok) return null;
      const bmp = await createImageBitmap(await r.blob());
      let sx = 0, sy = 0, sl = bmp.width, sh = bmp.height;
      const voulu = ratio || (large && sl / sh < large ? large : 0);
      if (voulu && sl / sh > voulu) { sl = Math.round(sh * voulu); sx = Math.round((bmp.width - sl) / 2); }
      else if (voulu) { sh = Math.round(sl / voulu); sy = Math.round((bmp.height - sh) / 2); }
      const k = Math.min(1, max / Math.max(sl, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sl * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(bmp, sx, sy, sl, sh, 0, 0, c.width, c.height);
      return { data: c.toDataURL('image/jpeg', 0.86), l: c.width, h: c.height };
    } catch { return null; }
  }
  const titreSection = (t, couleur) => ({ intitule: true, stack: [{ text: pt(t).toUpperCase(), fontSize: 8.5, bold: true, characterSpacing: 1.3, color: couleur },
    { canvas: [{ type: 'line', x1: 0, y1: 3, x2: LARGEUR, y2: 3, lineWidth: 0.6, lineColor: TRAIT }] }], margin: [0, 20, 0, 6] });
  const sobre = { hLineWidth: (i, n) => (i === 0 || i === n.table.body.length ? 0 : 0.5), vLineWidth: () => 0, hLineColor: () => TRAIT,
    paddingLeft: i => (i === 0 ? 0 : 10), paddingRight: () => 0, paddingTop: () => 4, paddingBottom: () => 4 };

  async function definition(slug) {
    const s = (D.shows || []).find(x => x.slug === slug);
    if (!s) throw new Error(`spectacle inconnu : ${slug}`);
    const lib = L(), couleur = s.couleurTexteClair || s.couleur || '#a3306b';
    const nom = (D.site && D.site.nom) || 'Compagnie Crescite';
    const photos = D.photos || {};
    const [principale, ...galerie] = await Promise.all([image(photos[s.slug], { max: 1600, large: 1.4 }),
      ...(s.photos || []).slice(0, 2).map(p => image(photos[p.cle], { max: 1000, ratio: 3 / 2 }))]);
    const contenu = [];
    // la couverture
    contenu.push({ canvas: [{ type: 'rect', x: 0, y: 0, w: LARGEUR, h: 5, color: couleur }] });
    contenu.push({ text: pt(nom).toUpperCase(), fontSize: 8.5, bold: true, characterSpacing: 1.4, color: GRIS, margin: [0, 14, 0, 0] });
    contenu.push({ text: pt((s.titreLignes || [s.titre]).join(' ')), fontSize: 30, bold: true, color: couleur, margin: [0, 8, 0, 0], lineHeight: 1.02 });
    if (s.sousTitre) contenu.push({ text: morceaux(s.sousTitre), fontSize: 12.5, color: ENCRE, margin: [0, 4, 0, 0] });
    const sous = [s.creation, s.duree].filter(Boolean).map(x => maj(brut(x))).join('   ·   ');
    if (sous) contenu.push({ text: pt(sous), fontSize: 10, color: GRIS, margin: [0, 8, 0, 0] });
    if (principale) contenu.push({ image: principale.data, width: LARGEUR, margin: [0, 16, 0, 0] });
    if (s.credit) contenu.push({ text: morceaux(s.credit), fontSize: 7.5, color: GRIS, alignment: 'right', margin: [0, 3, 0, 0] });
    if (s.accroche) contenu.push({ text: morceaux(s.accroche), fontSize: 13, italics: true, margin: [0, 16, 0, 0], lineHeight: 1.3 });
    // le spectacle
    if ((s.texte || []).length) {
      contenu.push(titreSection(lib.leSpectacle || 'Le spectacle', couleur));
      s.texte.forEach((p, i) => contenu.push({ text: morceaux(p), margin: [0, i ? 6 : 0, 0, 0], alignment: 'justify' }));
    }
    if (galerie.filter(Boolean).length) {
      const g = galerie.filter(Boolean), l = (LARGEUR - 10 * (g.length - 1)) / g.length;
      contenu.push({ columns: g.map(x => ({ image: x.data, width: l })), columnGap: 10, margin: [0, 14, 0, 0] });
    }
    // la distribution
    const equipe = s.equipe || [], P = D.personnes || {};
    const nomDe = x => { const p = P[x.personne] || {}; return [p.prenom, p.nom].filter(Boolean).join(' '); };
    const jeu = equipe.filter(x => x.categorie === 'jeu');
    // un spectacle en création n'a parfois que l'équipe de création annoncée (« Mise en scène : … ») : elle remplace la fiche
    const creation = (s.programmer && s.programmer.equipeCreation) || [];
    const fiche = (s.fiche || []).filter(f => f.valeur && (f.libelle || !creation.length));
    if (jeu.length || s.avec || fiche.length || creation.length) {
      contenu.push(titreSection(lib.distribution || 'Distribution', couleur));
      if (jeu.length) contenu.push({ text: jeu.map((x, i) => [{ text: (i ? ', ' : '') + pt(nomDe(x)), bold: true }, ...(x.alternance ? [{ text: pt(` (${x.alternance})`), color: GRIS }] : [])]).flat(), margin: [0, 0, 0, 6] });
      else if (s.avec) contenu.push({ text: [{ text: pt(brut(s.avec.libelle)) + ' ', color: GRIS }, ...morceaux(s.avec.valeur)], margin: [0, 0, 0, 6] });
      creation.forEach(x => { const [l, ...v] = brut(x).split(' : ');
        contenu.push({ text: v.length ? [{ text: pt(l) + ' : ', color: GRIS }, { text: pt(v.join(' : ')) }] : pt(l), margin: [0, 0, 0, 3] }); });
      const avecLibelle = fiche.filter(f => f.libelle), sans = fiche.filter(f => !f.libelle);
      if (avecLibelle.length) contenu.push({ table: { widths: [150, '*'], body: avecLibelle.map(f => [{ text: pt(brut(f.libelle)), color: GRIS }, { text: morceaux(f.valeur) }]) }, layout: sobre });
      sans.forEach(f => contenu.push({ text: morceaux(f.valeur), margin: [0, 2, 0, 0] }));
    }
    // les conditions d'accueil
    const pr = s.programmer || {}, accueil = s.dossier && D.dossiers && D.dossiers[s.dossier] && D.dossiers[s.dossier].accueil;
    // la fiche technique du dossier reprend déjà la durée, la jauge et l'équipe : on ne les écrit pas deux fois
    const lignes = (accueil ? [pr.format] : [pr.format, pr.duree || s.duree, pr.jauge, pr.equipe]).filter(Boolean);
    if (lignes.length || accueil) {
      contenu.push(titreSection(lib.conditionsAccueil || 'Conditions d’accueil', couleur));
      lignes.forEach((x, i) => contenu.push({ text: maj(brut(x)), bold: i === 0 && x === pr.format, margin: [0, 0, 0, 3] }));
      // chaque bloc de la fiche technique (« PLATEAU : », « MATÉRIEL… ») reste d'un seul tenant
      if (accueil) (accueil.blocs || []).forEach(b => contenu.push({ unbreakable: true, stack: [
        ...(b.titre ? [{ text: pt(brut(b.titre)), bold: true, fontSize: 9.5, margin: [0, 8, 0, 2] }] : []),
        ...(b.lignes || []).map(x => ({ text: morceaux(x), margin: [0, 0, 0, 2] }))] }));
      if (lib.conditionsFinancieres) contenu.push({ text: pt(lib.conditionsFinancieres), color: GRIS, margin: [0, 8, 0, 0] });
    }
    // la diffusion
    if (pr.representations || pr.lieux || pr.actualite) {
      contenu.push(titreSection(lib.representations || 'Représentations', couleur));
      if (pr.representations) contenu.push({ text: maj(brut(pr.representations)), bold: true, margin: [0, 0, 0, 4] });
      if (pr.actualite) contenu.push({ text: maj(brut(pr.actualite)), margin: [0, 0, 0, 4] });
      if (pr.lieux) contenu.push({ text: [{ text: pt(lib.lieuxDiffusion || '') + (lib.lieuxDiffusion ? ' : ' : ''), color: GRIS }, ...morceaux(pr.lieux)] });
    }
    // la production
    if ((s.production || []).length) {
      contenu.push(titreSection(lib.production || 'Production', couleur));
      s.production.forEach(x => contenu.push({ text: morceaux(x), fontSize: 9, margin: [0, 0, 0, 3] }));
    }
    // le contact
    const c = (D.site && D.site.programmation && D.site.programmation.contact) || {};
    if (c.nom || c.email) {
      contenu.push(titreSection(lib.contactDiffusion || 'Contact', couleur));
      contenu.push({ text: [{ text: pt(c.nom || ''), bold: true }, ...(c.role ? [{ text: pt(`, ${c.role}`), color: GRIS }] : [])] });
      if (c.email) contenu.push({ text: pt(c.email), link: `mailto:${c.email}`, color: couleur });
      if (c.telephone) contenu.push({ text: pt(c.telephone), link: `tel:${String(c.telephone).replace(/[^\d+]/g, '')}` });
      const co = D.site.coordonnees || {};
      const adresse = [co.nom, ...(co.adresse || [])].filter(Boolean).map(brut);
      if (adresse.length) contenu.push({ text: pt(adresse.join(' · ')), color: GRIS, fontSize: 8.5, margin: [0, 6, 0, 0] });
    }
    // un intitulé de section n'est jamais seul en bas de page : il part avec l'élément qui le suit
    for (let i = contenu.length - 2; i >= 0; i--) {
      if (contenu[i].intitule) contenu.splice(i, 2, { unbreakable: true, stack: [contenu[i], contenu[i + 1]] });
    }
    return {
      pageSize: 'A4', pageMargins: [52, 54, 52, 50],
      info: { title: pt(`${s.titre} · ${nom}`), author: pt(nom) },
      defaultStyle: { font: 'Roboto', fontSize: 9.8, lineHeight: 1.28, color: ENCRE },
      header: page => (page === 1 ? null : { margin: [52, 24, 52, 0], columns: [
        { text: pt(nom), fontSize: 7.5, color: GRIS }, { text: pt(s.titre), fontSize: 7.5, color: GRIS, alignment: 'right' }] }),
      footer: (page, pages) => ({ margin: [52, 18, 52, 0], columns: [
        { text: pt(`${nom} · ${s.titre}`), fontSize: 7.5, color: GRIS }, { text: `${page} / ${pages}`, fontSize: 7.5, color: GRIS, alignment: 'right' }] }),
      content: contenu,
    };
  }
  async function pdf(slug) {
    await charger();
    const dd = await definition(slug);
    return new Promise((ok, ko) => { try { pdfMake.createPdf(dd).getBlob(ok); } catch (e) { ko(e); } });
  }
  async function telecharger(slug) {
    const blob = await pdf(slug);
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `dossier-${slug}.pdf`; a.rel = 'noopener';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return blob;
  }
  const api = { telecharger, pdf, definition, vendor: 'admin/vendor/' };
  return api;
})();
</script>
<script>
/* Les tentacules, communes aux maquettes et à l'administration : la pieuvre du logo, dans l'en-tête, guide le visiteur.
   Chaque clic lui répond : ses bras se contractent et ondulent, une tentacule fine part de la pieuvre, s'enroule sur le
   point cliqué, y laisse l'empreinte d'une ventouse, puis se retire. Chaque changement de page « remonte » une tentacule :
   elle traverse l'écran, à la couleur de la destination, et la pieuvre la reprend. Ouvrir (une saison, un panneau, un menu)
   la déroule le long de ce qui s'ouvre, fermer l'enroule ; un onglet la voit glisser jusqu'à lui ; envoyer un formulaire
   ou enregistrer l'enroule autour du bouton. Un seul code : chaque maquette l'habille dans son style.
   build.py l'ajoute après edition.js dans chaque maquette et le copie à côté de l'index.html de l'administration, qui le charge.

   RIEN N'EST RETARDÉ NI BLOQUÉ : écouteurs passifs en phase de capture, jamais de preventDefault, un seul calque fixe
   (pointer-events: none, aria-hidden), un seul requestAnimationFrame, arrêté quand plus rien ne joue et quand l'onglet est
   caché. Aucun texte n'est ajouté. Des clics rapides remplacent l'animation en cours, sans file d'attente. Rien ne joue
   dans un champ ni dans un texte en cours d'écriture (input, textarea, select, [contenteditable]), ni tant que
   INTRO.ouverte() est vrai. prefers-reduced-motion : au plus un fondu bref, aucune tentacule qui voyage.
   ?anim=0 dans l'adresse : aucune animation (captures, tests).

   Ce que la maquette fournit
   - data-pieuvre sur l'élément du logo de l'en-tête (le <span> ou <a> qui contient D.logo.mark, D.logo.octopus ou son
     propre dessin de la pieuvre). L'outil y retrouve les quatre tracés de D.logo.octopusPaths et les anime EN PLACE
     (bras, tête) ; les bras de D.arms donnent le point de départ des tentacules (celui du spectacle visé, quand on va vers
     sa page : D.arms.armOf). Hôte vide : l'outil y met la pieuvre (D.logo.octopus, ou un dessin neutre). Hôte sans tracé
     reconnu : il pulse en entier. Pas d'hôte visible : les tentacules partent du bord le plus proche.
   - TENTACULES.regler({ style, encre, accent, ventouse, neutre, epaisseur, duree, … }), à appeler une fois :
       style       'encre' (défaut : tentacule pleine et effilée, ventouses) · 'trait' (un trait gravé, à hachures)
                   · 'lumiere' (un filet de lumière, avec halo) · 'fil' (un fil très fin) · 'ventouses' (deux rangées)
       encre       la couleur des tentacules                      accent   l'empreinte, les enroulements, les confirmations
       ventouse    la couleur des ventouses (défaut : un voile)    neutre   la remontée des pages sans couleur propre
       epaisseur   l'épaisseur de la tentacule fine, en px (2.2)   duree    facteur de durée (1 = normal)
       pieuvre     sélecteur du guide ('[data-pieuvre]')           page     sélecteur de ce que la remontée soulève ('main')
       entrees     'auto' (défaut), 'vive' ou 'couleur' : quelle couleur de D.site.entrees prend la remontée
       couleurDe   function (hash) → couleur CSS, ou rien : la destination à la main ; false : la maquette a son propre geste pour
                   cette page, la pieuvre seule répond (pas de tentacule de page)
       voie        'bas' (défaut) : la tentacule de page part de sous l'écran, à la hauteur du clic ; 'clic' : elle sort du point
                   cliqué lui-même et remonte
       remontee    false : pas de tentacule de page    soulever  true : la page se soulève de 24 px et paraît, en 460 ms,
                   quand la tentacule remonte. Un transform sur <main> déplace ses descendants position: fixed pendant ce
                   temps : à n'activer que si <main> n'en contient pas (hors de la page : une barre, une photo de fond, ça va)
       profil      'admin' : tout dure 350 ms au plus, les tentacules restent près du bouton (jamais devant un champ)
       detail      retouche le style choisi : { page (finesse de la tentacule de page : 1 = pleine, .1 = un fil), ventouses (0, 1 ou 2
                   rangées), hachures, halo, empreinte ('anneau', 'grande', 'etoile', 'lueur', 'point'), corps, opa }
   - des variables CSS, sur :root (ou sur une région : l'outil lit celles de l'élément cliqué) :
       --tt-encre  --tt-accent  --tt-ventouse  --tt-neutre  --tt-epaisseur  --tt-duree  --tt-style
       --tt-fond   le liseré qui détache la tentacule d'un fond sombre (défaut : la couleur de la page)
   - des attributs : data-tt="rien" (aucune animation ici) ou le genre d'un geste : "onglet", "ouvre", "bascule", "case",
     "route", "retour", "clic" ; data-tt-couleur="#…" sur un lien (la couleur de sa remontée) ; data-tt-cible="x,y" sur un
     élément de la page qui arrive (x et y : fractions de sa boîte, .5,.5 par défaut) : la tentacule de page y finit, au lieu de la
     pieuvre (une porte à ouvrir, un titre à atteindre) ; data-tt-local sur un
     conteneur dont les boutons n'ont que des tentacules courtes (la barre d'édition, un panneau) ; data-tt-zone sur la
     fiche qu'un lien « retour » referme (par défaut .editeur).
   Les gestes se reconnaissent seuls : un lien #/… (remontée de page), un onglet (aria-current, aria-selected, role="tab" :
   la tentacule glisse de l'onglet quitté à l'onglet choisi), un <summary> ou un bouton aria-expanded (elle se déroule
   quand ça s'ouvre, s'enroule quand ça se ferme), un bouton aria-pressed ou une case, un envoi de formulaire (elle
   s'enroule autour du bouton), le panneau de date et l'enregistrement de l'édition sur place.

   TENTACULES.toucher(el | [x, y])      une tentacule fine jusqu'à ce point, et son empreinte
   TENTACULES.page(destination)         la remontée d'une page ('#/voir', une couleur CSS ou {couleur, slug}) ; automatique

  /* ---------- les couleurs : chaque univers garde ses contrastes (AA) ---------- */
  const valide = (h) => /^#[0-9a-f]{6}$/i.test(h || '');
  const rvb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const canal = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const lum = (h) => { const [r, g, b] = rvb(h).map(canal); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  // une couleur poussée vers le noir (fonds clairs) ou vers le blanc (fonds sombres) jusqu'à se lire sur tous ses fonds
  function ajuste(c, fonds, cible) {

    for (const c of cs) {
      const m = Math.min(...fonds.map((f) => contraste(c, f)));
      if (m >= cible) return c;
      if (m >= cible * 0.7) return ajuste(c, fonds, cible + 0.1);

    return ajuste(cs[0] || '#888888', fonds, cible + 0.1);
  }
  const surCouleur = (c, cands) => cands.filter(valide).sort((a, b) => contraste(b, c) - contraste(a, c))[0];

    };

      choisi = l === choisi ? null : l;
      $$('.est-choisi', racine).forEach((e) => e.classList.remove('est-choisi'));
      svg.classList.toggle('a-choix', choisi != null);

        $$('.dates-groupe', liste).forEach((g) => { g.hidden = choisi != null && !$$('li[data-l]:not([hidden])', g).length; });
      }
      if (filtre) {

        const b = $('button', filtre);

  // les bras des cartes poussent depuis Rouen quand on les atteint (pas lors d'une mise à jour en place)

    if (obsCartes) { obsCartes.disconnect(); obsCartes = null; }
    if (enPlace || !CARTE.mouvement() || !('IntersectionObserver' in window)) return;
    const svgs = $$('svg.carte', racine).filter((svg) => $('clipPath circle', svg));
    svgs.forEach((svg) => { const c = $('clipPath circle', svg); c.dataset.r = c.getAttribute('r'); c.setAttribute('r', '0'); });
    obsCartes = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      obsCartes.unobserve(e.target);
      const c = $('clipPath circle', e.target), R = +c.dataset.r, t0 = performance.now();
      const pas = (t) => { const k = clamp((t - t0) / 1700); c.setAttribute('r', (R * doux(k)).toFixed(1)); if (k < 1) requestAnimationFrame(pas); };
      requestAnimationFrame(pas);

    svgs.forEach((svg) => obsCartes.observe(svg));
  }

  function cadrage(a, b, k) {

      const f = k / N, t = g * f, a = (1 - t) ** 2, c2 = 2 * (1 - t) * t, c = t * t;
      const px = a * rx + c2 * qx + c * x, py = a * ry + c2 * qy + c * y;
      let tx = 2 * (1 - t) * (qx - rx) + 2 * t * (x - qx), ty = 2 * (1 - t) * (qy - ry) + 2 * t * (y - qy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = (w0 * (1 - f) + w1 * f) / 2;
      G.push(`${(px - ty * w).toFixed(2)} ${(py + tx * w).toFixed(2)}`);
      Dr.push(`${(px + ty * w).toFixed(2)} ${(py - tx * w).toFixed(2)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  function mesurerCarte() {
    if (vue !== 'accueil' || !cc || !cc.el) return;
    cc.statique = MQ_REDUIT.matches;
    cc.el.classList.toggle('est-statique', cc.statique);
    cc.W = cc.boite.clientWidth || 1;
    cc.H = cc.boite.clientHeight || 1;
    cc.tops = cc.mois.map((m) => m.offsetTop);
    cc.BRAS.forEach((b) => { b.s = -1; });
    cc.p = -1;
    majCarte();
  }
  function majCarte() {
    if (vue !== 'accueil' || !cc || !cc.el) return;
    const r = cc.el.getBoundingClientRect(), total = cc.el.offsetHeight - innerHeight;
    const p = cc.statique ? 1 : clamp(-r.top / Math.max(1, total));
    if (p === cc.p) return;
    cc.p = p;
    rendreCarte(p);
  }
  function rendreCarte(p) {
    const { MOIS, BRAS, CAMS, CAM0, CAM_FIN, R } = cc, M = MOIS.length;
    const f = clamp((p - P0) / (P1 - P0)) * M;
    const m = Math.min(M - 1, Math.floor(f));
    const u = f >= M ? 1 : f - m;
    const fin = cc.statique ? 1 : clamp((p - P1) / (1 - P1));
    const cam = fin > 0 ? cadrage(CAMS[M - 1], CAM_FIN, doux(fin)) : cadrage(m ? CAMS[m - 1] : CAM0, CAMS[m], doux(clamp(u / 0.5)));
    cc.svg.setAttribute('viewBox', cam.map((v) => v.toFixed(2)).join(' '));
    const W = cc.W, H = cc.H, s = Math.min(W / cam[2], H / cam[3]);
    const ox = (W - cam[2] * s) / 2 - cam[0] * s, oy = (H - cam[3] * s) / 2 - cam[1] * s;
    const ici = new Set(fin > 0 ? [] : MOIS[m].ls);
    cc.halo.setAttribute('r', (0.5 * Math.max(W, H) / s).toFixed(1));
    for (const b of BRAS) {
      let g, h;
      if (fin > 0 || f >= M || b.mois < m) { g = 1; h = 1; }
      else if (b.mois > m) { g = 0; h = 0; }
      else { const d0 = 0.14 + 0.3 * (b.rang / Math.max(1, b.nb)); g = doux(clamp((u - d0) / 0.4)); h = clamp((u - d0 - 0.36) / 0.16); }
      if (Math.abs(g - b.g) > 1e-4 || Math.abs(s - b.s) > 1e-4) {
        const w0 = b.w / s, w1 = 0.7 / s;
        b.el.setAttribute('d', g >= 1 ? CARTE.bras(b.xy, { w0, w1, courbe: b.courbe }) : brasPartiel(b, g, w0, w1));
        if (Math.abs(s - b.s) > 1e-4) { b.sp.setAttribute('d', CARTE.bout(b.xy, { r: 7 / s, courbe: b.courbe })); b.sp.style.strokeWidth = (1.6 / s).toFixed(3); }
        b.g = g; b.s = s;
      }
      b.sp.style.strokeDashoffset = String(1 - h);
      const actif = ici.has(b.l), pousse = g > 0.97;
      b.el.classList.toggle('est-passe', pousse && !actif && fin === 0);
      b.pt.classList.toggle('est-pousse', pousse);
      b.pt.classList.toggle('est-actif', pousse && actif);
      const voir = pousse && actif && g >= 0.99;
      b.nom.classList.toggle('est-visible', voir);
      if (voir || b.nom.style.transform === '') b.nom.style.transform = `translate(${(b.xy[0] * s + ox).toFixed(1)}px,${(b.xy[1] * s + oy).toFixed(1)}px)`;
    }
    // deux noms voisins ne se chevauchent pas : le nom de gauche passe à gauche de son point
    const vus = BRAS.filter((b) => b.nom.classList.contains('est-visible')).map((b) => ({ b, x: b.xy[0] * s + ox, y: b.xy[1] * s + oy })).sort((a, b) => a.x - b.x);
    BRAS.forEach((b) => { b.nom.classList.remove('vers-gauche', 'vers-droite'); });
    vus.forEach((v, i) => vus.slice(i + 1).forEach((w) => {
      if (Math.abs(w.y - v.y) < 24 && w.x - v.x < 170) {
        if (v.b.nom.classList.contains('a-gauche')) w.b.nom.classList.add('vers-droite'); else v.b.nom.classList.add('vers-gauche');
      }
    }));
    cc.nomRouen.style.transform = `translate(${(R[0] * s + ox).toFixed(1)}px,${(R[1] * s + oy).toFixed(1)}px)`;
    cc.onde.classList.toggle('est-actif', [...cc.L_ROUEN].some((l) => ici.has(l)));
    if (!cc.statique) {
      const fr = fin > 0 ? M - 1 : m === 0 ? 0 : m - 1 + doux(clamp(u / 0.2));
      const i0 = Math.floor(fr), i1 = Math.min(M - 1, i0 + 1), k = fr - i0;
      const y = cc.tops[i0] + (cc.tops[i1] - cc.tops[i0]) * k;
      cc.liste.style.transform = `translate3d(0,${(-y).toFixed(1)}px,0)`;
      const actifM = Math.round(fr);
      cc.mois.forEach((el, j) => el.classList.toggle('est-actif', j === actifM));
    } else {
      cc.liste.style.transform = '';
      cc.mois.forEach((el) => el.classList.add('est-actif'));
    }
  }

  /* l'état au défilement : le ton de l'en-tête, le repère du sommaire, la carte de l'accueil */
  let vue = null, route = null, zones = [], chapitres = [], actif = null;
  function monterSommaire() {
    const racine = vue === 'accueil' ? vueAccueil : vue === 'spectacle' ? vueSpectacle : null;
    chapitres = racine ? $$('[data-som]', racine) : [];
    sommaire.hidden = !chapitres.length;
    sommaire.setAttribute('aria-label', vue === 'spectacle' && route && route.s ? route.s.titre : L().lesSpectacles);
    $('ol', sommaire).innerHTML = chapitres.map((c, k) => `<li><button type="button" data-cible="${k}"><span class="som-titre">${esc(c.dataset.som)}</span><span class="som-trait" aria-hidden="true"></span></button></li>`).join('');
    actif = null;
  }
  function majSommaire(k) {
    if (k === actif) return;
    actif = k;
    sommaire.classList.toggle('est-cache', k < 0);
    $$('button', sommaire).forEach((b, j) => { if (j === k) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
    if (k >= 0) { sommaire.style.setProperty('--som-accent', chapitres[k].dataset.accent || '#ef84b8'); sommaire.dataset.ton = chapitres[k].dataset.ton === 'clair' ? 'clair' : 'sombre'; }
  }
  function majEtat() {
    const y = tete.offsetHeight / 2;
    let ton = 'chapitre';
    for (const el of zones) { const r = el.getBoundingClientRect(); if (r.top <= y && r.bottom > y) { ton = el.dataset.ton; break; } }
    tete.dataset.ton = ton;
    if (!chapitres.length) return;
    const milieu = innerHeight / 2;
    let k = -1;
    chapitres.forEach((c, j) => { const r = c.getBoundingClientRect(); if (r.top <= milieu && r.bottom > milieu) k = j; });
    if (vue === 'accueil' && k === 0) k = -1;
    majSommaire(k);
    if (vue === 'accueil') majCarte();
  }
  let rafEtat = 0;
  function planifier() { if (!rafEtat) rafEtat = requestAnimationFrame(() => { rafEtat = 0; majEtat(); }); }
  addEventListener('scroll', planifier, { passive: true });
  addEventListener('resize', () => { ajusterLibelles(); mesurerCarte(); planifier(); });

  /* le magnétisme des chapitres : seulement sur l'accueil, en grand écran, sans réduction des animations */
  const majAimant = () => doc.classList.toggle('aimante', vue === 'accueil' && MQ_LARGE.matches && !MQ_REDUIT.matches);
  MQ_LARGE.addEventListener('change', () => { majAimant(); mesurerCarte(); planifier(); });
  MQ_REDUIT.addEventListener('change', () => { majAimant(); mesurerCarte(); });

  /* le dévoilement des chapitres : armé au premier geste, pour que rien ne reste caché sans défilement */
  const revele = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { e.target.classList.add('vu'); revele.unobserve(e.target); } }, { threshold: 0.3 });
  const gestes = ['wheel', 'touchstart', 'keydown', 'pointerdown', 'scroll'];
  function armer() {
    gestes.forEach((g) => removeEventListener(g, armer, true));
    if (MQ_REDUIT.matches || vue !== 'accueil') return;
    for (const c of $$('.chap', vueAccueil)) { const r = c.getBoundingClientRect(); if (r.bottom <= 0 || r.top >= innerHeight) { c.classList.add('arme'); revele.observe(c); } }
  }
  gestes.forEach((g) => addEventListener(g, armer, { capture: true, passive: true }));
  // l'entrée du premier écran, juste après la révélation à travers le logo
  function entrer(c) {
    if (!c || !c.classList.contains('attend')) return;
    c.classList.add('entre');
    requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('attend')));
    setTimeout(() => c.classList.remove('entre'), 2200);
  }
  function allerA(el) {
    if (!el) return;
    const onglets = vue === 'spectacle' && $('.onglets', vueSpectacle);
    const decal = vue === 'spectacle' ? tete.offsetHeight + (onglets && getComputedStyle(onglets).position === 'sticky' ? onglets.offsetHeight : 0) : 0;
    scrollTo({ top: el.getBoundingClientRect().top + scrollY - decal, behavior: MQ_REDUIT.matches ? 'auto' : 'smooth' });
    const h = $('h2[tabindex], h1[tabindex]', el);
    if (h) h.focus({ preventScroll: true });
  }

  /* le menu second, replié sous 1200 px */
  const menu = (ouvrir) => {
    const b = $('.menu-bouton', tete);
    tete.classList.toggle('menu-ouvert', ouvrir);
    if (b) b.setAttribute('aria-expanded', String(ouvrir));
  };
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && tete.classList.contains('menu-ouvert')) { menu(false); const b = $('.menu-bouton', tete); if (b) b.focus(); } });

  let ancre = null;
  document.addEventListener('click', (e) => {
    const el = e.target.closest('a, button');
    if (!el) return;
    if (el.matches('.menu-bouton')) { menu(!tete.classList.contains('menu-ouvert')); return; }
    if (el.closest('.second')) menu(false);
    if (el.matches('[data-modifier]')) { e.preventDefault(); if (typeof EDITION !== 'undefined') EDITION.ouvrir(); return; }
    if (el.matches('[data-aller]')) { e.preventDefault(); allerA(document.getElementById(el.dataset.aller)); return; }
    if (el.matches('.sommaire button')) { allerA(chapitres[+el.dataset.cible]); return; }
    if (el.matches('[data-ancre]')) ancre = el.dataset.ancre;
    if (el.matches('a[href^="#/"]') && el.getAttribute('href') === location.hash) { e.preventDefault(); router(); }
  });
  document.addEventListener('submit', (e) => { if (e.target.matches('form[data-inerte]')) e.preventDefault(); });
  $('.evitement').addEventListener('click', (e) => { e.preventDefault(); $('#contenu').focus(); });

  /* ================= le routeur : une vue par adresse, la mémoire de l'entrée ================= */
  const MEMO = 'crescite-m09-entree';
  const retenir = (cle) => { try { sessionStorage.setItem(MEMO, cle); } catch (err) { /* stockage indisponible */ } };
  const retenue = () => { try { const v = sessionStorage.getItem(MEMO); return entree(v) ? v : null; } catch (err) { return null; } };
  function resoudre(chemin) {
    let m;
    if (!chemin) return { vue: 'accueil', titre: S().accueil };
    const e = entrees().find((x) => x.href === `#/${chemin}`);
    if (e) {
      const html = { voir: pageVoir, programmer: pageProgrammer, etablissement: pageEtablissement }[e.cle];
      if (html) return { vue: 'page', html, entree: e.cle, marque: 'page', retenir: e.cle, titre: e.texte };
    }
    if ((m = chemin.match(/^spectacle\/([\w-]+)\/([\w-]+)$/)) && spectacle(m[1]) && entree(m[2])) {
      const s = spectacle(m[1]), x = entree(m[2]);
      if (x.cle === 'etablissement' && !s.actionCulturelle) return { remplacer: `#/spectacle/${m[1]}/voir` };   // sans action culturelle : « voir »
      return { vue: 'spectacle', s, cle: x.cle, entree: x.cle, marque: 'true', retenir: x.cle, titre: x.cle === 'voir' ? s.titre : `${s.titre} - ${x.court}` };
    }
    if ((m = chemin.match(/^spectacle\/([\w-]+)$/)) && spectacle(m[1])) return { remplacer: `#/spectacle/${m[1]}/${entreeSp(m[1], retenue() || 'voir')}` };
    if ((m = chemin.match(/^agenda\/([\w-]+)$/)) && D.saisons && D.saisons[m[1]]) {
      if (m[1] === saisonCourante().saison && entree('voir')) return { remplacer: entree('voir').href };
      const cle = m[1];
      return { vue: 'page', html: () => pageSaison(cle), entree: 'voir', marque: 'true', titre: D.saisons[cle].titre };
    }
    const item = (S().menu || []).find((x) => x.href === `#/${chemin}`);
    if (item) {
      const html = { spectacles: pageSpectacles, compagnie: pageCompagnie, contact: pageContact }[item.id];
      if (html) return { vue: 'page', html, menu: item.id, titre: item.texte };
    }
    if (S().legal && S().legal[chemin]) return { vue: 'page', html: () => pageLegal(chemin), titre: S().legal[chemin].titre };
    return null;
  }
  function marquerNav(r) {
    $$('.entree', tete).forEach((a) => { if (r.entree && r.marque && a.dataset.cle === r.entree) a.setAttribute('aria-current', r.marque); else a.removeAttribute('aria-current'); });
    $$('.second a', tete).forEach((a) => { if (r.menu && a.dataset.id === r.menu) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  let rendu = null;   // le chemin affiché
  function router({ initial = false, enPlace: ep = false } = {}) {
    const h = location.hash || '#/';
    if (!h.startsWith('#/') && rendu !== null) return;
    const sansFin = h.replace(/\/+$/, '') || '#/';
    const redir = (S().redirections || {})[sansFin];
    if (redir) { location.replace(redir); return; }
    const chemin = h.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
    let r = resoudre(chemin);
    if (r && r.remplacer) { location.replace(r.remplacer); return; }
    if (!r) { if (chemin) { location.replace('#/'); return; } r = resoudre(''); }
    menu(false);
    // la même vue, sans changement des données : on remonte seulement en haut
    if (!ep && rendu === chemin && vue === r.vue) {
      scrollTo(0, 0);
      const t = $(vue === 'spectacle' ? '#t-fiche' : vue === 'page' ? '#t-page' : '#t-accueil');
      if (!initial && t) t.focus({ preventScroll: true });
      return;
    }
    enPlace = ep;
    cacheU = new Map();
    if (r.retenir && !ep) retenir(r.retenir);
    vue = r.vue; route = r; rendu = chemin;
    doc.classList.remove('aimante');
    vueAccueil.hidden = vue !== 'accueil'; vuePage.hidden = vue !== 'page'; vueSpectacle.hidden = vue !== 'spectacle';
    vueAccueil.innerHTML = vue === 'accueil' ? accueilHTML() : '';
    if (vue !== 'accueil') cc = null;
    vuePage.innerHTML = vue === 'page' ? r.html() : '';
    vueSpectacle.innerHTML = vue === 'spectacle' ? spectacleHTML(r.s, r.cle) : '';
    const racine = vue === 'spectacle' ? vueSpectacle : vue === 'page' ? vuePage : vueAccueil;
    if (vue === 'accueil') monterCarteAccueil();
    echelleCartes(racine);
    $$('.lie:not([data-gere])', racine).forEach(brancherCarte);
    if (vue === 'page' && AGV && $('#ag-saisons', racine)) AGV.brancher(racine);
    pousserCartes(racine);
    document.title = titreOnglet(r.titre);
    marquerNav(r);
    zones = [...$$('[data-ton]', racine), pied];
    monterSommaire();
    ajusterLibelles();
    if (!ep) scrollTo(0, 0);
    majAimant();
    mesurerCarte();
    majEtat();
    if (!ep && ancre) { const cible = document.getElementById(ancre); ancre = null; if (cible) { requestAnimationFrame(() => allerA(cible)); enPlace = false; return; } }
    ancre = null;
    if (!initial && !ep) { const t = $(vue === 'spectacle' ? '#t-fiche' : vue === 'page' ? '#t-page' : '#t-accueil'); if (t) t.focus({ preventScroll: true }); }
    enPlace = false;
  }
  addEventListener('hashchange', () => router());
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  /* une mise à jour des données (règle 9) : la vue courante se refait en place, sans remonter ni voler le focus */
  function cleFocus(el) {
    if (!el || el === document.body || !el.matches) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset.edit) return `[data-edit="${CSS.escape(el.dataset.edit)}"]`;
    if (el.matches('.carte-lieu[data-l]')) return `.carte-lieu[data-l="${CSS.escape(el.dataset.l)}"]`;
    if (el.matches('.sommaire button')) return `.sommaire button[data-cible="${CSS.escape(el.dataset.cible)}"]`;
    if (el.matches('a[href]')) return `a[href="${CSS.escape(el.getAttribute('href'))}"]`;
    if (el.matches('summary')) { const d = el.closest('details[data-cle]'); return d ? `details[data-cle="${CSS.escape(d.dataset.cle)}"] summary` : null; }
    return null;
  }
  function rafraichir() {
    if (rendu === null) return;
    const y = scrollY, act = document.activeElement, cle = cleFocus(act);
    const ouverts = $$('details[data-cle]').filter((d) => d.open).map((d) => d.dataset.cle);
    const menuOuvert = tete.classList.contains('menu-ouvert');
    polices();
    monterTete();
    pied.innerHTML = piedHTML();
    router({ enPlace: true });
    ouverts.forEach((k) => { const d = $(`details[data-cle="${CSS.escape(k)}"]`); if (d) d.open = true; });
    if (menuOuvert) menu(true);
    if (cle) { const el = $(cle); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
    scrollTo(0, y);
    planifier();
  }
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(rafraichir);

  /* ================= le montage ================= */
  // les tentacules : un magenta vif sur la nuit ; chaque entrée donne sa couleur vive à la remontée de sa page, et la tentacule sort de la porte (la carte) où l'on a cliqué
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'encre', entrees: 'vive', voie: 'clic' });
  polices();
  monterTete();
  pied.innerHTML = piedHTML();
  router({ initial: true });
  // l'ouverture commune : le grand logo, dans le dégradé prune de la 09 ; la révélation tombe sur le choix des entrées
  INTRO.ouvrir({
    degrade: [[0, '#5f2244'], [0.26, '#3c1630'], [0.55, '#1a0d17'], [1, '#110a0f']],
    encre: '#ffffff',
    classe: 'm09-intro',
    apres: () => entrer($('.choix', vueAccueil)),
  });
  if (INTRO.ouverte() && !MQ_REDUIT.matches) { const c = $('.choix', vueAccueil); if (c) c.classList.add('attend'); }
})();
</script>
</body>
