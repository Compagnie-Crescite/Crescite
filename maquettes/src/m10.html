    addEventListener('pointercancel', e => { if (prise && e.pointerId === prise.id) { const T = prise.T; prise = null; el.classList.remove('is-grabbing'); T.mode = 'ressort'; T.t0 = performance.now(); T.tire0 = { ...T.tire }; reveil(); } });
    function ecouter(T) {
      const b = T.el;
      b.addEventListener('pointerdown', e => saisir(T, e));
      b.addEventListener('click', e => { if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return; e.preventDefault(); if (performance.now() - dernier > 450) activer(T); });
      b.addEventListener('mouseenter', () => { if (!verrou) { survol = T; reveil(); } });
      b.addEventListener('mouseleave', () => { if (survol === T && !verrou) { survol = null; reveil(); } });
      b.addEventListener('focus', () => { T.focus = true; reveil(); });
      b.addEventListener('blur', () => { T.focus = false; reveil(); });
      b.addEventListener('keydown', e => {
        const k = e.key, d = k === 'ArrowRight' || k === 'ArrowDown' ? 1 : k === 'ArrowLeft' || k === 'ArrowUp' ? -1 : 0;
        if (d) { e.preventDefault(); const i = TIT.indexOf(T); TIT[(i + d + TIT.length) % TIT.length].el.focus(); }

    // au téléphone, le libellé qui passe au milieu de l'écran attire le bras le plus proche
    function suivre() {
      sraf = 0;

      const r = el.getBoundingClientRect(), mid = innerHeight * .52;
      let best = null, bd = 110;
      for (const T of TIT) { const d = Math.abs(r.top + T.by + T.th / 2 - mid); if (d < bd) { bd = d; best = T; } }
      if (best !== survol) { survol = best; reveil(); }

    addEventListener('scroll', () => { if (mobile && affiche && !sraf) sraf = requestAnimationFrame(suivre); }, { passive: true });
    new ResizeObserver(() => { if (affiche) mise(); }).observe(el);
    new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; if (visible) { tPrec = 0; reveil(); } }, { threshold: .01 }).observe(el);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { tPrec = 0; reveil(); } });
    if (document.fonts) document.fonts.ready.then(() => { if (affiche) mise(); });

    function eveiller() { if (eveil === null) { eveil = performance.now(); tPrec = 0; reveil(); } }
    function montrer(oui) {
      affiche = oui;
      if (!oui) { cancelAnimationFrame(raf); raf = 0; return; }
      if (signature() !== sig) bati();
      // de retour sur l'accueil : chaque libellé reprend sa place, chaque bras sa souche
      TIT.forEach(T => { T.mode = 'repos'; T.tire = { x: 0, y: 0 }; T.tension = 0; T.parti = false; T.avale = 0; T.focus = false; });
      BRAS.forEach(a => { a.but = null; a.depuis = null; a.q = 1; a.teinte = 0; });
      survol = null; prise = null; verrou = false; el.classList.remove('is-grabbing', 'has-active');
      if (eveil === null && !(typeof INTRO !== 'undefined' && INTRO.ouverte())) eveil = performance.now() - (motionOK() ? 0 : 5000);
      mise(); reveil();
    }

    function maj() { tete.textContent = S.nom; if (signature() !== sig) { bati(); if (affiche) mise(); } }
    tete.textContent = S.nom;
    bati();
    return { montrer, eveiller, maj, coeurEcran: () => { const r = el.getBoundingClientRect(), c = coeur(); return { x: r.left + c.x, y: r.top + c.y }; } };

  /* ---------- la carte des tournées : des tentacules d'encre ---------- */
  /* De la pieuvre posée sur Rouen, un bras d'encre par commune, ponctué de ventouses sur sa face intérieure ;
     au bout, une goutte d'encre s'étale quand le bras l'atteint. « leger » : beaucoup de communes, des bras fins. */
  const Encre = (() => {
    let n = 0;
    const R = CARTE.rouen, LX = (D.arms.box[0] + D.arms.box[2]) / 2, LB = D.arms.box[3];
    const alea = graine => { let x = (graine * 9301 + 49297) % 233280 || 7; return () => (x = (x * 9301 + 49297) % 233280) / 233280; };
    const courbe = x => (x.l % 2 ? 1 : -1) * (.13 + ((x.l * 7) % 9) / 50);
    function ventouses(xy, c, w0, w1, e, pas) {
      const dx = xy[0] - R[0], dy = xy[1] - R[1], q = [(R[0] + xy[0]) / 2 - dy * c, (R[1] + xy[1]) / 2 + dx * c], N = 64, P = [], cum = [0];
      for (let k = 0; k <= N; k++) {
        const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, d = t * t;
        P.push([a * R[0] + b * q[0] + d * xy[0], a * R[1] + b * q[1] + d * xy[1]]);
        if (k) cum.push(cum[k - 1] + Math.hypot(P[k][0] - P[k - 1][0], P[k][1] - P[k - 1][1]));
      }
      const L = cum[N]; let out = '', u = L * .09, z = 0;
      while (u < L * .93) {
        let k = 1; while (k < N && cum[k] < u) k++;
        const f = (u - cum[k - 1]) / ((cum[k] - cum[k - 1]) || 1), t = (k - 1 + f) / N;
        const x = lerp(P[k - 1][0], P[k][0], f), y = lerp(P[k - 1][1], P[k][1], f);
        let tx = 2 * (1 - t) * (q[0] - R[0]) + 2 * t * (xy[0] - q[0]), ty = 2 * (1 - t) * (q[1] - R[1]) + 2 * t * (xy[1] - q[1]);
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const hw = (w0 * (1 - t) + w1 * t) / 2, r = Math.max(hw * .56, .45 * e), off = hw * (z++ % 2 ? .55 : .92) * Math.sign(c);
        out += `<circle cx="${(x + ty * off).toFixed(1)}" cy="${(y - tx * off).toFixed(1)}" r="${r.toFixed(2)}" stroke-width="${(r * .45).toFixed(2)}"/>`;
        u += Math.max(r * 2.6, pas * e);
      }
      return out;
    }
    function goutte(xy, r, graine) {
      const rnd = alea(graine + 11), N = 10, pts = [], f = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`, m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      for (let k = 0; k < N; k++) { const a = (k + rnd() * .35) / N * 2 * Math.PI, rr = r * (.8 + rnd() * .4); pts.push([xy[0] + Math.cos(a) * rr, xy[1] + Math.sin(a) * rr]); }
      let d = `M${f(m(pts[N - 1], pts[0]))}`;
      for (let k = 0; k < N; k++) d += `Q${f(pts[k])} ${f(m(pts[k], pts[(k + 1) % N]))}`;
      let sat = '';
      for (let k = 0, ns = 1 + Math.floor(rnd() * 3); k < ns; k++) {
        const a = rnd() * 2 * Math.PI, dd = r * (1.5 + rnd() * .8), rs = r * (.12 + rnd() * .16);
        sat += `<circle cx="${(xy[0] + Math.cos(a) * dd).toFixed(1)}" cy="${(xy[1] + Math.sin(a) * dd).toFixed(1)}" r="${rs.toFixed(2)}"/>`;
      }
      return `<path d="${d}Z"/>${sat}`;
    }
    const etiquette = x => `${CARTE.nom(x)}${x.dates?.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
    // lieux : les communes en avant (encre pleine, ventouses, gouttes) ; passe : les tournées passées, en retrait
    function svg({ lieux = [], passe = [], cadre = 'france', titre = '', fort = false, noms = false, leger = false } = {}) {
      const id = 'k' + (++n), tous = [...lieux, ...passe];
      const box = cadre === 'france' || !tous.length ? CARTE.viewBox : CARTE.cadre(tous, { marge: 44, min: 220 });
      const [bx, by, bw, bh] = box.split(/\s+/).map(Number), e = Math.max(bw, bh) / 800;
      const longueurs = lieux.map(x => CARTE.longueur(x.xy, { courbe: courbe(x) })), Lmax = Math.max(1, ...longueurs), pas = lieux.length > 30 ? 6 : 4;
      let masques = '', bras = '', fins = '', gouttes = '', noms_ = '';
      lieux.forEach((x, i) => {
        const c = courbe(x), droite = x.xy[0] > bx + bw * .7;
        if (leger) {
          // beaucoup de communes : un bras fin chacune, et une goutte qu'on survole
          const r = (1.5 + Math.sqrt(x.n) * .55) * e;
          fins += `<path data-l="${x.l}" d="${CARTE.bras(x.xy, { w0: (1.3 + Math.sqrt(x.n) * .5) * e, w1: .35 * e, courbe: c })}"/>`;
          gouttes += `<g class="carte-lieu fin" data-l="${x.l}"><g class="g-h"><g class="goutte">${goutte(x.xy, r, x.l)}</g></g><circle class="hit" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${Math.max(r * 1.8, 6 * e).toFixed(1)}"/><title>${esc(CARTE.nom(x))}</title></g>`;
        } else {
          const w0 = ((fort ? 6.5 : 5) + Math.sqrt(x.n) * 1.6) * e, w1 = .9 * e, r = ((fort ? 4.2 : 3.4) + Math.sqrt(x.n) * 1.3) * e;
          const d0 = i * .035, du = .4 + 1.2 * longueurs[i] / Lmax, dg = d0 + du * .88;
          masques += `<mask id="${id}-${x.l}" maskUnits="userSpaceOnUse" x="${bx - 60 * e}" y="${by - 60 * e}" width="${bw + 120 * e}" height="${bh + 120 * e}"><path class="k-trace" d="${CARTE.trait(x.xy, { courbe: c })}" pathLength="1" stroke-width="${(w0 * 2.8).toFixed(1)}" style="--d:${d0.toFixed(3)}s;--t:${du.toFixed(2)}s"/></mask>`;
          bras += `<g class="tent" data-l="${x.l}" mask="url(#${id}-${x.l})"><path class="tent-corps" d="${CARTE.bras(x.xy, { w0, w1, courbe: c })}"/><g class="tent-v">${ventouses(x.xy, c, w0, w1, e, pas)}</g></g>`;
          gouttes += `<g class="carte-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${attr(etiquette(x))}" style="--d:${dg.toFixed(2)}s"><circle class="onde" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(r * 2.4).toFixed(1)}" stroke-width="${(.9 * e).toFixed(2)}"/><g class="g-h"><g class="goutte">${goutte(x.xy, r, x.l)}</g></g><circle class="hit" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${Math.max(r * 1.7, 11 * e).toFixed(1)}"/><title>${esc(etiquette(x))}</title></g>`;
        }
        const rr = leger ? 3 * e : ((fort ? 4.2 : 3.4) + Math.sqrt(x.n) * 1.3) * e;
        noms_ += `<text class="carte-nom${noms ? ' toujours' : ''}" data-l="${x.l}" x="${(x.xy[0] + (droite ? -1 : 1) * (rr * 1.4 + 5 * e)).toFixed(1)}" y="${(x.xy[1] + 4.5 * e).toFixed(1)}" text-anchor="${droite ? 'end' : 'start'}" font-size="${(14 * e).toFixed(1)}" stroke-width="${(3.4 * e).toFixed(1)}">${esc(CARTE.nom(x))}</text>`;
      });
      const kk = (fort ? 46 : 38) * e / 1016;
      return `<svg class="carte encre${fort ? ' fort' : ''}${box !== CARTE.viewBox ? ' serre' : ''}" viewBox="${box}" role="group" aria-label="${attr(titre)}">
        <defs>${masques}</defs>
        <path class="carte-voisin" d="${CARTE.fond.belgique}"/><path class="carte-voisin" d="${CARTE.fond.luxembourg}"/><path class="carte-pays" d="${CARTE.fond.pays}"/>
        ${tous.some(x => x.encart) ? `<circle class="k-encart" cx="${CARTE.ENCART[0]}" cy="${CARTE.ENCART[1]}" r="${(24 * e).toFixed(1)}"/>` : ''}
        <g class="k-passe">${passe.map(x => `<path d="${CARTE.bras(x.xy, { w0: 2.2 * e, w1: .5 * e, courbe: courbe(x) })}"/><circle cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(1.9 * e).toFixed(2)}"/>`).join('')}</g>
        ${fins ? `<g class="k-fins">${fins}</g>` : ''}
        <g class="k-bras">${bras}</g>
        <g class="k-rouen"><g class="k-pieuvre" transform="translate(${(R[0] - LX * kk).toFixed(1)} ${(R[1] - LB * kk + 3 * e).toFixed(1)}) scale(${kk.toFixed(5)})">${D.logo.octopusPaths.map(d => `<path d="${d}"/>`).join('')}</g>
          <circle class="k-flaque" cx="${R[0]}" cy="${R[1]}" r="${(3.4 * e).toFixed(1)}"/>
          <text class="carte-rouen-nom" x="${(R[0] + (fort ? 28 : 24) * e).toFixed(1)}" y="${(R[1] - 12 * e).toFixed(1)}" font-size="${(16 * e).toFixed(1)}" stroke-width="${(3.4 * e).toFixed(1)}">Rouen</text></g>
        <g class="k-gouttes">${gouttes}</g>
        <g class="k-noms">${noms_}</g>
      </svg>`;
    }
    // l'encre pousse quand la carte entre à l'écran (pas lors d'une mise à jour en place)
    function activer(svgEl) {
      if (!svgEl) return;
      if (!motionOK() || !ANIMER) { svgEl.classList.add('fixe'); return; }
      const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { svgEl.classList.add('pousse'); io.disconnect(); } }, { threshold: .15 });
      io.observe(svgEl);
    }
    function marquer(svgEl, l) {
      svgEl.classList.toggle('survol', l != null);
      $$('.on', svgEl).forEach(x => x.classList.remove('on'));
      if (l != null) $$(`[data-l="${l}"]`, svgEl).forEach(x => x.classList.add('on'));
    }
    // relie une carte et une liste (li[data-l]) : survoler l'une met l'autre en avant ; choisir une commune la retient
    function relier(svgEl, liste) {
      activer(svgEl);
      let pin = null;
      const allumer = l => {
        marquer(svgEl, l);
        if (!liste) return;
        liste.forEach(ul => { ul.classList.toggle('atenue', l != null); $$('li[data-l]', ul).forEach(li => li.classList.toggle('on', l != null && +li.dataset.l === l)); });
      };
      CARTE.lier(svgEl, {
        survol: l => allumer(l ?? pin),
        choix: l => {
          pin = pin === l ? null : l; allumer(pin);
          const li = pin != null && liste && liste.map(ul => $(`li[data-l="${pin}"]`, ul)).find(Boolean);
          if (li) { const r = li.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight) li.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' }); }

        li.addEventListener('mouseleave', () => allumer(pin));

      return { allumer };
    }

  })();

  /* ---------- l'en-tête, la barre des entrées et le pied de page ---------- */

  /* ---------- l'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();

  const lienVideo = s => s.video && s.video.url ? `<a class="lien-video" href="${attr(s.video.url)}" target="_blank" rel="noopener">${ICONE.video}${esc(S.libelles.bandeAnnonce)}</a>` : '';
  const lieuxDetails = (s, ouvert = false) => (s.programmer || {}).lieux ? `<details class="lieux"${ouvert ? ' open' : ''}><summary>${esc(S.libelles.lieuxDiffusion)}</summary><p${ed(`shows.${s.slug}.programmer.lieux`)}>${esc(s.programmer.lieux)}</p></details>` : '';

  // « Je souhaite programmer » : le catalogue, la carte de tous les lieux, les partenaires
  function pageProgrammer() {
    const e = entree('programmer'), Lb = S.libelles;
    const fiches = D.shows.map(s => `<li class="fp" style="${uStyle(s)}">
      <div><h3><a class="etire" href="#/spectacle/${attr(s.slug)}/programmer">${esc(s.titre)}</a></h3>
        ${s.sousTitre ? `<p class="fp-sous"${ed(`shows.${s.slug}.sousTitre`)}>${s.sousTitre}</p>` : ''}
        <p class="fp-crea">${s.statut ? `<span class="tag"${ed(`shows.${s.slug}.statut`)}>${esc(s.statut)}</span>` : ''}<span${ed(`shows.${s.slug}.creation`)}>${esc(s.creation)}</span></p></div>
      ${faitsProg(s)}${equipe(s) || ficheHTML(s)}
      <div class="fp-pied">${lienVideo(s)}${lieuxDetails(s)}</div></li>`).join('');
    return tete(e.texte, e) + `
      <section class="bloc" aria-labelledby="h-cat"><div class="wrap"><h2 class="h2" id="h-cat">${esc(Lb.lesSpectacles)}</h2><ul class="catalogue">${fiches}</ul></div></section>
      <section class="bloc" aria-labelledby="h-lieux"><div class="wrap"><h2 class="h2" id="h-lieux">${esc(Lb.lieuxDiffusion)}</h2>${Encre.svg({ lieux: CARTE.tout(), leger: true, titre: Lb.lieuxDiffusion })}</div></section>
      <section class="bloc"><div class="wrap">${S.partenaires ? `<p class="partenaires"${ed('site.partenaires')}>${S.partenaires}</p>` : ''}${ecrire()}</div></section>`;
  }

  // « Je représente un établissement scolaire » : la position de la compagnie, l'action culturelle de chaque spectacle
  function ficheEtab(s) {
    const A = s.actionCulturelle || {}, sl = s.slug, Lb = S.libelles, txt = (A.textes || [])[0];
    return `<li class="fe" style="${uStyle(s)}">
      <h3><a class="etire" href="#/spectacle/${attr(sl)}/etablissement">${esc(s.titre)}</a></h3>
      <p class="lab">${esc(Lb.actionCulturelle)}</p>
      ${A.aCompleter || !A.type ? `<p class="fe-type a-completer">${esc(Lb.aCompleter)}</p>` : `<p class="fe-type"${ed(`shows.${sl}.actionCulturelle.type`)}>${esc(A.type)}</p>`}
      ${A.public || A.statut ? `<ul class="puces">${A.public ? `<li><span class="lib">${esc(Lb.public)}</span> <span${ed(`shows.${sl}.actionCulturelle.public`)}>${esc(A.public)}</span></li>` : ''}${A.statut ? `<li${ed(`shows.${sl}.actionCulturelle.statut`)}>${esc(A.statut)}</li>` : ''}</ul>` : ''}
      ${txt ? `<div class="fe-texte">${bloc(txt.texte, `shows.${sl}.actionCulturelle.textes.0.texte`)}</div>` : ''}
      ${(A.formule || []).length ? `<p class="formule">${A.formule.map((l, k) => `<span${ed(`shows.${sl}.actionCulturelle.formule.${k}`)}>${esc(l)}</span>`).join('')}</p>` : ''}
      ${(A.dispositifs || []).length ? `<div class="fe-disp"><p class="lab">${esc(Lb.dispositifs)}</p><ul>${A.dispositifs.map((h, k) => `<li${ed(`shows.${sl}.actionCulturelle.dispositifs.${k}`)}>${h}</li>`).join('')}</ul></div>` : ''}
      ${s.dossier && D.dossiers && D.dossiers[s.dossier] ? `<p class="fe-dossier"><a href="#/spectacle/${attr(sl)}/etablissement">${esc(Lb.dossierScolaire)} ${FLECHE}</a></p>` : ''}</li>`;
  }
  function pageEtablissement() {
    const e = entree('etablissement'), Lb = S.libelles, A = S.actions || { blocs: [] }, sc = D.dates.filter(d => d.scolaire);
    const g = { etablissement: [], salle: [], autre: [] };
    D.shows.forEach(s => { const l = (s.actionCulturelle || {}).lieu; (g[l] || g.autre).push(s); });
    const groupe = (titre, liste) => liste.length ? `<div class="groupe-e">${titre ? `<h2 class="h2">${esc(titre)}</h2>` : ''}<ul class="cartes-e">${liste.map(ficheEtab).join('')}</ul></div>` : '';
    const photos = ['actions-culturelles', 'actions-culturelles/g-1', 'actions-culturelles/g-2', 'actions-culturelles/g-3', 'actions-culturelles/g-4'].filter(k => D.photos[k]);
    return tete(e.texte, e) + `
      ${S.ecole ? `<section class="bloc"><div class="wrap"><p class="ecole-texte"${ed('site.ecole.texte')}>${esc(S.ecole.texte)}</p></div></section>` : ''}
      <section class="bloc"><div class="wrap">${groupe(Lb.lieu.etablissement, g.etablissement)}${groupe(Lb.lieu.salle, g.salle)}${groupe('', g.autre)}</div></section>
      <section class="bloc" aria-labelledby="h-actions"><div class="wrap"><h2 class="h2" id="h-actions"${ed('site.actions.titre')}>${esc(A.titre)}</h2><div class="ac-grille">
        <div class="blocs">${(A.blocs || []).map((b, k) => bloc(b, `site.actions.blocs.${k}`)).join('')}</div>
        ${photos.length ? `<div class="ac-photos">${photos.map(k => `<img src="${attr(D.photos[k])}" alt="${attr(A.titre)}" loading="lazy">`).join('')}${A.credit ? `<p class="credit"${ed('site.actions.credit')}>${esc(A.credit)}</p>` : ''}</div>` : ''}
      </div></div></section>
      ${sc.length ? `<section class="bloc" aria-labelledby="h-sc"><div class="wrap"><h2 class="h2" id="h-sc">${esc(Lb.enEtablissement)}</h2>
        <div class="ag-grille"><div class="ag-carte">${Encre.svg({ lieux: CARTE.aVenir('scolaire'), cadre: 'serre', titre: Lb.enEtablissement })}</div>
          <div class="ag-liste" data-agenda="">${parMois(sc).map(([m, ds]) => `<div class="mois"><h3>${esc(m)}</h3><ul class="dl">${ds.map(d => ligneDate(d, { ctx: 'etablissement' })).join('')}</ul></div>`).join('')}</div></div></div></section>` : ''}
      <section class="bloc"><div class="wrap">${ecrire()}</div></section>`;
  }

  // les spectacles : une bande par univers
  function pageSpectacles() {
    const bandes = D.shows.map((s, i) => {
      const sl = s.slug, d = prochainePublique(s);
      return `<li class="bande" style="${uStyle(s)}"><div class="bande-in">
        <div class="bande-ph"><img src="${attr(D.photos[sl] || '')}" alt="" loading="${i < 2 ? 'eager' : 'lazy'}"></div>
        <div class="bande-tx"><span class="bande-embleme">${motif(univers(s).motif)}</span>${s.lieuTemps ? `<p class="bande-lt"${ed(`shows.${sl}.lieuTemps`)}>${esc(s.lieuTemps)}</p>` : ''}
          <h2><a class="etire" href="#/spectacle/${attr(sl)}">${esc(s.titre)}</a></h2>
          ${s.sousTitre ? `<p class="bande-sous"${ed(`shows.${sl}.sousTitre`)}>${s.sousTitre}</p>` : ''}
          <p class="bande-crea"${ed(`shows.${sl}.creation`)}>${esc(s.creation)}</p>
          ${s.accroche ? `<p class="bande-acc"${ed(`shows.${sl}.accroche`)}>${esc(s.accroche)}</p>` : ''}
          ${s.statut || s.enTournee || d ? `<p class="bande-etat">${s.statut ? `<span class="tag">${esc(s.statut)}</span>` : s.enTournee ? `<span class="tag">${esc(S.libelles.enTournee)}</span>` : ''}${d ? `<span class="bande-date">${esc(d.ligne)}</span>` : ''}</p>` : ''}
        </div></div></li>`;
    }).join('');
    return tete(menu('spectacles').texte) + `<ul class="bandes">${bandes}</ul>`;
  }

  // une saison passée : la saison par spectacle, et sa carte
  function pageSaison(k) {
    const sa = D.saisons[k];
    const liens = `<section class="bloc"><div class="wrap"><ul class="saisons">${(S.saisons || []).filter(x => x.saison !== k).map(x => `<li><a href="${attr(x.saison === (S.saisons[0] || {}).saison ? (entree('voir') || {}).href || x.href : x.href)}">${esc(x.titre)} ${FLECHE}</a></li>`).join('')}</ul></div></section>`;
    return tete(sa.titre, entree('voir')) + `<section class="bloc"><div class="wrap ag-grille">
      <div class="ag-carte">${Encre.svg({ lieux: CARTE.saison(k), titre: sa.titre })}</div>
      <div class="ag-liste">${sa.spectacles.map(g => { const s = g.slug && show(g.slug); return `<section class="sa-sp"><h2>${s ? `<a href="#/spectacle/${attr(g.slug)}/voir" style="color:${univers(s).lait}">${esc(g.titre)}</a>` : esc(g.titre)}</h2>
        ${g.sousTitre ? `<p class="sa-sous">${g.sousTitre}</p>` : ''}${g.creation ? `<p class="sa-crea">${esc(g.creation)}</p>` : ''}
        <div data-agenda="${attr(g.slug || '')}"><ul class="dl">${g.dates.map(ligneSaison).join('')}</ul></div></section>`; }).join('')}</div>
    </div></section>${liens}`;
  }

  // la compagnie : sa présentation, ses dates, le portrait de son directeur artistique, ses partenaires
  function pageCompagnie() {
    const C = S.compagnie, Dir = C.directeur;
    return tete(C.titre, null, 'site.compagnie.titre') + `<section class="bloc"><div class="wrap co-grille">
        <div class="co-texte">${(C.paragraphes || []).map((p, k) => bloc(p, `site.compagnie.paragraphes.${k}`)).join('')}</div>
        <aside class="chrono" aria-labelledby="h-dates"><h2 class="h2" id="h-dates"${ed('site.compagnie.datesTitre')}>${esc(C.datesTitre)}</h2>
          <ol>${(C.dates || []).map((d, i) => { const s = D.shows.find(x => String(x.annee) === String(d.annee)); const t = `<span${ed(`site.compagnie.dates.${i}.titre`)}>${esc(d.titre)}</span>`;
            return `<li style="--i:${i}"><b${ed(`site.compagnie.dates.${i}.annee`)}>${esc(d.annee)}</b>${s ? `<a href="#/spectacle/${attr(s.slug)}" style="--c:${univers(s).lait}">${t}</a>` : `<span class="t-date">${t}</span>`}</li>`; }).join('')}</ol>
        </aside></div></section>
      ${Dir ? `<section class="bloc directeur" aria-labelledby="h-dir"><div class="wrap"><h2 class="h2" id="h-dir"${ed('site.compagnie.directeur.titre')}>${esc(Dir.titre)}</h2>
        <div class="dir-texte">${Dir.chapeau ? `<p class="dir-chapeau"${ed('site.compagnie.directeur.chapeau')}>${esc(Dir.chapeau)}</p>` : ''}${(Dir.paragraphes || []).map((p, k) => bloc(p, `site.compagnie.directeur.paragraphes.${k}`)).join('')}</div></div></section>` : ''}
      ${S.partenaires ? `<section class="bloc"><div class="wrap"><p class="partenaires"${ed('site.partenaires')}>${S.partenaires}</p></div></section>` : ''}`;
  }
  function pageContact() {
    const C = S.contact, K = S.coordonnees;
    const champ = (c, i) => {
      const id = 'ct-' + i, type = /mail/i.test(c) ? 'email' : /phone/i.test(c) ? 'tel' : 'text';
      return `<div class="champ"><label for="${id}">${esc(c)}</label>${i === C.champs.length - 1 ? `<textarea id="${id}" rows="6"></textarea>` : `<input id="${id}" type="${type}">`}</div>`;
    };
    const accord = esc(C.consentement).replace(/politique de confidentialité/i, m => `<a href="#/politique-de-confidentialite">${m}</a>`);
    return tete(C.titre) + `<section class="bloc"><div class="wrap ct-grille">
      <form class="form" novalidate>${C.champs.map(champ).join('')}
        <div class="consent"><input type="checkbox" id="ct-ok"><label for="ct-ok">${accord}</label></div>
        <div class="calcul"><label for="ct-calc">${esc(C.calcul)}</label><input id="ct-calc" inputmode="numeric"></div>
        <button class="bouton" type="submit">${esc(C.bouton)}</button></form>
      <aside class="coord"><p><strong>${esc(K.nom)}</strong><br>${K.adresse.map(esc).join('<br>')}</p><p>${K.legal.map(esc).join('<br>')}</p></aside>
    </div></section>`;
  }
  const pageLegal = cle => { const L = S.legal[cle]; return tete(L.titre) + `<section class="bloc"><div class="wrap legal">${L.blocs.map(bloc).join('')}</div></section>`; };

  /* ---------- la page d'un spectacle : son univers, ses trois entrées ---------- */
  // l'accroche s'écrit mot à mot (l'édition remet la phrase entière)
  function mots(txt) {
    if (!ANIMER || !motionOK() || /<[a-z]/i.test(txt)) return esc(txt);
    const ms = String(txt).split(/(\s+)/), n = Math.max(1, ms.filter(m => m.trim()).length);
    let i = 0;
    return ms.map(m => m.trim() ? `<span class="mot" style="--t:${(i++ / n).toFixed(3)}">${esc(m)}</span>` : m).join('');
  }
  const figure = (s, p, k, classe = '') => `<figure class="ph ${classe}"${edp(`shows.${s.slug}.photos.${k}`)}><img src="${attr(D.photos[p.cle] || '')}" alt="${attr(s.titre)}" loading="lazy"><figcaption class="leg"${ed(`shows.${s.slug}.photos.${k}.legende`)}>${p.legende ? esc(p.legende) : ''}</figcaption></figure>`;
  const credits = (s, liste) => {
    const out = [];
    if (liste.some(x => x.p.source !== 'dossier') && s.creditPhotos) out.push(`<span${ed(`shows.${s.slug}.creditPhotos`)}>${esc(s.creditPhotos)}</span>`);
    if (liste.some(x => x.p.source === 'dossier') && s.creditDossier) out.push(`<span${ed(`shows.${s.slug}.creditDossier`)}>${esc(s.creditDossier)}</span>`);
    return out.length ? `<p class="credit">${out.join('')}</p>` : '';
  };
  const photosDe = (s, garde) => (s.photos || []).map((p, k) => ({ p, k })).filter(({ p }) => garde(p));
  function citations(s) {
    return (s.citations || []).map((c, k) => `<blockquote class="vers${c.prose ? ' prose' : ''}"><p>${(c.vers || []).map((v, j) => `<span class="v"${ed(`shows.${s.slug}.citations.${k}.vers.${j}`)}>${esc(v)}</span>`).join(c.prose ? ' ' : '')}</p>${c.source ? `<cite${ed(`shows.${s.slug}.citations.${k}.source`)}>${esc(c.source)}</cite>` : ''}</blockquote>`).join('');
  }
  function medias(s) {
    const l = [...(s.video && s.video.url ? [{ type: 'video', titre: s.video.titre, url: s.video.url, groupe: null }] : []), ...(s.medias || []).filter(m => m.url && (!s.video || m.url !== s.video.url))];
    if (!l.length) return '';
    const groupes = [];
    l.forEach(m => { const g = m.groupe || ''; let G = groupes.find(x => x.g === g); if (!G) groupes.push(G = { g, l: [] }); G.l.push(m); });
    return groupes.map(G => `${G.g ? `<h3>${esc(G.g)}</h3>` : ''}<ul class="medias">${G.l.map(m => `<li>${lienExt(m.url, `${ICONE[m.type] || ICONE.video}<span><b>${esc(m.titre || m.url)}</b>${m.par ? `<small>${esc(m.par)}</small>` : ''}</span>`)}</li>`).join('')}</ul>`).join('');
  }
  function distribution(s) {
    const sl = s.slug;
    const prod = (s.production || []).length ? `<div class="sp-prod">${s.production.map((h, k) => bloc(h, `shows.${sl}.production.${k}`)).join('')}</div>` : '';
    const ment = (s.mentions || []).length ? `<div class="sp-mentions">${s.mentions.map((h, k) => bloc(h, `shows.${sl}.mentions.${k}`)).join('')}</div>` : '';
    const eq = equipe(s);
    return `<div class="distribution"><div>${eq || ficheHTML(s)}${s.duree ? `<p class="sp-duree"${ed(`shows.${sl}.duree`)}>${esc(s.duree)}</p>` : ''}</div><div>${prod}${ment}</div></div>`;
  }
  // les chapitres de chaque entrée : [{id, label (sommaire), html (avec son h2)}]
  function chapitresVoir(s) {
    const sl = s.slug, Lb = S.libelles, K = CARTE.spectacle(sl), ch = [];
    const h2 = (id, t, chemin) => `<h2 id="h-${id}"${chemin ? ed(chemin) : ''}>${esc(t)}</h2>`;
    const aff = (s.affirmations || []).map((a, k) => `<p class="affirm"${ed(`shows.${sl}.affirmations.${k}.texte`)}>${esc(a.texte)}</p>`).join('');
    if (s.cadre || aff) ch.push({ id: 'ouverture', label: Lb.ouverture, html: h2('ouverture', Lb.ouverture) + (s.cadre ? `<p class="cadre"${ed(`shows.${sl}.cadre`)}>${esc(s.cadre)}</p>` : '') + aff });
    const texte = (s.texte || []).map((t, k) => bloc(t, `shows.${sl}.texte.${k}`)).join('');
    if (texte || (s.citations || []).length) ch.push({ id: 'spectacle', label: Lb.leSpectacle, html: h2('spectacle', Lb.leSpectacle) + `<div class="sp-texte">${texte}</div>${citations(s)}` });
    const ph = photosDe(s, p => !p.etablissement && !p.atelier);
    if (ph.length) ch.push({ id: 'photos', label: Lb.photos, html: h2('photos', Lb.photos) + `<div class="galerie">${ph.map(({ p, k }) => figure(s, p, k)).join('')}</div>${credits(s, ph)}` });
    const md = medias(s);
    if (md) ch.push({ id: 'video', label: Lb.bandeAnnonce, html: h2('video', Lb.bandeAnnonce) + md });
    // les dates tout public à venir, et la carte ; sinon la carte des tournées passées
    const pub = D.dates.filter(d => d.slug === sl && !d.scolaire), voir = entree('voir');
    const lieuxPub = K.aVenir.map(x => ({ ...x, dates: x.dates.filter(d => !d.scolaire) })).filter(x => x.dates.length).map(x => ({ ...x, n: x.dates.length }));
    if (pub.length) ch.push({ id: 'dates', label: Lb.dates, html: h2('dates', (s.tournee && s.tournee.titre) || Lb.actuellementEnTournee) + `<div class="tour-grille"><div><div data-agenda="${attr(sl)}"><ul class="dl">${pub.map(d => ligneDate(d, { titre: false })).join('')}</ul></div>
      ${voir ? `<p class="tout-dates"><a href="${attr(voir.href)}">${esc(voir.texte)} ${FLECHE}</a></p>` : ''}</div><div>${Encre.svg({ lieux: lieuxPub, passe: K.passe, cadre: 'serre', titre: s.titre })}</div></div>` });
    else if (s.statut && s.tournee) ch.push({ id: 'dates', label: Lb.dates, html: h2('dates', s.tournee.titre, `shows.${sl}.tournee.titre`) + `<div class="tour-grille"><div>${s.tournee.texte ? `<p${ed(`shows.${sl}.tournee.texte`)}>${esc(s.tournee.texte)}</p>` : ''}<div data-agenda="${attr(sl)}"></div></div><div>${Encre.svg({ titre: s.tournee.titre })}</div></div>` });
    else if (K.passe.length) ch.push({ id: 'dates', label: Lb.dates, html: h2('dates', Lb.lieuxDiffusion) + `<div data-agenda="${attr(sl)}"></div>${Encre.svg({ lieux: K.passe, cadre: 'serre', titre: s.titre })}` });
    ch.push({ id: 'distribution', label: Lb.distribution, html: h2('distribution', Lb.distribution) + distribution(s) });
    return ch;
  }
  function chapitresProgrammer(s) {
    const sl = s.slug, Lb = S.libelles, K = CARTE.spectacle(sl), ch = [], X = s.dossier && D.dossiers ? D.dossiers[s.dossier] : null;
    const h2 = (id, t, chemin) => `<h2 id="h-${id}"${chemin ? ed(chemin) : ''}>${esc(t)}</h2>`;
    ch.push({ id: 'spectacle', label: Lb.leSpectacle, html: h2('spectacle', Lb.leSpectacle) + faitsProg(s) + equipe(s) + (s.texte && s.texte[0] ? `<div class="sp-texte">${bloc(s.texte[0], `shows.${sl}.texte.0`)}</div>` : '') });
    const md = medias(s);
    if (md) ch.push({ id: 'video', label: Lb.bandeAnnonce, html: h2('video', Lb.bandeAnnonce) + md });
    if (!equipe(s)) ch.push({ id: 'distribution', label: Lb.distribution, html: h2('distribution', Lb.distribution) + distribution(s) });
    if ((s.programmer || {}).lieux || K.passe.length || K.aVenir.length) ch.push({ id: 'lieux', label: Lb.lieuxDiffusion, html: h2('lieux', Lb.lieuxDiffusion) + ((s.programmer || {}).lieux ? `<p class="lieux-texte"${ed(`shows.${sl}.programmer.lieux`)}>${esc(s.programmer.lieux)}</p>` : '') + (K.passe.length || K.aVenir.length ? `<div class="tour-grille" style="margin-top:22px"><div data-agenda="${attr(sl)}"><ul class="dl">${D.dates.filter(d => d.slug === sl).map(d => ligneDate(d, { titre: false, tag: true })).join('')}</ul></div><div>${Encre.svg({ lieux: K.aVenir, passe: K.passe, cadre: 'serre', titre: s.titre })}</div></div>` : '') });
    if (X && X.accueil && (s.programmer || {}).ficheTechnique) {
      const Ac = X.accueil, p = c => `dossiers.${s.dossier}.accueil.${c}`, impl = photosDe(s, x => /implantation/.test(x.id));
      ch.push({ id: 'technique', label: Lb.ficheTechnique, html: h2('technique', Ac.fiche || Lb.ficheTechnique, Ac.fiche ? p('fiche') : null) +
        `<h3 class="dh"${ed(p('titre'))}>${esc(Ac.titre)}</h3>${(Ac.blocs || []).map((b, i) => `<div class="tech">${b.titre ? `<h4${ed(p(`blocs.${i}.titre`))}>${esc(b.titre)}</h4>` : ''}<ul>${(b.lignes || []).map((l, j) => `<li${ed(p(`blocs.${i}.lignes.${j}`))}>${l}</li>`).join('')}</ul></div>`).join('')}
        ${Ac.alerte ? `<p class="alerte"${ed(p('alerte'))}>${Ac.alerte}</p>` : ''}${impl.map(({ p: ph, k }) => figure(s, ph, k, 'seule')).join('')}${credits(s, impl)}` });
    }
    return ch;
  }
  function dossierHTML(s) {
    const k = s.dossier, X = D.dossiers && D.dossiers[k];
    if (!X) return null;
    const p = c => `dossiers.${k}.${c}`;
    const couv = `<div class="couv">${['titre', 'auteur', 'creation', 'type', 'duree', 'format', 'public'].filter(c => X[c]).map(c => `<p class="couv-${c}"${ed(p(c))}>${esc(X[c])}</p>`).join('')}</div>`;
    const pq = X.pourquoi ? `<h3 class="dh"${ed(p('pourquoi.titre'))}>${esc(X.pourquoi.titre)}</h3><div class="pourquoi">${(X.pourquoi.sections || []).map((x, i) => `<article class="pq"><h4${ed(p(`pourquoi.sections.${i}.titre`))}>${esc(x.titre)}</h4><p${ed(p(`pourquoi.sections.${i}.texte`))}>${x.texte}</p></article>`).join('')}</div>` : '';
    const prog = X.programmes ? `<h3 class="dh" id="h-programmes"${ed(p('programmes.titre'))}>${esc(X.programmes.titre)}</h3><div class="table-defile"><table class="programmes" role="table" aria-labelledby="h-programmes">${(X.programmes.niveaux || []).map((n, i) => `<tbody role="rowgroup"><tr role="row"><th scope="rowgroup" role="rowheader" colspan="3"${ed(p(`programmes.niveaux.${i}.niveau`))}>${esc(n.niveau)}</th></tr>${(n.lignes || []).map((l, j) => `<tr role="row"><th scope="row" role="rowheader"${ed(p(`programmes.niveaux.${i}.lignes.${j}.matiere`))}>${esc(l.matiere)}</th><td role="cell"${ed(p(`programmes.niveaux.${i}.lignes.${j}.intitule`))}>${esc(l.intitule)}</td><td role="cell"${ed(p(`programmes.niveaux.${i}.lignes.${j}.objectif`))}>${esc(l.objectif)}</td></tr>`).join('')}</tbody>`).join('')}</table></div>` : '';
    const C = X.consignes;
    const cons = C ? `<div class="consignes"><h3 class="dh"${ed(p('consignes.titre'))}>${esc(C.titre)}</h3>${C.note ? `<p class="note"${ed(p('consignes.note'))}>${esc(C.note)}</p>` : ''}${C.intro ? `<p${ed(p('consignes.intro'))}>${C.intro}</p>` : ''}
      ${(C.demandes || []).length ? `<ul class="demandes">${C.demandes.map((d, i) => `<li${ed(p(`consignes.demandes.${i}`))}>${esc(d)}</li>`).join('')}</ul>` : ''}${C.apres ? `<p${ed(p('consignes.apres'))}>${C.apres}</p>` : ''}
      ${(C.axes || []).length ? `<ul class="axes">${C.axes.map((a, i) => `<li${ed(p(`consignes.axes.${i}`))}>${a}</li>`).join('')}</ul>` : ''}${C.atelier ? `<p class="oblig"${ed(p('consignes.atelier'))}>${C.atelier}</p>` : ''}</div>` : '';
    const plus = ['synopsis', 'adaptation', 'espace', 'alexandrin'].filter(c => X[c]).map(c => `<details class="dd"><summary><span${ed(p(`${c}.titre`))}>${esc(X[c].titre)}</span></summary>${X[c].chapeau ? `<p class="dd-chapeau"${ed(p(`${c}.chapeau`))}>${esc(X[c].chapeau)}</p>` : ''}${(X[c].paragraphes || []).map((t, j) => `<p${ed(p(`${c}.paragraphes.${j}`))}>${t}</p>`).join('')}</details>`).join('');
    const A = X.ateliers;
    const ateliers = A ? `<div class="ateliers">${(A.liste || []).map((a, i) => `<article class="atelier"><h3${ed(p(`ateliers.liste.${i}.titre`))}>${a.titre}</h3>${(a.paragraphes || []).map((t, j) => `<p${ed(p(`ateliers.liste.${i}.paragraphes.${j}`))}>${t}</p>`).join('')}
      ${(a.etapes || []).length ? `<ol class="etapes">${a.etapes.map((e, j) => `<li><h4${ed(p(`ateliers.liste.${i}.etapes.${j}.titre`))}>${e.titre}</h4><p${ed(p(`ateliers.liste.${i}.etapes.${j}.texte`))}>${e.texte}</p></li>`).join('')}</ol>` : ''}
      ${(a.points || []).length ? `<ul class="points">${a.points.map((t, j) => `<li${ed(p(`ateliers.liste.${i}.points.${j}`))}>${t}</li>`).join('')}</ul>` : ''}</article>`).join('')}</div>` : '';
    return { couv, pq, prog, cons, plus, ateliers, titreAteliers: A && A.titre, cheminAteliers: p('ateliers.titre') };
  }
  function chapitresEtablissement(s) {
    const sl = s.slug, Lb = S.libelles, A = s.actionCulturelle || {}, ch = [];
    const h2 = (id, t, chemin) => `<h2 id="h-${id}"${chemin ? ed(chemin) : ''}>${esc(t)}</h2>`;
    let action;
    if (A.aCompleter || !A.type) action = `<p class="a-completer">${esc(Lb.aCompleter)}</p>`;
    else action = `<p class="ac-type"${ed(`shows.${sl}.actionCulturelle.type`)}>${esc(A.type)}</p>
      <ul class="puces">${A.public ? `<li><span class="lib">${esc(Lb.public)}</span> <span${ed(`shows.${sl}.actionCulturelle.public`)}>${esc(A.public)}</span></li>` : ''}${A.lieu && Lb.lieu[A.lieu] ? `<li>${esc(Lb.lieu[A.lieu])}</li>` : ''}${A.statut ? `<li${ed(`shows.${sl}.actionCulturelle.statut`)}>${esc(A.statut)}</li>` : ''}</ul>
      ${(A.textes || []).map((t, k) => bloc(t.texte, `shows.${sl}.actionCulturelle.textes.${k}.texte`)).join('')}
      ${(A.formule || []).length ? `<p class="formule">${A.formule.map((l, k) => `<span${ed(`shows.${sl}.actionCulturelle.formule.${k}`)}>${esc(l)}</span>`).join('')}</p>` : ''}
      ${(A.dispositifs || []).length ? `<h3>${esc(Lb.dispositifs)}</h3><ul>${A.dispositifs.map((h, k) => `<li${ed(`shows.${sl}.actionCulturelle.dispositifs.${k}`)}>${h}</li>`).join('')}</ul>` : ''}`;
    ch.push({ id: 'action', label: Lb.actionCulturelle, html: h2('action', Lb.actionCulturelle) + action });
    const sc = D.dates.filter(d => d.slug === sl && d.scolaire);
    if (sc.length) ch.push({ id: 'dates', label: Lb.dates, html: h2('dates', Lb.enEtablissement) + `<div data-agenda="${attr(sl)}"><ul class="dl">${sc.map(d => ligneDate(d, { titre: false })).join('')}</ul></div>` });
    const X = dossierHTML(s);
    if (X) {
      ch.push({ id: 'dossier', label: Lb.dossierScolaire, html: h2('dossier', Lb.dossierScolaire) + X.couv + X.pq + X.prog + X.cons + X.plus });
      const at = photosDe(s, p => p.atelier);
      ch.push({ id: 'ateliers', label: Lb.ateliers, html: h2('ateliers', X.titreAteliers || Lb.ateliers, X.titreAteliers ? X.cheminAteliers : null) + X.ateliers + (at.length ? `<div class="photos-ateliers">${at.map(({ p, k }) => figure(s, p, k)).join('')}</div>${credits(s, at)}` : '') });
    }
    const ph = photosDe(s, p => p.etablissement);
    if (ph.length) ch.push({ id: 'photos', label: Lb.photos, html: h2('photos', Lb.photos) + `<div class="galerie">${ph.map(({ p, k }) => figure(s, p, k)).join('')}</div>${credits(s, ph)}` });
    return ch;
  }
  function pageSpectacle(slug, cle) {
    const s = show(slug), u = univers(s), Lb = S.libelles, ENT = S.entrees || [];
    const i = D.shows.indexOf(s), nx = D.shows[(i + 1) % D.shows.length];
    const lignes = s.titreLignes && s.titreLignes.length ? s.titreLignes : [s.titre];
    const h1 = lignes.map((l, k) => `<span class="ligne${ANIMER && motionOK() ? ' revele' : ''}" style="--n:${Math.max(4, [...String(l)].length)};--k:${k}"${ed(`shows.${slug}.titreLignes.${k}`)}>${esc(l)}</span>`).join(' ');
    const credit = s.creditPhotos || s.credit;
    const hero = `<div class="sx-hero" data-scrolly>
        <div class="hero-photo"${edp(`shows.${slug}.photo`)}><img src="${attr(D.photos[slug] || '')}" alt="${attr(s.titre)}"></div>
        <div class="hero-lueur"></div><div class="hero-motif">${motif(u.motif)}</div>
        <div class="hero-text">
          <p class="fil-ariane"><a href="#/">${esc(S.accueil)}</a> / <a href="${attr(menu('spectacles').href)}">${esc(menu('spectacles').texte)}</a></p>
          <p class="hero-nom">${esc(S.nom)}</p>
          <h1 tabindex="-1">${h1}</h1>
          ${s.sousTitre ? `<p class="hero-sous"${ed(`shows.${slug}.sousTitre`)}>${s.sousTitre}</p>` : ''}
          <p class="hero-meta">${s.statut ? `<span class="tag"${ed(`shows.${slug}.statut`)}>${esc(s.statut)}</span>` : ''}${s.creation ? `<span${ed(`shows.${slug}.creation`)}>${esc(s.creation)}</span>` : ''}${s.lieuTemps ? `<span${ed(`shows.${slug}.lieuTemps`)}>${esc(s.lieuTemps)}</span>` : ''}</p>
          ${s.accroche ? `<p class="hero-acc"${ed(`shows.${slug}.accroche`)}>${mots(s.accroche)}</p>` : ''}
        </div>
        ${credit ? `<p class="hero-credit"${s.creditPhotos ? ed(`shows.${slug}.creditPhotos`) : ''}>${esc(credit)}</p>` : ''}
      </div>`;
    const onglets = `<nav class="onglets" aria-label="${attr(s.titre)}"><div class="og-in">${ENT.map(e => `<a href="#/spectacle/${attr(slug)}/${attr(e.cle)}" style="--e:${couleur(u.clair ? e.couleur : e.couleurVive, 'currentColor')}"${e.cle === cle ? ' aria-current="page"' : ''}>${BE}<span class="long">${esc(e.texte)}</span><span class="court">${esc(e.court)}</span></a>`).join('')}</div></nav>`;
    const ch = cle === 'programmer' ? chapitresProgrammer(s) : cle === 'etablissement' ? chapitresEtablissement(s) : chapitresVoir(s);
    const ent = entree(cle) || {};
    const appel = cle === 'voir' ? '' : `<div class="appel">${ecrire()}</div>`;
    const corps = `<div class="sp-tab">
        <nav class="sommaire" aria-label="${attr(ent.court || s.titre)}"><ol>${ch.map((c, k) => `<li style="--i:${k}"><button type="button" data-chap="ch-${c.id}">${esc(c.label)}</button></li>`).join('')}</ol></nav>
        <div class="sp-chaps">${ch.map(c => `<section class="chap ch-${c.id}" id="ch-${c.id}" aria-labelledby="h-${c.id}">${c.html}</section>`).join('')}${appel}</div>
      </div>`;
    const suivant = nx && nx !== s ? `<a class="suivant" href="#/spectacle/${attr(nx.slug)}/${attr(cle)}" style="${uStyle(nx)}"><span class="wrap"><b>${esc(nx.titre)}</b>${FLECHE}</span>${motifCoin(nx)}</a>` : '';
    return `<article class="show" style="${uStyle(s)}">${hero}${onglets}${corps}${suivant}</article>`;
  }

  /* ---------- le défilement : l'effet de chaque spectacle, et le sommaire qui suit la lecture ---------- */
  let secs = [], chapitres = [], sraf = 0;
  const hautPx = () => haut.offsetHeight;
  function defile() {
    for (const sec of secs) {
      const r = sec.getBoundingClientRect(), h = r.height || 1;
      sec.style.setProperty('--p', (motionOK() ? clamp((hautPx() - r.top) / (h * .85), 0, 1) : 0).toFixed(4));
    }
  }
  function suivreChapitre() {
    if (!chapitres.length) return;
    const lim = innerHeight * .42; let k = 0;
    chapitres.forEach((x, i) => { if (x.sec.getBoundingClientRect().top < lim) k = i; });
    chapitres.forEach((x, i) => { x.li.classList.toggle('on', i === k); if (i === k) x.b.setAttribute('aria-current', 'true'); else x.b.removeAttribute('aria-current'); });
  }
  function sommaire() {
    chapitres = [];
    const nav = $('.sommaire', vPage);
    if (!nav) return;
    chapitres = $$('button[data-chap]', nav).map(b => ({ b, li: b.parentElement, sec: document.getElementById(b.dataset.chap) })).filter(x => x.sec);
    chapitres.forEach(x => x.b.addEventListener('click', () => {
      x.sec.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });
      const h = $('h2', x.sec); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }));
    suivreChapitre();
  }
  addEventListener('scroll', () => { if ((secs.length || chapitres.length) && !sraf) sraf = requestAnimationFrame(() => { sraf = 0; defile(); suivreChapitre(); }); }, { passive: true });
  addEventListener('resize', () => { if (secs.length) defile(); });

  /* ---------- navigation : les trois entrées, la mémoire de l'entrée, les vues ---------- */
  const PAGES = {
    voir: () => ({ titre: entree('voir').texte, rendu: pageVoir }),
    programmer: () => ({ titre: entree('programmer').texte, rendu: pageProgrammer }),
    etablissement: () => ({ titre: entree('etablissement').texte, rendu: pageEtablissement }),
    spectacles: () => ({ titre: menu('spectacles').texte, rendu: pageSpectacles }),
    compagnie: () => ({ titre: menu('compagnie').texte, rendu: pageCompagnie }),
    contact: () => ({ titre: menu('contact').texte, rendu: pageContact }),
    'mentions-legales': () => ({ titre: S.legal['mentions-legales'].titre, rendu: () => pageLegal('mentions-legales') }),
    'politique-de-confidentialite': () => ({ titre: S.legal['politique-de-confidentialite'].titre, rendu: () => pageLegal('politique-de-confidentialite') }),
  };
  const MEMO = 'crescite-m10-entree';
  const retenir = c => { try { sessionStorage.setItem(MEMO, c); } catch (e) { /* stockage indisponible */ } };
  const retenue = () => { try { const v = sessionStorage.getItem(MEMO); return entree(v) ? v : null; } catch (e) { return null; } };
  const vAccueil = $('#v-accueil'), vPage = $('#v-page');
  let courant = null, venait = null;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  // ce qu'on garde d'une vue refaite en place : la position, les volets ouverts, les champs, le focus
  const signe = el => !el || el === document.body ? null : el.dataset && el.dataset.edit ? `e:${el.dataset.edit}` : el.id ? `#${el.id}` : el.dataset && el.dataset.chap ? `c:${el.dataset.chap}` : el.getAttribute && el.getAttribute('href') ? `h:${el.getAttribute('href')}:${el.textContent.trim().slice(0, 40)}` : null;
  function etatVue() {
    const a = document.activeElement;
    return { y: scrollY, ouverts: $$('details', vPage).map(d => d.open), champs: $$('input, textarea', vPage).map(c => [c.id, c.type === 'checkbox' ? c.checked : c.value]),
      focus: a && vPage.contains(a) ? signe(a) : null };
  }
  function restaurer(v) {
    const ds = $$('details', vPage);
    if (v.ouverts && ds.length === v.ouverts.length) ds.forEach((d, i) => { d.open = v.ouverts[i]; });
    (v.champs || []).forEach(([id, x]) => { const c = id && document.getElementById(id); if (c) { if (c.type === 'checkbox') c.checked = x; else c.value = x; } });
    if (Math.abs(scrollY - v.y) > 1) scrollTo(0, v.y);
    if (v.focus) { const el = $$('a, button, summary, input, textarea, [tabindex], [data-edit]', vPage).find(x => signe(x) === v.focus); if (el) el.focus({ preventScroll: true }); }
    defile(); suivreChapitre();
  }
  function apres() {
    $$('a[href^="http"]', vPage).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    $$('form', vPage).forEach(f => f.addEventListener('submit', e => e.preventDefault()));
    $$('svg.carte.encre:not([data-gere])', vPage).forEach(svgEl => { const zone = svgEl.closest('.ag-grille, .tour-grille'); Encre.relier(svgEl, zone ? $$('ul.dl', zone) : []); });
    if (courant && courant.cle === 'voir' && AGV) AGV.brancher();
    secs = $$('[data-scrolly]', vPage); defile();
    sommaire();
  }

  // enPlace : D vient de changer (DONNEES) ; la vue courante est refaite sans remonter, sans voler le focus, sans animation
  function route(enPlace = false) {
    chrome(); pied();
    const chemin = location.hash.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
    const red = (S.redirections || {})['#/' + chemin];
    if (red) { location.replace(red); return; }
    const ms = chemin.match(/^spectacle\/([\w-]+)(?:\/([\w-]+))?$/), ma = chemin.match(/^agenda\/([\w-]+)$/);
    // un spectacle sans entrée : l'entrée retenue, sinon « voir »
    if (ms && show(ms[1]) && !entree(ms[2])) { location.replace(`#/spectacle/${ms[1]}/${retenue() || 'voir'}`); return; }
    let v;
    if (chemin === '') v = { cle: 'accueil', titre: S.accueil };
    else if (ms && show(ms[1])) { const s = show(ms[1]); v = { cle: 'spectacle', slug: ms[1], entree: ms[2], titre: ms[2] === 'voir' ? s.titre : `${s.titre} - ${entree(ms[2]).court}` }; }
    else if (ma && D.saisons[ma[1]]) v = { cle: 'saison', saison: ma[1], titre: D.saisons[ma[1]].titre };
    else if (Object.prototype.hasOwnProperty.call(PAGES, chemin)) v = { cle: chemin, ...PAGES[chemin]() };
    else { location.replace('#/'); return; }
    v.id = v.cle === 'spectacle' ? `spectacle/${v.slug}/${v.entree}` : v.cle === 'saison' ? `saison/${v.saison}` : v.cle;
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    marquerNav(v);
    if (entree(v.cle)) retenir(v.cle);
    if (v.cle === 'spectacle') retenir(v.entree);

    // la même vue, refaite en place
    if (enPlace && courant && courant.id === v.id) {
      const etat = v.cle === 'accueil' ? { y: scrollY } : etatVue();
      ANIMER = false;
      try {
        if (v.cle === 'accueil') { accueilSuite(); Stage.maj(); }
        else { vPage.innerHTML = v.cle === 'spectacle' ? pageSpectacle(v.slug, v.entree) : v.cle === 'saison' ? pageSaison(v.saison) : v.rendu(); apres(); }
      } finally { ANIMER = true; }
      restaurer(etat);
      return;
    }

    fermeMenu();
    const quitte = venait, memeSp = quitte && v.cle === 'spectacle' && quitte === v.slug;
    venait = v.cle === 'spectacle' ? v.slug : null;
    courant = v;
    secs = []; chapitres = [];
    const qs = quitte && show(quitte);
    if (v.cle === 'accueil') {
      // en quittant un spectacle, l'encre se retire vers la pieuvre
      if (qs && motionOK() && !Ink.active()) Ink.fill(univers(qs).fond);
      vPage.hidden = true; vPage.innerHTML = ''; vAccueil.hidden = false;
      accueilSuite();
      scrollTo(0, 0);
      Stage.montrer(true);
      if (qs && motionOK()) { const c = Stage.coeurEcran(); Ink.uncover(c.x, clamp(c.y, 60, innerHeight - 60), null, encreDe(qs)); } else Ink.fadeOut();
      if (!(typeof INTRO !== 'undefined' && INTRO.ouverte())) $('#stage-h').focus({ preventScroll: true });
      return;
    }
    Stage.montrer(false);
    if (qs && !memeSp && motionOK() && !Ink.active() && v.cle !== 'spectacle') Ink.fill(univers(qs).fond);
    vAccueil.hidden = true; vPage.hidden = false; $('#accueil-suite').innerHTML = '';
    vPage.innerHTML = v.cle === 'spectacle' ? pageSpectacle(v.slug, v.entree) : v.cle === 'saison' ? pageSaison(v.saison) : v.rendu();
    scrollTo(0, 0);
    apres();
    if (qs && !memeSp && v.cle !== 'spectacle' && motionOK()) Ink.uncover(innerWidth / 2, innerHeight / 2, null, encreDe(qs)); else Ink.fadeOut();
    const h1 = $('h1', vPage);
    if (h1) h1.focus({ preventScroll: true });
  }
  // un lien vers un spectacle, ailleurs que sur la scène : l'encre de son univers part du clic (pas d'un onglet à l'autre)
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/spectacle/"]');
    if (!a || a.classList.contains('t-label') || e.button > 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || !motionOK()) return;
    if (typeof EDITION !== 'undefined' && EDITION.actif) return;
    const slug = a.getAttribute('href').split('/')[2], s = show(slug);
    if (!s || (courant && courant.cle === 'spectacle' && courant.slug === slug)) return;
    e.preventDefault();
    Ink.cover(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, () => { location.hash = a.getAttribute('href'); }, encreDe(s));
  });
  // l'ouverture : le logo sur la nuit ; à la révélation, la pieuvre de la scène s'éveille et tend ses bras
  INTRO.ouvrir({ degrade: [[0, '#331629'], [.55, '#1b0c16'], [1, '#0b0509']], encre: '#f7ecf1', classe: 'nuit-pieuvre', apres: () => Stage.eveiller() });
  addEventListener('hashchange', () => route());
  route();
  // la base de la compagnie : à chaque enregistrement, D change en place et la vue courante est refaite en place
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(() => route(true));
})();
</script>
