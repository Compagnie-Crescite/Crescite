.rs-bande { gap: 10px; padding: 8px 4px 16px; scroll-padding-inline: 4px; scrollbar-width: none; }
.rs-bande::-webkit-scrollbar { display: none; }
.rs-date { position: relative; min-width: 8.4rem; max-width: 12.5rem; min-height: 44px; padding: 14px 34px 13px 16px; border: 1.5px solid var(--u-trait, var(--lait-2)); border-radius: 16px; background: color-mix(in srgb, var(--u-texte) 5%, transparent); color: var(--u-texte); }
/* la ventouse de chaque date : un anneau, plein quand la date est choisie */
.rs-date::before { content: ""; position: absolute; right: 13px; top: 15px; width: 11px; height: 11px; border: 2px solid var(--u-titre); border-radius: 50%; transition: transform .18s var(--k-souple), background-color .18s; }
.rs-date:hover { border-color: var(--u-titre); }
.rs-date:hover::before { transform: scale(1.3); }
.rs-date:focus-visible { outline: 2px solid var(--u-titre); outline-offset: 3px; }
.rs-q { display: block; white-space: nowrap; }
.rs-s { display: block; margin-bottom: 2px; font: 700 .68rem/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.rs-n { font: 500 2rem/1.05 var(--serif); font-variant-numeric: lining-nums; }
.rs-m { font: italic 500 1.05rem/1.2 var(--serif); }
.rs-h { display: block; margin-top: 8px; font: 700 .98rem/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.rs-h--sans { font-size: .8rem; font-weight: 500; color: var(--u-texte2); }
.rs-o { display: block; max-width: 100%; margin-top: 2px; overflow: hidden; font-size: .8rem; line-height: 1.35; white-space: nowrap; text-overflow: ellipsis; color: var(--u-texte2); }
.rs-date[aria-pressed="true"] { background: var(--u-titre); border-color: var(--u-titre); color: var(--u-sur); box-shadow: 0 14px 28px -18px color-mix(in srgb, var(--u-titre) 90%, transparent); }
.rs-date[aria-pressed="true"]::before { background: var(--u-sur); border-color: var(--u-sur); }
.rs-date[aria-pressed="true"] :is(.rs-s, .rs-o, .rs-h--sans) { color: inherit; }
.rs-corps { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(22px, 3vw, 40px); align-items: start; margin-top: 4px; }
@media (min-width: 1000px) { .rs-corps { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.rs-k-carte { min-width: 0; }
.rs-carte { position: relative; isolation: isolate; overflow: hidden; min-height: 320px; border-radius: 4px; background: var(--u-fond2); color: var(--u-texte);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--u-titre) 26%, transparent), 0 18px 36px -24px var(--noir-45); }
.rs-photo { z-index: -1; inset: 0 0 0 auto; width: 56%; height: 100%; object-fit: cover; opacity: .5;
  -webkit-mask-image: radial-gradient(130% 100% at 100% 42%, var(--pur-noir) 34%, transparent 72%); mask-image: radial-gradient(130% 100% at 100% 42%, var(--pur-noir) 34%, transparent 72%); }
/* l'encre qui s'ouvre (effetEncre) : une tache aux bords d'encre vive, partie de la ventouse choisie */
.rs-tache { position: absolute; z-index: 0; border-radius: var(--blob, 50%); pointer-events: none; will-change: transform, opacity;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--u-titre) 26%, transparent) 64%, color-mix(in srgb, var(--u-titre) 0%, transparent)); box-shadow: inset 0 0 0 3px var(--u-titre); }
.rs-c { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; max-width: 31rem; padding: clamp(24px, 3.2vw, 40px) clamp(20px, 3vw, 38px); }
.rs-c > * { margin: 0; }
.rs-sp { font-family: var(--u-police); font-weight: var(--u-graisse); font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem); line-height: 1.02; color: var(--u-titre); text-wrap: balance; }
.rs-sp a { color: inherit; text-decoration: none; }
.rs-sp a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
.rs-c .rs-quand { margin-top: 14px; font: italic 500 clamp(1.25rem, 1.05rem + .6vw, 1.6rem)/1.25 var(--serif); }
.rs-etat { margin-left: 8px; padding: 1px 9px; border: 1px solid currentColor; border-radius: 999px; font: normal 700 .72rem/1.5 var(--sans); letter-spacing: .06em; color: var(--u-vif); vertical-align: 3px; }
.rs-c .rs-ou { margin-top: 6px; color: var(--u-texte2); }
.rs-lieu { font-weight: 700; color: var(--u-texte); }
.rs-lieu::after { content: " ·"; font-weight: 400; color: var(--u-texte2); }
.rs-c .rs-det { margin-top: 8px; padding: 0; list-style: none; font-size: .92rem; line-height: 1.5; color: var(--u-texte2); }
.rs-c .rs-seances { margin-top: 20px; }
.rs-k { margin: 0 0 8px; font: 700 .68rem/1.3 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--u-texte2); }
.rs-seances--sans { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rs-seances--sans .rs-k { margin: 0; }
.rs-sans { font-weight: 600; }
.rs-seance { min-height: 44px; align-items: center; padding: 8px 18px; border: 1.5px solid color-mix(in srgb, var(--u-texte) 32%, transparent); border-radius: 999px; color: var(--u-texte); text-decoration: none; transition: border-color .18s, background-color .18s; }
a.rs-seance:hover { border-color: var(--u-titre); background: color-mix(in srgb, var(--u-titre) 12%, transparent); }
a.rs-seance:focus-visible { outline: 2px solid var(--u-titre); outline-offset: 2px; }
.rs-sh { font: 500 1.35rem/1 var(--serif); font-variant-numeric: lining-nums tabular-nums; }
.rs-sh--sans { font: 600 .86rem/1.2 var(--sans); }
.rs-sj { font-size: .8rem; color: var(--u-texte2); }
.rs-scol { font: normal 700 .68rem/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.rs-seance.est-scolaire { border-style: dashed; color: var(--u-texte2); }
.rs-c .rs-action { margin-top: 26px; }
/* « Réserver » : le geste évident de la carte, plein, à l'encre de l'univers */
.rs-reserver { min-height: 58px; gap: 16px; padding: 12px 22px 12px 28px; border-radius: 999px; background: var(--u-titre); color: var(--u-sur); transition: box-shadow .18s var(--k-doux), scale .12s; }
.rs-r1 { font: italic 600 1.55rem/1.05 var(--serif); }
.rs-r2 { margin-top: 2px; font: 500 .8rem/1.3 var(--sans); }
.rs-fleche { width: 1.4em; height: 1.4em; transition: transform .18s var(--k-souple); }
.rs-reserver:hover { box-shadow: 0 14px 30px -14px color-mix(in srgb, var(--u-titre) 80%, transparent); }
.rs-reserver:hover .rs-fleche { transform: translate(3px, -3px); }
.rs-reserver:focus-visible { outline: 2px solid var(--u-texte); outline-offset: 3px; }
.rs-aupres { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 12px 20px; border: 1.5px dashed color-mix(in srgb, var(--u-texte) 45%, transparent); border-radius: 999px; font-weight: 600; }
/* sur « Je viens voir un spectacle » : la date d'une ligne réservable est sa ventouse (sur le papier, l'anneau à la couleur
   du spectacle) ; choisie, elle prend l'univers du spectacle, et sa carte s'ouvre sous la ligne */
.dl > li.rs-li { grid-template-columns: 140px minmax(0, 1fr); }
.rs-date--ligne { width: 100%; min-width: 0; max-width: none; align-self: start; padding: 12px 30px 11px 14px; border-color: var(--lait-2); border-radius: 14px; background: var(--papier-clair); color: var(--encre); }
.rs-date--ligne::before { right: 11px; top: 13px; border-color: var(--c, var(--saison)); }
.rs-date--ligne :is(.rs-s, .rs-h--sans) { color: var(--gris); }
.rs-date--ligne .rs-n { font-size: 1.45rem; }
.rs-date--ligne .rs-q { white-space: normal; }
.rs-date--ligne .rs-o { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.rs-date--ligne:hover { border-color: var(--encre); }
.rs-date--ligne:focus-visible { outline: 2px solid var(--saison); outline-offset: 3px; }
/* (choisie, la ventouse se teinte de la couleur du spectacle sur le papier ; l'univers est celui de sa carte, dessous) */
.rs-date--ligne[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--saison)) 16%, var(--papier-clair)); border-color: var(--c, var(--saison)); color: var(--encre); box-shadow: none; }
.rs-date--ligne[aria-pressed="true"] :is(.rs-s, .rs-h--sans) { color: var(--encre); }
.rs-date--ligne[aria-pressed="true"]::before { background: var(--c, var(--saison)); border-color: var(--c, var(--saison)); }
.rs-ici { grid-column: 1 / -1; min-height: 0; margin-top: 12px; transform-origin: 50% 0; }
.rs-ici .rs-c { max-width: 30rem; }
.rs-ici .rs-sp { font-size: clamp(1.5rem, 1.15rem + 1.1vw, 2.1rem); }
@media (pointer: coarse), (max-width: 759px) { .rs-defile { display: none; } }
@media (max-width: 900px) { .rs-bande { margin: 0 calc(-1 * var(--gout)); padding-inline: var(--gout); scroll-padding-inline: var(--gout); } }
@media (max-width: 760px) {
  .dl > li.rs-li { grid-template-columns: 118px minmax(0, 1fr); }
  .rs-carte { min-height: 0; }
  .rs-photo { position: relative; display: block; inset: auto; width: 100%; height: 150px; opacity: .65; -webkit-mask-image: linear-gradient(0deg, transparent, var(--pur-noir) 70%); mask-image: linear-gradient(0deg, transparent, var(--pur-noir) 70%); }
  .rs-c { margin-top: -40px; }
  .rs-reserver { padding: 12px 18px 12px 22px; }
}

/* ---------- la troupe (règle 20, TROUPE) : la pieuvre relie la troupe ----------
   La nuit de la pieuvre, comme le générique d'une affiche : la pieuvre du logo en haut ; sous elle, les métiers en
   colonnes (l'icône, le titre, les noms centrés ; chaque personne, une ventouse) ; dessous, le jeu en chœur (les visages
   dans des taches d'encre cernées de ventouses, puis les noms). Au bureau, les bras de la pieuvre (.tr-bras) s'allongent
   jusqu'à chaque métier et tiennent le chœur. Lié au défilement : la pieuvre monte, ses bras poussent, les personnes
   fleurissent l'une après l'autre ; survolée ou choisie, une personne s'allume partout où elle est, les bras de ses
   métiers s'allument et une vrille d'encre vive part de chacun jusqu'à elle. */
#v-page section.bloc.troupe { position: relative; overflow: clip; border-top: 4px double var(--blanc-24); color: var(--blanc);
  background: radial-gradient(70% 40% at 50% 0%, var(--nuit-3) 0%, var(--nuit-0) 72%), var(--nuit); }
.tr-titre { margin: 0 0 clamp(14px, 2.4vw, 26px); text-align: center; font-size: clamp(2.4rem, 1.6rem + 2.6vw, 4rem); color: var(--blanc); }
.tr { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(48px, 6.4vw, 92px); timeline-scope: --tr-pieuvre;
  --troupe-lien: var(--saison-vive); --troupe-ic-fond: var(--nuit); --troupe-ventouse-fond: var(--nuit); }
/* les bras de la pieuvre et les vrilles (dessinés par vivreTroupe, sous les places) */
.tr-bras { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.tr-bras svg { position: absolute; display: block; overflow: visible; }
.tr-b path { fill: var(--blanc); opacity: .6; }
.tr-b circle { fill: var(--nuit); stroke: var(--blanc); stroke-width: 1.1; opacity: .66; }
.tr-b.est-allume path { fill: var(--saison-vive); opacity: 1; }
.tr-b.est-allume circle { stroke: var(--saison-vive); opacity: 1; }
.tr-vrille path { fill: var(--saison-vive); }
.tr-vrille circle { fill: var(--nuit); stroke: var(--saison-vive); stroke-width: 1.2; }
.tr-vrille .tr-vrille-v { fill: none; stroke-width: 2; }
.tr-pieuvre { position: relative; z-index: 1; justify-self: center; width: min(400px, 74vw); color: var(--blanc); line-height: 0; view-timeline: --tr-pieuvre block; }
.tr-pieuvre::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 56%; width: 150%; aspect-ratio: 1.7; transform: translate(-50%, -50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--saison-vive) 16%, transparent), transparent); pointer-events: none; }
.tr-pieuvre svg { display: block; width: 100%; height: auto; overflow: visible; }
.tr-rang { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 44px clamp(16px, 2.2vw, 32px); align-items: start; }
.tr-cat { position: relative; z-index: 2; min-width: 0; text-align: center; }
.tr-cat-t { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 0 0 14px; font: italic 500 clamp(1.15rem, 1.02rem + .4vw, 1.4rem)/1.2 var(--serif); color: var(--blanc); text-wrap: balance; }
.tr-ic { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--nuit); color: var(--saison-vive); box-shadow: inset 0 0 0 1.5px var(--blanc-30), 0 0 0 6px var(--nuit); transition: box-shadow .18s; }
.tr-ic .troupe-icone { width: 32px; height: 32px; }
.tr-cat.est-allume .tr-ic, .tr-cat:hover .tr-ic { box-shadow: inset 0 0 0 2px var(--saison-vive), 0 0 0 6px var(--nuit); }
.tr-places { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; justify-items: center; }
.tr-li { min-width: 0; max-width: 100%; }
.tr-place { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; min-height: 44px; padding: 6px 12px 8px; border: 0; border-radius: 12px; background: none; color: var(--blanc); font: inherit; text-align: center; cursor: pointer; transition: background-color .16s, opacity .16s; }
.tr-point { display: block; width: 11px; height: 11px; border-radius: 50%; background: var(--nuit); box-shadow: inset 0 0 0 2px var(--saison-vive); transition: transform .18s var(--k-souple), background-color .18s; }
.tr-qui { display: grid; gap: 2px; min-width: 0; }
.tr-nom { font: 500 1.06rem/1.2 var(--serif); overflow-wrap: break-word; }
.tr-metiers { font-size: .8rem; line-height: 1.35; color: var(--blanc-2); }
.tr-metier + .tr-metier::before { content: " · "; }
.tr-place:hover, .tr-place:focus-visible { background: var(--blanc-7); }
.tr-place:focus-visible { outline: 2px solid var(--saison-vive); outline-offset: 1px; }
.tr-place.est-allume { background: var(--nuit-2); }
.tr-place.est-allume .tr-nom, .tr-place:hover .tr-nom { color: var(--saison-vive); }
.tr-place.est-allume .tr-point, .tr-place:hover .tr-point { background: var(--saison-vive); transform: scale(1.35); }
.tr-place[aria-pressed="true"] { background: color-mix(in srgb, var(--saison-vive) 16%, var(--nuit-2)); }
.tr.est-allume .tr-place:not(.est-allume), .tr.est-groupe .tr-place:not(.est-allume) { opacity: .34; }
.tr-place.mv-presse { scale: .97; transition-duration: .06s; }
/* le chœur : les visages publiés, chacun dans sa tache d'encre cernée de ventouses ; puis les noms */
.tr-choeur .tr-cat-t { font-size: clamp(1.3rem, 1.1rem + .6vw, 1.7rem); }
.tr-visages { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 10px; max-width: 1040px; margin: 0 auto 26px; }
.tr-visages .tr-place { width: 128px; gap: 12px; padding: 10px 4px; }
.tr-vignette { position: relative; display: block; width: 88px; height: 88px; border-radius: var(--blob, 50%); }
.tr-vignette::before { content: ""; position: absolute; inset: -6px; border: 2px dotted var(--blanc-30); border-radius: inherit; transition: border-color .18s; }
.tr-vignette img { display: block; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; object-position: 50% 22%; background: var(--nuit-2); }
.tr-place.est-allume .tr-vignette::before, .tr-place:hover .tr-vignette::before { border-color: var(--saison-vive); }
.tr-noms { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; max-width: 1040px; margin: 0 auto; }
.tr-noms .tr-li { width: 200px; }
@media (min-width: 1100px) { .tr-rang { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); } }
@media (max-width: 1099px) { .tr-bras { display: none; } .tr-pieuvre { width: min(300px, 70vw); } }
@media (max-width: 560px) {
  .tr-visages { gap: 12px 4px; }
  .tr-visages .tr-place { width: 100px; }
  .tr-vignette { width: 64px; height: 64px; }
  .tr-noms .tr-li { width: 100%; }
}
/* lié au défilement : la pieuvre monte, ses bras poussent (depuis le bout de chaque bras du logo), les personnes fleurissent */
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .tr-pieuvre svg { animation: tr-monte linear both; animation-timeline: view(); animation-range: entry 0% cover 40%; }
    .tr-b { animation: tr-pousse linear both; animation-timeline: --tr-pieuvre; animation-range: entry 80% cover 62%; }
    .tr-li { animation: tr-fleurit linear both; animation-timeline: view(); animation-range: entry 0% entry 90%; }
  }
}
@keyframes tr-monte { from { opacity: 0; transform: translateY(46px) scale(.9); } }
@keyframes tr-pousse { from { opacity: 0; transform: scale(.06); } 35% { opacity: 1; } }
@keyframes tr-fleurit { from { opacity: .15; transform: translateY(12px); } }
/* les repères de la compagnie, après la troupe : le titre à gauche (il reste en vue au bureau), le bras des dates à droite */
@media (min-width: 901px) { .co-reperes .co-grille { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); } .co-reperes .h2 { position: sticky; top: calc(var(--haut) + 24px); } }

footer.pied { background: var(--nuit); color: var(--blanc-2); padding: 48px 0 44px; font-size: .92rem; }
.pied .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; }
.pied p { margin: 0 0 10px; }
.pied strong { color: var(--blanc); }
.pied a { color: var(--blanc); }
.pied .l { display: block; width: 58px; margin-bottom: 14px; color: var(--saison-vive); }
.pied .l svg { width: 100%; height: auto; display: block; }
.pied .liens { display: flex; gap: 18px; flex-wrap: wrap; }
.modifier { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 6px; padding: 6px 14px 6px 10px; border: 1px solid var(--blanc-24); border-radius: 999px; background: none; color: var(--blanc-2); font: 600 .84rem/1.2 var(--sans); cursor: pointer; }
.modifier .be { color: var(--saison-vive); }
.modifier:hover { color: var(--blanc); border-color: var(--blanc-2); }

/* ---------- le mouvement (règle 15) : l'organique ; voir le bloc « Mouvement » en tête du script ----------
   Des courbes souples (un rien de rebond, jamais de secousse) ; survol 180 ms, pression 60 ms, page 440 ms au plus. */
:root { --k-souple: cubic-bezier(.3, 1.25, .5, 1); --k-doux: cubic-bezier(.22, .8, .24, 1); }
/* une page qui arrive (hors des spectacles) : son titre fleurit, le bras arrive du bord de l'écran, le souligne et s'enroule */
.arrive .page-tete h1 > span { animation: k-fleurit .36s var(--k-doux) both; }
.arrive .page-tete h1 > span::after { transform-origin: 0 50%; animation: k-bras .46s var(--k-doux) .04s both; }
.arrive .page-tete h1 > span::before { animation: k-boucle .34s var(--k-souple) .34s both; }
@keyframes k-fleurit { from { opacity: .15; transform: translateY(10px); } }
@keyframes k-bras { from { transform: scaleX(0); } }
@keyframes k-boucle { from { opacity: 0; transform: scale(.2) rotate(-120deg); } }
/* la pression : une ventouse se pose à l'endroit du doigt, à l'instant même ; le bouton s'enfonce d'un rien */
.succion { position: fixed; z-index: 95; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; pointer-events: none;
  border: 2.5px solid var(--sc, var(--saison)); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--sc, var(--saison)) 22%, transparent); opacity: 0; }
:is(.cta, .mp, .cp, .idx-tout, .idx, .bouton, .modifier, .onglets a, .theme, .lien-video, .lc-b, .rs-date, .rs-reserver, .rs-defile button) { transition-property: background-color, color, border-color, box-shadow, scale; transition-duration: .18s, .18s, .18s, .18s, .12s; }
.mv-presse:is(.cta, .mp, .cp, .idx-tout, .idx, .bouton, .modifier, .theme, .lien-video, .lc-b, .rs-date, .rs-reserver) { scale: .96; transition-duration: .06s; }
:is(.tuile, .cv, .fp, .fe, .ep-porte, .ep-page):has(.mv-presse) { box-shadow: inset 0 0 0 2px var(--u-titre, var(--saison)); }
/* ce qui vit : « EN TOURNÉE » respire comme une ventouse ; « aujourd'hui » bat sur chaque frise */
.vit::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; vertical-align: .08em; animation: k-respire 2.2s ease-in-out infinite; }
@keyframes k-respire { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
/* au défilement : les titres fleurissent, les fiches arrivent l'une après l'autre ; une ligne vers laquelle mène un repère s'allume */
.est-vise { animation: k-vise 1.4s var(--k-doux); }
@keyframes k-vise { 0%, 35% { background: var(--saison-16); } }
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }
/* le visible d'abord : ce qui est loin sous le pli ne se met en page qu'en approchant ; tout l'est le temps d'aller à un chapitre */
#v-page > section.bloc ~ section.bloc, .sp-chaps > .chap ~ .chap, .bandes > .bande ~ .bande ~ .bande, #accueil-suite > section.bloc { content-visibility: auto; contain-intrinsic-size: auto 900px; }
.tout-rendu :is(#v-page > section.bloc ~ section.bloc, .sp-chaps > .chap ~ .chap, .bandes > .bande ~ .bande ~ .bande, #accueil-suite > section.bloc) { content-visibility: visible; }

/* ---------- les frises (FRISE) : un bras d'encre et ses ventouses ----------
   l'axe est un bras qui s'effile (épais au départ, fin au bout) ; chaque date, une ventouse (pleine quand elle est à venir,
   à la couleur de son spectacle ; vidée quand elle est jouée) ; « aujourd'hui », une goutte d'encre dont le cœur bat ; les
   saisons et la diffusion, des bras qui poussent du grand bras, longs comme le nombre de leurs dates */
.frise[data-frise] { --fr-encre: var(--encre); --fr-trait: var(--encre-24); --fr-fond: var(--lait); --fr-accent: var(--saison-texte); --fr-bras: var(--encre-bras);

  /* ---------- l'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();
  const MOIS_NOMS = MOIS.split('|');
  const MOIS_TOK = `${MOIS}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)
  const RE_JOUR = new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS_TOK})\\.?(?:\\s+(\\d{4}))?`, 'gi');
  const RE_MOIS_AN = new RegExp(`(${MOIS_TOK})\\.?\\s+(\\d{4})`, 'i');

  function cleDate(d, saison) {

    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];

        </div>
        ${credit ? `<p class="hero-credit"${s.creditPhotos ? ed(`shows.${slug}.creditPhotos`) : ''}>${esc(credit)}</p>` : ''}
      </div>`;
    const onglets = seul ? '' : `<nav class="onglets" aria-label="${attr(s.titre)}"><div class="og-in">${ENT.filter(e => e.cle !== 'etablissement' || s.actionCulturelle).map(e => `<a href="#/spectacle/${attr(slug)}/${attr(e.cle)}" style="--e:${coulE(e, !u.clair)};--en:${coulE(e, true)}"${e.cle === cle ? ' aria-current="page"' : ''}>${BE}<span class="long">${esc(e.texte)}</span><span class="court">${esc(e.court)}</span>${e.cle === cle ? '<i class="og-trait" aria-hidden="true"></i>' : ''}</a>`).join('')}</div></nav>`;
    const ch = seul ? chapitresSeul(s) : cle === 'programmer' ? chapitresProgrammer(s) : cle === 'etablissement' ? chapitresEtablissement(s) : chapitresVoir(s);
    const ent = (!seul && entree(cle)) || {};
    const appel = seul || cle === 'voir' ? '' : `<div class="appel">${ecrire()}</div>`;
    const corps = `<div class="sp-tab">
        <nav class="sommaire" aria-label="${attr(ent.court || s.titre)}"><ol>${ch.map((c, k) => `<li style="--i:${k}"><button type="button" data-chap="ch-${c.id}">${esc(c.label)}</button></li>`).join('')}</ol></nav>
        <div class="sp-chaps">${ch.map(c => `<section class="chap ch-${c.id}" id="ch-${c.id}" aria-labelledby="h-${c.id}">${c.html}</section>`).join('')}${appel}</div>
      </div>`;
    const suivant = nx && nx !== s ? `<a class="suivant${uClair(nx)}" href="${attr(hrefSp(nx, cle || 'voir'))}" style="${uStyle(nx)}"><span class="wrap"><b>${esc(nx.titre)}</b>${FLECHE}</span>${motifCoin(nx)}</a>` : '';
    return `<article class="show${uClair(s)}${seul ? ' seul' : ''}" style="${uStyle(s)}">${hero}${onglets}${corps}${suivant}</article>`;
  }

  /* ---------- le défilement : l'effet de chaque spectacle, et le sommaire qui suit la lecture ---------- */
  let secs = [], chapitres = [], sraf = 0;
  const hautPx = () => haut.offsetHeight;
  function defile() {
    for (const sec of secs) {
      const r = sec.getBoundingClientRect(), h = r.height || 1;
      sec.style.setProperty('--p', (motionOK() ? clamp((hautPx() - r.top) / (h * .85), 0, 1) : 0).toFixed(4));
    }
  }
  function suivreChapitre() {
    if (!chapitres.length) return;
    const lim = innerHeight * .42; let k = 0;
    chapitres.forEach((x, i) => { if (x.sec.getBoundingClientRect().top < lim) k = i; });
    chapitres.forEach((x, i) => { x.li.classList.toggle('on', i === k); if (i === k) x.b.setAttribute('aria-current', 'true'); else x.b.removeAttribute('aria-current'); });
  }
  function sommaire() {
    chapitres = [];
    const nav = $('.sommaire', vPage);
    if (!nav) return;
    chapitres = $$('button[data-chap]', nav).map(b => ({ b, li: b.parentElement, sec: document.getElementById(b.dataset.chap) })).filter(x => x.sec);
    chapitres.forEach(x => x.b.addEventListener('click', () => {
      x.sec.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });
      const h = $('h2', x.sec); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }));
  }
  addEventListener('scroll', () => { if ((secs.length || chapitres.length || (AGV && AGV.lire)) && !sraf) sraf = requestAnimationFrame(() => { sraf = 0; if (secs.length) defile(); suivreChapitre(); if (AGV && AGV.lire) AGV.lire(); }); }, { passive: true });
  addEventListener('resize', () => { if (secs.length) defile(); });

  /* ---------- navigation : le menu, les anciennes adresses, la mémoire de l'onglet, les vues ----------
     (#/saisons et #/saisons/<saison>, #/espace-pro/<programmer|etablissement> et les spectacles se lisent dans route()) */
  const PAGES = {
    spectacles: () => ({ titre: menu('spectacles').texte, rendu: pageSpectacles }),
    compagnie: () => ({ titre: menu('compagnie').texte, rendu: pageCompagnie }),
    // (le contact n'est plus dans le menu, règle 21 : son titre est celui de sa page)
    contact: () => ({ titre: (S.contact || {}).titre || (S.ecrire || {}).texte, rendu: pageContact }),
    'espace-pro': () => (S.espacePro ? { titre: S.espacePro.titre, rendu: pageEspacePro } : null),
    'mentions-legales': () => ({ titre: S.legal['mentions-legales'].titre, rendu: () => pageLegal('mentions-legales') }),
    'politique-de-confidentialite': () => ({ titre: S.legal['politique-de-confidentialite'].titre, rendu: () => pageLegal('politique-de-confidentialite') }),
  };
  const MEMO = 'crescite-m10-entree';
  // la mémoire de l'entrée s'écrit après l'image (le stockage coûte, la première fois)
  const retenir = c => setTimeout(() => { try { sessionStorage.setItem(MEMO, c); } catch (e) { /* stockage indisponible */ } }, 0);
  const retenue = () => { try { const v = sessionStorage.getItem(MEMO); return entree(v) ? v : null; } catch (e) { return null; } };
  const vAccueil = $('#v-accueil'), vPage = $('#v-page');
  let courant = null, venait = null, NAV = 0, voulu = null, tArrive = 0;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  // aller vers une page ; encre : { x, y, cols }, d'où part l'encre de l'univers en entrant dans un spectacle
  function allerVers(href, encre) {
    voulu = encre ? { ...encre, href, t: performance.now() } : null;
    if (location.hash === href) route(); else location.hash = href;
  }
  const rendu = v => v.cle === 'spectacle' ? pageSpectacle(v.slug, v.entree) : v.rendu();
  const detruireFrises = () => { frises.forEach(f => { try { f.detruire(); } catch (e) { /* déjà retirée */ } }); frises = []; };
  const centre = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  // une page qui arrive (hors des spectacles) : son titre fleurit, le bras d'encre arrive du bord de l'écran et le souligne
  function arriver() { clearTimeout(tArrive); vPage.classList.add('arrive'); tArrive = setTimeout(() => vPage.classList.remove('arrive'), 900); }

  // ce qu'on garde d'une vue refaite en place : la position, les volets ouverts, les champs, le focus
  const signe = el => !el || el === document.body ? null : el.dataset && el.dataset.edit ? `e:${el.dataset.edit}` : el.id ? `#${el.id}` : el.dataset && el.dataset.chap ? `c:${el.dataset.chap}`
    : el.dataset && el.dataset.s ? `s:${el.dataset.s}` : el.dataset && el.dataset.eff ? `f:${el.dataset.eff}` : el.matches && el.matches('h1') ? 'h1'
    : el.matches && el.matches('summary') && el.parentElement && el.parentElement.dataset.saison ? `sai:${el.parentElement.dataset.saison}`
    : el.getAttribute && el.getAttribute('href') ? `h:${el.getAttribute('href')}:${el.textContent.trim().slice(0, 40)}` : null;
  function etatVue() {
    const a = document.activeElement;
    return { y: scrollY, ouverts: $$('details', vPage).map(d => d.open), champs: $$('input, textarea', vPage).map(c => [c.id, c.type === 'checkbox' ? c.checked : c.value]),
      focus: a && vPage.contains(a) ? signe(a) : null };
  }
  function restaurer(v) {
    const ds = $$('details', vPage);
    if (v.ouverts && ds.length === v.ouverts.length) ds.forEach((d, i) => { d.open = v.ouverts[i]; });
    (v.champs || []).forEach(([id, x]) => { const c = id && document.getElementById(id); if (c) { if (c.type === 'checkbox') c.checked = x; else c.value = x; } });
    if (Math.abs(scrollY - v.y) > 1) scrollTo(0, v.y);
    if (v.focus) { const el = $$('a, button, summary, input, textarea, [tabindex], [data-edit], h1', vPage).find(x => signe(x) === v.focus); if (el) el.focus({ preventScroll: true }); }
    defile(); suivreChapitre();
  }
  // après un rendu : les liens externes, les cartes reliées à leurs listes, l'agenda, les frises, le sommaire, les révélations ;
  // ce qui lit la mise en page attend l'image
  function apres(racine = vPage) {
    $$('a[href^="http"]', racine).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    $$('form', racine).forEach(f => f.addEventListener('submit', e => e.preventDefault()));
    $$('svg.carte.encre:not([data-gere])', racine).forEach(svgEl => { const zone = svgEl.closest('.ag-grille, .tour-grille'); Encre.relier(svgEl, zone ? $$('ul.dl', zone) : []); });
    if (courant && courant.cle === 'saisons' && AGV) AGV.brancher();
    APRES.splice(0).forEach(f => f());
    secs = $$('[data-scrolly]', vPage);
    sommaire();
    decorer(racine);
    requestAnimationFrame(() => { if (secs.length) defile(); suivreChapitre(); });
  }
  // d'un onglet à l'autre du même spectacle : on reste dans la lecture ; l'en-tête demeure, le trait de l'onglet glisse
  function changerOnglet(v) {
    const art = $('.show', vPage), trait = $('.onglets .og-trait', art), q0 = trait && motionOK() ? trait.getBoundingClientRect() : null;
    const tpl = document.createElement('template');
    tpl.innerHTML = pageSpectacle(v.slug, v.entree);
    const neuf = tpl.content.firstElementChild;
    for (const sel of ['.sp-tab', '.suivant']) { const a = $(sel, art), b = $(sel, neuf); if (a && b) a.replaceWith(b); else if (a) a.remove(); else if (b) art.appendChild(b); }
    const href = `#/spectacle/${v.slug}/${v.entree}`;
    let cur = null;
    $$('.onglets a', art).forEach(a => { if (a.getAttribute('href') === href) { a.setAttribute('aria-current', 'page'); cur = a; } else a.removeAttribute('aria-current'); });
    if (trait && cur) cur.appendChild(trait);
    apres(art);
    requestAnimationFrame(() => {
      if (courant !== v) return;
      // les onglets collés en haut : le nouveau contenu commence juste dessous ; sinon on ne bouge pas
      const hero = $('.sx-hero', art), y = hero ? hero.getBoundingClientRect().bottom + scrollY - hautPx() : 0;
      if (hero && scrollY > y) scrollTo(0, y);
      if (q0 && trait.isConnected) {
        const q1 = trait.getBoundingClientRect(), dx = q0.left - q1.left, k = q0.width / (q1.width || 1);
        if (Math.abs(dx) > .5 || Math.abs(k - 1) > .01) trait.animate([{ transform: `translateX(${dx}px) scaleX(${k})` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.3, 1.25, .5, 1)' });
      }
    });
  }

  // enPlace : D vient de changer (DONNEES) ; la vue courante est refaite en place, sans remonter, sans voler le focus, sans animation
  function route(enPlace = false, n = 0) {
    chrome(); pied();
    const brut = location.hash.replace(/^#\/?/, ''), chemin = brut.split('?')[0].replace(/\/+$/, ''), requete = brut.includes('?') ? brut.slice(brut.indexOf('?')) : '';
    // une redirection remplace l'adresse (sans second rendu, sans trace dans l'historique)
    const vers = h => { if (n < 4) { history.replaceState(history.state, '', h); route(enPlace, n + 1); } };
    // les anciennes adresses (D.site.redirections, règle 21) : #/voir et #/agenda → #/saisons, #/programmer → #/espace-pro/programmer,
    // #/etablissement et #/actions-culturelles → #/espace-pro/etablissement ; #/agenda/<saison> → #/saisons/<saison>
    // (une vue l'emporte sur une redirection de D : #/espace-pro, autrefois redirigé, est une page, règle 16)
    const red = (S.redirections || {})['#/' + chemin];
    if (red && !(chemin === 'espace-pro' && S.espacePro)) { vers(red + requete); return; }
    const ma = chemin.match(/^agenda\/([\w-]+)$/);
    if (ma) { vers(`#/saisons/${ma[1]}`); return; }
    const ms = chemin.match(/^spectacle\/([\w-]+)(?:\/([\w-]+))?$/), mz = chemin.match(/^saisons(?:\/([\w-]+))?$/), mp = chemin.match(/^espace-pro\/(programmer|etablissement)$/);
    const sp = ms && show(ms[1]);
    // un spectacle qui n'est plus en tournée n'a qu'une page : ses anciens onglets y mènent (la mémoire de l'onglet ne s'y applique pas)
    if (sp && !aOnglets(sp) && ms[2]) { vers(`#/spectacle/${ms[1]}${requete}`); return; }
    if (sp && aOnglets(sp)) {
      // un spectacle sans onglet : l'onglet retenu, sinon « voir »
      if (!entree(ms[2])) { vers(`#/spectacle/${ms[1]}/${entreeSp(ms[1], retenue() || 'voir')}${requete}`); return; }
      // un spectacle sans action culturelle n'a pas d'onglet établissement : « voir »
      if (ms[2] === 'etablissement' && !sp.actionCulturelle) { vers(`#/spectacle/${ms[1]}/voir`); return; }
    }
    // une saison : la saison en cours se lit en tête de #/saisons, une saison inconnue y mène aussi
    if (mz && mz[1] && !(D.saisons[mz[1]] && mz[1] < D.saison)) { vers('#/saisons'); return; }
    let v, pg;
    if (chemin === '') v = { cle: 'accueil', titre: S.accueil };
    else if (sp) v = aOnglets(sp) ? { cle: 'spectacle', slug: ms[1], entree: ms[2], titre: ms[2] === 'voir' ? sp.titre : `${sp.titre} - ${entree(ms[2]).court}` }
      : { cle: 'spectacle', slug: ms[1], entree: null, titre: sp.titre };
    // #/saisons/<saison> : la page des saisons, ouverte sur elle (son titre pour document.title)
    else if (mz) { const k = mz[1] || null; v = { cle: 'saisons', saison: k, titre: k ? D.saisons[k].titre : menu('saisons').texte, rendu: () => pageSaisons(k) }; }
    else if (mp && entree(mp[1])) v = { cle: mp[1], titre: entree(mp[1]).texte, rendu: mp[1] === 'programmer' ? pageProgrammer : pageEtablissement };
    else if (Object.prototype.hasOwnProperty.call(PAGES, chemin) && (pg = PAGES[chemin]())) v = { cle: chemin, ...pg };
    else { vers('#/'); return; }
    v.id = v.cle === 'spectacle' ? `spectacle/${v.slug}/${v.entree || ''}` : v.cle === 'saisons' ? `saisons/${v.saison || ''}` : v.cle;
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    marquerNav(v);
    // la mémoire de l'onglet : les saisons, c'est « voir » ; une page de l'espace pro, la sienne ; un onglet, le sien
    if (v.cle === 'saisons') retenir('voir');
    else if (entree(v.cle)) retenir(v.cle);
    if (v.cle === 'spectacle' && v.entree) retenir(v.entree);

    // la même vue, refaite en place
    if (enPlace && courant && courant.id === v.id) {
      const etat = v.cle === 'accueil' ? { y: scrollY } : etatVue();
      ANIMER = false; GEN++; APRES = []; AGV = null; detruireFrises(); quitterTroupe();
      try {
        if (v.cle === 'accueil') { accueilSuite(); Stage.maj(); }
        else { vPage.innerHTML = rendu(v); apres(); }
      } finally { ANIMER = true; }
      restaurer(etat);
      return;
    }

    // le lien suivi garde le focus : on le lui retire d'abord (l'ôter de la page plus tard, quand les styles sont invalidés,
    // forcerait le calcul des styles de toute l'ancienne page)
    const actif = document.activeElement;
    if (actif && actif !== document.body && $('#main').contains(actif)) actif.blur();
    Ink.arreter(); vPage.style.visibility = '';
    GEN++; APRES = []; AGV = null; secs = []; chapitres = [];
    clearTimeout(tArrive); vPage.classList.remove('arrive');
    const avant = courant, quitte = venait;
    const memeSp = !!(quitte && v.cle === 'spectacle' && v.entree && quitte === v.slug && avant && avant.cle === 'spectacle' && avant.entree && $('.show', vPage));
    venait = v.cle === 'spectacle' ? v.slug : null;
    courant = v;
    // d'où part l'encre : le point choisi (un titre de la scène, une carte, un lien), s'il mène bien à ce spectacle
    const vu = voulu && performance.now() - voulu.t < 3000 && v.cle === 'spectacle' && String(voulu.href).split('/')[2] === v.slug ? voulu : null;
    voulu = null;
    // la première vue (le chargement, l'ouverture) ne joue rien
    const vit = !!avant && motionOK() && !(typeof INTRO !== 'undefined' && INTRO.ouverte());
    const qs = quitte && !memeSp ? show(quitte) : null;
    if (memeSp) { detruireFrises(); changerOnglet(v); return; }
    detruireFrises(); quitterTroupe();
    if (v.cle === 'accueil') {
      vPage.hidden = true; vPage.innerHTML = ''; vAccueil.hidden = false;
      accueilSuite();
      scrollTo(0, 0);
      Stage.montrer(true);
      // en quittant un spectacle, l'encre se resserre vers le cœur de la pieuvre
      if (qs && vit) { const c = Stage.coeurEcran(); Ink.retirer(c.x, clamp(c.y, 60, VH - 60), encreDe(qs)); }
      if (!(typeof INTRO !== 'undefined' && INTRO.ouverte())) requestAnimationFrame(() => { if (courant === v) $('#stage-h').focus({ preventScroll: true }); });
      return;
    }
    // en quittant un spectacle pour une page : l'encre se resserre vers la pieuvre de l'en-tête (lue avant le rendu)
    const pm = qs && vit && v.cle !== 'spectacle' ? centre($('#marque')) : null;
    Stage.montrer(false);
    vAccueil.hidden = true; vPage.hidden = false; $('#accueil-suite').innerHTML = '';
    vPage.innerHTML = rendu(v);
    scrollTo(0, 0);
    apres();
    const montrer = () => { if (courant !== v) return; vPage.style.visibility = ''; const h1 = $('h1', vPage); if (h1) h1.focus({ preventScroll: true }); };
    if (vit && v.cle === 'spectacle') {
      // entrer dans un spectacle : la page est déjà là, l'encre de son univers la recouvre et s'ouvre aussitôt depuis le point
      // choisi ; la toute première image n'a que l'encre à peindre (la page, couverte, n'y paraît pas), la page vient à la suivante
      vPage.style.visibility = 'hidden';
      Ink.ouvrir(vu ? vu.x : VW / 2, vu ? vu.y : VH * .42, vu && vu.cols ? vu.cols : encreDe(show(v.slug)));
      requestAnimationFrame(() => requestAnimationFrame(montrer));
      return;
    }
    if (pm) Ink.retirer(pm.x, pm.y, encreDe(qs));
    else if (vit) arriver();
    requestAnimationFrame(montrer);
  }
  // un lien vers un spectacle, ailleurs que sur la scène : l'encre de son univers partira du point choisi (la navigation suit son cours)
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/spectacle/"]');
    if (!a || a.classList.contains('t-label') || e.defaultPrevented || e.button > 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    const href = a.getAttribute('href'), slug = href.split('/')[2], s = show(slug);
    if (!s || (courant && courant.cle === 'spectacle' && courant.slug === slug)) return;
    const r = a.getBoundingClientRect();
    voulu = { x: e.clientX || r.left + r.width / 2, y: e.clientY || r.top + r.height / 2, cols: encreDe(s), href, t: performance.now() };
  }, { passive: true });
  // la pression : une ventouse se pose sous le doigt, à l'instant même (sur la scène, c'est la pieuvre qui répond)
  const succion = document.createElement('i');
  succion.className = 'succion'; succion.setAttribute('aria-hidden', 'true');
  document.body.appendChild(succion);
  addEventListener('pointerdown', e => {
    if (!(e.pointerType === 'mouse' && e.target.closest && e.target.closest('#scene .t-label:not(.t-entree)'))) Stage.suspendre(650);
    if (e.button > 0 || !motionOK() || !succion.animate) return;
    const c = e.target.closest && e.target.closest('a[href], button, summary, label, [role="button"]');
    if (!c || c.closest('#scene, [class^="ed-"], [class*=" ed-"]')) return;
    const cs = getComputedStyle(c), col = ['--e', '--ev', '--c', '--u-titre'].map(x => cs.getPropertyValue(x).trim()).find(Boolean);
    succion.style.translate = `${e.clientX}px ${e.clientY}px`;
    succion.style.setProperty('--sc', col || 'var(--saison)');
    succion.getAnimations().forEach(a => a.cancel());
    succion.animate([{ opacity: .95, scale: 1.5 }, { opacity: .9, scale: .82, offset: .55 }, { opacity: 0, scale: .9 }], { duration: 380, easing: 'cubic-bezier(.3, 1.25, .5, 1)' });
  }, { capture: true, passive: true });
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') Stage.suspendre(650); }, { capture: true, passive: true });
  if (MV) MV.presse(document);
  // les tentacules de l'outil commun se taisent : la pieuvre n'a que ses moments (le bras vers ce qu'on regarde, l'encre d'un spectacle, la troupe)
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ clic: false, pages: false });
  // l'ouverture : le logo sur la nuit, à la vive de la saison (règle 22) ; à la révélation, la pieuvre de la scène s'éveille et tend ses bras
  INTRO.ouvrir({ degrade: [[0, '#331629'], [.55, '#1b0c16'], [1, '#0b0509']], encre: (saisonCouleurs() || {}).vive || '#f7ecf1', classe: 'nuit-pieuvre', apres: () => Stage.eveiller() });
  // une adresse nouvelle : la page change à l'image d'après (le geste se voit d'abord), la dernière demandée l'emporte
  addEventListener('hashchange', () => { const j = ++NAV; ensuite(() => { if (j === NAV) route(); }); });
  route();
  // au repos : l'agenda passé lu d'avance, une saison par tâche (chacune courte : un geste n'attend jamais qu'elles finissent),
  // et les photos servies une à une par des adresses courtes
  const aLire = (S.saisons || []).slice();
  const lireUne = () => { const x = aLire.shift(); if (!x) return; retenu(`passe:${x.saison}`, () => saisonPassee(x)); plusTard(lireUne); };
  plusTard(lireUne);
  const aConvertir = [...Object.values(D.photos || {}), ...Object.values(D.personnes || {}).map(x => x.photo)].filter(x => typeof x === 'string' && x.startsWith('data:'));
  const suivante = () => { const d = aConvertir.shift(); if (d) plusTard(() => convertir(d).then(suivante)); };
  suivante();
  // la base de la compagnie : à chaque enregistrement, D change en place et la vue courante est refaite en place
  // (pas pendant qu'une vidéo joue : la refaire l'arrêterait ; la vue se refait quand elle s'arrête)
  let tLecteur = 0;
  const refaire = () => { clearTimeout(tLecteur); if (LC && LC.actif()) { tLecteur = setTimeout(refaire, 1500); return; } route(true); };
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(() => { versionD++; refaire(); });
})();
</script>
</body>
