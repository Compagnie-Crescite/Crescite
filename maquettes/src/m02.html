<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --white:#ffffff;
  --ink:#111111;
  --grey:#6a6a6a;
  --paper:#f3f1ee;
  --magenta:#bc3e80;
  --magenta-dark:#a1336c;
  --magenta-soft:#f8eaf1;
  --rule:#e3dfd9;
  --rule-paper:#d9d4cc;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --pad:clamp(16px,4vw,56px);
  --gap:24px;
  --max:1312px;
  --sec:clamp(64px,7vw,104px);
  --fs-label:.8125rem;
  --fs-lead:1.125rem;
  --fs-s1:1.625rem;
  --fs-s2:2rem;
  --fs-s3:clamp(2rem,1.5rem + 1.4vw,2.75rem);
  --fs-s4:clamp(2.5rem,1.6rem + 3.2vw,4.5rem);
  --ease:cubic-bezier(.2,.65,.25,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
h1,h2,h3{font-weight:400}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-100px;z-index:100;background:var(--ink);color:#fff;padding:12px 16px;border-radius:6px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--pad));margin:0 auto;padding:0 var(--pad)}
.i{width:1em;height:1em;flex:none}

/* boutons, liens, petits libellés */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:0;border-radius:6px;font:600 1rem/1.2 var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--magenta);color:#fff}
.btn-primary:hover{background:var(--magenta-dark)}
.btn .i{transition:transform .3s var(--ease)}
.btn:hover .i{transform:translateX(4px)}
.go{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.go .i{color:var(--magenta);transition:transform .3s var(--ease)}
.go:hover{text-decoration:underline}
.go:hover .i{transform:translateX(4px)}
.overline{font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--grey)}
.overline a{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.overline a:hover{text-decoration:underline}
.accent{color:var(--magenta-dark)}
.statut{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:13px;background:var(--magenta);color:#fff;font:600 var(--fs-label)/1 var(--sans);letter-spacing:.02em;text-transform:none;white-space:nowrap}

/* en-tête */
.site-header{position:relative;z-index:40;background:var(--white);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;height:80px}
.brand{display:inline-flex;align-items:center;gap:10px;flex:none;color:var(--ink);text-decoration:none}
.brand-mark{width:38px;height:38px;flex:none}
.brand-mark svg{width:100%;height:100%}
.brand-word{font:600 1.25rem/1 var(--sans);letter-spacing:-.015em;padding-bottom:2px}
.menu ul{display:flex;gap:32px}
.menu a{display:block;padding:10px 0 8px;border-bottom:2px solid transparent;font:500 1rem/1.25 var(--sans);color:var(--ink);text-decoration:none;white-space:nowrap;transition:border-color .2s}
.menu a:hover{border-bottom-color:var(--rule-paper)}
.menu a[aria-current="page"]{border-bottom-color:var(--magenta)}
.menu-toggle{display:none}

/* accueil : le bandeau */
.hero{padding-top:40px}
.hero-stage{display:grid}
.slide{grid-area:1/1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.slide.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.slide-text{grid-column:1/span 5;display:flex;flex-direction:column;justify-content:center;padding:16px 24px 16px 0}
.slide-text .overline{color:var(--magenta-dark)}
.slide-title{margin-top:16px;font:400 var(--fs-s4)/.98 var(--serif);letter-spacing:-.01em}
.slide-title span{display:block}
.slide-sub{margin-top:16px;font-size:var(--fs-lead);line-height:1.5;color:var(--grey)}
.slide-date{display:flex;align-items:flex-start;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--rule);font:500 var(--fs-lead)/1.4 var(--sans)}
.slide-date .i{margin-top:.2em;color:var(--magenta)}
.slide-text .btn{align-self:flex-start;margin-top:28px}
.slide-photo{position:relative;grid-column:6/span 7;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:var(--paper)}
.slide-photo img{width:100%;height:100%;object-fit:cover}
.credit{position:absolute;right:12px;bottom:10px;max-width:calc(100% - 24px);font-size:.75rem;line-height:1.3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.slide.anime .slide-text>*{animation:monte .8s var(--ease) both;animation-delay:calc(var(--k,0) * 80ms)}
.hero.avant .slide-text>*{opacity:0}
.hero.pose .slide.on .slide-photo img{animation:pose 1.8s var(--ease) both}
@keyframes monte{from{opacity:0;transform:translateY(18px)}}
@keyframes pose{from{transform:scale(1.08)}}
.hero-nav{display:flex;align-items:flex-start;gap:24px;margin-top:32px;border-top:1px solid var(--rule)}
.hero-tabs{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--gap)}
.hero-tab{position:relative;display:block;width:100%;padding:14px 0 6px;border:0;background:none;text-align:left;font:500 .9375rem/1.3 var(--sans);color:var(--grey);cursor:pointer;transition:color .2s}
.hero-tab span{display:block}
.hero-tab::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:transparent;transition:background .3s}
.hero-tab:hover{color:var(--ink)}
.hero-tab:hover::before{background:var(--rule-paper)}
.hero-tab[aria-current="true"]{color:var(--ink)}
.hero-tab[aria-current="true"]::before{background:var(--magenta)}
.hero-fleches{display:flex;gap:8px;padding-top:12px}
.rond{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--rule-paper);border-radius:50%;background:var(--white);cursor:pointer;transition:border-color .2s,color .2s}
.rond:hover{border-color:var(--magenta);color:var(--magenta)}
.rond .i{width:18px;height:18px}

/* accueil : les trois portes */
.portes{margin-top:clamp(40px,5vw,64px)}
.portes-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--gap)}
.porte{border-top:1px solid var(--ink)}
.porte a{display:flex;align-items:baseline;justify-content:space-between;gap:16px;height:100%;padding:20px 0 28px;font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em;text-decoration:none}
.porte .i{width:.72em;height:.72em;color:var(--magenta);transition:transform .3s var(--ease)}
.porte a:hover span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.porte a:hover .i{transform:translateX(6px)}

/* accueil : la tournée, en large bande */
.tour{margin-top:clamp(48px,6vw,88px);padding:var(--sec) 0;background:var(--paper)}
.tour-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px;align-items:center}
.tour-text{grid-column:1/span 4}
.tour-carte{grid-column:5/span 8}
.sec-title{margin-top:14px;font:400 var(--fs-s3)/1.04 var(--serif);letter-spacing:-.01em}
.mini{margin-top:28px;border-top:1px solid var(--rule-paper)}
.mini li{border-bottom:1px solid var(--rule-paper)}
.mini a{position:relative;display:block;padding:13px 8px 13px 16px;text-decoration:none;transition:background .2s}
.mini a::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:2px;background:transparent;transition:background .2s}
.mini li.survol a,.mini a:hover{background:rgba(255,255,255,.7)}
.mini li.survol a::before,.mini a:hover::before,.mini a:focus-visible::before{background:var(--magenta)}
.mini-d{display:block;font:600 .75rem/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--magenta-dark)}
.mini-t{display:block;margin-top:3px;font:400 1.375rem/1.15 var(--serif)}
.mini-l{display:block;margin-top:2px;color:var(--grey)}
.tour-go{margin-top:24px}
.merci{padding:56px 0 var(--sec)}
.merci p{max-width:70em;font-size:.875rem;line-height:1.65;color:var(--grey)}

/* la carte des tournées */
.k-carte{position:relative;--terre:var(--paper);--voisin:#ebe7e1;--bord:#d3ccc2}
.k-carte.k-papier{--terre:#ffffff;--voisin:#e7e2db}
.k{width:100%;height:auto;aspect-ratio:800/780;overflow:hidden;-webkit-user-select:none;user-select:none}
.k-pays{fill:var(--terre);stroke:var(--bord);stroke-width:1.1;stroke-linejoin:round}
.k-voisin{fill:var(--voisin);stroke:var(--bord);stroke-width:.7;stroke-linejoin:round}
.k-passes{opacity:0;transition:opacity .9s ease .2s}
.k-on .k-passes{opacity:.9}
.k-passe{fill:#b8aea2}
.k-passe-pt{fill:#a59a8d}
.k-bras,.k-nom{transition:opacity .25s}
.k-bras-f{fill:var(--magenta);transition:fill .2s}
.k-pousse{fill:none;stroke:#fff;stroke-dasharray:1 1;stroke-dashoffset:1}
.k-on .k-pousse{stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.4,.1,.2,1) var(--d,0ms)}
.k-lieu{cursor:pointer;transition:opacity .25s}
.k-carte:not(.k-on) .k-lieu{opacity:0}
.k-on .k-lieu{animation:apparait .45s ease backwards;animation-delay:calc(var(--d,0ms) + 750ms)}
@keyframes apparait{from{opacity:0}}
.k-lieu:focus{outline:none}
.k-cible{fill:transparent}
.k-point{fill:#fff;stroke:var(--magenta);stroke-width:2;vector-effect:non-scaling-stroke;transition:fill .2s}
.k-maison .k-point{fill:var(--magenta);stroke:#fff}
.k-lieu:focus-visible .k-point{stroke:var(--ink);stroke-width:3}
.k-rouen{fill:var(--ink);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.k-rouen-nom{font:600 13px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--terre);stroke-width:4px;stroke-linejoin:round}
.k-noms{opacity:0;transition:opacity .6s ease 1.3s}
.k-on .k-noms{opacity:1}
.k-nom{font-family:var(--sans);font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--terre);stroke-linejoin:round;pointer-events:none}
.k-nom.k-cache{display:none}
.k-nom.k-actif{display:inline;font-weight:600;fill:var(--magenta-dark)}
.k-survol .k-bras:not(.k-actif){opacity:.2}
.k-survol .k-nom:not(.k-actif){opacity:.3}
.k-bras.k-actif .k-bras-f,.k-bras.k-choisi .k-bras-f{fill:var(--magenta-dark)}
.k-lieu.k-actif .k-point,.k-lieu.k-choisi .k-point{fill:var(--magenta)}
.k-on .k-off{opacity:.14}
.k-info{position:absolute;z-index:5;left:0;top:0;width:max-content;max-width:min(300px,86%);padding:12px 14px;border-radius:6px;background:#fff;box-shadow:0 10px 30px -10px rgba(17,17,17,.35),0 0 0 1px rgba(17,17,17,.07);font-size:.875rem;line-height:1.4;pointer-events:none;overflow-wrap:anywhere}
.k-info-nom{font-weight:600}
.k-info ul{margin-top:6px}
.k-info li{color:var(--grey)}
.k-info li+li{margin-top:3px}
.k-info b{font-weight:500;color:var(--ink)}

/* pages */
.page{padding-bottom:var(--sec)}
.page-head{background:var(--paper)}
.page-head .wrap{padding-top:56px;padding-bottom:52px}
.page-title{margin-top:14px;max-width:16em;font:400 var(--fs-s4)/.98 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.page-head .page-title:first-child{margin-top:0}
.page-body{padding-top:56px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 32px;margin-bottom:36px;padding-top:22px;border-top:1px solid var(--ink)}
.sec-head h2{font:400 var(--fs-s3)/1.04 var(--serif);letter-spacing:-.01em}
.sec-head h2 a{text-decoration:none}
.sec-head h2 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em}

/* spectacles */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--gap);row-gap:0;margin-bottom:-56px}
.card{position:relative;display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;padding-bottom:56px}
.card-photo{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--paper)}
.card-photo img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .card-photo img{transform:scale(1.04)}
.card-photo .statut{position:absolute;left:12px;top:12px}
.card-crea{margin-top:16px}
.card-title{margin-top:6px;font:400 var(--fs-s1)/1.12 var(--serif);letter-spacing:-.005em}
.card-title a{text-decoration:none}
.card-title a::after{content:"";position:absolute;inset:0;border-radius:6px}
.card:hover .card-title a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.card-title a:focus-visible{outline:none}
.card-title a:focus-visible::after{outline:2px solid var(--ink);outline-offset:6px}
.card-sub{margin-top:6px;color:var(--grey)}

/* agenda et saisons */
.agenda{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:32px;align-items:start}
.agenda-carte{grid-column:1/span 5;position:sticky;top:24px}
.agenda-liste{grid-column:7/span 6;min-width:0}
.filtres{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:32px}
.filtres-l{margin-right:6px}
.filtres-carte{margin:16px 0 0}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--rule-paper);border-radius:18px;background:var(--white);font:500 .875rem/1.2 var(--sans);text-align:left;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.chip .i{width:12px;height:12px}
.mois+.mois{margin-top:48px}
.mois-t{padding-top:14px;border-top:1px solid var(--ink);font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em}
.rows{margin-top:8px}
.row{display:grid;grid-template-columns:112px minmax(0,1fr);column-gap:20px;padding:18px 12px;border-bottom:1px solid var(--rule);transition:background .2s,box-shadow .2s}
.rows>.row:last-child{border-bottom:0}
.row.survol{background:var(--magenta-soft);box-shadow:inset 3px 0 0 var(--magenta)}
.dblock{display:flex;flex-direction:column;align-items:flex-start}
.dblock-d{font:400 2.5rem/.95 var(--serif);letter-spacing:-.01em}
.dblock-d.moyen{font-size:1.5rem;line-height:1.05}
.dblock-d.long{font-size:1.25rem;line-height:1.1}
.dblock-m{margin-top:6px;font:600 .75rem/1.25 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.row-main{min-width:0;overflow-wrap:anywhere}
.row-title{font:400 var(--fs-s1)/1.12 var(--serif);letter-spacing:-.005em}
.row-title a{text-decoration:none}
.row-title a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.row-lieu{display:flex;align-items:flex-start;gap:6px;margin-top:4px;font-weight:500}
.row-lieu .i{width:.95em;height:.95em;margin-top:.22em;color:var(--magenta)}
.row-details{margin-top:6px;color:var(--grey)}
.row-details li+li{margin-top:4px}
.row-details a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-paper)}
.row-details a:hover{text-decoration-color:currentColor}
.row-details .i{display:inline;width:.75em;height:.75em;margin-left:5px;vertical-align:-.05em}
.grp+.grp{margin-top:56px}
.grp-head{padding-top:14px;border-top:1px solid var(--ink)}
.grp-t{margin-top:6px;font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em}
.grp-head .overline+.grp-t{margin-top:6px}
.grp-head .grp-t:first-child{margin-top:0}
.grp-t a{text-decoration:none}
.grp-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.grp-sub{margin-top:6px;color:var(--grey)}
.srow{grid-template-columns:minmax(0,1fr)}
.srow-d{font-weight:600}
.etat{display:inline-flex;align-items:center;height:22px;margin-left:6px;padding:0 9px;border-radius:11px;background:var(--magenta-soft);color:var(--magenta-dark);font:600 .75rem/1 var(--sans);vertical-align:.1em;white-space:nowrap}
.saisons{margin-top:var(--sec);padding-top:22px;border-top:1px solid var(--ink)}
.saisons ul{display:flex;flex-wrap:wrap;gap:8px}
.saisons a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--rule-paper);border-radius:20px;font:500 .9375rem/1.2 var(--sans);text-decoration:none;transition:border-color .2s}
.saisons a:hover{border-color:var(--ink)}
.saisons a[aria-current]{background:var(--ink);border-color:var(--ink);color:#fff}

/* page spectacle */
.show-hero{position:relative;height:62vh;min-height:420px;max-height:760px;overflow:hidden;background:var(--ink)}
.show-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.show-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,10,11,.86) 0%,rgba(12,10,11,.5) 36%,rgba(12,10,11,0) 68%)}
.show-hero-text{position:absolute;z-index:1;left:0;right:0;bottom:0;margin:0 auto;padding-bottom:44px;color:#fff}
.back{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.back:hover{text-decoration:underline}
.show-crea{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-top:22px;font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.92)}
.show-title{margin-top:12px;font:400 var(--fs-s4)/.98 var(--serif);letter-spacing:-.01em}
.show-title span{display:block}
.show-sub{margin-top:14px;font-size:var(--fs-lead);color:rgba(255,255,255,.92)}
.show-cadre{margin-top:8px;font-size:.9375rem;color:rgba(255,255,255,.82)}
.show-credit{padding-top:10px;text-align:right;font-size:.75rem;color:var(--grey)}
.show-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:48px;padding-top:48px}
.show-main{grid-column:1/span 7;min-width:0}
.show-aside{grid-column:9/span 4;min-width:0}
.texte p{max-width:38em;font-size:var(--fs-lead);line-height:1.7}
.texte p+p{margin-top:1em}
.extraits{display:grid;gap:28px;margin-top:44px}
.extrait{padding-left:20px;border-left:3px solid var(--magenta)}
.extrait p{font:400 1.625rem/1.22 var(--serif)}
.extrait cite{display:block;margin-top:8px;font-style:normal;font-size:.875rem;color:var(--grey)}
.medias{margin-top:44px}
.medias h3{margin:24px 0 8px}
.medias ul{border-top:1px solid var(--rule)}
.medias a{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.medias a:hover .m-t{text-decoration:underline}
.ico{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--magenta);color:#fff}
.ico .i{width:16px;height:16px}
.m-t{display:block;font-weight:500}
.m-par{display:block;font-size:.875rem;color:var(--grey)}
.fiche{border-top:1px solid var(--rule)}
.fiche li{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:16px;padding:10px 0 11px;border-bottom:1px solid var(--rule)}
.fiche .lib{color:var(--grey)}
.fiche .seul{grid-column:1/-1}
.duree{margin-top:16px;font-weight:500}
.mentions{display:grid;gap:10px;margin-top:20px}
.mentions p{padding:12px 14px;border-radius:6px;background:var(--paper);font-size:.9375rem}
.mentions a{text-decoration-color:var(--magenta)}
.production{display:grid;gap:8px;margin-top:24px;font-size:.875rem;line-height:1.55;color:var(--grey)}
.production strong{font-weight:600;color:var(--ink)}
.tournee{padding-top:var(--sec)}
.tournee-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:32px;align-items:start}
.tournee-liste{grid-column:1/span 6;min-width:0}
.tournee-liste.rows{margin-top:0}
.tournee-carte{grid-column:8/span 5}
.tournee-seule{grid-column:3/span 8;padding-top:22px;border-top:1px solid var(--ink)}
.tournee-texte{font-size:var(--fs-lead)}
.autres-s{padding-top:var(--sec)}
.autres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px var(--gap)}
.autre{position:relative}
.autre-photo{aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:var(--paper)}
.autre-photo img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.autre:hover .autre-photo img{transform:scale(1.04)}
.autre-t{margin-top:12px;font:400 1.375rem/1.15 var(--serif)}
.autre-t a{text-decoration:none}
.autre-t a::after{content:"";position:absolute;inset:0;border-radius:6px}
.autre:hover .autre-t a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.autre-c{margin-top:2px;font-size:.875rem;color:var(--grey)}

/* la compagnie, les actions, les pages de texte */
.cie{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:48px;align-items:start}
.cie-texte{grid-column:1/span 7}
.cie-texte p{font-size:var(--fs-lead);line-height:1.7}
.cie-texte p+p{margin-top:1em}
.cie-texte p:first-child{font:400 1.75rem/1.32 var(--serif);letter-spacing:-.005em}
.cie-dates{grid-column:9/span 4;position:sticky;top:24px}
.cie-dates h2{padding-top:14px;border-top:1px solid var(--ink);font:400 var(--fs-s2)/1.1 var(--serif)}
.annees{margin-top:12px}
.annees li{display:grid;grid-template-columns:52px 64px minmax(0,1fr);align-items:center;column-gap:14px;padding:10px 0;border-bottom:1px solid var(--rule)}
.an-photo{width:52px;height:52px;border-radius:4px;overflow:hidden;background:var(--paper)}
.an-photo img{width:100%;height:100%;object-fit:cover}
.an{font:400 1.75rem/1 var(--serif);color:var(--magenta-dark)}
.annees a{font-weight:500;text-decoration:none}
.annees a:hover{text-decoration:underline}
.actions{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px;align-items:start}
.actions .prose{grid-column:1/span 6;grid-row:1}
.actions-photo{grid-column:8/span 5;grid-row:1;position:sticky;top:24px}
.actions-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px}
.credit-l{margin-top:8px;text-align:right;font-size:.75rem;color:var(--grey)}
.prose{overflow-wrap:anywhere}
.prose h2{margin:44px 0 14px;font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em}
.prose h3{margin:32px 0 10px;font:600 1.125rem/1.3 var(--sans)}
.prose>:first-child{margin-top:0}
.prose p{margin-top:14px;font-size:var(--fs-lead);line-height:1.7}
.prose ul{margin-top:14px;padding-left:1.2em;list-style:disc}
.prose li{margin-top:10px;font-size:var(--fs-lead);line-height:1.6}
.prose li::marker{color:var(--magenta)}
.prose a{text-decoration-color:var(--magenta)}
.prose-legal{max-width:52em}
.prose-legal p,.prose-legal li{font-size:1rem}

/* formulaires */
.contact{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:48px;align-items:start}
.contact .form{grid-column:1/span 7}
.coords{grid-column:9/span 4;padding-top:22px;border-top:1px solid var(--ink)}
.coords-nom{font:400 var(--fs-s1)/1.15 var(--serif)}
.coords p+p{margin-top:12px}
.form{display:grid;gap:20px}
.champ label{display:block;margin-bottom:6px;font-weight:500}
.champ input,.champ textarea{display:block;width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--rule-paper);border-radius:6px;background:var(--white);transition:border-color .2s}
.champ textarea{min-height:168px;resize:vertical}
.champ input:hover,.champ textarea:hover,.calcul input:hover{border-color:#b9b1a6}
.champ input:focus-visible,.champ textarea:focus-visible,.calcul input:focus-visible{outline:2px solid var(--magenta);outline-offset:1px;border-color:var(--magenta)}
.consent{display:flex;align-items:flex-start;gap:12px}
.consent input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--magenta)}
.consent a{text-decoration-color:var(--magenta)}
.calcul{display:flex;align-items:center;gap:12px}
.calcul label{font-weight:500}
.calcul input{width:64px;min-height:44px;padding:8px 10px;border:1px solid var(--rule-paper);border-radius:6px;text-align:center}
.form .btn{justify-self:start}
.pro{max-width:640px;padding:32px;border-radius:6px;background:var(--paper)}
.pro .lead{font-size:var(--fs-lead)}
.pro-ligne{display:flex;flex-wrap:wrap;gap:12px}
.pro-ligne input{flex:1 1 220px;width:auto}

/* pied de page */
.site-footer{padding:72px 0 32px;background:var(--ink);color:#fff}
.site-footer :focus-visible{outline-color:#fff}
.foot{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px}
.foot-id{grid-column:1/span 4}
.foot-brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.foot-addr{margin-top:20px;line-height:1.55;color:rgba(255,255,255,.78)}
.foot-addr strong{font-weight:600;color:#fff}
.foot-contact{grid-column:5/span 3}
.foot-ecrire{display:inline-flex;align-items:center;gap:12px;font:400 var(--fs-s2)/1.1 var(--serif);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;text-decoration-color:rgba(255,255,255,.4)}
.foot-ecrire:hover{text-decoration-color:#fff}
.foot-ecrire .i{width:.6em;height:.6em;color:#ec8fbd}
.foot-fb{margin-top:16px;color:rgba(255,255,255,.78)}
.foot-part{grid-column:9/span 4;font-size:.9375rem;line-height:1.6;color:rgba(255,255,255,.78)}
.foot-bas{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 32px;margin-top:56px;padding-top:22px;border-top:1px solid rgba(255,255,255,.18);font-size:.875rem;color:rgba(255,255,255,.72)}
.foot-legal{display:flex;flex-wrap:wrap;gap:4px 20px}
.foot-bas ul{display:flex;flex-wrap:wrap;gap:8px 24px}
.foot-bas a{text-decoration:none}
.foot-bas a:hover{text-decoration:underline}

/* l'ouverture, habillée */
.intro.maison .intro-indice,.intro.maison .intro-choc{color:var(--magenta)}
.intro.maison::after{content:"";position:absolute;inset:clamp(10px,1.6vw,22px);border:1px solid rgba(188,62,128,.28);border-radius:4px;pointer-events:none;transition:opacity .3s}
.intro.maison.part::after{opacity:0}

/* le menu replié, sous 1280 px */
@media (max-width:1279.98px){
  .bar{height:68px}
  .menu-toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-right:-4px;padding:0 4px 0 12px;border:0;background:none;font:600 1rem/1 var(--sans);cursor:pointer}
  .menu-toggle svg{width:22px;height:22px}
  .menu{display:none;position:absolute;top:100%;left:0;right:0;padding:8px var(--pad) 24px;background:var(--white);border-bottom:1px solid var(--rule);box-shadow:0 24px 32px -24px rgba(17,17,17,.25)}
  .site-header.ouvert .menu{display:block}
  .menu ul{display:block;max-width:var(--max);margin:0 auto}
  .menu li{border-bottom:1px solid var(--rule)}
  .menu a{padding:16px 0 16px 14px;border-bottom:0;border-left:3px solid transparent;font-size:1.25rem}
  .menu a:hover{border-left-color:var(--rule-paper)}
  .menu a[aria-current="page"]{border-left-color:var(--magenta);font-weight:600}
}
@media (max-width:1100px){
  .cards,.autres{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tour-text{grid-column:1/span 5}
  .tour-carte{grid-column:6/span 7}
}
@media (max-width:899px){
  .hero{padding-top:20px}
  .slide{display:flex;flex-direction:column}
  .slide-photo{order:-1;aspect-ratio:16/10}
  .slide-text{padding:24px 0 8px}
  .hero-tabs{grid-auto-columns:minmax(140px,1fr);overflow-x:auto;scrollbar-width:none}
  .hero-tabs::-webkit-scrollbar{display:none}
  .portes-grid{grid-template-columns:minmax(0,1fr)}
  .porte a{padding:18px 0 22px}
  .tour-text,.tour-carte,.agenda-carte,.agenda-liste,.show-main,.show-aside,.tournee-liste,.tournee-carte,.tournee-seule,.cie-texte,.cie-dates,.contact .form,.coords,.foot-id,.foot-contact,.foot-part{grid-column:1/-1}
  .agenda-carte,.cie-dates,.actions-photo{position:static}
  .actions-photo,.actions .prose{grid-column:1/-1;grid-row:auto}
}
@media (max-width:599px){
  .slide-photo{aspect-ratio:4/3}
  .slide-title{margin-top:12px}
  .page-head .wrap{padding-top:36px;padding-bottom:36px}
  .page-body{padding-top:36px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:76px minmax(0,1fr);column-gap:14px;padding:16px 8px}
  .srow{grid-template-columns:minmax(0,1fr)}
  .dblock-d{font-size:2rem}
  .dblock-d.moyen{font-size:1.25rem}
  .dblock-d.long{font-size:1.0625rem}
  .row-title{font-size:1.375rem}
  .fiche li{grid-template-columns:minmax(0,1fr)}
  .show-hero{height:56vh;min-height:380px}
  .show-hero-text{padding-bottom:28px}
  .pro{padding:20px}
  .annees li{grid-template-columns:44px 56px minmax(0,1fr);column-gap:12px}
  .an-photo{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="#/"><span class="brand-mark" data-logo="mark"></span><span class="brand-word"></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu"><span data-menu-label></span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path data-menu-icon d="M3 8h18M3 16h18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <nav class="menu" id="menu"><ul></ul></nav>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="site-footer" id="pied"></footer>
<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const S = D.site, SHOWS = D.shows || [], DATES = D.dates || [];
  const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
  const BY = Object.fromEntries(SHOWS.map(s => [s.slug, s]));
  const $ = (q, r = document) => r.querySelector(q);
  const $$ = (q, r = document) => [...r.querySelectorAll(q)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ico = d => `<svg class="i" viewBox="0 0 20 20" aria-hidden="true" focusable="false">${d}</svg>`;
  const ARROW = ico('<path d="M2.5 10h14M11 4.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6"/>');
  const BACK = ico('<path d="M17.5 10h-14M9 4.5L3.5 10 9 15.5" fill="none" stroke="currentColor" stroke-width="1.6"/>');
  const PREV = ico('<path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6"/>');
  const NEXT = ico('<path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6"/>');
  const EXT = ico('<path d="M7 4h9v9M16 4L5 15" fill="none" stroke="currentColor" stroke-width="1.6"/>');
  const PIN = ico('<path d="M10 18s-5.5-5.2-5.5-9.3a5.5 5.5 0 0 1 11 0C15.5 12.8 10 18 10 18z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="8.6" r="2" fill="currentColor"/>');
  const PLAY = ico('<path d="M7 4.5v11l9-5.5z" fill="currentColor"/>');
  const SON = ico('<path d="M3.5 7.5h3l4-3.5v12l-4-3.5h-3z" fill="currentColor"/><path d="M13.5 7a4 4 0 0 1 0 6M15.5 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>');
  const CROIX = ico('<path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.8"/>');
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const main = $('#main'), header = $('.site-header'), toggle = $('.menu-toggle');
  const onglet = id => (S.menu.find(m => m.id === id) || {}).texte || '';
  const photo = (slug, alt = '', focale = 50) => `<img src="${D.photos[slug]}" alt="${esc(alt)}" style="object-position:${Number(focale) || 50}% 50%">`;
  const lignes = arr => (arr || []).map(l => `<span>${esc(l)}</span>`).join(' ');
  const bloc = b => /^\s*<(h[1-6]|ul|ol|p|div|table|blockquote|figure)\b/i.test(b) ? b : `<p>${b}</p>`;
  const tete = (h1, over = '') => `<header class="page-head"><div class="wrap">${over ? `<p class="overline">${over}</p>` : ''}<h1 class="page-title" tabindex="-1">${h1}</h1></div></header>`;

  /* ---------- les lignes de date, découpées sans rien réécrire ---------- */
  const MOIS_RE = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}\s*$/i;
  function decoupe(t) {
    t = String(t || '');
    const m = t.match(MOIS_RE);
    if (!m) return [t, ''];
    const a = t.slice(0, m.index).trim(), b = t.slice(m.index).trim();
    if (a) return [a, b];
    const i = b.indexOf(' ');
    return [b.slice(0, i), b.slice(i + 1)];
  }
  function dblock(t) {
    const [a, b] = decoupe(t);
    const taille = a.length <= 4 ? '' : a.length <= 8 ? ' moyen' : ' long';
    return `<p class="dblock"><span class="dblock-d${taille}">${esc(a)}</span>${b ? ` <span class="dblock-m">${esc(b)}</span>` : ''}</p>`;
  }
  function details(list) {
    if (!list || !list.length) return '';
    return `<ul class="row-details">${list.map(x => `<li>${x.lien ? `<a href="${esc(x.lien)}" target="_blank" rel="noopener">${esc(x.texte)}${EXT}</a>` : esc(x.texte)}</li>`).join('')}</ul>`;
  }
  function rangee(d, sansTitre) {
    return `<li class="row" data-l="${d.l ?? ''}" data-slug="${esc(d.slug)}">${dblock(d.ligneDate)}
      <div class="row-main">${sansTitre
        ? `<p class="row-title">${esc(d.ligneLieu)}</p>`
        : `<h3 class="row-title"><a href="#/spectacle/${esc(d.slug)}">${esc(d.titre)}</a></h3><p class="row-lieu">${PIN}<span>${esc(d.ligneLieu)}</span></p>`}${details(d.details)}</div></li>`;
  }
  function rangeeSaison(d) {
    const t = String(d.ligne || ''), i = t.indexOf(' — ');
    const a = i < 0 ? t : t.slice(0, i), b = i < 0 ? '' : t.slice(i + 3);
    return `<li class="row srow"${d.l != null ? ` data-l="${d.l}"` : ''}><div class="row-main">
      <p class="srow-d">${esc(a)}${d.etat ? ` <span class="etat">${esc(d.etat)}</span>` : ''}</p>${b ? `<p class="row-lieu">${PIN}<span>${esc(b)}</span></p>` : ''}${details(d.details)}</div></li>`;
  }
  function parMois(list) {
    const out = [];
    list.forEach(d => {
      const k = String(d.iso).slice(0, 7);
      let g = out[out.length - 1];
      if (!g || g.k !== k) out.push(g = { k, label: `${MOIS[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`, list: [] });
      g.list.push(d);
    });
    return out;
  }

  /* ---------- la carte : des bras magenta qui poussent depuis Rouen ---------- */
  const VB = String(CARTE.viewBox).split(/\s+/).map(Number), RO = CARTE.rouen;
  const dist = x => Math.hypot(x.xy[0] - RO[0], x.xy[1] - RO[1]);
  const dans = x => x && x.xy && x.xy[0] >= VB[0] && x.xy[0] <= VB[0] + VB[2] && x.xy[1] >= VB[1] && x.xy[1] <= VB[1] + VB[3];
  const CARTES = {};
  let nK = 0;
  function carte({ lieux = [], passe = [], titre = '', info = null, choix = null, papier = false } = {}) {
    const id = 'k' + (++nK);
    lieux = lieux.filter(dans); passe = passe.filter(dans);
    CARTES[id] = { lieux, info, choix, survol: null };
    const loin = Math.max(1, ...lieux.map(dist));
    const delai = x => Math.round(dist(x) / loin * 700);
    const larg = x => Math.min(9, 3 + Math.sqrt(x.n || 1) * 1.6);
    const etiquette = x => CARTE.nom(x) + ((x.dates || []).length ? ' : ' + x.dates.map(d => d.ligneDate ? `${d.ligneDate}, ${d.titre}` : d.ligne).join(' ; ') : '');
    const bras = lieux.map((x, i) => {
      const d = CARTE.bras(x.xy, { w0: larg(x), w1: .8 });
      if (!d) return '';
      return `<g class="k-bras" data-l="${x.l}" style="--d:${delai(x)}ms"><mask id="${id}m${i}" maskUnits="userSpaceOnUse" x="${VB[0]}" y="${VB[1]}" width="${VB[2]}" height="${VB[3]}"><path class="k-pousse" d="${CARTE.trait(x.xy)}" pathLength="1" stroke-width="${(larg(x) + 8).toFixed(1)}"/></mask><path class="k-bras-f" d="${d}" mask="url(#${id}m${i})"/></g>`;
    }).join('');
    const passes = passe.map(x => {
      const d = CARTE.bras(x.xy, { w0: 1.8, w1: .4 });
      return `${d ? `<path class="k-passe" d="${d}"/>` : ''}<circle class="k-passe-pt" cx="${x.xy[0]}" cy="${x.xy[1]}" r="1.8"/>`;
    }).join('');
    const points = lieux.map(x => `<g class="carte-lieu k-lieu${dist(x) < 6 ? ' k-maison' : ''}" data-l="${x.l}" style="--d:${delai(x)}ms" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="k-cible" cx="${x.xy[0]}" cy="${x.xy[1]}" r="12"/><circle class="k-point" cx="${x.xy[0]}" cy="${x.xy[1]}" r="4"/></g>`).join('');
    return `<div class="k-carte${papier ? ' k-papier' : ''}" data-k="${id}">
      <svg class="k" viewBox="${VB.join(' ')}" role="${lieux.length ? 'group' : 'img'}" aria-label="${esc(titre)}">
        <path class="k-voisin" d="${CARTE.fond.belgique}"/><path class="k-voisin" d="${CARTE.fond.luxembourg}"/><path class="k-pays" d="${CARTE.fond.pays}"/>
        <g class="k-passes">${passes}</g><g class="k-brass">${bras}</g>
        <circle class="k-rouen" cx="${RO[0]}" cy="${RO[1]}" r="6"/><text class="k-rouen-nom" x="${RO[0] + 9}" y="${RO[1] - 9}">Rouen</text>
        <g class="k-lieux">${points}</g><g class="k-noms" aria-hidden="true"></g>
      </svg><div class="k-info" hidden></div></div>`;
  }
  // les noms des communes, placés sans se chevaucher, à taille constante à l'écran
  function placerNoms(w) {
    const cfg = CARTES[w.dataset.k], svg = $('svg', w), m = svg && svg.getScreenCTM && svg.getScreenCTM();
    if (!cfg || !m || !m.a) return;
    const u = 1 / m.a, fs = 12 * u, rp = 4.5 * u, e = rp + 3 * u, rfs = 13 * u;
    $$('.k-point', svg).forEach(c => c.setAttribute('r', rp.toFixed(2)));
    $$('.k-cible', svg).forEach(c => c.setAttribute('r', (13 * u).toFixed(2)));
    $$('.k-passe-pt', svg).forEach(c => c.setAttribute('r', (2 * u).toFixed(2)));
    $('.k-rouen', svg).setAttribute('r', (6 * u).toFixed(2));
    const rt = $('.k-rouen-nom', svg);

      </div>
      ${tour}
      <section class="wrap autres-s" aria-labelledby="h-autres"><div class="sec-head"><h2 id="h-autres"><a href="#/spectacles">${esc(onglet('spectacles'))}</a></h2></div>
        <ul class="autres">${autres.map(x => `<li class="autre"><div class="autre-photo">${photo(x.slug, '', x.focale)}</div><h3 class="autre-t"><a href="#/spectacle/${esc(x.slug)}">${esc(x.titre)}</a></h3><p class="autre-c">${esc(x.creation || '')}</p></li>`).join('')}</ul>
      </section>
    </article>`;
    return { titre: s.titre, onglet: 'spectacles', html, init() { if (dates.length) relier($('.tournee-liste', main), $('.tournee .k-carte', main)); } };
  }

  /* ---------- la compagnie, les actions culturelles, l'espace pro, le contact, les pages légales ---------- */
  function compagnie() {
    const C = S.compagnie;
    const html = `<div class="page">${tete(esc(C.titre))}
      <div class="wrap page-body cie">
        <div class="cie-texte">${C.paragraphes.map(p => `<p>${p}</p>`).join('')}</div>
        <aside class="cie-dates" aria-labelledby="h-dates"><h2 id="h-dates">${esc(C.datesTitre)}</h2>
          <ol class="annees">${C.dates.map(d => {
            const s = SHOWS.find(x => String(x.annee) === String(d.annee));
            return `<li><span class="an-photo">${s ? photo(s.slug, '', s.focale) : ''}</span><span class="an">${esc(d.annee)}</span>${s ? `<a href="#/spectacle/${esc(s.slug)}">${esc(d.titre)}</a>` : `<span>${esc(d.titre)}</span>`}</li>`;
          }).join('')}</ol></aside>
      </div></div>`;
    return { titre: onglet('compagnie'), onglet: 'compagnie', html };
  }
  function actions() {
    const A = S.actions;
    const html = `<div class="page">${tete(esc(A.titre))}
      <div class="wrap page-body actions">
        <div class="prose">${A.blocs.map(bloc).join('')}</div>
        <figure class="actions-photo">${photo('actions-culturelles', A.titre)}${A.credit ? `<figcaption class="credit-l">${esc(A.credit)}</figcaption>` : ''}</figure>
      </div></div>`;
    return { titre: onglet('actions'), onglet: 'actions', html };
  }
  function pro() {
    const P = S.pro;
    const html = `<div class="page">${tete(esc(P.titre), esc(P.titrePage))}
      <div class="wrap page-body"><form class="form pro" data-rien>
        <p class="lead">${esc(P.texte)}</p>
        <div class="champ"><label for="pro-mdp">${esc(P.champ)}</label><div class="pro-ligne"><input id="pro-mdp" type="password" autocomplete="current-password"><button class="btn btn-primary" type="submit">${esc(P.bouton)}</button></div></div>
      </form></div></div>`;
    return { titre: P.titrePage, onglet: 'pro', html };
  }
  function contact() {
    const K = S.contact, co = S.coordonnees, types = ['text', 'email', 'tel', 'text'], auto = ['name', 'email', 'tel', 'address-level2'];
    const c = K.consentement, j = c.indexOf('politique');
    const consent = j < 0 ? `<a href="#/politique-de-confidentialite">${esc(c)}</a>` : `${esc(c.slice(0, j))}<a href="#/politique-de-confidentialite">${esc(c.slice(j))}</a>`;
    const html = `<div class="page">${tete(esc(K.titre), esc(onglet('contact')))}
      <div class="wrap page-body contact">
        <form class="form" data-rien>
          ${K.champs.map((ch, i) => i === K.champs.length - 1
            ? `<div class="champ"><label for="c${i}">${esc(ch)}</label><textarea id="c${i}" rows="6"></textarea></div>`
            : `<div class="champ"><label for="c${i}">${esc(ch)}</label><input id="c${i}" type="${types[i] || 'text'}" autocomplete="${auto[i] || 'off'}"></div>`).join('')}
          <div class="consent"><input type="checkbox" id="c-ok"><label for="c-ok">${consent}</label></div>
          <div class="calcul"><label for="c-calc">${esc(K.calcul)}</label><input id="c-calc" inputmode="numeric" maxlength="2"></div>
          <button class="btn btn-primary" type="submit">${esc(K.bouton)}</button>
        </form>
        <aside class="coords"><p class="coords-nom">${esc(co.nom)}</p><p>${co.adresse.map(esc).join('<br>')}</p>
          <p>${S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : esc(S.facebook.texte)}</p></aside>
      </div></div>`;
    return { titre: onglet('contact'), onglet: 'contact', html };
  }
  function legal(cle) {
    const L = S.legal[cle];
    return { titre: L.titre, onglet: null, html: `<div class="page">${tete(esc(L.titre))}<div class="wrap page-body"><div class="prose prose-legal">${L.blocs.map(bloc).join('')}</div></div></div>` };
  }

  /* ---------- pied de page ---------- */
  function pied() {
    const co = S.coordonnees;
    $('#pied').innerHTML = `<div class="wrap foot">
        <div class="foot-id">
          <a class="foot-brand" href="#/" aria-label="${esc(S.nom)}"><span class="brand-mark" data-logo="mark"></span><span class="brand-word">${esc(S.titreSuffixe)}</span></a>
          <p class="foot-addr"><strong>${esc(co.nom)}</strong><br>${co.adresse.map(esc).join('<br>')}</p>
        </div>
        <div class="foot-contact">
          <a class="foot-ecrire" href="${esc(S.ecrire.href)}">${esc(S.ecrire.texte)}${ARROW}</a>
          <p class="foot-fb">${S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : esc(S.facebook.texte)}</p>
        </div>
        <div class="foot-part"><p>${S.partenaires}</p></div>
      </div>
      <div class="wrap foot-bas">
        <p class="foot-legal">${co.legal.map(x => `<span>${esc(x)}</span>`).join('')}</p>
        <ul>${S.liensLegaux.map(l => `<li><a href="${esc(l.href)}">${esc(l.texte)}</a></li>`).join('')}</ul>
      </div>`;
  }
  function logos(root) {
    $$('[data-logo]', root).forEach(el => {
      el.innerHTML = D.logo[el.dataset.logo] || '';
      const svg = $('svg', el);
      if (svg) { svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('focusable', 'false'); svg.removeAttribute('role'); svg.removeAttribute('aria-label'); }
    });
  }

  /* ---------- menu replié ---------- */
  function setMenu(o) {
    header.classList.toggle('ouvert', o);
    toggle.setAttribute('aria-expanded', String(o));
    $('[data-menu-icon]').setAttribute('d', o ? 'M5 5l14 14M19 5L5 19' : 'M3 8h18M3 16h18');
  }
  toggle.addEventListener('click', () => setMenu(!header.classList.contains('ouvert')));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && header.classList.contains('ouvert')) { setMenu(false); toggle.focus(); } });

  /* ---------- routeur : une vue par adresse ---------- */
  const VUES = {
    accueil, spectacles, agenda, compagnie, actions, pro, contact,
    saison: r => saison(r.saison), spectacle: r => spectacle(BY[r.slug]), legal: r => legal(r.cle),
  };
  function parse() {
    const [chemin, qs] = location.hash.replace(/^#\/?/, '').split('?');
    let p = [];
    try { p = decodeURIComponent(chemin || '').split('/').filter(Boolean); } catch (err) { p = []; }
    const [a, b] = p, q = new URLSearchParams(qs || ''), seul = p.length === 1;
    if (!a) return { vue: 'accueil' };
    if (a === 'agenda' && p.length <= 2 && (!b || b === D.saison)) {
      const l = q.get('l');
      return { vue: 'agenda', l: l != null && l !== '' && !isNaN(+l) ? +l : null };
    }
    if (a === 'agenda' && p.length === 2 && own(D.saisons, b)) return { vue: 'saison', saison: b };
    if (a === 'spectacle' && p.length === 2 && own(BY, b)) return { vue: 'spectacle', slug: b };
    const simples = { spectacles: 'spectacles', compagnie: 'compagnie', 'actions-culturelles': 'actions', 'espace-pro': 'pro', contact: 'contact' };
    if (seul && own(simples, a)) return { vue: simples[a] };
    if (seul && own(S.legal, a)) return { vue: 'legal', cle: a };
    return { vue: 'accueil', inconnu: true };
  }
  let courant = null;
  function route(force) {
    const r = parse();
    if (r.inconnu) history.replaceState(null, '', '#/');
    setMenu(false);
    const k = [r.vue, r.slug, r.saison, r.cle, r.l].join('|');
    if (k === courant && !force) return;
    courant = k;
    const v = VUES[r.vue](r);
    main.innerHTML = v.html;
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    $$('.menu a').forEach(a => { if (a.dataset.id === v.onglet) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    monter(main);
    if (v.init) v.init();
    window.scrollTo(0, 0);
    const h = $('h1', main);
    if (h) h.focus({ preventScroll: true });
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const href = a.getAttribute('href');
    if (href === '#main') { e.preventDefault(); main.focus({ preventScroll: true }); main.scrollIntoView(); return; }
    if (href.startsWith('#/') && (href === location.hash || (href === '#/' && !location.hash.replace(/^#\/?/, '')))) { e.preventDefault(); route(true); }
  });
  main.addEventListener('submit', e => { if (e.target.closest('[data-rien]')) e.preventDefault(); });
  let tempo = 0;
  addEventListener('resize', () => {
    clearTimeout(tempo);
    tempo = setTimeout(() => $$('.k-carte', main).forEach(w => { placerNoms(w); surligner(w, null); }), 150);
  });
  addEventListener('hashchange', () => route());
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  /* ---------- démarrage ---------- */
  $('.menu ul').innerHTML = S.menu.map(m => `<li><a href="${esc(m.href)}" data-id="${esc(m.id)}">${esc(m.texte)}</a></li>`).join('');
  $('[data-menu-label]').textContent = S.libelles.menu;
  $('.brand').setAttribute('aria-label', S.nom);
  $('.brand-word').textContent = S.titreSuffixe;
  pied();
  logos(document);
  const icone = document.createElement('link');
  icone.rel = 'icon';
  icone.href = 'data:image/svg+xml,' + encodeURIComponent(D.logo.mark || '');
  document.head.appendChild(icone);
  route(true);
  INTRO.ouvrir({ degrade: [[0, '#ffffff'], [.62, '#fbfaf8'], [1, '#eeeae4']], encre: '#ffffff', tache: true, classe: 'maison', apres: revele });
  if (INTRO.ouverte()) { const h = $('.hero', main); if (h) h.classList.add('avant'); }
})();
</script>
</body>
</html>
