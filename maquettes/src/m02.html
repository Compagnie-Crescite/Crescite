<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600&amp;family=Cormorant+Garamond:wght@600&amp;family=Bodoni+Moda:wght@700&amp;family=Anton&amp;family=Ubuntu:wght@700&amp;family=Grenze+Gotisch:wght@600&amp;family=IM+Fell+English&amp;family=IM+Fell+French+Canon&amp;display=swap">
<style>
:root{
  --white:#ffffff;
  --ink:#111111;
  --grey:#66625b;
  --paper:#f3f1ee;
  --paper-warm:#ebe7e1;
  --paper-hover:rgba(255,255,255,.78);
  /* la couleur de la saison (règle 22) : celle de la dernière création (D.site.couleurSaison), posée par le script
     (couleursSaison) ; d'ici là, l'encre. --saison est son aplat (le blanc s'y lit), --saison-ecrite son encre (un texte, un
     lien), --saison-trait son filet (l'indicateur du menu, la marque de la saison en cours, un point), --saison-douce sa teinte */
  --saison:#111111;
  --saison-ecrite:#111111;
  --saison-trait:#111111;
  --saison-douce:#efedea;
  --rule:#e2ddd6;
  --rule-paper:#d5cfc6;
  --rule-hover:#b9b1a6;
  --rule-frise:#c9c3ba;
  --credit-ink:#ffffff;
  --credit-shadow:0 1px 3px rgba(0,0,0,.82);
  /* le cartel d'un crédit posé sur une photo : un aplat d'encre translucide, qui tient le blanc lisible sur n'importe quel tirage */
  --credit-fond:rgba(17,17,17,.62);
  --foot-bg:#111111;
  --foot-ink:#ffffff;
  --foot-muted:rgba(255,255,255,.78);
  --foot-dim:rgba(255,255,255,.4);
  --foot-rule:rgba(255,255,255,.18);
  --foot-accent:#ffffff;
  --intro-frame:color-mix(in srgb,var(--saison-trait) 28%,transparent);
  --busy-shine:rgba(255,255,255,.45);
  --shadow-pop:0 12px 32px -10px rgba(17,17,17,.32),0 0 0 1px rgba(17,17,17,.08);
  --shadow-pop-u:0 12px 32px -10px rgba(0,0,0,.5);
  --shadow-card:0 14px 32px -18px rgba(17,17,17,.32);
  --shadow-menu:0 24px 32px -24px rgba(17,17,17,.25);
  --shadow-bar:0 -1px 0 var(--rule),0 -10px 24px -16px rgba(17,17,17,.28);
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --pad:clamp(16px,4vw,56px);
  --gap:24px;
  --max:1312px;
  --sec:clamp(64px,7vw,104px);
  --fs-label:.8125rem;
  --fs-lead:1.125rem;
  --fs-s1:1.625rem;
  --fs-s2:2rem;
  --fs-s3:clamp(2rem,1.5rem + 1.4vw,2.75rem);
  --fs-s4:clamp(2.5rem,1.6rem + 3.2vw,4.5rem);
  --ease:cubic-bezier(.2,.65,.25,1);
  --k-terre:var(--paper);--k-voisin:#ebe7e1;--k-voisin-papier:#e7e2db;--k-bord:#d3ccc2;--k-bras:var(--saison-trait);--k-actif:var(--saison-ecrite);--k-passe:#b8aea2;--k-encre:var(--ink);--k-point:var(--white);
  /* les tentacules (tentacules.js) : la pieuvre du logo guide ; nettes comme la maison : un trait lisse à la couleur de la
     saison, sans ventouses, un anneau à l'arrivée */
  --tt-encre:var(--saison-trait);--tt-accent:var(--saison-ecrite);--tt-neutre:var(--saison-trait);--tt-epaisseur:2.2;
  /* l'édition sur place (EDITION) dans le style de la maison */
  --ed-fond:#ffffff;--ed-encre:#111111;--ed-accent:var(--saison);--ed-sur-accent:var(--sur);--ed-police:var(--sans);--ed-rayon:8px;--ed-trait:#d9d4cc;
  /* --white est la surface (le fond des pages, des cartes, des champs) ; --sur, le texte posé sur un aplat de couleur */
  --sur:#ffffff;--voile:rgba(10,10,12,.92);--ombre-carte:0 22px 40px -28px rgba(17,17,17,.4);
}
/* ——— le jour et la nuit (règle 19, THEME) ———
   La maison, le soir : le hall d'un théâtre public quand la salle est pleine. Les surfaces passent au gris anthracite (la
   page, un rien plus sombre que ses panneaux), l'encre au blanc cassé, les filets au gris ; la couleur de la saison garde ses
   aplats, éclaircis vers sa teinte vive tant que le blanc s'y lit, et s'écrit et se trace dans sa teinte vive (couleursSaison) ;
   les pages de l'espace pro écrivent leur couleur vive. Les univers sombres restent eux-mêmes ; les deux univers clairs
   (Bérénice, Mon Royaume) passent dans leur propre nuit (univers(s).nuit, --un-* : leur texte, assombri, devient leur fond ;
   leur fond devient leur texte). AA : encre 16:1, gris 7,7:1, la saison écrite 4,6:1 au moins sur la page ; blanc sur son
   aplat 4,5:1 au moins. */
html[data-theme="jour"]{color-scheme:light}
html[data-theme="nuit"]{color-scheme:dark;
  --white:#131316;--ink:#f2f0ec;--grey:#aca79f;--paper:#1b1b1f;--paper-warm:#232228;--paper-hover:rgba(255,255,255,.06);
  --rule:#2d2c33;--rule-paper:#3b3a42;--rule-hover:#5a5862;--rule-frise:#4b4a52;
  --foot-bg:#0b0b0d;--foot-rule:rgba(255,255,255,.12);--intro-frame:color-mix(in srgb,var(--saison-trait) 30%,transparent);--busy-shine:rgba(255,255,255,.22);
  --shadow-pop:0 12px 32px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1);--shadow-pop-u:0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-card:0 14px 32px -18px rgba(0,0,0,.8);--shadow-menu:0 24px 32px -24px rgba(0,0,0,.8);--shadow-bar:0 -1px 0 var(--rule),0 -10px 24px -16px rgba(0,0,0,.8);
  --k-voisin:#202026;--k-voisin-papier:#1e1e23;--k-bord:#4a4952;--k-passe:#6c6772;
  --ed-fond:#1b1b1f;--ed-encre:#f2f0ec;--ed-accent:var(--saison-trait);--ed-sur-accent:#131316;--ed-trait:#3b3a42;
  --voile:rgba(0,0,0,.94);--ombre-carte:0 22px 40px -26px rgba(0,0,0,.85)}
/* un univers clair dans sa nuit : ses couleurs de nuit, posées en ligne à côté de celles du jour (uStyle), sans rien refaire */
html[data-theme="nuit"] .u.u-clair{--u-fond:var(--un-fond)!important;--u-fond2:var(--un-fond2)!important;--u-texte:var(--un-texte)!important;--u-texte2:var(--un-texte2)!important;
  --u-vif:var(--un-vif)!important;--u-titre:var(--un-titre)!important}
/* ce qui s'écrit dans la couleur d'une entrée prend sa couleur vive la nuit (la sombre ne se lirait pas sur l'anthracite) */
html[data-theme="nuit"] .page-head.entree .overline{color:var(--e-vif,var(--e))}
html[data-theme="nuit"] .ct-k{color:var(--e-vif,var(--saison-ecrite))}
html[data-theme="nuit"] .u .ct-k{color:var(--u-vif)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0}
h1,h2,h3,h4{font-weight:400}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-100px;z-index:100;background:var(--ink);color:var(--white);padding:12px 16px;border-radius:6px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--pad));margin:0 auto;padding:0 var(--pad)}
.i{width:1em;height:1em;flex:none}

/* boutons, liens, petits libellés */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:0;border-radius:6px;font:600 1rem/1.2 var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--saison);color:var(--sur)}
.btn-primary:hover{background:var(--ink);color:var(--white)}
.btn-u{background:var(--u-vif);color:var(--u-fond)}
.btn-u:hover{background:var(--u-texte)}
.btn-e{background:var(--e);color:var(--sur)}
.btn-e:hover{background:var(--ink)}
.btn .i{transition:transform .3s var(--ease)}
.btn:hover .i{transform:translateX(4px)}
.go{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;text-decoration:none}
.go .i{color:var(--saison-trait);transition:transform .3s var(--ease)}
.go:hover{text-decoration:underline}
.go:hover .i{transform:translateX(4px)}
.overline{font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.overline a{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none}
.overline a:hover{text-decoration:underline}
.accent{color:var(--saison-ecrite)}
.statut{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:13px;background:var(--saison);color:var(--sur);font:600 var(--fs-label)/1 var(--sans);letter-spacing:.02em;text-transform:none;white-space:nowrap}
.u .statut{background:var(--u-vif);color:var(--u-fond)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;background:var(--paper);color:var(--ink);font:600 .75rem/1 var(--sans);letter-spacing:.02em;white-space:nowrap;vertical-align:.1em}

/* en-tête : la tenue d'une scène nationale — filet d'attique, cartouche de marque, et le menu (règle 21) : quatre panneaux
   francs, côte à côte, comme les accès d'une maison ; celui de la vue porte l'aplat de la saison (règle 22). L'en-tête reste
   en haut de l'écran pendant la lecture : le menu et le jour / la nuit sont toujours à portée */
:root{--h-tete:76px}
html{scroll-padding-top:calc(var(--h-tete) + 16px)}
.site-header{position:sticky;top:0;z-index:40;background:var(--white);border-top:3px solid var(--ink);border-bottom:1px solid var(--rule-paper)}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;column-gap:24px}
/* le jour et la nuit : un bouton rond au bout de la ligne, comme les flèches du diaporama */
.theme-place{display:flex;align-items:center}
.theme-place:empty{display:none}
.theme{display:inline-grid;place-items:center;width:44px;height:44px;margin:0;padding:0;border:1px solid var(--rule-paper);border-radius:50%;background:var(--white);color:var(--ink);cursor:pointer;transition:border-color .15s,color .15s}
.theme:hover{border-color:var(--saison-trait);color:var(--saison-ecrite)}
.theme .theme-icone{width:20px;height:20px}
.brand{display:inline-flex;align-items:center;gap:13px;height:72px;padding-right:24px;border-right:1px solid var(--rule);color:var(--ink);text-decoration:none}
.brand-mark{width:42px;height:42px;flex:none;transition:transform .2s var(--ease)}
.brand:hover .brand-mark{transform:scale(1.04)}
.brand-mark svg{width:100%;height:100%}
.brand-mark .logo-tache,.foot-brand .logo-tache{fill:var(--saison)}   /* la tache du logo, à l'aplat de la saison (D peut changer en direct) */
.brand-word{font:600 1.3125rem/1 var(--sans);letter-spacing:-.02em;padding-bottom:2px}
.menu{position:relative;min-width:0}
.menu ul{position:relative;z-index:1;display:grid;grid-template-columns:repeat(var(--m-n,4),minmax(0,1fr));height:100%}
.menu li{min-width:0}
.menu a{display:flex;align-items:center;height:100%;min-height:44px;padding:2px 18px 0;font:400 1.4375rem/1.12 var(--serif);letter-spacing:-.005em;color:var(--ink);text-decoration:none;white-space:nowrap}
.menu li+li a{box-shadow:inset 1px 0 0 var(--rule)}
.menu a:not([aria-current="page"]):hover{background:color-mix(in srgb,var(--saison-trait) 7%,var(--white))}
.menu a:focus-visible{outline-offset:-4px}
.menu .long,.menu .court{min-width:0;overflow:hidden;text-overflow:ellipsis}
.menu .court{display:none}
/* une page qui dépend d'un élément du menu (un spectacle, une page de l'espace pro) : cet élément, en teinte, souligné */
.menu a[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--saison-trait)}
.menu li+li a[aria-current="true"]{box-shadow:inset 1px 0 0 var(--rule),inset 0 -3px 0 var(--saison-trait)}

/* accueil : le spectacle à l'affiche, dans son univers */
.hero{padding-top:32px}
.hero-stage{display:grid}
.slide{grid-area:1/1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-radius:8px;overflow:hidden;background:var(--u-fond);color:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 14%,transparent);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.slide.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.slide-text{position:relative;grid-column:1/span 5;display:flex;flex-direction:column;justify-content:center;padding:42px clamp(24px,3vw,48px);overflow:hidden}
.slide-text>*:not(.motif){position:relative}
.slide-text .overline{color:var(--u-texte2)}
.slide-title{margin-top:14px;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(2.5rem,1.6rem + 2.6vw,4.25rem);line-height:1;letter-spacing:-.005em;color:var(--u-titre)}
.slide-title span{display:block}
.slide-sub{margin-top:14px;font-size:var(--fs-lead);line-height:1.5;color:var(--u-texte2)}
.slide-date{display:flex;align-items:flex-start;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent);font:500 var(--fs-lead)/1.4 var(--sans)}
.slide-date .i{margin-top:.2em;color:var(--u-vif)}
.slide-text .btn{align-self:flex-start;margin-top:26px}
.slide-photo{position:relative;grid-column:6/span 7;aspect-ratio:3/2;background:var(--u-fond2)}
.slide-photo img{width:100%;height:100%;object-fit:cover}
.slide-motif{position:absolute;right:-70px;bottom:-60px;width:300px;height:300px;color:var(--u-titre);opacity:.16;pointer-events:none}
.credit{position:absolute;right:12px;bottom:10px;max-width:calc(100% - 24px);padding:2px 7px 3px;border-radius:3px;background:var(--credit-fond);font-size:.75rem;line-height:1.3;color:var(--credit-ink);text-shadow:none}
.slide.anime .slide-text>*:not(.motif){animation:monte .8s var(--ease) both;animation-delay:calc(var(--k,0) * 80ms)}
.hero.avant .slide-text>*:not(.motif){opacity:0}
.hero.pose .slide.on .slide-photo img{animation:pose 1.8s var(--ease) both}
@keyframes monte{from{opacity:0;transform:translateY(18px)}}
@keyframes pose{from{transform:scale(1.08)}}
.hero-nav{display:flex;align-items:flex-start;gap:24px;margin-top:24px;border-top:1px solid var(--rule-paper)}
.hero-tabs{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--gap)}
.hero-tab{position:relative;display:block;width:100%;min-height:44px;padding:12px 0 8px;border:0;background:none;text-align:left;font:500 .9375rem/1.3 var(--sans);color:var(--grey);cursor:pointer;transition:color .2s}
.hero-tab span{display:block}
.hero-tab::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:transparent;transition:background .3s}
.hero-tab:hover{color:var(--ink)}
.hero-tab:hover::before{background:var(--rule-paper)}
.hero-tab[aria-current="true"]{color:var(--ink);font-weight:600}
.hero-tab[aria-current="true"]::before{background:var(--saison-trait)}
.hero-fleches{display:flex;gap:8px;padding-top:10px}
.rond{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--rule-paper);border-radius:50%;background:var(--white);cursor:pointer;transition:border-color .2s,color .2s}
.rond:hover{border-color:var(--saison-trait);color:var(--saison-trait)}
.rond .i{width:18px;height:18px}

/* l'espace pro : ses deux pages (programmer, établissement scolaire), en grands panneaux à leur couleur, avec leur photo */
.choix{margin-top:clamp(48px,6vw,80px)}
.choix ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.choix a{position:relative;display:flex;flex-direction:column;height:100%;border-top:4px solid var(--e-vif,var(--e));border-radius:8px;overflow:hidden;background:var(--e);color:var(--sur);text-decoration:none}
.choix-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--paper)}
.choix-photo img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.choix-photo .credit{top:10px;bottom:auto}
.choix a:hover .choix-photo img{transform:scale(1.04)}
.choix-t{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-height:132px;padding:22px 24px 24px;font:400 clamp(1.75rem,1.2rem + 1.2vw,2.375rem)/1.06 var(--serif);letter-spacing:-.01em}
.choix-t .i{width:.62em;height:.62em;margin-bottom:.14em;transition:transform .3s var(--ease)}
.choix a:hover .choix-t .i{transform:translateX(6px)}
.choix a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.choix-t small{display:block;margin-top:8px;font:400 1rem/1.4 var(--sans);letter-spacing:0}
.ep-pages{margin:0 0 56px}
@media (min-width:900px){.ep-pages ul{grid-template-columns:repeat(2,minmax(0,1fr))}.ep-pages .choix-photo{aspect-ratio:2/1}}

/* la tournée, en large bande */
.tour{position:relative;overflow:hidden;margin-top:clamp(56px,7vw,96px);padding:var(--sec) 0;background:var(--paper);border-top:1px solid var(--rule-paper);border-bottom:1px solid var(--rule-paper)}
.tour-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px;align-items:center}
.tour-text{grid-column:1/span 4}
.tour-carte{grid-column:5/span 8}
.sec-title{margin-top:14px;font:400 var(--fs-s3)/1.04 var(--serif);letter-spacing:-.01em}
.sec-title:first-child{margin-top:0}
.mini{margin-top:28px;border-top:1px solid var(--rule-paper)}
.mini li{border-bottom:1px solid var(--rule-paper)}
.mini a{position:relative;display:block;padding:13px 8px 13px 16px;text-decoration:none;transition:background .2s}
.mini a::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:2px;background:transparent;transition:background .2s}
.mini li.survol a,.mini a:hover{background:var(--paper-hover)}
.mini li.survol a::before,.mini a:hover::before,.mini a:focus-visible::before{background:var(--saison-trait)}
.mini-d{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 .75rem/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--saison-ecrite)}
.mini-d .tag{letter-spacing:.02em;text-transform:none;background:var(--white)}
.mini-t{display:block;margin-top:3px;font:400 1.375rem/1.15 var(--serif)}
.mini-l{display:block;margin-top:2px;color:var(--grey)}
.tour-go{margin-top:24px}
.tour-texte{margin-top:20px;font-size:.9375rem;line-height:1.65;color:var(--grey)}
.tour-texte+.tour-go{margin-top:28px}
.merci{padding:56px 0 var(--sec)}
.merci p{max-width:70em;font-size:.875rem;line-height:1.65;color:var(--grey)}

/* la carte des tournées : des bras qui poussent depuis Rouen */
.k-carte{position:relative}
.k-carte.k-papier{--k-terre:var(--white);--k-voisin:var(--k-voisin-papier)}
.u .k-carte{--k-terre:var(--u-fond2);--k-voisin:color-mix(in srgb,var(--u-fond2) 88%,var(--u-texte));--k-bord:color-mix(in srgb,var(--u-texte) 26%,var(--u-fond2));--k-bras:var(--u-titre);--k-actif:var(--u-vif);--k-passe:color-mix(in srgb,var(--u-texte) 38%,var(--u-fond2));--k-encre:var(--u-texte);--k-point:var(--u-fond)}
.k{width:100%;height:auto;aspect-ratio:800/780;overflow:hidden;-webkit-user-select:none;user-select:none}
.k-pays{fill:var(--k-terre);stroke:var(--k-bord);stroke-width:1.1;stroke-linejoin:round}
.k-voisin{fill:var(--k-voisin);stroke:var(--k-bord);stroke-width:.7;stroke-linejoin:round}
.k-passes{opacity:0;transition:opacity .8s ease .1s}
.k-on .k-passes{opacity:.9}
.k-passe{fill:var(--k-passe)}
.k-passe-pt{fill:var(--k-passe)}
.k-bras,.k-nom{transition:opacity .25s}
.k-bras-f{fill:var(--k-bras);transition:fill .2s}
.k-carte:not(.k-on) .k-brass{visibility:hidden}
.k-lieu{cursor:pointer;transition:opacity .25s}
.k-carte:not(.k-on) .k-lieu{opacity:0}
.k-on .k-lieu{animation:apparait .3s ease backwards;animation-delay:calc(var(--d,0ms) + 380ms)}
@keyframes apparait{from{opacity:0}}
.k-lieu:focus{outline:none}
.k-cible{fill:transparent}
.k-point{fill:var(--k-point);stroke:var(--k-bras);stroke-width:2;vector-effect:non-scaling-stroke;transition:fill .2s}
.k-maison .k-point{fill:var(--k-bras);stroke:var(--k-point)}
.k-lieu:focus-visible .k-point{stroke:var(--k-encre);stroke-width:3}
.k-rouen{fill:var(--k-encre);stroke:var(--k-terre);stroke-width:2;vector-effect:non-scaling-stroke}
.k-rouen-nom{font:600 13px var(--sans);fill:var(--k-encre);paint-order:stroke;stroke:var(--k-terre);stroke-width:4px;stroke-linejoin:round}
.k-noms{opacity:0;transition:opacity .3s ease .6s}
.k-on .k-noms{opacity:1}
.k-nom{font-family:var(--sans);font-weight:500;fill:var(--k-encre);paint-order:stroke;stroke:var(--k-terre);stroke-linejoin:round;pointer-events:none}
.k-nom.k-cache{display:none}
.k-nom.k-actif{display:inline;font-weight:600;fill:var(--k-actif)}
.k-survol .k-bras:not(.k-actif){opacity:.2}
.k-survol .k-nom:not(.k-actif){opacity:.3}
.k-bras.k-actif .k-bras-f,.k-bras.k-choisi .k-bras-f{fill:var(--k-actif)}
.k-lieu.k-actif .k-point,.k-lieu.k-choisi .k-point{fill:var(--k-bras)}
.k-on .k-off{opacity:.14}
.k-fixe .k-lieu,.k-fixe .k-noms,.k-fixe .k-passes{transition:none!important;animation:none!important}
.k-nombreux :is(.k-bras,.k-lieu,.k-nom,.k-bras-f,.k-point){transition:none!important;animation:none!important}
.k-nombreux:not(.k-fixe) svg.k{opacity:0;transition:opacity .45s var(--ease)}
.k-nombreux.k-on svg.k{opacity:1}
.k-nombreux .k-lieu{opacity:1!important}
.k-encart{fill:none;stroke:var(--k-bord);stroke-dasharray:3 4}
.k-info{position:absolute;z-index:5;left:0;top:0;width:max-content;max-width:min(300px,86%);padding:12px 14px;border-radius:6px;background:var(--white);color:var(--ink);box-shadow:var(--shadow-pop);font-size:.875rem;line-height:1.4;pointer-events:none;overflow-wrap:anywhere}
.k-info-nom{font-weight:600}
.k-info ul{margin-top:6px}
.k-info li{color:var(--grey)}
.k-info li+li{margin-top:3px}
.k-info b{font-weight:500;color:var(--ink)}

/* pages : bandeaux d'architecture et filigrane de la pieuvre de la maison */
.page{padding-bottom:var(--sec)}
.page.sans-fin{padding-bottom:0}
.page-head{position:relative;overflow:hidden;background:var(--paper);border-bottom:1px solid var(--rule-paper)}
.page-head.entree{background:color-mix(in srgb,var(--e) 8%,var(--white));border-bottom-color:color-mix(in srgb,var(--e) 22%,var(--rule))}
.page-head.entree .overline{color:var(--e)}
.page-head .wrap{position:relative;z-index:1;padding-top:56px;padding-bottom:52px}
.head-pieuvre{position:absolute;z-index:0;right:max(var(--pad),calc((100% - var(--max)) / 2 + var(--pad) - 24px));bottom:-38px;width:clamp(210px,24vw,330px);height:clamp(210px,24vw,330px);color:var(--e,var(--saison-trait));opacity:.075;pointer-events:none}
.head-pieuvre svg{width:100%;height:100%}
.page-title{margin-top:14px;max-width:18em;font:400 var(--fs-s4)/.98 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.page-head .page-title:first-child{margin-top:0}
.page-body{padding-top:56px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 32px;margin-bottom:36px;padding-top:22px;border-top:1px solid var(--ink)}
.sec-head h2{font:400 var(--fs-s3)/1.04 var(--serif);letter-spacing:-.01em}
.sec-head h2 a{text-decoration:none}
.sec-head h2 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em}
.bloc{padding-top:var(--sec)}
.appel{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px;padding-top:var(--sec)}
.appel-texte{flex:1 1 420px;max-width:46em;font-size:.9375rem;line-height:1.65;color:var(--grey)}

/* les spectacles, chacun dans son univers */
.ucards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px var(--gap)}
.ucards.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.ucard{position:relative;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:var(--u-fond);color:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 14%,transparent)}
.ucard-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--u-fond2)}
.ucard-photo img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.ucard:hover .ucard-photo img{transform:scale(1.04)}
.ucard-photo .statut{position:absolute;left:12px;top:12px}
.ucard-corps{position:relative;flex:1;padding:18px 20px 22px;overflow:hidden}
.ucard-corps>*:not(.motif){position:relative}
.ucard-motif{position:absolute;right:-18px;top:-14px;width:110px;height:110px;color:var(--u-titre);opacity:.22;pointer-events:none}
.ucard-crea{font:600 .75rem/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--u-texte2)}
.ucard-lieu{font:500 .875rem/1.3 var(--sans);color:var(--u-vif)}
.ucard-lieu+.ucard-crea{margin-top:4px}
.ucard-t{margin-top:8px;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:1.625rem;line-height:1.08;color:var(--u-titre);overflow-wrap:break-word}
.ucard-t a{text-decoration:none}
.ucard-t a::after{content:"";position:absolute;inset:0;z-index:2}
.ucard:hover .ucard-t a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.ucard-t a:focus-visible{outline:none}
.ucard-t a:focus-visible::after{outline:3px solid var(--u-titre);outline-offset:-3px;border-radius:8px}
.ucard-sub{margin-top:8px;font-size:.9375rem;line-height:1.5;color:var(--u-texte2)}
.ucard-acc{margin-top:10px;font:400 1.125rem/1.35 var(--serif);color:var(--u-texte)}

/* l'agenda : la carte, la liste */
.agenda{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:32px;align-items:start}
.agenda-carte{grid-column:1/span 5;position:sticky;top:calc(var(--h-tete) + 24px)}
.agenda-liste{grid-column:7/span 6;min-width:0}
.filtres{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:32px}
.filtres-l{margin-right:6px}
.filtres-carte{margin:16px 0 0}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--rule-paper);border-radius:22px;background:var(--white);font:500 .875rem/1.2 var(--sans);text-align:left;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--e,var(--saison));border-color:var(--e,var(--saison));color:var(--sur)}
.chip .i{width:12px;height:12px}
.mois+.mois{margin-top:48px}
.mois-t{padding-top:14px;border-top:1px solid var(--ink);font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em}
.rows{margin-top:8px}
.row{display:grid;grid-template-columns:112px minmax(0,1fr);column-gap:20px;padding:18px 12px;border-bottom:1px solid var(--rule);transition:background .2s,box-shadow .2s}
.rows>.row:last-child{border-bottom:0}
.row.survol{background:color-mix(in srgb,var(--e,var(--saison-trait)) 8%,var(--white));box-shadow:inset 3px 0 0 var(--e,var(--saison-trait))}
.dblock{display:flex;flex-direction:column;align-items:flex-start}
.dblock-d{font:400 2.5rem/.95 var(--serif);letter-spacing:-.01em;font-variant-numeric:proportional-nums}
.dblock-d.moyen{font-size:1.5rem;line-height:1.05}
.dblock-d.long{font-size:1.25rem;line-height:1.1}
.dblock-m{margin-top:6px;font:600 .75rem/1.25 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.row-main{min-width:0;overflow-wrap:anywhere}
.row-title{font:400 var(--fs-s1)/1.12 var(--serif);letter-spacing:-.005em}
.row-title a{text-decoration:none}
.row-title a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.row-lieu{display:flex;align-items:flex-start;gap:6px;margin-top:4px;font-weight:500}
.row-lieu .i{width:.95em;height:.95em;margin-top:.22em;color:var(--e,var(--saison-trait))}
.row-lieu a .i{display:inline;width:.75em;height:.75em;margin:0 0 0 5px;vertical-align:-.05em;color:inherit}
.row-details{margin-top:6px;color:var(--grey)}
.row-details li+li{margin-top:4px}
.row-details a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-paper)}
.row-details a:hover{text-decoration-color:currentColor}
.row-details .i{display:inline;width:.75em;height:.75em;margin-left:5px;vertical-align:-.05em}
.row-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* une semaine de résidence (règle 23) : l'étiquette des dates scolaires, évidée, cernée d'un tireté (le trait en pointillé de la
   frise), avec le carré évidé de la frise en tête */
.tag.tag-res{gap:6px;background:none;color:var(--ink);box-shadow:none;border:1px dashed currentColor}
.tag.tag-res::before{content:"";flex:none;width:8px;height:8px;border-radius:1.5px;box-shadow:inset 0 0 0 1.5px currentColor}
.u .tag.tag-res{background:none;color:var(--u-texte)}
.grp+.grp{margin-top:56px}
.grp-head{padding-top:14px;border-top:1px solid var(--ink)}
.grp-t{margin-top:6px;font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em}
.grp-head .grp-t:first-child{margin-top:0}
.grp-t a{text-decoration:none}
.grp-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.grp-sub{margin-top:6px;color:var(--grey)}
.etat{display:inline-flex;align-items:center;height:22px;margin-left:6px;padding:0 9px;border-radius:11px;background:var(--saison-douce);color:var(--saison-ecrite);font:600 .75rem/1 var(--sans);vertical-align:.1em;white-space:nowrap}
/* l'agenda passé : une saison par bloc, fermée au départ ; sa petite carte la prévisualise */
.recherche{position:relative;flex:1 1 100%;max-width:340px;margin-bottom:6px}
.recherche .i{position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--grey)}
.recherche input{width:100%;min-height:44px;padding:0 14px 0 40px;border:1px solid var(--rule-paper);border-radius:22px;background:var(--white);font:400 1rem var(--sans);color:var(--ink)}
.recherche input:focus-visible{outline:2px solid var(--e,var(--saison-trait));outline-offset:2px}
.ag-index{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px 16px;margin-top:-12px;padding:0 0 14px;border-bottom:1px solid var(--rule)}
.ag-index>.fr{margin:0}
.idx-outils{display:flex;align-items:center;gap:10px;min-width:0}
.ag-index ul{flex:1 1 auto;min-width:0;display:flex;gap:6px;padding:3px 2px;overflow-x:auto;scrollbar-width:none}
.ag-index li{flex:none}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule-paper);background:var(--white);color:var(--ink);font:500 .9375rem/1.2 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.idx{min-height:44px;padding:0 16px;border-radius:22px}
.idx small{font-size:.8125rem;color:var(--grey)}
.idx:hover,.idx-tout:hover{border-color:var(--ink)}
.idx[aria-expanded="true"]{border-color:var(--e,var(--saison-trait));background:color-mix(in srgb,var(--e,var(--saison-trait)) 8%,var(--white))}
.idx-actif{background:var(--e,var(--saison));border-color:var(--e,var(--saison));color:var(--sur)}
.idx .i{width:.8em;height:.8em}
.idx-tout{flex:none;justify-content:center;width:44px;height:44px;padding:0;border-radius:50%}
.sai{border-bottom:1px solid var(--rule)}
.sai>summary{display:grid;grid-template-columns:clamp(84px,10vw,128px) minmax(0,1fr) auto;align-items:center;gap:6px clamp(16px,2.4vw,32px);padding:18px 8px;list-style:none;cursor:pointer;transition:background .2s}
.sai>summary::-webkit-details-marker{display:none}
.sai>summary:hover,.sai[open]>summary{background:var(--paper)}
.sai-mini{display:block;--k-bras:var(--e,var(--saison-trait))}
.sai-mini .k{display:block}
.sai-t{font:400 clamp(1.75rem,1.3rem + 1.4vw,2.5rem)/1.05 var(--serif);letter-spacing:-.01em}
.sai-sp{display:block;margin-top:6px;color:var(--grey);font-size:.9375rem;line-height:1.4}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai-n{display:inline-flex;align-items:center;gap:10px;font:400 clamp(1.5rem,1.2rem + 1vw,2.125rem)/1 var(--serif);font-variant-numeric:tabular-nums}
.sai-n .i{width:20px;height:20px;transition:transform .25s}
.sai[open] .sai-n .i{transform:rotate(180deg)}
.sai-corps{padding:10px 8px 44px}
.sai-corps:empty{display:none}
.sai-corps:not(:empty){display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:start}
.sai-corps .sai-liste{grid-column:1/span 7}
.sai-corps .sai-carte{grid-column:8/span 5;top:calc(var(--h-tete) + 24px)}
.sai-liste .mois:first-child .mois-t{margin-top:0}
.row.suite{display:block;color:var(--grey)}
.dblock-h{margin-top:2px;font:400 .8125rem/1.25 var(--sans);color:var(--grey)}
/* les saisons (règle 21) : la saison en cours sous le filet de la saison (règle 22), sa frise, sa légende juste dessous, ses
   deux listes à côté de sa carte ; « aujourd'hui » à l'aplat de la saison ; puis les saisons passées */
.s0-tete{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;padding-top:18px;border-top:4px solid var(--saison-trait)}
.s0-t{font:400 var(--fs-s3)/1.04 var(--serif);letter-spacing:-.01em}
.s0-t:focus{outline:none}
.s0-k{color:var(--saison-ecrite)}
.s0 .fr-saison{margin:26px 0 0}
.leg{display:flex;flex-wrap:wrap;gap:8px 22px;margin:12px 0 32px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.leg li{display:inline-flex;align-items:center;gap:8px;font:500 .875rem/1.3 var(--sans)}
.leg i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.leg b{font-weight:600;color:var(--grey);font-variant-numeric:tabular-nums}
.leg .est-vide{color:var(--grey)}
.leg .est-vide i{opacity:.35}
.leg :is(.leg-sc,.leg-res){font:600 .75rem/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.leg .leg-sc i{border-radius:2px;background:var(--grey)}
/* la résidence (règle 23) : le carré évidé de la frise */
.leg .leg-res i{border-radius:2px;background:none;box-shadow:inset 0 0 0 2px var(--grey)}
.fr.est-filtre .frise-point:not(.est-allume){opacity:.2}
.frise .frise-point.est-choisi>.frise-repere::before{scale:1.45;box-shadow:0 0 0 2px var(--fr-fond),0 0 0 3.5px var(--fr-encre)}
.s0-bloc+.s0-bloc{margin-top:72px}
.s0-h{display:flex;align-items:center;gap:12px;margin-bottom:10px;font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.s0-h::before{content:"";flex:none;width:22px;height:3px;border-radius:2px;background:var(--saison-trait)}
/* les saisons passées, au bas de la page, ne se dessinent qu'en approchant (pas toutes les dates : un panneau de réservation
   ouvert plus haut les déplace, et leurs lignes, restées où elles étaient, sauteraient sous les yeux quand un saut plus bas les
   fait reparaître) ; les dates jouées en retrait */
#v-agenda{content-visibility:auto;contain-intrinsic-size:auto 2400px}
.row.est-passe :is(.dblock-d,.row-title,.row-lieu){color:var(--grey)}
.row.est-passe .row-title a{color:inherit}
.auj{display:flex;align-items:center;gap:12px;margin:8px 0;padding:0 12px}
.auj::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--saison-trait)}
.auj span{padding:3px 9px 4px;border-radius:9px;background:var(--saison);color:var(--sur);font:700 .6875rem/1.2 var(--sans);letter-spacing:.11em;text-transform:uppercase}

/* Je souhaite programmer : le catalogue */
.cat{display:grid;gap:28px}
.fpro{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-radius:8px;overflow:hidden;background:var(--u-fond);color:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 14%,transparent)}
.fpro-photo{position:relative;grid-column:1/span 4;min-height:280px;background:var(--u-fond2)}
.fpro-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fpro-corps{position:relative;grid-column:5/span 8;padding:30px clamp(20px,3vw,40px) 32px;overflow:hidden}
.fpro-corps>*:not(.motif){position:relative}
.fpro-motif{position:absolute;right:-40px;top:-40px;width:220px;height:220px;color:var(--u-titre);opacity:.14;pointer-events:none}
.fpro-t{margin-top:8px;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(2rem,1.5rem + 1.4vw,2.75rem);line-height:1.02;color:var(--u-titre)}
.fpro-t a{text-decoration:none}
.fpro-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em}
.fpro-sous{margin-top:8px;color:var(--u-texte2)}
.fpro-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 32px;margin-top:22px}
.fpro-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:22px;padding-top:18px;border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.lien-u{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;color:var(--u-texte);text-decoration:none}
.lien-u .i{color:var(--u-vif);transition:transform .3s var(--ease)}
.lien-u:hover{text-decoration:underline}
.lien-u:hover .i{transform:translateX(4px)}
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.ct-prg{display:grid;gap:3px;max-width:540px;margin-top:28px;padding:18px 22px 16px;border:1px solid var(--rule-paper);border-left:3px solid var(--e,var(--saison-trait));border-radius:8px;background:var(--white)}
.ct-prg p{margin:0}
.ct-k{font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--e,var(--saison-ecrite))}
.ct-nom b{display:block;font:400 var(--fs-s1)/1.1 var(--serif)}
.ct-role{display:block;font-size:.9375rem;color:var(--grey)}
.ct-liens{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:10px!important}
.ct-tel{font-weight:600;text-decoration:none}
html:not(.ed-actif) .ct-tel.vide{display:none}
.ct-cond{margin-top:8px!important;font-size:.8125rem;color:var(--grey)}
.u .ct-prg{margin:0 0 28px;background:color-mix(in srgb,var(--u-texte) 6%,transparent);border-color:color-mix(in srgb,var(--u-texte) 20%,transparent);border-left-color:var(--u-vif)}
.u .ct-k{color:var(--u-vif)}
.u .ct-role,.u .ct-cond{color:var(--u-texte2)}
.dos-bt{position:relative;overflow:hidden}
.btn-line{background:transparent;color:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 45%,transparent)}
.btn-line:hover{box-shadow:inset 0 0 0 1px var(--u-texte)}
.dos-bt[aria-busy="true"]{cursor:progress;background-image:linear-gradient(110deg,transparent 30%,var(--busy-shine) 50%,transparent 70%);background-size:260% 100%;animation:dos-balaie 1.2s linear infinite}
@keyframes dos-balaie{from{background-position:130% 0}to{background-position:-130% 0}}
@media (prefers-reduced-motion:reduce){.dos-bt[aria-busy="true"]{animation:none;opacity:.75}}
.u-actions{margin:0 0 22px}
.docs{list-style:none;display:grid;gap:10px;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:10px}
.docs a{font-weight:600;color:var(--u-vif)}
.ft-blocs ~ .docs{margin-top:clamp(18px,2vw,28px)}
.fpro-docs{margin-top:16px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.fpro-docs .ct-k{margin:0 0 8px}
.pastille{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--u-vif);color:var(--u-fond)}
.pastille .i{width:14px;height:14px}
.repli{width:100%}
.repli summary{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer;list-style:none}
.repli summary::-webkit-details-marker{display:none}
.repli summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
.repli[open] summary::before{transform:rotate(45deg)}
.repli p{margin-top:12px;font-size:.9375rem;line-height:1.6;color:var(--u-texte2,var(--grey))}

/* les chiffres et la fiche */
.chiffres{display:grid;gap:10px}
.chiffres li{font-size:.9375rem;line-height:1.45}
.chiffres .gros{font:400 1.0625rem/1.3 var(--sans)}
.chiffres .gros strong{display:block;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:3rem;line-height:1;color:var(--u-titre);letter-spacing:-.01em}
.u-fiche{border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.u-fiche li{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:16px;padding:9px 0 10px;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent);font-size:.9375rem;line-height:1.45}
.u-fiche .lib{color:var(--u-texte2)}
.u-fiche .seul{grid-column:1/-1}
.u-fiche.compacte li{display:block;padding:6px 0 7px}
.u-fiche.compacte .lib{margin-right:.35em}
/* la distribution en portraits (D.personnes, show.equipe) : la photo, ou un monogramme et son petit filet ; ceux qui alternent vont par deux */
.cast{--g:16px;--pw:150px;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:26px var(--g);margin:0 0 30px;padding:0}
.cast>li{min-width:0}
.cast>.cast-paire{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g);padding:10px;border:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent);border-radius:8px}
.cast-pt{margin:0;min-width:0}
.cast-cadre{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;container-type:inline-size;border-radius:6px;background:color-mix(in srgb,var(--u-vif) 12%,var(--u-fond2))}
.cast-cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.cast-mono{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3cqw}
.cast-mono b{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:2.4rem;font-size:30cqw;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:var(--u-titre)}
.cast-mono::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--u-vif)}
.cast-pt figcaption{display:block}
.cast-cr{display:block;min-height:1.8em;padding-top:5px;font-size:.75rem;line-height:1.3;color:var(--u-texte2)}
.cast-nom{display:block;margin-top:9px;font:600 .9375rem/1.3 var(--sans);color:var(--u-texte);text-wrap:balance}
.cast-alt,.cast-role{display:block;margin-top:2px;font-size:.875rem;line-height:1.4;color:var(--u-texte2)}
.cast-role{font-weight:600;color:var(--u-vif)}

/* Je représente un établissement scolaire */
.ecole{max-width:42em;font:400 clamp(1.25rem,1rem + .6vw,1.5rem)/1.42 var(--serif);letter-spacing:-.005em}
.groupe{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:24px;margin-top:var(--sec);padding-top:22px;border-top:1px solid var(--ink)}
.groupe-t{grid-column:1/span 3;font:400 var(--fs-s2)/1.1 var(--serif)}
.groupe-liste{grid-column:4/span 9;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.groupe-seul .groupe-liste{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr))}
.ac{position:relative;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:var(--u-fond);color:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 14%,transparent)}
.ac-photo{aspect-ratio:16/9;overflow:hidden;background:var(--u-fond2)}
.ac-photo img{width:100%;height:100%;object-fit:cover}
.ac-corps{position:relative;flex:1;display:flex;flex-direction:column;padding:22px 24px 24px;overflow:hidden}
.ac-corps>*:not(.motif){position:relative}
.ac-motif{position:absolute;right:-24px;top:-20px;width:130px;height:130px;color:var(--u-titre);opacity:.18;pointer-events:none}
.ac-t{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:1.625rem;line-height:1.08;color:var(--u-titre)}
.ac-t a{text-decoration:none}
.ac-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em}
.ac-lib{margin-top:16px;font:600 .75rem/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--u-texte2)}
.ac-type{margin-top:4px;font:400 clamp(1.75rem,1.4rem + 1vw,2.25rem)/1.05 var(--serif);color:var(--u-texte);letter-spacing:-.01em}
.ac-type.vide{font-size:1.25rem;color:var(--u-texte2)}
.puces{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:14px}
.puce{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--u-texte) 30%,transparent);font:500 .8125rem/1.25 var(--sans)}
.puce b{font-weight:600;color:var(--u-texte2)}
.puce.forte{background:var(--u-vif);border-color:var(--u-vif);color:var(--u-fond)}
.ac-texte{margin-top:14px;font-size:.9375rem;line-height:1.6}
.formule{margin-top:14px;padding:12px 14px;border-left:3px solid var(--u-vif);background:var(--u-fond2);font-weight:600;font-size:.9375rem;line-height:1.5}
.dispositifs{margin-top:14px;font-size:.875rem;line-height:1.5;color:var(--u-texte2)}
.dispositifs li{margin-top:4px}
.dispositifs a{color:var(--u-texte)}
.ac-liens{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:auto;padding-top:20px}
.actions{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px;align-items:start}
.actions .prose{grid-column:1/span 6;grid-row:1}
.actions-photos{grid-column:8/span 5;grid-row:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.actions-photos .grande{grid-column:1/-1}
.actions-photos .grande img{aspect-ratio:4/3}
.credit-l{margin-top:8px;text-align:right;font-size:.75rem;color:var(--grey)}
.actions-photos .credit-l{grid-column:1/-1;margin-top:0}

/* la page d'un spectacle : son univers */
.show{background:var(--u-fond);color:var(--u-texte)}
.show a:focus-visible,.show summary:focus-visible,.show button:focus-visible{outline-color:var(--u-texte)}
/* la lueur de l'univers rayonne derrière la photo, pas derrière le texte (les contrastes restent ceux du fond) */
.u-tete{position:relative;overflow:hidden;background:radial-gradient(42% 78% at 74% 50%,var(--u-lueur),transparent 72%),var(--u-fond)}
.u-tete-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:28px;align-items:center;padding-top:44px;padding-bottom:44px}
.u-tete-texte{position:relative;grid-column:1/span 5;min-width:0;padding:8px 0}
.u-tete-texte>*:not(.motif){position:relative}
.u-motif{position:absolute;left:-90px;top:50%;width:min(520px,44vw);height:min(520px,44vw);transform:translateY(-50%);color:var(--u-titre);opacity:.13;pointer-events:none}
.u-signe{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--u-texte2)}
.u-signe .sep{opacity:.6}
.u-lieu{margin-top:22px;font:500 1rem/1.4 var(--sans);letter-spacing:.04em;color:var(--u-vif)}
.u-titre{margin-top:10px;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(2.75rem,1.7rem + 3.4vw,5.25rem);line-height:.98;letter-spacing:-.005em;color:var(--u-titre);overflow-wrap:break-word}
.u-titre span{display:block}
.u-titre.devoile{animation:devoile .42s var(--c2) both}
@keyframes devoile{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.u-sous{margin-top:14px;font-size:1.125rem;line-height:1.45}
.u-cadre{margin-top:8px;font-size:.9375rem;color:var(--u-texte2)}
.u-accroche{margin-top:20px;padding-top:18px;border-top:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent);font:400 clamp(1.25rem,1.05rem + .6vw,1.5rem)/1.35 var(--serif)}
.u-date{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-weight:600}
.u-date .i{margin-top:.25em;color:var(--u-vif)}
.u-photo{position:relative;grid-column:6/span 7;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:var(--u-fond2)}
.u-photo img{width:100%;height:100%;object-fit:cover}
.u-onglets{position:sticky;top:var(--h-tete);z-index:30;background:var(--u-fond2);border-top:1px solid color-mix(in srgb,var(--u-texte) 14%,transparent);border-bottom:1px solid color-mix(in srgb,var(--u-texte) 14%,transparent)}
.u-onglets ul{display:flex}
.u-onglets li{flex:1 1 auto;min-width:0}
.u-onglets a{display:flex;align-items:center;justify-content:center;gap:10px;height:100%;padding:17px 14px 16px;font:500 1rem/1.25 var(--sans);color:var(--u-texte2);text-align:center;text-decoration:none;box-shadow:inset 0 -4px 0 transparent;transition:color .2s,box-shadow .2s}
.u-onglets a::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--pt)}
.u-onglets a:hover{color:var(--u-texte);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--u-texte) 25%,transparent)}
.u-onglets a[aria-current="page"]{color:var(--u-texte);font-weight:600;box-shadow:inset 0 -4px 0 var(--u-vif)}
.u-onglets a:focus-visible{outline-offset:-4px}
.u-onglets .court{display:none}
.u-corps{padding:clamp(48px,6vw,80px) 0 0}
.u-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:56px;align-items:start}
.u-main{grid-column:1/span 7;min-width:0}
.u-aside{grid-column:9/span 4;min-width:0}
.u-sec+.u-sec{margin-top:56px}
.u-chap{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--u-texte) 26%,transparent);font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--u-texte2)}
.u-chap::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--u-vif)}
.u-h2{margin:-6px 0 24px;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(2rem,1.5rem + 1.4vw,2.75rem);line-height:1.04;color:var(--u-titre)}
.u-affirm{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(1.5rem,1.2rem + .9vw,2rem);line-height:1.2;color:var(--u-titre)}
.u-affirm+.u-affirm{margin-top:18px}
.u-texte{margin-top:28px}
.u-texte p{max-width:38em;font-size:var(--fs-lead);line-height:1.7}
.u-texte p+p{margin-top:1em}
.u-cits{display:grid;gap:30px}
.u-cit{padding:4px 0 4px 22px;border-left:3px solid var(--u-titre)}
.u-cit p{font:400 clamp(1.5rem,1.25rem + .8vw,1.875rem)/1.25 var(--serif)}
.u-cit p span{display:block}
.u-cit.prose p{font-style:italic}
.u-cit cite{display:block;margin-top:10px;font:600 .75rem/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;font-style:normal;color:var(--u-texte2)}
.u-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px var(--gap)}
.u-photos figure:first-child{grid-column:1/-1}
.u-photos img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;background:var(--u-fond2)}
.u-photos figure:first-child img{aspect-ratio:16/9}
.carton{margin-top:10px;padding:10px 14px;border-left:3px solid var(--u-vif);background:var(--u-fond2);font-size:.9375rem;line-height:1.5}
.u-credit{margin-top:14px;font-size:.8125rem;color:var(--u-texte2)}
.u-video{display:grid;gap:10px}
.u-video a{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent);border-radius:8px;text-decoration:none;transition:border-color .2s,background .2s}
.u-video a:hover{border-color:var(--u-vif);background:var(--u-fond2)}
.u-video .pastille{width:42px;height:42px}
.u-video .pastille .i{width:16px;height:16px}
.m-l{display:block;font:600 .75rem/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--u-texte2)}
.m-t{display:block;margin-top:2px;font-weight:500}
.m-par{display:block;font-size:.875rem;color:var(--u-texte2)}
.u-video h3{margin-top:12px;font:600 .75rem/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--u-texte2)}
.duree{margin-top:16px;font-weight:600}
.mentions{display:grid;gap:10px;margin-top:20px}
.mentions p{padding:12px 14px;border-radius:6px;background:var(--u-fond2);font-size:.9375rem;line-height:1.5}
.mentions a{text-decoration-color:var(--u-vif)}
.production{display:grid;gap:8px;margin-top:24px;font-size:.875rem;line-height:1.55;color:var(--u-texte2)}
.production strong{font-weight:600;color:var(--u-texte)}
.u-bande{margin-top:var(--sec);padding:clamp(48px,6vw,80px) 0;background:var(--u-fond2)}
.u-bande .u-chap{border-top-color:color-mix(in srgb,var(--u-texte) 22%,transparent)}
.u-bande .k-carte{--k-terre:var(--u-fond);--k-voisin:color-mix(in srgb,var(--u-fond) 86%,var(--u-texte))}
.tournee-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:32px;align-items:start}
.tournee-liste{grid-column:1/span 6;min-width:0}
.tournee-carte{grid-column:8/span 5}
.tournee-seule{grid-column:3/span 8}
.tournee-texte{font:400 1.5rem/1.35 var(--serif)}
.u .row{border-bottom-color:color-mix(in srgb,var(--u-texte) 16%,transparent)}
.u .row.survol{background:color-mix(in srgb,var(--u-titre) 14%,transparent);box-shadow:inset 3px 0 0 var(--u-titre)}
.u .dblock-m,.u .dblock-h,.u .row-details{color:var(--u-texte2)}
.u .row-details a{color:var(--u-texte);text-decoration-color:color-mix(in srgb,var(--u-texte) 40%,transparent)}
.u .row-lieu .i{color:var(--u-vif)}
.u .tag{background:var(--u-vif);color:var(--u-fond)}
.u-appel{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding-top:var(--sec)}
.u-appel p{flex:1 1 360px;max-width:40em;font-size:.9375rem;line-height:1.6;color:var(--u-texte2)}
.u-ac-type{margin-top:-4px;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(2.25rem,1.6rem + 2vw,3.5rem);line-height:1.02;color:var(--u-titre)}
.u-ac-type.vide{font:400 1.75rem/1.2 var(--serif);color:var(--u-texte2)}
.u-ac .puces{margin-top:18px}
.u-ac .ac-texte p{font-size:var(--fs-lead);line-height:1.7}
.u-ac .ac-texte p+p{margin-top:1em}
.u-dates .rows{margin-top:0}
.u-dates .row{grid-template-columns:96px minmax(0,1fr);padding:14px 4px}
.u-dates .dblock-d{font-size:2rem}
.u-dates .dblock-d.moyen{font-size:1.25rem}
.u-dates .dblock-d.long{font-size:1.0625rem}

/* la page unique d'un spectacle qui n'est plus en tournée (règle 21) : un filet à la place des onglets ; son bilan, en bande :
   le nombre de ses représentations en grand, trois chiffres comptés, la frise, ses dates par saison à côté de sa carte */
.u-fin{border-top:1px solid color-mix(in srgb,var(--u-texte) 14%,transparent)}
.u-bilan .u-chap{margin-bottom:12px}
.bil-rep{margin:0 0 28px}
.bil-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 40px;border-top:1px solid color-mix(in srgb,var(--u-texte) 30%,transparent);border-bottom:1px solid color-mix(in srgb,var(--u-texte) 30%,transparent)}
.bil-n li{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;padding:20px 22px 22px}
.bil-n li+li{border-left:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.bil-n strong{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(3rem,2.2rem + 2.4vw,4.5rem);line-height:.95;color:var(--u-titre);font-variant-numeric:tabular-nums}
.bil-n span{font:600 var(--fs-label)/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--u-texte2)}
.bil-s+.bil-s{margin-top:40px}
.bil-t{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--u-texte) 40%,transparent);font:400 var(--fs-s2)/1.1 var(--serif)}
.bil-t a{text-decoration:none}
.bil-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.16em}
.bil-k{font:500 1rem/1 var(--sans);color:var(--u-texte2);font-variant-numeric:tabular-nums}
.bil-l .rows{margin-top:4px}
.bil-carte{position:sticky;top:calc(var(--h-tete) + 24px)}
.bil-ac{margin-top:var(--sec)}

/* le dossier scolaire */
.dossier{margin-top:var(--sec)}
.d-couv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px 40px;padding:clamp(28px,4vw,48px);border-radius:8px;background:var(--u-vif);color:var(--u-fond)}
.d-couv-t{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(2.5rem,1.6rem + 3vw,4.5rem);line-height:.95;letter-spacing:.01em}
.d-couv-a{margin-top:8px;font-size:1.25rem}
.d-couv ul{display:grid;gap:6px;font:700 .8125rem/1.3 var(--sans);letter-spacing:.12em;text-align:right}
.d-sec{margin-top:clamp(48px,6vw,72px)}
.d-t{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(1.75rem,1.4rem + 1vw,2.25rem);line-height:1.1;color:var(--u-titre)}
.d-encadres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:24px}
.d-encadre{padding:22px 22px 24px;border-top:5px solid var(--u-titre);background:var(--u-fond2)}
.d-encadre h4{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:1.25rem;line-height:1.25;color:var(--u-texte)}
.d-encadre p{margin-top:12px;font-size:.9375rem;line-height:1.65}
.table-wrap{margin-top:24px;overflow-x:auto;border-radius:8px}
.u-table{width:100%;min-width:640px;border-collapse:collapse;font-size:.9375rem;line-height:1.5}
.u-table caption{padding:0 0 14px;text-align:left;font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:clamp(1.75rem,1.4rem + 1vw,2.25rem);line-height:1.1;color:var(--u-titre)}
.u-table th,.u-table td{padding:12px 14px;border:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent);text-align:left;vertical-align:top}
.u-table td{background:var(--u-fond2)}
.u-table .t-niveau{width:84px;background:var(--u-vif);color:var(--u-fond);font:700 1.25rem/1.2 var(--sans);text-align:center;vertical-align:middle}
.u-table .t-matiere{width:130px;font-weight:700;background:var(--u-fond2)}
.d-consignes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:18px}
.d-consignes>*{grid-column:1/span 8}
.d-note{display:inline-block;justify-self:start;padding:6px 12px;background:var(--u-vif);color:var(--u-fond);font:700 .8125rem/1.3 var(--sans);letter-spacing:.12em}
.d-consignes p{font-size:var(--fs-lead);line-height:1.65}
.d-demandes{display:grid;gap:8px}
.d-demandes li{padding:12px 16px;border-left:4px solid var(--u-vif);background:var(--u-fond2);font:700 .9375rem/1.4 var(--sans);letter-spacing:.03em}
.d-axes{display:grid;gap:8px;padding-left:1.2em;list-style:disc}
.d-axes li{font-size:var(--fs-lead);line-height:1.6}
.d-axes li::marker{color:var(--u-vif)}
.d-consignes .d-encadre-p{padding:16px 18px;border:2px solid var(--u-vif);border-radius:6px}
.d-ateliers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin-top:24px}
.d-atelier{padding:24px 24px 26px;border-radius:8px;background:var(--u-fond2)}
.d-atelier h4{font-family:var(--u-police,var(--serif)),var(--serif);font-weight:var(--u-graisse,400);font-size:1.375rem;line-height:1.2;color:var(--u-titre)}
.d-atelier h4 strong{font-weight:inherit}
.d-atelier p{margin-top:12px;font-size:.9375rem;line-height:1.6}
.d-etapes{display:grid;gap:12px;margin-top:16px}
.d-etapes li{padding-left:14px;border-left:3px solid var(--u-vif)}
.d-etapes .d-etape-t{margin-top:0;font-weight:500}
.d-etapes p+p{margin-top:6px}
.d-points{display:grid;gap:8px;margin-top:14px;padding-left:1.1em;list-style:disc;font-size:.9375rem;line-height:1.55}
.d-points li::marker{color:var(--u-vif)}
.d-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.d-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.d-plus{display:grid;gap:10px;margin-top:24px}
.d-det{border-top:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent)}
.d-det:last-child{border-bottom:1px solid color-mix(in srgb,var(--u-texte) 22%,transparent)}
.d-det summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;font:400 1.375rem/1.25 var(--serif);cursor:pointer;list-style:none}
.d-det summary::-webkit-details-marker{display:none}
.d-det summary::after{content:"";flex:none;width:10px;height:10px;border-right:2px solid var(--u-vif);border-bottom:2px solid var(--u-vif);transform:rotate(45deg);transition:transform .2s}
.d-det[open] summary::after{transform:rotate(-135deg)}
.d-det p{max-width:44em;margin-bottom:14px;font-size:var(--fs-lead);line-height:1.65}
.d-det .d-chapeau{font-weight:600}
.ft-blocs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin-top:20px}
.ft-bloc{padding:18px 20px;border-radius:6px;background:var(--u-fond2)}
.ft-bloc h4{margin-bottom:8px;font:700 .75rem/1.3 var(--sans);letter-spacing:.1em;color:var(--u-texte2)}
.ft-bloc li{padding:4px 0;font-size:.9375rem;line-height:1.5}
.ft-bloc li+li{border-top:1px solid color-mix(in srgb,var(--u-texte) 12%,transparent)}
.ft-alerte{margin-top:var(--gap);padding:16px 18px;border-left:4px solid var(--u-vif);background:var(--u-fond2);font-size:1rem;line-height:1.55}
.ft-photo{margin-top:var(--gap)}
.ft-photo img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}

/* d'autres spectacles */
.autres-s{padding-top:var(--sec);padding-bottom:var(--sec)}
.autres-s .sec-head{border-top-color:color-mix(in srgb,var(--u-texte) 40%,transparent)}
.autres-s .sec-head h2{color:var(--u-texte)}

/* la compagnie */
.cie{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:48px;align-items:start}
.cie-texte{grid-column:1/span 7}
.cie-texte p{font-size:var(--fs-lead);line-height:1.7}
.cie-texte p+p{margin-top:1em}
.cie-texte p:first-child{font:400 1.75rem/1.32 var(--serif);letter-spacing:-.005em}
.cie-embleme{grid-column:9/span 4;position:sticky;top:calc(var(--h-tete) + 24px);display:grid;place-items:center;aspect-ratio:4/3;padding:32px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule-paper);background:var(--paper);color:var(--saison-trait)}
.cie-pieuvre{width:min(220px,78%);aspect-ratio:1;display:block}
.cie-pieuvre svg{width:100%;height:100%}
html.ed-actif .cie-embleme{display:none}
.cie-dates{grid-column:9/span 4;position:sticky;top:calc(var(--h-tete) + 24px)}
.cie-dates h2{padding-top:14px;border-top:1px solid var(--ink);font:400 var(--fs-s2)/1.1 var(--serif)}
.annees{margin-top:12px}
.annees li{display:grid;grid-template-columns:52px 64px minmax(0,1fr);align-items:center;column-gap:14px;padding:10px 0;border-bottom:1px solid var(--rule)}
.an-photo{width:52px;height:52px;border-radius:4px;overflow:hidden;background:var(--paper)}
.an-photo img{width:100%;height:100%;object-fit:cover}
.an{font:400 1.75rem/1 var(--serif);color:var(--saison-ecrite)}
.annees a{font-weight:500;text-decoration:none}
.annees a:hover{text-decoration:underline}
.portrait{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:24px;margin-top:var(--sec);padding-top:22px;border-top:1px solid var(--ink)}
.portrait-t{grid-column:1/span 4}
.portrait-t h2{font:400 var(--fs-s3)/1.04 var(--serif);letter-spacing:-.01em}
.portrait-t p{margin-top:14px;font-size:var(--fs-lead);color:var(--grey)}
.portrait-texte{grid-column:6/span 7}
.portrait-texte p{font-size:var(--fs-lead);line-height:1.7}
.portrait-texte p+p{margin-top:1em}
.partenaires{margin-top:var(--sec);padding:28px 32px;border:1px solid var(--rule-paper);border-radius:8px;background:var(--paper);font-size:1rem;line-height:1.65}
.prose{overflow-wrap:anywhere}
.prose h2{margin:44px 0 14px;font:400 var(--fs-s2)/1.1 var(--serif);letter-spacing:-.005em}
.prose h3{margin:32px 0 10px;font:600 1.125rem/1.3 var(--sans)}
.prose>:first-child,.prose>div:first-child>:first-child{margin-top:0}
.prose p{margin-top:14px;font-size:var(--fs-lead);line-height:1.7}
.prose ul{margin-top:14px;padding-left:1.2em;list-style:disc}
.prose li{margin-top:10px;font-size:var(--fs-lead);line-height:1.6}
.prose li::marker{color:var(--e,var(--saison-trait))}
.prose a{text-decoration-color:var(--saison-trait)}
.prose-legal{max-width:52em}
.prose-legal p,.prose-legal li{font-size:1rem}

/* formulaire de contact */
.contact{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:48px;align-items:start}
.contact .form{grid-column:1/span 7}
.coords{grid-column:9/span 4;padding-top:22px;border-top:1px solid var(--ink)}
.coords-nom{font:400 var(--fs-s1)/1.15 var(--serif)}
.coords p+p{margin-top:12px}
.form{display:grid;gap:20px}
.champ label{display:block;margin-bottom:6px;font-weight:500}
.champ input,.champ textarea{display:block;width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--rule-paper);border-radius:6px;background:var(--white);transition:border-color .2s}
.champ textarea{min-height:168px;resize:vertical}
.champ input:hover,.champ textarea:hover,.calcul input:hover{border-color:var(--rule-hover)}
.champ input:focus-visible,.champ textarea:focus-visible,.calcul input:focus-visible{outline:2px solid var(--saison-trait);outline-offset:1px;border-color:var(--saison-trait)}
.consent{display:flex;align-items:flex-start;gap:12px}
.consent input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--saison)}
.consent a{text-decoration-color:var(--saison-trait)}
.calcul{display:flex;align-items:center;gap:12px}
.calcul label{font-weight:500}
.calcul input{width:64px;min-height:44px;padding:8px 10px;border:1px solid var(--rule-paper);border-radius:6px;text-align:center}
.form .btn{justify-self:start}

/* les motifs des univers */
.motif{display:block;overflow:visible}
.motif *{vector-effect:non-scaling-stroke}
.motif text{font:600 15px var(--sans);fill:currentColor;stroke:none}

/* pied de page */
.site-footer{position:relative;overflow:hidden;padding:72px 0 32px;background:var(--foot-bg);color:var(--foot-ink);border-top:3px solid var(--saison-trait)}
.site-footer :focus-visible{outline-color:var(--foot-ink)}
.foot-pieuvre{position:absolute;right:max(var(--pad),calc((100% - var(--max)) / 2 + var(--pad) - 40px));bottom:-56px;width:clamp(260px,28vw,400px);height:clamp(260px,28vw,400px);color:var(--foot-ink);opacity:.045;pointer-events:none}
.foot-pieuvre svg{width:100%;height:100%}
.foot{position:relative;z-index:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px}
.foot-id{grid-column:1/span 4}
.foot-brand{display:inline-flex;align-items:center;gap:12px;color:var(--foot-ink);text-decoration:none}
.foot-addr{margin-top:20px;line-height:1.55;color:var(--foot-muted)}
.foot-addr strong{font-weight:600;color:var(--foot-ink)}
.foot-contact{grid-column:1/span 4;grid-row:2}
.foot-menu{grid-column:5/span 3;grid-row:1/span 2}
.foot-menu li+li{margin-top:2px}
.foot-menu a{display:inline-flex;align-items:center;min-height:40px;font:400 1.375rem/1.15 var(--serif);color:var(--foot-ink);text-decoration:none}
.foot-menu a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
.foot-ecrire{display:inline-flex;align-items:center;gap:12px;font:400 var(--fs-s2)/1.1 var(--serif);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;text-decoration-color:var(--foot-dim)}
.foot-ecrire:hover{text-decoration-color:var(--foot-ink)}
.foot-ecrire .i{width:.6em;height:.6em;color:var(--foot-accent)}
.foot-fb{margin-top:16px;color:var(--foot-muted)}
.foot-part{grid-column:9/span 4;grid-row:1/span 2;font-size:.9375rem;line-height:1.6;color:var(--foot-muted)}
.foot-bas{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 32px;margin-top:56px;padding-top:22px;border-top:1px solid var(--foot-rule);font-size:.875rem;color:var(--foot-muted)}
.foot-legal{display:flex;flex-wrap:wrap;gap:4px 20px}
.foot-bas ul{display:flex;flex-wrap:wrap;gap:8px 24px}
.foot-bas a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}
.foot-bas a:hover{text-decoration:underline}

/* l'édition sur place : le lien du pied de page, la barre et les panneaux de l'outil commun, à la manière de la maison */
.foot-modifier{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--foot-dim);text-underline-offset:.22em}
.foot-modifier:hover{text-decoration-color:var(--foot-ink)}
.foot-modifier .i{width:1em;height:1em}
html .ed-barre{border-radius:8px}
html .ed-bt{border-radius:6px}
.ed-panneau .ed-tete h2{font:400 1.5rem/1.1 var(--serif);letter-spacing:-.005em}
.ed-ajout{margin:0 0 16px}
.ed-actif .ucard-t a::after{display:none}
.u-ac-type:empty,.ac-type:empty{display:none}
.ed-actif .u-ac-type:empty,.ed-actif .ac-type:empty{display:block;min-height:1.2em}

/* l'ouverture, habillée (la tache du logo à la couleur de la saison : INTRO, tache) */
.intro.maison .intro-indice{color:var(--saison-trait)}
.intro.maison::after{content:"";position:absolute;inset:clamp(10px,1.6vw,22px);border:1px solid var(--intro-frame);border-radius:4px;pointer-events:none;transition:opacity .3s}
.intro.maison.part::after{opacity:0}

/* le menu en entier quand la place le permet, sinon en court (« Saisons », « Spectacles »…) */
@media (max-width:1219.98px){
  .menu .long{display:none}
  .menu .court{display:inline}
  .menu a{padding:2px 14px 0;font-size:1.3125rem}
}
@media (max-width:1100px){
  .ucards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ucards.trois{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tour-text{grid-column:1/span 5}
  .tour-carte{grid-column:6/span 7}
  .groupe-t{grid-column:1/-1}
  .groupe-liste{grid-column:1/-1}
  .groupe-seul .groupe-liste{grid-template-columns:repeat(2,minmax(0,1fr))}
  .u-onglets .long{display:none}
  .u-onglets .court{display:inline}
  .d-encadres{grid-template-columns:minmax(0,1fr)}
  .fpro-cols{grid-template-columns:minmax(0,1fr)}
}
/* téléphone et tablette : la marque et le jour / la nuit restent en haut ; le menu passe en barre fixe en bas d'écran, ses
   quatre panneaux en court, sous le pouce */
@media (max-width:899.98px){
  :root{--h-tete:64px}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  html .ed-barre{bottom:calc(76px + env(safe-area-inset-bottom))}
  .bar{grid-template-columns:minmax(0,1fr) auto;column-gap:12px}
  .brand{height:60px;padding-right:0;border-right:0}
  .menu{position:fixed;z-index:60;left:0;right:0;bottom:0;background:var(--white);box-shadow:var(--shadow-bar);padding-bottom:env(safe-area-inset-bottom)}
  .menu ul{height:auto}
  .menu a{justify-content:center;min-height:62px;padding:8px 4px 9px;font:600 .8125rem/1.2 var(--sans);letter-spacing:0;text-align:center;white-space:normal}
  .menu .long,.menu .court{overflow:visible}
  .menu a[aria-current="true"]{box-shadow:inset 0 4px 0 var(--saison-trait)}
  .menu li+li a[aria-current="true"]{box-shadow:inset 1px 0 0 var(--rule),inset 0 4px 0 var(--saison-trait)}
  .hero{padding-top:20px}
  .slide{display:flex;flex-direction:column}
  .slide-photo{order:-1;aspect-ratio:16/10}
  .slide-text{padding:24px 22px 28px}
  .slide-motif{width:200px;height:200px;right:-50px;bottom:-40px}
  .hero-tabs{grid-auto-columns:minmax(140px,1fr);overflow-x:auto;scrollbar-width:none}
  .hero-tabs::-webkit-scrollbar{display:none}
  .choix ul{grid-template-columns:minmax(0,1fr)}
  .choix a{flex-direction:row}
  .choix-photo{flex:none;width:38%;aspect-ratio:auto;min-height:132px}
  .choix-t{min-height:132px;padding:18px 18px 20px;font-size:1.625rem}
  .tour-text,.tour-carte,.agenda-carte,.agenda-liste,.u-main,.u-aside,.tournee-liste,.tournee-carte,.tournee-seule,.cie-texte,.cie-embleme,.cie-dates,.contact .form,.coords,.foot-id,.foot-contact,.foot-menu,.foot-part,.portrait-t,.portrait-texte,.u-tete-texte,.u-photo,.fpro-photo,.fpro-corps,.d-consignes>*{grid-column:1/-1}
  .agenda-carte,.cie-embleme,.cie-dates{position:static}
  .foot-contact,.foot-menu,.foot-part{grid-row:auto}
  .cie-embleme{aspect-ratio:16/7;padding:24px}
  .sai-corps:not(:empty){display:flex;flex-direction:column}
  .sai-corps .sai-carte{order:-1;margin-bottom:24px}
  .sai-carte .k{max-height:340px}
  .actions-photos,.actions .prose{grid-column:1/-1;grid-row:auto}
  .u-photo{order:-1}
  .u-tete{background:radial-gradient(90% 26% at 50% 18%,var(--u-lueur),transparent 72%),var(--u-fond)}
  .u-tete-grid{padding-top:20px;padding-bottom:32px}
  .u-motif{left:auto;right:-80px;top:auto;bottom:-60px;transform:none;width:280px;height:280px}
  .u-onglets{position:static}
  .u-onglets a{flex-direction:column;gap:6px;padding:12px 6px;font-size:.8125rem;line-height:1.2;text-wrap:balance}
  .fpro-photo{min-height:0;aspect-ratio:16/9}
  .d-ateliers,.ft-blocs{grid-template-columns:minmax(0,1fr)}
  .d-photos{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .d-couv{grid-template-columns:minmax(0,1fr)}
  .d-couv ul{text-align:left}
  .bil-carte{position:static;order:-1}
  .bil-n li{padding:14px 12px 16px}
}
@media (max-width:599px){
  .page-head .wrap{padding-top:36px;padding-bottom:36px}
  .head-pieuvre{width:170px;height:170px;right:-16px;bottom:-28px;opacity:.06}
  .page-body{padding-top:36px}
  .ucards,.ucards.trois,.groupe-liste,.groupe-seul .groupe-liste{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:76px minmax(0,1fr);column-gap:14px;padding:16px 8px}
  .dblock-d{font-size:2rem}
  .sai>summary{grid-template-columns:64px minmax(0,1fr) auto;padding:14px 2px}
  .sai-n{gap:6px}
  .sai-corps{padding:6px 2px 30px}
  .filtres{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--pad));padding:2px var(--pad) 4px}
  .filtres>*{flex:none}
  .recherche{flex:none;width:260px}
  .dblock-d.moyen{font-size:1.25rem}
  .dblock-d.long{font-size:1.0625rem}
  .row-title{font-size:1.375rem}
  .u-fiche li{grid-template-columns:minmax(0,1fr)}
  .annees li{grid-template-columns:44px 56px minmax(0,1fr);column-gap:12px}
  .an-photo{width:44px;height:44px}
  .u-photos{grid-template-columns:minmax(0,1fr)}
  .partenaires{padding:20px}
}
/* ——— le mouvement : la maison (voir le bloc « Mouvement » en tête du script) ———
   Une seule courbe, nette puis posée, et des durées courtes : survol .15 s, indicateur .26 s, page .22 s, pression .06 s. */
:root{--c2:cubic-bezier(.2,0,0,1)}
html{view-transition-name:none}
main{display:block;min-height:100svh}   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas */
/* le menu : un seul indicateur, un panneau à l'aplat de la saison, qui glisse d'un élément à l'autre (une page qui dépend d'un
   élément, un spectacle, une page de l'espace pro : le même panneau, en teinte). L'élément de la vue porte aussi son propre
   aplat : il se pose sous le texte une fois l'indicateur arrivé (après sa glissade) et s'efface d'un coup quand l'indicateur
   repart, sans laisser de double */
.menu a{background:transparent;transition:color .12s .08s,background-color 0s,box-shadow .15s}
.menu a:not([aria-current="page"]):hover{transition:color .12s .08s,background-color .15s}
.menu a[aria-current="page"]{color:var(--sur);background-color:var(--saison);transition:color .12s .08s,background-color 0s .26s}
.m-ind{position:absolute;z-index:0;left:0;top:0;bottom:0;width:calc(100% / var(--m-n,4));background:var(--saison);pointer-events:none;
  transform:translateX(calc(var(--m-i,0) * 100%));transition:transform .26s var(--c2),opacity .2s}
.menu[data-etat="true"] .m-ind{opacity:.13}
.menu[data-etat=""] .m-ind{opacity:0;transition:opacity .16s}
.menu.sans-glisse .m-ind{transition:none}
/* les onglets d'un spectacle et les onglets du diaporama : l'indicateur glisse d'un onglet à l'autre */
.u-onglets ul{position:relative}
.u-onglets li{flex:1 1 0}
.u-onglets a[aria-current="page"]{box-shadow:none}
.o-ind{position:absolute;left:var(--pad);bottom:0;height:4px;width:calc((100% - 2 * var(--pad)) / var(--o-n,3));background:var(--u-vif);pointer-events:none;
  transform:translateX(calc(var(--o-i,0) * 100%));transition:transform .26s var(--c2)}
.hero-tabs{position:relative}
.hero-tab[aria-current="true"]::before{background:transparent}
.h-ind{position:absolute;left:0;top:-1px;height:3px;width:calc((100% - (var(--h-n,3) - 1) * var(--gap)) / var(--h-n,3));background:var(--saison-trait);pointer-events:none;
  transform:translateX(calc(var(--h-i,0) * (100% + var(--gap))));transition:transform .26s var(--c2)}
/* d'une fiche à la page du spectacle : sa photo seule va à sa place */
::view-transition-group(mv-partage){animation-duration:.3s;animation-timing-function:var(--c2)}
::view-transition-old(mv-partage),::view-transition-new(mv-partage){animation-duration:.3s}
/* la page qui change : l'en-tête de page prend la couleur de la nouvelle entrée en relais de l'ancienne */
.page-head{transition:background-color .26s var(--c2)}
/* les filets des rubriques, tracés à l'arrivée ; ce qui monte, monte de 8 px seulement, en .32 s */
.sec-head{position:relative;border-top:0}
.filet{position:absolute;left:0;right:0;top:0;height:1px;background:var(--ink);transform-origin:0 50%;pointer-events:none}
.filet.mv-attente{transition:transform .45s var(--c2);transition-delay:var(--mv-delai,0ms)}
.u .filet{background:color-mix(in srgb,var(--u-texte) 40%,transparent)}
[data-mv].mv-attente{transition-duration:.32s;transition-timing-function:var(--c2)}
[data-mv="monte"].mv-attente:not(.mv-vu){transform:translateY(8px)}
[data-mv="cascade"].mv-attente>*{transition:opacity .3s var(--c2),transform .32s var(--c2);transition-delay:calc(var(--mv-delai,0ms) + min(var(--mv-i,0),10) * 40ms)}
[data-mv="cascade"].mv-attente:not(.mv-vu)>*{transform:translateY(8px)}
/* la pression : la pièce s'assombrit d'un rien et se tasse, à l'instant même */
:is(.btn,.chip,.idx,.idx-tout,.rond,.hero-tab,.lien-u,.go,.choix a,.menu a,.u-onglets a,.ep-a,.foot-modifier,.sai>summary,.repli summary,.d-det summary,.theme,.rs-date,.rs-reserver,.rs-seance,.lc-b,.tp-spb){transition-property:color,background-color,border-color,box-shadow,scale,filter;transition-duration:.15s}
:is(.btn,.chip,.idx,.idx-tout,.rond,.theme,.rs-date,.lc-b).mv-presse{scale:.97;filter:brightness(.92);transition-duration:.06s}
:is(.rs-reserver,.rs-seance,.tp-pl).mv-presse{scale:.985;filter:brightness(.92);transition-duration:.06s}
:is(.choix a,.ucard:has(.mv-presse),.fpro:has(.fpro-t .mv-presse),.ac:has(.ac-t .mv-presse),.ep:has(.ep-a.mv-presse)){scale:.99;transition:scale .06s}
:is(.u-onglets a,.hero-tab,.menu a,.lien-u,.go,.sai>summary,.tp-spb).mv-presse{filter:brightness(.9);transition-duration:.06s}
.ucard,.fpro,.ac{transition:scale .15s var(--c2)}
/* une ligne vers laquelle mène la frise : un fond qui se pose puis s'efface */
@keyframes m2-vise{0%,40%{background-color:color-mix(in srgb,var(--e,var(--saison-trait)) 12%,var(--white))}}
.row.est-vise{animation:m2-vise 1.2s var(--c2)}
.row.est-allume{background:color-mix(in srgb,var(--e,var(--saison-trait)) 8%,var(--white));box-shadow:inset 3px 0 0 var(--e,var(--saison-trait))}
.u .row.est-allume{background:color-mix(in srgb,var(--u-titre) 14%,transparent);box-shadow:inset 3px 0 0 var(--u-titre)}
.k-lieu.est-allume .k-point{fill:var(--k-bras)}
.k-carte .k-lieu.est-allume{opacity:1}
.sai.est-allume>summary{background:var(--paper)}
/* le dossier composé : son icône se coche un instant */
.dos-bt .coche{display:none}
.dos-bt.fait .coche{display:block}
.dos-bt.fait svg:not(.coche){display:none}
.dos-bt.fait{animation:m2-fait 1.4s var(--c2)}
@keyframes m2-fait{0%,30%{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 30%,transparent)}}

/* ——— les frises (FRISE), nettes et fonctionnelles : un axe, des points ronds, des barres pleines, l'heure du jour ——— */
.fr{margin-bottom:40px}
.frise[data-frise]{--fr-fond:var(--white);--fr-encre:var(--ink);--fr-trait:var(--rule-frise);--fr-accent:var(--saison);--fr-police:var(--sans);
  --fr-point:10px;--fr-couloir:16px;--fr-haut:38px;--fr-taille:12px;--fr-pied:44px;--fr-passe:.32;--fr-bulle-fond:var(--white);--fr-bulle-encre:var(--ink);--fr-courbe:var(--c2)}
.tour .frise[data-frise],.page-head .frise[data-frise]{--fr-fond:var(--paper)}
.u .frise[data-frise]{--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-texte) 32%,transparent);--fr-accent:var(--u-vif);--fr-bulle-fond:var(--u-fond2);--fr-bulle-encre:var(--u-texte)}
.u .u-bande .frise[data-frise]{--fr-fond:var(--u-fond2);--fr-bulle-fond:var(--u-fond)}
.frise .frise-axe{background:var(--fr-encre);height:1px}
