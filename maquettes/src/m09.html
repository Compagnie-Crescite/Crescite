/* ---------- le mouvement ---------- */
@media (prefers-reduced-motion:no-preference){
  .choix.attend .porte-li,.choix.attend .choix-rep{opacity:0;transform:translateY(28px)}
  .choix.entre .porte-li,.choix.entre .choix-rep{transition:opacity .45s var(--ease),transform .5s var(--ease)}
  .choix.entre .porte-li:nth-child(2){transition-delay:.06s}
  .choix.entre .porte-li:nth-child(3){transition-delay:.12s}
  .choix.entre .choix-rep{transition-delay:.2s}
  /* le chapitre suivant prend la place du précédent : sa photo se découvre de bas en haut, son texte monte ligne après ligne */
  .chap.arme .chap-photo{clip-path:inset(100% 0 0 0)}
  .chap.arme .chap-photo img{transform:scale(1.06)}
  .chap.arme .chap-texte > *{opacity:0;transform:translateY(18px)}
  .chap.arme.vu .chap-photo{clip-path:inset(0);transition:clip-path 620ms cubic-bezier(.77,0,.18,1)}
  .chap.arme.vu .chap-photo img{transform:none;transition:transform 1s var(--ease)}
  .chap.arme.vu .chap-texte > *{opacity:1;transform:none;transition:opacity .42s var(--ease),transform .5s var(--ease)}
  .chap.arme.vu .chap-texte > :nth-child(1){transition-delay:.12s}
  .chap.arme.vu .chap-texte > :nth-child(2){transition-delay:.16s}
  .chap.arme.vu .chap-texte > :nth-child(3){transition-delay:.2s}
  .chap.arme.vu .chap-texte > :nth-child(4){transition-delay:.24s}
  .chap.arme.vu .chap-texte > :nth-child(5){transition-delay:.28s}
  .chap.arme.vu .chap-texte > :nth-child(6){transition-delay:.32s}
  .chap.arme.vu .chap-texte > :nth-child(7){transition-delay:.36s}
  .cc-onde{animation:onde 2.6s cubic-bezier(.2,.6,.3,1) infinite}
  .cc-rouen.est-actif + .cc-onde,.cc-onde.est-actif{animation-duration:1.4s}
  .choix-suite svg{animation:rebond 1.8s ease-in-out infinite}
  /* un chapitre qui commence : le titre monte, le bras se trace ; l'ouverture d'un spectacle se découvre, son titre
     se pose lettre à lettre, son accroche mot à mot (une page lisible tout de suite, son entrée finie en moins d'une demi-seconde) */
  .page-entree:not(.deja) .ent-bras path{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .9s var(--ease) .05s forwards}
  .page-entree:not(.deja) .ent-titre{animation:entree .42s var(--ease) both}
  .fiche:not(.deja):not(.partage) .ouv-photo{animation:devoile 440ms cubic-bezier(.77,0,.18,1) both}
  .fiche:not(.deja):not(.partage) .ouv-photo img{animation:recule .9s var(--ease) both}
  .fiche:not(.deja) .ouv-motif{animation:motif 1.2s var(--ease) both .1s}
  .fiche:not(.deja) .ouv-haut,.fiche:not(.deja) .ouv-signe,.fiche:not(.deja) .ouv-sur,.fiche:not(.deja) .ouv-sous,.fiche:not(.deja) .ouv-cta{animation:entree .42s var(--ease) both .1s}
  .fiche:not(.deja) .ouv-sous,.fiche:not(.deja) .ouv-cta{animation-delay:.2s}
  .fiche:not(.deja) .ouv-titre .l{animation:lettre .36s var(--ease) both;animation-delay:calc(.04s + min(var(--i), 20) * 12ms)}
  .fiche:not(.deja) .ouv-accroche .m{animation:mot .3s var(--ease) both;animation-delay:calc(.16s + min(var(--j) * 10ms, .24s))}
}
@keyframes onde{from{stroke-width:11;opacity:.6}to{stroke-width:54;opacity:0}}
@keyframes entree{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes devoile{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes recule{from{transform:scale(1.08)}to{transform:none}}
@keyframes lettre{from{opacity:0;transform:translateY(.4em) rotate(5deg)}to{opacity:1;transform:none}}
@keyframes mot{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:none}}
@keyframes motif{from{opacity:0;transform:rotate(-12deg) scale(.92)}to{opacity:.16;transform:none}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes rebond{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ---------- le mouvement (règle 15) : le chapitre ; voir le bloc « Mouvement » en tête du script ----------
   Une seule courbe (rapide, puis posée) : survol 180 ms, pression 60 ms, page 400 ms, jamais plus de 450 ms. */
:root{--courbe:cubic-bezier(.2,.75,.2,1)}
/* les pages : la page nouvelle est là tout de suite (aucune capture d'écran) ; ce qu'on a choisi voyage jusqu'à sa place
   dans la page nouvelle, sur un calque fixe, sous l'en-tête et la progression ; la vraie place se découvre à son arrivée */
.voyage{position:fixed;z-index:39;overflow:hidden;pointer-events:none;background:var(--nuit-2);transform-origin:0 0}
.voyage img{width:100%;height:100%;object-fit:cover}
.voyage-dessous{z-index:-1}
.voyage-porte::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,color-mix(in srgb,var(--e) 90%,var(--noir)) 0%,color-mix(in srgb,var(--e) 62%,transparent) 34%,var(--ombre-18) 70%,var(--ombre-52) 100%)}
.en-voyage{visibility:hidden}
.o-filet{transform-origin:0 50%}
/* la progression : une barre de chapitres sous l'en-tête ; un segment par chapitre, à sa couleur, rempli à la lecture */
.avance{position:fixed;left:0;right:0;top:var(--tete-h);z-index:49;height:3px;pointer-events:none;color:var(--creme);transition:opacity .2s}
.avance[data-ton="clair"]{color:var(--encre)}
.avance.est-vide{opacity:0}
.avance i{position:absolute;top:0;bottom:0;overflow:hidden;background:color-mix(in srgb,currentColor 15%,transparent)}
.avance b{position:absolute;inset:0;background:var(--c,var(--magenta-vif));transform:scaleX(0);transform-origin:0 50%}
.avance[data-ton="clair"] b{background:color-mix(in srgb,var(--c,var(--magenta)) 72%,var(--encre))}
.ouvert-menu .avance{opacity:0}
/* survol : la barre d'une carte se remplit de gauche à droite, comme un chapitre qu'on entame */
:is(.mini,.vignette,.cat,.ac,.suivant-lien,.pro)::after{content:"";position:absolute;z-index:3;left:0;right:0;top:0;height:3px;background:var(--u-vif,var(--ev,var(--magenta-vif)));transform:scaleX(0);transform-origin:0 50%;transition:transform .18s var(--courbe),height .12s;pointer-events:none}
:is(.mini,.vignette,.cat,.ac,.suivant-lien,.pro):is(:hover,:focus-within)::after{transform:none}
/* la pression : à l'instant même, la barre est pleine, la flèche avance, la pièce s'enfonce d'un rien */
:is(.mini,.vignette,.cat,.ac):has(.mv-presse)::after,:is(.suivant-lien,.pro).mv-presse::after{transform:none;height:6px;transition:none}
.porte.mv-presse::after{transform:none;height:7px;transition:none}
.porte.mv-presse .porte-fleche,.pro.mv-presse .porte-fleche{background:var(--ev);border-color:var(--ev);color:var(--nuit);transform:translateX(9px);transition-duration:.06s}
.suivant-lien.mv-presse .suivant-fleche{transform:translateX(16px);transition-duration:.06s}
:is(.bouton-ligne,.cp,.idx-tout,.filtre-puce,.choix-suite){transition:border-color .16s,background-color .16s,color .16s,scale .12s var(--courbe)}
.mv-presse:is(.bouton,.ecrire-cta,.cd-mail,.bouton-ligne,.cp,.idx-tout,.filtre-puce,.choix-suite){scale:.97;transition-duration:.06s}
.mv-presse:is(.bouton,.ecrire-cta,.cd-mail) .fleche{transform:translateX(8px);transition-duration:.06s}
.entree.mv-presse{box-shadow:inset 0 -3px 0 var(--ec)}
.onglets a.mv-presse{color:var(--u-texte)}
.onglets a.mv-presse:not([aria-current])::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--ec);opacity:.6}
.second a.mv-presse{opacity:1;text-decoration:underline;text-decoration-thickness:2px}
.sai>summary.mv-presse{background:color-mix(in srgb,var(--magenta) 15%,transparent)}
.date-quoi a.mv-presse,.saisons-liste a.mv-presse,.date-ou a.mv-presse{color:var(--magenta-texte)}
.sommaire button.mv-presse .som-trait{width:48px;opacity:1}
/* ce qui vit : « EN TOURNÉE » respire */
.pastille.vit::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:currentColor;vertical-align:.1em}
.vit::before{animation:chap-respire 2.4s ease-in-out infinite}
@keyframes chap-respire{0%,100%{opacity:1}50%{opacity:.22}}
/* au défilement : le trait d'un titre de rubrique se tire, le titre monte ; une ligne vers laquelle mène un repère s'allume */
.page-entree .bloc-titre[data-mv].mv-attente::before{transform-origin:0 50%;transition:transform .5s var(--courbe) .08s}
.page-entree .bloc-titre[data-mv].mv-attente:not(.mv-vu)::before{transform:scaleX(0)}
.est-vise{animation:chap-vise 1.4s var(--courbe)}
@keyframes chap-vise{0%,35%{background:color-mix(in srgb,var(--point,var(--magenta)) 16%,transparent);box-shadow:inset 4px 0 0 var(--point,var(--magenta))}}
html.immobile *,html.immobile *::before,html.immobile *::after{animation:none!important;transition:none!important}

/* ---------- les frises (FRISE) : des barres de chapitres ----------
   une piste épaisse, coupée à chaque mois (à chaque saison, à chaque année), remplie jusqu'à aujourd'hui (la tête de la
   progression, qui respire) ; les dates sont des crans aux couleurs de leur spectacle, au trait quand elles sont scolaires */
.frise[data-frise]{--fr-encre:var(--encre);--fr-trait:var(--trait);--fr-fond:var(--papier);--fr-accent:var(--magenta-texte);--fr-piste:color-mix(in srgb,var(--encre) 11%,transparent);--fr-plein:var(--e,var(--magenta));--fr-police:Inter,system-ui,sans-serif;--fr-taille:11px;--fr-courbe:var(--courbe);--fr-couloir:20px;--fr-haut:30px;--fr-pied:38px;--fr-passe:.5;--fr-bulle-fond:var(--nuit);--fr-bulle-encre:var(--creme)}
:is(.fiche,.cat) .frise[data-frise]{--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-texte) 24%,transparent);--fr-fond:var(--u-fond);--fr-accent:var(--u-vif);--fr-piste:color-mix(in srgb,var(--u-texte) 15%,transparent);--fr-plein:var(--u-vif);--fr-bulle-fond:var(--u-texte);--fr-bulle-encre:var(--u-fond)}
.ch-alt .frise[data-frise]{--fr-fond:var(--u-fond2)}
.frise[data-frise] .frise-axe{height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,var(--fr-plein) calc(var(--avance,0) * 1%),var(--fr-piste) 0)}
.frise[data-frise] .frise-mois>li{top:calc(var(--fr-axe) - 5px);height:10px;width:2px;margin-left:-1px;border-left:0;background:var(--fr-fond)}
.frise[data-frise] .frise-mois>li.est-mineur{top:calc(var(--fr-axe) - 3px);height:6px;width:1px;margin-left:-.5px}
/* le bouton remis à zéro de la maquette (margin:0) ne doit pas décaler les repères : leur centre est sur la barre */
.frise[data-frise] .frise-repere{margin:-12px 0 0 -12px}
.frise[data-frise] .frise-point.est-duree>.frise-repere{margin:-9px 0 0}
.frise[data-frise] .frise-bande>.frise-repere{margin:calc(-1 * var(--fr-bande-h)) 0 0}
.frise[data-frise] .frise-mois>li>span:first-child{left:6px;top:17px}
.frise[data-frise] .frise-mois-nom{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.frise[data-frise] .frise-an{font-variant-numeric:tabular-nums}
.frise[data-frise] .frise-point>.frise-repere::before{width:4px;height:16px;border-radius:2px;box-shadow:0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-point>.frise-repere:is(:hover,:focus-visible)::before,.frise[data-frise] .frise-point:is(.est-allume,.est-focus)>.frise-repere::before{scale:1.5 1.25}
.frise[data-frise] .frise-point.est-scolaire:not(.est-duree)>.frise-repere::before{rotate:none;width:6px;height:16px;border-radius:2px;background:var(--fr-fond);box-shadow:inset 0 0 0 1.5px var(--fr-c,currentColor),0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-point.est-duree>.frise-repere::before{height:10px;border-radius:3px}
.frise[data-frise] .frise-grappe>span{box-shadow:0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-grappe.est-passe>span{opacity:1;filter:saturate(.45)}
.frise[data-frise] .frise-aujourdhui::before{opacity:.4}
.frise[data-frise] .frise-aujourdhui::after,.frise[data-frise] .frise-souffle{left:-6px;bottom:-6px;width:12px;height:12px}
.frise[data-frise] .frise-aujourdhui::after{box-shadow:0 0 0 2.5px var(--fr-fond)}
.frise[data-frise] .frise-aujourdhui-nom{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.frise[data-frise] .frise-bande-barre{border-radius:3px 3px 0 0;opacity:.82}
.frise[data-frise] .frise-bande>.frise-repere{padding:0 1px}
.frise[data-frise] .frise-bande-n{font-weight:600;font-variant-numeric:tabular-nums}
.frise[data-frise] .frise-bande.est-lue .frise-bande-barre{opacity:1;box-shadow:inset 0 3px 0 var(--fr-accent)}
.frise[data-frise] .frise-bande.est-lue .frise-bande-nom{font-weight:700;color:var(--fr-accent)}
/* verticale (l'histoire de la compagnie) : la barre descend, coupée à chaque année, les titres à côté de leur cran */
.frise[data-frise].frise--v .frise-axe{width:6px;height:auto;margin:0 0 0 -3px;background:linear-gradient(180deg,var(--fr-plein) calc(var(--avance,0) * 1%),var(--fr-piste) 0)}
.frise[data-frise].frise--v .frise-mois>li{top:calc(var(--fr-x) * 1%);left:0;width:var(--fr-axe);height:0;margin:0;background:none}
.frise[data-frise].frise--v .frise-mois>li::after{content:"";position:absolute;right:-5px;top:-1px;width:10px;height:2px;background:var(--fr-fond)}
.frise[data-frise].frise--v .frise-mois>li>span:first-child{left:0;top:-.62em}
.frise[data-frise].frise--v .frise-point>.frise-repere::before{width:16px;height:4px}
.frise[data-frise].frise--v .frise-aujourdhui::after,.frise[data-frise].frise--v .frise-souffle{left:calc(var(--fr-axe) - 6px);top:-6px;bottom:auto}
.frise[data-frise].frise--v .frise-etiquette{left:26px;top:calc(12px - .62em);max-width:17em;font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.22;color:var(--encre)}
.frise[data-frise].frise--v .frise-aujourdhui::before{display:none}
.frise[data-frise].frise--v .frise-aujourdhui-nom{top:-.62em}
.frise[data-frise].frise--v .frise-etiquette::before{display:none}
.frise[data-frise].frise--v .frise-point.est-allume .frise-etiquette,.frise[data-frise].frise--v .frise-repere:is(:hover,:focus-visible) .frise-etiquette{color:var(--magenta-texte)}
/* leurs places */
.v-frise{grid-column:1/-1;margin:0 0 clamp(30px,5vh,52px)}
.frise-saisons{--fr-bande-h:30px;--fr-haut:20px;--fr-pied:26px}
.frise-saisons .frise-bande{--fr-c:var(--e,var(--magenta))}
.frise-saisons .frise-bande-nom,.frise-diffusion .frise-bande-nom{font-size:10px;letter-spacing:0}
/* au téléphone, l'index des saisons ne colle pas en haut : la frise prend toute la largeur, les commandes passent dessous */
@media (max-width:759px){.ag-index{position:static;flex-wrap:wrap;row-gap:4px}.ag-frise{flex-basis:100%}.ag-ctl{margin-left:auto}}
.frise-diffusion{--fr-bande-h:26px;--fr-haut:18px;--fr-pied:26px}
.cat-diff{margin-top:2px;min-height:70px}
/* le visible d'abord : ce qui est loin sous le pli ne se met en page qu'en approchant (la page s'affiche aussitôt) ; tout
   l'est, le temps d'aller à un chapitre ou de revenir à un endroit de la page */
.fiche>.ch,.fiche>.suivant,.page>section.bloc~section.bloc,.cats>.cat{content-visibility:auto;contain-intrinsic-size:auto 900px}
.tout-rendu :is(.fiche>.ch,.fiche>.suivant,.page>section.bloc~section.bloc,.cats>.cat){content-visibility:visible}
.sp-frise:empty{min-height:96px}
.sp-frise[data-diffusion]:empty{min-height:70px}
.v-frise:empty{min-height:96px}
.sp-frise{margin:0 0 clamp(30px,5vh,52px)}
.c-frise{margin-top:6px;padding-top:12px}
.c-frise .frise-toile{--fr-axe:58px}
.c-frise .frise[data-frise]{--fr-hauteur:540px}

/* ---------- l'espace pro : trois portes de nuit, dans l'ordre (comédiens et techniciens, programmateurs, administration) ---------- */
.pros{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,1.4vw,20px)}
.pro{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:14px;min-height:clamp(230px,36vh,380px);padding:clamp(22px,2.4vw,36px);border-radius:4px;background:radial-gradient(90% 75% at 100% 0%,color-mix(in srgb,var(--magenta) 32%,transparent),transparent 70%),var(--nuit);color:var(--creme);text-decoration:none}
.pro .bras-e{--ec:var(--magenta-vif);width:38px;height:38px;stroke-width:1.6;margin-bottom:auto}
.pro-titre{font-family:Gloock,Georgia,serif;font-size:clamp(1.5rem,2.3vw,2.25rem);line-height:1.06;text-wrap:balance}
.pro-texte{max-width:26em;font-size:1rem;line-height:1.55;color:var(--creme-2)}
.pro:hover .porte-fleche,.pro:focus-visible .porte-fleche{background:var(--magenta-vif);border-color:var(--magenta-vif);color:var(--nuit);transform:translateX(4px)}
.pro:focus-visible{outline:3px solid var(--magenta-vif);outline-offset:3px}
@media (min-width:900px){.pros{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- l'édition sur place, dans le style de la 09 ---------- */
html .ed-barre{background:var(--nuit);color:var(--creme);border-color:var(--creme-18);box-shadow:0 14px 40px var(--noir-45)}
html .ed-barre .ed-etat::before{background:var(--magenta-vif)}
html .ed-barre .ed-bt{background:transparent;color:var(--creme);border-color:var(--creme-34)}
html .ed-barre .ed-bt:hover{border-color:var(--creme)}
html .ed-barre .ed-bt.ed-plein{background:var(--magenta-vif);border-color:var(--magenta-vif);color:var(--nuit)}
html .ed-tete h2{font-family:Gloock,Georgia,serif;font-weight:400;font-size:24px}
html .ed-voile{background:var(--nuit-62)}
html .ed-panneau{box-shadow:0 30px 80px var(--nuit-50)}
html .ed-ajout{margin:0 0 18px}
.ed-actif :is(.chap:not(.u-clair),.fiche:not(.u-clair),.cat:not(.u-clair),.ac:not(.u-clair),.mini:not(.u-clair),.vignette:not(.u-clair),.ent-tete,.pied,.choix,.chap-carte,.troupe-chap) [data-edit]{outline-color:color-mix(in srgb,var(--magenta-vif) 75%,transparent)}
.ed-actif .mini-titre a::after,.ed-actif .vignette-titre a::after{display:none}
@media (max-width:759px){html .ed-barre{bottom:calc(var(--barre-h) + 10px + env(safe-area-inset-bottom))}}

<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header class="tete" id="tete" data-ton="chapitre"></header>
<div class="avance est-vide" id="avance" aria-hidden="true"></div>
<nav class="sommaire est-cache" id="sommaire" hidden><ol></ol></nav>
<main id="contenu" tabindex="-1">
  <div id="vue-accueil" hidden></div>
  <div id="vue-page" hidden></div>
  <div id="vue-spectacle" hidden></div>
</main>
<footer class="pied" id="pied" data-ton="sombre"></footer>
<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : le chapitre. Un spectacle par écran : on lit la compagnie comme un livre en chapitres, écran après écran
     (aimanté, sur l'accueil), et une progression avance avec la lecture. Une seule courbe, rapide puis posée ; survol
     180 ms, pression 60 ms, page 400 ms, jamais plus de 450 ms ; un geste interrompt tout.
     1. Changer de page (MOUVEMENT.transition, View Transitions) : chaque spectacle prend la place du précédent. La photo
        qu'on choisit (un chapitre de l'accueil, une vignette, une fiche, le spectacle suivant) s'agrandit et devient la
        photo d'ouverture de sa page, où le titre se pose lettre à lettre ; une porte de l'accueil devient l'en-tête de son
        entrée ; ailleurs, l'écran suivant monte d'un rien. Au retour, l'écran précédent redescend, la photo regagne son
        chapitre et l'accueil rouvre à l'écran qu'on avait quitté. D'un onglet à l'autre d'un spectacle, l'ouverture reste,
        seul le trait de l'onglet glisse, et l'on reste au même endroit de la lecture.
     2. La progression : sous l'en-tête, une barre de chapitres (un segment par chapitre, à sa couleur : chaque spectacle à
        la sienne) se remplit avec le défilement ; à chaque page, elle repart.
     3. Ouvrir une saison, le menu : les lignes arrivent l'une après l'autre (cascade) ; la carte de la saison pousse.
     4. Filtrer, chercher : les dates glissent à leur nouvelle place, celles qui partent s'effacent (MOUVEMENT.flip) ; sur
        les frises, les crans glissent et les saisons changent de hauteur.
     5. Survol et focus : la barre d'une carte se remplit de gauche à droite, comme un chapitre qu'on entame.
     6. Pression (MOUVEMENT.presse) : à l'instant même, la barre est pleine, la flèche avance, le bouton s'enfonce d'un rien.
     7. Défilement : un chapitre de l'accueil se découvre de bas en haut et son texte monte ligne après ligne ; les titres
        de rubrique tirent leur trait (MOUVEMENT.reveler), les fiches arrivent l'une après l'autre, les chiffres comptent.
     8. Ce qui vit : « EN TOURNÉE » respire ; sur chaque frise, la progression s'arrête à « aujourd'hui », qui respire.
     9. Réserver une date (RESERVER) : le chapitre qui avance. Choisir une autre date dans la bande : la carte d'avant
        s'efface en reculant, la nouvelle arrive du côté de la date choisie, sa photo monte, ses lignes montent l'une après
        l'autre, sa barre de progression se remplit ; sous une ligne de l'agenda, la carte descend d'un rien et se compose
        de même. Les dates sont des tuiles de chapitre : leur barre se remplit au survol, pleine quand on les choisit.
    10. Les vidéos (LECTEUR) prennent la place de leur affiche en montant ; « assombrir » éteint la salle en 420 ms.
    11. Le jour et la nuit (THEME) : la nuit s'ouvre en cercle depuis le bouton de l'en-tête ; le papier s'éteint, les
        écrans de nuit restent ce qu'ils sont.
    12. La troupe (TROUPE) : un chapitre plein écran. Au défilement (animations liées au défilement : view()), la pieuvre
        du logo monte, la barre de chaque métier se remplit, les personnes montent l'une après l'autre et chaque visage se
        découvre dans son médaillon ; une personne survolée ou choisie s'allume partout où elle est, des bras la relient.
     Les frises (FRISE) sont des barres de chapitres : une piste épaisse, coupée à chaque mois (à chaque saison, à chaque
     année), remplie jusqu'à aujourd'hui ; les dates y sont des crans à la couleur de leur spectacle. La saison et les
     saisons sur « Je viens voir un spectacle » (reliées à la liste et à la carte ; les saisons tiennent lieu d'index et
     marquent la saison qu'on lit), la saison passée, la tournée d'un spectacle, les dates scolaires, la diffusion saison
     par saison (programmer), l'histoire de la compagnie, verticale, à côté de son texte. La pieuvre se tait : aucun moment
     de tentacule ici. Moins d'animations demandé (ou ?anim=0) : tout est posé tout de suite, rien ne bouge. */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const doux = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
  const plat = (h) => String(h || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  const MQ_LARGE = matchMedia('(min-width: 1024px) and (min-height: 600px)');
  const MQ_REDUIT = matchMedia('(prefers-reduced-motion: reduce)');
  const doc = document.documentElement;
  const tete = $('#tete');
  const sommaire = $('#sommaire');
  const vueAccueil = $('#vue-accueil');
  const vuePage = $('#vue-page');
  const vueSpectacle = $('#vue-spectacle');
  const pied = $('#pied');
  // le mouvement (MOUVEMENT) et les frises (FRISE), outils communs ; sans eux, la maquette reste entière, immobile
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  // réserver une date (RESERVER), les vidéos (LECTEUR), le jour et la nuit (THEME), la troupe (TROUPE) : outils communs
  const RS = typeof RESERVER !== 'undefined' ? RESERVER : null, LC = typeof LECTEUR !== 'undefined' ? LECTEUR : null;
  const TH = typeof THEME !== 'undefined' ? THEME : null, TR = typeof TROUPE !== 'undefined' ? TROUPE : null;
  const nuit = () => !!TH && TH.actuel() === 'nuit';
  const permis = () => (MV ? MV.permis() : !MQ_REDUIT.matches);
  const COURBE = 'cubic-bezier(.2, .75, .2, 1)';
  // le visible d'abord : ce qui est sous le pli se fait dans les tâches qui suivent l'image, chacune courte ; un travail
  // différé d'un rendu dépassé (on a changé de page entre-temps) ne fait rien ; une vue refaite en place fait tout de suite
  const ensuite = (f) => requestAnimationFrame(() => setTimeout(f, 0));
  let GEN = 0, APRES = [], SYNC = false;
  const differe = (f) => { if (enPlace || SYNC) { f(); return; } const g = GEN; ensuite(() => { if (g === GEN) f(); }); };
  // les calculs coûteux (l'agenda passé) gardés tant que D ne change pas
  let versionD = 0;
  const memoire = new Map();
  const retenu = (cle, f) => { const m = memoire.get(cle); if (m && m.v === versionD) return m.x; const x = f(); memoire.set(cle, { v: versionD, x }); return x; };

  /* ---------- D, relu à chaque rendu (règle 9) : aucune copie figée au chargement ---------- */
  const S = () => D.site;
  const L = () => D.site.libelles || {};

  const BLOBS = new Map();

  /* ---------- les couleurs : chaque univers garde ses contrastes (AA) ---------- */
  const valide = (h) => /^#[0-9a-f]{6}$/i.test(h || '');

  // une couleur poussée vers le noir (fonds clairs) ou vers le blanc (fonds sombres) jusqu'à se lire sur tous ses fonds
  function ajuste(c, fonds, cible) {
    const clair = fonds.every((f) => lum(f) > 0.4);

  // les variables d'un univers (couleurs, police de titre), recalculées à chaque rendu
  let cacheU = new Map();
  function univers(s) {
    if (cacheU.has(s)) return cacheU.get(s);
    const u = s.univers || {}, c = u.couleurs || s.palette || {}, p = u.polices || {};
    const clair = !!(u.clair ?? s.clair);
    const fond = valide(c.fond) ? c.fond : clair ? '#f3eee9' : '#140c12';
    const fond2 = valide(c.fond2) ? c.fond2 : fond;

    const texte2 = valide(c.texte2) ? c.texte2 : texte;

    // la couleur du spectacle sur le papier des pages (un point, un repère de frise) : de jour, et sur le papier de nuit
    const papier = lisible([c.accent, c.scene, c.accent2], ['#f3eee9'], 3);
    const papierNuit = lisible([c.accent, c.scene, c.accent2], [PAPIER_NUIT], 3);
    const lueur = String(c.lueur || 'transparent').replace(/[;"<>{}]/g, '');
    const police = p.titre ? `'${String(p.titre).replace(/['";<>{}]/g, '')}',` : '';
    // la nuit (règle 19) : un univers clair invente sa nuit dans ses propres couleurs de D (son texte, plongé dans la nuit

  /* ---------- les dates ---------- */

  function piedHTML() {
    const co = S().coordonnees || {};
    return `
<div class="grille">
  <div class="pied-contact">

  /* ---------- l'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const NOMS_MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];

    zones = [...$$('[data-ton]', racine), pied];
    monterSommaire();
    if (ep || initial) ajusterTete();
    const cible = !ep && ancre ? document.getElementById(ancre) : null;
    ancre = null;
    if (ep) { ajusterOnglets(); majAimant(); mesurerCarte(); majEtat(); mesurerAvance(false); }
    else {
      // la vue se place, son titre prend le focus et la progression repart, à l'image suivante (avant d'être peinte) : la
      // mise en page se fait une seule fois, dans la tâche de l'image ; au retour, on retrouve l'écran qu'on avait quitté
      requestAnimationFrame(() => {
        scrollTo({ top: y || 0, left: 0, behavior: 'instant' });
        ajusterOnglets(); majAimant(); mesurerCarte(); majEtat(); mesurerAvance(true);
        if (vue === 'accueil' && gesteFait) armer();
        if (dep) arrivee(dep);
        if (q0) glisserFilet(q0);
        if (cible) allerA(cible);
        else if (!initial) { const t = $(vue === 'spectacle' ? '#t-fiche' : vue === 'page' ? '#t-page' : '#t-accueil'); if (t) t.focus({ preventScroll: true }); }
      });
      if (!initial) entrer(type, partage);
    }
    enPlace = false; SYNC = false; DEJA = false; PARTAGE = false;
  }
  /* le voyage d'une photo d'une page à l'autre, sans capture d'écran : la page nouvelle est là tout de suite ; un calque fixe,
     à l'image de ce qu'on a choisi, part de sa place et va prendre celle de son pareil (le même data-mv-nom) dans la page
     nouvelle, qui se découvre à son arrivée (une photo devient l'ouverture d'un spectacle, une porte l'en-tête de son entrée,
     et au retour l'ouverture regagne son chapitre). Un geste suivant l'arrête net. */
  let voyage = null;
  function depart(el) {
    const q = el.getBoundingClientRect(), img = $('img', el), porte = el.matches('.porte');
    return { nom: el.getAttribute('data-mv-nom'), q, src: img ? img.currentSrc || img.src : '', porte, style: porte ? (el.closest('[style]') || el).getAttribute('style') || '' : '' };
  }
  function arrivee(dep) {
    const cible = $(`[data-mv-nom="${CSS.escape(dep.nom)}"]`, $('#contenu'));
    if (!cible) return;
    const q = cible.getBoundingClientRect(), o = dep.q;
    if (!q.width || !q.height || q.bottom < 0 || q.top > innerHeight) return;
    const v = document.createElement('div');
    v.className = `voyage${dep.porte ? ' voyage-porte' : ''}`;
    v.setAttribute('aria-hidden', 'true');
    if (dep.porte) v.setAttribute('style', dep.style);
    if (dep.src) v.innerHTML = `<img src="${esc(dep.src)}" alt="">`;
    Object.assign(v.style, { left: `${q.left}px`, top: `${q.top}px`, width: `${q.width}px`, height: `${q.height}px` });
    // au départ : la place d'arrivée réduite sans être déformée (elle couvre la place de départ) et recadrée sur elle ;
    // seuls transform et clip-path bougent (rien ne se recalcule, rien ne décale la page)
    const k = Math.max(o.width / q.width, o.height / q.height);
    const tx = o.left + o.width / 2 - q.left - (q.width * k) / 2, ty = o.top + o.height / 2 - q.top - (q.height * k) / 2;
    const n = (x) => `${Math.max(0, x).toFixed(1)}px`;
    const de = { transform: `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${k.toFixed(4)})`,
      clipPath: `inset(${n((o.top - q.top - ty) / k)} ${n(q.width - (o.left + o.width - q.left - tx) / k)} ${n(q.height - (o.top + o.height - q.top - ty) / k)} ${n((o.left - q.left - tx) / k)})` };
    const a = { transform: 'translate(0px, 0px) scale(1)', clipPath: 'inset(0px 0px 0px 0px)' };
    // vers l'ouverture d'un spectacle ou l'en-tête d'une entrée : le calque passe sous leur texte (le titre se pose
    // par-dessus) ; la photo d'arrivée attend le calque, l'en-tête d'une entrée reste là (la porte s'y efface)
    const hote = dep.porte ? cible : cible.closest('.ouverture');
    if (hote) v.classList.add('voyage-dessous');
    (hote || document.body).appendChild(v);
    if (!dep.porte) cible.classList.add('en-voyage');
    // la porte s'ouvre sur sa page : elle s'efface en s'agrandissant ; la photo arrive entière, puis cède la place à la vraie
    const an = v.animate(dep.porte ? [{ ...de, opacity: 1 }, { ...a, opacity: 0.8, offset: 0.62 }, { ...a, opacity: 0 }] : [de, a], { duration: dep.porte ? 440 : 420, easing: 'cubic-bezier(.3, .72, .12, 1)', fill: 'forwards' });
    voyage = an;
    const finir = () => { cible.classList.remove('en-voyage'); if (voyage === an) voyage = null; };
    an.onfinish = () => { finir(); if (dep.porte) { v.remove(); return; } const f = v.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: 'ease-out', fill: 'forwards' }); f.onfinish = f.oncancel = () => v.remove(); };
    an.oncancel = () => { finir(); v.remove(); };
  }
  // d'un onglet à l'autre, le trait de l'onglet glisse de l'onglet quitté à l'onglet choisi
  function glisserFilet(q0) {
    const f = $('.onglets .o-filet', vueSpectacle); if (!f) return;
    const q = f.getBoundingClientRect();
    if (!q.width || Math.abs(q.top - q0.top) > 2) return;
    f.animate([{ transform: `translateX(${(q0.left - q.left).toFixed(1)}px) scaleX(${(q0.width / q.width).toFixed(4)})` }, { transform: 'none' }], { duration: 280, easing: COURBE });
  }
  // la page qui arrive : son titre monte d'un rien (au retour, il redescend) ; d'un onglet à l'autre, la première rubrique se
  // repose ; avec une photo partagée, c'est elle qui fait le geste. Seuls de petits blocs bougent (jamais la page entière)
  function entrer(type, partage) {
    if (!permis()) return;
    if (entreeVue) { try { entreeVue.cancel(); } catch (e) { /* finie */ } entreeVue = null; }
    const racine = vue === 'spectacle' ? vueSpectacle : vue === 'page' ? vuePage : vueAccueil;
    if (type === 'onglet' || type === 'onglet-loin') {
      const c = $('.ch .ch-int', racine);
      if (c && c.animate) entreeVue = c.animate([{ transform: 'translateY(16px)' }, { transform: 'none' }], { duration: 260, easing: COURBE, fill: 'backwards' });
      return;
    }
    if (partage || type === 'spectacle') return;
    // une entrée (ou une page) qui a sa propre entrée en CSS la joue seule ; sinon, son titre monte
    const el = $('.page-entree:not(.deja) .ent-int', racine) ? null : $('.ouv-contenu, .ent-int, .page-tete', racine);
    if (!el || !el.animate) return;
    const dy = type === 'retour' ? -16 : 18;
    entreeVue = el.animate([{ opacity: 0.25, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'none' }], { duration: 300, easing: COURBE, fill: 'backwards' });
  }
  // au défilement : les titres de rubrique tirent leur trait et montent, les fiches arrivent l'une après l'autre, les chiffres comptent
  function decorer(racine, surPlace) {
    if (!MV || !racine) return;
    $$('.bloc-titre, .ch-titre', racine).forEach((e) => { if (!e.closest('[data-mv]')) e.setAttribute('data-mv', 'monte'); });
    $$('.minis, .acs, .vignettes, .cats, .cast, .pq, .tech, .pros, .ateliers-l, .faits-u', racine).forEach((e) => e.setAttribute('data-mv', 'cascade'));
    $$('.fait-fort', racine).forEach((e) => { if (!e.hasAttribute('data-mv')) e.setAttribute('data-mv', 'compte'); });
    MV.reveler(racine, { immediat: !!surPlace });
  }
  addEventListener('hashchange', () => router());
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  /* une mise à jour des données (règle 9) : la vue courante se refait en place, sans remonter ni voler le focus */
  function cleFocus(el) {
    if (!el || el === document.body || !el.matches) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset.edit) return `[data-edit="${CSS.escape(el.dataset.edit)}"]`;
    if (el.matches('.carte-lieu[data-l]')) return `.carte-lieu[data-l="${CSS.escape(el.dataset.l)}"]`;
    if (el.matches('.sommaire button')) return `.sommaire button[data-cible="${CSS.escape(el.dataset.cible)}"]`;
    if (el.matches('[data-s]')) return `[data-s="${CSS.escape(el.dataset.s)}"]`;
    if (el.matches('.idx-tout')) return '.idx-tout';
    if (el.matches('a[href]')) return `a[href="${CSS.escape(el.getAttribute('href'))}"]`;
    if (el.matches('summary')) { const d = el.closest('details[data-cle]'); return d ? `details[data-cle="${CSS.escape(d.dataset.cle)}"] summary` : null; }
    return null;
  }
  let tLecteur = 0;
  function rafraichir() {
    if (rendu === null) return;
    // une vidéo joue : rien n'est refait tant qu'elle joue (elle s'arrêterait), on y revient ensuite
    clearTimeout(tLecteur);
    if (LC && LC.actif()) { tLecteur = setTimeout(rafraichir, 1500); return; }
    versionD++;
    const y = scrollY, act = document.activeElement, cle = cleFocus(act);
    const ouverts = $$('details[data-cle]').filter((d) => d.open).map((d) => d.dataset.cle);
    const menuOuvert = tete.classList.contains('menu-ouvert');
    polices();
    couleursSp();
    monterTete();
    pied.innerHTML = piedHTML();
    router({ enPlace: true });
    ouverts.forEach((k) => { const d = $(`details[data-cle="${CSS.escape(k)}"]`); if (d) d.open = true; });
    if (menuOuvert) menu(true);
    if (cle) { const el = $(cle); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
    scrollTo(0, y);
    planifier();
  }
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(rafraichir);

  /* ================= le montage ================= */
  // la pieuvre se tait : ni les clics ni les pages ne la font jouer (règle 15 A) ; aucun moment de tentacule ici
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ clic: false, pages: false });
  doc.classList.toggle('immobile', !permis());
  if (MV) MV.presse(document);
  if ('ResizeObserver' in window) new ResizeObserver(() => planifierMesure()).observe($('#contenu'));
  // le jour et la nuit (THEME) : la bascule repeint par les variables de couleur ; seuls l'en-tête, la progression et le
  // sommaire, dont le ton suit les zones, se recalent (dans la transition de la bascule)
  if (TH) TH.surChangement(() => { actif = null; majEtat(); });
  // les vidéos (LECTEUR) : la signature habille leur arrivée et l'extinction de la salle ; une vidéo « Bande-annonce »
  // lointaine (data-lecteur-va) : ce qui est entre-deux se met en page d'abord, le temps d'y aller
  if (LC) LC.regler({ univers: (x) => univers(x).css, effet: {
    arrivee: (fig, ifr) => { if (!permis() || !ifr.animate) return; ifr.style.opacity = '0';
      const montrer = () => { if (ifr.style.opacity !== '0') return; ifr.style.opacity = ''; ifr.animate([{ opacity: 0, transform: 'translateY(5%)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: COURBE }); };
      ifr.addEventListener('load', montrer, { once: true }); setTimeout(montrer, 1500); },
    eteindre: (voile) => voile.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, easing: COURBE }),
    rallumer: (voile) => voile.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: 'ease-out' }).finished,
  } });
  document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('[data-lecteur-va]')) toutRendre(); }, true);
  polices();
  couleursSp();
  monterTete();
  pied.innerHTML = piedHTML();
  router({ initial: true });
  // pendant les temps morts, l'agenda passé est lu d'avance (et relu si D change)
  const plusTard = (f) => ('requestIdleCallback' in window ? requestIdleCallback(f, { timeout: 2000 }) : setTimeout(f, 400));
  const aLire = (S().saisons || []).slice();
  const lireUne = () => {
    const x = aLire.shift(); if (!x) return;
    const sp = retenu(`passe:${x.saison}`, () => saisonPassee(x));
    if (sp) plusTard(() => { miniSaison(sp, sp.rows, 'null|null|'); plusTard(lireUne); }); else plusTard(lireUne);
  };
  plusTard(lireUne);
  const aConvertir = Object.values(D.photos || {});
  const convertir = () => { aConvertir.splice(0, 4).forEach(urlDe); if (aConvertir.length) plusTard(convertir); };
  plusTard(convertir);
  // l'ouverture commune : le grand logo, dans le dégradé prune de la 09 ; la révélation tombe sur le choix des entrées
  INTRO.ouvrir({
    degrade: [[0, '#5f2244'], [0.26, '#3c1630'], [0.55, '#1a0d17'], [1, '#110a0f']],
    encre: '#ffffff',
    classe: 'm09-intro',
    apres: () => entrerChoix($('.choix', vueAccueil)),
  });
  if (INTRO.ouverte() && !MQ_REDUIT.matches) { const c = $('.choix', vueAccueil); if (c) c.classList.add('attend'); }
})();
</script>
