<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compagnie Crescite · Théâtre à Rouen</title>
<meta name="description" content="Compagnie Crescite, théâtre à Rouen depuis 2012 : un spectacle par écran, les prochaines dates et trois portes d’entrée.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --creme:#f3eee9;
  --creme-2:rgba(243,238,233,.76);
  --papier:#f3eee9;
  --encre:#1a1016;
  --encre-2:#5e5158;
  --trait:rgba(26,16,22,.14);
  --nuit:#140c12;
  --magenta:#bc3e80;
  --magenta-vif:#ef84b8;
  --muet:var(--creme-2);
  --marge:clamp(20px,4.2vw,64px);
  --interieur:clamp(40px,6.6vw,120px);
  --tete-h:76px;
  --ease:cubic-bezier(.22,.7,.12,1);
  --t-ouverture:clamp(3rem,min(8.4vw,13.5vh),7.5rem);
  --t-titre:clamp(2.5rem,min(5.6vw,9.4vh),5rem);
  --t-page:clamp(2.5rem,5.2vw,4.75rem);
  --t-grand:clamp(2.125rem,3.6vw,3.25rem);
  --t-moyen:clamp(1.375rem,2vw,1.75rem);
  --t-corps:1.0625rem;
  --t-petit:.875rem;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--nuit);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.aimante{scroll-snap-type:y mandatory}
body{margin:0;background:var(--nuit);color:var(--creme);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--t-corps);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
.serif{font-family:Gloock,Georgia,serif;font-weight:400}

/* lien d'évitement */
.evitement{position:fixed;left:var(--marge);top:12px;z-index:100;padding:10px 18px;border-radius:999px;background:var(--creme);color:var(--encre);font-weight:600;text-decoration:none;transform:translateY(-160%);transition:transform .2s}
.evitement:focus{transform:none}

/* en-tête */
.tete{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--tete-h);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--marge);color:var(--creme);background:rgba(20,12,18,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background-color .45s var(--ease),color .45s var(--ease),box-shadow .45s var(--ease)}
.tete[data-ton="clair"]{background:rgba(243,238,233,.94);color:var(--encre);box-shadow:0 1px 0 var(--trait)}
.tete[data-ton="sombre"]{background:rgba(20,12,18,.92);box-shadow:0 1px 0 rgba(243,238,233,.08)}
.marque{display:inline-flex;align-items:center;gap:12px;text-decoration:none;border-radius:4px}
.marque-pieuvre{width:62px;flex:none;color:#fff;transition:color .45s var(--ease)}
.tete[data-ton="clair"] .marque-pieuvre{color:var(--magenta)}
.marque-pieuvre svg{width:100%;height:auto}
.marque-mot{font-size:1.375rem;font-weight:600;line-height:1;letter-spacing:-.02em;margin-top:-3px}
.nav ul{display:flex;align-items:center;gap:clamp(22px,2.8vw,44px)}
.nav a{position:relative;display:block;padding:10px 0;font-size:1rem;font-weight:500;letter-spacing:.01em;text-decoration:none}
.nav a::before{content:attr(data-texte);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.nav a[aria-current="page"]{font-weight:600}
.nav a[aria-current="page"]::after{height:2px;bottom:4px;background:var(--magenta-vif)}
.tete[data-ton="clair"] .nav a[aria-current="page"]::after{background:var(--magenta)}
.menu-bouton{display:none}

/* sommaire */
.sommaire{display:none}

/* chapitres : base téléphone, photo au-dessus du texte */
.chap{position:relative;isolation:isolate;overflow:hidden;background:var(--fond,var(--nuit));color:var(--creme)}
.chap::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 60% at 50% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 72%)}
.chap-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:color-mix(in srgb,var(--accent) 8%,var(--fond,#000))}
.chap-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%}
.chap-texte{display:flex;flex-direction:column;align-items:flex-start;padding:36px var(--marge) 76px}
.chap-num{font-size:var(--t-petit);font-weight:500;letter-spacing:.2em;color:var(--creme-2);font-variant-numeric:tabular-nums;margin-bottom:16px}
.chap-num b{font-weight:600;color:var(--accent)}
.chap-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-titre);line-height:1;letter-spacing:-.012em;max-width:10.5em;text-wrap:balance}
.chap-sous{margin-top:14px;color:var(--creme-2)}
.chap-accroche{margin-top:28px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;max-width:21em;text-wrap:pretty}
.chap-date{margin-top:32px;max-width:21rem}
.chap-date .surtitre::before{content:"";width:28px;height:2px;background:var(--accent)}
.surtitre{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muet)}
.pastille{display:inline-block;padding:2px 10px 1px;border:1px solid currentColor;border-radius:999px;font-size:.8125rem;font-weight:500;letter-spacing:.04em;text-transform:none;line-height:1.5;white-space:nowrap}
.chap-date-quand{margin-top:10px;font-weight:500;color:var(--creme)}
.chap-date-quand.est-vide{font-weight:400;color:var(--creme-2)}
.chap-date-ou{color:var(--creme-2)}
.chap-date-ou span{display:block}
.bouton{display:inline-flex;align-items:center;gap:14px;margin-top:34px;padding:15px 22px 15px 26px;border-radius:999px;background:var(--accent);color:var(--fond,var(--nuit));font-weight:600;font-size:1rem;line-height:1.2;text-decoration:none;transition:box-shadow .45s var(--ease)}
.bouton .fleche{display:inline-block;transition:transform .45s var(--ease)}
.bouton:hover{box-shadow:0 14px 34px -14px color-mix(in srgb,var(--accent) 80%,transparent)}
.bouton:hover .fleche{transform:translateX(5px)}
.bouton:focus-visible{outline-color:var(--creme)}

/* chapitre 0 : la compagnie */
.chap-0{--fond:var(--nuit);--accent:var(--magenta-vif);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;padding:calc(var(--tete-h) + 24px) var(--marge) 132px;text-align:center}
.chap-0::before{background:radial-gradient(36% 42% at 50% 41%,rgba(188,62,128,.46),rgba(188,62,128,0) 100%),radial-gradient(80% 50% at 50% 100%,rgba(188,62,128,.14),transparent 70%)}
.chap0-logo{width:min(78vw,50vh);color:#fff}
.chap0-svg svg{width:100%;height:auto}
.chap0-intention{margin-top:clamp(28px,5vh,52px);font-family:Gloock,Georgia,serif;font-size:clamp(1.375rem,min(2.3vw,3.6vh),2rem);line-height:1.3;max-width:26em;text-wrap:balance}
.chap0-indice{position:absolute;left:0;right:0;bottom:clamp(24px,5vh,48px);display:flex;flex-direction:column;align-items:center;gap:14px;width:max-content;margin:0 auto;font-size:var(--t-petit);font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--creme-2);text-decoration:none;border-radius:4px}
.chap0-indice:hover{color:var(--creme)}
.indice-trait{position:relative;display:block;width:1px;height:36px;overflow:hidden;background:rgba(243,238,233,.22)}
.indice-trait::after{content:"";position:absolute;left:0;top:0;width:1px;height:100%;background:var(--creme);transform:scaleY(.35);transform-origin:top}

/* zone libre, sur papier */
.libre{background:var(--papier);color:var(--encre);--muet:var(--encre-2)}
.bloc{padding:clamp(88px,14vh,150px) var(--marge)}
.bloc + .bloc{padding-top:0}
.bloc + .bloc > .grille{border-top:1px solid var(--trait);padding-top:clamp(64px,10vh,112px)}
.grille{display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(16px,2.2vw,32px);max-width:1320px;margin:0 auto}
.bloc-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-grand);line-height:1.04;letter-spacing:-.01em;margin-top:14px;text-wrap:balance}
.bloc-intro{margin-top:18px;color:var(--muet);max-width:24em}
.agenda-corps{margin-top:clamp(36px,6vh,56px)}
.bouton-texte{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:13px 22px;border:1px solid currentColor;border-radius:999px;font-weight:600;font-size:1rem;line-height:1.2;transition:background-color .3s,color .3s}
.bouton-texte:hover{background:var(--encre);color:var(--papier)}

/* listes de dates */
.dates-mois{display:flex;align-items:center;gap:14px;margin-top:44px;padding-bottom:12px;border-bottom:1px solid var(--encre);font-size:var(--t-petit);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.dates > .dates-mois:first-child{margin-top:0}
.date{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:4px 18px;padding:18px 0 20px;border-bottom:1px solid var(--trait)}
.date > p{min-width:0}
.date-quand{grid-row:span 4}
.date-num{display:block;font-family:Gloock,Georgia,serif;font-size:1.625rem;line-height:1.08}
.date-js{display:block;margin-top:6px;font-size:var(--t-petit);color:var(--muet)}
.date-quoi a{display:inline-flex;align-items:baseline;gap:10px;font-weight:600;text-decoration:none}
.date-quoi a:hover{text-decoration:underline}
.date-point{flex:none;width:9px;height:9px;border-radius:50%;background:var(--point);transform:translateY(-1px)}
.date-ville{display:block;font-weight:500}
.date-quoi + .date-ou .date-ville{font-weight:400}
.date-lieu{display:block;color:var(--muet)}
.date-public .pastille{color:var(--muet)}
.date-action a{font-weight:600;white-space:nowrap}
.date-action:empty{display:none}

/* trois portes */
.portes .bloc-tete{margin-bottom:40px}
.portes-liste{display:grid;gap:56px}
.porte{display:flex;flex-direction:column;align-items:flex-start;border-top:3px solid var(--porte);padding-top:26px}
.porte-num{font-size:var(--t-petit);font-weight:600;letter-spacing:.2em;color:var(--porte)}
.porte-titre{margin-top:14px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.12;text-wrap:balance}
.porte-texte{margin-top:14px;max-width:24em}
.porte-detail{margin-top:10px;color:var(--muet);max-width:24em}
.porte-lien{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding-bottom:3px;border-bottom:1px solid currentColor;font-weight:600;text-decoration:none}
.porte-lien span{color:var(--porte);transition:transform .45s var(--ease)}
.porte-lien:hover span{transform:translateX(4px)}

/* la compagnie */
.compagnie-lead{margin-top:26px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.34;max-width:24em;text-wrap:pretty}
.compagnie-ms{margin-top:22px;color:var(--muet)}
.chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px;margin-top:56px;align-content:start}
.chiffres > div{display:flex;flex-direction:column-reverse;justify-content:flex-end;border-top:1px solid var(--trait);padding-top:18px}
.chiffres dd{font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1;font-variant-numeric:lining-nums}
.chiffres dt{margin-top:10px;color:var(--muet);max-width:14em}
.chiffres-source{margin-top:28px;font-size:var(--t-petit);color:var(--muet)}

/* les onglets : une page par entrée du menu, sur papier */
.page > .bloc:first-child{padding-top:calc(var(--tete-h) + clamp(48px,9vh,104px))}
.page-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-page);line-height:1;letter-spacing:-.012em;margin-top:16px;text-wrap:balance}
.page-intro{margin-top:22px;color:var(--muet);max-width:30em}
.section-tete .bloc-titre{margin-top:0}
.section-corps{margin-top:32px}

/* répertoire */
.repertoire{display:grid;grid-template-columns:minmax(0,1fr);margin-top:clamp(40px,7vh,72px);border-top:1px solid var(--encre)}
.carte{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:0 18px;align-items:start;padding:20px 0;border-bottom:1px solid var(--trait)}
.carte-photo{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--fond)}
.carte-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%;transition:transform 1.2s var(--ease)}
.carte:hover .carte-photo img{transform:scale(1.04)}
.carte-num{font-size:var(--t-petit);font-weight:600;letter-spacing:.2em;color:var(--ink);font-variant-numeric:tabular-nums}
.carte-titre{margin-top:6px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:1.5rem;line-height:1.1;text-wrap:balance}
.carte-titre a{text-decoration:none}
.carte-titre a::after{content:"";position:absolute;inset:0}
.carte-titre a:focus-visible{outline:none}
.carte:has(a:focus-visible){outline:2px solid var(--encre);outline-offset:6px}
.carte:hover .carte-titre a{text-decoration:underline}
.carte-sous{margin-top:6px;color:var(--muet)}
.carte-date{margin-top:14px;font-weight:500}
.carte-date.est-vide{font-weight:400;color:var(--muet)}
.carte-date .surtitre{margin-bottom:4px}

/* la compagnie : intention, plateau, partenaires */
.intention-pieuvre{display:block;width:84px;margin-bottom:24px;color:var(--magenta)}
.intention-pieuvre svg{width:100%;height:auto}
.intention-texte{font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.14;letter-spacing:-.008em;max-width:20em;text-wrap:balance}
.artistes,.partenaires-liste{display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(20px,2.6vw,40px);border-top:1px solid var(--encre)}
.artistes li,.partenaires-liste li{display:flex;flex-direction:column;padding:14px 0 15px;border-bottom:1px solid var(--trait)}
.artiste-nom{font-weight:600}
.artiste-pieces{color:var(--muet)}

/* contact */
.contact-adresse{margin-top:18px;font-style:normal;color:var(--muet)}
.lettre{margin-top:56px;padding-top:18px;border-top:1px solid var(--encre);max-width:26em}
.lettre p + p{margin-top:8px}
.porte-ligne{display:block}
.porte-ligne + .porte-ligne{margin-top:4px}

/* pied de page */
.pied{background:var(--nuit);color:var(--creme);padding:clamp(80px,13vh,136px) var(--marge) 36px;--muet:var(--creme-2)}
.pied .grille{row-gap:48px}
.pied-courriel,.contact-courriel{display:inline-block;margin-top:16px;font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.08;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease);word-break:break-word}
.pied-courriel:hover,.contact-courriel:hover{background-size:100% 1px}
.contact-courriel{margin-top:32px}
.pied-adresse{margin-top:20px;color:var(--creme-2);font-style:normal}
.pied-titre{font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--creme-2);margin-bottom:14px}
.pied-liste li + li{margin-top:6px}
.pied-bas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;margin-top:clamp(64px,10vh,104px);padding-top:26px;border-top:1px solid rgba(243,238,233,.14);color:var(--creme-2);font-size:var(--t-petit)}
.pied-marque{display:flex;align-items:center;gap:14px}
.pied-pieuvre{width:44px;color:var(--creme)}
.pied-pieuvre svg{width:100%;height:auto}
.pied-nav ul{display:flex;flex-wrap:wrap;gap:8px 26px}
.pied-nav a{text-decoration:none}
.pied-nav a:hover{text-decoration:underline}

/* page spectacle : l'ouverture */
.ouverture{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:var(--fond);color:var(--creme)}
.ouv-photo{position:relative;flex:none;height:60vh;height:60svh;overflow:hidden}
.ouv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%}
.ouv-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--fond) 0%,var(--fond) 4%,color-mix(in srgb,var(--fond) 0%,transparent) 46%),linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 26%)}
.ouv-contenu{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--marge) 44px}
.retour{display:inline-flex;align-items:center;gap:10px;font-weight:500;text-decoration:none;border-radius:4px}
.retour span{transition:transform .45s var(--ease)}
.retour:hover span{transform:translateX(-4px)}
.ouv-haut{position:absolute;top:calc(var(--tete-h) + 18px);left:var(--marge);right:var(--marge);z-index:2;display:flex;justify-content:space-between;gap:20px;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.ouv-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-ouverture);line-height:.96;letter-spacing:-.015em;max-width:11em;text-wrap:balance}
.ouv-sous{margin-top:18px;font-size:1.125rem;color:var(--creme-2)}
.ouv-credit{position:absolute;right:var(--marge);bottom:14px;z-index:2;font-size:.75rem;color:rgba(243,238,233,.7);text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* page spectacle : le contenu calme */
.papier{background:var(--papier);color:var(--encre);--muet:var(--encre-2)}
.fiche-intro{padding:clamp(72px,12vh,128px) var(--marge) clamp(56px,9vh,96px)}
.fiche-accroche{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-grand);line-height:1.12;letter-spacing:-.008em;text-wrap:balance;max-width:19em}
.fiche-accroche::before{content:"";display:block;width:44px;height:3px;background:var(--ink);margin-bottom:32px}
.fiche-texte{margin-top:44px;font-size:1.125rem;line-height:1.7;max-width:36em}
.fiche-texte p + p{margin-top:18px}
.lien-fleche{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.faits{margin-top:48px;border-top:1px solid var(--encre)}
.faits > div{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--trait)}
@media (min-width:960px){.faits > div{grid-template-columns:10.5rem minmax(0,1fr)}}
.faits dt{color:var(--muet)}
.faits dd{font-weight:500}
.faits .equipe li{font-weight:400}
.faits .equipe li + li{margin-top:4px}
.equipe-role{color:var(--muet)}
.a-fournir{color:var(--muet);font-weight:400;font-style:normal;border-bottom:1px dashed currentColor}

.fiche-portes{padding:0 var(--marge) clamp(88px,14vh,140px)}
.fiche-portes > .grille{border-top:1px solid var(--trait);padding-top:clamp(64px,10vh,104px)}
.onglets{display:grid;grid-template-columns:minmax(0,1fr);margin-top:36px;border-bottom:1px solid var(--trait)}
.onglet{position:relative;display:flex;align-items:baseline;gap:14px;padding:16px 0 18px;color:var(--muet);transition:color .3s}
.onglet::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
.onglet:hover{color:var(--encre)}
.onglet[aria-selected="true"]{color:var(--encre)}

/* spectacle suivant */

.suivant-photo{position:relative;overflow:hidden;aspect-ratio:16/10}
.suivant-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%;transition:transform 1.4s var(--ease)}
.suivant-lien:hover .suivant-photo img{transform:scale(1.04)}
.suivant-texte{display:flex;flex-direction:column;align-items:flex-start;padding:36px var(--marge) 72px}
.suivant-titre{margin-top:18px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-titre);line-height:1;letter-spacing:-.012em;text-wrap:balance}
.suivant-sous{margin-top:14px;color:var(--creme-2)}
.suivant-fleche{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;margin-top:34px;border-radius:50%;background:var(--accent);color:var(--fond);font-size:1.5rem;transition:transform .5s var(--ease)}

/* téléphone : menu repliable */
@media (max-width:719px){

  .menu-icone::before,.menu-icone::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .35s var(--ease),top .35s var(--ease)}
  .menu-icone::before{top:0}
  .menu-icone::after{top:8.5px}
  .tete.menu-ouvert .menu-icone::before{top:4.25px;transform:rotate(45deg)}
  .tete.menu-ouvert .menu-icone::after{top:4.25px;transform:rotate(-45deg)}
  .nav{position:fixed;left:0;right:0;top:var(--tete-h);bottom:0;display:none;overflow:auto;padding:28px var(--marge) 40px;background:var(--nuit);color:var(--creme)}
  .tete.menu-ouvert{background:var(--nuit);color:var(--creme);box-shadow:0 1px 0 rgba(243,238,233,.1);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tete.menu-ouvert .marque-pieuvre{color:#fff}
  .tete.menu-ouvert .nav{display:block}
  .nav ul{flex-direction:column;align-items:stretch;gap:0}
  .nav li{border-bottom:1px solid rgba(243,238,233,.12)}
  .nav a{padding:16px 0;font-family:Gloock,Georgia,serif;font-weight:400;font-size:2rem;line-height:1.2}
  .nav a::after{display:none}
  .nav a[aria-current="page"]{font-weight:400;color:var(--magenta-vif)}
  .nav a[aria-current="page"]::after{display:block;left:auto;right:2px;top:50%;bottom:auto;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);background:var(--magenta-vif)}
  .tete[data-ton="clair"] .nav a[aria-current="page"]::after{background:var(--magenta-vif)}
  .chap-0{padding-bottom:120px}
  .date{grid-template-columns:6.5rem minmax(0,1fr)}
  .date-num{font-size:1.375rem}

}

/* tablette et plus */
@media (min-width:720px){
  .date{grid-template-columns:8.5rem minmax(0,1fr) minmax(0,1.2fr) auto;align-items:start;gap:0 24px}
  .date-quand{grid-row:1/span 2}
  .date-quoi{grid-column:2;grid-row:1/span 2}
  .date-ou{grid-column:3;grid-row:1/span 2}
  .date-public{grid-column:4;grid-row:1;text-align:right}
  .date-action{grid-column:4;grid-row:2;text-align:right;margin-top:10px}
  .dates-liste--seule .date{grid-template-columns:8.5rem minmax(0,1fr) auto}
  .dates-liste--seule .date-ou{grid-column:2}
  .dates-liste--seule .date-public,.dates-liste--seule .date-action{grid-column:3}
  .portes-liste{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,auto);gap:0 clamp(20px,2.6vw,40px)}

  .repertoire{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,3vw,40px)}
  .carte{grid-template-columns:128px minmax(0,1fr);gap:0 22px}
  .artistes,.partenaires-liste{grid-template-columns:repeat(2,minmax(0,1fr))}
  .onglets{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(20px,2.6vw,40px)}
  .onglet{flex-direction:column;align-items:flex-start;gap:10px;padding:0 0 22px}
  .panneau-grille{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,96px)}
  .suivant-lien{display:grid;grid-template-columns:1fr 1fr;min-height:min(80vh,780px)}

  .suivant-texte{justify-content:center;padding:96px var(--marge) 96px var(--interieur)}

/* bureau : un chapitre par écran */
@media (min-width:1024px) and (min-height:600px){
  .tete[data-ton="chapitre"]{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:0 1px 14px rgba(0,0,0,.35)}
  .tete[data-ton="chapitre"] .marque-pieuvre{filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))}
  .chap{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always}
  .chap:not(.chap-0)::before{background:radial-gradient(60% 70% at var(--lueur,72%) 58%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 72%)}
  .chap[data-photo="droite"]{--lueur:28%}
  .chap[data-photo="droite"] .chap-photo{order:2}
  .chap-photo{aspect-ratio:auto;min-height:100%}
  .chap-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 22%),linear-gradient(0deg,rgba(0,0,0,.32),rgba(0,0,0,0) 26%)}
  .chap[data-photo="droite"] .chap-photo::after{background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 22%),radial-gradient(75% 55% at 100% 100%,rgba(0,0,0,.66),rgba(0,0,0,0) 72%)}
  .chap-texte{justify-content:center;padding:calc(var(--tete-h) + 3vh) var(--marge) 7vh var(--interieur)}
  .chap[data-photo="droite"] .chap-texte{padding-left:var(--marge);padding-right:var(--interieur)}
  .chap-num{margin-bottom:clamp(16px,3.2vh,30px)}
  .chap-sous{margin-top:clamp(10px,1.8vh,18px)}
  .chap-accroche{margin-top:clamp(20px,4.2vh,40px);font-size:min(var(--t-moyen),3.3vh)}
  .chap-date{margin-top:clamp(22px,4.4vh,42px)}
  .bouton{margin-top:clamp(22px,4vh,38px)}
  .chap-0{display:flex;min-height:100vh}
  .chap0-logo{width:min(40vw,60vh)}
  .fin{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding-top:calc(var(--tete-h) + 40px);padding-bottom:72px;scroll-snap-align:start;scroll-margin-bottom:400vh}
  .fin > .grille{width:100%}

  .sommaire{display:block;position:fixed;right:var(--marge);bottom:clamp(28px,5.5vh,52px);z-index:40;transition:opacity .45s var(--ease),visibility .45s}
  .sommaire.est-cache{opacity:0;visibility:hidden}
  .sommaire ol{display:flex;flex-direction:column;align-items:flex-end}
  .sommaire button{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:24px;padding-left:18px;color:var(--creme);border-radius:3px}
  .som-titre{padding:3px 10px;border-radius:999px;background:rgba(12,7,10,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:var(--t-petit);font-weight:500;letter-spacing:.01em;line-height:1.4;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease),transform .5s var(--ease)}
  .som-trait{display:block;width:18px;height:1.5px;border-radius:1px;background:currentColor;opacity:.5;box-shadow:0 0 8px rgba(0,0,0,.4);transition:width .55s var(--ease),opacity .35s,background-color .35s}
  .sommaire button:hover .som-trait{width:28px;opacity:.9}
  .sommaire button:hover .som-titre,.sommaire button:focus-visible .som-titre,.sommaire [aria-current="true"] .som-titre{opacity:1;transform:none}
  .sommaire [aria-current="true"] .som-trait{width:48px;opacity:1;background:var(--som-accent,var(--creme))}
  .sommaire button:focus-visible{outline-offset:3px}

  .ouverture{display:block}
  .ouv-photo{position:absolute;inset:0;height:auto;z-index:-2}
  .ouv-photo::after{background:linear-gradient(90deg,var(--fond) 0%,color-mix(in srgb,var(--fond) 78%,transparent) 30%,color-mix(in srgb,var(--fond) 0%,transparent) 66%),linear-gradient(0deg,var(--fond) 0%,color-mix(in srgb,var(--fond) 0%,transparent) 50%),linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 24%)}
  .ouv-contenu{position:absolute;inset:auto 0 0 0;padding:0 var(--marge) clamp(56px,10vh,104px)}
  .ouv-credit{bottom:22px}
}

@media (min-width:1024px) and (min-height:600px) and (max-height:820px){
  .chap-texte{padding-top:calc(var(--tete-h) + 6px);padding-bottom:28px}
  .chap-titre{font-size:clamp(2.5rem,min(5.6vw,8.8vh),5rem)}
  .chap-num{margin-bottom:14px}
  .chap-sous{margin-top:8px}
  .chap-accroche{margin-top:18px;font-size:min(var(--t-moyen),3.1vh)}
  .chap-date{margin-top:22px}
  .bouton{margin-top:22px;padding-top:13px;padding-bottom:13px}
  .chap-0{padding-bottom:104px}
  .chap0-logo{width:min(40vw,54vh)}
}

/* animations */
@media (prefers-reduced-motion:no-preference){
  .chap0-svg{animation:entree 1.5s var(--ease) both .1s}
  .chap0-intention{animation:entree 1.3s var(--ease) both .5s}
  .chap0-indice{animation:fondu 1.2s var(--ease) both 1.1s}
  .indice-trait::after{animation:coule 2.6s cubic-bezier(.65,0,.35,1) infinite 1.8s}
  .chap.arme .chap-photo{clip-path:inset(0 100% 0 0)}
  .chap.arme .chap-photo img{transform:scale(1.08)}
  .chap.arme .chap-texte > *{opacity:0;transform:translateY(26px)}
  .chap.arme.vu .chap-photo{clip-path:inset(0);transition:clip-path 900ms cubic-bezier(.77,0,.18,1)}
  .chap.arme.vu .chap-photo img{transform:none;transition:transform 1600ms var(--ease)}
  .chap.arme.vu .chap-texte > *{opacity:1;transform:none;transition:opacity .8s var(--ease),transform 1s var(--ease)}
  .chap.arme.vu .chap-texte > :nth-child(1){transition-delay:.25s}
  .chap.arme.vu .chap-texte > :nth-child(2){transition-delay:.32s}
  .chap.arme.vu .chap-texte > :nth-child(3){transition-delay:.4s}
  .chap.arme.vu .chap-texte > :nth-child(4){transition-delay:.48s}
  .chap.arme.vu .chap-texte > :nth-child(5){transition-delay:.56s}
  .chap.arme.vu .chap-texte > :nth-child(6){transition-delay:.64s}
  .ouv-photo{animation:devoile 900ms cubic-bezier(.77,0,.18,1) both .05s}
  .ouv-photo img{animation:recule 1.6s var(--ease) both .05s}
  .ouv-haut,.ouv-contenu > *{animation:entree 1s var(--ease) both .45s}
  .ouv-contenu > :nth-child(2){animation-delay:.53s}
  .ouv-contenu > :nth-child(3){animation-delay:.61s}
}
@keyframes entree{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes coule{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes devoile{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes recule{from{transform:scale(1.08)}to{transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');
  const deux = (n) => String(n).padStart(2, '0');
  const t = (s) => esc(s).replace(/ ([:;!?»–])/g, '\u00a0$1').replace(/« /g, '«\u00a0');

  const SHOWS = D.shows;
  const DATES = D.dates;
  const TOTAL = deux(SHOWS.length);
  const LIMITE = 6;
  const PAR_SLUG = Object.fromEntries(SHOWS.map((s) => [s.slug, s]));
  const C = D.company;
  const MQ_LARGE = matchMedia('(min-width: 1024px) and (min-height: 600px)');
  const MQ_REDUIT = matchMedia('(prefers-reduced-motion: reduce)');
  const doc = document.documentElement;
  const tete = $('#tete');
  const sommaire = $('#sommaire');
  const vueAccueil = $('#vue-accueil');
  const vueSpectacle = $('#vue-spectacle');
  const vuePage = $('#vue-page');
  const pied = $('#pied');
  const courriel = `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`;

  /* une couleur de spectacle, assombrie pour se lire sur le papier */
  const canal = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const rvb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = (h) => { const [r, g, b] = rvb(h).map(canal); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const encre = (h, fond = '#f3eee9', cible = 4.8) => {
    let [r, g, b] = rvb(h); let c = h;
    while (contraste(c, fond) < cible && r + g + b > 0) {
      r = Math.floor(r * 0.92); g = Math.floor(g * 0.92); b = Math.floor(b * 0.92);
      c = '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
    }
    return c;
  };

  /* dates */
  const datesDe = (slug) => DATES.filter((d) => d.slug === slug);
  const dateLongue = (d) => (d.precision === 'day' && d.iso === d.fin ? `${cap(d.joursemLong)} ${d.label}` : cap(d.label));
  const partieJour = (d) => {
    if (d.precision === 'month') return d.moisLong;
    const j = d.label.replace(` ${d.moisLong} ${d.annee}`, '');
    return d.precision === 'range' ? j.replace(/^du (\S+) au (\S+)$/, '$1 – $2') : j;
  };
  const sousJour = (d) => (d.precision === 'month' ? 'jour à préciser' : d.iso === d.fin ? d.joursemLong : '');

  function listeDates(liste, avecTitre, niveau = 'h3') {
    const groupes = [];
    for (const d of liste) {
      const cle = `${d.moisLong} ${d.annee}`;
      const g = groupes[groupes.length - 1];
      if (g && g.cle === cle) g.items.push(d); else groupes.push({ cle, items: [d] });
    }
    return `<div class="dates">${groupes.map((g) => `
      <${niveau} class="dates-mois">${esc(cap(g.cle))}</${niveau}>
      <ul class="dates-liste${avecTitre ? '' : ' dates-liste--seule'}">${g.items.map((d) => ligneDate(d, avecTitre)).join('')}</ul>`).join('')}</div>`;
  }
  function ligneDate(d, avecTitre) {
    const s = PAR_SLUG[d.slug];
    const sous = sousJour(d);
    const reserver = d.lien
      ? `<a href="${esc(d.lien)}" target="_blank" rel="noopener">Réserver<span class="sr"> : ${esc(d.titre)}, ${esc(dateLongue(d))}, ${esc(d.commune)} (nouvel onglet)</span><span aria-hidden="true"> ↗</span></a>`
      : '';
    return `<li class="date" style="--point:${s ? encre(s.couleur) : 'currentColor'}">

  /* onglets accessibles */
  function brancherOnglets(racine) {
    const tabs = $$('[role="tab"]', racine);
    const choisir = (t, focus) => {
      for (const x of tabs) {
        const on = x === t;
        x.setAttribute('aria-selected', String(on));
        x.tabIndex = on ? 0 : -1;
        document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
      }
      if (focus) t.focus();
    };
    tabs.forEach((t, k) => {
      t.addEventListener('click', () => choisir(t, false));
      t.addEventListener('keydown', (e) => {
        const pas = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        let j = null;
        if (pas) j = (k + pas + tabs.length) % tabs.length;
        else if (e.key === 'Home') j = 0;
        else if (e.key === 'End') j = tabs.length - 1;
        if (j !== null) { e.preventDefault(); choisir(tabs[j], true); }
      });
    });
  }

  /* montage */
  $('#marque-pieuvre').innerHTML = D.logo.octopus;
  pied.innerHTML = piedHTML();
  vueAccueil.innerHTML = accueilHTML();
  $('ol', sommaire).innerHTML = [{ titre: 'Crescite' }, ...SHOWS].map((s, k) =>
    `<li><button type="button" data-cible="${k}"><span class="som-titre">${esc(s.titre)}</span><span class="som-trait" aria-hidden="true"></span></button></li>`).join('');
  const chapitres = $$('.chap', vueAccueil);
  const boutonsSommaire = $$('button', sommaire);

  /* état au défilement : ton de l'en-tête, repère actif du sommaire */
  let vue = null;
  let zones = [];
  let actif = null;
  function majSommaire(k) {
    if (k === actif) return;
    actif = k;
    sommaire.classList.toggle('est-cache', k < 0);
    boutonsSommaire.forEach((b, j) => { if (j === k) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
    if (k >= 0) sommaire.style.setProperty('--som-accent', k ? SHOWS[k - 1].couleur : getComputedStyle(doc).getPropertyValue('--magenta-vif'));
  }
  function majEtat() {
    const y = tete.offsetHeight / 2;
    let ton = 'chapitre';
    for (const el of zones) {
      const r = el.getBoundingClientRect();
      if (r.top <= y && r.bottom > y) { ton = el.dataset.ton; break; }
    }
    tete.dataset.ton = ton;
    if (vue !== 'accueil') { majSommaire(-1); return; }
    const milieu = innerHeight / 2;
    let k = -1;
    for (const c of chapitres) {
      const r = c.getBoundingClientRect();
      if (r.top <= milieu && r.bottom > milieu) { k = +c.dataset.chap; break; }
    }
    majSommaire(k);
  }
  let rafEtat = 0;
  const planifier = () => { if (!rafEtat) rafEtat = requestAnimationFrame(() => { rafEtat = 0; majEtat(); }); };
  addEventListener('scroll', planifier, { passive: true });
  addEventListener('resize', planifier);

  /* magnétisme : seulement sur l'accueil, en grand écran, sans réduction des animations */
  const majAimant = () => doc.classList.toggle('aimante', vue === 'accueil' && MQ_LARGE.matches && !MQ_REDUIT.matches);
  MQ_LARGE.addEventListener('change', () => { majAimant(); planifier(); });
  MQ_REDUIT.addEventListener('change', majAimant);

  /* dévoilement : armé au premier geste, pour que rien ne reste caché sans défilement */
  const revele = new IntersectionObserver((entrees) => {
    for (const e of entrees) if (e.isIntersecting) { e.target.classList.add('vu'); revele.unobserve(e.target); }
  }, { threshold: 0.3 });
  const gestes = ['wheel', 'touchstart', 'keydown', 'pointerdown', 'scroll'];
  function armer() {
    gestes.forEach((t) => removeEventListener(t, armer, true));
    if (MQ_REDUIT.matches) return;
    for (const c of chapitres.slice(1)) {
      const r = c.getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= innerHeight) { c.classList.add('arme'); revele.observe(c); }
    }
  }
  gestes.forEach((t) => addEventListener(t, armer, { capture: true, passive: true }));

  const allerA = (el, doux) => {
    if (!el) return;
    scrollTo({ top: el.getBoundingClientRect().top + scrollY, behavior: doux && !MQ_REDUIT.matches ? 'smooth' : 'auto' });
  };
  boutonsSommaire.forEach((b) => b.addEventListener('click', () => allerA($(`#chap-${b.dataset.cible}`), true)));

  /* listes de dates : afficher toutes les dates, ou moins */
  function brancherDepli(bouton, boite, liste, avecTitre, limite) {
    if (!bouton) return;
    bouton.addEventListener('click', () => {
      const ouvert = bouton.getAttribute('aria-expanded') === 'true';
      boite.innerHTML = listeDates(ouvert ? liste.slice(0, limite) : liste, avecTitre);
      bouton.setAttribute('aria-expanded', String(!ouvert));
      bouton.textContent = ouvert ? `Afficher les ${liste.length} dates` : 'Afficher moins de dates';
      if (ouvert) bouton.scrollIntoView({ block: 'nearest' });
      planifier();
    });
  }

  /* menu du téléphone */
  const bMenu = $('#menu-bouton');
  const menu = (ouvrir) => {
    tete.classList.toggle('menu-ouvert', ouvrir);
    bMenu.setAttribute('aria-expanded', String(ouvrir));
    $('.menu-texte', bMenu).textContent = ouvrir ? 'Fermer' : 'Menu';
  };
  bMenu.addEventListener('click', () => menu(bMenu.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && tete.classList.contains('menu-ouvert')) { menu(false); bMenu.focus(); } });

  /* l'indice du premier écran fait défiler jusqu'au premier spectacle */
  $('.chap0-indice', vueAccueil).addEventListener('click', (e) => {
    e.preventDefault();
    allerA($('#chap-1'), true);
    const h = $('#t-chap-1');
    h.tabIndex = -1;
    h.focus({ preventScroll: true });
  });

  /* routeur : une vue par onglet ; l'aimant et le sommaire n'existent que sur l'accueil */
  const PAGES = {
    spectacles: ['Les spectacles', pageSpectacles],
    agenda: ['L’agenda', pageAgenda],
    compagnie: ['La compagnie', pageCompagnie],
    contact: ['Contact', pageContact],
  };
  const liensNav = $$('[data-onglet]', tete);
  function router(initial) {
    const h = location.hash || '#/';
    if (!h.startsWith('#/') && vue) return;
    menu(false);
    const chemin = h.replace(/^#\/?/, '').split('?')[0];
    const m = chemin.match(/^spectacle\/([\w-]+)$/);
    const s = m && PAR_SLUG[m[1]];
    const page = !s && Object.hasOwn(PAGES, chemin) ? PAGES[chemin] : null;
    vue = s ? 'spectacle' : page ? chemin : 'accueil';
    doc.classList.remove('aimante');
    vueAccueil.hidden = vue !== 'accueil';
    vuePage.hidden = !page;
    vueSpectacle.hidden = !s;
    vuePage.innerHTML = page ? page[1]() : '';
    vueSpectacle.innerHTML = s ? spectacleHTML(s) : '';
    let titre;
    if (s) {
      brancherOnglets(vueSpectacle);
      brancherDepli($('#fiche-dates-tout'), $('#fiche-dates'), datesDe(s.slug), false, LIMITE);
      document.title = `${s.titre} · Compagnie Crescite`;
      titre = $('#t-fiche');
    } else if (page) {
      document.title = `${page[0]} · Compagnie Crescite`;
      titre = $('#t-page');
    } else {
      document.title = 'Compagnie Crescite · Théâtre à Rouen';
      titre = $('#t-chap-0');
    }
    const onglet = s ? 'spectacles' : page ? chemin : '';
    for (const a of liensNav) {
      if (a.dataset.onglet === onglet) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    sommaire.hidden = vue !== 'accueil';
    zones = [...$$('[data-ton]', s ? vueSpectacle : page ? vuePage : vueAccueil), pied];
    scrollTo(0, 0);
    majAimant();
    actif = null;
    majEtat();
    if (!initial && titre) titre.focus({ preventScroll: true });
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); router(false); }
  });
  $('.evitement').addEventListener('click', (e) => { e.preventDefault(); $('#contenu').focus(); });
  addEventListener('hashchange', () => router(false));
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  router(true);
})();
</script>
</body>
</html>
