<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<style>
:root{
  --creme:#f3eee9;
  --creme-2:rgba(243,238,233,.76);
  --creme-035:rgba(243,238,233,.035);
  --creme-04:rgba(243,238,233,.04);
  --creme-05:rgba(243,238,233,.05);
  --creme-12:rgba(243,238,233,.12);
  --creme-14:rgba(243,238,233,.14);
  --creme-15:rgba(243,238,233,.15);
  --creme-16:rgba(243,238,233,.16);
  --creme-18:rgba(243,238,233,.18);
  --creme-22:rgba(243,238,233,.22);
  --creme-24:rgba(243,238,233,.24);
  --creme-30:rgba(243,238,233,.3);
  --creme-32:rgba(243,238,233,.32);
  --creme-34:rgba(243,238,233,.34);
  --creme-36:rgba(243,238,233,.36);
  --creme-40:rgba(243,238,233,.4);
  --creme-45:rgba(243,238,233,.45);
  --creme-72:rgba(243,238,233,.72);
  --creme-95:rgba(243,238,233,.95);
  --blanc:#ffffff;
  --blanc-18:rgba(255,255,255,.18);
  --blanc-72:rgba(255,255,255,.72);
  --blanc-84:rgba(255,255,255,.84);
  --blanc-86:rgba(255,255,255,.86);
  --noir:#000000;
  --noir-0:rgba(0,0,0,0);
  --noir-25:rgba(0,0,0,.25);
  --noir-35:rgba(0,0,0,.35);
  --noir-36:rgba(0,0,0,.36);
  --noir-40:rgba(0,0,0,.4);
  --noir-42:rgba(0,0,0,.42);
  --noir-45:rgba(0,0,0,.45);
  --noir-50:rgba(0,0,0,.5);
  --noir-55:rgba(0,0,0,.55);
  --noir-60:rgba(0,0,0,.6);
  --noir-70:rgba(0,0,0,.7);
  --noir-74:rgba(0,0,0,.74);
  --noir-80:rgba(0,0,0,.8);
  --papier:#f3eee9;
  --encre:#1a1016;
  --encre-2:#5e5158;
  --trait:rgba(26,16,22,.14);
  --nuit:#140c12;
  --nuit-2:#1d1219;
  --nuit-88:rgba(20,12,18,.88);
  --nuit-62:rgba(20,12,18,.62);
  --nuit-50:rgba(20,12,18,.5);
  --choix-1:#3c1630;
  --choix-2:#1a0d17;
  --choix-3:#110a0f;
  --ombre-18:rgba(12,7,10,.18);
  --ombre-52:rgba(12,7,10,.52);
  --ombre-66:rgba(12,7,10,.66);
  --ombre-80:rgba(12,7,10,.8);
  --ombre-85:rgba(12,7,10,.85);
  --chap-tete-1:rgba(10,6,9,.62);
  --chap-tete-0:rgba(10,6,9,0);
  --cast-1:rgba(10,5,10,.9);
  --cast-2:rgba(10,5,10,.55);
  --magenta:#bc3e80;
  --magenta-0:rgba(188,62,128,0);
  --magenta-08:rgba(188,62,128,.08);
  --magenta-14:rgba(188,62,128,.14);
  --magenta-30:rgba(188,62,128,.3);
  --magenta-texte:#a8306f;
  --magenta-vif:#ef84b8;
  --magenta-vif-10:rgba(239,132,184,.1);
  --muet:var(--creme-2);
  --marge:clamp(16px,4.2vw,64px);
  --interieur:clamp(40px,6.6vw,120px);
  --tete-h:76px;
  --barre-h:0px;
  --ease:cubic-bezier(.22,.7,.12,1);
  --t-ouverture:clamp(2.85rem,min(8.8vw,14vh),7.75rem);
  --t-titre:clamp(2.4rem,min(6.2vw,10.2vh),5.6rem);
  --t-page:clamp(2.125rem,5.2vw,4.75rem);
  --t-grand:clamp(1.875rem,3.6vw,3.25rem);
  --t-moyen:clamp(1.25rem,2vw,1.75rem);
  --t-corps:1.0625rem;
  --t-petit:.875rem;
  /* l'édition sur place (EDITION), dans le style de la 09 : papier crème, encre prune, magenta */
  --ed-fond:#f3eee9;
  --ed-encre:#1a1016;
  --ed-accent:#a8306f;
  --ed-sur-accent:#ffffff;
  --ed-police:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ed-rayon:6px;
  --ed-trait:rgba(26,16,22,.18);
  /* les tentacules (tentacules.js) : la pieuvre du logo guide ; sur la nuit, un magenta vif qui luit ; sur les chapitres clairs, le magenta */
  --tt-encre:#ef84b8;--tt-accent:#ef84b8;--tt-neutre:#bc3e80;--tt-epaisseur:2.4;
  /* le fond des champs et des puces posés sur le papier ; le texte sur la magenta du papier ; le voile d'une vidéo qui éteint la page */
  --champ:#ffffff;
  --sur-accent:#ffffff;
  --voile:rgba(10,6,9,.93);
}
/* ———— le jour et la nuit (règle 19, THEME) ————
   La 09 est née en clair-obscur : ses écrans de chapitre (le choix de l'accueil, la saison en carte, les en-têtes des
   entrées, la troupe, le pied de page) sont la nuit de la salle, de jour comme de nuit ; son jour, c'est le papier crème
   des pages. La nuit, le papier s'éteint à son tour : une nuit prune à peine plus claire que les écrans, l'encre devient
   crème, la magenta du texte passe à sa couleur vive ; les univers clairs (Bérénice, Mon Royaume) passent dans leur propre
   nuit (--un-*, univers()), les univers sombres restent eux-mêmes ; l'en-tête, la progression et le sommaire restent de
   nuit sur toutes les zones (majEtat). AA partout sur le papier de nuit : crème 15:1, encre-2 9:1, magenta vive 7,6:1. */
html[data-theme="jour"]{color-scheme:light}
html[data-theme="nuit"]{color-scheme:dark;
  --papier:#1b1117;--encre:#f3eee9;--encre-2:#c2b4bb;--trait:rgba(243,238,233,.16);--champ:#261a21;--magenta-texte:#ef84b8;--sur-accent:#140c12;
  --ed-fond:#1b1117;--ed-encre:#f3eee9;--ed-accent:#ef84b8;--ed-sur-accent:#140c12;--ed-trait:rgba(243,238,233,.2)}
/* les univers clairs dans leur nuit : leurs couleurs de D, retournées (posées à part sur chaque élément d'univers) */
html[data-theme="nuit"] .u-clair{--u-fond:var(--un-fond)!important;--u-fond2:var(--un-fond2)!important;--u-texte:var(--un-texte)!important;--u-texte2:var(--un-texte2)!important;
  --u-vif:var(--un-vif)!important;--u-sur:var(--un-sur)!important;--u-ecran:var(--un-ecran)!important;--u-bras:var(--un-bras)!important}
/* les fiches des spectacles, les écrans des cartes et le pied se détachent du papier de nuit par un filet */
html[data-theme="nuit"] :is(.mini,.cat,.ac,.vignette){box-shadow:0 0 0 1px color-mix(in srgb,var(--u-texte) 16%,transparent),0 24px 44px -28px var(--noir)}
html[data-theme="nuit"] .libre .ecran{box-shadow:0 0 0 1px var(--creme-12)}
html[data-theme="nuit"] .pied{box-shadow:inset 0 1px 0 var(--creme-12)}
/* ce qui portait la couleur sombre d'une entrée sur le papier prend sa couleur vive, l'encre de nuit dessus */
html[data-theme="nuit"] .page-entree .bouton:not(.u *),html[data-theme="nuit"] .ecrire-cta:not(.fiche *){background:var(--ev,var(--magenta-vif));color:var(--nuit)}
[data-ton="clair"],.u-clair{--tt-encre:var(--magenta);--tt-accent:var(--magenta-texte)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--nuit);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.aimante{scroll-snap-type:y proximity}
/* (le fond de la page : le papier ; on ne le voit qu'entre les écrans, il dit le jour et la nuit) */
body{margin:0;overflow-x:clip;background:var(--papier);color:var(--creme);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--t-corps);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
.motif{display:block;pointer-events:none;overflow:visible}

/* l'ouverture commune, dans le dégradé prune de la 09 : le dégradé suit l'écran, pas le grand rectangle */
.intro.m09-intro .intro-fond{x:0;y:0;width:100%;height:100%}
.intro.m09-intro .intro-indice{color:var(--creme)}

/* lien d'évitement */
.evitement{position:fixed;left:var(--marge);top:12px;z-index:100;padding:10px 18px;border-radius:999px;background:var(--creme);color:var(--nuit);font-weight:600;text-decoration:none;transform:translateY(-160%);transition:transform .2s}
.evitement:focus{transform:none}

/* ---------- l'en-tête : la marque, les trois entrées (navigation première), le menu second ---------- */
/* (la teinte de l'en-tête est sur lui-même, le flou de ce qui passe dessous sur ::before : ses textes ont un vrai fond) */
.tete{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--tete-h);display:flex;align-items:center;gap:clamp(12px,1.6vw,28px);padding:0 var(--marge);background:var(--nuit-88);color:var(--creme);transition:color .45s var(--ease),background-color .45s var(--ease),box-shadow .45s var(--ease)}
.tete::before{content:"";position:absolute;inset:0;z-index:-1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tete[data-ton="clair"]{color:var(--encre);background:var(--creme-95);box-shadow:0 1px 0 var(--trait)}
.marque{display:inline-flex;align-items:center;gap:12px;flex:none;min-height:44px;text-decoration:none;border-radius:4px}
.marque-pieuvre{width:58px;flex:none;color:var(--blanc);transition:color .45s var(--ease)}
.tete[data-ton="clair"] .marque-pieuvre{color:var(--magenta)}
.marque-pieuvre svg{width:100%;height:auto}
.marque-mot{font-size:1.3125rem;font-weight:600;line-height:1;letter-spacing:-.02em;margin-top:-3px}
.entrees{flex:1;min-width:0;display:flex;justify-content:center}
.entrees ul{display:flex;align-items:center;gap:4px;flex:none}
.entree{--ec:var(--ev);position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px 8px 10px;border-radius:999px;font-size:.875rem;font-weight:500;line-height:1.2;white-space:nowrap;text-decoration:none;transition:background-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
.tete[data-ton="clair"] .entree{--ec:var(--e)}
.bras-e{flex:none;width:20px;height:20px;fill:none;stroke:var(--ec,currentColor);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.entree:hover{box-shadow:inset 0 0 0 1px var(--ec)}
.entree[aria-current="page"]{background:var(--ec);color:var(--nuit);font-weight:600}
.tete[data-ton="clair"] .entree[aria-current="page"]{color:var(--blanc)}
.entree[aria-current="page"] .bras-e{stroke:currentColor}
.entree[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--ec);font-weight:600}
.entree:focus-visible{outline-offset:2px}
.e-court{display:none}
.tete.court .e-long{display:none}
.tete.court .e-court{display:inline}
.second{flex:none}
/* le jour et la nuit (règle 19, THEME) : le bouton, entre les entrées et le menu second, sur toutes les vues (au téléphone,
   à côté de « Menu ») ; le soleil de jour, et la nuit une lune qui luit de la magenta vive */
.theme{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 32%,transparent);transition:box-shadow .16s var(--ease),color .16s var(--ease),scale .12s var(--ease)}
.theme .theme-icone{width:22px;height:22px}
.theme:hover{box-shadow:inset 0 0 0 1px currentColor;color:var(--magenta-vif)}
.tete[data-ton="clair"] .theme:hover{color:var(--magenta-texte)}
.theme:focus-visible{outline-offset:2px}
.theme.mv-presse{scale:.9;transition-duration:.06s}
html[data-theme="nuit"] .theme{color:var(--magenta-vif)}
html[data-theme="nuit"] .theme .theme-icone{filter:drop-shadow(0 0 6px var(--magenta-30))}
.second ul{display:flex;align-items:center;gap:clamp(14px,1.3vw,22px);padding-left:clamp(14px,1.4vw,24px);border-left:1px solid color-mix(in srgb,currentColor 26%,transparent)}
.second a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 0;font-size:.8125rem;font-weight:500;letter-spacing:.02em;white-space:nowrap;text-decoration:none;opacity:.86}
.second a:hover{opacity:1;text-decoration:underline}
.second a[aria-current="page"]{opacity:1;font-weight:600}
.second a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:var(--magenta-vif)}
.tete[data-ton="clair"] .second a[aria-current="page"]::after{background:var(--magenta)}
.menu-bouton{display:none;flex:none;align-items:center;gap:10px;min-height:44px;padding:10px 6px;font-size:.9375rem;font-weight:500}
.menu-icone{position:relative;display:block;width:22px;height:10px}
.menu-icone::before,.menu-icone::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .35s var(--ease),top .35s var(--ease)}
.menu-icone::before{top:0}
.menu-icone::after{top:8.5px}
.tete.menu-ouvert .menu-icone::before{top:4.25px;transform:rotate(45deg)}
.tete.menu-ouvert .menu-icone::after{top:4.25px;transform:rotate(-45deg)}

/* le sommaire des chapitres (bureau) : l'accueil, et la page d'un spectacle */
.sommaire{display:none}

/* ---------- l'accueil : le choix, puis un spectacle par écran, la saison en carte, les donateurs ---------- */
.choix{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;padding:calc(var(--tete-h) + 12px) var(--marge) calc(16px + var(--barre-h));background:radial-gradient(90% 75% at 50% 42%,var(--choix-1) 0%,var(--choix-2) 58%,var(--choix-3) 100%);color:var(--creme)}
.portes{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.porte-li{position:relative;display:flex;min-height:0}
.porte{position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:12px;min-height:clamp(140px,calc((100svh - var(--tete-h) - var(--barre-h) - 136px) / 3),400px);padding:20px 20px 22px;overflow:hidden;border-radius:4px;background:var(--nuit-2);color:var(--blanc);box-shadow:inset 0 0 0 1px var(--blanc-18),0 24px 48px -24px var(--noir-70);text-decoration:none}
.porte::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,color-mix(in srgb,var(--e) 92%,var(--noir)) 0%,color-mix(in srgb,var(--e) 66%,transparent) 38%,var(--ombre-18) 72%,var(--ombre-52) 100%)}
.porte::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--ev);transform:scaleX(.24);transform-origin:left;transition:transform .2s var(--ease)}
.porte:hover::after,.porte:focus-visible::after{transform:none}
.porte-photo{position:absolute;inset:0;z-index:-2;overflow:hidden}
.porte-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.06);transition:transform .5s var(--ease)}
.porte:hover .porte-photo img,.porte:focus-visible .porte-photo img{transform:scale(1.03)}
.porte .bras-e{--ec:var(--ev);width:40px;height:40px;stroke-width:1.6}
.porte-titre{font-family:Gloock,Georgia,serif;font-size:clamp(1.625rem,3vw,3.35rem);line-height:1.02;letter-spacing:-.012em;max-width:11em;text-wrap:balance;text-shadow:0 2px 24px var(--noir-55)}
.porte-fleche{position:absolute;top:18px;right:18px;display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--blanc-72);border-radius:50%;transition:transform .2s var(--ease),background-color .18s,border-color .18s,color .18s}
.porte-fleche svg{width:20px;height:20px}
.porte:hover .porte-fleche,.porte:focus-visible .porte-fleche{background:var(--ev);border-color:var(--ev);color:var(--nuit);transform:translateX(4px)}
.porte:focus-visible{outline:3px solid var(--ev);outline-offset:3px}
.porte-credit{position:absolute;left:14px;top:12px;z-index:1;max-width:60%;font-size:.6875rem;line-height:1.3;color:var(--blanc-84);text-shadow:0 1px 6px var(--noir-80);pointer-events:none}
.choix-rep{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-top:12px;padding-top:10px;border-top:1px solid var(--creme-14)}
.choix-suite{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 4px;border-radius:999px;font-size:.75rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--creme)}
.choix-suite svg{width:18px;height:18px;color:var(--magenta-vif)}
.choix-suite:hover{color:var(--magenta-vif)}
.choix-spectacles{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;justify-content:flex-end}
.choix-sp{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 6px;border:1px solid var(--creme-18);border-radius:999px;background:var(--ombre-66);color:var(--creme);font-family:Gloock,Georgia,serif;font-size:.875rem;line-height:1.15;white-space:nowrap;transition:border-color .18s var(--ease),background-color .18s var(--ease),transform .18s var(--ease)}
.choix-sp-ph{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;background:var(--u-fond2);box-shadow:0 0 0 1.5px var(--u-vif)}
.choix-sp-ph img{width:100%;height:100%;object-fit:cover}
.choix-sp:hover,.choix-sp:focus-visible{border-color:var(--u-vif);background:var(--nuit-2);transform:translateY(-1px)}

.chap{position:relative;isolation:isolate;overflow:hidden;background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2);border-top:1px solid color-mix(in srgb,var(--u-texte) 12%,transparent)}
.chap::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 60% at 50% 100%,var(--u-lueur),transparent 72%)}
.chap-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--u-fond2)}
.chap-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* (le crédit, posé sur la photo : une étiquette d'ombre derrière lui, qu'il se lise sur une photo claire) */
.chap-credit{position:absolute;right:10px;bottom:8px;z-index:2;max-width:80%;padding:2px 8px;border-radius:3px;background:var(--ombre-80);font-size:.75rem;line-height:1.4;text-align:right;color:var(--blanc-86)}
.chap-motif{position:absolute;z-index:-1;right:-10%;bottom:-8%;width:min(70vw,440px);color:var(--u-vif);opacity:.15;stroke-width:3}
.chap-texte{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;padding:30px var(--marge) 64px}
.chap-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:14px;font-size:var(--t-petit);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.chap-lt{color:var(--u-texte2)}
.chap-lt::before{content:"";display:inline-block;width:18px;height:1px;margin-right:12px;vertical-align:middle;background:currentColor}
.chap-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-titre);line-height:.98;letter-spacing:-.014em;max-width:10.5em;text-wrap:balance;color:var(--u-vif);text-shadow:0 0 54px var(--u-lueur)}
.chap-titre.long{font-size:clamp(2.1rem,min(4.8vw,7.8vh),4.4rem)}
.chap-sous{margin-top:12px;font-size:1.0625rem;color:var(--u-texte2)}
.chap-accroche{margin-top:22px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;max-width:22em;text-wrap:pretty}
.chap-ac{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:22px;padding:9px 16px;border:1px solid color-mix(in srgb,var(--u-vif) 60%,transparent);border-radius:4px}
.chap-ac-lib{font-size:.6875rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--u-texte2)}
.chap-ac-type{font-family:Gloock,Georgia,serif;font-size:1.125rem;line-height:1.25}
.chap-tournee{margin-top:24px;max-width:26rem}
.chap-tournee .surtitre::before{content:"";width:28px;height:2px;background:var(--u-vif)}
.surtitre{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muet)}
.chap-date-quand{margin-top:8px;font-weight:600}
/* la prochaine date réservable (règle 17) : un billet, sa barre de chapitre se remplit au survol */
.chap-resa{position:relative;display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;min-height:44px;margin-top:10px;padding:13px 18px 11px;border-radius:4px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 30%,transparent);text-decoration:none;transition:box-shadow .18s var(--courbe),scale .12s var(--courbe)}
.chap-resa::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:4px 4px 0 0;background:var(--u-vif);transform:scaleX(.18);transform-origin:0 50%;transition:transform .2s var(--courbe)}
.chap-resa:hover,.chap-resa:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 60%,transparent)}
.chap-resa:hover::before,.chap-resa:focus-visible::before{transform:none}
.chap-resa.mv-presse{scale:.97;transition-duration:.06s}
.chap-resa-q b{font-family:Gloock,Georgia,serif;font-weight:400;font-size:1.5rem;line-height:1}
.chap-resa-s{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--u-texte2)}
.chap-resa-h{font-weight:700}
.chap-resa-o{color:var(--u-texte2)}
.chap-resa-f{transition:transform .18s var(--courbe)}
.chap-resa:hover .chap-resa-f{transform:translateX(4px)}
.chap-date-ou,.chap-note{color:var(--u-texte2)}
.chap-note{margin-top:8px}
.chap-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:28px}
.chap-entrees{display:flex;flex-wrap:wrap;gap:2px 16px}
.chap-entrees a{--ec:var(--ev);display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 0;font-size:.875rem;font-weight:500;text-decoration:none}
.u-clair .chap-entrees a{--ec:var(--e)}
.chap-entrees a:hover{text-decoration:underline}
.chap-entrees .bras-e{width:18px;height:18px}
.bouton{display:inline-flex;align-items:center;gap:14px;min-height:44px;padding:14px 22px 14px 26px;border-radius:999px;background:var(--u-vif,var(--magenta-vif));color:var(--u-sur,var(--nuit));font-weight:600;font-size:1rem;line-height:1.2;text-decoration:none;transition:box-shadow .18s var(--ease),scale .12s var(--ease)}
.bouton .fleche{display:inline-block;transition:transform .18s var(--ease)}
.bouton:hover{box-shadow:0 14px 34px -14px color-mix(in srgb,var(--u-vif,var(--magenta-vif)) 80%,transparent)}
.bouton:hover .fleche{transform:translateX(5px)}
.pastille{display:inline-block;padding:2px 10px 1px;border:1px solid currentColor;border-radius:999px;font-size:.8125rem;font-weight:500;letter-spacing:.06em;line-height:1.5;white-space:nowrap}

/* le chapitre de la carte : la saison, mois par mois, les bras poussent au fil du défilement */
.chap-carte{position:relative;height:calc(100vh + var(--pas,8) * 42vh + 50vh);height:calc(100svh + var(--pas,8) * 42svh + 50svh);background:var(--nuit);color:var(--creme)}
.cc-scene{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:minmax(0,50fr) minmax(0,50fr)}
.cc-scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 105%,var(--magenta-14),transparent 70%)}
.cc-carte{position:relative;min-height:0;margin-top:var(--tete-h);-webkit-mask-image:linear-gradient(180deg,var(--noir) 80%,transparent);mask-image:linear-gradient(180deg,var(--noir) 80%,transparent)}
.cc-svg{position:absolute;inset:0;width:100%;height:100%;max-width:none;overflow:hidden}
.cc-pays{fill:var(--creme-035);stroke:var(--creme-32);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cc-voisin{fill:none;stroke:var(--creme-15);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 4}
.cc-traces{fill:none;stroke:var(--creme-24);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cc-b{opacity:.95;transition:opacity .5s var(--ease)}
.cc-b.est-passe{opacity:.4}
.cc-s{fill:none;stroke:var(--magenta-vif);stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.cc-p{fill:none;stroke:var(--blanc);stroke-width:0;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke-width .4s var(--ease),stroke .4s}
.cc-p.est-pousse{stroke-width:5;stroke:var(--creme-72)}
.cc-p.est-actif{stroke-width:10;stroke:var(--blanc)}
.cc-rouen{fill:none;stroke:var(--blanc);stroke-width:11;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cc-onde{fill:none;stroke:var(--magenta-vif);stroke-width:11;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
.cc-noms{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cc-nom{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s var(--ease)}
.cc-nom > span{position:absolute;left:12px;top:0;transform:translateY(-52%);white-space:nowrap;font-family:Gloock,Georgia,serif;font-size:1.25rem;line-height:1;color:var(--blanc);text-shadow:0 1px 12px var(--noir-70),0 0 2px var(--noir-60)}
.cc-nom.a-gauche > span,.cc-nom.vers-gauche > span{left:auto;right:12px}
.cc-nom.a-gauche.vers-droite > span{left:12px;right:auto}
.cc-nom.est-visible,.cc-nom-rouen{opacity:1}
.cc-nom-rouen > span{left:12px;top:-14px;font-family:Inter,system-ui,sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta-vif)}
.cc-texte{position:relative;display:flex;flex-direction:column;min-height:0;padding:4px var(--marge) calc(22px + var(--barre-h))}
.cc-sur::before{content:"";width:28px;height:2px;background:var(--magenta-vif)}
.cc-titre{margin-top:8px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.875rem,4.2vw,3.5rem);line-height:1;letter-spacing:-.012em}
.cc-rail{position:relative;flex:1;min-height:0;margin-top:14px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,var(--noir) 0,var(--noir) 70%,transparent);mask-image:linear-gradient(180deg,var(--noir) 0,var(--noir) 70%,transparent)}
.cc-liste{position:absolute;left:0;right:0;top:0;will-change:transform}
.cc-m{padding-bottom:30px;opacity:.2;transition:opacity .5s var(--ease)}
.cc-m.est-actif{opacity:1}
.cc-m-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.5rem,2.4vw,2.25rem);line-height:1.05;color:var(--magenta-vif)}
.cc-lignes{margin-top:10px;max-width:30rem}
.cc-ligne{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;padding:8px 0;border-top:1px solid var(--creme-12)}
.cc-quand{font-weight:600}
.cc-ou{color:var(--creme-2)}
.cc-quoi{display:flex;align-items:center;gap:8px;font-size:var(--t-petit);color:var(--creme-2);flex:1 1 60%}
.cc-quoi::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c,currentColor)}
.cc-sco{font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--creme-2);border:1px solid var(--creme-30);border-radius:999px;padding:0 8px}
.cc-bouton{align-self:flex-start;margin-top:14px;background:var(--ev);color:var(--nuit)}
.chap-carte.est-statique{height:auto}
.chap-carte.est-statique .cc-scene{position:relative;height:auto;overflow:visible;display:block}
.chap-carte.est-statique .cc-carte{height:min(64vh,540px);-webkit-mask-image:none;mask-image:none}
.chap-carte.est-statique .cc-texte{padding-bottom:72px}
.chap-carte.est-statique .cc-rail{overflow:visible;-webkit-mask-image:none;mask-image:none}
.chap-carte.est-statique .cc-liste{position:static;transform:none!important}
.chap-carte.est-statique .cc-m{opacity:1}

/* la fin de l'accueil : les donateurs, discrets */
.fin{background:var(--papier);color:var(--encre);padding:clamp(56px,10vh,104px) var(--marge)}
.fin-int{max-width:1320px;margin:0 auto}
.donateurs{max-width:64em;font-size:var(--t-petit);line-height:1.75;color:var(--encre-2)}

/* ---------- les pages, sur papier ---------- */
.libre{background:var(--papier);color:var(--encre);--muet:var(--encre-2)}
.bloc{padding:clamp(64px,11vh,120px) var(--marge)}
.bloc + .bloc{padding-top:0}
.grille{display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(16px,2.2vw,32px);max-width:1320px;margin:0 auto}
.page > .bloc:first-child{padding-top:calc(var(--tete-h) + clamp(44px,8vh,96px))}
.page-tete{margin-bottom:clamp(36px,6vh,64px)}
.page-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-page);line-height:1;letter-spacing:-.012em;text-wrap:balance;overflow-wrap:break-word}
.surtitre + .page-titre{margin-top:16px}
.surtitre a{text-decoration:none}
.surtitre a:hover{text-decoration:underline}
.bloc-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-grand);line-height:1.04;letter-spacing:-.01em;text-wrap:balance;margin-bottom:clamp(24px,4vh,40px)}
.prose{max-width:38em;font-size:1.0625rem;line-height:1.72;overflow-wrap:break-word}
.prose > * + *{margin-top:1em}
.prose h2{margin-top:1.8em;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.2}
.prose > :first-child h2,.prose > h2:first-child{margin-top:0}
.prose ul{padding-left:1.2em;list-style:disc}
.prose li + li{margin-top:.55em}
.prose a{color:var(--magenta-texte)}
.partenaires{max-width:42em;font-size:var(--t-petit);line-height:1.75;color:var(--muet)}

/* l'en-tête d'une entrée : un écran de nuit, la couleur de l'entrée, un bras qui la traverse */
.ent-tete{position:relative;isolation:isolate;overflow:hidden;padding:calc(var(--tete-h) + clamp(36px,9vh,110px)) var(--marge) clamp(40px,8vh,96px);background:radial-gradient(70% 120% at 0% 0%,color-mix(in srgb,var(--ev) 22%,transparent),transparent 62%),radial-gradient(60% 90% at 100% 100%,color-mix(in srgb,var(--e) 30%,transparent),transparent 70%),var(--nuit);color:var(--creme)}
.ent-tete::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ev)}
.ent-int{position:relative;max-width:1320px;margin:0 auto}
.ent-bras{position:absolute;z-index:-1;right:-4%;bottom:-8%;width:min(80vw,780px);height:auto;fill:none;stroke:var(--ev);stroke-width:2.4;stroke-linecap:round;opacity:.5}
.ent-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-page);line-height:1;letter-spacing:-.012em;max-width:13em;text-wrap:balance}
.ent-texte{margin-top:clamp(14px,2.4vh,24px);max-width:30em;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;color:var(--creme-2)}
.page-entree .bloc-titre::before{content:"";display:block;width:44px;height:3px;margin-bottom:18px;background:var(--e)}
.page-entree .bouton:not(.u *){background:var(--e);color:var(--blanc)}
.ecrire-cta{display:inline-flex;align-items:center;gap:16px;min-height:44px;padding:16px 26px 16px 30px;border-radius:999px;background:var(--e,var(--u-vif));color:var(--blanc);font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,2vw,1.625rem);line-height:1.2;text-decoration:none;transition:box-shadow .18s var(--ease),scale .12s var(--ease)}
.ecrire-cta .fleche{transition:transform .18s var(--ease)}
.ecrire-cta:hover{box-shadow:0 16px 36px -16px color-mix(in srgb,var(--e,var(--u-vif)) 85%,transparent)}
.ecrire-cta:hover .fleche{transform:translateX(5px)}
.fiche .ecrire-cta{background:var(--u-vif);color:var(--u-sur)}

/* l'agenda : la carte dans un écran de nuit, reliée à la liste */
.ecran{position:relative;margin-bottom:40px;padding:clamp(12px,2vw,24px);border-radius:6px;background:radial-gradient(70% 55% at 40% 20%,var(--magenta-30),var(--magenta-0) 72%),var(--nuit);color:var(--creme)}
.ecran .carte{width:100%;height:auto;max-height:calc(100vh - var(--tete-h) - 150px);margin:0 auto}
.carte-filtre{display:flex;align-items:center;min-height:44px;margin-top:6px}
.filtre-puce{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:8px 16px;border-radius:999px;background:var(--magenta-vif);color:var(--nuit);font-weight:600;font-size:var(--t-petit)}
.ecran-u .filtre-puce{background:var(--u-bras);color:var(--nuit)}
.dates-groupe + .dates-groupe{margin-top:44px}
.dates-mois{padding-bottom:12px;border-bottom:1px solid currentColor;font-size:var(--t-petit);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.date{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:4px 20px;padding:18px 10px 20px 12px;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent);transition:background-color .16s,box-shadow .16s}
.date.est-survol,.date.est-allume{background:color-mix(in srgb,var(--point) 12%,transparent);box-shadow:inset 3px 0 0 var(--point)}
.date-quand{min-width:0}
.date-jour{display:block;font-family:Gloock,Georgia,serif;font-size:1.5rem;line-height:1.1;overflow-wrap:break-word}
.date-moisan{display:block;margin-top:4px;font-size:var(--t-petit);color:var(--muet)}
.date-corps{min-width:0}
.date-quoi a,.date-quoi > span{display:inline-flex;align-items:baseline;gap:10px;font-weight:600;text-decoration:none}
.date-quoi a:hover{text-decoration:underline}
.date-point{flex:none;width:9px;height:9px;border-radius:50%;background:var(--point);transform:translateY(-1px)}
.date-ou{font-weight:500}
.date-quoi + .date-ou{font-weight:400}
.date-details{margin-top:4px;color:var(--muet);overflow-wrap:anywhere}
.date-details li + li{margin-top:4px}
.date .pastille{margin-top:6px}
.date.est-annule .date-jour,.date.est-annule .date-ou{text-decoration:line-through}
/* l'agenda passé : une saison par bloc, fermée au départ ; sa petite carte, un écran de nuit aux bras clairs */
.ag-outils{display:grid;gap:14px;margin-bottom:34px}
.recherche{position:relative;display:block;max-width:24rem}
.recherche .ic{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--encre-2)}
.recherche input{width:100%;min-height:46px;padding:0 16px 0 44px;border:1.5px solid var(--encre);border-radius:999px;background:var(--champ);font:400 1rem Inter,system-ui,sans-serif;color:var(--encre)}
.recherche input:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.cps{display:flex;flex-wrap:wrap;gap:8px}
.cp{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:8px 16px;border:1.5px solid var(--trait);border-radius:999px;background:var(--champ);font:500 .9rem/1.25 Inter,system-ui,sans-serif;color:var(--encre);cursor:pointer;text-align:left;transition:border-color .2s,background .2s,color .2s}
.cp i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--point,var(--magenta))}
.cp:hover{border-color:var(--encre)}
.cp[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--papier)}
.carte-m09 .hors{opacity:.14}
.ag-index{position:sticky;top:var(--tete-h);z-index:20;display:flex;align-items:center;gap:10px 14px;margin-bottom:4px;padding:6px 0 4px;background:var(--papier);border-bottom:2px solid var(--encre)}
.ag-frise{flex:1 1 auto;min-width:0}
.ag-ctl{flex:none;display:flex;align-items:center;gap:8px;max-width:100%}
.ag-ctl ul{flex:0 1 auto}
.ag-index ul{flex:1 1 auto;min-width:0;display:flex;gap:8px;margin:0;padding:3px 2px;list-style:none;overflow-x:auto;scrollbar-width:none}
.ag-index li{flex:none}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--trait);background:var(--champ);color:var(--encre);font:600 .92rem/1.2 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.idx{min-height:44px;padding:0 16px;border-radius:999px}
.idx small{font-size:.8rem;font-weight:500;color:var(--encre-2)}
.idx:hover,.idx-tout:hover{border-color:var(--encre)}
.idx[aria-expanded="true"]{border-color:var(--magenta);color:var(--magenta-texte)}
.idx-actif{background:var(--magenta-texte);border-color:var(--magenta-texte);color:var(--sur-accent)}
.idx .ic{width:12px;height:12px}
.idx-tout{flex:none;justify-content:center;width:44px;height:44px;padding:0;border-radius:50%}
.idx-tout .ic{width:20px;height:20px}
.sai{border-bottom:1px solid var(--trait);scroll-margin-top:calc(var(--tete-h) + 128px)}
.sai>summary{display:grid;grid-template-columns:clamp(84px,10vw,128px) minmax(0,1fr) auto;align-items:center;gap:6px clamp(16px,2.6vw,34px);padding:18px 8px;list-style:none;cursor:pointer;transition:background .16s}
.sai>summary::-webkit-details-marker{display:none}
.sai>summary:hover,.sai[open]>summary{background:color-mix(in srgb,var(--magenta) 7%,transparent)}
.sai-ecran{display:block;padding:7px;border-radius:6px;background:radial-gradient(70% 55% at 40% 20%,var(--magenta-30),var(--magenta-0) 72%),var(--nuit)}
.sai-mini{display:block;width:100%;height:auto}
.mi-pays{fill:var(--creme-05);stroke:var(--creme-40);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mi-bras{fill:var(--magenta-vif)}
.mi-rouen{fill:var(--blanc)}
.sai-t{font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.75rem,1.3rem + 1.5vw,2.75rem);line-height:1.05;letter-spacing:-.01em}
.sai-sp{display:block;margin-top:6px;font-size:.95rem;line-height:1.45;color:var(--encre-2)}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai-n{display:inline-flex;align-items:center;gap:10px;font-family:Gloock,Georgia,serif;font-size:clamp(1.5rem,1.2rem + 1vw,2.25rem);line-height:1;font-variant-numeric:tabular-nums}
.sai-n .chev{width:22px;height:22px;transition:transform .2s var(--ease)}
.sai[open] .sai-n .chev{transform:rotate(180deg)}
.sai-corps{padding:14px 8px 48px}
.sai-corps:empty{display:none}
.sai-corps .ecran{margin-bottom:28px}
.sai-liste .dates-mois{font-size:var(--t-petit)}
.sai-page{margin-top:22px}
.sai-page a{color:var(--magenta-texte);font-weight:600}
.date .date-ou a{color:inherit;text-decoration-color:var(--trait)}
.date .date-ou a:hover{color:var(--magenta-texte)}
.carte-m09 .carte-lieu.hors{pointer-events:none}
@media (min-width:900px){
  .sai-corps:not(:empty){display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.2vw,32px);align-items:start}
  .sai-corps > .ecran{grid-column:1/span 5;position:sticky;top:calc(var(--tete-h) + 80px);margin-bottom:0}
  .sai-corps > .sai-liste{grid-column:7/-1}
}
@media (max-width:759px){
  .sai>summary{grid-template-columns:64px minmax(0,1fr) auto;padding:14px 2px}
  .sai-n{gap:6px}
  .sai-corps{padding:6px 2px 30px}
  .cps{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--marge));padding:2px var(--marge) 4px;scrollbar-width:none}
  .cp{flex:none}
  .recherche{max-width:none}
}
.saisons-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));column-gap:clamp(16px,2.2vw,32px);border-top:1px solid var(--encre)}
.saisons-liste a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--trait);font-family:Gloock,Georgia,serif;font-size:1.375rem;line-height:1.2;text-decoration:none}
.saisons-liste a::after{content:"→";font-family:Inter,system-ui,sans-serif;font-size:1rem;color:var(--magenta-texte);transition:transform .18s var(--ease)}
.saisons-liste a:hover::after{transform:translateX(4px)}
.saison-sp + .saison-sp{margin-top:56px}
.saison-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.12}
.saison-titre a{text-decoration:none}
.saison-titre a:hover{text-decoration:underline}
.saison-sous{margin-top:6px;color:var(--muet)}
.saison-creation{margin-top:2px;font-size:var(--t-petit);color:var(--muet)}
.saison-dates{margin-top:18px;border-top:1px solid var(--encre)}
.ds{padding:14px 10px 14px 12px;border-bottom:1px solid var(--trait);transition:background-color .16s,box-shadow .16s}
.ds.est-survol,.ds.est-allume{background:var(--magenta-08);box-shadow:inset 3px 0 0 var(--magenta)}
.ds-ligne{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.ds-ligne a{display:contents;color:inherit}
.ds-quand{font-weight:600}
.ds-ou{color:var(--muet)}
.ds-ligne a:hover .ds-ou{text-decoration:underline}
.ds .pastille{margin-top:6px;color:var(--magenta-texte)}
.ds.est-annule .ds-quand,.ds.est-annule .ds-ou{text-decoration:line-through}

/* les spectacles en tournée (voir) : un petit écran par spectacle, dans son univers */
.minis{display:grid;gap:clamp(12px,1.6vw,22px);grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.mini{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;border-radius:4px;background:var(--u-fond);color:var(--u-texte)}
.mini-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--u-fond2)}
.mini-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini-corps{flex:1;display:flex;flex-direction:column;gap:8px;padding:18px 20px 24px}
.mini-motif{position:absolute;z-index:-1;right:-34px;bottom:-34px;width:170px;color:var(--u-vif);opacity:.16;stroke-width:5}
.mini-lt{font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-texte2)}
.mini-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.75rem;line-height:1.05;color:var(--u-vif)}
.mini-titre a{text-decoration:none}
.mini-titre a::after{content:"";position:absolute;inset:0;z-index:1}
.mini-titre a:focus-visible{outline:none}
.mini:hover .mini-titre a{text-decoration:underline}
.mini:has(a:focus-visible){outline:2px solid var(--encre);outline-offset:4px}
.mini-accroche{font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.4}

/* le catalogue (programmer) : une fiche par spectacle, dans son univers */
.cats{display:grid;gap:clamp(14px,1.8vw,24px)}
.cat{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);border-radius:4px;background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.cat-photo{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--u-fond2)}
.cat-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat-corps{position:relative;display:grid;gap:18px;align-content:start;padding:clamp(22px,3vw,44px)}
.cat-motif{position:absolute;z-index:-1;right:-50px;bottom:-60px;width:250px;color:var(--u-vif);opacity:.12;stroke-width:4}
.cat-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.8125rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.cat-titre{margin-top:-8px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:clamp(1.875rem,3.4vw,3rem);line-height:1.02;color:var(--u-vif);text-wrap:balance}
.cat-sous{margin-top:-10px;color:var(--u-texte2)}
.cat-actu{justify-self:start;padding:7px 14px;border:1px solid var(--u-vif);border-radius:999px;color:var(--u-vif);font-weight:600;font-size:.9375rem;line-height:1.35}
.cat-cols{display:grid;gap:22px}
.faits{border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.fait{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.fait::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--u-vif);transform:translateY(-2px)}
.fait-fort{font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,1.6vw,1.5rem);line-height:1.22}
.fait-fort::before{width:10px;height:10px;transform:translateY(-6px)}
.cat-fiche{font-size:.9375rem;line-height:1.55}
.fl{padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--u-texte) 12%,transparent)}
.fl-lib{color:var(--u-texte2)}
.cat-liens{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.cat-video{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;text-decoration:none}
.cat-video svg{flex:none;width:34px;height:34px;padding:9px;border-radius:50%;background:var(--u-vif);color:var(--u-sur)}
.cat-video:hover span{text-decoration:underline}
details.lieux{border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent);padding-top:12px}
details.lieux summary{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600;list-style:none}
details.lieux summary::-webkit-details-marker{display:none}
details.lieux summary::before{content:"+";display:grid;place-items:center;flex:none;width:24px;height:24px;border:1px solid currentColor;border-radius:50%;font-weight:400;line-height:1}
details.lieux[open] summary::before{content:"–"}
details.lieux p{margin-top:12px;font-size:.9375rem;line-height:1.65;color:var(--u-texte2)}
.diffusion-texte{display:grid;gap:28px;align-content:start}

/* l'établissement scolaire : la position de la compagnie, puis une carte par spectacle et son action culturelle */
.ecole-texte{max-width:40em;font-family:Gloock,Georgia,serif;font-size:clamp(1.1875rem,1.7vw,1.5rem);line-height:1.5;text-wrap:pretty}
.acs{display:grid;gap:clamp(14px,1.8vw,24px);grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr))}
.ac{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:clamp(22px,2.4vw,32px);border-radius:4px;background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.ac-motif{position:absolute;z-index:-1;right:-44px;bottom:-44px;width:210px;color:var(--u-vif);opacity:.14;stroke-width:4}
.ac-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.5rem;line-height:1.1;color:var(--u-texte)}
.ac-titre a{text-decoration:none}
.ac-titre a:hover{text-decoration:underline}
.ac-lib{margin-top:4px;font-size:.6875rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--u-texte2)}
.ac-type{margin-top:-6px;font-family:Gloock,Georgia,serif;font-size:clamp(1.75rem,2.6vw,2.25rem);line-height:1.08;color:var(--u-vif);text-wrap:balance}
.ac-vide{font-size:1.375rem;color:var(--u-texte2)}
.ac-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.ac-k{font-weight:700;margin-right:6px}
.ac-texte{font-size:.9375rem;line-height:1.62}
.formule{display:grid;gap:2px;padding:10px 16px;border-left:3px solid var(--u-vif);font-weight:600;line-height:1.45}
.ac-dispositifs{display:grid;gap:4px;font-size:.875rem;line-height:1.55;color:var(--u-texte2)}
.ac-dispositifs a{color:var(--u-vif)}
.ac-liens{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:8px}
.bouton-petit{min-height:44px;padding:10px 16px 10px 18px;font-size:.9375rem;gap:10px}
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.cd{display:grid;gap:6px;max-width:640px;margin-top:clamp(24px,4vh,40px);padding:24px 28px 22px;border:1px solid color-mix(in srgb,var(--creme) 34%,transparent);border-radius:24px;background:color-mix(in srgb,var(--creme) 8%,transparent);color:var(--creme);position:relative}
.cd-k{margin:0;font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:inherit;opacity:.76}
.cd-nom b{display:block;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.1}
.cd-role{display:block;margin-top:2px;opacity:.86}
.cd-liens{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:14px}
.cd-mail{display:inline-flex;align-items:center;gap:14px;min-height:44px;padding:14px 22px 14px 26px;border-radius:999px;background:var(--ev);color:var(--nuit);font-weight:600;line-height:1.2;text-decoration:none;overflow-wrap:anywhere;transition:box-shadow .18s var(--ease),scale .12s var(--ease)}
.cd-mail .fleche{display:inline-block;transition:transform .18s var(--ease)}
.cd-mail:hover{box-shadow:0 14px 34px -14px var(--ev)}
.cd-mail:hover .fleche{transform:translateX(5px)}
.cd-tel{font-weight:600;color:inherit}
html:not(.ed-actif) .cd-tel.vide{display:none}
.cd-cond{margin:10px 0 0;font-size:var(--t-petit);opacity:.82}
.cd--s{max-width:none;margin-top:clamp(28px,4vh,44px);padding:18px 22px 16px;border-color:color-mix(in srgb,var(--u-texte) 30%,transparent);border-radius:20px;background:transparent;color:var(--u-texte)}
.cd--s .cd-k{color:var(--u-texte);opacity:.72}
.cd--s .cd-nom b{display:inline;font-size:clamp(1.25rem,1.8vw,1.5rem)}
.cd--s .cd-role{display:inline;margin-left:10px}
.cd--s .cd-liens{margin-top:10px}
.cd--s .cd-mail{padding:10px 16px 10px 18px;background:var(--u-vif);color:var(--u-sur);font-size:.9375rem;gap:10px}
.dos-bt{position:relative;font:inherit;font-weight:600;font-size:.9375rem;border:0;cursor:pointer;text-align:left}
.dos-bt .dos-ico,.dos-bt .dos-bras{flex:none;width:18px;height:18px}
.dos-bt .dos-bras{display:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dos-bt[aria-busy="true"]{cursor:progress}
.dos-bt[aria-busy="true"] .dos-ico{display:none}
.dos-bt[aria-busy="true"] .dos-bras{display:block}
.dos-bras path{stroke-dasharray:1;stroke-dashoffset:1;animation:bras-trace 1.15s var(--ease) infinite}
@keyframes bras-trace{0%{stroke-dashoffset:1}65%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.dos-bras path{animation:none;stroke-dashoffset:0}}
.pr-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin:clamp(24px,3vh,36px) 0 0}
.docs{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:12px}
.docs li>.dos-ico{flex:none;width:18px;height:18px;color:var(--u-vif,var(--e))}
.docs a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-underline-offset:.26em}
.ft-docs{margin-top:clamp(20px,3vh,32px)}
.cat-docs{margin-top:4px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--u-texte) 18%,transparent)}
.cat-docs .cd-k{margin-bottom:10px;color:var(--u-texte);opacity:.72}
.lien-dossier{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--u-vif);text-underline-offset:.25em}
.actions-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:clamp(32px,5vh,56px)}
.actions-photos img{width:100%;height:100%;aspect-ratio:1;object-fit:cover}
.actions-photos .a-grand{grid-column:1/-1}
.actions-photos .a-grand img{aspect-ratio:3/2}
.actions-photos .credit{grid-column:1/-1;font-size:.75rem;color:var(--muet)}

/* les spectacles : chacun dans son univers */
.vignettes{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,1.8vw,24px)}
.vignette{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;border-radius:4px;background:var(--u-fond);color:var(--u-texte)}
.vignette-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--u-fond2)}
.vignette-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vignette-corps{flex:1;display:flex;flex-direction:column;gap:8px;padding:18px 20px 22px}
.vignette-motif{position:absolute;z-index:-1;right:-36px;bottom:-36px;width:170px;color:var(--u-vif);opacity:.15;stroke-width:5}
.vignette-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.vignette-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:1.75rem;line-height:1.05;color:var(--u-vif);text-wrap:balance}
.vignette-titre a{text-decoration:none}
.vignette-titre a::after{content:"";position:absolute;inset:0;z-index:1}
.vignette-titre a:focus-visible{outline:none}
.vignette:hover .vignette-titre a{text-decoration:underline}
.vignette:has(a:focus-visible){outline:2px solid var(--encre);outline-offset:4px}
.vignette-sous{font-size:.9375rem;color:var(--u-texte2)}
.vignette-ac{margin-top:auto;padding-top:10px;font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.3}

/* la compagnie, les mentions ; « En quelques dates » : la frise historique (verticale, une barre de chapitres) ; la liste
   des dates n'est là qu'en édition sur place, pour les écrire */
.cie-liste{display:none;margin-top:24px;border-top:1px solid var(--encre)}
.ed-actif .cie-liste{display:block}
.cie-liste li{display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--trait)}
.cie-annee{font-family:Gloock,Georgia,serif;font-size:1.5rem;line-height:1;color:var(--magenta-texte)}
.cie-frise{margin-top:8px}
.dir-chapeau{margin-top:-8px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.3;color:var(--encre-2)}
.dir-texte{margin-top:32px}

/* ---------- la troupe (règle 20, TROUPE) : un chapitre plein écran, l'affiche de la compagnie ----------
   Entre la présentation et les repères, un écran de nuit comme ceux de l'accueil : la pieuvre du logo en filigrane qui
   monte avec la lecture, le titre, puis la troupe comme on la lit au bas d'une affiche : le jeu d'abord, en chœur (les
   visages publiés en médaillons, puis les noms), et les autres métiers en colonnes. Chaque métier est un chapitre : sa
   barre se remplit quand il arrive dans l'écran, ses personnes montent l'une après l'autre (animations liées au
   défilement) ; une personne survolée ou choisie s'allume partout où elle est, et des bras la relient (TROUPE.relier).
   Moins d'animations : tout est posé. */
.bloc.troupe-chap{position:relative;isolation:isolate;overflow:clip;min-height:100vh;min-height:100svh;padding:calc(var(--tete-h) + clamp(40px,8vh,88px)) var(--marge) clamp(72px,12vh,128px);background:radial-gradient(90% 60% at 50% 0%,var(--choix-1) 0%,var(--choix-2) 58%,var(--choix-3) 100%);color:var(--creme);--muet:var(--creme-2)}
.bloc.troupe-chap + .bloc{padding-top:clamp(64px,11vh,120px)}
.tr-int{position:relative;max-width:1320px;margin:0 auto}
.tr-entete{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:clamp(36px,7vh,72px)}
.tr-signe{margin-bottom:14px;font-size:.75rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--magenta-vif)}
.tr-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-titre);line-height:.98;letter-spacing:-.014em;text-shadow:0 0 60px var(--magenta-30)}
.tr-pieuvre{position:absolute;z-index:0;left:50%;top:calc(-1 * clamp(30px,6vh,70px));width:min(78vw,560px);margin-left:calc(-1 * min(39vw,280px));color:var(--magenta-vif);opacity:.13;pointer-events:none;line-height:0}
.tr-pieuvre svg{width:100%;height:auto;overflow:visible}
.tr{position:relative;isolation:isolate;display:grid;gap:clamp(40px,6vh,64px);--troupe-lien:var(--magenta-vif);--troupe-ic-fond:var(--nuit);--troupe-ventouse-fond:var(--nuit)}
.tr-cat{position:relative;z-index:2;min-width:0}
.tr-cat-t{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-top:16px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.25rem,1.1rem + .5vw,1.5rem);line-height:1.15;text-wrap:balance;view-timeline:--tr-t block}
/* la barre du chapitre : une piste, remplie quand le métier arrive dans l'écran */
.tr-cat-t::before,.tr-cat-t::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:2px}
.tr-cat-t::before{background:var(--creme-15)}
.tr-cat-t::after{background:var(--magenta-vif);transform-origin:0 50%}
.tr-ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--nuit);color:var(--magenta-vif);box-shadow:inset 0 0 0 1px var(--creme-30);transition:background-color .18s,color .18s,box-shadow .18s}
.tr-ic .troupe-icone{width:28px;height:28px}
.tr-cat.est-allume .tr-ic,.tr-cat:hover .tr-ic{box-shadow:inset 0 0 0 1.5px var(--magenta-vif)}
.tr-places{display:grid;gap:2px}
.tr-li{min-width:0}
.tr-place{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 8px 6px 4px;border-radius:4px;text-align:left;color:var(--creme);transition:background-color .16s,opacity .16s}
.tr-place > [data-troupe-ancre]{flex:none}
.tr-point{display:grid;place-items:center;width:20px;height:20px}
.tr-point::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--magenta-vif);transition:scale .16s var(--courbe)}
.tr-qui{display:grid;gap:1px;min-width:0}
.tr-nom{font-family:Gloock,Georgia,serif;font-size:1.125rem;line-height:1.2;overflow-wrap:break-word}
.tr-metiers{font-size:.8125rem;line-height:1.35;color:var(--creme-2)}
.tr-metier + .tr-metier::before{content:" · "}
.tr-vignette{display:block;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--nuit-2);box-shadow:0 0 0 2px var(--nuit),0 0 0 3.5px var(--creme-30);transition:box-shadow .18s}
.tr-vignette img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.tr-place:hover,.tr-place:focus-visible{background:var(--creme-05)}
.tr-place:focus-visible{outline:2px solid var(--magenta-vif);outline-offset:1px}
.tr-place.est-allume .tr-nom,.tr-place:hover .tr-nom{color:var(--magenta-vif)}
.tr-place.est-allume .tr-vignette,.tr-place:hover .tr-vignette{box-shadow:0 0 0 2px var(--nuit),0 0 0 3.5px var(--magenta-vif)}
.tr-place.est-allume .tr-point::before,.tr-place:hover .tr-point::before{scale:1.6}
/* une personne allumée : une petite carte de nuit (les bras qui la relient passent dessous et sortent de son médaillon) */
.tr-place.est-allume{background:var(--nuit-2)}
.tr-place[aria-pressed="true"]{background:color-mix(in srgb,var(--magenta-vif) 16%,var(--nuit-2))}
.tr-place.mv-presse{scale:.97;transition-duration:.06s}
.tr.est-allume .tr-place:not(.est-allume),.tr.est-groupe .tr-place:not(.est-allume){opacity:.32}
.tr.est-allume .tr-cat:not(.est-allume) .tr-ic{opacity:.5}
/* le chœur : le jeu, les visages publiés en médaillons, puis les noms en colonnes */
.tr-choeur .tr-visages{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px;margin-bottom:18px}
.tr-choeur .tr-visages .tr-place{flex-direction:column;justify-content:flex-start;gap:10px;padding:8px 4px 10px;text-align:center}
.tr-choeur .tr-visages .tr-vignette{width:78px;height:78px}
.tr-choeur .tr-visages .tr-qui{justify-items:center}
.tr-choeur .tr-visages .tr-nom{font-size:1.0625rem}
.tr-choeur .tr-noms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));column-gap:16px}
.tr-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(32px,5vh,48px) clamp(20px,2.4vw,36px)}
@media (min-width:1200px){.tr-cols{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:759px){
  .tr-choeur .tr-visages{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 6px}
  .tr-choeur .tr-visages .tr-vignette{width:64px;height:64px}
  .tr-choeur .tr-noms{grid-template-columns:minmax(0,1fr)}
}
/* le mouvement : lié au défilement (la pieuvre monte, la barre de chaque métier se remplit, les personnes arrivent
   l'une après l'autre, chaque visage se découvre dans son médaillon) */
@supports (animation-timeline:view()){
  @media (prefers-reduced-motion:no-preference){
    .tr-pieuvre{animation:tr-pieuvre linear both;animation-timeline:view();animation-range:entry 0% cover 42%}
    .tr-cat-t::after{animation:tr-avance linear both;animation-timeline:--tr-t;animation-range:entry 40% cover 38%}
    .tr-li{animation:tr-monte linear both;animation-timeline:view();animation-range:entry 0% entry 100%}
    .tr-vignette img{animation:tr-visage linear both;animation-timeline:view();animation-range:entry 0% entry 100%}
  }
}
@keyframes tr-pieuvre{from{opacity:0;transform:translateY(70px) scale(.86)}}
@keyframes tr-avance{from{transform:scaleX(0)}}
@keyframes tr-monte{from{opacity:0;transform:translateY(24px)}}
@keyframes tr-visage{from{transform:translateY(30%) scale(1.2)}}

/* formulaires d'origine */

.champ input:focus-visible,.champ textarea:focus-visible{outline:2px solid var(--magenta);outline-offset:3px}
.case{display:flex;align-items:flex-start;gap:12px}
.case input{flex:none;width:20px;height:20px;margin:3px 0 0;accent-color:var(--magenta)}

.bouton-plein{display:inline-flex;align-items:center;gap:14px;min-height:44px;padding:15px 30px;border-radius:999px;background:var(--encre);color:var(--papier);font-weight:600;line-height:1.2;transition:background-color .3s}

.coordonnees{margin-top:48px;font-style:normal;color:var(--muet)}
.coordonnees strong{display:block;margin-bottom:6px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.2;color:var(--encre)}

/* ---------- le pied de page ---------- */
.pied{background:var(--nuit);color:var(--creme);padding:clamp(80px,13vh,136px) var(--marge) 36px;--muet:var(--creme-2)}
.pied:empty{display:none}
.pied .grille{row-gap:40px}
.pied-ecrire{display:inline-block;font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.04;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .2s var(--ease)}
.pied-ecrire:hover{background-size:100% 1px}
.pied-adresse{margin-top:20px;color:var(--creme-2);font-style:normal}
.pied-facebook{margin-top:10px;color:var(--creme-2)}
.pied-entrees{display:grid;gap:4px;align-content:start}
.pied-entrees a{--ec:var(--ev);display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:6px 0;font-weight:500;text-decoration:none}
.pied-entrees a:hover{text-decoration:underline}
.pied-partenaires{max-width:34em;font-size:var(--t-petit);line-height:1.7;color:var(--creme-2)}
.pied-legal{font-size:var(--t-petit);color:var(--creme-2)}
.pied-legal li + li{margin-top:4px}
.pied-bas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;margin-top:clamp(40px,7vh,80px);padding-top:26px;border-top:1px solid var(--creme-14);color:var(--creme-2);font-size:var(--t-petit)}
.pied-marque{display:flex;align-items:center;gap:14px;min-height:44px;text-decoration:none}
.pied-pieuvre{width:44px;color:var(--creme)}
.pied-pieuvre svg{width:100%;height:auto}
.pied-nav{display:flex;flex-wrap:wrap;gap:8px 22px}
.pied-nav a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}
.pied-nav a:hover{text-decoration:underline}
.pied-modifier{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px 8px 14px;border:1px solid var(--creme-36);border-radius:999px;color:var(--creme);font-size:.8125rem;font-weight:600;transition:border-color .16s,background-color .16s}
.pied-modifier svg{width:15px;height:15px}
.pied-modifier:hover{border-color:var(--magenta-vif);background:var(--magenta-vif-10)}

/* ---------- la page d'un spectacle, dans son univers ---------- */
.fiche{background:var(--u-fond);color:var(--u-texte);--muet:var(--u-texte2)}
.ouverture{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:var(--u-fond);color:var(--u-texte)}
.ouv-photo{position:relative;flex:none;height:54vh;height:54svh;overflow:hidden;background:var(--u-fond2)}
.ouv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ouv-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,var(--u-fond) 0%,var(--u-fond) 3%,color-mix(in srgb,var(--u-fond) 0%,transparent) 46%),linear-gradient(180deg,var(--noir-45),var(--noir-0) 26%)}
.ouv-motif{position:absolute;z-index:-1;right:-14%;bottom:-8%;width:min(96vw,620px);color:var(--u-vif);opacity:.16;stroke-width:1.6}
.ouv-haut{position:absolute;top:calc(var(--tete-h) + 18px);left:var(--marge);right:var(--marge);z-index:2;display:flex;justify-content:space-between;gap:20px}
/* (au téléphone, le retour est posé sur la photo : une pastille d'ombre derrière lui ; au bureau, sur la nuit de l'univers) */
.retour{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 12px;font-weight:500;text-decoration:none;border-radius:999px;background:var(--ombre-66);color:var(--blanc);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.retour span{transition:transform .18s var(--ease)}
.retour:hover span{transform:translateX(-4px)}
.ouv-contenu{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 var(--marge) 44px}
.ouv-signe{margin-bottom:12px;font-size:.75rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--u-texte2)}
.ouv-sur{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:16px;font-size:var(--t-petit);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.ouv-sur > span:not(.pastille) + span:not(.pastille)::before{content:"";display:inline-block;width:18px;height:1px;margin-right:14px;vertical-align:middle;background:currentColor}
.ouv-titre{font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-ouverture);line-height:.98;letter-spacing:-.012em;max-width:11em;color:var(--u-vif);text-shadow:0 0 60px var(--u-lueur);overflow-wrap:break-word}
.ouv-titre .ligne{display:block}
.ouv-titre .mot{display:inline-block;white-space:nowrap}
.ouv-titre .l{display:inline-block}
.ouv-sous{margin-top:16px;font-size:1.125rem;color:var(--u-texte2)}
.ouv-accroche{margin-top:20px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;max-width:24em;text-wrap:pretty}
.ouv-accroche .m{display:inline}
.ouv-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:28px}
.ouv-cta .ecrire-cta{font-family:Inter,system-ui,sans-serif;font-size:1rem;font-weight:600;padding:14px 22px 14px 26px}
.bouton-ligne{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:13px 20px;border:1px solid color-mix(in srgb,var(--u-texte) 40%,transparent);border-radius:999px;font-weight:600;text-decoration:none}
.bouton-ligne:hover{border-color:var(--u-texte)}
.bouton-ligne svg{width:18px;height:18px}
.ouv-credit{position:absolute;right:var(--marge);bottom:14px;z-index:2;max-width:70%;text-align:right;font-size:.75rem;color:var(--u-texte2)}

.onglets{position:relative;z-index:30;background:var(--u-fond2);color:var(--u-texte);border-bottom:1px solid color-mix(in srgb,var(--u-texte) 16%,transparent)}
.onglets ul{display:flex;gap:2px;max-width:1320px;margin:0 auto;padding:0 var(--marge);overflow-x:auto;scrollbar-width:none}
.onglets ul::-webkit-scrollbar{display:none}
.onglets a{--ec:var(--ev);position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:16px 14px 13px;border-bottom:3px solid transparent;font-size:.9375rem;font-weight:500;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--u-texte2);transition:color .16s}
.u-clair .onglets a{--ec:var(--e)}
.onglets a:hover{color:var(--u-texte)}
.onglets a[aria-current="page"]{color:var(--u-texte);font-weight:600}
/* le trait de l'onglet : un élément à lui, qui glisse d'un onglet à l'autre (View Transitions) */
.o-filet{position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--ec);pointer-events:none}
.onglets a:focus-visible{outline-offset:-4px}
.o-court{display:none}
.onglets.court .o-long{display:none}
.onglets.court .o-court{display:inline}

.ch{position:relative;isolation:isolate;padding:clamp(64px,11vh,120px) var(--marge);background:var(--u-fond)}
.ch-alt{background:var(--u-fond2)}
.ch-int{max-width:1320px;margin:0 auto}
.ch-sur{margin-bottom:14px;font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--u-texte2)}
.ch-titre{display:flex;align-items:center;gap:.4em;margin-bottom:clamp(28px,5vh,52px);font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-grand);line-height:1.05;letter-spacing:-.005em;color:var(--u-vif);text-wrap:balance}
.ch-titre .motif{flex:none;width:.82em;height:.82em;stroke-width:18;opacity:.9}
.sous-titre{margin:44px 0 16px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:var(--t-moyen);line-height:1.15;color:var(--u-texte)}
.sous-titre:first-child{margin-top:0}
.cadre-u{display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:44px}
.cadre-u .pastille{color:var(--u-vif)}
.cadre-texte{font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.1;max-width:18em;text-wrap:balance}
.affirmations{display:grid;gap:26px;margin-bottom:clamp(40px,7vh,72px)}
.affirmation{max-width:26em;padding-left:22px;border-left:3px solid var(--u-vif);font-family:Gloock,Georgia,serif;font-size:clamp(1.375rem,2.6vw,2.125rem);line-height:1.24;text-wrap:pretty}
.lecture{display:grid;gap:clamp(36px,6vh,64px)}
.texte-u{display:grid;gap:1.1em;align-content:start;max-width:38em;font-size:1.125rem;line-height:1.72;overflow-wrap:break-word}
.texte-u a{color:var(--u-vif)}
.vers-liste{display:grid;gap:22px;align-content:start}
.vers{padding:6px 0 6px 24px;border-left:1px solid color-mix(in srgb,var(--u-vif) 55%,transparent)}
.vers p{font-family:Gloock,Georgia,serif;font-size:clamp(1.1875rem,1.8vw,1.5rem);line-height:1.42}
.vers .v{display:block}
.vers.prose .v::before{content:"« "}
.vers.prose .v::after{content:" »"}
.vers footer{margin-top:10px;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--u-texte2)}

.cartons{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,2.4vw,32px)}
.carton{position:relative;margin:0}
.carton img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--u-fond)}
.carton.grand img{aspect-ratio:16/9}
.carton figcaption{position:relative;margin:-34px 0 0 16px;max-width:min(30em,90%);padding:13px 18px;background:var(--u-fond);color:var(--u-texte);font-family:Gloock,Georgia,serif;font-size:1.0625rem;line-height:1.4;box-shadow:0 18px 40px -24px var(--noir-50)}
.ch-alt .carton figcaption{background:var(--u-fond)}
.ch:not(.ch-alt) .carton figcaption{background:var(--u-fond2)}
.credits{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:16px;font-size:.75rem;color:var(--u-texte2)}
.carton-seul{max-width:900px;margin-top:36px}

.video{position:relative;isolation:isolate;display:flex;align-items:flex-end;gap:20px;min-height:clamp(240px,40vw,520px);padding:clamp(20px,3vw,40px);overflow:hidden;border-radius:4px;background:var(--noir);color:var(--blanc);text-decoration:none}
.video img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;opacity:.66;transition:opacity .2s}
.video::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--noir-74),var(--noir-0) 62%)}
.video:hover img{opacity:.8}
.video-jouer{display:grid;place-items:center;flex:none;width:76px;height:76px;border-radius:50%;background:var(--u-vif);color:var(--u-sur);transition:transform .2s var(--ease)}
.video-jouer svg{width:28px;height:28px;margin-left:3px}
.video:hover .video-jouer{transform:scale(1.08)}
.video-titre{font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.15;text-wrap:balance}
.video-ext{margin-left:auto;align-self:flex-start;font-size:1.25rem}
/* les vidéos, lues dans la page (règle 18, LECTEUR) : l'affiche d'un chapitre (la photo du spectacle, assombrie vers le bas),
   le rond de lecture à la couleur de l'univers et le titre en bas à gauche ; la vidéo prend la place de l'affiche en
   montant, comme un chapitre ; « assombrir » éteint la salle autour d'elle, elle garde sa lueur */
.lc{position:relative}
.lc-cadre{border-radius:4px;box-shadow:0 34px 70px -34px var(--noir-70),0 0 0 1px color-mix(in srgb,var(--u-texte,var(--creme)) 14%,transparent);transition:box-shadow .45s var(--courbe)}
.lc-affiche{opacity:.66;transition:opacity .2s,transform .6s var(--ease)}
.lc-lire::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--noir-74),var(--noir-0) 62%);pointer-events:none}
.lc-lire:hover .lc-affiche{opacity:.8;transform:scale(1.02)}
.lc-lire:focus-visible{outline:3px solid var(--u-vif,var(--magenta-vif));outline-offset:-3px}
.lc-icone{z-index:1;left:clamp(20px,3vw,40px);top:auto;bottom:clamp(20px,3vw,40px);width:76px;height:76px;background:var(--u-vif,var(--magenta-vif));color:var(--u-sur,var(--nuit));transform:none;transition:transform .2s var(--ease)}
.lc-icone svg{width:30px;height:30px;margin-left:4px}
.lc-lire:hover .lc-icone,.lc-lire:focus-visible .lc-icone{transform:scale(1.08)}
.lc-titre{z-index:1;left:calc(clamp(20px,3vw,40px) + 96px);right:clamp(20px,3vw,40px);bottom:clamp(20px,3vw,40px);min-height:76px;display:flex;align-items:center;font-family:Gloock,Georgia,serif;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.15;text-wrap:balance;color:var(--blanc);text-shadow:0 2px 18px var(--noir-70)}
.lc-outils{gap:10px;margin-top:14px}
.lc-b{min-height:44px;padding:10px 18px 10px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte,var(--creme)) 40%,transparent);color:var(--u-texte,var(--creme));font-size:.9375rem;font-weight:600;line-height:1.2;transition:box-shadow .16s,background-color .16s,scale .12s var(--ease)}
.lc-b:hover{box-shadow:inset 0 0 0 1px var(--u-texte,var(--creme))}
.lc-b.mv-presse{scale:.97;transition-duration:.06s}
.lc.lc-eteint .lc-cadre{box-shadow:0 0 0 1.5px var(--u-vif,var(--magenta-vif)),0 0 110px var(--u-lueur,var(--magenta-30))}
.lc.lc-eteint .lc-nuit-b{background:var(--u-vif,var(--magenta-vif));color:var(--u-sur,var(--nuit));box-shadow:none}
.lc.lc-joue .lc-affiche{opacity:0}
.lc-nuit{background:var(--voile)}
.lc-groupe{margin:clamp(36px,5vh,56px) 0 14px;font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--u-texte2)}
.lc-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:26px 18px}
.lc-grille .lc-icone{left:50%;top:50%;bottom:auto;width:56px;height:56px;transform:translate(-50%,-50%)}
.lc-grille .lc-lire:hover .lc-icone,.lc-grille .lc-lire:focus-visible .lc-icone{transform:translate(-50%,-50%) scale(1.08)}
.lc-grille .lc-icone svg{width:22px;height:22px}
.lc-grille .lc-titre{left:16px;right:16px;bottom:12px;min-height:0;font-size:1.0625rem}
/* sous une petite vidéo, les deux boutons ne gardent que leur icône (leur libellé de D reste leur nom) */
.lc-grille .lc-outils{gap:6px;margin-top:8px}
.lc-grille .lc-b{width:44px;padding:0;justify-content:center}
.lc-grille .lc-b span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* la boîte (un catalogue, loin de toute vidéo) : sur le noir, les boutons restent crème */
.lc-boite .lc-b{color:var(--creme);box-shadow:inset 0 0 0 1px var(--creme-45)}
.lc-boite .lc-b:hover{box-shadow:inset 0 0 0 1px var(--creme)}
.lc-boite .lc-cadre{box-shadow:0 40px 90px -30px var(--noir-80)}
@media (max-width:759px){
  .lc-icone{width:60px;height:60px;left:16px;bottom:16px}
  .lc-icone svg{width:24px;height:24px}
  .lc-titre{left:88px;right:16px;bottom:16px;min-height:60px;font-size:1.125rem}
}

.tournee-g{display:grid;gap:32px}
.tournee-note{font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.3;max-width:20em;margin-bottom:28px}
.ecran-u{margin-bottom:0;background:radial-gradient(70% 55% at 40% 20%,color-mix(in srgb,var(--u-bras) 22%,transparent),transparent 72%),var(--u-ecran)}
.fiche .date{--point:var(--u-vif);border-color:color-mix(in srgb,var(--u-texte) 16%,transparent)}
.fiche .dates-mois{border-color:color-mix(in srgb,var(--u-texte) 45%,transparent)}
.fiche .date-details a{color:var(--u-texte)}
.lieux-u{max-width:62em;font-size:.9375rem;line-height:1.7;color:var(--u-texte2);margin-bottom:36px}

/* ---------- réserver une date, d'un geste (règle 17, RESERVER) : le chapitre qui avance ----------
   Chaque date est une tuile de chapitre (sa barre se remplit au survol, comme un chapitre qu'on entame ; pleine, à la
   couleur de l'univers, quand on la choisit) ; la carte de la date choisie est un écran d'affiche : la photo du spectacle
   qui se fond dans la nuit de son univers, sa barre de progression en tête, et « Réserver », le seul geste plein. */
.rs-zone{position:relative}
.rs-tete{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;margin:0 0 10px}
.rs-k-bande{font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--u-texte2)}
.rs-defile{display:flex;gap:8px;visibility:hidden}
.rs-zone.rs-deborde .rs-defile{visibility:visible}
.rs-defile button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 40%,transparent);transition:box-shadow .16s,opacity .16s}
.rs-defile button:hover{box-shadow:inset 0 0 0 1px var(--u-texte)}
.rs-defile button[disabled]{opacity:.3;cursor:default}
.rs-defile svg{width:20px;height:20px}
.rs-bande{gap:10px;margin:0 calc(-1 * var(--marge));padding:6px var(--marge) 20px;scroll-padding-inline:var(--marge);scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--noir) var(--marge),var(--noir) calc(100% - var(--marge)),transparent);mask-image:linear-gradient(90deg,transparent,var(--noir) var(--marge),var(--noir) calc(100% - var(--marge)),transparent)}
.rs-bande::-webkit-scrollbar{display:none}
.rs-date{position:relative;min-width:8.6rem;max-width:13rem;min-height:44px;padding:17px 16px 14px;border-radius:4px;background:color-mix(in srgb,var(--u-texte) 6%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 24%,transparent);color:var(--u-texte);transition:background-color .18s var(--courbe),box-shadow .18s var(--courbe),color .18s var(--courbe),scale .12s var(--courbe)}

.rs-carte{position:relative;isolation:isolate;overflow:hidden;min-height:340px;border-radius:4px;background:radial-gradient(60% 80% at 82% 64%,var(--u-lueur),transparent 72%),var(--u-fond2);color:var(--u-texte);box-shadow:0 0 0 1px color-mix(in srgb,var(--u-texte) 14%,transparent),0 34px 64px -40px var(--noir-70)}

.rs-c{position:relative;display:flex;flex-direction:column;align-items:flex-start;max-width:31rem;padding:clamp(28px,3.6vw,46px) clamp(22px,3.2vw,44px)}

a.rs-seance:hover{box-shadow:inset 0 0 0 1.5px var(--u-vif);background:color-mix(in srgb,var(--u-vif) 12%,transparent)}
a.rs-seance:focus-visible{outline:2px solid var(--u-vif);outline-offset:2px}

/* « Réserver » : le geste évident de la carte, plein, à la couleur de l'univers */
.rs-reserver{min-height:56px;gap:18px;padding:13px 22px 13px 28px;border-radius:999px;background:var(--u-vif);color:var(--u-sur);transition:box-shadow .18s var(--courbe),scale .12s var(--courbe)}

/* sur « Je viens voir un spectacle » : la date d'une ligne est sa tuile (sur le papier, sa barre à la couleur du spectacle) ;
   choisie, elle prend l'univers du spectacle, et sa carte s'ouvre sous la ligne */
.date.rs-li{grid-template-columns:7.25rem minmax(0,1fr)}
.rs-date--ligne{width:100%;min-width:0;max-width:none;align-self:start;padding:14px 10px 12px;background:var(--champ);color:var(--encre);box-shadow:inset 0 0 0 1px var(--trait)}

.rs-date--ligne:focus-visible{outline:2px solid currentColor;outline-offset:3px}

.rs-date--ligne[aria-pressed="true"]{background:color-mix(in srgb,var(--point,var(--magenta)) 16%,var(--champ));color:var(--encre);box-shadow:inset 0 0 0 1.5px var(--point,var(--magenta))}
.rs-date--ligne[aria-pressed="true"]::before{background:var(--point,var(--magenta));opacity:1}
.rs-date--ligne[aria-pressed="true"] :is(.rs-s,.rs-h--sans){color:var(--encre)}
.rs-ici{grid-column:1/-1;margin-top:10px;transform-origin:50% 0}

.rs-ici .rs-sp{font-size:clamp(1.6rem,1.2rem + 1.2vw,2.2rem)}

.distrib{display:grid;gap:36px}
/* la distribution en portraits (D.personnes, show.equipe) : chaque comédien sur son écran, la photo pleine ou, sans elle, l'écran de l'univers et ses initiales ; le nom en bas, sur la photo ; ceux qui alternent vont par deux */
.cast{--g:clamp(10px,1.4vw,18px);--pw:176px;--pmax:336px;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:clamp(24px,3vw,36px) var(--g);max-width:calc(var(--n,4) * var(--pmax) + (var(--n,4) - 1) * var(--g));margin:0 0 clamp(36px,6vh,60px);padding:0}

.cast-nom{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:0 12px 12px;font-family:var(--u-titre);font-weight:var(--u-graisse);font-size:clamp(1.1rem,1rem + .5vw,1.45rem);line-height:1.1;color:var(--blanc);text-shadow:0 1px 14px var(--noir-50);text-wrap:balance}
.cast-pt figcaption{display:block}

.consignes{display:grid;gap:18px;max-width:46em}

/* ---------- la carte des tournées, dans l'univers de la 09 (CARTE.svg) ---------- */
.carte-m09{color:var(--creme);--bras:var(--magenta-vif);--point-fond:var(--nuit)}
.carte-m09 .carte-pays{fill:var(--creme-04);stroke:var(--creme-32);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.carte-m09 .carte-voisin{fill:none;stroke:var(--creme-16);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 4}
.carte-m09 .carte-bras{fill:var(--bras);transition:opacity .3s}
.carte-m09 .carte-bras-passe{fill:var(--creme-22)}
.carte-m09 .carte-bout-passe{fill:var(--creme-45)}
.carte-m09 .carte-spirale{fill:none;stroke:var(--bras);stroke-width:1.3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.carte-m09 .carte-lieu{cursor:pointer;outline:none}
