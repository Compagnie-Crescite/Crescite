<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --creme:#f3eee9;
  --creme-2:rgba(243,238,233,.76);
  --papier:#f3eee9;
  --encre:#1a1016;
  --encre-2:#5e5158;
  --trait:rgba(26,16,22,.14);
  --nuit:#140c12;
  --magenta:#bc3e80;
  --magenta-vif:#ef84b8;
  --muet:var(--creme-2);
  --marge:clamp(20px,4.2vw,64px);
  --interieur:clamp(40px,6.6vw,120px);
  --tete-h:76px;
  --ease:cubic-bezier(.22,.7,.12,1);
  --t-ouverture:clamp(3rem,min(8.4vw,13.5vh),7.5rem);
  --t-titre:clamp(2.5rem,min(5.6vw,9.4vh),5rem);
  --t-page:clamp(2.125rem,5.2vw,4.75rem);
  --t-grand:clamp(2rem,3.6vw,3.25rem);
  --t-moyen:clamp(1.375rem,2vw,1.75rem);
  --t-corps:1.0625rem;
  --t-petit:.875rem;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--nuit);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.aimante{scroll-snap-type:y mandatory}
body{margin:0;overflow-x:clip;background:var(--nuit);color:var(--creme);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--t-corps);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}

/* l'ouverture commune, dans le dégradé prune de la 09 : le dégradé suit l'écran, pas le grand rectangle */
.intro.m09-intro .intro-fond{x:0;y:0;width:100%;height:100%}
.intro.m09-intro .intro-indice{color:var(--creme)}

/* lien d'évitement */
.evitement{position:fixed;left:var(--marge);top:12px;z-index:100;padding:10px 18px;border-radius:999px;background:var(--creme);color:var(--encre);font-weight:600;text-decoration:none;transform:translateY(-160%);transition:transform .2s}
.evitement:focus{transform:none}

/* en-tête */
.tete{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--tete-h);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--marge);color:var(--creme);background:rgba(20,12,18,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background-color .45s var(--ease),color .45s var(--ease),box-shadow .45s var(--ease)}
.tete[data-ton="clair"]{background:rgba(243,238,233,.94);color:var(--encre);box-shadow:0 1px 0 var(--trait)}
.tete[data-ton="sombre"]{background:rgba(20,12,18,.92);box-shadow:0 1px 0 rgba(243,238,233,.08)}
.marque{display:inline-flex;align-items:center;gap:12px;flex:none;text-decoration:none;border-radius:4px}
.marque-pieuvre{width:62px;flex:none;color:#fff;transition:color .45s var(--ease)}
.tete[data-ton="clair"] .marque-pieuvre{color:var(--magenta)}
.marque-pieuvre svg{width:100%;height:auto}
.marque-mot{font-size:1.375rem;font-weight:600;line-height:1;letter-spacing:-.02em;margin-top:-3px}
.nav ul{display:flex;align-items:center;gap:clamp(18px,2.2vw,40px)}
.nav a{position:relative;display:block;padding:10px 0;font-size:1rem;font-weight:500;letter-spacing:.01em;text-decoration:none;white-space:nowrap}
.nav a::before{content:attr(data-texte);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.nav a[aria-current="page"]{font-weight:600}
.nav a[aria-current="page"]::after{height:2px;bottom:4px;background:var(--magenta-vif)}
.tete[data-ton="clair"] .nav a[aria-current="page"]::after{background:var(--magenta)}
.menu-bouton{display:none}

/* sommaire des chapitres (bureau) */
.sommaire{display:none}

/* chapitres : base téléphone, photo au-dessus du texte */
.chap{position:relative;isolation:isolate;overflow:hidden;background:var(--fond,var(--nuit));color:var(--creme)}
.chap::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 60% at 50% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 72%)}
.chap-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:color-mix(in srgb,var(--accent) 8%,var(--fond,#000))}
.chap-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%}
.chap-credit{position:absolute;right:14px;bottom:10px;z-index:1;max-width:80%;font-size:.75rem;line-height:1.4;text-align:right;color:rgba(243,238,233,.8);text-shadow:0 1px 8px rgba(0,0,0,.75)}
.chap-texte{display:flex;flex-direction:column;align-items:flex-start;padding:34px var(--marge) 76px}
.chap-sur{margin-bottom:16px;font-size:var(--t-petit);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.chap-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-titre);line-height:1;letter-spacing:-.012em;max-width:10.5em;text-wrap:balance}
.chap-sous{margin-top:14px;font-size:1.125rem;color:var(--creme-2)}
.chap-accroche{margin-top:26px;font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.32;max-width:21em;text-wrap:pretty}
.chap-tournee{margin-top:30px;max-width:24rem}
.chap-tournee .surtitre::before{content:"";width:28px;height:2px;background:var(--accent)}
.surtitre{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--t-petit);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muet)}
.chap-date-quand{margin-top:10px;font-weight:600;color:var(--creme)}
.chap-date-ou{color:var(--creme-2)}
.chap-note{margin-top:10px;color:var(--creme-2)}
.bouton{display:inline-flex;align-items:center;gap:14px;margin-top:34px;padding:15px 22px 15px 26px;border-radius:999px;background:var(--accent);color:var(--fond,var(--nuit));font-weight:600;font-size:1rem;line-height:1.2;text-decoration:none;transition:box-shadow .45s var(--ease)}
.bouton .fleche{display:inline-block;transition:transform .45s var(--ease)}
.bouton:hover{box-shadow:0 14px 34px -14px color-mix(in srgb,var(--accent) 80%,transparent)}
.bouton:hover .fleche{transform:translateX(5px)}
.bouton:focus-visible{outline-color:var(--creme)}
.pastille{display:inline-block;padding:2px 10px 1px;border:1px solid currentColor;border-radius:999px;font-size:.8125rem;font-weight:500;letter-spacing:.06em;line-height:1.5;white-space:nowrap}

/* le chapitre de la carte : la saison, mois par mois, les bras poussent au fil du défilement */
.chap-carte{position:relative;height:calc(100vh + var(--pas,8) * 42vh + 50vh);height:calc(100svh + var(--pas,8) * 42svh + 50svh);background:var(--nuit);color:var(--creme);--accent:var(--magenta-vif);--fond:var(--nuit)}
.cc-scene{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:minmax(0,50fr) minmax(0,50fr)}
.cc-scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 105%,rgba(188,62,128,.14),transparent 70%)}
.cc-carte{position:relative;min-height:0;margin-top:var(--tete-h);-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
.cc-svg{position:absolute;inset:0;width:100%;height:100%;max-width:none;overflow:hidden}
.cc-pays{fill:rgba(243,238,233,.035);stroke:rgba(243,238,233,.32);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cc-voisin{fill:none;stroke:rgba(243,238,233,.15);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 4}
.cc-traces{fill:none;stroke:rgba(243,238,233,.24);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cc-b{opacity:.95;transition:opacity .5s var(--ease)}
.cc-b.est-passe{opacity:.4}
.cc-s{fill:none;stroke:var(--magenta-vif);stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.cc-p{fill:none;stroke:#fff;stroke-width:0;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke-width .4s var(--ease),stroke .4s}
.cc-p.est-pousse{stroke-width:5;stroke:rgba(243,238,233,.72)}
.cc-p.est-actif{stroke-width:10;stroke:#fff}
.cc-rouen{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cc-onde{fill:none;stroke:var(--magenta-vif);stroke-width:11;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
.cc-noms{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cc-nom{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s var(--ease)}
.cc-nom > span{position:absolute;left:12px;top:0;transform:translateY(-52%);white-space:nowrap;font-family:Gloock,Georgia,serif;font-size:1.25rem;line-height:1;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.6)}
.cc-nom.a-gauche > span{left:auto;right:12px}
.cc-nom.est-visible,.cc-nom-rouen{opacity:1}
.cc-nom-rouen > span{left:12px;top:-14px;font-family:Inter,system-ui,sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta-vif)}
.cc-texte{position:relative;display:flex;flex-direction:column;min-height:0;padding:4px var(--marge) 22px}
.cc-sur::before{content:"";width:28px;height:2px;background:var(--magenta-vif)}
.cc-titre{margin-top:8px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.875rem,4.2vw,3.5rem);line-height:1;letter-spacing:-.012em}
.cc-rail{position:relative;flex:1;min-height:0;margin-top:14px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 0,#000 70%,transparent)}
.cc-liste{position:absolute;left:0;right:0;top:0;will-change:transform}
.cc-m{padding-bottom:30px;opacity:.2;transition:opacity .5s var(--ease)}
.cc-m.est-actif{opacity:1}
.cc-m-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.5rem,2.4vw,2.25rem);line-height:1.05;color:var(--magenta-vif)}
.cc-lignes{margin-top:10px;max-width:30rem}
.cc-ligne{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;padding:8px 0;border-top:1px solid rgba(243,238,233,.12)}
.cc-quand{font-weight:600}
.cc-ou{color:var(--creme-2)}
.cc-quoi{display:flex;align-items:center;gap:8px;width:100%;font-size:var(--t-petit);color:var(--creme-2)}
.cc-quoi::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c,currentColor)}
.cc-bouton{align-self:flex-start;margin-top:14px}
.chap-carte.est-statique{height:auto}
.chap-carte.est-statique .cc-scene{position:relative;height:auto;overflow:visible;display:block}
.chap-carte.est-statique .cc-carte{height:min(64vh,540px);-webkit-mask-image:none;mask-image:none}
.chap-carte.est-statique .cc-texte{padding-bottom:72px}
.chap-carte.est-statique .cc-rail{overflow:visible;-webkit-mask-image:none;mask-image:none}
.chap-carte.est-statique .cc-liste{position:static;transform:none!important}
.chap-carte.est-statique .cc-m{opacity:1}

/* la fin de l'accueil : les trois portes, puis les donateurs */
.fin{background:var(--papier);color:var(--encre);--muet:var(--encre-2);padding:calc(var(--tete-h) + 48px) var(--marge) clamp(64px,10vh,104px)}
.fin-int{max-width:1320px;margin:0 auto}
.portes{display:grid;gap:14px}
.porte{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;min-height:9rem;padding:22px 22px 24px;border-top:3px solid var(--porte);background:color-mix(in srgb,var(--porte) 7%,transparent);color:var(--encre);text-decoration:none;transition:color .5s var(--ease)}
.porte::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--porte);transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease)}
.porte:hover,.porte:focus-visible{color:#fff}
.porte:hover::before,.porte:focus-visible::before{transform:none}
.porte:focus-visible{outline:2px solid var(--encre);outline-offset:4px}
.porte-titre{font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.12;max-width:12em;text-wrap:balance}
.porte-fleche{flex:none;display:grid;place-items:center;width:52px;height:52px;border:1px solid currentColor;border-radius:50%;color:var(--porte);transition:color .5s var(--ease),transform .5s var(--ease)}
.porte-fleche svg{width:20px;height:20px}
.porte:hover .porte-fleche,.porte:focus-visible .porte-fleche{color:#fff;transform:translateX(4px)}
.donateurs{margin-top:clamp(48px,8vh,80px);max-width:64em;font-size:var(--t-petit);line-height:1.75;color:var(--muet)}

/* les pages des onglets, sur papier */
.libre{background:var(--papier);color:var(--encre);--muet:var(--encre-2)}
.bloc{padding:clamp(72px,12vh,128px) var(--marge)}
.bloc + .bloc{padding-top:0}
.grille{display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(16px,2.2vw,32px);max-width:1320px;margin:0 auto}
.page > .bloc:first-child{padding-top:calc(var(--tete-h) + clamp(44px,8vh,96px))}
.page-tete{margin-bottom:clamp(36px,6vh,64px)}
.page-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-page);line-height:1;letter-spacing:-.012em;text-wrap:balance;overflow-wrap:break-word}
.surtitre + .page-titre{margin-top:16px}
.surtitre a{text-decoration:none}
.surtitre a:hover{text-decoration:underline}
.bloc-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-grand);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.prose{max-width:38em;font-size:1.0625rem;line-height:1.72;overflow-wrap:break-word}
.prose > * + *{margin-top:1em}
.prose h2{margin-top:1.8em;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.2}
.prose > h2:first-child{margin-top:0}
.prose ul{padding-left:1.2em;list-style:disc}
.prose li + li{margin-top:.55em}
.prose a{color:var(--magenta)}

/* spectacles */
.vignettes{display:grid;grid-template-columns:minmax(0,1fr);gap:44px}
.vignette{position:relative;display:flex;flex-direction:column}
.vignette-photo{position:relative;overflow:hidden;aspect-ratio:4/3;margin-bottom:18px;background:var(--fond)}
.vignette-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%;transition:transform 1.2s var(--ease)}
.vignette:hover .vignette-photo img{transform:scale(1.04)}
.vignette-sur{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:var(--t-petit);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.vignette-titre{margin-top:8px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:1.625rem;line-height:1.1;text-wrap:balance}
.vignette-titre a{text-decoration:none}
.vignette-titre a::after{content:"";position:absolute;inset:0}
.vignette-titre a:focus-visible{outline:none}
.vignette:has(a:focus-visible){outline:2px solid var(--encre);outline-offset:6px}
.vignette:hover .vignette-titre a{text-decoration:underline}
.vignette-sous{margin-top:6px;color:var(--muet)}

/* agenda, saisons : la carte dans un écran sombre, reliée à la liste */
.ecran{position:relative;margin-bottom:40px;padding:clamp(12px,2vw,24px);border-radius:6px;background:radial-gradient(70% 55% at 40% 20%,rgba(188,62,128,.3),rgba(188,62,128,0) 72%),var(--nuit);color:var(--creme)}
.ecran .carte{width:100%;height:auto;max-height:calc(100vh - var(--tete-h) - 150px);margin:0 auto}
.carte-filtre{display:flex;align-items:center;min-height:40px;margin-top:6px}
.filtre-puce{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:var(--magenta-vif);color:var(--nuit);font-weight:600;font-size:var(--t-petit)}
.dates-groupe + .dates-groupe{margin-top:44px}
.dates-mois{padding-bottom:12px;border-bottom:1px solid currentColor;font-size:var(--t-petit);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.date{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:4px 20px;padding:18px 10px 20px 12px;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent);transition:background-color .3s,box-shadow .3s}
.date.est-survol{background:color-mix(in srgb,var(--point) 12%,transparent);box-shadow:inset 3px 0 0 var(--point)}
.date-quand{min-width:0}
.date-jour{display:block;font-family:Gloock,Georgia,serif;font-size:1.5rem;line-height:1.1;overflow-wrap:break-word}
.date-moisan{display:block;margin-top:4px;font-size:var(--t-petit);color:var(--muet)}
.date-corps{min-width:0}
.date-quoi a{display:inline-flex;align-items:baseline;gap:10px;font-weight:600;text-decoration:none}
.date-quoi a:hover{text-decoration:underline}
.date-point{flex:none;width:9px;height:9px;border-radius:50%;background:var(--point);transform:translateY(-1px)}
.date-ou{font-weight:500}
.date-quoi + .date-ou{font-weight:400}
.date-details{margin-top:4px;color:var(--muet)}
.date-details li + li{margin-top:4px}
.saisons-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));column-gap:clamp(16px,2.2vw,32px);border-top:1px solid var(--encre)}
.saisons-liste a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--trait);font-family:Gloock,Georgia,serif;font-size:1.375rem;line-height:1.2;text-decoration:none}
.saisons-liste a::after{content:"→";font-family:Inter,system-ui,sans-serif;font-size:1rem;color:var(--magenta);transition:transform .4s var(--ease)}
.saisons-liste a:hover::after{transform:translateX(4px)}
.saison-sp + .saison-sp{margin-top:56px}
.saison-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.12}
.saison-titre a{text-decoration:none}
.saison-titre a:hover{text-decoration:underline}
.saison-sous{margin-top:6px;color:var(--muet)}
.saison-creation{margin-top:2px;font-size:var(--t-petit);color:var(--muet)}
.saison-dates{margin-top:18px;border-top:1px solid var(--encre)}
.ds{padding:14px 10px 14px 12px;border-bottom:1px solid var(--trait);transition:background-color .3s,box-shadow .3s}
.ds.est-survol{background:rgba(188,62,128,.08);box-shadow:inset 3px 0 0 var(--magenta)}
.ds-ligne{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.ds-ligne a{display:contents;color:inherit}
.ds-quand{font-weight:600}
.ds-ou{color:var(--muet)}
.ds-ligne a:hover .ds-ou{text-decoration:underline}
.ds .pastille{margin-top:6px;color:var(--magenta)}
.ds.est-annule .ds-quand,.ds.est-annule .ds-ou{text-decoration:line-through}

/* la compagnie, les actions culturelles, les mentions */
.frise{margin-top:24px;border-top:1px solid var(--encre)}
.frise li{display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--trait)}
.frise-annee{font-family:Gloock,Georgia,serif;font-size:1.5rem;line-height:1;color:var(--magenta)}
.cie-dates{margin-top:64px}
.actions-photo{margin-bottom:clamp(36px,6vh,64px)}
.actions-photo img{width:100%;aspect-ratio:3/2;object-fit:cover}
.actions-photo figcaption{margin-top:8px;font-size:.75rem;color:var(--muet)}

/* formulaires d'origine */
.formulaire{display:grid;gap:22px;max-width:42rem}
.form-texte{max-width:34em}
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-weight:500}
.champ input,.champ textarea{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--encre);border-radius:0;background:transparent}
.champ textarea{padding:12px;border:1px solid var(--encre);resize:vertical}
.champ input:focus-visible,.champ textarea:focus-visible{outline:2px solid var(--magenta);outline-offset:3px}
.case{display:flex;align-items:flex-start;gap:12px}
.case input{flex:none;width:20px;height:20px;margin:3px 0 0;accent-color:var(--magenta)}
.case a{color:var(--magenta)}
.champ-calcul{flex-direction:row;align-items:center;gap:14px}
.champ-calcul input{width:4.5rem;text-align:center;border:1px solid var(--encre);padding:8px}
.bouton-plein{display:inline-flex;align-items:center;gap:14px;padding:15px 30px;border-radius:999px;background:var(--encre);color:var(--papier);font-weight:600;line-height:1.2;transition:background-color .3s}
.bouton-plein:hover{background:var(--magenta)}
.coordonnees{margin-top:48px;font-style:normal;color:var(--muet)}
.coordonnees strong{display:block;margin-bottom:6px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-moyen);line-height:1.2;color:var(--encre)}

/* pied de page */
.pied{background:var(--nuit);color:var(--creme);padding:clamp(80px,13vh,136px) var(--marge) 36px;--muet:var(--creme-2)}
.pied .grille{row-gap:40px}
.pied-ecrire{display:inline-block;font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.04;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease)}
.pied-ecrire:hover{background-size:100% 1px}
.pied-adresse{margin-top:20px;color:var(--creme-2);font-style:normal}
.pied-facebook{margin-top:10px;color:var(--creme-2)}
.pied-partenaires{max-width:34em;font-size:var(--t-petit);line-height:1.7;color:var(--creme-2)}
.pied-legal{font-size:var(--t-petit);color:var(--creme-2)}
.pied-legal li + li{margin-top:4px}
.pied-bas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;margin-top:clamp(40px,7vh,80px);padding-top:26px;border-top:1px solid rgba(243,238,233,.14);color:var(--creme-2);font-size:var(--t-petit)}
.pied-marque{display:flex;align-items:center;gap:14px;text-decoration:none}
.pied-pieuvre{width:44px;color:var(--creme)}
.pied-pieuvre svg{width:100%;height:auto}
.pied-nav{display:flex;flex-wrap:wrap;gap:8px 22px}
.pied-nav a{text-decoration:none}
.pied-nav a:hover{text-decoration:underline}

/* page spectacle : l'ouverture */
.ouverture{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:var(--fond);color:var(--creme)}
.ouv-photo{position:relative;flex:none;height:58vh;height:58svh;overflow:hidden}
.ouv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%}
.ouv-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--fond) 0%,var(--fond) 4%,color-mix(in srgb,var(--fond) 0%,transparent) 46%),linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 26%)}
.ouv-contenu{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--marge) 44px}
.retour{display:inline-flex;align-items:center;gap:10px;font-weight:500;text-decoration:none;border-radius:4px}
.retour span{transition:transform .45s var(--ease)}
.retour:hover span{transform:translateX(-4px)}
.ouv-haut{position:absolute;top:calc(var(--tete-h) + 18px);left:var(--marge);right:var(--marge);z-index:2;display:flex;justify-content:space-between;gap:20px;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.ouv-sur{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:18px;font-size:var(--t-petit);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.ouv-titre{font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-ouverture);line-height:.96;letter-spacing:-.015em;max-width:11em;text-wrap:balance}
.ouv-sous{margin-top:18px;font-size:1.125rem;color:var(--creme-2)}
.ouv-credit{position:absolute;right:var(--marge);bottom:14px;z-index:2;max-width:70%;text-align:right;font-size:.75rem;color:rgba(243,238,233,.72);text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* page spectacle : le texte, la fiche */
.papier{background:var(--papier);color:var(--encre);--muet:var(--encre-2)}
.fiche-corps{padding:clamp(72px,12vh,128px) var(--marge)}
.fiche-texte{font-size:1.125rem;line-height:1.72;max-width:36em}
.fiche-texte p + p{margin-top:1.1em}
.fiche-infos{margin-top:48px;padding-top:12px;border-top:1px solid var(--encre)}
.fiche-ligne{padding:9px 0;border-bottom:1px solid var(--trait)}
.fiche-libelle{color:var(--muet)}
.fiche-duree{margin-top:16px;font-weight:600}
.fiche-mention{margin-top:14px;padding:12px 14px;border-left:3px solid var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.fiche-mention a{color:var(--ink)}
.fiche-prod{margin-top:22px;font-size:var(--t-petit);line-height:1.65;color:var(--muet)}
.fiche-prod p + p{margin-top:6px}
.fiche-prod strong{color:var(--encre);font-weight:600}
.medias{margin-top:30px}
.medias-groupe{margin-top:18px;font-size:var(--t-petit);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muet)}
.media a{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--trait);font-weight:600;line-height:1.35;text-decoration:none;color:var(--ink)}
.media a:hover .media-titre{text-decoration:underline}
.media-ico{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--papier)}
.media-ico svg{width:12px;height:12px}
.media-par{display:block;margin-top:2px;font-size:var(--t-petit);font-weight:400;color:var(--muet)}
.cas-cadre{margin-bottom:clamp(40px,7vh,72px);font-family:Gloock,Georgia,serif;font-size:var(--t-grand);line-height:1.1;max-width:18em;text-wrap:balance}
.extraits{display:grid;gap:30px;margin-top:clamp(56px,9vh,96px);padding-top:clamp(40px,6vh,64px);border-top:1px solid var(--trait)}
.extrait blockquote p{font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.3;text-wrap:pretty}
.extrait-source{margin-top:10px;font-size:var(--t-petit);color:var(--muet)}

/* page spectacle : la tournée, un chapitre sombre avec sa carte */
.tournee{position:relative;isolation:isolate;padding:clamp(72px,12vh,128px) var(--marge);background:var(--fond);color:var(--creme);--muet:var(--creme-2)}
.tournee::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 50% at 72% 40%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%)}
.tournee-int{display:grid;gap:40px;max-width:1320px;margin:0 auto}
.tournee-titre{margin-bottom:28px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-grand);line-height:1.04;letter-spacing:-.01em}
.tournee-note{font-family:Gloock,Georgia,serif;font-size:var(--t-moyen);line-height:1.3;max-width:20em;color:var(--creme-2)}
.tournee .dates-mois{border-color:color-mix(in srgb,currentColor 45%,transparent)}
.tournee .date-quoi a,.tournee .date-details a{color:var(--creme)}
.tournee-carte .carte{width:100%;height:auto;max-height:calc(100vh - var(--tete-h) - 110px);margin:0 auto}
.tournee--seule .tournee-int{max-width:900px}

/* la carte des tournées, dans l'univers de la 09 (CARTE.svg) */
.carte-m09{color:var(--creme);--bras:var(--accent,#ef84b8)}
.carte-m09 .carte-pays{fill:rgba(243,238,233,.04);stroke:rgba(243,238,233,.32);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.carte-m09 .carte-voisin{fill:none;stroke:rgba(243,238,233,.16);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 4}
.carte-m09 .carte-bras{fill:var(--bras);transition:opacity .3s}
.carte-m09 .carte-bras-passe{fill:rgba(243,238,233,.2)}
.carte-m09 .carte-bout-passe{fill:rgba(243,238,233,.42)}
.carte-m09 .carte-spirale{fill:none;stroke:var(--bras);stroke-width:1.3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.carte-m09 .carte-lieu{cursor:pointer;outline:none}
.carte-m09 .carte-point{fill:var(--fond,var(--nuit));stroke:var(--bras);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;transition:transform .3s var(--ease),fill .3s}
.carte-m09 .carte-lieu:hover .carte-point,.carte-m09 .carte-lieu.est-survol .carte-point,.carte-m09 .carte-lieu.est-choisi .carte-point{fill:#fff;transform:scale(1.7)}
.carte-m09 .carte-lieu:focus-visible .carte-point{fill:#fff;stroke:#fff;stroke-width:3;transform:scale(1.9)}
.carte-m09 .carte-nom{font:500 20px Inter,system-ui,sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(12,7,10,.85);stroke-width:5px;stroke-linejoin:round;opacity:0;pointer-events:none;transition:opacity .25s}
.carte-m09.noms-visibles .carte-nom,.carte-m09 .carte-nom.est-survol,.carte-m09 .carte-nom.est-choisi{opacity:1}
.carte-m09.a-survol .carte-bras:not(.est-survol),.carte-m09.a-choix .carte-bras:not(.est-choisi){opacity:.28}
.carte-m09 .carte-rouen{fill:#fff}
.carte-m09 .carte-rouen-nom{font:22px Gloock,Georgia,serif;fill:#fff;paint-order:stroke;stroke:rgba(12,7,10,.8);stroke-width:5px}

/* spectacle suivant */
.suivant{background:var(--fond);color:var(--creme)}
.suivant-lien{position:relative;isolation:isolate;display:flex;flex-direction:column;text-decoration:none}
.suivant-photo{position:relative;overflow:hidden;aspect-ratio:16/10}
.suivant-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--focale,50%) 50%;transition:transform 1.4s var(--ease)}
.suivant-lien:hover .suivant-photo img{transform:scale(1.04)}
.suivant-texte{display:flex;flex-direction:column;align-items:flex-start;padding:36px var(--marge) 72px}
.suivant-sur{font-size:var(--t-petit);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.suivant-titre{margin-top:16px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:var(--t-titre);line-height:1;letter-spacing:-.012em;text-wrap:balance}
.suivant-sous{margin-top:14px;color:var(--creme-2)}
.suivant-fleche{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;margin-top:34px;border-radius:50%;background:var(--accent);color:var(--fond);font-size:1.5rem;transition:transform .5s var(--ease)}
.suivant-lien:hover .suivant-fleche{transform:translateX(8px)}
.suivant-lien:focus-visible{outline-color:var(--creme);outline-offset:-6px}

/* en dessous de 1280 px : le menu replié */
@media (max-width:1279px){
  .menu-bouton{display:inline-flex;align-items:center;gap:12px;padding:10px 2px;font-size:1rem;font-weight:500}
  .menu-icone{position:relative;display:block;width:22px;height:10px}
  .menu-icone::before,.menu-icone::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .35s var(--ease),top .35s var(--ease)}
  .menu-icone::before{top:0}
  .menu-icone::after{top:8.5px}
  .tete.menu-ouvert .menu-icone::before{top:4.25px;transform:rotate(45deg)}
  .tete.menu-ouvert .menu-icone::after{top:4.25px;transform:rotate(-45deg)}
  .nav{position:fixed;left:0;right:0;top:var(--tete-h);bottom:0;display:none;overflow:auto;padding:28px var(--marge) 40px;background:var(--nuit);color:var(--creme)}
  .tete.menu-ouvert{background:var(--nuit);color:var(--creme);box-shadow:0 1px 0 rgba(243,238,233,.1);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tete.menu-ouvert .marque-pieuvre{color:#fff}
  .tete.menu-ouvert .nav{display:block}
  .nav ul{flex-direction:column;align-items:stretch;gap:0;max-width:760px}
  .nav li{border-bottom:1px solid rgba(243,238,233,.12)}
  .nav a{padding:16px 0;font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.2;white-space:normal}
  .nav a::before{display:none}
  .nav a::after{display:none}
  .nav a[aria-current="page"]{font-weight:400;color:var(--magenta-vif)}
  .nav a[aria-current="page"]::after,.tete[data-ton="clair"] .nav a[aria-current="page"]::after{display:block;left:auto;right:2px;top:50%;bottom:auto;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);background:var(--magenta-vif)}
}
@media (max-width:719px){
  :root{--tete-h:64px}
  .marque-pieuvre{width:52px}
  .marque-mot{font-size:1.25rem}
  .date{grid-template-columns:6rem minmax(0,1fr);gap:4px 16px}
  .date-jour{font-size:1.3125rem}
}

/* tablette et plus */
@media (min-width:720px){
  .date{grid-template-columns:9rem minmax(0,1fr)}
  .portes{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
  .porte{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:clamp(220px,40vh,400px);padding:26px 26px 30px}
  .porte-fleche{order:-1;align-self:flex-end}
  .porte-titre{font-size:clamp(1.75rem,2.7vw,2.5rem)}
  .vignettes{grid-template-columns:repeat(2,minmax(0,1fr));gap:56px clamp(20px,3vw,40px)}
  .extraits{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px clamp(24px,4vw,64px)}
  .suivant-lien{display:grid;grid-template-columns:1fr 1fr;min-height:min(80vh,780px)}
  .suivant-photo{aspect-ratio:auto}
  .suivant-texte{justify-content:center;padding:96px var(--marge) 96px var(--interieur)}
}

/* bureau : la grille à douze colonnes */
@media (min-width:960px){
  .grille{grid-template-columns:repeat(12,minmax(0,1fr))}
  .grille > *{grid-column:1/-1}
  .agenda-grille > .ecran{grid-column:1/span 5;position:sticky;top:calc(var(--tete-h) + 24px);align-self:start;margin-bottom:0}
  .agenda-grille > .agenda-liste{grid-column:7/-1}
  .cie-grille > .cie-texte{grid-column:1/span 7}
  .cie-grille > .cie-dates{grid-column:9/-1;margin-top:0;position:sticky;top:calc(var(--tete-h) + 40px);align-self:start}
  .actions-grille > .actions-photo{grid-column:1/span 6;position:sticky;top:calc(var(--tete-h) + 32px);align-self:start;margin-bottom:0}
  .actions-grille > .actions-prose{grid-column:8/-1}
  .form-grille > .formulaire-col{grid-column:1/span 7}
  .form-grille > .coordonnees{grid-column:9/-1;margin-top:0;align-self:end}
  .legal-grille > .prose{grid-column:1/span 8}
  .fiche-grille > .fiche-texte{grid-column:1/span 7}
  .fiche-grille > .fiche-infos{grid-column:9/-1;margin-top:0;align-self:start}
  .tournee-int{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5vw,80px);align-items:start}
  .tournee-carte{position:sticky;top:calc(var(--tete-h) + 24px)}
  .tournee--seule .tournee-int{grid-template-columns:minmax(0,1fr)}
  .pied .grille > .pied-contact{grid-column:1/span 5}
  .pied .grille > .pied-partenaires{grid-column:7/span 3}
  .pied .grille > .pied-legal{grid-column:10/-1}
}
@media (min-width:1100px){
  .vignettes{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* bureau : un chapitre par écran */
@media (min-width:1024px) and (min-height:600px){
  .tete[data-ton="chapitre"]{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:0 1px 14px rgba(0,0,0,.35)}
  .tete[data-ton="chapitre"] .marque-pieuvre{filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))}
  .chap{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always}
  .chap::before{background:radial-gradient(60% 70% at var(--lueur,72%) 58%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 72%)}
  .chap[data-photo="droite"]{--lueur:28%}
  .chap[data-photo="droite"] .chap-photo{order:2}
  .chap-photo{aspect-ratio:auto;min-height:100%}
  .chap-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 22%),linear-gradient(0deg,rgba(0,0,0,.36),rgba(0,0,0,0) 26%)}
  .chap-texte{justify-content:center;padding:calc(var(--tete-h) + 3vh) var(--marge) 7vh var(--interieur)}
  .chap[data-photo="droite"] .chap-texte{padding-left:var(--marge);padding-right:var(--interieur)}
  .chap-sur{margin-bottom:clamp(16px,3vh,28px)}
  .chap-sous{margin-top:clamp(10px,1.8vh,18px)}
  .chap-accroche{margin-top:clamp(18px,3.8vh,36px);font-size:min(var(--t-moyen),3.3vh)}
  .chap-tournee{margin-top:clamp(20px,4vh,40px)}
  .bouton{margin-top:clamp(22px,4vh,38px)}
  .chap-carte{scroll-snap-align:start;height:calc(100vh + var(--pas,8) * 42vh + 50vh)}
  .cc-scene{grid-template-columns:minmax(0,40fr) minmax(0,60fr);grid-template-rows:minmax(0,1fr)}
  .cc-carte{order:2;margin-top:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%);mask-image:linear-gradient(90deg,transparent 0,#000 12%)}
  .cc-texte{padding:calc(var(--tete-h) + 5vh) var(--marge) 7vh var(--interieur)}
  .cc-rail{margin-top:clamp(18px,4vh,40px)}
  .cc-m{padding-bottom:6vh}
  .chap-carte.est-statique .cc-scene{display:grid}
  .chap-carte.est-statique .cc-carte{position:sticky;top:0;height:100vh;align-self:start}
  .chap-carte.est-statique .cc-texte{padding-bottom:12vh}
  .fin{display:flex;flex-direction:column;justify-content:center;min-height:100vh;scroll-snap-align:start}
  .fin-int{width:100%}
  html.aimante .pied{scroll-snap-align:end}

  .sommaire{display:block;position:fixed;right:var(--marge);bottom:clamp(28px,5.5vh,52px);z-index:40;transition:opacity .45s var(--ease),visibility .45s}
  .sommaire.est-cache{opacity:0;visibility:hidden}
  .sommaire ol{display:flex;flex-direction:column;align-items:flex-end}
  .sommaire button{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:24px;padding-left:18px;color:var(--creme);border-radius:3px}
  .som-titre{padding:3px 10px;border-radius:999px;background:rgba(12,7,10,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:var(--t-petit);font-weight:500;letter-spacing:.01em;line-height:1.4;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease),transform .5s var(--ease)}
  .som-trait{display:block;width:18px;height:1.5px;border-radius:1px;background:currentColor;opacity:.5;box-shadow:0 0 8px rgba(0,0,0,.4);transition:width .55s var(--ease),opacity .35s,background-color .35s}
  .sommaire button:hover .som-trait{width:28px;opacity:.9}
  .sommaire button:hover .som-titre,.sommaire button:focus-visible .som-titre,.sommaire [aria-current="true"] .som-titre{opacity:1;transform:none}
  .sommaire [aria-current="true"] .som-trait{width:48px;opacity:1;background:var(--som-accent,var(--creme))}
  .sommaire button:focus-visible{outline-offset:3px}

  .ouverture{display:block}
  .ouv-photo{position:absolute;inset:0;height:auto;z-index:-2}
  .ouv-photo::after{background:linear-gradient(90deg,var(--fond) 0%,color-mix(in srgb,var(--fond) 78%,transparent) 30%,color-mix(in srgb,var(--fond) 0%,transparent) 66%),linear-gradient(0deg,var(--fond) 0%,color-mix(in srgb,var(--fond) 0%,transparent) 50%),linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 24%)}
  .ouv-contenu{position:absolute;inset:auto 0 0 0;padding:0 var(--marge) clamp(56px,10vh,104px)}
  .ouv-credit{bottom:22px}
}
@media (min-width:1024px) and (min-height:600px) and (max-height:820px){
  .chap-texte{padding-top:calc(var(--tete-h) + 6px);padding-bottom:28px}
  .chap-titre{font-size:clamp(2.5rem,min(5.6vw,8.6vh),5rem)}
  .chap-sur{margin-bottom:12px}
  .chap-sous{margin-top:8px}
  .chap-accroche{margin-top:16px;font-size:min(var(--t-moyen),3vh)}
  .chap-tournee{margin-top:20px}
  .bouton{margin-top:20px;padding-top:13px;padding-bottom:13px}
  .cc-texte{padding-top:calc(var(--tete-h) + 2vh);padding-bottom:4vh}
}

/* animations */
@media (prefers-reduced-motion:no-preference){
  .chap.attend .chap-texte > *{opacity:0;transform:translateY(24px)}
  .chap.attend .chap-photo img{transform:scale(1.08)}
  .chap.entre .chap-texte > *{transition:opacity .7s var(--ease),transform .9s var(--ease)}
  .chap.entre .chap-photo img{transition:transform 2.2s var(--ease)}
  .chap.entre .chap-texte > :nth-child(2){transition-delay:.05s}
  .chap.entre .chap-texte > :nth-child(3){transition-delay:.1s}
  .chap.entre .chap-texte > :nth-child(4){transition-delay:.15s}
  .chap.entre .chap-texte > :nth-child(5){transition-delay:.2s}
  .chap.entre .chap-texte > :nth-child(6){transition-delay:.25s}
  .chap.arme .chap-photo{clip-path:inset(0 100% 0 0)}
  .chap.arme .chap-photo img{transform:scale(1.08)}
  .chap.arme .chap-texte > *{opacity:0;transform:translateY(26px)}
  .chap.arme.vu .chap-photo{clip-path:inset(0);transition:clip-path 900ms cubic-bezier(.77,0,.18,1)}
  .chap.arme.vu .chap-photo img{transform:none;transition:transform 1600ms var(--ease)}
  .chap.arme.vu .chap-texte > *{opacity:1;transform:none;transition:opacity .8s var(--ease),transform 1s var(--ease)}
  .chap.arme.vu .chap-texte > :nth-child(1){transition-delay:.25s}
  .chap.arme.vu .chap-texte > :nth-child(2){transition-delay:.32s}
  .chap.arme.vu .chap-texte > :nth-child(3){transition-delay:.4s}
  .chap.arme.vu .chap-texte > :nth-child(4){transition-delay:.48s}
  .chap.arme.vu .chap-texte > :nth-child(5){transition-delay:.56s}
  .chap.arme.vu .chap-texte > :nth-child(6){transition-delay:.64s}
  .cc-onde{animation:onde 2.6s cubic-bezier(.2,.6,.3,1) infinite}
  .cc-rouen.est-actif + .cc-onde,.cc-onde.est-actif{animation-duration:1.4s}
  .ouv-photo{animation:devoile 900ms cubic-bezier(.77,0,.18,1) both .05s}
  .ouv-photo img{animation:recule 1.6s var(--ease) both .05s}
  .ouv-haut,.ouv-contenu > *{animation:entree 1s var(--ease) both .45s}
  .ouv-contenu > :nth-child(2){animation-delay:.53s}
  .ouv-contenu > :nth-child(3){animation-delay:.61s}
}
@keyframes onde{from{stroke-width:11;opacity:.6}to{stroke-width:54;opacity:0}}
@keyframes entree{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes devoile{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes recule{from{transform:scale(1.08)}to{transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header class="tete" id="tete" data-ton="chapitre">
  <a class="marque" id="marque" href="#/"><span class="marque-pieuvre" id="marque-pieuvre" aria-hidden="true"></span><span class="marque-mot" id="marque-mot" aria-hidden="true"></span></a>
  <button class="menu-bouton" id="menu-bouton" type="button" aria-expanded="false" aria-controls="nav-principale"><span class="menu-icone" aria-hidden="true"></span><span class="menu-texte"></span></button>
  <nav class="nav" id="nav-principale"><ul></ul></nav>
</header>
<nav class="sommaire est-cache" id="sommaire"><ol></ol></nav>
<main id="contenu" tabindex="-1">
  <div id="vue-accueil" hidden></div>
  <div id="vue-page" hidden></div>
  <div id="vue-spectacle" hidden></div>
</main>
<footer class="pied" id="pied" data-ton="sombre"></footer>
<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const doux = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

  const S = D.site;
  const L = S.libelles;
  const SHOWS = D.shows;
  const DATES = D.dates;
  const SAISON = S.saisons[0];
  const PAR_SLUG = Object.fromEntries(SHOWS.map((s) => [s.slug, s]));
  const MENU = Object.fromEntries(S.menu.map((m) => [m.id, m]));
  const PAR_ROUTE = Object.fromEntries(S.menu.map((m) => [m.href.replace(/^#\/?/, ''), m]));
  const titreOnglet = (x) => `${x} - ${S.titreSuffixe}`;
  const MQ_LARGE = matchMedia('(min-width: 1024px) and (min-height: 600px)');
  const MQ_REDUIT = matchMedia('(prefers-reduced-motion: reduce)');
  const doc = document.documentElement;
  const tete = $('#tete');
  const sommaire = $('#sommaire');
  const vueAccueil = $('#vue-accueil');
  const vuePage = $('#vue-page');
  const vueSpectacle = $('#vue-spectacle');
  const pied = $('#pied');
  const FLECHE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';

  /* une couleur de spectacle, assombrie pour se lire sur le papier */
  const canal = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const rvb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = (h) => { const [r, g, b] = rvb(h).map(canal); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const encre = (h, fond = '#f3eee9', cible = 4.8) => {
    if (!/^#[0-9a-f]{6}$/i.test(h || '')) return '#1a1016';
    let [r, g, b] = rvb(h); let c = h;
    while (contraste(c, fond) < cible && r + g + b > 0) {
      r = Math.floor(r * 0.92); g = Math.floor(g * 0.92); b = Math.floor(b * 0.92);
      c = '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
    }
    return c;
  };

  /* les textes de D, tels quels */
  const lignesTitre = (s) => (s.titreLignes && s.titreLignes.length ? s.titreLignes : [s.titre]).map(esc).join('<br>');
  const moisDe = (ligne) => (String(ligne || '').match(/(\S+\s\d{4})$/) || [null, ''])[1];
  const decoupe = (ligne) => { const m = String(ligne || '').match(/^(.*\S)\s+(\S+\s\d{4})$/); return m ? [m[1], m[2]] : [String(ligne || ''), '']; };
  const bloc = (h) => (/^\s*<(h\d|ul|ol|p|blockquote|div|figure|table)\b/i.test(h) ? h : `<p>${h}</p>`);
  // la première phrase entière d'un paragraphe (balises équilibrées), si elle est courte
  function premierePhrase(html, max = 200) {
    if (!html) return '';
    const re = /[.!?…](?=\s|<br\s*\/?>|$)/g;
    let m;
    while ((m = re.exec(html))) {
      const morceau = html.slice(0, m.index + 1);
      const texte = morceau.replace(/<[^>]+>/g, '');
      if (texte.length < 12) continue;
      const ouvre = (morceau.match(/<(em|strong|i|b|sup|sub|span|a)\b[^>]*>/gi) || []).length;
      const ferme = (morceau.match(/<\/(em|strong|i|b|sup|sub|span|a)>/gi) || []).length;
      if (ouvre !== ferme || /<br/i.test(morceau)) return '';
      return texte.length <= max ? morceau : '';
    }
    return '';
  }
  const details = (ds) => (ds && ds.length ? `<ul class="date-details">${ds.map((x) => `<li>${x.lien ? `<a href="${esc(x.lien)}" target="_blank" rel="noopener">${esc(x.texte)}<span aria-hidden="true"> ↗</span></a>` : esc(x.texte)}</li>`).join('')}</ul>` : '');

  /* les dates à venir, groupées par mois (« décembre 2026 », pris dans la ligne) */
  function ligneDate(d, avecTitre) {
    const s = PAR_SLUG[d.slug];
    const [jour, mois] = decoupe(d.ligneDate);
    return `<li class="date"${d.l != null ? ` data-l="${d.l}"` : ''} style="--point:${s ? s.couleur : 'currentColor'}">
      <p class="date-quand"><span class="date-jour">${esc(jour)}</span>${mois ? `<span class="date-moisan">${esc(mois)}</span>` : ''}</p>
      <div class="date-corps">
        ${avecTitre ? `<p class="date-quoi"><a href="#/spectacle/${esc(d.slug)}"><span class="date-point" aria-hidden="true"></span>${esc(d.titre)}</a></p>` : ''}
        <p class="date-ou">${esc(d.ligneLieu)}</p>
        ${details(d.details)}
      </div>
    </li>`;
  }
  function listeDates(liste, avecTitre, niveau = 'h3') {
    const groupes = [];
    for (const d of liste) {
      const cle = moisDe(d.ligneDate);
      const g = groupes[groupes.length - 1];
      if (g && g.cle === cle) g.items.push(d); else groupes.push({ cle, items: [d] });
    }
    return `<div class="dates">${groupes.map((g) => `
      <div class="dates-groupe">
        ${g.cle ? `<${niveau} class="dates-mois">${esc(g.cle)}</${niveau}>` : ''}
        <ul class="dates-liste">${g.items.map((d) => ligneDate(d, avecTitre)).join('')}</ul>
      </div>`).join('')}</div>`;
  }

  /* l'accueil : un spectacle par écran */
  function chapitre(s, i) {
    const n = i + 1;
    const p = s.prochaine;
    const phrase = premierePhrase(s.texte && s.texte[0]);
    const accroche = phrase ? `<p class="chap-accroche">${phrase}</p>` : s.cadre ? `<p class="chap-accroche">${esc(s.cadre)}</p>` : '';
    let tournee = '';
    if (p) tournee = `<div class="chap-tournee"><p class="surtitre">${esc(L.actuellementEnTournee)}</p><p class="chap-date-quand">${esc(p.ligneDate)}</p><p class="chap-date-ou">${esc(p.ligneLieu)}</p></div>`;
    else if (s.statut && s.tournee) tournee = `<div class="chap-tournee"><p class="surtitre">${esc(s.tournee.titre)}</p>${s.tournee.texte ? `<p class="chap-note">${esc(s.tournee.texte)}</p>` : ''}</div>`;
    return `
<section class="chap" id="chap-${n}" data-chap data-titre="${esc(s.titre)}" data-accent="${esc(s.couleur)}" data-photo="${n % 2 ? 'gauche' : 'droite'}" data-ton="chapitre" aria-labelledby="t-chap-${n}" style="--fond:${s.fondSombre};--accent:${s.couleur};--focale:${s.focale ?? 50}%">
  <div class="chap-photo"><img src="${D.photos[s.slug]}" alt="${esc(s.titre)}">${s.credit ? `<p class="chap-credit">${esc(s.credit)}</p>` : ''}</div>
  <div class="chap-texte">
    <p class="chap-sur">${esc(s.creation)}</p>
    <h2 class="chap-titre" id="t-chap-${n}">${lignesTitre(s)}</h2>
    <p class="chap-sous">${s.sousTitre || ''}</p>
    ${accroche}
    ${tournee}
    <a class="bouton" href="#/spectacle/${esc(s.slug)}">${esc(L.decouvrir)}<span class="sr"> ${esc(s.titre)}</span><span class="fleche" aria-hidden="true">→</span></a>
  </div>
</section>`;
  }

  /* la carte de l'accueil : les mois de la saison, les bras qui poussent de Rouen, la caméra qui recule */
  const R = CARTE.rouen;
  const MOIS = [];
  for (const d of DATES) {
    const titre = moisDe(d.ligneDate);
    let g = MOIS[MOIS.length - 1];
    if (!g || g.titre !== titre) MOIS.push((g = { titre, dates: [], ls: [] }));
    g.dates.push(d);
    if (d.l != null && !g.ls.includes(d.l)) g.ls.push(d.l);
  }
  const LIEUX = CARTE.aVenir();
  const loin = (x) => Math.hypot(x.xy[0] - R[0], x.xy[1] - R[1]) >= 6;
  const L_ROUEN = new Set(LIEUX.filter((x) => !loin(x)).map((x) => x.l));
  const BRAS = [];
  MOIS.forEach((g, m) => {
    const nouveaux = g.ls.map((l) => LIEUX.find((x) => x.l === l)).filter((x) => x && loin(x) && !BRAS.some((b) => b.l === x.l));
    nouveaux.forEach((x, k) => {
      const courbe = x.xy[0] >= R[0] ? 0.2 : -0.2;
      const q = (CARTE.trait(x.xy, { courbe }).match(/Q\s*(-?[\d.]+)[\s,]+(-?[\d.]+)/) || []).slice(1).map(Number);
      BRAS.push({ l: x.l, c: x.c, xy: x.xy, n: x.n, mois: m, rang: k, nb: nouveaux.length, courbe, q: q.length === 2 ? q : [(R[0] + x.xy[0]) / 2, (R[1] + x.xy[1]) / 2], w: 4.2 + 1.5 * Math.sqrt(x.n || 1), g: -1, s: -1 });
    });
  });
  const boite = (v) => v.split(/\s+/).map(Number);
  const CAM0 = boite(CARTE.cadre([], { marge: 70, min: 180 }));
  const CAMS = [];
  MOIS.forEach((g, m) => { CAMS.push(boite(CARTE.cadre(BRAS.filter((b) => b.mois <= m), { marge: 60, min: 180 }))); });
  const CAM_FIN = boite(CARTE.cadre(BRAS, { marge: 90, min: 180 }));
  function cadrage(a, b, k) {
    const w = Math.exp(Math.log(a[2]) + (Math.log(b[2]) - Math.log(a[2])) * k);
    const h = Math.exp(Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * k);
    const cx = a[0] + a[2] / 2 + (b[0] + b[2] / 2 - a[0] - a[2] / 2) * k;
    const cy = a[1] + a[3] / 2 + (b[1] + b[3] / 2 - a[1] - a[3] / 2) * k;
    return [cx - w / 2, cy - h / 2, w, h];
  }
  // un bras qui pousse : la courbe de CARTE.trait, effilée sur la longueur déjà poussée
  function brasPartiel(b, g, w0, w1) {
    if (g <= 0.002) return '';
    const [rx, ry] = R, [qx, qy] = b.q, [x, y] = b.xy, N = 22, G = [], Dr = [];
    for (let k = 0; k <= N; k++) {
      const f = k / N, t = g * f, a = (1 - t) ** 2, c2 = 2 * (1 - t) * t, c = t * t;
      const px = a * rx + c2 * qx + c * x, py = a * ry + c2 * qy + c * y;
      let tx = 2 * (1 - t) * (qx - rx) + 2 * t * (x - qx), ty = 2 * (1 - t) * (qy - ry) + 2 * t * (y - qy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = (w0 * (1 - f) + w1 * f) / 2;
      G.push(`${(px - ty * w).toFixed(2)} ${(py + tx * w).toFixed(2)}`);
      Dr.push(`${(px + ty * w).toFixed(2)} ${(py - tx * w).toFixed(2)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  function chapitreCarte() {
    const [vx, vy, vw, vh] = boite(CARTE.viewBox);
    const traces = CARTE.lieux.filter((x) => x.xy[0] >= vx && x.xy[0] <= vx + vw && x.xy[1] >= vy && x.xy[1] <= vy + vh)
      .map((x) => `M${x.xy[0]} ${x.xy[1]}h.01`).join('');
    return `
<section class="chap-carte" id="chap-carte" data-chap data-titre="${esc(SAISON.titre)}" data-accent="#ef84b8" data-ton="chapitre" aria-labelledby="t-carte" style="--pas:${MOIS.length}">
  <div class="cc-scene">
    <div class="cc-texte">
      <p class="surtitre cc-sur">${esc(L.actuellementEnTournee)}</p>
      <h2 class="cc-titre" id="t-carte">${esc(SAISON.titre)}</h2>
      <div class="cc-rail"><ol class="cc-liste">${MOIS.map((g, m) => `
        <li class="cc-m${m ? '' : ' est-actif'}">
          <h3 class="cc-m-titre">${esc(g.titre)}</h3>
          <ul class="cc-lignes">${g.dates.map((d) => `<li class="cc-ligne"><span class="cc-quand">${esc(d.ligneDate)}</span><span class="cc-ou">${esc(d.ligneLieu)}</span><span class="cc-quoi" style="--c:${PAR_SLUG[d.slug] ? PAR_SLUG[d.slug].couleur : 'currentColor'}">${esc(d.titre)}</span></li>`).join('')}</ul>
        </li>`).join('')}</ol></div>
      <a class="bouton cc-bouton" href="${esc(MENU.agenda.href)}">${esc(MENU.agenda.texte)}<span class="fleche" aria-hidden="true">→</span></a>
    </div>
    <div class="cc-carte">
      <svg class="cc-svg" viewBox="${CAM0.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(SAISON.titre)}">
        <defs>
          <radialGradient id="cc-halo"><stop offset="0" stop-color="#bc3e80" stop-opacity=".46"/><stop offset=".45" stop-color="#bc3e80" stop-opacity=".16"/><stop offset="1" stop-color="#bc3e80" stop-opacity="0"/></radialGradient>
          ${BRAS.map((b) => `<linearGradient id="cc-g${b.l}" gradientUnits="userSpaceOnUse" x1="${R[0]}" y1="${R[1]}" x2="${b.xy[0]}" y2="${b.xy[1]}"><stop offset="0" stop-color="#bc3e80"/><stop offset="1" stop-color="#f4a6cb"/></linearGradient>`).join('')}
        </defs>
        <circle class="cc-halo" cx="${R[0]}" cy="${R[1]}" r="200" fill="url(#cc-halo)"/>
        <path class="cc-voisin" d="${CARTE.fond.belgique}"/><path class="cc-voisin" d="${CARTE.fond.luxembourg}"/><path class="cc-pays" d="${CARTE.fond.pays}"/>
        <path class="cc-traces" d="${traces}"/>
        <g>${BRAS.map((b) => `<path class="cc-b" data-l="${b.l}" fill="url(#cc-g${b.l})" d=""/>`).join('')}</g>
        <g>${BRAS.map((b) => `<path class="cc-s" data-l="${b.l}" pathLength="1" d=""/>`).join('')}</g>
        <g>${BRAS.map((b) => `<path class="cc-p" data-l="${b.l}" d="M${b.xy[0]} ${b.xy[1]}h.01"/>`).join('')}</g>
        <path class="cc-rouen" d="M${R[0]} ${R[1]}h.01"/><path class="cc-onde" d="M${R[0]} ${R[1]}h.01"/>
      </svg>
      <div class="cc-noms" aria-hidden="true">${BRAS.map((b) => `<span class="cc-nom${b.xy[0] < R[0] ? ' a-gauche' : ''}" data-l="${b.l}"><span>${esc(b.c)}</span></span>`).join('')}<span class="cc-nom cc-nom-rouen"><span>Rouen</span></span></div>
    </div>
  </div>
</section>`;
  }

  /* la fin de l'accueil : les trois portes (libellés seuls), puis les donateurs */
  const finHTML = () => `
<section class="fin" id="fin" data-ton="clair">
  <div class="fin-int">
    <ul class="portes">${S.portes.map((p) => `<li><a class="porte" href="${esc(p.href)}" style="--porte:${p.couleur}"><span class="porte-titre">${esc(p.texte)}</span><span class="porte-fleche">${FLECHE}</span></a></li>`).join('')}</ul>
    <p class="donateurs">${S.donateurs}</p>
  </div>
</section>`;

  const accueilHTML = () => `
<h1 class="sr" id="t-accueil" tabindex="-1">${esc(S.nom)}</h1>
${SHOWS.map(chapitre).join('')}
${chapitreCarte()}
${finHTML()}`;

  /* les pages des onglets */
  const entete = (titre, surtitre = '') => `
      <header class="page-tete">
        ${surtitre ? `<p class="surtitre">${surtitre}</p>` : ''}
        <h1 class="page-titre" id="t-page" tabindex="-1">${titre}</h1>
      </header>`;
  const page = (corps) => `<div class="page libre" data-ton="clair">${corps}</div>`;

  const vignette = (s) => `
        <li class="vignette" style="--ink:${encre(s.couleurTexteClair || s.couleur)};--fond:${s.fondSombre};--focale:${s.focale ?? 50}%">
          <div class="vignette-photo"><img src="${D.photos[s.slug]}" alt=""></div>
          <p class="vignette-sur"><span>${esc(s.creation)}</span>${s.statut ? `<span class="pastille">${esc(s.statut)}</span>` : s.enTournee ? `<span class="pastille">${esc(L.enTournee)}</span>` : ''}</p>

  function carteSpectacle(s) {

  /* une carte reliée à sa liste : survoler met en avant, choisir une commune filtre la liste */
  function brancherCarte(racine) {
    const svg = racine && $('svg.carte', racine);
    if (!svg) return;
    const liste = $('[data-liste]', racine);
    const filtre = $('.carte-filtre', racine);
    let choisi = null;
    const marquer = (l) => {
      $$('.est-survol', racine).forEach((e) => e.classList.remove('est-survol'));
      svg.classList.toggle('a-survol', l != null);
      if (l != null) $$(`[data-l="${l}"]`, racine).forEach((e) => e.classList.add('est-survol'));
    };
    const choisir = (l) => {
      choisi = l === choisi ? null : l;
      $$('.est-choisi', racine).forEach((e) => e.classList.remove('est-choisi'));
      svg.classList.toggle('a-choix', choisi != null);
      if (choisi != null) $$(`[data-l="${choisi}"]`, svg).forEach((e) => e.classList.add('est-choisi'));
      if (liste) {
        $$('[data-l]', liste).forEach((li) => { li.hidden = choisi != null && +li.dataset.l !== choisi; });
        $$('.dates-groupe', liste).forEach((g) => { g.hidden = choisi != null && !$$('[data-l]:not([hidden])', g).length; });
      }
      if (filtre) {
        filtre.innerHTML = choisi != null && CARTE.lieux[choisi]
          ? `<button class="filtre-puce" type="button" aria-pressed="true">${esc(CARTE.nom(CARTE.lieux[choisi]))}<span aria-hidden="true">×</span></button>` : '';
        const b = $('button', filtre);
        if (b) b.addEventListener('click', () => choisir(choisi));
      }
      planifier();
    };
    CARTE.lier(svg, { survol: marquer, choix: choisir });
    if (liste) $$('[data-l]', liste).forEach((li) => {
      li.addEventListener('mouseenter', () => marquer(+li.dataset.l));
      li.addEventListener('mouseleave', () => marquer(null));
    });
  }
  // les cartes des pages spectacle poussent quand on les atteint
  let obsCartes = null;
  function cartesDifferees(racine) {
    if (obsCartes) obsCartes.disconnect();
    const boites = $$('[data-carte]', racine);
    const remplir = (b) => {
      if (b.dataset.rempli) return;
      b.dataset.rempli = '1';
      b.insertAdjacentHTML('afterbegin', carteSpectacle(PAR_SLUG[b.dataset.carte]));
      brancherCarte(b.closest('.tournee'));
    };
    if (!('IntersectionObserver' in window)) { boites.forEach(remplir); return; }
    obsCartes = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { obsCartes.unobserve(e.target); remplir(e.target); } }), { rootMargin: '0px 0px -12% 0px' });
    boites.forEach((b) => obsCartes.observe(b));
  }

  /* montage */
  $('#marque-pieuvre').innerHTML = D.logo.octopus;

  const boutonsSommaire = $$('button', sommaire);

  /* la carte de l'accueil, rendue au défilement */
  const cc = { el: $('#chap-carte', vueAccueil) };
  cc.svg = $('.cc-svg', cc.el);
  cc.boite = $('.cc-carte', cc.el);
  cc.liste = $('.cc-liste', cc.el);
  cc.mois = $$('.cc-m', cc.el);
  cc.halo = $('.cc-halo', cc.el);
  cc.rouen = $('.cc-rouen', cc.el);
  cc.onde = $('.cc-onde', cc.el);
  cc.nomRouen = $('.cc-nom-rouen', cc.el);
  BRAS.forEach((b) => {
    b.el = $(`.cc-b[data-l="${b.l}"]`, cc.el);
    b.sp = $(`.cc-s[data-l="${b.l}"]`, cc.el);
    b.pt = $(`.cc-p[data-l="${b.l}"]`, cc.el);
    b.nom = $(`.cc-nom[data-l="${b.l}"]`, cc.el);
  });
  const P0 = 0.05, P1 = 0.86;
  function mesurerCarte() {
    if (vue !== 'accueil') return;
    cc.statique = MQ_REDUIT.matches;
    cc.el.classList.toggle('est-statique', cc.statique);
    cc.W = cc.boite.clientWidth || 1;
    cc.H = cc.boite.clientHeight || 1;
    cc.tops = cc.mois.map((m) => m.offsetTop);
    BRAS.forEach((b) => { b.s = -1; });
    cc.p = -1;
    majCarte();
  }
  function majCarte() {
    if (vue !== 'accueil') return;
    const r = cc.el.getBoundingClientRect();
    const total = cc.el.offsetHeight - innerHeight;
    const p = cc.statique ? 1 : clamp(-r.top / Math.max(1, total));
    if (p === cc.p) return;
    cc.p = p;
    rendreCarte(p);
  }
  function rendreCarte(p) {
    const M = MOIS.length;
    const f = clamp((p - P0) / (P1 - P0)) * M;
    const m = Math.min(M - 1, Math.floor(f));
    const u = f >= M ? 1 : f - m;
    const fin = cc.statique ? 1 : clamp((p - P1) / (1 - P1));
    const cam = fin > 0 ? cadrage(CAMS[M - 1], CAM_FIN, doux(fin)) : cadrage(m ? CAMS[m - 1] : CAM0, CAMS[m], doux(clamp(u / 0.5)));
    cc.svg.setAttribute('viewBox', cam.map((v) => v.toFixed(2)).join(' '));
    const W = cc.W, H = cc.H, s = Math.min(W / cam[2], H / cam[3]);
    const ox = (W - cam[2] * s) / 2 - cam[0] * s, oy = (H - cam[3] * s) / 2 - cam[1] * s;
    const ici = new Set(fin > 0 ? [] : MOIS[m].ls);
    cc.halo.setAttribute('r', (0.5 * Math.max(W, H) / s).toFixed(1));
    for (const b of BRAS) {
      let g, h;
      if (fin > 0 || f >= M || b.mois < m) { g = 1; h = 1; }
      else if (b.mois > m) { g = 0; h = 0; }
      else {
        const d0 = 0.14 + 0.3 * (b.rang / Math.max(1, b.nb));
        g = doux(clamp((u - d0) / 0.4));
        h = clamp((u - d0 - 0.36) / 0.16);
      }
      if (Math.abs(g - b.g) > 1e-4 || Math.abs(s - b.s) > 1e-4) {
        const w0 = b.w / s, w1 = 0.7 / s;
        b.el.setAttribute('d', g >= 1 ? CARTE.bras(b.xy, { w0, w1, courbe: b.courbe }) : brasPartiel(b, g, w0, w1));
        if (Math.abs(s - b.s) > 1e-4) {
          b.sp.setAttribute('d', CARTE.bout(b.xy, { r: 7 / s, courbe: b.courbe }));
          b.sp.style.strokeWidth = (1.6 / s).toFixed(3);
        }
        b.g = g; b.s = s;
      }
      b.sp.style.strokeDashoffset = String(1 - h);
      const actif = ici.has(b.l), pousse = g > 0.97;
      b.el.classList.toggle('est-passe', pousse && !actif && fin === 0);
      b.pt.classList.toggle('est-pousse', pousse);
      b.pt.classList.toggle('est-actif', pousse && actif);
      const voir = pousse && actif && g >= 0.99;
      b.nom.classList.toggle('est-visible', voir);
      if (voir || b.nom.style.transform === '') b.nom.style.transform = `translate(${(b.xy[0] * s + ox).toFixed(1)}px,${(b.xy[1] * s + oy).toFixed(1)}px)`;
    }
    cc.nomRouen.style.transform = `translate(${(R[0] * s + ox).toFixed(1)}px,${(R[1] * s + oy).toFixed(1)}px)`;
    const rouenIci = [...L_ROUEN].some((l) => ici.has(l));
    cc.onde.classList.toggle('est-actif', rouenIci);
    if (!cc.statique) {
      const fr = fin > 0 ? M - 1 : m === 0 ? 0 : m - 1 + doux(clamp(u / 0.2));
      const i0 = Math.floor(fr), i1 = Math.min(M - 1, i0 + 1), k = fr - i0;
      const y = cc.tops[i0] + (cc.tops[i1] - cc.tops[i0]) * k;
      cc.liste.style.transform = `translate3d(0,${(-y).toFixed(1)}px,0)`;
      const actifM = Math.round(fr);
      cc.mois.forEach((el, j) => el.classList.toggle('est-actif', j === actifM));
    } else {
      cc.liste.style.transform = '';
      cc.mois.forEach((el) => el.classList.add('est-actif'));
    }
  }

  /* état au défilement : ton de l'en-tête, repère du sommaire, carte de l'accueil */
  let vue = null;
  let zones = [];
  let actif = null;
  function majSommaire(k) {
    if (k === actif) return;
    actif = k;
    sommaire.classList.toggle('est-cache', k < 0);
    boutonsSommaire.forEach((b, j) => { if (j === k) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
    if (k >= 0) sommaire.style.setProperty('--som-accent', chapitres[k].dataset.accent || '#ef84b8');
  }
  function majEtat() {
    const y = tete.offsetHeight / 2;
    let ton = 'chapitre';
    for (const el of zones) {
      const r = el.getBoundingClientRect();
      if (r.top <= y && r.bottom > y) { ton = el.dataset.ton; break; }
    }
    tete.dataset.ton = ton;
    if (vue !== 'accueil') { majSommaire(-1); return; }
    const milieu = innerHeight / 2;
    let k = -1;
    chapitres.forEach((c, j) => { const r = c.getBoundingClientRect(); if (r.top <= milieu && r.bottom > milieu) k = j; });
    majSommaire(k);
    majCarte();
  }
  let rafEtat = 0;
  function planifier() { if (!rafEtat) rafEtat = requestAnimationFrame(() => { rafEtat = 0; majEtat(); }); }
  addEventListener('scroll', planifier, { passive: true });
  addEventListener('resize', () => { mesurerCarte(); planifier(); });

  /* magnétisme : seulement sur l'accueil, en grand écran, sans réduction des animations */
  const majAimant = () => doc.classList.toggle('aimante', vue === 'accueil' && MQ_LARGE.matches && !MQ_REDUIT.matches);
  MQ_LARGE.addEventListener('change', () => { majAimant(); mesurerCarte(); planifier(); });
  MQ_REDUIT.addEventListener('change', () => { majAimant(); mesurerCarte(); });

  /* dévoilement : armé au premier geste, pour que rien ne reste caché sans défilement */
  const revele = new IntersectionObserver((entrees) => {
    for (const e of entrees) if (e.isIntersecting) { e.target.classList.add('vu'); revele.unobserve(e.target); }
  }, { threshold: 0.3 });
  const gestes = ['wheel', 'touchstart', 'keydown', 'pointerdown', 'scroll'];
  function armer() {
    gestes.forEach((g) => removeEventListener(g, armer, true));
    if (MQ_REDUIT.matches || vue !== 'accueil') return;
    for (const c of $$('.chap', vueAccueil)) {
      const r = c.getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= innerHeight) { c.classList.add('arme'); revele.observe(c); }
    }
  }
  gestes.forEach((g) => addEventListener(g, armer, { capture: true, passive: true }));

  const allerA = (el) => {
    if (!el) return;
    scrollTo({ top: el.getBoundingClientRect().top + scrollY, behavior: MQ_REDUIT.matches ? 'auto' : 'smooth' });
  };
  boutonsSommaire.forEach((b) => b.addEventListener('click', () => allerA(chapitres[+b.dataset.cible])));

  /* l'entrée du premier chapitre, juste après la révélation à travers le logo */
  function entrer(c) {
    if (!c || !c.classList.contains('attend')) return;
    c.classList.add('entre');
    requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('attend')));
    setTimeout(() => c.classList.remove('entre'), 2600);
  }

  /* menu replié (en dessous de 1280 px) */
  const bMenu = $('#menu-bouton');
  const menu = (ouvrir) => {
    tete.classList.toggle('menu-ouvert', ouvrir);
    bMenu.setAttribute('aria-expanded', String(ouvrir));
  };
  bMenu.addEventListener('click', () => menu(bMenu.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && tete.classList.contains('menu-ouvert')) { menu(false); bMenu.focus(); } });

  /* les formulaires d'origine : l'envoi ne fait rien */
  document.addEventListener('submit', (e) => { if (e.target.matches('form[data-inerte]')) e.preventDefault(); });

  /* routeur : une vue par onglet */
  function resoudre(chemin) {
    let m;
    if (!chemin) return { vue: 'accueil', titre: S.accueil };
    if ((m = chemin.match(/^spectacle\/([\w-]+)$/)) && PAR_SLUG[m[1]]) return { vue: 'spectacle', s: PAR_SLUG[m[1]], onglet: 'spectacles', titre: PAR_SLUG[m[1]].titre };
    if ((m = chemin.match(/^agenda\/([\w-]+)$/)) && D.saisons[m[1]]) {
      if (m[1] === SAISON.saison) return { vue: 'page', html: pageAgenda, onglet: 'agenda', titre: MENU.agenda.texte };
      const cle = m[1];
      return { vue: 'page', html: () => pageSaison(cle), onglet: 'agenda', titre: D.saisons[cle].titre };
    }
    const item = PAR_ROUTE[chemin];
    if (item) {
      const html = { spectacles: pageSpectacles, agenda: pageAgenda, compagnie: pageCompagnie, actions: pageActions, pro: pagePro, contact: pageContact }[item.id];
      if (html) return { vue: 'page', html, onglet: item.id, titre: item.id === 'pro' ? S.pro.titrePage : item.texte };
    }
    if (S.legal[chemin]) return { vue: 'page', html: () => pageLegal(chemin), titre: S.legal[chemin].titre };
    return null;
  }
  function router(initial) {
    const h = location.hash || '#/';
    if (!h.startsWith('#/') && vue) return;
    menu(false);
    const chemin = h.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
    let r = resoudre(chemin);
    if (!r) { r = resoudre(''); history.replaceState(null, '', '#/'); }
    vue = r.vue;
    doc.classList.remove('aimante');
    vueAccueil.hidden = vue !== 'accueil';
    vuePage.hidden = vue !== 'page';
    vueSpectacle.hidden = vue !== 'spectacle';
    vuePage.innerHTML = vue === 'page' ? r.html() : '';
    vueSpectacle.innerHTML = vue === 'spectacle' ? spectacleHTML(r.s) : '';
    if (vue === 'page') brancherCarte($('.agenda', vuePage));
    if (vue === 'spectacle') cartesDifferees(vueSpectacle);
    document.title = titreOnglet(r.titre);
    for (const a of $$('[data-onglet]', tete)) {
      if (a.dataset.onglet === r.onglet) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    sommaire.hidden = vue !== 'accueil';
    zones = [...$$('[data-ton]', vue === 'spectacle' ? vueSpectacle : vue === 'page' ? vuePage : vueAccueil), pied];
    scrollTo(0, 0);
    majAimant();
    actif = null;
    mesurerCarte();
    majEtat();
    const titre = $(vue === 'spectacle' ? '#t-fiche' : vue === 'page' ? '#t-page' : '#t-accueil');
    if (!initial && titre) titre.focus({ preventScroll: true });
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); router(false); }
  });
  $('.evitement').addEventListener('click', (e) => { e.preventDefault(); $('#contenu').focus(); });
  addEventListener('hashchange', () => router(false));
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  router(true);

  /* l'ouverture commune : le grand logo, dans le dégradé prune de la 09 ; la révélation tombe sur le premier spectacle */
  const premier = $('.chap', vueAccueil);
  INTRO.ouvrir({
    degrade: [[0, '#5f2244'], [0.26, '#3c1630'], [0.55, '#1a0d17'], [1, '#110a0f']],
    encre: '#ffffff',
    classe: 'm09-intro',
    apres: () => entrer(premier),
  });
  if (INTRO.ouverte() && premier && !MQ_REDUIT.matches) premier.classList.add('attend');
})();
</script>
</body>
</html>
