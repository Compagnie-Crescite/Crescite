<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* 04 · Trois portes. Le public d'abord : trois grandes portes en arche sur un fond prune, une par entrée, chacune dans
   sa couleur ; l'entrée choisie colore ensuite la lecture (en-tête, onglets des spectacles). Chaque spectacle s'ouvre
   dans son univers : ses couleurs, sa police de titre, son motif. */
:root{
  --aub:#22101d;--aub-2:#2e1628;--aub-3:#43203b;
  --ivory:#faf6f3;--paper:#ffffff;--ink:#1d1219;--muted:#5e5359;
  --line:rgba(29,18,25,.13);--line-2:rgba(29,18,25,.3);
  --on-dark-2:rgba(255,255,255,.76);--line-dark:rgba(255,255,255,.14);
  --rose:#c2306f;--rose-v:#f07ab6;
  --acc:var(--rose);--acc-v:var(--rose-v);
  --hl:rgba(255,255,255,.07);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --gutter:clamp(16px,4vw,56px);--wrap:1328px;--top:var(--aub);
  --fs-label:.8125rem;--fs-small:.9375rem;--fs-body:1.0625rem;--fs-h3:1.45rem;
  --fs-h2:clamp(2rem,1.5rem + 1.6vw,2.75rem);--fs-h1:clamp(2.5rem,1.4rem + 3.7vw,4.6rem);
  --ease:cubic-bezier(.3,.7,.2,1);
  /* les tentacules (tentacules.js) : la pieuvre du logo guide ; en rose, comme les portes ; sur le prune, le rose vif ; la remontée d'une entrée
     va ouvrir sa porte (data-tt-cible sur la porte de l'en-tête de page) */
  --tt-encre:#c2306f;--tt-accent:#c2306f;--tt-neutre:#c2306f;--tt-epaisseur:2.4;
  /* l'édition sur place (EDITION) : la barre, la connexion et le panneau des dates prennent l'ivoire, le prune et le rose */
  --ed-fond:#faf6f3;--ed-encre:#1d1219;--ed-accent:#c2306f;--ed-sur-accent:#ffffff;
  --ed-police:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ed-rayon:14px;--ed-trait:rgba(29,18,25,.2);
}
.site-header,.seuil,.page-hero,.site-footer,.entrees{--tt-encre:#f07ab6;--tt-accent:#f07ab6}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--aub);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow-x:clip;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:var(--fs-body);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
table{border-collapse:collapse}
.wrap{width:min(100% - 2*var(--gutter),var(--wrap));margin-inline:auto}
.defs{position:absolute;width:0;height:0;overflow:hidden}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:12px;top:-80px;z-index:40;padding:10px 18px;background:#fff;color:var(--ink);font-size:var(--fs-small);font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.entre{animation:entre .45s ease both}
@keyframes entre{from{opacity:0}to{opacity:1}}
.fleche{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.fleche span{transition:transform .18s var(--ease)}
.fleche:hover span{transform:translateX(4px)}
.ext{display:inline-block;margin-left:5px;font-size:.85em}
.porte-ico{flex:none;width:16px;height:24px}

/* l'en-tête : le logo, les trois entrées en portes (la navigation première), le menu second, petit et à part */
.site-header{position:relative;z-index:30;background:var(--top);color:#fff;box-shadow:inset 0 -3px 0 var(--hl)}
.header-in{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand menu" "brand entrees";column-gap:clamp(24px,3.4vw,56px);row-gap:2px;padding-top:8px}
.brand{grid-area:brand;align-self:center;display:block;width:60px;aspect-ratio:1042/780;margin-bottom:3px;color:#fff}
.brand svg{display:block;width:100%;height:auto}
.site-nav{grid-area:menu;justify-self:end;align-self:center}
.site-nav ul{display:flex;gap:clamp(16px,1.8vw,28px)}
.site-nav a{display:block;padding:5px 0;color:var(--on-dark-2);font-size:var(--fs-label);font-weight:500;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.site-nav a:hover{color:#fff;text-decoration:underline;text-underline-offset:.3em}
.site-nav a[aria-current="page"]{color:#fff;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.35em}
.entrees{grid-area:entrees;align-self:end;min-width:0}
.entrees ul{display:flex;gap:8px}
.entree{display:flex;align-items:center;gap:11px;min-height:54px;padding:12px 22px 13px 18px;border-radius:27px 27px 0 0;color:#fff;font-family:var(--serif);font-size:1.0625rem;line-height:1.15;font-variation-settings:"opsz" 30,"SOFT" 100;text-decoration:none;white-space:nowrap;box-shadow:inset 0 2px 0 color-mix(in srgb,var(--cv) 70%,transparent);transition:background .16s var(--ease),box-shadow .16s var(--ease),transform .16s var(--ease)}
.entree:hover{background:var(--aub-2);box-shadow:inset 0 2px 0 var(--cv)}
.entree .porte-ico{width:15px;height:22px;color:var(--cv)}
.entree.on{background:var(--c);box-shadow:inset 0 2px 0 var(--cv)}
.entree.on .porte-ico{color:#fff}
.entree.on .porte-ico .porte-fond{opacity:.6}
.entree:focus-visible{outline:2px solid var(--cv);outline-offset:2px}
.e-court{display:none}
.menu-btn{display:none}
@media (max-width:1179px){.e-long{display:none}.e-court{display:inline}}
@media (max-width:819px){
  .header-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding-top:0}
  .brand{width:52px;margin:0}
  .menu-btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid var(--line-dark);border-radius:999px;background:none;color:#fff;font-size:var(--fs-small);font-weight:500}
  .menu-icon{width:16px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
  .site-nav{display:none;position:absolute;left:0;right:0;top:100%;padding:4px var(--gutter) 24px;background:var(--top);border-top:1px solid var(--line-dark);box-shadow:0 30px 40px rgba(10,3,8,.35)}
  .nav-open .site-nav{display:block}
  .site-nav ul{flex-direction:column;gap:0}
  .site-nav a{padding:14px 0;border-bottom:1px solid var(--line-dark);font-size:var(--fs-body)}
  /* au téléphone, les trois entrées restent à portée : une barre fixe en bas de l'écran */
  .entrees{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:var(--aub);border-top:1px solid var(--line-dark);box-shadow:0 -14px 30px rgba(10,3,8,.32);transition:transform .45s var(--ease),visibility .45s}
  .entrees ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .entree{flex-direction:column;justify-content:center;gap:5px;min-height:60px;padding:9px 4px 7px;border-radius:24px 24px 6px 6px;font-family:var(--sans);font-size:.75rem;font-weight:600;line-height:1.2;text-align:center;white-space:normal;letter-spacing:.01em}
  .entree .porte-ico{width:13px;height:19px}
  .portes-visibles .entrees{transform:translateY(110%);visibility:hidden}
}

/* la petite porte en arche (en-tête des pages, appel à écrire) */
.arche{position:relative;display:block;flex:none;width:clamp(84px,8.4vw,138px);aspect-ratio:5/8;perspective:640px}
.arche::before{content:"";position:absolute;inset:0;border:1.5px solid var(--v);border-radius:999px 999px 0 0;pointer-events:none}
.arche-lumiere{position:absolute;inset:6px 6px 0;border-radius:999px 999px 0 0;background:radial-gradient(130% 90% at 50% 100%,#fff 0%,var(--v) 38%,color-mix(in srgb,var(--v) 40%,var(--aub)) 100%);opacity:.6;transition:opacity .6s var(--ease)}
.arche-battant{position:absolute;inset:6px 6px 0;border-radius:999px 999px 0 0;background:linear-gradient(180deg,var(--aub-3),#2b1226);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v) 45%,transparent);transform-origin:0 50%;transform:rotateY(20deg);transition:transform .85s var(--ease)}
.arche-battant::after{content:"";position:absolute;right:16%;top:57%;width:7px;height:7px;border-radius:50%;background:var(--v)}
.hero-porte .arche-battant{transform:rotateY(64deg);animation:ouvre .9s var(--ease) .12s backwards}
.hero-porte .arche-lumiere{opacity:1;animation:lueur .9s var(--ease) .12s backwards}
@keyframes ouvre{from{transform:rotateY(0)}}
@keyframes lueur{from{opacity:.12}}

/* l'accueil : les trois portes */
.seuil{background:var(--aub);color:#fff;padding:clamp(12px,2vh,22px) 0 clamp(28px,5vh,56px)}
.seuil-nom{margin-bottom:clamp(14px,2.2vh,24px);font-size:var(--fs-small);font-weight:500;line-height:1.4;color:var(--on-dark-2)}
.doors{display:flex;gap:14px;min-height:max(480px,calc(100vh - 196px))}
@supports (height:100svh){.doors{min-height:max(480px,calc(100svh - 196px))}}
.door{position:relative;isolation:isolate;flex:1 1 0;min-width:0;display:flex;background:var(--aub-2);box-shadow:inset 0 3px 0 var(--v);transition:flex-grow .2s var(--ease)}
.door::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(110% 70% at 50% 30%,color-mix(in srgb,var(--v) 22%,transparent),transparent 70%);opacity:0;transition:opacity .2s var(--ease)}
.door::after{content:"";position:absolute;inset:0;border:1px solid var(--v);opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
.door-link{display:flex;flex-direction:column;width:100%;padding:clamp(34px,3.4vw,52px) clamp(26px,2.6vw,40px) clamp(24px,2.4vw,34px);color:#fff;text-decoration:none}
.door-link:focus-visible{outline:2px solid var(--v);outline-offset:-8px}
.door-arche{position:relative;display:block;flex:1 1 auto;min-height:220px;perspective:1100px}
.door-arche::before{content:"";position:absolute;inset:-8px -8px 0;border:1.5px solid var(--v);border-bottom:0;border-radius:999px 999px 0 0;pointer-events:none}
.door-photo,.door-lumiere,.door-battant{position:absolute;inset:0;border-radius:999px 999px 0 0}
.door-photo{overflow:hidden;background:var(--c)}
.door-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1) brightness(1.08);mix-blend-mode:luminosity;transition:transform .2s var(--ease)}
.door-lumiere{background:radial-gradient(120% 60% at 50% 100%,color-mix(in srgb,var(--v) 65%,transparent),transparent 70%);mix-blend-mode:screen;opacity:.5;transition:opacity .2s var(--ease)}
.door-battant{background:linear-gradient(180deg,var(--aub-3),#2b1226 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v) 45%,transparent),16px 0 34px rgba(10,3,8,.5);transform-origin:0 50%;transform:rotateY(42deg);transition:transform .2s var(--ease)}
.door-battant::after{content:"";position:absolute;right:13%;top:58%;width:9px;height:9px;border-radius:50%;background:var(--v)}
.door:hover .door-battant,.door:focus-within .door-battant{transform:rotateY(74deg)}
.door:hover .door-lumiere,.door:focus-within .door-lumiere{opacity:1}
.door:hover .door-photo img,.door:focus-within .door-photo img{transform:scale(1.04)}
.door-bas{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-top:30px}
.door-label{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,2.4vw,2.6rem);line-height:1.06;letter-spacing:-.015em;font-variation-settings:"opsz" 72,"SOFT" 100;text-wrap:balance}
.door-arr{flex:none;display:grid;place-items:center;width:46px;height:46px;border:1px solid color-mix(in srgb,var(--v) 60%,transparent);border-radius:50%;color:var(--v);font-size:1.2rem;line-height:1;transition:transform .18s var(--ease),background .18s var(--ease),color .18s var(--ease)}
.door:hover .door-arr,.door:focus-within .door-arr{background:var(--v);color:var(--aub);transform:translateX(4px)}
.doors.salut .door-battant{animation:salut 1.8s var(--ease) backwards;animation-delay:calc(var(--i) * .17s + .05s)}
.doors.salut .door-lumiere{animation:salut-lueur 1.8s var(--ease) backwards;animation-delay:calc(var(--i) * .17s + .05s)}
@keyframes salut{0%{transform:rotateY(0)}45%{transform:rotateY(80deg)}100%{transform:rotateY(42deg)}}
@keyframes salut-lueur{0%{opacity:.1}45%{opacity:1}100%{opacity:.5}}
@media (min-width:1180px) and (hover:hover){
  .doors:hover .door:hover{flex-grow:1.35}
  .doors:hover .door:hover::before,.doors:hover .door:hover::after{opacity:1}
}
@media (min-width:1180px){
  .doors:not(:hover) .door:focus-within{flex-grow:1.35}
  .doors:not(:hover) .door:focus-within::before,.doors:not(:hover) .door:focus-within::after{opacity:1}
}
@media (max-width:1179px){
  .doors{flex-direction:column;min-height:0;gap:10px}
  .door-link{flex-direction:row;align-items:center;gap:clamp(20px,3vw,32px);padding:22px clamp(20px,3vw,32px) 20px}
  .door-arche{flex:none;width:clamp(68px,9vw,96px);aspect-ratio:5/7;min-height:0}
  .door-arche::before{inset:-5px -5px 0}
  .door-bas{flex:1;min-width:0;padding:0;align-items:center}
  .door-label{font-size:clamp(1.35rem,1rem + 2vw,2.2rem)}
}
@media (max-width:420px){.door-link{padding:18px 16px 16px;gap:18px}.door-arr{width:40px;height:40px}}

/* la carte : des bras clairs depuis Rouen, les communes comme des points lumineux */
.mc{position:relative;width:100%;aspect-ratio:var(--ar);margin-inline:auto;--mc-pays:rgba(255,255,255,.035);--mc-pays-t:rgba(255,236,245,.22);--mc-voisin:rgba(255,236,245,.1);--mc-passe:rgba(255,232,243,.34);--mc-eteint:rgba(255,232,243,.72);--mc-point:#fff;--mc-anneau:#fff;--mc-nom:#fff;--mc-ombre:var(--aub)}
.mc-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
.mc-pays{fill:var(--mc-pays);stroke:var(--mc-pays-t);stroke-width:1;stroke-linejoin:round}
.mc-encart{fill:var(--mc-pays);stroke:var(--mc-pays-t);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.mc-voisin{fill:none;stroke:var(--mc-voisin);stroke-width:1;stroke-dasharray:2 4}
.mc-passe{fill:var(--mc-passe)}
.mc-eteint{fill:var(--mc-eteint)}
.mc-bras{opacity:.88;transition:opacity .18s var(--ease)}
.mc-rouen{fill:var(--mc-rouen);stroke:var(--mc-point);stroke-width:1.2;vector-effect:non-scaling-stroke}
.mc-lieu{outline:none;transform-box:fill-box;transform-origin:center;transition:opacity .18s var(--ease)}
.mc-lieu[role="button"]{cursor:pointer}
.mc-halo{transform-box:fill-box;transform-origin:center;transition:transform .18s var(--ease)}
.mc-point{fill:var(--mc-point)}
.mc-anneau{fill:none;stroke:var(--mc-anneau);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .16s}
.mc-cible{fill:transparent}
.mc-lieu.on .mc-halo,.mc-lieu.choisi .mc-halo{transform:scale(1.85)}
.mc-lieu.choisi .mc-anneau,.mc-lieu:focus-visible .mc-anneau{opacity:1}
.survol-carte .mc-bras:not(.on),.survol-liste .mc-bras:not(.on),.filtre .mc-bras:not(.choisi):not(.on){opacity:.16}
.survol-carte .mc-lieu:not(.on),.survol-liste .mc-lieu:not(.on),.filtre .mc-lieu:not(.choisi):not(.on){opacity:.42}
.attente .mc-lieu,.pousse .mc-lieu:not(.allume),.attente .mc-eteint,.pousse .mc-eteint:not(.allume){opacity:0}
.mc-lieu.allume{animation:allume .9s var(--ease) backwards}
.mc-eteint.allume{animation:apparait .6s ease backwards}
.mc-lieu.allume.prochain .mc-halo{animation:scintille 3.2s ease-in-out 1.4s infinite}
/* la carte de tous les lieux : des traits fins, des points simples ; elle paraît d'un coup en s'ouvrant depuis Rouen (composé) */
.mc.leger .mc-traits{fill:none;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.72}
.mc.leger .mc-pt{fill:#fff;stroke:transparent;stroke-width:14px;transition:r .16s var(--ease),fill .16s}
.mc.leger .mc-pt.on{r:6px;fill:var(--mc-rouen,#fff)}
.mc.leger.attente .mc-svg{opacity:0}
.mc.leger.parait .mc-svg{transform-origin:var(--rouen-xy,50% 30%);animation:leger-parait .9s var(--ease) both}
@keyframes leger-parait{from{opacity:0;transform:scale(.9)}}
@keyframes allume{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}
@keyframes apparait{from{opacity:0}to{opacity:1}}
@keyframes scintille{0%,100%{opacity:1}50%{opacity:.55}}
.mc-nom,.mc-rouen-nom{position:absolute;z-index:2;transform:translate(13px,-50%);font-size:.8125rem;font-weight:600;line-height:1.2;letter-spacing:.01em;color:var(--mc-nom);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .16s;text-shadow:0 0 3px var(--mc-ombre),0 0 10px var(--mc-ombre),0 0 18px var(--mc-ombre)}
.mc-nom.g{transform:translate(calc(-100% - 13px),-50%)}
.mc-nom.on,.mc-nom.choisi,.mc-nom.toujours,.mc-nom.prochain{opacity:1}
.survol-carte .mc-nom.prochain:not(.on),.survol-liste .mc-nom.prochain:not(.on),.filtre .mc-nom.prochain:not(.choisi){opacity:0}
.mc-rouen-nom{opacity:1;transform:translate(calc(-100% - 14px),-110%);font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mc-rouen)}
@media (max-width:700px){
  .mc-lieu[role="button"] .mc-point{r:5px}
  .mc-lieu[role="button"] .mc-halo{r:20px}
  .mc-lieu[role="button"] .mc-anneau{r:11px}
  .mc-lieu[role="button"] .mc-cible{r:24px}
  .mc-nom{font-size:.75rem}
}

/* l'accueil : la saison sur la carte */
.bande{overflow-x:clip;background:radial-gradient(60% 70% at 72% 42%,#3d1734 0%,var(--aub) 72%);color:#fff;padding:clamp(64px,8vw,120px) 0;border-top:1px solid var(--line-dark)}
.bande-grille{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-areas:"tete carte" "liste carte";grid-template-rows:auto 1fr;column-gap:clamp(32px,5vw,88px)}
.bande-tete{grid-area:tete;align-self:end}
.bande-carte{grid-area:carte;align-self:center}
.bande-liste{grid-area:liste}
.bande-titre{font-family:var(--serif);font-weight:360;font-size:clamp(2.4rem,1.5rem + 2.6vw,3.9rem);line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100}
.prochaines{margin-top:clamp(24px,3vw,36px);border-top:1px solid var(--line-dark)}
.pr-a{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr);gap:2px 20px;padding:16px 12px 16px 0;border-bottom:1px solid var(--line-dark);color:#fff;text-decoration:none;transition:background .16s var(--ease),padding .16s var(--ease)}
.pr-quand{grid-row:span 3;display:flex;flex-direction:column}
.pr-jour{font-family:var(--serif);font-size:1.55rem;line-height:1.08;font-variation-settings:"opsz" 72,"SOFT" 100}
.pr-mois{font-size:var(--fs-label);color:var(--on-dark-2)}
.pr-ou{font-weight:600;color:var(--rose-v);line-height:1.35}
.pr-quoi{font-family:var(--serif);font-size:1.12rem;line-height:1.3}
.pr-tag{justify-self:start;margin-top:4px;padding:0 9px;border:1px solid var(--t);border-radius:999px;color:var(--t);font-size:.75rem;font-weight:600;letter-spacing:.04em}
.pr-a:hover .pr-quoi{text-decoration:underline;text-decoration-thickness:1px}
.pr.on .pr-a,.pr-a:hover,.pr-a:focus-visible{padding-left:12px;background:linear-gradient(90deg,rgba(240,122,182,.14),transparent 80%)}
.pr-a:focus-visible{outline-color:var(--rose-v);outline-offset:-2px}
.bande-plus{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:24px}
.bande-plus a{color:var(--t)}
@media (max-width:999px){
  .bande-grille{grid-template-columns:minmax(0,1fr);grid-template-areas:"tete" "carte" "liste";grid-template-rows:auto}
  .bande-carte{margin:28px 0 8px}
}
.affiches-s{padding:clamp(64px,8vw,112px) 0 clamp(40px,5vw,64px)}
.affiches-titre{margin-bottom:clamp(24px,3vw,36px);font-size:var(--fs-label);font-weight:600;letter-spacing:.14em;color:var(--rose)}
.merci{padding:0 0 clamp(56px,7vw,96px)}
.merci p{max-width:110ch;padding-top:22px;border-top:1px solid var(--line);font-size:var(--fs-label);line-height:1.65;color:var(--muted)}

/* un univers : les couleurs, la police de titre et le motif d'un spectacle */
.univ{--u-ligne:color-mix(in srgb,var(--u-texte) 17%,transparent);color:var(--u-texte)}
.u-titre{font-family:var(--u-police);font-weight:var(--u-graisse);color:var(--u-titre);line-height:1.02;letter-spacing:0;font-variation-settings:normal}
.univ[data-police="Anton"] .u-titre{text-transform:uppercase;letter-spacing:.01em}
.motif{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible;pointer-events:none}
.motif *{vector-effect:non-scaling-stroke}
.motif .plein{fill:currentColor;stroke:none}
.motif .feutre{stroke:var(--u-accent);stroke-width:5}
.motif .feutre.f2{stroke:var(--u-accent2)}
.motif text{fill:currentColor;stroke:none;font:600 15px/1 var(--sans);letter-spacing:.08em}
/* les cartes de spectacle, en arche */
.ucartes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,1.8vw,28px)}
.ucartes.affiches{grid-template-columns:repeat(5,minmax(0,1fr))}
.uc{position:relative;display:flex;flex-direction:column;padding:10px 10px 22px;background:var(--u-fond);border-radius:999px 999px 16px 16px;box-shadow:0 0 0 1px var(--u-ligne),0 18px 40px -26px rgba(20,8,16,.5);transition:box-shadow .2s var(--ease),scale .2s var(--ease)}
.uc:hover{box-shadow:0 0 0 1px var(--u-ligne),0 22px 60px -18px var(--u-lueur)}
.uc-photo{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:999px 999px 6px 6px;background:var(--u-fond2)}
.uc-photo img{width:100%;height:100%;object-fit:cover;transition:transform .2s var(--ease)}
.uc:hover .uc-photo img{transform:scale(1.05)}
.uc-etat{position:absolute;left:10px;bottom:10px;padding:2px 10px;border-radius:999px;background:var(--u-aplat);color:var(--u-sur-aplat);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.uc-corps{display:flex;flex-direction:column;flex:1;padding:18px 12px 0}
.uc-kicker{font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;color:var(--u-vif)}
.uc-titre{margin-top:6px;font-size:1.7rem;text-wrap:balance}
.uc-titre span{display:block}
.uc-titre a{text-decoration:none}
.uc-titre a::after{content:"";position:absolute;inset:0;border-radius:inherit}
.uc:hover .uc-titre a{text-decoration:underline;text-decoration-thickness:1px}
.uc-titre a:focus-visible{outline:none}
.uc:focus-within{outline:2px solid var(--u-titre);outline-offset:4px}
.uc-sous{margin-top:8px;font-size:var(--fs-small);line-height:1.45;color:var(--u-texte2)}
.uc-accroche{margin-top:10px;font-family:var(--serif);font-size:1.02rem;line-height:1.45;color:var(--u-texte);font-variation-settings:"opsz" 20,"SOFT" 100}
.uc-creation{margin-top:auto;padding-top:14px;font-size:var(--fs-small);font-weight:600;color:var(--u-vif)}
.uc-motif{position:absolute;right:18px;bottom:18px;width:40px;height:40px;color:var(--u-titre);opacity:.55}
.uc-motif.m-chronologie{width:72px;height:18px}
.uc-motif .feutre{stroke-width:2.2}
.uc-bas{margin-top:auto;padding-top:16px;padding-right:44px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.uc-btn{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:999px;background:var(--u-aplat);color:var(--u-sur-aplat);font-size:var(--fs-small);font-weight:700;text-decoration:none}
.uc-btn::after{content:"";position:absolute;inset:0;border-radius:inherit}
.uc-btn:focus-visible{outline:none}
.uc-credit{font-size:.75rem;color:var(--u-texte2)}
@media (max-width:1100px){
  .ucartes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ucartes.affiches{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 12px;scrollbar-width:thin}
  .ucartes.affiches .uc{flex:0 0 min(64vw,280px);scroll-snap-align:start}
}
@media (max-width:600px){
  .ucartes:not(.affiches){grid-template-columns:minmax(0,1fr);gap:12px}
  .ucartes:not(.affiches) .uc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0 14px;align-items:start;padding:10px 14px 14px 10px;border-radius:52px 18px 18px 18px}
  .ucartes:not(.affiches) .uc-photo{border-radius:999px 999px 6px 6px}
  .ucartes:not(.affiches) .uc-corps{padding:6px 0 0}
  .ucartes:not(.affiches) .uc-titre{font-size:1.4rem}
  .ucartes:not(.affiches) .uc-motif{display:none}
  .ucartes:not(.affiches) .uc-etat{left:4px;right:4px;bottom:6px;padding:1px 4px;font-size:.625rem;text-align:center}
  .ucartes:not(.affiches) .uc:focus-within{outline-offset:2px}
}

/* les pages : l'en-tête prune, celui des trois entrées avec sa porte ouverte */
.page-hero{position:relative;overflow:hidden;background:var(--top);color:#fff;padding:clamp(22px,3vw,44px) 0 clamp(44px,5.5vw,80px)}
.entree-hero{background:radial-gradient(48% 120% at 90% 100%,color-mix(in srgb,var(--v) 20%,transparent),transparent 70%),var(--aub)}
.hero-grille{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px clamp(32px,5vw,80px);align-items:end}
.hero-porte{width:clamp(70px,9vw,132px)}
.page-title{margin-top:.2em;max-width:22ch;font-family:var(--serif);font-weight:360;font-size:var(--fs-h1);line-height:1.02;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100;text-wrap:balance}
.hero-lead{max-width:66ch;margin-top:clamp(18px,2vw,28px);font-family:var(--serif);font-size:clamp(1.06rem,.98rem + .4vw,1.28rem);line-height:1.6;color:var(--on-dark-2);font-variation-settings:"opsz" 30,"SOFT" 100}
.back{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-small);font-weight:500;color:var(--on-dark-2);text-decoration:none}
.back:hover{color:#fff;text-decoration:underline}
.section{padding:clamp(56px,7vw,104px) 0}
.sec-titre{font-family:var(--serif);font-weight:400;font-size:var(--fs-h2);line-height:1.05;letter-spacing:-.015em;font-variation-settings:"opsz" 72,"SOFT" 100}
.sec-tete{margin-bottom:clamp(24px,3vw,40px)}
.arche-img{position:relative;overflow:hidden;border-radius:999px 999px 0 0;background:var(--aub-2)}
.arche-img img{width:100%;height:100%;object-fit:cover}
.prose{max-width:68ch}
.prose > * + *{margin-top:1em}
.prose h2,.prose h3{margin-top:1.6em;font-family:var(--serif);font-weight:450;font-size:var(--fs-h3);line-height:1.25;font-variation-settings:"opsz" 30,"SOFT" 70}
.prose > :first-child{margin-top:0}
.prose ul{padding-left:1.2em;list-style:disc}
.prose li + li{margin-top:.55em}
.prose a{color:var(--acc);font-weight:500}
@media (max-width:640px){.hero-grille{grid-template-columns:minmax(0,1fr) auto;gap:16px}.hero-porte{width:56px}}

/* la carte et sa liste côte à côte : la carte sur le prune, la liste sur l'ivoire */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--ivory)}
.split-carte{overflow-x:clip;background:radial-gradient(80% 60% at 45% 35%,#3a1631 0%,var(--aub) 72%);color:#fff}
.split-colle{position:sticky;top:0;display:flex;align-items:flex-start;justify-content:center;padding:clamp(28px,3.5vw,56px) clamp(20px,3vw,48px)}
.split-colle .mc{width:min(100%,calc((100vh - 72px) * var(--ar)))}
.split-liste{min-width:0;padding:clamp(40px,5vw,72px) var(--gutter) clamp(56px,6vw,96px) clamp(28px,4vw,64px)}
.split-liste > *{max-width:680px}
.split-titre{margin-bottom:clamp(20px,2.4vw,32px);font-family:var(--serif);font-weight:400;font-size:var(--fs-h2);line-height:1.05;letter-spacing:-.015em;font-variation-settings:"opsz" 72,"SOFT" 100}
@media (max-width:999px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split-colle{position:static;padding:28px var(--gutter)}
  .split-colle .mc{width:min(100%,560px)}
  .split-liste{padding:40px var(--gutter) 64px}
}
.puce-zone:empty{display:none}
.puce{display:inline-flex;align-items:center;gap:12px;min-height:42px;margin-bottom:24px;padding:0 8px 0 18px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-size:var(--fs-small);font-weight:600}
.puce span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);font-size:1rem;line-height:1}
.mois{margin-top:44px;padding-bottom:10px;border-bottom:1px solid var(--ink);font-size:var(--fs-label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.groupe:first-child .mois{margin-top:0}
.dl{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr);gap:4px 28px;padding:20px 0;border-bottom:1px solid var(--line);transition:opacity .18s var(--ease),background .18s var(--ease)}
.dl-quand{display:flex;flex-direction:column}
.dl-jour{font-family:var(--serif);font-size:1.5rem;line-height:1.1;font-variation-settings:"opsz" 72,"SOFT" 100}
.dl-mois{margin-top:2px;font-size:var(--fs-small);color:var(--muted)}
.dl-ou{font-weight:600;line-height:1.4}
.dl-quoi{margin-top:2px}
.dl-quoi a{font-family:var(--serif);font-weight:450;font-size:1.3rem;line-height:1.25;font-variation-settings:"opsz" 30,"SOFT" 70;text-decoration:none}
.dl-quoi a:hover{text-decoration:underline}
.dl-det{margin-top:6px;font-size:var(--fs-small);line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.dl-det li + li{margin-top:4px}
.dl-det a{color:var(--ink);font-weight:500}
.dl.on,.sl.on{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent 85%)}
.survol-carte [data-liste] li[data-l]:not(.on){opacity:.36}
@media (max-width:640px){
  .dl{grid-template-columns:minmax(0,1fr);gap:6px}
  .dl-quand{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:0 8px}
}

/* l'agenda passé : une arche par saison, fermée au départ ; sa carte la prévisualise */
.ag-outils{display:grid;gap:14px;margin-bottom:clamp(22px,2.6vw,32px)}
.recherche{position:relative;display:block;max-width:380px}
.recherche input{width:100%;min-height:46px;padding:0 16px 0 44px;border:1.5px solid var(--line-2);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:var(--fs-small)}
.recherche input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.recherche svg{position:absolute;left:17px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2}
.cps{display:flex;flex-wrap:wrap;gap:6px}
.cp{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 13px;border:1.5px solid var(--line-2);border-radius:999px;background:transparent;color:var(--ink);font-size:.85rem;font-weight:500;cursor:pointer;text-align:left}
.cp i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.cp:hover{border-color:var(--ink)}
.cp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cps .puce{margin:0;min-height:34px}
.mc-lieu.hors,.mc-bras.hors{opacity:.1;pointer-events:none}
.mc-nom.hors{display:none}
.agenda-passe{padding:clamp(48px,6vw,88px) 0 clamp(40px,5vw,72px);background:var(--ivory);border-top:1px solid var(--line)}
.ag-index{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:10px 0;background:var(--ivory);border-bottom:1px solid var(--line)}
.ag-index ul{flex:1 1 auto;min-width:0;display:flex;gap:6px;padding:3px 2px;overflow-x:auto;scrollbar-width:none}
.ag-index li{flex:none}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line-2);background:transparent;color:var(--ink);font-size:.9rem;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.idx{padding:7px 13px;border-radius:999px 999px 8px 8px}
.idx small{color:var(--muted);font-size:.78rem}
.idx:hover,.idx-tout:hover{border-color:var(--ink)}
.idx[aria-expanded="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent)}
.idx-actif{background:var(--acc);border-color:var(--acc);color:#fff}
.idx svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.idx-tout{flex:none;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%}
.idx-tout svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sai{border-bottom:1px solid var(--line);scroll-margin-top:70px}
.sai>summary{display:grid;grid-template-columns:clamp(72px,8vw,104px) minmax(0,1fr) auto;align-items:center;gap:4px clamp(16px,2.6vw,34px);padding:18px 8px;list-style:none;cursor:pointer;transition:background .16s var(--ease)}
.sai>summary::-webkit-details-marker{display:none}
.sai>summary:hover,.sai[open]>summary{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.sai-arche{display:flex;align-items:flex-end;aspect-ratio:4/5;padding:16% 8% 5%;border:1px solid var(--aub-3);border-radius:999px 999px 0 0;background:radial-gradient(90% 70% at 50% 60%,#3a1631,var(--aub) 78%);transition:border-color .2s var(--ease),box-shadow .3s var(--ease),scale .12s}
.sai>summary:hover .sai-arche,.sai[open] .sai-arche{border-color:var(--acc-v);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-v) 26%,transparent),0 14px 30px -14px var(--acc-v)}
.sai[open] .mini-bras,.sai>summary:hover .mini-bras{opacity:1}
.sai-t{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,1.2rem + 1vw,2.1rem);line-height:1.1;font-variation-settings:"opsz" 72,"SOFT" 100}
.sai-sp{display:block;margin-top:6px;color:var(--muted);font-size:var(--fs-small);line-height:1.45}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai-n{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.45rem;font-variant-numeric:tabular-nums}
.sai-n .chev{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.sai[open] .sai-n .chev{transform:rotate(180deg)}
.sai-corps{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;padding:14px 8px 48px}
.sai-corps:empty{display:none}
.sai-liste .groupe + .groupe .mois{margin-top:36px}
.sai-carte{position:sticky;top:72px;padding:clamp(34px,4vw,56px) clamp(14px,2vw,28px) clamp(16px,2vw,26px);border-radius:min(220px,40%) min(220px,40%) 24px 24px;background:radial-gradient(80% 60% at 45% 35%,#3a1631 0%,var(--aub) 72%);color:#fff;overflow-x:clip}
.sai-carte .mc{width:min(100%,calc((100vh - 210px) * var(--ar)))}
.dl.suite{display:block;color:var(--muted)}
.dl.annule .dl-ou,.dl.annule .dl-quoi{color:var(--muted)}
.dl-ou a{text-decoration:none}
.dl-ou a:hover{text-decoration:underline}
.ag-etiq{display:inline-block;margin-left:10px;padding:0 9px;border:1px solid currentColor;border-radius:999px;color:var(--muted);font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:.15em}
.sai-page{margin-top:24px}
.sai-page a{color:var(--acc)}
@media (max-width:999px){
  .sai-corps{grid-template-columns:minmax(0,1fr)}
  .sai-carte{position:static;order:-1;max-width:460px;margin-inline:auto;width:100%}
  .sai-carte .mc{width:100%}
}
@media (max-width:640px){
  .sai>summary{grid-template-columns:64px minmax(0,1fr) auto;padding:14px 2px}
  .sai-n{font-size:1.15rem;gap:6px}
  .sai-corps{padding:8px 2px 32px}
  .cps{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--gutter));padding:2px var(--gutter) 4px;scrollbar-width:none}
  .cp,.cps .puce,#choix-lieu{flex:none}
}

/* les saisons passées : des petites portes ouvertes sur leurs cartes */
.saisons{background:var(--aub);color:#fff;padding:clamp(56px,7vw,96px) 0;border-top:1px solid var(--line-dark)}
.saisons-titre{margin-bottom:clamp(24px,3vw,36px);font-family:var(--serif);font-weight:400;font-size:var(--fs-h2);line-height:1.05;font-variation-settings:"opsz" 72,"SOFT" 100}
.tuiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.tuile{display:block;color:#fff;text-decoration:none}
.tuile-carte{display:flex;align-items:flex-end;aspect-ratio:4/5;padding:16% 6% 4%;border:1px solid var(--line-dark);border-radius:999px 999px 0 0;background:radial-gradient(90% 70% at 50% 60%,#3a1631,transparent 75%);transition:border-color .35s var(--ease),background-color .35s var(--ease)}
.mini{display:block;width:100%;height:auto;overflow:hidden}
.mini .mc-pays{fill:rgba(255,255,255,.04);stroke:rgba(255,236,245,.2)}
.mini-bras{opacity:.7;transition:opacity .2s var(--ease)}
.mini-rouen{fill:var(--rose-v)}
.tuile-t{display:block;margin-top:12px;font-family:var(--serif);font-size:1.15rem;line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 70}
.tuile:hover .tuile-carte,.tuile:focus-visible .tuile-carte{border-color:var(--rose-v);background-color:rgba(240,122,182,.06)}
.tuile:hover .mini-bras{opacity:1}
.tuile:hover .tuile-t,.tuile:focus-visible .tuile-t{text-decoration:underline;text-decoration-thickness:1px}
.tuile:focus-visible{outline:none}
@media (max-width:1100px){.tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.tuiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sp + .sp{margin-top:clamp(40px,4.5vw,60px)}
.sp-titre{font-family:var(--serif);font-weight:450;font-size:var(--fs-h3);line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 70}
.sp-titre a{text-decoration:none}
.sp-titre a:hover{text-decoration:underline}
.sp-sous{margin-top:4px;font-size:var(--fs-small);color:var(--muted)}
.sp-creation{margin-top:2px;font-size:var(--fs-small);font-weight:600;color:var(--acc)}
.sls{margin-top:14px;border-top:1px solid var(--ink)}
.sl{padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small);line-height:1.5;transition:opacity .3s var(--ease),background .3s var(--ease)}
.sl-quand{font-weight:600}
.sl-ligne a{text-decoration:none}
.sl-ligne a:hover{text-decoration:underline}
.sl-etat{display:inline-block;margin-top:4px;padding:0 10px;border:1px solid var(--acc);border-radius:999px;font-size:var(--fs-label);font-weight:600;color:var(--acc)}
.sl.annule .sl-ligne{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.sl .dl-det{margin-top:4px}
.saison-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;margin-top:clamp(40px,5vw,64px);padding-top:20px;border-top:1px solid var(--line)}
.saison-nav a{color:var(--acc)}

/* je souhaite programmer : le catalogue, une fiche par spectacle dans son univers */
.fps{display:grid;gap:clamp(16px,2vw,24px)}
.fp{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) minmax(0,310px);gap:clamp(20px,3vw,44px);align-items:start;padding:clamp(18px,2.2vw,28px);background:var(--u-fond);border-radius:110px 22px 22px 22px;box-shadow:0 0 0 1px var(--u-ligne)}
.fp-photo{aspect-ratio:4/5;overflow:hidden;border-radius:999px 999px 8px 8px;background:var(--u-fond2)}
.fp-photo img{width:100%;height:100%;object-fit:cover}
.fp-kicker{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;color:var(--u-vif)}
.etat{display:inline-block;padding:1px 10px;border-radius:999px;background:var(--u-aplat);color:var(--u-sur-aplat);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fp-titre{margin-top:8px;font-size:clamp(1.7rem,1.3rem + 1.2vw,2.4rem);text-wrap:balance}
.fp-titre a{text-decoration:none}
.fp-titre a:hover{text-decoration:underline;text-decoration-thickness:1px}
.fp-sous{margin-top:4px;font-size:var(--fs-small);color:var(--u-texte2)}
.fp-repr{margin-top:16px;font-family:var(--serif);font-size:clamp(1.25rem,1.1rem + .5vw,1.6rem);line-height:1.25;font-variation-settings:"opsz" 40,"SOFT" 100}
.faits{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.faits li{padding:4px 12px;border:1px solid var(--u-ligne);border-radius:999px;font-size:var(--fs-label);font-weight:600;line-height:1.4}
.fp-equipe-c{margin-top:12px;font-size:var(--fs-small)}
.fp-equipe-c li + li{margin-top:4px}
.fp-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.u-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid color-mix(in srgb,var(--u-texte) 45%,transparent);border-radius:999px;color:var(--u-texte);font-size:var(--fs-small);font-weight:600;text-decoration:none;transition:background .16s,color .16s,border-color .16s}
.u-btn:hover{border-color:var(--u-texte)}
.u-btn.plein{background:var(--u-aplat);border-color:var(--u-aplat);color:var(--u-sur-aplat)}
.u-btn.plein:hover{background:var(--u-texte);border-color:var(--u-texte);color:var(--u-fond)}
.fp-lieux{margin-top:16px;border-top:1px solid var(--u-ligne)}
.fp-lieux summary{padding:12px 0 8px;cursor:pointer;font-weight:600;font-size:var(--fs-small)}
.fp-lieux p{padding-bottom:4px;font-size:var(--fs-small);line-height:1.6;color:var(--u-texte2)}
.fp-equipe{font-size:var(--fs-label);line-height:1.55}
.fiche{border-top:1px solid var(--line)}
.fiche li{padding:8px 0;border-bottom:1px solid var(--line)}
.fiche-l{color:var(--muted)}
.univ .fiche{border-top-color:var(--u-ligne)}
.univ .fiche li{border-bottom-color:var(--u-ligne)}
.univ .fiche-l{color:var(--u-texte2)}
.avec{padding:8px 0;border-bottom:1px solid var(--u-ligne,var(--line))}
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.ct-prg{display:grid;gap:4px;max-width:560px;margin-top:clamp(22px,2.6vw,34px);padding:20px 26px 18px;border-radius:26px 26px 14px 14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line-dark);color:#fff}
.ct-prg p{margin:0}
.ct-k{font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--v,var(--u-vif))}
.ct-nom b{display:block;font-family:var(--serif);font-weight:360;font-size:1.7rem;line-height:1.1;font-variation-settings:"opsz" 60,"SOFT" 100}
.ct-role{display:block;color:var(--on-dark-2)}
.ct-liens{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:12px!important}
.ct-mail{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--c,var(--acc));color:#fff;font-family:var(--serif);font-size:1.15rem;text-decoration:none;font-variation-settings:"opsz" 30,"SOFT" 100}
.ct-mail{transition:transform .16s var(--ease)}
.ct-mail:hover{transform:translateY(-2px)}
.ct-tel{font-weight:600;text-decoration:none;color:inherit}
html:not(.ed-actif) .ct-tel.vide{display:none}
.ct-cond{margin-top:10px!important;font-size:var(--fs-small);color:var(--on-dark-2)}
.ct-u{max-width:none;margin:0 0 clamp(22px,2.6vw,34px);background:color-mix(in srgb,var(--u-texte) 6%,transparent);box-shadow:inset 0 0 0 1px var(--u-ligne);color:var(--u-texte)}
.ct-u .ct-k{color:var(--u-vif)}
.ct-u .ct-role,.ct-u .ct-cond{color:var(--u-texte2)}
.dos-bt{position:relative;background:transparent;font:inherit;font-size:var(--fs-small);font-weight:600;cursor:pointer}
.mini-porte{position:relative;display:inline-block;flex:none;width:15px;height:21px;border:1.5px solid currentColor;border-radius:999px 999px 0 0;perspective:90px}
.mini-porte .mp-b{position:absolute;inset:2px 2px 0;background:currentColor;border-radius:999px 999px 0 0;transform-origin:0 50%;transform:rotateY(18deg)}
.dos-bt[aria-busy="true"]{cursor:progress}
.dos-bt[aria-busy="true"] .mp-b{animation:mp-ouvre 1.25s var(--ease) infinite}
@keyframes mp-ouvre{0%,100%{transform:rotateY(14deg)}50%{transform:rotateY(72deg)}}
@media (prefers-reduced-motion:reduce){.dos-bt[aria-busy="true"] .mp-b{animation:none;transform:rotateY(60deg)}}
.pr-actions{margin:0 0 clamp(18px,2.2vw,28px)}
.docs{list-style:none;display:grid;gap:10px;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:12px}
.docs a{font-weight:600;color:var(--u-vif)}
.ft-blocs ~ .docs{margin-top:clamp(18px,2vw,28px)}
.fp-docs{margin-top:16px;padding-top:12px;border-top:1px solid var(--u-ligne)}
.fp-docs .ct-k{margin:0 0 8px}
/* la distribution en portraits (D.personnes, show.equipe) : chaque comédien sous son arche, la photo, ou le monogramme sur une porte éclairée ; ceux qui alternent vont par deux */
.cast{--g:clamp(14px,2vw,26px);--pw:150px;--pmax:232px;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:34px var(--g);max-width:calc(var(--n,4) * var(--pmax) + (var(--n,4) - 1) * var(--g));margin:0 0 clamp(34px,4vw,52px);padding:0}
.cast>li{min-width:0}
.cast>.cast-paire{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g);padding:12px 12px 16px;border-radius:22px;box-shadow:0 0 0 1px var(--u-ligne)}
.cast-pt{margin:0;min-width:0}
.cast-cadre{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;container-type:inline-size;border-radius:999px 999px 8px 8px;background:var(--u-fond2);box-shadow:0 0 0 1px var(--u-ligne)}
.cast-cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.cast-mono{position:absolute;inset:0;display:grid;place-items:center;padding-top:16%;background:radial-gradient(130% 85% at 50% 100%,color-mix(in srgb,var(--u-aplat) 46%,transparent) 0%,color-mix(in srgb,var(--u-aplat) 14%,transparent) 50%,transparent 78%)}
.cast-mono b{font-family:var(--u-police);font-weight:var(--u-graisse);font-size:2.4rem;font-size:27cqw;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:var(--u-titre)}
.cast-pt figcaption{display:block;text-align:center}
.cast-cr{display:block;min-height:1.8em;padding-top:5px;font-size:.75rem;line-height:1.3;color:var(--u-texte2)}
.cast-nom{display:block;margin-top:10px;font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(1.12rem,1rem + .5vw,1.38rem);line-height:1.1;color:var(--u-texte);text-wrap:balance}
.univ[data-police="Anton"] .cast-nom{text-transform:uppercase;letter-spacing:.01em}
.cast-alt,.cast-role{display:block;margin-top:4px;font-size:var(--fs-small);line-height:1.4;color:var(--u-texte2)}
.cast-role{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--u-vif)}
@media (max-width:1100px){.fp{grid-template-columns:minmax(0,150px) minmax(0,1fr)}.fp-equipe{grid-column:1/-1}}
@media (max-width:640px){.fp{grid-template-columns:minmax(0,1fr);border-radius:80px 18px 18px 18px}.fp-photo{width:150px}}
/* la carte de tous les lieux de diffusion */
.tout-detail{min-height:12rem;margin-top:clamp(20px,3vw,32px);padding-top:18px;border-top:1px solid var(--line-dark)}
.td-nom{font-family:var(--serif);font-size:1.5rem;line-height:1.2;color:var(--t,#fff)}
.td-liste{margin-top:10px}
.td-liste li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding:8px 0;border-bottom:1px solid var(--line-dark);font-size:var(--fs-small)}
.td-liste a{color:#fff;font-weight:600}
.td-s{color:var(--on-dark-2);font-variant-numeric:tabular-nums}
.partenaires-s{padding:clamp(48px,6vw,80px) 0 0}
.partenaires{max-width:80ch;padding:22px 26px;border-left:3px solid var(--acc);background:var(--paper);font-size:var(--fs-small);line-height:1.65;color:var(--muted)}
/* écrire à la compagnie */
.ecrire-s{padding:clamp(48px,6vw,88px) 0}
.ecrire-in{display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px 40px}
.ecrire-in .arche{width:clamp(54px,6vw,80px)}
.btn-ecrire{display:inline-flex;align-items:center;gap:14px;min-height:56px;padding:0 30px;border-radius:999px;background:var(--c,var(--acc));color:#fff;font-family:var(--serif);font-size:1.3rem;text-decoration:none;font-variation-settings:"opsz" 30,"SOFT" 100;transition:transform .18s var(--ease)}
.btn-ecrire:hover{transform:translateY(-2px)}
.btn-ecrire span{transition:transform .18s var(--ease)}
.btn-ecrire:hover span{transform:translateX(4px)}

/* je représente un établissement scolaire */
.dossier-une{padding:clamp(48px,6vw,88px) 0;background:var(--u-fond)}
.du-grille{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:center}
.du-photo{aspect-ratio:4/5;overflow:hidden;border-radius:999px 999px 10px 10px;background:var(--u-fond2);box-shadow:0 0 0 10px var(--u-fond2)}
.du-photo img{width:100%;height:100%;object-fit:cover}
.du-type,.dc-type{font-size:var(--fs-label);font-weight:700;letter-spacing:.2em;color:var(--u-vif)}
.du-titre{margin-top:10px;font-size:clamp(3rem,2rem + 4vw,5.6rem)}
.du-auteur{margin-top:6px;font-family:var(--serif);font-size:var(--fs-h3)}
.du-faits,.dc-faits{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.du-faits li,.dc-faits li{padding:5px 14px;border-radius:999px;background:var(--u-aplat);color:var(--u-sur-aplat);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
.formule{margin-top:18px;padding:16px 20px;border:2px solid var(--u-aplat);border-radius:14px;font-weight:600;line-height:1.5}
.du-corps .u-btn{margin-top:26px}
.ac-groupes{display:grid;gap:clamp(48px,6vw,80px)}
.ac-groupe-t{margin-bottom:clamp(18px,2.4vw,28px)}
.acs{display:grid;gap:14px}
.ac{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px clamp(28px,4vw,64px);padding:clamp(22px,3vw,40px);background:var(--u-fond);border-radius:120px 20px 20px 20px;box-shadow:0 0 0 1px var(--u-ligne)}
.ac-titre{font-size:clamp(1.8rem,1.3rem + 1.4vw,2.6rem);text-wrap:balance}
.ac-titre a{text-decoration:none}
.ac-titre a:hover{text-decoration:underline;text-decoration-thickness:1px}
.ac-creation{margin-top:6px;font-size:var(--fs-small);font-weight:600;color:var(--u-vif)}
.etiquette{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.ac .etiquette{margin-top:22px}
.action-type{display:inline-block;margin-top:8px;padding:10px 20px 11px;border-radius:999px 999px 999px 6px;background:var(--u-aplat);color:var(--u-sur-aplat);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(1.35rem,1.1rem + .8vw,1.85rem);line-height:1.15}
.univ[data-police="Anton"] .action-type{text-transform:uppercase}
.action-type.vide{background:transparent;color:var(--u-texte);border:1.5px dashed var(--u-texte2);font-family:var(--sans);font-weight:600;font-size:1.05rem}
.action-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.action-meta li{padding:4px 12px;border:1px solid var(--u-ligne);border-radius:999px;font-size:var(--fs-label);font-weight:600}
.meta-l{color:var(--u-texte2);font-weight:500}
.ac-texte{font-size:var(--fs-small);line-height:1.65}
.ac-texte p + p{margin-top:.7em}
.dispositifs{margin-top:16px;font-size:var(--fs-small);line-height:1.55}
.dispositifs ul{margin-top:6px}
.dispositifs li + li{margin-top:6px}
.dispositifs a,.ac-texte a,.prose-u a{color:var(--u-vif);font-weight:600}
.ac-liens{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
@media (max-width:900px){.ac{grid-template-columns:minmax(0,1fr);border-radius:80px 18px 18px 18px}.du-grille{grid-template-columns:minmax(0,1fr)}.du-photo{max-width:300px}}
.actions{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:48px clamp(48px,7vw,120px);align-items:start}
.actions-photo .arche-img{aspect-ratio:4/5}
.actions-photo figcaption{margin-top:10px;font-size:var(--fs-label);color:var(--muted)}
.actions .sec-titre{margin-bottom:24px}
.galerie-ac{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:32px}
.galerie-ac img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:999px 999px 4px 4px}
@media (max-width:900px){.actions{grid-template-columns:minmax(0,1fr)}.actions-photo{max-width:420px}.galerie-ac{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* un spectacle, dans son univers */
.show{background:var(--u-fond);color:var(--u-texte)}
.show-hero{position:relative;overflow:hidden;padding:clamp(24px,3vw,40px) 0 clamp(40px,5vw,72px);background:radial-gradient(56% 80% at 80% 40%,var(--u-lueur),transparent 70%),var(--u-fond)}
.show-hero-grille{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:36px clamp(40px,6vw,96px);align-items:center}
.show-signe{font-size:var(--fs-label);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--u-texte2)}
.show-lieu{margin-top:18px;font-size:var(--fs-small);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--u-vif)}
.show-title{margin-top:12px;font-size:clamp(2.7rem,1.5rem + 4.4vw,5.8rem);line-height:.98;text-wrap:balance}
.sombre .show-title{text-shadow:0 0 46px var(--u-lueur)}
.show-title .ligne{display:block}
.show-title .mot{display:inline-block;white-space:nowrap}
.show-title .lt{display:inline-block;animation:lettre .55s var(--ease) backwards;animation-delay:calc(var(--i) * 24ms)}
@keyframes lettre{from{opacity:0;transform:translateY(.32em);filter:blur(6px)}}
.show-sub{margin-top:16px;font-family:var(--serif);font-size:var(--fs-h3);line-height:1.3;font-variation-settings:"opsz" 30,"SOFT" 100}
.show-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px}
.show-creation{font-weight:600;color:var(--u-vif)}
.show-cadre{max-width:54ch;margin-top:12px;font-size:var(--fs-small);color:var(--u-texte2)}
.show-accroche{max-width:44ch;margin-top:26px;font-family:var(--serif);font-size:clamp(1.15rem,1rem + .55vw,1.45rem);line-height:1.45;font-variation-settings:"opsz" 30,"SOFT" 100}
.show-accroche .mt{animation:mot .7s ease backwards;animation-delay:calc(350ms + var(--i) * 26ms)}
@keyframes mot{from{opacity:0;filter:blur(3px)}}
.show-photo{position:relative}
.show-photo .arche-img{aspect-ratio:4/5;background:var(--u-fond2);box-shadow:0 0 0 1px var(--u-ligne),0 30px 90px -24px var(--u-lueur)}
.show-photo figcaption{margin-top:10px;font-size:var(--fs-label);color:var(--u-texte2)}
.show-motif{position:absolute;z-index:0;color:var(--u-titre);opacity:.3}
.show-motif.m-arene{width:min(64vw,780px);aspect-ratio:1;right:max(-120px,-8vw);top:50%;transform:translateY(-50%)}
.show-motif.m-jumeaux{width:min(34vw,400px);aspect-ratio:1;left:47%;bottom:-2%}
.show-motif.m-annotations{width:min(40vw,440px);aspect-ratio:1;left:-1%;bottom:-6%;opacity:.42}
.show-motif.m-paperboard{width:min(30vw,330px);aspect-ratio:1;left:46%;bottom:-3%;opacity:.42}
.show-motif.m-nez{width:min(36vw,420px);aspect-ratio:1;left:40%;top:6%}
.show-motif.m-horloge{width:min(46vw,540px);aspect-ratio:1;right:-6%;top:-10%}
.show-motif.m-fil{width:110%;height:100%;left:-5%;top:0;opacity:.5}
.show-motif.m-chronologie{left:var(--gutter);bottom:22px;width:calc(100% - 2 * var(--gutter));height:auto;opacity:.5}
.show[data-motif="chronologie"] .show-hero{padding-bottom:clamp(96px,10vw,140px)}
@media (max-width:900px){
  .show-hero-grille{grid-template-columns:minmax(0,1fr)}
  .show-photo{max-width:440px}
  .show-motif.m-arene{width:120vw;right:-40vw;top:auto;bottom:-20vw;transform:none}
  .show-motif.m-jumeaux,.show-motif.m-paperboard,.show-motif.m-nez{left:auto;right:-6vw;width:56vw}
  .show-motif.m-horloge{width:70vw}
  .show-motif.m-annotations{width:70vw}
}
/* la barre des trois entrées du spectacle : trois portes en arche, celle où l'on lit dans sa couleur */
.show-tabs{position:relative;z-index:2;background:var(--u-fond);box-shadow:inset 0 -1px 0 var(--u-ligne)}
.show-tabs ul{display:flex;gap:clamp(6px,1vw,14px);align-items:flex-end}
.show-tab{display:flex;align-items:center;gap:10px;min-height:62px;padding:22px clamp(18px,2.6vw,38px) 12px;border:1px solid var(--u-ligne);border-bottom:0;border-radius:50% 50% 0 0 / 44px 44px 0 0;background:color-mix(in srgb,var(--u-fond2) 70%,transparent);color:var(--u-texte);font-size:var(--fs-small);font-weight:600;text-decoration:none;transition:background .16s var(--ease),transform .16s var(--ease)}
.show-tab .porte-ico{color:var(--tc);width:14px;height:21px}
.show-tab:hover{background:var(--u-fond2)}
.show-tab.on{background:var(--c);border-color:var(--c);color:#fff}
.show-tab.on .porte-ico{color:#fff}
.show-tab:focus-visible{outline:2px solid var(--u-texte);outline-offset:2px}
@media (max-width:640px){
  .show-tabs ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .show-tab{flex-direction:column;justify-content:flex-end;gap:5px;min-height:76px;padding:22px 6px 10px;border-radius:50% 50% 0 0 / 34px 34px 0 0;font-size:.78rem;line-height:1.2;text-align:center;overflow-wrap:anywhere}
}
.show-corps-fond{box-shadow:inset 0 3px 0 var(--ec)}
.show-corps{display:grid;grid-template-columns:minmax(0,1fr);gap:0 clamp(32px,4vw,64px);padding-bottom:clamp(24px,3vw,48px)}
.sommaire{display:none}
@media (min-width:1100px){
  .show-corps{grid-template-columns:184px minmax(0,1fr)}
  .sommaire{display:block;position:sticky;top:24px;align-self:start;padding-top:clamp(48px,5vw,72px)}
}
.sommaire ol{border-left:1px solid var(--u-ligne)}
.sommaire a{display:block;margin-left:-1px;padding:7px 0 7px 16px;border-left:2px solid transparent;color:var(--u-texte2);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:color .16s,border-color .16s}
.sommaire a:hover{color:var(--u-texte)}
.sommaire a.on{border-left-color:var(--ecv);color:var(--u-texte)}
.chapitres{min-width:0}
/* les grilles d'une seule colonne ne s'élargissent jamais à leur contenu (le tableau des programmes défile dans son cadre) */
.dossier,.affirmations,.ac-groupes,.fps,.acs,.etapes,.espace-photos,.d-sec,.action{grid-template-columns:minmax(0,1fr);min-width:0}
.chap{padding:clamp(44px,5vw,72px) 0;border-top:1px solid var(--u-ligne);scroll-margin-top:12px}

html .ed-panneau .ed-pied .ed-bt.ed-plein:hover{background:var(--rose);border-color:var(--rose)}
html .ed-annonce{background:var(--aub-3);border-radius:18px 18px 6px 6px;box-shadow:inset 0 3px 0 var(--rose-v),0 8px 28px rgba(0,0,0,.35)}
.ed-bt.ed-plein.ed-ajout{display:flex;width:fit-content;margin:4px 0 14px;padding:10px 20px 9px 16px;border:0;border-radius:24px 24px 4px 4px;background:var(--aub);color:#fff;font-family:var(--serif);font-weight:400;font-size:1rem;box-shadow:inset 0 2px 0 var(--rose-v)}
.ed-bt.ed-plein.ed-ajout:hover{background:var(--aub-3)}

/* ———————————— le mouvement (règle 15) : les battants ; voir le bloc « Mouvement » en tête du script ————————————
   Une porte s'ouvre, la lumière passe par l'embrasure, on referme derrière soi. Survol 160 à 200 ms, pression 90 ms, page 420 ms. */
html{view-transition-name:none}
main{display:block;min-height:100vh;overflow-x:clip}   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas ; ce qui glisse n'en déborde pas */
/* les battants : deux vantaux à la couleur de la page qui s'ouvre, sous l'en-tête ; la lumière passe entre eux.
   Seuls transform et opacity bougent ; rien ne capte le pointeur : un nouveau geste passe au travers */
.battants{position:fixed;left:0;right:0;bottom:0;top:var(--bt-haut,0px);z-index:25;pointer-events:none;perspective:1700px;perspective-origin:50% 42%;visibility:hidden;overflow:hidden}
.battants.on{visibility:visible}
.bt{position:absolute;top:0;bottom:0;width:50.4%;backface-visibility:hidden;will-change:transform,opacity;background:linear-gradient(90deg,color-mix(in srgb,var(--bt-c) 82%,#000) 0%,var(--bt-c) 78%,color-mix(in srgb,var(--bt-c) 86%,var(--bt-l)) 100%)}
.bt-g{left:0;transform-origin:0 50%}
.bt-d{right:0;transform-origin:100% 50%;background:linear-gradient(270deg,color-mix(in srgb,var(--bt-c) 82%,#000) 0%,var(--bt-c) 78%,color-mix(in srgb,var(--bt-c) 86%,var(--bt-l)) 100%)}
.bt-d::before{left:15%;right:13%}
.bt-d::after{right:auto;left:7%}
.bt::before{content:"";position:absolute;inset:clamp(40px,9vh,90px) 15% 0 13%;border:1.5px solid color-mix(in srgb,var(--bt-l) 34%,transparent);border-bottom:0;border-radius:999px 999px 0 0}
.bt::after{content:"";position:absolute;right:7%;top:56%;width:10px;height:10px;border-radius:50%;background:var(--bt-l);box-shadow:0 0 14px 3px color-mix(in srgb,var(--bt-l) 60%,transparent)}
.bt-jour{position:absolute;top:-10%;bottom:-10%;left:50%;width:min(76vw,980px);margin-left:calc(min(76vw,980px) / -2);opacity:0;will-change:transform,opacity;
  background:radial-gradient(50% 58% at 50% 46%,color-mix(in srgb,var(--bt-l) 42%,#fff) 0%,color-mix(in srgb,var(--bt-l) 34%,transparent) 34%,transparent 72%)}
/* la carte d'un spectacle devient l'arche de sa page (élément partagé) ; l'arche d'une porte de l'accueil, celle de sa page */
::view-transition-group(mv-partage){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.12,1)}
::view-transition-old(mv-partage){animation:.16s ease-out both bt-fondu}
::view-transition-new(mv-partage){animation:.26s cubic-bezier(.2,.7,.2,1) both bt-parait}
@keyframes bt-fondu{to{opacity:0}}
@keyframes bt-parait{from{opacity:0}}
/* d'un onglet à l'autre d'un spectacle : l'en-tête reste, la porte allumée glisse jusqu'à l'onglet choisi */
html[data-mv-transition="onglet"] .show-tab.on{view-transition-name:porte-active}
::view-transition-group(porte-active){animation-duration:.3s;animation-timing-function:cubic-bezier(.3,.7,.12,1)}
/* la pression : la porte cède sous la main, à l'instant même ; les boutons s'enfoncent d'un rien */
.door-link.mv-presse .door-battant{transform:rotateY(86deg);transition-duration:.12s}
.door-link.mv-presse .door-lumiere{opacity:1;transition-duration:.12s}
.entree.mv-presse,.show-tab.mv-presse,.pied-portes a.mv-presse{transform:perspective(420px) rotateY(-10deg);transform-origin:0 50%;transition:transform .09s}
:is(.u-btn,.btn,.btn-ecrire,.ct-mail,.cp,.idx,.idx-tout,.puce,.menu-btn,.pied-modifier,.dos-bt).mv-presse{scale:.965;transition:scale .09s}
.uc:has(.mv-presse),.fp:has(.fp-titre a.mv-presse){scale:.985;transition:scale .09s}
.uc:has(.mv-presse) .uc-photo img{transform:scale(1.08)}
.ep-porte:has(.mv-presse) .ep-battant{transform:rotateY(96deg);transition-duration:.12s}
.ep-porte:has(.mv-presse) .ep-lumiere{opacity:1}
.sai>summary.mv-presse .sai-arche{scale:.96;transition:scale .09s}
/* l'apparition au défilement : les titres montent ; les cartes viennent l'une après l'autre en pivotant sur leur gond, comme un
   vantail qui se rabat dans son cadre ; les chiffres comptent */
[data-mv="cascade"].mv-attente:not(.mv-vu)>*{opacity:0;transform:perspective(1400px) rotateY(22deg);transform-origin:0 50%}
[data-mv="cascade"].mv-attente>*{transition:opacity .5s var(--ease),transform .62s var(--ease);transition-delay:calc(var(--mv-delai,0ms) + min(var(--mv-i,0),12) * 60ms)}
[data-mv="monte"].mv-attente:not(.mv-vu){opacity:0;transform:translateY(16px)}
.gros{font:inherit;font-variant-numeric:tabular-nums}
/* ce qui se déplie : une saison s'ouvre, la porte de sa petite arche s'efface, la lumière y entre */
.sai-arche{position:relative;perspective:260px}
.sai-battant{position:absolute;inset:6% 6% 0;border-radius:999px 999px 0 0;background:linear-gradient(90deg,rgba(34,16,29,.82),rgba(67,32,59,.58));box-shadow:inset 0 0 0 1px rgba(240,122,182,.35);transform-origin:0 50%;transform:rotateY(58deg);transition:transform .32s var(--ease),opacity .32s}
.sai>summary:hover .sai-battant{transform:rotateY(70deg);transition-duration:.18s}
.sai[open] .sai-battant{transform:rotateY(92deg);opacity:0}
.sai[open] .sai-arche{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-v) 30%,transparent),0 0 30px -4px var(--acc-v),inset 0 -40px 50px -30px color-mix(in srgb,var(--acc-v) 70%,transparent)}
/* une ligne vers laquelle la frise mène : elle s'allume un instant */
.dl.est-vise,.sl.est-vise,.pr.est-vise .pr-a{animation:vise 1.3s var(--ease)}
@keyframes vise{0%,30%{background:color-mix(in srgb,var(--acc) 20%,transparent)}}
.dl.est-allume,.sl.est-allume{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent 85%)}
.univ .dl.est-allume{background:linear-gradient(90deg,color-mix(in srgb,var(--u-vif) 18%,transparent),transparent 85%)}
.sai.est-allume>summary{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.mc-lieu.est-allume .mc-halo{transform:scale(1.85)}
.mc-lieu.est-allume .mc-anneau{opacity:1}
/* ce qui vit : « EN TOURNÉE » respire, comme une lumière derrière une porte */
.respire::before{content:"";display:inline-block;width:7px;height:10px;margin-right:9px;border-radius:999px 999px 1px 1px;background:currentColor;vertical-align:0;animation:respire 2.6s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:1;box-shadow:0 0 0 0 transparent}50%{opacity:.35;box-shadow:0 0 10px 2px currentColor}}
/* le dossier PDF prêt : sa petite porte s'ouvre en grand, la lumière en sort, puis elle se referme */
.dos-bt.dos-pret .mp-b{animation:mp-pret 1.4s var(--ease)}
.dos-bt.dos-pret .mini-porte{animation:mp-lueur 1.4s var(--ease)}
@keyframes mp-pret{0%{transform:rotateY(18deg)}25%,70%{transform:rotateY(100deg)}100%{transform:rotateY(18deg)}}
@keyframes mp-lueur{25%,70%{box-shadow:0 0 14px 3px color-mix(in srgb,currentColor 55%,transparent);background:color-mix(in srgb,currentColor 30%,transparent)}}

/* ———— les frises (FRISE) : la rampe du calendrier ; chaque date est une petite porte en arche, à la couleur de son spectacle ;
   « aujourd'hui », un trait de lumière posé sur l'axe ———— */
.rampe{position:relative;background:var(--aub);color:#fff;padding:clamp(18px,2.4vw,30px) 0 clamp(14px,2vw,24px);border-top:1px solid var(--line-dark);overflow-x:clip}
.rampe-frise{min-height:118px}
.frise[data-frise]{--fr-fond:var(--aub);--fr-encre:#fff;--fr-trait:rgba(255,236,245,.3);--fr-accent:var(--rose-v);--fr-police:var(--sans);--fr-passe:.4;
  --fr-bulle-fond:#fff;--fr-bulle-encre:var(--ink);--fr-point:11px;--fr-couloir:19px;--fr-haut:30px;--fr-taille:12px;--fr-courbe:var(--ease)}
.frise[data-frise] .frise-mois-nom{font:400 .94rem/1.1 var(--serif);font-variation-settings:"opsz" 30,"SOFT" 100}
.frise[data-frise] .frise-an{font:600 .68rem/1.3 var(--sans);letter-spacing:.08em;opacity:.72}
.frise[data-frise] .frise-point>.frise-repere::before{width:9px;height:12px;border-radius:999px 999px 1.5px 1.5px;translate:0 -4px;transform-origin:50% 100%;
  box-shadow:0 0 0 2px var(--fr-fond),0 0 12px 1px color-mix(in srgb,var(--fr-c,#fff) 55%,transparent)}
.frise[data-frise] .frise-point.est-scolaire:not(.est-duree)>.frise-repere::before{rotate:none;width:9px;height:12px;border-radius:999px 999px 1.5px 1.5px;background:var(--fr-fond);box-shadow:inset 0 0 0 2px var(--fr-c,#fff),0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-point.est-duree>.frise-repere::before{height:7px;border-radius:999px 999px 2px 2px;translate:none;box-shadow:0 0 10px 0 color-mix(in srgb,var(--fr-c,#fff) 50%,transparent)}
.frise[data-frise] .frise-point.est-passe>.frise-repere::before{box-shadow:0 0 0 2px var(--fr-fond)}
/* la prochaine date : sa porte est éclairée */
.frise[data-frise] :is(.frise-point.est-passe+.frise-point:not(.est-passe),.frise-point:first-child:not(.est-passe))>.frise-repere::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:20px;margin:-14px 0 0 -8px;border-radius:999px 999px 2px 2px;border:1px solid var(--fr-c,#fff);opacity:0;animation:prochaine 2.8s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes prochaine{0%{opacity:.7;scale:.7}70%,100%{opacity:0;scale:1.5}}
.frise[data-frise] .frise-aujourdhui::before{width:2px;left:-1px;opacity:.95;background:linear-gradient(to top,var(--fr-accent),color-mix(in srgb,var(--fr-accent) 0%,transparent))}
.frise[data-frise] .frise-aujourdhui::after{left:-5px;bottom:-5px;width:10px;height:10px;box-shadow:0 0 12px 3px color-mix(in srgb,var(--fr-accent) 60%,transparent)}
.frise[data-frise] .frise-aujourdhui-nom{font:700 .62rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.frise[data-frise] .frise-bulle{border-radius:16px 16px 6px 6px;box-shadow:0 18px 40px -16px rgba(10,3,8,.6);font:400 .86rem/1.4 var(--sans)}
.frise[data-frise] .frise-bulle b{font:400 1.08rem/1.2 var(--serif);font-variation-settings:"opsz" 30,"SOFT" 100}
.frise[data-frise] .frise-grappe>span{width:24px;height:26px;margin:-15px 0 0 -12px;border-radius:999px 999px 3px 3px;background:radial-gradient(closest-side,var(--fr-fond) 62%,transparent 66%),conic-gradient(var(--fr-g,currentColor))}
.frise[data-frise] .frise-grappe-n{font:700 10px/1 var(--sans);padding-top:3px}
.frise[data-frise] .frise-repere:focus-visible{outline-color:var(--fr-accent)}
/* les saisons et leur densité : une arche par saison, plus ou moins haute */
.ag-frise{margin:0 0 18px;padding:18px clamp(8px,1.6vw,20px) 6px;border-radius:30px 30px 12px 12px;background:radial-gradient(70% 90% at 50% 100%,#3a1631,var(--aub) 80%);color:#fff;min-height:132px}
.frise-saisons{--fr-bande-h:46px;--fr-haut:22px;--fr-pied:32px}
.frise-saisons .frise-bande-barre{margin:0 3px;border-radius:999px 999px 2px 2px/22px 22px 2px 2px;background:linear-gradient(180deg,var(--rose-v),var(--rose) 80%);opacity:.9}
.frise-saisons .frise-bande.est-passe .frise-bande-barre{opacity:.62}
.frise-saisons .frise-bande:is(:hover,.est-allume) .frise-bande-barre{opacity:1;filter:brightness(1.15)}
.frise-saisons .frise-bande-n{font:600 .74rem var(--sans);color:#fff}
.frise-saisons .frise-bande-nom{font:500 .7rem var(--sans);color:var(--on-dark-2)}
/* la diffusion d'un spectacle, saison par saison */
.diffusion{min-height:96px;margin-top:16px;padding-top:10px;border-top:1px solid var(--u-ligne)}
.diffusion .ct-k{margin:0;color:var(--u-vif)}
.frise-diffusion{--fr-bande-h:30px;--fr-haut:14px;--fr-pied:26px;--fr-taille:10px;--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:var(--u-ligne);--fr-accent:var(--u-vif)}
.frise-diffusion .frise-bande-barre{margin:0 1.5px;border-radius:999px 999px 1px 1px/12px 12px 1px 1px;background:var(--u-aplat);opacity:.86}
.frise-diffusion .frise-bande-nom{opacity:.75;letter-spacing:-.02em}
.frise-diffusion .frise-bande:not(:first-child):not(:last-child) .frise-bande-nom{opacity:0;transition:opacity .16s}
.frise-diffusion .frise-bande:is(:hover,.est-allume,:focus-within) .frise-bande-nom{opacity:1}
.frise-diffusion .frise-aujourdhui-nom{display:none}
.frise-compagnie{--fr-fond:var(--aub);--fr-encre:#fff;--fr-trait:var(--line-dark);--fr-accent:var(--rose-v);--fr-bande-h:44px;--fr-taille:11px}
.frise-compagnie .frise-bande-barre{background:linear-gradient(180deg,#e8bc5c,#8a6410)}
.p-diff{min-height:118px;margin-top:22px}
/* dans l'univers d'un spectacle, et sur l'ivoire */
.univ .frise[data-frise]{--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-texte) 30%,transparent);--fr-accent:var(--u-vif);--fr-bulle-fond:var(--u-texte);--fr-bulle-encre:var(--u-fond)}
.u-frise{min-height:118px;margin:0 0 clamp(24px,3vw,40px)}
.u-frise .frise-mois-nom{font-family:var(--sans);font-size:.86rem;font-weight:600}
/* la frise historique de la compagnie : les créations en étiquettes, chacune sur sa petite porte */
.histoire-frise .frise[data-frise]{--fr-point:12px;--fr-couloir:46px;--fr-haut:30px;--fr-passe:1}
.histoire-frise .frise-etiquette{font:400 1.02rem/1.2 var(--serif);font-variation-settings:"opsz" 30,"SOFT" 100;max-width:10em}
.histoire-frise .frise-repere:is(:hover,:focus-visible) .frise-etiquette{color:var(--rose-v);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.histoire-frise .frise-mois-nom{font:500 .78rem var(--sans);opacity:.7}

/* ———— l'espace pro : trois vraies portes, chacune vers son espace ———— */
.ep-hero{padding-bottom:clamp(20px,2.4vw,36px)}
.ep-s{padding:clamp(18px,2.4vw,36px) 0 clamp(64px,8vw,120px);background:var(--aub);color:#fff}
.ep-texte{max-width:52ch}
.ep-portes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.6vw,40px)}
.ep-porte{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 6px;text-align:center}
.ep-arche{position:relative;display:block;width:min(100%,clamp(170px,17vw,250px));aspect-ratio:5/7;margin-bottom:10px;perspective:1000px}
.ep-arche::before{content:"";position:absolute;inset:-9px -9px 0;border:1.5px solid var(--v);border-bottom:0;border-radius:999px 999px 0 0;opacity:.7;transition:opacity .18s}
.ep-salle,.ep-lumiere,.ep-battant{position:absolute;inset:0;border-radius:999px 999px 0 0}
.ep-salle{background:radial-gradient(90% 60% at 50% 100%,color-mix(in srgb,var(--v) 70%,#fff) 0%,color-mix(in srgb,var(--v) 46%,var(--aub)) 46%,var(--aub-2) 100%)}
.ep-lumiere{background:radial-gradient(120% 70% at 50% 100%,color-mix(in srgb,var(--v) 80%,transparent),transparent 72%);opacity:.35;transition:opacity .2s var(--ease)}
.ep-battant{background:linear-gradient(90deg,#1a0b16,var(--aub-3) 70%,#4a2442);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v) 40%,transparent),18px 0 40px rgba(10,3,8,.55);transform-origin:0 50%;transform:rotateY(8deg);transition:transform .2s var(--ease)}
.ep-battant::before{content:"";position:absolute;inset:12% 16% 8%;border:1px solid color-mix(in srgb,var(--v) 26%,transparent);border-radius:999px 999px 2px 2px}
.ep-battant::after{content:"";position:absolute;right:12%;top:56%;width:10px;height:10px;border-radius:50%;background:var(--v);box-shadow:0 0 12px 2px color-mix(in srgb,var(--v) 60%,transparent)}
.ep-porte:is(:hover,:focus-within) .ep-battant{transform:rotateY(62deg)}
.ep-porte:is(:hover,:focus-within) .ep-lumiere{opacity:1}
.ep-porte:is(:hover,:focus-within) .ep-arche::before{opacity:1}
.ep-t{font-family:var(--serif);font-weight:400;font-size:clamp(1.45rem,1.1rem + 1vw,2.1rem);line-height:1.12;letter-spacing:-.01em;font-variation-settings:"opsz" 72,"SOFT" 100;text-wrap:balance}
.ep-a{color:#fff;text-decoration:none}
.ep-a::after{content:"";position:absolute;inset:-12px -8px 0}
.ep-a:focus-visible{outline:none}
.ep-porte:focus-within .ep-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.ep-porte:has(.ep-a:focus-visible){outline:2px solid var(--v);outline-offset:10px;border-radius:999px 999px 8px 8px}
.ep-x{color:var(--on-dark-2);font-size:var(--fs-small);line-height:1.55;max-width:34ch}
.ed-actif .ep-a::after{display:none}
@media (max-width:900px){
  .ep-portes{grid-template-columns:minmax(0,1fr);gap:16px}
  .ep-porte{display:grid;grid-template-columns:clamp(74px,18vw,110px) minmax(0,1fr);grid-template-areas:"arche t" "arche x";align-items:end;column-gap:20px;row-gap:6px;padding:16px 0;border-top:1px solid var(--line-dark);text-align:left}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : les battants. Tout passe par une porte : on la pousse, elle s'ouvre, la lumière passe par l'embrasure ; en
     revenant, on la referme derrière soi. Une seule courbe (rapide, puis posée), jamais plus de 450 ms pour une page.
     1. Changer de page (MOUVEMENT.transition) : l'en-tête reste, comme un linteau ; dessous, deux vantaux à la couleur de la
        page qui arrive (celle de l'entrée, ou le fond de l'univers du spectacle) s'ouvrent vers l'intérieur et la lumière passe
        entre eux (420 ms). Au retour, les vantaux de la page quittée se rabattent et s'effacent : on a refermé derrière soi.
        La carte d'un spectacle (une arche) devient l'arche de sa page, et l'arche d'une porte de l'accueil celle de sa page
        (View Transitions, élément partagé) ; d'un onglet à l'autre d'un spectacle, l'en-tête reste et seule la porte allumée
        glisse. Un geste pendant ce temps termine la transition ; les vantaux ne captent jamais le pointeur.
     2. Ouvrir une saison : la porte de sa petite arche s'efface, la lumière y entre, ses dates arrivent en cascade ; le menu
        aussi se déplie ligne à ligne.
     3. Filtrer, chercher : les dates glissent à leur nouvelle place, celles qui partent s'effacent (MOUVEMENT.flip) ; les
        repères de la frise glissent, les saisons de la frise des saisons changent de hauteur.
     4. Survol et focus : 160 à 200 ms ; une porte s'entrouvre et sa lumière monte, rien ne tremble.
     5. Pression : la porte cède sous la main dès le pointerdown (elle s'ouvre en grand) ; les boutons s'enfoncent d'un rien.

  // la carte de tous les lieux : un trait par commune, tous dans un seul tracé ; un point par commune (survolé : il grandit)
  function carteLegere({ lieux, titre, theme }) {

    const pc = ([x, y]) => `${((x - BX) / BW * 100).toFixed(2)}% ${((y - BY) / BH * 100).toFixed(2)}%`;

        <use href="#m04-voisins" class="mc-voisin"/><use href="#m04-pays" class="mc-pays"/>${encart}
        <path class="mc-traits" stroke="url(#m04-bras-${esc(theme)})" d="${lieux.filter(x => Math.hypot(x.xy[0] - R[0], x.xy[1] - R[1]) >= 6).map(x => CARTE.trait(x.xy, { courbe: courbe(x) })).join('')}"/>
        <circle class="mc-rouen-halo" fill="url(#m04-rouen-${esc(theme)})" cx="${R[0]}" cy="${R[1]}" r="20"/><circle class="mc-rouen" cx="${R[0]}" cy="${R[1]}" r="4.6"/>
        ${lieux.map(x => `<circle class="mc-pt carte-lieu" data-l="${x.l}" cx="${x.xy[0]}" cy="${x.xy[1]}" r="2.6"><title>${esc(CARTE.nom(x))}</title></circle>`).join('')}

  const miniCarte = code => {

  // les dégradés des bras sur le prune, un par entrée (refaits si les entrées changent)

      ${X.ENTREES.map(e => `<radialGradient id="m04-bras-${esc(e.cle)}" gradientUnits="userSpaceOnUse" cx="${R[0]}" cy="${R[1]}" r="470"><stop offset="0" stop-color="${esc(e.couleurVive)}"/><stop offset=".18" stop-color="${melange(e.couleurVive, '#ffffff', .5)}"/><stop offset=".55" stop-color="${melange(e.couleurVive, '#ffffff', .86)}"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
        <radialGradient id="m04-rouen-${esc(e.cle)}"><stop offset="0" stop-color="${esc(e.couleurVive)}" stop-opacity=".75"/><stop offset="1" stop-color="${esc(e.couleurVive)}" stop-opacity="0"/></radialGradient>`).join('')}
      <radialGradient id="m04-lueur"><stop offset="0" stop-color="#ffffff"/><stop offset=".26" stop-color="#ffeaf4" stop-opacity=".62"/><stop offset="1" stop-color="#ffd3e8" stop-opacity="0"/></radialGradient>

  // ceux d'un univers, posés dans la page du spectacle
  const defsUnivers = u => {
