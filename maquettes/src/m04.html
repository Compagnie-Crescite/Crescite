.site-footer{background:var(--aub);color:#fff;padding:clamp(56px,7vw,96px) 0 32px;border-top:1px solid var(--line-dark)}
.pied-portes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:clamp(48px,6vw,80px)}
.pied-portes a{display:flex;align-items:center;gap:14px;height:100%;padding:18px 20px;border-radius:30px 30px 0 0;background:var(--aub-2);box-shadow:inset 0 2px 0 var(--v);color:#fff;font-family:var(--serif);font-size:1.2rem;line-height:1.2;text-decoration:none;transition:background .16s,transform .16s}
.pied-portes a:hover{background:var(--aub-3)}
.pied-portes .porte-ico{color:var(--v)}
.pied-portes a{--v:var(--sai-v)}
.pied-grille{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) minmax(0,2fr) minmax(0,5fr);gap:36px clamp(28px,4vw,64px);align-items:start;font-size:var(--fs-small);line-height:1.6}
.pied-logo{display:block;width:84px;color:var(--sai-v)}
.pied-logo svg{display:block;width:100%;height:auto}
.pied-nom{font-weight:600}
.pied-adr{color:var(--on-dark-2)}
.pied-ecrire{font-family:var(--serif);font-size:1.3rem;text-decoration-color:rgba(255,255,255,.4)}
.pied-ecrire:hover{text-decoration-color:#fff}
.pied-fb{margin-top:6px;color:var(--on-dark-2)}
.pied-part{color:var(--on-dark-2)}
.pied-bas{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;margin-top:clamp(40px,5vw,64px);padding-top:22px;border-top:1px solid var(--line-dark);font-size:var(--fs-label);color:var(--on-dark-2)}
.pied-legal,.pied-liens{display:flex;flex-wrap:wrap;gap:4px 0}
.pied-legal li + li::before,.pied-liens li + li::before{content:"·";margin:0 10px;color:rgba(255,255,255,.4)}
.pied-liens a{color:#fff}
@media (max-width:1000px){.pied-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pied-part{grid-column:1/-1}}
@media (max-width:480px){.pied-portes{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pied-portes a{padding:14px 14px;font-size:1.05rem}}
@media (max-width:480px){.pied-grille{grid-template-columns:minmax(0,1fr)}}
@media (max-width:819px){.site-footer{padding-bottom:calc(32px + 80px + env(safe-area-inset-bottom))}}

/* « Modifier le site » : discret, avec les liens légaux du pied, derrière sa petite porte */
.pied-modifier{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:none;color:#fff;font:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;cursor:pointer}
.pied-modifier .porte-ico{width:11px;height:16px;color:var(--sai-v)}
.pied-modifier:hover{text-decoration-thickness:2px}
/* un texte de bloc de D qui porte sa balise (titre, liste) : une enveloppe pour l'édition, sans effet sur la page */
.prose > .bl:first-child > :first-child{margin-top:0}
/* l'édition sur place, dans les portes : la barre comme l'en-tête prune, le panneau sous une arche
   (préfixe html : l'outil ajoute ses styles après ceux-ci) */
.ed-actif .uc-titre a::after,.ed-actif .uc-btn::after{display:none}
.ed-boite[hidden],.ed-boite [hidden]{display:none!important}
html .ed-barre{background:var(--aub);color:#fff;border-color:var(--line-dark);border-radius:30px 30px 12px 12px;box-shadow:inset 0 3px 0 var(--sai-v),0 18px 44px rgba(20,8,16,.45)}
html .ed-barre .ed-etat{font-family:var(--serif);font-weight:400;font-size:1.15rem;font-variation-settings:"opsz" 30,"SOFT" 100}
html .ed-barre .ed-etat::before{width:9px;height:13px;border-radius:999px 999px 0 0;background:var(--sai-v);vertical-align:-1px}
html .ed-barre .ed-nb{color:var(--on-dark-2);opacity:1}
html .ed-barre .ed-bt{background:transparent;border-color:var(--line-dark);color:#fff}
html .ed-barre .ed-bt:hover{background:var(--aub-2);border-color:rgba(255,255,255,.4)}
html .ed-barre .ed-bt.ed-plein{background:var(--sai);border-color:var(--sai);color:var(--sai-sur)}
html .ed-barre .ed-bt.ed-plein:hover{background:color-mix(in srgb,var(--sai) 82%,#fff)}
html .ed-panneau{border-radius:42px 42px var(--ed-rayon) var(--ed-rayon)}
.ed-panneau .ed-tete{padding-top:20px;background:var(--aub);color:#fff;border-bottom:0;box-shadow:inset 0 -3px 0 var(--sai-v)}
.ed-panneau .ed-tete h2{font-family:var(--serif);font-weight:380;font-size:1.65rem;line-height:1.1;font-variation-settings:"opsz" 72,"SOFT" 100}
.ed-panneau .ed-tete .ed-bt{background:transparent;border-color:var(--line-dark);color:#fff}
.ed-panneau .ed-champ > span:first-child{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
html .ed-panneau .ed-pied .ed-bt.ed-plein{background:var(--aub);border-color:var(--aub);color:#fff}
html .ed-panneau .ed-pied .ed-bt.ed-plein:hover{background:var(--sai);border-color:var(--sai);color:var(--sai-sur)}
html .ed-annonce{background:var(--aub-3);border-radius:18px 18px 6px 6px;box-shadow:inset 0 3px 0 var(--sai-v),0 8px 28px rgba(0,0,0,.35)}
.ed-bt.ed-plein.ed-ajout{display:flex;width:fit-content;margin:4px 0 14px;padding:10px 20px 9px 16px;border:0;border-radius:24px 24px 4px 4px;background:var(--aub);color:#fff;font-family:var(--serif);font-weight:400;font-size:1rem;box-shadow:inset 0 2px 0 var(--sai-v)}
.ed-bt.ed-plein.ed-ajout:hover{background:var(--aub-3)}

/* ———————————— le mouvement (règle 15) : les battants ; voir le bloc « Mouvement » en tête du script ————————————
   Une porte s'ouvre, la lumière passe par l'embrasure, on referme derrière soi. Survol 160 à 200 ms, pression 90 ms, page 420 ms. */
html{view-transition-name:none}
main{display:block;min-height:100vh;overflow-x:clip}
[data-suite-attend]{min-height:100vh}   /* une place qui attend la suite de la page garde la hauteur d'un écran */
/* les saisons : ce qui est sous toutes les dates (les saisons passées, le pied) n'est ni mis en page ni peint tant qu'on n'y va
   pas (filtrer ne repeint que ce qu'on voit ; au téléphone, la page se pose d'abord). Toutes les dates, elles, sont mises en
   page d'emblée : leur taille réelle, arrivée d'un coup, ferait sauter les saisons passées sous les yeux */
#v-agenda,html[data-vue="saisons"] .site-footer{content-visibility:auto;contain-intrinsic-size:auto 1200px}   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas ; ce qui glisse n'en déborde pas */
/* les battants : deux vantaux à la couleur de la page qui s'ouvre, sous l'en-tête ; la lumière passe entre eux.
   Seuls transform et opacity bougent ; rien ne capte le pointeur : un nouveau geste passe au travers */
.battants{position:fixed;left:0;right:0;bottom:0;top:var(--bt-haut,0px);z-index:25;pointer-events:none;perspective:1700px;perspective-origin:50% 42%;visibility:hidden;overflow:hidden}
.battants.on{visibility:visible}
/* chaque vantail est un aplat (rien à peindre : la carte graphique le remplit d'une couleur) ; seuls son bord intérieur, où la
   lumière accroche, et sa poignée sont peints */
.bt{position:absolute;top:0;bottom:0;width:50.4%;backface-visibility:hidden;will-change:transform,opacity;background:var(--bt-c)}
.bt-g{left:0;transform-origin:0 50%}
.bt-d{right:0;transform-origin:100% 50%}
.bt::before{content:"";position:absolute;top:0;bottom:0;right:0;width:9%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--bt-l) 16%,transparent))}
.bt-d::before{right:auto;left:0;background:linear-gradient(270deg,transparent,color-mix(in srgb,var(--bt-l) 16%,transparent))}
.bt-d::after{right:auto;left:7%}
.bt::after{content:"";position:absolute;right:7%;top:56%;width:10px;height:10px;border-radius:50%;background:var(--bt-l);box-shadow:0 0 14px 3px color-mix(in srgb,var(--bt-l) 60%,transparent)}
/* la lumière de l'embrasure : un calque étroit que l'animation élargit (peu de pixels à peindre ; une lueur supporte le flou) */
.bt-jour{position:absolute;top:-10%;bottom:-10%;left:50%;width:min(19vw,245px);margin-left:calc(min(19vw,245px) / -2);opacity:0;will-change:transform,opacity;
  background:radial-gradient(50% 58% at 50% 46%,color-mix(in srgb,var(--bt-l) 42%,#fff) 0%,color-mix(in srgb,var(--bt-l) 34%,transparent) 34%,transparent 72%)}
/* la carte d'un spectacle devient l'arche de sa page, l'arche d'une porte de l'accueil celle de sa page : une copie de son image
   vole de l'une à l'autre, au-dessus des vantaux (transform seul) */
.arche-vole{position:fixed;z-index:30;margin:0;object-fit:cover;transform-origin:0 0;pointer-events:none;will-change:transform}
/* la pression : la porte cède sous la main, à l'instant même ; les boutons s'enfoncent d'un rien */
.door-link.mv-presse .door-battant{transform:rotateY(86deg);transition-duration:.12s}
.door-link.mv-presse .door-lumiere{opacity:1;transition-duration:.12s}
.m-porte.mv-presse,.show-tab.mv-presse,.pied-portes a.mv-presse,.rs-date.mv-presse{transform:perspective(420px) rotateY(-10deg);transform-origin:0 50%;transition:transform .09s}
:is(.u-btn,.btn,.btn-ecrire,.ct-mail,.cp,.idx,.idx-tout,.puce,.theme-m04,.pied-modifier,.dos-bt,.lc-b,.rs-reserver,.rs-seance,.tr4-place).mv-presse{scale:.965;transition:scale .09s}
.uc:has(.mv-presse),.fp:has(.fp-titre a.mv-presse){scale:.985;transition:scale .09s}
.uc:has(.mv-presse) .uc-photo img{transform:scale(1.08)}
.ep-porte:has(.mv-presse) .ep-battant{transform:rotateY(96deg);transition-duration:.12s}
.ep-porte:has(.mv-presse) .ep-lumiere{opacity:1}
.sai>summary.mv-presse .sai-arche{scale:.96;transition:scale .09s}
/* l'apparition au défilement : les titres montent ; les cartes viennent l'une après l'autre en pivotant sur leur gond, comme un
   vantail qui se rabat dans son cadre ; les chiffres comptent */
[data-mv="cascade"].mv-attente:not(.mv-vu)>*{opacity:0;transform:perspective(1400px) rotateY(22deg);transform-origin:0 50%}
/* la cascade : 360 ms par carte, 30 ms de l'une à l'autre (douze au plus) : tout est posé en moins de 0,75 s */
[data-mv="cascade"].mv-attente>*{transition:opacity .3s var(--ease),transform .36s var(--ease);transition-delay:calc(var(--mv-delai,0ms) + min(var(--mv-i,0),12) * 30ms)}
[data-mv="monte"].mv-attente:not(.mv-vu){opacity:0;transform:translateY(16px)}
.gros{font:inherit;font-variant-numeric:tabular-nums}
/* ce qui se déplie : une saison s'ouvre, la porte de sa petite arche s'efface, la lumière y entre. La porte entrouverte est
   dessinée à plat (une porte vue de biais : resserrée, inclinée) : au repos, rien n'a son propre calque */
.sai-arche{position:relative}
.sai-battant{position:absolute;inset:6% 6% 0;border-radius:999px 999px 0 0;background:linear-gradient(90deg,rgba(34,16,29,.82),rgba(67,32,59,.58));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sai-v) 35%,transparent);transform-origin:0 50%;transform:scaleX(.53) skewY(-7deg);transition:transform .32s var(--ease),opacity .32s}
.sai>summary:hover .sai-battant{transform:scaleX(.34) skewY(-9deg);transition-duration:.18s}
.sai[open] .sai-battant{transform:scaleX(.03) skewY(-10deg);opacity:0}
.sai[open] .sai-arche{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-v) 30%,transparent),0 0 30px -4px var(--acc-v),inset 0 -40px 50px -30px color-mix(in srgb,var(--acc-v) 70%,transparent)}
/* une ligne vers laquelle la frise mène : elle s'allume un instant */
.dl.est-vise,.sl.est-vise,.pr.est-vise .pr-a{animation:vise 1.3s var(--ease)}
@keyframes vise{0%,30%{background:color-mix(in srgb,var(--acc) 20%,transparent)}}
.dl.est-allume,.sl.est-allume{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent 85%)}
.univ .dl.est-allume{background:linear-gradient(90deg,color-mix(in srgb,var(--u-vif) 18%,transparent),transparent 85%)}
.sai.est-allume>summary{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.mc-lieu.est-allume .mc-halo{transform:scale(1.85)}
.mc-lieu.est-allume .mc-anneau{opacity:1}
/* ce qui vit : « EN TOURNÉE » respire, comme une lumière derrière une porte */
.respire::before{content:"";display:inline-block;width:7px;height:10px;margin-right:9px;border-radius:999px 999px 1px 1px;background:currentColor;box-shadow:0 0 8px 1px currentColor;vertical-align:0;animation:respire 2.6s ease-in-out infinite}
/* « EN TOURNÉE » respire : son opacité seule (la carte graphique s'en charge ; rien n'est repeint) */
@keyframes respire{0%,100%{opacity:1}50%{opacity:.35}}
/* le dossier PDF prêt : sa petite porte s'ouvre en grand, la lumière en sort, puis elle se referme */
.dos-bt.dos-pret .mp-b{animation:mp-pret 1.4s var(--ease)}
.dos-bt.dos-pret .mini-porte{animation:mp-lueur 1.4s var(--ease)}
@keyframes mp-pret{0%{transform:rotateY(18deg)}25%,70%{transform:rotateY(100deg)}100%{transform:rotateY(18deg)}}
@keyframes mp-lueur{25%,70%{box-shadow:0 0 14px 3px color-mix(in srgb,currentColor 55%,transparent);background:color-mix(in srgb,currentColor 30%,transparent)}}

/* ———— les frises (FRISE) : la rampe du calendrier ; chaque date est une petite porte en arche, à la couleur de son spectacle ;
   « aujourd'hui », un trait de lumière posé sur l'axe ———— */
.rampe{position:relative;background:var(--aub);color:#fff;padding:clamp(18px,2.4vw,30px) 0 clamp(14px,2vw,24px);border-top:1px solid var(--line-dark);overflow-x:clip}
.rampe-frise{min-height:118px}
#v-frise{min-height:146px}   /* la frise de la saison arrive après la première image : sa place (quatre couloirs) est gardée */
.frise[data-frise]{--fr-fond:var(--aub);--fr-encre:#fff;--fr-trait:rgba(255,236,245,.3);--fr-accent:var(--sai-v);--fr-police:var(--sans);--fr-passe:.4;
  --fr-bulle-fond:var(--paper);--fr-bulle-encre:var(--ink);--fr-point:11px;--fr-couloir:19px;--fr-haut:30px;--fr-taille:12px;--fr-courbe:var(--ease)}
.frise[data-frise] .frise-mois-nom{font:400 .94rem/1.1 var(--serif);font-variation-settings:"opsz" 30,"SOFT" 100}
.frise[data-frise] .frise-an{font:600 .68rem/1.3 var(--sans);letter-spacing:.08em;opacity:.72}
.frise[data-frise] .frise-point>.frise-repere::before{width:9px;height:12px;border-radius:999px 999px 1.5px 1.5px;translate:0 -4px;transform-origin:50% 100%;
  box-shadow:0 0 0 2px var(--fr-fond),0 0 12px 1px color-mix(in srgb,var(--fr-c,#fff) 55%,transparent)}
.frise[data-frise] .frise-point.est-scolaire:not(.est-duree)>.frise-repere::before{rotate:none;width:9px;height:12px;border-radius:999px 999px 1.5px 1.5px;background:var(--fr-fond);box-shadow:inset 0 0 0 2px var(--fr-c,#fff),0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-point.est-duree>.frise-repere::before{height:7px;border-radius:999px 999px 2px 2px;translate:none;box-shadow:0 0 10px 0 color-mix(in srgb,var(--fr-c,#fff) 50%,transparent)}
.frise[data-frise] .frise-point.est-passe>.frise-repere::before{box-shadow:0 0 0 2px var(--fr-fond)}
/* la prochaine date : sa porte est éclairée */
.frise[data-frise] :is(.frise-point.est-passe+.frise-point:not(.est-passe),.frise-point:first-child:not(.est-passe))>.frise-repere::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:20px;margin:-14px 0 0 -8px;border-radius:999px 999px 2px 2px;border:1px solid var(--fr-c,#fff);opacity:0;animation:prochaine 2.8s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes prochaine{0%{opacity:.7;scale:.7}70%,100%{opacity:0;scale:1.5}}
.frise[data-frise] .frise-aujourdhui::before{width:2px;left:-1px;opacity:.95;background:linear-gradient(to top,var(--fr-accent),color-mix(in srgb,var(--fr-accent) 0%,transparent))}
.frise[data-frise] .frise-aujourdhui::after{left:-5px;bottom:-5px;width:10px;height:10px;box-shadow:0 0 12px 3px color-mix(in srgb,var(--fr-accent) 60%,transparent)}
.frise[data-frise] .frise-aujourdhui-nom{font:700 .62rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.frise[data-frise] .frise-bulle{border-radius:16px 16px 6px 6px;box-shadow:0 18px 40px -16px rgba(10,3,8,.6);font:400 .86rem/1.4 var(--sans)}
.frise[data-frise] .frise-bulle b{font:400 1.08rem/1.2 var(--serif);font-variation-settings:"opsz" 30,"SOFT" 100}
.frise[data-frise] .frise-grappe>span{width:24px;height:26px;margin:-15px 0 0 -12px;border-radius:999px 999px 3px 3px;background:radial-gradient(closest-side,var(--fr-fond) 62%,transparent 66%),conic-gradient(var(--fr-g,currentColor))}
.frise[data-frise] .frise-grappe-n{font:700 10px/1 var(--sans);padding-top:3px}
.frise[data-frise] .frise-repere:focus-visible{outline-color:var(--fr-accent)}
/* les saisons et leur densité : une arche par saison, plus ou moins haute */
.ag-frise{margin:0 0 18px;padding:18px clamp(8px,1.6vw,20px) 6px;border-radius:30px 30px 12px 12px;background:radial-gradient(70% 90% at 50% 100%,#3a1631,var(--aub) 80%);color:#fff;min-height:132px}
.frise-saisons{--fr-bande-h:46px;--fr-haut:22px;--fr-pied:32px}
.frise-saisons .frise-bande-barre{margin:0 3px;border-radius:999px 999px 2px 2px/22px 22px 2px 2px;background:linear-gradient(180deg,var(--sai-v),color-mix(in srgb,var(--sai-v) 45%,var(--sai)) 80%);opacity:.9}
.frise-saisons .frise-bande.est-passe .frise-bande-barre{opacity:.62}
.frise-saisons .frise-bande:is(:hover,.est-allume) .frise-bande-barre{opacity:1;filter:brightness(1.15)}
.frise-saisons .frise-bande-n{font:600 .74rem var(--sans);color:#fff}
.frise-saisons .frise-bande-nom{font:500 .7rem var(--sans);color:var(--on-dark-2)}
/* la diffusion d'un spectacle, saison par saison */
.diffusion{min-height:96px;margin-top:16px;padding-top:10px;border-top:1px solid var(--u-ligne)}
.diffusion .ct-k{margin:0;color:var(--u-vif)}
.frise-diffusion{--fr-bande-h:30px;--fr-haut:14px;--fr-pied:26px;--fr-taille:10px;--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:var(--u-ligne);--fr-accent:var(--u-vif)}
.frise-diffusion .frise-bande-barre{margin:0 1.5px;border-radius:999px 999px 1px 1px/12px 12px 1px 1px;background:var(--u-aplat);opacity:.86}
.frise-diffusion .frise-bande-nom{opacity:.75;letter-spacing:-.02em}
.frise-diffusion .frise-bande:not(:first-child):not(:last-child) .frise-bande-nom{opacity:0;transition:opacity .16s}
.frise-diffusion .frise-bande:is(:hover,.est-allume,:focus-within) .frise-bande-nom{opacity:1}
.frise-diffusion .frise-aujourdhui-nom{display:none}
.frise-compagnie{--fr-fond:var(--aub);--fr-encre:#fff;--fr-trait:var(--line-dark);--fr-accent:var(--sai-v);--fr-bande-h:44px;--fr-taille:11px}
.frise-compagnie .frise-bande-barre{background:linear-gradient(180deg,#e8bc5c,#8a6410)}
.p-diff{min-height:118px;margin-top:22px}
/* dans l'univers d'un spectacle, et sur l'ivoire */
.univ .frise[data-frise]{--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-texte) 30%,transparent);--fr-accent:var(--u-vif);--fr-bulle-fond:var(--u-texte);--fr-bulle-encre:var(--u-fond)}
.u-frise{min-height:118px;margin:0 0 clamp(24px,3vw,40px)}
.u-frise .frise-mois-nom{font-family:var(--sans);font-size:.86rem;font-weight:600}
/* la frise historique de la compagnie : les créations en étiquettes, chacune sur sa petite porte */
.histoire-frise .frise[data-frise]{--fr-point:12px;--fr-couloir:46px;--fr-haut:30px;--fr-passe:1}
.histoire-frise .frise-etiquette{font:400 1.02rem/1.2 var(--serif);font-variation-settings:"opsz" 30,"SOFT" 100;max-width:10em}
.histoire-frise .frise-repere:is(:hover,:focus-visible) .frise-etiquette{color:var(--sai-v);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.histoire-frise .frise-mois-nom{font:500 .78rem var(--sans);opacity:.7}

/* ———— l'espace pro : trois vraies portes, chacune vers son espace ———— */
.ep-hero{padding-bottom:clamp(20px,2.4vw,36px)}
.ep-s{padding:clamp(18px,2.4vw,36px) 0 clamp(64px,8vw,120px);background:var(--aub);color:#fff}
.ep-texte{max-width:52ch}
.ep-portes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.6vw,40px)}
.ep-porte{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 6px;text-align:center}
.ep-arche{position:relative;display:block;width:min(100%,clamp(170px,17vw,250px));aspect-ratio:5/7;margin-bottom:10px;perspective:1000px}
.ep-arche::before{content:"";position:absolute;inset:-9px -9px 0;border:1.5px solid var(--v);border-bottom:0;border-radius:999px 999px 0 0;opacity:.7;transition:opacity .18s}
.ep-salle,.ep-lumiere,.ep-battant{position:absolute;inset:0;border-radius:999px 999px 0 0}
.ep-salle{background:radial-gradient(90% 60% at 50% 100%,color-mix(in srgb,var(--v) 70%,#fff) 0%,color-mix(in srgb,var(--v) 46%,var(--aub)) 46%,var(--aub-2) 100%)}
.ep-lumiere{background:radial-gradient(120% 70% at 50% 100%,color-mix(in srgb,var(--v) 80%,transparent),transparent 72%);opacity:.35;transition:opacity .2s var(--ease)}
.ep-battant{background:linear-gradient(90deg,#1a0b16,var(--aub-3) 70%,#4a2442);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v) 40%,transparent),18px 0 40px rgba(10,3,8,.55);transform-origin:0 50%;transform:rotateY(8deg);transition:transform .2s var(--ease)}
.ep-battant::before{content:"";position:absolute;inset:12% 16% 8%;border:1px solid color-mix(in srgb,var(--v) 26%,transparent);border-radius:999px 999px 2px 2px}
.ep-battant::after{content:"";position:absolute;right:12%;top:56%;width:10px;height:10px;border-radius:50%;background:var(--v);box-shadow:0 0 12px 2px color-mix(in srgb,var(--v) 60%,transparent)}
.ep-porte:is(:hover,:focus-within) .ep-battant{transform:rotateY(62deg)}
.ep-porte:is(:hover,:focus-within) .ep-lumiere{opacity:1}
.ep-porte:is(:hover,:focus-within) .ep-arche::before{opacity:1}
.ep-t{font-family:var(--serif);font-weight:400;font-size:clamp(1.45rem,1.1rem + 1vw,2.1rem);line-height:1.12;letter-spacing:-.01em;font-variation-settings:"opsz" 72,"SOFT" 100;text-wrap:balance}
.ep-a{color:#fff;text-decoration:none}
.ep-a::after{content:"";position:absolute;inset:-12px -8px 0}
.ep-a:focus-visible{outline:none}
.ep-porte:focus-within .ep-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.ep-porte:has(.ep-a:focus-visible){outline:2px solid var(--v);outline-offset:10px;border-radius:999px 999px 8px 8px}
.ep-x{color:var(--on-dark-2);font-size:var(--fs-small);line-height:1.55;max-width:34ch}
.ed-actif .ep-a::after{display:none}
@media (max-width:900px){
  .ep-portes{grid-template-columns:minmax(0,1fr);gap:16px}
  .ep-porte{display:grid;grid-template-columns:clamp(74px,18vw,110px) minmax(0,1fr);grid-template-areas:"arche t" "arche x";align-items:end;column-gap:20px;row-gap:6px;padding:16px 0;border-top:1px solid var(--line-dark);text-align:left}
  .ep-arche{grid-area:arche;width:100%;margin:0}
  .ep-arche::before{inset:-5px -5px 0}
  .ep-t{grid-area:t;align-self:end}
  .ep-x{grid-area:x;align-self:start}
}

/* ———— les saisons (règle 21) : tout l'agenda sur une page. La saison en cours sous sa marque (une porte éclairée de la couleur
   de la saison, règle 22) et sa frise : une seule ligne du temps, chaque date une petite porte à la couleur de son spectacle, la
   légende des spectacles dessous ; puis ses prochaines dates à choisir (règle 17 : chaque date tout public est une petite porte
   qui ouvre sa carte de réservation sous sa ligne), toutes ses dates et sa carte ; enfin les saisons passées, chacune derrière sa
   porte (fermée), sa petite carte en vitrail ———— */
.saisons-hero{--v:var(--sai-v);--c:var(--sai);padding-bottom:clamp(26px,3vw,46px)}
.saisons-hero .hero-porte{width:clamp(52px,6.4vw,100px)}
.s0{scroll-margin-top:var(--tete)}
.s0-rampe{padding-top:clamp(26px,3vw,42px)}
.s0-tete{display:flex;align-items:flex-end;gap:clamp(16px,2vw,26px);padding-bottom:clamp(14px,1.6vw,20px);border-bottom:1px solid var(--line-dark)}
.s0-tete .arche{--v:var(--sai-v);width:clamp(46px,4.4vw,64px)}
.s0-tete .arche-battant{transform:rotateY(58deg)}
.s0-tete .arche-lumiere{opacity:1}
.s0-k{font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sai-v)}
.s0-t{margin-top:4px;font-family:var(--serif);font-weight:360;font-size:clamp(2.2rem,1.4rem + 2.6vw,3.6rem);line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100;color:#fff}
.fs{margin-top:clamp(16px,1.8vw,24px)}
.fs-f{min-height:146px}
.fs-leg{display:flex;flex-wrap:wrap;gap:4px 24px;margin:2px 0 0;padding:12px 0 0;border-top:1px solid var(--line-dark);list-style:none}
.fs-l{display:inline-flex;align-items:center;gap:9px;min-height:32px;color:#fff;font-family:var(--serif);font-size:1.05rem;line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 100;transition:opacity .16s var(--ease)}
.fs-l i{flex:none;width:10px;height:14px;border-radius:999px 999px 2px 2px;background:var(--c);box-shadow:0 0 10px 1px color-mix(in srgb,var(--c) 55%,transparent)}
.fs-l b{font-family:var(--sans);font-weight:600;font-size:.8rem;color:var(--on-dark-2);font-variant-numeric:tabular-nums}
.fs-l.est-vide{opacity:.45}
.fs-l.fs-sc i{background:var(--aub);box-shadow:inset 0 0 0 2px var(--on-dark-2)}
.fs-l.fs-sc span{color:var(--on-dark-2)}
.frise.est-filtre .frise-point:not(.est-sp){opacity:.16}
/* la liste : les prochaines dates, puis toutes les dates de la saison (les jouées en retrait, « aujourd'hui » d'un trait de lumière) */
.ag-h{display:flex;align-items:baseline;gap:12px;margin:clamp(44px,5vw,64px) 0 clamp(10px,1.2vw,16px);font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,1.2rem + 1.2vw,2.2rem);line-height:1.1;font-variation-settings:"opsz" 72,"SOFT" 100}
.ag-h:first-child{margin-top:0}
.ag-h::before{content:"";flex:none;width:11px;height:16px;border-radius:999px 999px 2px 2px;background:var(--acc);transform:translateY(-.06em)}
.dl.est-passe .dl-jour,.dl.est-passe .dl-quoi a,.dl.est-passe .dl-quoi span,.dl.est-passe .dl-ou{color:var(--muted)}
.auj-l{display:flex;align-items:center;gap:12px;margin:18px 0 6px;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.auj-l::after{content:"";flex:1;height:2px;background:var(--acc);box-shadow:0 0 12px 1px color-mix(in srgb,var(--acc) 45%,transparent)}
.dl-sc{display:inline-block;margin-left:10px;padding:0 9px;border:1px dashed currentColor;border-radius:999px 999px 6px 6px;color:var(--muted);font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:.15em}
.dl .dot-u{display:inline-block;width:9px;height:13px;margin-right:9px;border-radius:999px 999px 1px 1px;background:var(--c);vertical-align:-.05em}
/* une date à choisir (règle 17) : une petite porte, l'horaire écrit dessus ; choisie, elle prend l'aplat de son spectacle */
.dl.rs-li{align-items:start}
.rs-date--ligne{position:relative;display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:0;padding:12px 14px 12px;border:1.5px solid var(--line-2);border-radius:70px 70px 8px 8px / 30px 30px 8px 8px;background:var(--paper);color:var(--ink);text-align:left;transition:border-color .16s var(--ease),background .16s var(--ease),color .16s var(--ease)}
.rs-date--ligne:hover{border-color:var(--ink)}
.rs-date--ligne:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.rs-date--ligne .rs-q{display:block}
.rs-date--ligne .rs-s{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rs-date--ligne .rs-n{display:block;margin-top:2px;font-family:var(--serif);font-weight:400;font-size:1.55rem;line-height:1.05;font-variation-settings:"opsz" 72,"SOFT" 100}
.rs-date--ligne .rs-m{font-size:var(--fs-small);font-weight:600}
.rs-date--ligne .rs-h{display:block;margin-top:8px;padding-top:6px;border-top:1px solid var(--line-2);font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.rs-date--ligne .rs-h--sans{font-weight:500;color:var(--muted)}
.rs-date--ligne .rs-o{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rs-date--ligne::after{content:"";position:absolute;right:12px;top:16px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;opacity:.55;transform:rotate(45deg);transition:transform .2s var(--ease)}
.rs-date--ligne[aria-pressed="true"]{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur-aplat)}
.rs-date--ligne[aria-pressed="true"] :is(.rs-s,.rs-h--sans){color:inherit}
.rs-date--ligne[aria-pressed="true"] .rs-h{border-top-color:currentColor}
.rs-date--ligne[aria-pressed="true"]::after{transform:rotate(225deg);top:20px;opacity:.9}
.dl.rs-li:has(.rs-date[aria-pressed="true"]){background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 9%,transparent),transparent 85%)}
.rs-ici{grid-column:1/-1;margin-top:14px;transform-origin:50% 0}
@media (max-width:640px){.rs-date--ligne{max-width:15rem}}
/* ———— réserver une date (règle 17) : sur la page d'un spectacle, la bande de ses prochaines dates, chacune une porte en arche (le
   jour en grand, l'horaire, la commune) ; la carte de la date choisie s'ouvre dessous comme une porte (la signature de la
   maquette : un vantail pivote sur son gond, la lumière passe par l'embrasure) ———— */
.rs-zone{margin-top:clamp(20px,2.4vw,30px)}
.rs-k-bande{margin:0 0 12px;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.rs-bande{gap:10px;padding:4px 2px 16px;scroll-padding-inline:2px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--u-texte) 35%,transparent) transparent}
.rs-bande .rs-date{position:relative;align-items:center;width:150px;min-height:178px;padding:32px 12px 14px;border:1.5px solid color-mix(in srgb,var(--u-texte) 28%,transparent);border-radius:999px 999px 10px 10px / 86px 86px 10px 10px;background:color-mix(in srgb,var(--u-fond2) 72%,transparent);color:var(--u-texte);text-align:center;transition:border-color .16s var(--ease),background .16s var(--ease),color .16s var(--ease)}
.rs-bande .rs-q{display:flex;flex-direction:column;align-items:center}
.rs-bande .rs-s{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--u-texte2)}
.rs-bande .rs-n{display:block;margin-top:2px;font-family:var(--serif);font-weight:400;font-size:2.35rem;line-height:1;font-variation-settings:"opsz" 144,"SOFT" 100;white-space:nowrap}
.rs-bande .rs-m{font-size:.9rem;font-weight:600}
.rs-bande .rs-h{display:block;margin-top:10px;padding-top:8px;border-top:1px solid currentColor;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.rs-bande .rs-h--sans{font-size:.8rem;font-weight:500;color:var(--u-texte2)}
.rs-bande .rs-o{display:block;max-width:100%;margin-top:4px;overflow:hidden;font-size:.82rem;color:var(--u-texte2);white-space:nowrap;text-overflow:ellipsis}
.rs-bande .rs-date:hover{border-color:var(--u-titre)}
.rs-bande .rs-date:focus-visible{outline:2px solid var(--u-titre);outline-offset:3px}
.rs-bande .rs-date[aria-pressed="true"]{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur-aplat)}
.rs-bande .rs-date[aria-pressed="true"] :is(.rs-s,.rs-o,.rs-h--sans){color:inherit}
.rs-bande .rs-date[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;margin-left:-7px;background:var(--u-aplat);transform:rotate(45deg)}
.rs-corps{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,3vw,48px);align-items:start;margin-top:12px}
/* la carte d'une date : une porte dans l'univers du spectacle (son fond, sa police de titre, sa photo en fond discret) */
.rs-carte{--rs-bg:var(--u-fond2);position:relative;isolation:isolate;overflow:hidden;min-height:260px;border-radius:150px 150px 16px 16px / 60px 60px 16px 16px;background:var(--rs-bg);color:var(--u-texte);box-shadow:0 0 0 1px var(--u-ligne),0 26px 60px -32px var(--u-lueur);perspective:1400px}
.rs-photo{inset:0 0 0 auto;width:52%;height:100%;opacity:.3;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%)}
.rs-c{position:relative;display:flex;flex-direction:column;align-items:stretch;max-width:34rem;padding:clamp(34px,3.4vw,46px) clamp(22px,2.4vw,34px) clamp(22px,2.4vw,30px)}
.rs-sp{margin:0;font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(1.6rem,1.2rem + 1.2vw,2.3rem);line-height:1.05;color:var(--u-titre);overflow-wrap:break-word}
.rs-sp a{color:inherit;text-decoration:none}
.rs-sp a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em}
.rs-quand{margin:12px 0 0;font-family:var(--serif);font-size:1.35rem;line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 100}
.rs-etat{margin-left:8px;font-family:var(--sans);font-style:normal;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--u-vif)}
.rs-ou{margin:4px 0 0;font-size:var(--fs-small);line-height:1.45;color:var(--u-texte2)}
.rs-lieu{color:var(--u-texte);font-weight:600}
.rs-det{margin:8px 0 0;padding:0;list-style:none;font-size:var(--fs-small);line-height:1.45;color:var(--u-texte2)}
.rs-seances{margin:18px 0 0}
.rs-k{margin:0 0 8px;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.rs-seances--sans{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rs-seances--sans .rs-k{margin:0}
.rs-sans{font-weight:600}
.rs-liste{gap:8px}
.rs-seance{display:inline-flex;align-items:baseline;gap:8px;min-height:46px;padding:9px 16px 8px;border:1.5px solid color-mix(in srgb,var(--u-texte) 35%,transparent);border-radius:999px 999px 10px 10px;color:var(--u-texte);text-decoration:none}
a.rs-seance:hover{border-color:var(--u-titre)}
a.rs-seance:focus-visible{outline:2px solid var(--u-titre);outline-offset:2px}
.rs-sh{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.rs-sh--sans{font-family:var(--sans);font-size:.95rem;font-weight:600}
.rs-sj{font-size:.85rem;color:var(--u-texte2)}
.rs-seance.est-scolaire{color:var(--u-texte2)}
.rs-scol{padding:1px 8px;border:1px dashed currentColor;border-radius:999px;font-style:normal;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.rs-action{margin:22px 0 0}
.rs-reserver,.univ .rs-reserver{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:66px;padding:12px 20px 12px 28px;border-radius:999px;background:var(--u-aplat);color:var(--u-sur-aplat);text-decoration:none;box-shadow:0 18px 40px -22px var(--u-lueur);transition:transform .16s var(--ease)}
.rs-reserver:hover{transform:translateY(-2px)}
.rs-reserver:focus-visible{outline:2px solid var(--u-titre);outline-offset:3px}
.rs-r1{font-family:var(--serif);font-weight:400;font-size:1.65rem;line-height:1;font-variation-settings:"opsz" 72,"SOFT" 100}
.rs-r2{margin-top:5px;font-size:.84rem;font-weight:600}
.rs-reserver .rs-sep{opacity:1}
.rs-reserver .rs-fleche{width:30px;height:30px;stroke-width:1.8;transition:transform .2s var(--ease)}
.rs-reserver:hover .rs-fleche{transform:translate(3px,-3px)}
.rs-aupres{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding-top:12px;border-top:1px solid var(--u-ligne);font-size:var(--fs-small);line-height:1.4;color:var(--u-texte2)}
.rs-aupres b{color:var(--u-texte);font-weight:600}
/* la porte qui s'ouvre (effetReserver) : un vantail à la couleur d'avant pivote sur son gond, la lumière passe par l'embrasure,
   les séances et « Réserver » se posent ; moins d'animations : un fondu bref */
.rs-vantail{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;background:var(--rs-vantail,var(--u-fond));transform-origin:0 50%;backface-visibility:hidden;box-shadow:inset -18px 0 30px -18px color-mix(in srgb,var(--u-titre) 40%,transparent)}
.rs-vantail::after{content:"";position:absolute;right:11%;top:54%;width:10px;height:10px;border-radius:50%;background:var(--u-titre);box-shadow:0 0 14px 3px color-mix(in srgb,var(--u-titre) 55%,transparent)}
.rs-jour{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--u-titre) 30%,transparent),transparent 46%);opacity:0}
.rs-porte .rs-vantail{animation:rs4-vantail .46s cubic-bezier(.32,.6,.16,1) both}
.rs-porte .rs-jour{animation:rs4-jour .62s ease-out both}
.rs-porte :is(.rs-liste > li,.rs-action){animation:rs4-pose .32s var(--ease) backwards;animation-delay:calc(170ms + var(--rs-i,0) * 40ms)}
.rs-porte .rs-liste > li:nth-child(2){--rs-i:1}
.rs-porte .rs-liste > li:nth-child(3){--rs-i:2}
.rs-porte .rs-liste > li:nth-child(n+4){--rs-i:3}
.rs-porte .rs-action{--rs-i:4}
.rs-porte.rs-ouvre{animation:rs4-ouvre .24s var(--ease)}
@keyframes rs4-vantail{from{transform:rotateY(0)}70%{opacity:1}to{transform:rotateY(-104deg);opacity:0}}
@keyframes rs4-jour{0%{opacity:0}28%{opacity:1}100%{opacity:0}}
@keyframes rs4-pose{from{opacity:0;transform:translateY(8px)}}
@keyframes rs4-ouvre{from{transform:translateY(-6px);opacity:.4}}
@media (max-width:900px){.rs-corps{grid-template-columns:minmax(0,1fr)}.rs-carte{border-radius:90px 90px 14px 14px / 40px 40px 14px 14px}}
@media (max-width:640px){.rs-bande .rs-date{width:132px;min-height:164px;padding-top:28px}.rs-bande .rs-n{font-size:2.1rem}}

/* ———— les vidéos dans la page (règle 18, LECTEUR) : l'écran sous une arche surbaissée, le bouton de lecture en petite porte ;
   la vidéo arrive derrière deux vantaux qui s'ouvrent, la page s'éteint autour d'elle ———— */
.lc{margin:0}
.lc-cadre{border-radius:150px 150px 12px 12px / 60px 60px 12px 12px;background:var(--video);box-shadow:0 0 0 1px var(--u-ligne,var(--line)),0 30px 80px -36px var(--u-lueur,rgba(0,0,0,.5))}
.lc-cadre:fullscreen{border-radius:0}
.lc-affiche{filter:brightness(.62) saturate(.92);transition:transform .5s var(--ease),filter .3s var(--ease)}
.lc-lire:hover .lc-affiche{transform:scale(1.03);filter:brightness(.52) saturate(.95)}
.lc-lire:focus-visible{outline:2px solid var(--u-titre,var(--acc));outline-offset:-4px}
.lc-icone{width:76px;height:90px;border-radius:999px 999px 10px 10px;background:var(--u-aplat,var(--sai));color:var(--u-sur-aplat,var(--sai-sur));box-shadow:0 0 0 6px color-mix(in srgb,var(--u-aplat,var(--sai)) 25%,transparent);transition:transform .2s var(--ease)}
.lc-lire:hover .lc-icone{transform:translate(-50%,-50%) scale(1.06)}
.lc-titre{left:26px;right:26px;bottom:20px;font-family:var(--serif);font-size:clamp(1.15rem,1rem + .8vw,1.6rem);line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 100;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
/* l'écran étroit (moins de 190px de haut) : la petite porte remonte et rapetisse, le titre ne la touche pas */
@media (max-width:520px){.u-video .lc-icone{top:43%;width:58px;height:68px}.u-video .lc-titre{left:18px;right:18px;bottom:14px;font-size:1.05rem}}
.lc-outils{gap:10px;margin-top:12px}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : les battants. Tout passe par une porte : on la pousse, elle s'ouvre, la lumière passe par l'embrasure ; en
     revenant, on la referme derrière soi. Une seule courbe (rapide, puis posée), jamais plus de 450 ms pour une page.
     1. Changer de page : l'en-tête reste, comme un linteau ; dessous, deux vantaux à la couleur de la page qui arrive (celle
        de l'entrée, ou le fond de l'univers du spectacle) partent dès l'image du geste, la page se pose derrière eux à la tâche
        suivante, ils s'ouvrent vers l'intérieur et la lumière passe entre eux (430 ms). Au retour, les vantaux de la page
        quittée se rabattent et s'effacent : on a refermé derrière soi. La carte d'un spectacle (une arche) devient l'arche de
        sa page, et l'arche d'une porte de l'accueil celle de sa page (son image vole de l'une à l'autre) ; d'un onglet à
        l'autre d'un spectacle, l'en-tête reste et seule la porte allumée glisse. Un geste pendant ce temps l'emporte (la page
        demandée en dernier se pose seule) ; les vantaux ne captent jamais le pointeur.
     2. Ouvrir une saison : la porte de sa petite arche s'efface, la lumière y entre, ses dates arrivent en cascade ; le menu
        aussi se déplie ligne à ligne.
     3. Filtrer, chercher : les dates gardées glissent à leur nouvelle place, celles qui reviennent paraissent (MOUVEMENT.flip) ;
        les repères de la frise glissent, les saisons de la frise des saisons changent de hauteur.
     4. Survol et focus : 160 à 200 ms ; une porte s'entrouvre et sa lumière monte, rien ne tremble.
     5. Pression : la porte cède sous la main dès le pointerdown (elle s'ouvre en grand) ; les boutons s'enfoncent d'un rien.
     6. Défilement (MOUVEMENT.reveler) : les titres montent, les cartes arrivent l'une après l'autre en pivotant sur leur gond,
        les chiffres comptent ; les bras de la carte poussent depuis Rouen.
     7. Ce qui vit : « aujourd'hui » posé sur chaque frise comme un trait de lumière, la porte de la prochaine date éclairée,
        « EN TOURNÉE » qui respire.
     8. Réserver une date (règle 17) : chaque date est une petite porte en arche ; choisie, elle prend l'aplat de son spectacle et
        sa carte s'ouvre comme une porte : un vantail à la couleur d'avant pivote sur son gond, la lumière passe par l'embrasure,
        les séances et « Réserver » se posent l'une après l'autre (moins d'animations : un fondu bref).
     9. Les vidéos (règle 18) : l'écran sous une arche ; au geste, deux vantaux s'ouvrent sur la vidéo ; la page s'éteint autour
        d'elle et se rallume d'un fondu.
     10. Le jour et la nuit (règle 19) : la bascule s'ouvre en cercle depuis la petite porte du bouton (THEME).
     11. La troupe (règle 20) : les portes des loges, suspendues au linteau, s'entrouvrent à leur arrivée dans l'écran (animations
        liées au défilement) ; survoler quelqu'un ouvre les portes de ses catégories et relie ses places.
     Les frises (FRISE) sont la rampe de chaque calendrier : chaque date y est une petite porte à la couleur de son spectacle
     (la saison, les saisons, une saison passée, la tournée d'un spectacle, son bilan, les dates scolaires, la diffusion saison
     par saison, l'histoire de la compagnie) ; survoler un repère allume sa ligne et sa commune, et inversement ; un clic y mène.
     La pieuvre : aucun moment ; la porte est le seul geste de la maquette (le dossier PDF prêt : sa petite porte s'ouvre).
     Moins d'animations demandé (ou ?anim=0) : tout est posé, rien ne bouge. */
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const chemin = href => String(href || '').replace(/^#\/?/, '');
  const root = document.documentElement, main = $('#main'), header = $('.site-header');
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  // réserver une date (RESERVER, règle 17), les vidéos dans la page (LECTEUR, règle 18), le jour et la nuit (THEME, règle 19),
  // la troupe (TROUPE, règle 20)
  const RS = typeof RESERVER !== 'undefined' ? RESERVER : null, LC = typeof LECTEUR !== 'undefined' ? LECTEUR : null;
  const TH = typeof THEME !== 'undefined' ? THEME : null, TR = typeof TROUPE !== 'undefined' ? TROUPE : null;
  const mouvement = () => CARTE.mouvement() && (!MV || MV.permis());
  // (moins d'animations, ou ?anim=0 : les animations liées au défilement de la troupe s'arrêtent aussi, html.m4-fixe)
  const fixeHtml = () => root.classList.toggle('m4-fixe', !mouvement());
  fixeHtml();
  if (window.matchMedia) { const mq = matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', fixeHtml); }
  const CLE_MEMO = 'crescite-m04-entree';

  /* ---------- les couleurs ---------- */
  const rgb = h => { const x = String(h || '#000000').replace('#', ''), f = x.length === 3 ? x.split('').map(c => c + c).join('') : x.slice(0, 6); return [0, 2, 4].map(i => parseInt(f.slice(i, i + 2), 16) || 0); };
  const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
  const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const melange = (a, b, t) => '#' + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  const hex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v.trim()) ? v.trim().toLowerCase() : null;
  const eclaircir = (h, fond, cible) => { let c = h; for (let k = 0; k < 40 && contraste(c, fond) < cible; k++) c = melange(c, '#ffffff', .08); return c; };
  const assombrir = (h, fond, cible) => { let c = h; for (let k = 0; k < 40 && contraste(c, fond) < cible; k++) c = melange(c, '#000000', .08); return c; };
  // le texte le mieux lu sur une couleur, parmi le blanc, le fond et l'encre ; sous 4,5:1, le blanc ou le noir pur
  const surDe = (x, ...cs) => { const m = ['#ffffff', ...cs].reduce((a, b) => (contraste(b, x) > contraste(a, x) ? b : a));
    return contraste(m, x) >= 4.5 ? m : contraste('#ffffff', x) >= contraste('#000000', x) ? '#ffffff' : '#000000'; };
  // les fonds de la maquette (ceux de :root et de html[data-theme="nuit"]), pour garder chaque couleur lisible là où elle se pose
  const IVOIRE = '#faf6f3', PRUNE = '#22101d', PRUNE2 = '#2e1628', PRUNE3 = '#43203b', NUIT = '#1b0e18', NUIT_PAPIER = '#261422', NUIT_PRUNE = '#12070f';

  /* ---------- la couleur de la saison (règle 22) : D.site.couleurSaison, la couleur de la dernière création (le bleu, jusqu'à la
     création de Cassandres). « couleur » sur l'ivoire (et en aplat sous un texte blanc : la porte courante du menu), « vive » sur
     le prune et sur la nuit, chacune gardée lisible (4,5:1) là où elle se pose ; relue à chaque changement de D ---------- */
  function couleurSaison() {
    const c = ((D.site || {}).couleurSaison) || {}, j = hex(c.couleur) || hex(c.vive), v = hex(c.vive) || j;
    if (!j) return null;
    const jour = assombrir(j, IVOIRE, 4.5), nuit = eclaircir(v, NUIT_PAPIER, 4.5);
    return { jour, vive: eclaircir(v, PRUNE3, 4.5), nuit, surJour: surDe(jour, IVOIRE), surNuit: surDe(nuit, NUIT_PRUNE) };
  }
  const feuilleCouleurs = document.head.appendChild(document.createElement('style'));
  function couleurs() {
    const sa = couleurSaison();
    const css = sa ? `:root{--sai:${sa.jour};--sai-v:${sa.vive};--sai-sur:${sa.surJour}}html[data-theme="nuit"]{--sai:${sa.nuit};--sai-sur:${sa.surNuit}}` : '';
    if (feuilleCouleurs.textContent !== css) feuilleCouleurs.textContent = css;
  }

  // l'univers d'un spectacle, avec des couleurs de texte qui gardent un contraste AA sur son fond ; un univers clair invente aussi
  // sa nuit (règle 19), dans ses propres couleurs de D : son texte, assombri dans la nuit, devient son fond, son fond son texte
  const NUIT_U = '#120a10';
  function calculUnivers(s) {
    const u = s.univers || {}, c = Object.assign({}, s.palette || {}, u.couleurs || {}), p = u.polices || {};
    const clair = !!(u.clair ?? s.clair);
    const lisible = x => x && contraste(x, c.fond) >= 4.5 && contraste(x, c.fond2) >= 4.5;
    const titre = [c.scene, c.accent, c.accent2].find(x => x && contraste(x, c.fond) >= 3) || c.texte;
    const vif = (clair ? [c.accent2, c.accent] : [c.accent2, c.scene, c.accent]).find(lisible) || c.texte2;

  // la carte de tous les lieux : un trait par commune, tous dans un seul tracé ; un point par commune (survolé : il grandit)

  // les dégradés des bras sur le prune, un par entrée et celui de la saison (refaits si D change ; la saison suit ses variables CSS)

    if (io && !partiel) io.disconnect();

      mc.dataset.prete = '1';
      if (immediat || !io || !mouvement()) return toutAllumer(mc);

  }
  function pousse(mc) {
    if (mc.classList.contains('leger')) { mc.classList.remove('attente'); mc.classList.add('parait'); return; }
    const clip = $('.mc-clip', mc), pts = $$('.mc-lieu, .mc-eteint', mc).map(p => ({ p, d: +p.dataset.d, ok: false }));
    // (moins d'une seconde : un cercle de découpe qui grandit se repeint à chaque image)

  // les communes d'une carte (.carte-lieu[data-l]) : survol, focus, clic, Entrée, par délégation (comme CARTE.lier, en un seul jeu)
  function lierCarte(racine, { survol = () => {}, choix = () => {} } = {}) {
    const lieu = e => { const g = e.target.closest && e.target.closest('.carte-lieu[data-l]'); return g && racine.contains(g) ? g : null; };
    let dessus = null;

    racine.addEventListener('focusout', e => { if (lieu(e)) survol(null); });

  /* ---------- l'accueil (règle 21) : les portes des spectacles de la saison (ceux qui tournent, celui qui se crée), puis la saison

  // les photos derrière les portes des deux pages de l'espace pro (décoratives) et leur cadrage

  /* ---------- les dates de D.saisons : leurs jours lus dans la ligne quand la base ne les donne pas ---------- */
  const MOIS_ALT = 'janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre';
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();
  const MOIS_NOMS = MOIS_ALT.split('|');
  const MOIS_TOK = `${MOIS_ALT}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)
  const RE_JOUR = new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS_TOK})\\.?(?:\\s+(\\d{4}))?`, 'gi');
  const RE_MOIS_AN = new RegExp(`(${MOIS_TOK})\\.?\\s+(\\d{4})`, 'i');
  const RE_LIGNE = new RegExp(`^(.*?)\\s*((?:${MOIS_TOK})\\.?\\s+\\d{4})([\\s\\S]*)$`, 'i');
  const p2 = n => String(n).padStart(2, '0');
  const moisDeNom = x => { const t = x.toLowerCase(); return MOIS_NOMS.findIndex(n => n.startsWith(t) || t.startsWith(n.slice(0, 4))) + 1; };
  // la date de fin d'une ligne, « 2020-03-04 » : iso/fin quand la base les a, sinon lue dans la ligne (le dernier jour cité)
  function cleDate(d, saison) {
    const fin = d.fin || d.iso; if (fin) return fin;
    const tete = String(d.ligne || '').split(/—|\s:\s/)[0], a0 = +saison.slice(0, 4);
    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];
    if (dern) { const mm = moisDeNom(dern[2]); return `${dern[3] ? +dern[3] : mm >= 9 ? a0 : a0 + 1}-${p2(mm)}-${p2(+dern[1])}`; }
    const ma = tete.match(RE_MOIS_AN);
    return ma ? `${ma[2]}-${p2(moisDeNom(ma[1]))}-31` : null;
  }
  // les jours d'une ligne : ceux de la base (iso, fin), sinon le premier et le dernier jour cités ; « novembre 2026 — … » : le mois
  // entier ; null pour une année seule
  function bornesLigne(d, k) {
    if (d.iso) return { jour: d.iso, fin: d.fin || d.iso, precision: d.precision || 'jour' };
    const tete = String(d.ligne || '').split(/—|\s:\s/)[0], a0 = +String(k).slice(0, 4);
    const ms = [...tete.matchAll(RE_JOUR)];
    if (ms.length) { const iso = m => { const mm = moisDeNom(m[2]); return `${m[3] ? +m[3] : mm >= 9 ? a0 : a0 + 1}-${p2(mm)}-${p2(+m[1])}`; };
      return { jour: iso(ms[0]), fin: iso(ms[ms.length - 1]), precision: 'jour' }; }
    const ma = tete.match(RE_MOIS_AN);
    if (!ma) return null;
    const mm = moisDeNom(ma[1]), y = +ma[2];
    return { jour: `${y}-${p2(mm)}-01`, fin: `${y}-${p2(mm)}-${p2(new Date(Date.UTC(y, mm, 0)).getUTCDate())}`, precision: 'mois' };
  }
  // « 24 janvier 2020 à 20h — Théâtre en Seine, Duclair (76) » → { jour: « 24 », heure: « à 20h », lieu: « Théâtre en Seine, Duclair (76) » }
  function decoupeLigne(ligne) {
    const t = String(ligne || ''), m = t.match(RE_LIGNE);
    if (!m) return { jour: '', heure: '', lieu: t.trim(), mois: '' };
    const reste = m[3], k = reste.indexOf('—'), c = reste.search(/\s:\s/);
    const [h, l] = k >= 0 ? [reste.slice(0, k), reste.slice(k + 1)] : c >= 0 ? [reste.slice(0, c), reste.slice(c + 3)] : ['', reste];
    const net = x => x.replace(/^[\s:,–-]+|[\s:]+$/g, '');
    return { jour: m[1] || m[2], heure: net(h), lieu: net(l), mois: m[1] ? m[2] : '' };
  }
  const titreMois = m => m ? `${MOIS_NOMS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '';
  const texteLigne = (titre, d) => norm(`${titre} ${d.ligne} ${(d.details || []).map(y => y.texte).join(' ')} ${d.l != null && CARTE.lieux[d.l] ? CARTE.nom(CARTE.lieux[d.l]) : ''}`);
  // toutes les saisons passées (avant la saison en cours) : [{k, titre, rows: [{d, g, k, i, suite, cle, txt}], titres, lieux}], la plus
  // récente d'abord ; la saison en cours n'y est pas (toutes ses dates sont plus haut, dans « Toutes les dates »)
  function agendaPasse() {
    const out = [];
    X.S.saisons.forEach(x => {
      const SA = D.saisons[x.saison]; if (!SA || x.saison >= D.saison) return;
      const rows = []; let i = 0;
      (SA.spectacles || []).forEach(g => {
        let prev = null;
        (g.dates || []).forEach(d => {
          let k = cleDate(d, x.saison); const suite = !k; if (suite) k = prev; else prev = k;
          const sp = g.slug && X.bySlug[g.slug], titre = sp ? sp.titre : g.titre;
          const n = i++;
          rows.push({ d, g, k: k || '', i: n, fid: cleLigne(d, x.saison, n), suite, titre, cle: g.slug || `titre:${g.titre}`, txt: texteLigne(titre, d) });
        });
      });
      const passees = rows.sort((a, b) => a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i);
      if (!passees.length) return;
      out.push({ k: x.saison, titre: SA.titre, rows: passees, titres: [...new Set(passees.map(r => r.titre))], lieux: CARTE.saison(x.saison) });
    });
    return out;
  }
  // la saison en cours, ligne par ligne : toutes ses dates publiées (D.saisons), passées et à venir, dans l'ordre du temps (celles
  // qu'on ne sait pas dater à la fin). La clé d'une date (data-frise-id) est celle de son repère sur la frise, et la même dans les
  // prochaines dates (D.dates, cleProchaine) : une date choisie ici se retrouve là
  const cleSaison = (slug, titre, d, k, i) => cleBase(d) || (d.iso ? `p|${slug || titre}|${d.iso}|${d.l}` : `l|${k}|${i}`);
  function calculerSaison(k) {
    const SA = (D.saisons || {})[k]; if (!SA) return [];
    const out = []; let i = 0;
    (SA.spectacles || []).forEach(g => (g.dates || []).forEach(d => {
      const n = i++, b = bornesLigne(d, k), sp = g.slug && X.bySlug[g.slug], titre = sp ? sp.titre : g.titre, id = cleSaison(g.slug, g.titre, d, k, n);
      out.push({ d, g, k: b ? b.fin : '', i: n, fid: id, suite: false, slug: g.slug || null, titre, cle: g.slug || `titre:${g.titre}`,
        debut: b ? b.jour : '', fin: b ? b.fin : '', precision: b ? b.precision : null, passe: !!(b && b.fin < D.aujourdhui), txt: texteLigne(titre, d) });
    }));
    const t = r => r.debut || '9';
    return out.sort((a, b) => (t(a) < t(b) ? -1 : t(a) > t(b) ? 1 : a.i - b.i));
  }
  // les spectacles qui ont des dates, à venir ou passées : [{cle, titre, slug}], les spectacles de la compagnie d'abord
  function spectaclesAgenda(pub, passe) {
    const m = new Map();
    X.SHOWS.forEach(s => { if (pub.some(d => d.slug === s.slug) || passe.some(p => p.rows.some(r => r.cle === s.slug))) m.set(s.slug, { cle: s.slug, titre: s.titre, slug: s.slug }); });
    passe.forEach(p => p.rows.forEach(r => { if (!m.has(r.cle)) m.set(r.cle, { cle: r.cle, titre: r.titre, slug: null }); }));
    return [...m.values()];
  }
  // la couleur d'un spectacle sur l'ivoire (une marque : 3:1), et sur la nuit
  const couleurIvoire = slug => { const s = X.bySlug[slug], c = s && (hex(s.couleur) || hex(((s.univers || {}).couleurs || {}).scene)); return c ? assombrir(c, IVOIRE, 3) : 'var(--muted)'; };
  const couleurNuit = slug => { const s = X.bySlug[slug], c = s && (hex(s.couleur) || hex(((s.univers || {}).couleurs || {}).scene)); return c ? eclaircir(c, NUIT, 3) : 'var(--muted)'; };

  const chevron = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>';
  const doubleBas = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l6 5 6-5M6 13l6 5 6-5"/></svg>';
  const doubleHaut = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 11l6-5 6 5M6 18l6-5 6 5"/></svg>';
  const croixSvg = '<svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
  // une ligne de D.saisons (une saison passée, toutes les dates de la saison en cours, le bilan d'un spectacle) : le jour et l'heure,
  // le lieu (lien s'il existe), le spectacle (vers sa page ; sans titre sur la page du spectacle même), « Scolaire », l'état, les
  // précisions ; passe : une date déjà jouée (en retrait) ; cache : écartée par le filtre
  function ligneAgenda(r, { passe = false, cache = false, titre = true, mois = false } = {}) {
    const { d, g } = r, sp = g.slug && X.bySlug[g.slug], p = decoupeLigne(d.ligne);
    const quoi = r.suite || !titre ? (d.scolaire ? `<p class="dl-quoi"><span class="ag-etiq">${esc(X.L.scolaire)}</span></p>` : '')
      : `<p class="dl-quoi"><i class="dot-u" aria-hidden="true" style="--c:${esc(couleurIvoire(g.slug))};--cn:${esc(couleurNuit(g.slug))}"></i>${sp ? `<a href="${esc(lienSp(sp))}">${esc(r.titre)}</a>` : `<span>${esc(r.titre)}</span>`}${d.scolaire ? `<span class="ag-etiq">${esc(X.L.scolaire)}</span>` : ''}</p>`;
    const lieu = p.lieu ? `<p class="dl-ou">${d.lien ? `<a href="${esc(d.lien)}">${esc(p.lieu)}<span class="ext" aria-hidden="true">↗</span></a>` : esc(p.lieu)}</p>` : '';
    return `<li class="dl${r.suite ? ' suite' : ''}${d.etat ? ' annule' : ''}${passe ? ' est-passe' : ''}"${cache ? ' hidden' : ''} data-date-id="${esc(d.id ?? '')}" data-frise-id="${esc(r.fid)}" data-mv-cle="${esc(r.fid)}" data-l="${d.l ?? ''}">
      ${r.suite ? '' : `<p class="dl-quand"><span class="dl-jour">${esc(p.jour)}</span>${mois && p.mois ? ` <span class="dl-mois">${esc(p.mois)}</span>` : ''}${p.heure ? ` <span class="dl-mois">${esc(p.heure)}</span>` : ''}</p>`}
      <div>${lieu}${quoi}${d.etat ? `<p class="sl-etat">${esc(d.etat)}</p>` : ''}${details(d.details)}</div></li>`;

  // la petite carte d'une saison, sous sa porte : un bras par commune, à la lumière de la saison
  const miniLieux = ls => {

  // une carte ajoutée après coup : ses bras poussent à l'écran, ou elle est posée d'un coup

  /* ---------- réserver une date, d'un geste (règle 17, RESERVER) : la porte qui s'ouvre ----------
     Une date tout public où l'on réserve est une petite porte (le jour, l'horaire, la commune) ; choisie, sa carte de réservation
     s'ouvre (sous sa ligne dans les saisons, sous la bande sur la page du spectacle) dans l'univers de son spectacle : un vantail à
     la couleur d'avant pivote sur son gond, la lumière passe par l'embrasure, les séances et « Réserver » se posent. Tout est
     écrit en CSS (.rs-porte) sur des éléments neufs : le geste se peint tout de suite. Moins d'animations : un fondu bref. */
  let rsAg = null, rsSp = null, rsSpEtat = { slug: null, cle: null };
  const requete = () => new URLSearchParams(String(location.hash || '').split('?')[1] || '');
  const idCarte = k => 'rs-' + String(k).replace(/[^\w-]/g, '-');
  // la commune de la date choisie, sur la carte de la même zone : son halo grandit
  function marquerCommune(el, date) {
    const z = el && el.closest('[data-zone]'), mc = z && $('.mc', z); if (!mc) return;
    $$('.mc-lieu.est-choisie', mc).forEach(g => g.classList.remove('est-choisie'));

    if (g) g.classList.add('est-choisie');
  }
  function effetReserver({ carte: el, date, premier, ouverture, fondAvant }) {
    marquerCommune(el, date);
    if (premier || !el.animate) return;
    if (!mouvement()) { const c = $('.rs-c', el); if (c) c.animate([{ opacity: .25 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' }); return; }
    const v = document.createElement('span'), j = document.createElement('span');
    v.className = 'rs-vantail'; j.className = 'rs-jour'; v.setAttribute('aria-hidden', 'true'); j.setAttribute('aria-hidden', 'true');
    if (fondAvant && !ouverture) v.style.setProperty('--rs-vantail', fondAvant);
    el.append(j, v);
    const fin = () => { v.remove(); j.remove(); };
    v.addEventListener('animationend', fin, { once: true }); setTimeout(fin, 900);
    el.classList.add('rs-porte');

  /* ---------- les vidéos, lues dans la page (règle 18, LECTEUR) ----------

  /* ---------- la troupe (règle 20, TROUPE) : les portes des loges, entre la présentation de la compagnie et ses repères ----------

  function troupeHtml() {

  // la troupe prend vie quand elle est dans la page : les liens entre les places d'une personne ; une photo publiée qui ne se

  function vivreTroupe() {
    const tr = $('.tr4', main);

  /* ---------- le routeur (règle 21) : le menu (les saisons, les spectacles, la compagnie, l'espace pro), les onglets d'un
     spectacle en tournée et leur mémoire, la page unique d'un spectacle qui ne tourne plus, les anciennes adresses ----------
     Une vue : { vue, titre (document.title), menu (la clé de l'élément du menu qu'elle marque), mode ('page', ou 'true' dans une
     page qui en dépend : un spectacle, une page de l'espace pro), entree (un onglet ou une page de l'espace pro), html } */
  const VUES_MENU = { spectacles, compagnie };
  function resoudre() {
    const { S, ENTREE, MENU, bySlug, U } = X;
    let brut = location.hash.replace(/^#\/?/, '');
    try { brut = decodeURIComponent(brut); } catch (e) { /* adresse brute */ }
    const [ch, qs] = brut.split('?'), q = new URLSearchParams(qs || ''), c = ch.replace(/\/$/, '');
    if (c === 'espace-pro' && S.espacePro) return { q, v: { vue: 'espace-pro', titre: S.espacePro.titre, menu: 'espacePro', html: espacePro } };   // une vue l'emporte sur une redirection
    const redir = S.redirections || {};
    if (redir['#/' + c]) return { aller: redir['#/' + c] };
    const p = c.split('/').filter(Boolean);
    const saisonConnue = k => !!(D.saisons && D.saisons[k] && (S.saisons || []).some(x => x.saison === k));
    if (p[0] === 'agenda' && p.length === 2) return { aller: saisonConnue(p[1]) ? `#/saisons/${p[1]}` : (MENU.saisons ? MENU.saisons.href : '#/') };   // l'ancienne page d'une saison
    if (p[0] === 'saisons' && MENU.saisons) {
      if (p.length === 1) return { q, v: { vue: 'saisons', titre: MENU.saisons.texte, menu: 'saisons', html: () => saisons() } };
      if (p.length === 2 && saisonConnue(p[1])) return { q, v: { vue: 'saisons', saison: p[1], titre: (S.saisons.find(x => x.saison === p[1]) || {}).titre, menu: 'saisons', html: () => saisons(p[1]) } };
      return { aller: MENU.saisons.href };
    }
    if (p[0] === 'espace-pro' && p.length === 2 && (p[1] === 'programmer' || p[1] === 'etablissement') && ENTREE[p[1]]) {
      const k = p[1];
      return { q, cle: k, v: { vue: k, titre: ENTREE[k].texte, menu: 'espacePro', mode: 'true', entree: k, html: k === 'programmer' ? programmer : etablissement } };
    }
    if (p[0] === 'spectacle' && bySlug[p[1]] && p.length <= 3) {
      const s = bySlug[p[1]], cle = p[2], u = U[s.slug], top = u.clair ? (s.fondSombre || '') : u.fond;
      // un spectacle qui ne tourne plus : une seule page ; ses anciens onglets y mènent (par remplacement)
      if (!aOnglets(s)) return cle ? { aller: `#/spectacle/${s.slug}` } : { q, v: { vue: 'spectacle', slug: s.slug, u, titre: s.titre, menu: 'spectacles', mode: 'true', top, html: () => spectacle(s, null) } };
      // sans onglet : l'onglet retenu, ou « voir »
      if (!cle || !ENTREE[cle]) return { aller: `#/spectacle/${s.slug}/${entreeSp(s.slug, memo() || (ENTREE.voir ? 'voir' : Object.keys(ENTREE)[0]))}` };
      if (entreeSp(s.slug, cle) !== cle) return { aller: `#/spectacle/${s.slug}/voir` };   // sans action culturelle : « voir »
      return { q, cle, v: { vue: 'spectacle', slug: s.slug, u, titre: cle === 'voir' ? s.titre : `${s.titre} - ${ENTREE[cle].court}`, entree: cle, menu: 'spectacles', mode: 'true', top, html: () => spectacle(s, cle) } };
    }
    if (c === '') return { q, v: { vue: 'accueil', titre: S.accueil, html: accueil } };
    if (c === 'contact') return { q, v: { vue: 'contact', titre: (S.contact || {}).titre || X.L.contact, html: contact } };
    const m = (S.menu || []).find(x => chemin(x.href) === c);
    if (m && VUES_MENU[m.id]) return { q, v: { vue: m.id, titre: m.id === 'compagnie' ? ((S.compagnie || {}).titre || m.texte) : m.texte, menu: m.cle || m.id, html: VUES_MENU[m.id] } };
    if (S.legal && S.legal[c] && (S.liensLegaux || []).some(x => chemin(x.href) === c)) return { q, v: { vue: 'legal', titre: S.legal[c].titre, html: () => legal(c) } };

  }
  // l'élément du menu de la vue : aria-current="page" ; « true » dans une page qui en dépend (un spectacle : « les spectacles » ;

  // ce qu'une vue refaite en place doit garder : la position, le focus, les volets ouverts
  const conteneurs = () => ({ main, header, footer: $('.site-footer') });
  function garder() {
    const a = document.activeElement, cs = conteneurs();
    let focus = null;
    const zone = a && a !== document.body ? Object.keys(cs).find(k => cs[k].contains(a)) : null;
    if (zone) {
      if (a.id) focus = { zone, id: a.id };
      else {
        const sel = a.tagName.toLowerCase() + (a.getAttribute('href') ? `[href="${CSS.escape(a.getAttribute('href'))}"]` : '') + (a.dataset.l !== undefined ? `[data-l="${CSS.escape(a.dataset.l)}"]` : '');
        focus = { zone, sel, i: $$(sel, cs[zone]).indexOf(a) };

  function restaurer(g) {
    $$('details', main).forEach((d, i) => { if (g.details[i]) d.open = true; });

  function lierZones(q, enPlace, racine = main) {
    const zones = {}, frisesZone = {};
    $$('[data-zone]', racine).forEach(z => {
      if (z.dataset.liee) return;
      z.dataset.liee = '1';
      const type = z.dataset.zone;
      // la frise de la zone répond à sa carte et à sa liste : une commune survolée allume ses repères
      const ecoute = l => { const f = frisesZone[type]; if (f) { if (l == null) f.eteindre(); else f.allumer({ l }); } };
      let ctl;
      if (type === 'accueil') ctl = lierZone(z, { naviguer: l => { if (X.MENU.saisons) location.hash = `${X.MENU.saisons.href}?l=${l}`; } });
      else if (type === 'tout') {
        const det = $('[data-detail]', z), par = new Map(retenu('tout', () => CARTE.tout()).map(x => [x.l, x]));
        ctl = lierZone(z, { detail: l => { if (det && par.has(l)) det.innerHTML = detailLieu(par.get(l)); } });
      } else if (type === 'voir') { AG.brancher(z); return; }

      const brut = enPlace ? choixZones[type] : (q.get('l') !== null ? +q.get('l') : null);

    });

    // le conteneur n'est pas encore dans la page attendent le rendu de la suite)
    const prets = plans.filter(p => document.getElementById(p.id));
    plans = plans.filter(p => !prets.includes(p));
    prets.forEach(p => {
      const c = document.getElementById(p.id), Z = p.zone ? zones[p.zone] : null; if (!c) return;
      const relier = Z ? { relier: { liste: Z.z.closest('.chap') || Z.z, carte: l => Z.ctl && Z.ctl.montrer(l) } } : {};
      const f = frise(c, Object.assign({ largeur: largeurWrap(), choix: x => allerLigne(x.id) }, p.o, relier));
      if (p.zone) frisesZone[p.zone] = f;

  let ioSommaire = null;
  // le petit sommaire des chapitres suit la lecture
  function suivreSommaire() {
    if (ioSommaire) { ioSommaire.disconnect(); ioSommaire = null; }
    const liens = $$('.sommaire a', main);
    if (!liens.length || !('IntersectionObserver' in window)) return;
    const vus = new Set(), ids = liens.map(a => a.getAttribute('href').slice(1));
    ioSommaire = new IntersectionObserver(es => {
      es.forEach(en => { if (en.isIntersecting) vus.add(en.target.id); else vus.delete(en.target.id); });
      const cur = ids.find(id => vus.has(id));
      if (cur) liens.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
    }, { rootMargin: '-30% 0px -60% 0px' });
    ids.forEach(id => { const el = document.getElementById(id); if (el) ioSommaire.observe(el); });
    liens[0].classList.add('on');
  }

  // ce qui est sous le pli : la page arrive par son premier écran ; le reste vient à la suite, une place par image (la place
  // attendue garde la hauteur d'un écran : rien de visible ne bouge) ; d'emblée quand la vue est refaite en place
  let suites = null, tourRendu = 0;
  const differer = f => { const h = typeof f === 'function' ? f : () => f; if (!suites) return h(); suites.push(h); return `<template data-suite="${suites.length - 1}"></template>`; };
  // à la tâche qui suit la prochaine image, si la vue n'a pas changé entre-temps
  const bientot = f => { const n = tourRendu; requestAnimationFrame(() => setTimeout(() => { if (n === tourRendu) f(); }, 0)); };
  function completer(tour, reste, q) {
    if (tour !== tourRendu) return;
    const t = $('template[data-suite]', main);
    if (!t) { $$('[data-suite-attend]', main).forEach(x => x.removeAttribute('data-suite-attend')); return; }
    const f = reste[+t.dataset.suite], parent = t.parentElement;
    suites = reste;   // une place peut à son tour en remettre d'autres à plus tard
    try { if (f) t.insertAdjacentHTML('beforebegin', f()); } finally { suites = null; }
    t.remove();
    $$('template[data-suite]', parent).forEach(x => x.parentElement.setAttribute('data-suite-attend', ''));
    if (!$('template[data-suite]', parent)) parent.removeAttribute('data-suite-attend');
    $$('a[href^="http"]', parent).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    preparerCartes(parent, false, true);
    lierZones(q, false, parent);
    reserverSp(parent, false);
    vivreTroupe();
    suivreSommaire();
    decorer(false);
    requestAnimationFrame(() => setTimeout(() => completer(tour, reste, q), 0));
  }
  function rendre(v, q, enPlace) {
    const e = v.entree ? X.ENTREE[v.entree] : null;
    const g = enPlace ? garder() : null;
    if (!enPlace) { Object.keys(choixZones).forEach(k => delete choixZones[k]); rsSp = null; }
    root.classList.toggle('en-place', !!enPlace);
    root.style.setProperty('--top', v.top || 'var(--aub)');
    // le filet sous le linteau : la couleur de l'onglet ou de la page de l'espace pro qu'on lit, sinon la saison, à peine
    root.style.setProperty('--hl', v.u ? v.u.vif : e ? e.couleurVive : 'color-mix(in srgb,var(--sai-v) 30%,transparent)');
    root.dataset.vue = v.vue;
    frises.forEach(f => f.detruire()); frises = []; plans = [];
    const tour = ++tourRendu;
    suites = !enPlace && mouvement() ? [] : null;
    try { main.innerHTML = v.html(); } finally { var reste = suites || []; suites = null; }
    document.title = `${v.titre} - ${X.S.titreSuffixe}`;
    marquer(v);
    $$('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    $$('form', main).forEach(f => f.addEventListener('submit', ev => ev.preventDefault()));
    preparerCartes(main, enPlace);
    lierZones(q, enPlace);
    reserverSp(main, enPlace);
    vivreTroupe();
    suivreSommaire();
    decorer(enPlace);
    if (enPlace) { restaurer(g); return; }
    $$('template[data-suite]', main).forEach(t => t.parentElement.setAttribute('data-suite-attend', ''));

    // fait une seule fois, dans l'image, et non en plus dans la tâche du geste ; la suite vient après cette image
    requestAnimationFrame(() => {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      const h1 = $('h1', main);
      if (h1) h1.focus({ preventScroll: true });
      if (reste.length) setTimeout(() => completer(tour, reste, q), 0);
    });

  // les titres montent, les cartes viennent l'une après l'autre en pivotant sur leur gond, les chiffres comptent ; posé avant
  // toute lecture de mise en page
  function decorer(enPlace) {
    $$('.sec-titre, .split-titre, .bande-titre, .affiches-titre, .histoire-titre, .du-titre, .chap-titre', main).forEach(e => { if (!e.closest('[data-mv]')) e.setAttribute('data-mv', 'monte'); });
    $$('.ucartes, .fps, .acs, .galerie, .cast, .citations, .ateliers, .encadres, .ft-blocs, .ep-portes, .galerie-ac', main).forEach(e => e.setAttribute('data-mv', 'cascade'));
    $$('.gros, .bilan-n b', main).forEach(e => e.setAttribute('data-mv', 'compte'));

  /* ---------- les battants : la page qui arrive s'ouvre comme une porte, on referme derrière soi en revenant ---------- */
  let btEl = null, btAnims = [], hautTete = 0;
  if ('ResizeObserver' in window) new ResizeObserver(es => { const x = es[0]; hautTete = Math.round(x.borderBoxSize && x.borderBoxSize[0] ? x.borderBoxSize[0].blockSize : x.contentRect.height); }).observe(header);
  // les couleurs d'une page : la porte (le fond de l'univers du spectacle, ou le prune teinté de l'entrée) et sa lumière
  function couleursDe(v) {
    if (v.u) return { porte: v.u.fond, lumiere: v.u.clair ? v.u.aplat : v.u.vif };
    const e = v.vue !== 'spectacle' && v.entree ? X.ENTREE[v.entree] : null;
    if (e) return { porte: melange(PRUNE, e.couleur, .2), lumiere: e.couleurVive };
    return { porte: 'var(--aub-2)', lumiere: 'var(--sai-v)' };
  }
  const finirBattants = () => { btAnims.forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } }); btAnims = []; if (btEl) btEl.classList.remove('on'); };
  function battants(type, c) {
    finirBattants();
    if (!mouvement() || !main.animate || !c || type === 'onglet' || type === 'premiere') return;
    if (!btEl) { document.body.insertAdjacentHTML('beforeend', '<div class="battants" aria-hidden="true"><i class="bt bt-g"></i><i class="bt bt-d"></i><i class="bt-jour"></i></div>'); btEl = document.body.lastElementChild; }
    btEl.style.setProperty('--bt-haut', `${hautTete}px`);
    btEl.style.setProperty('--bt-c', c.porte);
    btEl.style.setProperty('--bt-l', c.lumiere);
    btEl.classList.add('on');
    const [g, d, j] = btEl.children, retour = type === 'retour';
    // en avant : les vantaux, à peine entrouverts, s'ouvrent vers l'intérieur et la lumière passe ; au retour, ceux de la page
    // quittée se rabattent et s'effacent (on a refermé derrière soi)
    const o = { duration: retour ? 380 : 430, easing: retour ? 'cubic-bezier(.45,.05,.55,.95)' : 'cubic-bezier(.32,.6,.16,1)', fill: 'both' };
    const vantail = k => retour
      ? [{ transform: `rotateY(${k * 82}deg)`, opacity: .85 }, { transform: `rotateY(${k * 36}deg)`, opacity: .42, offset: .55 }, { transform: `rotateY(${k * 8}deg)`, opacity: 0 }]
      : [{ transform: `rotateY(${k * 7}deg)`, opacity: 1 }, { transform: `rotateY(${k * 84}deg)`, opacity: 1, offset: .58 }, { transform: `rotateY(${k * 104}deg)`, opacity: 0 }];
    btAnims = [g.animate(vantail(1), o), d.animate(vantail(-1), o)];

      ? j.animate([{ opacity: .5, transform: 'scaleX(2.4)' }, { opacity: 0, transform: 'scaleX(.2)' }], { duration: 300, easing: 'ease-in', fill: 'both' })
      : j.animate([{ opacity: .9, transform: 'scaleX(.4)' }, { opacity: .85, transform: 'scaleX(2.2)', offset: .3 }, { opacity: 0, transform: 'scaleX(5.2)' }], { duration: 430, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' }));
    btAnims[0].onfinish = finirBattants;
