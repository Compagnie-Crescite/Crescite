<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Inter:wght@400;500;600&display=swap">
<style>
/* 04 · Trois portes. Le public d'abord : trois grandes portes sur un fond prune, chacune dans sa couleur. */
:root{
  --aub:#22101d;
  --aub-2:#2e1628;
  --aub-3:#43203b;
  --ivory:#faf6f3;
  --paper:#ffffff;
  --ink:#1d1219;
  --muted:#5e5359;
  --line:rgba(29,18,25,.13);
  --line-2:rgba(29,18,25,.3);
  --on-dark:#ffffff;
  --on-dark-2:rgba(255,255,255,.74);
  --line-dark:rgba(255,255,255,.14);
  --rose:#c2306f;--rose-v:#f07ab6;
  --acc:var(--rose);--acc-v:var(--rose-v);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --gutter:clamp(16px,4vw,56px);
  --wrap:1328px;
  --top:var(--aub);
  --fs-label:.8125rem;
  --fs-small:.9375rem;
  --fs-body:1.0625rem;
  --fs-h3:1.45rem;
  --fs-h2:clamp(2rem,1.5rem + 1.6vw,2.75rem);
  --fs-h1:clamp(2.6rem,1.4rem + 3.9vw,4.75rem);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--aub);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:var(--fs-body);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:min(100% - 2*var(--gutter),var(--wrap));margin-inline:auto}
.defs{position:absolute;width:0;height:0;overflow:hidden}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:12px;top:-80px;z-index:40;padding:10px 18px;background:#fff;color:var(--ink);font-size:var(--fs-small);font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.entre{animation:entre .45s ease both}
@keyframes entre{from{opacity:0}to{opacity:1}}
.fleche{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.fleche span{transition:transform .3s var(--ease)}
.fleche:hover span{transform:translateX(4px)}
.ext{display:inline-block;margin-left:5px;font-size:.85em}

/* l'en-tête */
.site-header{position:relative;z-index:30;background:var(--top);color:#fff}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:84px}
.brand{display:block;flex:none;width:58px;color:#fff}
.brand svg{display:block;width:100%;height:auto}
.site-nav ul{display:flex;gap:clamp(18px,2.1vw,34px)}
.site-nav a{position:relative;display:block;padding:10px 0;color:var(--on-dark-2);font-size:var(--fs-small);font-weight:500;text-decoration:none;white-space:nowrap}
.site-nav a::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;border-radius:2px;background:var(--tab,#fff);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.site-nav a:hover{color:#fff}
.site-nav a:hover::after{transform:scaleX(.5)}
.site-nav a[aria-current="page"]{color:#fff}
.site-nav a[aria-current="page"]::after{transform:scaleX(1)}
.menu-btn{display:none}
@media (max-width:1279px){
  .header-in{min-height:76px}
  .brand{width:52px}
  .menu-btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid var(--line-dark);border-radius:999px;background:none;color:#fff;font-size:var(--fs-small);font-weight:500}
  .menu-icon{width:16px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
  .site-nav{display:none;position:absolute;left:0;right:0;top:100%;padding:4px var(--gutter) 24px;background:var(--top);border-top:1px solid var(--line-dark);box-shadow:0 30px 40px rgba(10,3,8,.35)}
  .nav-open .site-nav{display:block}
  .site-nav ul{flex-direction:column;gap:0;max-width:var(--wrap);margin-inline:auto}
  .site-nav a{padding:14px 0;border-bottom:1px solid var(--line-dark);font-size:var(--fs-body)}
  .site-nav a::after{left:0;right:auto;top:14px;bottom:14px;width:3px;height:auto;transform:scaleY(0)}
  .site-nav a:hover::after{transform:scaleY(.6)}
  .site-nav a[aria-current="page"]{padding-left:16px}
  .site-nav a[aria-current="page"]::after{transform:scaleY(1)}
}

/* les trois portes */
.seuil{background:var(--aub);color:#fff;padding:clamp(2px,1vh,10px) 0 clamp(28px,5vh,56px)}
.seuil-nom{margin-bottom:clamp(14px,2.2vh,22px);font-family:var(--sans);font-size:var(--fs-small);font-weight:500;line-height:1.4;color:var(--on-dark-2)}
.doors{display:flex;gap:14px;min-height:max(470px,calc(100vh - 176px))}
@supports (height:100svh){.doors{min-height:max(470px,calc(100svh - 176px))}}
.door{position:relative;isolation:isolate;flex:1 1 0;min-width:0;display:flex;background:var(--aub-2);box-shadow:inset 0 3px 0 var(--v);transition:flex-grow .55s var(--ease)}
.door::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(110% 70% at 25% 0%,color-mix(in srgb,var(--v) 24%,transparent),transparent 70%);opacity:0;transition:opacity .5s var(--ease)}
.door::after{content:"";position:absolute;inset:0;border:1px solid var(--v);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.door-link{display:flex;flex-direction:column;width:100%;padding:clamp(28px,2.6vw,40px);color:#fff;text-decoration:none}
.door-link:focus-visible{outline:2px solid var(--v);outline-offset:-8px}
.door-bas{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:auto;padding-top:32px}
.door-label{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,3vw,2.9rem);line-height:1.05;letter-spacing:-.015em;font-variation-settings:"opsz" 72,"SOFT" 100;text-wrap:balance}
.door-arr{flex:none;display:grid;place-items:center;width:46px;height:46px;border:1px solid color-mix(in srgb,var(--v) 60%,transparent);border-radius:50%;color:var(--v);font-size:1.2rem;line-height:1;transition:transform .45s var(--ease),background .45s var(--ease),color .45s var(--ease)}
.door:hover .door-arr,.door:focus-within .door-arr{background:var(--v);color:var(--aub);transform:translateX(4px)}
/* l'arche : un battant qui s'entrouvre sur la lumière de la porte */
.arche{position:relative;display:block;flex:none;width:clamp(84px,8.4vw,138px);aspect-ratio:5/8;perspective:640px}
.arche::before{content:"";position:absolute;inset:0;border:1.5px solid var(--v);border-radius:999px 999px 0 0;pointer-events:none}
.arche-lumiere{position:absolute;inset:6px 6px 0;border-radius:999px 999px 0 0;background:radial-gradient(130% 90% at 50% 100%,#fff 0%,var(--lv,var(--v)) 38%,color-mix(in srgb,var(--lv,var(--v)) 40%,var(--aub)) 100%);opacity:.6;transition:opacity .6s var(--ease)}
.arche-battant{position:absolute;inset:6px 6px 0;border-radius:999px 999px 0 0;background:linear-gradient(180deg,var(--aub-3),#2b1226);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v) 45%,transparent);transform-origin:0 50%;transform:rotateY(20deg);transition:transform .85s var(--ease)}
.arche-battant::after{content:"";position:absolute;right:16%;top:57%;width:7px;height:7px;border-radius:50%;background:var(--v)}
.door:hover .arche-battant,.door:focus-within .arche-battant{transform:rotateY(70deg)}
.door:hover .arche-lumiere,.door:focus-within .arche-lumiere{opacity:1}
.doors.salut .arche-battant{animation:salut 1.7s var(--ease) backwards;animation-delay:calc(var(--i) * .17s + .05s)}
.doors.salut .arche-lumiere{animation:salut-lueur 1.7s var(--ease) backwards;animation-delay:calc(var(--i) * .17s + .05s)}
@keyframes salut{0%{transform:rotateY(0)}45%{transform:rotateY(64deg)}100%{transform:rotateY(20deg)}}
@keyframes salut-lueur{0%{opacity:.15}45%{opacity:1}100%{opacity:.6}}
@media (min-width:1180px){
  .doors:not(:hover) .door:focus-within{flex-grow:1.4}
  .doors:not(:hover) .door:focus-within::before,.doors:not(:hover) .door:focus-within::after{opacity:1}
}
@media (min-width:1180px) and (hover:hover){
  .doors:hover .door:hover{flex-grow:1.4}
  .doors:hover .door:hover::before,.doors:hover .door:hover::after{opacity:1}
}
@media (max-width:1179px){
  .doors{flex-direction:column;min-height:0;gap:10px}
  .door-link{flex-direction:row;align-items:center;gap:clamp(18px,3vw,32px);padding:24px clamp(18px,3vw,32px)}
  .arche{width:clamp(48px,7vw,64px)}
  .door-bas{flex:1;min-width:0;margin:0;padding:0;align-items:center}
  .door-label{font-size:clamp(1.5rem,1rem + 2.2vw,2.3rem)}
}
@media (max-width:420px){
  .door-link{padding:20px 16px;gap:16px}
  .door-arr{width:40px;height:40px}
}

/* la carte : des bras clairs sur le prune, les communes comme des points lumineux */
.mc{position:relative;width:100%;aspect-ratio:var(--ar);margin-inline:auto}
.mc-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
.mc-pays{fill:rgba(255,255,255,.035);stroke:rgba(255,236,245,.22);stroke-width:1;stroke-linejoin:round}
.mc-encart{fill:rgba(255,255,255,.03);stroke:rgba(255,236,245,.32);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.mc-voisin{fill:rgba(255,255,255,.012);stroke:rgba(255,236,245,.1);stroke-width:1;stroke-dasharray:2 4}
.mc-passe{fill:rgba(255,232,243,.34)}
.mc-eteint{fill:rgba(255,232,243,.72)}
.mc-bras{fill:url(#m04-bras);opacity:.86;transition:opacity .35s var(--ease)}
.mc-rouen-halo{fill:url(#m04-lueur-rose)}
.mc-rouen{fill:var(--rose-v);stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.mc-lieu{outline:none;transform-box:fill-box;transform-origin:center;transition:opacity .35s var(--ease)}
.mc-lieu[role="button"]{cursor:pointer}
.mc-halo{fill:url(#m04-lueur);transform-box:fill-box;transform-origin:center;transition:transform .35s var(--ease)}
.mc-point{fill:#fff}
.mc-anneau{fill:none;stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .25s}
.mc-cible{fill:transparent}
.mc-lieu.on .mc-halo,.mc-lieu.choisi .mc-halo{transform:scale(1.85)}
.mc-lieu.choisi .mc-anneau,.mc-lieu:focus-visible .mc-anneau{opacity:1}
.survol-carte .mc-bras:not(.on),.survol-liste .mc-bras:not(.on),.filtre .mc-bras:not(.choisi):not(.on){opacity:.16}
.survol-carte .mc-lieu:not(.on),.survol-liste .mc-lieu:not(.on),.filtre .mc-lieu:not(.choisi):not(.on){opacity:.42}
.attente .mc-lieu,.pousse .mc-lieu:not(.allume),.attente .mc-eteint,.pousse .mc-eteint:not(.allume){opacity:0}
.mc-lieu.allume{animation:allume .9s var(--ease) backwards}
.mc-eteint.allume{animation:apparait .6s ease backwards}
.mc-lieu.allume .mc-halo{animation:scintille 4.6s ease-in-out var(--s,0s) infinite}
@keyframes allume{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}
@keyframes apparait{from{opacity:0}to{opacity:1}}
@keyframes scintille{0%,100%{opacity:1}50%{opacity:.55}}
.mc-nom,.mc-rouen-nom{position:absolute;z-index:2;transform:translate(13px,-50%);font-size:.8125rem;font-weight:600;line-height:1.2;letter-spacing:.01em;color:#fff;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 0 3px var(--aub),0 0 10px var(--aub),0 0 18px var(--aub)}
.mc-nom.g{transform:translate(calc(-100% - 13px),-50%)}
.mc-nom.on,.mc-nom.choisi,.mc-nom.toujours,.mc-nom.prochain{opacity:1}
.survol-carte .mc-nom.prochain:not(.on),.survol-liste .mc-nom.prochain:not(.on),.filtre .mc-nom.prochain:not(.choisi){opacity:0}
.mc-rouen-nom{opacity:1;transform:translate(calc(-100% - 14px),-110%);font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-v)}
@media (max-width:700px){
  .mc-point{r:5px}
  .mc-halo{r:20px}
  .mc-anneau{r:11px}
  .mc-cible{r:24px}
  .mc-nom{font-size:.75rem}
}
/* l'accueil : la saison sur la carte */
.bande{overflow-x:clip;background:radial-gradient(60% 70% at 72% 42%,#3d1734 0%,var(--aub) 72%);color:#fff;padding:clamp(64px,8vw,120px) 0;border-top:1px solid var(--line-dark)}
.bande-grille{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-areas:"tete carte" "liste carte";grid-template-rows:auto 1fr;column-gap:clamp(32px,5vw,88px)}
.bande-tete{grid-area:tete;align-self:end}
.bande-carte{grid-area:carte;align-self:center}
.bande-liste{grid-area:liste}
.bande-titre{font-family:var(--serif);font-weight:360;font-size:clamp(2.4rem,1.5rem + 2.6vw,3.9rem);line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100}
.prochaines{margin-top:clamp(24px,3vw,36px);border-top:1px solid var(--line-dark)}
.pr-a{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr);gap:2px 20px;padding:16px 12px 16px 0;border-bottom:1px solid var(--line-dark);color:#fff;text-decoration:none;transition:background .3s var(--ease),padding .3s var(--ease)}
.pr-quand{grid-row:span 2;display:flex;flex-direction:column}
.pr-jour{font-family:var(--serif);font-size:1.55rem;line-height:1.08;font-variation-settings:"opsz" 72,"SOFT" 100}
.pr-mois{font-size:var(--fs-label);color:var(--on-dark-2)}
.pr-ou{font-weight:600;color:var(--rose-v);line-height:1.35}
.pr-quoi{font-family:var(--serif);font-size:1.12rem;line-height:1.3}
.pr-a:hover .pr-quoi{text-decoration:underline;text-decoration-thickness:1px}
.pr.on .pr-a,.pr-a:hover,.pr-a:focus-visible{padding-left:12px;background:linear-gradient(90deg,rgba(240,122,182,.14),transparent 80%)}
.pr-a:focus-visible{outline-color:var(--rose-v);outline-offset:-2px}
.bande-plus{margin-top:24px}
.bande-plus a{color:var(--rose-v)}
@media (max-width:999px){
  .bande-grille{grid-template-columns:minmax(0,1fr);grid-template-areas:"tete" "carte" "liste";grid-template-rows:auto}
  .bande-carte{margin:28px 0 8px}
}
/* l'accueil : le bandeau EN TOURNÉE, des affiches en arche */
.affiches-s{padding:clamp(64px,8vw,112px) 0 clamp(40px,5vw,64px)}
.affiches-titre{margin-bottom:clamp(24px,3vw,36px);font-size:var(--fs-label);font-weight:600;letter-spacing:.14em;color:var(--rose)}
.affiches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(16px,1.8vw,28px)}
.affiche{position:relative;display:flex;flex-direction:column}
.affiche-photo{aspect-ratio:3/4;margin-bottom:18px}
.affiche-photo img{transition:transform .9s var(--ease)}
.affiche:hover .affiche-photo img{transform:scale(1.05)}
.affiche-titre{font-family:var(--serif);font-weight:450;font-size:1.3rem;line-height:1.15;font-variation-settings:"opsz" 30,"SOFT" 70;text-wrap:balance}
.affiche-titre span{display:block}
.affiche-bas{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.affiche-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:999px;font-size:var(--fs-small);font-weight:600;text-decoration:none;transition:background .3s,color .3s}
.affiche-btn::after{content:"";position:absolute;inset:0}
.affiche:hover .affiche-btn{background:var(--ink);color:#fff}
.affiche-btn:focus-visible{outline:none}
.affiche:focus-within{outline:2px solid var(--ink);outline-offset:8px}
.affiche-credit{font-size:var(--fs-label);color:var(--muted)}
@media (max-width:1100px){
  .affiches{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
  .affiche{flex:0 0 min(64vw,280px);scroll-snap-align:start}
  .affiche:focus-within{outline-offset:-2px}
}
.merci{padding:0 0 clamp(56px,7vw,96px)}
.merci p{max-width:110ch;padding-top:22px;border-top:1px solid var(--line);font-size:var(--fs-label);line-height:1.65;color:var(--muted)}

/* les pages */
.page-hero{background:var(--top);color:#fff;padding:clamp(20px,3vw,40px) 0 clamp(44px,5.5vw,84px);border-top:1px solid var(--line-dark)}
.page-hero.salle{border-top:3px solid var(--acc-v)}
.kicker{display:flex;align-items:center;gap:12px;font-size:var(--fs-small);font-weight:500;color:var(--acc-v)}
.porte-ico{flex:none;width:16px;height:24px}
.page-title{margin-top:.32em;max-width:22ch;font-family:var(--serif);font-weight:360;font-size:var(--fs-h1);line-height:1.02;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100;text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-small);font-weight:500;color:var(--on-dark-2);text-decoration:none}
.back:hover{color:#fff;text-decoration:underline}
.section{padding:clamp(56px,7vw,104px) 0}
.arche-img{position:relative;overflow:hidden;border-radius:999px 999px 0 0;background:var(--aub-2)}
.arche-img img{width:100%;height:100%;object-fit:cover}
.prose{max-width:68ch}
.prose > * + *{margin-top:1em}
.prose h2{margin-top:1.6em;font-family:var(--serif);font-weight:450;font-size:var(--fs-h3);line-height:1.25;font-variation-settings:"opsz" 30,"SOFT" 70}
.prose h3{margin-top:1.4em;font-size:var(--fs-body);font-weight:600;line-height:1.4}
.prose > :first-child{margin-top:0}
.prose ul{padding-left:1.2em;list-style:disc}
.prose li + li{margin-top:.55em}
.prose a{color:var(--acc);font-weight:500}

/* la carte et sa liste côte à côte : la carte sur le prune, la liste sur l'ivoire */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--ivory)}
.split-carte{overflow-x:clip;background:radial-gradient(80% 60% at 45% 35%,#3a1631 0%,var(--aub) 72%);color:#fff}
.split-colle{position:sticky;top:0;display:flex;align-items:flex-start;justify-content:center;padding:clamp(28px,3.5vw,56px) clamp(20px,3vw,48px)}
.split-colle .mc{width:min(100%,calc((100vh - 72px) * var(--ar)))}
.split-liste{min-width:0;padding:clamp(40px,5vw,72px) var(--gutter) clamp(56px,6vw,96px) clamp(28px,4vw,64px)}
.split-liste > *{max-width:680px}
.split-titre{margin-bottom:clamp(20px,2.4vw,32px);font-family:var(--serif);font-weight:400;font-size:var(--fs-h2);line-height:1.05;letter-spacing:-.015em;font-variation-settings:"opsz" 72,"SOFT" 100}
.split-texte{color:var(--muted)}
@media (max-width:999px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split-colle{position:static;min-height:0;padding:28px var(--gutter)}
  .split-colle .mc{width:min(100%,560px)}
  .split-liste{padding:40px var(--gutter) 64px}
}
.puce-zone:empty{display:none}
.puce{display:inline-flex;align-items:center;gap:12px;min-height:42px;margin-bottom:24px;padding:0 8px 0 18px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-size:var(--fs-small);font-weight:600}
.puce span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);font-size:1rem;line-height:1}
.puce:hover span{background:rgba(255,255,255,.35)}
.mois{margin-top:44px;padding-bottom:10px;border-bottom:1px solid var(--ink);font-size:var(--fs-label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.groupe:first-child .mois{margin-top:0}
.dl{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr);gap:4px 28px;padding:20px 0;border-bottom:1px solid var(--line);transition:opacity .3s var(--ease),background .3s var(--ease)}

.dl-ou{font-weight:600;line-height:1.4}
.dl-quoi{margin-top:2px}

@media (max-width:640px){

/* l'agenda : les saisons passées, des petites portes ouvertes sur leurs cartes */
.saisons{background:var(--aub);color:#fff;padding:clamp(56px,7vw,96px) 0;border-top:1px solid var(--line-dark)}
.tuiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.tuile{display:block;color:#fff;text-decoration:none}
.tuile-carte{display:flex;align-items:flex-end;aspect-ratio:4/5;padding:16% 6% 4%;border:1px solid var(--line-dark);border-radius:999px 999px 0 0;background:radial-gradient(90% 70% at 50% 60%,#3a1631,transparent 75%);transition:border-color .35s var(--ease),background-color .35s var(--ease)}
.mini{display:block;width:100%;height:auto;overflow:hidden}
.mini .mc-pays{fill:rgba(255,255,255,.04);stroke:rgba(255,236,245,.2)}
.mini-bras{fill:url(#m04-bras);opacity:.7;transition:opacity .35s var(--ease)}
.mini-pt{fill:url(#m04-lueur)}
.mini-rouen{fill:var(--rose-v)}
.tuile-t{display:block;margin-top:12px;font-family:var(--serif);font-size:1.15rem;line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 70}
.tuile:hover .tuile-carte,.tuile:focus-visible .tuile-carte{border-color:var(--rose-v);background-color:rgba(240,122,182,.06)}
.tuile:hover .mini-bras{opacity:1}
.tuile:hover .tuile-t{text-decoration:underline;text-decoration-thickness:1px}
.tuile:focus-visible{outline:none}
.tuile:focus-visible .tuile-t{text-decoration:underline}
@media (max-width:1100px){.tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.tuiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* une saison passée */
.sp + .sp{margin-top:clamp(40px,4.5vw,60px)}
.sp-titre{font-family:var(--serif);font-weight:450;font-size:var(--fs-h3);line-height:1.2;font-variation-settings:"opsz" 30,"SOFT" 70}
.sp-titre a{text-decoration:none}
.sp-titre a:hover{text-decoration:underline}
.sp-sous{margin-top:4px;font-size:var(--fs-small);color:var(--muted)}
.sp-creation{margin-top:2px;font-size:var(--fs-small);font-weight:600;color:var(--acc)}
.sls{margin-top:14px;border-top:1px solid var(--ink)}
.sl{padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small);line-height:1.5;transition:opacity .3s var(--ease),background .3s var(--ease)}
.sl-quand{font-weight:600}
.sl-ligne a{text-decoration:none}
.sl-ligne a:hover{text-decoration:underline}
.sl-etat{display:inline-block;margin-top:4px;padding:0 10px;border:1px solid var(--acc);border-radius:999px;font-size:var(--fs-label);font-weight:600;color:var(--acc)}
.sl.annule .sl-ligne{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.sl .dl-det{margin-top:4px}
.saison-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;margin-top:clamp(40px,5vw,64px);padding-top:20px;border-top:1px solid var(--line)}
.saison-nav a{color:var(--acc)}

/* les spectacles */
.cartes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px clamp(16px,2vw,28px)}
.cs{position:relative;display:flex;flex-direction:column}
.cs-photo{aspect-ratio:4/5;margin-bottom:18px}
.cs-photo img{transition:transform .9s var(--ease)}
.cs:hover .cs-photo img{transform:scale(1.05)}
.cs-etat{margin-bottom:6px;font-size:var(--fs-label);font-weight:600;letter-spacing:.08em;color:var(--sct)}
.cs-titre{font-family:var(--serif);font-weight:450;font-size:var(--fs-h3);line-height:1.15;font-variation-settings:"opsz" 30,"SOFT" 70;text-wrap:balance}
.cs-titre a{text-decoration:none}
.cs-titre a::after{content:"";position:absolute;inset:0}
.cs:hover .cs-titre a{text-decoration:underline;text-decoration-thickness:1px}
.cs-titre a:focus-visible{outline:none}
.cs:focus-within{outline:2px solid var(--ink);outline-offset:8px}
.cs-sous{margin-top:6px;font-size:var(--fs-small);line-height:1.45;color:var(--muted)}
.cs-creation{margin-top:auto;padding-top:12px;font-size:var(--fs-small);font-weight:600;color:var(--sct)}
@media (max-width:1100px){.cartes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){
  .cartes{grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
  .cs{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
  .cs-photo{grid-row:1/span 4;align-self:start;margin:0}
  .cs:focus-within{outline-offset:2px}
}

/* un spectacle */
.show-hero{background:var(--top);color:#fff;padding:clamp(18px,2.4vw,32px) 0 clamp(48px,6vw,88px);border-top:1px solid var(--line-dark)}
.show-hero-grille{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:36px clamp(40px,6vw,96px);align-items:center;margin-top:clamp(28px,4vw,56px)}
.show-etat{display:inline-block;margin-bottom:20px;padding:2px 12px;border:1px solid var(--sc);border-radius:999px;font-size:var(--fs-label);font-weight:600;letter-spacing:.08em;color:var(--sc)}
.show-title{font-family:var(--serif);font-weight:360;font-size:var(--fs-h1);line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100;text-wrap:balance}
.show-title span{display:block}
.show-creation{margin-top:24px;font-weight:600;color:var(--sc)}
.show-sub{max-width:40ch;margin-top:6px;font-family:var(--serif);font-size:var(--fs-h3);line-height:1.3;color:var(--on-dark-2);font-variation-settings:"opsz" 30,"SOFT" 100}
.show-cadre{max-width:54ch;text-wrap:pretty;margin-top:14px;font-size:var(--fs-small);color:var(--on-dark-2)}
.show-photo .arche-img{aspect-ratio:5/6}
.show-photo figcaption{margin-top:10px;font-size:var(--fs-label);color:var(--on-dark-2)}
.show-corps{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:48px clamp(48px,7vw,120px);align-items:start;padding:clamp(56px,7vw,104px) 0}
.show-prose > p:first-child{font-family:var(--serif);font-size:var(--fs-h3);line-height:1.4;font-variation-settings:"opsz" 30,"SOFT" 100}
.extraits{margin-top:clamp(36px,4vw,56px);border-top:1px solid var(--ink)}
.extraits li{padding:22px 0;border-bottom:1px solid var(--line)}
.extraits blockquote p{font-family:var(--serif);font-size:1.3rem;line-height:1.4;font-variation-settings:"opsz" 30,"SOFT" 100}
.extrait-src{margin-top:8px;font-size:var(--fs-small);color:var(--muted)}
.medias{margin-top:clamp(36px,4vw,56px);border-top:1px solid var(--ink)}
.media{border-bottom:1px solid var(--line)}

.media-ico{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:.7rem;transform:translateY(5px)}
.media-par{margin:-8px 0 14px 40px;font-size:var(--fs-small);color:var(--muted)}
.media-groupe{padding:14px 0 16px;border-bottom:1px solid var(--line)}
.media-groupe-t{font-weight:600}
.media-groupe ul{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.media-groupe ul a{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;font-size:var(--fs-small);text-decoration:none}
.media-groupe ul a:hover{border-color:var(--ink)}
.show-fiche{font-size:var(--fs-small);line-height:1.55}
.fiche{border-top:1px solid var(--ink)}
.fiche li{padding:10px 0;border-bottom:1px solid var(--line)}
.fiche-l{color:var(--muted)}
.avec,.duree{padding:10px 0;border-bottom:1px solid var(--line)}
.duree{font-weight:600}
.mention{margin-top:16px;padding:12px 14px;border-left:3px solid var(--sct);background:var(--paper)}
.mention a{color:var(--ink);font-weight:500}
.production{margin-top:24px;color:var(--muted)}
.production p + p{margin-top:.7em}
.production strong{color:var(--ink);font-weight:600}
.bande-seule{overflow-x:clip;background:radial-gradient(60% 70% at 50% 40%,#3a1631 0%,var(--aub) 72%);padding:clamp(48px,6vw,88px) 0}
.bande-seule .mc{width:min(100%,640px)}
@media (max-width:900px){
  .show-hero-grille,.show-corps{grid-template-columns:minmax(0,1fr)}
  .show-photo{max-width:420px}
}

/* la compagnie */
.cie{max-width:70ch}
.cie > p:first-child{font-family:var(--serif);font-size:var(--fs-h3);line-height:1.45;font-variation-settings:"opsz" 30,"SOFT" 100}
.frise-s{background:var(--aub);color:#fff;padding:clamp(56px,7vw,104px) 0}
.frise-titre{font-family:var(--serif);font-weight:400;font-size:var(--fs-h2);line-height:1.05;letter-spacing:-.015em;font-variation-settings:"opsz" 72,"SOFT" 100}
.frise{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:16px;margin-top:clamp(36px,4vw,56px)}
.frise::before{content:"";position:absolute;left:0;right:0;top:calc(2.5rem + 18px);height:1px;background:linear-gradient(90deg,var(--rose-v),rgba(255,236,245,.3))}
.frise li{display:flex;flex-direction:column;gap:12px}
.frise-an{font-family:var(--serif);font-weight:350;font-size:2.5rem;line-height:1;font-variation-settings:"opsz" 144,"SOFT" 100}
.frise-pt{position:relative;width:10px;height:10px;margin:2px 0 4px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.1),0 0 16px 5px rgba(255,210,232,.5)}
.frise-t{font-size:var(--fs-small);line-height:1.45;color:var(--on-dark-2)}
.frise-t a{color:#fff;text-decoration-color:rgba(255,255,255,.4)}
.frise-t a:hover{text-decoration-color:#fff}
@media (max-width:900px){
  .frise{grid-auto-flow:row;grid-auto-columns:auto;gap:0;padding-left:28px}
  .frise::before{left:4px;right:auto;top:8px;bottom:8px;width:1px;height:auto;background:linear-gradient(180deg,var(--rose-v),rgba(255,236,245,.3))}
  .frise li{position:relative;display:grid;grid-template-columns:4.5rem minmax(0,1fr);align-items:baseline;gap:16px;padding:12px 0}
  .frise-an{font-size:1.8rem}
  .frise-pt{position:absolute;left:-28px;top:22px;margin:0}
}

/* actions culturelles, espace pro, contact */
.actions{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:48px clamp(48px,7vw,120px);align-items:start}
.actions-photo .arche-img{aspect-ratio:4/5}
.actions-photo figcaption{margin-top:10px;font-size:var(--fs-label);color:var(--muted)}
.pro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px clamp(40px,6vw,96px);align-items:center;max-width:980px}
.pro .arche{width:clamp(110px,13vw,180px)}
.pro:focus-within .arche-battant{transform:rotateY(38deg)}
.pro:focus-within .arche-lumiere{opacity:1}
.pro-form p{max-width:44ch;font-family:var(--serif);font-size:var(--fs-h3);line-height:1.35;font-variation-settings:"opsz" 30,"SOFT" 100}
.pro-form label{display:block;margin-top:28px;margin-bottom:8px;font-size:var(--fs-small);font-weight:600}
.pro-ligne{display:flex;flex-wrap:wrap;gap:12px}
.pro-ligne input{flex:1 1 220px}
.contact{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:48px clamp(48px,7vw,120px);align-items:start}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px;max-width:760px}
.champ{min-width:0}
.champ.large,.consent,.calcul,.envoi{grid-column:1/-1}
.champ label{display:block;margin-bottom:6px;font-size:var(--fs-small);font-weight:600}
.champ input,.champ textarea,.pro-ligne input,.calcul input{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);color:var(--ink)}
.champ textarea{min-height:180px;resize:vertical}
.champ input:hover,.champ textarea:hover,.pro-ligne input:hover,.calcul input:hover{border-color:var(--ink)}
.champ input:focus-visible,.champ textarea:focus-visible,.pro-ligne input:focus-visible,.calcul input:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.consent{display:flex;align-items:flex-start;gap:12px;font-size:var(--fs-small)}
.consent input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--acc)}
.consent a{color:var(--acc);font-weight:500}
.calcul{display:flex;align-items:center;gap:14px;font-weight:600}
.calcul input{width:4.5rem;min-height:44px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--aub);color:#fff;font-size:var(--fs-small);font-weight:600;transition:background .3s}
.btn:hover{background:var(--acc)}
.coord{padding:clamp(24px,3vw,36px);background:var(--aub);color:#fff;font-size:var(--fs-small);line-height:1.6;box-shadow:inset 0 3px 0 var(--rose-v)}
.coord-nom{font-family:var(--serif);font-size:var(--fs-h3);line-height:1.2}
.coord-adr{margin-top:12px}
.coord-legal{margin-top:16px;color:var(--on-dark-2)}
.coord-fb{margin-top:16px;font-weight:600}
@media (max-width:900px){
  .actions,.contact{grid-template-columns:minmax(0,1fr)}
  .actions-photo{max-width:420px}
}
@media (max-width:640px){
  .form{grid-template-columns:minmax(0,1fr)}
  .pro{grid-template-columns:minmax(0,1fr)}
  .pro .arche{width:96px}
}

/* le pied de page */
.site-footer{background:var(--aub);color:#fff;padding:clamp(56px,7vw,96px) 0 32px;border-top:1px solid var(--line-dark)}
.pied-portes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:clamp(48px,6vw,80px)}
.pied-portes a{display:flex;align-items:center;gap:14px;height:100%;padding:18px 20px;background:var(--aub-2);box-shadow:inset 0 2px 0 var(--v);color:#fff;font-family:var(--serif);font-size:1.2rem;line-height:1.2;text-decoration:none;transition:background .3s}
.pied-portes a:hover{background:#3a1c33}
.pied-portes .porte-ico{color:var(--v)}
.pied-grille{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) minmax(0,2fr) minmax(0,5fr);gap:36px clamp(28px,4vw,64px);align-items:start;font-size:var(--fs-small);line-height:1.6}
.pied-logo{display:block;width:84px;color:#fff}
.pied-logo svg{display:block;width:100%;height:auto}
.pied-nom{font-weight:600}
.pied-adr{color:var(--on-dark-2)}
.pied-ecrire{font-family:var(--serif);font-size:1.3rem;text-decoration-color:rgba(255,255,255,.4)}
.pied-ecrire:hover{text-decoration-color:#fff}
.pied-fb{margin-top:6px;color:var(--on-dark-2)}
.pied-part{color:var(--on-dark-2)}
.pied-bas{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;margin-top:clamp(40px,5vw,64px);padding-top:22px;border-top:1px solid var(--line-dark);font-size:var(--fs-label);color:var(--on-dark-2)}
.pied-legal,.pied-liens{display:flex;flex-wrap:wrap;gap:4px 0}
.pied-legal li + li::before,.pied-liens li + li::before{content:"·";margin:0 10px;color:rgba(255,255,255,.4)}
.pied-liens a{color:#fff}
@media (max-width:1000px){.pied-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pied-part{grid-column:1/-1}}
@media (max-width:760px){.pied-portes{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.pied-grille{grid-template-columns:minmax(0,1fr)}}

/* l'ouverture, habillée dans le prune */
.intro.intro-m04 .intro-indice{color:#f07ab6}

@media (max-width:640px){:root{--fs-body:1rem;--fs-h3:1.3rem}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const chemin = href => String(href || '').replace(/^#\/?/, '');

  const S = D.site, L = S.libelles, SHOWS = D.shows, DATES = D.dates;
  const bySlug = Object.fromEntries(SHOWS.map(s => [s.slug, s]));
  const MENU = Object.fromEntries(S.menu.map(m => [m.id, m]));
  const PORTE_DE = Object.fromEntries(S.portes.map(p => [p.href, p]));   // la porte qui mène à cette page
  const SAISON0 = S.saisons[0];
  const root = document.documentElement, main = $('#main'), header = $('.site-header'), menuBtn = $('.menu-btn');
  const mouvement = () => CARTE.mouvement();

  // les blocs HTML d'origine : un fragment sans balise de bloc devient un paragraphe
  const bloc = h => /^\s*<(h[1-6]|ul|ol|p|div|blockquote|table|figure)\b/i.test(h) ? h : `<p>${h}</p>`;
  const logo = () => D.logo.octopusWord.replace(/\srole="img"/, '').replace(/\saria-label="[^"]*"/, ' aria-hidden="true" focusable="false"');
  const porteIco = () => '<svg class="porte-ico" viewBox="0 0 20 30" aria-hidden="true" focusable="false"><path d="M1.5 29V10a8.5 8.5 0 0 1 17 0v19z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 29V10.6a5 5 0 0 1 10 0V29z" fill="currentColor" opacity=".35"/><circle cx="12.4" cy="19" r="1.1" fill="currentColor"/></svg>';
  const photo = (slug, alt, focale = 50) => {
    const src = D.photos && D.photos[slug];
    return src ? `<img src="${esc(src)}" alt="${esc(alt)}" decoding="async" style="object-position:${Number(focale) || 50}% 50%">` : '';
  };

  /* ---------- les dates ---------- */
  const MOIS_RE = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}\s*$/;
  function decoupe(ligneDate) {                       // « 8, 10 et 11 décembre 2026 » → « 8, 10 et 11 » + « décembre 2026 »
    const m = String(ligneDate).match(MOIS_RE);
    if (!m) return { jour: ligneDate, mois: '' };
    const jour = ligneDate.slice(0, m.index).trim();
    return jour ? { jour, mois: m[0].trim() } : { jour: m[0].trim(), mois: '' };
  }
  const moisDe = d => ((d.ligneDate || '').match(MOIS_RE) || [''])[0].trim();
  function parMois(ds) {
    const out = [];
    ds.forEach(d => { const m = moisDe(d), last = out[out.length - 1]; if (last && last.m === m) last.ds.push(d); else out.push({ m, ds: [d] }); });
    return out;
  }
  const details = ds => ds && ds.length ? `<ul class="dl-det">${ds.map(x => `<li>${x.lien ? `<a href="${esc(x.lien)}">${esc(x.texte)}<span class="ext" aria-hidden="true">↗</span></a>` : esc(x.texte)}</li>`).join('')}</ul>` : '';
  function ligneDate(d, avecTitre = true) {
    const { jour, mois } = decoupe(d.ligneDate);
    return `<li class="dl" data-l="${d.l ?? ''}">
      <p class="dl-quand"><span class="dl-jour">${esc(jour)}</span>${mois ? ` <span class="dl-mois">${esc(mois)}</span>` : ''}</p>
      <div>
        <p class="dl-ou">${esc(d.ligneLieu)}</p>
        ${avecTitre ? `<p class="dl-quoi"><a href="#/spectacle/${esc(d.slug)}">${esc(d.titre)}</a></p>` : ''}
        ${details(d.details)}
      </div>
    </li>`;
  }
  function ligneSaison(t) {
    const i = t.ligne.indexOf(' — '), quand = i > 0 ? t.ligne.slice(0, i) : t.ligne, ou = i > 0 ? t.ligne.slice(i + 3) : '';
    const corps = `<span class="sl-quand">${esc(quand)}</span>${ou ? `<span aria-hidden="true"> — </span><span class="sl-ou">${esc(ou)}</span>` : ''}`;
    return `<li class="sl${t.etat ? ' annule' : ''}" data-l="${t.l ?? ''}">
      <p class="sl-ligne">${t.lien ? `<a href="${esc(t.lien)}">${corps}<span class="ext" aria-hidden="true">↗</span></a>` : corps}</p>
      ${t.etat ? `<p class="sl-etat">${esc(t.etat)}</p>` : ''}
      ${details(t.details)}
    </li>`;
  }

  /* ---------- la carte des tournées, dessinée avec les formes de CARTE ---------- */
  const [BX, BY, BW, BH] = CARTE.viewBox.split(/\s+/).map(Number), R = CARTE.rouen;
  // une commune hors du cadre (outre-mer) est posée dans un petit encart, en bas à gauche
  const ENCART = [Math.round(BX + BW * .085), Math.round(BY + BH * .9)];
  const dehors = ([x, y]) => x < BX || x > BX + BW || y < BY || y > BY + BH;
  const horsCadre = x => x.encart || dehors(x.xy);   // CARTE ramène déjà l'outre-mer (x.encart)
  const pos = x => horsCadre(x) ? ENCART : x.xy;
  const encart = ls => ls.some(horsCadre) ? `<circle class="mc-encart" cx="${ENCART[0]}" cy="${ENCART[1]}" r="26"/>` : '';
  const pc = ([x, y]) => `left:${((x - BX) / BW * 100).toFixed(2)}%;top:${((y - BY) / BH * 100).toFixed(2)}%`;
  const dist = ([x, y]) => Math.round(Math.hypot(x - R[0], y - R[1]));
  const courbe = x => .2 + (x.l * 7 % 9) / 100;
  const etiquette = x => `${CARTE.nom(x)}${x.dates && x.dates.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
  let nCarte = 0;
  function carte({ lieux = [], passe = [], titre = '', interactif = false, filtre = false, noms = false, prochain = null } = {}) {
    const id = `mc-clip-${++nCarte}`;
    const largeur = x => Math.min(8.5, 2.2 + Math.sqrt(x.n || 1) * 1.4);
    const point = x => {
      const [cx, cy] = pos(x), c = `cx="${cx}" cy="${cy}"`;
      return `<g class="mc-lieu carte-lieu" data-l="${x.l}" data-d="${dist(pos(x))}" style="--s:${(x.l * 37 % 29 / 10).toFixed(1)}s"${interactif ? ` role="button" tabindex="0"${filtre ? ' aria-pressed="false"' : ''} aria-label="${esc(etiquette(x))}"` : ''}>
        <circle class="mc-halo" ${c} r="14"/><circle class="mc-anneau" ${c} r="8"/><circle class="mc-point" ${c} r="3.4"/><circle class="mc-cible" ${c} r="15"/>${interactif ? '' : `<title>${esc(etiquette(x))}</title>`}</g>`;
    };
    return `<div class="mc" style="--ar:${(BW / BH).toFixed(4)}">
      <svg class="mc-svg" viewBox="${CARTE.viewBox}" ${interactif ? 'role="group"' : 'role="img"'} aria-label="${esc(titre)}" focusable="false">
        <defs><clipPath id="${id}"><circle class="mc-clip" cx="${R[0]}" cy="${R[1]}" r="2000"/></clipPath></defs>
        <use href="#m04-voisins" class="mc-voisin"/><use href="#m04-pays" class="mc-pays"/>${encart([...lieux, ...passe])}
        <g clip-path="url(#${id})">
          ${passe.map(x => `<path class="mc-passe" d="${CARTE.bras(pos(x), { w0: 2.3, w1: .45, courbe: courbe(x) })}"/>`).join('')}
          ${lieux.map(x => `<path class="mc-bras" data-l="${x.l}" d="${CARTE.bras(pos(x), { w0: largeur(x), w1: .7, courbe: courbe(x) })}"/>`).join('')}
        </g>
        ${passe.map(x => `<circle class="mc-eteint" data-d="${dist(pos(x))}" cx="${pos(x)[0]}" cy="${pos(x)[1]}" r="2.5"><title>${esc(CARTE.nom(x))}</title></circle>`).join('')}
        <circle class="mc-rouen-halo" cx="${R[0]}" cy="${R[1]}" r="20"/><circle class="mc-rouen" cx="${R[0]}" cy="${R[1]}" r="4.6"/>
        ${lieux.map(point).join('')}
      </svg>
      ${lieux.map(x => `<span class="mc-nom${pos(x)[0] > BX + BW * .5 ? ' g' : ''}${noms ? ' toujours' : ''}${x.l === prochain ? ' prochain' : ''}" data-l="${x.l}" style="${pc(pos(x))}" aria-hidden="true">${esc(CARTE.nom(x))}</span>`).join('')}
      <span class="mc-rouen-nom" style="${pc(R)}" aria-hidden="true">Rouen</span>
    </div>`;
  }
  // les petites cartes des saisons passées
  const miniCarte = code => {
    const ls = CARTE.saison(code);
    return `<svg class="mini" viewBox="${CARTE.viewBox}" aria-hidden="true" focusable="false"><use href="#m04-pays" class="mc-pays"/>${encart(ls)}
      ${ls.map(x => `<path class="mini-bras" d="${CARTE.bras(pos(x), { w0: 4 + Math.sqrt(x.n || 1) * 1.6, w1: 1.2, courbe: courbe(x) })}"/>`).join('')}
      ${ls.map(x => `<circle class="mini-pt" cx="${pos(x)[0]}" cy="${pos(x)[1]}" r="17"/>`).join('')}
      <circle class="mini-rouen" cx="${R[0]}" cy="${R[1]}" r="9"/></svg>`;
  };

  // les bras poussent depuis Rouen quand la carte entre à l'écran ; les communes s'allument quand le bras les atteint
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { io.unobserve(en.target); pousse(en.target); }
  }), { threshold: .2 }) : null;
  function toutAllumer(mc) { mc.classList.remove('attente'); $$('.mc-lieu, .mc-eteint', mc).forEach(p => p.classList.add('allume')); }
  function preparerCartes(zone) {
    if (io) io.disconnect();
    $$('.mc', zone).forEach(mc => {
      if (!io || !mouvement()) return toutAllumer(mc);
      $('.mc-clip', mc).setAttribute('r', '0');
      mc.classList.add('attente');
      io.observe(mc);
    });
  }
  function pousse(mc) {
    const clip = $('.mc-clip', mc), pts = $$('.mc-lieu, .mc-eteint', mc).map(p => ({ p, d: +p.dataset.d, ok: false }));
    const rmax = Math.max(80, ...pts.map(x => x.d)) + 30, T = 1500 + Math.min(700, rmax * 1.4), t0 = performance.now();
    mc.classList.remove('attente'); mc.classList.add('pousse');
    const pas = now => {
      if (!mc.isConnected) return;
      const u = Math.min(1, Math.max(0, (now - t0) / T)), r = rmax * (1 - Math.pow(1 - u, 2.4));
      clip.setAttribute('r', r.toFixed(1));
      pts.forEach(x => { if (!x.ok && x.d <= r + 4) { x.p.classList.add('allume'); x.ok = true; } });
      if (u < 1) requestAnimationFrame(pas); else { clip.setAttribute('r', '2000'); mc.classList.remove('pousse'); toutAllumer(mc); }
    };
    requestAnimationFrame(pas);
  }

  // la carte et sa liste se répondent : survoler une commune met ses dates en avant, la choisir filtre la liste
  function lierZone(zone, naviguer) {
    const mc = $('.mc', zone);
    if (!mc) return null;
    const liste = $('[data-liste]', zone), puces = $('[data-puce]', zone);
    let survole = null, source = '', choisi = null;
    const marque = (l, cls, on) => { if (l !== null) $$(`[data-l="${l}"]`, zone).forEach(n => n.classList.toggle(cls, on)); };
    const survol = (l, src = 'carte') => {
      if (l === survole && src === source) return;
      marque(survole, 'on', false);
      survole = l; source = src;
      marque(l, 'on', true);
      zone.classList.toggle('survol-carte', l !== null && src === 'carte');
      zone.classList.toggle('survol-liste', l !== null && src === 'liste');
    };
    const choix = l => {
      if (naviguer) return naviguer(l);
      marque(choisi, 'choisi', false);
      choisi = choisi === l ? null : l;
      marque(choisi, 'choisi', true);
      $$('.mc-lieu[aria-pressed]', mc).forEach(g => g.setAttribute('aria-pressed', String(+g.dataset.l === choisi)));
      zone.classList.toggle('filtre', choisi !== null);
      if (liste) {
        $$('li[data-l]', liste).forEach(li => { li.hidden = choisi !== null && (li.dataset.l === '' || +li.dataset.l !== choisi); });
        $$('.groupe', liste).forEach(g => { g.hidden = choisi !== null && !g.querySelector('li[data-l]:not([hidden])'); });
      }
      if (puces) {
        puces.innerHTML = choisi === null ? '' : `<button type="button" class="puce" aria-pressed="true">${esc(CARTE.nom(CARTE.lieux[choisi]))}<span aria-hidden="true">×</span></button>`;
        const b = $('button', puces);
        if (b) b.addEventListener('click', () => { choix(choisi); const g = $(`.mc-lieu[data-l="${l}"]`, mc); if (g) g.focus({ preventScroll: true }); });
      }
    };
    CARTE.lier(mc, { survol: l => survol(l, 'carte'), choix });
    if (liste) {
      const de = e => { const li = e.target.closest('li[data-l]'); return li && li.dataset.l !== '' ? +li.dataset.l : null; };
      liste.addEventListener('pointerover', e => survol(de(e), 'liste'));
      liste.addEventListener('pointerleave', () => survol(null, 'liste'));
      liste.addEventListener('focusin', e => survol(de(e), 'liste'));
      liste.addEventListener('focusout', () => survol(null, 'liste'));
    }
    return { choix };
  }

  /* ---------- les vues ---------- */
  function tete({ titre, porte = null, retour = null }) {
    return `<header class="page-hero${porte ? ' salle' : ''}"${porte ? ` style="--acc:${esc(porte.couleur)};--acc-v:${esc(porte.couleurVive)}"` : ''}>
      <div class="wrap">
        ${retour ? `<a class="back" href="${esc(retour.href)}"><span aria-hidden="true">←</span>${esc(retour.texte)}</a>` : ''}
        ${porte ? `<p class="kicker">${porteIco()}<span>${esc(porte.texte)}</span></p>` : ''}
        <h1 class="page-title" tabindex="-1">${esc(titre)}</h1>
      </div>
    </header>`;
  }

  const porte = (p, i) => `<li class="door" style="--v:${esc(p.couleurVive)};--i:${i}">
      <a class="door-link" href="${esc(p.href)}">
        <span class="arche" aria-hidden="true"><span class="arche-lumiere"></span><span class="arche-battant"></span></span>
        <span class="door-bas"><span class="door-label">${esc(p.texte)}</span><span class="door-arr" aria-hidden="true">→</span></span>
      </a>
    </li>`;
  const prochaine = d => {
    const { jour, mois } = decoupe(d.ligneDate);
    return `<li class="pr" data-l="${d.l ?? ''}"><a class="pr-a" href="#/spectacle/${esc(d.slug)}">
      <span class="pr-quand"><span class="pr-jour">${esc(jour)}</span>${mois ? ` <span class="pr-mois">${esc(mois)}</span>` : ''}</span>
      <span class="pr-ou">${esc(d.ligneLieu)}</span><span class="pr-quoi">${esc(d.titre)}</span></a></li>`;
  };
  function accueil() {
    return `<section class="seuil" aria-labelledby="h-accueil">
      <div class="wrap">
        <h1 class="seuil-nom" id="h-accueil" tabindex="-1">${esc(S.nom)}</h1>
        <ul class="doors">${S.portes.map(porte).join('')}</ul>
      </div>
    </section>
    <section class="bande" aria-labelledby="h-saison" data-zone="accueil">
      <div class="wrap bande-grille">
        <div class="bande-tete"><h2 class="bande-titre" id="h-saison">${esc(SAISON0.titre)}</h2></div>
        <div class="bande-carte">${carte({ lieux: CARTE.aVenir(), titre: SAISON0.titre, interactif: true, prochain: DATES[0] ? DATES[0].l : null })}</div>
        <div class="bande-liste">
          <ol class="prochaines" data-liste>${DATES.slice(0, 5).map(prochaine).join('')}</ol>
          <p class="bande-plus"><a class="fleche" href="${esc(MENU.agenda.href)}">${esc(MENU.agenda.texte)}<span aria-hidden="true">→</span></a></p>
        </div>
      </div>
    </section>
    <section class="affiches-s" aria-labelledby="h-tournee">
      <div class="wrap">
        <h2 class="affiches-titre" id="h-tournee">${esc(L.enTournee)}</h2>
        <ul class="affiches">${S.diaporama.map(d => {
          const s = bySlug[d.slug] || {};
          return `<li class="affiche">
            <div class="affiche-photo arche-img">${photo(d.slug, d.titre.join(' '), s.focale)}</div>
            <h3 class="affiche-titre">${d.titre.map(t => `<span>${esc(t)}</span>`).join(' ')}</h3>
            <div class="affiche-bas"><a class="affiche-btn" href="${esc(d.href)}" aria-label="${esc(`${d.bouton} ${d.titre.join(' ')}`)}">${esc(d.bouton)}</a><p class="affiche-credit">${esc(d.credit)}</p></div>
          </li>`;

  function spectacles() {
    return `${tete({ titre: MENU.spectacles.texte })}
    <section class="section"><div class="wrap"><ul class="cartes">${SHOWS.map(s => `<li class="cs" style="--sct:${esc(s.couleurTexteClair)}">
      <div class="cs-photo arche-img">${photo(s.slug, s.titre, s.focale)}</div>
      ${s.statut ? `<p class="cs-etat">${esc(s.statut)}</p>` : s.enTournee ? `<p class="cs-etat">${esc(L.enTournee)}</p>` : ''}
      <h2 class="cs-titre"><a href="#/spectacle/${esc(s.slug)}">${esc(s.titre)}</a></h2>
      ${s.sousTitre ? `<p class="cs-sous">${s.sousTitre}</p>` : ''}
      <p class="cs-creation">${esc(s.creation)}</p>
    </li>`).join('')}</ul></div></section>`;
  }

  const saisonsPassees = () => `<nav class="saisons" aria-label="${esc(L.saison)}"><div class="wrap"><ul class="tuiles">${S.saisons.slice(1).map(x => `<li><a class="tuile" href="${esc(x.href)}"><span class="tuile-carte">${miniCarte(x.saison)}</span><span class="tuile-t">${esc(x.titre)}</span></a></li>`).join('')}</ul></div></nav>`;
  function agenda() {
    return `${tete({ titre: SAISON0.titre, porte: PORTE_DE[MENU.agenda.href] })}
    <div class="split" data-zone="agenda">
      <div class="split-carte"><div class="split-colle">${carte({ lieux: CARTE.aVenir(), titre: SAISON0.titre, interactif: true, filtre: true })}</div></div>
      <div class="split-liste">
        <div class="puce-zone" data-puce aria-live="polite"></div>
        <div data-liste>${parMois(DATES).map(g => `<section class="groupe"><h2 class="mois">${esc(g.m)}</h2><ol>${g.ds.map(d => ligneDate(d)).join('')}</ol></section>`).join('')}</div>
      </div>

  function saison(code) {
    const i = S.saisons.findIndex(x => x.saison === code), info = S.saisons[i], Sd = D.saisons[code];
    const avant = S.saisons[i + 1], apres = S.saisons[i - 1];

    <div class="split" data-zone="saison">

      <div class="split-liste">
        <div class="puce-zone" data-puce aria-live="polite"></div>
        <div data-liste>${Sd.spectacles.map(g => `<section class="groupe sp">
          <h2 class="sp-titre">${g.slug && bySlug[g.slug] ? `<a href="#/spectacle/${esc(g.slug)}">${esc(g.titre)}</a>` : esc(g.titre)}</h2>
          ${g.sousTitre ? `<p class="sp-sous">${g.sousTitre}</p>` : ''}
          ${g.creation ? `<p class="sp-creation">${esc(g.creation)}</p>` : ''}
          <ul class="sls">${g.dates.map(ligneSaison).join('')}</ul>
        </section>`).join('')}</div>
        <nav class="saison-nav" aria-label="${esc(L.saison)}">
          ${avant ? `<a class="fleche" href="${esc(avant.href)}"><span aria-hidden="true">←</span>${esc(avant.titre)}</a>` : '<span></span>'}
          ${apres ? `<a class="fleche" href="${esc(apres.href)}">${esc(apres.titre)}<span aria-hidden="true">→</span></a>` : ''}
        </nav>
      </div>
    </div>`;
  }

  function medias(ms, s) {
    if (!ms || !ms.length) return '';
    const lien = m => `<a href="${esc(m.url)}"><span class="media-ico" aria-hidden="true">${m.type === 'audio' ? '♪' : '▶'}</span><span>${esc(m.titre || s.titre)}</span><span class="ext" aria-hidden="true">↗</span></a>`;
    const out = [];
    ms.forEach(m => {
      if (!m.groupe) { out.push(`<li class="media">${lien(m)}${m.par ? `<p class="media-par">${esc(m.par)}</p>` : ''}</li>`); return; }
      let g = out.groupes && out.groupes[m.groupe];
      if (!g) { out.groupes = out.groupes || {}; g = out.groupes[m.groupe] = []; out.push(g); }
      g.push(m);
    });
    return `<ul class="medias">${out.map(x => typeof x === 'string' ? x : `<li class="media-groupe"><p class="media-groupe-t">${esc(x[0].groupe)}</p><ul>${x.map(m => `<li><a href="${esc(m.url)}"><span aria-hidden="true">▶</span>${esc(m.titre)}</a></li>`).join('')}</ul></li>`).join('')}</ul>`;
  }
  function spectacle(s) {
    const aVenir = DATES.filter(d => d.slug === s.slug), sp = CARTE.spectacle(s.slug);
    const etat = s.statut || (s.enTournee ? L.enTournee : '');
    const T = s.tournee || {};
    let tournee = '';
    if (aVenir.length) {
      tournee = `<section class="split" data-zone="spectacle" aria-labelledby="h-tournee">
        <div class="split-carte"><div class="split-colle">${carte({ lieux: sp.aVenir, passe: sp.passe, titre: T.titre || L.actuellementEnTournee, interactif: true, filtre: true, noms: sp.aVenir.length <= 5 })}</div></div>
        <div class="split-liste"><h2 class="split-titre" id="h-tournee">${esc(T.titre || L.actuellementEnTournee)}</h2><div class="puce-zone" data-puce aria-live="polite"></div><ol data-liste>${aVenir.map(d => ligneDate(d, false)).join('')}</ol></div>
      </section>`;
    } else if (s.statut || T.texte) {
      tournee = `<section class="split" aria-labelledby="h-tournee">
        <div class="split-carte"><div class="split-colle">${carte({ titre: s.titre })}</div></div>
        <div class="split-liste"><h2 class="split-titre" id="h-tournee">${esc(T.titre)}</h2>${T.texte ? `<p class="split-texte">${esc(T.texte)}</p>` : ''}</div>
      </section>`;
    } else if (sp.passe.length) {
      tournee = `<section class="bande-seule"><div class="wrap">${carte({ passe: sp.passe, titre: s.titre })}</div></section>`;
    }
    return `<article class="show">
      <header class="show-hero" style="--sc:${esc(s.couleur)}">
        <div class="wrap">
          <a class="back" href="${esc(MENU.spectacles.href)}"><span aria-hidden="true">←</span>${esc(MENU.spectacles.texte)}</a>
          <div class="show-hero-grille">
            <div>
              ${etat ? `<p class="show-etat">${esc(etat)}</p>` : ''}
              <h1 class="show-title" tabindex="-1">${(s.titreLignes || [s.titre]).map(t => `<span>${esc(t)}</span>`).join(' ')}</h1>
              ${s.creation ? `<p class="show-creation">${esc(s.creation)}</p>` : ''}
              ${s.genre ? `<p class="show-sub">${esc(s.genre)}</p>` : s.sousTitre ? `<p class="show-sub">${s.sousTitre}</p>` : ''}
              ${s.cadre ? `<p class="show-cadre">${esc(s.cadre)}</p>` : ''}
            </div>
            <figure class="show-photo"><div class="arche-img">${photo(s.slug, s.titre, s.focale)}</div>${s.credit ? `<figcaption>${esc(s.credit)}</figcaption>` : ''}</figure>
          </div>
        </div>
      </header>
      <div class="wrap show-corps" style="--sct:${esc(s.couleurTexteClair)}">
        <div>
          <div class="prose show-prose">${(s.texte || []).map(bloc).join('')}</div>
          ${s.extraits && s.extraits.length ? `<ul class="extraits">${s.extraits.map(x => `<li><blockquote><p>${esc(x.citation)}</p></blockquote><p class="extrait-src">${esc(x.source)}</p></li>`).join('')}</ul>` : ''}
          ${medias(s.medias, s)}
        </div>
        <aside class="show-fiche">
          ${s.fiche && s.fiche.length ? `<ul class="fiche">${s.fiche.map(f => `<li>${f.libelle ? `<span class="fiche-l">${esc(f.libelle)}</span> ` : ''}<span>${f.valeur}</span></li>`).join('')}</ul>` : ''}
          ${s.avec ? `<p class="avec"><span class="fiche-l">${esc(s.avec.libelle)}</span> ${s.avec.valeur}</p>` : ''}
          ${s.duree ? `<p class="duree">${esc(s.duree)}</p>` : ''}
          ${(s.mentions || []).map(m => `<p class="mention">${m}</p>`).join('')}
          ${s.production && s.production.length ? `<div class="production">${s.production.map(bloc).join('')}</div>` : ''}
        </aside>
      </div>
      ${tournee}
    </article>`;
  }

  function compagnie() {
    const C = S.compagnie;
    const lien = d => { const s = SHOWS.filter(x => String(x.annee) === String(d.annee)); return s.length === 1 ? `<a href="#/spectacle/${esc(s[0].slug)}">${esc(d.titre)}</a>` : esc(d.titre); };
    return `${tete({ titre: C.titre })}
    <section class="section"><div class="wrap"><div class="prose cie">${C.paragraphes.map(bloc).join('')}</div></div></section>
    <section class="frise-s" aria-labelledby="h-dates"><div class="wrap">
      <h2 class="frise-titre" id="h-dates">${esc(C.datesTitre)}</h2>
      <ol class="frise">${C.dates.map(d => `<li><span class="frise-an">${esc(d.annee)}</span><span class="frise-pt" aria-hidden="true"></span><span class="frise-t">${lien(d)}</span></li>`).join('')}</ol>
    </div></section>`;
  }

  function actions() {
    const A = S.actions;
    return `${tete({ titre: A.titre, porte: PORTE_DE[MENU.actions.href] })}
    <section class="section" style="--acc:${esc((PORTE_DE[MENU.actions.href] || {}).couleur || '')}"><div class="wrap actions">
      <figure class="actions-photo"><div class="arche-img">${photo('actions-culturelles', A.titre)}</div>${A.credit ? `<figcaption>${esc(A.credit)}</figcaption>` : ''}</figure>
      <div class="prose">${A.blocs.map(bloc).join('')}</div>
    </div></section>`;
  }

  function pro() {
    const P = S.pro, p = PORTE_DE[MENU.pro.href] || S.portes[1];
    return `${tete({ titre: P.titre, porte: p })}
    <section class="section"><div class="wrap pro" style="--v:${esc(p.couleur)};--lv:${esc(p.couleurVive)};--acc:${esc(p.couleur)}">
      <span class="arche" aria-hidden="true"><span class="arche-lumiere"></span><span class="arche-battant"></span></span>
      <form class="pro-form">
        <p>${esc(P.texte)}</p>
        <label for="pro-mdp">${esc(P.champ)}</label>
        <div class="pro-ligne"><input id="pro-mdp" name="post_password" type="password" autocomplete="current-password"><button class="btn" type="submit">${esc(P.bouton)}</button></div>
      </form>
    </div></section>`;
  }

  function contact() {
    const C = S.contact, K = S.coordonnees, n = C.champs.length;
    const types = ['text', 'email', 'tel', 'text'], auto = ['name', 'email', 'tel', 'address-level2'];
    const champ = (label, i) => i === n - 1
      ? `<div class="champ large"><label for="c-${i}">${esc(label)}</label><textarea id="c-${i}" name="c-${i}"></textarea></div>`
      : `<div class="champ"><label for="c-${i}">${esc(label)}</label><input id="c-${i}" name="c-${i}" type="${types[i] || 'text'}" autocomplete="${auto[i] || 'off'}"></div>`;
    const m = C.consentement.match(/politique de confidentialité/i), pol = S.liensLegaux.find(x => /confidentialit/i.test(x.href)) || S.liensLegaux[1];
    const consent = m ? `${esc(C.consentement.slice(0, m.index))}<a href="${esc(pol.href)}">${esc(m[0])}</a>${esc(C.consentement.slice(m.index + m[0].length))}` : esc(C.consentement);
    return `${tete({ titre: C.titre })}
    <section class="section"><div class="wrap contact">
      <form class="form">
        ${C.champs.map(champ).join('')}
        <div class="consent"><input type="checkbox" id="c-ok" name="c-ok"><label for="c-ok">${consent}</label></div>
        <div class="calcul"><label for="c-calc">${esc(C.calcul)}</label><input id="c-calc" name="c-calc" inputmode="numeric" maxlength="2"></div>
        <p class="envoi"><button class="btn" type="submit">${esc(C.bouton)}</button></p>
      </form>
      <aside class="coord">
        <p class="coord-nom">${esc(K.nom)}</p>
        <p class="coord-adr">${K.adresse.map(esc).join('<br>')}</p>
        <p class="coord-legal">${K.legal.map(esc).join('<br>')}</p>
        <p class="coord-fb">${S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : esc(S.facebook.texte)}</p>
      </aside>
    </div></section>`;
  }

  const legal = cle => {
    const G = S.legal[cle];
    return `${tete({ titre: G.titre })}<section class="section"><div class="wrap"><div class="prose">${G.blocs.map(bloc).join('')}</div></div></section>`;
  };

  function pied() {
    const K = S.coordonnees;
    return `<div class="wrap">
      <ul class="pied-portes">${S.portes.map(p => `<li><a href="${esc(p.href)}" style="--v:${esc(p.couleurVive)}">${porteIco()}<span>${esc(p.texte)}</span></a></li>`).join('')}</ul>
      <div class="pied-grille">
        <a class="pied-logo" href="#/" aria-label="${esc(S.accueil)}">${logo()}</a>
        <div><p class="pied-nom">${esc(K.nom)}</p><p class="pied-adr">${K.adresse.map(esc).join('<br>')}</p></div>
        <div><p><a class="pied-ecrire" href="${esc(S.ecrire.href)}">${esc(S.ecrire.texte)}</a></p><p class="pied-fb">${S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : esc(S.facebook.texte)}</p></div>
        <div class="pied-part"><p>${S.partenaires}</p></div>
      </div>
      <div class="pied-bas">
        <ul class="pied-legal">${K.legal.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <ul class="pied-liens">${S.liensLegaux.map(x => `<li><a href="${esc(x.href)}">${esc(x.texte)}</a></li>`).join('')}</ul>
      </div>
    </div>`;
  }

  /* ---------- le routeur ---------- */
  const FN = { spectacles, agenda, compagnie, actions, pro, contact };
  const VUES = { '': { vue: 'accueil', titre: S.accueil, html: accueil } };
  S.menu.forEach(m => { VUES[chemin(m.href)] = { vue: m.id, titre: m.id === 'pro' ? S.pro.titrePage : m.texte, onglet: m.id, html: FN[m.id] }; });
  S.liensLegaux.forEach(x => { const c = chemin(x.href); if (S.legal[c]) VUES[c] = { vue: 'legal', titre: S.legal[c].titre, html: () => legal(c) }; });

  function route() {
    let brut = location.hash.replace(/^#\/?/, '');
    try { brut = decodeURIComponent(brut); } catch (e) { /* adresse brute */ }
    const [ch, qs] = brut.split('?'), q = new URLSearchParams(qs || ''), c = ch.replace(/\/$/, '');
    const mS = /^spectacle\/([^/]+)$/.exec(c), mA = /^agenda\/([^/]+)$/.exec(c);
    let v;
    if (mS && bySlug[mS[1]]) { const s = bySlug[mS[1]]; v = { vue: 'spectacle', titre: s.titre, onglet: 'spectacles', top: s.fondSombre, html: () => spectacle(s) }; }
    else if (mA && mA[1] === SAISON0.saison) v = VUES[chemin(MENU.agenda.href)];
    else if (mA && D.saisons[mA[1]] && S.saisons.some(x => x.saison === mA[1])) { const x = S.saisons.find(y => y.saison === mA[1]); v = { vue: 'saison', titre: x.titre, onglet: 'agenda', html: () => saison(mA[1]) }; }
    else if (Object.prototype.hasOwnProperty.call(VUES, c)) v = VUES[c];
    else { v = VUES['']; try { history.replaceState(null, '', '#/'); } catch (e) { /* adresse inchangée */ } }

    closeMenu();
    root.style.setProperty('--top', v.top || 'var(--aub)');
    root.dataset.vue = v.vue;
    main.innerHTML = v.html(q);
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    $$('#site-nav a').forEach(a => { if (v.onglet && a.dataset.onglet === v.onglet) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $$('a[href^="http"]', main).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    $$('form', main).forEach(f => f.addEventListener('submit', e => e.preventDefault()));
    preparerCartes(main);
    $$('[data-zone]', main).forEach(z => {
      const lien = z.dataset.zone === 'accueil' ? l => { location.hash = `${MENU.agenda.href}?l=${l}`; } : null;
      const ctl = lierZone(z, lien);
      const l = q.get('l');
      if (ctl && z.dataset.zone === 'agenda' && l !== null && $(`.mc-lieu[data-l="${+l}"]`, z)) ctl.choix(+l);
    });
    main.classList.remove('entre'); void main.offsetWidth; main.classList.add('entre');
    window.scrollTo(0, 0);
    const h1 = $('h1', main);
    if (h1) h1.focus({ preventScroll: true });
  }

  const closeMenu = () => { header.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded', 'false'); };
  menuBtn.addEventListener('click', () => {
    const open = !header.classList.contains('nav-open');
    header.classList.toggle('nav-open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
  });
  $('#site-nav').addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && header.classList.contains('nav-open')) { closeMenu(); menuBtn.focus(); } });
  document.addEventListener('click', e => {
    if (header.classList.contains('nav-open') && !header.contains(e.target)) closeMenu();
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href === '#main') { e.preventDefault(); main.focus({ preventScroll: true }); main.scrollIntoView(); }
    else if (href === location.hash || (href === '#/' && !location.hash)) { e.preventDefault(); route(); }
  });

  /* ---------- la mise en place ---------- */
  const portes = S.portes;
  root.style.setProperty('--rose', portes[0].couleur);
  root.style.setProperty('--rose-v', portes[0].couleurVive);
  document.body.insertAdjacentHTML('afterbegin', `<svg class="defs" aria-hidden="true" focusable="false"><defs>
    <path id="m04-pays" d="${CARTE.fond.pays}" vector-effect="non-scaling-stroke"/>
    <g id="m04-voisins"><path d="${CARTE.fond.belgique}" vector-effect="non-scaling-stroke"/><path d="${CARTE.fond.luxembourg}" vector-effect="non-scaling-stroke"/></g>
    <radialGradient id="m04-bras" gradientUnits="userSpaceOnUse" cx="${R[0]}" cy="${R[1]}" r="470"><stop offset="0" stop-color="${esc(portes[0].couleurVive)}"/><stop offset=".16" stop-color="#fbcfe3"/><stop offset=".5" stop-color="#fff0f6"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
    <radialGradient id="m04-lueur"><stop offset="0" stop-color="#ffffff"/><stop offset=".26" stop-color="#ffeaf4" stop-opacity=".62"/><stop offset="1" stop-color="#ffd3e8" stop-opacity="0"/></radialGradient>
    <radialGradient id="m04-lueur-rose"><stop offset="0" stop-color="${esc(portes[0].couleurVive)}" stop-opacity=".75"/><stop offset="1" stop-color="${esc(portes[0].couleurVive)}" stop-opacity="0"/></radialGradient>
  </defs></svg>`);
  const brand = $('.brand');
  brand.innerHTML = logo();
  brand.setAttribute('aria-label', S.accueil);
  $('.menu-txt').textContent = L.menu;
  $('#site-nav').setAttribute('aria-label', L.menu);
  $('#site-nav ul').innerHTML = S.menu.map(m => { const p = PORTE_DE[m.href]; return `<li><a href="${esc(m.href)}" data-onglet="${esc(m.id)}"${p ? ` style="--tab:${esc(p.couleurVive)}"` : ''}>${esc(m.texte)}</a></li>`; }).join('');
  $('.site-footer').innerHTML = pied();
  window.addEventListener('hashchange', route);
  route();

  // l'ouverture : le logo blanc sur un dégradé prune ; les trois portes apparaissent à travers lui, puis s'entrouvrent
  INTRO.ouvrir({
    degrade: [[0, '#5d2149'], [.5, '#38122e'], [1, '#1d0b18']],
    encre: '#ffffff',
    classe: 'intro-m04',
    apres: () => {
      const d = $('.doors', main);
      if (!d || !mouvement()) return;
      d.classList.remove('salut'); void d.offsetWidth; d.classList.add('salut');
    },
  });
})();
</script>
</body>
</html>
