  // d'un onglet à l'autre d'un spectacle : les vantaux ne jouent pas ; le corps paraît sous l'en-tête qui reste
  function corpsParait() {
    const c = $('.show-corps-fond', main);
    if (c && c.animate && mouvement()) c.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 260, delay: 40, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'backwards' });
  }

  /* ---------- la navigation : le genre de chaque passage (une entrée, un spectacle, un onglet, le retour, une page) ---------- */
  const pile = [];
  let dernierClic = null, vueCourante = null, couleurCourante = null;
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (a) dernierClic = { a, t: performance.now() }; }, { capture: true, passive: true });
  const cheminCourant = () => { let h = location.hash.replace(/^#\/?/, ''); try { h = decodeURIComponent(h); } catch (e) { /* brute */ } return h.split('?')[0].replace(/\/$/, ''); };
  function genre(c) {
    const h = '#/' + c, retour = pile.length > 1 && pile[pile.length - 2] === h;
    if (retour) pile.pop(); else if (pile[pile.length - 1] !== h) pile.push(h);
    if (pile.length > 60) pile.splice(0, pile.length - 60);
    const sp = c.match(/^spectacle\/([^/]+)\//);
    if (sp && vueCourante && vueCourante.startsWith(`spectacle/${sp[1]}/`)) return 'onglet';
    if (retour) return 'retour';
    if (/^spectacle\//.test(c)) return 'spectacle';
    return (X.S.menu || []).some(m => chemin(m.href) === c) || /^espace-pro\//.test(c) ? 'entree' : 'page';
  }
  // l'élément partagé : l'arche de la carte ou de la porte cliquée (elle devient celle de la page)
  const partage = a => { if (!a) return null; const n = a.closest('[data-mv-nom]') || (a.closest('.uc, .fp, .door') || a).querySelector('[data-mv-nom]'); return n && main.contains(n) ? n : null; };
  // l'arche cliquée vole jusqu'à sa place dans la page : une copie de son image part de la carte (ou de la porte) et se pose
  // sur l'arche de la page (transform seul, au-dessus des vantaux) ; un nouveau geste l'arrête
  let vol = null, tours = 0;
  function archeVole(de, cible) {
    if (vol) { try { vol.cancel(); } catch (e) { /* fini */ } vol = null; }
    const im = cible && cible.querySelector('img');
    if (!im || !de || !de.width || !document.body.animate) return;
    const a = cible.getBoundingClientRect();
    if (!a.width || !a.height || a.bottom < 0 || a.top > innerHeight) return;
    const x = document.createElement('img');
    x.src = im.currentSrc || im.src; x.alt = ''; x.className = 'arche-vole'; x.setAttribute('aria-hidden', 'true');
    x.style.cssText = `left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;border-radius:${getComputedStyle(cible).borderRadius};object-position:${im.style.objectPosition || '50% 50%'}`;
    document.body.appendChild(x);
    cible.style.visibility = 'hidden';
    const fin = () => { x.remove(); cible.style.visibility = ''; if (vol === anim) vol = null; };
    const anim = x.animate([{ transform: `translate(${(de.left - a.left).toFixed(1)}px, ${(de.top - a.top).toFixed(1)}px) scale(${(de.width / a.width).toFixed(4)}, ${(de.height / a.height).toFixed(4)})` }, { transform: 'none' }],
      { duration: 420, easing: 'cubic-bezier(.3,.7,.12,1)' });
    anim.onfinish = fin; anim.oncancel = fin;
    vol = anim;
  }
  // d'un onglet à l'autre d'un spectacle : la porte allumée glisse de l'ancien onglet au nouveau
  function ongletGlisse(oa, t) {
    if (!t || !t.animate) return;
    const dx = oa.left - t.getBoundingClientRect().left;
    if (Math.abs(dx) > 1) t.animate([{ transform: `translateX(${dx.toFixed(1)}px)` }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.3,.7,.12,1)' });
  }
  function route() {
    LF = innerWidth;
    lire();
    const r = resoudre();
    if (r.aller) { location.replace(r.aller); return; }
    if (r.cle) retenir(r.cle);
    const c = cheminCourant(), premiere = !vueCourante;
    const type = premiere ? 'premiere' : genre(c);
    if (premiere) pile.push('#/' + c);
    const clic = dernierClic && performance.now() - dernierClic.t < 1200 ? dernierClic : null;
    dernierClic = null;
    const anime = !premiere && !!MV && mouvement() && !INTRO.ouverte();
    const depuis = anime && (type === 'entree' || type === 'spectacle') ? partage(clic && clic.a) : null;
    const nom = depuis ? depuis.getAttribute('data-mv-nom') : null, de = depuis ? depuis.getBoundingClientRect() : null;
    const ongletAvant = anime && type === 'onglet' ? $('.show-tab.on', main) : null, oa = ongletAvant ? ongletAvant.getBoundingClientRect() : null;
    const portes = type === 'retour' ? couleurCourante : couleursDe(r.v);
    const tour = ++tours;
    const faire = () => {
      if (tour !== tours) return;   // un geste plus récent l'a emporté
      rendre(r.v, r.q, false);
      vueCourante = c; couleurCourante = couleursDe(r.v);
      if (type === 'onglet') corpsParait();
      // après la remontée et le focus de la vue (rendre), à la même image : l'arche vole, la porte allumée glisse
      if (de || oa) requestAnimationFrame(() => {
        if (tour !== tours) return;
        if (de) archeVole(de, $(`[data-mv-nom="${CSS.escape(nom)}"]`, main));
        if (oa) ongletGlisse(oa, $('.show-tab.on', main));
      });
    };
    // la première vue (et sous l'ouverture) : tout de suite ; ensuite les vantaux partent dès l'image du geste et la page se pose
    // dessous à la tâche suivante (plus de View Transition : elle tenait la page dans une seule longue tâche avant toute image)
    if (!anime) { faire(); return; }
    battants(type, portes);
    requestAnimationFrame(() => setTimeout(faire, 0));
  }
  // D a changé (la base de la compagnie) : la vue courante est refaite en place
  let rafraichirPlusTard = 0;
  function rafraichir() {
    clearTimeout(rafraichirPlusTard);
    if (LC && LC.actif()) { rafraichirPlusTard = setTimeout(rafraichir, 2500); return; }
    versionD++;
    lire();
    habiller();
    const r = resoudre();
    if (r.aller) { location.replace(r.aller); return; }
    rendre(r.v, r.q, true);
  }

  // « Modifier le site » : la connexion puis l'édition sur place (EDITION, commun aux maquettes)
  $('.site-footer').addEventListener('click', e => { if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') EDITION.ouvrir(); });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href.length > 1 && !href.startsWith('#/')) {          // une ancre dans la page (le sommaire, l'évitement)
      const cible = document.getElementById(href.slice(1));
      if (cible) { e.preventDefault(); cible.scrollIntoView({ behavior: mouvement() ? 'smooth' : 'auto', block: 'start' }); cible.focus({ preventScroll: true }); }
      return;
    }
    if (href === location.hash || (href === '#/' && !location.hash)) { e.preventDefault(); route(); }
  });
  const salut = () => { const d = $('.doors', main); if (!d || !mouvement()) return; d.classList.remove('salut'); requestAnimationFrame(() => d.classList.add('salut')); };

  /* ---------- les vidéos (règle 18) : à leur arrivée, deux vantaux noirs s'ouvrent sur l'écran (ils partent quand le lecteur est
     chargé) ; la page s'éteint d'un fondu posé autour de la vidéo, se rallume plus vite ; moins d'animations : sans ---------- */
  if (LC) LC.regler({ univers: s => (s && X && X.U[s.slug] ? uStyle(X.U[s.slug]) : ''), effet: {
    arrivee: (fig, ifr) => {
      const cadre = $('.lc-cadre', fig);
      if (!mouvement() || !cadre) return;
      const v = document.createElement('span');
      v.className = 'lc-vantaux'; v.setAttribute('aria-hidden', 'true'); v.innerHTML = '<i></i><i></i>';
      cadre.appendChild(v);
      let parti = false;
      const fin = () => v.remove(), ouvrir = () => { if (parti) return; parti = true; v.classList.add('ouvre'); v.addEventListener('animationend', fin, { once: true }); setTimeout(fin, 900); };
      ifr.addEventListener('load', ouvrir, { once: true });
      setTimeout(ouvrir, 1400);
    },
    eteindre: voile => (mouvement() && voile.animate ? voile.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.32,.6,.16,1)' }) : null),
    rallumer: voile => (mouvement() && voile.animate ? voile.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: 'ease-in' }).finished : null),
  } });

  /* ---------- la mise en place ---------- */
  // les tentacules : aucun moment dans cette maquette (la porte est son seul geste) ; aucun écouteur, rien ne joue sur un clic
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ clic: false, pages: false });
  // la pression : la porte cède sous la main, dès le pointerdown
  if (MV) MV.presse(document);
  lire();
  habiller();
  window.addEventListener('hashchange', route);
  route();
  // l'agenda passé et tous les lieux : calculés d'avance, quand le navigateur est libre (le geste n'a plus qu'à les lire)
  const davance = () => { lire(); retenu('agendaPasse', agendaPasse); retenu('tout', () => CARTE.tout()); };
  if ('requestIdleCallback' in window) requestIdleCallback(davance, { timeout: 1500 }); else setTimeout(davance, 600);
  if (typeof DONNEES !== 'undefined' && DONNEES.surChangement) DONNEES.surChangement(rafraichir);

  // l'ouverture : le logo blanc sur un dégradé prune ; les trois portes apparaissent à travers lui, puis s'entrouvrent
  INTRO.ouvrir({
    degrade: [[0, '#5d2149'], [.5, '#38122e'], [1, '#1d0b18']],
    encre: '#ffffff',
    classe: 'intro-m04',
    apres: salut,
  });
})();
</script>
