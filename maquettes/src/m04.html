  // les bras poussent depuis Rouen quand la carte entre à l'écran ; les communes s'allument quand le bras les atteint
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { io.unobserve(en.target); pousse(en.target); }
  }), { threshold: .2 }) : null;
  function toutAllumer(mc) { mc.classList.remove('attente', 'pousse'); const c = $('.mc-clip', mc); if (c) c.setAttribute('r', '2000'); $$('.mc-lieu, .mc-eteint', mc).forEach(p => p.classList.add('allume')); }
  function preparerCartes(zone, immediat) {
    if (io) io.disconnect();
    $$('.mc', zone).forEach(mc => {
      if (immediat || !io || !mouvement()) return toutAllumer(mc);
      const c = $('.mc-clip', mc); if (c) c.setAttribute('r', '0');
      mc.classList.add('attente');
      io.observe(mc);
    });
  }
  function pousse(mc) {
    if (mc.classList.contains('leger')) { mc.classList.remove('attente'); mc.classList.add('parait'); return; }
    const clip = $('.mc-clip', mc), pts = $$('.mc-lieu, .mc-eteint', mc).map(p => ({ p, d: +p.dataset.d, ok: false }));
    const rmax = Math.max(80, ...pts.map(x => x.d)) + 30, T = 1500 + Math.min(700, rmax * 1.4), t0 = performance.now();
    mc.classList.remove('attente'); mc.classList.add('pousse');
    const pas = now => {
      if (!mc.isConnected) return;
      const u = Math.min(1, Math.max(0, (now - t0) / T)), r = rmax * (1 - Math.pow(1 - u, 2.4));
      clip.setAttribute('r', r.toFixed(1));
      pts.forEach(x => { if (!x.ok && x.d <= r + 4) { x.p.classList.add('allume'); x.ok = true; } });
      if (u < 1) requestAnimationFrame(pas); else toutAllumer(mc);
    };
    requestAnimationFrame(pas);
  }

  // les communes d'une carte (.carte-lieu[data-l]) : survol, focus, clic, Entrée, par délégation (comme CARTE.lier, en un seul jeu)
  function lierCarte(racine, { survol = () => {}, choix = () => {} } = {}) {
    const lieu = e => { const g = e.target.closest && e.target.closest('.carte-lieu[data-l]'); return g && racine.contains(g) ? g : null; };
    let dessus = null;
    racine.addEventListener('pointerover', e => { const g = lieu(e); if (g && g !== dessus) { dessus = g; survol(+g.dataset.l); } }, { passive: true });
    racine.addEventListener('pointerout', e => { const g = lieu(e); if (g && !(e.relatedTarget && g.contains(e.relatedTarget))) { dessus = null; survol(null); } }, { passive: true });
    racine.addEventListener('focusin', e => { const g = lieu(e); if (g) survol(+g.dataset.l); });
    racine.addEventListener('focusout', e => { if (lieu(e)) survol(null); });
    racine.addEventListener('click', e => { const g = lieu(e); if (g) choix(+g.dataset.l); });
    racine.addEventListener('keydown', e => { const g = lieu(e); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); choix(+g.dataset.l); } });
  }
  // la carte et sa liste se répondent : survoler une commune met ses dates en avant, la choisir filtre la liste
  const choixZones = {};   // la commune choisie sur chaque carte, gardée quand la vue est refaite en place
  function lierZone(zone, { naviguer = null, detail = null, ecoute = null } = {}) {
    const mc = $('.mc', zone);
    if (!mc) return null;
    const type = zone.dataset.zone || '', liste = $('[data-liste]', zone), puces = $('[data-puce]', zone);
    let survole = null, source = '', choisi = null;
    const marque = (l, cls, on) => { if (l !== null) $$(`[data-l="${l}"]`, zone).forEach(n => n.classList.toggle(cls, on)); };
    const survol = (l, src = 'carte') => {
      if (l === survole && src === source) return;
      marque(survole, 'on', false);
      survole = l; source = src;
      marque(l, 'on', true);
      zone.classList.toggle('survol-carte', l !== null && src === 'carte');
      zone.classList.toggle('survol-liste', l !== null && src !== 'carte');
      if (detail && l !== null) detail(l);
      if (ecoute && src !== 'frise') ecoute(l);   // la frise de la zone répond (allume les repères de la commune)
    };
    const choix = l => {
      if (naviguer) return naviguer(l);
      if (detail) return detail(l);
      marque(choisi, 'choisi', false);
      choisi = choisi === l ? null : l;
      choixZones[type] = choisi;
      marque(choisi, 'choisi', true);
      $$('.mc-lieu[aria-pressed]', mc).forEach(g => g.setAttribute('aria-pressed', String(+g.dataset.l === choisi)));
      zone.classList.toggle('filtre', choisi !== null);
      if (liste) {
        $$('li[data-l]', liste).forEach(li => { li.hidden = choisi !== null && (li.dataset.l === '' || +li.dataset.l !== choisi); });
        $$('.groupe', liste).forEach(g => { g.hidden = choisi !== null && !g.querySelector('li[data-l]:not([hidden])'); });
      }
      if (puces) {
        const lieu = choisi === null ? null : CARTE.lieux[choisi];
        puces.innerHTML = lieu ? `<button type="button" class="puce" aria-pressed="true">${esc(CARTE.nom(lieu))}<span aria-hidden="true">×</span></button>` : '';
        const b = $('button', puces);
        if (b) b.addEventListener('click', () => { choix(choisi); const g = $(`.mc-lieu[data-l="${l}"]`, mc); if (g) g.focus({ preventScroll: true }); });
      }
    };
    lierCarte(mc, { survol: l => survol(l, 'carte'), choix });
    if (liste) {
      const de = e => { const li = e.target.closest('li[data-l]'); return li && li.dataset.l !== '' ? +li.dataset.l : null; };
      liste.addEventListener('pointerover', e => survol(de(e), 'liste'));
      liste.addEventListener('pointerleave', () => survol(null, 'liste'));
      liste.addEventListener('focusin', e => survol(de(e), 'liste'));
      liste.addEventListener('focusout', () => survol(null, 'liste'));
    }
    // montrer : une commune allumée depuis la frise (sans lui répondre en retour)
    return { choix, montrer: l => survol(l, 'frise') };
  }

  // le dossier du spectacle en PDF, composé à la demande (dossier.js) : pendant ce temps le bouton est occupé (aria-busy), puis il redevient actif
  const OCCUPES = new Set();
  const dossierBouton = (slug, cls = 'u-btn') => `<button type="button" class="${cls} dos-bt" data-dossier="${esc(slug)}"${OCCUPES.has(slug) ? ' aria-busy="true" disabled' : ''}>${PORTE}<span>${esc(X.L.dossierPdf)}</span></button>`;

  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;

  const portrait = ({ e, p, lignes }, credits) => {

      ...(encours ? encours.rows.filter(r => !r.suite && !r.d.scolaire && garde(r)).map(r => repereLigne(r.d, D.saison, r.i, r.g.slug, r.titre)).filter(Boolean) : [])];
    // la frise des saisons : chaque saison et sa densité (les dates que le filtre garde)
    const bandesSaisons = () => passe.slice().reverse().map(s => bandeSaison(s.k, s.rows.filter(garde).length));
    AG = { F };

      const majCarte = () => {

      // filtrer, chercher : la liste et la frise de la saison glissent à leur nouvelle place dans l'image du geste (FLIP) ;
      // l'agenda passé, sous le pli, suit dans la tâche d'après l'image, ses saisons glissant depuis l'endroit où elles sont
      const dessine = (anime = true) => {
        const faire = () => { recompte(); liste.innerHTML = listeProchaines(); majOutils(); };

        // la carte et la frise de la saison suivent à l'image d'après (le geste se peint d'abord) ; l'agenda passé, sous le pli,

        const carteFrise = () => { if (!liste.isConnected) return; majCarte(); if (fSaison) fSaison.maj({ points: reperesSaison() }); };

        if (!anime) { carteFrise(); saisons(); return; }
        if (!suiteCF) { suiteCF = true; requestAnimationFrame(() => setTimeout(() => { suiteCF = false; carteFrise();
          if (!suiteS) { suiteS = true; setTimeout(() => { suiteS = false; saisons(); }, 0); } }, 0)); }
      };
      AG.choisir = l => { F.l = F.l === l ? null : l; dessine(); };
      // l'état d'ouverture : à la main (toggle), par l'index ou par la frise des saisons ; les dates arrivent en cascade
      const remplir = dt => {
        const k = dt.dataset.saison, s = passe.find(x => x.k === k), c = $('.sai-corps', dt);

        const rows = s.rows.filter(garde);
        c.innerHTML = corpsSaison(s, rows, lieuxDe(s, rows));
        lierSaison(c, false);
        return true;
      };
      const deplier = dt => { const c = $('.sai-liste', dt); if (c && MV) MV.cascade(c, { selecteur: '.mois, .dl', max: 12, pas: 26, decalage: -8 }); };
      const ouvrirSaison = k => {
        const dt = $(`#sai-${CSS.escape(k)}`, racine); if (!dt) return;
        if (!dt.open) { dt.open = true; F.ouv.add(k); if (remplir(dt)) deplier(dt); }
        dt.scrollIntoView({ behavior: mouvement() ? 'smooth' : 'auto', block: 'start' });
      };
      racine.addEventListener('toggle', ev => {
        const dt = ev.target; if (!dt.matches || !dt.matches('details.sai')) return;
        const k = dt.dataset.saison;
        if (dt.open) { F.ouv.add(k); if (remplir(dt)) deplier(dt); } else { F.ouv.delete(k); const c = $('.sai-corps', dt); if (c) { $$('.mc', c).forEach(m => io && io.unobserve(m)); c.innerHTML = ''; } }

      index.addEventListener('click', ev => {
        const b = ev.target.closest('button'); if (!b) return;
        if (b.classList.contains('idx-tout')) { F.ouv = b.getAttribute('aria-expanded') === 'true' ? new Set() : new Set(visibles().map(x => x.s.k)); dessineSaisons(); return; }

      $$('[data-s]', main).forEach(b => b.addEventListener('click', () => { F.slug = F.slug === b.dataset.s ? null : b.dataset.s; dessine(); }));
      let tempo = 0;
      $('#cherche').addEventListener('input', ev => { F.q = ev.target.value; clearTimeout(tempo); tempo = setTimeout(dessine, 120); });
      if (F.l !== null || F.slug || terme()) majCarte();
      // la frise de la saison, reliée à la liste et à la carte : un repère allume sa ligne et sa commune ; un clic mène à la ligne
      fSaison = frise($('#v-frise'), { echelle: 'saison', saison: D.saison, points: reperesSaison(), libelle: SAISON0.titre, largeur: largeurWrap(),
        relier: { liste: main, carte: l => ctl && ctl.montrer(l) },

      // l'agenda passé (sous le pli) : dessiné dans la tâche qui suit la première image, sauf quand la vue est refaite en place
      // ou qu'un filtre est déjà là ; la frise des saisons l'accompagne (un clic ouvre la saison et y mène)
      const agendaPasseVu = () => {
        if (agenda || !racine.isConnected) return;

        fSaisons = frise($('#ag-frise'), { echelle: 'annees', debut: passe.length ? passe[passe.length - 1].k : D.saison, fin: D.saison, bandes: bandesSaisons(),
          libelle: L.saisonsPrecedentes, classe: 'frise-saisons', largeur: largeurWrap(36), anMin: 54, relier: { liste: racine }, choix: b => ouvrirSaison(b.id) });
      };
      if (enPlace || actif()) agendaPasseVu(); else requestAnimationFrame(() => setTimeout(agendaPasseVu, 0));
    };
    return `${heroEntree(e)}
    <div class="rampe"><div class="wrap"><div class="rampe-frise" id="v-frise"></div></div></div>
    <section class="split" data-zone="voir" aria-labelledby="h-saison">
      <div class="split-carte"><div class="split-colle">${carte({ lieux: lieuxProch, titre: SAISON0.titre, interactif: true, filtre: true, theme: 'voir', prochain: PUBLIC[0] ? PUBLIC[0].l : null })}</div></div>

  /* ---------- le routeur ---------- */
  const VUE_ENTREE = { voir, programmer, etablissement };
  const VUES_MENU = { spectacles, compagnie, contact };
  function resoudre() {
    const { S, ENTREE, MENU, bySlug, SAISON0, U } = X;
    let brut = location.hash.replace(/^#\/?/, '');
    try { brut = decodeURIComponent(brut); } catch (e) { /* adresse brute */ }
    const [ch, qs] = brut.split('?'), q = new URLSearchParams(qs || ''), c = ch.replace(/\/$/, '');
    if (c === 'espace-pro' && S.espacePro) return { q, v: { vue: 'espace-pro', titre: S.espacePro.titre, onglet: 'espace-pro', html: espacePro } };
    const redir = S.redirections || {};
    if (redir['#/' + c]) return { aller: redir['#/' + c] };
    const mS = /^spectacle\/([^/]+)(?:\/([^/]+))?$/.exec(c), mA = /^agenda\/([^/]+)$/.exec(c);
    if (mS && bySlug[mS[1]]) {
      const s = bySlug[mS[1]], cle = mS[2];
      // sans entrée : l'entrée retenue, ou « voir »
      if (!cle || !ENTREE[cle]) return { aller: `#/spectacle/${s.slug}/${entreeSp(s.slug, memo() || (ENTREE.voir ? 'voir' : Object.keys(ENTREE)[0]))}` };
      if (entreeSp(s.slug, cle) !== cle) return { aller: `#/spectacle/${s.slug}/voir` };   // sans action culturelle : « voir »
      const u = U[s.slug];
      return { q, cle, v: { vue: 'spectacle', slug: s.slug, u, titre: cle === 'voir' ? s.titre : `${s.titre} - ${ENTREE[cle].court}`, entree: cle, marque: 'true', top: u.clair ? (s.fondSombre || '') : u.fond, html: () => spectacle(s, cle) } };
    }
    if (mA) {
      if (mA[1] === SAISON0.saison) return { aller: ENTREE.voir ? ENTREE.voir.href : '#/' };
      const x = (S.saisons || []).find(y => y.saison === mA[1]);
      if (!x || !D.saisons || !D.saisons[mA[1]]) return { aller: '#/' };
      return { q, v: { vue: 'saison', titre: x.titre, entree: ENTREE.voir ? 'voir' : null, marque: 'true', html: () => saison(mA[1]) } };
    }
    if (ENTREE[c] && VUE_ENTREE[c]) return { q, cle: c, v: { vue: c, titre: ENTREE[c].texte, entree: c, marque: 'page', html: () => VUE_ENTREE[c]() } };
    if (c === '') return { q, v: { vue: 'accueil', titre: S.accueil, html: accueil } };
    const m = Object.values(MENU).find(x => chemin(x.href) === c);
    if (m && VUES_MENU[m.id]) return { q, v: { vue: m.id, titre: m.texte, onglet: m.id, html: VUES_MENU[m.id] } };
    if (S.legal && S.legal[c] && (S.liensLegaux || []).some(x => chemin(x.href) === c)) return { q, v: { vue: 'legal', titre: S.legal[c].titre, html: () => legal(c) } };
    return { aller: '#/' };
  }

  // ce qu'une vue refaite en place doit garder : la position, le focus, les volets ouverts
  const conteneurs = () => ({ main, header, footer: $('.site-footer') });
  function garder() {
    const a = document.activeElement, cs = conteneurs();
    let focus = null;
    const zone = a && a !== document.body ? Object.keys(cs).find(k => cs[k].contains(a)) : null;
    if (zone) {
      if (a.id) focus = { zone, id: a.id };
      else {
        const sel = a.tagName.toLowerCase() + (a.getAttribute('href') ? `[href="${CSS.escape(a.getAttribute('href'))}"]` : '') + (a.dataset.l !== undefined ? `[data-l="${CSS.escape(a.dataset.l)}"]` : '');
        focus = { zone, sel, i: $$(sel, cs[zone]).indexOf(a) };
      }
    }
    return { x: scrollX, y: scrollY, focus, details: $$('details', main).map(d => d.open) };
  }
  function restaurer(g) {
    $$('details', main).forEach((d, i) => { if (g.details[i]) d.open = true; });
    window.scrollTo(g.x, g.y);
    const f = g.focus;
    if (!f) return;
    const el = f.id ? document.getElementById(f.id) : $$(f.sel, conteneurs()[f.zone])[Math.max(0, f.i)];
    if (el && document.activeElement !== el) el.focus({ preventScroll: true });
  }

  function lierZones(q, enPlace, racine = main) {
    const zones = {}, frisesZone = {};
    $$('[data-zone]', racine).forEach(z => {
      const type = z.dataset.zone;
      // la frise de la zone répond à sa carte et à sa liste : une commune survolée allume ses repères
      const ecoute = l => { const f = frisesZone[type]; if (f) { if (l == null) f.eteindre(); else f.allumer({ l }); } };
      let ctl;
      if (type === 'accueil') ctl = lierZone(z, { naviguer: l => { const k = X.PUBLIC.some(d => d.l === l) ? 'voir' : 'etablissement'; if (X.ENTREE[k]) location.hash = `${X.ENTREE[k].href}?l=${l}`; } });
      else if (type === 'tout') {
        const det = $('[data-detail]', z), par = new Map(retenu('tout', () => CARTE.tout()).map(x => [x.l, x]));
        ctl = lierZone(z, { detail: l => { if (det && par.has(l)) det.innerHTML = detailLieu(par.get(l)); } });
      } else if (type === 'voir') { AG.brancher(z); return; }
      else ctl = lierZone(z, { ecoute });
      zones[type] = { z, ctl };
      if (!ctl || !['voir', 'scolaire', 'saison', 'spectacle'].includes(type)) return;
      const brut = enPlace ? choixZones[type] : (q.get('l') !== null ? +q.get('l') : null);
      if (brut !== null && brut !== undefined && !Number.isNaN(brut) && $(`.mc-lieu[data-l="${brut}"]`, z)) ctl.choix(brut);
    });
    // les frises de la vue : reliées à la liste et à la carte de leur zone ; un clic sur un repère mène à sa ligne (celles dont
    // le conteneur n'est pas encore dans la page attendent le rendu de la suite)
    const prets = plans.filter(p => document.getElementById(p.id));
    plans = plans.filter(p => !prets.includes(p));
    prets.forEach(p => {
      const c = document.getElementById(p.id), Z = p.zone ? zones[p.zone] : null; if (!c) return;
      const relier = Z ? { relier: { liste: Z.z.closest('.chap') || Z.z, carte: l => Z.ctl && Z.ctl.montrer(l) } } : {};
      const f = frise(c, Object.assign({ largeur: largeurWrap(), choix: x => allerLigne(x.id) }, p.o, relier));
      if (p.zone) frisesZone[p.zone] = f;
    });
    frisesDiffusion(racine);
  }

  let ioPortes = null, ioSommaire = null;
  // au téléphone, la barre des entrées s'efface tant que les trois portes de l'accueil sont à l'écran
  function suivrePortes(enPlace) {
    if (ioPortes) { ioPortes.disconnect(); ioPortes = null; }
    const d = $('.doors', main);
    if (!d) { root.classList.remove('portes-visibles'); return; }
    if (!enPlace) root.classList.remove('portes-visibles');
    if (!('IntersectionObserver' in window)) return;
    ioPortes = new IntersectionObserver(([en]) => root.classList.toggle('portes-visibles', en.isIntersecting), { threshold: .3 });
    ioPortes.observe(d);
  }
  // le petit sommaire des chapitres suit la lecture
  function suivreSommaire() {
    if (ioSommaire) { ioSommaire.disconnect(); ioSommaire = null; }
    const liens = $$('.sommaire a', main);
    if (!liens.length || !('IntersectionObserver' in window)) return;
    const vus = new Set(), ids = liens.map(a => a.getAttribute('href').slice(1));
    ioSommaire = new IntersectionObserver(es => {
      es.forEach(en => { if (en.isIntersecting) vus.add(en.target.id); else vus.delete(en.target.id); });
      const cur = ids.find(id => vus.has(id));
      if (cur) liens.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
    }, { rootMargin: '-30% 0px -60% 0px' });
    ids.forEach(id => { const el = document.getElementById(id); if (el) ioSommaire.observe(el); });
    liens[0].classList.add('on');
  }

  // ce qui est sous le pli d'une grande page (les chapitres d'un spectacle) : rendu dans la tâche qui suit la première image du
  // changement de page (le visible d'abord) ; d'emblée quand la vue est refaite en place
  let suite = null, permetDiffere = false;
  const differer = html => { if (!permetDiffere) return html; suite = html; return ''; };
  function rendreSuite(q) {
    const html = suite; suite = null;
    const c = $('#chapitres', main); if (html == null || !c) return;
    c.innerHTML = html;
    $$('a[href^="http"]', c).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    preparerCartes(c, false);
    lierZones(q, false, c);
    suivreSommaire();
    decorer(false);
  }
  function rendre(v, q, enPlace) {
    const { ENTREE, ENTREES } = X;
    const e = v.entree ? ENTREE[v.entree] : null, ea = ENTREE[memo() || 'voir'] || ENTREES[0];
    const g = enPlace ? garder() : null;
    if (!enPlace) { closeMenu(); Object.keys(choixZones).forEach(k => delete choixZones[k]); }
    root.classList.toggle('en-place', !!enPlace);
    root.style.setProperty('--top', v.top || 'var(--aub)');
    if (ea) { root.style.setProperty('--acc', ea.couleur); root.style.setProperty('--acc-v', ea.couleurVive); }
    root.style.setProperty('--hl', e ? e.couleurVive : 'rgba(255,255,255,.07)');
    root.dataset.vue = v.vue;
    frises.forEach(f => f.detruire()); frises = []; plans = [];
    suite = null; permetDiffere = !enPlace && mouvement();
    main.innerHTML = v.html();
    permetDiffere = false;
    document.title = `${v.titre} - ${X.S.titreSuffixe}`;
    // l'entrée courante : « page » sur sa propre page, « true » quand on lit un spectacle ou une saison dans cette entrée
    $$('.entree').forEach(a => { const on = !!e && a.dataset.entree === e.cle; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', v.marque || 'page'); else a.removeAttribute('aria-current'); });
    $$('#site-nav a').forEach(a => { if (v.onglet && a.dataset.onglet === v.onglet) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $$('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    $$('form', main).forEach(f => f.addEventListener('submit', ev => ev.preventDefault()));
    preparerCartes(main, enPlace);
    lierZones(q, enPlace);
    suivrePortes(enPlace);
    suivreSommaire();
    decorer(enPlace);
    if (enPlace) { restaurer(g); return; }
    // la vue remonte en haut et son titre prend le focus à l'image suivante (avant qu'elle soit peinte) : la mise en page se
    // fait une seule fois, dans l'image, et non en plus dans la tâche du geste
    requestAnimationFrame(() => {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      const h1 = $('h1', main);
      if (h1) h1.focus({ preventScroll: true });
      if (suite != null) setTimeout(() => rendreSuite(q), 0);
    });
  }
  // les titres montent, les cartes viennent l'une après l'autre en pivotant sur leur gond, les chiffres comptent ; posé avant
  // toute lecture de mise en page
  function decorer(enPlace) {
    $$('.sec-titre, .split-titre, .bande-titre, .affiches-titre, .histoire-titre, .du-titre, .chap-titre', main).forEach(e => { if (!e.closest('[data-mv]')) e.setAttribute('data-mv', 'monte'); });
    $$('.ucartes, .fps, .acs, .galerie, .cast, .citations, .ateliers, .encadres, .ft-blocs, .ep-portes, .galerie-ac', main).forEach(e => e.setAttribute('data-mv', 'cascade'));
    $$('.gros', main).forEach(e => e.setAttribute('data-mv', 'compte'));
    if (MV) MV.reveler(main, { immediat: enPlace });
  }

  /* ---------- les battants : la page qui arrive s'ouvre comme une porte, on referme derrière soi en revenant ---------- */
  let btEl = null, btAnims = [], hautTete = 0;
  if ('ResizeObserver' in window) new ResizeObserver(es => { const x = es[0]; hautTete = Math.round(x.borderBoxSize && x.borderBoxSize[0] ? x.borderBoxSize[0].blockSize : x.contentRect.height); }).observe(header);
  // les couleurs d'une page : la porte (le fond de l'univers du spectacle, ou le prune teinté de l'entrée) et sa lumière
  function couleursDe(v) {
    if (v.u) return { porte: v.u.fond, lumiere: v.u.clair ? v.u.aplat : v.u.vif };
    const e = v.vue in VUE_ENTREE && v.entree ? X.ENTREE[v.entree] : null;
    if (e) return { porte: melange('#22101d', e.couleur, .2), lumiere: e.couleurVive };
    return { porte: '#2e1628', lumiere: (X.ENTREE.voir || {}).couleurVive || '#f07ab6' };
  }
  const finirBattants = () => { btAnims.forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } }); btAnims = []; if (btEl) btEl.classList.remove('on'); };
  function battants(type, c) {
    finirBattants();
    if (!mouvement() || !main.animate || !c || type === 'onglet' || type === 'premiere') return;
    if (!btEl) { document.body.insertAdjacentHTML('beforeend', '<div class="battants" aria-hidden="true"><i class="bt bt-g"></i><i class="bt bt-d"></i><i class="bt-jour"></i></div>'); btEl = document.body.lastElementChild; }
    btEl.style.setProperty('--bt-haut', `${hautTete}px`);
    btEl.style.setProperty('--bt-c', c.porte);
    btEl.style.setProperty('--bt-l', c.lumiere);
    btEl.classList.add('on');
    const [g, d, j] = btEl.children, retour = type === 'retour';
    // en avant : les vantaux, à peine entrouverts, s'ouvrent vers l'intérieur et la lumière passe ; au retour, ceux de la page
    // quittée se rabattent et s'effacent (on a refermé derrière soi)
    const o = { duration: retour ? 380 : 430, easing: retour ? 'cubic-bezier(.45,.05,.55,.95)' : 'cubic-bezier(.32,.6,.16,1)', fill: 'both' };
    const vantail = k => retour
      ? [{ transform: `rotateY(${k * 82}deg)`, opacity: .85 }, { transform: `rotateY(${k * 36}deg)`, opacity: .42, offset: .55 }, { transform: `rotateY(${k * 8}deg)`, opacity: 0 }]
      : [{ transform: `rotateY(${k * 7}deg)`, opacity: 1 }, { transform: `rotateY(${k * 84}deg)`, opacity: 1, offset: .58 }, { transform: `rotateY(${k * 104}deg)`, opacity: 0 }];
    btAnims = [g.animate(vantail(1), o), d.animate(vantail(-1), o)];
    btAnims.push(retour
      ? j.animate([{ opacity: .5, transform: 'scaleX(.6)' }, { opacity: 0, transform: 'scaleX(.05)' }], { duration: 300, easing: 'ease-in', fill: 'both' })
      : j.animate([{ opacity: .9, transform: 'scaleX(.1)' }, { opacity: .85, transform: 'scaleX(.55)', offset: .3 }, { opacity: 0, transform: 'scaleX(1.3)' }], { duration: 430, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' }));
    btAnims[0].onfinish = finirBattants;
  }
  // d'un onglet à l'autre d'un spectacle : les vantaux ne jouent pas ; le corps paraît sous l'en-tête qui reste
  function corpsParait() {
    const c = $('.show-corps-fond', main);
    if (c && c.animate && mouvement()) c.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 260, delay: 40, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'backwards' });
  }

  /* ---------- la navigation : le genre de chaque passage (une entrée, un spectacle, un onglet, le retour, une page) ---------- */
  const pile = [];
  let dernierClic = null, vueCourante = null, couleurCourante = null;
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (a) dernierClic = { a, t: performance.now() }; }, { capture: true, passive: true });
  const cheminCourant = () => { let h = location.hash.replace(/^#\/?/, ''); try { h = decodeURIComponent(h); } catch (e) { /* brute */ } return h.split('?')[0].replace(/\/$/, ''); };
  function genre(c) {
    const h = '#/' + c, retour = pile.length > 1 && pile[pile.length - 2] === h;
    if (retour) pile.pop(); else if (pile[pile.length - 1] !== h) pile.push(h);
    if (pile.length > 60) pile.splice(0, pile.length - 60);
    const sp = c.match(/^spectacle\/([^/]+)\//);
    if (sp && vueCourante && vueCourante.startsWith(`spectacle/${sp[1]}/`)) return 'onglet';
    if (retour) return 'retour';
    if (sp) return 'spectacle';
    return X.ENTREE[c] ? 'entree' : 'page';
  }
  // l'élément partagé : l'arche de la carte ou de la porte cliquée (elle devient celle de la page)
  const partage = a => { if (!a) return null; const n = a.closest('[data-mv-nom]') || (a.closest('.uc, .fp, .door') || a).querySelector('[data-mv-nom]'); return n && main.contains(n) ? n : null; };
  function route() {
    lire();
    const r = resoudre();
    if (r.aller) { location.replace(r.aller); return; }
    if (r.cle) retenir(r.cle);
    const c = cheminCourant(), premiere = !vueCourante;
    const type = premiere ? 'premiere' : genre(c);
    if (premiere) pile.push('#/' + c);
    const clic = dernierClic && performance.now() - dernierClic.t < 1200 ? dernierClic : null;
    dernierClic = null;
    const depuis = type === 'entree' || type === 'spectacle' ? partage(clic && clic.a) : null;
    const portes = type === 'retour' ? couleurCourante : couleursDe(r.v);
    const faire = () => {
      rendre(r.v, r.q, false);
      vueCourante = c; couleurCourante = couleursDe(r.v);
      battants(type, portes);
      if (type === 'onglet') corpsParait();
    };
    // la première vue (et sous l'ouverture) sans transition ; ensuite, la porte s'ouvre (MOUVEMENT.transition)
    if (premiere || !MV || INTRO.ouverte()) faire(); else MV.transition(faire, { type, depuis });
  }
  // D a changé (la base de la compagnie) : la vue courante est refaite en place
  function rafraichir() {
    versionD++;
    lire();
    habiller();
    const r = resoudre();
    if (r.aller) { location.replace(r.aller); return; }
    rendre(r.v, r.q, true);
  }

  const closeMenu = () => { header.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded', 'false'); };
  menuBtn.addEventListener('click', () => {
    const open = !header.classList.contains('nav-open');
    header.classList.toggle('nav-open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    if (open && MV) MV.cascade($('#site-nav ul'), { pas: 32, decalage: -6 });
  });
  $('#site-nav').addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });
  // « Modifier le site » : la connexion puis l'édition sur place (EDITION, commun aux maquettes)
  $('.site-footer').addEventListener('click', e => { if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') EDITION.ouvrir(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && header.classList.contains('nav-open')) { closeMenu(); menuBtn.focus(); } });
  document.addEventListener('click', e => {
    if (header.classList.contains('nav-open') && !header.contains(e.target)) closeMenu();
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href.length > 1 && !href.startsWith('#/')) {          // une ancre dans la page (le sommaire, l'évitement)
      const cible = document.getElementById(href.slice(1));
      if (cible) { e.preventDefault(); cible.scrollIntoView({ behavior: mouvement() ? 'smooth' : 'auto', block: 'start' }); cible.focus({ preventScroll: true }); }
      return;
    }
    if (href === location.hash || (href === '#/' && !location.hash)) { e.preventDefault(); route(); }
  });
  const salut = () => { const d = $('.doors', main); if (!d || !mouvement()) return; d.classList.remove('salut'); requestAnimationFrame(() => d.classList.add('salut')); };

  /* ---------- la mise en place ---------- */
  // les tentacules : aucun moment dans cette maquette (la porte est son seul geste) ; aucun écouteur, rien ne joue sur un clic
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ clic: false, pages: false });
  // la pression : la porte cède sous la main, dès le pointerdown
  if (MV) MV.presse(document);
  lire();
  habiller();
  window.addEventListener('hashchange', route);
  route();
  if (typeof DONNEES !== 'undefined' && DONNEES.surChangement) DONNEES.surChangement(rafraichir);

  // l'ouverture : le logo blanc sur un dégradé prune ; les trois portes apparaissent à travers lui, puis s'entrouvrent
  INTRO.ouvrir({
    degrade: [[0, '#5d2149'], [.5, '#38122e'], [1, '#1d0b18']],
    encre: '#ffffff',
    classe: 'intro-m04',
    apres: salut,
  });
})();
</script>
</body>
</html>
