      <section class="wrap bloc" aria-labelledby="h-act"><h2 class="h2s" id="h-act"${ed('site.actions.titre')}>${esc(a.titre)}</h2>
        <div class="g12 act"><div class="act-text prose">${(a.blocs || []).map((b, i) => bloc(b, `site.actions.blocs.${i}`)).join('')}</div>
          ${photo('actions-culturelles') ? `<figure class="act-fig"><img src="${photo('actions-culturelles')}" alt="${esc(a.titre)}">${a.credit ? `<figcaption${ed('site.actions.credit')}>${esc(a.credit)}</figcaption>` : ''}</figure>` : ''}</div>
        ${galerie.length ? `<div class="galerie">${galerie.map(src => `<img src="${src}" alt="">`).join('')}</div>` : ''}
      </section>
      ${sc.length ? `<section class="wrap bloc" aria-labelledby="h-sc"><h2 class="h2s" id="h-sc">${esc(L.enEtablissement)}</h2>
        <div class="sc lie" data-module="scolaire"><div class="fs" id="sc-fs"></div><div class="ag-grid"><div class="ag-liste" data-agenda="">${listeHtml(sc, false, 'etablissement')}</div>
        <div class="ag-carte">${carteSvg({ lieux: CARTE.aVenir('scolaire'), titre: L.enEtablissement, fixe })}</div></div></div></section>` : ''}
      ${agirHtml()}`;
  }

  const spectaclesHtml = () => `${tete((menuDe('spectacles') || {}).texte)}<div class="wrap"><ul class="ucs riches">${shows().map(s => carteUnivers(s, { riche: true, h: 'h2' })).join('')}</ul></div>`;

  /* ---------- La page d'un spectacle : son univers, ses trois onglets d'entrée ---------- */
  function photosDe(s, filtre) {
    return (s.photos || []).map((p, i) => ({ ...p, i })).filter(p => filtre(p) && photo(p.cle)).map(p => {
      const dossier = p.source === 'dossier' && s.creditDossier;
      return { ...p, src: photo(p.cle), credit: dossier ? s.creditDossier : s.creditPhotos, creditCle: dossier ? 'creditDossier' : 'creditPhotos' };
    });
  }
  const creditsHtml = (s, ps) => { const vus = new Map(); ps.forEach(p => { if (p.credit && !vus.has(p.credit)) vus.set(p.credit, p.creditCle); }); return vus.size ? `<p class="credits">${[...vus].map(([t, k]) => `<span${edS(s, k)}>${esc(t)}</span>`).join('')}</p>` : ''; };
  const figure = (s, p, cls = 'carton') => `<figure><img src="${p.src}" alt="${esc(p.legende || s.titre)}" decoding="async"${edP(`shows.${s.slug}.photos.${p.i}`)}>${p.legende ? `<figcaption class="${cls}"${edS(s, 'photos', p.i, 'legende')}>${esc(p.legende)}</figcaption>` : ''}</figure>`;
  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu
  const portrait = ({ e, p, lignes }, credits) => {
    const nom = nomDe(p), k = `personnes.${e.personne}`;
    return `<figure class="cast-pt"><span class="cast-cadre" data-edit-photo="${esc(k)}.photo"><span class="cast-mono" aria-hidden="true"><b>${esc(initiales(p))}</b></span>${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(nom)}" width="320" height="400" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span>
      <figcaption>${credits ? `<small class="cast-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="cast-nom"><span data-edit="${esc(k)}.prenom">${esc(p.prenom)}</span> <span data-edit="${esc(k)}.nom">${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="cast-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="cast-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];
    L.forEach((x, i) => {
      if (pris.has(i)) return; pris.add(i);
      const j = x.e.alternance ? L.findIndex((y, k) => !pris.has(k) && x.e.alternance.includes(nomDe(y.p))) : -1;   // « en alternance avec … » : par deux
      if (j < 0) blocs.push(`<li>${portrait(x, credits)}</li>`);
      else { pris.add(j); blocs.push(`<li class="cast-paire">${portrait(x, credits)}${portrait(L[j], credits)}</li>`); }
    });
    return `<ul class="cast" style="--n:${L.length}${pris.size > blocs.length ? ';--pw:132px' : ''}">${blocs.join('')}</ul>`;   // avec des paires : de quoi en tenir trois sur une ligne
  }
  function ficheBloc(s, { large = true, portraits: avecPortraits = false } = {}) {
    const cast = avecPortraits ? portraits(s) : '', f = ficheItems(s).filter(x => !(cast && x.avec));   // les portraits remplacent la ligne « avec »
    return `${cast}${f.length ? `<dl class="u-fiche">${f.map(x => `<div${x.avec && large ? ' class="large"' : ''}>${x.l ? `<dt${edS(s, ...x.kl)}>${esc(x.l)}</dt>` : ''}<dd${edS(s, ...x.kv)}>${x.v}</dd></div>`).join('')}</dl>` : ''}
      ${(s.production || []).length ? `<div class="u-prod">${s.production.map((p, i) => `<p${edS(s, 'production', i)}>${p}</p>`).join('')}</div>` : ''}
      ${(s.mentions || []).map((m, i) => `<p class="u-mention"${edS(s, 'mentions', i)}>${m}</p>`).join('')}`;
  }
  function datesCartes(dates) {
    return dates.map(d => { const j = decoupe(d.ligneDate || d.ligne); return `<li class="dcard dt"${dateId(d)}${fid(cleProchaine(d))} data-l="${d.l == null ? '' : d.l}" data-slug="${esc(d.slug || '')}">
      <p class="when"><span aria-hidden="true">${j.grand}${j.sous ? `<span class="j-sous">${esc(j.sous)}</span>` : ''}</span><span class="sr">${esc(d.ligneDate || d.ligne)}</span></p>
      ${d.ligneLieu ? `<p class="where">${esc(d.ligneLieu)}</p>` : ''}${detailsHtml(d.details)}</li>`; }).join('');
  }
  const filtreLieux = (lieux, garde) => lieux.map(x => ({ ...x, dates: (x.dates || []).filter(garde) })).filter(x => x.dates.length);
  const tourneeTexte = s => s.tournee && s.tournee.texte ? `<p class="t-texte"${edS(s, 'tournee', 'texte')}>${esc(s.tournee.texte)}</p>` : '';

  // la présentation d'un spectacle, chapitre par chapitre : [id, titre du sommaire, html] (l'onglet voir et la page unique)
  function chapitresPresentation(s) {
    const L = LIB(), ps = photosDe(s, p => !p.atelier && !p.etablissement), ch = [];
    if ((s.affirmations || []).length || s.cadre) ch.push(['ch-ouverture', L.ouverture, `<h2 class="u-h2">${esc(L.ouverture)}</h2>
      <div class="affs">${(s.affirmations || []).map((a, i) => `<p class="aff"${edS(s, 'affirmations', i, 'texte')}>${esc(a.texte)}</p>`).join('')}</div>${s.cadre ? `<p class="cadre"${edS(s, 'cadre')}>${esc(s.cadre)}</p>` : ''}`]);
    if ((s.texte || []).length || (s.citations || []).length) ch.push(['ch-spectacle', L.leSpectacle, `<h2 class="u-h2">${esc(L.leSpectacle)}</h2>
      <div class="texte">${(s.texte || []).map((p, i) => `<p${edS(s, 'texte', i)}>${p}</p>`).join('')}</div>
      ${(s.citations || []).length ? `<div class="vers-l">${s.citations.map((c, i) => `<figure class="vers${c.prose ? ' prose-q' : ''}"><blockquote>${(c.vers || []).map((v, j) => `<span${edS(s, 'citations', i, 'vers', j)}>${esc(v)}</span>`).join('')}</blockquote>${c.source ? `<figcaption><cite${edS(s, 'citations', i, 'source')}>${esc(c.source)}</cite></figcaption>` : ''}</figure>`).join('')}</div>` : ''}`]);
    if (ps.length) ch.push(['ch-photos', L.photos, `<h2 class="u-h2">${esc(L.photos)}</h2><div class="photos">${ps.map(p => figure(s, p)).join('')}</div>${creditsHtml(s, ps)}`]);
    if (s.video && s.video.url) ch.push(['ch-video', L.bandeAnnonce, `<h2 class="u-h2">${esc(L.bandeAnnonce)}</h2>${videosHtml(s)}`]);
    return ch;
  }
  const chapDistribution = s => ['ch-distribution', LIB().distribution, `<h2 class="u-h2">${esc(LIB().distribution)}</h2>${ficheBloc(s, { portraits: true })}${s.duree ? `<p class="u-duree"${edS(s, 'duree')}>${esc(s.duree)}</p>` : ''}`];
  // les chapitres en lecture, avec le petit sommaire qui suit la lecture (ses liens restent sur la page du spectacle)
  const lectureHtml = (s, ch) => `<div class="g12 u-grille">
      <nav class="u-sommaire" aria-label="${esc(LIB().leSpectacle)}"><ol>${ch.map(([id, t]) => `<li><a href="${esc(lienSp(s))}" data-chap="${id}">${esc(t)}</a></li>`).join('')}</ol></nav>
      <div class="u-lecture">${ch.map(([id, , html]) => `<section class="chap" id="${id}" tabindex="-1">${html}</section>`).join('')}</div>
    </div>`;

  function ongletVoir(s, u, fixe) {
    const L = LIB(), K = CARTE.spectacle(s.slug), couleur = () => 'var(--u-titre)';
    const pub = datesPub().filter(d => d.slug === s.slug);
    const ch = chapitresPresentation(s);
    let dates;
    // réserver (règle 17) : les prochaines dates tout public en une bande, un bouton par date (le jour, les heures, la
    // commune) ; la prochaine est choisie d'office, sa carte dessous, à côté de la carte de France (RESERVER.monter, brancher())
    const res = RS && !s.statut ? RS.dates(s.slug) : [];
    if (res.length) {
      dates = `<h2 class="u-h2"${s.tournee && s.tournee.titre ? edS(s, 'tournee', 'titre') : ''}>${esc((s.tournee && s.tournee.titre) || L.actuellementEnTournee)}</h2>${tourneeTexte(s)}
        <div class="fr fr-tournee" data-fr="tournee" data-slug="${esc(s.slug)}"></div>
        <div class="rs-zone lie" data-module="spectacle" data-slug="${esc(s.slug)}">
          <p class="rs-k-bande" id="rs-k">${esc(L.choisirUneDate)}</p>
          ${RS.bande(res, { attributs: ` aria-labelledby="rs-k" data-agenda="${esc(s.slug)}"`, bouton: d => ({ classe: 'dt', attributs: `${dateId(d)}${fid(cleProchaine(d))} data-l="${d.l == null ? '' : d.l}" data-slug="${esc(d.slug || '')}"` }) })}
          <div class="g12 rs-corps"><div class="rs-carte" id="rs-carte"></div><div class="t-carte">${carteSvg({ lieux: filtreLieux(K.aVenir, d => !d.scolaire), passe: K.passe, titre: s.titre, couleur, fixe, nomsPasse: false })}</div></div>
        </div>`;
    } else if (pub.length) {
      dates = `<h2 class="u-h2"${s.tournee && s.tournee.titre ? edS(s, 'tournee', 'titre') : ''}>${esc((s.tournee && s.tournee.titre) || L.actuellementEnTournee)}</h2>${tourneeTexte(s)}
        <div class="fr fr-tournee" data-fr="tournee" data-slug="${esc(s.slug)}"></div>
        <div class="g12 t-grid lie" data-module="spectacle"><div class="dates-z" data-agenda="${esc(s.slug)}"><ol class="dcards">${datesCartes(pub)}</ol></div><div class="t-carte">${carteSvg({ lieux: filtreLieux(K.aVenir, d => !d.scolaire), passe: K.passe, titre: s.titre, couleur, fixe, nomsPasse: false })}</div></div>`;
    } else if (s.statut && s.tournee && s.tournee.titre) {
      // un spectacle en création (Cassandres) : « Spectacle en création », ses dates à venir annoncées plus tard ; les lieux où il
      // a déjà été présenté, en retrait
      dates = `<h2 class="u-h2"${edS(s, 'tournee', 'titre')}>${esc(s.tournee.titre)}</h2>${tourneeTexte(s)}
        <div class="g12 t-grid lie"><div class="t-carte seule">${carteSvg({ lieux: [], passe: K.passe, titre: s.titre, couleur, fixe })}</div></div>`;
    } else if (K.passe.length) {
      dates = `<h2 class="u-h2">${esc(L.lieuxDiffusion)}</h2><div class="fr fr-tournee" data-fr="tournee" data-slug="${esc(s.slug)}"></div><div class="g12 t-grid lie"><div class="t-carte seule">${carteSvg({ lieux: [], passe: K.passe, titre: s.titre, couleur, fixe })}</div></div>`;
    }
    if (dates) ch.push(['ch-dates', pub.length || s.statut ? L.dates : L.lieuxDiffusion, dates]);
    ch.push(chapDistribution(s));
    return lectureHtml(s, ch);
  }

  function ongletProgrammer(s, u, fixe) {
    const L = LIB(), p = s.programmer || {}, K = CARTE.spectacle(s.slug), w = ecrire(), couleur = () => 'var(--u-titre)';
    const dos = s.dossier && D.dossiers ? D.dossiers[s.dossier] : null, acc = dos && dos.accueil, dk = `dossiers.${s.dossier}.accueil`;
    const implant = photosDe(s, x => x.id === 'd-implantation-1');
    const ftDocs = docsDe(s, 'pros').filter(x => x.type === 'fiche_technique');   // la fiche technique déposée : en lien, avec le détail de Bérénice s'il y en a un
    const chiffres = [p.representations && `<li class="grand">${repHtml(p.representations, edS(s, 'programmer', 'representations'))}</li>`,
      ...faitsProg(s).map(([t, k]) => `<li${edS(s, k)}>${esc(t)}</li>`), s.statut && `<li${edS(s, 'statut')}>${esc(s.statut)}</li>`].filter(Boolean);
    return `<div class="g12 u-grille">
      <div class="u-main">
        ${chiffres.length ? `<ul class="u-chiffres">${chiffres.join('')}</ul>` : ''}
        ${(p.equipeCreation || []).length ? `<section class="chap"><h2 class="u-h2">${esc(L.distribution)}</h2><ul class="u-equipe">${p.equipeCreation.map((x, i) => `<li${edS(s, 'programmer', 'equipeCreation', i)}>${esc(x)}</li>`).join('')}</ul></section>` : ''}
        ${acc && p.ficheTechnique ? `<section class="chap" aria-labelledby="h-tech"><h2 class="u-h2" id="h-tech"${acc.fiche ? ed(`${dk}.fiche`) : ''}>${esc(acc.fiche || L.ficheTechnique)}</h2>
          <h3 class="u-h3"${acc.titre ? ed(`${dk}.titre`) : ''}>${esc(acc.titre || L.conditionsAccueil)}</h3>
          <div class="tech">${(acc.blocs || []).map((b, i) => `<div class="tech-b">${b.titre ? `<h4${ed(`${dk}.blocs.${i}.titre`)}>${esc(b.titre)}</h4>` : ''}<ul>${(b.lignes || []).map((x, j) => `<li${ed(`${dk}.blocs.${i}.lignes.${j}`)}>${x}</li>`).join('')}</ul></div>`).join('')}
            ${acc.alerte ? `<p class="alerte">${ALERTE}<span${ed(`${dk}.alerte`)}>${acc.alerte}</span></p>` : ''}</div>
          ${implant.length ? `<div class="photos implant">${implant.map(x => figure(s, x)).join('')}</div>${creditsHtml(s, implant)}` : ''}
          ${ftDocs.length ? listeDocs(ftDocs) : ''}
        </section>` : `<section class="chap" aria-labelledby="h-tech"><h2 class="u-h2" id="h-tech">${esc(L.ficheTechnique)}</h2>${(() => {   // la fiche technique : un document déposé, sinon sur demande (jamais de rubrique vide)
          const fts = ftDocs, href = mailPrg(`${L.ficheTechnique} – ${s.titre}`);
          return fts.length ? listeDocs(fts) : `<ul class="docs"><li>${PDF}${href ? `<a href="${esc(href)}">${esc(L.ficheTechniqueSurDemande)}</a>` : `<span>${esc(L.ficheTechniqueSurDemande)}</span>`}</li></ul>`; })()}</section>`}
        <section class="chap" aria-labelledby="h-dl"><h2 class="u-h2" id="h-dl">${esc(L.aTelecharger)}</h2><ul class="docs"><li>${dossierBouton(s.slug)}</li>${docsDe(s, 'pros').map(x => `<li>${PDF}${lienDoc(x)}</li>`).join('')}</ul></section>
        <section class="chap u-lieux" aria-labelledby="h-lieux"><h2 class="u-h2" id="h-lieux">${esc(L.lieuxDiffusion)}</h2>
          ${p.lieux ? `<p${edS(s, 'programmer', 'lieux')}>${esc(p.lieux)}</p>` : tourneeTexte(s)}
          <div class="fr fr-tournee" data-fr="diffusion" data-slug="${esc(s.slug)}"></div>
          <div class="g12 t-grid lie" data-module="spectacle"><div class="t-carte seule">${carteSvg({ lieux: K.aVenir, passe: K.passe, titre: s.titre, couleur, fixe, nomsPasse: false })}</div></div>
        </section>
      </div>
      <aside class="u-side">
        <div class="u-boite">${contactHtml_(s)}</div>
        <div class="u-boite"><p class="ac-l">${esc(L.distribution)}</p>${ficheBloc(s, { large: false })}</div>
        <div class="u-boite"><p class="liens">${dossierBouton(s.slug)}${bandeLien(s)}</p><p class="u-agir-p"><a class="u-agir" href="${esc(w.href)}">${esc(w.texte)}${ARROW}</a></p></div>
      </aside>
    </div>`;
  }

  function dossierHtml(s, dos) {
    const L = LIB(), k = `dossiers.${s.dossier}`, po = dos.pourquoi || {}, pr = dos.programmes || {}, co = dos.consignes || {}, at = dos.ateliers || {};
    const ph = photosDe(s, p => p.atelier || p.id === 'd-implantation-1' || (p.etablissement && p.source !== 'dossier'));
    return `<section class="dossier" aria-labelledby="h-dossier">
      <header class="dos-tete"><div><p class="ac-l">${esc(L.dossierScolaire)}</p><h2 id="h-dossier"${po.titre ? ed(`${k}.pourquoi.titre`) : ''}>${esc(po.titre || L.dossierScolaire)}</h2></div></header>
      ${(po.sections || []).length ? `<div class="pourquoi">${po.sections.map((x, i) => `<article><h3${ed(`${k}.pourquoi.sections.${i}.titre`)}>${esc(x.titre)}</h3><p${ed(`${k}.pourquoi.sections.${i}.texte`)}>${x.texte}</p></article>`).join('')}</div>` : ''}
      ${(pr.niveaux || []).length ? `<section class="chap"><h2 class="u-h2"${ed(`${k}.programmes.titre`)}>${esc(pr.titre)}</h2>
        <table class="prog-t"><caption class="sr">${esc(pr.titre)}</caption>${pr.niveaux.map((n, i) => `<tbody><tr><th scope="rowgroup" colspan="3"${ed(`${k}.programmes.niveaux.${i}.niveau`)}>${esc(n.niveau)}</th></tr>${(n.lignes || []).map((x, j) => {
          const c = `${k}.programmes.niveaux.${i}.lignes.${j}`;
          return `<tr><th scope="row"${ed(`${c}.matiere`)}>${esc(x.matiere)}</th><td${ed(`${c}.intitule`)}>${esc(x.intitule)}</td><td${ed(`${c}.objectif`)}>${esc(x.objectif)}</td></tr>`;
        }).join('')}</tbody>`).join('')}</table></section>` : ''}
      ${co.titre ? `<section class="chap"><h2 class="u-h2"${ed(`${k}.consignes.titre`)}>${esc(co.titre)}</h2>
        <div class="consignes"><div class="c-box">${co.note ? `<p class="c-note"${ed(`${k}.consignes.note`)}>${esc(co.note)}</p>` : ''}${co.intro ? `<p${ed(`${k}.consignes.intro`)}>${co.intro}</p>` : ''}
          ${(co.demandes || []).length ? `<ul class="demandes">${co.demandes.map((x, i) => `<li>${NON}<span${ed(`${k}.consignes.demandes.${i}`)}>${esc(x)}</span></li>`).join('')}</ul>` : ''}</div>
          <div class="c-apres">${co.apres ? `<p${ed(`${k}.consignes.apres`)}>${co.apres}</p>` : ''}${(co.axes || []).length ? `<ul>${co.axes.map((x, i) => `<li${ed(`${k}.consignes.axes.${i}`)}>${x}</li>`).join('')}</ul>` : ''}</div>
          ${co.atelier ? `<p class="c-atelier"${ed(`${k}.consignes.atelier`)}>${co.atelier}</p>` : ''}</div></section>` : ''}
      ${(at.liste || []).length ? `<section class="chap"><h2 class="u-h2"${at.titre ? ed(`${k}.ateliers.titre`) : ''}>${esc(at.titre || L.ateliers)}</h2>
        <div class="ateliers">${at.liste.map((a, i) => { const c = `${k}.ateliers.liste.${i}`; return `<article class="atelier"><h3${ed(`${c}.titre`)}>${a.titre}</h3>${(a.paragraphes || []).map((p, j) => `<p${ed(`${c}.paragraphes.${j}`)}>${p}</p>`).join('')}
          ${(a.etapes || []).length ? `<ol>${a.etapes.map((e, j) => `<li><b${ed(`${c}.etapes.${j}.titre`)}>${e.titre}</b><span${ed(`${c}.etapes.${j}.texte`)}>${e.texte}</span></li>`).join('')}</ol>` : ''}
          ${(a.points || []).length ? `<ul>${a.points.map((p, j) => `<li${ed(`${c}.points.${j}`)}>${p}</li>`).join('')}</ul>` : ''}</article>`; }).join('')}</div>
        ${ph.length ? `<div class="at-photos">${ph.map(p => figure(s, p, 'leg')).join('')}</div>${creditsHtml(s, ph)}` : ''}</section>` : ''}
    </section>`;
  }

  // l'action culturelle d'un spectacle : son type en grand (un h2 dans l'onglet établissement ; ailleurs un paragraphe), le public,
  // le lieu, le statut, les textes, la formule, les dispositifs ; sans type, « à compléter » (jamais sur la page d'un spectacle
  // qui n'est plus en tournée : la rubrique n'y paraît pas)
  function acBlocHtml(s, ac, { titre = true } = {}) {
    const L = LIB(), meta = [ac.public && [L.public, ac.public, 'public'], ac.lieu && lieuLib(ac.lieu) && [null, lieuLib(ac.lieu), null], ac.statut && [null, ac.statut, 'statut']].filter(Boolean);
    const h = titre ? 'h2' : 'p', type = ac.type ? `<${h} class="ac-type"${titre ? ' id="h-ac"' : ''}${edS(s, 'actionCulturelle', 'type')}>${esc(ac.type)}</${h}>` : titre ? `<h2 class="ac-type vide" id="h-ac">${esc(L.aCompleter)}</h2>` : '';
    return `<p class="ac-l">${esc(L.actionCulturelle)}</p>${type}
      ${meta.length ? `<ul class="ac-meta">${meta.map(([k, v, c]) => `<li>${k ? `<span>${esc(k)}</span>` : ''}<b${c ? edS(s, 'actionCulturelle', c) : ''}>${esc(v)}</b></li>`).join('')}</ul>` : ''}
      ${(ac.textes || []).map((t, i) => `<div class="ac-txt">${bloc(t.texte, `shows.${s.slug}.actionCulturelle.textes.${i}.texte`)}</div>`).join('')}
      ${(ac.formule || []).length ? `<p class="formule">${ac.formule.map((x, i) => `<span${edS(s, 'actionCulturelle', 'formule', i)}>${esc(x)}</span>`).join('')}</p>` : ''}
      ${(ac.dispositifs || []).length ? `<div class="disp"><p class="ac-l">${esc(L.dispositifs)}</p><ul>${ac.dispositifs.map((x, i) => `<li${edS(s, 'actionCulturelle', 'dispositifs', i)}>${x}</li>`).join('')}</ul></div>` : ''}`;
  }
  function ongletEtablissement(s, u, fixe) {
    const L = LIB(), ac = s.actionCulturelle || {}, w = ecrire(), couleur = () => 'var(--u-titre)';
    const sc = datesScol().filter(d => d.slug === s.slug), K = CARTE.spectacle(s.slug);
    const dos = s.dossier && D.dossiers ? D.dossiers[s.dossier] : null;
    return `<div class="g12 u-grille">
      <div class="u-main">
        <section class="ac-bloc" aria-labelledby="h-ac">${acBlocHtml(s, ac)}</section>
        ${docsDe(s, 'scolaires').length ? `<section class="chap" aria-labelledby="h-docs"><h2 class="u-h2" id="h-docs">${esc(L.documentsScolaires)}</h2>${listeDocs(docsDe(s, 'scolaires'))}</section>` : ''}
        ${sc.length ? `<section class="chap" aria-labelledby="h-sc"><h2 class="u-h2" id="h-sc">${esc(L.enEtablissement)}</h2>
          <div class="fr fr-tournee" data-fr="scolaire" data-slug="${esc(s.slug)}"></div>
          <div class="g12 t-grid lie" data-module="spectacle"><div class="dates-z" data-agenda="${esc(s.slug)}"><ol class="dcards">${datesCartes(sc)}</ol></div><div class="t-carte">${carteSvg({ lieux: filtreLieux(K.aVenir, d => d.scolaire), titre: L.enEtablissement, couleur, fixe })}</div></div></section>` : ''}
      </div>
      <aside class="u-side">
        <div class="u-boite"><p class="u-agir-p"><a class="u-agir" href="${esc(w.href)}">${esc(w.texte)}${ARROW}</a></p></div>
        <div class="u-boite"><p class="ac-l">${esc(L.distribution)}</p>${ficheBloc(s, { large: false })}</div>
      </aside>
    </div>
    ${dos ? dossierHtml(s, dos) : ''}`;
  }

  /* ---------- La page d'un spectacle qui n'est plus en tournée (règle 21) : une seule page, sans onglets ----------
     Sa présentation (comme l'onglet voir, sans dates à venir), puis le bilan de ses dates passées : les chiffres tirés des données
     (ses représentations, le nombre de ses dates jouées, de ses communes, de ses saisons), la frise de sa tournée, ses dates par
     saison (de la plus récente à la plus ancienne) à côté d'une grande carte de tous ses lieux ; enfin les actions culturelles
     menées, s'il y en a. */
  // ses dates passées, toutes saisons : [{ k (la saison), titre, rows }], la plus récente d'abord, et dans chaque saison de la
  // plus récente à la plus ancienne (une ligne sans date, une année seule, reste à la suite de la précédente)
  function datesPassees(s) {
    const out = [];
    Object.keys(D.saisons || {}).sort().reverse().forEach(k => {
      const SA = D.saisons[k], rows = []; let i = 0;
      (SA.spectacles || []).forEach(g => { let prev = null; (g.dates || []).forEach(d => {
        const n = i++; if (g.slug !== s.slug) return;
        let fin = cleDate(d, k); if (fin) prev = fin; else fin = prev;
        if (fin && fin >= D.aujourdhui) return;   // une date à venir n'est pas au bilan
        rows.push({ d, g, k: fin || '', saison: k, i: n, titre: s.titre, cle: s.slug });
      }); });
      if (rows.length) out.push({ k, titre: SA.titre, rows: rows.sort((a, b) => (a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i)) });
    });
    return out;
  }
  function bilanHtml(s, fixe) {
    const L = LIB(), G = datesPassees(s); if (!G.length) return '';
    const p = s.programmer || {}, jouees = G.flatMap(g => g.rows).filter(r => !annulee(r.d)), K = CARTE.spectacle(s.slug);
    const chiffres = [[jouees.length, L.dates], [new Set(jouees.map(r => r.d.l).filter(l => l != null)).size, L.communes], [new Set(jouees.map(r => r.saison)).size, L.saisons]].filter(([n, l]) => n && l);
    return `<h2 class="u-h2">${esc(L.bilan)}</h2>
      ${p.representations ? `<div class="bilan-rep">${repHtml(p.representations, edS(s, 'programmer', 'representations'))}</div>` : ''}
      ${chiffres.length ? `<ul class="bilan-n">${chiffres.map(([n, l]) => `<li><b data-mv="compte">${n}</b><span>${esc(l)}</span></li>`).join('')}</ul>` : ''}
      <div class="fr fr-tournee" data-fr="bilan" data-slug="${esc(s.slug)}"></div>
      <div class="g12 bilan-g lie" data-module="bilan">
        <div class="bilan-dates" data-agenda="${esc(s.slug)}">${G.map(g => `<section class="bl-s"><h3 class="bl-t"><span>${esc(g.titre)}</span><small>${g.rows.length}</small></h3>
          <ol>${g.rows.map(r => ligneHtml(r, { id: cleLigne(r.d, r.saison, r.i), avecTitre: false, mois: true })).join('')}</ol></section>`).join('')}</div>
        <div class="t-carte bilan-carte">${carteSvg({ lieux: K.passe, titre: s.titre, couleur: () => 'var(--u-titre)', fixe, cadre: true })}</div>
      </div>`;
  }
  // les actions culturelles menées : son action culturelle (sans texte, « à compléter » : la rubrique ne paraît pas), et ses dates
  // scolaires passées
  function actionsMeneesHtml(s) {
    const L = LIB(), ac = s.actionCulturelle;
    if (!ac || !(ac.type || ['textes', 'formule', 'dispositifs'].some(k => (ac[k] || []).length))) return '';
    const sc = datesPassees(s).flatMap(g => g.rows).filter(r => r.d.scolaire);
    return `<h2 class="u-h2">${esc(L.actionsMenees)}</h2>
      <div class="ac-bloc ac-menees">${acBlocHtml(s, ac, { titre: false })}</div>
      ${sc.length && L.enEtablissement ? `<h3 class="u-h3">${esc(L.enEtablissement)}</h3><ol data-agenda="${esc(s.slug)}">${sc.map(r => ligneHtml(r, { id: cleLigne(r.d, r.saison, r.i), avecTitre: false, mois: true })).join('')}</ol>` : ''}`;
  }
  function pageSeule(s, u, fixe) {
    const L = LIB(), ch = [...chapitresPresentation(s), chapDistribution(s)];
    const b = bilanHtml(s, fixe); if (b) ch.push(['ch-bilan', L.bilan, b]);
    const a = actionsMeneesHtml(s); if (a) ch.push(['ch-actions', L.actionsMenees, a]);
    return lectureHtml(s, ch);
  }

  // l'en-tête d'univers, commun à toutes les pages d'un spectacle : le titre qui se révèle lettre à lettre dans la police du
  // spectacle, son sous-titre, son genre, son statut, son accroche, sa grande photo, son motif
  function teteUnivers(s, u, memeSp) {
    const img = imgPrincipale(s, s.titre);
    return `<header class="u-tete">
        ${signe(u)}
        <div class="wrap u-tete-in">
          <div class="u-titres">
            <p class="u-et u-signe"><span${ed('site.nom')}>${esc(site().nom)}</span>${etiquettes(s, 'creation', 'lieuTemps')}</p>
            <h1 class="u-h1${memeSp ? ' sans-revele' : ''}" id="h1" tabindex="-1">${h1Lignes(s)}</h1>
            ${s.sousTitre ? `<p class="u-sous"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}${s.genre && s.genre !== s.sousTitre ? `<p class="u-genre"${edS(s, 'genre')}>${esc(s.genre)}</p>` : ''}
            ${s.statut ? `<p class="statut"${edS(s, 'statut')}>${esc(s.statut)}</p>` : ''}
            ${s.accroche ? `<p class="u-acc"${edS(s, 'accroche')}>${esc(s.accroche)}</p>` : ''}
          </div>
          ${img ? `<figure class="u-photo">${img}${s.credit ? `<figcaption${edS(s, 'credit')}>${esc(s.credit)}</figcaption>` : ''}</figure>` : ''}
          ${bande(u, 'u-frise')}
        </div>
      </header>`;
  }
  // la page d'un spectacle : en tournée (ou en création), ses trois onglets (voir, programmer, établissement ; sans action
  // culturelle, pas d'onglet établissement) ; sinon la page unique, sans onglets
  function spectacleHtml(s, entree, fixe, { memeSp = false, avant = null } = {}) {
    const u = univers(s), onglets = aOnglets(s);
    const corps = onglets ? { voir: ongletVoir, programmer: ongletProgrammer, etablissement: ongletEtablissement }[entree](s, u, fixe) : pageSeule(s, u, fixe);
    return `<article class="u u-${u.clair ? 'clair' : 'sombre'}" style="${uStyle(s)}">
      ${teteUnivers(s, u, memeSp)}
      ${onglets ? `<nav class="u-onglets" aria-label="${esc(s.titre)}"><div class="wrap"><ul>${entrees().filter(e => e.cle !== 'etablissement' || s.actionCulturelle).map(e => `<li><a href="#/spectacle/${esc(s.slug)}/${e.cle}" data-k="onglet-${e.cle}" style="${eStyle(e)}"${e.cle === entree ? ` aria-current="page"${memeSp ? ' class="entrant"' : ''}` : memeSp && e.cle === avant ? ' class="sortant"' : ''}><span class="e-pt" aria-hidden="true"></span><span>${esc(e.court)}</span></a></li>`).join('')}</ul></div></nav>`
        : '<div class="u-filet" aria-hidden="true"></div>'}
      <div class="wrap u-corps">${corps}</div>
    </article>`;
  }

  /* ---------- L'espace pro (règles 16 et 21) : ses deux pages (programmer, établissements scolaires) en grandes cases, puis ses
     trois accès réservés, sur trois fois quatre colonnes ---------- */
  function espaceProHtml() {
    const P = site().espacePro || {}, deux = ['programmer', 'etablissement'].map(entreeDe).filter(Boolean);
    const images = { programmer: photo('berenice/av-18', 'berenice'), etablissement: photo('actions-culturelles') };
    return `${tete(P.titre, { chemin: 'site.espacePro.titre', apres: P.texte ? `<p class="ep-texte"${ed('site.espacePro.texte')}>${esc(P.texte)}</p>` : '' })}
      <div class="wrap">${deux.length ? `<ul class="choix ep-pages">${deux.map(e => `<li><a href="${esc(e.href)}" style="${eStyle(e)}"><span class="choix-img">${images[e.cle] ? `<img src="${images[e.cle]}" alt="" decoding="async">` : ''}</span><span class="choix-t"><span><b>${esc(e.court)}</b><small>${esc(e.texte)}</small></span>${ARROW}</span></a></li>`).join('')}</ul>` : ''}
        <ul class="ep-portes">${(P.portes || []).map((x, i) => `<li class="ep" data-cle="${esc(x.cle)}">
        <h2 class="ep-t"><a class="ep-a" href="${esc(x.href)}"><span${ed(`site.espacePro.portes.${i}.titre`)}>${esc(x.titre)}</span></a></h2>
        <p class="ep-x"${ed(`site.espacePro.portes.${i}.texte`)}>${esc(x.texte)}</p>
        <span class="ep-f" aria-hidden="true">${ARROW}</span></li>`).join('')}</ul></div>`;
  }

  /* ---------- La troupe (règle 20, TROUPE) : l'ours de la revue, entre la présentation et les repères ----------
     Un organigramme posé sur la grille : la pieuvre de la compagnie à la racine, un filet qui court sur toute la largeur
     et d'où tombent les filets des colonnes (les catégories de métiers : qui fait quoi, d'un coup d'œil) ; le jeu, à
     gauche, en planche contact (les visages publiés bord à bord, puis les noms) ; les autres métiers dans les colonnes de
     droite. Une personne paraît dans chaque catégorie de ses métiers, avec le métier précis sous son nom ; la survoler ou
     la choisir allume toutes ses places et les relie (TROUPE.relier). Relue dans D à chaque rendu. */
  let troupeCtl = null, troupeIO = null;
  function placeTroupe(x) {
    const metiers = !x.evident && x.metiers.length ? `<span class="tr3-m">${x.metiers.map(m => `<span>${esc(m)}</span>`).join('')}</span>` : '';
    const ancre = x.photo ? `<span class="tr3-v" data-troupe-ancre><img src="${esc(x.photo)}" alt="" width="240" height="240" loading="lazy" decoding="async" data-troupe-photo></span>`
      : '<span class="tr3-pt" data-troupe-ancre></span>';
    return `<li class="tr3-li${x.photo ? ' a-photo' : ''}"><button type="button" class="tr3-place${x.photo ? ' a-photo' : ''}" data-troupe-place data-troupe-personne="${esc(x.personne)}" aria-pressed="false">${ancre}<span class="tr3-qui"><span class="tr3-nom">${x.prenom ? `<span>${esc(x.prenom)}</span> ` : ''}<span>${esc(x.nom)}</span></span>${metiers}</span></button></li>`;
  }
  // une catégorie : son icône dans sa case, son titre ; le jeu (planche : true), ses visages en planche contact puis les noms
  // seuls ; les autres, une seule liste, les visages d'abord (un seul arrêt de tabulation par catégorie, les flèches ensuite)
  function categorieTroupe(c, cls = '', planche = false) {
    const vis = c.places.filter(x => x.photo), noms = c.places.filter(x => !x.photo);
    const listes = planche && vis.length ? `<ul class="tr3-places tr3-planche">${vis.map(placeTroupe).join('')}</ul>${noms.length ? `<ul class="tr3-places tr3-noms">${noms.map(placeTroupe).join('')}</ul>` : ''}`
      : `<ul class="tr3-places">${[...vis, ...noms].map(placeTroupe).join('')}</ul>`;
    return `<section class="tr3-cat${cls}" data-troupe-categorie="${esc(c.cle)}" aria-labelledby="tr3-h-${esc(c.cle)}">
      <h3 class="tr3-t" id="tr3-h-${esc(c.cle)}"><span class="tr3-ic">${TR.icone(c.cle)}</span><span${ed(`site.troupe.categories.${c.i}.titre`)}>${esc(c.titre)}</span></h3>
      ${listes}</section>`;
  }
  function troupeHtml() {
    if (!TR || !site().troupe) return '';
    const cs = TR.categories().filter(c => c.places.length);
    if (!cs.length) return '';
    // le jeu (le plus nombreux) à gauche, en planche ; les autres métiers à droite, deux colonnes
    const jeu = cs.find(c => c.cle === 'jeu') || cs.reduce((a, b) => (b.places.length > a.places.length ? b : a)), autres = cs.filter(c => c !== jeu);
    return `<section class="wrap bloc troupe-m03" aria-labelledby="h-troupe">
      <h2 class="h2s" id="h-troupe"${ed('site.troupe.titre')}>${esc(TR.titre())}</h2>
      <div class="tr3" data-troupe>
        <div class="tr3-racine" aria-hidden="true"><span class="tr3-logo">${D.logo.mark}</span><i class="tr3-tronc"></i></div>
        ${categorieTroupe(jeu, ' tr3-jeu', true)}
        ${autres.length ? `<div class="tr3-autres">${autres.map(c => categorieTroupe(c)).join('')}</div>` : ''}
      </div></section>`;
  }
  // la troupe prend vie : les liens entre les places d'une personne, les icônes qui s'animent une fois à leur arrivée
  function vivreTroupe() {
    if (troupeCtl) { troupeCtl.detruire(); troupeCtl = null; }
    if (troupeIO) { troupeIO.disconnect(); troupeIO = null; }
    const tr = main.querySelector('.tr3');
    if (!tr || !TR) return;
    troupeCtl = TR.relier(tr, { liens: true, clavier: true });
    if (bouge() && 'IntersectionObserver' in window) {
      troupeIO = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return; troupeIO.unobserve(x.target); x.target.classList.add('est-vivant'); setTimeout(() => x.target.classList.remove('est-vivant'), 1600); }), { rootMargin: '0px 0px -12% 0px' });
      tr.querySelectorAll('.troupe-icone').forEach(i => troupeIO.observe(i));
    }
    // une photo publiée qui ne se charge pas (le fichier manque) : sa place garde le nom seul, à sa place
    tr.addEventListener('error', e => {
      const i = e.target; if (!i || !i.matches || !i.matches('img[data-troupe-photo]')) return;
      const a = i.closest('[data-troupe-ancre]'), li = i.closest('.tr3-li'), b = i.closest('.tr3-place');
      if (a) a.className = 'tr3-pt';
      if (li) li.classList.remove('a-photo'); if (b) b.classList.remove('a-photo');
      i.remove();
    }, true);
  }

  /* ---------- La compagnie, le contact, les mentions ---------- */
  function compagnieHtml() {
    const c = site().compagnie || {}, d = c.directeur;
    return `${tete(c.titre, { chemin: 'site.compagnie.titre' })}
      <div class="wrap g12 co">
        <div class="co-text">${(c.paragraphes || []).map((p, i) => bloc(p, `site.compagnie.paragraphes.${i}`)).join('')}</div>
      </div>
      ${troupeHtml()}
      <div class="wrap g12 co co-reperes">
        <section class="co-dates" aria-labelledby="h-dates"><h2 class="co-h" id="h-dates"${ed('site.compagnie.datesTitre')}>${esc(c.datesTitre)}</h2>
          <ol class="annees">${(c.dates || []).map((x, i) => `<li><span class="an"${ed(`site.compagnie.dates.${i}.annee`)}>${esc(x.annee)}</span><span class="an-t"${ed(`site.compagnie.dates.${i}.titre`)}>${esc(x.titre)}</span></li>`).join('')}</ol></section>
        ${(c.dates || []).length ? `<section class="co-frise" aria-labelledby="h-dates"><div data-fr="compagnie"></div></section>` : ''}
      </div>
      ${d ? `<section class="wrap g12 dir" aria-labelledby="h-dir"><div class="dir-h"><h2 id="h-dir"${ed('site.compagnie.directeur.titre')}>${esc(d.titre)}</h2>${d.chapeau ? `<p${ed('site.compagnie.directeur.chapeau')}>${esc(d.chapeau)}</p>` : ''}</div>
        <div class="dir-t">${(d.paragraphes || []).map((p, i) => bloc(p, `site.compagnie.directeur.paragraphes.${i}`)).join('')}</div></section>` : ''}
      ${site().partenaires ? `<div class="wrap"><p class="partenaires"${ed('site.partenaires')}>${site().partenaires}</p></div>` : ''}`;
  }
  function contactHtml() {
    const c = site().contact || {}, co = site().coordonnees || {}, ch = c.champs || [];
    const i = String(c.consentement || '').toLowerCase().indexOf('politique de confidentialité');
    const consent = i > 0 ? `${esc(c.consentement.slice(0, i))}<a href="#/politique-de-confidentialite">${esc(c.consentement.slice(i))}</a>` : esc(c.consentement);
    const types = [['text', 'name'], ['email', 'email'], ['tel', 'tel'], ['text', 'address-level2']];
    return `${tete(c.titre, { chemin: 'site.contact.titre' })}
      <div class="wrap g12 ct">
        <form class="form ct-form" novalidate>
          <div class="fld-2">${ch.slice(0, 4).map((f, k) => `<p class="fld"><label for="f${k}">${esc(f)}</label><input id="f${k}" type="${types[k][0]}" autocomplete="${types[k][1]}"></p>`).join('')}</div>
          ${ch[4] ? `<p class="fld"><label for="f4">${esc(ch[4])}</label><textarea id="f4" rows="7"></textarea></p>` : ''}
          <p class="chk"><input id="f5" type="checkbox"><label for="f5">${consent}</label></p>
          <p class="calc"><label for="f6">${esc(c.calcul)}</label><input id="f6" inputmode="numeric" autocomplete="off"></p>
          <button class="btn" type="submit">${esc(c.bouton)}</button>
        </form>
        <address class="ct-co"><b>${esc(co.nom)}</b><br>${(co.adresse || []).map(esc).join('<br>')}</address>
      </div>`;
  }
  // les mentions d'origine, sans le crédit de l'agence web d'origine
  const legalHtml = key => { const g = site().legal[key]; return `${tete(g.titre, { chemin: `site.legal.${key}.titre` })}<div class="wrap"><div class="prose legal">${(g.blocs || []).map((b, i) => /réalisation multimédia|envoilauneidee/i.test(b) ? '' : bloc(b, `site.legal.${key}.blocs.${i}`)).join('')}</div></div>`; };

  /* ---------- L'en-tête et le pied ---------- */
  const teteEl = document.getElementById('tete'), piedEl = document.querySelector('.site-foot');
  // les pictogrammes du menu (règle 21), au trait, dans la grille : le calendrier de la saison, le rideau de scène, la troupe, la
  // porte de l'espace pro (des icônes sans texte : le nom de chaque élément est écrit à côté)
  const PICTOS = {
    saisons: '<rect x="3.5" y="4.5" width="17" height="15.5" rx="1"/><path d="M3.5 9h17M8 2.5v4M16 2.5v4M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/>',
    spectacles: '<path d="M3 4h18M4 4v16M20 4v16M4 4c1.5 6 4.3 9 8 9s6.5-3 8-9M2.5 20h19"/>',
    compagnie: '<circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3.5 19.5c.5-3.6 2.7-5.6 5.5-5.6s5 2 5.5 5.6M14.8 14.2c2.9-.4 5.2 1.5 5.7 5.3"/>',
    espacePro: '<path d="M6 20.5V3.5h12v17M3.5 20.5h17"/><circle cx="14.6" cy="12.3" r="1" fill="currentColor" stroke="none"/>',

        effet: effetReserver, surChoix: (d, k) => { rsAgCle = k; if (!d) marquerCommune(liste, null); marquerFrise(d || null); } });
      liste.addEventListener('keydown', ev => {
        if (ev.key !== 'Escape' || !rsAg || rsAg.cle() == null) return;
        const b = liste.querySelector(`[data-reserver="${CSS.escape(rsAg.cle())}"]`), li = b && b.closest('li');
        if (li && li.contains(ev.target)) { ev.preventDefault(); rsAg.choisir(null); b.focus(); }
      });
      // une adresse qui nomme une date (un lien partagé) : la liste s'ouvre sur sa carte
      if (voulue && !fixe && rsAg.cle() === voulue) bientot(() => { const b = liste.querySelector(`[data-reserver="${CSS.escape(voulue)}"]`); if (b) { b.scrollIntoView({ block: 'center' }); b.focus({ preventScroll: true }); } });
    }
    const zone = main.querySelector('.rs-zone');
    if (zone) {
      const slug = zone.dataset.slug, res = RS.dates(slug);
      const k0 = fixe && rsSpEtat.slug === slug && rsSpEtat.cle ? rsSpEtat.cle : voulue && res.some(d => RS.cle(d) === voulue) ? voulue : 'premiere';
      // (l'univers : celui de l'article, hérité, de jour comme de nuit ; rien à poser sur la carte)
      rsSp = RS.monter(zone.querySelector('.rs-bande'), { dates: res, carte: zone.querySelector('.rs-carte'), choisie: k0, adresse: true, univers: () => '',
        effet: effetReserver, surChoix: (d, k) => { rsSpEtat = { slug, cle: k }; } });
      bientot(() => { if (rsSp) rsSp.montrer(); });
      if (voulue && !fixe && k0 === voulue) bientot(() => { zone.scrollIntoView({ block: 'start' }); const b = zone.querySelector('.rs-date[aria-pressed="true"]'); if (b) b.focus({ preventScroll: true }); });
    }
  }
  function brancher(fixe) {
    if (ro) ro.disconnect();
    main.querySelectorAll('svg.carte-m03').forEach(svg => brancherVue(svg, fixe));
    majAgenda(false, true);
    reserver(fixe);
    // établissement : les prochaines dates scolaires sur la frise de la saison (une seule ligne, à la couleur de chaque spectacle)
    const sc = document.getElementById('sc-fs');
    if (sc) { const lie = sc.closest('.sc'); FS = poserFrise(sc, { pts: datesScol().map(ptProchain), liste: lie, carte: lie.querySelector('svg.carte-m03'), libelle: LIB().enEtablissement }); }
    friserVue();
    vivreTroupe();
    // Je souhaite programmer : les autres fiches, trois par trois, puis la carte de tous les lieux
    const pg = document.getElementById('pg');
    if (pg && !fixe) {
      const fiches = pg.querySelector('.fiches'), reste = shows().slice(2), etapes = [];
      for (let i = 0; i < reste.length; i += 3) { const lot = reste.slice(i, i + 3); etapes.push(() => { fiches.insertAdjacentHTML('beforeend', lot.map(ficheProg).join('')); friserVue(fiches); }); }
      let k = null, svg = null;
      etapes.push(() => {
        const c = document.getElementById('pg-carte'); if (!c) return;
        k = carteSvg({ lieux: TOUT, titre: LIB().lieuxDiffusion, fixe: false, enDeux: true });
        c.innerHTML = k.html; svg = c.querySelector('svg.carte-m03');
        pousser(svg);
      });
      etapes.push(() => {
        if (!svg || !svg.isConnected) return;
        svg.querySelector('.lieux-g').innerHTML = k.lieux; svg.querySelector('.noms').innerHTML = k.noms;
        brancherVue(svg, false, false);
        majProg();
      });
      plusTard(etapes);
    }
    majProg();
    sommaire();
  }
  // une carte de la vue : ses noms (à sa taille), ses liens avec la liste, son entrée
  function brancherVue(svg, fixe, entree = true) {
    if (!svg) return;
    if (ro) ro.observe(svg); else etiqueter(svg);
    CARTE.lier(svg, { survol: l => survolLieu(svg, l), choix: l => choisirLieu(svg, l) });
    if (!entree) return;
    if (fixe) svg.classList.add('pousse');
    else if (!(svg.dataset.attente && INTRO.ouverte())) pousser(svg);
  }
  // le petit sommaire qui suit la lecture (onglet « Je viens voir un spectacle » d'un spectacle)
  function sommaire() {
    if (espion) { espion.disconnect(); espion = null; }
    const nav = main.querySelector('.u-sommaire');
    if (!nav || !('IntersectionObserver' in window)) return;
    const liens = [...nav.querySelectorAll('a[data-chap]')], vis = new Map();
    const marque = () => {
      let id = null;
      for (const a of liens) if (vis.get(a.dataset.chap)) { id = a.dataset.chap; break; }
      if (id) liens.forEach(a => a.classList.toggle('ici', a.dataset.chap === id));
    };
    espion = new IntersectionObserver(es => { es.forEach(e => vis.set(e.target.id, e.isIntersecting)); marque(); }, { rootMargin: '-90px 0px -55% 0px' });
    liens.forEach(a => { const s = document.getElementById(a.dataset.chap); if (s) espion.observe(s); });
    if (liens[0]) liens[0].classList.add('ici');
  }

  /* ---------- Une mise à jour des données (règle 9) : la vue courante se refait en place ---------- */
  function cleDe(el) {
    if (!el || el === document.body || el === main) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset && el.dataset.k) return `[data-k="${CSS.escape(el.dataset.k)}"]`;
    if (el.dataset && el.dataset.edit) return `[data-edit="${CSS.escape(el.dataset.edit)}"]`;
    if (el.matches && el.matches('.carte-lieu')) { const c = lieDe(el); return c && c.id ? `#${CSS.escape(c.id)} .carte-lieu[data-l="${el.dataset.l}"]` : `.carte-lieu[data-l="${el.dataset.l}"]`; }
    if (el.matches && el.matches('a[href]')) return `a[href="${CSS.escape(el.getAttribute('href'))}"]`;
    return null;
  }
  let rafraichirPlusTard = 0;
  function rafraichir() {
    // une vidéo chargée (règle 18) : la vue ne se refait pas sous elle (elle s'arrêterait) ; on y revient quand elle ne l'est plus
    clearTimeout(rafraichirPlusTard);
    if (LC && LC.actif()) { rafraichirPlusTard = setTimeout(rafraichir, 2500); return; }
    cachePasse = null;
    const y = window.scrollY, act = document.activeElement, cle = cleDe(act);
    const sel = act && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const ouverts = [...main.querySelectorAll('details[data-k]')].filter(d => d.open).map(d => d.dataset.k);
    polices(); couleurs();
    enTete(); pied();
    route({ enPlace: true });
    ouverts.forEach(k => { const d = main.querySelector(`details[data-k="${CSS.escape(k)}"]`); if (d) d.open = true; });
    if (cle) {
      const el = document.querySelector(cle);
      if (el) { el.focus({ preventScroll: true }); if (sel && typeof el.setSelectionRange === 'function') try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* champ sans sélection */ } }
    }
    window.scrollTo(0, y);
  }

  /* ---------- Les évènements ---------- */
  let rangOn = null;
  function surRang(r) {
    if (r === rangOn) return;
    if (rangOn) allumer(svgDe(rangOn), null);
    rangOn = r;
    if (!r) return;
    const l = r.dataset.l;
    allumer(svgDe(r), { l: l != null && l !== '' ? +l : null, slug: r.dataset.slug || null });
  }
  main.addEventListener('mouseover', e => surRang(e.target.closest('.dt')));
  // la légende de la frise de la saison, survolée : les dates de ce spectacle seules sur la frise, ses bras sur la carte
  main.addEventListener('pointerover', e => { const li = e.target.closest && e.target.closest('.fs-l[data-cle]'); if (li || legendeOn) survolLegende(li); }, { passive: true });
  main.addEventListener('mouseleave', () => surRang(null));
  main.addEventListener('focusin', e => surRang(e.target.closest('.dt')));
  document.addEventListener('click', e => {
    const el = e.target.closest('button, a');
    if (!el) return;
    if (el.matches('.skip')) { e.preventDefault(); main.focus(); return; }
    if (el.matches('.idx, .idx-tout')) { surIndex(el); return; }
    if (el.matches('.f-edit')) { if (typeof EDITION !== 'undefined') EDITION.ouvrir(); return; }
    if (el.matches('a[data-chap]')) {
      e.preventDefault();
      const s = document.getElementById(el.dataset.chap);
      if (s) { s.scrollIntoView({ behavior: CARTE.mouvement() ? 'smooth' : 'auto', block: 'start' }); s.focus({ preventScroll: true }); }
      return;
    }
    if (el.matches('a[href^="#/"]') && el.getAttribute('href') === location.hash) { e.preventDefault(); route(); return; }
    // un lien du site (#/…), d'un clic simple : l'adresse change ici même (history.pushState) et la vue suit dans la même tâche
    // (l'élément du menu se marque, la page se compose à l'image d'après). Le navigateur, lui, ferait le tour par son processus
    // avant le hashchange : le geste ne se verrait qu'avec la page nouvelle. Le retour et l'avance passent par popstate.
    if (el.matches('a[href^="#/"]') && !e.defaultPrevented && e.button === 0 && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) && !el.target && !el.hasAttribute('download')) {
      e.preventDefault();
      try { history.pushState(null, '', el.getAttribute('href')); } catch (err) { location.hash = el.getAttribute('href'); return; }
      route();
      return;
    }
    const mod = el.closest('[data-module]'), prog = !!(mod && mod.dataset.module === 'prog'), st = prog ? PG : AG, maj = prog ? majProg : majAgenda;
    if (el.matches('.chip') && mod) {
      st.slug = st.slug === el.dataset.slug ? null : el.dataset.slug;
      if (!prog && mod.dataset.mode === 'accueil' && AG.l != null && !datesPub().some(d => d.l === AG.l && (!AG.slug || d.slug === AG.slug))) AG.l = null;
      if (prog && PG.l != null && !TOUT.some(x => x.l === PG.l && (!PG.slug || x.dates.some(d => d.slug === PG.slug)))) PG.l = null;
      mod.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.slug === st.slug)));
      bientot(() => maj(true));
    } else if (el.matches('.lieu-chip') && mod) { st.l = null; maj(); }
    else if (el.matches('.lieu-btn') && mod) { PG.l = +el.dataset.l; majProg(true); }
  });
  document.addEventListener('submit', e => e.preventDefault());
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { AG.q = e.target.value; majAgenda(); }
    else if (e.target.id === 'pq') { PG.q = e.target.value; PG.l = null; majProg(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (e.target.id === 'q' && e.target.value) { e.target.value = ''; AG.q = ''; majAgenda(); }
    else if (e.target.id === 'pq' && e.target.value) { e.target.value = ''; PG.q = ''; majProg(); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => main.querySelectorAll('svg.carte-m03').forEach(etiqueter));

  // les contours (la France, la Belgique, le Luxembourg), écrits une seule fois : chaque carte les reprend par <use>
  document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><path id="m03-pays" d="${CARTE.fond.pays}"/><path id="m03-belgique" d="${CARTE.fond.belgique}"/><path id="m03-luxembourg" d="${CARTE.fond.luxembourg}"/></defs></svg>`);
  // la pieuvre ne bouge pas (règle 15) : aucune tentacule, ni au clic ni au changement de page ; la pression, partout
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'encre', clic: false, pages: false });
  if (MV) MV.presse(document);
  couleurs(); enTete(); pied(); polices();
  // quand le navigateur n'a rien d'autre à faire : l'agenda passé se lit, les polices des univers se chargent (une police qui
  // arrive pendant qu'on lit refait toute la mise en page)
  const auRepos = 'requestIdleCallback' in window ? requestIdleCallback : f => setTimeout(f, 400);
  auRepos(() => agendaPasse());
  auRepos(() => { if (document.fonts && document.fonts.load) shows().forEach(x => { const u = univers(x); if (u.police) document.fonts.load(`${u.graisse} 1em '${u.police}'`).catch(() => {}); }); });
  // l'ouverture : le papier réglé de l'agenda, la pieuvre à l'encre du thème (règle 22 : « couleur » sur le papier du jour,
  // « vive » sur celui de la nuit) ; à la révélation, les bras de la carte poussent depuis Rouen
  const ouvertureNuit = typeof THEME !== 'undefined' && THEME.actuel() === 'nuit', th = couleurSaison();
  INTRO.ouvrir({ fond: ouvertureNuit ? NUIT : PAPIER, encre: th ? (ouvertureNuit ? th.nuit : th.jour) : (ouvertureNuit ? '#f1ede5' : '#141414'), classe: 'intro-m03',
    apres: () => main.querySelectorAll('svg.carte-m03:not(.pousse)').forEach(pousser) });
  // l'adresse changée d'ailleurs (le retour, l'avance, une adresse tapée, location.hash) : la vue suit, une seule fois
  window.addEventListener('hashchange', () => { if (location.hash !== routee) route(); });
  window.addEventListener('popstate', () => { if (location.hash !== routee) route(); });
  if (typeof DONNEES !== 'undefined' && DONNEES.surChangement) DONNEES.surChangement(rafraichir);
  route();
})();
</script>
