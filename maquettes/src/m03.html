<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400..700;1,400&family=Space+Grotesk:wght@400..700&family=Ubuntu:wght@700&family=Cormorant+Garamond:wght@600&family=Bodoni+Moda:wght@700&family=Anton&family=Grenze+Gotisch:wght@600&family=IM+Fell+English&family=IM+Fell+French+Canon&display=swap">
<style>
:root {
  --paper: #f4f1ea;
  --paper-2: #ebe6db;
  --field: #fbf9f5;
  --ink: #141414;
  --ink-2: #57524a;
  --rule: #dcd6cb;
  --rule-2: #bfb7a8;
  --mag: #bc3e80;
  --mag-ink: #a3306c;
  --sg: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --at: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --gut: clamp(16px, 4vw, 48px);
  --gap: 24px;
  --h1: 60px;           /* la rangée de la marque et du menu second */
  --h2: 56px;           /* la rangée des trois entrées, qui reste en haut */
  --head: var(--h2);
  --bas: 0px;           /* la barre des entrées en bas d'écran, au téléphone */
  /* la carte, sur le papier de l'agenda */
  --k-pays: var(--field);
  --k-trait: var(--rule-2);
  --k-encre: var(--ink);
  --k-encre-2: var(--ink-2);
  --k-halo: var(--paper);
  --k-hub: var(--ink);
  --k-passe: var(--ink-2);
  --k-focus: var(--mag);
  /* l'édition sur place (EDITION) : la barre, la connexion et le panneau des dates sur le papier de l'agenda */
  --ed-fond: #fbf9f5;
  --ed-encre: #141414;
  --ed-accent: #a3306c;
  --ed-sur-accent: #ffffff;
  --ed-police: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --ed-rayon: 8px;
  --ed-trait: #bfb7a8;
  /* les tentacules (TENTACULES) : la pieuvre de l'en-tête guide, à l'encre du programme sur le papier réglé ; les empreintes de ventouse sont magenta */
  --tt-encre: #141414;
  --tt-accent: #a3306c;
  --tt-neutre: #8a847a;
  --tt-epaisseur: 2.4;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head) + 16px); scroll-padding-bottom: var(--bas); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.125rem/1.5 var(--at); font-kerning: normal; }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }
h1, h2, h3 { font-family: var(--sg); font-weight: 500; margin: 0; line-height: 1.1; letter-spacing: -.02em; }
p, figure, dl, dd, blockquote { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }
table { border-collapse: collapse; }
:focus-visible { outline: 3px solid var(--mag); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 16px; font-weight: 700; }
.skip:focus { top: 8px; }

.wrap { width: 100%; max-width: calc(1320px + 2 * var(--gut)); margin-inline: auto; padding-inline: var(--gut); }
.g12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); }
.dot { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--ink-2)); }
.statut { display: inline-block; padding: 3px 11px 4px; border: 1px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font: 700 .875rem/1.3 var(--at); }
.fl { display: inline-block; vertical-align: -3px; }

/* ---------- L'en-tête : la marque et le menu second, puis les trois entrées, qui restent en haut ---------- */
.site-head { position: sticky; top: calc(-1 * var(--h1)); z-index: 30; background: var(--paper); }
.tete-1 { height: var(--h1); border-bottom: 1px solid var(--rule); }
.tete-1 .wrap { display: flex; align-items: center; height: 100%; }
.brand { display: inline-flex; align-items: center; gap: 10px; flex: none; text-decoration: none; font: 600 1.5rem/1 var(--sg); letter-spacing: -.03em; }
.brand-mark { width: 34px; height: 34px; }
.brand-mark svg { display: block; width: 100%; height: 100%; }
.entrees { border-bottom: 1px solid var(--ink); background: var(--paper); }
.entrees ul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: var(--h2); }
.entrees li { display: flex; min-width: 0; }
.entrees li + li { border-left: 1px solid var(--rule); }
.entrees a { position: relative; flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0 18px; text-decoration: none; color: var(--ink); font: 500 1.125rem/1.15 var(--sg); letter-spacing: -.015em; transition: background-color .2s, color .2s; }
/* chaque entrée porte sa couleur : un trait fin, plein quand on y est */
.entrees a::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 6px; background: var(--e); transform: scaleY(.34); transform-origin: top; transition: transform .2s; }
.entrees a:hover { background: color-mix(in srgb, var(--e) 6%, var(--paper)); }
.entrees a:hover::before { transform: scaleY(.67); }
.entrees a[aria-current] { font-weight: 600; background: color-mix(in srgb, var(--e) 9%, var(--paper)); }
.entrees a[aria-current]::before { transform: none; }
.e-pt { flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--e); }
.e-court { display: none; }
.e-fl { margin-left: auto; color: var(--e); opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
.entrees a:hover .e-fl, .entrees a[aria-current] .e-fl { opacity: 1; transform: none; }
.entrees a > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu2 { position: absolute; top: 0; right: max(var(--gut), calc((100% - 1320px) / 2)); height: var(--h1); display: flex; align-items: center; }
.menu2 ul { display: flex; gap: 24px; }
.menu2 a { display: block; padding: 6px 0 4px; text-decoration: none; font-weight: 600; font-size: .9375rem; color: var(--ink-2); border-bottom: 2px solid transparent; }
.menu2 a:hover { color: var(--ink); border-bottom-color: var(--rule-2); }
.menu2 a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.menu-btn { display: none; position: absolute; top: calc((var(--h1) - 40px) / 2); right: var(--gut); align-items: center; gap: 9px; height: 40px; padding: 0 16px 0 13px; border: 1px solid var(--ink); border-radius: 999px; background: none; font-weight: 600; font-size: 1rem; }

/* ---------- Tête de page ---------- */
.hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 22px; align-items: end; padding-top: 52px; padding-bottom: 30px; }
.hero > * { grid-column: 1 / -1; }
.hero > .hero-main { grid-column: 1 / 9; }
.hero > .hero-side { grid-column: 9 / 13; justify-self: end; text-align: right; }
.saison { font-size: 4rem; line-height: .95; letter-spacing: -.045em; }
.sur { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font: 700 .8125rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.sur .e-pt { width: 13px; height: 13px; }
.hero-saison { font: 500 2.25rem/1 var(--sg); letter-spacing: -.035em; color: var(--ink-2); white-space: nowrap; }
.lead { max-width: 62ch; font: 400 1.375rem/1.5 var(--at); }
.h2s { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); font-size: 2.5rem; letter-spacing: -.035em; }
.h2s.grand { font-size: 3.25rem; letter-spacing: -.045em; }
.bloc { margin-top: 96px; }
.agir { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 700; font-size: 1.0625rem; transition: background-color .2s; }
.agir:hover { background: var(--mag-ink); }
.agir svg { transition: transform .2s; }
.agir:hover svg { transform: translateX(4px); }
.suite { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; font: 500 1.375rem/1.2 var(--sg); letter-spacing: -.015em; text-decoration: none; }
.suite svg { color: var(--e, var(--mag)); transition: transform .2s; }
.suite:hover span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
.suite:hover svg { transform: translateX(4px); }

/* ---------- Accueil : le choix entre les trois entrées ---------- */
.choix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.choix a { position: relative; display: flex; flex-direction: column; height: 100%; text-decoration: none; background: var(--field); border-top: 6px solid var(--e); }
.choix-img { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; background: var(--ev); }
.choix-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08); transition: filter .45s, transform .6s; }
.choix-img::after { content: ""; position: absolute; inset: 0; background: var(--ev); mix-blend-mode: multiply; transition: opacity .45s; }
.choix a:hover .choix-img img, .choix a:focus-visible .choix-img img { filter: none; transform: scale(1.03); }
.choix a:hover .choix-img::after, .choix a:focus-visible .choix-img::after { opacity: 0; }
.choix-t { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex: 1; padding: 20px 22px 24px; font: 500 clamp(1.5rem, 2.3vw, 2.125rem)/1.05 var(--sg); letter-spacing: -.035em; }
.choix-t svg { flex: none; width: 30px; height: 30px; color: var(--e); transition: transform .2s; }
.choix a:hover .choix-t svg { transform: translateX(5px); }

/* ---------- L'agenda : filtres, recherche, carte et liste reliées ---------- */
.ag-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip, .lieu-chip, .lieu-btn { display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 15px 0 12px; border: 1px solid var(--rule-2); border-radius: 999px; background: var(--field); font-weight: 600; font-size: .9375rem; line-height: 1.2; text-align: left; }
.chip:hover, .lieu-btn:hover { border-color: var(--ink); }
.chip[aria-pressed="true"], .lieu-chip { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--paper); }
.lieu-chip svg { margin-left: 2px; }
.lieu-pin { width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 50%; }
.ag-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.field { position: relative; width: 260px; }
.field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-2); pointer-events: none; }
.field input { width: 100%; height: 42px; padding: 0 14px 0 42px; border: 1px solid var(--rule-2); border-radius: 999px; background: var(--field); font-size: 1rem; }
.field input::placeholder { color: var(--ink-2); opacity: 1; }
.field input:focus-visible { outline-offset: 0; border-color: var(--ink); }
.ag-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; }
.ag-carte { position: sticky; top: calc(var(--head) + 8px); padding-top: 18px; }
.ag-carte svg { max-height: calc(100vh - var(--head) - 36px); }
.ag-accueil .ag-carte { grid-column: 1 / 8; grid-row: 1; }
.ag-accueil .ag-liste { grid-column: 8 / 13; grid-row: 1; }
.ag-complet .ag-liste, .pg-liste { grid-column: 1 / 9; grid-row: 1; }
.ag-complet .ag-carte, .pg .ag-carte { grid-column: 9 / 13; grid-row: 1; }
.ag-liste, .pg-liste { min-width: 0; }
.mois { margin-top: 30px; }
.mois-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); font-size: 1.875rem; }
.mois-h .mo { text-transform: capitalize; }
.mois-h .yr { color: var(--ink-2); font-weight: 400; }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: var(--gap); padding: 17px 0 18px; border-bottom: 1px solid var(--rule); }
.dt { position: relative; transition: background-color .2s; }
.dt::before { content: ""; position: absolute; left: -14px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--c, var(--ink)); opacity: 0; transition: opacity .2s; }
.dt.on::before, .dt:hover::before, .dt:focus-within::before { opacity: 1; }
.dt.on { background: color-mix(in srgb, var(--c, var(--ink)) 9%, transparent); }
.when { font-family: var(--sg); line-height: 1; }
.j-big { font-size: 3rem; font-weight: 500; line-height: .82; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.j-big sup { font-size: .4em; letter-spacing: 0; vertical-align: .95em; margin-left: 1px; }
.j-pre, .j-rest, .j-v { font-size: 1.125rem; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.j-mo { font-size: 1.75rem; font-weight: 500; letter-spacing: -.03em; }
.j-sous { display: block; margin-top: 9px; font: 400 .9375rem/1.3 var(--at); color: var(--ink-2); }
.what { min-width: 0; overflow-wrap: anywhere; }
.t-link { display: inline-flex; align-items: baseline; gap: 10px; font: 500 1.375rem/1.2 var(--sg); letter-spacing: -.015em; text-decoration: none; }
.t-link .dot { position: relative; top: -.06em; }
a.t-link:hover .t-txt { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
.where { margin-top: 5px; padding-left: 22px; font-weight: 600; }
.det { margin-top: 6px; padding-left: 22px; color: var(--ink-2); font-size: 1rem; line-height: 1.45; }
.det li + li { margin-top: 4px; }
.det a { color: var(--mag-ink); font-weight: 600; }
.det a svg { display: inline; margin-left: 4px; vertical-align: -1px; }
.ag-accueil .mois { margin-top: 22px; }
.ag-accueil .mois-h { font-size: 1.5rem; padding-bottom: 8px; }
.ag-accueil .row { grid-template-columns: 124px minmax(0, 1fr); column-gap: 18px; padding: 13px 0 14px; }
.ag-accueil .j-big { font-size: 2.375rem; }
.ag-accueil .j-mo { font-size: 1.5rem; }
.ag-accueil .t-link { font-size: 1.1875rem; }
.ag-accueil .where { margin-top: 3px; font-size: 1rem; }

/* ---------- La carte des tournées : des bras à la couleur des spectacles, une pastille au bout ---------- */
.carte-m03 { display: block; width: 100%; height: auto; font-family: var(--sg); }
.carte-m03 .pays { fill: var(--k-pays); stroke: var(--k-trait); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.carte-m03 .voisin { fill: none; stroke: var(--k-trait); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 2 3; }
.carte-m03 .encart { fill: none; stroke: var(--k-trait); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 3 4; }
.carte-m03 mask path { fill: none; stroke: #fff; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.carte-m03.pousse mask path { stroke-dashoffset: 0; transition: stroke-dashoffset 1s cubic-bezier(.55, 0, .2, 1) var(--d, 0s); }
.carte-m03 .bras { opacity: .92; transition: opacity .3s; }
.carte-m03.focus .bras { opacity: .12; }
.carte-m03.focus .bras.on { opacity: 1; }
.carte-m03 .bras.hors { opacity: .06; }
.carte-m03 .bras-passe { fill: var(--k-passe); opacity: .3; }
.carte-m03 .pt-passe { fill: var(--k-passe); opacity: .6; }
.carte-m03 .hub-o { fill: var(--k-halo); stroke: var(--k-hub); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.carte-m03 .hub-i { fill: var(--k-hub); }
.carte-m03 .pt-bord { fill: none; stroke: var(--k-halo); }
.carte-lieu { cursor: pointer; transition: opacity .3s; }
.carte-lieu:focus { outline: none; }
.carte-lieu .pt { transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform .45s cubic-bezier(.34, 1.56, .64, 1) calc(var(--d, 0s) + .75s); }
.carte-m03.pousse .carte-lieu .pt, .carte-lieu.hub .pt { transform: none; }
.carte-lieu .pt-in { transform-box: fill-box; transform-origin: center; transition: transform .25s; }
.carte-lieu.on .pt-in, .carte-lieu.sel .pt-in { transform: scale(1.6); }
.carte-lieu.hub.on .pt-in, .carte-lieu.hub.sel .pt-in { transform: scale(1.3); }
.carte-lieu .aura { fill: transparent; stroke: none; transition: fill .2s; }
.carte-lieu.on .aura { fill: color-mix(in srgb, var(--c) 24%, transparent); }
.carte-lieu.sel .aura { stroke: var(--k-encre); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.carte-lieu:focus-visible .aura { stroke: var(--k-focus); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }
.carte-m03.focus .carte-lieu:not(.on) { opacity: .45; }
.carte-lieu.hors { opacity: .16 !important; pointer-events: none; }
.carte-m03 .noms, .carte-m03 .rouen-nom { pointer-events: none; }
.carte-m03.pousse .noms { animation: apparait .5s 1.2s both; }
.carte-m03 .nom, .carte-m03 .rouen-nom { font-size: var(--fs, 12.5px); font-weight: 500; fill: var(--k-encre); paint-order: stroke; stroke: var(--k-halo); stroke-width: calc(3.5px * var(--k, 1)); stroke-linejoin: round; }
.carte-m03 .rouen-nom { font-weight: 700; }
.carte-m03 .nom { transition: opacity .25s; }
.carte-m03 .nom .dep, .carte-m03 .nom-passe { fill: var(--k-encre-2); font-weight: 400; }
.carte-m03 .nom.cache, .carte-m03 .nom.hors { opacity: 0; }
.carte-m03.focus .nom:not(.on):not(.cache):not(.hors) { opacity: .3; }
.carte-m03 .nom.on { opacity: 1; }
@keyframes apparait { from { opacity: 0; } }
/* une mise à jour des données refait la vue sans rejouer les entrées */
.fixe .carte-m03 mask path, .fixe .carte-lieu .pt { transition: none !important; }
.fixe .carte-m03 .noms, .fixe .u-h1 .l { animation: none !important; }

/* ---------- Les spectacles dans leur univers : cartes ---------- */
.ucs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); padding-top: 26px; }
.ucs.riches { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px var(--gap); }
.uc { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--u-fond); color: var(--u-texte); isolation: isolate; transition: box-shadow .3s, transform .3s; }
.uc:hover { box-shadow: 0 18px 42px -18px var(--u-lueur), 0 0 0 1px color-mix(in srgb, var(--u-titre) 40%, transparent); }
.uc-img { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; background: var(--u-fond2); }
.uc-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.uc:hover .uc-img img { transform: scale(1.04); }
.uc-img .statut { position: absolute; left: 12px; top: 12px; }
.uc-b { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 18px 20px 22px; }
.uc-t { font: var(--u-gr) 2rem/1 var(--u-police); letter-spacing: 0; color: var(--u-titre); overflow-wrap: break-word; hyphens: auto; }
.uc-t a { text-decoration: none; }
.uc-t a::after { content: ""; position: absolute; inset: 0; z-index: 2; }
.uc-t a:focus-visible { outline: none; }
.uc:focus-within { outline: 3px solid var(--u-vif); outline-offset: 3px; }
.uc-t .l { display: block; }
.uc-s { font-size: 1rem; color: var(--u-texte2); }
.uc-acc { font-size: 1rem; line-height: 1.5; }
.uc-n { margin-top: auto; padding-top: 10px; border-top: 2px solid var(--u-titre); font-size: .9375rem; font-weight: 600; }
.uc > .motif, .tour > .motif { position: absolute; right: -14px; bottom: -14px; z-index: 0; width: 120px; height: auto; color: var(--u-titre); opacity: .2; pointer-events: none; }
/* les motifs en bande : le fil rouge, la frise 1850 → 2077, dans le cours de la mise en page */
.motif.bande { display: block; pointer-events: none; }
.motif.bande svg { display: block; width: 100%; height: 26px; overflow: visible; }
.motif.bande[data-motif="fil"] svg { height: 36px; }
.ans { display: flex; justify-content: space-between; margin-top: 5px; font: 600 .75rem/1 var(--sg); letter-spacing: .06em; }
.ans i { font-style: normal; }
.frise { color: var(--u-titre); opacity: .55; }
.uc-b > .frise { margin-top: 6px; }
.fc-frise { grid-column: 1 / -1; }
.u-frise { grid-column: 1 / -1; color: var(--u-titre); opacity: .6; }
.u-frise .motif.bande svg { height: 30px; }
.u-frise .motif.bande[data-motif="fil"] svg { height: 64px; }
.riches .uc-t { font-size: 2.375rem; }

  background: var(--u-fond); color: var(--u-texte); padding-bottom: 96px; }

.vers blockquote span { display: block; }

.vers cite { display: block; margin-top: 10px; font: normal 600 .875rem/1.4 var(--at); color: var(--u-texte2); }
.photos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; margin-top: 24px; }
.photos figure { position: relative; grid-column: span 3; }
.photos figure:first-child { grid-column: 1 / -1; }
.photos img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--u-fond2); }
.photos figure:first-child img { aspect-ratio: 16 / 9; }
.carton { position: relative; z-index: 1; width: fit-content; max-width: min(92%, 52ch); margin: -30px 0 0 16px; padding: 10px 14px 11px; background: var(--u-fond2); color: var(--u-texte); font-size: .9375rem; line-height: 1.45; box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .45); }
.credits { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: .875rem; color: var(--u-texte2); }
.bande-a { display: flex; align-items: center; gap: 18px; margin-top: 24px; padding: 20px 22px; background: var(--u-fond2); text-decoration: none; }
.bande-a svg { width: 44px; height: 44px; color: var(--u-titre); transition: transform .2s; }
.bande-a:hover svg { transform: scale(1.08); }
.bande-a b { display: block; font: 500 1.375rem/1.2 var(--sg); letter-spacing: -.015em; }
.bande-a span span { display: block; margin-top: 2px; font-size: .9375rem; color: var(--u-texte2); }
.t-texte { margin-top: 14px; font: 500 1.25rem/1.4 var(--sg); }
.t-grid { margin-top: 24px; align-items: start; row-gap: 28px; }
.dates-z { grid-column: 1 / 7; min-width: 0; }
.dcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-content: start; }
.dcard { padding: 16px 18px 18px; background: var(--u-fond2); border-top: 4px solid var(--u-titre); overflow-wrap: anywhere; }
.dcard::before { display: none; }
.dcard.on { box-shadow: 0 0 0 2px var(--u-titre); }
.dcard .where, .dcard .det { padding-left: 0; }
.dcard .where { margin-top: 14px; }
.dcard .j-sous, .dcard .det { color: var(--u-texte2); }
.dcard .det a { color: var(--u-vif); }
.t-carte { grid-column: 7 / 11; position: sticky; top: calc(var(--head) + 16px); }
.t-carte.seule { grid-column: 1 / 8; position: static; }
.t-carte.seule .bras-passe { opacity: .7; }
.t-carte.seule .pt-passe { opacity: 1; }
.u-fiche { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--gap); margin-top: 22px; }
.u-fiche > div { padding: 11px 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 20%, transparent); }
.u-fiche dt { font-size: .9375rem; color: var(--u-texte2); }
.u-fiche dd { margin-top: 2px; font-weight: 600; }
.u-fiche .large { grid-column: 1 / -1; }
.u-fiche .large dd { font: 500 1.375rem/1.35 var(--sg); letter-spacing: -.01em; }
/* la distribution en portraits (D.personnes, show.equipe) : la photo en aplat net, ou un monogramme composé comme une affiche suisse ; ceux qui alternent vont par deux */
.cast { --g: var(--gap); --pw: 148px; --pmax: 236px; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--pw), calc((100% - var(--g)) / 2)), 1fr)); gap: 34px var(--g); max-width: calc(var(--n, 4) * var(--pmax) + (var(--n, 4) - 1) * var(--g)); margin: 26px 0 30px; padding: 0; }
.cast > li { min-width: 0; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--u-texte) 32%, transparent); }
.cast > .cast-paire { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: var(--g); }
.cast-pt { margin: 0; min-width: 0; }
.cast-cadre { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; container-type: inline-size; background: color-mix(in srgb, var(--u-titre) 11%, var(--u-fond2)); }
.cast-cadre img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.cast-mono { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 0 0 4cqw 6cqw; }
.cast-mono::before { content: ""; position: absolute; left: 6cqw; top: 6cqw; width: 7cqw; height: 7cqw; background: var(--u-titre); }
.cast-mono b { font: 500 3.4rem/.82 var(--sg); font-size: 40cqw; letter-spacing: -.06em; text-transform: uppercase; color: var(--u-titre); }
.cast-pt figcaption { display: block; }
.cast-cr { display: block; min-height: 1.8em; padding-top: 5px; font-size: .8125rem; line-height: 1.3; color: var(--u-texte2); }
.cast-nom { display: block; margin-top: 10px; font: 500 1.1875rem/1.2 var(--sg); letter-spacing: -.01em; color: var(--u-texte); text-wrap: balance; }
.cast-alt, .cast-role { display: block; margin-top: 3px; font-size: .9375rem; line-height: 1.4; color: var(--u-texte2); }
.cast-role { font-weight: 600; color: var(--u-vif); }
.u-prod { margin-top: 24px; }
.u-prod p { font-size: .9375rem; line-height: 1.55; color: var(--u-texte2); }
.u-prod p + p { margin-top: 8px; }
.u-prod strong { color: var(--u-texte); }
.u-mention { margin-top: 12px; font-size: .9375rem; color: var(--u-texte2); }
.u-mention a { color: var(--u-vif); }
.u-duree { margin-top: 18px; font: 500 1.25rem/1.3 var(--sg); }
.u-agir { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 24px; background: var(--u-titre); color: var(--u-sur) !important; text-decoration: none; font-weight: 700; font-size: 1.0625rem; }
.u-agir:hover { text-decoration: underline; }
.u-agir svg { transition: transform .2s; }
.u-agir:hover svg { transform: translateX(4px); }
.u-boite { padding: 22px 22px 24px; background: var(--u-fond2); }
.u-boite + .u-boite { margin-top: 18px; }
.u-boite .ac-l { color: var(--u-texte2); }
.u-boite .u-fiche { grid-template-columns: minmax(0, 1fr); margin-top: 8px; }
.u-chiffres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--gap); }
.u-chiffres > li { padding: 16px 0 18px; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 22%, transparent); font: 500 1.25rem/1.3 var(--sg); letter-spacing: -.01em; }
.u-chiffres > li.grand { grid-column: 1 / -1; }
.u-chiffres .rep b { color: var(--u-titre); font-size: clamp(3.5rem, 7vw, 5.5rem); }
.u-chiffres .rep { font-size: 1.375rem; }
.u-lieux p { margin-top: 18px; max-width: 70ch; font-size: 1rem; line-height: 1.65; color: var(--u-texte2); }
.u-lieux details.lx-d { border-color: color-mix(in srgb, var(--u-texte) 22%, transparent); }
.u-lieux details.lx-d p { color: var(--u-texte2); }
.tech { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px var(--gap); margin-top: 22px; }
.tech-b { padding: 16px 18px 18px; background: var(--u-fond2); border-top: 4px solid var(--u-titre); }
.tech-b h4 { margin: 0 0 8px; font: 700 .8125rem/1.3 var(--at); letter-spacing: .12em; text-transform: uppercase; color: var(--u-titre); }
.tech-b li { padding: 5px 0; font-size: .9375rem; line-height: 1.45; }
.tech-b li + li { border-top: 1px solid color-mix(in srgb, var(--u-texte) 14%, transparent); }
.alerte { grid-column: 1 / -1; display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: var(--u-titre); color: var(--u-sur); font-size: 1.0625rem; line-height: 1.45; }
.alerte svg { flex: none; margin-top: 2px; }
.implant { margin-top: 24px; }
.implant img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.ac-bloc .ac-type { font-size: clamp(2.25rem, 5vw, 4rem); letter-spacing: -.045em; }
.ac-bloc .ac-type::before { width: 64px; height: 8px; margin-bottom: 16px; }
.ac-bloc .ac-l, .u .ac-l { color: var(--u-texte2); }
.u .ac-meta li { border-color: color-mix(in srgb, var(--u-texte) 32%, transparent); }
.u .ac-meta li span:first-child { color: var(--u-texte2); }
.u .ac-txt { max-width: 66ch; font-size: 1.0625rem; }
.u .ac-txt a, .u .disp a { color: var(--u-vif); }
.u .formule { background: var(--u-titre); color: var(--u-sur); font-size: 1.625rem; padding: 18px 22px; }
.ac-bloc > * + * { margin-top: 22px; }
.ac-bloc + .chap { margin-top: 72px; }
.u-equipe li { padding: 12px 0 13px; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 20%, transparent); font: 500 1.25rem/1.35 var(--sg); letter-spacing: -.01em; }
.u-equipe { margin-top: 14px; }
.u-boite .liens + .u-agir-p { margin-top: 18px; }
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.ct-prg { display: grid; gap: 2px; padding: 18px 22px 16px; border: 1px solid var(--rule-2); border-top: 4px solid var(--ink); background: var(--field); }
.ct-prg p { margin: 0; }
.ct-nom b { display: block; font: 500 1.625rem/1.1 var(--sg); letter-spacing: -.02em; }
.ct-role { display: block; color: var(--ink-2); }
.ct-liens { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 12px !important; }
.ct-tel { font-weight: 700; text-decoration: none; }
html:not(.ed-actif) .ct-tel.vide { display: none; }
.ct-cond { margin-top: 10px !important; font-size: .875rem; color: var(--ink-2); }
.hero > .ct-prg { grid-column: 1 / -1; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 6px 36px; padding: 14px 22px; }
.hero > .ct-prg .ct-liens, .hero > .ct-prg .ct-cond { margin-top: 0 !important; }
.hero > .ct-prg .ct-nom b { display: inline; font-size: 1.375rem; }
.hero > .ct-prg .ct-role { display: inline; margin-left: 10px; }
.hero > .ct-prg .ct-cond { justify-self: end; }
.ct-prg.compact { border: 0; border-top: 0; background: none; padding: 0; }
.ct-prg.compact .ac-l { color: var(--u-texte2); }
.ct-prg.compact .ct-role, .ct-prg.compact .ct-cond { color: var(--u-texte2); }
.u .ct-prg.compact .ct-nom b { color: var(--u-texte); }
.dos-bt { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; border: 1.5px solid var(--u-titre, var(--ink)); background: transparent; color: inherit; font: 700 .9375rem/1.2 var(--at); cursor: pointer; }
.dos-bt:hover { background: color-mix(in srgb, var(--u-titre, var(--ink)) 12%, transparent); }
.dos-bt .occ { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--u-titre, var(--ink)); transform-origin: 0 50%; transform: scaleX(0); }
.dos-bt[aria-busy="true"] { cursor: progress; }
.dos-bt[aria-busy="true"] .occ { animation: dos-occ 1.1s cubic-bezier(.5, 0, .2, 1) infinite; }
@keyframes dos-occ { 0% { transform: scaleX(0); transform-origin: 0 50%; } 50% { transform: scaleX(1); transform-origin: 0 50%; } 50.1% { transform-origin: 100% 50%; } 100% { transform: scaleX(0); transform-origin: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { .dos-bt[aria-busy="true"] .occ { animation: none; transform: scaleX(1); } }
.docs { list-style: none; display: grid; gap: 10px; margin: 0; padding: 0; }
.docs li { display: flex; align-items: center; gap: 10px; }
.docs a { font-weight: 700; color: var(--u-vif, var(--ink)); }
.tech ~ .docs { margin-top: clamp(18px, 2vw, 28px); }
.fc-docs { padding-top: 12px; border-top: 1px solid var(--rule); }
.u-chiffres + .chap { margin-top: 44px; }
@media (max-width: 900px) { .hero > .ct-prg { grid-template-columns: minmax(0, 1fr); } .hero > .ct-prg .ct-cond { justify-self: start; } }
.ac-vide { margin-top: 18px; font: 500 1.75rem/1.2 var(--sg); color: var(--u-texte2); }
/* le dossier scolaire de Bérénice */
.dossier { margin-top: 88px; }
.dos-tete { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; padding: 28px 0 22px; border-top: 6px solid var(--u-titre); }
.dos-tete > div { grid-column: 1 / 10; }
.dos-tete h2 { margin-top: 6px; font: var(--u-gr) clamp(2rem, 4.4vw, 3.5rem)/1.02 var(--u-police); letter-spacing: 0; color: var(--u-titre); }
.dos-tete .ac-l { font-size: .875rem; color: var(--u-texte); }
.pourquoi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); margin-top: 18px; }
.pourquoi article { padding: 20px 20px 22px; background: var(--u-fond2); border-top: 4px solid var(--u-titre); }
.pourquoi h3 { font: var(--u-gr) 1.3125rem/1.2 var(--u-police); letter-spacing: 0; color: var(--u-titre); }
.pourquoi p { margin-top: 12px; font-size: 1rem; line-height: 1.6; }
.prog-t { width: 100%; margin-top: 18px; font-size: .9375rem; line-height: 1.45; }
.prog-t th, .prog-t td { padding: 11px 14px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 22%, transparent); }
.prog-t tbody th[scope="rowgroup"] { padding: 10px 14px; background: var(--u-titre); color: var(--u-sur); font: var(--u-gr) 1.125rem/1.2 var(--u-police); letter-spacing: .02em; }
.prog-t th[scope="row"] { width: 16%; font-weight: 700; color: var(--u-vif); }
.prog-t td:nth-of-type(1) { width: 38%; font-weight: 600; }
.consignes { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 18px; margin-top: 22px; }
.consignes .c-box { grid-column: 1 / 8; padding: 22px 22px 24px; background: var(--u-fond2); border: 2px solid var(--u-titre); }
.consignes .c-apres { grid-column: 8 / 13; }
.c-note { display: inline-block; padding: 4px 10px; background: var(--u-titre); color: var(--u-sur); font: 700 .8125rem/1.3 var(--at); letter-spacing: .12em; }
.c-box > p { margin-top: 12px; font-size: 1rem; line-height: 1.55; }
.demandes { margin-top: 14px; display: grid; gap: 8px; }
.demandes li { display: flex; gap: 12px; align-items: flex-start; font: 700 1rem/1.35 var(--at); letter-spacing: .02em; color: var(--u-titre); }
.demandes svg { flex: none; margin-top: 1px; }
.c-apres p { font-size: 1rem; line-height: 1.55; }
.c-apres ul { margin-top: 10px; }
.c-apres li { position: relative; padding: 8px 0 8px 18px; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 18%, transparent); font-size: .9375rem; line-height: 1.5; }
.c-apres li::before { content: ""; position: absolute; left: 0; top: 1.05em; width: 8px; height: 8px; background: var(--u-titre); }
.c-atelier { grid-column: 1 / -1; padding: 14px 18px; border-left: 6px solid var(--u-titre); font-size: 1.0625rem; }
.ateliers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px var(--gap); margin-top: 22px; align-items: start; }
.atelier { padding: 22px 22px 24px; background: var(--u-fond2); }
.atelier h3 { font: var(--u-gr) 1.375rem/1.2 var(--u-police); letter-spacing: 0; color: var(--u-titre); }
.atelier h3 strong { font-weight: inherit; }
.atelier > p, .atelier li { font-size: .9375rem; line-height: 1.55; }
.atelier > p { margin-top: 10px; }
.atelier ol, .atelier ul { margin-top: 12px; }
.atelier ol li { padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--u-texte) 18%, transparent); }
.atelier ol li b { display: block; margin-bottom: 4px; font-weight: 400; }
.atelier ul li { position: relative; padding: 6px 0 6px 18px; }
.atelier ul li::before { content: ""; position: absolute; left: 0; top: .95em; width: 8px; height: 8px; border-radius: 50%; background: var(--u-titre); }
.at-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.at-photos img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--u-fond2); }
.at-photos figcaption { color: var(--u-texte2); }

/* ---------- La compagnie, contact, mentions ---------- */
.co { align-items: start; row-gap: 48px; }
.co-text { grid-column: 1 / 8; }
.co-text p { max-width: 66ch; }
.co-text p + p { margin-top: 18px; }
.co-dates { grid-column: 9 / 13; }
.co-h { padding-bottom: 12px; border-bottom: 1px solid var(--ink); font-size: 1.375rem; }
.annees li { display: grid; grid-template-columns: 4.4rem minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 12px 0 13px; border-bottom: 1px solid var(--rule); }
.an { font: 500 1.75rem/1 var(--sg); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.an-t { font-weight: 600; }
.dir { margin-top: 88px; align-items: start; row-gap: 22px; }
.dir-h { grid-column: 1 / 5; }
.dir-h h2 { font-size: 2.25rem; letter-spacing: -.035em; }
.dir-h p { margin-top: 12px; font: 500 1.25rem/1.35 var(--sg); color: var(--ink-2); }
.dir-t { grid-column: 5 / 12; padding-top: 6px; border-top: 1px solid var(--ink); }
.dir-t p { margin-top: 14px; max-width: 70ch; }
.partenaires { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--rule); max-width: 88ch; color: var(--ink-2); font-size: 1rem; line-height: 1.6; }
.legal { max-width: 860px; }
.form { max-width: 760px; }
.fld { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.fld label, .calc label { font-weight: 600; font-size: 1rem; }
.fld input, .fld textarea, .calc input { width: 100%; padding: 11px 14px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--field); font-size: 1rem; }
.fld input:focus-visible, .fld textarea:focus-visible, .calc input:focus-visible { outline-offset: 0; border-color: var(--ink); }
.fld textarea { min-height: 170px; resize: vertical; }
.fld-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin-top: 22px; font-size: 1rem; }
.chk input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); }
.chk a { color: var(--mag-ink); font-weight: 600; }
.calc { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
.calc input { width: 72px; }
.btn { margin-top: 26px; height: 48px; padding: 0 30px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 1rem; }
.btn:hover { background: var(--mag-ink); }
.ct { align-items: start; row-gap: 48px; }
.ct-form { grid-column: 1 / 8; }
.ct-form .fld:first-child { margin-top: 0; }
.ct-co { grid-column: 9 / 13; padding-top: 14px; border-top: 1px solid var(--ink); font-style: normal; line-height: 1.6; }
.dons { margin-top: 88px; }
.dons p { padding-top: 16px; border-top: 1px solid var(--rule); max-width: 88ch; font-size: .9375rem; line-height: 1.6; color: var(--ink-2); }

/* ---------- Pied de page ---------- */
.site-foot { margin-top: 128px; padding: 56px 0 28px; background: var(--ink); color: #efebe3; }
body[data-vue="spectacle"] .site-foot { margin-top: 0; }
.site-foot a { color: #fff; }
.site-foot :focus-visible { outline-color: #f07ab6; }
.foot { row-gap: 32px; }
.f-brand { grid-column: 1 / 5; }
.f-brand .brand { color: #fff; }
.f-brand address { margin-top: 18px; font-style: normal; color: #c9c3b8; }
.f-links { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; font-weight: 600; }
.f-part { grid-column: 6 / 13; color: #c9c3b8; font-size: 1rem; line-height: 1.6; }
.f-ent { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 18px; }
.f-ent a { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; text-decoration: none; }
.f-ent a:hover { text-decoration: underline; }
.f-ent .e-pt { background: var(--ev); }
.f-legal { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; padding-top: 18px; border-top: 1px solid #3a3733; color: #c9c3b8; font-size: .9375rem; }
.f-ll { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-left: auto; }
.f-edit { display: inline-flex; align-items: center; gap: 7px; padding: 3px 12px 4px 10px; border: 1px solid #5c5852; border-radius: 999px; background: none; color: #efebe3; font-size: .875rem; font-weight: 600; line-height: 1.4; }
.f-edit:hover { border-color: #efebe3; color: #fff; }
.ed-actif .uc-t a::after { display: none; }
.ed-actif .u-h1 .l { animation: none !important; clip-path: none; }
.ed-barre { border-color: var(--ink); box-shadow: 0 16px 36px -14px rgba(20, 20, 20, .5); }
.ed-barre .ed-etat { font-family: var(--sg); letter-spacing: -.01em; }

  const tete = (titre, { sur = '', cote = '', apres = '', chemin = null } = {}) => `<section class="wrap hero"><div class="hero-main">${sur}<h1 class="saison" id="h1" tabindex="-1"${ed(chemin)}>${esc(titre)}</h1></div>${cote ? `<div class="hero-side">${cote}</div>` : ''}${apres}</section>`;

  /* ---------- La page d'un spectacle : son univers, ses trois onglets d'entrée ---------- */
  function photosDe(s, filtre) {
    return (s.photos || []).map((p, i) => ({ ...p, i })).filter(p => filtre(p) && photo(p.cle)).map(p => {

  }
  const creditsHtml = (s, ps) => { const vus = new Map(); ps.forEach(p => { if (p.credit && !vus.has(p.credit)) vus.set(p.credit, p.creditCle); }); return vus.size ? `<p class="credits">${[...vus].map(([t, k]) => `<span${edS(s, k)}>${esc(t)}</span>`).join('')}</p>` : ''; };
  const figure = (s, p, cls = 'carton') => `<figure><img src="${p.src}" alt="${esc(p.legende || s.titre)}" decoding="async"${edP(`shows.${s.slug}.photos.${p.i}`)}>${p.legende ? `<figcaption class="${cls}"${edS(s, 'photos', p.i, 'legende')}>${esc(p.legende)}</figcaption>` : ''}</figure>`;
  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu
  const portrait = ({ e, p, lignes }, credits) => {

      <figcaption>${credits ? `<small class="cast-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="cast-nom"><span data-edit="${esc(k)}.prenom">${esc(p.prenom)}</span> <span data-edit="${esc(k)}.nom">${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="cast-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="cast-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];
    L.forEach((x, i) => {
      if (pris.has(i)) return; pris.add(i);
      const j = x.e.alternance ? L.findIndex((y, k) => !pris.has(k) && x.e.alternance.includes(nomDe(y.p))) : -1;   // « en alternance avec … » : par deux
      if (j < 0) blocs.push(`<li>${portrait(x, credits)}</li>`);

  const filtreLieux = (lieux, garde) => lieux.map(x => ({ ...x, dates: (x.dates || []).filter(garde) })).filter(x => x.dates.length);

  function ongletVoir(s, u, fixe) {

    if ((s.affirmations || []).length || s.cadre) ch.push(['ch-ouverture', L.ouverture, `<h2 class="u-h2">${esc(L.ouverture)}</h2>
      <div class="affs">${(s.affirmations || []).map((a, i) => `<p class="aff"${edS(s, 'affirmations', i, 'texte')}>${esc(a.texte)}</p>`).join('')}</div>${s.cadre ? `<p class="cadre"${edS(s, 'cadre')}>${esc(s.cadre)}</p>` : ''}`]);
    if ((s.texte || []).length || (s.citations || []).length) ch.push(['ch-spectacle', L.leSpectacle, `<h2 class="u-h2">${esc(L.leSpectacle)}</h2>
      <div class="texte">${(s.texte || []).map((p, i) => `<p${edS(s, 'texte', i)}>${p}</p>`).join('')}</div>
      ${(s.citations || []).length ? `<div class="vers-l">${s.citations.map((c, i) => `<figure class="vers${c.prose ? ' prose-q' : ''}"><blockquote>${(c.vers || []).map((v, j) => `<span${edS(s, 'citations', i, 'vers', j)}>${esc(v)}</span>`).join('')}</blockquote>${c.source ? `<figcaption><cite${edS(s, 'citations', i, 'source')}>${esc(c.source)}</cite></figcaption>` : ''}</figure>`).join('')}</div>` : ''}`]);
    if (ps.length) ch.push(['ch-photos', L.photos, `<h2 class="u-h2">${esc(L.photos)}</h2><div class="photos">${ps.map(p => figure(s, p)).join('')}</div>${creditsHtml(s, ps)}`]);
    if (s.video && s.video.url) ch.push(['ch-video', L.bandeAnnonce, `<h2 class="u-h2">${esc(L.bandeAnnonce)}</h2>
      <a class="bande-a" href="${esc(s.video.url)}" target="_blank" rel="noopener">${LIRE}<span><b>${esc(L.bandeAnnonce)}</b><span>${esc(s.video.titre || '')}</span></span></a>`]);
    let dates;
    if (pub.length) {
      dates = `<h2 class="u-h2"${s.tournee && s.tournee.titre ? edS(s, 'tournee', 'titre') : ''}>${esc((s.tournee && s.tournee.titre) || L.actuellementEnTournee)}</h2>${tourneeTexte(s)}
        <div class="g12 t-grid lie" data-module="spectacle"><div class="dates-z" data-agenda="${esc(s.slug)}"><ol class="dcards">${datesCartes(pub)}</ol></div><div class="t-carte">${carteSvg({ lieux: filtreLieux(K.aVenir, d => !d.scolaire), passe: K.passe, titre: s.titre, couleur, fixe, nomsPasse: false })}</div></div>`;
    } else if (s.statut && s.tournee && s.tournee.titre && !K.passe.length) {
      dates = `<h2 class="u-h2"${edS(s, 'tournee', 'titre')}>${esc(s.tournee.titre)}</h2>${tourneeTexte(s)}
        <div class="g12 t-grid lie"><div class="t-carte seule">${carteSvg({ lieux: [], titre: s.titre, couleur, fixe })}</div></div>`;
    } else if (K.passe.length) {
      dates = `<h2 class="u-h2">${esc(L.lieuxDiffusion)}</h2><div class="g12 t-grid lie"><div class="t-carte seule">${carteSvg({ lieux: [], passe: K.passe, titre: s.titre, couleur, fixe })}</div></div>`;
    }
    if (dates) ch.push(['ch-dates', pub.length || s.statut ? L.dates : L.lieuxDiffusion, dates]);
    ch.push(['ch-distribution', L.distribution, `<h2 class="u-h2">${esc(L.distribution)}</h2>${ficheBloc(s, { portraits: true })}${s.duree ? `<p class="u-duree"${edS(s, 'duree')}>${esc(s.duree)}</p>` : ''}`]);
    return `<div class="g12 u-grille">
      <nav class="u-sommaire" aria-label="${esc(L.leSpectacle)}"><ol>${ch.map(([id, t]) => `<li><a href="#/spectacle/${esc(s.slug)}/voir" data-chap="${id}">${esc(t)}</a></li>`).join('')}</ol></nav>
      <div class="u-lecture">${ch.map(([id, , html]) => `<section class="chap" id="${id}" tabindex="-1">${html}</section>`).join('')}</div>
    </div>`;
  }

  function ongletProgrammer(s, u, fixe) {
    const L = LIB(), p = s.programmer || {}, K = CARTE.spectacle(s.slug), w = ecrire(), couleur = () => u.titre;
    const dos = s.dossier && D.dossiers ? D.dossiers[s.dossier] : null, acc = dos && dos.accueil, dk = `dossiers.${s.dossier}.accueil`;
    const implant = photosDe(s, x => x.id === 'd-implantation-1');
    const ftDocs = docsDe(s, 'pros').filter(x => x.type === 'fiche_technique');   // la fiche technique déposée : en lien, avec le détail de Bérénice s'il y en a un
    const chiffres = [p.representations && `<li class="grand">${repHtml(p.representations, edS(s, 'programmer', 'representations'))}</li>`,
      ...faitsProg(s).map(([t, k]) => `<li${edS(s, k)}>${esc(t)}</li>`), s.statut && `<li${edS(s, 'statut')}>${esc(s.statut)}</li>`].filter(Boolean);
    return `<div class="g12 u-grille">
      <div class="u-main">
        ${chiffres.length ? `<ul class="u-chiffres">${chiffres.join('')}</ul>` : ''}
        ${(p.equipeCreation || []).length ? `<section class="chap"><h2 class="u-h2">${esc(L.distribution)}</h2><ul class="u-equipe">${p.equipeCreation.map((x, i) => `<li${edS(s, 'programmer', 'equipeCreation', i)}>${esc(x)}</li>`).join('')}</ul></section>` : ''}
        ${acc && p.ficheTechnique ? `<section class="chap" aria-labelledby="h-tech"><h2 class="u-h2" id="h-tech"${acc.fiche ? ed(`${dk}.fiche`) : ''}>${esc(acc.fiche || L.ficheTechnique)}</h2>
          <h3 class="u-h3"${acc.titre ? ed(`${dk}.titre`) : ''}>${esc(acc.titre || L.conditionsAccueil)}</h3>
          <div class="tech">${(acc.blocs || []).map((b, i) => `<div class="tech-b">${b.titre ? `<h4${ed(`${dk}.blocs.${i}.titre`)}>${esc(b.titre)}</h4>` : ''}<ul>${(b.lignes || []).map((x, j) => `<li${ed(`${dk}.blocs.${i}.lignes.${j}`)}>${x}</li>`).join('')}</ul></div>`).join('')}
            ${acc.alerte ? `<p class="alerte">${ALERTE}<span${ed(`${dk}.alerte`)}>${acc.alerte}</span></p>` : ''}</div>
          ${implant.length ? `<div class="photos implant">${implant.map(x => figure(s, x)).join('')}</div>${creditsHtml(s, implant)}` : ''}
          ${ftDocs.length ? listeDocs(ftDocs) : ''}
        </section>` : `<section class="chap" aria-labelledby="h-tech"><h2 class="u-h2" id="h-tech">${esc(L.ficheTechnique)}</h2>${(() => {   // la fiche technique : un document déposé, sinon sur demande (jamais de rubrique vide)
          const fts = ftDocs, href = mailPrg(`${L.ficheTechnique} – ${s.titre}`);
          return fts.length ? listeDocs(fts) : `<ul class="docs"><li>${PDF}${href ? `<a href="${esc(href)}">${esc(L.ficheTechniqueSurDemande)}</a>` : `<span>${esc(L.ficheTechniqueSurDemande)}</span>`}</li></ul>`; })()}</section>`}
        <section class="chap" aria-labelledby="h-dl"><h2 class="u-h2" id="h-dl">${esc(L.aTelecharger)}</h2><ul class="docs"><li>${dossierBouton(s.slug)}</li>${docsDe(s, 'pros').map(x => `<li>${PDF}${lienDoc(x)}</li>`).join('')}</ul></section>
        <section class="chap u-lieux" aria-labelledby="h-lieux"><h2 class="u-h2" id="h-lieux">${esc(L.lieuxDiffusion)}</h2>
          ${p.lieux ? `<p${edS(s, 'programmer', 'lieux')}>${esc(p.lieux)}</p>` : tourneeTexte(s)}
          <div class="g12 t-grid lie" data-module="spectacle"><div class="t-carte seule">${carteSvg({ lieux: K.aVenir, passe: K.passe, titre: s.titre, couleur, fixe, nomsPasse: false })}</div></div>
        </section>
      </div>
      <aside class="u-side">
        <div class="u-boite">${contactHtml_(s)}</div>
        <div class="u-boite"><p class="ac-l">${esc(L.distribution)}</p>${ficheBloc(s, { large: false })}</div>
        <div class="u-boite"><p class="liens">${dossierBouton(s.slug)}${bandeLien(s)}</p><p class="u-agir-p"><a class="u-agir" href="${esc(w.href)}">${esc(w.texte)}${ARROW}</a></p></div>
      </aside>
    </div>`;
  }

  function dossierHtml(s, dos) {
    const L = LIB(), k = `dossiers.${s.dossier}`, po = dos.pourquoi || {}, pr = dos.programmes || {}, co = dos.consignes || {}, at = dos.ateliers || {};
    const ph = photosDe(s, p => p.atelier || p.id === 'd-implantation-1' || (p.etablissement && p.source !== 'dossier'));
    return `<section class="dossier" aria-labelledby="h-dossier">
      <header class="dos-tete"><div><p class="ac-l">${esc(L.dossierScolaire)}</p><h2 id="h-dossier"${po.titre ? ed(`${k}.pourquoi.titre`) : ''}>${esc(po.titre || L.dossierScolaire)}</h2></div></header>
      ${(po.sections || []).length ? `<div class="pourquoi">${po.sections.map((x, i) => `<article><h3${ed(`${k}.pourquoi.sections.${i}.titre`)}>${esc(x.titre)}</h3><p${ed(`${k}.pourquoi.sections.${i}.texte`)}>${x.texte}</p></article>`).join('')}</div>` : ''}
      ${(pr.niveaux || []).length ? `<section class="chap"><h2 class="u-h2"${ed(`${k}.programmes.titre`)}>${esc(pr.titre)}</h2>
        <table class="prog-t"><caption class="sr">${esc(pr.titre)}</caption>${pr.niveaux.map((n, i) => `<tbody><tr><th scope="rowgroup" colspan="3"${ed(`${k}.programmes.niveaux.${i}.niveau`)}>${esc(n.niveau)}</th></tr>${(n.lignes || []).map((x, j) => {
          const c = `${k}.programmes.niveaux.${i}.lignes.${j}`;
          return `<tr><th scope="row"${ed(`${c}.matiere`)}>${esc(x.matiere)}</th><td${ed(`${c}.intitule`)}>${esc(x.intitule)}</td><td${ed(`${c}.objectif`)}>${esc(x.objectif)}</td></tr>`;
        }).join('')}</tbody>`).join('')}</table></section>` : ''}
      ${co.titre ? `<section class="chap"><h2 class="u-h2"${ed(`${k}.consignes.titre`)}>${esc(co.titre)}</h2>
        <div class="consignes"><div class="c-box">${co.note ? `<p class="c-note"${ed(`${k}.consignes.note`)}>${esc(co.note)}</p>` : ''}${co.intro ? `<p${ed(`${k}.consignes.intro`)}>${co.intro}</p>` : ''}
          ${(co.demandes || []).length ? `<ul class="demandes">${co.demandes.map((x, i) => `<li>${NON}<span${ed(`${k}.consignes.demandes.${i}`)}>${esc(x)}</span></li>`).join('')}</ul>` : ''}</div>
          <div class="c-apres">${co.apres ? `<p${ed(`${k}.consignes.apres`)}>${co.apres}</p>` : ''}${(co.axes || []).length ? `<ul>${co.axes.map((x, i) => `<li${ed(`${k}.consignes.axes.${i}`)}>${x}</li>`).join('')}</ul>` : ''}</div>
          ${co.atelier ? `<p class="c-atelier"${ed(`${k}.consignes.atelier`)}>${co.atelier}</p>` : ''}</div></section>` : ''}
      ${(at.liste || []).length ? `<section class="chap"><h2 class="u-h2"${at.titre ? ed(`${k}.ateliers.titre`) : ''}>${esc(at.titre || L.ateliers)}</h2>
        <div class="ateliers">${at.liste.map((a, i) => { const c = `${k}.ateliers.liste.${i}`; return `<article class="atelier"><h3${ed(`${c}.titre`)}>${a.titre}</h3>${(a.paragraphes || []).map((p, j) => `<p${ed(`${c}.paragraphes.${j}`)}>${p}</p>`).join('')}
          ${(a.etapes || []).length ? `<ol>${a.etapes.map((e, j) => `<li><b${ed(`${c}.etapes.${j}.titre`)}>${e.titre}</b><span${ed(`${c}.etapes.${j}.texte`)}>${e.texte}</span></li>`).join('')}</ol>` : ''}
          ${(a.points || []).length ? `<ul>${a.points.map((p, j) => `<li${ed(`${c}.points.${j}`)}>${p}</li>`).join('')}</ul>` : ''}</article>`; }).join('')}</div>
        ${ph.length ? `<div class="at-photos">${ph.map(p => figure(s, p, 'leg')).join('')}</div>${creditsHtml(s, ph)}` : ''}</section>` : ''}
    </section>`;
  }

  function ongletEtablissement(s, u, fixe) {
    const L = LIB(), ac = s.actionCulturelle || {}, w = ecrire(), couleur = () => u.titre;
    const sc = datesScol().filter(d => d.slug === s.slug), K = CARTE.spectacle(s.slug);
    const dos = s.dossier && D.dossiers ? D.dossiers[s.dossier] : null;
    const meta = [ac.public && [L.public, ac.public, 'public'], ac.lieu && lieuLib(ac.lieu) && [null, lieuLib(ac.lieu), null], ac.statut && [null, ac.statut, 'statut']].filter(Boolean);
    return `<div class="g12 u-grille">
      <div class="u-main">
        <section class="ac-bloc" aria-labelledby="h-ac">
          <p class="ac-l">${esc(L.actionCulturelle)}</p>
          ${ac.type ? `<h2 class="ac-type" id="h-ac"${edS(s, 'actionCulturelle', 'type')}>${esc(ac.type)}</h2>` : `<h2 class="ac-type vide" id="h-ac">${esc(L.aCompleter)}</h2>`}
          ${meta.length ? `<ul class="ac-meta">${meta.map(([k, v, c]) => `<li>${k ? `<span>${esc(k)}</span>` : ''}<b${c ? edS(s, 'actionCulturelle', c) : ''}>${esc(v)}</b></li>`).join('')}</ul>` : ''}
          ${(ac.textes || []).map((t, i) => `<div class="ac-txt">${bloc(t.texte, `shows.${s.slug}.actionCulturelle.textes.${i}.texte`)}</div>`).join('')}
          ${(ac.formule || []).length ? `<p class="formule">${ac.formule.map((x, i) => `<span${edS(s, 'actionCulturelle', 'formule', i)}>${esc(x)}</span>`).join('')}</p>` : ''}
          ${(ac.dispositifs || []).length ? `<div class="disp"><p class="ac-l">${esc(L.dispositifs)}</p><ul>${ac.dispositifs.map((x, i) => `<li${edS(s, 'actionCulturelle', 'dispositifs', i)}>${x}</li>`).join('')}</ul></div>` : ''}
        </section>
        ${docsDe(s, 'scolaires').length ? `<section class="chap" aria-labelledby="h-docs"><h2 class="u-h2" id="h-docs">${esc(L.documentsScolaires)}</h2>${listeDocs(docsDe(s, 'scolaires'))}</section>` : ''}
        ${sc.length ? `<section class="chap" aria-labelledby="h-sc"><h2 class="u-h2" id="h-sc">${esc(L.enEtablissement)}</h2>
          <div class="g12 t-grid lie" data-module="spectacle"><div class="dates-z" data-agenda="${esc(s.slug)}"><ol class="dcards">${datesCartes(sc)}</ol></div><div class="t-carte">${carteSvg({ lieux: filtreLieux(K.aVenir, d => d.scolaire), titre: L.enEtablissement, couleur, fixe })}</div></div></section>` : ''}
      </div>
      <aside class="u-side">
        <div class="u-boite"><p class="u-agir-p"><a class="u-agir" href="${esc(w.href)}">${esc(w.texte)}${ARROW}</a></p></div>
        <div class="u-boite"><p class="ac-l">${esc(L.distribution)}</p>${ficheBloc(s, { large: false })}</div>
      </aside>
    </div>
    ${dos ? dossierHtml(s, dos) : ''}`;
  }

  function spectacleHtml(s, entree, fixe) {
    const u = univers(s);
    const corps = { voir: ongletVoir, programmer: ongletProgrammer, etablissement: ongletEtablissement }[entree](s, u, fixe);
    const img = imgPrincipale(s, s.titre);
    return `<article class="u u-${u.clair ? 'clair' : 'sombre'}" style="${uStyle(s)}">
      <header class="u-tete">
        ${signe(u)}
        <div class="wrap u-tete-in">
          <div class="u-titres">
            <p class="u-et u-signe"><span${ed('site.nom')}>${esc(site().nom)}</span>${etiquettes(s, 'creation', 'lieuTemps')}</p>
            <h1 class="u-h1" id="h1" tabindex="-1">${h1Lignes(s)}</h1>
            ${s.sousTitre ? `<p class="u-sous"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}${s.genre && s.genre !== s.sousTitre ? `<p class="u-genre"${edS(s, 'genre')}>${esc(s.genre)}</p>` : ''}
            ${s.statut ? `<p class="statut"${edS(s, 'statut')}>${esc(s.statut)}</p>` : ''}
            ${s.accroche ? `<p class="u-acc"${edS(s, 'accroche')}>${esc(s.accroche)}</p>` : ''}
          </div>
          ${img ? `<figure class="u-photo">${img}${s.credit ? `<figcaption${edS(s, 'credit')}>${esc(s.credit)}</figcaption>` : ''}</figure>` : ''}
          ${bande(u, 'u-frise')}
        </div>
      </header>
      <nav class="u-onglets" aria-label="${esc(s.titre)}"><div class="wrap"><ul>${entrees().filter(e => e.cle !== 'etablissement' || s.actionCulturelle).map(e => `<li><a href="#/spectacle/${esc(s.slug)}/${e.cle}" data-k="onglet-${e.cle}" style="${eStyle(e)}"${e.cle === entree ? ' aria-current="page"' : ''}><span class="e-pt" aria-hidden="true"></span><span>${esc(e.court)}</span></a></li>`).join('')}</ul></div></nav>
      <div class="wrap u-corps">${corps}</div>
    </article>`;
  }

  /* ---------- La compagnie, le contact, les mentions ---------- */
  function compagnieHtml() {
    const c = site().compagnie || {}, d = c.directeur;
    return `${tete(c.titre, { chemin: 'site.compagnie.titre' })}
      <div class="wrap g12 co">
        <div class="co-text">${(c.paragraphes || []).map((p, i) => bloc(p, `site.compagnie.paragraphes.${i}`)).join('')}</div>
        <section class="co-dates" aria-labelledby="h-dates"><h2 class="co-h" id="h-dates"${ed('site.compagnie.datesTitre')}>${esc(c.datesTitre)}</h2>
          <ol class="annees">${(c.dates || []).map((x, i) => `<li><span class="an"${ed(`site.compagnie.dates.${i}.annee`)}>${esc(x.annee)}</span><span class="an-t"${ed(`site.compagnie.dates.${i}.titre`)}>${esc(x.titre)}</span></li>`).join('')}</ol></section>
      </div>
      ${d ? `<section class="wrap g12 dir" aria-labelledby="h-dir"><div class="dir-h"><h2 id="h-dir"${ed('site.compagnie.directeur.titre')}>${esc(d.titre)}</h2>${d.chapeau ? `<p${ed('site.compagnie.directeur.chapeau')}>${esc(d.chapeau)}</p>` : ''}</div>
        <div class="dir-t">${(d.paragraphes || []).map((p, i) => bloc(p, `site.compagnie.directeur.paragraphes.${i}`)).join('')}</div></section>` : ''}
      ${site().partenaires ? `<div class="wrap"><p class="partenaires"${ed('site.partenaires')}>${site().partenaires}</p></div>` : ''}`;
  }
  function contactHtml() {
    const c = site().contact || {}, co = site().coordonnees || {}, ch = c.champs || [];
    const i = String(c.consentement || '').toLowerCase().indexOf('politique de confidentialité');
    const consent = i > 0 ? `${esc(c.consentement.slice(0, i))}<a href="#/politique-de-confidentialite">${esc(c.consentement.slice(i))}</a>` : esc(c.consentement);
    const types = [['text', 'name'], ['email', 'email'], ['tel', 'tel'], ['text', 'address-level2']];
    return `${tete(c.titre, { chemin: 'site.contact.titre' })}
      <div class="wrap g12 ct">
        <form class="form ct-form" novalidate>
          <div class="fld-2">${ch.slice(0, 4).map((f, k) => `<p class="fld"><label for="f${k}">${esc(f)}</label><input id="f${k}" type="${types[k][0]}" autocomplete="${types[k][1]}"></p>`).join('')}</div>
          ${ch[4] ? `<p class="fld"><label for="f4">${esc(ch[4])}</label><textarea id="f4" rows="7"></textarea></p>` : ''}
          <p class="chk"><input id="f5" type="checkbox"><label for="f5">${consent}</label></p>
          <p class="calc"><label for="f6">${esc(c.calcul)}</label><input id="f6" inputmode="numeric" autocomplete="off"></p>
          <button class="btn" type="submit">${esc(c.bouton)}</button>
        </form>
        <address class="ct-co"><b>${esc(co.nom)}</b><br>${(co.adresse || []).map(esc).join('<br>')}</address>
      </div>`;
  }
  // les mentions d'origine, sans le crédit de l'agence web d'origine
  const legalHtml = key => { const g = site().legal[key]; return `${tete(g.titre, { chemin: `site.legal.${key}.titre` })}<div class="wrap"><div class="prose legal">${(g.blocs || []).map((b, i) => /réalisation multimédia|envoilauneidee/i.test(b) ? '' : bloc(b, `site.legal.${key}.blocs.${i}`)).join('')}</div></div>`; };

  /* ---------- L'en-tête et le pied ---------- */
  const teteEl = document.getElementById('tete'), piedEl = document.querySelector('.site-foot');
  function enTete() {
    const ouvert = !!teteEl.querySelector('.menu2.open');
    teteEl.innerHTML = `<div class="tete-1"><div class="wrap"><a class="brand" href="#/" data-k="marque" aria-label="${esc(site().nom)} - ${esc(site().accueil)}"><span class="brand-mark" data-pieuvre aria-hidden="true">${D.logo.mark}</span><span>${esc(site().titreSuffixe)}</span></a></div></div>
      <nav class="entrees" id="entrees" aria-label="${esc(entrees().map(e => e.court).join(', '))}"><ul class="wrap">${entrees().map(e => `<li><a href="${esc(e.href)}" data-e="${e.cle}" data-k="e-${e.cle}" style="${eStyle(e)}"><span class="e-pt" aria-hidden="true"></span><span class="e-long">${esc(e.texte)}</span><span class="e-court">${esc(e.court)}</span><svg class="e-fl" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 10h13.5M11.5 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>`).join('')}</ul></nav>
      <button class="menu-btn" type="button" data-k="menu-btn" aria-expanded="${ouvert}" aria-controls="menu2">${BARRES}<span>${esc(LIB().menu)}</span></button>
      <nav class="menu2${ouvert ? ' open' : ''}" id="menu2" aria-label="${esc(LIB().menu)}"><ul>${(site().menu || []).map(m => `<li><a href="${esc(m.href)}" data-m="${esc(m.id)}" data-k="m-${esc(m.id)}">${esc(m.texte)}</a></li>`).join('')}</ul></nav>`;
  }
  function pied() {
    const co = site().coordonnees || {}, f = site().facebook || {}, w = site().ecrire || {};
    const modifier = typeof EDITION !== 'undefined' && LIB().modifierSite ? `<button type="button" class="f-edit" data-k="modifier-site">${PLUME}<span>${esc(LIB().modifierSite)}</span></button>` : '';
    piedEl.innerHTML = `<div class="wrap g12 foot">
      <div class="f-brand">
        <a class="brand" href="#/" aria-label="${esc(site().nom)} - ${esc(site().accueil)}"><span class="brand-mark" aria-hidden="true">${D.logo.mark}</span><span>${esc(site().titreSuffixe)}</span></a>
        <address><b>${esc(co.nom)}</b><br>${(co.adresse || []).map(esc).join('<br>')}</address>
        <p class="f-links"><a href="${esc(w.href || '#/contact')}">${esc(w.texte)}</a>${f.href ? `<a href="${esc(f.href)}">${esc(f.texte)}</a>` : `<span>${esc(f.texte)}</span>`}</p>
      </div>
      <div class="f-part"><p${ed('site.partenaires')}>${site().partenaires || ''}</p><p class="f-ent">${entrees().map(e => `<a href="${esc(e.href)}" style="${eStyle(e)}"><span class="e-pt" aria-hidden="true"></span>${esc(e.texte)}</a>`).join('')}</p></div>
      <div class="f-legal">${(co.legal || []).map(x => `<span>${esc(x)}</span>`).join('')}<span class="f-ll">${(site().liensLegaux || []).map(l => `<a href="${esc(l.href)}">${esc(l.texte)}</a>`).join('')}${modifier}</span></div>
    </div>`;
  }
  function fermerMenu() { const m = document.getElementById('menu2'), b = teteEl.querySelector('.menu-btn'); if (m) m.classList.remove('open'); if (b) b.setAttribute('aria-expanded', 'false'); }
  function marquer(v) {
    teteEl.querySelectorAll('#entrees a').forEach(a => {
      const ici = v.entree && v.entree.cle === a.dataset.e;
      if (ici) a.setAttribute('aria-current', v.entree.mode); else a.removeAttribute('aria-current');
    });
    teteEl.querySelectorAll('#menu2 a').forEach(a => { if (v.menu && a.dataset.m === v.menu) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }

  /* ---------- Le routeur : les trois entrées, la mémoire de l'entrée, les anciennes adresses ---------- */
  const MEM = 'crescite-m03-entree';
  const memoire = {
    lire() { try { const v = sessionStorage.getItem(MEM); return ENTREES.includes(v) ? v : null; } catch (e) { return null; } },
    ecrire(v) { try { sessionStorage.setItem(MEM, v); } catch (e) { /* stockage indisponible */ } },
  };
  function analyser() {
    const h = location.hash || '';
    const redir = (site().redirections || {})[h];
    if (redir) return { aller: redir };
    const p = h.replace(/^#\/?/, '').split('?')[0].split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    if (!p.length) return { vue: 'accueil' };
    if (p.length === 1 && ENTREES.includes(p[0]) && entreeDe(p[0])) return { vue: p[0] };
    if (p.length === 1 && p[0] === 'spectacles' && menuDe('spectacles')) return { vue: 'spectacles' };
    if (p.length === 1 && p[0] === 'compagnie') return { vue: 'compagnie' };
    if (p.length === 1 && p[0] === 'contact') return { vue: 'contact' };
    if (p[0] === 'spectacle' && showDe(p[1])) {
      if (p.length === 2) return { aller: `#/spectacle/${p[1]}/${entreeSp(p[1], memoire.lire() || 'voir')}` };
      if (p.length === 3 && ENTREES.includes(p[2]) && entreeDe(p[2])) return entreeSp(p[1], p[2]) === p[2] ? { vue: 'spectacle', slug: p[1], entree: p[2] } : { aller: `#/spectacle/${p[1]}/voir` };   // sans action culturelle : « voir »
    }
    if (p.length === 2 && p[0] === 'agenda' && own(D.saisons, p[1])) return { vue: 'saison', cle: p[1] };
    if (p.length === 1 && own(site().legal, p[0])) return { vue: 'legal', cle: p[0] };
    return { aller: '#/' };
  }
  function vueDe(a) {
    switch (a.vue) {
      case 'voir': return { titre: entreeDe('voir').texte, entree: { cle: 'voir', mode: 'page' }, rendu: voirHtml };
      case 'programmer': return { titre: entreeDe('programmer').texte, entree: { cle: 'programmer', mode: 'page' }, rendu: programmerHtml };
      case 'etablissement': return { titre: entreeDe('etablissement').texte, entree: { cle: 'etablissement', mode: 'page' }, rendu: etablissementHtml };
      case 'spectacles': return { titre: menuDe('spectacles').texte, menu: 'spectacles', rendu: spectaclesHtml };
      case 'compagnie': return { titre: (site().compagnie || {}).titre || (menuDe('compagnie') || {}).texte, menu: 'compagnie', rendu: compagnieHtml };
      case 'contact': return { titre: (menuDe('contact') || {}).texte || (site().contact || {}).titre, menu: 'contact', rendu: contactHtml };
      case 'spectacle': {
        const s = showDe(a.slug), e = entreeDe(a.entree);
        return { titre: a.entree === 'voir' ? s.titre : `${s.titre} - ${e.court}`, entree: { cle: a.entree, mode: 'true' }, spectacle: true, rendu: f => spectacleHtml(s, a.entree, f) };
      }
      case 'saison': return { titre: D.saisons[a.cle].titre, entree: { cle: 'voir', mode: 'true' }, rendu: f => saisonHtml(a.cle, f) };
      case 'legal': return { titre: site().legal[a.cle].titre, rendu: () => legalHtml(a.cle) };
      default: return { titre: site().accueil, rendu: accueilHtml };
    }
  }
  let espion = null;
  function route(opts = {}) {
    const a = analyser();
    if (a.aller && a.aller !== location.hash) { location.replace(a.aller); return; }
    const enPlace = !!opts.enPlace;
    cachePasse = null;
    if (!enPlace) fermerMenu();
    const v = vueDe(a);
    if (ENTREES.includes(a.vue)) memoire.ecrire(a.vue);
    else if (a.vue === 'spectacle') memoire.ecrire(a.entree);
    document.body.dataset.vue = v.spectacle ? 'spectacle' : (a.vue || 'accueil');
    main.classList.toggle('fixe', enPlace);
    rangOn = null;
    main.innerHTML = v.rendu(enPlace);
    brancher(enPlace);
    document.title = v.titre + ' - ' + site().titreSuffixe;
    marquer(v);
    if (!enPlace) {
      window.scrollTo(0, 0);
      const h1 = document.getElementById('h1');
      if (h1 && !INTRO.ouverte()) h1.focus({ preventScroll: true });
    }
  }
  function brancher(fixe) {
    if (ro) ro.disconnect();
    main.querySelectorAll('svg.carte-m03').forEach(svg => {
      if (ro) ro.observe(svg); else etiqueter(svg);
      CARTE.lier(svg, { survol: l => survolLieu(svg, l), choix: l => choisirLieu(svg, l) });
      if (fixe) svg.classList.add('pousse');
      else if (!(svg.dataset.attente && INTRO.ouverte())) pousser(svg);
    });
    majAgenda(false, true); majProg();
    sommaire();
  }
  // le petit sommaire qui suit la lecture (onglet « Je viens voir un spectacle » d'un spectacle)
  function sommaire() {
    if (espion) { espion.disconnect(); espion = null; }
    const nav = main.querySelector('.u-sommaire');
    if (!nav || !('IntersectionObserver' in window)) return;
    const liens = [...nav.querySelectorAll('a[data-chap]')], vis = new Map();
    const marque = () => {
      let id = null;
      for (const a of liens) if (vis.get(a.dataset.chap)) { id = a.dataset.chap; break; }
      if (id) liens.forEach(a => a.classList.toggle('ici', a.dataset.chap === id));
    };
    espion = new IntersectionObserver(es => { es.forEach(e => vis.set(e.target.id, e.isIntersecting)); marque(); }, { rootMargin: '-90px 0px -55% 0px' });
    liens.forEach(a => { const s = document.getElementById(a.dataset.chap); if (s) espion.observe(s); });
    if (liens[0]) liens[0].classList.add('ici');
  }

  /* ---------- Une mise à jour des données (règle 9) : la vue courante se refait en place ---------- */
  function cleDe(el) {
    if (!el || el === document.body || el === main) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset && el.dataset.k) return `[data-k="${CSS.escape(el.dataset.k)}"]`;
    if (el.dataset && el.dataset.edit) return `[data-edit="${CSS.escape(el.dataset.edit)}"]`;
    if (el.matches && el.matches('.carte-lieu')) { const c = lieDe(el); return c && c.id ? `#${CSS.escape(c.id)} .carte-lieu[data-l="${el.dataset.l}"]` : `.carte-lieu[data-l="${el.dataset.l}"]`; }
    if (el.matches && el.matches('a[href]')) return `a[href="${CSS.escape(el.getAttribute('href'))}"]`;
    return null;
  }
  function rafraichir() {
    const y = window.scrollY, act = document.activeElement, cle = cleDe(act);
    const sel = act && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const ouverts = [...main.querySelectorAll('details[data-k]')].filter(d => d.open).map(d => d.dataset.k);
    polices();
    enTete(); pied();
    route({ enPlace: true });
    ouverts.forEach(k => { const d = main.querySelector(`details[data-k="${CSS.escape(k)}"]`); if (d) d.open = true; });
    if (cle) {
      const el = document.querySelector(cle);
      if (el) { el.focus({ preventScroll: true }); if (sel && typeof el.setSelectionRange === 'function') try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* champ sans sélection */ } }
    }
    window.scrollTo(0, y);
  }

  /* ---------- Les évènements ---------- */
  let rangOn = null;
  function surRang(r) {
    if (r === rangOn) return;
    if (rangOn) allumer(svgDe(rangOn), null);
    rangOn = r;
    if (!r) return;
    const l = r.dataset.l;
    allumer(svgDe(r), { l: l != null && l !== '' ? +l : null, slug: r.dataset.slug || null });
  }
  main.addEventListener('mouseover', e => surRang(e.target.closest('.dt')));
  main.addEventListener('mouseleave', () => surRang(null));
  main.addEventListener('focusin', e => surRang(e.target.closest('.dt')));
  document.addEventListener('click', e => {
    const el = e.target.closest('button, a');
    if (!el) return;
    if (el.matches('.skip')) { e.preventDefault(); main.focus(); return; }
    if (el.matches('.idx, .idx-tout')) { surIndex(el); return; }
    if (el.matches('.f-edit')) { if (typeof EDITION !== 'undefined') EDITION.ouvrir(); return; }
    if (el.matches('.menu-btn')) { const m = document.getElementById('menu2'), o = !m.classList.contains('open'); m.classList.toggle('open', o); el.setAttribute('aria-expanded', String(o)); return; }
    if (el.closest('#menu2')) fermerMenu();
    if (el.matches('a[data-chap]')) {
      e.preventDefault();
      const s = document.getElementById(el.dataset.chap);
      if (s) { s.scrollIntoView({ behavior: CARTE.mouvement() ? 'smooth' : 'auto', block: 'start' }); s.focus({ preventScroll: true }); }
      return;
    }
    if (el.matches('a[href^="#/"]') && el.getAttribute('href') === location.hash) { e.preventDefault(); route(); return; }
    const mod = el.closest('[data-module]'), prog = !!(mod && mod.dataset.module === 'prog'), st = prog ? PG : AG, maj = prog ? majProg : majAgenda;
    if (el.matches('.chip') && mod) {
      st.slug = st.slug === el.dataset.slug ? null : el.dataset.slug;
      if (!prog && mod.dataset.mode === 'accueil' && AG.l != null && !datesPub().some(d => d.l === AG.l && (!AG.slug || d.slug === AG.slug))) AG.l = null;
      if (prog && PG.l != null && !TOUT.some(x => x.l === PG.l && (!PG.slug || x.dates.some(d => d.slug === PG.slug)))) PG.l = null;
      maj(true);
    } else if (el.matches('.lieu-chip') && mod) { st.l = null; maj(); }
    else if (el.matches('.lieu-btn') && mod) { PG.l = +el.dataset.l; majProg(true); }
  });
  document.addEventListener('submit', e => e.preventDefault());
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { AG.q = e.target.value; majAgenda(); }
    else if (e.target.id === 'pq') { PG.q = e.target.value; PG.l = null; majProg(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (e.target.id === 'q' && e.target.value) { e.target.value = ''; AG.q = ''; majAgenda(); }
    else if (e.target.id === 'pq' && e.target.value) { e.target.value = ''; PG.q = ''; majProg(); }
    else if (document.querySelector('#menu2.open')) { fermerMenu(); const b = teteEl.querySelector('.menu-btn'); if (b) b.focus(); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => main.querySelectorAll('svg.carte-m03').forEach(etiqueter));

  // les tentacules : la pieuvre du logo guide ; chaque entrée donne sa couleur à la remontée de sa page (papier clair : la couleur franche)
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'encre', entrees: 'couleur', soulever: true });
  enTete(); pied(); polices();
  // l'ouverture : le papier réglé de l'agenda, le logo à l'encre ; à la révélation, les bras de la carte poussent depuis Rouen
  INTRO.ouvrir({ fond: '#f4f1ea', encre: '#141414', classe: 'intro-m03', apres: () => main.querySelectorAll('svg.carte-m03:not(.pousse)').forEach(pousser) });
  window.addEventListener('hashchange', () => route());
  if (typeof DONNEES !== 'undefined' && DONNEES.surChangement) DONNEES.surChangement(rafraichir);
  route();
})();
</script>
</body>
</html>
