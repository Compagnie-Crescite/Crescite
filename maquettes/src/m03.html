/* ——— le mouvement : la grille suisse (voir le bloc « Mouvement » en tête du script) ———
   Tout tombe dans la grille : la page se découvre colonne après colonne, les filets se tracent de gauche à droite, les
   nombres comptent. Une seule courbe, nette (--c3), des durées courtes : filet .3 s à .6 s, colonne 22 ms, pression .06 s. */
:root { --c3: cubic-bezier(.65, 0, .35, 1); --c3s: cubic-bezier(.2, 0, 0, 1); }
html { view-transition-name: none; }
main { display: block; min-height: 100svh; }   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas */
/* la grille de la mise en page, en filigrane, le temps d'un changement de page (ses colonnes posées par le script) */
.grille { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; }
/* le menu : le filet épais de l'élément choisi se trace depuis la gauche, à la couleur de la saison (règle 22) ; celui de
   l'élément quitté se retire vers la droite ; « true » (une page qui en dépend : un spectacle, une page de l'espace pro) : à demi */
.menu-p a[aria-current]::before { transform: scaleY(.34); }
.menu-p a::after { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 6px; background: var(--acc); pointer-events: none;
  transform: scaleX(0); transform-origin: 100% 50%; transition: transform .3s var(--c3); }
.menu-p a[aria-current]::after { transform: none; transform-origin: 0 50%; }
.menu-p a[aria-current="true"]::after { height: 3px; }
.menu-p a { transition: background-color .3s var(--c3), color .2s; }
/* les onglets d'un spectacle : le même filet, qui passe de l'onglet quitté à l'onglet choisi */
.u-onglets a { position: relative; border-bottom-color: transparent !important; }
.u-onglets a::after { content: ""; position: absolute; left: 0; right: 26px; bottom: 0; height: 4px; background: var(--u-titre); pointer-events: none;
  transform: scaleX(0); transform-origin: 100% 50%; transition: transform .3s var(--c3); }
.u-onglets a[aria-current="page"]::after { transform: none; transform-origin: 0 50%; }
.u-onglets a.entrant::after { transform: scaleX(0); transition: none; }
.u-onglets a.sortant::after { transform: none; transition: none; }
.u-h1.sans-revele .l { animation: none !important; }
/* les filets des rubriques : ils se tracent à leur arrivée, de gauche à droite (MOUVEMENT.reveler, data-mv="regle") */
[data-mv="regle"] { position: relative; border-bottom-color: transparent !important; }
[data-mv="regle"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--regle, var(--ink)); pointer-events: none;
  transform-origin: 0 50%; transition: transform .6s var(--c3); transition-delay: var(--mv-delai, 0ms); }
[data-mv="regle"].mv-attente:not(.mv-vu)::after { transform: scaleX(0); }
.u-h2[data-mv="regle"] { --regle: color-mix(in srgb, var(--u-texte) 30%, transparent); }
.mois-h[data-mv="regle"]::after { transition-duration: .45s; }
[data-mv="regle-h"] { position: relative; border-top-color: transparent !important; }
[data-mv="regle-h"]::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--regle, var(--ink)); pointer-events: none;
  transform-origin: 0 50%; transition: transform .6s var(--c3); }
[data-mv="regle-h"].mv-attente:not(.mv-vu)::before { transform: scaleX(0); }
/* les nombres qui comptent : des chiffres de même largeur, rien ne bouge autour d'eux */
.mv-chiffre { font-variant-numeric: tabular-nums; }
/* ce qui arrive : les fiches et les cartes de spectacle, colonne après colonne (cascade, 40 ms), sans flou ni rebond */
[data-mv="cascade"].mv-attente > * { transition: opacity .3s var(--c3s), transform .34s var(--c3s); transition-delay: calc(var(--mv-delai, 0ms) + min(var(--mv-i, 0), 10) * 40ms); }
[data-mv="cascade"].mv-attente:not(.mv-vu) > * { transform: translateX(-12px); }
/* la pression : la pièce descend d'un pixel, à l'instant même */
:is(.chip, .lieu-chip, .lieu-btn, .agir, .u-agir, .idx, .idx-tout, .theme-m03, .dos-bt, .btn, .ep-a, .f-edit, .lien-v, .suite, .t-link, .menu-p a, .u-onglets a, .choix a, .sai > summary, .rs-date, .rs-reserver, .rs-seance, .lc-b, .tr3-place) { transition-property: color, background-color, border-color, box-shadow, transform, opacity; transition-duration: .15s; }
:is(.chip, .lieu-chip, .lieu-btn, .agir, .u-agir, .idx, .idx-tout, .theme-m03, .dos-bt, .btn, .ep-a, .f-edit, .choix a, .rs-date, .rs-reserver, .rs-seance, .lc-b, .tr3-place).mv-presse { transform: translateY(1px); transition-duration: .06s; }
:is(.menu-p a, .u-onglets a, .sai > summary, .t-link, .suite, .lien-v).mv-presse { background-color: color-mix(in srgb, var(--ink) 6%, transparent); transition-duration: .06s; }
/* l'état qu'un geste allume se montre à l'image même, sans transition (il ne s'efface en douceur qu'en partant) : le geste se voit
   tout de suite, même quand la page nouvelle se compose juste après ; le filet de l'élément du menu, lui, se trace toujours */
.menu-p a[aria-current], .menu-p a[aria-current] .m-ic, .u-onglets a[aria-current], .sai[open] > summary, .chip[aria-pressed="true"] { transition-duration: 0s; }
/* au doigt (sans survol) : les couleurs et les fonds changent à l'instant même, seules les animations composées (transform, opacity)
   glissent ; rien ne retient le fil principal quand la page nouvelle se compose juste après le geste */
@media (hover: none) {
  :is(.chip, .lieu-chip, .lieu-btn, .agir, .u-agir, .idx, .idx-tout, .theme-m03, .dos-bt, .btn, .ep-a, .f-edit, .lien-v, .suite, .t-link, .menu-p a, .u-onglets a, .choix a, .sai > summary, .rs-date, .rs-reserver, .rs-seance, .lc-b, .tr3-place), .menu-p a .m-ic { transition-property: transform, opacity; }
  :is(.menu-p a, .u-onglets a, .sai > summary, .t-link, .suite, .lien-v).mv-presse { transition-duration: 0s; }
}
/* une ligne vers laquelle mène une frise : elle se marque d'un aplat, qui s'efface */
@keyframes m3-vise { 0%, 45% { background-color: color-mix(in srgb, var(--c, var(--ink)) 16%, transparent); } }
.dt.est-vise, .dcard.est-vise { animation: m3-vise 1.3s var(--c3); }
.dt.est-allume { background: color-mix(in srgb, var(--c, var(--ink)) 9%, transparent); }
.dt.est-allume::before { opacity: 1; }
.dcard.est-allume { box-shadow: 0 0 0 2px var(--u-titre); }
.sai.est-allume > summary { background: var(--paper-2); }
.carte-lieu.est-allume .pt-in { transform: scale(1.6); }
.carte-lieu.est-allume .aura { fill: color-mix(in srgb, var(--c) 24%, transparent); }
/* la carte : les bras se découvrent d'un trait vertical qui balaie la France d'ouest en est (une seule découpe pour tous les
   bras) ; une carte de beaucoup de communes paraît d'un fondu, sans mouvement commune par commune */
.carte-m03:not(.pousse) .bras-g { visibility: hidden; }
.carte-m03.nombreux .carte-lieu .pt { transform: none; transition: none; }
.carte-m03.nombreux .bras, .carte-m03.nombreux .carte-lieu, .carte-m03.nombreux .nom { transition: none; }
.carte-m03.nombreux:not(.pousse) { opacity: 0; }
.carte-m03.nombreux { transition: opacity .45s var(--c3s); }
/* le dossier composé : son filet se trace jusqu'au bout et reste un instant */
.dos-bt.fait .occ { animation: m3-fait 1.2s var(--c3) both; }
@keyframes m3-fait { 0% { transform: scaleX(0); transform-origin: 0 50%; } 35%, 75% { transform: scaleX(1); transform-origin: 0 50%; } 100% { transform: scaleX(0); transform-origin: 100% 50%; } }

/* ——— les frises (FRISE) dans la grille : des filets d'un pixel, des repères carrés, les mois en capitales, les nombres en chiffres de même largeur ——— */
.frise[data-frise] { --fr-fond: var(--paper); --fr-encre: var(--ink); --fr-trait: var(--rule-2); --fr-accent: var(--acc); --fr-police: var(--at);
  --fr-point: 10px; --fr-couloir: 15px; --fr-haut: 30px; --fr-taille: 12px; --fr-pied: 42px; --fr-passe: .3; --fr-courbe: var(--c3);
  --fr-bulle-fond: var(--ink); --fr-bulle-encre: var(--paper); }
.u .frise[data-frise] { --fr-fond: var(--u-fond); --fr-encre: var(--u-texte); --fr-trait: color-mix(in srgb, var(--u-texte) 30%, transparent); --fr-accent: var(--u-vif);
  --fr-bulle-fond: var(--u-texte); --fr-bulle-encre: var(--u-fond); }
.frise .frise-point:not(.est-duree) > .frise-repere::before { border-radius: 2px; }
.frise .frise-point.est-scolaire:not(.est-duree) > .frise-repere::before { rotate: none; border-radius: 2px; background: var(--fr-fond); box-shadow: inset 0 0 0 2px var(--fr-c, currentColor), 0 0 0 2px var(--fr-fond); width: var(--fr-point); height: var(--fr-point); }
.frise .frise-point.est-duree > .frise-repere::before { border-radius: 1px; }
.frise .frise-grappe > span { border-radius: 3px; background: linear-gradient(var(--fr-fond), var(--fr-fond)) center / 16px 16px no-repeat, conic-gradient(var(--fr-g, currentColor)); }
.frise .frise-grappe-n { font: 700 10.5px/1 var(--sg); }
.frise .frise-axe { background: var(--fr-encre); height: 1px; }
.frise .frise-mois > li { border-left-color: var(--fr-trait); height: 8px; }
.frise .frise-mois-nom { font: 700 10.5px/1.2 var(--at); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.u .frise .frise-mois-nom { color: var(--u-texte2); }
.frise .frise-an { font: 500 11px/1.4 var(--sg); font-variant-numeric: tabular-nums; opacity: .8; }
.frise .frise-bulle { border-radius: 0; padding: 8px 12px 9px; font: 500 13px/1.4 var(--at); box-shadow: 0 10px 26px -12px var(--shadow-barre); }
.frise .frise-bulle b { font: 500 14px/1.3 var(--sg); letter-spacing: -.01em; }
.frise .frise-bulle i { border-radius: 2px; }
.frise .frise-aujourdhui::before { opacity: 1; width: 1.5px; left: -.75px; top: 15px; }
.frise .frise-aujourdhui::after { border-radius: 0; }
.frise .frise-aujourdhui-nom { font: 700 10px/1.2 var(--at); letter-spacing: .12em; text-transform: uppercase; }
.frise .frise-repere:focus-visible { outline: 2px solid var(--fr-accent); outline-offset: 2px; border-radius: 0; }
/* les saisons et leur densité : des colonnes pleines, le nombre au-dessus, qui compte */
.frise .frise-bande-barre { background: var(--fr-c, var(--ink)); opacity: .9; }
.frise .frise-bande.est-passe .frise-bande-barre { opacity: .5; }
.frise .frise-bande:is(:hover, .est-allume, :focus-within) .frise-bande-barre { opacity: 1; }
.frise .frise-bande-n { font: 500 13px/1 var(--sg); font-variant-numeric: tabular-nums; }
.frise .frise-bande-nom { font: 600 11px/1 var(--at); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.u .frise .frise-bande-nom { color: var(--u-texte2); }
.frise-saisons, .frise-diffusion { --fr-bande-h: 44px; --fr-haut: 24px; --fr-pied: 30px; }
.frise-saisons .frise-bande { --fr-c: var(--ink); }
.frise-diffusion .frise-bande { --fr-c: var(--u-titre, var(--ink)); }
.frise-diffusion .frise-aujourdhui-nom, .frise-saisons .frise-aujourdhui-nom { display: none; }
.frise-diffusion .frise-aujourdhui::before, .frise-saisons .frise-aujourdhui::before { top: 0; }
.fr { margin: 0; }
.fr-saisons { margin: 26px 0 8px; }
.fr-tournee { margin: 22px 0 28px; }
.fc-diff { padding-top: 12px; border-top: 1px solid var(--rule); }
.fr-cie { margin: 20px 0 8px; }
.fr-cie .frise-bande { --fr-c: var(--ink); }
.fc-diff .frise[data-frise] { --fr-fond: var(--field); --fr-bande-h: 34px; --fr-haut: 20px; }
/* l'histoire de la compagnie : un axe épais, les années en grand sous lui, les créations au-dessus de leur repère */
.co-frise { grid-column: 1 / -1; padding-top: 18px; }
.co-frise .frise[data-frise] { --fr-point: 12px; --fr-couloir: 46px; --fr-haut: 28px; --fr-pied: 50px; --fr-passe: 1; }
.co-frise .frise-axe { height: 2px; margin-top: -1px; }
.co-frise .frise-mois > li { height: 10px; border-left-width: 1px; border-left-color: var(--ink); }
.co-frise .frise-mois-nom { font: 500 1.375rem/1 var(--sg); letter-spacing: -.03em; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; }
.co-frise .frise-mois > li > span:first-child { top: 14px; left: 4px; }
.co-frise .frise-etiquette { font: 500 1.0625rem/1.2 var(--sg); letter-spacing: -.01em; max-width: 11em; }
.co-frise .frise-etiquette::before { background: var(--ink); }
.co-frise .frise-repere:is(:hover, :focus-visible) .frise-etiquette { color: var(--acc); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
html.ed-actif .co-frise { display: none; }
/* l'entrée des frises : l'axe se trace, les repères se posent dans l'ordre du temps, comme on remplit une grille */
.frise[data-frise].est-vue:not(.est-immobile):not(.est-deja) .frise-axe { animation: fr-trace .5s var(--c3) both; }
.frise[data-frise].est-vue:not(.est-immobile):not(.est-deja) .frise-mois { animation: fr-parait .3s var(--c3) .1s both; }
.frise[data-frise].est-vue:not(.est-immobile):not(.est-deja) :is(.frise-points, .frise-grappes, .frise-bandes) { animation: fr-devoile .55s steps(12, end) .05s backwards; }

/* ——— la frise de la saison (règle 21) : le cœur. Une seule ligne du temps, de septembre à août : chaque date une barre à la
   couleur de son spectacle (évidée pour une date scolaire, un aplat cerné pour une date longue), posée en couloirs quand elle en
   touche une autre ; les mois en colonnes, un axe d'encre épais, « aujourd'hui » d'un trait de la couleur de la saison (règle 22)
   qui la traverse. Dessous, sa légende : la barre de chaque spectacle, son titre, le nombre de ses dates. Choisir une date de
   la frise la choisit dans la liste, et inversement (la date choisie y est cernée d'encre). ——— */
.fs { margin: 26px 0 8px; }
.fs .frise[data-frise] { --fr-point: 9px; --fr-barre: 18px; --fr-couloir: 22px; --fr-haut: 34px; --fr-pied: 36px; --fr-passe: .34; --fr-marge: 0px; --fr-accent: var(--acc); }
.fs .frise-axe { height: 3px; margin-top: -1.5px; background: var(--ink); }
.fs .frise-mois > li { top: 0; height: 100%; border-left: 1px solid var(--rule); }
.fs .frise-mois > li > span:first-child { top: calc(var(--fr-axe) + 9px); left: 6px; z-index: 1; padding-right: 4px; background: var(--fr-fond); }   /* le trait d'aujourd'hui passe dessous */
.fs .frise-mois-nom { font: 700 .6875rem/1.2 var(--at); letter-spacing: .1em; }
/* les barres se posent sur l'axe (le centre du repère, 12 px au-dessus), les couloirs montent de 22 px */
.fs .frise-point { top: calc(var(--fr-axe) - 13px - var(--fr-y, 0) * var(--fr-couloir)); }
.fs .frise-point:not(.est-duree) > .frise-repere::before { width: var(--fr-point); height: var(--fr-barre); border-radius: 0; box-shadow: 0 0 0 1px var(--fr-fond); }
.fs .frise-point.est-scolaire:not(.est-duree) > .frise-repere::before { width: var(--fr-point); height: var(--fr-barre); border-radius: 0; background: var(--fr-fond); box-shadow: inset 0 0 0 2px var(--fr-c), 0 0 0 1px var(--fr-fond); }
.fs .frise-point.est-duree > .frise-repere { height: var(--fr-barre); margin-top: calc(var(--fr-barre) / -2); }
.fs .frise-point.est-duree > .frise-repere::before { height: var(--fr-barre); border-radius: 0; background: color-mix(in srgb, var(--fr-c) 26%, var(--fr-fond)); box-shadow: inset 0 0 0 2px var(--fr-c); }
.fs .frise-point.est-duree.est-scolaire > .frise-repere::before { background: var(--fr-fond); }
.fs .frise-point > .frise-repere:is(:hover, :focus-visible)::before, .fs .frise-point:is(.est-allume, .est-focus) > .frise-repere::before { scale: 1.35 1.12; }
.fs .frise-point.est-duree > .frise-repere:is(:hover, :focus-visible)::before, .fs .frise-point.est-duree:is(.est-allume, .est-focus) > .frise-repere::before { scale: 1 1.12; }
.fs .frise-point.est-choisi > .frise-repere::before { opacity: 1; box-shadow: 0 0 0 2px var(--fr-fond), 0 0 0 4px var(--ink); }
.fs .frise-point.est-scolaire.est-choisi > .frise-repere::before { box-shadow: inset 0 0 0 2px var(--fr-c), 0 0 0 2px var(--fr-fond), 0 0 0 4px var(--ink); }
.fs .frise-aujourdhui { height: 100%; }
.fs .frise-aujourdhui::before { top: 0; bottom: 0; left: -1px; width: 2px; background: var(--acc); opacity: 1; }
.fs .frise-aujourdhui::after { display: none; }
.fs .frise-aujourdhui-nom { top: 0; padding: 2px 6px 3px; background: var(--acc); color: var(--acc-sur); font: 700 .625rem/1.2 var(--at); letter-spacing: .12em; text-transform: uppercase; }
.fs .frise-souffle { border-radius: 0; bottom: auto; top: calc(var(--fr-axe) - 4px); background: var(--acc); }
.fs .frise.est-filtre .frise-point:not(.est-sp) { opacity: .16; }
.fs-leg { display: flex; flex-wrap: wrap; gap: 6px 26px; padding-top: 12px; border-top: 1px solid var(--ink); }
.fs-l { display: inline-flex; align-items: center; gap: 9px; min-height: 28px; font: 500 1rem/1.2 var(--sg); letter-spacing: -.01em; transition: opacity .2s var(--c3); }
.fs-l i { flex: none; width: 9px; height: 18px; background: var(--c); }
.fs-l b { font: 500 1rem/1 var(--sg); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.fs-l.est-vide { opacity: .4; }
.fs-l.fs-sc i { background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink-2); }
.fs-l.fs-sc span { color: var(--ink-2); }
.u .fs-leg { border-top-color: var(--u-texte); }
.ag-accueil .fs { margin-top: 18px; }
.sc .fs { margin: 8px 0 22px; }

/* ——— les saisons (#/saisons, règle 21) : la saison en cours (sa marque à la couleur de la saison, sa frise, ses prochaines dates,
   toutes ses dates et sa carte), puis les saisons passées, fermées ——— */
.s0 { margin-top: 30px; scroll-margin-top: calc(var(--head) + 12px); }
.s0-tete { padding-top: 16px; border-top: 8px solid var(--acc); }
.s0-k { display: block; margin-bottom: 10px; font: 700 .8125rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
.s0-t { font-size: clamp(2.5rem, 1.5rem + 3.4vw, 4.5rem); line-height: .95; letter-spacing: -.045em; }
.s0-h { display: flex; align-items: baseline; gap: 12px; margin-top: 36px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); font-size: 1.75rem; letter-spacing: -.03em; }
.s0-h::before { content: ""; flex: none; width: 10px; height: 10px; background: var(--acc); transform: translateY(-.08em); }
.ag-prochaines > .s0-h:first-child { margin-top: 18px; }
.ag-complet .ag-toutes { grid-column: 1 / 9; grid-row: 2; min-width: 0; }
.ag-complet .ag-carte { grid-row: 1 / span 2; align-self: start; }
.ag-complet .s0-h { font-size: 2.25rem; letter-spacing: -.035em; }
.ag-complet .mois { margin-top: 22px; }
.ag-complet .mois-h { font-size: 1.375rem; padding-bottom: 8px; }
/* toutes les dates : le programme de la saison, plus serré (le jour, le spectacle, le lieu, ses précisions) */
.ag-toutes .row { grid-template-columns: 112px minmax(0, 1fr); padding: 11px 0 12px; }
.ag-toutes .j-big { font-size: 2rem; }
.ag-toutes .j-mo { font-size: 1.25rem; }
.ag-toutes .t-link { font-size: 1.125rem; }
.ag-toutes .where { margin-top: 2px; font-size: 1rem; }
.ag-toutes .det { margin-top: 2px; font-size: .9375rem; }
/* une date déjà jouée : en retrait (le texte en encre seconde, le point évidé) ; « aujourd'hui », un filet de la saison */
.row.est-passe .when, .row.est-passe .t-link, .row.est-passe .where { color: var(--ink-2); }
.row.est-passe .dot { background: none; box-shadow: inset 0 0 0 2px var(--c, var(--ink-2)); }
.auj-l { display: flex; align-items: center; gap: 12px; margin: 16px 0 6px; font: 700 .75rem/1 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
.auj-l::after { content: ""; flex: 1; height: 2px; background: var(--acc); }

/* ——— la page d'un spectacle qui n'est plus en tournée (règle 21) : sa présentation, le bilan de ses dates passées (ses chiffres,
   la frise de sa tournée, ses dates par saison à côté d'une grande carte de tous ses lieux), les actions culturelles menées ——— */
.u-filet { border-top: 1px solid color-mix(in srgb, var(--u-texte) 24%, transparent); }
.u .bilan-rep { margin-top: 22px; }
.bilan-n { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); margin-top: 24px; border-top: 2px solid var(--u-titre); }
.bilan-n li { padding: 16px 0 18px; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 22%, transparent); }
.bilan-n b { display: block; font: 500 clamp(3rem, 6vw, 5.25rem)/.86 var(--sg); letter-spacing: -.05em; color: var(--u-titre); font-variant-numeric: tabular-nums; }
.bilan-n span { display: block; margin-top: 10px; font: 700 .8125rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
/* la frise du bilan : toutes ses dates sont passées, aucune n'est en retrait */
[data-fr="bilan"] .frise[data-frise] { --fr-passe: 1; --fr-point: 11px; }
.bilan-g { margin-top: 30px; align-items: start; row-gap: 28px; }
.bilan-dates { grid-column: 1 / 7; min-width: 0; }
.bilan-carte { grid-column: 7 / 13; position: sticky; top: calc(var(--head) + 16px); }
.bl-s + .bl-s { margin-top: 40px; }
.bl-t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--u-texte); font: 500 1.5rem/1.1 var(--sg); letter-spacing: -.03em; }
.bl-t small { font: 500 1.125rem/1 var(--sg); color: var(--u-texte2); font-variant-numeric: tabular-nums; }
.ac-menees { margin-top: 26px; }
.ac-menees > * + * { margin-top: 22px; }
.bilan-dates .j-sous + .j-sous { margin-top: 2px; }
/* les lignes de dates dans un univers : ses couleurs */
.u .row { border-bottom-color: color-mix(in srgb, var(--u-texte) 18%, transparent); }
.u .row .when, .u .row .where, .u .row .t-link { color: var(--u-texte); }
.u .j-sous, .u .det, .u .tag-sc { color: var(--u-texte2); }
.u .det a, .u .what .where a:hover { color: var(--u-vif); }
.u .etat { background: var(--u-texte); color: var(--u-fond); }
.u .dt { --c: var(--u-titre); }
.u .dt.on, .u .dt.est-allume { background: color-mix(in srgb, var(--u-titre) 14%, transparent); }

/* ——— l'espace pro : ses deux pages (programmer, établissements scolaires) en grandes cases, avant ses trois portes ——— */
.ep-pages { margin: 4px 0 56px; }
.ep-pages .choix-t { font-size: clamp(1.625rem, 2.4vw, 2.25rem); }

/* ——— l'espace pro : trois accès, posés sur trois fois quatre colonnes ——— */
.ep-texte { grid-column: 1 / 9; max-width: 56ch; font: 400 1.375rem/1.5 var(--at); color: var(--ink-2); }
.ep-portes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--gap); margin-top: 8px; border-top: 1px solid var(--ink); }
.ep { position: relative; display: flex; flex-direction: column; min-height: 280px; padding: 22px 0 26px; border-bottom: 1px solid var(--ink); }
.ep::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 6px; background: var(--ink); transform: scaleX(0); transform-origin: 100% 50%; transition: transform .3s var(--c3); }
.ep:hover::before, .ep:focus-within::before { transform: none; transform-origin: 0 50%; }
.ep-t { font: 500 2rem/1.05 var(--sg); letter-spacing: -.035em; }
.ep-a { text-decoration: none; color: inherit; }
.ep-a::after { content: ""; position: absolute; inset: 0; }
.ep-a:focus-visible { outline: none; }
.ep-a:focus-visible::after { outline: 3px solid var(--acc); outline-offset: 4px; }
.ep-x { margin-top: 14px; max-width: 34ch; font-size: 1rem; line-height: 1.55; color: var(--ink-2); }
.ep-f { margin-top: auto; padding-top: 28px; color: var(--ink); transition: transform .2s var(--c3); }
.ep-f svg { width: 30px; height: 30px; }
.ep:hover .ep-f { transform: translateX(8px); }
html.ed-actif .ep-a::after { content: none; }

@media (max-width: 899px) {
  .ep-texte { grid-column: 1 / -1; font-size: 1.1875rem; }
  #pg-carte:empty::before { content: ""; display: block; aspect-ratio: 800 / 780; }   /* la carte de tous les lieux vient après : sa place est gardée */
  .u-onglets a::after { right: 8px; }
  .u-onglets li + li a::after { left: 10px; }
  .ep-portes { grid-template-columns: minmax(0, 1fr); }
  .ep { min-height: 0; }
  /* les deux pages de l'espace pro : le titre à la taille des cartes du téléphone, la flèche toujours dans sa carte */
  .ep-pages .choix-t { font-size: 1.375rem; }
  .ag-toutes { contain-intrinsic-size: auto 7000px; }
  .troupe-m03 { contain-intrinsic-size: auto 4000px; }
  .choix-t > span { min-width: 0; }
  .choix-t b { overflow-wrap: break-word; hyphens: auto; }
  /* les saisons : les prochaines dates, la carte de la saison, puis toutes les dates, l'une sous l'autre */
  .ag-complet .ag-liste, .ag-complet .ag-toutes, .ag-complet .ag-carte { grid-column: 1 / -1; grid-row: auto; }
  .ag-complet .s0-h { font-size: 1.75rem; }
  .ag-toutes .row { grid-template-columns: 88px minmax(0, 1fr); }
  .ag-toutes .j-big { font-size: 1.75rem; }
  /* le bilan : la carte d'abord, puis les dates */
  .bilan-dates, .bilan-carte { grid-column: 1 / -1; position: static; }
  .bilan-carte { order: -1; }
  .bilan-n b { font-size: 2.75rem; }
  .bilan-n span { font-size: .6875rem; letter-spacing: .1em; }
  .co-frise .frise-mois-nom { font-size: 1rem; }
}
@media (max-width: 560px) {
  /* les deux pages de l'espace pro, à 360 px : l'image plus étroite, pour que « Établissement » tienne sur sa ligne */
  .choix a { grid-template-columns: 31% minmax(0, 1fr); }
  .choix-t { gap: 10px; padding: 14px 12px 14px 14px; }
  .ep-pages .choix-t { font-size: 1.25rem; }
}
/* ——— la compagnie : la présentation, la troupe, puis les repères (la table des années, sur quatre colonnes, et la frise) ——— */
.co-reperes { margin-top: 88px; }
.co-reperes .co-dates { grid-column: 1 / -1; }
.co-reperes .annees { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--gap); }

/* ——— la troupe (règle 20, TROUPE) : l'ours de la revue, posé sur la grille ———
   La pieuvre de la compagnie à la racine ; de là, le filet court sur toute la largeur et tombe sur les colonnes des
   métiers (un organigramme, qui fait quoi d'un coup d'œil) ; le jeu, sous elle, en planche contact (les visages publiés,
   bord à bord, en gris, qui prennent leur couleur quand on les allume), puis les noms seuls. Une personne : sa vignette
   seulement si sa photo est publiée, sinon le nom seul, à côté d'un carré d'encre (les points de l'agenda). Survolée ou
   choisie, toutes ses places s'allument et des filets de la couleur de la saison les relient ; les autres s'estompent. Au défilement, le
   filet se trace, les colonnes tombent, les noms se posent dans la grille (animations liées au défilement). */
.troupe-m03 { margin-top: 88px; }
.tr3 { --tr3-trait: var(--ink); --troupe-lien: var(--acc); --troupe-ic-fond: var(--paper); --troupe-ventouse-fond: var(--paper);
  position: relative; isolation: isolate; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; padding-top: 26px; view-timeline: --tr3 block; }
.tr3-racine { grid-column: 1 / -1; display: flex; align-items: center; height: 52px; }
.tr3-logo { flex: none; width: 52px; height: 52px; margin-right: 16px; }
.tr3-logo svg { display: block; width: 100%; height: 100%; }
.tr3-tronc { flex: 1; height: 2px; background: var(--tr3-trait); transform-origin: 0 50%; }
.tr3-jeu { grid-column: 1 / 7; }
.tr3-autres { grid-column: 7 / 13; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap); }
.tr3-cat { position: relative; z-index: 2; min-width: 0; padding: 22px 0 44px; view-timeline: --tr3-cat block; }
/* les colonnes des métiers tombent du filet : leur trait à gauche, depuis le filet jusqu'au bas de la colonne */
.tr3-autres .tr3-cat { padding-left: 18px; }
.tr3-autres .tr3-cat::before { content: ""; position: absolute; left: 0; top: -26px; bottom: 0; width: 1px; background: var(--tr3-trait); transform-origin: 50% 0; }
.tr3-t { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; padding-bottom: 12px; border-bottom: 3px double var(--ink); font: 500 1.375rem/1.15 var(--sg); letter-spacing: -.02em; text-wrap: balance; }
.tr3-ic { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); transition: background-color .15s, color .15s; }
.tr3-ic .troupe-icone { width: 28px; height: 28px; }
.tr3-cat:is(:hover, .est-allume) .tr3-ic { background: var(--ink); color: var(--paper); --troupe-ic-fond: var(--ink); }
.tr3-places { list-style: none; margin: 0; padding: 0; }
.tr3-li { position: relative; }
.tr3-place { position: relative; display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 44px; margin: 0; padding: 10px 8px 11px 0; border: 0; border-bottom: 1px solid var(--rule);
  background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.tr3-pt { flex: none; width: 10px; height: 10px; margin-top: .42em; background: var(--ink); transition: background-color .15s, transform .15s; }
.tr3-v { flex: none; display: block; width: 44px; height: 44px; overflow: hidden; background: var(--paper-2); }
.tr3-v img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) contrast(1.04); transition: filter .2s; }
.tr3-qui { display: grid; gap: 2px; min-width: 0; }
.tr3-nom { font: 500 1.125rem/1.2 var(--sg); letter-spacing: -.015em; overflow-wrap: anywhere; transition: color .15s; }
.tr3-m { font-size: .875rem; line-height: 1.35; color: var(--ink-2); }
.tr3-m > span + span::before { content: " · "; }
/* la planche contact : les visages bord à bord, quatre par rang, le nom dessous */
.tr3-planche { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 12px; margin-bottom: 8px; }
.tr3-planche .tr3-place { flex-direction: column; gap: 8px; padding: 0 0 8px; }
.tr3-planche .tr3-v { width: 100%; height: auto; aspect-ratio: 1; }
.tr3-planche .tr3-nom span { display: block; }
.tr3-noms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--gap); }
/* allumée : la personne et toutes ses places, les autres s'estompent ; choisie, un filet de la couleur de la saison la souligne */
.tr3-place:is(:hover, .est-allume) .tr3-nom { color: var(--acc); }
.tr3-place:is(:hover, .est-allume) .tr3-pt { background: var(--acc); transform: rotate(45deg); }
.tr3-place:is(:hover, .est-allume, [aria-pressed="true"]) .tr3-v img { filter: none; }
.tr3-place[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--acc); }
.tr3-place:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.tr3.est-allume .tr3-place:not(.est-allume), .tr3.est-groupe .tr3-place:not(.est-allume) { opacity: .35; }
.tr3 .troupe-lien { stroke-width: 1.6; }
.tr3 .troupe-lueur { border-radius: 0; width: 8px; height: 8px; }
@keyframes tr3-trace { from { transform: scaleX(0); } }
@keyframes tr3-tombe { from { transform: scaleY(0); } }
@keyframes tr3-pose { from { opacity: 0; transform: translateX(-12px); } }
@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    html:not(.m3-fixe):not(.ed-actif) .tr3-tronc { animation: tr3-trace linear both; animation-timeline: --tr3; animation-range: entry 10% entry 80%; }
    html:not(.m3-fixe):not(.ed-actif) .tr3-autres .tr3-cat::before { animation: tr3-tombe linear both; animation-timeline: --tr3-cat; animation-range: entry 0% entry 100%; }
    html:not(.m3-fixe):not(.ed-actif) .tr3-li { animation: tr3-pose linear both; animation-timeline: view(); animation-range: entry 10% entry 90%; }
  }
}

/* ———— réserver une date, d'un geste (règle 17, RESERVER) : la grille de la saison ————
   Sur la page d'un spectacle, la bande de ses prochaines dates, une colonne par date comme dans un calendrier de saison
   (le jour de la semaine en capitales, le quantième en grand, le mois, les heures en chiffres de même largeur sous un filet,
   la commune) ; la date choisie s'imprime dans la couleur du spectacle. Sa carte dessous : la fiche de la date dans
   l'univers du spectacle, sa photo en fond discret, les heures en grand, et « Réserver » en aplat sur toute la largeur, le
   geste évident. Sur l'accueil et « Je viens voir un spectacle », la date de chaque ligne est un bouton qui ouvre la carte
   sous elle. */
.rs-zone { margin-top: 26px; }
.rs-k-bande { margin: 0 0 10px; font: 700 .8125rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.rs-bande { gap: 0; padding: 0 0 12px; border-top: 2px solid var(--u-texte); scroll-padding-inline: 0; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--u-texte) 35%, transparent) transparent; }
.rs-date { position: relative; width: 172px; min-height: 148px; padding: 14px 16px 16px; border: 0; border-right: 1px solid color-mix(in srgb, var(--u-texte) 24%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 24%, transparent);
  background: none; color: var(--u-texte); text-align: left; }
.rs-date:first-child { border-left: 1px solid color-mix(in srgb, var(--u-texte) 24%, transparent); }
.rs-date:hover, .rs-date.dt.on { background: color-mix(in srgb, var(--u-texte) 7%, transparent); }
.rs-date:focus-visible { outline: 3px solid var(--u-vif); outline-offset: -3px; }
.rs-date.dt::before { content: none; }
.rs-q { display: block; }
.rs-s { display: block; min-height: 1.3em; font: 700 .75rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.rs-n { display: block; margin-top: 6px; font: 500 2.75rem/.86 var(--sg); letter-spacing: -.045em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rs-m { display: block; margin-top: 6px; font: 500 1.125rem/1.1 var(--sg); letter-spacing: -.015em; }
.rs-h { display: block; margin-top: 12px; padding-top: 8px; border-top: 1px solid currentColor; font: 600 1.0625rem/1.25 var(--sg); font-variant-numeric: tabular-nums; }
.rs-h--sans { font: 400 .875rem/1.3 var(--at); }
.rs-o { display: block; margin-top: 3px; overflow: hidden; font-size: .875rem; line-height: 1.3; color: var(--u-texte2); white-space: nowrap; text-overflow: ellipsis; }
.rs-date[aria-pressed="true"] { background: var(--u-titre); color: var(--u-sur); }
.rs-date[aria-pressed="true"] :is(.rs-s, .rs-o) { color: inherit; }
.rs-date[aria-pressed="true"]::after { content: ""; position: absolute; left: 22px; bottom: -7px; width: 13px; height: 13px; background: var(--u-titre); transform: rotate(45deg); }
.rs-corps { margin-top: 14px; align-items: start; row-gap: 26px; }
.rs-corps > .rs-carte { grid-column: 1 / 8; }
.rs-corps > .t-carte { grid-column: 8 / 13; position: sticky; top: calc(var(--head) + 16px); }
/* la carte d'une date : la fiche, dans l'univers de son spectacle (--rs-bg : son fond, que le voile de la grille reprend) */
.rs-carte { --rs-bg: var(--u-fond2); position: relative; isolation: isolate; overflow: hidden; min-height: 300px; background: var(--rs-bg); color: var(--u-texte); border-top: 6px solid var(--u-titre); }
.rs-photo { inset: 0 0 0 auto; width: 46%; height: 100%; opacity: .34; -webkit-mask-image: linear-gradient(90deg, transparent, #000 62%); mask-image: linear-gradient(90deg, transparent, #000 62%); }
.rs-c { position: relative; display: flex; flex-direction: column; align-items: stretch; max-width: 36rem; padding: 22px 24px 24px; }
.rs-sp { margin: 0; font: var(--u-gr) clamp(1.75rem, 2.6vw, 2.5rem)/1 var(--u-police); letter-spacing: 0; color: var(--u-titre); overflow-wrap: break-word; }
.rs-sp a { color: inherit; text-decoration: none; }
.rs-sp a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .12em; }
.rs-sp::after { content: ""; display: block; height: 1px; margin: 16px 0 12px; background: color-mix(in srgb, var(--u-texte) 45%, transparent); transform-origin: 0 50%; }
.rs-quand { margin: 0; font: 500 1.5rem/1.15 var(--sg); letter-spacing: -.02em; }
.rs-etat { margin-left: 8px; font: normal 700 .75rem var(--at); letter-spacing: .12em; text-transform: uppercase; color: var(--u-vif); }
.rs-ou { margin: 4px 0 0; font-size: 1rem; line-height: 1.45; color: var(--u-texte2); }
.rs-lieu { color: var(--u-texte); font-weight: 600; }
.rs-lieu::after { content: " ·"; color: var(--u-texte2); font-weight: 400; }
.rs-det { margin: 8px 0 0; padding: 0; list-style: none; font-size: .9375rem; line-height: 1.45; color: var(--u-texte2); }
.rs-seances { margin: 20px 0 0; }
.rs-k { margin: 0 0 8px; font: 700 .75rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.rs-seances--sans { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rs-seances--sans .rs-k { margin: 0; }
.rs-sans { font: 600 1rem var(--at); }
.rs-liste { gap: 0; border-top: 1px solid color-mix(in srgb, var(--u-texte) 30%, transparent); }
.rs-liste > li { flex: 1 1 auto; }
.rs-seance { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-height: 52px; padding: 10px 14px 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--u-texte) 30%, transparent); color: var(--u-texte); text-decoration: none; }
a.rs-seance:hover .rs-sh { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .12em; }
a.rs-seance:focus-visible { outline: 3px solid var(--u-vif); outline-offset: 2px; }
.rs-sh { font: 500 1.875rem/1 var(--sg); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.rs-sh--sans { font: 600 1rem/1.2 var(--at); letter-spacing: 0; }
.rs-sj { font: 600 .875rem var(--at); color: var(--u-texte2); }
.rs-seance.est-scolaire { color: var(--u-texte2); }
.rs-scol { padding: 1px 8px 2px; border: 1px solid currentColor; border-radius: 999px; font: normal 700 .6875rem/1.4 var(--at); letter-spacing: .08em; text-transform: uppercase; }
.rs-action { margin: 24px 0 0; }
/* (.u .rs-reserver : dans l'article d'un spectacle, la règle « .u a { color: inherit } » ne doit pas l'emporter) */
.rs-reserver, .u .rs-reserver { display: flex; justify-content: space-between; gap: 18px; min-height: 68px; padding: 14px 18px 14px 22px; background: var(--u-titre); color: var(--u-sur); }
.rs-r1 { font: 500 1.875rem/1 var(--sg); letter-spacing: -.035em; }
.rs-r2 { margin-top: 6px; font: 600 .875rem/1.3 var(--at); }
.rs-reserver .rs-sep { opacity: .7; }
.rs-reserver .rs-fleche { width: 30px; height: 30px; stroke-width: 1.8; transition: transform .2s var(--c3); }
.rs-reserver:hover .rs-r1 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .14em; }
.rs-reserver:hover .rs-fleche { transform: translate(3px, -3px); }
.rs-reserver:focus-visible { outline: 3px solid var(--u-vif); outline-offset: 3px; }
.rs-aupres { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--u-texte) 30%, transparent); font-size: 1rem; line-height: 1.4; color: var(--u-texte2); }
.rs-aupres b { color: var(--u-texte); font-weight: 600; }
/* le voile de la grille (l'effet) : le fond de la carte, aux filets de ses douze colonnes, qui se retire colonne après colonne
   (douze marches) ; le filet se trace sous le titre, les séances et « Réserver » se posent l'une après l'autre ; une carte
   qui s'ouvre sous sa ligne descend d'abord d'un rien (effetReserver pose .rs-compose et, à l'ouverture, .rs-ouvre) */
.rs-voile { position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--u-texte) 22%, transparent) 0 1px, transparent 1px calc(100% / 12)), var(--rs-bg); }
.rs-carte { --rs-pas: 22ms; --rs-d: 0ms; }
.rs-carte.rs-ouvre { --rs-d: 80ms; }
.rs-compose .rs-voile { animation: rs3-voile calc(12 * var(--rs-pas)) steps(12, end) var(--rs-d) both; }
.rs-compose .rs-sp::after { animation: rs3-filet .42s cubic-bezier(.65, 0, .35, 1) calc(var(--rs-d) + 6 * var(--rs-pas)) backwards; }
.rs-compose :is(.rs-liste > li, .rs-action) { --rs-i: 0; animation: rs3-pose .3s cubic-bezier(.2, 0, 0, 1) backwards;
  animation-delay: calc(var(--rs-d) + 7.2 * var(--rs-pas) + var(--rs-i) * 40ms); }
.rs-compose .rs-liste > li:nth-child(2) { --rs-i: 1; }
.rs-compose .rs-liste > li:nth-child(3) { --rs-i: 2; }
.rs-compose .rs-liste > li:nth-child(4) { --rs-i: 3; }
.rs-compose .rs-liste > li:nth-child(5) { --rs-i: 4; }
.rs-compose .rs-liste > li:nth-child(6) { --rs-i: 5; }
.rs-compose .rs-liste > li:nth-child(n+7) { --rs-i: 6; }
.rs-compose .rs-c .rs-action { --rs-i: var(--rs-n, 1); }
.rs-compose.rs-ouvre { animation: rs3-ouvre .22s cubic-bezier(.2, 0, 0, 1); }
@keyframes rs3-voile { from { transform: translateX(0); } to { transform: translateX(100%); } }
@keyframes rs3-filet { from { transform: scaleX(0); } }
@keyframes rs3-pose { from { opacity: 0; transform: translateX(-12px); } }
@keyframes rs3-ouvre { from { opacity: 0; transform: translateY(-10px); } }
@media (max-width: 899px) { .rs-carte { --rs-pas: 16ms; } }
/* l'agenda (accueil, « Je viens voir un spectacle ») : la date de la ligne, un bouton sur le papier, qui s'imprime dans la
   couleur du spectacle quand sa carte est ouverte ; la commune est déjà écrite dans la ligne (le bouton la garde pour les
   lecteurs d'écran) */
.rs-date--ligne { align-self: start; width: 100%; min-height: 0; padding: 8px 10px 10px; border: 1px solid var(--rule-2); background: var(--field); color: var(--ink); }
.rs-date--ligne:first-child { border-left: 1px solid var(--rule-2); }
.rs-date--ligne:hover { border-color: var(--ink); background: var(--field); }
.rs-date--ligne:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.rs-date--ligne .rs-s { color: var(--ink-2); }
.rs-date--ligne .rs-n { margin-top: 4px; font-size: 2.25rem; white-space: normal; }
.rs-date--ligne .rs-m { font-size: 1rem; }
.rs-date--ligne .rs-h { margin-top: 8px; padding-top: 6px; border-top-color: var(--rule-2); font-size: .9375rem; }
.rs-date--ligne .rs-h--sans { color: var(--ink-2); font-size: .8125rem; }
.rs-date--ligne .rs-o { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.rs-date--ligne::after { content: ""; position: absolute; right: 9px; top: 11px; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); transition: transform .2s var(--c3); }
.rs-date--ligne[aria-pressed="true"] { border-color: var(--u-titre); background: var(--u-titre); color: var(--u-sur); }
.rs-date--ligne[aria-pressed="true"] :is(.rs-s, .rs-h--sans) { color: inherit; }
.rs-date--ligne[aria-pressed="true"] .rs-h { border-top-color: currentColor; }
.rs-date--ligne[aria-pressed="true"]::after { left: auto; bottom: auto; width: 7px; height: 7px; background: none; transform: rotate(225deg); top: 14px; opacity: .9; }
.row.rs-li:has(.rs-date[aria-pressed="true"]) { background: color-mix(in srgb, var(--c, var(--ink)) 7%, transparent); }
.rs-ici { --rs-bg: var(--u-fond); grid-column: 1 / -1; min-height: 0; margin-top: 16px; transform-origin: 50% 0; }
.rs-ici .rs-c { max-width: 34rem; }
.ag-accueil .rs-ici .rs-c { padding: 18px 18px 20px; }
.ag-accueil .rs-date--ligne .rs-n { font-size: 1.875rem; }
.carte-lieu.est-choisi .pt-in { transform: scale(1.7); }
.carte-lieu.est-choisi .aura { stroke: var(--acc); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }

/* ———— les vidéos, lues dans la page (règle 18, LECTEUR) : l'affiche du spectacle, posée dans la grille ————
   Le cadre noir de la projection, l'affiche (une photo du spectacle) un peu éteinte, la lecture dans une case pleine de la
   couleur du spectacle, le titre en grotesque ; « plein écran » et « assombrir » dessous, en boutons à filet. */
.u-video { margin-top: 24px; }
.lc-cadre { background: var(--video); }
.lc-affiche { filter: saturate(.92) brightness(.68); transition: transform .6s, filter .3s; }
.lc-lire::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, var(--video-ombre)); pointer-events: none; }
.lc-lire:hover .lc-affiche { transform: scale(1.03); filter: saturate(.95) brightness(.58); }
.lc-lire:focus-visible { outline: 3px solid var(--u-vif, var(--acc)); outline-offset: -3px; }
.lc-icone { z-index: 1; width: 84px; height: 84px; border-radius: 0; background: var(--u-titre, var(--acc)); color: var(--u-sur, var(--paper-blanc)); transition: transform .2s var(--c3); }
.lc-lire:hover .lc-icone { transform: translate(-50%, -50%) scale(1.06); }
.lc-titre { z-index: 1; left: 22px; right: 22px; bottom: 18px; font: 500 clamp(1.25rem, 2.2vw, 1.875rem)/1.12 var(--sg); letter-spacing: -.02em; color: var(--video-encre); }
.lc-outils { gap: 10px; margin-top: 12px; }
.lc-b { min-height: 44px; padding: 0 16px 0 13px; border: 1px solid color-mix(in srgb, var(--u-texte, var(--ink)) 45%, transparent); border-radius: 0; background: none; color: var(--u-texte, var(--ink)); font: 600 .9375rem/1.2 var(--at); }
.lc-b:hover { border-color: var(--u-texte, var(--ink)); }
.lc-b:focus-visible { outline: 3px solid var(--u-vif, var(--acc)); outline-offset: 2px; }
.lc.lc-eteint .lc-nuit-b { border-color: var(--u-titre); background: var(--u-titre); color: var(--u-sur); }
.lc.lc-eteint .lc-cadre { box-shadow: 0 0 0 2px var(--u-titre, var(--acc)); }
.lc.lc-joue .lc-affiche { opacity: 0; }
.lc-nuit { background: var(--video-voile); }
.lc-voile { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(90deg, var(--video-filet) 0 1px, transparent 1px calc(100% / 12)), var(--video); }
.lc-groupe { margin-top: 40px; }
.lc-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 24px var(--gap); margin-top: 14px; }
.lc-grille .lc-icone { width: 54px; height: 54px; }
.lc-grille .lc-titre { left: 14px; right: 14px; bottom: 12px; font-size: 1.0625rem; }
.lc-grille .lc-outils { gap: 6px; margin-top: 8px; }
.lc-grille .lc-b { padding: 0 11px; }
.lc-grille .lc-b span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.lc-boite::backdrop { background: var(--video-voile); }
.lc-boite .lc-b { border-color: var(--video-filet-fort); color: var(--video-encre); }
.lc-boite .lc-b:hover { border-color: var(--video-encre); }

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* ---------- Mouvement (règle 15) : la grille suisse ----------
     Tout tombe dans la grille, rien ne flotte.
     1. Changer de page : la page nouvelle se découvre colonne après colonne, aux bords mêmes des douze colonnes de la mise en
        page (une découpe en marches, 22 ms par colonne), pendant que la grille paraît en filigrane et s'efface. Le geste
        répond à l'image même (le filet de l'élément du menu se trace) ; la page se compose à l'image d'après.
     2. Les filets se tracent de gauche à droite : celui de l'élément choisi du menu (à la couleur du thème, règle 22) et celui
        de l'onglet d'un spectacle, ceux des rubriques et des mois quand ils arrivent dans l'écran (MOUVEMENT.reveler).
     3. Les nombres comptent : les dates de chaque spectacle dans la légende de la frise, les représentations, les saisons
        passées, les chiffres du bilan d'un spectacle.
     4. Filtrer, chercher : les lignes glissent à leur place (MOUVEMENT.flip), les repères de la frise aussi ; les autres
        spectacles s'estompent sur la frise.
     5. Pression : la pièce descend d'un pixel, dès le pointerdown (.mv-presse).
     6. Les frises (FRISE) : des repères carrés sur un filet d'un pixel ; elles se découvrent en douze marches, comme la
        page. La frise de la saison est le cœur (règle 21) : une seule ligne du temps, chaque date une barre à la couleur de son
        spectacle, posée en couloirs, les mois en colonnes, « aujourd'hui » d'un trait de la couleur du thème ; choisir une
        date l'ouvre dans la liste (et la date choisie dans la liste se cerne sur la frise) ; sa légende isole un spectacle.
     7. La carte : un trait vertical balaie la France d'ouest en est et découvre les bras ; les pastilles se posent quand il
        passe. Une carte de beaucoup de communes paraît d'un fondu.
     La pieuvre ne bouge pas : aucune tentacule (TENTACULES réglé sans clic ni pages, aucun moment joué) ; un dossier composé
     trace son filet jusqu'au bout. Moins d'animations demandé (ou ?anim=0) : tout est en place, rien ne bouge. */
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  // réserver une date (RESERVER, règle 17), les vidéos dans la page (LECTEUR, règle 18), la troupe (TROUPE, règle 20)
  const RS = typeof RESERVER !== 'undefined' ? RESERVER : null, LC = typeof LECTEUR !== 'undefined' ? LECTEUR : null, TR = typeof TROUPE !== 'undefined' ? TROUPE : null;
  const COUPE = (() => { try { return new URLSearchParams(location.search).get('anim') === '0'; } catch (e) { return false; } })();
  const reduit = matchMedia('(prefers-reduced-motion: reduce)');
  const bouge = () => !reduit.matches && (!MV || MV.permis());
  // (moins d'animations, ou ?anim=0 : les animations liées au défilement de la troupe s'arrêtent aussi, html.m3-fixe)
  const fixeHtml = () => document.documentElement.classList.toggle('m3-fixe', !bouge());
  fixeHtml(); if (reduit.addEventListener) reduit.addEventListener('change', fixeHtml);
  // la largeur de la fenêtre, lue une fois puis à chaque redimensionnement (innerWidth force une mise en page quand la page vient
  // de changer : jamais pendant un rendu) ; la grille de douze colonnes qu'on en déduit
  let LF = innerWidth;
  addEventListener('resize', () => { LF = innerWidth; }, { passive: true });
  const grilleGeo = () => { const gut = Math.min(48, Math.max(16, LF * .04)), gap = LF < 900 ? 16 : 24, W = Math.min(LF - 2 * gut, 1320); return { gut, gap, W, m: (LF - W) / 2, cw: (W - 11 * gap) / 12 }; };
  const largeurCols = n => { const g = grilleGeo(); return n * g.cw + (n - 1) * g.gap; };
  /* ---------- Les données : relues à chaque rendu, car la base de la compagnie peut remplacer D en place ---------- */
  const site = () => D.site || {};
  const LIB = () => site().libelles || {};
  const shows = () => D.shows || [];
  const showDe = slug => shows().find(s => s.slug === slug) || null;
  // règle 21 : un spectacle en tournée (ou en création : Cassandres) a ses trois onglets ; les autres, une seule page
  const aOnglets = s => !!(s && (s.enTournee || s.statut));
  // un spectacle sans action culturelle (Cassandres, pour l'instant) n'a pas d'onglet établissement (règle 14)
  const entreeSp = (slug, entree) => entree === 'etablissement' && !(showDe(slug) || {}).actionCulturelle ? 'voir' : entree;
  // l'adresse d'un spectacle : l'onglet demandé s'il a des onglets, sa seule page sinon (jamais un lien vers un onglet qui n'existe pas)
  const lienSp = (s, entree = 'voir') => { const x = typeof s === 'string' ? showDe(s) : s;
    return !x ? '#/' : aOnglets(x) ? `#/spectacle/${x.slug}/${entreeSp(x.slug, entree)}` : `#/spectacle/${x.slug}`; };
  // les trois entrées (D.site.entrees) : les onglets d'un spectacle en tournée ; programmer et établissement sont aussi les deux
  // pages de l'espace pro (règle 21)
  const ENTREES = ['voir', 'programmer', 'etablissement'];
  const entrees = () => (site().entrees || []).filter(e => ENTREES.includes(e.cle));
  const entreeDe = cle => entrees().find(e => e.cle === cle) || null;
  // le menu (règle 21) : les saisons, les spectacles, la compagnie, l'espace pro (D.site.menu, par sa clé ou son id)
  const menu = () => site().menu || [];
  const menuDe = cle => menu().find(m => m.cle === cle || m.id === cle) || null;
  const saisonsSite = () => site().saisons || [];
  const photo = (...cles) => { for (const k of cles) if (k && D.photos && D.photos[k]) return D.photos[k]; return null; };
  const own = (o, k) => o != null && k != null && Object.prototype.hasOwnProperty.call(o, k);
  const ecrire = () => ({ texte: LIB().ecrire || (site().ecrire || {}).texte, href: (site().ecrire || {}).href || '#/contact' });

  /* ---------- L'édition sur place (EDITION) : chaque texte venu de D porte son chemin dans D ---------- */
  const ed = chemin => chemin ? ` data-edit="${esc(chemin)}"` : '';
  const edS = (s, ...k) => ed(['shows', s.slug, ...k].join('.'));
  const edP = chemin => ` data-edit-photo="${esc(chemin)}"`;
  const dateId = d => ` data-date-id="${esc(d && d.id != null ? d.id : '')}"`;

  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const RXM = new RegExp(`^(.*?)\\s*(${MOIS.join('|')})\\s+(\\d{4})$`);
  const GRIS = 'var(--sp-aucun)';   // un spectacle hors du répertoire : un gris chaud, de jour comme de nuit
  const ico = (d, w = 18) => `<svg viewBox="0 0 20 20" width="${w}" height="${w}" aria-hidden="true" focusable="false">${d}</svg>`;
  const ARROW = ico('<path d="M3 10h13.5M11.5 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>');
  const EXT = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M5.5 3.5h7v7M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const LOUPE = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const CROIX = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const LIRE = '<svg viewBox="0 0 44 44" aria-hidden="true" focusable="false"><circle cx="22" cy="22" r="20.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M18 14.5v15l12-7.5z" fill="currentColor"/></svg>';
  const LIRE_P = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 6.6v6.8l5.4-3.4z" fill="currentColor"/></svg>';
  const CHEVRON = ico('<path d="m5 8 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>', 16);
  const ALERTE = ico('<path d="M10 2.5 18.5 17h-17z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 8v4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1.05" fill="currentColor"/>', 22);
  const NON = ico('<circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m6.6 6.6 6.8 6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>', 20);
  const PLUME = ico('<path d="M4 16l1-4L13.5 3.5a1.8 1.8 0 0 1 2.5 0l.5.5a1.8 1.8 0 0 1 0 2.5L8 15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11.5 5.5l3 3" stroke="currentColor" stroke-width="1.6"/>', 15);

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’'`\-–—.,;:()«»"]/g, ' ').replace(/\s+/g, ' ').trim();
  // un bloc de texte de D, tel quel : un paragraphe, ou un bloc qui porte déjà sa balise (titre, liste)
  const BLOC = /^\s*<(h\d|ul|ol|p|table|div|blockquote)\b/i;
  const bloc = (b, chemin) => BLOC.test(b) ? `<div class="bl"${ed(chemin)}>${b}</div>` : `<p${ed(chemin)}>${b}</p>`;
  const main = document.getElementById('main');

  /* ---------- Les couleurs : celles des spectacles sur le papier, et l'univers de chacun ---------- */
  const hex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v.trim()) ? v.trim() : null;
  const rgba = v => typeof v === 'string' && /^rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(,\s*[\d.]+\s*)?\)$/i.test(v.trim()) ? v.trim() : null;
  const lum = h => { const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; return 0.2126 * f(parseInt(h.slice(1, 3), 16)) + 0.7152 * f(parseInt(h.slice(3, 5), 16)) + 0.0722 * f(parseInt(h.slice(5, 7), 16)); };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  // la couleur d'un spectacle sur le papier (un point, une barre de la frise, un bras de carte : des marques, jamais du texte) :
  // var(--sp-<slug>), qui change avec le thème (couleurs()) ; sa couleur (règle 22 : celle que la compagnie lui donne, lue
  // dans D), assombrie le jour ou éclaircie la nuit juste assez pour se voir sur le papier (3:1)
  const slugSur = slug => typeof slug === 'string' && /^[a-z0-9-]+$/.test(slug);
  const colPapier = slug => { const s = showDe(slug); return s && slugSur(s.slug) && (hex(s.couleur) || hex(s.couleurTexteClair)) ? `var(--sp-${s.slug})` : GRIS; };
  const PAPIER = '#f4f1ea', NUIT = '#131211';   // les papiers du jour et de la nuit (--paper)
  const melange = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0')).join('');
  const eclaircir = (h, fond, cible) => { let c = h; for (let k = 0; k < 40 && contraste(c, fond) < cible; k++) c = melange(c, '#ffffff', .08); return c; };
  const assombrir = (h, fond, cible) => { let c = h; for (let k = 0; k < 40 && contraste(c, fond) < cible; k++) c = melange(c, '#000000', .08); return c; };
  // la couleur de la saison (règle 22, D.site.couleurSaison : le bleu, jusqu'à la création de Cassandres) : l'accent de
  // l'interface. « couleur » sur le papier du jour, « vive » sur celui de la nuit (et sur le pied, toujours sombre), chacune
  // gardée lisible (4,5:1) sur son papier ; sans elle, l'accent d'avant reste (les valeurs de :root)
  function couleurSaison() {
    const c = site().couleurSaison || {}, j = hex(c.couleur) || hex(c.vive), v = hex(c.vive) || j;
    return j ? { jour: assombrir(j, PAPIER, 4.5), nuit: eclaircir(v, NUIT, 4.5) } : null;
  }
  const feuilleCouleurs = document.head.appendChild(document.createElement('style'));
  function couleurs() {
    const jour = [], nuit = [];
    shows().forEach(s => { if (!slugSur(s.slug)) return; const c = hex(s.couleur) || hex(s.couleurTexteClair);
      if (c) { jour.push(`--sp-${s.slug}:${assombrir(c, PAPIER, 3)}`); nuit.push(`--sp-${s.slug}:${eclaircir(c, NUIT, 3)}`); } });
    const sa = couleurSaison();
    if (sa) { jour.push(`--acc:${sa.jour}`, `--acc-sur:${surDe(sa.jour, PAPIER)}`, `--acc-vive:${sa.nuit}`); nuit.push(`--acc:${sa.nuit}`, `--acc-sur:${surDe(sa.nuit, NUIT)}`); }
    const css = `:root{${jour.join(';')}}html[data-theme="nuit"]{${nuit.join(';')}}`;
    if (feuilleCouleurs.textContent !== css) feuilleCouleurs.textContent = css;
  }
  // l'univers d'un spectacle, avec des contrastes AA garantis : texte sur fond, titre (grand) et accent vif sur fond ;
  // un univers clair invente aussi sa nuit (règle 19), dans ses propres couleurs de D : son texte, assombri dans le papier
  // de nuit, devient son fond ; son fond devient son texte ; le titre et la couleur vive, les premières qui restent AA
  // le texte posé sur la couleur de titre (un bouton, la date choisie) : le blanc, le fond ou l'encre, le mieux lu ; s'il
  // reste sous 4,5:1 (une couleur de titre moyenne), le blanc ou le noir pur, dont l'un passe toujours
  const surDe = (t, f) => { const m = ['#ffffff', f, '#141414'].sort((a, b) => contraste(b, t) - contraste(a, t))[0];
    return contraste(m, t) >= 4.5 ? m : contraste('#ffffff', t) >= contraste('#000000', t) ? '#ffffff' : '#000000'; };
  function univers(s) {
    const u = s.univers || {}, c = Object.assign({}, s.palette || {}, u.couleurs || {});
    const fond = hex(c.fond) || (s.clair ? '#f4f1ea' : '#141414');
    const clair = lum(fond) > .4;
    const texte = [hex(c.texte)].find(x => x && contraste(x, fond) >= 7) || (clair ? '#141414' : '#f4f1ea');
    const ok = min => x => x && contraste(x, fond) >= min;
    const fond2 = [hex(c.fond2)].find(x => x && contraste(texte, x) >= 4.5) || fond;
    const texte2 = [hex(c.texte2)].find(x => x && contraste(x, fond) >= 4.5 && contraste(x, fond2) >= 4.5) || texte;
    const titre = [c.accent, c.scene, c.accent2].map(hex).find(ok(3)) || texte;
    const vif = [c.accent, c.accent2, c.scene].map(hex).find(ok(4.5)) || texte;
    const sur = surDe(titre, fond);
    const p = u.polices || {};
    const police = String(p.titre || '').replace(/[^\p{L}\p{N} -]/gu, '').trim();
    const graisse = /^[1-9]00$/.test(String(p.titreGraisse)) ? +p.titreGraisse : 400;
    const motif = String(u.motif || s.motif || '').replace(/[^a-z]/g, '');
    let nuit = null;
    if (clair) {
      const nf = melange(texte, NUIT, .55), nf2 = melange(texte, NUIT, .35);
      const okN = min => x => x && contraste(x, nf) >= min && contraste(x, nf2) >= min;
      const nt = [fond].find(okN(7)) || '#f1ede5', nt2 = [melange(fond, hex(c.texte2) || texte, .25)].find(okN(4.5)) || nt;
      const vifs = [c.accent, c.scene, c.accent2].map(hex);
      const nTitre = vifs.find(okN(4.5)) || vifs.find(x => x && contraste(x, nf) >= 3) || nt;
      const nVif = [c.accent, c.accent2, c.scene].map(hex).find(okN(4.5)) || nt2;
      nuit = { fond: nf, fond2: nf2, texte: nt, texte2: nt2, titre: nTitre, vif: nVif, sur: surDe(nTitre, nf) };
    }
    return { fond, fond2, texte, texte2, titre, vif, sur, clair, nuit, lueur: rgba(c.lueur) || hex(c.lueur) || 'transparent', police, graisse, motif };
  }
  const famille = police => police ? `'${police}', ${/grotesk|ubuntu|anton|sans|inter|mono/i.test(police) ? 'sans-serif' : 'serif'}` : 'var(--sg)';
  const uStyle = s => { const u = univers(s), n = u.nuit;
    return `--u-fond:${u.fond};--u-fond2:${u.fond2};--u-texte:${u.texte};--u-texte2:${u.texte2};--u-titre:${u.titre};--u-vif:${u.vif};--u-sur:${u.sur};--u-lueur:${u.lueur};--u-police:${famille(u.police)};--u-gr:${u.graisse}`
      + (n ? `;--un-fond:${n.fond};--un-fond2:${n.fond2};--un-texte:${n.texte};--un-texte2:${n.texte2};--un-titre:${n.titre};--un-vif:${n.vif};--un-sur:${n.sur}` : ''); };
  // la classe d'un univers : u-clair (qui a sa nuit, --un-*) ou u-sombre
  const uClasse = s => `u-${univers(s).clair ? 'clair' : 'sombre'}`;
  const eStyle = e => `--e:${hex(e.couleur) || GRIS};--ev:${hex(e.couleurVive) || hex(e.couleur) || GRIS}`;

  // la police de titre d'un univers nouveau (la base peut en apporter) : ajoutée au seul <link> des polices
  function polices() {
    const lien = document.getElementById('polices');
    if (!lien) return;
    const href = lien.getAttribute('href') || '';
    const manque = new Map();
    shows().forEach(s => { const u = univers(s); if (u.police && !href.includes('family=' + u.police.replace(/ /g, '+'))) manque.set(u.police, u.graisse); });
    if (!manque.size) return;
    const ajout = [...manque].map(([f, g]) => `family=${f.replace(/ /g, '+')}${g !== 400 ? ':wght@' + g : ''}`).join('&');
    lien.setAttribute('href', href.replace(/&display=swap$/, '') + '&' + ajout + '&display=swap');
  }

  /* ---------- Les motifs des univers : une signature discrète ---------- */

    return bs.length && c ? frise(c, Object.assign({ echelle: 'annees', debut: bs[0].id, fin: bs[bs.length - 1].id, bandes: bs, libelle: titre, classe: 'frise-diffusion', anMin: 34 }, o)) : null; };
  // toutes les dates d'un spectacle, passées (D.saisons) et à venir (D.dates, vers leur ligne) ; liens : une date passée mène à
  // sa saison (#/saisons/<saison>), sinon le repère mène à sa ligne dans la page (le bilan d'un spectacle qui n'est plus en tournée)

    const passees = [];

  /* ---------- La frise de la saison (règle 21) : le cœur de la maquette ----------

  // les jours d'une ligne d'agenda : ceux de la base (iso, fin), sinon lus dans la ligne (« 12 octobre 2019 à 19h30 — … » :
  // le premier et le dernier jour cités ; « novembre 2026 — … » : le mois entier) ; null pour une année seule

    if (d.iso) return { jour: d.iso, fin: d.fin || d.iso, precision: d.precision || 'jour' };

  /* ---------- La saison en cours (l'accueil et #/saisons) : les filtres par spectacle et par commune, la recherche, qui portent sur

  const AG = { slug: null, l: null, q: '', ouv: null, avant: null, aller: null };

  // une date scolaire : le libellé de D, sans bouton de réservation

  // réserver (règle 17) : la date d'une ligne où l'on peut réserver est un bouton (son horaire écrit dessus) qui ouvre la carte

  const champ = (id, val) => `<div class="field" role="search"><label class="sr" for="${id}">${esc(LIB().rechercher)}</label>${LOUPE}<input id="${id}" type="search" placeholder="${esc(LIB().rechercher)}" value="${esc(val)}" autocomplete="off" spellcheck="false"></div>`;

  /* ---------- Les saisons passées (règle 21) : toutes les dates publiées (D.saisons) des saisons d'avant la saison en cours, de la

  const MOIS_ALT = MOIS.join('|');

  const MOIS_TOK = `${MOIS_ALT}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)

  /* ---------- Les vidéos, lues dans la page (règle 18, LECTEUR) ----------

  const lisibleV = v => !!(v && v.url && LC && LC.source(v.url));
  const bandeLien = (s, cls = 'lien-v') => !(s.video && s.video.url) ? '' : lisibleV(s.video)

  function videosHtml(s) {

    if (!lisibleV(s.video)) return `<a class="bande-a" href="${esc(s.video.url)}" target="_blank" rel="noopener">${LIRE}<span><b>${esc(L.bandeAnnonce)}</b><span>${esc(s.video.titre || '')}</span></span></a>`;
    const phs = (s.photos || []).filter(p => !p.etablissement && !p.atelier && photo(p.cle));
    let n = 0;
    const affiche = () => (phs.length ? photo(phs[n++ % phs.length].cle) : photo(s.slug));
    const groupes = [];
    (s.medias || []).filter(m => m && m.type === 'video' && m.url !== s.video.url && lisibleV(m)).forEach(m => {

  // la vidéo arrive dans la grille : quand elle est prête, un voile noir, aux filets de ses douze colonnes, se retire colonne

  if (LC) LC.regler({ univers: s => uStyle(s), effet: {

      const cadre = fig.querySelector('.lc-cadre');

      const v = document.createElement('span');
