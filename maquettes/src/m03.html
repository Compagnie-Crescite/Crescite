<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400..700;1,400&family=Space+Grotesk:wght@400..700&family=Ubuntu:wght@700&family=Cormorant+Garamond:wght@600&family=Bodoni+Moda:wght@700&family=Anton&family=Grenze+Gotisch:wght@600&family=IM+Fell+English&family=IM+Fell+French+Canon&display=swap">
<style>
:root {
  --paper: #f4f1ea;
  --paper-2: #ebe6db;
  --field: #fbf9f5;
  --paper-blanc: #ffffff;
  --ink: #141414;
  --ink-2: #57524a;
  --rule: #dcd6cb;
  --rule-2: #bfb7a8;
  /* l'accent de l'interface : le thème de la saison (règle 22, D.site.couleurSaison), posé par le script (couleurs()) ; l'encre
     en attendant (plus aucun magenta de marque). --acc-sur : le texte posé sur l'accent ; --acc-vive : l'accent sur un fond
     sombre (le pied) */
  --acc: var(--ink);
  --acc-sur: var(--paper);
  --acc-vive: var(--foot-ink);
  --foot-fond: #141414;
  --foot-ink: #efebe3;
  --foot-muted: #c9c3b8;
  --foot-rule: #3a3733;
  --foot-rule-2: #5c5852;
  --foot-focus: var(--acc-vive);
  --shadow-carton: rgba(0, 0, 0, .45);
  --shadow-barre: rgba(20, 20, 20, .5);
  --shadow-menu: rgba(20, 20, 20, .16);
  --shadow-bas: rgba(20, 20, 20, .4);
  --intro-marge: color-mix(in srgb, var(--acc) 38%, transparent);
  --intro-ligne: rgba(20, 20, 20, .075);
  --sg: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --at: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --gut: clamp(16px, 4vw, 48px);
  --gap: 24px;
  --h1: 60px;           /* la rangée de la marque et du menu second */
  --h2: 56px;           /* la rangée des trois entrées, qui reste en haut */
  --head: var(--h2);
  --bas: 0px;           /* la barre des entrées en bas d'écran, au téléphone */
  /* la carte, sur le papier de l'agenda */
  --k-pays: var(--field);
  --k-trait: var(--rule-2);
  --k-encre: var(--ink);
  --k-encre-2: var(--ink-2);
  --k-halo: var(--paper);
  --k-hub: var(--ink);
  --k-passe: var(--ink-2);
  --k-focus: var(--acc);
  /* l'édition sur place (EDITION) : la barre, la connexion et le panneau des dates sur le papier de l'agenda */
  --ed-fond: #fbf9f5;
  --ed-encre: #141414;
  --ed-accent: var(--acc);
  --ed-sur-accent: var(--acc-sur);
  --ed-police: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --ed-rayon: 8px;
  --ed-trait: #bfb7a8;
  /* les tentacules (TENTACULES) : la pieuvre de l'en-tête guide, à l'encre du programme sur le papier réglé ; les empreintes de ventouse ont la couleur de la saison */
  --tt-encre: #141414;
  --tt-accent: var(--acc);
  --tt-neutre: #8a847a;
  --tt-epaisseur: 2.4;
  --sp-aucun: #8a847a;    /* un spectacle hors du répertoire, sur le papier */
  /* la projection (LECTEUR) : le noir du cadre, son ombre, ses filets, l'encre sur l'affiche ; la page éteinte autour */
  --video: #0b0a09; --video-ombre: rgba(0, 0, 0, .72); --video-filet: rgba(255, 255, 255, .14); --video-filet-fort: rgba(255, 255, 255, .5);
  --video-encre: #ffffff; --video-voile: rgba(8, 7, 6, .92);
}
/* ———— la nuit (règle 19, THEME) : la saison imprimée en négatif ————
   La revue retournée, comme une affiche suisse tirée en blanc sur noir : un papier presque noir, chaud ; l'encre devient
   un blanc cassé, les filets des gris chauds, l'accent prend la couleur vive de la saison. Les couleurs des spectacles sur le papier
   prennent leur couleur de scène (--sp-*, couleurs()), les univers clairs passent dans leur propre nuit (--un-*,
   univers()) ; les univers sombres restent eux-mêmes. AA : encre 16:1, encre-2 7,6:1, l'accent au moins 4,5:1 sur le papier. */
html[data-theme="jour"] { color-scheme: light; }
html[data-theme="nuit"] {
  color-scheme: dark;
  --paper: #131211; --paper-2: #1f1d1a; --field: #1a1816; --paper-blanc: #ffffff;
  --ink: #f1ede5; --ink-2: #b4ada2; --rule: #34312d; --rule-2: #5b564f;
  --foot-fond: #0b0a09; --foot-rule: #2c2926; --foot-rule-2: #4e4a45;
  --shadow-carton: rgba(0, 0, 0, .7); --shadow-barre: rgba(0, 0, 0, .7); --shadow-menu: rgba(0, 0, 0, .55); --shadow-bas: rgba(0, 0, 0, .6);
  --intro-ligne: rgba(241, 237, 229, .06);
  --ed-fond: #1a1816; --ed-encre: #f1ede5; --ed-trait: #5b564f;
  --tt-encre: #f1ede5; --tt-neutre: #8f887d;
  --sp-aucun: #9a9387;
  --lune: #f6d58b;
}
/* un univers clair dans sa nuit : ses couleurs de D retournées (son texte, assombri, devient son fond), posées à côté
   des siennes (--un-*) par uStyle ; les univers sombres n'en ont pas besoin */
html[data-theme="nuit"] .u-clair { --u-fond: var(--un-fond) !important; --u-fond2: var(--un-fond2) !important; --u-texte: var(--un-texte) !important;
  --u-texte2: var(--un-texte2) !important; --u-titre: var(--un-titre) !important; --u-vif: var(--un-vif) !important; --u-sur: var(--un-sur) !important; }
/* une entrée sur le papier de nuit : sa couleur vive (la sombre ne se lirait pas) */
html[data-theme="nuit"] [style*="--e:"] { --e: var(--ev) !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head) + 16px); scroll-padding-bottom: var(--bas); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.125rem/1.5 var(--at); font-kerning: normal; }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }
h1, h2, h3 { font-family: var(--sg); font-weight: 500; margin: 0; line-height: 1.1; letter-spacing: -.02em; }
p, figure, dl, dd, blockquote { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }
table { border-collapse: collapse; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 16px; font-weight: 700; }
.skip:focus { top: 8px; }

.wrap { width: 100%; max-width: calc(1320px + 2 * var(--gut)); margin-inline: auto; padding-inline: var(--gut); }
.g12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); }
.dot { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--ink-2)); }
.statut { display: inline-block; padding: 3px 11px 4px; border: 1px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font: 700 .875rem/1.3 var(--at); }
.fl { display: inline-block; vertical-align: -3px; }

/* ---------- L'en-tête : la marque, puis le menu (règle 21 : les saisons, les spectacles, la compagnie, l'espace pro), qui reste en haut ----------
   Quatre colonnes égales sur la grille, chacune un pictogramme au trait et son nom ; un filet d'encre au-dessus, que l'élément
   courant remplace par un filet de la couleur de la saison (règle 22), tracé depuis la gauche. Au téléphone, le menu devient une barre fixe en bas d'écran
   (le nom court de D). */
.site-head { position: sticky; top: calc(-1 * var(--h1)); z-index: 30; background: var(--paper); border-top: 3px solid var(--ink); }
.tete-1 { height: var(--h1); border-bottom: 1px solid var(--ink); }
.tete-1 .wrap { display: flex; align-items: center; height: 100%; }
.brand { display: inline-flex; align-items: center; gap: 12px; flex: none; text-decoration: none; font: 700 1.5625rem/1 var(--sg); letter-spacing: -.035em; }
.brand-mark { width: 38px; height: 38px; }
.brand-mark svg { display: block; width: 100%; height: 100%; }
.menu-p { border-bottom: 3px double var(--ink); background: var(--paper); }
.menu-w { display: flex; }
.menu-p ul { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--h2); }
.menu-p li { display: flex; min-width: 0; }
.menu-p li + li { border-left: 1px solid var(--ink); }
.menu-p a { position: relative; flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0 18px; text-decoration: none; color: var(--ink); font: 500 1.125rem/1.15 var(--sg); letter-spacing: -.015em; transition: background-color .2s, color .2s; }
.menu-p a::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 6px; background: var(--ink); transform: scaleY(.34); transform-origin: top; transition: transform .2s; }
.menu-p a:hover { background: color-mix(in srgb, var(--ink) 5%, var(--paper)); }
.menu-p a:hover::before { transform: scaleY(.67); }
.menu-p a[aria-current] { font-weight: 600; background: color-mix(in srgb, var(--acc) 8%, var(--paper)); }
.m-ic { flex: none; width: 22px; height: 22px; color: var(--ink-2); transition: color .2s; }
.menu-p a:hover .m-ic { color: var(--ink); }
.menu-p a[aria-current] .m-ic { color: var(--acc); }
.m-court { display: none; }
.m-fl { margin-left: auto; color: var(--acc); opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
.menu-p a:hover .m-fl, .menu-p a[aria-current] .m-fl { opacity: 1; transform: none; }
.menu-p a > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.e-pt { flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--e); }
/* le jour et la nuit (règle 19), toujours à portée : au bureau, la dernière case de la barre du menu (qui reste en haut) ; au
   téléphone, le bout de la rangée de la marque (qui y reste) */
.tete-d { display: none; margin-left: auto; align-items: center; gap: 12px; }
.menu-jn { flex: none; display: grid; place-items: center; width: calc(var(--h2) + 16px); border-left: 1px solid var(--ink); }
.theme-m03 { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; margin: 0; padding: 0; border: 1px solid var(--rule-2); border-radius: 50%;
  background: var(--field); color: var(--ink); cursor: pointer; transition: border-color .15s, color .15s, background-color .15s, transform .15s; }
.theme-m03:hover { border-color: var(--ink); }
.theme-m03 .theme-icone { width: 22px; height: 22px; }
html[data-theme="nuit"] .theme-m03 { color: var(--lune); }   /* la lune, d'un jaune de lampe : 12:1 sur le papier de nuit */
html[data-theme="nuit"] .theme-m03:hover { border-color: var(--lune); }

/* ---------- Tête de page ---------- */
.hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 22px; align-items: end; padding-top: 44px; padding-bottom: 28px; }
.hero > * { grid-column: 1 / -1; }
.hero > .hero-main { grid-column: 1 / 9; }
.hero > .hero-side { grid-column: 9 / 13; justify-self: end; text-align: right; }
.saison { font-size: 4rem; line-height: .95; letter-spacing: -.045em; }
.sur { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font: 700 .8125rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.sur .e-pt { width: 13px; height: 13px; }
.hero-saison { font: 500 2.25rem/1 var(--sg); letter-spacing: -.035em; color: var(--ink-2); white-space: nowrap; }
.lead { max-width: 62ch; font: 400 1.375rem/1.5 var(--at); }
.h2s { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; padding-bottom: 14px; border-bottom: 3px double var(--ink); font-size: 2.5rem; letter-spacing: -.035em; }
.h2s::before { content: ""; flex: none; width: 12px; height: 12px; background: var(--acc); transform: translateY(-.12em); }
.h2s.grand { font-size: 3.25rem; letter-spacing: -.045em; }
.h2s.grand::before { width: 15px; height: 15px; }
.bloc { margin-top: 88px; }
.agir { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 700; font-size: 1.0625rem; transition: background-color .2s; }
.agir:hover { background: var(--acc); }
.agir svg { transition: transform .2s; }
.agir:hover svg { transform: translateX(4px); }
.suite { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; font: 500 1.375rem/1.2 var(--sg); letter-spacing: -.015em; text-decoration: none; }
.suite svg { color: var(--e, var(--acc)); transition: transform .2s; }
.suite:hover span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
.suite:hover svg { transform: translateX(4px); }

/* ---------- Accueil : La Une de revue culturelle (règle 21 : plus de choix entre trois entrées ; ses grandes cases servent
   désormais aux deux pages de l'espace pro, .choix) ---------- */
.hero-une { align-items: stretch; padding-top: 32px; row-gap: 24px; }
.hero-une > .une-edito { grid-column: 1 / 6; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 18px; border-bottom: 3px double var(--ink); }
.hero-une > .une-edito .saison { font-size: clamp(3rem, 5.2vw, 4.5rem); line-height: .92; }
.hero-une > .une-affiche { grid-column: 6 / 13; min-width: 0; }
.une-card { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); height: 100%; min-height: 224px; overflow: hidden; background: radial-gradient(85% 120% at 90% 10%, var(--u-lueur), transparent 72%), var(--u-fond); color: var(--u-texte); border: 1px solid var(--ink); isolation: isolate; transition: box-shadow .3s, transform .3s; }
.une-card:hover { box-shadow: 0 18px 42px -18px var(--u-lueur); }
.une-b { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; padding: 20px 22px 22px; }
.une-t { margin-top: 2px; font: var(--u-gr) clamp(2rem, 3.2vw, 2.875rem)/.96 var(--u-police); letter-spacing: 0; color: var(--u-titre); }
.une-t a { text-decoration: none; }
.une-t a::after { content: ""; position: absolute; inset: 0; z-index: 2; }
.une-t a:focus-visible { outline: none; }
.une-card:focus-within { outline: 3px solid var(--u-vif); outline-offset: 3px; }
.une-t .l { display: block; }
.une-s { font-size: 1rem; color: var(--u-texte2); }
.une-n { margin-top: auto; padding-top: 10px; border-top: 2px solid var(--u-titre); font-size: .9375rem; font-weight: 600; }
.une-img { position: relative; display: block; height: 100%; min-height: 220px; overflow: hidden; background: var(--u-fond2); }
.une-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.une-card:hover .une-img img { transform: scale(1.04); }
.une-card > .motif { position: absolute; left: 42%; bottom: -18px; z-index: 0; width: 136px; height: auto; color: var(--u-titre); opacity: .18; pointer-events: none; }
.choix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.choix a { position: relative; display: flex; flex-direction: column; height: 100%; text-decoration: none; background: var(--field); border: 1px solid var(--rule-2); border-top: 6px solid var(--e); transition: border-color .2s, box-shadow .25s; }
.choix a:hover { border-color: var(--ink); border-top-color: var(--e); }
.choix-img { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; background: var(--ink); }
.choix-img img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.04) saturate(1.04); transition: filter .45s, transform .6s; }
.choix-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, color-mix(in srgb, var(--e) 38%, transparent), transparent 60%); opacity: .55; transition: opacity .45s; pointer-events: none; }
.choix a:hover .choix-img img, .choix a:focus-visible .choix-img img { filter: contrast(1.06) saturate(1.08); transform: scale(1.03); }
.choix a:hover .choix-img::after, .choix a:focus-visible .choix-img::after { opacity: .2; }
.choix-t { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex: 1; padding: 18px 20px 20px; font: 500 clamp(1.375rem, 2.1vw, 1.875rem)/1.08 var(--sg); letter-spacing: -.03em; }
.choix-t svg { flex: none; width: 28px; height: 28px; color: var(--e); transition: transform .2s; }
.choix-t b { display: block; font: inherit; }
.choix-t small { display: block; margin-top: 8px; font: 400 1rem/1.4 var(--at); letter-spacing: 0; color: var(--ink-2); }
.choix a:hover .choix-t svg { transform: translateX(5px); }

/* ---------- L'agenda : filtres, recherche, carte et liste reliées ---------- */
.ag-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip, .lieu-chip, .lieu-btn { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 15px 0 12px; border: 1px solid var(--rule-2); border-radius: 999px; background: var(--field); font-weight: 600; font-size: .9375rem; line-height: 1.2; text-align: left; }
.chip:hover, .lieu-btn:hover { border-color: var(--ink); }
.chip[aria-pressed="true"], .lieu-chip { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--paper); }
.lieu-chip svg { margin-left: 2px; }
.lieu-pin { width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 50%; }
.ag-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.field { position: relative; width: 260px; }
.field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-2); pointer-events: none; }
.field input { width: 100%; height: 44px; padding: 0 14px 0 42px; border: 1px solid var(--rule-2); border-radius: 999px; background: var(--field); font-size: 1rem; }
.field input::placeholder { color: var(--ink-2); opacity: 1; }
.field input:focus-visible { outline-offset: 0; border-color: var(--ink); }
.ag-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); align-items: start; }
.ag-carte { position: sticky; top: calc(var(--head) + 8px); padding-top: 18px; }
.ag-carte svg { max-height: calc(100vh - var(--head) - 36px); }
.ag-accueil .ag-carte { grid-column: 1 / 8; grid-row: 1; }
.ag-accueil .ag-liste { grid-column: 8 / 13; grid-row: 1; }
.ag-complet .ag-liste, .pg-liste { grid-column: 1 / 9; grid-row: 1; }
.ag-complet .ag-carte, .pg .ag-carte { grid-column: 9 / 13; grid-row: 1; }
.ag-liste, .pg-liste { min-width: 0; }
.mois { margin-top: 30px; }
.mois-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); font-size: 1.875rem; }
.mois-h .mo { text-transform: capitalize; }
.mois-h .yr { color: var(--ink-2); font-weight: 400; }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: var(--gap); padding: 17px 0 18px; border-bottom: 1px solid var(--rule); }
.dt { position: relative; transition: background-color .2s; }
.dt::before { content: ""; position: absolute; left: -14px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--c, var(--ink)); opacity: 0; transition: opacity .2s; }
.dt.on::before, .dt:hover::before, .dt:focus-within::before { opacity: 1; }
.dt.on { background: color-mix(in srgb, var(--c, var(--ink)) 9%, transparent); }
.when { font-family: var(--sg); line-height: 1; }
.j-big { font-size: 3rem; font-weight: 500; line-height: .82; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.j-big sup { font-size: .4em; letter-spacing: 0; vertical-align: .95em; margin-left: 1px; }
.j-pre, .j-rest, .j-v { font-size: 1.125rem; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.j-mo { font-size: 1.75rem; font-weight: 500; letter-spacing: -.03em; }
.j-sous { display: block; margin-top: 9px; font: 400 .9375rem/1.3 var(--at); color: var(--ink-2); }
.what { min-width: 0; overflow-wrap: anywhere; }
.t-link { display: inline-flex; align-items: baseline; gap: 10px; font: 500 1.375rem/1.2 var(--sg); letter-spacing: -.015em; text-decoration: none; }
.t-link .dot { position: relative; top: -.06em; }
a.t-link:hover .t-txt { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; }
.where { margin-top: 5px; padding-left: 22px; font-weight: 600; }
.det { margin-top: 6px; padding-left: 22px; color: var(--ink-2); font-size: 1rem; line-height: 1.45; }
.det li + li { margin-top: 4px; }
.det a { color: var(--acc); font-weight: 600; }
.det a svg { display: inline; margin-left: 4px; vertical-align: -1px; }
.ag-accueil .mois { margin-top: 22px; }
.ag-accueil .mois-h { font-size: 1.5rem; padding-bottom: 8px; }
.ag-accueil .row { grid-template-columns: 124px minmax(0, 1fr); column-gap: 18px; padding: 13px 0 14px; }
.ag-accueil .j-big { font-size: 2.375rem; }
.ag-accueil .j-mo { font-size: 1.5rem; }
.ag-accueil .t-link { font-size: 1.1875rem; }
.ag-accueil .where { margin-top: 3px; font-size: 1rem; }

/* ---------- La carte des tournées : des bras à la couleur des spectacles, une pastille au bout ---------- */
.carte-m03 { display: block; width: 100%; height: auto; font-family: var(--sg); }
.carte-m03 .pays { fill: var(--k-pays); stroke: var(--k-trait); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.carte-m03 .voisin { fill: none; stroke: var(--k-trait); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 2 3; }
.carte-m03 .encart { fill: none; stroke: var(--k-trait); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 3 4; }
.carte-m03 .bras { opacity: .92; transition: opacity .3s; }
/* la carte de la saison : une commune dont toutes les dates sont jouées reste en retrait, ses bras aussi */
.carte-m03 .bras.est-passe { opacity: .36; }
.carte-lieu.est-passe .pt-in { opacity: .55; }
.carte-m03.focus .bras { opacity: .12; }
.carte-m03.focus .bras.on { opacity: 1; }
.carte-m03 .bras.hors { opacity: .06; }
.carte-m03 .bras-passe { fill: var(--k-passe); opacity: .3; }
.carte-m03 .pt-passe { fill: var(--k-passe); opacity: .6; }
.carte-m03 .hub-o { fill: var(--k-halo); stroke: var(--k-hub); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.carte-m03 .hub-i { fill: var(--k-hub); }
.carte-m03 .pt-bord { fill: none; stroke: var(--k-halo); }
.carte-lieu { cursor: pointer; transition: opacity .3s; }
.carte-lieu:focus { outline: none; }
.carte-lieu .pt { transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform .26s cubic-bezier(.2, 0, 0, 1) calc(var(--d, 0s) + .1s); }
.carte-m03.pousse .carte-lieu .pt, .carte-lieu.hub .pt { transform: none; }
.carte-lieu .pt-in { transform-box: fill-box; transform-origin: center; transition: transform .25s; }
.carte-lieu.on .pt-in, .carte-lieu.sel .pt-in { transform: scale(1.6); }
.carte-lieu.hub.on .pt-in, .carte-lieu.hub.sel .pt-in { transform: scale(1.3); }
.carte-lieu .aura { fill: transparent; stroke: none; transition: fill .2s; }
.carte-lieu.on .aura { fill: color-mix(in srgb, var(--c) 24%, transparent); }
.carte-lieu.sel .aura { stroke: var(--k-encre); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.carte-lieu:focus-visible .aura { stroke: var(--k-focus); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }
.carte-m03.focus .carte-lieu:not(.on) { opacity: .45; }
.carte-lieu.hors { opacity: .16 !important; pointer-events: none; }
.carte-m03 .noms, .carte-m03 .rouen-nom { pointer-events: none; }
.carte-m03.pousse .noms { animation: apparait .4s .7s both; }
.carte-m03 .nom, .carte-m03 .rouen-nom { font-size: var(--fs, 12.5px); font-weight: 500; fill: var(--k-encre); paint-order: stroke; stroke: var(--k-halo); stroke-width: calc(3.5px * var(--k, 1)); stroke-linejoin: round; }
.carte-m03 .rouen-nom { font-weight: 700; }
.carte-m03 .nom { transition: opacity .25s; }
.carte-m03 .nom .dep, .carte-m03 .nom-passe { fill: var(--k-encre-2); font-weight: 400; }
.carte-m03 .nom.cache, .carte-m03 .nom.hors { opacity: 0; }
.carte-m03.focus .nom:not(.on):not(.cache):not(.hors) { opacity: .3; }
.carte-m03 .nom.on { opacity: 1; }
@keyframes apparait { from { opacity: 0; } }
/* une mise à jour des données refait la vue sans rejouer les entrées */
.fixe .carte-lieu .pt { transition: none !important; }
.fixe .carte-m03 .noms, .fixe .u-h1 .l { animation: none !important; }

/* ---------- Les spectacles dans leur univers : cartes ---------- */
.ucs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); padding-top: 26px; }
.ucs.riches { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px var(--gap); }
.uc { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--u-fond); color: var(--u-texte); isolation: isolate; transition: box-shadow .3s, transform .3s; }
.uc:hover { box-shadow: 0 18px 42px -18px var(--u-lueur), 0 0 0 1px color-mix(in srgb, var(--u-titre) 40%, transparent); }
.uc-img { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; background: var(--u-fond2); }
.uc-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.uc:hover .uc-img img { transform: scale(1.04); }
.uc-img .statut { position: absolute; left: 12px; top: 12px; }
/* « EN TOURNÉE » : une étiquette d'encre, en capitales, qui respire (règle 15 B 7) ; le halo est un calque à part dont seule
   l'opacité varie (une animation composée : la page ne se repeint pas à chaque image, les gestes restent vifs) */
.statut-t { position: relative; border-color: var(--ink); background: var(--ink); color: var(--paper); font-size: .75rem; letter-spacing: .12em; }
.statut-t::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; box-shadow: 0 0 0 5px color-mix(in srgb, var(--paper) 55%, transparent); opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { html:not(.m3-fixe) .statut-t::after { animation: m3-respire 2.8s ease-in-out infinite; will-change: opacity; } }
@keyframes m3-respire { 50% { opacity: 1; } }
.uc-b { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 18px 20px 22px; }
.uc-t { font: var(--u-gr) 2rem/1 var(--u-police); letter-spacing: 0; color: var(--u-titre); overflow-wrap: break-word; hyphens: auto; }
.uc-t a { text-decoration: none; }
.uc-t a::after { content: ""; position: absolute; inset: 0; z-index: 2; }
.uc-t a:focus-visible { outline: none; }
.uc:focus-within { outline: 3px solid var(--u-vif); outline-offset: 3px; }
.uc-t .l { display: block; }
.uc-s { font-size: 1rem; color: var(--u-texte2); }
.uc-acc { font-size: 1rem; line-height: 1.5; }
.uc-n { margin-top: auto; padding-top: 10px; border-top: 2px solid var(--u-titre); font-size: .9375rem; font-weight: 600; }
.uc > .motif { position: absolute; right: -14px; bottom: -14px; z-index: 0; width: 120px; height: auto; color: var(--u-titre); opacity: .2; pointer-events: none; }
/* les motifs en bande : le fil rouge, la frise 1850 → 2077, dans le cours de la mise en page */
.motif.bande { display: block; pointer-events: none; }
.motif.bande svg { display: block; width: 100%; height: 26px; overflow: visible; }
.motif.bande[data-motif="fil"] svg { height: 36px; }
.ans { display: flex; justify-content: space-between; margin-top: 5px; font: 600 .75rem/1 var(--sg); letter-spacing: .06em; }
.ans i { font-style: normal; }
.bandeau { color: var(--u-titre); opacity: .55; }
.uc-b > .bandeau { margin-top: 6px; }
.fc-frise { grid-column: 1 / -1; }
.u-frise { grid-column: 1 / -1; color: var(--u-titre); opacity: .6; }
.u-frise .motif.bande svg { height: 30px; }
.u-frise .motif.bande[data-motif="fil"] svg { height: 64px; }
.riches .uc-t { font-size: 2.375rem; }
.u-et { display: flex; flex-wrap: wrap; gap: 4px 0; font: 700 .75rem/1.35 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.u-et > span { white-space: nowrap; }
.u-et > span:not(:last-child):not(:has(+ .statut))::after { content: "·"; margin: 0 9px; }
.u-et .statut { margin-left: 10px; letter-spacing: 0; text-transform: none; }

/* ---------- Les fiches : programmer, établissement scolaire ---------- */
.fiches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px var(--gap); align-items: start; padding-top: 20px; }
.pg .fiches { grid-template-columns: minmax(0, 1fr); }
.fc { position: relative; display: flex; flex-direction: column; background: var(--field); border: 1px solid var(--rule); transition: box-shadow .25s; }
.fc.on { box-shadow: 0 0 0 2px var(--u-titre); }
.fc-tete { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; padding: 20px 22px 20px; background: radial-gradient(80% 120% at 90% 0%, var(--u-lueur), transparent 70%), var(--u-fond); color: var(--u-texte); isolation: isolate; }
.fc-tete > .motif { position: absolute; right: -16px; top: -16px; z-index: -1; width: 150px; height: auto; color: var(--u-titre); opacity: .22; }
.fc-t { margin-top: 8px; font: var(--u-gr) 2.25rem/1 var(--u-police); letter-spacing: 0; color: var(--u-titre); overflow-wrap: break-word; hyphens: auto; }
.fc-t a { text-decoration: none; }
.fc-t a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .12em; }
.fc-t .l { display: block; }
.fc-s { margin-top: 6px; font-size: 1rem; color: var(--u-texte2); }
.fc-tete img { width: 132px; aspect-ratio: 1; object-fit: cover; }
.fc-corps { display: flex; flex-direction: column; gap: 16px; padding: 20px 22px 24px; }
.rep { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font: 500 1.125rem/1.3 var(--sg); }
.rep b { font: 500 3.25rem/.9 var(--sg); letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.faits { display: flex; flex-wrap: wrap; gap: 8px; }
.faits li { padding: 5px 12px 6px; border: 1px solid var(--rule-2); border-radius: 999px; font-size: .9375rem; font-weight: 600; line-height: 1.3; }
.mini { font-size: .9375rem; line-height: 1.45; }
.mini div { padding: 6px 0 7px; border-bottom: 1px solid var(--rule); }
.mini div:first-child { border-top: 1px solid var(--rule); }
.mini dt { display: inline; color: var(--ink-2); }
.mini dd { display: inline; margin-left: 6px; font-weight: 600; }
.liens { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.lien-v { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; text-decoration: none; }
.lien-v svg { color: var(--u-titre, var(--acc)); }
.fc .lien-v svg { color: var(--ink); }
.lien-v:hover span { text-decoration: underline; }
details.lx-d { border-top: 1px solid var(--rule); }
details.lx-d summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 10px 0; cursor: pointer; list-style: none; font-weight: 700; }
details.lx-d summary::-webkit-details-marker { display: none; }
details.lx-d summary svg { transition: transform .2s; }
details.lx-d[open] summary svg { transform: rotate(180deg); }
details.lx-d p { padding-bottom: 12px; font-size: .9375rem; line-height: 1.55; color: var(--ink-2); }
.equipe li { padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: .9375rem; font-weight: 600; }

/* Programmer : le catalogue relié à la carte de tous les lieux */
.pg-sel:empty { display: none; }
.pg-sel { margin-top: 18px; }
.lx { padding: 18px 20px 20px; background: var(--field); border: 1px solid var(--ink); }
.lx-t { font-size: 1.75rem; letter-spacing: -.03em; }
.lx-s { margin-top: 16px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); font: 700 .8125rem/1.3 var(--at); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.lx ul li { display: grid; grid-template-columns: 12px minmax(0, 14rem) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: .9375rem; overflow-wrap: anywhere; }
.lx .lx-sp { font-weight: 700; }
.lx-res { display: flex; flex-wrap: wrap; gap: 8px; }
.lieu-btn .lieu-pin { color: var(--ink-2); }
.pg .fc { scroll-margin-top: calc(var(--head) + 20px); }
.pg .fc-tete { grid-template-columns: minmax(0, 1fr) auto; }
.pg .fc-corps { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: 24px; row-gap: 16px; }
.pg .fc-corps > .col-a { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pg .fc-corps > .col-b { min-width: 0; }

/* Établissement scolaire : le type d'action culturelle, bien lisible */
.ecole { margin-top: 8px; }
.groupe + .groupe { margin-top: 72px; }
.groupe-h { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); font-size: 2rem; letter-spacing: -.03em; }
.groupe-h svg { color: var(--e, var(--ink)); }
.fiches.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ac-l { font: 700 .75rem/1.3 var(--at); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.ac-type { margin-top: 2px; font: 500 1.875rem/1.05 var(--sg); letter-spacing: -.035em; overflow-wrap: break-word; hyphens: auto; }
.ac-type::before { content: ""; display: block; width: 44px; height: 6px; margin-bottom: 12px; background: var(--u-titre); }
.ac-type.vide { color: var(--ink-2); }
.ac-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.ac-meta li { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 12px 6px; border: 1px solid var(--rule-2); border-radius: 999px; font-size: .9375rem; line-height: 1.3; }
.ac-meta li span:first-child { color: var(--ink-2); }
.ac-meta li b { font-weight: 700; }
.ac-txt { font-size: 1rem; line-height: 1.55; }
.ac-txt a, .disp a { color: var(--acc); }
.formule { display: grid; gap: 2px; padding: 12px 16px; background: var(--u-fond); color: var(--u-texte); font: 500 1.25rem/1.25 var(--sg); letter-spacing: -.015em; }
.disp p { margin-bottom: 4px; }
.disp li { padding: 5px 0 5px 16px; position: relative; font-size: .9375rem; line-height: 1.45; }
.disp li::before { content: ""; position: absolute; left: 0; top: .78em; width: 7px; height: 7px; background: var(--u-titre); }
.dossier-lien { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 9px; background: var(--u-titre); color: var(--u-sur); text-decoration: none; font-weight: 700; }
.dossier-lien:hover { text-decoration: underline; }
.appel { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 20px; align-items: center; margin-top: 96px; padding: 30px 0; border-block: 1px solid var(--ink); }
.appel p { grid-column: 1 / 9; font-size: 1.0625rem; line-height: 1.6; color: var(--ink-2); }
.appel .agir { grid-column: 9 / 13; justify-self: end; }
.appel.seul .agir { grid-column: 1 / -1; justify-self: start; }

/* La page d'origine des actions culturelles */
.act { align-items: start; row-gap: 32px; padding-top: 28px; }
.act-text { grid-column: 1 / 8; }
.act-fig { grid-column: 9 / 13; position: sticky; top: calc(var(--head) + 24px); }
.act-fig img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--paper-2); }
.galerie { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.galerie img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--paper-2); }
.prose h2 { margin: 40px 0 12px; font-size: 1.625rem; }
.prose > h2:first-child, .prose > .bl:first-child h2 { margin-top: 0; }
.prose .bl + p, .prose p + .bl:not(:has(h2)) { margin-top: 14px; }
.prose p + p, .prose ul + p { margin-top: 14px; }
.prose ul { margin-top: 12px; border-top: 1px solid var(--rule); }
.prose li { padding: 12px 0 13px; border-bottom: 1px solid var(--rule); }
.prose a { color: var(--acc); overflow-wrap: anywhere; }
.prose p, .prose li { max-width: 66ch; }
figcaption { margin-top: 8px; font-size: .875rem; color: var(--ink-2); }

/* Établissement scolaire : la liste des dates scolaires et leur carte */
.sc .ag-liste { grid-column: 1 / 8; grid-row: 1; }
.sc .ag-carte { grid-column: 8 / 13; grid-row: 1; }

/* ---------- L'agenda passé : une saison par bloc, fermée au départ, sa petite carte pour l'annoncer ---------- */
.ag-index { position: sticky; top: var(--head); z-index: 20; display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 10px 0; background: var(--paper); border-bottom: 1px solid var(--ink); }
.ag-index ul { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px; padding: 3px 2px; overflow-x: auto; scrollbar-width: none; }
.ag-index li { flex: none; }
.idx, .idx-tout { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule-2); background: var(--field); color: var(--ink); font: 600 .9375rem/1.2 var(--sg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.idx { min-height: 44px; padding: 0 14px; border-radius: 999px; }
.idx small { font: 500 .8125rem var(--at); color: var(--ink-2); }
.idx:hover, .idx-tout:hover { border-color: var(--ink); }
.idx[aria-expanded="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--acc); }
.idx-actif { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.idx-tout { flex: none; justify-content: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; }
.sai { border-bottom: 1px solid var(--rule-2); scroll-margin-top: calc(var(--head) + 70px); }
.sai > summary { display: grid; grid-template-columns: clamp(84px, 10vw, 130px) minmax(0, 1fr) auto; align-items: center; gap: 6px clamp(16px, 2.4vw, 32px); padding: 18px 8px; list-style: none; cursor: pointer; transition: background-color .2s; }
.sai > summary::-webkit-details-marker { display: none; }
.sai > summary:hover, .sai[open] > summary { background: var(--paper-2); }
.sai-mini { display: block; padding: 6px; border: 1px solid var(--rule-2); background: var(--field); }
.mini-m03 { display: block; width: 100%; height: auto; }
.mini-m03 .pays { fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.mini-m03 .hub-i { fill: var(--ink); }
.sai-t { font-size: clamp(1.75rem, 1.2rem + 1.8vw, 2.75rem); letter-spacing: -.04em; }
.sai-sp { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--ink-2); font-size: .9375rem; line-height: 1.3; }
.sai-sp .sp { display: inline-flex; align-items: baseline; gap: 7px; }
.sai-sp .dot { width: 9px; height: 9px; }
.sai-n { display: inline-flex; align-items: center; gap: 12px; font: 500 clamp(1.5rem, 1.2rem + 1vw, 2.25rem)/1 var(--sg); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.sai-n svg { width: 20px; height: 20px; transition: transform .25s; }
.sai[open] .sai-n svg { transform: rotate(180deg); }
.sai-corps { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; padding: 8px 8px 44px; }
.sai-corps:empty { display: none; }
.sai-carte { position: sticky; top: calc(var(--head) + 76px); padding-top: 10px; }
.sai-carte svg { max-height: calc(100vh - var(--head) - 120px); }
.sai-liste .mois:first-child { margin-top: 0; }
.sai-liste .mois-h { font-size: 1.625rem; }
.row.suite { display: block; color: var(--ink-2); }
.row.annule .where, .row.annule .t-link { color: var(--ink-2); }
.what .where a { text-decoration-color: color-mix(in srgb, var(--ink) 30%, transparent); }
.what .where a:hover { color: var(--acc); }
.tag-sc { display: inline-block; margin-left: 10px; padding: 1px 9px 2px; border: 1px solid currentColor; border-radius: 999px; color: var(--ink-2); font: 700 .75rem/1.4 var(--at); letter-spacing: .06em; text-transform: uppercase; vertical-align: 2px; }

.etat { display: inline-block; margin-left: 8px; padding: 1px 9px 2px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: .8125rem; font-weight: 700; vertical-align: 1px; }

/* ---------- La page d'un spectacle, dans son univers ---------- */
.u { --k-pays: var(--u-fond2); --k-trait: color-mix(in srgb, var(--u-texte2) 55%, transparent); --k-encre: var(--u-texte); --k-encre-2: var(--u-texte2); --k-halo: var(--u-fond); --k-hub: var(--u-texte); --k-passe: var(--u-texte2); --k-focus: var(--u-vif);
  background: var(--u-fond); color: var(--u-texte); padding-bottom: 96px; }
.u :focus-visible { outline-color: var(--u-vif); }
.u a { color: inherit; }
.u-tete { position: relative; overflow: hidden; background: radial-gradient(60% 90% at 80% 35%, var(--u-lueur), transparent 72%), var(--u-fond); isolation: isolate; }
.u-tete-in { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap); row-gap: 28px; align-items: end; padding-top: 44px; padding-bottom: 40px; }
.u-titres { grid-column: 1 / 7; min-width: 0; }

.atelier ul li { position: relative; padding: 6px 0 6px 18px; }
.atelier ul li::before { content: ""; position: absolute; left: 0; top: .95em; width: 8px; height: 8px; border-radius: 50%; background: var(--u-titre); }
.at-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.at-photos img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--u-fond2); }
.at-photos figcaption { color: var(--u-texte2); }

/* ---------- La compagnie, contact, mentions ---------- */
.co { align-items: start; row-gap: 48px; }
.co-text { grid-column: 1 / 8; }
.co-text p { max-width: 66ch; }
/* la présentation seule sur sa rangée (la troupe et les repères viennent dessous) : composée sur deux colonnes, comme une
   page de revue, le chapeau sur toute la largeur */
.co > .co-text:only-child { grid-column: 1 / -1; columns: 2; column-gap: var(--gap); }
.co > .co-text:only-child > p:first-of-type { column-span: all; max-width: 62ch; margin-bottom: 26px; }
.co > .co-text:only-child p { break-inside: avoid-column; }
.co-text > p:first-of-type { font: 500 1.25rem/1.45 var(--sg); letter-spacing: -.015em; color: var(--ink); }
.co-text p + p { margin-top: 18px; }
.co-dates { grid-column: 9 / 13; padding: 18px 20px 20px; background: var(--field); border: 1px solid var(--rule-2); border-top: 4px solid var(--ink); }
.co-h { padding-bottom: 12px; border-bottom: 1px solid var(--ink); font-size: 1.375rem; }
.annees li { display: grid; grid-template-columns: 4.4rem minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 12px 0 13px; border-bottom: 1px solid var(--rule); }
.an { font: 500 1.75rem/1 var(--sg); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.an-t { font-weight: 600; }
.dir { margin-top: 88px; align-items: start; row-gap: 22px; }
.dir-h { grid-column: 1 / 5; }
.dir-h h2 { font-size: 2.25rem; letter-spacing: -.035em; }
.dir-h p { margin-top: 12px; font: 500 1.25rem/1.35 var(--sg); color: var(--ink-2); }
.dir-t { grid-column: 5 / 12; padding-top: 6px; border-top: 1px solid var(--ink); }
.dir-t p { margin-top: 14px; max-width: 70ch; }
.partenaires { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--rule); max-width: 88ch; color: var(--ink-2); font-size: 1rem; line-height: 1.6; }
.legal { max-width: 860px; }
.form { max-width: 760px; }
.fld { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.fld label, .calc label { font-weight: 600; font-size: 1rem; }
.fld input, .fld textarea, .calc input { width: 100%; padding: 11px 14px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--field); font-size: 1rem; }
.fld input:focus-visible, .fld textarea:focus-visible, .calc input:focus-visible { outline-offset: 0; border-color: var(--ink); }
.fld textarea { min-height: 170px; resize: vertical; }
.fld-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin-top: 22px; font-size: 1rem; }
.chk input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); }
.chk a { color: var(--acc); font-weight: 600; }
.calc { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
.calc input { width: 72px; }
.btn { margin-top: 26px; height: 48px; padding: 0 30px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 1rem; }
.btn:hover { background: var(--acc); }
.ct { align-items: start; row-gap: 48px; }
.ct-form { grid-column: 1 / 8; }
.ct-form .fld:first-child { margin-top: 0; }
.ct-co { grid-column: 9 / 13; padding-top: 14px; border-top: 1px solid var(--ink); font-style: normal; line-height: 1.6; }
.dons { margin-top: 88px; }

/* ---------- Pied de page ---------- */
.site-foot { margin-top: 128px; padding: 56px 0 28px; background: var(--foot-fond); color: var(--foot-ink); border-top: 3px double var(--foot-rule-2); }
body[data-vue="spectacle"] .site-foot { margin-top: 0; }

/* ---------- L'ouverture, sur le papier réglé de l'agenda ---------- */

  background: linear-gradient(to right, transparent calc(var(--gut) + 96px), var(--intro-marge) calc(var(--gut) + 96px) calc(var(--gut) + 97px), transparent calc(var(--gut) + 97px)),
