/* le dossier scolaire : la charte de la compagnie (aplats, encadrés, tableau net) */
.dossier{margin-top:clamp(4.5rem,9vw,8rem)}
.dossier-couv{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem 3rem;align-items:end;padding:clamp(1.75rem,4vw,3.25rem);background:var(--u-aplat);color:var(--u-sur);overflow:hidden}
.dossier-couv .motif{position:absolute;right:-3rem;top:-3rem;width:18rem;opacity:.22;--motif-trait:1.4px}
.dossier-couv .chap-t{color:inherit;font-size:clamp(1rem,1.4vw,1.125rem);font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.dossier-titre{margin-top:.6rem;font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,700);font-size:clamp(3rem,8vw,6.5rem);line-height:.95;letter-spacing:.02em}
.dossier-auteur{margin-top:.5rem;font-size:1.25rem;font-style:italic}
.dossier-faits{display:flex;flex-wrap:wrap;gap:.5rem;position:relative}
.dossier-faits li{padding:.35rem .75rem;border:1px solid currentColor;font-size:.75rem;font-weight:700;letter-spacing:.14em}
.dossier-formule{margin-top:.9rem;font-weight:700;position:relative}
.dos-sec{margin-top:clamp(3rem,6vw,5rem)}
.dos-t{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:var(--fs-h3);line-height:1.12;color:var(--u-titre);text-wrap:balance}
.pourquoi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem;margin-top:1.75rem}
.pourquoi > div{padding:1.4rem 1.5rem 1.6rem;background:var(--u-fond2);border-top:4px solid var(--u-trace)}
.pourquoi h4{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;line-height:1.25;color:var(--u-titre)}
.pourquoi .prose{margin-top:.8rem;font-size:.9688rem;line-height:1.65}
.table-s{margin-top:1.75rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.prog{width:100%;min-width:40rem;border-collapse:collapse;font-size:.9375rem;line-height:1.5;background:var(--u-fond2)}
.prog th,.prog td{padding:.8rem 1rem;border:1px solid var(--trait-fort);vertical-align:top;text-align:left}
.prog th[scope="rowgroup"]{width:5.5rem;background:var(--u-aplat);color:var(--u-sur);font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;text-align:center;vertical-align:middle}
.prog th[scope="row"]{width:8.5rem;font-weight:700;color:var(--u-titre)}
.prog td:last-child{color:var(--u-texte2)}
.consignes{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.5rem 3rem;margin-top:1.75rem;align-items:start}
.note{display:inline-block;padding:.3rem .7rem;background:var(--u-aplat);color:var(--u-sur);font-size:.75rem;font-weight:700;letter-spacing:.16em}
.demandes{margin-top:1rem;display:grid;gap:.5rem}
.demandes li{padding:.7rem 1rem;border:2px solid var(--u-trace);font-weight:700;font-size:.9375rem;letter-spacing:.04em;color:var(--u-titre)}
.axes{margin-top:.8rem;display:grid;gap:.6rem}
.axes li{position:relative;padding-left:1.1rem;font-size:.9688rem}
.axes li::before{content:"";position:absolute;left:0;top:.65em;width:.4rem;height:.4rem;border-radius:50%;background:var(--u-trace)}
.ateliers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem;margin-top:1.75rem}
.atelier{padding:1.5rem 1.6rem 1.7rem;background:var(--u-fond2);border-top:4px solid var(--u-trace)}
.atelier h4{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.375rem;line-height:1.2;color:var(--u-titre)}
.atelier h4 strong{font-weight:inherit}
.atelier .prose{margin-top:.8rem;font-size:.9688rem;line-height:1.65}
.etapes{display:grid;gap:.9rem;margin-top:1rem}
.etapes h5{font-size:.9375rem;color:var(--u-titre)}
.etapes h5 strong{font-weight:700}
.etapes p{margin-top:.25rem;font-size:.9375rem;line-height:1.6;color:var(--u-texte2)}
.points{display:grid;gap:.5rem;margin-top:1rem}
.points li{position:relative;padding-left:1.1rem;font-size:.9375rem;line-height:1.6}
.points li::before{content:"";position:absolute;left:0;top:.62em;width:.4rem;height:.4rem;background:var(--u-trace)}
.ateliers-ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1.5rem}
.ateliers-ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.plus-loin{margin-top:1.75rem}
.plus-loin details{border-top:1px solid var(--trait-fort)}
.plus-loin details:last-child{border-bottom:1px solid var(--trait-fort)}
.plus-loin summary{padding:1rem 0;cursor:pointer;font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:1.25rem;color:var(--u-titre)}
.plus-loin .prose{padding-bottom:1.25rem;max-width:48rem;font-size:.9688rem;line-height:1.7}
.suivant{position:relative;display:grid;align-items:end;height:min(68vh,40rem);min-height:20rem;overflow:hidden;text-decoration:none;color:var(--blanc);isolation:isolate;background:var(--noir)}
.suivant img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(.38);transition:filter .9s var(--ease),transform 1.2s var(--ease)}
.suivant::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(11,8,9,.92) 0,rgba(11,8,9,.3) 50%,rgba(11,8,9,.55) 100%)}
.suivant:hover img,.suivant:focus-visible img{filter:brightness(.82);transform:scale(1.02)}
.suivant-in{display:block;padding-bottom:clamp(2.5rem,6vh,4rem)}
.suivant-t{display:block;max-width:22ch;font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:var(--fs-scene);line-height:1;text-wrap:balance}
.suivant-t .fl{margin-left:.35em;font-family:var(--sans);font-style:normal;font-weight:400;font-size:.5em;color:var(--c)}
.suivant:hover .suivant-t .fl{transform:translateX(.5rem)}

/* Je souhaite programmer : le catalogue, une fiche par spectacle dans sa lumière */
.catalogue{display:grid;gap:clamp(1.25rem,2.5vw,2rem)}
.fiche-u{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--u-fond);color:var(--u-texte);overflow:hidden;isolation:isolate}
.fiche-u:nth-child(even){grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.fiche-u:nth-child(even) .fu-ph{order:2}
.fu-ph{position:relative;min-height:24rem;background:#000;overflow:hidden}
.fu-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.68) saturate(.9);transition:filter .9s var(--ease)}
.fiche-u:hover .fu-ph img{filter:brightness(.92) saturate(1)}
.fu-ph .motif{position:absolute;left:1.25rem;bottom:1.25rem;width:4.5rem;color:var(--u-lum);opacity:.8;--motif-trait:1.3px;filter:drop-shadow(0 0 5px var(--u-lum))}
.fu-corps{padding:clamp(1.75rem,3.5vw,3rem)}
.fu-sur{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-vif)}
.fu-t{margin-top:.7rem;font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(2rem,3.4vw,3.25rem);line-height:1.02;color:var(--u-titre);text-wrap:balance}
.fu-t a{text-decoration:none}
.fu-t a:hover{text-shadow:0 0 30px var(--u-lueur)}
.fu-sous{margin-top:.5rem;color:var(--u-texte2)}
.fu-corps .faits{margin-top:1.5rem}
.fu-corps .fiche{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1.5rem;margin-top:1.5rem;font-size:.875rem}
.fu-corps .fiche-avec{grid-column:1/-1}
.fu-actions{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem;margin-top:1.75rem}
.fu-actions .plus{margin-top:0}
.prog-carte{margin-top:clamp(2rem,4vw,3rem)}
.partenaires{max-width:52rem;font-size:1.0625rem;line-height:1.75;color:var(--blanc-doux)}

/* Je représente un établissement scolaire */
.ecole{max-width:54rem;margin-top:clamp(1.75rem,3vw,2.5rem);padding-left:1.5rem;border-left:2px solid var(--e);font-size:clamp(1.125rem,1.45vw,1.3125rem);line-height:1.72;color:var(--blanc-doux)}
.groupe{padding-top:clamp(2.5rem,5vw,4rem)}
.groupe-t{display:flex;align-items:center;gap:.9rem;font-size:.875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.groupe-t::after{content:"";flex:1;height:1px;background:var(--trait)}
.cartes-ac{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,24rem),1fr));gap:clamp(1rem,2vw,1.5rem);margin-top:1.5rem}
.carte-ac{display:flex;flex-direction:column;background:var(--u-fond);color:var(--u-texte);overflow:hidden}
.cac-ph{position:relative;aspect-ratio:16/8;background:#000;overflow:hidden}
.cac-ph img{width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(.85);transition:filter .8s var(--ease)}
.carte-ac:hover .cac-ph img{filter:brightness(.9) saturate(1)}
.cac-ph .motif{position:absolute;right:1rem;top:1rem;width:3.4rem;color:var(--u-lum);opacity:.85;--motif-trait:1.25px;filter:drop-shadow(0 0 4px var(--u-lum))}
.cac-t{margin-bottom:1rem;font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(1.75rem,2.6vw,2.4rem);line-height:1.04;color:var(--u-titre);text-wrap:balance}
.cac-t a{text-decoration:none}
.cac-t a:hover{text-shadow:0 0 28px var(--u-lueur)}
.cac-corps{display:flex;flex-direction:column;flex:1;padding:1.4rem 1.5rem 1.6rem}
.cac-corps .ac-type{font-size:clamp(1.4rem,2.2vw,1.9rem)}
.cac-corps > p:not(.etiq):not(.ac-type):not(.cac-liens),.cac-corps > div:not(.dispositifs){margin-top:1rem;font-size:.9688rem;line-height:1.65}
.cac-corps .formule{margin-top:1rem}
.cac-corps .formule li{font-size:1.0625rem}
.cac-liens{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:auto;padding-top:1.5rem}
.cac-liens .plus{margin-top:0}
.plus--plein{background:var(--u-aplat);border-color:var(--u-aplat);color:var(--u-sur)}
.actions-grille{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2.5rem clamp(2rem,5vw,5rem);align-items:start}
.actions{max-width:48rem;margin-top:2rem;font-size:1.0625rem;line-height:1.75;color:var(--blanc-doux)}
.actions h2,.legal-txt h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:var(--fs-h3);line-height:1.15;color:var(--blanc);margin:2.75rem 0 1.1rem}
.actions > :first-child h2,.legal-txt > :first-child h2{margin-top:0}
.actions li{position:relative;padding-left:1.5rem}
.actions li + li{margin-top:.9rem}
.actions li::before{content:"";position:absolute;left:0;top:.72em;width:.45rem;height:.45rem;border-radius:50%;background:var(--lumiere);box-shadow:0 0 10px 2px color-mix(in srgb,var(--lumiere) 50%,transparent)}
.actions-ph{position:sticky;top:calc(var(--tete) + 1.5rem)}
.actions-ph .grande{width:100%;aspect-ratio:4/3;object-fit:cover}
.actions-ph .mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-top:.5rem}
.actions-ph .mini img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(.2)}
.actions-ph .credit-u{color:var(--gris)}

/* La compagnie : le texte, la rampe des années, le directeur */
.cie{padding-bottom:clamp(2rem,4vw,3rem)}
.cie-txt{max-width:46rem;font-size:1.125rem;line-height:1.75;color:var(--blanc-doux)}
.cie-txt > :first-child{font-size:1.3125rem;line-height:1.65;color:var(--blanc)}
.rampe{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));margin-top:clamp(2.5rem,4.5vw,3.5rem);border-top:1px solid var(--trait-fort)}
.rampe li{min-width:0}
.rampe a,.rampe .rampe-in{position:relative;display:block;height:100%;padding:2rem 1.25rem 1.5rem 0;text-decoration:none;color:var(--blanc)}
.rampe-lampe{position:absolute;top:-.32rem;left:0;width:.6rem;height:.6rem;border-radius:50%;background:var(--c);box-shadow:0 0 12px 2px color-mix(in srgb,var(--c) 45%,transparent);transition:box-shadow .4s}
.rampe-annee{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2rem,3.2vw,2.75rem);line-height:1}
.rampe-t{display:block;margin-top:.6rem;font-family:var(--u-police,var(--sans));font-weight:var(--u-graisse,500);font-size:1.0625rem;line-height:1.3;color:var(--c);transition:color .3s}
.rampe a:hover .rampe-lampe,.rampe a:focus-visible .rampe-lampe{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 0 26px 8px color-mix(in srgb,var(--c) 65%,transparent)}
.rampe a:hover .rampe-t,.rampe a:focus-visible .rampe-t{color:var(--blanc)}
.dir-grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:2rem clamp(2.5rem,6vw,6rem);align-items:start}
.dir-chapeau{margin-top:1.25rem;font-size:1.25rem;color:var(--lumiere)}
.cie-part{padding-bottom:clamp(4rem,8vw,7rem)}
.legal{max-width:52rem;padding-block:clamp(3.5rem,7vw,6rem)}
.legal-txt{margin-top:2.5rem;font-size:1rem;line-height:1.7;color:var(--blanc-doux)}
.legal-txt > * + *{margin-top:1rem}

/* Formulaires */
.form label{display:block;margin-bottom:.45rem;font-size:.875rem;font-weight:600;letter-spacing:.04em;color:var(--blanc-doux)}
.form input:not([type="checkbox"]),.form textarea{width:100%;padding:.85rem 1rem;background:rgba(244,238,233,.04);border:1px solid var(--trait-fort);border-radius:0;color:var(--blanc);transition:border-color .3s,box-shadow .3s}
.form textarea{resize:vertical;min-height:9rem}
.form input:not([type="checkbox"]),.form textarea{background:color-mix(in srgb,var(--blanc) 4%,transparent)}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--lumiere);box-shadow:0 0 0 3px color-mix(in srgb,var(--lumiere) 16%,transparent),0 0 26px color-mix(in srgb,var(--lumiere) 12%,transparent)}
.btn--plein{margin-top:1.75rem;background:var(--blanc);border-color:var(--blanc);color:var(--noir)}
.btn--plein:hover{background:var(--lumiere);border-color:var(--lumiere)}
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:3rem clamp(2.5rem,6vw,6rem);align-items:start;padding-block:clamp(3.5rem,7vw,6rem) clamp(4rem,8vw,7rem)}
.contact-coord{display:flex;flex-direction:column;margin-top:2rem;font-style:normal;color:var(--blanc-doux)}
.contact-nom{font-weight:600;color:var(--blanc)}
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem 1.5rem}
.champ{min-width:0}
.champ--large{grid-column:1/-1}
.consent{display:flex;align-items:flex-start;gap:.75rem;margin-top:1.5rem}
.consent input{flex:none;width:1.15rem;height:1.15rem;margin:.3rem 0 0;accent-color:var(--lumiere)}
.consent label{margin:0;font-size:1rem;font-weight:400;letter-spacing:0}
.calcul{display:flex;align-items:center;gap:.9rem;margin-top:1.25rem}
.calcul label{margin:0;font-size:1rem}
.form .calcul input{width:4.5rem}

/* Pied de page */
.pied{position:relative;z-index:1;background:var(--noir);border-top:1px solid var(--trait);padding-block:clamp(3.5rem,6vw,5.5rem) 2.25rem}
.pied-grille{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,3fr) minmax(0,2fr) minmax(0,5fr);gap:2.5rem 2rem;align-items:start}
.pied-logo{display:block;width:8.5rem;color:var(--lumiere)}
.pied-logo svg{width:100%;height:auto}
.pied-coord{display:flex;flex-direction:column;font-style:normal;color:var(--blanc-doux)}
.pied-nom{font-weight:600;color:var(--blanc)}
.pied-liens li + li{margin-top:.35rem}
.pied-fb{color:var(--blanc-doux)}
.pied-part{font-size:.9375rem;line-height:1.65;color:var(--gris)}
.pied-bas{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem 2rem;margin-top:clamp(2.5rem,5vw,4rem);padding-top:1.5rem;border-top:1px solid var(--trait);font-size:.875rem;color:var(--gris)}
.pied-legal span{white-space:nowrap}
.pied-legal span + span::before{content:"·";margin-inline:.6rem}
.pied-legaux{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem}
.pied-legaux .lien{color:var(--gris)}
.pied-legaux .lien:hover{color:var(--blanc)}
.modifier{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .8rem;background:none;border:1px solid var(--trait-fort);color:var(--gris);font-size:.8125rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:color .3s,border-color .3s,box-shadow .3s}
.modifier::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--lumiere);opacity:.6}
.modifier:hover{color:var(--blanc);border-color:var(--lumiere);box-shadow:0 0 18px color-mix(in srgb,var(--lumiere) 20%,transparent)}
/* le pied : le menu d'abord, puis le contact */
.pied-menu{display:flex;flex-wrap:wrap;gap:.5rem 1.75rem;margin-top:clamp(2rem,4vw,3rem)}
.pied-menu a{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.25rem;line-height:1.3;text-decoration:none;color:var(--blanc)}
.pied-menu a:hover{color:var(--lumiere)}

/* L'édition sur place, dans le noir et la lumière */
.ed-barre{border-radius:2px!important;box-shadow:0 0 0 1px rgba(255,217,168,.16),0 18px 50px rgba(0,0,0,.6),0 0 40px rgba(255,217,168,.1)!important}
.ed-bt{border-radius:2px!important}
.ed-actif .revele .ligne,.ed-actif .scene-accroche.revele{animation:none}

/* ———————————— le mouvement (règle 15) : l'éclairage ; voir le bloc « Mouvement » en tête du script ———————————— */
html{view-transition-name:none}
html.attend-polices body>:not(.intro){visibility:hidden}
main{display:block;min-height:100vh}
/* la salle : entre deux pages, le noir se fait sur la scène (l'en-tête reste éclairé) ; puis la lumière remonte d'un point */
.salle{position:fixed;inset:0;z-index:45;pointer-events:none}
.salle[hidden]{display:none}
.salle-noir{position:absolute;inset:0;background:var(--noir);opacity:0}
/* la lueur : un calque modeste (60vmax, sa lumière va jusqu'au bord) que l'animation agrandit : peu de pixels à peindre */
.salle-spot{position:absolute;left:var(--lx,24%);top:var(--ly,32%);width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,217,168,.3),rgba(255,217,168,.1) 50%,rgba(255,217,168,0));opacity:0;transform:scale(.2)}
/* la pression : la lumière baisse sous le doigt */
:is(.m7,.onglet,.porte,.btn,.plus,.appel,.chip,.idx,.idx-tout,.titre,.pause,.affiche,.fiche-u .fu-t a,.rep a,.carte-ac,.modifier,.sommaire button,.ep-porte,.rs-date,.rs-reserver,.tr7-p,.lc-b,.video).mv-presse{opacity:.72;transform:scale(.985);transition:opacity .08s,transform .08s}
.sai>summary.mv-presse{background:linear-gradient(90deg,color-mix(in srgb,var(--lumiere) 16%,transparent),transparent 70%)}
/* survol et focus : 120 à 200 ms */
.chip,.idx,.idx-tout,.plus,.btn,.date,.rep a,.m7,.onglet{transition-duration:.18s}
/* une ligne vers laquelle la frise mène : la lumière passe sur elle */
.date.est-vise{animation:vise 1.2s var(--ease)}
@keyframes vise{0%,30%{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--lumiere)) 22%,transparent),transparent 80%)}}
.date.est-allume{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--lumiere)) 12%,transparent),transparent 75%)}
.date.est-allume::before{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 16px 4px color-mix(in srgb,var(--c) 55%,transparent)}
.sai.est-allume>summary{background:linear-gradient(90deg,color-mix(in srgb,var(--lumiere) 12%,transparent),transparent 70%)}
.cl .carte-lieu.est-allume .cl-aura{transform:scale(1.8)}
/* une carte de beaucoup de communes : des faisceaux fins, sans halo flou ni pulsation, qui paraissent ensemble */
.cl--fin .cl-faisceau{stroke-opacity:.5;stroke-width:calc(var(--e) * .8)}
.cl--fin.attend .cl-faisceaux{opacity:0}
.cl--fin .cl-faisceaux{transition:opacity 1.2s var(--ease)}
.cl--fin.attend .cl-lieu{opacity:1}
.cl--fin .cl-lieu,.cl--fin .cl-aura{animation:none!important}
/* ———— les frises (FRISE) : la lumière dans le noir ; l'axe est un filet de lumière, chaque date une lampe à la couleur de
   son spectacle (éteinte quand elle est passée), « aujourd'hui » la lumière chaude qui respire ———— */
.frise[data-frise]{--fr-fond:var(--noir);--fr-encre:var(--blanc-doux);--fr-trait:color-mix(in srgb,var(--lumiere) 45%,transparent);--fr-accent:var(--lumiere);--fr-police:var(--sans);
  --fr-bulle-fond:var(--noir2);--fr-bulle-encre:var(--blanc);--fr-point:10px;--fr-couloir:17px;--fr-haut:28px;--fr-taille:12px;--fr-passe:.34;--fr-courbe:var(--ease)}
.frise[data-frise] .frise-axe{height:1px;background:var(--lumiere);box-shadow:0 0 10px 1px color-mix(in srgb,var(--lumiere) 40%,transparent)}
.frise[data-frise] .frise-point>.frise-repere::before{box-shadow:0 0 0 2px var(--fr-fond),0 0 14px 3px color-mix(in srgb,var(--fr-c,var(--lumiere)) 55%,transparent)}
.frise[data-frise] .frise-point.est-passe>.frise-repere::before{box-shadow:0 0 0 2px var(--fr-fond)}
.frise[data-frise] .frise-mois-nom{font-family:var(--serif);font-style:italic;font-weight:600;font-size:.95rem;letter-spacing:0}
.frise[data-frise] .frise-an{font-size:.72rem;font-weight:600;letter-spacing:.14em;color:var(--gris)}
/* les mois et les années : un peu plus bas que les lampes (une lampe groupée, sur l'axe, ne touche pas leur nom) */
.frise[data-frise].frise--mois{--fr-pied:46px}
.frise[data-frise] .frise-mois>li>span:first-child{top:13px}
.frise[data-frise] .frise-aujourdhui::before{width:1px;background:var(--lumiere);box-shadow:0 0 12px 2px color-mix(in srgb,var(--lumiere) 55%,transparent);opacity:1}
.frise[data-frise] .frise-aujourdhui-nom{font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
.frise[data-frise] .frise-bulle{border:1px solid var(--trait-fort);border-radius:0;box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 30px rgba(255,217,168,.12)}
.frise[data-frise] .frise-bulle b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.1rem}
.frise[data-frise] .frise-repere:focus-visible{outline:2px solid var(--lumiere);outline-offset:2px}
/* la prochaine date : sa lampe bat */
.frise[data-frise] :is(.frise-point.est-passe+.frise-point:not(.est-passe),.frise-point:first-child:not(.est-passe))>.frise-repere::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--fr-c,var(--lumiere));opacity:0;animation:prochaine 2.4s ease-out 1.2s infinite;pointer-events:none}
@keyframes prochaine{0%{opacity:.6;scale:1}80%,100%{opacity:0;scale:2.8}}
.frise-hote{min-height:112px;margin-top:clamp(1.5rem,3vw,2.25rem)}
#v-frise{min-height:126px}
.u-corps .frise[data-frise]{--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-trace) 50%,transparent);--fr-accent:var(--u-trace);--fr-bulle-fond:var(--u-fond2);--fr-bulle-encre:var(--u-texte)}
.u-corps .frise[data-frise] .frise-axe{background:var(--u-trace);box-shadow:0 0 10px 1px color-mix(in srgb,var(--u-lueur,#ffd9a8) 70%,transparent)}
.frise-saisons{--fr-bande-h:48px;--fr-haut:20px;--fr-pied:30px}
.frise-saisons .frise-bande-barre{margin:0 3px;background:linear-gradient(0deg,color-mix(in srgb,var(--lumiere) 10%,transparent),var(--lumiere));opacity:.8;box-shadow:0 0 18px color-mix(in srgb,var(--lumiere) 22%,transparent)}
.frise-saisons .frise-bande:is(:hover,.est-allume) .frise-bande-barre{opacity:1;box-shadow:0 0 26px color-mix(in srgb,var(--lumiere) 45%,transparent)}
.frise-saisons .frise-bande-n{font-family:var(--serif);font-style:italic;font-weight:600;font-size:.9rem}
.frise-saisons .frise-bande-nom{font-size:.7rem;letter-spacing:.08em;color:var(--gris)}
.ag-frise{min-height:118px;margin:1.25rem 0 .5rem}
.frise-diffusion{--fr-bande-h:30px;--fr-haut:14px;--fr-pied:26px;--fr-taille:10px}
.frise-diffusion .frise-bande-barre{margin:0 1px;background:var(--u-trace,var(--lumiere));opacity:.85}
.frise-diffusion .frise-bande-nom{opacity:.8;letter-spacing:-.02em}
.diffusion{min-height:92px;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--trait)}
.histoire{min-height:180px;margin-top:clamp(2rem,4vw,3rem)}
.frise-compagnie .frise-etiquette{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1rem}
/* les titres de l'histoire : un couloir par ligne de texte ; le titre d'en bas passe devant le filet de celui d'au-dessus (et devant
   « aujourd'hui ») : le filet s'interrompt derrière lui au lieu de le barrer */
.frise[data-frise].frise-compagnie{--fr-couloir:24px}
.frise-compagnie .frise-point{z-index:calc(10 - var(--fr-y,0))}
.frise-compagnie .frise-etiquette{max-width:13.6em;padding:0 .3em;margin:0 -.3em;background:var(--fr-fond)}
/* l'espace pro : trois portes dans le noir ; la lumière les éclaire au survol */
.ep-portes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.ep-portes li+li .ep-porte{border-left:1px solid var(--trait)}
.ep-porte{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:.9rem;height:100%;min-height:clamp(16rem,42vh,24rem);padding:clamp(1.75rem,3.5vw,3rem) clamp(1.25rem,3vw,2.75rem);overflow:hidden;isolation:isolate;text-decoration:none;color:var(--blanc)}
.ep-porte::after{content:"";position:absolute;left:-20%;right:-20%;top:-12%;height:95%;z-index:-1;background:radial-gradient(48% 62% at 50% 0,color-mix(in srgb,var(--e) 40%,transparent),transparent 72%);mix-blend-mode:screen;opacity:.25;transition:opacity .2s}
.ep-porte:hover::after,.ep-porte:focus-visible::after{opacity:1}
.ep-porte:focus-visible{outline-offset:-6px}
.ep-porte .lampe{width:.75rem;height:.75rem;opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--e) 22%,transparent),0 0 24px 6px color-mix(in srgb,var(--e) 55%,transparent)}
.ep-t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.75rem,2.6vw,2.5rem);line-height:1.06;text-wrap:balance}
.ep-x{max-width:28rem;color:var(--blanc-doux)}
.ep-porte .fl{font-size:1.5rem;color:var(--e)}
.ep-porte:hover .fl,.ep-porte:focus-visible .fl{transform:translateX(.4rem)}
@media (max-width:900px){.ep-portes{grid-template-columns:1fr}.ep-portes li+li .ep-porte{border-left:0;border-top:1px solid var(--trait)}}
/* ———— la gélatine de la saison : sa marque (une lampe à sa couleur), sur l'accueil et sur les saisons ———— */
.gel{flex:none;display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:var(--lumiere);box-shadow:0 0 0 4px color-mix(in srgb,var(--lumiere) 22%,transparent),0 0 18px 4px color-mix(in srgb,var(--lumiere) 55%,transparent)}
.saison0-sur{display:flex;align-items:center;gap:.8rem;color:var(--lumiere)}
.saison0-t{color:var(--blanc)}
.tournee-liste .etiq{margin-bottom:.9rem;color:var(--gris)}

/* ———— les saisons (règle 21) : la saison en cours sous sa marque (sa frise et sa légende, ses prochaines dates, toutes ses dates
   à côté de sa carte), puis les saisons passées, fermées sous leur carte ———— */
.page--saisons .page-tete{padding-bottom:clamp(1.25rem,2.5vw,2rem)}
.s7{padding-block:clamp(1.5rem,3vw,2.5rem) clamp(3.5rem,7vw,6rem);scroll-margin-top:calc(var(--tete) - 2rem)}
.s7-tete{display:flex;flex-wrap:wrap;align-items:baseline;gap:.75rem 1.5rem;padding-bottom:1.1rem;border-bottom:1px solid var(--lumiere);box-shadow:0 14px 24px -22px var(--lumiere)}
.s7-k{display:flex;align-items:center;gap:.7rem;font-size:.8125rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lumiere);order:2}
.s7-t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:var(--fs-h2);line-height:1;letter-spacing:-.01em;color:var(--blanc);text-shadow:0 0 34px color-mix(in srgb,var(--lumiere) 30%,transparent)}
.s7-t:focus{outline:none}
.s7-h{display:flex;align-items:center;gap:.8rem;margin-bottom:1.25rem;font-size:.875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.s7-h::after{content:"";flex:1;height:1px;background:var(--trait)}
/* la frise de la saison et sa légende : chaque spectacle sa lampe, son titre, le nombre de ses dates que le filtre garde */
.fs7{margin-top:clamp(1.25rem,2.5vw,2rem)}
.fs7 .frise-hote{margin-top:0}
.frise[data-frise].frise-saison{--fr-point:12px;--fr-couloir:18px}
.frise[data-frise].est-filtre .frise-point{transition:opacity .2s}
.frise[data-frise].est-filtre .frise-point:not(.est-sp){opacity:.14}
.fs7-leg{display:flex;flex-wrap:wrap;gap:.5rem 1.6rem;margin-top:.4rem;font-size:.9375rem}
/* un titre long passe à la ligne, son nombre à la suite de son dernier mot ; la lampe reste à la hauteur de la première ligne */
.fs7-l{display:inline-flex;align-items:flex-start;gap:.55rem;color:var(--blanc-doux);cursor:default}
.fs7-l i{flex:none;width:.6rem;height:.6rem;margin-top:calc((1lh - .6rem)/2);border-radius:50%;background:var(--c);box-shadow:0 0 10px 2px color-mix(in srgb,var(--c) 45%,transparent)}
.fs7-l b{margin-left:.2em;font-weight:600;font-variant-numeric:tabular-nums;color:var(--gris)}
.fs7-l.est-vide{color:var(--gris)}
.fs7-l.est-vide i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.fs7-sc i{width:.55rem;height:.55rem;border-radius:1px;rotate:45deg;background:var(--blanc);box-shadow:none}
/* les prochaines dates, la carte, toutes les dates */
.ag7{grid-template-areas:"proch carte" "toutes carte";grid-template-rows:auto 1fr;margin-top:clamp(2rem,4vw,3rem);padding-bottom:0}
.ag7-proch{grid-area:proch;min-width:0}
.ag7>.agenda-carte{grid-area:carte}
.ag7-toutes{grid-area:toutes;min-width:0;padding-top:clamp(2.5rem,5vw,4rem)}
.date.est-passe .date-quand,.date.est-passe .date-t,.date.est-passe .date-lieu{color:var(--gris)}
.date.est-passe::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);opacity:1}
.auj7{position:relative;display:flex;align-items:center;gap:.9rem;padding:1rem 0 .9rem 1.6rem;font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--lumiere)}
.auj7::before{content:"";position:absolute;left:.1rem;top:50%;width:.6rem;height:.6rem;margin-top:-.3rem;border-radius:50%;background:var(--lumiere);box-shadow:0 0 0 4px color-mix(in srgb,var(--lumiere) 22%,transparent),0 0 16px 4px color-mix(in srgb,var(--lumiere) 55%,transparent)}
.auj7::after{content:"";flex:1;height:1px;background:var(--lumiere);box-shadow:0 0 10px 1px color-mix(in srgb,var(--lumiere) 40%,transparent)}
.saisons-sec{border-top:1px solid var(--trait);padding-block:clamp(3.5rem,7vw,6rem) clamp(4rem,8vw,7rem)}
.saisons-sec .bloc-titre{margin-bottom:.5rem}
/* ce qui est loin sous le pli (les saisons passées, la troupe) ne se dessine qu'en arrivant à l'écran ; pas les listes de dates :
   leur place estimée ferait sauter la page quand on y saute (une saison où l'on saute est recalée : caler) */
#v-agenda{content-visibility:auto;contain-intrinsic-size:auto 2400px}
.troupe7{content-visibility:auto;contain-intrinsic-size:auto 1500px}

/* ———— réserver une date (règle 17, RESERVER) : une poursuite qui s'allume ————
   Dans une liste, la date d'une ligne est un bouton (le jour, ses heures) ; sa carte se déroule sous la ligne, dans l'univers du
   spectacle. Sur la page d'un spectacle, la bande de ses prochaines dates, puis la carte de la date choisie à côté de la carte de
   la tournée. Choisir une date : la lumière du spectacle s'ouvre sur sa carte depuis la date choisie (::before), le contenu sort
   du noir, « Réserver » s'allume en dernier ; sur la carte voisine, la lampe de la commune s'allume et l'impulsion court depuis
   Rouen. Moins d'animations : un fondu bref. */
.rs-date{position:relative;min-height:44px;padding:.75rem 1.1rem .8rem;border:1px solid var(--trait-fort);background:transparent;color:var(--blanc);transition:border-color .18s,background-color .18s,color .18s,box-shadow .18s}
.rs-date:hover{border-color:var(--c,var(--lumiere));box-shadow:0 0 18px color-mix(in srgb,var(--c,var(--lumiere)) 25%,transparent)}
.rs-date[aria-pressed="true"]{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur);box-shadow:0 0 0 3px color-mix(in srgb,var(--u-aplat) 22%,transparent),0 0 30px color-mix(in srgb,var(--u-lum,var(--lumiere)) 45%,transparent)}
.rs-q{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.0625rem;line-height:1.15}
.rs-n{font-style:normal;font-size:1.6rem;line-height:1}
.rs-h{font-size:.875rem;font-weight:700;letter-spacing:.02em}
.rs-o{font-size:.875rem;color:var(--gris)}
.rs-date[aria-pressed="true"] .rs-o{color:inherit}
/* dans une liste : la date de la ligne */
.rs-date--ligne{width:100%;max-width:12.5rem;margin:-.35rem 0 .2rem -.55rem;padding:.35rem .55rem .45rem;border-color:var(--trait)}
.rs-date--ligne .rs-q{display:block}
.rs-date--ligne .rs-h{color:var(--gris)}
.rs-date--ligne[aria-pressed="true"] .rs-h{color:inherit}
.rs-date--ligne .rs-o{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rs-ici{grid-column:1/-1;margin:.9rem 0 .4rem}
/* la carte de réservation */
.rs-carte{--trait:color-mix(in srgb,var(--u-texte,var(--blanc)) 18%,transparent);--trait-fort:color-mix(in srgb,var(--u-texte,var(--blanc)) 34%,transparent);background:var(--u-fond,var(--noir2));color:var(--u-texte,var(--blanc));box-shadow:0 0 0 1px color-mix(in srgb,var(--u-trace,var(--lumiere)) 45%,transparent),0 30px 70px -36px var(--u-lueur,rgba(0,0,0,.6))}
.rs-carte::before{content:"";position:absolute;z-index:-1;left:-14%;top:-55%;width:min(30rem,85%);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--u-lum,var(--chaud)) 26%,transparent),transparent);opacity:.6;pointer-events:none;transform-origin:center}
.rs-carte:empty{display:none}
.rs-photo{width:46%;opacity:.26;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%)}
.rs-c{position:relative;display:grid;justify-items:start;gap:.45rem;max-width:38rem;padding:clamp(1.25rem,2.6vw,1.9rem) clamp(1.1rem,2.4vw,1.75rem) clamp(1.25rem,2.6vw,1.75rem)}
.rs-sp{font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.05;color:var(--u-titre,var(--blanc))}
.rs-sp a{text-decoration:none}
.rs-sp a:hover{text-shadow:0 0 26px var(--u-lueur,transparent)}
.rs-quand{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.25rem;line-height:1.25}
.rs-etat{font-family:var(--sans);font-style:normal;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--u-vif,var(--lumiere))}
.rs-ou{color:var(--u-texte2,var(--gris))}
.rs-lieu{font-weight:600;color:var(--u-texte,var(--blanc))}
.rs-det{padding-left:1.1rem;font-size:.9375rem;color:var(--u-texte2,var(--gris));list-style:disc}
.rs-seances{margin-top:.4rem}
.rs-k{margin-bottom:.45rem;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-texte2,var(--gris))}
.rs-seance{padding:.35rem .8rem;border:1px solid var(--trait-fort);font-size:.9375rem;color:inherit;text-decoration:none}
a.rs-seance:hover{border-color:var(--u-trace,var(--lumiere));box-shadow:0 0 16px color-mix(in srgb,var(--u-trace,var(--lumiere)) 25%,transparent)}
.rs-sh{font-weight:700}
.rs-scol{font-style:normal;font-size:.6875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.rs-action{margin-top:.9rem}
.rs-reserver{padding:1rem 1.4rem 1rem 1.6rem;background:var(--u-aplat,var(--blanc));color:var(--u-sur,var(--noir));font-weight:700;transition:box-shadow .3s var(--ease)}
.rs-reserver:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--u-aplat,var(--blanc)) 22%,transparent),0 14px 40px -8px var(--u-lueur,rgba(0,0,0,.4))}
.rs-r1{font-size:1.125rem;line-height:1.15}
.rs-r2{font-size:.8125rem;font-weight:600;line-height:1.35}
.rs-aupres{display:inline-block;padding:.8rem 1.1rem;border:1px dashed var(--trait-fort);font-weight:600}
/* sur la page d'un spectacle : la bande, puis la carte et la carte de la tournée côte à côte */
.rs-zone{min-width:0}
.rs-k-bande{margin-bottom:.8rem}
.rs-bande{gap:.6rem;padding:2px 2px .8rem}
.rs-bande .rs-date{min-width:9.5rem}
.rs-corps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(1.25rem,3vw,2.5rem);align-items:start;margin-top:1rem}
.rs-corps .rs-carte{background:var(--u-fond2,var(--noir2))}
.rs-reste{margin-top:2rem}

/* ———— les vidéos (règle 18, LECTEUR) : l'affiche dans le noir, le bouton de lecture une lampe de l'univers ; la vidéo
   s'allume (elle sort du noir) ; « assombrir » : le noir se fait dans la salle ———— */
.u-video{margin-top:.25rem}
.lc-cadre{background:#000;box-shadow:0 0 0 1px var(--trait),0 40px 90px -40px var(--u-lueur,rgba(0,0,0,.6))}
.lc-lire::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,8,9,.8),rgba(11,8,9,0) 55%);pointer-events:none}
.lc-affiche{filter:brightness(.72) saturate(.9);transition:filter .6s var(--ease)}
.lc-lire:hover .lc-affiche,.lc-lire:focus-visible .lc-affiche{filter:brightness(.95) saturate(1)}
.lc-icone{z-index:1;width:5.25rem;height:5.25rem;background:var(--u-aplat,var(--blanc));color:var(--u-sur,var(--noir));box-shadow:0 0 0 8px color-mix(in srgb,var(--u-aplat,#fff) 18%,transparent),0 0 50px var(--u-lueur,rgba(255,217,168,.35));transition:scale .35s var(--ease)}
.lc-icone svg{margin-left:.2rem}
.lc-lire:hover .lc-icone,.lc-lire:focus-visible .lc-icone{scale:1.06}
.lc-lire:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.lc-titre{z-index:1;left:1.4rem;right:1.4rem;bottom:1.1rem;font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.15;color:#f4eee9;text-shadow:0 0 18px rgba(0,0,0,.6)}
.lc-outils{gap:.6rem;margin-top:1rem}
.lc-b{min-height:44px;padding:.55rem 1rem;border:1px solid var(--trait-fort);background:transparent;color:var(--u-texte,var(--blanc));font-weight:600;font-size:.9375rem;transition:border-color .2s,box-shadow .2s}
.lc-b:hover{border-color:var(--u-trace,var(--lumiere));box-shadow:0 0 18px color-mix(in srgb,var(--u-trace,var(--lumiere)) 25%,transparent)}
.lc-eteint .lc-b{color:#f4eee9;border-color:rgba(244,238,233,.35)}
.lc-g{margin-top:2.5rem;font-size:.875rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-texte2,var(--gris))}
.lc-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:1.25rem;margin-top:1rem}
.lc-grille .lc-icone{width:3.6rem;height:3.6rem;box-shadow:0 0 0 5px color-mix(in srgb,var(--u-aplat,#fff) 18%,transparent)}
.lc-grille .lc-titre{left:1rem;right:1rem;bottom:.8rem;font-size:1.05rem}
.lc-nuit{background:var(--video-voile)}
.lc-boite .lc-b,.lc-boite .lc-fermer{color:#f4eee9;border-color:rgba(244,238,233,.35)}
.lc-fermer{align-items:center;gap:.5rem;min-height:44px;padding:.55rem 1rem;border:1px solid rgba(244,238,233,.35);background:transparent;font:600 .9375rem var(--sans);cursor:pointer}

/* ———— la page d'un spectacle qui n'est plus en tournée (règle 21) : sa présentation, le bilan de ses dates (ses chiffres, la frise
   de sa tournée, ses dates par saison à côté de la grande carte de ses lieux), les actions culturelles menées ———— */
.bilan7-rep{margin-top:-.4rem;font-size:clamp(1.15rem,1.6vw,1.375rem);font-style:italic;color:var(--u-texte2)}
.bilan7-n{display:flex;flex-wrap:wrap;gap:1.5rem clamp(2rem,6vw,5rem);margin-top:clamp(1.5rem,3vw,2.25rem)}
.bilan7-n li{display:grid;gap:.35rem}
.bilan7-n b{font-family:var(--u-police,var(--serif));font-weight:var(--u-graisse,600);font-size:clamp(3rem,7vw,5.25rem);line-height:.9;font-variant-numeric:lining-nums tabular-nums;color:var(--u-titre);text-shadow:0 0 40px var(--u-lueur)}
.bilan7-g{margin-top:clamp(2rem,4vw,3rem)}
.bilan7-g .carte-boite--seule{margin-bottom:clamp(2rem,4vw,3rem)}
.bl7-s+.bl7-s{margin-top:2.25rem}
.bl7-t{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--u-trace);font-family:var(--u-police,var(--serif));font-style:var(--u-style,italic);font-weight:var(--u-graisse,600);font-size:var(--fs-h3);line-height:1.1;color:var(--u-titre)}
.bl7-t small{font-family:var(--sans);font-style:normal;font-size:.875rem;font-weight:600;letter-spacing:.14em;color:var(--u-texte2)}
.bilan7-dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.5rem clamp(2rem,5vw,4rem)}
.bl7-s{min-width:0;content-visibility:auto;contain-intrinsic-size:auto 480px}
.sp-seule .actions7 .ac-type{margin-top:0}

/* ———— la troupe (règle 20, TROUPE) : un plan de feux ————
   La pieuvre de la compagnie tient la perche, à la gélatine de la saison ; à chaque métier sa lampe (son icône) accrochée à la
   perche, son faisceau qui descend sur ceux qui le font. Une personne survolée ou choisie s'allume partout où elle est, et ses
   places sont reliées (TROUPE.relier, des liens de lumière). À l'arrivée de la troupe à l'écran, les lampes s'allument l'une
   après l'autre et les faisceaux s'ouvrent ; les noms, eux, sont là d'emblée. */
.troupe7{padding-top:clamp(3.5rem,7vw,6rem)}
.tr7{--troupe-lien:var(--lumiere);--troupe-ic-fond:var(--noir);--troupe-ventouse-fond:var(--noir);position:relative;margin-top:clamp(2rem,4vw,3rem)}
.tr7-source{position:relative;z-index:2;width:clamp(7rem,12vw,10rem);margin:0 auto -1.1rem;color:var(--lumiere);filter:drop-shadow(0 0 16px color-mix(in srgb,var(--lumiere) 45%,transparent))}
.tr7-source svg{width:100%;height:auto}
.tr7-cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 clamp(.75rem,1.4vw,1.5rem);border-top:1px solid var(--lumiere);box-shadow:0 -1px 14px -6px var(--lumiere)}
.tr7-cat{position:relative;z-index:2;min-width:0;padding-top:1.4rem;isolation:isolate}
/* le faisceau de la lampe : un cône qui descend sur les noms */
.tr7-cat::before{content:"";position:absolute;z-index:-1;left:-6%;right:-6%;top:3.2rem;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--lumiere) 18%,transparent),transparent 82%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);pointer-events:none;transform-origin:50% 0}
.tr7-t{display:grid;justify-items:center;gap:.65rem;text-align:center;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.1875rem;line-height:1.15;color:var(--blanc);text-wrap:balance}
.tr7-t::before{content:"";position:absolute;left:50%;top:0;width:1px;height:1.4rem;background:var(--trait-fort)}
.tr7-lampe{display:grid;place-items:center;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--noir);border:1px solid color-mix(in srgb,var(--lumiere) 55%,transparent);color:var(--lumiere);font-size:14px;box-shadow:0 0 0 4px color-mix(in srgb,var(--lumiere) 12%,transparent),0 10px 30px -6px color-mix(in srgb,var(--lumiere) 55%,transparent)}
.tr7-places{display:grid;gap:.15rem;margin-top:1.1rem}
.tr7-p{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.65rem;width:100%;min-height:44px;padding:.35rem .4rem;border:0;border-bottom:1px solid var(--trait);background:transparent;color:var(--blanc-doux);font:inherit;text-align:left;cursor:pointer;transition:color .18s,background-color .18s,box-shadow .18s}
.tr7-p:hover,.tr7-p.est-allume{color:var(--blanc);background:linear-gradient(90deg,color-mix(in srgb,var(--lumiere) 16%,transparent),transparent 85%)}
.tr7-p[aria-pressed="true"]{color:var(--blanc);background:linear-gradient(90deg,color-mix(in srgb,var(--lumiere) 26%,transparent),transparent 90%);box-shadow:inset 2px 0 0 var(--lumiere)}
.tr7-v{width:2.5rem;height:2.5rem;overflow:hidden;border-radius:50%;background:var(--noir2);box-shadow:0 0 0 1px var(--trait-fort)}
.tr7-v img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.tr7-p:is(:hover,.est-allume,[aria-pressed="true"]) .tr7-v{box-shadow:0 0 0 2px var(--lumiere),0 0 16px 2px color-mix(in srgb,var(--lumiere) 50%,transparent)}
.tr7-pt{width:.5rem;height:.5rem;margin-inline:.25rem;border-radius:50%;background:var(--lumiere);opacity:.55}
.tr7-p:is(:hover,.est-allume,[aria-pressed="true"]) .tr7-pt{opacity:1;box-shadow:0 0 12px 3px color-mix(in srgb,var(--lumiere) 55%,transparent)}
.tr7-qui{display:grid;min-width:0;line-height:1.25}
.tr7-nom{font-weight:600;font-size:.9375rem;overflow-wrap:anywhere}
.tr7-m{font-size:.8125rem;color:var(--gris)}
.tr7-m span+span::before{content:" · "}
.tr7-p:is(:hover,.est-allume,[aria-pressed="true"]) .tr7-m{color:var(--blanc-doux)}
.troupe7 + .bloc{padding-top:clamp(3.5rem,7vw,6rem)}

/* le jour, la lumière ne rayonne pas sur le papier : les halos s'éteignent (ils restent la nuit) ; la couleur d'une entrée passe à
   sa version sombre, lisible sur le papier */
html[data-theme="jour"] :is(.marque-pieuvre,.tr7-source){filter:none}
html[data-theme="jour"] .s7-t{text-shadow:none}
html[data-theme="jour"] .s7-tete{box-shadow:none}

/* ———— le pied, l'espace pro, les pages qui en dépendent ———— */
.fil7{display:flex;align-items:center;gap:.8rem}
.fil7 a{color:var(--gris);text-decoration:none}
.fil7 a:hover{color:var(--blanc)}
.ep-pages + .ep-portes{margin-top:clamp(1.25rem,2.5vw,2rem)}
/* le dossier composé : la lumière le traverse une fois */
.dos-bt.dos-pret::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,250,240,.55),transparent);transform:translateX(-100%);animation:balaye .7s var(--ease) both}
@keyframes balaye{to{transform:translateX(100%)}}
/* ce qui attend sa suite (sous le pli) garde la hauteur d'un écran : rien de visible ne bouge quand elle se remplit */
[data-suite-attend]{min-height:100vh}

/* L'ouverture, habillée : le noir, une photo à peine éclairée, le logo blanc */
.intro.m07-intro .intro-image{opacity:.42}
.intro.m07-intro::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 58% at 50% 47%,rgba(11,8,9,0) 0,rgba(11,8,9,.3) 46%,rgba(11,8,9,.93) 100%)}
.intro.m07-intro .intro-indice,.intro.m07-intro .intro-logo{z-index:1}
.intro.m07-intro .intro-indice{color:var(--chaud)}
/* le jour : la salle éclairée, la photo plus pâle, le bord qui s'éclaire au lieu de s'assombrir */
html[data-theme="jour"] .intro.m07-intro .intro-image{opacity:.28}
html[data-theme="jour"] .intro.m07-intro::after{background:radial-gradient(ellipse 62% 58% at 50% 47%,rgba(243,238,231,0) 0,rgba(243,238,231,.3) 46%,rgba(243,238,231,.9) 100%)}
html[data-theme="jour"] .intro.m07-intro .intro-indice{color:var(--lumiere)}

<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header class="tete" id="tete">
  <div class="tete-in wrap" id="tete-in">
    <a class="marque" id="marque" href="#/">
      <span class="marque-pieuvre" id="marque-pieuvre" data-pieuvre aria-hidden="true"></span>
      <span class="marque-mot" id="marque-mot" aria-hidden="true"></span>
    </a>
    <nav class="menu7" id="menu7"></nav>
    <span class="jn7" id="jn7"></span>
  </div>
</header>
<main id="contenu" tabindex="-1"></main>
<footer class="pied" id="pied"></footer>
<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : l'éclairage. Le noir de la salle, puis la lumière : rien n'apparaît d'un coup, tout s'allume ; une courbe douce
     (cubic-bezier(.22, .61, .36, 1)) ; 450 ms au plus pour ce qui accompagne un geste ; seuls transform et opacity bougent.
     1. Changer de page : le noir se fait sur la scène (60 ms ; l'en-tête reste éclairé), la nouvelle page est posée dans le noir,
        puis la lumière remonte : une lueur chaude s'ouvre depuis un point (le titre, ou la photo d'une scène) et la salle
        s'éclaire (320 ms ; du geste à la salle éclairée, moins de 450 ms). Sur la scène d'un spectacle, la lumière s'ouvre depuis
        la photo et son titre s'allume ligne à ligne, dans le sens de la lumière ; la poursuite prend la main une fois la salle
        éclairée. Un nouveau geste interrompt tout (le noir et la lumière sont annulés, la page se pose aussitôt).
     2. Ouvrir une saison : ses dates s'allument l'une après l'autre (cascade), les faisceaux de sa carte partent de Rouen.
     3. Filtrer, chercher : les dates gardées glissent à leur place (MOUVEMENT.flip), les lampes des communes sans date
        s'éteignent, les repères de la frise glissent.
     4. Survol et focus : 180 ms ; une ligne survolée allume sa lampe sur la carte et son repère sur la frise, et inversement.
     5. Pression : la lumière baisse sous le doigt, dès le pointerdown (MOUVEMENT.presse).
     6. Défilement (MOUVEMENT.reveler) : les titres montent du noir, les affiches s'allument l'une après l'autre.
     7. Ce qui vit : la poursuite suit la main sur la scène ; « EN TOURNÉE », le statut d'un spectacle, veille (une lampe qui
        respire) ; « aujourd'hui » respire et la lampe de la prochaine date bat sur chaque frise. Rien d'autre ne bouge au
        repos (une page immobile n'occupe pas le processeur).
     Les frises (FRISE) s'allument dans le noir : l'axe est un filet de lumière, chaque date une lampe à la couleur de son
     spectacle (éteinte quand elle est passée) : la saison (voir, reliée à la liste et à la carte), les saisons (leur densité),
     une saison passée, la tournée d'un spectacle, les dates scolaires, la diffusion saison par saison (programmer, chaque
     fiche, l'onglet programmer), l'histoire de la compagnie.
     Réserver une date (règle 17, RESERVER) : une poursuite qui s'allume. La lumière du spectacle s'ouvre sur la carte de la
     date choisie depuis son bouton, le contenu sort du noir, « Réserver » s'allume en dernier ; sur la carte des tournées
     voisine, la lampe de la commune s'allume et l'impulsion court de Rouen jusqu'à elle.
     Les vidéos (règle 18, LECTEUR) : la vidéo s'allume (elle sort du noir) ; « assombrir », le noir se fait dans la salle.
     Le jour et la nuit (règle 19, THEME) : le cercle de l'outil, depuis la lampe du bouton.
     La troupe (règle 20, TROUPE) : un plan de feux ; à son arrivée, les lampes des métiers s'allument l'une après l'autre et
     leurs faisceaux s'ouvrent sur les noms ; une personne survolée s'allume partout où elle est.
     La pieuvre : aucun moment (la lumière est le seul geste). Moins d'animations demandé (ou ?anim=0) : tout est posé. */
  const doc = document, root = doc.documentElement;
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  // la première vue attend les polices (au plus 900 ms) : rien ne saute quand elles arrivent (sous l'ouverture, c'est invisible)
  if (doc.fonts && doc.fonts.load) {
    const fin = () => root.classList.remove('attend-polices');
    root.classList.add('attend-polices');
    Promise.race([Promise.all(['400 1em Figtree', '600 1em Figtree', 'italic 600 1em "Bodoni Moda"'].map(f => doc.fonts.load(f).catch(() => null))),
      new Promise(r => setTimeout(r, 900))]).then(fin, fin);
  }
  // la largeur de la fenêtre, lue une fois avant chaque rendu (au téléphone, lire innerWidth après un changement de la page
  // recalcule toute sa mise en page)

  /* ---------- Spectacles : un titre éclaire sa photo, en grand derrière la liste ---------- */
  function pageSpectacles() {
    return `<div class="page page--rep">
      <div class="rep-fond" aria-hidden="true">${D.shows.map((s, i) => `<div class="rep-ph${i ? '' : ' on'}" data-i="${i}"><img class="ph" src="${photo(s.slug)}" alt="" style="object-position:${cadrage(s)}" decoding="async">${teinte(s).k.lueur ? `<i class="rep-teinte" style="background:${esc(teinte(s).k.lueur)}"></i>` : ''}</div>`).join('')}<div class="rep-ombre"></div><div class="grain"></div></div>

        </a></li>`).join('')}</ol></div>
      </div>

  function brancherRep() {
    const rep = $('#rep', main), calques = $$('.rep-ph', main);
    if (!rep) return;
    // chaque photo et sa gélatine (la couleur du spectacle) passent sur la précédente en fondu d'opacité : rien n'est repeint
    const voir = i => calques.forEach(c => c.classList.toggle('on', +c.dataset.i === i));
    $$('a[data-i]', rep).forEach(a => {
      const i = +a.dataset.i;
      a.addEventListener('mouseenter', () => { voir(i); rep.classList.add('survol'); a.classList.add('on'); });
      a.addEventListener('mouseleave', () => { rep.classList.remove('survol'); a.classList.remove('on'); });
      a.addEventListener('focus', () => voir(i));
    });
  }

  /* ---------- La page d'un spectacle : sa lumière éclaire le noir ; trois onglets, un par entrée ---------- */
  const credits = (s, phs) => {
    const dossier = phs.some(p => p.source === 'dossier'), autres = phs.some(p => p.source !== 'dossier');
    const c = [autres && s.creditPhotos ? `<span${ed(`shows.${s.slug}.creditPhotos`)}>${esc(s.creditPhotos)}</span>` : '', dossier && s.creditDossier ? `<span${ed(`shows.${s.slug}.creditDossier`)}>${esc(s.creditDossier)}</span>` : ''].filter(Boolean);
    return c.length ? `<p class="credit-u">${c.join('<span aria-hidden="true"> · </span>')}</p>` : '';
  };
  const photosDe = (s, garde) => (s.photos || []).map((p, i) => ({ ...p, i })).filter(p => D.photos[p.cle] && garde(p));
  function cartons(s, phs, seul) {
    return `<div class="cartons">${phs.map(p => `<figure class="carton${seul ? ' carton--seul' : ''}"><img src="${D.photos[p.cle]}" alt="${esc(p.legende || s.titre)}" loading="lazy" decoding="async" data-edit-photo="shows.${esc(s.slug)}.photos.${p.i}">${p.legende ? `<figcaption${ed(`shows.${s.slug}.photos.${p.i}.legende`)}>${esc(p.legende)}</figcaption>` : ''}</figure>`).join('')}</div>${credits(s, phs)}`;
  }
  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu
  const portrait = ({ e, p, lignes }, credits) => {
    const nom = nomDe(p), k = `personnes.${e.personne}`;
    return `<figure class="cast-pt"><span class="cast-cadre" data-edit-photo="${esc(k)}.photo"><span class="cast-mono" aria-hidden="true"><b>${esc(initiales(p))}</b></span>${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(nom)}" width="320" height="400" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span>
      <figcaption>${credits ? `<small class="cast-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="cast-nom"><span${ed(`${k}.prenom`)}>${esc(p.prenom)}</span> <span${ed(`${k}.nom`)}>${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="cast-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="cast-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];
    L.forEach((x, i) => {
      if (pris.has(i)) return; pris.add(i);
      const j = x.e.alternance ? L.findIndex((y, k) => !pris.has(k) && x.e.alternance.includes(nomDe(y.p))) : -1;   // « en alternance avec … » : par deux
      if (j < 0) blocs.push(`<li>${portrait(x, credits)}</li>`);
      else { pris.add(j); blocs.push(`<li class="cast-paire">${portrait(x, credits)}${portrait(L[j], credits)}</li>`); }
    });
    return `<ul class="cast" style="--n:${L.length}${pris.size > blocs.length ? ';--pw:8.25rem' : ''}">${blocs.join('')}</ul>`;   // avec des paires : de quoi en tenir trois sur une ligne
  }
  function distribution(s, sansDuree, avecPortraits) {
    const slug = s.slug, P = s.programmer || {}, cast = avecPortraits ? portraits(s) : '';   // les portraits remplacent la ligne « avec »
    const equipe = (P.equipeCreation || []).map((l, i) => `<li class="fiche-l"${ed(`shows.${slug}.programmer.equipeCreation.${i}`)}>${esc(l)}</li>`).join('');
    return `${cast}<div class="distrib">
      <ul class="fiche">${ficheLignes(s, !!cast)}${equipe}</ul>
      <div>
        ${s.duree && !sansDuree ? `<p class="duree"${ed(`shows.${slug}.duree`)}>${esc(s.duree)}</p>` : ''}

        ${(s.mentions || []).map((m, i) => `<p class="mention"${ed(`shows.${slug}.mentions.${i}`)}>${m}</p>`).join('')}

      </div>

  }
  // la carte et les dates tout public ; sans date à venir, les tournées passées ; en création, l'annonce. Réserver (règle 17) : les
  // prochaines dates où l'on peut réserver en une bande, un bouton par date (le jour, les heures, la commune) ; la prochaine est
  // choisie d'office, sa carte dessous, à côté de la carte de la tournée, où sa lampe s'allume
  function chapitreDates(s, pub) {
    const C = CARTE.spectacle(s.slug), slug = s.slug;
    const res = RS && !s.statut ? RS.dates(slug) : [];
    if (res.length) {

          <div class="rs-corps"><div class="rs-carte" id="rs-carte"></div>${boiteCarte({ lieux, passe: C.passe, teinte: true, titre: LIB.actuellementEnTournee, defaut: res[0].l })}</div>

      </div>` };

    if (C.passe.length) return { titre: esc(LIB.lieuxDiffusion), html: `<div class="frise-hote" id="u-tournee"></div>${boiteCarte({ lieux: C.passe, teinte: true, souvenir: true, seule: true, titre: s.titre, defaut: C.passe[0].l })}${vide}` };
    return { titre: esc(LIB.dates), html: vide };
  }
  // ses dates passées, toutes saisons : [{ k (la saison), titre, rows }], la plus récente d'abord, et dans chaque saison de la plus
  // récente à la plus ancienne (une ligne sans date reste à la suite de la précédente)
  function datesPassees(s) {
    return retenu(`passees:${s.slug}`, () => {
      const out = [];
      Object.keys(D.saisons || {}).sort().reverse().forEach(k => {
        const SA = D.saisons[k], rows = []; let i = 0;
        (SA.spectacles || []).forEach(g => { let prev = null; (g.dates || []).forEach(d => {
          const n = i++; if (g.slug !== s.slug) return;
          let fin = cleDate(d, k); if (fin) prev = fin; else fin = prev;
          if (fin && fin >= D.aujourdhui) return;   // une date à venir n'est pas au bilan
          rows.push({ d, g, k: fin || '', saison: k, i: n, fid: cleLigne(d, k, n), suite: false, titre: s.titre, cle: s.slug });
        }); });
        if (rows.length) out.push({ k, titre: SA.titre, rows: rows.sort((a, b) => (a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i)) });
      });
      return out;
    });
  }
  // le bilan (règle 21) : les chiffres tirés des données (ses représentations ; ses dates jouées, ses communes, ses saisons), la frise de
  // sa tournée, la grande carte de tous ses lieux, aux faisceaux de son univers, et ses dates par saison
  function bilanHtml(s) {
    const G = datesPassees(s); if (!G.length) return '';
    const P = s.programmer || {}, jouees = G.flatMap(g => g.rows).filter(r => !annulee(r.d)), C = CARTE.spectacle(s.slug);
    const chiffres = [[jouees.length, LIB.dates], [new Set(jouees.map(r => r.d.l).filter(l => l != null)).size, LIB.communes], [new Set(jouees.map(r => r.saison)).size, LIB.saisons]].filter(([n, l]) => n && l);
    return (P.representations ? `<p class="bilan7-rep"${ed(`shows.${s.slug}.programmer.representations`)}>${esc(P.representations)}</p>` : '')

  // les actions culturelles menées : son action culturelle (sans texte, « à compléter » : la rubrique ne paraît pas), et ses dates

  // l'onglet « voir » d'un spectacle en tournée ; seule : la page unique d'un spectacle qui ne l'est plus (sa présentation, sa

  function ongletVoir(s, pub, seule = false) {

  function ficheTechnique(s, B) {

  function ongletProgrammer(s) {

  // l'agenda passé et tous les lieux : calculés d'avance, quand le navigateur est libre (le geste n'a plus qu'à les lire)
  const davance = () => { relire(); retenu('agendaPasse', agendaPasse); retenu('tout', () => CARTE.tout()); };
  if ('requestIdleCallback' in window) requestIdleCallback(davance, { timeout: 1500 }); else setTimeout(davance, 600);
  // la base de la compagnie : à chaque enregistrement, D change en place et la vue courante est refaite en place
  // (une vidéo chargée, règle 18 : la vue ne se refait pas sous elle, elle s'arrêterait ; on y revient quand elle ne l'est plus)
  let plusTard = 0;
  const refaire = () => { clearTimeout(plusTard); if (LC && LC.actif()) { plusTard = setTimeout(refaire, 2500); return; } router(true); };
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(refaire);

  /* L'ouverture : le noir (le jour, la salle éclairée), une photo à peine éclairée, la pieuvre blanche sur sa tache à la couleur de
     la saison (règle 22) ; elle grossit et la scène s'allume */
  const premiere = diapos()[0];
  INTRO.ouvrir({
    fond: root.dataset.theme === 'jour' ? IVOIRE : NOIR,
    image: premiere ? photo(premiere.slug) : undefined,
    encre: '#ffffff', tache: true,
    classe: 'm07-intro',
    apres: () => {
      const sc = $('.scene--accueil', main);
      if (!sc || !doux()) return;
      sc.classList.remove('allumage'); requestAnimationFrame(() => sc.classList.add('allumage'));
    },
  });
})();
</script>
</body>
</html>
