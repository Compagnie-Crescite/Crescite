  }

  /* ---------- Les lignes de date, telles quelles ---------- */
  const MOIS = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}/gi;
  const moisDe = d => ((d.ligneDate || '').match(MOIS) || [d.ligneDate || '']).pop();
  const detail = x => `<p class="date-d">${x.lien ? `<a class="lien" ${ext(x.lien)}>${esc(x.texte)}</a>` : esc(x.texte)}</p>`;
  // titre : le titre du spectacle (dans sa police) mène à sa page, dans l'entrée où l'on lit ; tag : « Scolaire »
  function uneDate(d, { titre = true, hn = 3, entree = null, tag = false } = {}) {
    const s = PAR_SLUG[d.slug];
    const st = titre ? (s ? styleMini(s) : `--c:${LUM}`) : '';
    return `<li class="date"${d.l != null ? ` data-l="${d.l}"` : ''} data-date-id="${esc(d.id ?? '')}"${st ? ` style="${esc(st)}"` : ''}>
      <div class="date-a"><p class="date-quand">${esc(d.ligneDate)}</p><p class="date-ou">${esc(d.ligneLieu)}</p>${tag && d.scolaire ? `<p class="date-tag">${esc(LIB.scolaire)}</p>` : ''}</div>
      <div class="date-b">${titre ? `<h${hn} class="date-t">${s ? `<a href="${lienSp(d.slug, entree)}">${esc(d.titre)}</a>` : esc(d.titre)}</h${hn}>` : ''}${(d.details || []).map(detail).join('')}</div>
    </li>`;
  }
  function parMois(liste, o = {}) {
    const g = [];
    liste.forEach(d => { const m = moisDe(d); if (!g.length || g[g.length - 1].m !== m) g.push({ m, l: [] }); g[g.length - 1].l.push(d); });
    return g.map(x => `<div class="mois"><h2 class="mois-t">${esc(x.m)}</h2><ol class="dates">${x.l.map(d => uneDate(d, o)).join('')}</ol></div>`).join('');
  }

  /* ---------- La scène : la photo plein écran, le halo qui suit la main ---------- */
  function visuel(src, focale, credit, double, edPhoto) {
    const img = on => `<img class="ph${on ? ' on' : ''}"${on ? ` src="${src}"` : ''} alt="" style="object-position:${focale}% 35%" decoding="async"${on && edPhoto ? ` data-edit-photo="${esc(edPhoto)}"` : ''}>`;
    return `<div class="scene-visuel">${img(true)}${double ? img(false) : ''}<div class="spot" aria-hidden="true"></div><div class="ombre" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>${credit ? `<p class="credit">${esc(credit)}</p>` : ''}</div>`;
  }
  function halo(sc) {
    const spot = $('.spot', sc);
    let x = 50, y = 40, tx = 50, ty = 40, raf = 0;
    const poser = () => { spot.style.setProperty('--sx', x.toFixed(2) + '%'); spot.style.setProperty('--sy', y.toFixed(2) + '%'); };
    const repos = () => { x = tx = +(sc.dataset.focale || 50); y = ty = 38; poser(); };
    const boucle = () => {
      x += (tx - x) * .1; y += (ty - y) * .1; poser();
      raf = Math.abs(tx - x) + Math.abs(ty - y) > .05 ? requestAnimationFrame(boucle) : 0;
    };
    repos();
    sc.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || !souris.matches || reduit.matches || mobile.matches) return;
      const r = sc.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width * 100; ty = (e.clientY - r.top) / r.height * 100;
      sc.classList.add('lumiere');
      if (!raf) raf = requestAnimationFrame(boucle);
    });
    sc.addEventListener('pointerleave', () => sc.classList.remove('lumiere'));
    nettoyer.push(() => cancelAnimationFrame(raf));
    return { repos: () => { if (!sc.classList.contains('lumiere')) { cancelAnimationFrame(raf); raf = 0; repos(); } } };
  }

  /* ---------- Accueil : le bandeau d'origine, une photo à la fois, chaque titre dans la police de son spectacle ---------- */
  let actif = 0, pauseVoulue = false;
  const ICO_PAUSE = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="2.6" height="10"/><rect x="7.4" y="1" width="2.6" height="10"/></svg>';
  const ICO_LIRE = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.2v9.6L10.6 6z"/></svg>';
  const diapos = () => (S.diaporama || []).filter(x => D.photos[x.slug]);
  const prochainePublique = slug => D.dates.find(d => d.slug === slug && !d.scolaire) || null;
  function texteScene(x) {
    const s = PAR_SLUG[x.slug], p = s ? (prochainePublique(s.slug) || s.prochaine) : null;
    return `<p class="scene-sur">${esc(x.surtitre)}</p>
      <h2 class="scene-titre">${x.titre.map(l => `<span class="ligne">${esc(l)}</span>`).join('')}</h2>

      <a class="btn" href="${esc(x.href)}">${esc(x.bouton)} ${FL}</a>`;
  }
  const styleDiapo = x => PAR_SLUG[x.slug] ? styleMini(PAR_SLUG[x.slug]) : `--c:${LUM}`;
  function sceneAccueil(slides) {
    const x = slides[actif], s = PAR_SLUG[x.slug];
    return `<section class="scene scene--accueil" id="scene" aria-label="${esc(x.surtitre)}" data-focale="${s ? s.focale ?? 50 : 50}" style="${esc(styleDiapo(x))}">
      ${visuel(photo(x.slug), s ? s.focale ?? 50 : 50, x.credit, true)}
      <div class="scene-corps wrap"><div class="scene-txt" id="scene-panneau" role="tabpanel" aria-labelledby="titre-${actif}">${texteScene(x)}</div></div>
      <div class="programme"><div class="programme-in wrap">
        <div class="titres" role="tablist" aria-label="${esc(LIB.spectacles)}">
          ${slides.map((y, i) => `<button class="titre" type="button" role="tab" id="titre-${i}" aria-controls="scene-panneau" aria-selected="${i === actif}" tabindex="${i === actif ? 0 : -1}" style="${esc(styleDiapo(y))}">${esc(PAR_SLUG[y.slug] ? PAR_SLUG[y.slug].titre : y.titre[0])}<span class="fil" aria-hidden="true"></span></button>`).join('')}
        </div>
        <button class="pause" type="button" id="pause" aria-pressed="${pauseVoulue}" aria-label="Pause">${pauseVoulue ? ICO_LIRE : ICO_PAUSE}</button>
      </div></div>
    </section>`;
  }
  function brancherCarrousel(sc, slides) {
    const onglets = $$('.titre', sc), panneau = $('#scene-panneau', sc), calques = $$('.ph', sc);
    const rangee = $('.titres', sc), btnPause = $('#pause', sc), credit = $('.credit', sc);
    const lumiere = halo(sc);
    let montre = actif, occupe = false, attente = null, survolT = 0, arret = false;
    const pauses = { survol: false, focus: false, vue: false, page: false, user: pauseVoulue, intro: INTRO.ouverte() };
    const etat = () => {
      const joue = !arret && !reduit.matches && !Object.values(pauses).some(Boolean);

    };
    const versOnglet = i => {
      if (rangee.scrollWidth <= rangee.clientWidth + 2) return;

      rangee.scrollTo({ left: Math.max(0, onglets[i].offsetLeft - pad), behavior: doux() ? 'smooth' : 'auto' });
    };
    const peindre = i => {
      montre = i;
      const x = slides[i], s = PAR_SLUG[x.slug];
      const vu = calques.find(c => c.classList.contains('on')) || calques[0], neuf = calques.find(c => c !== vu);
      neuf.src = photo(x.slug);
      neuf.style.objectPosition = cadrage(s);
      const montrer = () => { neuf.classList.add('on'); vu.classList.remove('on'); };
      (neuf.decode ? neuf.decode() : Promise.resolve()).then(montrer, montrer);
      sc.setAttribute('style', styleDiapo(x));
      sc.dataset.focale = s && s.focale != null ? s.focale : 50;
      lumiere.repos();

        panneau.innerHTML = texteScene(x);
        panneau.setAttribute('aria-labelledby', 'titre-' + i);
        panneau.classList.remove('sort');
        if (credit) credit.textContent = x.credit || '';
      };
      if (reduit.matches) ecrire(); else { panneau.classList.add('sort'); setTimeout(ecrire, 260); }
    };
    const file = i => {
      if (occupe) { attente = i; return; }
      if (i === montre) return;
      occupe = true;
      peindre(i);
      setTimeout(() => { occupe = false; if (attente !== null) { const a = attente; attente = null; file(a); } }, reduit.matches ? 0 : 640);
    };
    const choisir = (i, focus) => {
      if (i !== actif) {
        actif = i;
        onglets.forEach((t, k) => { t.setAttribute('aria-selected', String(k === i)); t.tabIndex = k === i ? 0 : -1; });
        file(i);
        versOnglet(i);
      }
      if (focus) onglets[i].focus();

    onglets.forEach((t, i) => {
      t.addEventListener('click', () => choisir(i));
      t.addEventListener('focus', () => choisir(i));
      t.addEventListener('pointerenter', e => { if (e.pointerType !== 'mouse') return; clearTimeout(survolT); survolT = setTimeout(() => choisir(i), 110); });
      t.addEventListener('pointerleave', () => clearTimeout(survolT));
      t.addEventListener('keydown', e => {
        const n = onglets.length, k = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
        if (k !== undefined) { e.preventDefault(); choisir(k, true); }
      });
    });
    sc.addEventListener('animationend', e => { if (!arret && e.animationName === 'fil' && sc.classList.contains('joue')) choisir((actif + 1) % slides.length); });
    sc.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { pauses.survol = true; etat(); } });
    sc.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { pauses.survol = false; etat(); } });
    sc.addEventListener('focusin', () => { pauses.focus = true; etat(); });
    sc.addEventListener('focusout', e => { if (!sc.contains(e.relatedTarget)) { pauses.focus = false; etat(); } });
    btnPause.addEventListener('click', () => {
      pauseVoulue = pauses.user = !pauses.user;
      btnPause.setAttribute('aria-pressed', String(pauseVoulue));
      btnPause.innerHTML = pauseVoulue ? ICO_LIRE : ICO_PAUSE;
      etat();
    });
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(([e]) => { pauses.vue = e.intersectionRatio < .4; etat(); }, { threshold: [0, .4, 1] }) : null;
    if (io) io.observe(sc);
    const visible = () => { pauses.page = doc.hidden; etat(); };
    const finIntro = () => { pauses.intro = false; etat(); };
    doc.addEventListener('visibilitychange', visible);
    addEventListener('intro:fin', finIntro);
    reduit.addEventListener('change', etat);
    etat();
    versOnglet(actif);
    nettoyer.push(() => { arret = true; etat(); if (io) io.disconnect(); doc.removeEventListener('visibilitychange', visible); removeEventListener('intro:fin', finIntro); reduit.removeEventListener('change', etat); clearTimeout(survolT); });
  }

  // le petit sommaire qui suit la lecture
  function brancherSommaire() {
    const nav = $('.sommaire', main);
    if (!nav) return;
    const btns = $$('button[data-ch]', nav), chaps = btns.map(b => doc.getElementById('ch-' + b.dataset.ch));
    let raf = 0;
    const suivre = () => {
      raf = 0;
      let cur = null;
      chaps.forEach(c => { if (c && c.getBoundingClientRect().top < innerHeight * .42) cur = c.id; });
      btns.forEach(b => { if ('ch-' + b.dataset.ch === cur) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
    };
    const surDefile = () => { if (!raf) raf = requestAnimationFrame(suivre); };
    addEventListener('scroll', surDefile, { passive: true });
    suivre();
    nettoyer.push(() => { removeEventListener('scroll', surDefile); cancelAnimationFrame(raf); });
  }
  function aller(id) {

    c.scrollIntoView({ behavior: doux() ? 'smooth' : 'auto', block: 'start' });
    const t = c.querySelector('[tabindex="-1"]');
    if (t) t.focus({ preventScroll: true });
    return true;
  }

        </section>`; }).join('')}</div>
        <div class="agenda-carte">${lieux.length ? boiteCarte({ lieux, titre: sa.titre, liste: 'liste-saison', defaut: premier ? premier.l : null }) : ''}</div>
      </div>
      ${listeSaisons(cle)}
    </div>`;
  }
  function pageCompagnie() {
    const C = S.compagnie, Dr = C.directeur;
    return `<div class="page">
      <header class="page-tete wrap"><p class="sur">${esc((MENU.compagnie || {}).texte || '')}</p><h1 class="page-titre" tabindex="-1"${ed('site.compagnie.titre')}>${esc(C.titre)}</h1></header>
      <div class="wrap cie"><div class="cie-txt prose">${(C.paragraphes || []).map((p, i) => bloc(p, `site.compagnie.paragraphes.${i}`)).join('')}</div></div>
      <section class="bloc" aria-labelledby="t-dates"><div class="wrap">
        <h2 class="bloc-titre" id="t-dates"${ed('site.compagnie.datesTitre')}>${esc(C.datesTitre)}</h2>
        <ol class="rampe">${(C.dates || []).map((x, i) => {
          const s = D.shows.find(y => String(y.annee) === String(x.annee));
          const dedans = `<span class="rampe-lampe" aria-hidden="true"></span><span class="rampe-annee">${esc(x.annee)}</span><span class="rampe-t"${ed(`site.compagnie.dates.${i}.titre`)}>${esc(x.titre)}</span>`;
          return `<li style="${esc(s ? styleMini(s) : `--c:${LUM}`)}">${s ? `<a href="${lienSp(s.slug)}">${dedans}</a>` : `<span class="rampe-in">${dedans}</span>`}</li>`;
        }).join('')}</ol>
      </div></section>
      ${Dr ? `<section class="bloc" aria-labelledby="t-dir" style="padding-top:0"><div class="wrap dir-grille">
        <div><h2 class="bloc-titre" id="t-dir"${ed('site.compagnie.directeur.titre')}>${esc(Dr.titre)}</h2>${Dr.chapeau ? `<p class="dir-chapeau"${ed('site.compagnie.directeur.chapeau')}>${esc(Dr.chapeau)}</p>` : ''}</div>
        <div class="cie-txt prose">${(Dr.paragraphes || []).map((p, i) => bloc(p, `site.compagnie.directeur.paragraphes.${i}`)).join('')}</div>
      </div></section>` : ''}
      <div class="wrap cie-part"><p class="partenaires"${ed('site.partenaires')}>${S.partenaires || ''}</p></div>
    </div>`;
  }
  function pageContact() {
    const K = S.contact, CO = S.coordonnees || {}, types = ['text', 'email', 'tel', 'text'], auto = ['name', 'email', 'tel', 'address-level2'];
    const champ = (c, i) => i === K.champs.length - 1
      ? `<div class="champ champ--large"><label for="ct-${i}">${esc(c)}</label><textarea id="ct-${i}" name="c${i}" rows="6"></textarea></div>`
      : `<div class="champ"><label for="ct-${i}">${esc(c)}</label><input id="ct-${i}" name="c${i}" type="${types[i] || 'text'}" autocomplete="${auto[i] || 'off'}"></div>`;
    const t = K.consentement, cible = 'politique de confidentialité', j = t.toLowerCase().indexOf(cible);
    const consent = j >= 0
      ? `${esc(t.slice(0, j))}<a class="lien" href="#/politique-de-confidentialite">${esc(t.slice(j, j + cible.length))}</a>${esc(t.slice(j + cible.length))}`
      : `<a class="lien" href="#/politique-de-confidentialite">${esc(t)}</a>`;
    return `<div class="page"><div class="wrap contact">
      <div>
        <p class="sur">${esc((MENU.contact || {}).texte || '')}</p>
        <h1 class="page-titre" tabindex="-1"${ed('site.contact.titre')}>${esc(K.titre)}</h1>
        <address class="contact-coord"><span class="contact-nom">${esc(CO.nom)}</span>${(CO.adresse || []).map(l => `<span>${esc(l)}</span>`).join('')}</address>
      </div>
      <form class="form" novalidate>
        <div class="champs">${K.champs.map(champ).join('')}</div>
        <p class="consent"><input type="checkbox" id="ct-ok" name="ok"><label for="ct-ok">${consent}</label></p>
        <p class="calcul"><label for="ct-calc">${esc(K.calcul)}</label><input id="ct-calc" name="calc" inputmode="numeric" maxlength="2"></p>
        <button class="btn btn--plein" type="submit">${esc(K.bouton)}</button>
      </form>
    </div></div>`;
  }
  function pageLegal(cle) {
    const L = S.legal[cle];
    return `<div class="page"><div class="wrap legal">
      <h1 class="page-titre" tabindex="-1">${esc(L.titre)}</h1>
      <div class="legal-txt prose">${(L.blocs || []).map((b, i) => bloc(b, `site.legal.${cle}.blocs.${i}`)).join('')}</div>
    </div></div>`;
  }

  /* ---------- La navigation : par les trois entrées ---------- */
  const VUES = { voir: pageVoir, programmer: pageProgrammer, etablissement: pageEtablissement, spectacles: pageSpectacles, compagnie: pageCompagnie, contact: pageContact };
  const MEMO = 'crescite-m07-entree';
  const retenir = c => { try { sessionStorage.setItem(MEMO, c); } catch (e) { /* stockage indisponible */ } };
  const retenue = () => { try { const v = sessionStorage.getItem(MEMO); return ENT[v] ? v : null; } catch (e) { return null; } };
  let vue = null, surPhoto = true, allerA = null;
  function fermerMenu(rendreFocus) {
    if (!tete.classList.contains('ouvert')) return;
    tete.classList.remove('ouvert');
    root.classList.remove('fige');
    menuBtn.setAttribute('aria-expanded', 'false');
    if (rendreFocus) menuBtn.focus();
  }
  menuBtn.addEventListener('click', () => {
    const ouvert = !tete.classList.contains('ouvert');
    tete.classList.toggle('ouvert', ouvert);
    root.classList.toggle('fige', ouvert);
    menuBtn.setAttribute('aria-expanded', String(ouvert));
    if (ouvert) { const a = $('a', navS); if (a) a.focus(); }
  });
  navS.addEventListener('click', e => { if (e.target.closest('a')) fermerMenu(false); });
  doc.addEventListener('keydown', e => { if (e.key === 'Escape') fermerMenu(true); });
  replie.addEventListener('change', () => { fermerMenu(false); ajusterTete(); });
  const enTete = () => tete.classList.toggle('plein', !surPhoto || scrollY > 24);
  addEventListener('scroll', enTete, { passive: true });
  if ('ResizeObserver' in window) new ResizeObserver(() => ajusterTete()).observe(teteIn);
  else addEventListener('resize', ajusterTete);
  if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(ajusterTete);
  main.addEventListener('submit', e => e.preventDefault());   // l'envoi ne fait rien
  $('.evitement').addEventListener('click', e => { e.preventDefault(); const t = $('h1[tabindex="-1"]', main) || main; t.focus(); });
  main.addEventListener('click', e => {
    const b = e.target.closest('[data-aller]');
    if (b) { e.preventDefault(); aller(b.dataset.aller); return; }
    const a = e.target.closest('a[data-vers]');
    if (a) allerA = a.dataset.vers;
  });
  doc.addEventListener('click', e => {
    if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') { EDITION.ouvrir(); return; }
    const a = e.target.closest('a[href^="#/"]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.getAttribute('href') === location.hash) { e.preventDefault(); router(); }
  });

  // ce qui identifie un élément d'une version de la vue à la suivante (pour lui rendre le focus)
  const signature = el => [el.tagName, el.getAttribute('href'), el.dataset.ch, el.dataset.cle, el.dataset.l, el.dataset.edit, el.getAttribute('name'), el.id, (el.textContent || '').trim().slice(0, 60)].join('|');
  function etatVue() {
    const f = doc.activeElement;
    return { y: scrollY, focus: f && f !== main && main.contains(f) ? signature(f) : null,
      volets: $$('details', main).map(d => d.open), champs: $$('input, textarea', main).map(c => [c.id || c.name, c.type === 'checkbox' ? c.checked : c.value]) };
  }
  function restaurer(v) {
    const volets = $$('details', main);
    if (volets.length === v.volets.length) volets.forEach((d, i) => { d.open = v.volets[i]; });
    v.champs.forEach(([n, x]) => { const c = n && (doc.getElementById(n) || main.querySelector(`[name="${CSS.escape(n)}"]`)); if (c && main.contains(c)) { if (c.type === 'checkbox') c.checked = x; else c.value = x; } });
    if (Math.abs(scrollY - v.y) > 1) scrollTo(0, v.y);
    if (v.focus) { const b = $$('a, button, input, textarea, summary, [tabindex], [data-edit]', main).find(x => signature(x) === v.focus); if (b) b.focus({ preventScroll: true }); }
  }
  function marquer(r) {
    // l'entrée de la vue : aria-current="page" sur sa page d'entrée ; "true" quand on lit un spectacle ou une saison passée
    const ctx = r.entree || r.onglet || (r.saison ? 'voir' : null), val = r.entree ? 'page' : 'true';
    $$('a.entree', navE).forEach(a => { if (ctx && a.dataset.cle === ctx) a.setAttribute('aria-current', val); else a.removeAttribute('aria-current'); });
    $$('a', navS).forEach(a => { if (r.nav && a.dataset.nav === r.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  let derniere = '';
  function lireAdresse() {
    const h = location.hash.startsWith('#/') || !location.hash ? location.hash : derniere;
    derniere = h;
    const chemin = (h.startsWith('#/') ? h.slice(2) : '').split('?')[0].replace(/\/+$/, '');
    return { chemin, p: chemin.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } }) };
  }
  // enPlace : D vient de changer (DONNEES) ; la vue courante est refaite sans remonter, sans voler le focus, sans animation d'entrée
  function router(enPlace = false) {
    relire();
    chrome();
    const h = location.hash;
    if (h && !h.startsWith('#/') && vue && !enPlace) return;      // une ancre de la page (« Aller au contenu »)
    const { chemin, p } = lireAdresse();
    const red = (S.redirections || {})['#/' + chemin];
    if (red) { location.replace(red); return; }
    let r = null;
    const entree = (S.entrees || []).find(e => e.href === '#/' + chemin), menu = (S.menu || []).find(m => m.href === '#/' + chemin);
    if (!p.length) r = { cle: 'accueil' };
    else if (entree && VUES[entree.cle]) r = { cle: entree.cle, entree: entree.cle };
    else if (menu && VUES[menu.id]) r = { cle: menu.id, nav: menu.id };
    else if (p[0] === 'spectacle' && PAR_SLUG[p[1]] && p.length <= 3) {
      if (p.length === 2) { location.replace(lienSp(p[1], retenue() || 'voir')); return; }
      if (ENT[p[2]]) r = { cle: `spectacle:${p[1]}:${p[2]}`, show: PAR_SLUG[p[1]], onglet: p[2] };
    }
    else if (p[0] === 'agenda' && p.length === 2 && D.saisons[p[1]]) {
      if (p[1] === SAISON.saison && ENT.voir) { location.replace(ENT.voir.href); return; }
      r = { cle: 'saison:' + p[1], saison: p[1] };
    }
    else if (p.length === 1 && S.legal && S.legal[p[0]]) r = { cle: 'legal:' + p[0], legal: p[0] };
    if (!r) { location.replace('#/'); return; }
    if (!enPlace && r.cle === vue) { fermerMenu(false); scrollTo({ top: 0, behavior: doux() ? 'smooth' : 'auto' }); return; }
    const avant = enPlace && r.cle === vue ? etatVue() : null;
    nettoyer.forEach(f => f()); nettoyer = [];
    aBrancher.length = 0;
    vue = r.cle;
    ANIMER = !avant;
    let titre;
    try {
      if (r.cle === 'accueil') { main.innerHTML = accueil(); titre = S.accueil; }
      else if (r.entree) { retenir(r.entree); main.innerHTML = VUES[r.entree](); titre = ENT[r.entree].texte; }
      else if (r.nav) { main.innerHTML = VUES[r.nav](); titre = MENU[r.nav].texte; }
      else if (r.show) { retenir(r.onglet); main.innerHTML = pageSpectacle(r.show, r.onglet); titre = r.onglet === 'voir' ? r.show.titre : `${r.show.titre} - ${ENT[r.onglet].court}`; }
      else if (r.saison) { main.innerHTML = pageSaison(r.saison); titre = ((S.saisons || []).find(x => x.saison === r.saison) || D.saisons[r.saison]).titre; }
      else if (r.legal) { main.innerHTML = pageLegal(r.legal); titre = S.legal[r.legal].titre; }
      doc.title = `${titre} - ${S.titreSuffixe}`;
      marquer(r);
      const sc = $('#scene', main);
      surPhoto = !!sc;
      if (sc && r.cle === 'accueil') brancherCarrousel(sc, diapos());
      else if (sc) { halo(sc); if (ANIMER && doux()) sc.classList.add('allumage'); }
      if (r.nav === 'spectacles') brancherRep();
      if (r.show && r.onglet === 'voir') brancherSommaire();
      aBrancher.splice(0).forEach(brancherCarte);
    } finally { ANIMER = true; }
    if (avant) { restaurer(avant); enTete(); return; }
    fermerMenu(false);
    scrollTo(0, 0);
    const cible = allerA; allerA = null;
    if (!(cible && aller(cible))) {
      const t = $('h1[tabindex="-1"]', main);
      if (t && !INTRO.ouverte()) t.focus({ preventScroll: true });
    }
    enTete();
    ajusterTete();
  }
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  addEventListener('hashchange', () => router());
  router();
  // la base de la compagnie : à chaque enregistrement, D change en place et la vue courante est refaite en place
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(() => router(true));

  /* L'ouverture : le noir, une photo à peine éclairée, le logo blanc ; il grossit et la scène s'allume */
  const premiere = diapos()[0];
  INTRO.ouvrir({
    fond: NOIR,
    image: premiere ? photo(premiere.slug) : undefined,
    encre: '#f4eee9',
    classe: 'm07-intro',
    apres: () => {
      const sc = $('.scene--accueil', main);
      if (!sc || !doux()) return;
      sc.classList.remove('allumage'); void sc.offsetWidth; sc.classList.add('allumage');
    },
  });
})();
</script>
</body>
</html>
