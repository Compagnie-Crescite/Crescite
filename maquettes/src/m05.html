.rs-etat{margin-left:8px;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--u-vif)}
.rs-ou{margin:6px 0 0;font-size:16px;line-height:1.45;color:var(--u-texte2)}
.rs-lieu{color:var(--u-texte);font-weight:700}
.rs-det{margin:8px 0 0;padding:0;list-style:none;font-size:15px;line-height:1.45;color:var(--u-texte2)}
.rs-seances{margin:18px 0 0}
.rs-k{margin:0 0 8px;font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--u-vif)}
.rs-seances--sans{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rs-seances--sans .rs-k{margin:0}
.rs-sans{font-weight:700}
.rs-liste{gap:8px}
.rs-seance{display:inline-flex;align-items:baseline;gap:8px;min-height:46px;padding:10px 16px;border:2px solid var(--u-texte);border-radius:4px;color:var(--u-texte);text-decoration:none;transition:background-color .16s,color .16s}
a.rs-seance:hover{background:var(--u-texte);color:var(--u-fond)}
a.rs-seance:hover .rs-sj{color:inherit}
a.rs-seance:focus-visible{outline:3px solid var(--u-texte);outline-offset:2px}
.rs-sh{font-stretch:125%;font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.rs-sh--sans{font-size:15px}
.rs-sj{font-size:14px;color:var(--u-texte2)}
.rs-seance.est-scolaire{border-style:dashed;color:var(--u-texte2)}
.rs-scol{padding:1px 8px;border:1.5px solid currentColor;border-radius:999px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.rs-action{margin:22px 0 0}
.rs-reserver,.u .rs-reserver{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:70px;padding:12px 20px 12px 24px;border-radius:4px;background:var(--u-aplat);color:var(--u-sur);text-decoration:none;transform-origin:0 50%}
.rs-reserver:focus-visible{outline:3px solid var(--u-texte);outline-offset:3px}
.rs-r1{font-stretch:125%;font-weight:900;font-size:clamp(22px,2vw,28px);line-height:1;letter-spacing:.02em;text-transform:uppercase}
.rs-r2{margin-top:6px;font-size:14px;font-weight:700}
.rs-reserver .rs-sep{opacity:1}
.rs-reserver .rs-fleche{width:30px;height:30px;stroke-width:2.2;transition:transform .2s var(--mv-courbe)}
.rs-reserver:hover .rs-fleche{transform:translateX(6px)}
.rs-aupres{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding-top:12px;border-top:2px solid var(--ligne);font-size:15px;line-height:1.4;color:var(--u-texte2)}
.rs-aupres b{color:var(--u-texte);font-weight:800}
/* l'aplat qui balaie (effetReserver) : à la couleur du spectacle choisi, il traverse la carte et la découvre ; les séances et
   « Réserver » glissent et se serrent en place. Moins d'animations : un fondu bref */
.rs-balai{position:absolute;inset:0;z-index:4;pointer-events:none;background:var(--rs-balai,var(--u-aplat));transform:translateX(101%)}
.rs-balaie .rs-balai{animation:rs5-balai .44s cubic-bezier(.62,0,.32,1) both}
.rs-balaie :is(.rs-sp,.rs-quand,.rs-liste>li,.rs-action){animation:rs5-pose .36s var(--mv-courbe) backwards;animation-delay:calc(170ms + var(--rs-i,0) * 40ms)}
.rs-balaie .rs-quand{--rs-i:1}.rs-balaie .rs-liste>li:nth-child(1){--rs-i:2}.rs-balaie .rs-liste>li:nth-child(2){--rs-i:3}.rs-balaie .rs-liste>li:nth-child(n+3){--rs-i:4}.rs-balaie .rs-action{--rs-i:5}
@keyframes rs5-balai{from{transform:translateX(0)}to{transform:translateX(101%)}}
@keyframes rs5-pose{from{opacity:0;transform:translateX(-18px) scaleX(1.1)}}
@media (max-width:900px){.rs-corps{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.rs-bande .rs-date{width:142px;min-height:140px;padding:12px}.rs-bande .rs-n{font-size:30px}.rs-date--ligne{max-width:15rem}}

/* ———— les vidéos dans la page (règle 18, LECTEUR) : l'écran en carton, le bouton de lecture en pastille d'aplat ; au geste, un
   aplat à la couleur du spectacle découvre la vidéo ; la page s'éteint d'un coup sec autour d'elle ———— */
.lc{margin:0}
.lc-cadre{border-radius:4px;background:var(--video);box-shadow:0 18px 40px -26px rgba(0,0,0,.6)}
.lc-cadre:fullscreen{border-radius:0}
.lc-affiche{filter:brightness(.7) saturate(.95);transition:transform .5s,filter .3s}
.lc-lire:hover .lc-affiche{transform:scale(1.03);filter:brightness(.6)}
.lc-lire:focus-visible{outline:3px solid var(--u-texte,var(--encre));outline-offset:-6px}
.lc-icone{width:clamp(72px,7vw,104px);height:clamp(72px,7vw,104px);border-radius:50%;background:var(--u-aplat,var(--tache));color:var(--u-sur,#fff);transition:transform .3s}
.lc-lire:hover .lc-icone{transform:translate(-50%,-50%) scale(1.08)}
.lc-titre{left:24px;right:24px;bottom:20px;font-stretch:125%;font-weight:900;font-size:clamp(17px,1.6vw,24px);line-height:1.1;text-transform:uppercase;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
/* l'écran étroit : le rond remonte et rapetisse, le titre sur deux lignes ne le touche pas */
@media (max-width:520px){.lc-icone{top:42%;width:60px;height:60px}.lc-titre{left:16px;right:16px;bottom:14px;font-size:15px}}
.lc-outils{gap:10px;margin-top:12px}
.lc-b{min-height:44px;padding:0 18px 0 14px;border:2px solid var(--u-texte,var(--encre));border-radius:999px;background:transparent;color:var(--u-texte,var(--encre));font-stretch:112%;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lc-b:hover{background:var(--u-texte,var(--encre));color:var(--u-fond,var(--papier))}
.lc-b:focus-visible{outline:3px solid var(--u-texte,var(--encre));outline-offset:2px}
.lc.lc-eteint .lc-nuit-b{border-color:var(--u-aplat,var(--tache));background:var(--u-aplat,var(--tache));color:var(--u-sur,#fff)}
.lc.lc-eteint .lc-cadre{box-shadow:0 0 0 4px var(--u-aplat,var(--tache))}
.lc.lc-joue .lc-affiche{opacity:0}
.lc-nuit{background:var(--video-voile)}
.lc-balai{position:absolute;inset:0;z-index:2;pointer-events:none;background:var(--u-aplat,var(--tache))}
.lc-balai.part{animation:lc5-balai .46s cubic-bezier(.62,0,.32,1) forwards}
@keyframes lc5-balai{to{transform:translateX(101%)}}
.lc-groupe{margin:clamp(30px,3.4vw,44px) 0 0;color:var(--u-vif);font-stretch:125%;font-weight:900;font-size:clamp(18px,1.6vw,22px);letter-spacing:.04em;text-transform:uppercase}
.lc-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px;margin-top:16px}
.lc-grille .lc-icone{width:56px;height:56px}
.lc-grille .lc-titre{left:14px;right:14px;bottom:12px;font-size:14px}
.lc-grille .lc-outils{gap:6px;margin-top:8px}
.lc-grille .lc-b{padding:0 12px}
.lc-grille .lc-b span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lc-boite::backdrop{background:var(--video-voile)}
.lc-boite .lc-b{border-color:rgba(255,255,255,.6);color:#fff}
.lc-boite .lc-b:hover{background:#fff;color:#000}
.lc-boite .lc-cadre{box-shadow:none}
.medias-l{margin-top:clamp(24px,2.6vw,34px)}

/* ———— la troupe (règle 20, TROUPE) : l'organigramme en aplats. La tache de la marque, la pieuvre blanche dessus, d'où part la
   ligne-tentacule ; chaque catégorie de métiers, un aplat (son icône dans une pastille blanche, son titre en capitales larges),
   ceux qui y travaillent dessous en capitales, le métier précis à côté (une vignette carrée quand la photo est publiée, sinon
   le nom seul). Les aplats glissent et se serrent à leur arrivée dans l'écran (animations liées au défilement) ; survoler
   quelqu'un allume toutes ses places et les relie (TROUPE.relier) ———— */
.troupe5{position:relative;--troupe-lien:var(--tache-txt);--troupe-ic-fond:#fff}
.tr5-racine{display:flex;align-items:center;gap:clamp(14px,2vw,26px);margin-bottom:28px;padding:14px clamp(16px,2vw,24px);background:var(--tache);color:#fff;--sep:#fff}
.tr5-logo{flex:none;width:clamp(96px,11vw,150px)}
.tr5-logo svg{display:block;width:100%;height:auto}
.tr5-racine .sep{flex:1;min-width:0}
.tr5-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:34px clamp(16px,2vw,28px);align-items:start}
.tr5-cat{position:relative;z-index:2;min-width:0}
.tr5-jeu{grid-column:span 2}
.tr5-tete{display:flex;align-items:center;gap:14px;margin-bottom:6px;padding:12px 14px;background:var(--tache);color:#fff;transform-origin:0 50%}
.tr5-ic{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--tache-deep)}
.tr5-ic .troupe-icone{width:32px;height:32px}
.tr5-t{min-width:0;font-stretch:125%;font-weight:900;font-size:clamp(16px,1.35vw,20px);line-height:1.05;text-transform:uppercase;text-wrap:balance}
.tr5-places{display:grid;margin:0;padding:0;list-style:none}
.tr5-jeu .tr5-places{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(14px,1.6vw,24px)}
.tr5-li{min-width:0}
.tr5-place{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;margin:0;padding:8px 6px 8px 2px;border:0;border-bottom:1px solid var(--ligne);background:none;color:var(--encre);font:inherit;text-align:left;cursor:pointer;transition:opacity .16s,background-color .16s}
.tr5-v{flex:none;display:block;width:48px;height:48px;overflow:hidden;background:var(--tache)}
.tr5-v img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:grayscale(1) contrast(1.05);transition:filter .2s}
.tr5-pt{flex:none;width:10px;height:10px;margin:0 8px 0 4px;background:var(--tache-txt)}
.tr5-qui{display:grid;gap:2px;min-width:0}
.tr5-nom{font-stretch:112%;font-weight:800;font-size:15px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.tr5-m{font-size:13.5px;line-height:1.35;color:var(--encre2)}
.tr5-m>span+span::before{content:" · "}
.tr5-place:is(:hover,.est-allume){background:color-mix(in srgb,var(--tache-txt) 10%,transparent)}
.tr5-place:is(:hover,.est-allume) .tr5-nom{color:var(--tache-txt)}
.tr5-place:is(:hover,.est-allume,[aria-pressed="true"]) .tr5-v img{filter:none}
.tr5-place[aria-pressed="true"]{box-shadow:inset 4px 0 0 var(--tache-txt)}
.tr5-place:focus-visible{outline:3px solid var(--tache-txt);outline-offset:2px}
.troupe5.est-allume .tr5-place:not(.est-allume),.troupe5.est-groupe .tr5-place:not(.est-allume){opacity:.4}
.troupe5 .troupe-lien{stroke-width:2}
@supports (animation-timeline:view()){
  html:not(.m5-fixe) .tr5-tete{animation:tr5-serre linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
}
@keyframes tr5-serre{from{transform:translateX(-26px) scaleX(1.14);opacity:.25}to{transform:none;opacity:1}}
@media (max-width:640px){.tr5-jeu{grid-column:auto}.tr5-jeu .tr5-places{grid-template-columns:minmax(0,1fr)}.tr5-racine{padding:10px 14px}}

/* ———— le bilan d'un spectacle qui n'est plus en tournée (règle 21) : ses chiffres en aplats, la frise de sa tournée, ses dates par
   saison à côté de la carte-affiche de tous ses lieux ; puis les actions culturelles menées ———— */
.bilan-rep{margin:0 0 20px;font-size:clamp(19px,1.6vw,22px);font-weight:600;line-height:1.3}
.bilan-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:720px;margin:0 0 clamp(24px,3vw,36px);padding:0;list-style:none}
.bilan-n li{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:132px;padding:16px 18px;background:var(--u-aplat);color:var(--u-sur)}
.bilan-n b{font-stretch:125%;font-weight:900;font-size:clamp(46px,5vw,76px);line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bilan-n span{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.bilan-g{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,6fr);gap:clamp(24px,3vw,48px);align-items:start;margin-top:22px}
.bilan-carte{position:sticky;top:calc(var(--head) + 24px)}
.bl-s+.bl-s{margin-top:34px}
.bl-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:3px solid var(--u-grand);color:var(--u-grand);font-stretch:125%;font-weight:900;font-size:clamp(20px,1.8vw,26px);line-height:1.05;text-transform:uppercase}
.bl-t small{font-size:15px;color:var(--u-texte2)}
.ac-sc-h{margin:28px 0 6px;color:var(--u-vif)}
@media (max-width:900px){.bilan-g{grid-template-columns:minmax(0,1fr)}.bilan-carte{position:static;order:-1}}
@media (max-width:480px){.bilan-n li{min-height:96px;padding:12px 10px}.bilan-n span{font-size:11px;letter-spacing:.05em}}

.intro.m05-intro .intro-indice{opacity:1}

@media (max-width:1279.98px){
  .onglet .e-long{display:none}
  .onglet .e-court{display:inline}
}
@media (max-width:1120px){
  .m-long{display:none}
  .m-court{display:inline}
  .m{padding-inline:12px 14px}
}
@media (max-width:1100px){
  .ag{grid-template-columns:minmax(0,1fr)}
  .ag>.ag-carte,.ag>.liste,.ag>.liste-col{grid-column:1;grid-row:auto}
  .ag>.ag-carte{position:static;width:100%;max-width:680px}
  .tuiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sh-corps{grid-template-columns:minmax(0,1fr)}
  .sommaire{display:none}
}
@media (max-width:980px){
  .aff-grille{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"tete" "carte" "liste"}
  .aff-carte{margin:8px 0 12px}
  .act,.contact,.dir{grid-template-columns:minmax(0,1fr)}
  .act-ph{position:static;max-width:560px}
  .pied-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pied-logo{grid-column:1/-1}
  .fp{grid-template-columns:minmax(0,1fr)}
  .fp-ph{min-height:0;aspect-ratio:16/9}
  .ateliers{grid-template-columns:minmax(0,1fr)}
  .onglet .e-long{display:none}
  .onglet .e-court{display:inline}
  .brand-word{display:none}
}
@media (max-width:760px){
  :root{--head:64px;--bas:70px}
  .sai>summary{grid-template-columns:64px minmax(0,1fr) auto;padding:14px 2px}
  .sai-carte{padding:5px;border-radius:20px 20px 20px 5px}
  .sai-n{gap:6px}
  .sai-n .chev{width:22px;height:22px}
  .sai-corps{padding:6px 2px 30px}
  .cps{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--gut));padding:2px var(--gut) 4px;scrollbar-width:none}
  .cp{flex:none}
  .recherche{max-width:none}
  body{padding-bottom:calc(var(--bas) + env(safe-area-inset-bottom))}
  .brand-word{display:inline;font-size:20px}
  .brand-mark{width:52px}
  .en-univers .brand-mark{width:42px}
  .theme-m05{width:44px;height:44px}
  /* au téléphone, le menu reste à portée : une barre fixe en bas de l'écran, sur la tache profonde, ses noms courts */

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : l'aplat et la capitale. Rien que la marque : des aplats de couleur pleine et de grandes capitales larges ;
     tout bouge comme un volet qu'on tire et une capitale qu'on serre. Une courbe sèche (rapide, puis posée) ; 420 ms au plus.
     1. Changer de page (MOUVEMENT.transition) : cinq volets d'aplat, à la couleur de la page qui arrive (celle d'une page de
        l'espace pro, la tache de la marque à la couleur de la saison, l'aplat de l'univers du spectacle), traversent l'écran en
        diagonale sous l'en-tête, de gauche à
        droite ; au retour, de droite à gauche. Jamais tout l'écran n'est couvert : la page est là dès la première image. Sa
        grande capitale (le titre) glisse depuis la gauche et se compresse à sa largeur. La photo d'un spectacle cliquée devient
        la grande photo de sa page (élément partagé) ; d'un onglet à l'autre, l'aplat de l'onglet glisse. Un geste interrompt.
     2. Ouvrir une saison : un volet d'aplat traverse sa tête, ses dates arrivent en cascade ; le menu aussi se déplie.
     3. Filtrer, chercher : les dates glissent à leur nouvelle place, celles qui partent s'effacent (MOUVEMENT.flip) ; les
        pastilles de la frise glissent, les aplats des saisons changent de hauteur.
     4. Survol et focus : 160 ms ; un aplat passe derrière, la flèche avance ; rien ne tremble.
     5. Pression : la pièce se serre (scaleX) et prend l'aplat dès le pointerdown.
     6. Défilement (MOUVEMENT.reveler) : les capitales glissent et se compressent, les cartes arrivent l'une après l'autre, la
        ligne-tentacule se trace, les chiffres comptent ; les bras de la carte-affiche poussent depuis Rouen.
     7. Ce qui vit : « EN TOURNÉE » qui bat, « aujourd'hui » en barre à la couleur de la saison sur chaque frise, la pastille de
        la prochaine date.
     8. Réserver une date (règle 17) : chaque date est une pièce d'aplat ; choisie, elle prend l'aplat de son spectacle, et un
        aplat à sa couleur balaie sa carte, qui se découvre ; les séances et « Réserver » glissent et se serrent en place.
     9. Les vidéos (règle 18) : au geste, un aplat à la couleur du spectacle découvre la vidéo ; la page s'éteint d'un coup sec.
     10. Le jour et la nuit (règle 19) : la bascule s'ouvre en cercle depuis le bouton (THEME).
     11. La troupe (règle 20) : les aplats des catégories glissent et se serrent à leur arrivée dans l'écran (animations liées au
        défilement) ; survoler quelqu'un relie toutes ses places.
     Les frises (FRISE) sont des aplats : la saison (des pastilles pleines aux couleurs des spectacles), les saisons (des
     barres de densité), une saison passée, la tournée d'un spectacle, les dates scolaires, la diffusion saison par saison,
     l'histoire de la compagnie en capitales ; survoler une pastille allume sa ligne et sa commune (sa bulle), et inversement.
     La pieuvre : aucun moment ; les photos restent dans leurs vraies couleurs (aucun filtre).
     Moins d'animations demandé (ou ?anim=0) : tout est posé, rien ne bouge. */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const main = $('#main');
  const CLES = ['voir', 'programmer', 'etablissement'];
  const MEMO = 'm05-entree';
  // les animations d'entrée ne jouent qu'à l'arrivée sur une vue, jamais quand la base redessine la vue en place
  let ANIM = true;
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  // réserver une date (RESERVER, règle 17), les vidéos dans la page (LECTEUR, règle 18), le jour et la nuit (THEME, règle 19),
  // la troupe (TROUPE, règle 20)
  const RS = typeof RESERVER !== 'undefined' ? RESERVER : null, LC = typeof LECTEUR !== 'undefined' ? LECTEUR : null;
  const TH = typeof THEME !== 'undefined' ? THEME : null, TR = typeof TROUPE !== 'undefined' ? TROUPE : null;
  const bouge = () => CARTE.mouvement() && (!MV || MV.permis());

  const fixeHtml = () => document.documentElement.classList.toggle('m5-fixe', !bouge());
  fixeHtml();
  if (window.matchMedia) { const mq = matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', fixeHtml); }

  /* ---------- les données : relues à chaque rendu (la base peut remplacer D en place) ---------- */
  const spectacle = slug => (D.shows || []).find(s => s.slug === slug) || null;
  const entree = cle => (D.site.entrees || []).find(e => e.cle === cle) || null;
  // le menu (règle 21) : les saisons, les spectacles, la compagnie, l'espace pro, par leur clé ou leur id
  const menuDe = id => (D.site.menu || []).find(m => m.id === id || m.cle === id) || null;
  // un spectacle sans action culturelle (Cassandres, pour l'instant) n'a pas d'onglet établissement (règle 14)
  const entreeSp = (slug, cle) => cle === 'etablissement' && !((D.shows || []).find(x => x.slug === slug) || {}).actionCulturelle ? 'voir' : cle;
  // règle 21 : un spectacle en tournée (ou en création : Cassandres) a ses trois onglets ; les autres, une seule page
  const aOnglets = s => !!(s && (s.enTournee || s.statut));
  // l'adresse d'un spectacle : l'onglet demandé s'il a des onglets, sa seule page sinon (jamais un lien vers un onglet qui n'existe pas)
  const lienSp = (slug, cle) => { const s = spectacle(slug); return s && !aOnglets(s) ? `#/spectacle/${slug}` : `#/spectacle/${slug}${cle ? '/' + entreeSp(slug, cle) : ''}`; };
  const lignesTitre = s => (s.titreLignes && s.titreLignes.length ? s.titreLignes : [s.titre]);
  const retenir = c => { try { sessionStorage.setItem(MEMO, c); } catch (e) { /* stockage indisponible */ } };
  const retenue = () => { try { const v = sessionStorage.getItem(MEMO); return CLES.includes(v) ? v : null; } catch (e) { return null; } };

  // l'édition sur place : chaque texte de D porte son chemin (EDITION y remet la valeur brute en mode édition)
  const ed = chemin => ` data-edit="${esc(chemin)}"`;
  const edPh = chemin => ` data-edit-photo="${esc(chemin)}"`;
  const P = (s, champ) => `shows.${s.slug}.${champ}`;

  const use = (id, cls = 'ico') => `<svg class="${cls}" aria-hidden="true" focusable="false"><use href="#${id}"></use></svg>`;
  const sep = () => `<div class="sep" aria-hidden="true"><svg class="sep-vague" focusable="false"><use href="#i-vague"></use></svg><svg class="sep-boucle" focusable="false"><use href="#i-boucle"></use></svg></div>`;
  const ext = (href, html, cls = 'ext') => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${html}${use('i-ext')}<span class="sr"> (nouvel onglet)</span></a>`;
  const titreTxt = t => esc(t).replace(/ – /g, '&nbsp;– ');
  const imgSrc = k => (k && D.photos[k]) || '';

  /* ---------- les couleurs : un univers reste lisible (AA) sur son propre fond ---------- */
  const hex6 = c => /^#[0-9a-f]{6}$/i.test(String(c || ''));
  const lum = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const rgbDe = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) || 0);
  const melange = (a, b, t) => '#' + rgbDe(a).map((v, i) => Math.round(v + (rgbDe(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  const eclaircit = (h, fond, cible) => { let c = h; for (let k = 0; k < 40 && ratio(c, fond) < cible; k++) c = melange(c, '#ffffff', .08); return c; };
  const assombrit = (h, fond, cible) => { let c = h; for (let k = 0; k < 40 && ratio(c, fond) < cible; k++) c = melange(c, '#000000', .08); return c; };
  // les deux papiers de la nuit (html[data-theme="nuit"] : --papier, --papier2) ; le papier teinté du jour, le plus sombre qu'il puisse être
  const NUIT5 = '#100e13', NUIT5_2 = '#1a1720', PAPIER2_JOUR = '#eceef4';
  // une couleur de marque (un repère de frise, une pastille de légende) qui se voit sur le papier du jour comme sur celui de la nuit
  const milieu = h => { if (!hex6(h)) return h; let best = h, bm = Math.min(ratio(h, '#ffffff'), ratio(h, NUIT5));
    for (const vers of ['#ffffff', '#000000']) for (let t = .06; t < .9; t += .06) { const x = melange(h, vers, t), m = Math.min(ratio(x, '#ffffff'), ratio(x, NUIT5)); if (m > bm + .01) { best = x; bm = m; } }
    return best; };

  /* ---------- la couleur de la saison (règle 22) : D.site.couleurSaison, la couleur de la dernière création (le bleu, jusqu'à la
     création de Cassandres). Elle prend toute la place du magenta d'autrefois : la tache de la marque, ses aplats (sous un texte
     blanc), ses volets, le texte et les filets à sa couleur sur le papier ; la nuit, l'aplat s'éclaircit vers la couleur vive tant
     qu'un texte blanc s'y lit, le texte prend la couleur vive. Relue à chaque changement de D ---------- */
  function couleurSaison() {
    const c = (D.site || {}).couleurSaison || {}, j = hex6(c.couleur) ? c.couleur.toLowerCase() : hex6(c.vive) ? c.vive.toLowerCase() : null;
    if (!j) return null;
    const v = hex6(c.vive) ? c.vive.toLowerCase() : j, tache = assombrit(j, '#ffffff', 4.5);
    // la nuit (le seul thème du site, règle 19) : des aplats profonds, qui reposent (demande de la compagnie) ; la tache s'éclaircit
    // vers sa couleur vive tant que son texte blanc reste au-dessus de 7:1 (AAA), pas plus : elle se voit encore sur la nuit
    let nuit = tache;
    for (let t = .05; t <= 1; t += .05) { const x = melange(tache, v, t); if (ratio('#ffffff', x) < 7) break; nuit = x; }
    return { tache, deep: melange(tache, '#000000', .32), nuit, txtNuit: eclaircit(v, NUIT5_2, 4.5), papier2: melange(tache, '#ffffff', .93) };
  }
  const feuilleCouleurs = document.head.appendChild(document.createElement('style'));
  function couleurs() {
    const sa = couleurSaison();
    const css = sa ? `:root{--tache:${sa.tache};--tache-jour:${sa.tache};--tache-deep:${sa.deep};--tache-txt:${sa.tache};--papier2:${sa.papier2}}html[data-theme="nuit"]{--tache:${sa.nuit};--tache-txt:${sa.txtNuit}}` : '';
    if (feuilleCouleurs.textContent !== css) feuilleCouleurs.textContent = css;
    return sa;
  }
  function fonce(hex, fond = '#ffffff') {
    if (!hex6(hex)) return '#5e4b56';
    let rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), c = hex;
    while (ratio(c, fond) < 4.6 && rgb.some(Boolean)) { rgb = rgb.map(v => Math.floor(v * .92)); c = '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join(''); }
    return c;
  }
  const CAPITALES = new Set(['Ubuntu', 'Anton', 'Space Grotesk', 'Bodoni Moda', 'Cormorant Garamond']);
  function jeton(s) {
    const u = s.univers || {}, c = Object.assign({}, s.palette || {}, u.couleurs || {}), pol = u.polices || {};
    const fond = hex6(c.fond) ? c.fond : '#1a1016', sombre = lum(fond) < .2;
    const fond2 = hex6(c.fond2) ? c.fond2 : fond;
    const texte = hex6(c.texte) && ratio(c.texte, fond) >= 4.5 ? c.texte : (sombre ? '#ffffff' : '#1a1016');
    const texte2 = hex6(c.texte2) && ratio(c.texte2, fond) >= 4.5 ? c.texte2 : texte;
    const cands = [c.accent, c.scene, c.accent2].filter(hex6);
    const vif = cands.find(x => ratio(x, fond) >= 4.5) || texte;          // du texte vif, petit
    const grand = cands.find(x => ratio(x, fond) >= 3) || texte;          // les titres, les traits
    let aplat = texte, sur = fond;                                           // un aplat, et le texte posé dessus
    for (const x of cands) {
      if (ratio(x, fond) < 3) continue;
      const best = ['#ffffff', fond, texte].reduce((a, b) => ratio(b, x) > ratio(a, x) ? b : a);
      if (ratio(best, x) >= 4.5) { aplat = x; sur = best; break; }
    }
    const titre = pol.titre || '';
    // la nuit d'un univers clair : son texte, assombri dans la nuit, devient son fond, son fond son texte ; ses couleurs vives
    // gardées là où elles se lisent
    let n = null;
    if (!sombre && hex6(c.texte)) {
      const nf = melange(c.texte, '#120a10', .55), nf2 = melange(c.texte, '#120a10', .35), ok = min => x => hex6(x) && ratio(x, nf) >= min && ratio(x, nf2) >= min;
      const nt = [fond].find(ok(7)) || '#f1ede5', nt2 = [melange(fond, hex6(c.texte2) ? c.texte2 : c.texte, .25)].find(ok(4.5)) || nt;
      const nGrand = cands.find(x => ratio(x, nf) >= 3) || nt, nVif = cands.find(ok(4.5)) || nt2;
      let nAplat = nt, nSur = nf;
      for (const x of cands) { if (ratio(x, nf) < 3) continue; const best = ['#ffffff', nf, nt].reduce((a, b) => ratio(b, x) > ratio(a, x) ? b : a); if (ratio(best, x) >= 4.5) { nAplat = x; nSur = best; break; } }
      n = { fond: nf, fond2: nf2, texte: nt, texte2: nt2, vif: nVif, grand: nGrand, aplat: nAplat, sur: nSur, nuit: nf };
    }
    return { n, fond, fond2, texte, texte2, vif, grand, aplat, sur, sombre, scene: hex6(c.scene) ? c.scene : grand,
      nuit: sombre ? fond : (hex6(s.fondSombre) && lum(s.fondSombre) < .2 ? s.fondSombre : '#1a1016'), lueur: c.lueur || 'transparent',
      police: titre ? `"${titre}", Archivo, Georgia, serif` : 'Archivo, "Helvetica Neue", Arial, sans-serif',
      graisse: +pol.titreGraisse || 700, casse: CAPITALES.has(titre) ? 'uppercase' : 'none', motif: u.motif || s.motif || '' };
  }
  // (un univers clair porte aussi sa nuit, --un-* : html[data-theme="nuit"] [style*="--un-fond"] la lui donne)
  const varsU = t => Object.assign({ '--u-fond': t.fond, '--u-fond2': t.fond2, '--u-texte': t.texte, '--u-texte2': t.texte2, '--u-vif': t.vif, '--u-grand': t.grand,
    '--u-aplat': t.aplat, '--u-sur': t.sur, '--u-scene': t.scene, '--u-nuit': t.nuit, '--u-lueur': t.lueur, '--u-police': t.police,
    '--u-graisse': String(t.graisse), '--u-casse': t.casse }, t.n ? { '--un-fond': t.n.fond, '--un-fond2': t.n.fond2, '--un-texte': t.n.texte, '--un-texte2': t.n.texte2,
    '--un-vif': t.n.vif, '--un-grand': t.n.grand, '--un-aplat': t.n.aplat, '--un-sur': t.n.sur, '--un-nuit': t.n.nuit } : {});
  const uStyleBrut = s => Object.entries(varsU(jeton(s))).map(([k, v]) => `${k}:${v}`).join(';');
  const uStyle = s => esc(uStyleBrut(s));
  // le titre d'un spectacle posé sur le papier de la maquette : sa police, sa couleur assombrie pour rester lisible ; la nuit (--tcn),
  // éclaircie
  const titreStyle = (s, fond = '#ffffff') => { const t = jeton(s), c = s.couleur || t.scene; return esc(`--tc:${fonce(c, fond)};--tcn:${hex6(c) ? eclaircit(c, NUIT5_2, 4.6) : '#f2edf1'};--tp:${t.police};--tg:${t.graisse}`); };

  /* ---------- les motifs : la signature discrète de chaque univers ---------- */
  const SVGA = 'aria-hidden="true" focusable="false"';
  function motifGrand(m) {
    const g = (vb, d) => `<svg viewBox="${vb}" ${SVGA} fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    let t = '';

  function datesVoir(s) {

  // la présentation d'un spectacle (l'onglet voir d'un spectacle en tournée, la page d'un spectacle qui ne tourne plus) : son

  /* ---------- la page d'un spectacle qui n'est plus en tournée (règle 21) : une seule page, sans onglets ----------
     Sa présentation (comme l'onglet voir, sans dates à venir) et sa distribution, puis le bilan de ses dates passées : ses chiffres
     en aplats (ses dates, ses communes, ses saisons : tirés des données seules), la frise de sa tournée, ses dates par saison (de la
     plus récente à la plus ancienne) à côté de la carte-affiche de tous ses lieux ; enfin les actions culturelles menées. */
  // ses dates passées, toutes saisons : [{ k (la saison), titre, rows }], la plus récente d'abord, et dans chaque saison de la plus
  // récente à la plus ancienne (une ligne sans date, une année seule, reste à la suite de la précédente)
  function datesPassees(s) {
    const out = [];
    Object.keys(D.saisons || {}).sort().reverse().forEach(k => {
      const SA = D.saisons[k], rows = []; let i = 0;
      (SA.spectacles || []).forEach(g => { let prev = null; (g.dates || []).forEach(d => {
        const n = i++; if (g.slug !== s.slug) return;
        let fin = cleDate(d, k); const suite = !fin; if (fin) prev = fin; else fin = prev;
        if (fin && fin >= D.aujourdhui) return;   // une date à venir n'est pas au bilan
        rows.push({ d, g, k: fin || '', saison: k, i: n, fid: cleLigne(d, k, n), suite, titre: s.titre, cle: s.slug });
      }); });
      if (rows.length) out.push({ k, titre: SA.titre, rows: rows.sort((a, b) => (a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i)) });
    });
    return out;
  }
  function bilan(s) {

    const chiffres = [[jouees.length, L.dates], [new Set(jouees.map(r => r.d.l).filter(l => l != null)).size, L.communes], [new Set(jouees.map(r => r.saison)).size, L.saisons]].filter(([n, l]) => n && l);
    const lieux = geo.passe.map(x => ({ ...x, n: (x.dates || []).length || 1 }));
    return `${p.representations ? `<p class="bilan-rep"${ed(P(s, 'programmer.representations'))}>${nombre(p.representations)}</p>` : ''}
      ${chiffres.length ? `<ul class="bilan-n">${chiffres.map(([n, l]) => `<li><b>${n}</b><span>${esc(l)}</span></li>`).join('')}</ul>` : ''}
      <div class="u-frise" id="u-bilan"></div>
      <div class="bilan-g"><div class="liste" data-agenda="${esc(s.slug)}">${G.map(g => `<section class="bl-s grp"><h3 class="bl-t"><span>${esc(g.titre)}</span>${nJouees(g.rows) ? `<small>${nJouees(g.rows)}</small>` : ''}</h3><ol class="rs">${g.rows.map(r => rangeePasse(r, { titre: false })).join('')}</ol></section>`).join('')}</div>
        <div class="ag-carte bilan-carte">${affiche({ lieux, titre: `${s.titre} – ${L.bilan}`, grand: true })}</div></div>`;

  function pageShow(slug, cle) {

    }

    const hb = $('#u-bilan', main);

    if (obsSommaire) { obsSommaire.disconnect(); obsSommaire = null; }
    const som = $('.sommaire', main);
    if (!som) return;
    const liens = $$('a[data-ch]', som);
    som.addEventListener('click', e => {
      const a = e.target.closest('a[data-ch]');
      if (!a) return;
      e.preventDefault();

      if (!cible) return;
      cible.scrollIntoView({ behavior: bouge() ? 'smooth' : 'auto', block: 'start' });
      const h = document.getElementById(a.dataset.ch + '-t');
      if (h) h.focus({ preventScroll: true });

    if (!('IntersectionObserver' in window)) return;
    const vus = new Map(), ordre = liens.map(a => a.dataset.ch);
    obsSommaire = new IntersectionObserver(es => {
      es.forEach(en => vus.set(en.target.id, en.isIntersecting));
      const cur = [...ordre].reverse().find(id => vus.get(id)) || null;
      if (cur) liens.forEach(a => a.classList.toggle('actif', a.dataset.ch === cur));

  const VARS_U = [...Object.keys(varsU(jeton({}))), '--un-fond', '--un-fond2', '--un-texte', '--un-texte2', '--un-vif', '--un-grand', '--un-aplat', '--un-sur', '--un-nuit'];
  let habit = null;
  function habiller(s) {
    const r = document.documentElement, t = s ? jeton(s) : null, sa = couleurs(), cle = (t ? JSON.stringify(t) : '') + (sa ? sa.tache : '');
    if (cle === habit) return;
    habit = cle;
    VARS_U.forEach(k => r.style.removeProperty(k));
    r.classList.toggle('en-univers', !!t);
    if (t) Object.entries(varsU(t)).forEach(([k, v]) => r.style.setProperty(k, v));
    $('#brand-mark').innerHTML = t ? D.logo.mark : D.logo.octopus;
    const m = $('meta[name="theme-color"]');

  }
  // l'élément du menu de la vue : aria-current="page" ; « true » dans une page qui en dépend (un spectacle : « les spectacles » ;
  // une page de l'espace pro : « l'espace pro ») ; aucun sur l'accueil, le contact, les pages légales
  function marquer(v) {
    $$('#menu a.m').forEach(a => { if (v.menu && a.dataset.m === v.menu) a.setAttribute('aria-current', v.mode || 'page'); else a.removeAttribute('aria-current'); });
  }
  // les polices de titre des univers : un seul <link>, complété si la base apporte une police nouvelle
  function polices() {
    const l = $('#polices');
    if (!l) return;
    const voulu = new Map();
    (D.shows || []).forEach(s => { const p = (s.univers || {}).polices || {}; if (p.titre) voulu.set(p.titre, +p.titreGraisse || 400); });
    const href = l.getAttribute('href') || '';
    if ([...voulu.keys()].every(f => href.includes('family=' + f.replace(/ /g, '+')))) return;
    const fam = ['Archivo:wdth,wght@62..125,100..900', ...[...voulu].map(([f, g]) => f.replace(/ /g, '+') + (g && g !== 400 ? `:wght@${g}` : ''))];
    l.setAttribute('href', `https://fonts.googleapis.com/css2?${fam.map(f => 'family=' + f).join('&')}&display=swap`);
  }

  /* ---------- l'ajustement des grands titres, l'apparition au défilement ---------- */
  function fit() {
    // les grandes capitales tiennent dans leur boîte : le mot le plus large de chaque titre est mesuré par une sonde (toutes les
    // sondes posées d'un coup, puis lues d'un coup : une seule mise en page, au lieu d'une par mot)
    const els = $$('[data-fit]');
    els.forEach(el => { el.style.fontSize = ''; });
    const sondes = els.map(el => {
      const words = el.textContent.split(/[ \n\t]+/).filter(Boolean);
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;display:inline-block';
      probe.setAttribute('aria-hidden', 'true');
      probe.innerHTML = words.map(w => `<span style="display:block">${esc(w)}</span>`).join('');
      el.appendChild(probe);
      return probe;
    });
    // (offsetWidth : la largeur posée, sans la transformation d'une capitale qui est en train de glisser)
    const mesures = els.map((el, j) => ({ el, w: el.clientWidth, widest: sondes[j].offsetWidth, base: parseFloat(getComputedStyle(el).fontSize) }));
    sondes.forEach(p => p.remove());
    const groups = {};
    mesures.forEach(m => { (groups[m.el.dataset.fit] ||= []).push(m); });
    Object.values(groups).forEach(ms => {
      let k = 1;
      ms.forEach(m => { if (m.w && m.widest > m.w) k = Math.min(k, m.w / m.widest); });
      if (k < 1) ms.forEach(m => { m.el.style.fontSize = `${Math.floor(m.base * k * .98)}px`; });
    });
  }
  // les capitales glissent et se compressent, les cartes arrivent l'une après l'autre, la ligne-tentacule se trace, les chiffres
  // comptent ; posé avant toute lecture de mise en page
  function decorer(enPlace) {
    $$('.sec-titre, .aff-titre, .chap-t, .dos-h, .sai-t, .ag-h', main).forEach(e => { if (!e.closest('[data-mv]') && !e.closest('summary')) e.setAttribute('data-mv', 'monte'); });
    $$('.tuiles, .cts, .vgs, .cat, .acs, .galerie, .cast, .faits-g, .pq, .ateliers, .tech, .annees, .eps, .ep-pages, .bilan-n', main).forEach(e => e.setAttribute('data-mv', 'cascade'));
    $$('.sec .sep, .chap .usep, .aff-tete .sep', main).forEach(e => { if (!e.closest('[data-mv]') && !e.closest('[data-troupe]')) e.setAttribute('data-mv', 'trace'); });
    $$('.n, .bilan-n b', main).forEach(e => e.setAttribute('data-mv', 'compte'));
    if (MV) MV.reveler(main, { immediat: enPlace });
  }

  /* ---------- les adresses (règle 21) : le menu (les saisons, les spectacles, la compagnie, l'espace pro), une saison
     (#/saisons/<saison>), les deux pages de l'espace pro, les onglets d'un spectacle en tournée et leur mémoire, la page unique d'un
     spectacle qui ne tourne plus ---------- */
  function resoudre(chemin) {
    const S = D.site, p = chemin.split('/').filter(Boolean), M0 = menuDe('saisons');
    if (chemin === '') return { cle: 'accueil', titre: S.accueil, rendu: pageAccueil, init: initAccueil };
    if (p[0] === 'saisons' && M0 && p.length <= 2) {
      if (p.length === 1) return { cle: 'saisons', menu: 'saisons', titre: M0.texte, rendu: () => pageSaisons(null), init: initSaisons };
      const x = (S.saisons || []).find(y => y.saison === p[1]);
      return x && D.saisons[p[1]] ? { cle: chemin, menu: 'saisons', titre: x.titre, rendu: () => pageSaisons(p[1]), init: initSaisons } : null;
    }
    if (p[0] === 'espace-pro' && p.length === 2 && (p[1] === 'programmer' || p[1] === 'etablissement') && entree(p[1])) {
      const r = p[1] === 'programmer' ? [pageProgrammer, initProgrammer] : [pageEtablissement, initEtablissement];
      return { cle: chemin, menu: 'espace-pro', mode: 'true', entree: p[1], memo: p[1], titre: entree(p[1]).texte, rendu: r[0], init: r[1] };
    }
    if (chemin === 'espace-pro' && S.espacePro) return { cle: chemin, menu: 'espace-pro', titre: S.espacePro.titre, rendu: pageEspacePro };
    if (chemin === 'spectacles' && menuDe('spectacles')) return { cle: chemin, menu: 'spectacles', titre: menuDe('spectacles').texte, rendu: pageSpectacles };
    if (chemin === 'compagnie' && menuDe('compagnie')) return { cle: chemin, menu: 'compagnie', titre: (S.compagnie || {}).titre || menuDe('compagnie').texte, rendu: pageCie, init: initCie };
    if (chemin === 'contact' && S.contact) return { cle: chemin, titre: S.contact.titre, rendu: pageContact, init: initForms };
    if (S.legal && Object.hasOwn(S.legal, chemin)) return { cle: chemin, titre: S.legal[chemin].titre, rendu: () => pageLegal(chemin) };
    let m = chemin.match(/^spectacle\/([\w-]+)$/);
    if (m && spectacle(m[1]) && !aOnglets(spectacle(m[1]))) { const s = spectacle(m[1]); return { cle: chemin, menu: 'spectacles', mode: 'true', show: s.slug, titre: s.titre, rendu: () => pageShow(s.slug, null), init: initShow }; }
    m = chemin.match(/^spectacle\/([\w-]+)\/(voir|programmer|etablissement)$/);
    if (m && spectacle(m[1]) && aOnglets(spectacle(m[1]))) {
      const s = spectacle(m[1]), e = entree(m[2]);
      return { cle: chemin, menu: 'spectacles', mode: 'true', memo: m[2], show: m[1], titre: m[2] === 'voir' ? s.titre : `${s.titre} - ${e ? e.court : m[2]}`, rendu: () => pageShow(m[1], m[2]), init: initShow };
    }
    return null;
  }
  // une vue redessinée en place garde la position, le focus, les lieux de diffusion dépliés
  function sauver() {
    const a = document.activeElement;
    let f = null;
    if (a && a !== document.body && main.contains(a) && a !== main) {
      if (a.id) f = { id: a.id };
      else if (a.matches('a[href]')) { const h = a.getAttribute('href'); f = { href: h, i: $$('a[href]', main).filter(x => x.getAttribute('href') === h).indexOf(a) }; }
      else if (a.matches('.aff-lieu[data-l]')) f = { l: a.dataset.l };
      if (f && a.selectionStart != null) { f.s = a.selectionStart; f.e = a.selectionEnd; }
    }
    return { y: scrollY, f, ouverts: $$('details[data-k]', main).filter(d => d.open).map(d => d.dataset.k) };
  }
  function restaurer(g) {
    g.ouverts.forEach(k => { const d = $$('details[data-k]', main).find(x => x.dataset.k === k); if (d) d.open = true; });
    window.scrollTo(0, g.y);
    if (!g.f) return;
    let el = null;
    if (g.f.id) el = document.getElementById(g.f.id);
    else if (g.f.href) el = $$('a[href]', main).filter(x => x.getAttribute('href') === g.f.href)[g.f.i];
    else if (g.f.l) el = $$('.aff-lieu[data-l]', main).find(x => x.dataset.l === g.f.l);
    if (el) { el.focus({ preventScroll: true }); if (g.f.s != null && el.setSelectionRange) try { el.setSelectionRange(g.f.s, g.f.e); } catch (e) { /* champ sans sélection */ } }
  }
  /* ---------- les volets : la page arrive sous des aplats qui traversent l'écran ; sa capitale glisse et se compresse ---------- */
  let voEl = null, voAnims = [], hautTete = 0;
  if ('ResizeObserver' in window) new ResizeObserver(es => { const x = es[0]; hautTete = Math.round(x.borderBoxSize && x.borderBoxSize[0] ? x.borderBoxSize[0].blockSize : x.contentRect.height); }).observe($('#tete'));
  // les couleurs d'une page : l'aplat de l'univers du spectacle, celui d'une page de l'espace pro (et sa couleur vive), sinon la
  // tache de la saison
  function couleursDe(v) {
    if (v.show) { const s = spectacle(v.show); if (s) { const t = jeton(s); return { c: t.aplat, c2: t.sombre ? t.texte : t.nuit }; } }
    const e = v.entree ? entree(v.entree) : null;
    if (e) return { c: e.couleur, c2: e.couleurVive };
    return { c: 'var(--tache)', c2: 'var(--tache-deep)' };
  }
  const finirVolets = () => { voAnims.forEach(a => { try { a.cancel(); } catch (e) { /* finie */ } }); voAnims = []; if (voEl) voEl.classList.remove('on'); };
  function volets(type, c) {
    finirVolets();
    if (!bouge() || !main.animate || !c || type === 'onglet' || type === 'premiere') return;
    if (!voEl) { document.body.insertAdjacentHTML('beforeend', `<div class="volets" aria-hidden="true">${'<i class="volet"></i>'.repeat(5)}</div>`); voEl = document.body.lastElementChild; }
    voEl.style.setProperty('--vo-haut', `${hautTete}px`);
    voEl.style.setProperty('--vo-c', c.c);
    voEl.style.setProperty('--vo-c2', c.c2);
    voEl.classList.add('on');
    // cinq bandes décalées de 30 ms : une diagonale d'aplat traverse l'écran (de droite à gauche au retour) ; 450 ms en tout
    const retour = type === 'retour', de = retour ? 'translateX(162%)' : 'translateX(-101%)', a = retour ? 'translateX(-101%)' : 'translateX(162%)';
    voAnims = [...voEl.children].map((v, i) => v.animate([{ transform: de }, { transform: a }], { duration: 330, delay: i * 30, easing: 'cubic-bezier(.62,0,.32,1)', fill: 'both' }));
    voAnims[voAnims.length - 1].onfinish = finirVolets;
  }
  // la grande capitale de la page qui arrive : elle glisse depuis la gauche (depuis la droite au retour) et se compresse
  function capitale(type) {
    if (!bouge() || !main.animate || type === 'premiere') return;
    const h = $('h1', main); if (!h || h.closest('.bd')) return;
    const cibles = h.classList.contains('sh-titre') ? $$('.l', h) : [h], dx = type === 'retour' ? '4%' : '-4%';
    cibles.forEach((el, i) => { el.style.transformOrigin = '0 60%';
      el.animate([{ transform: `translateX(${dx}) scaleX(1.24)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: type === 'onglet' ? 300 : 460, delay: 30 + i * 70, easing: 'cubic-bezier(.16,.84,.2,1)', fill: 'backwards' }); });
  }
  // d'un onglet à l'autre : l'en-tête reste ; les chapitres paraissent sous lui
  function corpsParait() {
    const c = $('.sh-corps', main);
    if (c && c.animate && bouge()) c.animate([{ opacity: 0, transform: 'translateX(-14px)' }, { opacity: 1, transform: 'none' }], { duration: 260, delay: 40, easing: 'cubic-bezier(.16,.84,.2,1)', fill: 'backwards' });
  }

  // la suite d'une vue : ses places remplies l'une après l'autre (une par image : chaque mise en page reste courte), puis ce qui
  // les attendait ; ses capitales s'ajustent à l'image suivante
  function completer(tour, reste, g) {
    if (tour !== tours) return;
    const t = $('template[data-suite]', main);
    if (t) {
      const f = reste[+t.dataset.suite], parent = t.parentElement;
      if (f) t.insertAdjacentHTML('beforebegin', f());
      t.remove();
      if (parent && !$('template[data-suite]', parent)) parent.removeAttribute('data-suite-attend');
      if ($('template[data-suite]', main)) { requestAnimationFrame(() => setTimeout(() => completer(tour, reste, g), 0)); return; }
    }
    g.forEach(f => f());
    decorer(false);
    requestAnimationFrame(fit);
  }

  /* ---------- la navigation : le genre de chaque passage (une entrée, un spectacle, un onglet, le retour, une page) ---------- */
  const pile = [];
  let dernierClic = null, couleurCourante = null;
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (a) dernierClic = { a, t: performance.now() }; }, { capture: true, passive: true });
  function genre(chemin) {
    const h = '#/' + chemin, retour = pile.length > 1 && pile[pile.length - 2] === h;
    if (retour) pile.pop(); else if (pile[pile.length - 1] !== h) pile.push(h);
    if (pile.length > 60) pile.splice(0, pile.length - 60);
    const sp = chemin.match(/^spectacle\/([^/]+)\//);
    if (sp && vueCle && vueCle.startsWith(`spectacle/${sp[1]}/`)) return 'onglet';
    if (retour) return 'retour';
    if (/^spectacle\//.test(chemin)) return 'spectacle';
    return (D.site.menu || []).some(x => x.href === '#/' + chemin) || /^espace-pro\//.test(chemin) ? 'entree' : 'page';
  }
  // l'élément partagé : la photo de la carte cliquée (elle devient la grande photo de sa page)
  const partage = a => { if (!a) return null; const n = a.closest('[data-mv-nom]') || (a.closest('.tuile, .vg, .ct, .fp') || a).querySelector('[data-mv-nom]'); return n && main.contains(n) ? n : null; };
  let vueCle = null, tours = 0;
  function route(enPlace = false) {
    LF = innerWidth;
    const h = location.hash;
    if (h && h !== '#' && !h.startsWith('#/') && vueCle) return;
    let chemin = '';
    try { chemin = decodeURIComponent(h.replace(/^#\/?/, '').split('?')[0]).replace(/\/+$/, ''); } catch (e) { chemin = '?'; }
    // une vue l'emporte sur une redirection de D (#/espace-pro, autrefois redirigé, est une page)
    const red = chemin !== 'espace-pro' && (D.site.redirections || {})['#/' + chemin];
    if (red && red !== h) { location.replace(red); return; }
    let m = chemin.match(/^agenda\/(\d{4}-\d{4})$/);   // l'ancienne page d'une saison
    if (m) { location.replace(D.saisons[m[1]] ? `#/saisons/${m[1]}` : (menuDe('saisons') || {}).href || '#/'); return; }
    m = chemin.match(/^spectacle\/([\w-]+)(?:\/([\w-]+))?$/);
    if (m && spectacle(m[1])) {
      const s = spectacle(m[1]);
      // un spectacle qui ne tourne plus n'a qu'une page : ses anciens onglets y mènent ; un spectacle en tournée, sans onglet : l'onglet
      // retenu (ou « voir ») ; sans action culturelle, pas d'onglet établissement
      if (!aOnglets(s) && m[2]) { location.replace(`#/spectacle/${s.slug}`); return; }
      if (aOnglets(s) && (!m[2] || !CLES.includes(m[2]))) { location.replace(lienSp(s.slug, retenue() || 'voir')); return; }
      if (aOnglets(s) && m[2] === 'etablissement' && !s.actionCulturelle) { location.replace(lienSp(s.slug, 'voir')); return; }
    }
    const v = resoudre(chemin);
    if (!v) { location.replace('#/'); return; }
    if (!enPlace && v.cle === vueCle) { window.scrollTo(0, 0); const t = $('h1', main); if (t && !INTRO.ouverte()) t.focus({ preventScroll: true }); return; }
    if (enPlace) versionD++;
    const premiere = vueCle == null, type = enPlace ? 'place' : premiere ? 'premiere' : genre(chemin);
    if (premiere) pile.push('#/' + chemin);
    const clic = dernierClic && performance.now() - dernierClic.t < 1200 ? dernierClic : null;
    dernierClic = null;
    const depuis = type === 'spectacle' || type === 'entree' ? partage(clic && clic.a) : null;
    const couleurs = type === 'retour' ? couleurCourante : couleursDe(v);
    const tour = ++tours;
    let voletsPartis = false;
    const faire = () => {
      if (tour !== tours) return;   // une navigation plus récente l'a emporté
      const garde = enPlace ? sauver() : null;
      ANIM = !garde;
      vueCle = v.cle;
      if (v.memo) retenir(v.memo);
      construireTete(); construirePied(); polices();
      habiller(v.show ? spectacle(v.show) : null);
      marquer(v);
      Object.keys(REG).forEach(k => { if (!document.getElementById(k)) delete REG[k]; });
      frises.forEach(f => f.detruire()); frises = [];
      suites = garde ? null : [];
      main.innerHTML = v.rendu();
      const reste = suites; suites = null;
      attentes = reste && reste.length ? [] : null;
      // une place qui attend sa suite garde la hauteur d'un écran : ce qui la suit ne bouge pas sous les yeux quand elle se remplit
      if (attentes) $$('template[data-suite]', main).forEach(t => t.parentElement.setAttribute('data-suite-attend', ''));
      document.title = `${v.titre} - ${D.site.titreSuffixe}`;
      // en place et à la première vue, les capitales s'ajustent tout de suite ; après un geste, dans l'image qui suit (avant
      // qu'elle soit peinte) : la page n'est mise en page qu'une fois, dans l'image, et pas en plus dans la tâche du geste
      const ajuster = !!garde || type === 'premiere';
      if (ajuster) fit();
      if (v.init) v.init();
      decorer(!!garde);
      if (attentes) { const g = attentes; attentes = null; requestAnimationFrame(() => setTimeout(() => completer(tour, reste, g), 0)); }
      couleurCourante = couleursDe(v);
      if (garde) restaurer(garde);
      else {
        // la vue remonte en haut et son titre prend le focus à l'image suivante (avant qu'elle soit peinte)
        requestAnimationFrame(() => { if (!ajuster) fit(); window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); if (!INTRO.ouverte()) { const t = $('h1', main); if (t) t.focus({ preventScroll: true }); } });
        if (!voletsPartis) volets(type, couleurs);
        capitale(type);
        if (type === 'onglet') corpsParait();
      }
      ANIM = true;
    };
    // la première vue (et sous l'ouverture) sans transition ; ensuite, les volets ; MOUVEMENT.transition (View Transition)
    // seulement quand un élément passe d'une page à l'autre (la photo d'une carte, l'aplat d'un onglet) : sans lui, elle ne
    // ferait que retarder la page d'une image ; sans elle, les volets partent dès l'image du geste et la page se pose dessous à
    // la tâche suivante (le geste se voit tout de suite)
    if (enPlace || premiere || !MV || INTRO.ouverte()) faire();
    else if (!depuis && type !== 'onglet') { volets(type, couleurs); voletsPartis = true; requestAnimationFrame(() => setTimeout(faire, 0)); }
    else MV.transition(faire, { type, depuis });
  }

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  $('.skip').addEventListener('click', e => { e.preventDefault(); main.focus(); });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    if (a.getAttribute('href') === (location.hash || '#/')) { e.preventDefault(); route(); }
  });
  let raf = 0;
  const reajuster = () => { fit(); $$('.aff', main).forEach(placer); };
  addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(reajuster); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reajuster);
  /* ---------- les vidéos (règle 18) : à leur arrivée, un aplat à la couleur du spectacle découvre l'écran (il part quand le lecteur
     est chargé) ; la page s'éteint d'un coup sec autour de la vidéo, se rallume plus vite ; moins d'animations : sans ---------- */
  if (LC) LC.regler({ univers: s => (s ? uStyleBrut(s) : ''), effet: {
    arrivee: (fig, ifr) => {
      const cadre = $('.lc-cadre', fig);
      if (!bouge() || !cadre) return;
      const b = document.createElement('span');
      b.className = 'lc-balai'; b.setAttribute('aria-hidden', 'true');
      cadre.appendChild(b);
      let parti = false;
      const fin = () => b.remove(), partir = () => { if (parti) return; parti = true; b.classList.add('part'); b.addEventListener('animationend', fin, { once: true }); setTimeout(fin, 900); };
      ifr.addEventListener('load', partir, { once: true });
      setTimeout(partir, 1400);
    },
    eteindre: voile => (bouge() && voile.animate ? voile.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'cubic-bezier(.62,0,.32,1)' }) : null),
    rallumer: voile => (bouge() && voile.animate ? voile.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-in' }).finished : null),
  } });
  // l'ouverture : la pieuvre et le mot en blanc sur l'aplat de la tache, à la couleur de la saison (règle 22) ; après la révélation,
  // le bandeau se met en marche
  // les tentacules : aucun moment dans cette maquette (l'aplat est son seul geste) ; aucun écouteur, rien ne joue sur un clic
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ clic: false, pages: false });
  // la pression : la pièce se serre et prend l'aplat, dès le pointerdown
  if (MV) MV.presse(document);
  INTRO.ouvrir({ fond: (couleurSaison() || {}).tache || '#1a1016', encre: '#ffffff', classe: 'm05-intro', apres: () => { if (bdCtl) bdCtl.demarrer(); } });
  addEventListener('hashchange', () => route());
  route();
  // l'agenda passé et tous les lieux de la compagnie : calculés d'avance, quand le navigateur est libre (le geste n'a plus qu'à
  // les lire)
  const davance = () => { retenu('agendaPasse', agendaPasse); retenu('tout', () => GEO.tout()); };
  if ('requestIdleCallback' in window) requestIdleCallback(davance, { timeout: 1500 }); else setTimeout(davance, 600);
  // la base de la compagnie : chaque enregistrement redessine la vue en place
  let plusTard = 0;
  const enPlace = () => { clearTimeout(plusTard); if (LC && LC.actif()) { plusTard = setTimeout(enPlace, 2500); return; } route(true); };
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(enPlace);
})();
</script>
</body>
