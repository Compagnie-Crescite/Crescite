<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<meta name="theme-color" content="#1a1016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Grotesk:wght@600&family=Cormorant+Garamond:wght@600&family=Bodoni+Moda:wght@700&family=Anton&family=Ubuntu:wght@700&family=Grenze+Gotisch:wght@600&family=IM+Fell+English&family=IM+Fell+French+Canon&display=swap">
<style>
/* 05 Magenta : la marque en grand (la tache, la pieuvre blanche, des capitales larges) ; sur la page d'un spectacle, son
   univers prend le dessus : ses couleurs, sa police de titre, son motif. La tache de la marque, ses aplats et ses volets ont la
   couleur de la saison (règle 22 : D.site.couleurSaison, posée par le script dans couleurs()) : la marque n'est plus magenta. */
:root{
  /* la tache : l'aplat de la marque (sous un texte blanc) ; --tache-deep, plus profonde (le pied, le second volet) ; --tache-txt,
     la même couleur quand elle est un texte ou un filet sur le papier. En attendant le script : l'encre, sans magenta */
  --tache:#2a2430;--tache-deep:#1a1016;--tache-txt:#2a2430;
  --papier:#fff;--papier2:#f6f4f8;--encre:#1a1016;--encre2:#5e4b56;--white:#fff;
  --gut:clamp(16px,4vw,56px);--max:1280px;--head:84px;--bas:0px;
  --bg:var(--papier);--fg:var(--encre);--fg2:var(--encre2);--acc:var(--tache-txt);--accg:var(--tache-txt);--ligne:rgba(26,16,22,.16);--focus:var(--encre);
  --ce:#fff;--cl:#fff;--cf:var(--tache);--tip-bg:#fff;--tip-c:var(--tache-deep);
  --ed-fond:var(--papier);--ed-encre:var(--encre);--ed-accent:var(--tache);--ed-sur-accent:#fff;--ed-police:Archivo,"Helvetica Neue",Arial,sans-serif;--ed-rayon:22px;--ed-trait:rgba(26,16,22,.18);
  --video:#08070a;--video-voile:rgba(6,5,8,.94);
  color-scheme:light;
  /* les tentacules (tentacules.js) : la pieuvre blanche de la marque ; blanches elles aussi, liserées de la tache (elles se lisent
     sur la tache comme sur le papier), ponctuées de ventouses à sa couleur ; leur empreinte à la tache profonde */
  --tt-encre:#fff;--tt-accent:var(--tache-deep);--tt-ventouse:var(--tache);--tt-neutre:#fff;--tt-fond:var(--tache);--tt-epaisseur:2.8;
}
/* ———— la nuit (règle 19, THEME) : la maquette, née sur le papier blanc, invente sa nuit. Le papier devient une encre presque
   noire, l'encre un blanc cassé ; les aplats de la tache restent des aplats, profonds (à peine plus clairs que le jour : la
   tache se voit sur la nuit, son texte blanc est au-dessus de 7:1), le texte à sa couleur prend sa couleur vive. Les univers clairs passent dans leur nuit
   (--un-*, jeton()) ; les univers sombres restent eux-mêmes. AA partout. ———— */
html[data-theme="jour"]{color-scheme:light}
html[data-theme="nuit"]{color-scheme:dark;
  --papier:#100e13;--papier2:#1a1720;--encre:#f2edf1;--encre2:#c6bbc3;--ligne:rgba(242,237,241,.18);--ed-trait:rgba(242,237,241,.22)}
/* un univers clair dans sa nuit : ses couleurs de D retournées (son texte, assombri, devient son fond), posées à côté des siennes
   (--un-*) ; sur la racine (une page de spectacle) comme sur une carte */
html[data-theme="nuit"][style*="--un-fond"],html[data-theme="nuit"] [style*="--un-fond"]{--u-fond:var(--un-fond)!important;--u-fond2:var(--un-fond2)!important;
  --u-texte:var(--un-texte)!important;--u-texte2:var(--un-texte2)!important;--u-vif:var(--un-vif)!important;--u-grand:var(--un-grand)!important;
  --u-aplat:var(--un-aplat)!important;--u-sur:var(--un-sur)!important;--u-nuit:var(--un-nuit)!important}
/* le titre d'un spectacle posé sur le papier (--tc, assombri pour le jour) : la nuit, sa couleur éclaircie (--tcn) */
html[data-theme="nuit"] [style*="--tcn:"]{--tc:var(--tcn)!important}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--head) + 24px)}
body{margin:0;background:var(--papier);color:var(--encre);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.55;font-weight:400;font-stretch:100%;-webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1.5px}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,figure,blockquote,dl,dd{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-100px;z-index:60;padding:12px 18px;background:var(--papier);color:var(--encre);font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--gut));margin-inline:auto;padding-inline:var(--gut)}
.disp{font-stretch:125%;font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:-.01em;text-wrap:balance}
.lbl{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
.ico{width:1em;height:1em;flex:none}
.sur-mag{--bg:var(--tache);--fg:#fff;--fg2:#fff;--acc:#fff;--accg:#fff;--ligne:rgba(255,255,255,.45);--focus:#fff;--sep:#fff;background:var(--tache);color:#fff}
/* un univers : les couleurs du spectacle, calculées pour rester lisibles (voir jeton() plus bas) */
.u{--bg:var(--u-fond);--fg:var(--u-texte);--fg2:var(--u-texte2);--acc:var(--u-vif);--accg:var(--u-grand);--ligne:color-mix(in srgb,var(--u-texte) 22%,transparent);--focus:var(--u-texte);
  --ce:var(--u-grand);--cl:var(--u-texte);--cf:var(--u-fond2);--tip-bg:var(--u-texte);--tip-c:var(--u-fond);background:var(--u-fond);color:var(--u-texte)}
.u-police{font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-stretch:100%;letter-spacing:0}

/* la ligne-tentacule, et sa variante d'univers (le motif du spectacle) */
.sep{display:flex;align-items:center;width:100%;height:26px;color:var(--sep,var(--tache-txt))}
.sep svg{height:26px;overflow:visible}
.sep-vague{flex:1 1 0;min-width:0}
.sep-boucle{flex:none;width:46px}
.usep{display:flex;align-items:center;gap:10px;width:100%;max-width:520px;height:26px;color:var(--u-grand)}
.usep .usep-l{flex:1 1 0;min-width:0;height:26px;overflow:visible}
.usep svg:last-child{flex:none;width:46px;height:26px;overflow:visible}

/* l'en-tête (règle 21) : sur l'aplat de la tache, la marque (la pieuvre blanche) et le menu, toute la navigation première, en
   quatre pièces de capitales larges (les saisons, les spectacles, la compagnie, l'espace pro) ; la pièce de la vue est un aplat
   blanc, celle dont on lit une page (un spectacle, une page de l'espace pro) un cadre ; au bout, le jour et la nuit */
.site-head{position:sticky;top:0;z-index:40;background:var(--tache);color:#fff;--focus:#fff}
.tete-bas{display:flex;align-items:center;justify-content:space-between;gap:20px;height:var(--head)}
.brand{display:inline-flex;align-items:center;gap:12px;flex:none;color:inherit;text-decoration:none}
.brand-mark{display:block;width:62px}
.brand-mark svg{width:100%;height:auto}
.en-univers .brand-mark{width:50px}
.brand-word{font-stretch:125%;font-weight:800;font-size:23px;line-height:1;letter-spacing:-.01em}
.menu{margin-left:auto}
.menu ul{display:flex;align-items:stretch;gap:6px;margin:0;padding:0;list-style:none}
.m{position:relative;display:flex;align-items:center;gap:11px;height:100%;min-height:54px;padding:9px 18px 9px 14px;border:2px solid transparent;border-radius:22px;color:inherit;text-decoration:none;font-stretch:125%;font-weight:800;font-size:13.5px;line-height:1.14;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:background-color .2s,border-color .2s,color .2s}
.m-pt{flex:none;width:11px;height:11px;border-radius:50%;background:currentColor;opacity:.42;box-shadow:0 0 0 2px currentColor;transition:opacity .2s}
.m:hover{background:rgba(255,255,255,.13)}
.m:hover .m-pt,.m[aria-current] .m-pt{opacity:1}
.m[aria-current="true"]{border-color:currentColor}
.m[aria-current="page"]{background:#fff;color:var(--tache-jour,var(--tache))}
.m-court{display:none}
.tete-jn{flex:none;display:flex}
.tete-jn:empty{display:none}
.theme-m05{display:grid;place-items:center;width:48px;height:48px;padding:0;border:2px solid currentColor;border-radius:50%;background:none;color:inherit;cursor:pointer;transition:background-color .2s,color .2s}
.theme-m05 .theme-icone{width:22px;height:22px}
.theme-m05:hover{background:#fff;color:var(--tache)}
.en-univers .theme-m05:hover{background:var(--u-aplat);color:var(--u-sur);border-color:var(--u-aplat)}

/* l'en-tête dans l'univers d'un spectacle : ses couleurs ; la marque reste en signature (sa tache, à la couleur de la saison) */
.en-univers .site-head{background:var(--u-fond);color:var(--u-texte);--focus:var(--u-texte);box-shadow:0 1px 0 color-mix(in srgb,var(--u-texte) 18%,transparent)}
.en-univers .m:hover{background:color-mix(in srgb,var(--u-texte) 10%,transparent)}
.en-univers .m[aria-current="true"]{border-color:var(--u-grand)}
.en-univers .m[aria-current="page"]{background:var(--u-aplat);color:var(--u-sur)}
.en-univers body{background:var(--u-fond)}
.brand-mark .logo-tache{fill:var(--tache)}

/* les boutons, les étiquettes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 28px;border:2px solid #fff;border-radius:999px;background:#fff;color:var(--tache-deep);font-stretch:125%;font-weight:800;font-size:15px;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;transition:background-color .25s,color .25s}
.btn .ico{width:18px;height:18px;transition:transform .25s}
.btn:hover{background:transparent;color:#fff}
.btn:hover .ico{transform:translateX(4px)}
.btn--mag{border-color:var(--tache);background:var(--tache);color:#fff}
.btn--mag:hover{background:transparent;color:var(--tache-txt)}
.btn--ink{border-color:var(--encre);background:var(--encre);color:var(--papier)}
.btn--ink:hover{background:transparent;color:var(--encre)}
.u .btn,.btn-u{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:50px;padding:0 24px;border:2px solid var(--u-aplat);border-radius:999px;background:var(--u-aplat);color:var(--u-sur);font-stretch:125%;font-weight:800;font-size:14px;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .25s,color .25s}
.u .btn:hover,.btn-u:hover{background:transparent;color:var(--u-texte)}
.btn-u .ico{width:17px;height:17px}
.tag{display:inline-block;padding:3px 11px;border:1.5px solid currentColor;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.1em;line-height:1.4;text-transform:uppercase;white-space:nowrap}
.tag--u{color:var(--acc)}
.tag--plein{border-color:var(--u-aplat,var(--tache));background:var(--u-aplat,var(--tache));color:var(--u-sur,#fff)}
.k{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

/* l'accueil : le bandeau EN TOURNÉE, chaque spectacle dans sa couleur */
.bd{position:relative;height:clamp(420px,calc(100svh - var(--head) - 230px),780px);background:var(--tache);color:#fff;overflow:hidden;isolation:isolate;--focus:#fff}
.bd-haut{position:absolute;z-index:3;top:clamp(20px,3.6svh,40px);left:0;right:0;pointer-events:none}
.bd-sur{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 9px;border:2px solid #fff;border-radius:999px;font-stretch:125%;font-weight:800;font-size:clamp(13px,1.1vw,16px);letter-spacing:.2em;line-height:1;text-transform:uppercase;pointer-events:auto}
.bd-sur::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:pouls 2.2s ease-in-out infinite}
@keyframes pouls{50%{opacity:.25}}
.bd-slides{position:absolute;inset:0}
.bd-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.bd-slide.is-on{opacity:1;visibility:visible;transition:opacity 1s ease}
.bd-photo{position:absolute;inset:0;background:var(--u-scene,var(--tache));isolation:isolate}
.bd-photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.07);transition:transform 9s linear}
.bd-slide.is-on .bd-photo img{transform:scale(1)}
.bd-slide::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,color-mix(in srgb,var(--u-nuit,#2a071b) 88%,transparent),color-mix(in srgb,var(--u-nuit,#2a071b) 40%,transparent) 46%,transparent 72%),linear-gradient(to bottom,color-mix(in srgb,var(--u-nuit,#2a071b) 45%,transparent),transparent 26%)}
.bd-txt{position:absolute;z-index:2;left:0;right:0;bottom:clamp(96px,14svh,150px);display:flex;flex-direction:column;align-items:flex-start;gap:clamp(16px,2.6svh,28px)}
.bd-titre{max-width:100%;font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(44px,8.6vw,140px);line-height:.98;letter-spacing:-.005em;text-wrap:balance}
.bd-l{display:block;overflow:hidden;padding-top:.16em;margin-top:-.16em;padding-bottom:.06em}
.bd-l>span{display:inline-block;transform:translateY(112%);transition:transform .9s cubic-bezier(.2,.75,.1,1)}
.bd-l+.bd-l>span{transition-delay:.08s}
.bd-slide.is-on .bd-l>span{transform:none}
.bd.attend .bd-l>span{transform:translateY(112%)}
.bd-pied{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.bd-pied .btn{opacity:0;transform:translateY(10px);transition:opacity .6s ease .3s,transform .6s ease .3s,background-color .25s,color .25s}
.bd-slide.is-on .bd-pied .btn{opacity:1;transform:none}
.bd.attend .bd-pied .btn{opacity:0}
.bd-credit{font-size:13px;letter-spacing:.04em}
.bd-bas{position:absolute;z-index:3;left:0;right:0;bottom:clamp(18px,3svh,34px);display:flex;align-items:flex-end;gap:20px}
.bd-sel{flex:1 1 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin:0;padding:0;list-style:none}
.bd-b{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:10px;width:100%;height:100%;padding:10px 0 0;border:0;background:none;color:#fff;text-align:left;cursor:pointer}
.bd-b-t{font-size:12px;font-weight:700;letter-spacing:.12em;line-height:1.3;text-transform:uppercase;opacity:.86;transition:opacity .3s}
.bd-b-t span{display:block}
.bd-b:hover .bd-b-t,.bd-b[aria-current] .bd-b-t{opacity:1}
.bd-b-l{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.34);overflow:hidden}
.bd-b-l span{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.bd-b[aria-current] .bd-b-l span{animation:plein 7s linear forwards}
.bd.arret .bd-b[aria-current] .bd-b-l span{animation-play-state:paused}
@keyframes plein{to{transform:scaleX(1)}}
.bd-pause{flex:none;display:grid;place-items:center;width:44px;height:44px;border:2px solid #fff;border-radius:50%;background:none;color:#fff;cursor:pointer}
.bd-pause .ico{width:16px;height:16px}
.bd-pause .i-l,.bd-pause[aria-pressed="true"] .i-p{display:none}
.bd-pause[aria-pressed="true"] .i-l{display:block}

/* l'espace pro : ses deux pages (programmer, les établissements scolaires), en grand, chacune dans la couleur de son parcours */
.ep-pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;padding:0;list-style:none}
.porte{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;height:100%;min-height:230px;padding:clamp(22px,2.4vw,36px) clamp(20px,2.4vw,38px);background:var(--e);color:#fff;text-decoration:none;overflow:hidden;isolation:isolate;--focus:#fff}
.porte-ph{position:absolute;inset:0;z-index:-1;background:var(--e)}
.porte-ph img{width:100%;height:100%;object-fit:cover;transition:transform .9s ease}
.porte-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--e) 70%,#000 30%) 0%,transparent 70%);mix-blend-mode:multiply}
.porte-t{display:block;flex:1 1 auto;min-width:0;font-stretch:125%;font-weight:900;font-size:clamp(24px,2.5vw,40px);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.porte-t small{display:block;margin-top:10px;font-stretch:100%;font-weight:700;font-size:clamp(14px,1.1vw,16px);letter-spacing:.06em;line-height:1.3}
.porte .ico{width:clamp(28px,2.4vw,40px);height:clamp(28px,2.4vw,40px);transition:transform .3s}
.porte:hover .porte-ph img{transform:scale(1.05)}
.porte:hover .ico{transform:translateX(6px)}
.porte:focus-visible{outline-offset:-8px}
.ep-pages li+li .porte{box-shadow:inset 2px 0 0 rgba(255,255,255,.55)}

/* les spectacles dans leurs univers (tuiles de l'accueil) */
.tuiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.4vw,20px);margin:0;padding:0;list-style:none}
.tuile{position:relative;display:flex;flex-direction:column;border-radius:4px;overflow:hidden}
.tuile-a{display:flex;flex-direction:column;height:100%;color:inherit;text-decoration:none}
.duo-u{position:relative;overflow:hidden;background:var(--u-scene);isolation:isolate}
.duo-u img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.tuile-ph{aspect-ratio:4/3}
.tuile-txt{display:flex;flex-direction:column;gap:8px;padding:16px 18px 22px}
.tuile-sur{color:var(--u-vif);font-size:12.5px;font-weight:800;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}
.tuile-t{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(22px,1.9vw,30px);line-height:1.04;text-wrap:balance}
.tuile-t span{display:block}
.tuile-g{position:absolute;top:10px;right:10px;width:46px;color:var(--u-texte);background:var(--u-fond);border-radius:999px;padding:2px 4px;opacity:.92}
.tuile-a:hover img{transform:scale(1.05)}
.tuile-a:focus-visible{outline-offset:-5px}

/* la carte-affiche : des bras épais, aux bouts enroulés, qui poussent depuis Rouen */
.aff-sec{padding:clamp(64px,8vw,120px) 0}
.aff-grille{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto 1fr;grid-template-areas:"tete carte" "liste carte";column-gap:clamp(32px,4.4vw,80px);align-items:start}
.aff-tete{grid-area:tete}
.aff-carte{grid-area:carte;align-self:center}
.aff-liste{grid-area:liste}
.aff-sur{margin-bottom:16px}
.aff-titre{margin-bottom:clamp(20px,2.4vw,30px);font-size:clamp(44px,6vw,92px)}
.aff-part{margin:clamp(22px,2.6vw,32px) 0;font-size:17px;line-height:1.6}
.aff-tete .btn{margin-top:6px}
.prochaines{margin:clamp(20px,2.4vw,30px) 0 clamp(28px,3vw,40px);padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.45)}
.pr{transition:opacity .3s}
.pr a{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.45);text-decoration:none;transition:padding .25s}
.pr-date{font-stretch:125%;font-weight:900;font-size:clamp(18px,1.6vw,22px);line-height:1.12;text-transform:uppercase}
.pr-lieu{font-weight:600;line-height:1.35}
.pr-titre{font-size:13px;font-weight:700;letter-spacing:.12em;line-height:1.35;text-transform:uppercase}
.pr .tag{margin-top:6px}
.pr a:hover,.pr.lit a{padding-left:12px}
.prochaines.a-survol .pr:not(.lit){opacity:.45}
.aff{position:relative}
.aff-svg{width:100%;height:auto;overflow:visible;font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.aff-pays{fill:color-mix(in srgb,var(--ce) 10%,transparent);stroke:color-mix(in srgb,var(--ce) 60%,transparent);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.aff-voisin{fill:color-mix(in srgb,var(--ce) 4%,transparent);stroke:color-mix(in srgb,var(--ce) 30%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.aff-b{fill:var(--ce)}
.aff-s{fill:none;stroke:var(--ce);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:0}
.aff-mt{stroke-dasharray:1 2;stroke-dashoffset:0}
.aff-passe{fill:var(--ce);opacity:.5}
.aff-pt{fill:var(--ce);opacity:.75}
.aff-rouen{fill:var(--ce)}
.aff-anneau{position:absolute;aspect-ratio:1;margin:0;border:1.5px solid var(--ce);border-radius:50%;translate:-50% -50%;pointer-events:none;animation:anneau 2.8s ease-out infinite}
@keyframes anneau{from{transform:scale(.6);opacity:.9}to{transform:scale(1.7);opacity:0}}
.aff-nom,.aff-rouen-nom{fill:var(--cl);stroke:var(--cf);stroke-linejoin:round;paint-order:stroke;font-weight:700;font-stretch:112%;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;transition:opacity .5s ease var(--tn,0s)}
.aff-rouen-nom{font-weight:900;font-stretch:125%;letter-spacing:.06em}
.aff-lieu{cursor:pointer}
.aff-cible{fill:transparent}
.aff-lieu:focus{outline:none}
.aff-lieu:focus-visible .aff-cible{stroke:var(--cl);stroke-width:2.5;vector-effect:non-scaling-stroke}
.aff-t,.aff-passe,.aff-pt{transition:opacity .3s}
.aff-svg.vit .aff-nom{transition-delay:0s}
.aff-svg.a-survol .aff-t:not(.on),.aff-svg.a-survol .aff-nom:not(.on){opacity:.26}
.aff-svg.a-survol .aff-passe:not(.on){opacity:.22}
.aff-passe.on,.aff-pt.on{opacity:1}
.aff-svg.attend .aff-mt,.aff-svg.attend .aff-s{stroke-dashoffset:1}
.aff-svg.vit .aff-bras,.aff-svg.vit .aff-passes{mask:none}
[data-suite-attend]{min-height:100vh}
.aff-svg.attend .aff-nom,.aff-svg.attend .aff-rouen-nom{opacity:0}
.aff-svg.pousse .aff-mt{animation:pousse var(--d,1s) cubic-bezier(.5,0,.2,1) var(--t,0s) both}
.aff-svg.pousse .aff-s{animation:pousse .5s cubic-bezier(.3,0,.2,1) var(--t,0s) both}
@keyframes pousse{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.aff-tip{position:absolute;z-index:5;left:0;top:0;width:max-content;max-width:min(300px,86%);padding:12px 16px 14px;background:var(--tip-bg);color:var(--tip-c);box-shadow:0 14px 34px rgba(26,16,22,.3);pointer-events:none;font-size:15px;line-height:1.35;text-align:left}
.tip-nom{font-stretch:125%;font-weight:900;font-size:16px;line-height:1.15;text-transform:uppercase}
.aff-tip ul{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.aff-tip b{display:block;font-weight:800}

/* les en-têtes de page et les sections */
.ph{position:relative;padding:clamp(36px,4.6vw,68px) 0 clamp(48px,5.6vw,84px);background:var(--e,var(--tache));color:#fff;overflow:hidden;isolation:isolate;--focus:#fff;--sep:#fff}
.ph-ph{position:absolute;top:0;right:0;bottom:0;width:min(48%,680px);z-index:-1;background:var(--e)}
.ph-ph img{width:100%;height:100%;object-fit:cover;}
.ph-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--e),color-mix(in srgb,var(--e) 0%,transparent) 62%)}
.ph .sep{max-width:440px;margin-bottom:clamp(16px,2vw,26px)}
.ph-sur{margin-bottom:12px}
.ph-titre{max-width:min(100%,1100px);font-size:clamp(38px,6.6vw,104px)}
.retour{display:inline-flex;align-items:center;gap:10px;margin-bottom:clamp(16px,2vw,26px);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.retour .ico{width:20px;height:20px;transform:scaleX(-1)}
.retour:hover{text-decoration:underline}
.sec{padding:clamp(60px,7.6vw,112px) 0}
.sec--rose{background:var(--papier2)}
.sec:not(.sec--rose):not(.sur-mag)+.sec:not(.sec--rose):not(.sur-mag){padding-top:0}
.sec-titre{margin:16px 0 clamp(26px,3.4vw,44px);color:var(--accg);font-size:clamp(32px,4.4vw,62px)}
.lead{font-size:clamp(20px,1.8vw,24px);line-height:1.45;font-weight:500}
.prose{max-width:68ch;overflow-wrap:break-word}
.prose>*+*{margin-top:1em}
.prose h2{margin-top:1.7em;color:var(--accg);font-stretch:125%;font-weight:900;font-size:clamp(21px,2vw,28px);line-height:1.1;text-transform:uppercase}
.prose .bloc:first-child h2,.prose h2:first-child{margin-top:0}
.prose ul{padding-left:1.15em}
.prose li+li{margin-top:.55em}
.prose a{color:var(--acc)}
.dons{padding:clamp(40px,5vw,64px) 0;background:var(--papier2);color:var(--encre2);font-size:15px;line-height:1.65}
.dons p{max-width:118ch;margin-top:16px}

/* l'agenda */
.ag{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,4.4vw,80px);align-items:start}
.ag>.ag-carte{grid-column:2;grid-row:1;position:sticky;top:calc(var(--head) + 24px)}
.ag>.liste,.ag>.liste-col{grid-column:1;grid-row:1;min-width:0}
.ag-carte{padding:clamp(16px,1.8vw,26px);background:var(--tache);color:#fff;--focus:#fff}
.u .ag-carte{background:var(--u-fond2);color:var(--u-texte);--focus:var(--u-texte);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--u-texte) 16%,transparent)}
.aff-seule{max-width:780px}
.filtre{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 16px;border:2px solid #fff;border-radius:999px;background:#fff;color:var(--tache-deep);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chip:hover{background:transparent;color:#fff}
.chip .ico{width:16px;height:16px}
.grp+.grp{margin-top:clamp(40px,5vw,64px)}
.mois{display:flex;align-items:center;gap:18px;margin-bottom:4px;color:var(--accg);font-size:clamp(22px,2.2vw,30px)}
.mois::after{content:"";flex:1;height:2px;background:currentColor}
.rs{margin:0;padding:0;list-style:none}
.r{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:6px clamp(18px,2.4vw,36px);padding:20px 0;border-bottom:1px solid var(--ligne);transition:opacity .3s}
.r-when{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.r-big{font-stretch:125%;font-weight:900;font-size:clamp(20px,2vw,28px);line-height:1.02;text-transform:uppercase}
.r-small{color:var(--fg2);font-size:13px;font-weight:700;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}
.r-what{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.r-titre{color:var(--tc,var(--acc));font-family:var(--tp,inherit);font-weight:var(--tg,800);font-size:clamp(18px,1.6vw,22px);line-height:1.2;text-decoration:none}
a.r-titre:hover{text-decoration:underline}
.r-lieu{font-weight:700;line-height:1.3}
.r-det{max-width:100%;color:var(--fg2);font-size:16px;line-height:1.45;overflow-wrap:break-word}
.r .ext{color:var(--acc)}
.r .tag{margin-top:4px;color:var(--acc)}
.ext{font-weight:600}
.ext .ico{display:inline-block;width:.8em;height:.8em;margin-left:.25em;vertical-align:-.05em}
.liste.a-survol .r:not(.lit){opacity:.3}
.r.lit .r-big{color:var(--accg)}
.r--s .r-big{font-size:16px;font-stretch:112%;font-weight:800;line-height:1.25}
.r--annule .r-big{text-decoration:line-through}
/* une semaine de résidence (règle 23) : la pièce « Résidence » en pointillé, le carré évidé de la frise devant */
.tag--res{display:inline-flex;align-items:center;gap:7px;border-style:dashed}
.tag--res i{flex:none;width:9px;height:9px;border-radius:1.5px;box-shadow:inset 0 0 0 2px currentColor}
.sg-titre{color:var(--tc,var(--encre));font-family:var(--tp,inherit);font-weight:var(--tg,900);font-size:clamp(26px,2.8vw,40px);line-height:1.05}
.sg-titre a{text-decoration:none}
.sg-titre a:hover{text-decoration:underline}
.sg-sous{margin-top:8px;font-size:19px;line-height:1.4}
.sg-crea{margin-top:6px;color:var(--acc)}
.sg .rs{margin-top:16px;border-top:2px solid var(--fg)}
/* les saisons passées : une saison par bloc, fermée au départ ; sa petite carte, une tache à la couleur de la saison aux bras blancs */
.sec--outils{padding:clamp(28px,3vw,44px) 0 0}
.ag-outils{display:grid;gap:16px}
.recherche{position:relative;display:block;max-width:420px}
.recherche .ico{position:absolute;left:18px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--acc)}
.recherche input{width:100%;min-height:50px;padding:0 18px 0 48px;border:2px solid var(--encre);border-radius:999px;background:var(--papier);font-weight:600;font-size:17px;color:var(--encre)}
.recherche input::placeholder{color:var(--fg2);opacity:1}
.recherche input:focus-visible{outline:3px solid var(--tache-txt);outline-offset:2px}
.cps{display:flex;flex-wrap:wrap;gap:8px}
.cp{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border:2px solid var(--ligne);border-radius:999px;background:var(--papier);color:var(--encre);font-weight:700;font-size:15px;line-height:1.2;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.cp:hover{border-color:var(--encre)}
.cp[aria-pressed="true"]{border-color:var(--tache);background:var(--tache);color:#fff}
.aff .hors{opacity:.14}
.aff-nom.hors{display:none}
.sec--agenda{padding-bottom:clamp(60px,7vw,100px)}
.sec--agenda .sec-titre{margin-bottom:12px}
.ag-index{position:sticky;top:calc(var(--head) - 6px);z-index:20;display:flex;align-items:center;gap:10px;margin:0 0 4px;padding:12px 0;background:var(--papier);border-bottom:2px solid var(--encre)}
.ag-index ul{flex:1 1 auto;min-width:0;display:flex;gap:8px;margin:0;padding:3px 2px;list-style:none;overflow-x:auto;scrollbar-width:none}
.ag-index li{flex:none}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ligne);background:var(--papier);color:var(--encre);font-weight:800;font-size:15px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.idx{min-height:40px;padding:0 16px;border-radius:999px}
.idx small{font-size:13px;font-weight:700;color:var(--fg2)}
.idx:hover,.idx-tout:hover{border-color:var(--encre)}
.idx[aria-expanded="true"]{border-color:var(--tache-txt);color:var(--tache-txt)}
.idx-actif{border-color:var(--tache);background:var(--tache);color:#fff}
.idx-actif:hover{border-color:var(--tache-deep);background:var(--tache-deep)}
.idx .ico{width:12px;height:12px}
.idx-tout{flex:none;justify-content:center;width:44px;height:44px;padding:0;border-radius:50%}
.idx-tout .ico{width:20px;height:20px}
.sai{border-bottom:1px solid var(--ligne);scroll-margin-top:calc(var(--head) + 70px)}
.sai>summary{display:grid;grid-template-columns:clamp(84px,10vw,128px) minmax(0,1fr) auto;align-items:center;gap:6px clamp(18px,2.6vw,36px);padding:20px 8px;list-style:none;cursor:pointer;transition:background .25s}
.sai>summary::-webkit-details-marker{display:none}
.sai>summary:hover,.sai[open]>summary{background:var(--papier2)}
.sai-carte{display:block;padding:8px;background:var(--tache);border-radius:30px 30px 30px 6px}
.sai-mini{display:block;width:100%;height:auto}
.mb-pays{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.55);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mb-bras{fill:#fff}
.mb-rouen{fill:#fff}
.sai-t{color:var(--accg);font-size:clamp(28px,3.8vw,54px);line-height:.96}
.sai-sp{display:block;margin-top:8px;color:var(--fg2);font-size:15px;font-weight:600;line-height:1.45}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai-n{display:inline-flex;align-items:center;gap:12px;color:var(--accg)}
.sai-n b{font-size:clamp(28px,3vw,44px);line-height:1}
.sai-n .chev{width:28px;height:28px;transition:transform .25s}
.sai[open] .sai-n .chev{transform:rotate(180deg)}
.sai-corps{padding:12px 8px 48px}
.sai-corps:empty{display:none}
.sai-ag>.ag-carte{top:calc(var(--head) + 80px)}
.sai-liste .grp:first-child .mois{margin-top:0}
.r-heure{margin-top:-2px}
/* un lien qui couvre sa carte (une vignette de spectacle) */
.etire{text-decoration:none}
.etire::after{content:"";position:absolute;inset:0;z-index:1}
.etire:hover{text-decoration:underline;text-decoration-thickness:2px}
.etire:focus-visible{outline:none}
.etire:focus-visible::after{outline:3px solid var(--focus);outline-offset:-5px}
.ed-actif .etire::after{content:none}

/* « Je souhaite programmer » : le catalogue */
.cat{display:grid;gap:clamp(20px,2.4vw,32px);margin:0;padding:0;list-style:none}
.fp{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);border-radius:4px;overflow:hidden}
.fp-ph{position:relative;min-height:360px}
.fp-ph img{position:absolute;inset:0}
.fp-c{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:clamp(22px,3vw,44px)}
.fp-sur{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--u-vif);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.fp-t{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(30px,3.2vw,52px);line-height:1;text-wrap:balance}
.fp-t a{text-decoration:none}
.fp-t a:hover{text-decoration:underline;text-decoration-thickness:2px}
.fp-t span{display:block}
.fp-sous{font-size:18px;color:var(--u-texte2)}
.fp-rep{font-size:16px;font-weight:600;line-height:1.3}
.n{display:inline-block;margin-right:.18em;color:var(--u-grand);font-stretch:125%;font-weight:900;font-size:clamp(40px,4vw,64px);line-height:.9;letter-spacing:-.02em;vertical-align:-.08em}
.faits{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.faits li{padding:6px 12px;border:1.5px solid var(--ligne);border-radius:12px;font-size:14px;font-weight:700;line-height:1.35}
.faits .k{margin-right:6px;color:var(--u-vif)}
.fp-fiche{width:100%;display:grid;gap:4px;margin:4px 0 0;padding:14px 0 0;border-top:1px solid var(--ligne);list-style:none;font-size:15px;line-height:1.45}
.fp-fiche .f-k{font-weight:800}
.fp-equipe{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.5}
.fp-act{padding:8px 14px;border-left:4px solid var(--u-grand);font-weight:700}
.lieux{width:100%;border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne)}
.lieux summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer;font-stretch:112%;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;list-style:none}
.lieux summary::-webkit-details-marker{display:none}
.lieux summary::after{content:"";flex:none;width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.lieux[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.lieux p{padding:0 0 16px;font-size:15px;line-height:1.6;color:var(--fg2)}
.fp-liens{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:6px}
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.ct-prg{display:grid;gap:4px;max-width:600px;margin-top:clamp(22px,2.6vw,36px);padding:22px 26px 20px;border:2px solid #fff;background:rgba(0,0,0,.16);color:#fff}
.ct-prg p{margin:0}
.ct-nom b{display:block;font-stretch:125%;font-weight:900;font-size:clamp(22px,2.2vw,30px);line-height:1.05;text-transform:uppercase}
.ct-role{display:block;font-weight:600}
.ct-liens{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:12px!important}
.ct-tel{font-weight:800;color:inherit;text-decoration:none}
html:not(.ed-actif) .ct-tel.vide{display:none}
.ct-cond{margin-top:12px!important;font-size:14px;font-weight:600}
.ct-u{max-width:none;margin:0 0 clamp(18px,2vw,28px);border:0;box-shadow:inset 0 0 0 1px var(--ligne);background:var(--u-fond2);color:var(--u-texte)}
.ct-u .ct-k{color:var(--u-vif)}
.ct-u .ct-role{color:var(--u-texte2)}
.dos-bt{position:relative;overflow:hidden;font-family:inherit;cursor:pointer;text-align:left;padding-top:10px;padding-bottom:10px}
.dos-bt .ico{flex:none}
.dos-bt[aria-busy="true"]{cursor:progress;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 9px,transparent 9px 18px);background-size:25.5px 25.5px;animation:dos-rayures .7s linear infinite}
@keyframes dos-rayures{to{background-position:25.5px 0}}
@media (prefers-reduced-motion:reduce){.dos-bt[aria-busy="true"]{animation:none;opacity:.75}}
.pr-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin:0 0 clamp(18px,2vw,28px)}
.ft-docs{margin-top:clamp(18px,2vw,28px)}
.docs{list-style:none;display:grid;gap:10px;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:12px}
.docs li>.ico{flex:none;width:18px;height:18px;color:var(--u-grand)}
.docs a{font-weight:800;color:var(--u-texte)}
.fp-docs{margin-top:14px;padding-top:12px;border-top:1px solid var(--ligne)}
.fp-docs .lbl{margin:0 0 8px;color:var(--u-vif)}
.lien-ba{display:inline-flex;align-items:center;gap:10px;padding:0;border:0;background:none;color:var(--u-texte);font:inherit;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}
.lien-ba .ico{width:18px;height:18px;color:var(--u-grand)}
.lien-ba:hover span{text-decoration:underline}
.cta{padding:clamp(56px,7vw,100px) 0}
.cta-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px 40px}
.cta-logo{width:clamp(150px,18vw,260px);color:#fff;opacity:.95}
.cta-logo svg{width:100%;height:auto}
.btn--grand{min-height:64px;padding:0 34px;font-size:clamp(16px,1.4vw,19px)}
.u.cta{background:var(--u-fond2)}
.u .cta-logo{color:var(--u-grand)}

/* « Je représente un établissement scolaire » */
.ecole-t{max-width:62ch;font-size:clamp(20px,1.9vw,26px);line-height:1.5;font-weight:500}
.ecole-t::first-letter{color:var(--tache-txt);font-stretch:125%;font-weight:900;font-size:2.4em;line-height:.8}
.acs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:clamp(16px,2vw,28px);margin:0;padding:0;list-style:none}
.ac{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:clamp(22px,2.4vw,34px);border-radius:4px}
.ac-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;width:100%}
.ac-t{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(26px,2.2vw,34px);line-height:1.04}
.ac-t a{text-decoration:none}
.ac-t a:hover{text-decoration:underline}
.ac-t span{display:block}
.ac-tete svg{flex:none;width:46px;color:var(--u-grand)}
.ac-ph{position:relative;width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;margin-top:2px}
.ac-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ac-type{width:100%;padding:12px 0 10px;border-top:3px solid var(--u-grand);border-bottom:1px solid var(--ligne);color:var(--u-texte);font-stretch:125%;font-weight:900;font-size:clamp(20px,1.9vw,26px);line-height:1.08;text-transform:uppercase}
.ac-type--x{border-top-style:dashed;color:var(--u-texte2)}
.ac-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-weight:700}
.ac-meta .k{color:var(--u-vif)}
.ac-txt{font-size:16px;line-height:1.55}
.ac-formule{display:grid;gap:4px;margin:0;padding:12px 16px;border:2px solid var(--u-grand);border-radius:12px;list-style:none;font-weight:800;font-size:15px}
.ac-disp{font-size:15px;line-height:1.5}
.ac-disp .k{display:block;margin-bottom:4px;color:var(--u-vif)}
.ac-disp ul{margin:0;padding-left:1.1em}
.ac-disp a{color:var(--u-texte)}
.ac-liens{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:6px}
.act{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,6vw,96px);align-items:start}
.act-ph{position:sticky;top:calc(var(--head) + 24px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act-ph .duo{grid-column:1/-1;aspect-ratio:4/5}
.act-ph .duo--p{grid-column:auto;aspect-ratio:1}
.duo{position:relative;overflow:hidden;background:var(--tache);isolation:isolate}
.duo img{width:100%;height:100%;object-fit:cover;}
.act-ph figcaption{grid-column:1/-1}
.cr{margin-top:10px;color:var(--encre2);font-size:14px}

/* les spectacles (page Spectacles) */
.vgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,2.6vw,36px);margin:0;padding:0;list-style:none}
.vg{position:relative;display:flex;flex-direction:column;border-radius:4px;overflow:hidden}
.vg-photo{aspect-ratio:3/2}
.vg-c{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:clamp(20px,2.4vw,32px)}
.vg-tags{display:flex;flex-wrap:wrap;gap:8px}
.vg-titre{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(30px,3.2vw,50px);line-height:1;text-wrap:balance}
.vg-titre span{display:block}
.vg-sous{color:var(--u-texte2);font-size:18px}
.vg-meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--u-vif)}
.vg-g{position:absolute;top:12px;right:12px;width:52px;padding:3px 5px;border-radius:999px;background:var(--u-fond);color:var(--u-texte)}
.vg:hover .duo-u img{transform:scale(1.04)}

/* la page d'un spectacle, dans son univers */
.show{background:var(--u-fond);color:var(--u-texte)}
.sh{position:relative;overflow:hidden;isolation:isolate;background:var(--u-fond)}
.sh-photo{position:relative;height:clamp(250px,48svh,580px);background:var(--u-scene);overflow:hidden;isolation:isolate}
.sh-photo img{width:100%;height:100%;object-fit:cover;}
.sh-photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--u-fond) 55%,transparent) 50%,var(--u-fond))}
.sh-motif{position:absolute;z-index:1;top:clamp(20px,5vw,70px);right:max(-80px,-6vw);width:min(56vw,620px);color:var(--u-grand);opacity:.26;pointer-events:none}
.sh-motif svg{width:100%;height:auto;stroke-width:1.4;overflow:visible}
.sh-txt{position:relative;z-index:2;margin-top:clamp(-150px,-11vw,-70px);padding-bottom:clamp(36px,4.4vw,64px)}
.sh-txt::before{content:"";position:absolute;z-index:-1;left:-10%;top:-10%;width:min(900px,90%);height:120%;background:radial-gradient(closest-side,var(--u-lueur),transparent);pointer-events:none}
.sh-signe{margin-bottom:14px;color:var(--u-vif);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.sh-titre{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(46px,8.2vw,136px);line-height:.98;letter-spacing:-.005em}
.sh-titre .l{display:block}

.sh-sous{max-width:48ch;margin-top:clamp(14px,1.6vw,22px);font-size:clamp(19px,1.7vw,24px);font-weight:500;line-height:1.35}
.sh-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:18px;color:var(--u-vif)}
.sh-lt{font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(18px,1.6vw,22px);color:var(--u-texte)}
.sh-acc{max-width:40ch;margin-top:clamp(18px,2vw,28px);font-size:clamp(21px,2.1vw,30px);font-weight:500;line-height:1.35;text-wrap:pretty}
.mot{display:inline-block}
.anime .mot{animation:mot .55s ease both;animation-delay:calc(.8s + var(--k) * 45ms)}
@keyframes mot{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
.sh-credit{margin-top:18px;color:var(--u-texte2);font-size:13px;letter-spacing:.03em}
.onglets{border-block:1px solid var(--ligne);background:var(--u-fond)}
.onglets ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:14px 0;list-style:none}
.onglet{display:flex;align-items:center;justify-content:space-between;gap:12px;height:100%;min-height:64px;padding:12px 18px 12px 20px;border:2px solid color-mix(in srgb,var(--u-texte) 32%,transparent);border-radius:22px;color:var(--u-texte);font-stretch:125%;font-weight:800;font-size:14px;line-height:1.15;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;text-wrap:balance;transition:border-color .2s,background-color .2s}
.onglet .ico{width:20px;height:20px;transition:transform .25s}
.onglet:hover{border-color:var(--u-grand)}
.onglet:hover .ico{transform:translateX(4px)}
.onglet[aria-current="page"]{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur)}
.onglet .e-court{display:none}
.sh-corps{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:clamp(28px,4.4vw,80px);padding-block:clamp(48px,6vw,96px)}
.sommaire{position:sticky;top:calc(var(--head) + 28px);align-self:start}
.sommaire ol{margin:0;padding:0;list-style:none}
.sommaire>ol{border-left:2px solid var(--ligne)}
.sommaire a{display:block;margin-left:-2px;padding:7px 0 7px 16px;border-left:2px solid transparent;color:var(--u-texte2);font-size:12.5px;font-weight:700;letter-spacing:.11em;line-height:1.3;text-transform:uppercase;text-decoration:none}
.sommaire ol ol a{padding-left:28px;font-size:12px;letter-spacing:.04em;text-transform:none}
.sommaire a:hover{color:var(--u-texte)}
.sommaire a.actif{border-left-color:var(--u-grand);color:var(--u-texte)}
.chapitres{min-width:0}
.chap+.chap{margin-top:clamp(64px,8vw,120px)}
.chap .usep{margin-bottom:14px}
.chap-t{margin-bottom:clamp(22px,2.6vw,36px);color:var(--u-grand);font-stretch:125%;font-weight:900;font-size:clamp(28px,3.4vw,50px);line-height:.98;text-transform:uppercase;text-wrap:balance}
.sous-t{margin:0 0 18px;color:var(--u-vif);font-stretch:125%;font-weight:900;font-size:clamp(18px,1.6vw,22px);letter-spacing:.04em;text-transform:uppercase}
.u-genre{color:var(--u-vif);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.u-cadre{margin-top:12px;padding:14px 0;border-block:2px solid var(--u-grand);font-stretch:112%;font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1.45;text-transform:uppercase}
.affirm{max-width:30ch;color:var(--u-texte);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(28px,3vw,44px);line-height:1.12;text-wrap:balance}
.affirm::before{content:"";display:block;width:56px;height:4px;margin-bottom:18px;background:var(--u-grand)}
.affirm+.affirm{margin-top:clamp(28px,3.4vw,44px)}
.u-genre+.affirm,.u-cadre+.affirm{margin-top:clamp(28px,3.4vw,44px)}
.show .prose{font-size:clamp(18px,1.3vw,19px);line-height:1.62}
.show .prose a{color:var(--u-texte)}
.vers{display:grid;gap:clamp(28px,3vw,40px);margin-top:clamp(36px,4vw,56px)}
.cit{padding-left:clamp(18px,2vw,28px);border-left:4px solid var(--u-grand)}
.cit blockquote{color:var(--u-texte);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(23px,2.3vw,32px);line-height:1.28}
.cit .v{display:block}
.cit--prose blockquote::before{content:"«\00a0"}
.cit--prose blockquote::after{content:"\00a0»"}
.cit--prose .v{display:inline}
.cit figcaption{margin-top:10px;color:var(--u-texte2);font-size:13.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.galerie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.carton{display:flex;flex-direction:column;gap:10px;margin:0;padding:clamp(8px,1vw,12px);background:var(--u-fond2);box-shadow:0 1px 0 var(--ligne),0 18px 40px -26px rgba(0,0,0,.6)}
.carton--grand{grid-column:1/-1}
.carton-ph{overflow:hidden;aspect-ratio:3/2;background:var(--u-scene)}
.carton--grand .carton-ph{aspect-ratio:16/9}
.carton img{width:100%;height:100%;object-fit:cover}
.carton figcaption{padding:2px 4px 4px;color:var(--u-texte);font-size:15px;line-height:1.45}
.credits{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px;color:var(--u-texte2);font-size:13.5px}
.ag--u{margin-top:6px}
.tour-txt{font-size:clamp(20px,1.8vw,24px);font-weight:500}
.fiche-u{display:grid;gap:16px;max-width:72ch;font-size:16px;line-height:1.5}
.fiche{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.f-k{font-weight:800}
.f-avec{padding:14px 0;border-block:1px solid var(--ligne)}
/* la distribution en portraits (D.personnes, show.equipe) : des cartons comme ceux des photos, la photo en couleur, ou un aplat de l'univers et ses initiales en grandes capitales ; ceux qui alternent vont par deux */
.cast{--g:clamp(12px,1.6vw,22px);--pw:150px;--pmax:244px;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:var(--g);max-width:calc(var(--n,4) * var(--pmax) + (var(--n,4) - 1) * var(--g));margin:0 0 clamp(28px,3vw,44px);padding:0}
.cast>li{display:flex;min-width:0}
.cast>.cast-paire{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g);padding-top:10px;border-top:4px solid var(--u-aplat)}
.cast-pt{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;margin:0;padding:clamp(8px,1vw,12px);background:var(--u-fond2);box-shadow:0 1px 0 var(--ligne),0 18px 40px -26px rgba(0,0,0,.6)}
.cast-cadre{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;container-type:inline-size;background:var(--u-aplat)}
.cast-cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.cast-mono{position:absolute;inset:0;display:grid;place-items:center}
.cast-mono b{font-stretch:125%;font-weight:900;font-size:36px;font-size:30cqw;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:var(--u-sur)}
.cast-pt figcaption{display:flex;flex-direction:column;gap:3px;padding:0 2px 4px}
.cast-cr{min-height:1.7em;font-size:12.5px;line-height:1.35;color:var(--u-texte2)}
.cast-nom{font-stretch:108%;font-weight:900;font-size:clamp(14px,1.2vw,16.5px);line-height:1.2;letter-spacing:.03em;text-transform:uppercase;color:var(--u-texte);text-wrap:balance}
.cast-alt{font-size:14px;line-height:1.4;color:var(--u-texte2)}
.cast-role{color:var(--u-vif);font-size:12.5px;font-weight:800;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}
.f-duree{color:var(--u-vif);font-stretch:125%;font-weight:900;font-size:18px;text-transform:uppercase}
.f-prod p+p{margin-top:8px}
.fiche-u a{color:var(--u-texte)}
.faits-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin:0 0 24px;padding:0;list-style:none}
.fait{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:118px;padding:16px 18px;background:var(--u-fond2);box-shadow:inset 0 0 0 1px var(--ligne)}
.fait-k{color:var(--u-vif);font-size:12.5px;font-weight:800;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}
.fait-v{font-stretch:112%;font-weight:900;font-size:clamp(19px,1.7vw,24px);line-height:1.15}
.fait .n{font-size:clamp(36px,3.4vw,52px)}
.fait--large{grid-column:1/-1}
.tech{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:18px}
.tech-b{padding:16px 18px;background:var(--u-fond2);box-shadow:inset 0 0 0 1px var(--ligne)}
.tech-b h4{margin-bottom:8px;color:var(--u-vif);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tech-b ul{margin:0;padding-left:1.1em;font-size:15.5px;line-height:1.5}
.tech-b li+li{margin-top:4px}
.alerte{margin:18px 0;padding:16px 20px;background:var(--u-aplat);color:var(--u-sur);font-size:17px;line-height:1.45}
.ac-grand{margin-bottom:18px;padding:16px 0 14px;border-top:5px solid var(--u-grand);border-bottom:1px solid var(--ligne);color:var(--u-texte);font-stretch:125%;font-weight:900;font-size:clamp(30px,3.6vw,54px);line-height:1;text-transform:uppercase;text-wrap:balance}
.ac-grand--x{border-top-style:dashed;color:var(--u-texte2)}
.ac-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.ac-tags .tag{color:var(--u-texte)}
.ac-tags .tag--plein{color:var(--u-sur)}
.ac-pub{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:20px;font-size:clamp(19px,1.6vw,22px);font-weight:700}
.ac-pub .k{color:var(--u-vif)}
.ac-textes{display:grid;gap:14px;max-width:68ch;font-size:clamp(17px,1.25vw,18px);line-height:1.6}
.formule{display:grid;gap:6px;margin:24px 0 0;padding:18px 22px;background:var(--u-aplat);color:var(--u-sur);list-style:none;font-stretch:112%;font-weight:900;font-size:clamp(18px,1.6vw,22px);line-height:1.25;text-transform:uppercase}
.disp-l{margin-top:24px}
.disp-l .k{display:block;margin-bottom:6px;color:var(--u-vif)}
.disp-l ul{margin:0;padding-left:1.1em;line-height:1.55}
.disp-l a{color:var(--u-texte)}
/* le dossier scolaire (la charte du dossier : aplats, encadrés, tableaux nets) */
.dos-tete{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:clamp(40px,5vw,64px);padding:clamp(22px,3vw,40px);background:var(--u-aplat);color:var(--u-sur)}
.dos-type{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.dos-titre{font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(40px,5vw,76px);line-height:1}
.dos-auteur{font-size:19px;font-weight:600}
.dos-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.dos-chips li{padding:5px 12px;border:1.5px solid currentColor;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.dos-s+.dos-s{margin-top:clamp(48px,6vw,84px)}
.dos-h{margin-bottom:22px;padding-bottom:12px;border-bottom:3px solid var(--u-grand);color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(25px,2.6vw,38px);line-height:1.1;text-wrap:balance}
.pq{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.pq-c{display:flex;flex-direction:column;gap:10px;padding:18px 20px 22px;background:var(--u-fond2);border-top:5px solid var(--u-grand)}
.pq-c h4{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:20px;line-height:1.2}
.pq-c p{font-size:15.5px;line-height:1.55}
.tab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-wrap:focus-visible{outline-offset:2px}
.tab{width:100%;min-width:640px;border-collapse:collapse;background:var(--u-fond2);font-size:15px;line-height:1.45}
.tab th,.tab td{padding:12px 14px;border:1px solid color-mix(in srgb,var(--u-texte) 28%,transparent);text-align:left;vertical-align:top}
.tab-niv{width:5.5em;background:var(--u-aplat);color:var(--u-sur);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:22px;text-align:center!important;vertical-align:middle!important}
.tab-mat{width:9em;color:var(--u-vif);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13.5px}
.tab td:last-child{color:var(--u-texte2)}
.note{margin-bottom:14px}
.demandes{display:grid;gap:8px;margin:18px 0;padding:18px 22px;border:3px solid var(--u-grand);list-style:none;font-stretch:112%;font-weight:900;font-size:clamp(16px,1.4vw,19px);line-height:1.3;letter-spacing:.02em}
.demandes li{display:flex;gap:12px}
.demandes li::before{content:"";flex:none;width:12px;height:12px;margin-top:.3em;background:var(--u-grand);border-radius:50%}
.axes{margin:14px 0;padding-left:1.2em;line-height:1.55}
.axes li+li{margin-top:6px}
.encadre{margin-top:18px;padding:16px 20px;border-left:6px solid var(--u-grand);background:var(--u-fond2);font-size:17px;line-height:1.5}
.dos-p{max-width:68ch;line-height:1.6}
.dos-p+.dos-p{margin-top:12px}
.ateliers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.atelier{display:flex;flex-direction:column;gap:10px;padding:20px 22px 24px;background:var(--u-fond2);box-shadow:inset 0 0 0 1px var(--ligne)}
.atelier h4{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);font-size:clamp(19px,1.6vw,22px);line-height:1.2}
.atelier p{font-size:15.5px;line-height:1.55}
.etapes{display:grid;gap:10px;margin:4px 0 0;padding:0;list-style:none;counter-reset:e}
.etapes li{padding-left:14px;border-left:3px solid var(--u-grand)}
.etape-t{font-weight:600}
.points{margin:0;padding-left:1.1em;font-size:15.5px;line-height:1.5}
.points li+li{margin-top:6px}
.galerie--dos{margin-top:18px}
.next{display:block;padding:clamp(52px,6.6vw,100px) 0;text-decoration:none;border-top:1px solid var(--ligne)}
.next:focus-visible{outline-offset:-8px}
.next-in{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.next-c{display:flex;flex-direction:column;gap:10px;min-width:0}
.next-sur{color:var(--u-vif)}
.next-t{color:var(--u-grand);font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(36px,6vw,92px);line-height:1}
.next-t span{display:block}
.next-go{width:clamp(44px,5vw,72px);height:clamp(44px,5vw,72px);flex:none;color:var(--u-grand);transition:transform .3s}
.next:hover .next-go{transform:translateX(8px)}

/* la compagnie, le contact */
.annees{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:0 clamp(20px,3vw,40px);margin:0;padding:0;list-style:none}
.annees li{display:flex;flex-direction:column;gap:6px;padding:18px 0 24px;border-top:2px solid var(--tache-txt)}
.an{color:var(--tache-txt);font-size:clamp(40px,4.2vw,62px)}
.an-t{color:var(--tc,var(--encre));font-family:var(--tp,inherit);font-weight:var(--tg,700);font-size:20px;line-height:1.25}
a.an-t{text-decoration:none}
a.an-t:hover{text-decoration:underline}
.dir{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,88px);align-items:start}
.dir-t{color:var(--tache-txt);font-size:clamp(30px,3.6vw,52px)}
.dir-chap{margin-top:18px;color:var(--tache-txt);font-stretch:112%;font-weight:800;font-size:19px}
.part{max-width:70ch;font-size:clamp(19px,1.6vw,22px);line-height:1.55;font-weight:500}
.contact{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,6vw,96px);align-items:start}
.form{display:grid;gap:22px;max-width:640px}
.champ{display:grid;gap:8px}
.champ label,.calc label{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.champ input,.champ textarea,.calc input{width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--encre);border-radius:0;background:var(--papier);color:var(--encre);font-size:18px}
.champ textarea{min-height:170px;resize:vertical}
.form input:focus-visible,.form textarea:focus-visible{outline:3px solid var(--tache-txt);outline-offset:2px}
.case{display:flex;align-items:flex-start;gap:12px;line-height:1.4}
.case input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--tache)}
.case a{color:var(--tache-txt)}
.calc{display:flex;align-items:center;gap:14px}
.calc input{width:76px}
.form .btn{justify-self:start}
.coord{padding:clamp(24px,3vw,40px)}
.coord-nom{margin-bottom:12px;font-stretch:125%;font-weight:900;font-size:clamp(22px,2.2vw,30px);line-height:1.05;text-transform:uppercase}
.coord p+p{margin-top:12px}

/* le pied de page */
.pied{padding:clamp(56px,7vw,96px) 0 32px;background:var(--tache-deep);color:#fff;--focus:#fff;--sep:#fff}
/* le menu, encore (règle 21), et « Contact » : en capitales larges, chacun sa flèche */
.pied-menu{margin-bottom:clamp(40px,5vw,64px)}
.pied-menu ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 clamp(18px,2.4vw,36px);margin:0;padding:0;list-style:none}
.pied-menu a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid rgba(255,255,255,.4);color:inherit;font-stretch:125%;font-weight:900;font-size:clamp(18px,1.5vw,22px);line-height:1.1;text-transform:uppercase;text-decoration:none}
.pied-menu a .ico{width:22px;height:22px;transition:transform .2s}
.pied-menu a:hover .ico{transform:translateX(5px)}
.en-univers .pied-menu a{border-bottom-color:color-mix(in srgb,var(--u-texte) 30%,transparent)}
.onglets-sans{border-top:1px solid var(--ligne)}
.pied-grille{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,4fr) minmax(0,5fr);gap:40px clamp(32px,4vw,64px);align-items:start}
.pied-logo{display:block;width:clamp(130px,12vw,176px);color:inherit}
.pied-logo svg{width:100%;height:auto}
.pied-nom{margin-bottom:10px;font-stretch:125%;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.1;text-transform:uppercase}
.pied-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:22px}
.pied .btn{min-height:46px;padding:0 22px}
.pied-fb{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pied-part{font-size:16px;line-height:1.6}
.pied .sep{margin:clamp(40px,5vw,64px) 0 18px}
.pied-bas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;font-size:14px}
.pied-legal,.pied-ll{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px}
.pied-edit{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 14px;border:1.5px solid currentColor;border-radius:999px;background:none;color:inherit;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:.92}
.pied-edit:hover{opacity:1;background:rgba(255,255,255,.12)}
.pied-edit .ico{width:15px;height:15px}
.en-univers .pied{background:var(--u-fond2);color:var(--u-texte);--focus:var(--u-texte);--sep:var(--u-grand);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--u-texte) 16%,transparent)}
.en-univers .pied .btn{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur)}
.en-univers .pied .btn:hover{background:transparent;color:var(--u-texte)}
.en-univers .pied-logo{color:var(--u-grand)}

/* l'édition sur place (EDITION) dans le style de la maquette */
.ed-boite .ed-etat{font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.ed-bt{font-stretch:112%;letter-spacing:.03em}

/* ———————————— le mouvement (règle 15) : l'aplat et la capitale ; voir le bloc « Mouvement » en tête du script ————————————
   Des volets de couleur pleine balaient l'écran dans la couleur de la page qui arrive ; la grande capitale glisse et se
   compresse. Une courbe sèche, rapide puis posée ; survol 160 ms, pression 80 ms, page 420 ms. */
:root{--mv-courbe:cubic-bezier(.16,.84,.2,1)}
html{view-transition-name:none}
main{display:block;min-height:100vh;overflow-x:clip}   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas ; ce qui glisse n'en déborde pas */
.brand-mark{aspect-ratio:1042/576}
.en-univers .brand-mark{aspect-ratio:1}
/* les volets : cinq bandes d'aplat, décalées, qui traversent l'écran sous l'en-tête (de gauche à droite ; de droite à gauche
   au retour) ; jamais l'écran entier n'est couvert, rien ne capte le pointeur */
.volets{position:fixed;left:0;right:0;bottom:0;top:var(--vo-haut,0px);z-index:38;pointer-events:none;overflow:hidden;visibility:hidden}
.volets.on{visibility:visible}
.volet{position:absolute;left:0;width:62vw;height:calc(20% + 1px);background:var(--vo-c,var(--tache));will-change:transform;transform:translateX(-101%)}
.volet:nth-child(1){top:0}.volet:nth-child(2){top:20%}.volet:nth-child(3){top:40%}.volet:nth-child(4){top:60%}.volet:nth-child(5){top:80%}
.volet::after{content:"";position:absolute;top:0;bottom:0;right:0;width:22%;background:var(--vo-c2,var(--tache-deep))}
/* la grande capitale de la page qui arrive : elle glisse et se compresse (transform seul) */
.capitale{transform-origin:0 60%}
/* la photo d'un spectacle cliquée devient la grande photo de sa page (élément partagé) */
::view-transition-group(mv-partage){animation-duration:.42s;animation-timing-function:cubic-bezier(.16,.84,.2,1)}
::view-transition-old(mv-partage){animation:.14s ease-out both vo-fondu}
::view-transition-new(mv-partage){animation:.24s var(--mv-courbe) both vo-parait}
@keyframes vo-fondu{to{opacity:0}}
@keyframes vo-parait{from{opacity:0}}
/* d'un onglet à l'autre : l'aplat de l'onglet glisse jusqu'à l'onglet choisi */
html[data-mv-transition="onglet"] .onglet[aria-current="page"]{view-transition-name:onglet-aplat}
::view-transition-group(onglet-aplat){animation-duration:.3s;animation-timing-function:var(--mv-courbe)}
/* la pression : la pièce se compresse et prend l'aplat, à l'instant même */
:is(.btn,.btn-u,.cp,.idx,.idx-tout,.chip,.bd-pause,.pied-edit,.onglet,.lien-ba,.rs-date,.rs-reserver,.lc-b,.tr5-place,.theme-m05,.m).mv-presse{transform:scaleX(.95);transition:transform .08s}
.m.mv-presse{background:rgba(255,255,255,.22)}
.porte.mv-presse .porte-t,.ep-a.mv-presse .ep-t{transform:scaleX(.9);transition:transform .08s}
:is(.tuile,.vg,.fp):has(.mv-presse){transform:scale(.985);transition:transform .08s}
.sai>summary.mv-presse .sai-t{transform:scaleX(.95);transition:transform .08s}
.btn,.btn-u,.cp,.idx,.chip,.onglet,.porte-t,.tuile,.vg,.fp,.sai-t,.ep-t,.m{transform-origin:0 50%}
/* l'apparition au défilement : les capitales glissent depuis la gauche et se compressent ; les cartes viennent l'une après
   l'autre ; la ligne-tentacule se trace ; les chiffres comptent */
[data-mv="monte"].mv-attente:not(.mv-vu){opacity:0;transform:translateX(-28px) scaleX(1.16)}
[data-mv="monte"].mv-attente{transform-origin:0 50%;transition:opacity .45s var(--mv-courbe),transform .62s var(--mv-courbe);transition-delay:var(--mv-delai,0ms)}
[data-mv="cascade"].mv-attente:not(.mv-vu)>*{opacity:0;transform:translateX(-22px) scaleX(1.06)}
[data-mv="cascade"].mv-attente>*{transform-origin:0 50%;transition:opacity .4s var(--mv-courbe),transform .55s var(--mv-courbe);transition-delay:calc(var(--mv-delai,0ms) + min(var(--mv-i,0),12) * 55ms)}
.sep[data-mv="trace"].mv-attente{transform-origin:0 50%;transition:transform .8s var(--mv-courbe)}
/* ce qui se déplie : une saison s'ouvre, un volet d'aplat traverse sa tête, ses dates arrivent en cascade */
.sai{position:relative}
.sai-corps{position:relative}
.sai.vient>summary{position:relative;overflow:hidden}
.sai.vient>summary::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--tache);animation:vo-traverse .42s var(--mv-courbe) both;pointer-events:none}
@keyframes vo-traverse{from{transform:translateX(-101%)}to{transform:translateX(260%)}}
/* une ligne vers laquelle la frise mène : un aplat la traverse */
.r.est-vise{animation:vise 1.2s var(--mv-courbe)}
@keyframes vise{0%,30%{background:color-mix(in srgb,var(--tache-txt) 16%,transparent)}}
.r.est-allume{background:color-mix(in srgb,var(--tache-txt) 9%,transparent)}
.u .r.est-allume{background:color-mix(in srgb,var(--u-grand) 14%,transparent)}
.sai.est-allume>summary{background:var(--papier2)}
.aff .carte-lieu.est-allume .aff-cible{fill:color-mix(in srgb,var(--cl) 30%,transparent)}
/* le dossier PDF prêt : un aplat traverse le bouton */
.dos-bt.dos-pret::after{content:"";position:absolute;inset:0;background:currentColor;opacity:.3;animation:vo-traverse .6s var(--mv-courbe) both}
/* ce qui vit : « EN TOURNÉE » respire (le point du bandeau) ; la prochaine date sur la frise, son aplat qui bat */
.vit-pt::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:currentColor;vertical-align:.08em;animation:pouls 2.2s ease-in-out infinite}

/* ———— les frises (FRISE) : la saison en aplats ; chaque date, une pastille pleine à la couleur de son spectacle ; les mois en
   capitales larges ; « aujourd'hui », une barre à la couleur de la saison ———— */
.frise[data-frise]{--fr-fond:var(--papier);--fr-encre:var(--encre);--fr-trait:color-mix(in srgb,var(--encre) 32%,transparent);--fr-accent:var(--tache-txt);--fr-police:Archivo,"Helvetica Neue",Arial,sans-serif;
  --fr-bulle-fond:var(--tache);--fr-bulle-encre:#fff;--fr-point:12px;--fr-couloir:19px;--fr-haut:30px;--fr-taille:12px;--fr-passe:.32;--fr-courbe:var(--mv-courbe)}
.frise[data-frise] .frise-axe{height:2px;margin-top:-1px}
.frise[data-frise] .frise-mois-nom{font-stretch:100%;font-weight:800;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
.frise[data-frise] .frise-an{font-weight:700;font-size:.7rem;letter-spacing:.1em}
.frise[data-frise] .frise-point.est-scolaire:not(.est-duree)>.frise-repere::before{rotate:none;border-radius:2px;width:11px;height:11px}
.frise[data-frise] .frise-aujourdhui::before{width:3px;left:-1.5px;opacity:1;top:14px}
.frise[data-frise] .frise-aujourdhui::after{width:10px;height:10px;left:-5px;bottom:-5px;border-radius:0}
.frise[data-frise] .frise-aujourdhui-nom{font-stretch:125%;font-weight:900;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase}
.frise[data-frise] .frise-bulle{border-radius:0;font-size:.86rem;box-shadow:0 14px 34px rgba(26,16,22,.28)}
.frise[data-frise] .frise-bulle b{font-stretch:125%;font-weight:900;font-size:1rem;text-transform:uppercase;line-height:1.1}
.frise[data-frise] .frise-grappe-n{font-stretch:112%;font-weight:900}
/* la prochaine date : sa pastille bat */
.frise[data-frise] :is(.frise-point.est-passe+.frise-point:not(.est-passe),.frise-point:first-child:not(.est-passe))>.frise-repere::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--fr-c,var(--tache-txt));opacity:0;animation:prochaine 2.4s ease-out 1.2s infinite;pointer-events:none}
@keyframes prochaine{0%{opacity:.55;scale:1}80%,100%{opacity:0;scale:2.6}}
.frise[data-frise] .frise-repere:focus-visible{outline:3px solid var(--fr-accent);outline-offset:2px}
.frise-sec{padding:clamp(18px,2.4vw,30px) 0 0}
.frise-hote{min-height:118px}
/* sur l'aplat de la tache, et dans un univers */
.sur-mag .frise[data-frise]{--fr-fond:var(--tache);--fr-encre:#fff;--fr-trait:rgba(255,255,255,.55);--fr-accent:#fff;--fr-bulle-fond:#fff;--fr-bulle-encre:var(--tache-deep)}
.u .frise[data-frise]{--fr-fond:var(--u-fond);--fr-encre:var(--u-texte);--fr-trait:color-mix(in srgb,var(--u-texte) 32%,transparent);--fr-accent:var(--u-grand);--fr-bulle-fond:var(--u-aplat);--fr-bulle-encre:var(--u-sur)}
.u-frise{min-height:118px;margin:0 0 clamp(20px,2.4vw,32px)}
/* les saisons et leur densité : des aplats pleins */
.ag-frise{margin:0 0 16px;min-height:128px}
.frise-saisons{--fr-bande-h:50px;--fr-haut:22px;--fr-pied:30px}
.frise-saisons .frise-bande-barre{margin:0 2px;background:var(--tache);opacity:1}
.frise-saisons .frise-bande.est-passe .frise-bande-barre{opacity:.78}
.frise-saisons .frise-bande:is(:hover,.est-allume) .frise-bande-barre{background:var(--tache-txt);opacity:1}
.frise-saisons .frise-bande-n{font-stretch:125%;font-weight:900;font-size:.8rem}
.frise-saisons .frise-bande-nom{font-weight:800;font-size:.7rem;letter-spacing:.06em;color:var(--encre2)}
/* la diffusion d'un spectacle, saison par saison */
.diffusion{width:100%;min-height:100px;margin-top:4px;padding-top:10px;border-top:1px solid var(--ligne)}
.diffusion .lbl{margin:0;color:var(--u-vif,var(--tache-txt))}
.frise-diffusion{--fr-bande-h:30px;--fr-haut:14px;--fr-pied:26px;--fr-taille:10px}
.frise-diffusion .frise-bande-barre{margin:0 1px;background:var(--u-grand,var(--tache));opacity:.92}
.frise-diffusion .frise-bande-nom{opacity:.8;letter-spacing:-.02em}
/* sur l'aplat de la tache (la nuit, la couleur de la saison s'éclaircit : le blanc y tient 4,7:1, pas une miette de moins) */
.sur-mag .frise-diffusion .frise-bande-nom{opacity:1}
.frise-diffusion .frise-bande:not(:first-child):not(:last-child) .frise-bande-nom{opacity:0;transition:opacity .16s}
.frise-diffusion .frise-bande:is(:hover,.est-allume,:focus-within) .frise-bande-nom{opacity:1}
.frise-diffusion .frise-aujourdhui-nom{display:none}
.p-diff{min-height:118px;margin:clamp(18px,2vw,26px) 0}
.sur-mag .frise-compagnie .frise-bande-barre{background:#fff}
.frise-compagnie{--fr-bande-h:44px;--fr-taille:11px}
/* la frise historique de la compagnie : les créations en capitales */
.histoire-frise{margin:0 0 clamp(28px,3.4vw,44px)}
.histoire-frise .frise[data-frise]{--fr-fond:var(--papier2);--fr-point:13px;--fr-couloir:46px;--fr-haut:30px;--fr-passe:1}
.histoire-frise .frise-etiquette{font-stretch:112%;font-weight:900;font-size:.98rem;line-height:1.12;text-transform:uppercase;max-width:11em;color:var(--encre)}
.histoire-frise .frise-repere:is(:hover,:focus-visible) .frise-etiquette{color:var(--tache-txt);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* ———— l'espace pro : trois portes d'aplat, chacune vers son espace ———— */
.eps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:0;list-style:none}
.ep{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;min-height:clamp(300px,46vh,460px);padding:clamp(24px,2.6vw,40px);background:var(--ep);color:#fff;overflow:hidden;isolation:isolate;--focus:#fff}
.ep+.ep{box-shadow:inset 2px 0 0 rgba(255,255,255,.55)}
.ep::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.14);transform:translateX(-101%);transition:transform .2s var(--mv-courbe)}
.ep:is(:hover,:focus-within)::before{transform:none}
.ep-n{font-stretch:125%;font-weight:900;font-size:clamp(64px,8vw,128px);line-height:.8;letter-spacing:-.04em;opacity:.28}
.ep-t{font-stretch:125%;font-weight:900;font-size:clamp(26px,2.6vw,42px);line-height:1;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance;transition:transform .18s var(--mv-courbe)}
.ep:is(:hover,:focus-within) .ep-t{transform:scaleX(.94)}
.ep-a{color:#fff;text-decoration:none}
.ep-a::after{content:"";position:absolute;inset:0;z-index:1}
.ep-a:focus-visible{outline:none}
.ep:has(.ep-a:focus-visible){outline:3px solid #fff;outline-offset:-8px}
.ep-x{max-width:36ch;font-size:17px;line-height:1.45;font-weight:600}
.ep .ico{width:clamp(28px,2.4vw,40px);height:clamp(28px,2.4vw,40px);transition:transform .18s}
.ep:is(:hover,:focus-within) .ico{transform:translateX(6px)}
.ed-actif .ep-a::after{display:none}
@media (max-width:860px){.eps{grid-template-columns:minmax(0,1fr)}.ep{min-height:220px}.ep+.ep{box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}}

/* ———— les saisons (règle 21) : tout l'agenda sur une page. La saison en cours sur l'aplat de la tache (sa marque : la couleur de
   la saison, règle 22), sa frise (une seule ligne du temps, chaque date une pastille pleine à la couleur de son spectacle) et sa
   légende ; puis, à côté de la carte-affiche, ses prochaines dates à choisir (règle 17) et toutes ses dates ; enfin les saisons
   passées, chacune fermée sous sa petite carte ———— */
.s0{padding:clamp(26px,3.2vw,46px) 0 clamp(30px,3.4vw,50px)}
.s0 .sep{max-width:440px;margin-bottom:clamp(14px,1.8vw,22px)}
.s0-t{font-size:clamp(40px,6.2vw,100px)}
.s0-k{margin-bottom:10px}
.fs{margin-top:clamp(18px,2.2vw,30px)}
.fs-f{min-height:154px}
.fs-leg{display:flex;flex-wrap:wrap;gap:8px 24px;margin:12px 0 0;padding:14px 0 0;border-top:2px solid rgba(255,255,255,.45);list-style:none}
.fs-l{display:inline-flex;align-items:center;gap:10px;min-height:30px;font-stretch:112%;font-weight:800;font-size:14.5px;letter-spacing:.04em;line-height:1.2;text-transform:uppercase;transition:opacity .16s}
.fs-l i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
.fs-l b{font-weight:700;font-size:13px}
.fs-l.est-vide{opacity:.5}
/* les dates scolaires : la pastille carrée de la frise ; les résidences (règle 23) : son carré évidé */
.fs-l.fs-sc i{border-radius:2px;background:#fff;box-shadow:none}
.fs-l.fs-res i{border-radius:2px;background:none;box-shadow:inset 0 0 0 2.5px #fff}
.frise.est-filtre .frise-point:not(.est-sp){opacity:.18}
.ag-h{display:flex;align-items:center;gap:16px;margin:clamp(44px,5vw,68px) 0 14px;color:var(--accg);font-size:clamp(26px,3vw,46px)}
.ag-h:first-child{margin-top:0}
.ag-h::after{content:"";flex:1;height:4px;background:currentColor}
.auj-l{display:flex;align-items:center;gap:12px;margin:18px 0 6px;color:var(--tache-txt);font-stretch:125%;font-weight:900;font-size:12.5px;letter-spacing:.16em;line-height:1;text-transform:uppercase;list-style:none}
.auj-l::after{content:"";flex:1;height:4px;background:currentColor}
.r.est-passe .r-big,.r.est-passe .r-lieu{color:var(--fg2)}
.saisons-ag>.ag-carte{top:calc(var(--head) + 18px)}
/* une date à choisir (règle 17) : une pièce rectangulaire, le jour en grandes capitales, l'horaire dessous ; choisie, elle prend
   l'aplat de son spectacle et sa carte s'ouvre sous sa ligne */
.r.rs-li{align-items:start}
.rs-date--ligne{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;max-width:210px;padding:12px 14px;border:2px solid var(--encre);border-radius:4px;background:var(--papier);color:var(--encre);text-align:left;cursor:pointer;transform-origin:0 50%;transition:background-color .16s,color .16s,border-color .16s}
.rs-date--ligne .rs-q{display:flex;flex-direction:column;align-items:flex-start}
.rs-date--ligne .rs-s{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}
.rs-date--ligne .rs-n{font-stretch:125%;font-weight:900;font-size:clamp(22px,2vw,30px);line-height:1.02}
.rs-date--ligne .rs-m{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.rs-date--ligne .rs-h{display:block;align-self:stretch;margin-top:6px;padding-top:6px;border-top:2px solid currentColor;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.rs-date--ligne .rs-h--sans{font-weight:600;color:var(--fg2)}
.rs-date--ligne .rs-o{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rs-date--ligne:hover{border-color:var(--tache-txt)}
.rs-date--ligne:focus-visible{outline:3px solid var(--tache-txt);outline-offset:3px}
.rs-date--ligne[aria-pressed="true"]{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur)}
.rs-date--ligne[aria-pressed="true"] :is(.rs-s,.rs-h--sans){color:inherit}
.rs-ici{grid-column:1/-1;margin-top:12px}

/* ———— réserver une date (règle 17) : sur la page d'un spectacle, la bande de ses prochaines dates, chacune une pièce d'aplat (le
   jour en grandes capitales, l'horaire, la commune) ; la carte de la date choisie dessous. La signature de la maquette : un aplat
   balaie la carte (à la couleur du spectacle choisi), les séances et « Réserver » glissent et se serrent en place ———— */
.rs-zone{margin-top:clamp(18px,2vw,28px)}
.rs-k-bande{margin:0 0 10px;color:var(--u-vif)}
.rs-bande{gap:10px;padding:2px 2px 14px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--u-texte) 35%,transparent) transparent}
.rs-bande .rs-date{position:relative;align-items:flex-start;width:168px;min-height:156px;padding:14px 16px;border:2px solid color-mix(in srgb,var(--u-texte) 42%,transparent);border-radius:4px;background:transparent;color:var(--u-texte);text-align:left;transform-origin:0 50%;transition:background-color .16s,color .16s,border-color .16s}
.rs-bande .rs-q{display:flex;flex-direction:column;align-items:flex-start}
.rs-bande .rs-s{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--u-texte2)}
.rs-bande .rs-n{font-stretch:125%;font-weight:900;font-size:36px;line-height:1;white-space:nowrap}
.rs-bande .rs-m{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.rs-bande .rs-h{display:block;align-self:stretch;margin-top:8px;padding-top:8px;border-top:2px solid currentColor;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.rs-bande .rs-h--sans{font-weight:600;color:var(--u-texte2)}
.rs-bande .rs-o{display:block;max-width:100%;margin-top:4px;overflow:hidden;font-size:13px;font-weight:700;color:var(--u-texte2);white-space:nowrap;text-overflow:ellipsis}
.rs-bande .rs-date:hover{border-color:var(--u-grand)}
.rs-bande .rs-date:focus-visible{outline:3px solid var(--u-texte);outline-offset:3px}
.rs-bande .rs-date[aria-pressed="true"]{border-color:var(--u-aplat);background:var(--u-aplat);color:var(--u-sur)}
.rs-bande .rs-date[aria-pressed="true"] :is(.rs-s,.rs-o,.rs-h--sans){color:inherit}
.rs-corps{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,3vw,48px);align-items:start;margin-top:14px}
/* la carte d'une date : un carton dans l'univers du spectacle (son fond, sa police de titre, sa photo en fond discret) */
.rs-carte{position:relative;isolation:isolate;overflow:hidden;min-height:240px;background:var(--u-fond2);color:var(--u-texte);box-shadow:inset 0 0 0 1px var(--ligne),0 18px 40px -26px rgba(0,0,0,.6)}
.rs-photo{inset:0 0 0 auto;width:48%;height:100%;opacity:.26;-webkit-mask-image:linear-gradient(90deg,transparent,#000 75%);mask-image:linear-gradient(90deg,transparent,#000 75%)}
.rs-c{position:relative;display:flex;flex-direction:column;align-items:stretch;max-width:36rem;padding:clamp(22px,2.6vw,34px)}
.rs-sp{margin:0;font-family:var(--u-police);font-weight:var(--u-graisse);text-transform:var(--u-casse);font-size:clamp(28px,2.8vw,42px);line-height:1;color:var(--u-grand);overflow-wrap:break-word}
.rs-sp a{color:inherit;text-decoration:none}
.rs-sp a:hover{text-decoration:underline;text-decoration-thickness:2px}
.rs-quand{margin:12px 0 0;font-stretch:125%;font-weight:900;font-size:clamp(19px,1.7vw,24px);line-height:1.1;text-transform:uppercase}
