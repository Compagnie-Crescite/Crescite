<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<meta name="theme-color" content="#bc3e80">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --magenta:#bc3e80;--magenta-deep:#8e2a5f;--ink:#1a1016;--ink-soft:#5e4b56;--rose:#fff4f8;--white:#fff;
  --line:rgba(26,16,22,.16);--head:76px;--gut:clamp(16px,4vw,56px);--max:1280px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--head) + 16px)}
body{margin:0;background:var(--white);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.55;font-weight:400;font-stretch:100%;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1.5px}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,figure,blockquote{margin:0}
:focus-visible{outline:3px solid var(--focus,var(--ink));outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-100px;z-index:60;padding:12px 18px;background:var(--white);color:var(--ink);font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--gut));margin-inline:auto;padding-inline:var(--gut)}
.disp{font-stretch:125%;font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:-.01em;text-wrap:balance}
.lbl{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
.ico{width:1em;height:1em;flex:none}

/* la ligne-tentacule */
.sep{display:flex;align-items:center;width:100%;height:26px;color:var(--sep,var(--magenta))}
.sep svg{height:26px;overflow:visible}
.sep-vague{flex:1 1 0;min-width:0}
.sep-boucle{flex:none;width:46px}

/* l'en-tête */
.site-head{position:sticky;top:0;z-index:40;background:var(--magenta);color:#fff;--focus:#fff}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:24px;height:var(--head)}
.brand{display:inline-flex;align-items:center;gap:12px;flex:none;color:#fff;text-decoration:none}
.brand-mark{width:64px}
.brand-mark svg{width:100%;height:auto}
.brand-word{font-stretch:125%;font-weight:800;font-size:23px;line-height:1;letter-spacing:-.01em}
.nav ul{display:flex;gap:clamp(18px,2.1vw,34px);margin:0;padding:0;list-style:none}
.nav a{display:block;padding:8px 0 5px;border-bottom:3px solid transparent;font-size:15px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:border-color .2s}
.nav a:hover{border-bottom-color:rgba(255,255,255,.5)}
.nav a[aria-current="page"]{border-bottom-color:#fff}
.menu-btn{display:none}

/* les boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 28px;border:2px solid #fff;border-radius:999px;background:#fff;color:var(--magenta-deep);font-stretch:125%;font-weight:800;font-size:15px;line-height:1;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .25s,color .25s}
.btn .ico{width:18px;height:18px;transition:transform .25s}
.btn:hover{background:transparent;color:#fff}
.btn:hover .ico{transform:translateX(4px)}
.btn--ink{border-color:var(--ink);background:var(--ink);color:#fff}
.btn--ink:hover{background:transparent;color:var(--ink)}
.btn--mag{border-color:var(--magenta);background:var(--magenta);color:#fff}
.btn--mag:hover{background:transparent;color:var(--magenta-deep)}
.tag{display:inline-block;padding:3px 11px;border:1.5px solid currentColor;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.1em;line-height:1.4;text-transform:uppercase;white-space:nowrap}
.tag--plein{border-color:var(--magenta);background:var(--magenta);color:#fff}

/* l'accueil : le bandeau EN TOURNÉE, en bichromie */
.bd{position:relative;height:calc(100svh - var(--head));min-height:540px;max-height:1000px;background:var(--magenta);color:#fff;overflow:hidden;isolation:isolate;--focus:#fff}
.bd-haut{position:absolute;z-index:3;top:clamp(20px,3.6svh,40px);left:0;right:0;pointer-events:none}
.bd-sur{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 9px;border:2px solid #fff;border-radius:999px;font-stretch:125%;font-weight:800;font-size:clamp(13px,1.1vw,16px);letter-spacing:.2em;line-height:1;text-transform:uppercase;pointer-events:auto}
.bd-sur::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:pouls 2.2s ease-in-out infinite}
@keyframes pouls{50%{opacity:.25}}
.bd-slides{position:absolute;inset:0}
.bd-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.bd-slide.is-on{opacity:1;visibility:visible;transition:opacity 1s ease}
.bd-photo{position:absolute;inset:0;background:var(--magenta);isolation:isolate}
.bd-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.18) brightness(1.08);mix-blend-mode:multiply;transform:scale(1.07);transition:transform 9s linear}
.bd-slide.is-on .bd-photo img{transform:scale(1)}
.bd-slide::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(42,7,27,.84),rgba(42,7,27,.36) 44%,rgba(42,7,27,0) 70%),linear-gradient(to bottom,rgba(42,7,27,.42),rgba(42,7,27,0) 24%)}
.bd-txt{position:absolute;z-index:2;left:0;right:0;bottom:clamp(104px,15svh,156px);display:flex;flex-direction:column;align-items:flex-start;gap:clamp(18px,3svh,32px)}
.bd-titre{max-width:100%;font-size:clamp(46px,9.2vw,148px)}
.bd-l{display:block;overflow:hidden;padding-top:.14em;margin-top:-.14em}
.bd-l>span{display:inline-block;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.75,.1,1)}
.bd-l+.bd-l>span{transition-delay:.08s}
.bd-l+.bd-l+.bd-l>span{transition-delay:.16s}
.bd-slide.is-on .bd-l>span{transform:none}
.bd.attend .bd-l>span{transform:translateY(110%)}
.bd-pied{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.bd-pied .btn{opacity:0;transform:translateY(10px);transition:opacity .6s ease .3s,transform .6s ease .3s,background-color .25s,color .25s}
.bd-slide.is-on .bd-pied .btn{opacity:1;transform:none}
.bd.attend .bd-pied .btn{opacity:0}
.bd-credit{font-size:13px;letter-spacing:.04em}
.bd-bas{position:absolute;z-index:3;left:0;right:0;bottom:clamp(20px,3.4svh,38px);display:flex;align-items:flex-end;gap:20px}
.bd-sel{flex:1 1 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin:0;padding:0;list-style:none}
.bd-b{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:10px;width:100%;height:100%;padding:10px 0 0;border:0;background:none;color:#fff;text-align:left;cursor:pointer}
.bd-b-t{font-size:12px;font-weight:700;letter-spacing:.12em;line-height:1.3;text-transform:uppercase;opacity:.82;transition:opacity .3s}
.bd-b-t span{display:block}
.bd-b:hover .bd-b-t,.bd-b[aria-current] .bd-b-t{opacity:1}
.bd-b-l{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.34);overflow:hidden}
.bd-b-l span{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.bd-b[aria-current] .bd-b-l span{animation:plein 7s linear forwards}
.bd.arret .bd-b[aria-current] .bd-b-l span{animation-play-state:paused}
@keyframes plein{to{transform:scaleX(1)}}
.bd-pause{flex:none;display:grid;place-items:center;width:44px;height:44px;border:2px solid #fff;border-radius:50%;background:none;color:#fff;cursor:pointer}
.bd-pause .ico{width:16px;height:16px}
.bd-pause .i-l,.bd-pause[aria-pressed="true"] .i-p{display:none}
.bd-pause[aria-pressed="true"] .i-l{display:block}

/* les trois portes */
.portes{background:#fff}
.portes ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:0;list-style:none}
.porte{display:flex;align-items:flex-end;gap:18px;height:100%;min-height:clamp(132px,14vw,200px);padding:clamp(22px,2.4vw,36px) clamp(18px,2.6vw,40px);border-bottom:2px solid var(--magenta);color:var(--magenta-deep);text-decoration:none;transition:background-color .3s,color .3s;--focus:var(--magenta-deep)}
.porte-t{display:block;flex:1 1 auto;min-width:0;font-stretch:125%;font-weight:900;font-size:clamp(20px,2vw,30px);line-height:1.04;text-transform:uppercase;text-wrap:balance}
.porte .ico{width:clamp(26px,2.2vw,36px);height:clamp(26px,2.2vw,36px);transition:transform .3s}
.portes li+li .porte{border-left:2px solid var(--magenta)}
.porte:hover{background:var(--magenta);color:#fff}
.porte:hover .ico{transform:translateX(6px)}
.porte:focus-visible{outline-offset:-8px}

/* l'affiche de la tournée */
.aff-sec{padding:clamp(64px,8vw,120px) 0;background:var(--magenta);color:#fff;--focus:#fff;--sep:#fff}
.aff-grille{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto 1fr;grid-template-areas:"tete carte" "liste carte";column-gap:clamp(32px,4.4vw,80px);align-items:start}
.aff-tete{grid-area:tete}
.aff-carte{grid-area:carte;align-self:center}
.aff-liste{grid-area:liste}
.aff-sur{margin-bottom:16px}
.aff-titre{margin-bottom:clamp(20px,2.4vw,30px);font-size:clamp(44px,6vw,92px)}
.prochaines{margin:clamp(20px,2.4vw,30px) 0 clamp(28px,3vw,40px);padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.45)}
.pr{transition:opacity .3s}
.pr a{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.45);text-decoration:none;transition:padding .25s}
.pr-date{font-stretch:125%;font-weight:900;font-size:clamp(18px,1.6vw,22px);line-height:1.12;text-transform:uppercase}
.pr-lieu{font-weight:600;line-height:1.35}
.pr-titre{font-size:13px;font-weight:700;letter-spacing:.12em;line-height:1.35;text-transform:uppercase}
.pr a:hover,.pr.lit a{padding-left:12px}
.prochaines.a-survol .pr:not(.lit){opacity:.45}

/* la carte : des bras blancs épais, aux bouts enroulés, sur le magenta */
.aff{position:relative}
.aff-svg{width:100%;height:auto;overflow:visible;font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.aff-pays{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.6);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.aff-voisin{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.3);stroke-width:1;vector-effect:non-scaling-stroke}
.aff-b{fill:#fff}
.aff-s{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:0}
.aff-mt{stroke-dasharray:1 2;stroke-dashoffset:0}
.aff-passe{fill:#fff;opacity:.5}
.aff-pt{fill:#fff;opacity:.75}
.aff-rouen{fill:#fff}
.aff-anneau{fill:none;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:anneau 2.8s ease-out infinite}
@keyframes anneau{from{transform:scale(.6);opacity:.9}to{transform:scale(1.7);opacity:0}}
.aff-nom,.aff-rouen-nom{fill:#fff;stroke:var(--magenta);stroke-linejoin:round;paint-order:stroke;font-weight:700;font-stretch:112%;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;transition:opacity .5s ease var(--tn,0s)}
.aff-rouen-nom{font-weight:900;font-stretch:125%;letter-spacing:.06em}
.aff-lieu{cursor:pointer}
.aff-cible{fill:transparent}
.aff-lieu:focus{outline:none}
.aff-lieu:focus-visible .aff-cible{stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}
.aff-t,.aff-passe,.aff-pt{transition:opacity .3s}
.aff-svg.vit .aff-nom{transition-delay:0s}
.aff-svg.a-survol .aff-t:not(.on),.aff-svg.a-survol .aff-nom:not(.on){opacity:.26}
.aff-svg.a-survol .aff-passe:not(.on){opacity:.22}
.aff-passe.on,.aff-pt.on{opacity:1}
.aff-svg.attend .aff-mt,.aff-svg.attend .aff-s{stroke-dashoffset:1}
.aff-svg.attend .aff-nom,.aff-svg.attend .aff-rouen-nom{opacity:0}
.aff-svg.pousse .aff-mt{animation:pousse var(--d,1s) cubic-bezier(.5,0,.2,1) var(--t,0s) both}
.aff-svg.pousse .aff-s{animation:pousse .8s cubic-bezier(.3,0,.2,1) var(--t,0s) both}
@keyframes pousse{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.aff--grand .aff-svg.vit .aff-t{transform-box:view-box;transform-origin:var(--ox) var(--oy);animation:ondule 6s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.85s)}
@keyframes ondule{from{transform:rotate(-.55deg)}to{transform:rotate(.55deg)}}
.aff-tip{position:absolute;z-index:5;left:0;top:0;width:max-content;max-width:min(300px,86%);padding:12px 16px 14px;background:#fff;color:var(--magenta-deep);box-shadow:0 14px 34px rgba(58,13,39,.28);pointer-events:none;font-size:15px;line-height:1.35;text-align:left}
.tip-nom{color:var(--ink);font-stretch:125%;font-weight:900;font-size:16px;line-height:1.15;text-transform:uppercase}
.aff-tip ul{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.aff-tip b{display:block;font-weight:800}

/* les en-têtes de page et les sections */
.ph{padding:clamp(36px,4.6vw,68px) 0 clamp(48px,5.6vw,84px);background:var(--magenta);color:#fff;--focus:#fff;--sep:#fff}
.ph .sep{max-width:440px;margin-bottom:clamp(16px,2vw,26px)}
.ph-titre{font-size:clamp(42px,8vw,120px)}
.retour{display:inline-flex;align-items:center;gap:10px;margin-bottom:clamp(16px,2vw,26px);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.retour .ico{width:20px;height:20px;transform:scaleX(-1)}
.retour:hover{text-decoration:underline}
.sec{padding:clamp(60px,7.6vw,112px) 0}
.sec--rose{background:var(--rose)}
.sec-titre{margin:16px 0 clamp(26px,3.4vw,44px);color:var(--magenta);font-size:clamp(32px,4.4vw,62px)}
.lead{font-size:clamp(20px,1.8vw,24px);line-height:1.45;font-weight:500}
.prose{max-width:68ch;overflow-wrap:break-word}
.prose>*+*{margin-top:1em}
.prose h2{margin-top:1.7em;color:var(--magenta);font-stretch:125%;font-weight:900;font-size:clamp(21px,2vw,28px);line-height:1.1;text-transform:uppercase}
.prose h2:first-child{margin-top:0}
.prose ul{padding-left:1.15em}
.prose li+li{margin-top:.55em}
.prose a{color:var(--magenta-deep)}
.cie-acc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,88px);align-items:start}
.cie-acc .sec-titre{margin-bottom:0}
.cie-acc .btn{margin-top:30px}
.dons{padding:clamp(40px,5vw,64px) 0;background:var(--rose);color:var(--ink-soft);font-size:15px;line-height:1.65}
.dons p{max-width:118ch;margin-top:16px}

/* l'agenda et les saisons */
.ag{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,4.4vw,80px);align-items:start}
.ag>.ag-carte{grid-column:2;grid-row:1;position:sticky;top:calc(var(--head) + 24px)}
.ag>.liste{grid-column:1;grid-row:1}
.ag-carte{padding:clamp(16px,1.8vw,26px);background:var(--magenta);color:#fff;--focus:#fff}
.aff-seule{max-width:780px;margin-inline:auto}
.filtre{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 16px;border:2px solid #fff;border-radius:999px;background:#fff;color:var(--magenta-deep);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chip:hover{background:transparent;color:#fff}
.chip .ico{width:16px;height:16px}
.grp+.grp{margin-top:clamp(40px,5vw,64px)}
.mois{display:flex;align-items:center;gap:18px;margin-bottom:4px;color:var(--magenta);font-size:clamp(22px,2.2vw,30px)}
.mois::after{content:"";flex:1;height:2px;background:currentColor}
.rs{margin:0;padding:0;list-style:none}
.r{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:6px clamp(18px,2.4vw,36px);padding:20px 0;border-bottom:1px solid var(--line);transition:opacity .3s}
.r-when{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.r-big{font-stretch:125%;font-weight:900;font-size:clamp(20px,2vw,28px);line-height:1.02;text-transform:uppercase}
.r-small{color:var(--ink-soft);font-size:13px;font-weight:700;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}
.r-what{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.r-titre{color:var(--magenta-deep);font-stretch:125%;font-weight:800;font-size:clamp(16px,1.4vw,19px);line-height:1.2;text-transform:uppercase;text-decoration:none}
.r-titre:hover{text-decoration:underline}
.r-lieu{font-weight:700;line-height:1.3}
.r-det{max-width:100%;color:var(--ink-soft);font-size:16px;line-height:1.45;overflow-wrap:break-word}
.r .ext{color:var(--magenta-deep)}
.ext{font-weight:600}
.ext .ico{display:inline-block;width:.8em;height:.8em;margin-left:.25em;vertical-align:-.05em}
.liste.a-survol .r:not(.lit){opacity:.3}
.r.lit .r-big{color:var(--magenta)}
.r--s .r-big{font-size:16px;font-stretch:112%;font-weight:800;line-height:1.25}
.r--annule .r-big{text-decoration:line-through}
.r .tag{color:var(--magenta-deep)}
.sg-titre{font-size:clamp(24px,2.8vw,40px)}
.sg-titre a{text-decoration:none}
.sg-titre a:hover{color:var(--magenta)}
.sg-sous{margin-top:8px;font-size:19px;line-height:1.4}
.sg-crea{margin-top:6px;color:var(--magenta-deep)}
.sg .rs{margin-top:16px;border-top:2px solid var(--ink)}
.saisons ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:0 clamp(20px,3vw,40px);margin:22px 0 0;padding:0;list-style:none}
.saisons a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--magenta-deep);font-stretch:125%;font-weight:800;font-size:clamp(17px,1.5vw,21px);line-height:1.15;text-transform:uppercase;text-decoration:none}
.saisons a .ico{width:20px;height:20px;transition:transform .25s}
.saisons a:hover{color:var(--magenta)}
.saisons a:hover .ico{transform:translateX(5px)}

/* les spectacles */
.vgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(48px,6vw,88px) clamp(24px,4vw,56px)}
.vg{position:relative;display:flex;flex-direction:column;align-items:flex-start}
.vg-photo{align-self:stretch;aspect-ratio:3/2;margin-bottom:22px}
.duo{position:relative;overflow:hidden;background:var(--magenta);isolation:isolate;transition:background-color .5s ease}
.duo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(1.12);mix-blend-mode:multiply;transition:transform .8s ease}
.vg:hover .duo,.vg:focus-within .duo{background:var(--c)}
.vg:hover .duo img{transform:scale(1.03)}
.vg-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;color:var(--magenta-deep)}
.vg-titre{margin-bottom:12px;font-size:clamp(28px,3.1vw,44px)}
.vg-titre a{text-decoration:none;transition:color .25s}
.vg-titre a::after{content:"";position:absolute;inset:0}
.vg-titre a:focus-visible{outline:none}
.vg-titre a:focus-visible::after{outline:3px solid var(--ink);outline-offset:8px}
.vg:hover .vg-titre a{color:var(--magenta)}
.vg-sous{margin-bottom:8px;color:var(--ink-soft)}
.vg-crea{color:var(--magenta-deep)}

/* la page d'un spectacle */
.sh{display:flex;flex-direction:column;min-height:calc(100svh - var(--head));background:var(--c);color:var(--ink);--focus:var(--ink)}
.sh-photo{position:relative;flex:1 1 auto;min-height:clamp(220px,42svh,560px);overflow:hidden;background:var(--c);isolation:isolate}
.sh-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.2) brightness(1.08);mix-blend-mode:multiply}
.sh-photo::after{content:"";position:absolute;inset:auto 0 0;z-index:1;height:62%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--c) 22%,transparent) 38%,color-mix(in srgb,var(--c) 80%,transparent) 78%,var(--c) 96%)}
.sh-txt{padding-top:6px;padding-bottom:clamp(34px,4.4vw,60px)}
.sh-titre{font-size:clamp(34px,calc(min(100vw - 2 * var(--gut),var(--max)) / (var(--len) * .92)),150px)}
.sh-titre span{display:block}
.sh-sous{max-width:48ch;margin-top:clamp(14px,1.6vw,22px);font-size:clamp(19px,1.7vw,24px);font-weight:500;line-height:1.35}
.sh-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:18px}
.sh-credit{margin-left:auto;font-size:13px;letter-spacing:.03em}
.sp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,6vw,96px);align-items:start}
.fiche-col{display:grid;gap:18px;padding-top:18px;border-top:2px solid var(--ink);font-size:16px;line-height:1.5}
.fiche{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.f-k{font-weight:800}
.f-duree{font-stretch:125%;font-weight:900;font-size:18px;text-transform:uppercase}
.f-prod p+p{margin-top:8px}
.fiche-col a{color:var(--accent)}
.medias ul{display:grid;gap:10px;margin:8px 0 0;padding:0;list-style:none}
.media{display:inline-flex;align-items:flex-start;gap:10px;font-weight:700;text-decoration:none}
.media .ico{width:18px;height:18px;margin-top:3px}
.media:hover span{text-decoration:underline}
.media-par{display:block;margin-left:28px;color:var(--ink-soft);font-size:15px}
.medias-g{margin-top:10px;color:var(--accent)}
.cadre{margin-top:32px;padding:14px 0;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);color:var(--accent);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1.4;text-transform:uppercase}
.extraits{display:grid;gap:28px;margin-top:36px}
.extraits blockquote{font-size:clamp(20px,1.9vw,26px);font-weight:600;line-height:1.35;text-wrap:pretty}
.extraits figcaption{margin-top:8px;color:var(--ink-soft);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.tour-txt{font-size:clamp(20px,1.8vw,24px);font-weight:500}
.show .sec+.sec{padding-top:0}
.next{display:block;padding:clamp(52px,6.6vw,100px) 0;background:var(--c);color:var(--ink);text-decoration:none;--focus:var(--ink)}
.next:focus-visible{outline-offset:-8px}
.next-in{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.next-t{flex:1;min-width:0;font-size:clamp(36px,6.4vw,96px)}
.next-t span{display:block}
.next-go{width:clamp(44px,5vw,72px);height:clamp(44px,5vw,72px);flex:none;transition:transform .3s}
.next:hover .next-go{transform:translateX(8px)}

/* la compagnie, les actions, les formulaires */
.annees{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:0 clamp(20px,3vw,40px);margin:0;padding:0;list-style:none}
.annees li{display:flex;flex-direction:column;gap:6px;padding:18px 0 24px;border-top:2px solid var(--magenta)}
.an{color:var(--magenta);font-size:clamp(40px,4.2vw,62px)}
.an-t{font-weight:700;font-size:18px;line-height:1.3}
a.an-t{text-decoration:none}
a.an-t:hover{color:var(--magenta-deep);text-decoration:underline}
.act{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,6vw,96px);align-items:start}
.act-photo{position:sticky;top:calc(var(--head) + 24px)}
.act-photo .duo{aspect-ratio:4/5}
.act-photo:hover .duo{background:var(--magenta-deep)}
.cr{margin-top:10px;color:var(--ink-soft);font-size:14px}
.contact{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,6vw,96px);align-items:start}
.etroit{max-width:760px}
.form{display:grid;gap:22px;max-width:640px}
.champ{display:grid;gap:8px}
.champ label,.calc label{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.champ input,.champ textarea,.calc input{width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--ink);border-radius:0;background:#fff;font-size:18px}
.champ textarea{min-height:170px;resize:vertical}
.form input:focus-visible,.form textarea:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.case{display:flex;align-items:flex-start;gap:12px;line-height:1.4}
.case input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--magenta)}
.case a{color:var(--magenta-deep)}
.calc{display:flex;align-items:center;gap:14px}
.calc input{width:76px}
.form .btn{justify-self:start}
.coord{padding:clamp(24px,3vw,40px);background:var(--magenta);color:#fff;--focus:#fff}
.coord-nom{margin-bottom:12px;font-stretch:125%;font-weight:900;font-size:clamp(22px,2.2vw,30px);line-height:1.05;text-transform:uppercase}
.coord p+p{margin-top:12px}

/* le pied de page */
.pied{padding:clamp(56px,7vw,96px) 0 32px;background:var(--magenta-deep);color:#fff;--focus:#fff;--sep:#fff}
.pied-grille{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,4fr) minmax(0,5fr);gap:40px clamp(32px,4vw,64px);align-items:start}
.pied-logo{display:block;width:clamp(130px,12vw,176px);color:#fff}
.pied-logo svg{width:100%;height:auto}
.pied-nom{margin-bottom:10px;font-stretch:125%;font-weight:900;font-size:clamp(20px,1.8vw,24px);line-height:1.1;text-transform:uppercase}
.pied-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:22px}
.pied .btn{min-height:46px;padding:0 22px}
.pied-fb{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pied-part{font-size:16px;line-height:1.6}
.pied .sep{margin:clamp(40px,5vw,64px) 0 18px}
.pied-bas{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 32px;font-size:14px}
.pied-legal,.pied-ll{display:flex;flex-wrap:wrap;gap:4px 22px}

.rv.is-wait{opacity:0;transform:translateY(18px)}
.rv.is-wait.is-in{opacity:1;transform:none;transition:opacity .8s ease,transform .8s ease}
.intro.m05-intro .intro-indice{opacity:1}

@media (max-width:1279.98px){
  .menu-btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1.5px solid #fff;border-radius:999px;background:none;color:#fff;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .menu-btn .ico{width:20px;height:20px}
  .menu-btn[aria-expanded="true"]{background:#fff;color:var(--magenta-deep)}
  .nav{position:absolute;top:100%;left:0;right:0;display:none;max-height:calc(100svh - var(--head));overflow:auto;padding:8px var(--gut) 28px;border-top:1px solid rgba(255,255,255,.35);background:var(--magenta-deep);box-shadow:0 18px 32px rgba(26,16,22,.25)}
  .nav.is-open{display:block}
  .nav ul{flex-direction:column;gap:0;max-width:var(--max);margin-inline:auto}
  .nav a{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.3);font-stretch:125%;font-weight:800;font-size:clamp(20px,4.6vw,28px);letter-spacing:0}
  .nav a:hover,.nav a[aria-current="page"]{border-bottom-color:rgba(255,255,255,.3);text-decoration:underline;text-underline-offset:.25em}
  .nav a[aria-current="page"]{text-decoration-thickness:3px}
}
@media (max-width:1100px){
  .ag{grid-template-columns:minmax(0,1fr)}
  .ag>.ag-carte,.ag>.liste{grid-column:1;grid-row:auto}
  .ag>.ag-carte{position:static;width:100%;max-width:680px}
}
@media (max-width:980px){
  .aff-grille{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"tete" "carte" "liste"}
  .aff-carte{margin:8px 0 12px}
  .sp,.act,.contact,.cie-acc{grid-template-columns:minmax(0,1fr)}
  .act-photo{position:static;max-width:560px}
  .pied-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pied-logo{grid-column:1/-1}
}
@media (max-width:860px){
  :root{--head:64px}
  .brand-mark{width:54px}
  .brand-word{font-size:20px}
}
@media (max-width:760px){
  .portes ul{grid-template-columns:minmax(0,1fr)}
  .porte{min-height:0;align-items:center;padding:22px var(--gut)}
  .portes li+li .porte{border-left:0}
  .vgs{grid-template-columns:minmax(0,1fr)}
  .bd-b-t{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .bd-b{padding:16px 0 12px}
  .r{grid-template-columns:minmax(0,1fr);gap:8px}
  .r-when{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .pied-grille{grid-template-columns:minmax(0,1fr)}
  .sh-credit{flex-basis:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .rv.is-wait{opacity:1;transform:none}
  .bd-pause{display:none}
  .bd-b[aria-current] .bd-b-l span{transform:none}
}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const S = D.site, L = S.libelles, SHOWS = D.shows, BY = Object.fromEntries(SHOWS.map(s => [s.slug, s]));
  const MENU = Object.fromEntries(S.menu.map(m => [m.id, m]));
  const SAISON0 = S.saisons[0];
  const main = $('#main');
  const bouge = () => CARTE.mouvement();

  const use = (id, cls = 'ico') => `<svg class="${cls}" aria-hidden="true" focusable="false"><use href="#${id}"></use></svg>`;
  const sep = () => `<div class="sep" aria-hidden="true"><svg class="sep-vague" focusable="false"><use href="#i-vague"></use></svg><svg class="sep-boucle" focusable="false"><use href="#i-boucle"></use></svg></div>`;
  const ext = (href, html, cls = 'ext') => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${html}${use('i-ext')}<span class="sr"> (nouvel onglet)</span></a>`;
  const titreTxt = t => esc(t).replace(/ – /g, '&nbsp;– ');
  const bloc = b => /^\s*<(h[1-6]|ul|ol|p|div|table|blockquote|figure)\b/i.test(b) ? b : `<p>${b}</p>`;

  // une couleur d'accent lisible sur blanc, tirée de la couleur du spectacle
  const lum = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const fonce = hex => {
    let rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), c = hex;
    while (ratio(c, '#ffffff') < 4.6 && rgb.some(Boolean)) { rgb = rgb.map(v => Math.floor(v * .92)); c = '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join(''); }
    return c;
  };

  /* ---------- les lignes de date, composées sans rien réécrire ---------- */
  const RE_MOIS = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre) (\d{4})\s*$/;
  function decoupe(t) {
    const m = String(t).match(RE_MOIS);
    if (!m) return { grand: t, petit: '', mois: t };
    const jour = t.slice(0, m.index).trim(), mois = `${m[1]} ${m[2]}`;
    return jour ? { grand: jour, petit: mois, mois } : { grand: m[1], petit: m[2], mois };
  }
  const details = d => {
    const avecLien = d.details.some(x => x.lien);
    return d.details.map((x, i) => { const href = x.lien || (!avecLien && i === 0 ? d.lien : null); return `<p class="r-det">${href ? ext(href, esc(x.texte)) : esc(x.texte)}</p>`; }).join('');
  };
  function rangee(d, avecTitre = true) {
    const k = decoupe(d.ligneDate);
    const lieu = !d.details.length && d.lien ? ext(d.lien, esc(d.ligneLieu)) : esc(d.ligneLieu);
    return `<li class="r" data-l="${d.l ?? ''}"><p class="r-when"><span class="r-big">${esc(k.grand)}</span>${k.petit ? `<span class="r-small">${esc(k.petit)}</span>` : ''}</p>`
      + `<div class="r-what">${avecTitre ? `<a class="r-titre" href="#/spectacle/${esc(d.slug)}">${titreTxt(d.titre)}</a>` : ''}<p class="r-lieu">${lieu}</p>${details(d)}</div></li>`;
  }
  function rangeeSaison(d) {
    const i = d.ligne.indexOf(' — '), quand = i > 0 ? d.ligne.slice(0, i) : d.ligne, ou = i > 0 ? d.ligne.slice(i + 3) : '';
    const q = !d.details.length && d.lien ? ext(d.lien, esc(quand)) : esc(quand);
    return `<li class="r r--s${d.etat && /annul/i.test(d.etat) ? ' r--annule' : ''}" data-l="${d.l ?? ''}"><p class="r-when"><span class="r-big">${q}</span>${d.etat ? `<span class="tag">${esc(d.etat)}</span>` : ''}</p>`
      + `<div class="r-what">${ou ? `<p class="r-lieu">${esc(ou)}</p>` : ''}${details(d)}</div></li>`;
  }

  /* ---------- la carte-affiche : des bras blancs épais, enroulés au bout, qui poussent depuis Rouen ---------- */
  const R = CARTE.rouen, [VX, VY, VW, VH] = CARTE.viewBox.split(/\s+/).map(Number), E = Math.max(VW, VH) / 800;
  const loin = x => Math.hypot(x.xy[0] - R[0], x.xy[1] - R[1]) >= 6;
  const courbeDe = x => (x.xy[0] >= R[0] ? -.24 : .24);
  const quand = d => d.ligneDate || String(d.ligne || '').split(' — ')[0];
  const etiquette = x => `${CARTE.nom(x)}${x.dates && x.dates.length ? ' : ' + x.dates.map(quand).join(' ; ') : ''}`;
  const REG = {};
  let nAff = 0;
  function affiche({ lieux = [], passe = [], titre = '', grand = false } = {}) {
    const id = 'aff' + (++nAff), f = grand ? 1.3 : 1;
    const bras = lieux.filter(loin), ps = passe.filter(loin);
    const tete = lieux.find(x => !loin(x)) || (lieux.length ? null : passe.find(x => !loin(x)));
    const actifs = lieux.length ? lieux : ps.length <= 40 ? [...ps, ...(tete ? [tete] : [])] : [];
    const clic = new Set(actifs.map(x => x.l));
    REG[id] = new Map(actifs.map(x => [x.l, x]));
    const larg = x => (5.5 + Math.sqrt(x.n || 1) * 2.4) * E * f;
    const tps = bras.map((x, i) => ({ d: .55 + CARTE.longueur(x.xy, { courbe: courbeDe(x) }) / 620, t: .15 + i * .06 }));
    const fin = Math.max(1.4, ...tps.map(a => a.t + a.d + .8));
    const lieu = x => `<g class="carte-lieu aff-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><circle class="aff-cible" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(12 * E).toFixed(1)}"/></g>`;
    const masque = (mid, contenu) => `<mask id="${mid}" maskUnits="userSpaceOnUse" x="${VX}" y="${VY}" width="${VW}" height="${VH}">${contenu}</mask>`;
    const mt = (x, w, d, t) => `<path class="aff-mt" d="${CARTE.trait(x.xy, { courbe: courbeDe(x) })}" pathLength="1" fill="none" stroke="#fff" stroke-width="${w.toFixed(1)}" style="--d:${d.toFixed(2)}s;--t:${t.toFixed(2)}s"/>`;
    const noms = bras.length ? bras : ps.length <= 40 ? ps : [];
    const defs = (ps.length ? masque(`${id}-p`, ps.map((x, i) => mt(x, 6 * E, .6 + CARTE.longueur(x.xy, { courbe: courbeDe(x) }) / 900, i * .012)).join('')) : '')
      + bras.map((x, i) => masque(`${id}-${i}`, mt(x, larg(x) + 10 * E, tps[i].d, tps[i].t))).join('');
    const svg = `<svg class="aff-svg${bouge() ? ' attend' : ' vit'}" viewBox="${CARTE.viewBox}" data-fin="${fin.toFixed(2)}" style="--ox:${(R[0] - VX).toFixed(1)}px;--oy:${(R[1] - VY).toFixed(1)}px" role="${clic.size ? 'group' : 'img'}" aria-label="${esc(titre)}">
      <defs>${defs}</defs>
      <path class="aff-voisin" d="${CARTE.fond.belgique}"/><path class="aff-voisin" d="${CARTE.fond.luxembourg}"/><path class="aff-pays" d="${CARTE.fond.pays}"/>
      ${ps.length ? `<g class="aff-passes" mask="url(#${id}-p)">${ps.map(x => `<path class="aff-passe" data-l="${x.l}" d="${CARTE.bras(x.xy, { w0: 2.6 * E, w1: .7 * E, courbe: courbeDe(x) })}"/>`).join('')}</g><g>${ps.map(x => `<circle class="aff-pt" data-l="${x.l}" cx="${x.xy[0]}" cy="${x.xy[1]}" r="${(2.3 * E).toFixed(2)}"/>`).join('')}</g>` : ''}

  // les noms des communes : posés là où il y a de la place, à une taille lisible quelle que soit la largeur
  function placer(wrap) {
    const svg = wrap && $('svg', wrap);
    if (!svg) return;
    const w = svg.getBoundingClientRect().width;
    if (!w) return;
    const k = VW / w, f = wrap.classList.contains('aff--grand') ? 1.3 : 1;
    const fs = (f > 1 ? 12.5 : 11.5) * k, pad = 2.5 * k, ecart = 3 * k, rt = 15 * E * f;
    const boites = [{ x0: R[0] - rt, x1: R[0] + rt, y0: R[1] - rt, y1: R[1] + rt }];
    const libre = (b, l) => b.x0 >= VX + 2 && b.x1 <= VX + VW - 2 && b.y0 >= VY + 2 && b.y1 <= VY + VH - 2
      && !boites.some(o => o.l !== l && b.x0 < o.x1 + pad && b.x1 > o.x0 - pad && b.y0 < o.y1 + pad && b.y1 > o.y0 - pad);
    const spi = new Map();
    $$('.aff-s', svg).forEach(s => { const b = s.getBBox(), o = { l: +s.dataset.l, x0: b.x, x1: b.x + b.width, y0: b.y, y1: b.y + b.height }; spi.set(o.l, o); boites.push(o); });
    const essayer = (t, cands, l) => {
      const tw = t.getComputedTextLength(), fz = +t.getAttribute('font-size');
      for (const [tx, ty, a] of cands) {
        const x0 = a === 'start' ? tx : a === 'end' ? tx - tw : tx - tw / 2, b = { x0, x1: x0 + tw, y0: ty - fz * .8, y1: ty + fz * .2 };
        if (libre(b, l)) { t.setAttribute('x', tx.toFixed(1)); t.setAttribute('y', ty.toFixed(1)); t.setAttribute('text-anchor', a); boites.push(b); return true; }
      }
      return false;
    };
    const rn = $('.aff-rouen-nom', svg), rf = fs * 1.12;
    rn.setAttribute('font-size', rf.toFixed(2)); rn.setAttribute('stroke-width', (3.4 * k).toFixed(2));
    const rc = [[R[0] - rt - ecart, R[1] + rf * .35, 'end'], [R[0] + rt * .2, R[1] - rt - ecart, 'start'], [R[0] - rt * .2, R[1] - rt - ecart, 'end'], [R[0] + rt + ecart, R[1] + rf * .35, 'start'], [R[0], R[1] + rt + rf, 'middle']];
    if (!essayer(rn, rc, -1)) { rn.setAttribute('x', rc[0][0].toFixed(1)); rn.setAttribute('y', rc[0][1].toFixed(1)); rn.setAttribute('text-anchor', 'end'); }
    const dist = t => Math.hypot(+t.dataset.x - R[0], +t.dataset.y - R[1]);
    $$('.aff-nom', svg).sort((a, b) => (+b.dataset.n - +a.dataset.n) || (dist(b) - dist(a))).forEach(t => {
      t.style.display = '';
      t.setAttribute('font-size', fs.toFixed(2)); t.setAttribute('stroke-width', (3 * k).toFixed(2));
      const l = +t.dataset.l, x = +t.dataset.x, y = +t.dataset.y, s = spi.get(l) || { x0: x - 3 * E, x1: x + 3 * E, y0: y - 3 * E, y1: y + 3 * E };
      if (!essayer(t, [[s.x1 + ecart, y + fs * .35, 'start'], [s.x0 - ecart, y + fs * .35, 'end'], [x, s.y0 - ecart, 'middle'], [x, s.y1 + ecart + fs * .8, 'middle']], l)) t.style.display = 'none';
    });
  }

  // la carte vit : elle pousse quand on la voit, s'éclaire au survol, choisit au clic
  function initAffiche(wrap, { lignes, survol, choix } = {}) {
    if (!wrap) return null;
    const svg = $('svg', wrap), tip = $('.aff-tip', wrap), reg = REG[wrap.id] || new Map();
    placer(wrap);
    if (svg.classList.contains('attend')) {
      const go = () => { svg.classList.remove('attend'); svg.classList.add('pousse'); setTimeout(() => svg.classList.add('vit'), +svg.dataset.fin * 1000); };
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(es => { if (es.some(en => en.isIntersecting)) { io.disconnect(); go(); } }, { threshold: .2 });
        io.observe(svg);
      } else go();
    }
    let fixe = null;
    const montre = l => {
      const on = l != null && reg.has(l);
      svg.classList.toggle('a-survol', on);
      $$('[data-l]', svg).forEach(n => n.classList.toggle('on', on && +n.dataset.l === l));
      if (!on) { tip.hidden = true; return; }
      const x = reg.get(l);
      tip.innerHTML = `<p class="tip-nom">${esc(CARTE.nom(x))}</p>${lignes ? `<ul>${lignes(x)}</ul>` : ''}`;
      tip.hidden = false;
      const wr = wrap.getBoundingClientRect(), sr = svg.getBoundingClientRect();
      const X = sr.left - wr.left + (x.xy[0] - VX) / VW * sr.width, Y = sr.top - wr.top + (x.xy[1] - VY) / VH * sr.height;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let lx = X + 18;
      if (lx + tw > wr.width - 4) lx = X - 18 - tw;
      lx = Math.max(4, Math.min(lx, wr.width - tw - 4));
      tip.style.left = `${lx}px`;
      tip.style.top = `${Math.max(4, Math.min(Y - th / 2, wr.height - th - 4))}px`;
    };
    CARTE.lier(svg, {
      survol: l => { montre(l ?? fixe); if (survol) survol(l ?? fixe); },
      choix: l => { fixe = fixe === l ? null : l; montre(fixe); if (survol) survol(fixe); if (choix) choix(fixe); }
    });
    return {
      montre: l => montre(l ?? fixe),
      choisir: l => { fixe = l; montre(l); if (survol) survol(l); },
      liberer: () => { fixe = null; montre(null); if (survol) survol(null); }
    };
  }

  const lignesAvenir = x => plus(x.dates, 5, d => `<li><b>${esc(d.ligneDate)}</b>${titreTxt(d.titre)}</li>`);

    if (dates.length) tour = `<section class="sec" aria-labelledby="h-tour"><div class="wrap">${sep()}<h2 class="sec-titre disp" id="h-tour" data-fit="sec">${esc(s.tournee.titre)}</h2>
        <div class="ag"><div class="ag-carte">${affiche({ lieux: geo.aVenir, passe: geo.passe, titre: s.tournee.titre })}</div><div class="liste"><ol class="rs">${dates.map(d => rangee(d, false)).join('')}</ol></div></div></div></section>`;
    else if (s.tournee && s.tournee.texte) tour = `<section class="sec" aria-labelledby="h-tour"><div class="wrap">${sep()}<h2 class="sec-titre disp" id="h-tour" data-fit="sec">${esc(s.tournee.titre)}</h2><p class="tour-txt">${esc(s.tournee.texte)}</p></div></section>`;
    else if (geo.passe.length) tour = `<section class="sec" aria-label="${esc(s.titre)}"><div class="wrap"><div class="ag-carte aff-seule">${affiche({ passe: geo.passe, titre: s.titre })}</div></div></section>`;
    return `<div class="show" style="--c:${s.couleur};--accent:${fonce(s.couleur)}">
      <section class="sh" aria-labelledby="h-page">
        <div class="sh-photo"><img src="${D.photos[s.slug]}" alt="" style="object-position:${s.focale ?? 50}% 30%"></div>
        <div class="wrap sh-txt">
          <a class="retour" href="${esc(MENU.spectacles.href)}">${use('i-go')}${esc(MENU.spectacles.texte)}</a>
          <h1 class="sh-titre disp" id="h-page" tabindex="-1" data-fit="sh" style="--len:${len}">${s.titreLignes.map(t => `<span>${esc(t)}</span>`).join(' ')}</h1>
          ${s.sousTitre ? `<p class="sh-sous">${s.sousTitre}</p>` : ''}
          <p class="sh-meta">${s.creation ? `<span class="lbl">${esc(s.creation)}</span>` : ''}${s.statut ? `<span class="tag">${esc(s.statut)}</span>` : ''}${s.enTournee ? `<span class="tag">${esc(L.enTournee)}</span>` : ''}${s.credit ? `<span class="sh-credit">${esc(s.credit)}</span>` : ''}</p>
        </div>
      </section>
      <section class="sec"><div class="wrap sp">
        <div class="prose">${genre}${s.texte.map(p => `<p>${p}</p>`).join('')}${projet}</div>
        ${fiche ? `<div class="fiche-col">${fiche}</div>` : ''}
      </div></section>
      ${tour}
      <a class="next" href="#/spectacle/${nx.slug}" style="--c:${nx.couleur}"><span class="wrap next-in"><span class="next-t disp" data-fit="next">${nx.titreLignes.map(t => `<span>${esc(t)}</span>`).join(' ')}</span>${use('i-go', 'next-go')}</span></a>
    </div>`;
  }
  function initShow() {
    const wrap = $('.aff', main);
    if (!wrap) return;
    const liste = $('.liste', main);
    relier(liste, initAffiche(wrap, { lignes: liste ? lignesAvenir : lignesSaison, survol: liste ? l => eclairer(liste, l) : null }));
  }

  function pageCie() {
    const C = S.compagnie;
    return entete(C.titre) + `<section class="sec"><div class="wrap"><div class="prose">${C.paragraphes.map((p, i) => `<p${i ? '' : ' class="lead"'}>${p}</p>`).join('')}</div></div></section>
      <section class="sec sec--rose" aria-labelledby="h-dates"><div class="wrap">${sep()}<h2 class="sec-titre disp" id="h-dates" data-fit="sec">${esc(C.datesTitre)}</h2>
        <ol class="annees">${C.dates.map(d => { const s = SHOWS.find(x => String(x.annee) === String(d.annee)); return `<li><span class="an disp">${esc(d.annee)}</span>${s ? `<a class="an-t" href="#/spectacle/${s.slug}">${titreTxt(d.titre)}</a>` : `<span class="an-t">${titreTxt(d.titre)}</span>`}</li>`; }).join('')}</ol>
      </div></section>`;
  }
  function pageActions() {
    const A = S.actions;
    return entete(A.titre) + `<section class="sec"><div class="wrap act"><div class="prose">${A.blocs.map(bloc).join('')}</div>
      <figure class="act-photo"><div class="duo"><img src="${D.photos['actions-culturelles']}" alt=""></div>${A.credit ? `<figcaption class="cr">${esc(A.credit)}</figcaption>` : ''}</figure></div></section>`;
  }
  function pagePro() {
    const P = S.pro;
    return entete(P.titre) + `<section class="sec"><div class="wrap etroit"><form class="form" novalidate>
      <p class="lead">${esc(P.texte)}</p>
      <p class="champ"><label for="pro-mdp">${esc(P.champ)}</label><input id="pro-mdp" name="pro-mdp" type="password" autocomplete="current-password"></p>
      <p><button class="btn btn--ink" type="submit">${esc(P.bouton)}</button></p></form></div></section>`;
  }
  function pageContact() {
    const C = S.contact, K = S.coordonnees, pol = S.liensLegaux.find(x => /confidentialit/i.test(x.texte));
    const at = pol ? C.consentement.toLowerCase().indexOf(pol.texte.toLowerCase()) : -1;
    const consent = at >= 0 ? `${esc(C.consentement.slice(0, at))}<a href="${esc(pol.href)}">${esc(C.consentement.slice(at, at + pol.texte.length))}</a>${esc(C.consentement.slice(at + pol.texte.length))}` : esc(C.consentement);
    const champ = (c, n) => {
      const id = 'c-' + n;
      if (/message/i.test(c)) return `<p class="champ"><label for="${id}">${esc(c)}</label><textarea id="${id}" name="${id}" rows="6"></textarea></p>`;
      const type = /mail/i.test(c) ? 'email' : /t[ée]l[ée]phone/i.test(c) ? 'tel' : 'text';
      const auto = type === 'email' ? 'email' : type === 'tel' ? 'tel' : /^nom/i.test(c) ? 'name' : /ville/i.test(c) ? 'address-level2' : 'off';
      return `<p class="champ"><label for="${id}">${esc(c)}</label><input id="${id}" name="${id}" type="${type}" autocomplete="${auto}"></p>`;
    };
    return entete(C.titre) + `<section class="sec"><div class="wrap contact">
      <form class="form" novalidate>${C.champs.map(champ).join('')}
        <p class="case"><input type="checkbox" id="c-ok" name="c-ok"><label for="c-ok">${consent}</label></p>
        <p class="calc"><label for="c-calc">${esc(C.calcul)}</label><input id="c-calc" name="c-calc" inputmode="numeric" maxlength="2" autocomplete="off"></p>
        <p><button class="btn btn--ink" type="submit">${esc(C.bouton)}</button></p>
      </form>
      <aside class="coord" aria-label="${esc(K.nom)}"><p class="coord-nom">${esc(K.nom)}</p><p>${K.adresse.map(esc).join('<br>')}</p><p>${esc(S.facebook.texte)}</p></aside>
    </div></section>`;
  }
  const pageLegal = p => entete(S.legal[p].titre) + `<section class="sec"><div class="wrap"><div class="prose">${S.legal[p].blocs.map(bloc).join('')}</div></div></section>`;
  const initForms = () => $$('form', main).forEach(f => f.addEventListener('submit', e => e.preventDefault()));

  function pied() {
    const K = S.coordonnees, fb = S.facebook.href ? `<a class="pied-fb" href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : `<span class="pied-fb">${esc(S.facebook.texte)}</span>`;
    return `<div class="wrap">
      <div class="pied-grille">
        <a class="pied-logo" href="#/" aria-label="${esc(S.nom)}, ${esc(S.accueil)}"><span aria-hidden="true">${D.logo.octopusWord}</span></a>
        <div><p class="pied-nom">${esc(K.nom)}</p><p>${K.adresse.map(esc).join('<br>')}</p>
          <p class="pied-actions"><a class="btn" href="${esc(S.ecrire.href)}">${esc(S.ecrire.texte)}${use('i-go')}</a>${fb}</p></div>
        <p class="pied-part">${S.partenaires}</p>
      </div>
      ${sep()}
      <div class="pied-bas"><p class="pied-legal">${K.legal.map(t => `<span>${esc(t)}</span>`).join('')}</p><p class="pied-ll">${S.liensLegaux.map(a => `<a href="${esc(a.href)}">${esc(a.texte)}</a>`).join('')}</p></div>
    </div>`;
  }

  /* ---------- l'ajustement des grands titres, l'apparition au défilement ---------- */
  function fit() {
    const groups = {};
    $$('[data-fit]').forEach(el => { el.style.fontSize = ''; (groups[el.dataset.fit] ||= []).push(el); });
    Object.values(groups).forEach(els => {
      const base = els.map(el => parseFloat(getComputedStyle(el).fontSize));
      let k = 1;
      els.forEach(el => {
        const w = el.clientWidth;
        if (!w) return;
        const words = el.textContent.split(/[ \n\t]+/).filter(Boolean);
        const probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap';
        el.appendChild(probe);
        const widest = Math.max(...words.map(word => { probe.textContent = word; return probe.getBoundingClientRect().width; }));
        probe.remove();
        if (widest > w) k = Math.min(k, w / widest);
      });
      if (k < 1) els.forEach((el, j) => { el.style.fontSize = `${Math.floor(base[j] * k * .98)}px`; });
    });
  }
  const reveal = (() => {
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(list => list.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
    }), { rootMargin: '0px 0px -8% 0px' }) : null;
    let arme = false;
    const cacher = () => {
      if (!io || !bouge()) return;
      const vh = innerHeight;
      $$('.rv:not(.is-wait)').forEach(el => { if (el.getBoundingClientRect().top > vh) { el.classList.add('is-wait'); io.observe(el); } });
    };
    addEventListener('scroll', () => { if (!arme) { arme = true; cacher(); } }, { passive: true });
    return { reset() { if (io) io.disconnect(); if (arme) cacher(); } };
  })();

  /* ---------- le menu et les adresses ---------- */
  const menuBtn = $('#menu-btn'), nav = $('#nav');
  const setMenu = open => { menuBtn.setAttribute('aria-expanded', String(open)); nav.classList.toggle('is-open', open); };
  function resoudre(p) {
    if (p === 'spectacles') return { cle: p, nav: 'spectacles', titre: MENU.spectacles.texte, rendu: pageSpectacles };
    if (p === 'agenda' || p === `agenda/${D.saison}`) return { cle: 'agenda', nav: 'agenda', titre: MENU.agenda.texte, rendu: pageAgenda, init: initAgenda };
    let m = p.match(/^agenda\/(\d{4}-\d{4})$/);
    if (m && D.saisons[m[1]]) {
      const meta = S.saisons.find(x => x.saison === m[1]), t = meta ? meta.titre : D.saisons[m[1]].titre;
      return { cle: p, nav: 'agenda', titre: t, rendu: () => pageSaison(m[1], t), init: () => initListe(lignesSaison) };
    }
    if (p === 'compagnie') return { cle: p, nav: 'compagnie', titre: MENU.compagnie.texte, rendu: pageCie };
    if (p === 'actions-culturelles') return { cle: p, nav: 'actions', titre: MENU.actions.texte, rendu: pageActions };
    if (p === 'espace-pro') return { cle: p, nav: 'pro', titre: S.pro.titrePage, rendu: pagePro, init: initForms };
    if (p === 'contact') return { cle: p, nav: 'contact', titre: MENU.contact.texte, rendu: pageContact, init: initForms };
    if (Object.hasOwn(S.legal, p)) return { cle: p, nav: null, titre: S.legal[p].titre, rendu: () => pageLegal(p) };
    m = p.match(/^spectacle\/([\w-]+)$/);
    if (m && BY[m[1]]) { const s = BY[m[1]]; return { cle: p, nav: 'spectacles', titre: s.titre, rendu: () => pageShow(s), init: initShow }; }
    return { cle: 'accueil', nav: null, titre: S.accueil, rendu: pageAccueil, init: initAccueil };
  }
  let vueCle = null;
  function route() {
    const h = location.hash;
    if (h && !h.startsWith('#/') && vueCle) return;
    const v = resoudre(h.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, ''));
    if (v.cle !== vueCle) {
      vueCle = v.cle;
      main.innerHTML = v.rendu();
      document.title = `${v.titre} - ${S.titreSuffixe}`;
      $$('a', nav).forEach(a => { if (a.dataset.nav === v.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      fit();
      if (v.init) v.init();
      reveal.reset();
    }
    window.scrollTo(0, 0);
    setMenu(false);
    if (!INTRO.ouverte()) { const t = $('h1', main); if (t) t.focus({ preventScroll: true }); }
  }

  $('#brand').setAttribute('aria-label', `${S.nom}, ${S.accueil}`);
  $('#brand-mark').innerHTML = D.logo.octopus;
  $('ul', nav).innerHTML = S.menu.map(m => `<li><a href="${esc(m.href)}" data-nav="${esc(m.id)}">${esc(m.texte)}</a></li>`).join('');
  nav.setAttribute('aria-label', L.menu);
  $('.menu-label', menuBtn).textContent = L.menu;
  $('#pied').innerHTML = pied();
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  $('.skip').addEventListener('click', e => { e.preventDefault(); main.focus(); });
  menuBtn.addEventListener('click', () => setMenu(menuBtn.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && nav.classList.contains('is-open')) { setMenu(false); menuBtn.focus(); } });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    if (a.closest('#nav')) setMenu(false);
    if (a.getAttribute('href') === (location.hash || '#/')) { e.preventDefault(); route(); }
  });
  let raf = 0;
  const reajuster = () => { fit(); $$('.aff', main).forEach(placer); };
  addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(reajuster); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reajuster);
  // l'ouverture : la pieuvre et le mot en blanc sur l'aplat magenta ; après la révélation, le bandeau se met en marche
  INTRO.ouvrir({ fond: '#bc3e80', encre: '#ffffff', classe: 'm05-intro', apres: () => { if (bdCtl) bdCtl.demarrer(); } });
  addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
