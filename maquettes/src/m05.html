    const S = D.site, L = S.libelles, K = S.coordonnees;
    const sig = JSON.stringify([K, S.ecrire, S.facebook, S.partenaires, S.liensLegaux, L.modifierSite, L.ecrire, S.nom, S.accueil]);
    if (sig === sigPied) return;
    sigPied = sig;
    const fb = S.facebook.href ? `<a class="pied-fb" href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : `<span class="pied-fb">${esc(S.facebook.texte)}</span>`;
    $('#pied').innerHTML = `<div class="wrap">
      <div class="pied-grille">
        <a class="pied-logo" href="#/" aria-label="${esc(S.nom)}, ${esc(S.accueil)}"><span aria-hidden="true">${D.logo.octopusWord}</span></a>
        <div><p class="pied-nom"${ed('site.coordonnees.nom')}>${esc(K.nom)}</p><p>${K.adresse.map((x, i) => `<span${ed(`site.coordonnees.adresse.${i}`)}>${esc(x)}</span>`).join('<br>')}</p>
          <p class="pied-actions"><a class="btn" href="${esc(S.ecrire.href)}">${esc(S.ecrire.texte)}${use('i-go')}</a>${fb}</p></div>
        <p class="pied-part"${ed('site.partenaires')}>${S.partenaires}</p>
      </div>
      ${sep()}
      <div class="pied-bas"><p class="pied-legal">${K.legal.map((x, i) => `<span${ed(`site.coordonnees.legal.${i}`)}>${esc(x)}</span>`).join('')}</p><p class="pied-ll">${(S.liensLegaux || []).map(a => `<a href="${esc(a.href)}">${esc(a.texte)}</a>`).join('')}${L.modifierSite && typeof EDITION !== 'undefined' ? `<button type="button" class="pied-edit" id="pied-edit">${use('i-crayon')}${esc(L.modifierSite)}</button>` : ''}</p></div>
    </div>`;
    const b = $('#pied-edit');
    if (b) b.addEventListener('click', () => EDITION.ouvrir());
  }
  // l'univers d'un spectacle habille toute la page (en-tête, pied) ; ailleurs, la marque : magenta et pieuvre blanche
  const VARS_U = Object.keys(varsU(jeton({})));
  let habit = null;
  function habiller(s) {
    const r = document.documentElement, t = s ? jeton(s) : null, cle = t ? JSON.stringify(t) : '';
    if (cle === habit) return;
    habit = cle;
    VARS_U.forEach(k => r.style.removeProperty(k));
    r.classList.toggle('en-univers', !!t);
    if (t) Object.entries(varsU(t)).forEach(([k, v]) => r.style.setProperty(k, v));
    $('#brand-mark').innerHTML = t ? D.logo.mark : D.logo.octopus;
    const m = $('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t ? t.fond : '#bc3e80');
  }
  // l'entrée courante (aria-current="page"), l'entrée dans laquelle on lit (aria-current="true"), le menu second
  function marquer(v) {
    $$('#entrees a').forEach(a => {
      const c = a.dataset.cle;
      if (c === v.entree) a.setAttribute('aria-current', 'page');
      else if (c === v.lecture) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
    $$('#second a').forEach(a => { if (a.dataset.menu === v.menu) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  // les polices de titre des univers : un seul <link>, complété si la base apporte une police nouvelle
  function polices() {
    const l = $('#polices');
    if (!l) return;
    const voulu = new Map();
    (D.shows || []).forEach(s => { const p = (s.univers || {}).polices || {}; if (p.titre) voulu.set(p.titre, +p.titreGraisse || 400); });
    const href = l.getAttribute('href') || '';
    if ([...voulu.keys()].every(f => href.includes('family=' + f.replace(/ /g, '+')))) return;
    const fam = ['Archivo:wdth,wght@62..125,100..900', ...[...voulu].map(([f, g]) => f.replace(/ /g, '+') + (g && g !== 400 ? `:wght@${g}` : ''))];
    l.setAttribute('href', `https://fonts.googleapis.com/css2?${fam.map(f => 'family=' + f).join('&')}&display=swap`);
  }

  /* ---------- l'ajustement des grands titres, l'apparition au défilement ---------- */
  function fit() {
    const groups = {};
    $$('[data-fit]').forEach(el => { el.style.fontSize = ''; (groups[el.dataset.fit] ||= []).push(el); });
    Object.values(groups).forEach(els => {
      const base = els.map(el => parseFloat(getComputedStyle(el).fontSize));
      let k = 1;
      els.forEach(el => {
        const w = el.clientWidth;
        if (!w) return;
        const words = el.textContent.split(/[ \n\t]+/).filter(Boolean);
        const probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap';
        el.appendChild(probe);
        const widest = Math.max(...words.map(word => { probe.textContent = word; return probe.getBoundingClientRect().width; }));
        probe.remove();
        if (widest > w) k = Math.min(k, w / widest);
      });
      if (k < 1) els.forEach((el, j) => { el.style.fontSize = `${Math.floor(base[j] * k * .98)}px`; });
    });
  }
  const reveal = (() => {
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(list => list.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
    }), { rootMargin: '0px 0px -8% 0px' }) : null;
    let arme = false;
    const cacher = () => {
      if (!io || !bouge()) return;
      const vh = innerHeight;
      $$('.rv:not(.is-wait)').forEach(el => { if (el.getBoundingClientRect().top > vh) { el.classList.add('is-wait'); io.observe(el); } });
    };
    addEventListener('scroll', () => { if (!arme) { arme = true; cacher(); } }, { passive: true });
    return { reset(enPlace) { if (io) io.disconnect(); if (arme && !enPlace) cacher(); } };
  })();

  /* ---------- les adresses ---------- */
  const tete = $('#tete-haut'), menuBtn = $('#menu-btn');
  const setMenu = open => { menuBtn.setAttribute('aria-expanded', String(open)); tete.classList.toggle('is-open', open); };
  function resoudre(chemin) {
    const S = D.site;
    if (chemin === '') return { cle: 'accueil', titre: S.accueil, rendu: pageAccueil, init: initAccueil };
    if (CLES.includes(chemin)) {
      const e = entree(chemin);
      if (!e) return null;
      const r = { voir: [pageVoir, initVoir], programmer: [pageProgrammer, initCartes], etablissement: [pageEtablissement, initCartes] }[chemin];
      return { cle: chemin, entree: chemin, memo: chemin, titre: e.texte, rendu: r[0], init: r[1] };
    }
    const mi = menuDe(chemin);
    if (mi) {
      const r = { spectacles: [pageSpectacles], compagnie: [pageCie], contact: [pageContact, initForms] }[chemin];
      if (r) return { cle: chemin, menu: chemin, titre: mi.texte, rendu: r[0], init: r[1] };
    }
    if (S.legal && Object.hasOwn(S.legal, chemin)) return { cle: chemin, titre: S.legal[chemin].titre, rendu: () => pageLegal(chemin) };
    let m = chemin.match(/^agenda\/(\d{4}-\d{4})$/);
    if (m && D.saisons[m[1]]) {
      const meta = (S.saisons || []).find(x => x.saison === m[1]), titre = meta ? meta.titre : D.saisons[m[1]].titre;
      return { cle: chemin, lecture: 'voir', titre, rendu: () => pageSaison(m[1], titre), init: initSaison };
    }
    m = chemin.match(/^spectacle\/([\w-]+)\/(voir|programmer|etablissement)$/);
    if (m && spectacle(m[1])) {
      const s = spectacle(m[1]), e = entree(m[2]);
      return { cle: chemin, lecture: m[2], memo: m[2], show: m[1], titre: m[2] === 'voir' ? s.titre : `${s.titre} - ${e ? e.court : m[2]}`, rendu: () => pageShow(m[1], m[2]), init: initShow };
    }
    return null;
  }
  // une vue redessinée en place garde la position, le focus, les lieux de diffusion dépliés
  function sauver() {
    const a = document.activeElement;
    let f = null;
    if (a && a !== document.body && main.contains(a) && a !== main) {
      if (a.id) f = { id: a.id };
      else if (a.matches('a[href]')) { const h = a.getAttribute('href'); f = { href: h, i: $$('a[href]', main).filter(x => x.getAttribute('href') === h).indexOf(a) }; }
      else if (a.matches('.aff-lieu[data-l]')) f = { l: a.dataset.l };
      if (f && a.selectionStart != null) { f.s = a.selectionStart; f.e = a.selectionEnd; }
    }
    return { y: scrollY, f, ouverts: $$('details[data-k]', main).filter(d => d.open).map(d => d.dataset.k) };
  }
  function restaurer(g) {
    g.ouverts.forEach(k => { const d = $$('details[data-k]', main).find(x => x.dataset.k === k); if (d) d.open = true; });
    window.scrollTo(0, g.y);
    if (!g.f) return;
    let el = null;
    if (g.f.id) el = document.getElementById(g.f.id);
    else if (g.f.href) el = $$('a[href]', main).filter(x => x.getAttribute('href') === g.f.href)[g.f.i];
    else if (g.f.l) el = $$('.aff-lieu[data-l]', main).find(x => x.dataset.l === g.f.l);
    if (el) { el.focus({ preventScroll: true }); if (g.f.s != null && el.setSelectionRange) try { el.setSelectionRange(g.f.s, g.f.e); } catch (e) { /* champ sans sélection */ } }
  }
  let vueCle = null;
  function route(enPlace = false) {
    const h = location.hash;
    if (h && h !== '#' && !h.startsWith('#/') && vueCle) return;
    let chemin = '';
    try { chemin = decodeURIComponent(h.replace(/^#\/?/, '').split('?')[0]).replace(/\/+$/, ''); } catch (e) { chemin = '?'; }
    const red = (D.site.redirections || {})['#/' + chemin];
    if (red && red !== h) { location.replace(red); return; }
    let m = chemin.match(/^spectacle\/([\w-]+)$/);
    if (m && spectacle(m[1])) { location.replace(lienSp(m[1], retenue() || 'voir')); return; }
    m = chemin.match(/^agenda\/(\d{4}-\d{4})$/);
    if (m && m[1] === saisonCourante()) { location.replace((entree('voir') || {}).href || '#/voir'); return; }
    const v = resoudre(chemin);
    if (!v) { location.replace('#/'); return; }
    if (!enPlace && v.cle === vueCle) { window.scrollTo(0, 0); setMenu(false); const t = $('h1', main); if (t && !INTRO.ouverte()) t.focus({ preventScroll: true }); return; }
    const garde = enPlace ? sauver() : null;
    ANIM = !garde;
    vueCle = v.cle;
    if (v.memo) retenir(v.memo);
    construireTete(); construirePied(); polices();
    habiller(v.show ? spectacle(v.show) : null);
    marquer(v);
    Object.keys(REG).forEach(k => { if (!document.getElementById(k)) delete REG[k]; });
    main.innerHTML = v.rendu();
    document.title = `${v.titre} - ${D.site.titreSuffixe}`;
    fit();
    if (v.init) v.init();
    reveal.reset(!!garde);
    if (garde) restaurer(garde);
    else { window.scrollTo(0, 0); setMenu(false); if (!INTRO.ouverte()) { const t = $('h1', main); if (t) t.focus({ preventScroll: true }); } }
    ANIM = true;
  }

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  $('.skip').addEventListener('click', e => { e.preventDefault(); main.focus(); });
  menuBtn.addEventListener('click', () => setMenu(menuBtn.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && tete.classList.contains('is-open')) { setMenu(false); menuBtn.focus(); } });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    if (a.closest('#tete-haut')) setMenu(false);
    if (a.getAttribute('href') === (location.hash || '#/')) { e.preventDefault(); route(); }
  });
  let raf = 0;
  const reajuster = () => { fit(); $$('.aff', main).forEach(placer); };
  addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(reajuster); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reajuster);
  // l'ouverture : la pieuvre et le mot en blanc sur l'aplat magenta ; après la révélation, le bandeau se met en marche
  INTRO.ouvrir({ fond: '#bc3e80', encre: '#ffffff', classe: 'm05-intro', apres: () => { if (bdCtl) bdCtl.demarrer(); } });
  addEventListener('hashchange', () => route());
  route();
  // la base de la compagnie : chaque enregistrement redessine la vue en place
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(() => route(true));
})();
</script>
