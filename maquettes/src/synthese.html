          <div class="boite dos-prod">${(B.production || []).map(l => `<p>${esc(l)}</p>`).join('')}${B.partenaires ? `<p>${esc(B.partenaires)}</p>` : ''}</div>
        </div>
        ${B.pourquoi ? `<section class="dos-s" aria-labelledby="dos-pq"><h3 class="dos-h3" id="dos-pq">${esc(B.pourquoi.titre)}</h3><div class="boite">${B.pourquoi.sections.map(x => `<h4 class="dos-h4">${esc(x.titre)}</h4><p>${x.texte}</p>`).join('')}</div></section>` : ''}
        ${B.programmes ? `<section class="dos-s" aria-labelledby="dos-pg"><h3 class="dos-h3" id="dos-pg">${esc(B.programmes.titre)}</h3><div class="table-wrap"><table class="dos-table" aria-labelledby="dos-pg">
          ${B.programmes.niveaux.map(n => `<tbody>${n.lignes.map((l, i) => `<tr>${i ? '' : `<th scope="rowgroup" rowspan="${n.lignes.length}">${esc(n.niveau)}</th>`}<th scope="row">${esc(l.matiere)}</th><td>${esc(l.intitule)}</td><td>${esc(l.objectif)}</td></tr>`).join('')}</tbody>`).join('')}
          </table></div></section>` : ''}
        ${pres.length ? `<section class="dos-s dos-pres">${pres.map(x => `<div class="boite"><h3 class="dos-h4">${esc(x.titre)}</h3>${x.chapeau ? `<p class="dos-chapeau">${esc(x.chapeau)}</p>` : ''}${paras(x.paragraphes)}${x === B.espace && musique ? fig(s, musique) : ''}</div>`).join('')}</section>` : ''}
        ${musique ? `<p class="u-credit">${esc(s.creditDossier || '')}</p>` : ''}
      </div>`, false);
    const C = B.consignes, At = B.ateliers;
    if (C || At) h += chapitre(chap, 'ateliers', L.ateliers, `<div class="wrap">
        <h2 class="u-eti">${petit(mo(s))}${esc(At ? At.titre : L.ateliers)}</h2>
        ${C ? `<section class="dos-s" style="margin-top:0" aria-labelledby="dos-cs"><h3 class="dos-h3" id="dos-cs">${esc(C.titre)}</h3><div class="boite">
          <p class="dos-note">${esc(C.note)}</p><p>${C.intro}</p>
          <ul class="dos-demandes">${(C.demandes || []).map(d => `<li>${esc(d)}</li>`).join('')}</ul>
          <p>${C.apres}</p><ul class="dos-axes">${(C.axes || []).map(a => `<li>${a}</li>`).join('')}</ul><p>${C.atelier}</p></div></section>` : ''}
        ${At ? `<div class="dos-ateliers">${At.liste.map((a, i) => `<article class="atelier"><span class="atelier-n" aria-hidden="true">${i + 1}</span><h3 class="dos-h4">${a.titre}</h3>${paras(a.paragraphes)}
            ${(a.etapes || []).map(e => `<div class="etape"><h4>${e.titre}</h4><p>${esc(e.texte)}</p></div>`).join('')}
            ${a.points ? `<ul>${a.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}</article>${ateliersPh[i] ? fig(s, ateliersPh[i], 'atelier-ph') : ''}`).join('')}</div>` : ''}
        ${ateliersPh.length && s.creditDossier ? `<p class="u-credit" style="margin-top:18px">${esc(s.creditDossier)}</p>` : ''}
      </div>`, false);
    if (B.accueil) h += conditions(s, chap, 'conditions', L.conditionsAccueil);
    return h;
  }
  // les conditions d'accueil, la fiche technique du dossier et la photo de l'implantation
  function conditions(s, chap, id, nom) {
    const AC = D.dossiers[s.dossier].accueil, imp = (s.photos || []).find(p => p.id === 'd-implantation-1');
    return chapitre(chap, id, nom, `<div class="wrap">
        <h2 class="u-eti">${petit(mo(s))}${esc(AC.titre)}</h2>
        <div class="dos-accueil">
          <div class="boite"><p class="dos-fiche-t">${esc(AC.fiche)}</p>${AC.blocs.map(b => `${b.titre ? `<h3 class="dos-h4">${esc(b.titre)}</h3>` : ''}<ul>${b.lignes.map(l => `<li>${l}</li>`).join('')}</ul>`).join('')}</div>
          <div>${AC.alerte ? `<p class="dos-alerte">${ALERTE}<span>${AC.alerte}</span></p>` : ''}${fig(s, imp)}${imp && s.creditDossier ? `<p class="u-credit" style="margin-top:10px">${esc(s.creditDossier)}</p>` : ''}</div>
        </div>
      </div>`, false);
  }

  let secs = [], chaps = [], chapK = -1, sraf = 0;
  function spectacle(slug, entree, surPlace) {
    vue = 'spectacle';
    const s = bySlug[slug], i = D.shows.indexOf(s), nx = D.shows[(i + 1) % D.shows.length];
    const pub = D.dates.filter(d => d.slug === slug && !d.scolaire);
    retenir(entree);
    nAlt = 0;
    const chap = [{ id: 'ouverture', nom: L.ouverture }];
    const corps = entree === 'voir' ? ongletVoir(s, chap, pub) : entree === 'programmer' ? ongletProgrammer(s, chap) : ongletEtablissement(s, chap);
    main.innerHTML = `<article class="${uClasse(s)}" style="${uVars(s)}">
      ${ouverture(s, entree, pub)}
      ${onglets(s, entree)}
      ${corps}
      <a class="suivant ${uClasse(nx)}" style="${uVars(nx)}" href="#/spectacle/${nx.slug}/${entree}"><span class="wrap"><span class="suivant-c"><span class="u-sur">${petit(mo(nx))}<span>${esc(nx.creation)}</span></span><b>${esc(nx.titre)}</b></span>${FLECHE}</span></a>
      ${sommaire(s, entree, chap)}
    </article>`;
    // les cartes : reliées à la liste des dates, elles poussent quand elles arrivent à l'écran
    $$('.carte-sp', main).forEach(f => { const svg = $('svg', f), ul = $('.dates-sp', f.parentElement);
      if (ul) relier(svg, ul); else CARTE.lier(svg, { survol: l => marquer(svg, l) });
      if (surPlace) pousser(svg); else pousserVu(svg); });
    secs = $$('[data-scrolly]', main);
    chaps = $$('#c-ouverture, .chap', main); chapK = -1;
    return { titre: entree === 'voir' ? s.titre : `${s.titre} - ${E[entree].court}`, lecture: entree };
  }
  function majSommaire(k) {
    const som = $('.som', main); if (!som || !chaps[k]) return;
    $('#som-n', som).textContent = `${k + 1}/${chaps.length}`;
    $('#som-nom', som).textContent = chaps[k].dataset.chap;
    $$('.som-l button', som).forEach((b, i) => { if (i === k) b.setAttribute('aria-current', 'location'); else b.removeAttribute('aria-current'); });
  }
  // le moteur du défilement : une variable --p (0 → 1) par bande épinglée, le chapitre lu, la progression
  function defile() {
    sraf = 0;
    const vh = innerHeight;
    for (const sec of secs) {
      if (!sec.isConnected) continue;
      const r = sec.getBoundingClientRect(), span = r.height - vh;
      const p = !motionOK() ? 1 : span > 40 ? clamp((-r.top + 64) / span, 0, 1) : 1;
      sec.style.setProperty('--p', p.toFixed(4));
      const fx = FX[sec.dataset.fx]; if (fx) fx(sec, p);
    }
    if (chaps.length && chaps[0].isConnected) {
      let k = 0; const y = vh * .4;
      chaps.forEach((c, i) => { if (c.getBoundingClientRect().top <= y) k = i; });
      if (k !== chapK) { chapK = k; majSommaire(k); }
      const art = $('article.u', main), ouv = $('.u-ouv', main), ong = $('.u-onglets', main);
      if (art) { const r = art.getBoundingClientRect(); art.style.setProperty('--lu', clamp(-r.top / Math.max(1, r.height - vh), 0, 1).toFixed(3)); }
      if (ong && ouv) ong.classList.toggle('colle', ouv.getBoundingClientRect().bottom < 140);
    }
  }
  addEventListener('scroll', () => { if ((secs.length || chaps.length) && !sraf) sraf = requestAnimationFrame(defile); }, { passive: true });
  addEventListener('resize', () => { requestAnimationFrame(() => { echelle(); ajuste(); if (secs.length || chaps.length) defile(); }); });

  // les phrases s'écrivent et les photos apparaissent quand elles arrivent à l'écran
  let io = null;
  function ecrire(surPlace) {
    if (io) { io.disconnect(); io = null; }
    const els = $$('.ecrit, .apparait', main);
    if (surPlace || !motionOK() || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('vu')); return; }
    io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('vu'); io.unobserve(x.target); } }), { rootMargin: '0px 0px -10% 0px' });
    els.forEach(e => io.observe(e));
  }
  // les clics : raccourcis vers une section, sommaire des chapitres
  const vers = id => { const t = document.getElementById(id); if (t) t.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' }); };
  const fermerSommaire = () => { const l = $('#som-l'), b = $('.som-b'); if (l) l.hidden = true; if (b) b.setAttribute('aria-expanded', 'false'); };
  main.addEventListener('click', e => {
    const va = e.target.closest('[data-va]'); if (va) { vers(va.dataset.va); return; }
    const sb = e.target.closest('.som-b'); if (sb) { const l = $('#som-l'), o = l.hidden; l.hidden = !o; sb.setAttribute('aria-expanded', String(o)); return; }
    const c = e.target.closest('[data-c]'); if (c) { fermerSommaire(); vers('c-' + c.dataset.c); }
  });
  // la lueur de l'accent suit la main dans l'ouverture
  let lraf = 0;
  main.addEventListener('pointermove', e => {
    const ouv = e.target.closest && e.target.closest('.u-ouv'); if (!ouv || !motionOK() || lraf) return;
    lraf = requestAnimationFrame(() => { lraf = 0; const r = ouv.getBoundingClientRect(); ouv.style.setProperty('--gx', `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`); ouv.style.setProperty('--gy', `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%`); });
  });

  /* ---------- l'ouverture : derrière la pieuvre, à peine, la carte des tournées qui part de Rouen ---------- */
  function fondIntro() {
    const W = 1120, H = 700, R = CARTE.rouen;
    const traits = tous().map(x => `<path d="${CARTE.trait(x.xy)}"/>`).join('');
    const bras = CARTE.aVenir().map(x => CARTE.bras(x.xy, { w0: 5, w1: .8 })).filter(Boolean).map(d => `<path d="${d}"/>`).join('');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${(R[0] - W / 2).toFixed(1)} ${(R[1] - H / 2).toFixed(1)} ${W} ${H}"><path d="${CARTE.fond.pays}" fill="#1d1418" fill-opacity=".03" stroke="#1d1418" stroke-opacity=".1" stroke-width="1.2"/><g fill="none" stroke="#1d1418" stroke-opacity=".09" stroke-width="1.3" stroke-linecap="round">${traits}</g><g fill="#bc3e80" fill-opacity=".18">${bras}</g></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* ---------- l'en-tête et le pied de page, refaits seulement quand D change ---------- */
  let cadreFait = '';
  function cadre() {
    const lien = (e, long) => `<a href="${e.href}" data-e="${e.cle}" style="--ec:${e.couleur};--ev:${e.couleurVive}"><span class="pt" aria-hidden="true"></span>${long ? `<span class="long">${esc(e.texte)}</span><span class="court">${esc(e.court)}</span>` : `<span>${esc(e.court)}</span>`}</a>`;
    const co = S.coordonnees;
    const parts = {
      entrees: S.entrees.map(e => lien(e, true)).join(''),
      barre: S.entrees.map(e => lien(e, false)).join(''),
      second: S.menu.map(x => `<a href="${x.href}" data-id="${x.id}">${esc(x.texte)}</a>`).join(''),
      pied: `<div><p><strong>${esc(co.nom)}</strong></p><p>${co.adresse.map(esc).join('<br>')}</p>
        <p class="liens"><a href="${S.ecrire.href}">${esc(S.ecrire.texte)}</a>${S.facebook ? (S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : `<span>${esc(S.facebook.texte)}</span>`) : ''}</p></div>
        <div><p>${S.partenaires}</p></div>
        <div><p class="petit">${co.legal.map(esc).join('<br>')}</p><p class="liens">${S.liensLegaux.map(x => `<a href="${x.href}">${esc(x.texte)}</a>`).join('')}</p></div>`,
    };
    const tout = JSON.stringify(parts) + S.titreSuffixe + L.menu;
    if (tout === cadreFait) return;
    cadreFait = tout;
    $('#marque').innerHTML = D.logo.mark;
    $('#nom').textContent = S.titreSuffixe;
    $('.marque').setAttribute('aria-label', S.titreSuffixe);
    $('#menu-t').textContent = L.menu;
    $('#second').setAttribute('aria-label', L.menu);
    $('#entrees').innerHTML = parts.entrees;
    $('#barre').innerHTML = parts.barre;
    $('#second').innerHTML = parts.second;
    $('#pied').innerHTML = parts.pied;
    ajuste();
  }
  // le texte entier des entrées si la place le permet, sinon le court ; puis le menu second replié
  function ajuste() {
    const top = $('#top'), inn = $('.top-in', top);
    top.classList.remove('serre', 'replie', 'compact');
    if (matchMedia('(max-width: 759px)').matches) return;
    for (const c of ['serre', 'replie', 'compact']) { if (inn.scrollWidth <= inn.clientWidth + 1) break; top.classList.add(c); }
  }
  function marquerNav(r) {
    $$('#entrees a, #barre a').forEach(a => { a.removeAttribute('aria-current');
      if (r.entree && a.dataset.e === r.entree) a.setAttribute('aria-current', 'page'); else if (r.lecture && a.dataset.e === r.lecture) a.setAttribute('aria-current', 'true'); });
    $$('#second a').forEach(a => { if (r.menu && a.dataset.id === r.menu) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }

  /* ---------- la navigation : les adresses, les redirections, la mémoire de l'entrée ---------- */
  let courant = null;
  function analyse() {
    const h = location.hash;
    if (h && !h.startsWith('#/')) return null;   // « #main » : le lien d'évitement
    const [chemin, qs] = h.replace(/^#\/?/, '').split('?');
    return { chemin: (chemin || '').replace(/\/+$/, ''), qs: qs || '', q: new URLSearchParams(qs || '') };
  }
  function rendre(a, surPlace) {
    const { chemin, q } = a; let m;
    secs = []; chaps = []; surPlaceRendu = !!surPlace;
    try {
      if ((m = chemin.match(/^spectacle\/([\w-]+)\/(voir|programmer|etablissement)$/)) && bySlug[m[1]]) return spectacle(m[1], m[2], surPlace);
      if ((m = chemin.match(/^agenda\/([\d-]+)$/)) && D.saisons[m[1]] && m[1] !== D.saison) return saison(m[1]);
      if (S.legal && S.legal[chemin]) return legal(chemin);
      const V = { '': accueil, voir, programmer, etablissement, spectacles, compagnie, contact };
      if (Object.prototype.hasOwnProperty.call(V, chemin)) return V[chemin](q, surPlace);
      return null;
    } finally { surPlaceRendu = false; }
  }
  function apres(surPlace) {
    ecrire(surPlace);
    requestAnimationFrame(() => { echelle(); defile(); });
  }
  function route() {
    lire();
    const a = analyse(); if (!a) return;
    let m;
    const cible = S.redirections && S.redirections['#/' + a.chemin];
    if (cible) { location.replace(cible + (a.qs ? '?' + a.qs : '')); return; }
    if ((m = a.chemin.match(/^spectacle\/([\w-]+)$/)) && bySlug[m[1]]) { location.replace(`#/spectacle/${m[1]}/${retenue() || 'voir'}`); return; }
    if ((m = a.chemin.match(/^agenda\/([\d-]+)$/)) && m[1] === D.saison) { location.replace(E.voir.href); return; }
    document.documentElement.classList.remove(vers0);
    cadre(); fermerMenu();
    let r = rendre(a, false), b = a;
    if (!r) { history.replaceState(null, '', '#/'); b = { chemin: '', qs: '', q: new URLSearchParams() }; r = rendre(b, false); }   // une adresse inconnue mène à l'accueil
    courant = b;
    document.title = `${r.titre} - ${S.titreSuffixe}`;
    marquerNav(r);
    scrollTo({ top: 0, left: 0, behavior: 'instant' });
    ($('h1[tabindex="-1"]', main) || main).focus({ preventScroll: true });
    apres(false);
  }
  // D a changé (la base de la compagnie) : la vue courante se refait en place, sans remonter, sans voler le focus,
  // sans rejouer l'ouverture ni les animations d'entrée
  function refaire() {
    if (!courant) return;
    lire();
    const y = scrollY, act = document.activeElement;
    const focusables = () => $$('a[href], button, input, textarea, select, summary, [tabindex]', main);
    const dans = act && act !== main && main.contains(act);
    const repere = dans ? (act.id ? { id: act.id } : { i: focusables().indexOf(act) }) : null;
    const sel = dans && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const ouverts = $$('details[open]', main).map(d => $$('details', main).indexOf(d));
    document.documentElement.classList.add(vers0);
    cadre();
    const r = rendre(courant, true);
    if (!r) { route(); return; }
    document.title = `${r.titre} - ${S.titreSuffixe}`;
    marquerNav(r);
    ouverts.forEach(i => { const d = $$('details', main)[i]; if (d) d.open = true; });
    scrollTo({ top: y, left: 0, behavior: 'instant' });
    if (repere) { const el = repere.id ? document.getElementById(repere.id) : focusables()[repere.i];
      if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* champ sans sélection */ } } } }
    apres(true);
  }

  const fermerMenu = () => { $('#top').classList.remove('ouvert'); $('.menu').setAttribute('aria-expanded', 'false'); };
  $('.menu').addEventListener('click', e => { const o = $('#top').classList.toggle('ouvert'); e.currentTarget.setAttribute('aria-expanded', String(o)); });
  $('#second').addEventListener('click', e => { if (e.target.closest('a')) fermerMenu(); });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#top').classList.contains('ouvert')) { fermerMenu(); $('.menu').focus(); }
    const l = $('#som-l'); if (l && !l.hidden) { fermerSommaire(); $('.som-b').focus(); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('#top')) fermerMenu(); if (!e.target.closest('.som')) fermerSommaire(); });
  $('.evitement').addEventListener('click', e => { e.preventDefault(); main.focus(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ajuste(); echelle(); });

  lire();
  cadre();
  document.body.insertAdjacentHTML('beforeend', `<svg class="defs" aria-hidden="true" focusable="false"><defs><path id="fr" d="${CARTE.fond.pays}"/></defs></svg>`);
  addEventListener('hashchange', route);
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(refaire);
  INTRO.ouvrir({
    degrade: [[0, '#fbf8f3'], [.62, '#f3ece2'], [1, '#e2d7c6']], encre: '#bc3e80', image: fondIntro(), classe: 'intro-synthese',
    apres: () => { if (vue === 'accueil') pousser($('.une-carte svg')); },   // révélé : les bras poussent depuis Rouen
  });
  route();
})();
</script>
</body>
