.u-annonce { margin: 0 0 18px; font-size: 1.35rem; line-height: 1.45; color: var(--u-texte2); }
.u-lieux { margin: 0 0 18px; max-width: 62ch; font-size: 1rem; line-height: 1.65; }
.u-rep { margin: 0 0 18px; font-size: 1.05rem; }
.u .carte .pays { fill: color-mix(in srgb, var(--u-texte) 10%, transparent); }

.u .carte .point { stroke: var(--u-fond); }

.u-prog { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
.u-faits { position: sticky; top: calc(var(--haut) + var(--onglets) + 20px); display: grid; gap: 14px; margin: 0; padding: 26px; list-style: none; border-top: 3px solid var(--u-vif); border-radius: 6px; background: var(--u-fond2); }

.chap.alt .u-formule { background: var(--u-fond); }
.u-formule p { margin: 0; }
.u-disp ul { margin: 0; padding-left: 1.1em; max-width: 70ch; }
.u-disp li { margin: 0 0 8px; }
.u-distrib .u-avec { margin: 0 0 30px; max-width: 32ch; font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: clamp(1.45rem, 1.1rem + 1.3vw, 2.2rem); line-height: 1.22; }
.u-distrib .u-avec .k { display: block; margin-bottom: 6px; font: 600 .74rem/1.3 var(--u-etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--u-vif); }
/* la distribution en portraits (D.personnes, show.equipe) : la photo en carton, ou le monogramme de l'univers ; ceux qui alternent vont par deux */
.u-cast { --g: clamp(16px, 2vw, 28px); --pw: 160px; --pmax: 252px; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--pw), calc((100% - var(--g)) / 2)), 1fr)); gap: clamp(26px, 3.4vw, 44px) var(--g); max-width: calc(var(--n, 4) * var(--pmax) + (var(--n, 4) - 1) * var(--g)); margin: 0 0 clamp(36px, 4.4vw, 60px); padding: 0; }
.u-cast > li { min-width: 0; padding-top: 14px; }
.u-cast > .u-paire { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: var(--g); border-top: 2px solid var(--u-vif); }
.u-pt { margin: 0; min-width: 0; }
.u-pt-cadre { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; container-type: inline-size; border-radius: 3px; background: color-mix(in srgb, var(--u-texte) 7%, var(--u-fond2)); box-shadow: 0 26px 44px -28px rgba(0, 0, 0, .65), 0 0 0 1px var(--u-filet); }
.chap:not(.alt) .u-pt-cadre { background: color-mix(in srgb, var(--u-texte) 7%, var(--u-fond)); }
.u-pt-cadre img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.u-pt-mono { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(closest-side at 50% 44%, var(--u-lueur), transparent 92%); }
.u-pt-mono b { display: grid; place-items: center; width: 56%; aspect-ratio: 1; border: 1.5px solid var(--u-vif); border-radius: 50%; font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: 2.2rem; font-size: 21cqw; line-height: 1; text-transform: uppercase; letter-spacing: .02em; color: var(--u-vif); }
.u-pt figcaption { display: block; }
.u-pt-cr { display: block; min-height: 1.7em; padding-top: 5px; font: 500 .7rem/1.3 var(--u-etiq); letter-spacing: .03em; color: var(--u-texte2); }
.u-pt-nom { display: block; margin-top: 6px; font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: clamp(1.15rem, 1rem + .55vw, 1.42rem); line-height: 1.12; color: var(--u-texte); text-wrap: balance; }
.u-pt-alt, .u-pt-role { display: block; margin-top: 4px; font-size: .9rem; line-height: 1.35; color: var(--u-texte2); }

.u-pt-role { font: 600 .72rem/1.4 var(--u-etiq); letter-spacing: .12em; text-transform: uppercase; color: var(--u-vif); }
.u-d-tete { margin: 0 0 18px; font-size: 1.15rem; }
.u-fiche { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 20px 32px; margin: 0 0 34px; padding: 26px 0 0; border-top: 1px solid var(--u-filet); }

.u-prod p { margin: 0 0 10px; }
.u-prod strong { color: var(--u-texte); }
.u-mention { max-width: 82ch; margin: 16px 0 0; padding: 12px 16px; border-left: 3px solid var(--u-vif); background: color-mix(in srgb, var(--u-texte) 6%, transparent); font-size: .92rem; }
.u-distrib .u-signe, .u-appel .u-signe { margin: 26px 0 8px; }

.u-appel .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.u-appel p { margin: 0; }

.suivant { position: relative; display: block; overflow: hidden; padding: clamp(44px, 6vw, 80px) 0; border-top: 1px solid var(--u-filet); text-decoration: none; }
.suivant::before { content: ""; position: absolute; inset: 0; background: radial-gradient(50% 120% at 15% 50%, var(--u-lueur), transparent 70%); opacity: .7; transition: opacity .2s; }

/* ———— les motifs, signatures discrètes de chaque univers ———— */
.mo-g { position: absolute; z-index: -1; pointer-events: none; color: var(--u-vif); }
.mo-arene { inset: -8.5%; width: 117%; height: 117%; color: #fff; opacity: .75; }
.mo-arene .gradin { stroke-width: 9; opacity: .32; }
.u-jumeaux .u-carton .ph { border-radius: 999px 999px 4px 4px; }
.u-jumeaux .ph-cadre::before { content: ""; position: absolute; inset: 0; z-index: -1; border: 1.5px solid var(--u-vif); border-radius: 999px 999px 4px 4px; transform: translate(9%, -6%); opacity: .75; }
.mo-nez { left: 41%; top: 24%; width: auto; height: 52%; color: var(--u-scene); opacity: .55; stroke-width: 1.4; }
.mo-nez .lune { fill: var(--u-accent); stroke: none; opacity: .8; }
.mo-horloge { right: 2%; top: 7%; width: min(44vw, 580px); height: auto; opacity: .28; }
.mo-horloge .aig-h, .mo-horloge .aig-m { transform-box: view-box; transform-origin: 100px 100px; }
.mo-horloge .aig-h { stroke-width: 4; animation: tourne 720s linear infinite; }
.mo-horloge .aig-m { stroke-width: 2.4; animation: tourne 60s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.mo-fil { inset: 0; width: 100%; height: 100%; color: var(--u-scene); opacity: .8; }
.mo-fil path { stroke-width: 2.2; vector-effect: non-scaling-stroke; stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: dessine 3.2s .3s cubic-bezier(.45, 0, .2, 1) forwards; }
.mo-feutre { width: min(100%, 420px); height: 22px; margin: 8px 0 0 -4px; color: var(--u-accent); }
.mo-feutre path { stroke-width: 5; stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: dessine 1.2s .9s cubic-bezier(.45, 0, .2, 1) forwards; }
.mo-souligne { width: min(100%, 380px); height: 22px; margin: 6px 0 0 -6px; color: var(--u-vif); }
.mo-souligne path, .mo-entoure path { stroke-width: 2.4; stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: dessine 1.4s 1s cubic-bezier(.45, 0, .2, 1) forwards; }
.mo-entoure { inset: -7% -9%; width: 118%; height: 114%; color: var(--u-vif); opacity: .9; }
.mo-note { left: calc(-1 * clamp(10px, 3vw, 46px)); top: 46%; width: 30px; height: 30px; color: var(--u-vif); }
.mo-frise-w { position: absolute; left: 0; right: 0; bottom: 14px; z-index: -1; pointer-events: none; }
.mo-frise { width: 100%; height: auto; color: var(--u-vif); opacity: .75; }
.mo-frise text { fill: var(--u-texte2); stroke: none; font: 500 13px var(--u-etiq); letter-spacing: .1em; }
.mo-frise .curseur { fill: var(--u-vif); stroke: none; animation: frise 2.6s .4s cubic-bezier(.45, 0, .2, 1) both; }
@keyframes frise { from { transform: translateX(-1120px); } }
.u-paperboard .u-ouv-texte { padding: clamp(30px, 4vw, 50px) clamp(22px, 3.4vw, 46px) clamp(28px, 3.6vw, 44px); background: #fffdf8 repeating-linear-gradient(transparent 0 2.25rem, #d7e3f4 2.25rem calc(2.25rem + 1px)); border: 1px solid #d9d0bf; box-shadow: 0 26px 50px -26px rgba(20, 20, 50, .45); transform: rotate(-.5deg); }
.u-paperboard .u-ouv-texte::before { content: ""; position: absolute; left: 10%; right: 10%; top: -13px; height: 20px; border-radius: 6px; background: linear-gradient(#585d72, #353849); box-shadow: 0 3px 6px rgba(0, 0, 0, .25); }
.u-paperboard .u-carton .ph { transform: rotate(1.4deg); }
.u-paperboard .u-carton .ph::before { content: ""; position: absolute; left: 50%; top: -4px; z-index: 1; width: 90px; height: 26px; margin-left: -45px; background: rgba(255, 253, 248, .75); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
/* Bérénice : la charte du dossier scolaire (crème, rouge, bordeaux ; Ubuntu gras, Open Sans, Raleway) */
.u-arene { --u-carte: var(--u-accent); }
.u-arene .u-ouv { background: var(--u-accent); }
.u-arene .u-ouv-fond img { opacity: .34; filter: grayscale(1) contrast(1.2); mix-blend-mode: multiply; -webkit-mask-image: none; mask-image: none; }
.u-arene .u-ouv-lueur { background: radial-gradient(46% 56% at var(--gx, 28%) var(--gy, 42%), rgba(99, 23, 5, .55), transparent 72%); }
.u-arene .u-ouv :is(.u-titre, .u-st, .u-accroche, .u-sur, .u-lt, .u-signe, .u-cadre) { color: #fff; }
.u-arene :is(.u-titre, .u-h2, .dos-h3, .prog-t, .fe-t, .suivant b, .u-ac-type) { text-transform: uppercase; }
.u-arene .fu-t { text-transform: uppercase; color: var(--u-accent); }
.u-arene .u-ouv .bu { color: #fff; border-color: rgba(255, 255, 255, .75); }

.dos-couv { position: relative; isolation: isolate; overflow: hidden; display: grid; justify-items: center; gap: 6px; padding: clamp(30px, 5vw, 64px) clamp(20px, 4vw, 48px); border-radius: 8px; background: var(--u-accent); color: #fff; text-align: center; }

.dos-couv p { margin: 0; }
.dos-type { font: 700 .82rem/1.4 var(--u-etiq); letter-spacing: .26em; }

.dos-creation, .dos-format, .dos-public { font: 700 .84rem/1.5 var(--u-etiq); letter-spacing: .16em; }

.dos-fiche { display: grid; gap: 12px; margin: 0; }

.dos-s { margin: clamp(44px, 6vw, 76px) 0 0; }

/* ———— les effets de la 10, dans l'univers de chaque spectacle ———— */
.sx { position: relative; }
.sx-pin { position: sticky; top: calc(var(--haut) + var(--onglets)); height: calc(100vh - var(--haut) - var(--onglets)); height: calc(100svh - var(--haut) - var(--onglets)); overflow: hidden; }
.sx-sig { height: 280vh; background: var(--bg2); color: var(--fg); }
.sx-chronologie { height: 360vh; }
.sig { position: relative; height: 100%; overflow: hidden; }
.sig-phrase { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); width: min(900px, 90%); margin: 0; text-align: center; font: italic 500 clamp(1.2rem, .85rem + 1.4vw, 2.1rem)/1.22 var(--serif); text-wrap: balance; opacity: clamp(0, (var(--p) - .5) * 5, 1); }
.sig-chrono { display: grid; place-items: center; padding: 0 var(--gout); }
.chaleur { position: absolute; left: -20%; right: -20%; bottom: -55%; height: 100%; background: radial-gradient(closest-side, color-mix(in srgb, var(--ac2) 45%, transparent), transparent); opacity: calc(.12 + var(--p) * .8); transform: translateY(calc((1 - var(--p)) * 25%)); pointer-events: none; }
.ligne-temps { position: absolute; left: 0; top: 13%; width: 200%; height: 40px; transform: translateX(calc(var(--p) * -50%)); }
.ligne-temps path { stroke: var(--fg2); stroke-width: 1.5; opacity: .45; }
.cartons { position: relative; display: grid; width: min(860px, 100%); margin: 0; padding: 0; list-style: none; }
.cartons li { grid-area: 1 / 1; align-self: center; opacity: 0; transform: translateY(18px); transition: opacity .5s, transform .5s; }
.cartons li.on { opacity: 1; transform: none; }
.cartons blockquote { margin: 0; text-align: center; }
.cartons p { margin: 0; font: 600 clamp(1.45rem, 1rem + 2vw, 2.8rem)/1.2 var(--u-titre-f); text-wrap: balance; }
.cartons cite { display: block; margin-top: 18px; font: normal 600 .76rem/1.4 var(--u-etiq); letter-spacing: .1em; text-transform: uppercase; color: var(--u-vif); }
.sig-jumeaux .twin { position: absolute; top: 12%; height: 50%; width: min(26vw, 400px); overflow: hidden; border: 1px solid var(--ac); border-radius: 999px 999px 4px 4px; }
.sig-jumeaux .twin.l { left: calc(50% - min(13vw, 200px) - clamp(0, var(--p) * 1.6, 1) * min(21vw, 320px)); }
.sig-jumeaux .twin.r { left: calc(50% - min(13vw, 200px) + clamp(0, var(--p) * 1.6, 1) * min(21vw, 320px)); }
.sig-jumeaux .twin img { width: 100%; height: 100%; object-fit: cover; }
.sig-jumeaux .twin.r img { transform: scaleX(-1); }
.sig-jumeaux .crown { position: absolute; left: 50%; top: 3%; width: 92px; transform: translateX(-50%); fill: none; stroke: var(--ac); stroke-width: 2.5; stroke-linejoin: round; }
.sig-jumeaux .crown path { stroke-dasharray: 1; stroke-dashoffset: calc(1 - clamp(0, var(--p) * 2.2, 1)); }
.sig-nez { display: grid; place-items: center; padding: 0 var(--gout); }
.sig-nez .moon { position: absolute; right: 9vw; top: 8%; width: clamp(70px, 11vw, 150px); fill: var(--ac); transform: translateY(calc((1 - var(--p)) * 30vh)); }
.nez-lines { margin: 0; max-width: 1100px; text-align: center; font-family: var(--u-titre-f); font-weight: var(--u-titre-g); line-height: 1.05; }
.nez-lines span { display: block; margin-top: .3em; font-size: calc(1.3rem + var(--i) * 1.5vw); opacity: clamp(0, (var(--p) * 3.4 - var(--i) * 1.05 - .1) * 2.5, 1); transform: translateY(calc((1 - clamp(0, var(--p) * 3.4 - var(--i) * 1.05 - .1, 1)) * 40px)); }
.nez-lines span:last-child { color: var(--ac); font-size: clamp(2rem, .9rem + 4.4vw, 5.6rem); transform-origin: 0 50%; }
.ring-photo { position: absolute; left: 50%; top: 40%; width: min(40vh, 58vw); aspect-ratio: 1; transform: translate(-50%, -50%) scale(calc(.62 + var(--p) * .38)); clip-path: circle(50%); }
.ring-photo img { width: 100%; height: 100%; object-fit: cover; }
.ring { position: absolute; left: 50%; top: 40%; width: min(64vh, 92vw); transform: translate(-50%, -50%); overflow: visible; }
.ring text { font-family: var(--u-corps); font-size: 14px; letter-spacing: .8px; fill: var(--fg); }
.ring text.inner { font-family: var(--u-etiq); font-weight: 700; font-size: 10.5px; letter-spacing: 4px; text-transform: uppercase; fill: var(--ac); }
.ring-line { fill: none; stroke: var(--ac); stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--p)); }
.ring-rot { transform-box: view-box; transform-origin: 200px 200px; transform: rotate(calc(var(--p) * 150deg)); }
.ring-rot2 { transform-box: view-box; transform-origin: 200px 200px; transform: rotate(calc(var(--p) * -110deg)); }
.sig-cercle .sig-phrase { bottom: 4%; font: 700 clamp(1.05rem, .8rem + 1.1vw, 1.8rem)/1.25 var(--u-titre-f); color: var(--ac); }
.sheets { list-style: none; margin: 0; padding: 0; position: absolute; left: 50%; top: 12%; width: min(620px, 84vw); height: 66%; transform: translateX(-50%); perspective: 1600px; }
.sheet { position: absolute; inset: 0; z-index: var(--z); display: flex; align-items: center; padding: 8%; background: #fffdf8 linear-gradient(transparent 96%, #d7e3f4 96%) 0 0 / 100% 2.2em; border: 1px solid #d9d0bf; box-shadow: 0 18px 40px rgba(20, 20, 50, .16); transform-origin: 50% 0; backface-visibility: hidden; transform: rotateX(calc(clamp(0, var(--p) * 3.2 - var(--i) - .3, 1) * -168deg)); }
.sheet:last-child { transform: none; }
.sheet span { font: clamp(1.3rem, .9rem + 1.6vw, 2.3rem)/1.2 var(--u-titre-f); color: var(--ac2); text-wrap: balance; }
.sheet:nth-child(2) span { color: var(--ac); }
.sig-ann { display: grid; place-items: center; padding: 0 var(--gout); }
.ann-text { max-width: 36ch; margin: 0; font: clamp(1.25rem, .8rem + 1.6vw, 2.25rem)/1.7 var(--u-titre-f); }
.ann { position: relative; white-space: nowrap; --k: clamp(0, var(--p) * 3.4 - var(--i) * .9 - .2, 1); }
.ann::before { content: ""; position: absolute; inset: -.06em -.3em -.02em; border: 2.5px solid var(--ac); border-radius: 50%; transform: rotate(-3deg); clip-path: inset(0 calc((1 - var(--k)) * 100%) 0 0); }
.sig-clock { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 4vw; padding: 0 max(var(--gout), 5vw); }
.clock { width: min(44vh, 36vw); justify-self: center; overflow: visible; }
.clock > circle { fill: none; stroke: var(--fg); stroke-width: 3; }
.clock .ticks line { stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; }
.clock .hand-h { stroke: var(--fg); stroke-width: 6; stroke-linecap: round; }
.clock .hand-m { stroke: var(--ac); stroke-width: 3.5; stroke-linecap: round; }
.clock .pin { fill: var(--ac2); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; font: clamp(1.15rem, .95rem + .9vw, 1.8rem)/1.25 var(--u-titre-f); }
.steps li { position: relative; padding-left: 24px; opacity: .18; transform: translateX(-10px); transition: opacity .45s, transform .45s; }
.steps li::before { content: ""; position: absolute; left: 0; top: .5em; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); }
.steps li.on { opacity: 1; transform: none; }
.sig-fil { display: grid; place-items: center; padding: 0 var(--gout); }
.thread { position: absolute; inset: 0; width: 100%; height: 100%; }
.thread path { fill: none; stroke: var(--u-scene); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--p)); }
.fil-vers { position: relative; margin: 0; max-width: 16ch; text-align: center; font: clamp(2.4rem, 1rem + 5.2vw, 6.4rem)/1 var(--u-titre-f); text-wrap: balance; color: color-mix(in srgb, var(--fg) calc((1 - clamp(0, (var(--p) - .4) * 3, 1)) * 100%), var(--u-scene)); }


/* ———————————— le mouvement (règle 15) : la pousse et le filet ; voir le bloc « Mouvement » en tête du script ————————————
   Une seule courbe (rapide puis posée), des durées courtes : survol 180 ms, pression 60 ms, page 300 ms, carte → en-tête 400 ms. */
:root { --mv-courbe: cubic-bezier(.2, .7, .2, 1); }
/* les pages : l'en-tête reste en place, la nouvelle page monte de 12 px (une animation composée de <main>, voir entrer()) ;
   la View Transition ne capture que ce qui se transforme : la carte qui devient l'en-tête, la pastille de l'onglet
   (la page entière n'est pas capturée : la capture d'un écran entier coûte, et rien n'y gagne) */
html { view-transition-name: none; }
/* la carte d'un spectacle (ou la porte d'une entrée) devient l'en-tête de sa page, et y revient */
::view-transition-group(mv-partage) { animation-duration: .4s; animation-timing-function: cubic-bezier(.3, .72, .12, 1); }
::view-transition-old(mv-partage) { animation: .14s ease-out both page-fondu; }
::view-transition-new(mv-partage) { animation: .22s var(--mv-courbe) both page-fondu-entre; }
/* d'un onglet à l'autre d'un spectacle : l'ouverture ne bouge pas, la pastille de l'onglet glisse */
html[data-mv-transition="onglet"] .u-onglets a[aria-current="page"] { view-transition-name: onglet-actif; }
::view-transition-group(onglet-actif) { animation-duration: .28s; animation-timing-function: var(--mv-courbe); }
@keyframes page-fondu { to { opacity: 0; } }
@keyframes page-fondu-entre { from { opacity: 0; } }
/* entre les onglets, le titre ne se réécrit pas */
.u-ouv.deja .u-titre .ch, .u-ouv.deja .ecrit .w { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
/* les filets se tracent de gauche à droite, à l'arrivée dans l'écran */
section.bloc { position: relative; border-top: 0; }
.filet { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--filet); transform-origin: 0 50%; pointer-events: none; }
.filet[data-mv="trace"].mv-attente { transition: transform .9s var(--mv-courbe); }
/* la pression : la pièce s'enfonce d'un rien, à l'instant même */
:is(.bouton, .bu, .puce, .idx-tout, .idx, .menu, .som-b, .et-rac button, .entrees a, .barre a, .second a, .dos-bt, .porte, .fu-a, .prog-t a, .fe-t a, .suivant, .u-onglets a, .rs-date, .rs-reserver, .rs-seance, .lc-b) { transition-property: background, color, border-color, box-shadow, scale; transition-duration: .18s, .18s, .18s, .18s, .12s; }
:is(.bouton, .bu, .puce, .idx-tout, .idx, .menu, .som-b, .et-rac button, .entrees a, .barre a, .second a, .dos-bt, .u-onglets a, .rs-date, .rs-reserver, .rs-seance, .lc-b).mv-presse { scale: .965; transition-duration: .06s; }
.porte.mv-presse, .fu:has(> .fu-a.mv-presse), .prog:has(.mv-presse:is(.prog-ph, .prog-t a)), .fe:has(.mv-presse:is(.fe-ph, .fe-t a)) { scale: .985; transition: scale .06s; }
.suivant.mv-presse .fleche { translate: 14px 0; }
.dates > li .t.mv-presse, .prochaines a.mv-presse { opacity: .75; }
/* ce qui vit : « en tournée » respire */
.fu-badge.tournee::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: .1em; animation: respire 2.4s ease-in-out infinite; }
@keyframes respire { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
/* une ligne vers laquelle la frise mène */
.dates > li.est-vise, .sa-dates > li.est-vise { animation: vise 1.2s var(--mv-courbe); }
@keyframes vise { 0%, 35% { background: color-mix(in srgb, var(--magenta) 18%, transparent); } }

/* les longs contenus se rendent par morceaux : ce qui est hors de l'écran n'est mis en page qu'à son arrivée */
.prog, .fe { content-visibility: auto; contain-intrinsic-size: auto 520px; }
article.u .chap { content-visibility: auto; contain-intrinsic-size: auto 1000px; }

/* ———— les frises (FRISE), sur le papier de la synthèse ———— */
.frise[data-frise] { --fr-fond: var(--papier); --fr-encre: var(--encre); --fr-trait: color-mix(in srgb, var(--encre) 26%, transparent); --fr-accent: var(--saison-texte);
  --fr-police: var(--sans); --fr-bulle-fond: var(--encre); --fr-bulle-encre: var(--papier); --fr-point: 11px; --fr-couloir: 17px; }
.frise .frise-mois-nom { font: italic 500 .92rem/1.1 var(--serif); }
.frise .frise-an { font: 500 .72rem/1.3 var(--sans); letter-spacing: .06em; }
.frise .frise-aujourdhui-nom { font: 600 .66rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.frise .frise-bulle { font: 400 .86rem/1.4 var(--sans); box-shadow: 0 14px 30px -14px rgba(29, 20, 24, .55); }
.frise .frise-bulle b { font: italic 500 1.08rem/1.2 var(--serif); }
.frise .frise-grappe-n { font-family: var(--sans); }
.v-frise, .sa-frise, .e-frise { margin: 0 0 26px; }
/* les saisons (règle 21) : la saison en cours, sous la marque de la couleur de saison (le thème, règle 22) ; ses prochaines
   dates puis toutes ses dates, à côté de sa carte */
.s0-tete { margin: 0 0 24px; padding: 2px 0 2px 16px; border-left: 4px solid var(--saison-texte); }
.s0-k { margin: 0 0 6px; font: 600 .78rem/1.3 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--saison-texte); }
.s0-tete .titre-bloc { margin: 0; }
.ag-listes { min-width: 0; }
.ag-listes > .rubrique:first-child { margin-top: 0; }
.ag-listes .ag-toutes-h { margin-top: clamp(36px, 5vw, 56px); }
.dates > li.est-allume, .sa-dates > li.est-allume, .prochaines li.est-allume a { background: color-mix(in srgb, var(--saison-texte) 9%, transparent); }
.carte .carte-lieu.est-allume .point { stroke: var(--encre); stroke-width: 2.4; }
/* la frise des saisons : chaque saison et sa densité, au-dessus de l'agenda passé */
.ag-index { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 10px 18px; padding: 8px 0 12px; }
.idx-frise { min-width: 0; }
.idx-outils { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding-bottom: 34px; }
.idx-outils ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.frise-saisons { --fr-bande-h: 38px; --fr-haut: 18px; --fr-pied: 30px; }
.frise-saisons .frise-bande-barre { background: var(--fr-c, var(--saison-texte)); border-radius: 2px 2px 0 0; }
.frise-saisons .frise-bande.est-passe .frise-bande-barre { opacity: .55; }
.frise-saisons .frise-bande:hover .frise-bande-barre, .frise-saisons .frise-bande.est-allume .frise-bande-barre { opacity: 1; }
.frise-saisons .frise-bande-n { font: 600 .72rem var(--sans); }

  /* Mouvement : la pousse et le filet. Le meilleur de la 06 (les bras de la tournée qui poussent de Rouen, la frise et la

     1. Changer de page (MOUVEMENT.transition, View Transitions) : l'en-tête ne bouge pas ; l'ancienne page s'efface en

        l'en-tête de sa page (élément partagé), et y revient ; la porte d'une entrée devient le bandeau de sa page ; entre les
        onglets d'un spectacle, l'ouverture reste, seule la pastille de l'onglet glisse. Un geste interrompt la transition.

        repères de la frise glissent aussi, les saisons de la frise changent de hauteur.
     4. Survol et focus : 180 ms, rien ne se soulève (aucun tremblement au bord), la photo s'approche d'un rien.
     5. Pression : la pièce s'enfonce d'un rien dès le pointerdown (.mv-presse).
     6. Défilement (MOUVEMENT.reveler) : les filets se tracent de gauche à droite, les titres montent, les fiches arrivent

     compagnie ; survoler un repère allume sa ligne et sa commune, et inversement ; un clic y mène.

    // (les années, en HTML sous le trait : elles gardent leur taille quand la frise rétrécit, au téléphone)
    return `<svg class="df-m" viewBox="0 10 1200 42" aria-hidden="true" focusable="false"><path d="M40 32H1160"/>${ticks.join('')}<path d="M1160 14V48"/><circle class="dm-curseur" cx="40" cy="32" r="7"/></svg><span class="df-an">1850</span><span class="df-an df-an-fin">2077</span>`; };
  const effetEcran = m => m === 'arene' ? `<div class="df-effet" aria-hidden="true">${ARENE()}</div>`
    : m === 'fil' ? `<div class="df-effet df-fil" aria-hidden="true">${FIL}</div>`
    : m === 'chronologie' ? `<div class="df-effet df-chrono" aria-hidden="true">${FRISE_CHRONO()}</div>`
    : motif10(m) ? `<div class="df-effet" aria-hidden="true">${motif10(m)}</div>${m === 'nez' ? LUNE : ''}` : '';
  // une prochaine date, écrite comme dans l'agenda (le jour en grand, le mois, la commune) ; réservable, elle mène à sa carte
  // de réservation, sur la page du spectacle (règle 17)
  const dateEcran = (s, d) => { const [j, m] = coupe(d.ligneDate), k = RS && !d.scolaire ? RS.cle(d) : null, rv = k != null && !!RS.trouver(k);
    const corps = `<span class="df-q"><b>${esc(j)}</b>${m ? ` <small>${esc(m)}</small>` : ''}</span><span class="df-o">${esc(d.ligneLieu)}${d.scolaire ? ` <em class="tag">${esc(L.scolaire)}</em>` : ''}${d.etat ? ` <em class="tag">${esc(d.etat)}</em>` : ''}</span>`;
    return `<li${dateId(d)}>${rv ? `<a class="df-date" href="#/spectacle/${esc(s.slug)}/voir?date=${encodeURIComponent(k)}">${corps}<span class="sr"> ${esc(s.titre)}</span></a>` : `<span class="df-date">${corps}</span>`}</li>`; };
  // ses prochaines dates principales : tout public d'abord, jusqu'à trois (deux au moins avec les scolaires, marquées) ;
  // sans date, son annonce s'il est en création, sinon la phrase de son bilan (D), sinon rien : rien n'est inventé
  function datesEcran(s) {
    const ds = D.dates.filter(d => d.slug === s.slug), choisies = ds.filter(d => !d.scolaire).slice(0, 3);
    if (choisies.length < 2) choisies.push(...ds.filter(d => d.scolaire).slice(0, 2 - choisies.length));
    choisies.sort((a, b) => ds.indexOf(a) - ds.indexOf(b));
    if (choisies.length) return `<div class="df-dates" style="--k:3"><p class="df-k">${esc(L.prochainesDates)}</p><ul class="df-liste" data-agenda="${esc(s.slug)}">${choisies.map(d => dateEcran(s, d)).join('')}</ul></div>`;
    if (s.statut && s.tournee && s.tournee.titre) return `<div class="df-dates" style="--k:3"><p class="df-k"${edS(s, 'tournee', 'titre')}>${esc(s.tournee.titre)}</p>${s.tournee.texte ? `<p class="df-annonce"${edS(s, 'tournee', 'texte')}>${esc(s.tournee.texte)}</p>` : ''}</div>`;
    const P = s.programmer || {};
    if (P.representations) return `<div class="df-dates" style="--k:3">${s.enTournee ? '' : `<p class="df-k">${esc(L.bilan)}</p>`}<p class="df-bilan"${edS(s, 'programmer', 'representations')}>${nombre(P.representations)}</p></div>`;
    return '';
  }
  function ecranSp(s, i) {
    const m = mo(s), ph = (s.photos || []).find(p => !p.etablissement && !p.atelier && D.photos[p.cle]), src = ph ? D.photos[ph.cle] : D.photos[s.slug];
    const credit = ph ? creditDe(s, ph) : s.creditPhotos, kCredit = ph ? cleCredit(ph) : 'creditPhotos';
    const tl = s.titreLignes && s.titreLignes.length ? s.titreLignes : null, lignes = tl || [s.titre];
    const titre = lignes.map((l, k) => `<span class="df-l"${tl ? edS(s, 'titreLignes', k) : edS(s, 'titre')}>${esc(l)}</span>`).join(' ');
    const long = lignes.length > 2 || lignes.join(' ').length > 26, badge = badgeDe(s);
    const img = (cls = '') => src ? `<img${cls ? ` class="${cls}"` : ''} src="${src}" alt="" loading="lazy" decoding="async">` : '';
    return `<article class="df ${uClasse(s)}" style="${uVars(s)}" data-motif="${esc(m)}" data-cote="${i % 2 ? 'droite' : 'gauche'}" aria-labelledby="df-t-${esc(s.slug)}">
      <div class="df-photo"${ph ? edP(s, 'photos', rangPh(s, ph)) : edP(s, 'photo')}>${img()}${m === 'jumeaux' ? img('df-jumeau') : ''}</div>
      ${effetEcran(m)}
      <div class="wrap df-texte"><div class="df-in">
        <p class="df-sur" style="--k:0"><span${edS(s, 'creation')}>${esc(s.creation || '')}</span>${s.lieuTemps ? `<span class="df-lt"${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</span>` : ''}${badge ? `<span class="df-badge">${badge}</span>` : ''}</p>
        <h2 class="df-titre${long ? ' long' : ''}" id="df-t-${esc(s.slug)}" style="--k:1">${titre}</h2>${m === 'annotations' ? SOULIGNE : ''}
        ${s.accroche ? `<p class="df-acc" style="--k:2"${edS(s, 'accroche')}>${esc(s.accroche)}</p>` : ''}
        ${datesEcran(s)}
        <p class="df-cta" style="--k:4"><a class="bu plein" href="${lienSp(s.slug)}">${esc(L.decouvrir)}<span class="sr"> ${esc(s.titre)}</span>${FLECHE}</a></p>
      </div></div>
      ${credit ? `<p class="df-credit"${edS(s, kCredit)}>${esc(credit)}</p>` : ''}
      <div class="df-voile" aria-hidden="true"></div>
    </article>`;
  }
  // le défilé, au fil de la lecture : --p (l'arrivée de l'écran), --r (sa lecture, épinglé), --q (recouvert par le suivant).
  // Au bureau, les écrans sont épinglés l'un après l'autre (sticky) : leur place se calcule depuis la pile, sans les lire un
  // par un ; ailleurs, chacun suit sa place dans l'écran. Seules les valeurs qui changent sont réécrites.
  let ecrans = [], dfM = null;
  function mesurerEcrans() {
    const e0 = ecrans[0];
    // (haut : là où les écrans s'épinglent, leur top ; le filet de l'en-tête n'en fait pas partie)
    const st = e0 && e0.isConnected ? getComputedStyle(e0) : null;
    dfM = st ? { pile: st.position === 'sticky', h: e0.offsetHeight, m: parseFloat(st.marginBottom) || 0,
      haut: (st.position === 'sticky' && parseFloat(st.top)) || ($('#top') || {}).offsetHeight || 64 } : null;
  }
  function defileEcrans() {
    if (!ecrans.length || !ecrans[0].isConnected) return;
    if (!dfM) mesurerEcrans();
    if (!dfM) return;
    const poser = (el, p, r, q) => { const v = `${p.toFixed(3)} ${r.toFixed(3)} ${q.toFixed(3)}`; if (el.__df === v) return; el.__df = v;
      el.style.setProperty('--p', p.toFixed(3)); el.style.setProperty('--r', r.toFixed(3)); el.style.setProperty('--q', q.toFixed(3)); };
    if (!motionOK()) { ecrans.forEach(el => poser(el, 1, 1, 0)); return; }
    const vh = innerHeight;
    if (dfM.pile) {
      const d = dfM.haut - ecrans[0].parentElement.getBoundingClientRect().top, Hs = Math.max(1, dfM.h), M = dfM.m;
      const ps = ecrans.map((el, i) => clamp((d - (i * (Hs + M) - Hs)) / Hs, 0, 1));
      ecrans.forEach((el, i) => poser(el, ps[i], M > 0 ? clamp((d - i * (Hs + M)) / M, 0, 1) : ps[i], ps[i + 1] || 0));
    } else ecrans.forEach(el => { const r = el.getBoundingClientRect(); if (r.bottom < -vh || r.top > 2 * vh) return;
      poser(el, clamp((vh - r.top) / (vh * .7), 0, 1), clamp((vh * .3 - r.top) / Math.max(1, r.height * .8), 0, 1), 0); });
  }
  // au clavier, dans la pile : l'écran du lien qui prend le focus vient à sa place, épinglé et pas encore recouvert (le dernier,
  // que rien ne recouvre, en haut) ; ailleurs, le navigateur amène déjà le lien dans l'écran
  function placerEcran(el) {
    const i = ecrans.indexOf(el);
    if (i < 0 || !motionOK()) return;
    if (!dfM) mesurerEcrans();
    if (!dfM || !dfM.pile) return;
    const d = dfM.haut - el.parentElement.getBoundingClientRect().top, a = i * (dfM.h + dfM.m), v = clamp(d, a, i < ecrans.length - 1 ? a + dfM.m : a);
    if (Math.abs(v - d) > .5) scrollTo({ top: Math.ceil(scrollY + v - d), behavior: 'instant' });   // (arrondi vers le bas de la page : épinglé)
  }

  /* ---------- l'accueil : la scène (la pieuvre), le menu, les spectacles un par écran, la saison sur la carte, les donateurs ---------- */
  function accueil(q, surPlace) {
    vue = 'accueil';
    const lieux = CARTE.aVenir(), vus = new Set(lieux.map(x => x.l)), passe = tous().filter(x => !vus.has(x.l)), ms = menuDe('saisons');
    main.innerHTML = `<div class="acc"><div id="sc-place"></div>
      ${menuAccueil()}

      </div></section>

      return x ? `<b>${esc(CARTE.nom(x))}</b><ul>${x.dates.map(d => `<li><span class="t">${esc(d.titre)}</span><span>${esc(d.ligneDate)}</span>${d.scolaire ? `<em class="tag">${esc(L.scolaire)}</em>` : ''}</li>`).join('')}</ul>` : ''; },
      l => { const x = lieux.find(y => y.l === l); location.hash = x && x.dates.some(d => !d.scolaire) ? `${ms ? ms.href : E.voir.href}?l=${l}` : E.etablissement.href; });
    const allume = l => { montre(l); $$('li[data-l]', ol).forEach(li => li.classList.toggle('on', l != null && +li.dataset.l === l)); };
    ol.addEventListener('mouseover', e => { const li = e.target.closest('li[data-l]'); if (li) allume(+li.dataset.l); });
    ol.addEventListener('mouseleave', () => allume(null));
    ol.addEventListener('focusin', e => { const li = e.target.closest('li[data-l]'); if (li) allume(+li.dataset.l); });

    ecrans = $$('.df', main); dfM = null;
    $('.df-pile', main).addEventListener('focusin', e => { if (e.target.matches(':focus-visible')) requestAnimationFrame(() => placerEcran(e.target.closest('.df'))); });

  /* ---------- l'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const MOIS_NOMS = MOIS.split('|');
  const MOIS_TOK = `${MOIS}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)
  const RE_JOUR = new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS_TOK})\\.?(?:\\s+(\\d{4}))?`, 'gi');
  const RE_MOIS_AN = new RegExp(`(${MOIS_TOK})\\.?\\s+(\\d{4})`, 'i');
  const RE_LIGNE = new RegExp(`^(.*?)\\s*((?:${MOIS_TOK})\\.?\\s+\\d{4})([\\s\\S]*)$`, 'i');
  const p2 = n => String(n).padStart(2, '0');
  // la date de fin d'une ligne, « 2020-03-04 » : iso/fin quand la base les a, sinon lue dans la ligne (le dernier jour cité)
  function cleDate(d, saison) {
    const fin = d.fin || d.iso; if (fin) return fin;
    const tete = String(d.ligne || '').split(/—|\s:\s/)[0], a0 = +saison.slice(0, 4), mois = x => { const t = x.toLowerCase(); return MOIS_NOMS.findIndex(n => n.startsWith(t) || t.startsWith(n.slice(0, 4))) + 1; };
    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];
    if (dern) { const mm = mois(dern[2]); return `${dern[3] ? +dern[3] : mm >= 9 ? a0 : a0 + 1}-${p2(mm)}-${p2(+dern[1])}`; }
    const ma = tete.match(RE_MOIS_AN);
    return ma ? `${ma[2]}-${p2(mois(ma[1]))}-31` : null;
  }
  // « 24 janvier 2020 à 20h — Théâtre en Seine, Duclair (76) » → { jour: « 24 », heure: « à 20h », lieu: « Théâtre en Seine, Duclair (76) » }
  function decoupe(ligne) {
    const t = String(ligne || ''), m = t.match(RE_LIGNE);
    if (!m) return { jour: '', heure: '', lieu: t.trim() };
    const reste = m[3], k = reste.indexOf('—'), c = reste.search(/\s:\s/);
    const [h, l] = k >= 0 ? [reste.slice(0, k), reste.slice(k + 1)] : c >= 0 ? [reste.slice(0, c), reste.slice(c + 3)] : ['', reste];
    const net = x => x.replace(/^[\s:,–-]+|[\s:]+$/g, '');
    return { jour: m[1] || m[2], heure: net(h), lieu: net(l) };
  }
  const titreMois = m => m ? `${MOIS_NOMS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '';
  // toutes les saisons passées : [{k, titre, rows: [{d, g, k, i, suite, cle, txt}], titres, lieux}], la plus récente d'abord
  // les lignes publiées d'une saison (D.saisons), dans l'ordre de D : leur date de fin (k), leur clé de repère (fid, aussi
  // celle de la frise), leur texte cherchable ; une ligne sans date suit celle d'avant (suite)
  function lignesSaison(saison) {
    const SA = D.saisons[saison], rows = []; let i = 0;
    ((SA && SA.spectacles) || []).forEach(g => {
      let prev = null;
      (g.dates || []).forEach(d => {
        let k = cleDate(d, saison); const suite = !k; if (suite) k = prev; else prev = k;
        const sp = g.slug && bySlug[g.slug], titre = sp ? sp.titre : g.titre;
        rows.push({ d, g, k: k || '', i, fid: cleLigne(d, saison, i++), suite, titre, cle: g.slug || `titre:${g.titre}`,
          txt: norm(`${titre} ${d.ligne} ${(d.details || []).map(y => y.texte).join(' ')} ${d.l != null && CARTE.lieux[d.l] ? CARTE.nom(CARTE.lieux[d.l]) : ''}`) });
      });
    });
    return rows;
  }
  function agendaPasse() {
    const out = [];
    S.saisons.forEach(x => {
      const SA = D.saisons[x.saison]; if (!SA || x.saison > D.saison) return;
      const rows = lignesSaison(x.saison);
      const passees = (x.saison === D.saison ? rows.filter(r => r.k && r.k < D.aujourdhui) : rows).sort((a, b) => a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i);
      if (!passees.length) return;
      out.push({ k: x.saison, titre: SA.titre, rows: passees, titres: [...new Set(passees.map(r => r.titre))], lieux: CARTE.saison(x.saison) });
    });
    return out;
  }
  // toutes les dates de la saison en cours, passées comprises, dans l'ordre du temps (la ligne sans date reste après la sienne)
  const lignesEnCours = () => lignesSaison(D.saison).sort((a, b) => a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i);
  // les spectacles qui ont des dates, à venir ou passées : [{cle, titre, slug}], les spectacles de la compagnie d'abord
  function spectaclesAgenda(pub, passe) {
    const m = new Map();
    D.shows.forEach(s => { if (pub.some(d => d.slug === s.slug) || passe.some(p => p.rows.some(r => r.cle === s.slug))) m.set(s.slug, { cle: s.slug, titre: s.titre, slug: s.slug }); });
    passe.forEach(p => p.rows.forEach(r => { if (!m.has(r.cle)) m.set(r.cle, { cle: r.cle, titre: r.titre, slug: null }); }));
    return [...m.values()];
  }

  /* ---------- je viens voir un spectacle : les prochaines dates, puis l'agenda passé saison par saison ---------- */
  const etat = { voir: null };
  const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>';
  const DOUBLE = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l6 5 6-5M6 13l6 5 6-5"/></svg>';
  const DOUBLE_HAUT = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 11l6-5 6 5M6 18l6-5 6 5"/></svg>';
  // (pre : un préfixe de la clé de mouvement, quand la même ligne paraît deux fois dans la vue)
  const ligneAgenda = (r, pre = '', sansTitre = false) => {
    const { d, g } = r, sp = g.slug && bySlug[g.slug], p = decoupe(d.ligne);
    const titre = r.suite || sansTitre ? '' : sp ? `<a class="t" href="${lienSp(g.slug, 'voir')}">${esc(r.titre)}</a>` : `<span class="t">${esc(r.titre)}</span>`;
    const lieu = p.lieu ? (d.lien ? `<a class="ou" href="${esc(d.lien)}" target="_blank" rel="noopener">${esc(p.lieu)}</a>` : `<span class="ou">${esc(p.lieu)}</span>`) : '';
    return `<li data-date-id="${esc(d.id ?? '')}" data-frise-id="${esc(r.fid)}" data-mv-cle="${esc(pre + r.fid)}"${d.l != null ? ` data-l="${d.l}"` : ''}${r.suite ? ' class="suite"' : ''} style="--c:${couleurDe(g.slug)}">${r.suite ? '' : `<time${d.iso ? ` datetime="${d.iso}"` : ''}><b>${esc(p.jour)}</b>${p.heure ? `<small>${esc(p.heure)}</small>` : ''}</time>`}<div class="qui">${titre}${d.scolaire ? `<em class="tag">${esc(L.scolaire)}</em>` : ''}${d.etat ? `<em class="etat">${esc(d.etat)}</em>` : ''}${lieu}${details(d.details)}</div></li>`;
  };

  /* ---------- chantiers 1, 2, 3, 4 : alertes, simulateur, convention, schema.org ---------- */
  function mettreAJourSchemaOrg() {
    let script = document.getElementById('crescite-jsonld');
    if (!script) {
      script = document.createElement('script');
      script.id = 'crescite-jsonld';
      script.type = 'application/ld+json';

    const publicDates = (D.dates || []).filter(d => !d.scolaire && d.iso);
    const graph = [
      {
        '@type': 'PerformingGroup',
        '@id': 'https://crescite.fr/#cie',
        'name': 'Compagnie Crescite',
        'url': 'https://crescite.fr',
        'logo': 'https://crescite.fr/icones/192.png',
        'description': 'Compagnie de théâtre professionnelle basée à Rouen, dirigée par Angelo Jossec.',
        'founder': { '@type': 'Person', 'name': 'Angelo Jossec', 'jobTitle': 'Directeur artistique' }
      },
      ...publicDates.slice(0, 40).map(d => {
        const sp = bySlug[d.slug];
        const l = CARTE.lieux[d.l];
        return {
          '@type': 'TheaterEvent',
          'name': `${d.titre} — Compagnie Crescite`,
          'startDate': d.iso,
          'description': sp ? sp.accroche || sp.titre : d.titre,
          'eventStatus': d.annulee ? 'https://schema.org/EventCancelled' : 'https://schema.org/EventScheduled',
          'performer': { '@id': 'https://crescite.fr/#cie' },
          'organizer': { '@id': 'https://crescite.fr/#cie' },
          'location': {
            '@type': 'Place',
            'name': l ? CARTE.nom(l) : (d.ligneLieu || 'Théâtre'),
            'address': {
              '@type': 'PostalAddress',
              'addressLocality': l ? l.commune : '',
              'postalCode': l ? l.codeInsee : '',
              'addressCountry': 'FR'
            },
            ...(l && l.lat && l.lon ? { 'geo': { '@type': 'GeoCoordinates', 'latitude': l.lat, 'longitude': l.lon } } : {})
          },
          ...(d.lien ? { 'offers': { '@type': 'Offer', 'url': d.lien, 'availability': 'https://schema.org/InStock' } } : {})
        };
      })
    ];
    script.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graph });
  }

  // un dépôt du public (une alerte de tournée, une demande de devis) : il ne se dit enregistré que si la base l'a enregistré
  // (DONNEES.deposer rend { error }) ; sinon, la page propose d'écrire directement au contact diffusion des données
  const deposer = (table, ligne) => (typeof DONNEES !== 'undefined' && DONNEES.deposer ? DONNEES.deposer(table, ligne) : Promise.resolve({ error: { message: 'sans la base' } }));
  // un libellé de D.site.libelles à trous ({adresse}, {lien}…), rempli de morceaux déjà échappés
  const remplir = (gabarit, v) => esc(gabarit || '').replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  // un lien mailto: vers le contact diffusion des données, avec l'objet et le texte (son adresse, sans autre texte) ; ''
  // quand les données n'ont pas d'adresse
  const versContact = (texte, objet, corps = '') => {
    const c = contactPrg();
    return c && c.email ? `<a href="${esc(`mailto:${c.email}?subject=${encodeURIComponent(objet)}${corps ? `&body=${encodeURIComponent(corps)}` : ''}`)}">${esc(texte || c.email)}</a>` : '';
  };
  // l'alerte de tournée : elle ne compte qu'une fois confirmée depuis le courriel envoyé à l'adresse (le onzième script
  // SQL, la fonction crescite-courriel) ; la page le dit, et ne promet rien d'autre. Le secteur : la position (« Me
  // géolocaliser » : l'alerte vaut alors dans un rayon autour d'elle) avec sa commune, ou un code postal, ou une commune
  // cherchée par son nom (geo.api.gouv.fr) ; la base en déduit le département
  function initAlerteTournee() {
    const f = $('#f-alerte'); if (!f) return;
    const btnGeo = $('#btn-geo'), cp = $('#alerte-cp'), email = $('#alerte-email'), sp = $('#alerte-spectacle'), msg = $('#alerte-msg');
    let ici = null;      // la position prise, sa commune, son code postal, son département et le texte écrit dans le champ
    const geoTexte = t => { if (btnGeo) btnGeo.querySelector('span').textContent = t; };
    const oublierIci = () => { ici = null; if (btnGeo) { btnGeo.classList.remove('actif'); geoTexte(L.meGeolocaliser || 'Me géolocaliser'); } };
    if (btnGeo) {
      btnGeo.addEventListener('click', () => {
        if (!navigator.geolocation) { alert('La géolocalisation n’est pas disponible sur cet appareil.'); return; }
        btnGeo.classList.add('actif');
        geoTexte('Recherche…');
        navigator.geolocation.getCurrentPosition(async pos => {
          const lat = pos.coords.latitude, lon = pos.coords.longitude;
          let c = null;
          try {
            const res = await fetch(`https://geo.api.gouv.fr/communes?lat=${lat}&lon=${lon}&fields=nom,codesPostaux,codeDepartement`);
            const data = res.ok ? await res.json() : [];
            c = data && data[0] || null;
          } catch (e) { /* hors connexion : la position seule */ }
          cp.value = c ? `${c.nom} (${c.codeDepartement})` : 'Ma position';
          ici = { lat, lon, commune: c ? c.nom : null, code_postal: c && c.codesPostaux ? c.codesPostaux[0] || null : null,
                  departement: c ? c.codeDepartement || null : null, texte: cp.value };
          geoTexte('Localisé');
        }, err => {
          oublierIci();
          alert('Impossible de vous localiser : ' + (err.message || 'accès non autorisé'));
        }, { timeout: 10000 });
      });
    }
    // le champ retouché : la position n'est plus celle qu'il dit
    cp.addEventListener('input', () => { if (ici && cp.value !== ici.texte) oublierIci(); });
    // un secteur écrit : un code postal (« 76000 », « 76000 Rouen »), « Rouen (76) », ou le nom d'une commune ; rien de
    // trouvé : null
    async function secteurEcrit(t) {
      const code = (t.match(/(?:^|\D)(\d{5})(?:\D|$)/) || [])[1];
      if (code) return { code_postal: code, commune: t.replace(code, '').replace(/[(),]/g, ' ').replace(/\s+/g, ' ').trim() || null };
      const dep = (t.match(/\(\s*(\d{2,3}|2[AaBb])\s*\)/) || [])[1];
      if (dep) return { commune: t.replace(/\(.*\)/, '').trim() || null, departement: dep.toUpperCase() };
      try {
        const res = await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(t)}&fields=nom,codesPostaux,codeDepartement&boost=population&limit=1`);
        const c = (res.ok ? await res.json() : [])[0];
        if (c) return { code_postal: (c.codesPostaux || [])[0] || null, commune: c.nom, departement: c.codeDepartement || null };
      } catch (e) { /* hors connexion */ }
      return null;
    }
    const dire = (genre, html) => {
      msg.className = `alerte-msg ${genre}`;
      msg.setAttribute('role', genre === 'err' ? 'alert' : 'status');
      msg.innerHTML = html;
      msg.hidden = false;
    };
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const mailVal = email.value.trim(), cpVal = cp.value.trim(), spVal = sp.value;
      if (!mailVal || !cpVal) return;
      const btnSub = $('#btn-inscrire-alerte');
      if (btnSub) btnSub.disabled = true;
      msg.hidden = true;
      const s = spVal && bySlug[spVal] ? bySlug[spVal] : null;
      const secteur = ici ? { code_postal: ici.code_postal, commune: ici.commune, departement: ici.departement } : await secteurEcrit(cpVal);
      if (!secteur) {
        dire('err', esc(L.alerteSecteurInconnu || 'Ce secteur est introuvable : indiquez un code postal (5 chiffres), ou utilisez « Me géolocaliser ».'));
        if (btnSub) btnSub.disabled = false;
        cp.focus();
        return;
      }
      // confirme_le n'existe qu'avec le onzième script (la confirmation par courriel et l'envoi) : sans lui, la base refuse
      // l'alerte et la page ne promet rien. La base la dépose de toute façon en attente (jamais confirmée)
      const { error } = await deposer('crescite_alertes_tournee', {
        email: mailVal,
        ...secteur,
        spectacle_id: s && s.id != null ? s.id : null,
        lat: ici ? ici.lat : null,
        lon: ici ? ici.lon : null,
        confirme_le: null
      });
      if (error && error.code === 'PT429' && error.message) {
        // une limite de la base (cinq alertes par adresse) : son message dit laquelle
        dire('err', esc(error.message));
      } else if (error) {
        // rien n'est enregistré : on le dit, et on propose d'écrire au contact diffusion
        const lien = versContact(null, `${L.alerteTournee} – ${cpVal}`, [cpVal, s && s.titre].filter(Boolean).join(' · '));
        dire('err', `${esc(L.alerteNonEnregistree)}${lien ? ` ${lien}` : ''}`);
      } else {
        dire('ok', `✓ ${remplir(L.alerteInscrite, { adresse: esc(mailVal), secteur: esc(cpVal) })}`);
        f.reset();
        oublierIci();
      }
      if (btnSub) btnSub.disabled = false;
    });
  }

  /* ---------- les saisons (règle 21) : tout l'agenda, sur une page ----------
     La saison en cours, sous la marque de la couleur de saison : sa frise (chaque date à la couleur de son spectacle, la
     légende des spectacles tout près, « aujourd'hui »), ses prochaines dates (tout public : des boutons qui ouvrent leur
     carte de réservation sur place, règle 17 ; scolaires : marquées, sans bouton), toutes ses dates (passées comprises, dans
     l'ordre du temps) et sa carte ; puis les saisons passées, de la plus récente à la plus ancienne, chacune fermée sous sa
     petite carte (son contenu ne se dessine qu'à l'ouverture), avec la frise des saisons ; puis l'alerte de tournée. Le
     filtre par spectacle, la commune et la recherche portent sur toute la page. ouvrir : #/saisons/<saison>, la même page,
     cette saison ouverte et amenée à l'écran (le h1 ne change pas ; le titre du document prend celui de la saison). */
  function voir(q, surPlace, ouvrir = null) {
    vue = 'saisons';
    const M0 = menuDe('saisons') || { texte: L.saisons, href: '#/saisons' }, S0 = S.saisons[0];
    // la carte de la saison : ses communes à venir, en avant ; celles où elle est déjà passée, en retrait
    const lieux = CARTE.aVenir(), vusC = new Set(lieux.map(x => x.l)), passeC = CARTE.saison(D.saison).filter(x => !vusC.has(x.l));
    const tout = retenu('agendaPasse', agendaPasse), passe = tout.filter(s => s.k !== D.saison), encours = tout.find(s => s.k === D.saison);
    const lignes = retenu('lignesEnCours', lignesEnCours), puces = spectaclesAgenda(D.dates, tout);
    const proch = D.dates.map(d => ({ d, cle: d.slug, l: d.l, id: cleProchaine(d), txt: norm(`${d.titre} ${d.ligne} ${(d.details || []).map(x => x.texte).join(' ')} ${CARTE.lieux[d.l] ? CARTE.nom(CARTE.lieux[d.l]) : ''}`) }));
    if (!surPlace || !etat.voir) { const l0 = q.get('l'); etat.voir = { q: '', slug: null, l: l0 !== null && [...lieux, ...passeC].some(x => x.l === +l0) ? +l0 : null, ouv: new Set(ouvrir ? [ouvrir] : []), avant: null, date: q.get('date') }; }
    else if (ouvrir) etat.voir.ouv.add(ouvrir);
    const F = etat.voir;
    if (F.slug && !puces.some(s => s.cle === F.slug)) F.slug = null;
    if (F.l !== null && !CARTE.lieux[F.l]) F.l = null;
    retenir('voir');
    const terme = () => norm(F.q).trim();

  /* ---------- la troupe (règle 20, TROUPE) : la pieuvre de la compagnie, entre la présentation et les repères ----------
     Relue dans D à chaque rendu : les personnes, leurs métiers, leurs photos (publiées seulement), les titres. */
  // le chœur en quinconce : a visages sur une rangée longue, a - 1 sur une courte (décalée d'une demi-place), la dernière
  // centrée ; [rangée, demi-colonne de départ] pour chaque visage
  function quinconce(n, a) {
    const pos = []; let r = 1, k = 0, court = false;
    while (k < n) { const m = Math.min(court ? a - 1 : a, n - k); for (let j = 0; j < m; j++) pos.push([r, 1 + (a - m) + 2 * j]); k += m; r++; court = !court; }
    return { pos, rangs: r - 1 };
  }
  // une place : la photo en vignette si elle est publiée (et se charge : une photo introuvable laisse le nom seul), sinon
  // une ventouse ; le nom ; les métiers précis (sauf l'évident : « Jeu » dans le jeu)
  const photosEchec = new Set();
  const aPhoto = x => !!x.photo && !photosEchec.has(x.photo);
  function placeTroupe(x, { classe = '', style = '' } = {}) {
    const metiers = !x.evident && x.metiers.length ? `<span class="tr-metiers">${x.metiers.map(m => `<span class="tr-metier">${esc(m)}</span>`).join('')}</span>` : '';
    const ancre = aPhoto(x) ? `<span class="tr-vignette" data-troupe-ancre><img src="${esc(x.photo)}" alt="" width="168" height="168" loading="lazy" decoding="async" data-troupe-photo></span>`
      : '<span class="tr-ventouse" data-troupe-ancre></span>';
    return `<li class="tr-li${classe ? ' ' + classe : ''}"${style ? ` style="${style}"` : ''}><button type="button" class="tr-place${aPhoto(x) ? ' a-photo' : ''}" data-troupe-place data-troupe-personne="${esc(x.personne)}" aria-pressed="false">${ancre}<span class="tr-qui"><span class="tr-nom">${x.prenom ? `<span>${esc(x.prenom)}</span> ` : ''}<span>${esc(x.nom)}</span></span>${metiers}</span></button></li>`;
  }
  const categorieTroupe = (c, lis, classe = '', liste = '') => `<section class="tr-cat${classe ? ' ' + classe : ''}" data-troupe-categorie="${esc(c.cle)}" aria-labelledby="tr-h-${esc(c.cle)}">
      <h3 class="tr-cat-t" id="tr-h-${esc(c.cle)}"><span class="tr-ic">${TROUPE.icone(c.cle)}</span><span${ed(`site.troupe.categories.${c.i}.titre`)}>${esc(c.titre)}</span></h3>
      <ul class="tr-places${liste ? ' ' + liste : ''}">${lis}</ul></section>`;
  function troupeHTML() {
    if (typeof TROUPE === 'undefined' || !S.troupe) return '';
    const cs = TROUPE.categories().filter(c => c.places.length);
    if (!cs.length) return '';
    // au centre, le jeu (l'acteur au centre) ; les autres métiers de part et d'autre, au plus près de l'équilibre
    const centre = cs.find(c => c.cle === 'jeu') || cs.reduce((a, b) => (b.places.length > a.places.length ? b : a));
    const autres = cs.filter(c => c !== centre), poids = c => c.places.length + 2, total = autres.reduce((n, c) => n + poids(c), 0);
    let k = autres.length ? 1 : 0, cumul = 0, ecart = Infinity;
    autres.forEach((c, i) => { cumul += poids(c); const e = Math.abs(total - 2 * cumul); if (e < ecart) { ecart = e; k = i + 1; } });
    const cote = liste => liste.map(c => categorieTroupe(c, c.places.map((x, i) => placeTroupe(x, { classe: i === c.places.length - 1 ? 'tr-queue' : '' })).join(''))).join('');
    // le chœur : les visages d'abord (en quinconce), puis les noms seuls, de part et d'autre de son bras
    const vis = centre.places.filter(aPhoto), noms = centre.places.filter(x => !aPhoto(x)), q3 = quinconce(vis.length, 3), q4 = quinconce(vis.length, 4);
    const dernierG = noms.length - 1 - ((noms.length - 1) % 2);
    const choeur = [...vis.map((x, i) => placeTroupe(x, { style: `--r3:${q3.pos[i][0]};--c3:${q3.pos[i][1]};--r4:${q4.pos[i][0]};--c4:${q4.pos[i][1]}` })),
      ...noms.map((x, j) => placeTroupe(x, { classe: `${j % 2 ? 'n-d' : 'n-g'}${j === dernierG ? ' tr-queue' : ''}`, style: `--r3:${q3.rangs + 1 + (j >> 1)};--r4:${q4.rangs + 1 + (j >> 1)}` }))].join('');
    const equipes = D.shows.filter(s => TROUPE.equipe(s.slug).length);
    return `<section class="bloc troupe" aria-labelledby="h-troupe"><div class="wrap">
      <h2 class="titre-bloc" id="h-troupe"${ed('site.troupe.titre')}>${esc(TROUPE.titre())}</h2>
      <div class="tr" data-troupe>
        ${equipes.length ? `<div class="tr-sp-zone"><p class="rubrique tr-sp-t" id="tr-sp-t">${esc(L.lesSpectacles)}</p><ul class="tr-sp" aria-labelledby="tr-sp-t">${equipes.map(s => `<li><button type="button" class="tr-spb" data-troupe-spectacle="${esc(s.slug)}" aria-pressed="false" style="--c:${couleurDe(s.slug)}"><i aria-hidden="true"></i>${esc(s.titre)}</button></li>`).join('')}</ul></div>` : ''}
        <svg class="tr-bras" aria-hidden="true" focusable="false"></svg>
        <div class="tr-tete" aria-hidden="true">${D.logo.octopus}</div>
        ${categorieTroupe(centre, choeur, 'tr-choeur-cat', 'tr-choeur')}
        <div class="tr-cote tr-g">${cote(autres.slice(0, k))}</div>
        <div class="tr-cote tr-d">${cote(autres.slice(k))}</div>
      </div>
    </div></section>`;
  }
  // les bras de la pieuvre vers chaque métier (au bureau) : ils partent du bout des tentacules du logo (D.arms), longent
  // l'entre-deux des colonnes et rejoignent l'icône du métier ; deux bras courts portent le chœur. Mesurés sur la page
  // (une lecture, après la mise en page), refaits quand la troupe change de taille ; ils poussent au défilement.
  const BRAS_TROUPE = { g: ['A1outerL', 'A1innerL', 'A2L'], d: ['A1outerR', 'A1innerR', 'A2R'], choeur: ['C1L', 'C1R'] };
  function brasTroupe(tr) {
    const svg = tr && tr.isConnected && $('.tr-bras', tr), tete = tr && $('.tr-tete svg', tr);
    if (!svg || !tete) return;
    const large = matchMedia('(min-width: 960px)').matches;   // au téléphone : seuls les deux bras qui portent le chœur
    const R = tr.getBoundingClientRect(), T = tete.getBoundingClientRect(), k = T.width / 1042, ox = T.left - R.left - 250 * k, oy = T.top - R.top - 340 * k;
    const A = (D.arms && D.arms.arms) || {};
    const sortie = nom => { const a = A[nom]; return a && a.pts && a.pts[0] ? { p: [ox + a.pts[0][0] * k, oy + a.pts[0][1] * k], d: a.exitdir || [0, 1] } : null; };
    const centre = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2 - R.left, r.top + r.height / 2 - R.top, r.width / 2]; };
    let masques = '', corps = '', n = 0;
    const bras = (pts, w0, w1) => {
      const c = TROUPE.lisse(pts); if (!c.d) return;
      const nv = Math.max(3, Math.floor(c.longueur / 24));
      const vs = Array.from({ length: nv }, (_, i) => { const t = (i + .8) / (nv + .5), q = c.point(t), tg = c.tangente(t), s = i % 2 ? 1 : -1, w = (w0 * (1 - t) + w1 * t) / 2 + 2.2;
        return `<circle class="tr-bv" cx="${(q[0] - tg[1] * w * s).toFixed(1)}" cy="${(q[1] + tg[0] * w * s).toFixed(1)}" r="${(1.8 - .7 * t).toFixed(1)}"/>`; }).join('');
      const id = `tr-m${n++}`;
      masques += `<mask id="${id}" maskUnits="userSpaceOnUse"><path class="tr-m" pathLength="1" stroke-width="18" d="${c.d}"/></mask>`;
      corps += `<g mask="url(#${id})"><path class="tr-b" d="${TROUPE.effile(c, { w0, w1, n: 48 })}"/>${vs}</g>`;
    };
    // un couloir par bras dans l'entre-deux des colonnes (le plus proche de la colonne pour le métier du haut) : le bras
    // descend en biais depuis la pieuvre, ondule dans son couloir, puis s'enroule vers l'icône du métier
    const cotes = [['g', $('.tr-g', tr), -1], ['d', $('.tr-d', tr), 1]];
    cotes.forEach(([cle, col, sens]) => {
      if (!col || !large) return;
      const rc = col.getBoundingClientRect(), bord = sens < 0 ? rc.right - R.left : rc.left - R.left;
      $$(':scope > .tr-cat', col).forEach((cat, i) => {
        const s = sortie(BRAS_TROUPE[cle][Math.min(i, 2)]), ic = $('.tr-ic', cat); if (!s || !ic) return;
        const [cx, cy, cr] = centre(ic), couloir = bord - sens * (15 + 13 * i), [px, py] = s.p, bout = [cx - sens * (cr + 3), cy];
        const p1 = [px + s.d[0] * 22, py + s.d[1] * 22];
        // un métier à hauteur de la pieuvre : un simple S jusqu'à lui
        if (cy - py < 150) { bras([[px, py], p1, [p1[0] + (bout[0] - p1[0]) * .45, Math.max(p1[1], bout[1]) + 30], [bout[0] - sens * 16, cy + 7], bout], 4.2, 1.5); return; }
        const y0 = py + Math.min(110, Math.abs(couloir - px) * .55 + 30), y1 = cy - 46, pts = [[px, py], p1, [couloir - sens * Math.abs(couloir - px) * .38, y0 - 18], [couloir, y0 + 26]];
        // l'ondulation du couloir : une vague tous les 150 px environ
        const nv = Math.max(0, Math.floor((y1 - y0 - 26) / 150));
        for (let j = 1; j <= nv; j++) pts.push([couloir + (j % 2 ? 5 : -5), y0 + 26 + (y1 - y0 - 26) * j / (nv + 1)]);
        pts.push([couloir, y1], [bout[0] - sens * 6, cy - 8], bout);
        bras(pts, 4.2, 1.5);

      const [px, py] = s.p; bras([[px, py], [px + s.d[0] * 16, py + s.d[1] * 16], [cx + sens * (cr + 22), (py + cy) / 2 + 6], [cx + sens * (cr + 3), cy]], 3.6, 1.5); }); }

  // la troupe prend vie : les liens entre les places (TROUPE.relier), les équipes des spectacles, les bras de la pieuvre
  let troupeVue = null;
  function vivreTroupe() {
    const tr = $('.tr', main); if (!tr || typeof TROUPE === 'undefined') return;
    const sps = $$('.tr-spb', tr);
    let epingle = null;
    const ctl = TROUPE.relier(tr, {
      // une personne allumée : ses spectacles s'allument aussi
      surAllumer: slug => { const siens = slug ? new Set(TROUPE.spectacles(slug).map(s => s.slug)) : null;
        sps.forEach(b => b.classList.toggle('est-allume', !!siens && siens.has(b.dataset.troupeSpectacle))); },
      surChoix: (slug, o) => { if (!o.groupe) { epingle = null; sps.forEach(b => b.setAttribute('aria-pressed', 'false')); } },
    });
    // un spectacle survolé ou focalisé allume son équipe ; choisi, il la garde allumée
    const equipe = b => TROUPE.equipe(b.dataset.troupeSpectacle);
    sps.forEach(b => {
      const montrer = () => ctl.allumerGroupe(equipe(b)), cacher = () => ctl.eteindre();
      // la souris survole, le clavier focalise ; le doigt choisit (le clic), sans allumer ni éteindre en passant
      b.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') montrer(); }); b.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') cacher(); });
      b.addEventListener('focus', () => { if (b.matches(':focus-visible')) montrer(); }); b.addEventListener('blur', cacher);
      // choisi : le bouton se voit enfoncé à l'image suivante, l'équipe s'allume juste après (le geste n'attend pas)
      b.addEventListener('click', () => { const e = epingle = epingle === b.dataset.troupeSpectacle ? null : b.dataset.troupeSpectacle;
        sps.forEach(x => x.setAttribute('aria-pressed', String(x.dataset.troupeSpectacle === e)));
        ctl.apresImage(() => { if (epingle !== e) return;
          // au téléphone, la bande défile : le spectacle choisi s'y montre en entier
          const ul = b.closest('.tr-sp');
          if (e && ul && ul.scrollWidth > ul.clientWidth + 1) {
            const r = b.getBoundingClientRect(), u = ul.getBoundingClientRect(), m = 16;
            const dx = r.left < u.left + m ? r.left - u.left - m : r.right > u.right - m ? r.right - u.right + m : 0;
            if (dx) ul.scrollBy({ left: dx, behavior: motionOK() ? 'smooth' : 'instant' });
          }
          ctl.choisirGroupe(e ? equipe(b) : null); }); });
    });
    // les icônes s'animent une fois à leur arrivée dans l'écran
    if (motionOK() && 'IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { io.unobserve(x.target); x.target.classList.add('est-vivant'); setTimeout(() => x.target.classList.remove('est-vivant'), 1600); } }), { rootMargin: '0px 0px -12% 0px' });
      $$('.troupe-icone', tr).forEach(i => io.observe(i));
    }
    // une photo qui ne se charge pas (le fichier manque) : sa place garde le nom seul, avec une ventouse, sans rien
    // déplacer (une vignette seulement s'il y a une photo) ; les prochains rendus la savent absente
    tr.addEventListener('error', e => {
      const i = e.target; if (!i || !i.matches || !i.matches('img[data-troupe-photo]')) return;
      photosEchec.add(i.getAttribute('src'));
      const a = i.closest('[data-troupe-ancre]');
      if (a) a.className = 'tr-ventouse';
      i.remove();
    }, true);
    // les bras : mesurés après la mise en page, refaits quand la troupe change de taille
    let raf = 0;
    // (après l'image : celle qui dessine la troupe ne porte pas aussi le calcul des bras, décoratifs)
    const refaireBras = () => { if (raf) return; raf = requestAnimationFrame(() => setTimeout(() => { raf = 0; brasTroupe(tr); }, 0)); };
    if (troupeVue) troupeVue.disconnect();
    troupeVue = 'ResizeObserver' in window ? new ResizeObserver(refaireBras) : null;
    if (troupeVue) troupeVue.observe(tr); else refaireBras();
  }

  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
