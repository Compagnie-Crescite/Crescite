      barre: M.map(x => lien(x, false)).join(''),
      second: '',
      pied: `<div><p><strong${ed('site.coordonnees.nom')}>${esc(co.nom)}</strong></p><p>${co.adresse.map((x, i) => `<span${ed(`site.coordonnees.adresse.${i}`)}>${esc(x)}</span>`).join('<br>')}</p>
        <p class="liens"><a href="${S.ecrire.href}">${esc(S.ecrire.texte)}</a>${S.facebook ? (S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : `<span>${esc(S.facebook.texte)}</span>`) : ''}</p></div>
        <div><p${ed('site.partenaires')}>${S.partenaires}</p></div>
        <div><p class="petit">${co.legal.map((x, i) => `<span${ed(`site.coordonnees.legal.${i}`)}>${esc(x)}</span>`).join('<br>')}</p><p class="liens">${S.espacePro ? `<a href="#/espace-pro">${esc(S.espacePro.titre)}</a>` : ''}${S.liensLegaux.map(x => `<a href="${x.href}">${esc(x.texte)}</a>`).join('')}${typeof EDITION !== 'undefined' && L.modifierSite ? `<button type="button" class="modifier" data-modifier>${CRAYON}${esc(L.modifierSite)}</button>` : ''}</p></div>`,
    };
    // les couleurs des spectacles, et celles de la saison (règle 22 : le thème, relu dans D à chaque changement)
    const couleurs = couleursSp() + couleursSaison();
    const tout = JSON.stringify(parts) + S.titreSuffixe + L.menu + couleurs;
    if (tout === cadreFait) return;
    cadreFait = tout;
    feuilleSp.textContent = couleurs;
    $('#marque').innerHTML = D.logo.mark;
    $('#nom').textContent = S.titreSuffixe;
    $('.marque').setAttribute('aria-label', S.titreSuffixe);
    $('#menu-t').textContent = L.menu;
    $('#second').setAttribute('aria-label', L.menu);
    $('#entrees').innerHTML = parts.entrees;
    $('#barre').innerHTML = parts.barre;
    $('#second').innerHTML = parts.second;
    $('#top').classList.toggle('sans-second', !parts.second);   // (sans menu second, ni lui ni le bouton « Menu »)
    $('#pied').innerHTML = parts.pied;
    ajuste();
  }
  // le texte entier des entrées si la place le permet, sinon le court ; puis le menu second replié
  function ajuste() {
    const top = $('#top'), inn = $('.top-in', top);
    top.classList.remove('serre', 'replie', 'compact');
    if (matchMedia('(max-width: 759px)').matches) return;
    for (const c of ['serre', 'replie', 'compact']) { if (inn.scrollWidth <= inn.clientWidth + 1) break; top.classList.add(c); }
  }
  // l'élément du menu de la vue porte aria-current="page" ; celui dont elle dépend est mis en évidence (« true ») : les
  // spectacles pour la page d'un spectacle, l'espace pro pour ses deux pages (menuLu)
  function marquerNav(r) {
    const lu = r.menuLu || (vue === 'spectacle' ? 'spectacles' : null);
    $$('#entrees a, #barre a, #second a').forEach(a => { a.removeAttribute('aria-current');
      if (r.menu && a.dataset.id === r.menu) a.setAttribute('aria-current', 'page'); else if (lu && a.dataset.id === lu) a.setAttribute('aria-current', 'true'); });
  }

  /* ---------- la navigation : les adresses, les redirections, la mémoire de l'entrée ---------- */
  let courant = null;
  function analyse() {
    const h = location.hash;
    if (h && !h.startsWith('#/')) return null;   // « #main » : le lien d'évitement
    const [chemin, qs] = h.replace(/^#\/?/, '').split('?');
    return { chemin: (chemin || '').replace(/\/+$/, ''), qs: qs || '', q: new URLSearchParams(qs || '') };
  }
  function rendre(a, surPlace) {
    const { chemin, q } = a; let m;
    frises.forEach(f => f.detruire()); frises = [];
    lecteurs.forEach(io => io.disconnect()); lecteurs = [];
    secs = []; chaps = []; ecrans = []; dfM = null; surPlaceRendu = !!surPlace;
    // la scène de l'accueil s'arrête en le quittant (refait en place, l'accueil la garde telle quelle)
    if (!(surPlace && vue === 'accueil')) Scene.montrer(false);
    try {
      if ((m = chemin.match(/^spectacle\/([\w-]+)\/(voir|programmer|etablissement)$/)) && bySlug[m[1]]) return entreeSp(m[1], m[2]) === m[2] ? spectacle(m[1], m[2], surPlace, q) : null;
      // la page unique d'un spectacle qui n'est plus en tournée (règle 21)
      if ((m = chemin.match(/^spectacle\/([\w-]+)$/)) && fini(bySlug[m[1]])) return spectacle(m[1], null, surPlace, q);
      // une saison passée (#/saisons/<saison>) : la page des saisons, cette saison ouverte et amenée à l'écran (la saison en
      // cours est la page des saisons elle-même)
      if ((m = chemin.match(/^saisons\/([\d-]+)$/)) && D.saisons[m[1]] && m[1] !== D.saison) return Object.assign(voir(q, surPlace, m[1]), { menu: 'saisons', entree: null, lecture: 'voir' });
      if (S.legal && S.legal[chemin]) return legal(chemin);
      const V = vues();
      if (Object.prototype.hasOwnProperty.call(V, chemin)) return V[chemin](q, surPlace);
      return null;
    } finally { surPlaceRendu = false; }
  }
  // les vues simples ; une vue l'emporte sur une redirection de D (#/espace-pro, autrefois redirigé, est une page). Le
  // menu par les saisons (règle 21) : #/saisons (la saison en cours, ses dates, les saisons passées ; #/saisons/<saison> en
  // ouvre une), #/espace-pro et ses deux pages, « Je souhaite programmer » et « Je représente un établissement scolaire »
  // (l'élément « Espace pro » du menu y est « true ») ; les anciennes adresses (#/voir, #/programmer, #/etablissement…)
  // suivent D.site.redirections
  const sousMenu = (f, menu, menuLu) => (q, surPlace) => Object.assign(f(q, surPlace), menu ? { menu, entree: null, lecture: 'voir' } : { menuLu });
  const vues = () => Object.assign({ '': accueil, saisons: sousMenu(voir, 'saisons'), 'espace-pro/programmer': sousMenu(programmer, null, 'espace-pro'),
    'espace-pro/etablissement': sousMenu(etablissement, null, 'espace-pro'), spectacles, compagnie, contact }, S.espacePro ? { 'espace-pro': espacePro } : {});
  // les filets se tracent, les titres montent, les fiches arrivent l'une après l'autre, les chiffres comptent ; posé avant
  // toute lecture de mise en page (le focus du titre en force une : une seule, sur la page finie)
  function decorer(surPlace) {
    $$('section.bloc:not(.sans-filet)', main).forEach(sec => { if (!sec.querySelector(':scope > .filet')) sec.insertAdjacentHTML('afterbegin', '<span class="filet" data-mv="trace" aria-hidden="true"></span>'); });
    $$('.titre-bloc, .u-eti, .rubrique, .u-h2:not(.ecrit)', main).forEach(e => { if (!e.closest('[data-mv]')) e.setAttribute('data-mv', 'monte'); });
    $$('.fus, .ep-cat, .acs, .u-cast, .dos-ateliers, .galerie, .ep-pages, .ep-portes', main).forEach(e => e.setAttribute('data-mv', 'cascade'));
    $$('.u-faits .gros, .fp-rep .gros, .u-rep .gros', main).forEach(e => e.setAttribute('data-mv', 'compte'));
    if (MV) MV.reveler(main, { immediat: surPlace });
  }
  function apres(surPlace) {
    ecrire(surPlace);
    requestAnimationFrame(() => { echelle(); defile(); });
  }
  // la transition d'une page : son genre (un spectacle, un onglet du même spectacle, une entrée, le retour, une page) et
  // l'élément partagé (la carte ou la porte cliquée ; sinon l'en-tête de la page qu'on quitte, qui revient à sa carte)
  const pile = [];
  let dernierClic = null;
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (a) dernierClic = { el: a.closest('[data-mv-nom]'), t: performance.now() }; }, { capture: true, passive: true });
  function genre(a) {
    const h = '#/' + a.chemin, retour = pile.length > 1 && pile[pile.length - 2] === h;
    if (retour) pile.pop(); else if (pile[pile.length - 1] !== h) pile.push(h);
    if (pile.length > 60) pile.splice(0, pile.length - 60);
    const sp = a.chemin.match(/^spectacle\/([\w-]+)(?:\/|$)/);
    if (sp && courant && courant.chemin.startsWith(`spectacle/${sp[1]}/`)) return 'onglet';
    if (retour) return 'retour';
    if (sp) return 'spectacle';
    return E[a.chemin] ? 'entree' : 'page';
  }
  function route() {
    lire();
    const a = analyse(); if (!a) return;
    let m;
    const cible = S.redirections && S.redirections['#/' + a.chemin];
    if (cible && !Object.prototype.hasOwnProperty.call(vues(), a.chemin)) { location.replace(cible + (a.qs ? '?' + a.qs : '')); return; }
    // un spectacle qui n'est plus en tournée n'a qu'une page, #/spectacle/<slug> : ses anciens onglets y mènent (la mémoire de
    // l'entrée ne s'y applique pas) ; les autres, sans onglet nommé, ouvrent celui de l'entrée retenue
    if ((m = a.chemin.match(/^spectacle\/([\w-]+)\/(voir|programmer|etablissement)$/)) && fini(bySlug[m[1]])) { location.replace(`#/spectacle/${m[1]}`); return; }
    if ((m = a.chemin.match(/^spectacle\/([\w-]+)$/)) && bySlug[m[1]] && !fini(bySlug[m[1]])) { location.replace(`#/spectacle/${m[1]}/${entreeSp(m[1], retenue() || 'voir')}`); return; }
    if ((m = a.chemin.match(/^spectacle\/([\w-]+)\/etablissement$/)) && bySlug[m[1]] && !bySlug[m[1]].actionCulturelle) { location.replace(`#/spectacle/${m[1]}/voir`); return; }
    // les saisons : #/agenda/<saison> mène à #/saisons/<saison>, et la saison en cours à la page des saisons
    const saisons = (menuDe('saisons') || {}).href || '#/saisons';
    if ((m = a.chemin.match(/^agenda\/([\d-]+)$/))) { location.replace(m[1] === D.saison ? saisons : `${saisons}/${m[1]}`); return; }
    if ((m = a.chemin.match(/^saisons\/([\d-]+)$/)) && m[1] === D.saison) { location.replace(saisons); return; }
    const type = genre(a), clic = dernierClic && performance.now() - dernierClic.t < 1200 ? dernierClic : null;
    dernierClic = null;
    const depuis = (clic && clic.el) || $('.mv-principal[data-mv-nom]', main);
    const courantAvant = courant;
    const faire = () => {
      document.documentElement.classList.remove(vers0);
      cadre(); fermerMenu();
      let r = rendre(a, false), b = a;
      if (!r) { history.replaceState(null, '', '#/'); b = { chemin: '', qs: '', q: new URLSearchParams() }; r = rendre(b, false); }   // une adresse inconnue mène à l'accueil
      courant = b;
      decorer(false);
      document.title = `${r.titre} - ${S.titreSuffixe}`;
      marquerNav(r);
      mettreAJourSchemaOrg();
      // la vue remonte en haut et son titre prend le focus à l'image suivante (avant qu'elle soit peinte) : la mise en page
      // se fait alors une seule fois, dans la tâche de l'image, et non en plus du rendu
      requestAnimationFrame(() => {
        // (#/saisons/<saison> : la saison ouverte est amenée à l'écran, et son en-tête prend le focus)
        const x = r.ancre && document.getElementById(r.ancre);
        if (x) { x.scrollIntoView({ block: 'start', behavior: 'instant' }); ($('summary', x) || x).focus({ preventScroll: true }); return; }
        scrollTo({ top: 0, left: 0, behavior: 'instant' });
        ($('h1[tabindex="-1"]', main) || main).focus({ preventScroll: true });
      });
      apres(false);
      if (courantAvant) entrer(type);
    };
    // la première vue (et sous l'ouverture) sans transition ; ensuite, la page pousse (MOUVEMENT.transition)
    const premiere = !courant;
    if (premiere || !MV || INTRO.ouverte()) faire(); else MV.transition(faire, { type, depuis });
    if (premiere) preparer();
  }
  // la page qui pousse : <main> monte de 12 px (descend, au retour) ; avec un élément partagé, elle paraît autour de lui
  let entreeMain = null;
  function entrer(type) {
    if (!motionOK() || !main.animate) return;
    if (entreeMain) entreeMain.cancel();
    const fondu = type === 'spectacle' || type === 'entree';
    entreeMain = main.animate(fondu ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: `translateY(${type === 'retour' ? -12 : 12}px)` }, { transform: 'none' }],
      { duration: fondu ? 240 : 260, delay: fondu ? 60 : 0, easing: 'cubic-bezier(.2, .7, .2, 1)', fill: 'backwards' });
  }
  // pendant les temps morts, les calculs coûteux des autres vues sont faits d'avance (et refaits si D change)
  function preparer() {
    const plus_tard = f => ('requestIdleCallback' in window ? requestIdleCallback(f, { timeout: 2000 }) : setTimeout(f, 300));
    plus_tard(() => retenu('agendaPasse', agendaPasse));
    plus_tard(() => { const lieux = retenu('tout', () => CARTE.tout()); retenu(`carte-tout-${motionOK()}`, () => carte({ lieux, titre: L.lieuxDiffusion, classe: 'tout', simple: true, fin: .5 })); });
  }
  // D a changé (la base de la compagnie) : la vue courante se refait en place, sans remonter, sans voler le focus,
  // sans rejouer l'ouverture ni les animations d'entrée
  function refaire() {
    if (!courant) return;
    versionD++;
    lire();
    // une vidéo chargée (règle 18) : la vue ne se refait pas sous elle (elle s'arrêterait) ; la page suivante lira D à jour
    if (LC && LC.actif()) return;
    const y = scrollY, act = document.activeElement;
    const focusables = () => $$('a[href], button, input, textarea, select, summary, [tabindex]', main);
    const dans = act && act !== main && main.contains(act);
    const repere = dans ? (act.id ? { id: act.id } : { i: focusables().indexOf(act) }) : null;
    const sel = dans && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const ouverts = $$('details[open]', main).map(d => $$('details', main).indexOf(d));
    document.documentElement.classList.add(vers0);
    cadre();
    const r = rendre(courant, true);
    if (!r) { route(); return; }
    decorer(true);
    document.title = `${r.titre} - ${S.titreSuffixe}`;
    marquerNav(r);
    mettreAJourSchemaOrg();
    ouverts.forEach(i => { const d = $$('details', main)[i]; if (d) d.open = true; });
    scrollTo({ top: y, left: 0, behavior: 'instant' });
    if (repere) { const el = repere.id ? document.getElementById(repere.id) : focusables()[repere.i];
      if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* champ sans sélection */ } } } }
    apres(true);
  }

  const fermerMenu = () => { $('#top').classList.remove('ouvert'); $('.menu').setAttribute('aria-expanded', 'false'); };
  $('.menu').addEventListener('click', e => { const o = $('#top').classList.toggle('ouvert'); e.currentTarget.setAttribute('aria-expanded', String(o)); if (o && MV) MV.cascade($('#second'), { pas: 30 }); });
  $('#second').addEventListener('click', e => { if (e.target.closest('a')) fermerMenu(); });
  // « Modifier le site » : la connexion puis l'édition sur place (EDITION, commun aux maquettes)
  $('#pied').addEventListener('click', e => { if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') EDITION.ouvrir(); });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#top').classList.contains('ouvert')) { fermerMenu(); $('.menu').focus(); }
    const l = $('#som-l'); if (l && !l.hidden) { fermerSommaire(); $('.som-b').focus(); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('#top')) fermerMenu(); if (!e.target.closest('.som')) fermerSommaire(); });
  $('.evitement').addEventListener('click', e => { e.preventDefault(); main.focus(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ajuste(); echelle(); });

  // les tentacules : plus aucune réaction aux gestes (règle 15) ; un seul moment, quand le dossier PDF d'un spectacle est
  // prêt : la tentacule, magenta et ponctuée de ventouses comme les bras de la carte, s'enroule autour du bouton
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'ventouses', entrees: 'couleur', clic: false, pages: false });
  // la pression : la pièce pressée s'enfonce d'un rien, dès le pointerdown
  if (MV) MV.presse(document);
  lire();
  cadre();
  document.body.insertAdjacentHTML('beforeend', `<svg class="defs" aria-hidden="true" focusable="false"><defs><path id="fr" d="${CARTE.fond.pays}"/></defs></svg>`);
  addEventListener('hashchange', route);
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(refaire);
  // l'ouverture de la 04, aux couleurs de la saison : le logo blanc sur le dégradé de la saison (calculé depuis
  // D.site.couleurSaison, plus profond la nuit) ; au geste, il ne grossit plus : il devient la pieuvre du premier écran (il
  // glisse à sa place, Scene.cible), puis ses bras vont chercher les spectacles (Scene.eveiller). Sans mouvement : un fondu
  const thO = themeSaison(), gO = typeof THEME !== 'undefined' && THEME.actuel() === 'nuit' ? thO.nuit : thO.jour;
  INTRO.ouvrir({
    degrade: [[0, gO[0]], [.55, gO[1]], [1, gO[2]]], encre: '#ffffff', classe: 'intro-synthese',
    sortie: motionOK() ? undefined : 'fondu', devient: () => Scene.cible(),
    apres: () => Scene.eveiller(),
  });
  route();
})();
</script>
</body>
