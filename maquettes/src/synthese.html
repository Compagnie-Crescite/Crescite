<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compagnie Crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,500&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Raleway:wght@600;700&family=Space+Grotesk:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Bodoni+Moda:wght@700&family=Anton&family=Grenze+Gotisch:wght@600&family=IM+Fell+English:ital@0;1&family=IM+Fell+French+Canon:ital@0;1&display=swap">
<style>
/* La synthèse : l'accueil et les cartes de la 06 (la tentacule comme thème), l'agenda de la 03 relié à la carte, les
   trois entrées nées des portes de la 04, et pour chaque spectacle un univers de compagnie (le dossier scolaire de
   Bérénice, les pages d'adrienvada.fr) où revient l'effet de la 10. Tout le texte visible vient de D, tel quel. */
:root {
  --papier: #f6f2eb; --papier-2: #ece5da; --carte: #e4dccf; --encre: #1d1418; --gris: #5f565a; --filet: #dcd3c6;
  --magenta: #bc3e80; --magenta-texte: #a3306b; --nuit: #1d1418; --blanc: #fffdf9; --magenta-vif: #bc3e80;
  /* les polices de la compagnie (celles de crescite.fr et de sa charte) : Ubuntu pour les titres, Open Sans pour le texte,
     Raleway pour les étiquettes en capitales espacées (--serif et --sans : leurs anciens noms, les titres et le texte) */
  --titre: "Ubuntu", system-ui, sans-serif; --texte: "Open Sans", system-ui, sans-serif; --etiq: "Raleway", "Open Sans", system-ui, sans-serif;
  --serif: var(--titre); --sans: var(--texte);
  --gout: clamp(16px, 4vw, 56px); --haut: 64px; --onglets: 0px;
  /* les tentacules (tentacules.js) : la pieuvre du logo guide ; ici elles ont la couleur et les ventouses des bras de la tournée */
  --tt-encre: #bc3e80; --tt-accent: #1d1418; --tt-neutre: #bc3e80; --tt-epaisseur: 2.4;
  /* l'édition sur place (EDITION) : la barre, la connexion et le panneau des dates sur le papier de la synthèse */
  --ed-fond: #fffdf9; --ed-encre: #1d1418; --ed-accent: #bc3e80; --ed-sur-accent: #ffffff;
  --ed-police: "Open Sans", system-ui, sans-serif; --ed-rayon: 10px; --ed-trait: #dcd3c6;
}
/* ———— la nuit (règle 19, THEME) : la salle quand la lumière baisse ————
   Le même papier, retourné : une aubergine presque noire, l'encre claire et chaude, la magenta de la compagnie (assez
   sombre pour porter un texte blanc, assez vive pour se lire sur la nuit), son texte plus clair ; la France devient une
   terre sombre où les bras gardent leurs couleurs. Les couleurs des spectacles s'éclaircissent (--sp-*, couleursSp), les
   univers clairs passent dans leur propre nuit (--un-*, uVars), les univers sombres restent eux-mêmes. AA partout :
   encre 15,8:1, gris 7,8:1, magenta-texte 7,3:1 sur le papier ; blanc sur magenta 4,7:1. */
html[data-theme="jour"] { color-scheme: light; }
html[data-theme="nuit"] {
  color-scheme: dark;
  --papier: #1b1117; --papier-2: #23171e; --carte: #2e2128; --encre: #f3eee9; --gris: #b7b0ae; --filet: #3b3036;
  --magenta: #c44386; --magenta-texte: #f07ab6; --nuit: #0f090d; --blanc: #24181f; --magenta-vif: #e0559a;
  --tt-encre: #e0559a; --tt-accent: #f2eae4; --tt-neutre: #e0559a;
  --ed-fond: #24181f; --ed-encre: #f3eee9; --ed-accent: #e0559a; --ed-sur-accent: #1b1117; --ed-trait: #3e3138;
}
html[data-theme="nuit"] .evitement { background: var(--blanc); color: var(--encre); }
html[data-theme="nuit"] .champ input, html[data-theme="nuit"] .champ textarea, html[data-theme="nuit"] .calcul input { background: var(--blanc); }
html[data-theme="nuit"] footer { border-top: 1px solid var(--filet); }
/* ce qui s'écrit dans la couleur d'une entrée prend sa couleur vive (la sombre ne se lirait pas sur la nuit) */
html[data-theme="nuit"] .ct-k { color: var(--ev, var(--magenta-texte)); }
html[data-theme="nuit"] .et-rac button:hover { border-color: var(--ev); color: var(--ev); }
/* les fiches des spectacles se détachent de la nuit par un filet de leur univers */
html[data-theme="nuit"] .fu, html[data-theme="nuit"] .fp, html[data-theme="nuit"] .ac, html[data-theme="nuit"] .dos-appel { box-shadow: 0 0 0 1px color-mix(in srgb, var(--u-texte) 16%, transparent), 0 24px 44px -28px #000; }
/* les univers clairs dans leur nuit (leurs couleurs de D, retournées) ; ce qui reste sur papier blanc garde l'encre du jour */
html[data-theme="nuit"] .u.u-clair { --u-fond: var(--un-fond) !important; --u-fond2: var(--un-fond2) !important; --u-texte: var(--un-texte) !important;
  --u-texte2: var(--un-texte2) !important; --u-vif: var(--un-vif) !important; }
html[data-theme="nuit"] .u-arene .u-onglets { background: color-mix(in srgb, var(--u-fond) 90%, transparent); }
/* dans la nuit d'un univers clair, ce qui s'écrivait dans son accent (le rouge de Bérénice) prend sa couleur vive (le
   saumon), qui se lit sur le fond sombre ; les aplats gardent l'accent, et les feuilles blanches leurs encres du jour */
html[data-theme="nuit"] .u.u-clair { --ac: var(--u-vif); }
html[data-theme="nuit"] .u-arene .chap-t,
html[data-theme="nuit"] .u-arene .u-affirm,
html[data-theme="nuit"] .u-arene .sp-cit p,
html[data-theme="nuit"] .u-arene .u-ac-type,
html[data-theme="nuit"] .u-arene .u-avec,
html[data-theme="nuit"] .u-arene :is(.suivant b),   /* (le lien vers le spectacle suivant porte lui-même son univers) */
html[data-theme="nuit"] .u-arene .fu-t,
html[data-theme="nuit"] .u-arene .dos-h3,
html[data-theme="nuit"] .u-arene .dos-h4,
html[data-theme="nuit"] .u-arene .dos-fiche dt,
html[data-theme="nuit"] .u-arene .dos-fiche-t { color: var(--u-vif); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--haut) + 16px); }
body { margin: 0; background: var(--papier); color: var(--encre); font: 400 1.0625rem/1.6 var(--sans); }
main { display: block; overflow-x: clip; min-height: 100svh; }   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas */
a { color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.evitement { position: absolute; left: 8px; top: -80px; z-index: 80; background: #fff; padding: 8px 14px; border-radius: 6px; }
.evitement:focus { top: 8px; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 var(--gout); }
[hidden] { display: none !important; }

/* le motif : une onde qui s'enroule au bout, sous les titres ; elle se dessine à l'arrivée */
.trait { display: block; width: 92px; height: 16px; margin-top: 10px; overflow: visible; }
.trait path { fill: none; stroke: var(--c, var(--saison-texte)); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }
.page-titre .trait path, .une .trait path, .et .trait path { animation: dessine 1.1s .15s cubic-bezier(.45, 0, .2, 1) both; }
@keyframes dessine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* ———— l'en-tête : le menu de la 05 ————
   Sur l'aplat de la saison (règle 22), la marque (la pieuvre blanche) et le menu, toute la navigation première, en quatre
   pièces de capitales espacées (les saisons, les spectacles, la compagnie, l'espace pro) : la pièce de la vue est un aplat
   blanc, celle dont on lit une page (un spectacle, une page de l'espace pro) un cadre. Au téléphone, la même barre en bas de
   l'écran, sur la saison profonde, leurs noms courts. */
.top { position: sticky; top: 0; z-index: 40; background: var(--saison); color: #fff; --focus: #fff; box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.top-in { display: flex; align-items: center; gap: 18px; height: var(--haut); padding: 0 clamp(16px, 2vw, 32px); overflow: hidden; }
.marque { flex: none; display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font: 700 1.15rem/1 var(--titre); letter-spacing: .01em; }
.marque .l { display: block; width: 40px; }
.marque svg { width: 100%; height: auto; display: block; }
.entrees { flex: none; display: flex; align-items: stretch; gap: 6px; margin-left: auto; }
.entrees a { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 16px 8px 13px; border: 2px solid transparent; border-radius: 22px; color: #fff; text-decoration: none; font: 700 .8rem/1.15 var(--etiq); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.entrees .pt, .barre .pt { flex: none; width: 9px; height: 9px; border-radius: 50%; background: currentColor; opacity: .45; box-shadow: 0 0 0 2px currentColor; transition: opacity .2s; }
.entrees a:hover { background: rgba(255, 255, 255, .13); }
.entrees a:hover .pt, .entrees a[aria-current] .pt { opacity: 1; }
.entrees a[aria-current="page"] { background: #fff; color: var(--saison); }
.entrees a[aria-current="true"] { border-color: #fff; }
.entrees .court { display: none; }
.top.serre .entrees .long { display: none; }
.top.serre .entrees .court { display: inline; }
.second { flex: none; display: flex; align-items: center; gap: 2px; padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, .3); }
.second a { padding: 6px 9px; color: rgba(255, 255, 255, .85); text-decoration: none; font: 600 .85rem/1.2 var(--texte); white-space: nowrap; }
.second a:hover { color: #fff; }
.second a[aria-current="page"] { color: #fff; box-shadow: inset 0 -2px 0 #fff; }
.menu { display: none; flex: none; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 999px; background: none; color: #fff; font: 700 .8rem var(--etiq); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.menu svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.top.replie .menu { display: inline-flex; }
.top.replie .second { display: none; position: absolute; right: clamp(16px, 2vw, 32px); top: calc(var(--haut) - 6px); flex-direction: column; align-items: stretch; min-width: 220px; padding: 8px; border: 1px solid var(--filet); border-radius: 12px; background: var(--papier); box-shadow: 0 18px 40px rgba(0, 0, 0, .4); }
.top.replie.ouvert .second { display: flex; }
.top.replie .second a { padding: 11px 12px; border-radius: 8px; font-size: 1rem; color: var(--encre); }
.top.replie .second a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--saison-vive); }
.top.compact .top-in { gap: 10px; }
.top.compact #nom { display: none; }
.top.compact .entrees a { padding: 8px 12px 8px 10px; gap: 8px; font-size: .74rem; }
/* au téléphone : les quatre pièces dans une barre fixe en bas, toujours à portée, sur la saison profonde */
.barre { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; gap: 6px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--saison) 78%, #000); color: #fff; box-shadow: 0 -10px 26px rgba(0, 0, 0, .3); }
.barre a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 56px; padding: 6px 4px; border: 2px solid transparent; border-radius: 14px; color: #fff; text-decoration: none; text-align: center; font: 700 .64rem/1.15 var(--etiq); letter-spacing: .06em; text-transform: uppercase; }
.barre .pt { width: 8px; height: 8px; }
.barre a[aria-current] .pt { opacity: 1; }
.barre a[aria-current="page"] { background: #fff; color: var(--saison); }
.barre a[aria-current="true"] { border-color: #fff; }
/* le menu par les saisons (règle 21) est toute la navigation : sans menu second, ni lui ni le bouton « Menu » */
.top.sans-second .second, .top.sans-second .menu { display: none !important; }

/* ———— blocs communs ———— */
section.bloc { padding: clamp(48px, 7vw, 96px) 0; border-top: 1px solid var(--filet); }
section.bloc.sans-filet { border-top: 0; padding-top: clamp(28px, 4vw, 48px); }
.page-titre { padding-top: clamp(36px, 5vw, 64px); padding-bottom: clamp(24px, 3vw, 40px); }
.page-titre h1 { margin: 0; font: 500 clamp(2.4rem, 1.6rem + 2.6vw, 3.6rem)/1.05 var(--titre); text-wrap: balance; }
.page-titre .trait { width: 120px; height: 20px; margin-top: 14px; }
.surtitre { margin: 0 0 14px; font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.surtitre a { text-decoration: none; }
.surtitre a:hover { color: var(--magenta-texte); }
.titre-bloc { margin: 0 0 30px; font: 500 clamp(2rem, 1.4rem + 1.8vw, 2.8rem)/1.05 var(--titre); text-wrap: balance; }
.rubrique { margin: 28px 0 10px; font: 600 .78rem/1.3 var(--etiq); letter-spacing: .09em; text-transform: uppercase; color: var(--magenta-texte); }
.bouton { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; background: var(--encre); color: var(--papier); border: 1.5px solid var(--encre); text-decoration: none; font: 600 .97rem var(--sans); cursor: pointer; }
.bouton.second-b { background: transparent; color: var(--encre); }
.bouton:hover { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.bouton.e { background: var(--ec); border-color: var(--ec); color: #fff; }
.bouton.e:hover { background: var(--encre); border-color: var(--encre); }
.bouton.grand { padding: 15px 28px; font-size: 1.08rem; }
.boutons { display: flex; gap: 10px; flex-wrap: wrap; margin: 0; }
.fleche { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.plein-ico { fill: currentColor; stroke: none; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font: normal 600 .66rem/1.5 var(--etiq); letter-spacing: .08em; text-transform: uppercase; vertical-align: .12em; }

/* ———— la carte des tournées : des bras effilés qui poussent depuis Rouen, une spirale au bout ———— */
.carte { display: block; width: 100%; height: auto; overflow: visible; }
/* la carte paraît d'un fondu (une couche, composée par la carte graphique) ; ses bras masqués poussent depuis Rouen */
.carte:not(.pousse) { opacity: 0; }
.carte.pousse { transition: opacity .45s var(--mv-courbe); }
/* (la grande carte du bilan d'un spectacle, règle 21, se voit d'emblée, la France et Rouen ; ses bras poussent à l'écran) */
.carte.bilan:not(.pousse) { opacity: 1; }
.carte .pays { fill: var(--carte); }
.carte .voisin { fill: var(--papier-2); }
.carte .encart { fill: none; stroke: var(--gris); stroke-opacity: .5; stroke-dasharray: 3 4; }
.carte.serre { overflow: hidden; }
.carte .passe path { fill: none; stroke: color-mix(in srgb, var(--encre) 22%, transparent); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.carte .bras-trait { fill: none; stroke: var(--kc, var(--saison-texte)); stroke-width: 1.3px; vector-effect: non-scaling-stroke; stroke-linecap: round; opacity: .85; }
.carte .m { fill: none; stroke: #fff; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s cubic-bezier(.45, 0, .2, 1) var(--d, 0s); }
.carte.pousse .m { stroke-dashoffset: 0; }
.carte .bras { fill: var(--kc, var(--saison-texte)); }
.carte .bout { fill: none; stroke: var(--kc, var(--saison-texte)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s ease-out calc(var(--d, 0s) + .7s); }
.carte.pousse .bout { stroke-dashoffset: 0; }
.carte .point { fill: var(--kc, var(--saison-texte)); stroke: var(--papier); stroke-width: 1.2; opacity: 0; transition: opacity .3s calc(var(--d, 0s) + .6s); }
.carte.pousse .point { opacity: 1; }
/* une carte de beaucoup de communes : ses points paraissent avec elle (un seul fondu composé), pas un par un */
.carte.simple .point { opacity: 1; transition: none; }
.carte .cible { fill: transparent; }
.carte .carte-lieu { cursor: pointer; outline: none; transition: opacity .18s; }
.carte .carte-lieu:focus-visible .point { stroke: var(--encre); stroke-width: 2.6; }
.carte .carte-lieu.eteint { opacity: .12; }
.carte.surligne .carte-lieu:not(.on) { opacity: .18; }
.carte .rouen { fill: var(--encre); }
.carte .rouen-nom, .carte .nom { font: 500 calc(16px * var(--k, 1)) var(--titre); fill: var(--encre); paint-order: stroke; stroke: var(--papier); stroke-width: calc(4px * var(--k, 1)); stroke-linejoin: round; }
.carte .nom { display: none; font: 600 calc(13px * var(--k, 1)) var(--sans); }
/* (« Rouen » un peu à l'écart de son point, qui bat quand la carte attend : la même distance à l'écran, quelle que soit la
   taille de la carte) */
.carte .rouen-nom { transform: translate(calc(4px * var(--k, 1)), calc(-3px * var(--k, 1))); }
.carte .nom.on { display: inline; }
.carte.attente .rouen { transform-box: fill-box; transform-origin: center; animation: battement 2.2s ease-in-out infinite; }
@keyframes battement { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.9); } }
.carte.tout .point { stroke-width: .8; }
.bulle { position: absolute; left: 0; bottom: 3%; max-width: min(340px, 52%); margin: 0; padding: 10px 14px; background: color-mix(in srgb, var(--blanc) 95%, transparent); border: 1px solid var(--filet); border-left: 3px solid var(--magenta); font-size: .88rem; line-height: 1.4; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.bulle.on { opacity: 1; transform: none; }
.bulle b { display: block; font: 500 1.15rem var(--titre); }
.bulle ul { list-style: none; margin: 4px 0 0; padding: 0; }
.bulle li { display: flex; flex-wrap: wrap; gap: 0 8px; }
.bulle .t { font-weight: 600; }

/* ———— l'accueil, composé par le client : l'ouverture de la 04 devient la pieuvre de la 10, puis le menu, puis les spectacles
   un par écran (les chapitres de la 09), chacun avec l'effet de son motif ; puis la saison sur la carte, les donateurs ————
   Les couleurs de la saison (règle 22) viennent de D.site.couleurSaison, écrites par le script (couleursSaison) : --saison
   (la couleur, qui porte la pieuvre blanche), --saison-vive, --saison-texte (lisible sur le papier, de jour comme de nuit) et
   la nuit bleue de la scène (--sc-a, --sc-b, --sc-c ; --sc-terne : le blanc atténué, qui reste AA, photo comprise). Rien
   n'est écrit en dur : une nouvelle création colore l'accueil sans toucher au code. Dans l'accueil, plus de magenta. */
.acc { --magenta: var(--saison-texte); --magenta-texte: var(--saison-texte); --magenta-vif: var(--saison-vive); }
.acc .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* le premier écran : la nuit bleue de la saison, la pieuvre au milieu (une toile), les titres autour ; derrière elle, à peine,
   les photos des spectacles qui s'enchaînent en fondu (celle du spectacle qu'on regarde passe devant) */
.scene { position: relative; isolation: isolate; overflow: hidden; min-height: calc(100svh - var(--haut)); color: #fff; user-select: none; -webkit-user-select: none;
  background: radial-gradient(78% 88% at 50% 40%, var(--sc-a) 0%, var(--sc-b) 58%, var(--sc-c) 100%); }
.scene.sur-bras { cursor: pointer; }
.sc-diapo { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.sc-cadre { position: sticky; top: var(--haut); height: calc(100svh - var(--haut)); max-height: 100%; overflow: hidden; }
.sc-image { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
.sc-image.est-vu { opacity: .22; }
.sc-image img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; filter: saturate(.8) brightness(.8); transform: scale(1.07); transition: transform 9s linear; }
.sc-image.est-vu img { transform: none; }
/* (les bords restent la nuit de la scène : les titres s'y lisent) */
.sc-cadre::after { content: ""; position: absolute; inset: 0; background: radial-gradient(72% 78% at 50% 44%, transparent 28%, color-mix(in srgb, var(--sc-c) 72%, transparent) 100%); }
.sc-toile { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.sc-h { position: relative; z-index: 2; margin: 0; padding: 26px var(--gout) 0; text-align: center; font: 600 .8rem/1.3 var(--etiq); letter-spacing: .32em; text-transform: uppercase; color: var(--sc-terne); }
.sc-pause { position: absolute; z-index: 4; right: var(--gout); top: 14px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1.5px solid color-mix(in srgb, #fff 60%, transparent); border-radius: 50%;
  background: color-mix(in srgb, var(--sc-c) 50%, transparent); color: #fff; cursor: pointer; }
.sc-pause:hover { border-color: #fff; }
.sc-pause:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.scene.mobile .sc-med { width: 32px; height: 32px; }
.scene.mobile .sc-q { opacity: 1; transform: none; max-width: calc(100vw - 92px); }
/* le menu (règle 21), sous la scène : les quatre éléments de D.site.menu, chacun son petit dessin ; l'onde se trace au survol */
.acc-menu { position: relative; padding: clamp(36px, 5.5vw, 76px) 0; background: var(--papier); border-bottom: 1px solid var(--filet); }
.am-liste { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 24px); }
.am-a { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; height: 100%; min-height: 210px; padding: 22px 22px 18px; border: 1px solid var(--filet); border-radius: 10px;
  background: var(--blanc); color: var(--encre); text-decoration: none; transition: border-color .18s, box-shadow .18s, scale .12s; }

.am-a:focus-visible { outline: 3px solid var(--saison-texte); outline-offset: 3px; }

@media (max-width: 1000px) { .am-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); } .am-a { min-height: 180px; } }
@media (max-width: 560px) {

  .am-vis { grid-area: vis; height: 58px; justify-content: center; align-items: center; }
  .am-t { grid-area: t; font-size: 1.6rem; } .am-a .trait { grid-area: trait; margin-top: 4px; }
  .am-pieuvre { width: 76px; } .am-portes, .am-dessin { width: 72px; height: 48px; } .am-pts { max-width: 80px; gap: 5px; } .am-pts i { width: 12px; height: 12px; }
}
/* les spectacles, un par écran, chacun dans son univers et pleine page : au bureau, épinglé, il prend la place du précédent
   (qui s'assombrit dessous) ; son motif joue son effet avec la lecture. --p : son arrivée, --r : sa lecture (épinglé),
   --q : recouvert par le suivant (0 → 1, posées par le script ; sans mouvement : arrivé, lu, jamais recouvert) */
.df-pile { position: relative; }
.df { --p: 1; --r: 1; --q: 0; --m: calc((var(--p) + var(--r)) / 2); --cx: 71%; --cy: 50%; --sens: 1;
  --bord: calc((100% - min(1240px, 100%)) / 2 + var(--gout) + min(36rem, (min(1240px, 100%) - 2 * var(--gout)) * .46));
  position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; min-height: calc(100svh - var(--haut)); font-family: var(--u-corps); }
.df[data-cote="droite"] { --cx: 29%; --sens: -1; }
.df-photo { position: absolute; inset: 0; z-index: -3; overflow: hidden; background: var(--u-fond2); }
.df-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%; transform-origin: var(--cx) 50%; transform: scale(calc(1.14 - var(--p) * .14)); }
.df[data-cote="droite"] .df-photo img { object-position: 38% 40%; }
/* (CADRAGE, règle 24 : la zone d'intérêt de la photo du côté libre, loin de la colonne de texte et de son voile) */
.df-photo img { --cadre-x: .71; --cadre-y: .5; }
.df[data-cote="droite"] .df-photo img { --cadre-x: .29; }
/* (le voile : uni sous toute la colonne de texte, --bord, pour que tout s'y lise, AA, quelle que soit la photo ; puis il s'efface) */
.df-photo::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--u-fond) 0, var(--u-fond) calc(var(--bord) + 16px), color-mix(in srgb, var(--u-fond) 70%, transparent) calc(var(--bord) + 7%), color-mix(in srgb, var(--u-fond) 25%, transparent) calc(var(--bord) + 16%), transparent calc(var(--bord) + 26%)),
    linear-gradient(0deg, color-mix(in srgb, var(--u-fond) 60%, transparent), transparent 32%); }
.df[data-cote="droite"] .df-photo::after { background: linear-gradient(270deg, var(--u-fond) 0, var(--u-fond) calc(var(--bord) + 16px), color-mix(in srgb, var(--u-fond) 70%, transparent) calc(var(--bord) + 7%), color-mix(in srgb, var(--u-fond) 25%, transparent) calc(var(--bord) + 16%), transparent calc(var(--bord) + 26%)),
    linear-gradient(0deg, color-mix(in srgb, var(--u-fond) 60%, transparent), transparent 32%); }
.df-effet { position: absolute; z-index: -2; left: var(--cx); top: var(--cy); translate: -50% -50%; pointer-events: none; color: var(--u-vif); }
.df-voile { position: absolute; inset: 0; z-index: 6; background: #000; opacity: calc(var(--q) * .55); pointer-events: none; }
.df-texte { position: relative; z-index: 1; width: 100%; padding-top: clamp(28px, 5vh, 64px); padding-bottom: clamp(28px, 5vh, 64px); }
.df-in { position: relative; width: min(36rem, 46%); }
.df[data-cote="droite"] .df-in { margin-left: auto; }
.df-in > * { --e: clamp(0, calc(var(--p) * 3.33 - 1.33 - var(--k, 0) * .2), 1); opacity: var(--e); transform: translateY(calc((1 - var(--e)) * 28px)); }
/* au clavier, l'écran du lien qui a le focus est arrivé tout entier, même avant que le script l'amène à sa place */
.df:has(:focus-visible) { --p: 1 !important; }
.df-sur { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0 0 clamp(10px, 2vh, 20px); font: 600 .76rem/1.4 var(--u-etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--u-vif); }
.df-lt { color: var(--u-texte2); }
.df-badge { padding: 2px 10px; border: 1px solid currentColor; border-radius: 999px; letter-spacing: .1em; }
.df-titre { position: relative; margin: 0; font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: clamp(2.2rem, min(5.4vw, 9.4vh), 5.8rem); line-height: .98; letter-spacing: -.01em; color: var(--u-texte); text-wrap: balance; }
.df-titre.long { font-size: clamp(1.9rem, min(3.9vw, 6.6vh), 4.2rem); }
.df-l { display: block; }
.u-arene .df-titre { text-transform: uppercase; color: var(--u-accent); }
html[data-theme="nuit"] .u-arene .df-titre { color: var(--u-vif); }
.df-acc { margin: clamp(12px, 2.2vh, 24px) 0 0; max-width: 34ch; font-size: clamp(1.05rem, min(1.45vw, 2.5vh), 1.4rem); line-height: 1.45; }
.df-dates { margin: clamp(16px, 3vh, 30px) 0 0; max-width: 30rem; }
.df-k { margin: 0 0 8px; font: 600 .72rem/1.3 var(--u-etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--u-vif); }
.df-liste { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--u-filet); }
.df-liste li { border-bottom: 1px solid var(--u-filet); }
.df-date { display: grid; grid-template-columns: 8.2rem minmax(0, 1fr); align-items: baseline; gap: 0 16px; padding: 8px 6px; color: inherit; text-decoration: none; transition: background .18s; }
a.df-date:hover { background: color-mix(in srgb, var(--u-vif) 13%, transparent); }
a.df-date:focus-visible { outline: 2px solid var(--u-vif); outline-offset: -2px; }
.df-q b { display: block; font: 600 1.12rem/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.df-q small { display: block; font-size: .82rem; color: var(--u-texte2); }
.df-o { font-size: .98rem; }
.df-o .tag { color: var(--u-vif); }
.df-annonce, .df-bilan { margin: 0; font-size: 1.05rem; line-height: 1.45; }
.df-bilan .gros { font-size: 1.7em; }
.df-cta { margin: clamp(16px, 3vh, 30px) 0 0; }
.df-cta .bu { letter-spacing: .06em; text-transform: uppercase; font-size: .86rem; }
.df-credit { position: absolute; z-index: 2; right: 12px; bottom: 10px; max-width: 60%; margin: 0; padding: 2px 8px; border-radius: 3px; background: color-mix(in srgb, var(--u-fond) 78%, transparent);
  font: 400 .72rem/1.4 var(--sans); color: var(--u-texte2); text-align: right; }
.df[data-cote="droite"] .df-credit { right: auto; left: 12px; text-align: left; }
/* les motifs de la 10, en grand, qui réagissent à la lecture (--m) : l'arène tourne, les jumeaux se rejoignent, les notes et le
   fil s'écrivent, le nez s'allonge, les aiguilles tournent, le curseur file de 1850 à 2077 */
.df-m { display: block; width: 100%; height: auto; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.df-m text { fill: currentColor; stroke: none; font: 600 17px var(--sans); letter-spacing: .04em; }
.df-m * { transform-box: view-box; }
.dm-tourne { transform-origin: 200px 200px; transform: rotate(calc(var(--m) * 150deg)); }
.dm-g { transform: translateX(calc(var(--m) * 14px)); }
.dm-d { transform: translateX(calc(var(--m) * -14px)); }
.dm-ecrit { stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--m)); }
.dm-nez { transform-origin: 114px 86px; transform: scale(calc(1 + var(--m) * .55), 1); }
.dm-heure { transform-origin: 120px 120px; transform: rotate(calc(-50deg + var(--m) * 90deg)); }
.dm-minute { transform-origin: 120px 120px; transform: rotate(calc(var(--m) * 720deg)); }
.dm-curseur { transform: translateX(calc(var(--m) * 1120px)); }
/* Bérénice, l'arène : la photo s'ouvre en cercle et l'arène tourne autour */
.df[data-motif="arene"] .df-photo::after { content: none; }
.df[data-motif="arene"] .df-photo { background: var(--u-fond); }
.df[data-motif="arene"] .df-photo img { clip-path: circle(calc(var(--p) * min(25vw, 37vh)) at var(--cx) 50%); }
.df[data-motif="arene"] .df-effet { width: calc(min(25vw, 37vh) * 2.36); opacity: calc(.15 + var(--p) * .85); color: var(--u-accent); }
html[data-theme="nuit"] .df[data-motif="arene"] .df-effet { color: var(--u-vif); }
.df-arene .gradin { stroke-width: 9; opacity: .4; }
/* Cléophène, les jumeaux : les deux moitiés de la photo se rejoignent ; deux couronnes */
.df[data-motif="jumeaux"] .df-photo img { clip-path: inset(0 50% 0 0); transform: translateX(calc((1 - var(--p)) * -12vw)) scale(calc(1.08 - var(--p) * .08)); }
.df[data-motif="jumeaux"] .df-photo .df-jumeau { clip-path: inset(0 0 0 50%); transform: translateX(calc((1 - var(--p)) * 12vw)) scale(calc(1.08 - var(--p) * .08)); }
.df[data-motif="jumeaux"] .df-effet { width: min(26vw, 40vh); opacity: calc(var(--p) * .55); }
/* L'imaginaire forcé, les annotations : le titre se souligne à la main (comme sur sa page, sans passer sur les lettres), les
   notes s'écrivent dans la marge */
.df-souligne { display: block; width: min(100%, 380px); height: 22px; margin: 8px 0 -6px -6px; overflow: visible; fill: none; stroke: var(--u-vif); stroke-width: 2.4; stroke-linecap: round; pointer-events: none; }
.df-souligne path { stroke-dasharray: 1; stroke-dashoffset: calc(1 - clamp(0, var(--p) * 1.6 - .5, 1)); }
.df[data-motif="annotations"] .df-effet { width: min(30vw, 46vh); opacity: .6; }
/* Mon Royaume, le paperboard : le texte est une feuille qui tombe du chevalet ; le feutre dessine */
.df[data-motif="paperboard"] .df-in { padding: clamp(26px, 4vh, 44px) clamp(22px, 3vw, 40px) clamp(22px, 3.4vh, 36px); background: #fffdf8 repeating-linear-gradient(transparent 0 2.25rem, #d7e3f4 2.25rem calc(2.25rem + 1px));
  border: 1px solid #d9d0bf; box-shadow: 0 26px 50px -26px rgba(20, 20, 50, .45); transform-origin: 50% 0; transform: perspective(1600px) rotateX(calc((1 - var(--p)) * -78deg)) rotate(-.5deg); }
.df[data-motif="paperboard"] .df-in::before { content: ""; position: absolute; left: 10%; right: 10%; top: -13px; height: 20px; border-radius: 6px; background: linear-gradient(#585d72, #353849); box-shadow: 0 3px 6px rgba(0, 0, 0, .25); }
.df[data-motif="paperboard"] .df-in > * { --e: clamp(0, calc(var(--p) * 3.33 - 1.9 - var(--k, 0) * .12), 1); }
html[data-theme="nuit"] .df[data-motif="paperboard"] .df-in { --u-texte: var(--uj-texte); --u-texte2: var(--uj-texte2); --u-vif: var(--uj-vif); --u-filet: color-mix(in srgb, var(--uj-texte) 15%, transparent); color: var(--u-texte); }
.df[data-motif="paperboard"] .df-effet { width: min(28vw, 44vh); opacity: .7; }
/* Ci-gisait Cyrano, le nez : la photo entre de profil, la lune se lève, le nez s'allonge */
.df[data-motif="nez"] .df-photo img { transform: translateX(calc((1 - var(--p)) * var(--sens) * 14%)) scale(calc(1.1 - var(--p) * .1)); }
.df[data-motif="nez"] .df-effet { width: min(30vw, 46vh); opacity: .75; color: var(--u-texte); }
.df-lune { position: absolute; z-index: -2; left: calc(var(--cx) + min(14vw, 22vh)); top: 12%; width: clamp(60px, 8vw, 120px); fill: var(--u-accent); opacity: .85; pointer-events: none; transform: translateY(calc((1 - var(--m)) * 34vh)); }
.df[data-cote="droite"] .df-lune { left: calc(var(--cx) - min(14vw, 22vh) - clamp(60px, 8vw, 120px)); }
/* La Folle Idée, l'horloge : le temps du huis clos, les aiguilles tournent avec la lecture */
.df[data-motif="horloge"] .df-effet { width: min(30vw, 50vh); opacity: .55; color: var(--u-accent); }
.df[data-motif="horloge"] .df-m { stroke-width: 2.2; }
/* Macbeth – Fatum, le fil rouge : il traverse l'écran, tiré par la lecture, et passe sous la colonne de texte (il s'efface
   avant elle : rien ne passe sous les lettres) */
.df-fil { inset: 0; left: 0; top: 0; translate: none; width: 100%; height: 100%;
  -webkit-mask-image: linear-gradient(90deg, transparent calc(var(--bord) + 8px), #000 calc(var(--bord) + 12%)); mask-image: linear-gradient(90deg, transparent calc(var(--bord) + 8px), #000 calc(var(--bord) + 12%)); }
.df-fil svg { display: block; width: 100%; height: 100%; overflow: visible; fill: none; }
.df[data-cote="droite"] .df-fil { -webkit-mask-image: linear-gradient(270deg, transparent calc(var(--bord) + 8px), #000 calc(var(--bord) + 12%)); mask-image: linear-gradient(270deg, transparent calc(var(--bord) + 8px), #000 calc(var(--bord) + 12%)); }
.df-fil path { stroke: var(--u-scene); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--m)); }
/* Cassandres, la chronologie : la photo se découvre comme le temps passe, de 1850 à 2077, le curseur file sur la frise */
.df[data-motif="chronologie"] .df-photo img { clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); }
.df-chrono { left: 4%; right: 4%; top: auto; bottom: clamp(18px, 4vh, 40px); width: auto; translate: none; }
.df-chrono .df-m { stroke-width: 1.6; }
.df-chrono path { opacity: .8; }
.df-an { position: absolute; top: calc(100% + 2px); left: 3.33%; font: 500 13px/1 var(--u-etiq); letter-spacing: .1em; color: var(--u-texte); text-shadow: 0 0 3px var(--u-fond), 0 0 9px var(--u-fond); }
.df-an-fin { left: auto; right: 3.33%; }
.df-chrono .dm-curseur { fill: var(--u-vif); stroke: none; }
/* épinglés, au bureau, quand le mouvement est permis : le suivant monte sur celui qu'on lit ; un écran de défilement par
   spectacle (sans repos entre deux : --r suit alors --p) */
@media (min-width: 900px) and (min-height: 620px) {
  html:not(.still) .df { position: sticky; top: var(--haut); height: calc(100svh - var(--haut)); min-height: 0; margin-bottom: var(--df-repos); }
  /* (scrollytelling) un temps de lecture par spectacle : sous chaque écran épinglé, --df-repos de défilement pendant lequel il
     reste seul à l'écran ; --r (0 → 1) le parcourt : le motif continue (--m), les dates arrivent l'une après l'autre, puis le
     lien. 0 pour revenir à un écran par spectacle, sans repos */
  html:not(.still) .df-pile { --df-repos: 40vh; }
  html:not(.still) .df-liste > li { --e: clamp(0, calc(var(--r) * 2.6 - var(--j, 0) * .55), 1); opacity: var(--e); transform: translateY(calc((1 - var(--e)) * 12px)); }
  html:not(.still) .df-in > .df-cta { --e: clamp(0, calc(var(--r) * 2.2 - .2), 1); }
}
/* au téléphone et sur un écran étroit : la photo en haut, le texte dessous ; l'effet joue sur la photo */
@media (max-width: 899px) {
  .df { --cx: 50%; --cy: 25svh; display: block; min-height: 0; padding-top: 44svh; }
  .df[data-cote="droite"] { --cx: 50%; }
  .df-photo { bottom: auto; height: 54svh; }
  .df-photo img, .df[data-cote="droite"] .df-photo img { --cadre-x: .5; --cadre-y: .42; }
  .df-photo::after, .df[data-cote="droite"] .df-photo::after { background: linear-gradient(0deg, var(--u-fond) 4%, color-mix(in srgb, var(--u-fond) 55%, transparent) 30%, transparent 62%); }
  .df-in, .df[data-cote="droite"] .df-in { width: 100%; margin-left: 0; }
  .df[data-motif="arene"] .df-photo img { clip-path: circle(calc(var(--p) * min(36vw, 21svh)) at 50% 25svh); }
  .df[data-motif="arene"] .df-effet { width: calc(min(36vw, 21svh) * 2.36); }
  .df[data-motif="jumeaux"] .df-effet, .df[data-motif="annotations"] .df-effet, .df[data-motif="paperboard"] .df-effet, .df[data-motif="nez"] .df-effet, .df[data-motif="horloge"] .df-effet { width: min(52vw, 34svh); }
  .df-lune { left: auto; right: 6%; top: 4%; } .df[data-cote="droite"] .df-lune { left: auto; }
  .df-chrono { bottom: auto; top: calc(44svh - 34px); }
  .df-fil, .df[data-cote="droite"] .df-fil { -webkit-mask-image: linear-gradient(#000 30svh, transparent 42svh); mask-image: linear-gradient(#000 30svh, transparent 42svh); }
  .df-credit, .df[data-cote="droite"] .df-credit { top: 8px; bottom: auto; right: 8px; left: auto; text-align: right; }
}
/* la saison sur la carte, puis les donateurs */
.acc-saison .une-grille { padding-top: clamp(8px, 2vw, 24px); }
.acc-saison .titre-bloc { margin-bottom: 8px; }
.acc-lien { margin: 18px 0 26px; }
.acc-lien a { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--saison-texte); text-decoration: none; }
.acc-lien a:hover { text-decoration: underline; }
.une-grille { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-areas: "tete carte" "liste carte"; grid-template-rows: auto 1fr; column-gap: clamp(24px, 4vw, 64px); }
.une-tete { grid-area: tete; padding-top: clamp(16px, 4vh, 44px); }
.une-liste { grid-area: liste; }
.prochaines { list-style: none; margin: 0 0 8px; padding: 0; border-top: 1px solid var(--encre); }
.prochaines a, .prochaines .pl { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 0 14px; align-items: baseline; padding: 10px 8px; border-bottom: 1px solid var(--filet); text-decoration: none; transition: background .2s; }
.prochaines time { grid-row: span 2; }
.prochaines time b { display: block; font: 600 1rem/1.25 var(--sans); font-variant-numeric: tabular-nums; }
.prochaines time small { display: block; font-size: .8rem; color: var(--gris); }
.prochaines .t { font: 500 1.15rem/1.2 var(--titre); }
.prochaines .t::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 8px; vertical-align: .15em; }
.prochaines .ou { font-size: .9rem; color: var(--gris); }
.prochaines li.on a, .prochaines a:hover { background: color-mix(in srgb, var(--magenta) 8%, transparent); }
.une-carte { grid-area: carte; align-self: center; position: relative; margin: 0; }
.une-carte .carte { max-height: calc(100svh - 110px); }
.merci { padding: 34px 0 56px; border-top: 1px solid var(--filet); }
.merci p { margin: 12px 0 0; max-width: 112ch; font-size: .82rem; line-height: 1.65; color: var(--gris); }

/* ———— la tête des pages d'entrée ———— */
.et { position: relative; overflow: clip; padding: clamp(36px, 5vw, 64px) 0 clamp(26px, 3vw, 40px); background: linear-gradient(180deg, color-mix(in srgb, var(--ev) 16%, var(--papier)), var(--papier)); border-bottom: 1px solid var(--filet); }
.et::after { content: ""; position: absolute; right: -8vw; top: -16vw; width: 40vw; height: 40vw; border-radius: 50%; border: clamp(14px, 2.2vw, 30px) solid color-mix(in srgb, var(--ec) 16%, transparent); pointer-events: none; }
.et h1 { position: relative; margin: 0; max-width: 18ch; font: 500 clamp(2.4rem, 1.4rem + 3.4vw, 4.4rem)/1.04 var(--titre); text-wrap: balance; }
.et .trait { width: 130px; height: 22px; margin-top: 14px; }
.et-rac { position: relative; list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.et-rac button { padding: 8px 15px; border: 1.5px solid color-mix(in srgb, var(--ec) 40%, var(--filet)); border-radius: 999px; background: var(--blanc); color: var(--encre); font: 500 .92rem var(--sans); cursor: pointer; }
.et-rac button:hover { border-color: var(--ec); color: var(--ec); }

/* ———— l'agenda : la recherche, les spectacles, la liste par mois, la carte qui suit ———— */
.ag-outils { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; margin-bottom: 26px; }
.recherche { position: relative; flex: 1 1 260px; max-width: 360px; }
.recherche input { width: 100%; padding: 11px 14px 11px 40px; border: 1.5px solid var(--filet); border-radius: 999px; background: var(--blanc); font: 400 1rem var(--sans); color: var(--encre); }
.recherche input:focus { border-color: var(--encre); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--magenta) 25%, transparent); }
.recherche svg { position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); fill: none; stroke: var(--gris); stroke-width: 2; }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--filet); background: transparent; font: 500 .93rem var(--sans); color: var(--encre); cursor: pointer; text-align: left; }
.puce:hover { border-color: var(--encre); }
.puce[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: var(--papier); }
.puce i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.puce .croix { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.puce.choisi { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.ag-corps, .sa-corps, .e-dates { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.ag-carte, .sa-carte, .e-carte { position: sticky; top: calc(var(--haut) + 16px); margin: 0; }
.ag-carte .carte, .sa-carte .carte, .e-carte .carte { max-height: calc(100svh - var(--haut) - 40px); }
.mois { margin: 30px 0 8px; font: 500 1.55rem/1.2 var(--titre); }
.mois::first-letter { text-transform: uppercase; }
.ag-liste .mois:first-child { margin-top: 0; }
.dates { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--encre); }
.dates > li { display: grid; grid-template-columns: 8.2rem minmax(0, 1fr); gap: 4px 18px; padding: 14px 8px; border-bottom: 1px solid var(--filet); transition: background .2s; }
.dates time b { display: block; font: 600 1.05rem/1.25 var(--sans); font-variant-numeric: tabular-nums; }
.dates time small { display: block; font-size: .85rem; color: var(--gris); }
.dates .t { font: 500 1.25rem/1.2 var(--titre); text-decoration: none; }
.dates .t::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 10px; vertical-align: .15em; }
.dates .t:hover { color: var(--magenta-texte); }
.dates .ou { display: block; font-weight: 500; }
.dates > li.on, .sa-dates > li.on { background: color-mix(in srgb, var(--magenta) 8%, transparent); }
.det { list-style: none; margin: 4px 0 0; padding: 0; font-size: .9rem; color: var(--gris); overflow-wrap: anywhere; }
.det a { color: var(--magenta-texte); }
.vignette { display: block; width: 100%; height: auto; }
.vignette use { fill: var(--carte); }
.vignette path { fill: none; stroke: var(--saison-texte); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 1; }
.vignette circle { fill: var(--encre); }
.etat { margin-left: 6px; font: normal 600 .74rem var(--etiq); letter-spacing: .05em; text-transform: uppercase; color: var(--magenta-texte); }

/* ———— les saisons passées (#/saisons, composées comme la 04 : trois portes) ————
   La frise des saisons dans une embrasure (une arche par saison, à la hauteur de sa densité) ; la bande des saisons, qui reste
   en haut de l'écran (un onglet en arche par saison et son nombre de dates ; tout ouvrir, tout fermer ; les filtres actifs à
   effacer) ; puis chaque saison derrière sa porte, fermée au départ, sa petite carte dans l'arche : ouverte, le battant
   s'efface et la lumière entre ; ses dates par mois à côté de sa carte, posée dans une grande arche. La lumière qui passe
   par l'embrasure est la couleur de la saison (--saison-vive), le noir celui de la synthèse. */
.p4 { padding: clamp(48px, 6vw, 88px) 0 clamp(40px, 5vw, 72px); border-top: 1px solid var(--filet); }
.p4-titre { margin: 0 0 clamp(24px, 3vw, 40px); font: 400 clamp(2rem, 1.5rem + 1.6vw, 2.75rem)/1.05 var(--titre); letter-spacing: -.015em; }
.p4-frise { min-height: 132px; margin: 0 0 18px; padding: 18px clamp(8px, 1.6vw, 20px) 6px; border-radius: 30px 30px 12px 12px; background: radial-gradient(70% 90% at 50% 100%, color-mix(in srgb, var(--saison) 34%, var(--papier-2)), var(--nuit) 80%); }
.ag-index { position: sticky; top: var(--haut); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 0; margin-bottom: 6px; background: var(--papier); border-bottom: 1px solid var(--filet); }
.p4 .p4-index { position: sticky; }   /* (au téléphone aussi, la bande reste en haut de l'écran) */
.ag-index ul { flex: 1 1 auto; min-width: 0; display: flex; gap: 6px; margin: 0; padding: 3px 2px; list-style: none; overflow-x: auto; scrollbar-width: none; }
.ag-index ul::-webkit-scrollbar { display: none; }
.ag-index li { flex: none; }
.idx, .idx-tout { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid color-mix(in srgb, var(--encre) 30%, transparent); background: transparent; color: var(--encre); font: 500 .9rem/1.2 var(--sans); font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap; }
.idx { padding: 7px 13px 6px; border-radius: 999px 999px 8px 8px; letter-spacing: .03em; }
.idx small { color: var(--gris); font-size: .78rem; letter-spacing: 0; }
.idx:hover, .idx-tout:hover { border-color: var(--encre); }
.idx[aria-expanded="true"] { border-color: var(--saison-vive); background: color-mix(in srgb, var(--saison-vive) 12%, transparent); }
.idx-actif { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.idx-actif:hover { background: var(--magenta-texte); border-color: var(--magenta-texte); color: var(--papier); }
.idx .croix { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.idx-tout { flex: none; justify-content: center; width: 40px; height: 40px; padding: 0; border-radius: 50%; }
.idx-tout .fleche { width: 18px; height: 18px; }
.saisons-ag { margin-top: 4px; }
.sai { border-bottom: 1px solid var(--filet); scroll-margin-top: 64px; }   /* (juste sous la bande des saisons) */
.sai > summary { display: grid; grid-template-columns: clamp(72px, 8vw, 104px) minmax(0, 1fr) auto; align-items: center; gap: 4px clamp(16px, 2.6vw, 34px); padding: 18px 8px; list-style: none; cursor: pointer; transition: background .16s; }
.sai > summary::-webkit-details-marker { display: none; }
.sai > summary:hover, .sai[open] > summary { background: color-mix(in srgb, var(--saison-vive) 6%, transparent); }
/* l'arche : la petite carte de la saison (la France, un trait de lumière de Rouen à chaque commune), le battant de sa porte
   devant elle, entrouvert ; au survol il s'ouvre un peu, ouverte la saison il s'efface et la lumière monte du seuil */
.p4-arche { position: relative; display: flex; align-items: flex-end; aspect-ratio: 4 / 5; padding: 16% 8% 5%; overflow: hidden; border: 1px solid color-mix(in srgb, var(--saison-vive) 24%, var(--filet)); border-radius: 999px 999px 0 0;
  background: radial-gradient(90% 70% at 50% 60%, color-mix(in srgb, var(--saison) 30%, var(--papier-2)), var(--nuit) 78%); transition: border-color .2s, box-shadow .2s, scale .12s; }
.sai > summary:hover .p4-arche { border-color: var(--saison-vive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--saison-vive) 26%, transparent), 0 14px 30px -14px var(--saison-vive); }
.sai[open] .p4-arche { border-color: var(--saison-vive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--saison-vive) 30%, transparent), 0 0 30px -4px var(--saison-vive), inset 0 -40px 50px -30px color-mix(in srgb, var(--saison-vive) 70%, transparent); }
.sai > summary.mv-presse .p4-arche { scale: .96; transition: scale .09s; }
.p4-mini { display: block; width: 100%; height: auto; overflow: hidden; }
.p4-mini use { fill: color-mix(in srgb, var(--encre) 9%, transparent); stroke: color-mix(in srgb, var(--encre) 30%, transparent); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.p4-mini path { fill: var(--saison-vive); opacity: .7; transition: opacity .2s; }
.p4-mini .p4-halo { fill: var(--saison-vive); opacity: .28; }
.p4-mini .p4-lueur { fill: color-mix(in srgb, var(--saison-vive) 35%, #fff); }
.p4-mini .p4-rouen { fill: var(--encre); }
.sai > summary:hover .p4-mini path, .sai[open] .p4-mini path { opacity: 1; }
.p4-battant { position: absolute; inset: 6% 6% 0; border-radius: 999px 999px 0 0; background: linear-gradient(90deg, color-mix(in srgb, var(--nuit) 84%, transparent), color-mix(in srgb, var(--carte) 60%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--saison-vive) 35%, transparent); transform-origin: 0 50%; transform: scaleX(.53) skewY(-7deg); transition: transform .32s var(--mv-courbe), opacity .32s; }
.sai > summary:hover .p4-battant { transform: scaleX(.34) skewY(-9deg); transition-duration: .18s; }
.sai[open] .p4-battant { transform: scaleX(.03) skewY(-10deg); opacity: 0; }
.sai-c { min-width: 0; }
.sai-t { margin: 0; font: 400 clamp(1.5rem, 1.2rem + 1vw, 2.1rem)/1.1 var(--titre); }
.sai-sp { display: block; margin-top: 6px; color: var(--gris); font-size: .9375rem; line-height: 1.45; }
.sai-sp span:not(:last-child)::after { content: "\00a0·"; }
.sai-n { display: inline-flex; align-items: center; gap: 10px; font: 500 1.45rem var(--titre); font-variant-numeric: tabular-nums; }
.sai-n .chev { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--mv-courbe); }
.sai[open] .sai-n .chev { transform: rotate(180deg); }
/* une saison ouverte : ses dates à côté de sa carte, posée dans une grande arche qui suit la lecture */
.sai-corps { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; padding: 14px 8px 48px; }
.sai-corps:empty { display: none; }
.sai-carte { position: sticky; top: calc(var(--haut) + 76px); margin: 0; }
.p4-carte { padding: clamp(34px, 4vw, 56px) clamp(14px, 2vw, 28px) clamp(16px, 2vw, 26px); border-radius: min(220px, 40%) min(220px, 40%) 24px 24px; overflow-x: clip;
  background: radial-gradient(80% 60% at 45% 35%, color-mix(in srgb, var(--saison) 26%, var(--papier-2)) 0%, var(--nuit) 72%); }
.p4-carte:empty { display: none; }
.sai-carte .carte { max-height: calc(100svh - var(--haut) - 210px); }
.p4-groupe + .p4-groupe { margin-top: 36px; }
.p4-mois { margin: 0; padding-bottom: 10px; border-bottom: 1px solid var(--encre); font: 600 .8125rem/1.3 var(--etiq); letter-spacing: .12em; text-transform: uppercase; color: var(--saison-texte); }
.p4-dates { list-style: none; margin: 0; padding: 0; }
/* une date : le jour et l'heure ; le lieu, le spectacle derrière sa petite porte (à la couleur de son spectacle ; une
   résidence : un carré évidé), « Scolaire », « Résidence », l'état, les précisions */
.dl { display: grid; grid-template-columns: minmax(0, 10.5rem) minmax(0, 1fr); gap: 4px 28px; padding: 20px 0; border-bottom: 1px solid var(--filet); transition: background .18s; }
.dl p { margin: 0; }
.dl-quand { display: flex; flex-direction: column; }
.dl-jour { font: 400 1.5rem/1.1 var(--titre); }
.dl-heure { margin-top: 2px; font-size: .9375rem; color: var(--gris); }
.dl-c { min-width: 0; }
.dl-ou { font-weight: 600; line-height: 1.4; }
.dl-ou a { text-decoration: none; }
.dl-ou a:hover { text-decoration: underline; text-underline-offset: 3px; }
.dl-ext { display: inline-block; margin-left: 5px; font-size: .85em; }
.dl .dl-quoi { margin-top: 2px; }
.dl-quoi a, .dl-sp { font: 400 1.3rem/1.25 var(--titre); text-decoration: none; }
.dl-quoi a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
.dl-porte { display: inline-block; width: 9px; height: 13px; margin-right: 9px; border-radius: 999px 999px 1px 1px; background: var(--c); vertical-align: -.05em; }
.dl.est-res .dl-porte { width: 10px; height: 10px; border-radius: 2px; background: transparent; box-shadow: inset 0 0 0 2px var(--c); vertical-align: 0; }
.p4-etiq { display: inline-block; margin-left: 10px; padding: 0 9px; border: 1px solid currentColor; border-radius: 999px; color: var(--gris); font: 600 .68rem/1.6 var(--etiq); letter-spacing: .08em; text-transform: uppercase; vertical-align: .15em; }
.p4-res { display: inline-flex; align-items: center; gap: 6px; border-style: dashed; }
.p4-res i { flex: none; width: 8px; height: 8px; border-radius: 1.5px; box-shadow: inset 0 0 0 1.5px currentColor; }
.dl .dl-etat { margin-top: 4px; font: 600 .74rem/1.3 var(--etiq); letter-spacing: .06em; text-transform: uppercase; color: var(--saison-texte); }
.dl .det { margin-top: 6px; }
.dl.suite { display: block; color: var(--gris); }
.dl.annule :is(.dl-ou, .dl-quoi) { color: var(--gris); }
.dl.on, .dl.est-allume { background: linear-gradient(90deg, color-mix(in srgb, var(--saison-vive) 10%, transparent), transparent 85%); }
.dl.est-vise { animation: vise 1.2s var(--mv-courbe); }
@media (max-width: 1000px) {
  .p4-carte { width: 100%; max-width: 460px; margin-inline: auto; }
}
@media (max-width: 640px) {
  .dl { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .dl-quand { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
}
/* (les lignes de l'agenda d'un spectacle et d'un établissement : leur lieu en lien, leur état, une ligne qui suit la sienne) */
.dates a.ou { text-decoration-color: color-mix(in srgb, var(--encre) 30%, transparent); text-underline-offset: 3px; }
.dates a.ou:hover { color: var(--saison-texte); }
.dates .qui .etat { margin: 0 0 0 4px; }
.dates > li.suite { display: block; color: var(--gris); }

/* ———— je souhaite programmer (la 05) : le catalogue, puis les lieux de diffusion sur l'aplat de la saison ————
   Sous l'en-tête d'aplat (voir l'espace pro), le catalogue : une fiche par spectacle dans son univers (voir les fiches) ;
   « Accueillir un spectacle » ; puis, sur l'aplat de la saison, la grande capitale des lieux de diffusion, la diffusion saison
   par saison et « Écrire à la compagnie », à côté de la carte de tous les lieux, en blanc sur l'aplat (les partenaires : au
   pied de page seulement). */
.ep-cat { display: grid; gap: clamp(20px, 2.4vw, 32px); margin: 0; padding: 0; list-style: none; }
.ep-diff { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: clamp(32px, 4.4vw, 80px); align-items: center; }
.ep-diff-t > p:not(.ep-k):not(.ep-ecrire) { max-width: 52ch; margin: 0 0 18px; font-size: 1.02rem; line-height: 1.6; }
.ep-diff .p-diff { max-width: none; min-height: 118px; margin: clamp(18px, 2vw, 26px) 0; }
.ep-ecrire { margin: clamp(22px, 2.6vw, 32px) 0 0; }
.ep-diff-carte { position: relative; margin: 0; }
.ep-diff-carte .carte { max-height: calc(100svh - 120px); }
/* la diffusion de la compagnie sur l'aplat : ses barres en blanc, leurs noms lisibles */
.ep-aplat .frise-compagnie .frise-bande-barre { background: #fff; }
.ep-aplat .frise-diffusion .frise-bande-nom { opacity: 1; }
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.ct-prg { position: relative; display: grid; gap: 3px; max-width: 540px; margin-top: 26px; padding: 18px 22px 16px; border: 1px solid var(--filet); border-left: 4px solid var(--ec, var(--magenta)); border-radius: 6px; background: var(--blanc); box-shadow: 0 18px 36px -28px rgba(29, 20, 24, .45); }
.ct-prg p { margin: 0; }
.ct-k { font: 600 .74rem/1.3 var(--etiq); letter-spacing: .12em; text-transform: uppercase; color: var(--ec, var(--magenta-texte)); }
.ct-nom b { display: block; font: 500 1.55rem/1.15 var(--titre); }
.ct-role { display: block; font-size: .95rem; color: var(--gris); }
.ct-liens { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 10px !important; }
.ct-tel { font-weight: 600; text-decoration: none; }
html:not(.ed-actif) .ct-tel.vide { display: none; }
.ct-cond { margin-top: 8px !important; font-size: .82rem; color: var(--gris); }
.u .ct-prg { border-color: var(--u-filet); border-left-color: var(--u-vif); background: transparent; box-shadow: none; color: var(--u-texte); }   /* sans voile : la couleur vive y reste AA (Macbeth) */
.u .ct-k { color: var(--u-vif); }
.u .ct-role, .u .ct-cond { color: var(--u-texte2); }
.u-contact { padding: clamp(18px, 2.6vw, 30px) 0; border-bottom: 1px solid var(--u-filet); background: var(--u-fond2); }
.ct-prg.compact { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 30px; max-width: none; margin: 0; padding: 14px 20px; }
.ct-prg.compact .ct-nom b { font-size: 1.3rem; }
.ct-prg.compact .ct-liens, .ct-prg.compact .ct-cond { margin-top: 0 !important; }
.ct-prg.compact .ct-cond { margin-left: auto !important; }
.dos-bt { position: relative; overflow: hidden; }
.dos-bt .onde { position: absolute; left: 16px; right: 16px; bottom: 2px; width: calc(100% - 32px); height: 8px; opacity: 0; overflow: visible; }
.dos-bt .onde path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; vector-effect: non-scaling-stroke; }
.dos-bt[aria-busy="true"] { cursor: progress; }
.dos-bt[aria-busy="true"] .onde { opacity: 1; }
.dos-bt[aria-busy="true"] .onde path { animation: onde-dos 1.15s ease-in-out infinite; }
@keyframes onde-dos { 0% { stroke-dashoffset: 1; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1; } }
@media (prefers-reduced-motion: reduce) { .dos-bt[aria-busy="true"] .onde path { animation: none; stroke-dashoffset: 0; } }
.u-faits-liens { display: flex; flex-wrap: wrap; gap: 8px; }
.u-docs { list-style: none; display: grid; gap: 10px; margin: 0; padding: 0; }
.u-docs li { display: flex; align-items: center; gap: 10px; }
.u-docs .fleche { width: 18px; height: 18px; color: var(--u-vif); }
.u-docs a { color: var(--u-vif); }
.u-docs--ft { margin-top: clamp(18px, 2vw, 28px); }
/* (le contact diffusion de #/espace-pro/programmer, sur l'aplat de l'en-tête : un cadre blanc, la grande capitale du nom, le
   courriel en pastille blanche) */
.ep-tete .ct-prg { max-width: 600px; margin-top: clamp(22px, 2.6vw, 36px); padding: 22px 26px 20px; border: 2px solid #fff; border-radius: 0; background: rgba(0, 0, 0, .16); box-shadow: none; color: #fff; }
.ep-tete .ct-prg .ct-k { font: 700 .76rem/1.3 var(--etiq); letter-spacing: .14em; color: #fff; }
.ep-tete .ct-prg .ct-nom b { margin-top: 4px; font: 700 clamp(1.4rem, 1.1rem + 1vw, 1.95rem)/1.05 var(--titre); letter-spacing: -.005em; text-transform: uppercase; }
.ep-tete .ct-prg :is(.ct-role, .ct-cond) { color: #fff; }
.ep-tete .ct-prg .ct-role { font-weight: 600; }
.ep-tete .ct-prg .ct-liens { gap: 12px 24px; margin-top: 14px !important; }
.ep-tete .ct-prg .ct-liens a.bouton { min-height: 52px; padding: 0 26px; border: 2px solid #fff; background: #fff; color: var(--e, var(--saison)); font: 700 .86rem/1.1 var(--etiq); letter-spacing: .06em; text-transform: uppercase; }
.ep-tete .ct-prg .ct-liens a.bouton:hover { background: transparent; color: #fff; }
.ep-tete .ct-prg .ct-cond { margin-top: 12px !important; font-weight: 600; }

/* ———— je représente un établissement scolaire (la 05) ————
   La position de la compagnie en tête (sa lettrine à la couleur de la saison), les spectacles par lieu en fiches d'univers
   (voir les fiches), les actions culturelles sur le papier teinté (leurs photos en mosaïque), puis les dates scolaires à côté
   de leur carte, en blanc sur l'aplat de la saison, et l'appel final. */
.ep-ecole { max-width: 62ch; margin: 0; font: 400 clamp(1.2rem, 1rem + .7vw, 1.6rem)/1.5 var(--texte); }
.ep-ecole::first-letter { color: var(--saison-texte); font: 700 2.4em/.8 var(--titre); }
.acs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: clamp(16px, 2vw, 28px); margin: 0; padding: 0; list-style: none; }
.ep-act { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(36px, 6vw, 96px); align-items: start; }
.ep-prose { max-width: 68ch; overflow-wrap: break-word; }
.ep-prose p, .ep-prose ul { margin: 0 0 1em; }
.ep-prose h3 { margin: 1.6em 0 .55em; color: var(--saison-texte); font: 700 clamp(1.15rem, 1rem + .7vw, 1.5rem)/1.1 var(--titre); text-transform: uppercase; }
.ep-prose > :first-child h3, .ep-prose > h3:first-child { margin-top: 0; }
.ep-prose ul { padding-left: 1.15em; }
.ep-prose li + li { margin-top: .55em; }
.ep-prose li::marker { color: var(--saison-texte); }
.ep-prose a { color: var(--saison-texte); }
.ep-act-ph { position: sticky; top: calc(var(--haut) + 24px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; }
.ep-act-ph > span { display: block; overflow: hidden; border-radius: 3px; background: var(--carte); }
.ep-act-ph .g { grid-column: 1 / -1; aspect-ratio: 4 / 5; }
.ep-act-ph .p { aspect-ratio: 1; }
.ep-act-ph img { width: 100%; height: 100%; object-fit: cover; }
.ep-act-ph figcaption { grid-column: 1 / -1; margin-top: 4px; }
/* les dates scolaires : leur carte sur l'aplat de la saison, comme les lieux de diffusion */
.ep-carte { padding: clamp(14px, 1.8vw, 24px); background: var(--saison); color: #fff; }
figcaption { margin-top: 6px; font-size: .8rem; color: var(--gris); }
.galerie { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.galerie img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; }

/* ———— la compagnie ———— */
.compagnie, .directeur { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: clamp(28px, 6vw, 88px); align-items: start; }
.directeur { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
.paragraphes p { max-width: 68ch; margin: 0 0 1.1em; }
.compagnie .paragraphes > p:first-child, .chapo { font: 300 clamp(1.2rem, 1rem + .7vw, 1.5rem)/1.5 var(--texte); }
/* « En quelques dates » (la 06) : la frise historique, puis la liste des années, chacune son titre (on l'édite sur place) ; au
   téléphone, la liste descend le long d'un bras à la couleur de la saison */
.compagnie { grid-template-columns: minmax(0, 1fr); }
.c-frise { min-height: 170px; margin: 0 0 8px; }
/* (scrollytelling) la frise résume, le récit raconte : sous la frise, la liste des années devient un récit en chapitres, une
   étape par date de D (l'année en grand, le titre, qui mène au spectacle), chacune s'allume quand elle traverse le milieu de
   l'écran (une animation liée au défilement) ; à côté, un panneau épinglé prend la photo et la couleur du spectacle de
   l'étape lue (.recit-vue.est-vue, posée par le script, ligne de lecture). Au téléphone, le panneau reste en haut, les étapes
   passent dessous. En édition sur place, la frise s'efface et la liste reste, annotée */
.recit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 80px); align-items: start; margin-top: clamp(28px, 4vw, 48px); }
.recit-panneau { position: sticky; top: calc(var(--haut) + 24px); display: grid; height: min(68svh, 640px); overflow: hidden; border-radius: 8px; background: var(--papier-2); isolation: isolate; }
.recit-vue { grid-area: 1 / 1; position: relative; margin: 0; opacity: 0; transition: opacity .6s var(--mv-courbe); }
.recit-vue.est-vue { opacity: 1; }
.recit-vue img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; filter: saturate(.85); transform: scale(1.07); transition: transform 1.4s var(--mv-courbe); }
.recit-vue.est-vue img { transform: none; }
.recit-vue::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, color-mix(in srgb, var(--c) 45%, #000) 0, transparent 58%), color-mix(in srgb, var(--c) 14%, transparent); }
.recit-vue.sans { display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, var(--papier-2)); }
.recit-vue.sans svg { width: 56%; height: auto; color: var(--c); }
.recit-an { position: absolute; left: clamp(16px, 3vw, 28px); bottom: 14px; z-index: 1; font: 500 clamp(3rem, 6vw, 5.6rem)/1 var(--titre); color: #fff; text-shadow: 0 2px 24px rgba(0, 0, 0, .5); }
.recit-credit { position: absolute; right: 12px; top: 10px; z-index: 1; margin: 0; font: 400 .72rem/1.3 var(--sans); color: rgba(255, 255, 255, .8); text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.frise-l { list-style: none; margin: 0; padding: 0; position: relative; border-left: 2px solid var(--filet); }
.frise-l > li { position: relative; display: grid; gap: 10px; align-content: center; min-height: 38svh; padding: 6vh 0 6vh 34px; }
.frise-l > li::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -8px; border-radius: 50%; background: var(--papier); border: 2px solid var(--c, var(--saison-texte)); transition: background .3s, scale .3s var(--mv-courbe); }
.frise-l > li.lu::before { background: var(--c, var(--saison-texte)); scale: 1.3; }
.frise-l .an { display: block; font: 500 clamp(2.4rem, 2rem + 2vw, 3.8rem)/1 var(--titre); color: var(--c, var(--saison-texte)); font-variant-numeric: tabular-nums; }
.frise-l .ti, .frise-l a { display: block; font: 500 clamp(1.4rem, 1.1rem + 1.2vw, 2.3rem)/1.18 var(--titre); color: var(--encre); text-decoration: none; text-wrap: balance; }
.frise-l a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
html.ed-actif .c-frise { display: none; }
@media (max-width: 899px) {
  .recit { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .recit-panneau { top: var(--haut); z-index: 3; height: 34svh; border-radius: 0 0 8px 8px; }
  .frise-l > li { min-height: 30svh; padding: 5vh 0 5vh 26px; }
  .recit-an { font-size: clamp(2.4rem, 10vw, 3.6rem); }
}
/* la troupe (règle 20, TROUPE), celle de la 06 : la pieuvre de la compagnie en tête ; un bras effilé descend d'elle et pousse,
   de métier en métier, une branche vers chaque catégorie (son icône dans une ventouse, son titre) ; les personnes sont les
   ventouses du bras : une pastille, leur visage quand sa publication est accordée (sinon le nom seul), leur nom, leur métier
   précis. Survoler ou choisir une personne allume toutes ses places et les relie (TROUPE.relier, à la couleur de la saison) ;
   les bras poussent une fois, quand la troupe arrive à l'écran (Web Animations sur le masque qui les découvre) */
section.bloc.troupe { padding-top: 0; content-visibility: auto; contain-intrinsic-size: auto 1400px; }   /* hors de l'écran : ni style ni mise en page */
.tr6 { --g: clamp(56px, 7vw, 100px); --troupe-lien: var(--saison-texte); --troupe-ic-fond: var(--papier); --troupe-ventouse-fond: var(--papier);
  position: relative; display: grid; gap: clamp(18px, 2.4vw, 30px); margin-top: 18px; padding-left: var(--g); }
.tr6-bras { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.tr6-mq { fill: none; stroke: #fff; stroke-width: 44; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 0; }
.tr6-b { fill: var(--saison-texte); }
.tr6-vent { fill: var(--papier); stroke: var(--saison-texte); stroke-width: 1.6; }
.tr6-coeur { position: relative; z-index: 2; width: clamp(104px, 12vw, 150px); margin-left: calc(var(--g) * -1 + 2px); color: var(--saison-texte); }
.tr6-coeur svg { display: block; width: 100%; height: auto; }
.tr6-cat { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 10px 24px; align-items: start; }
.tr6-t { display: flex; align-items: center; gap: 12px; margin: 0; font: 500 1.25rem/1.15 var(--titre); }
.tr6-ic { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--papier); box-shadow: inset 0 0 0 2px var(--saison-texte); color: var(--saison-texte); font-size: 13px; }
.tr6-places { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 4px 0 0; }
.tr6-p { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 16px 4px 4px; border: 1.5px solid var(--filet); border-radius: 999px; background: var(--blanc); color: var(--encre);
  font: inherit; text-align: left; cursor: pointer; transition: border-color .18s, background-color .18s, color .18s, scale .12s; }
.tr6-p:not(.a-photo) { padding-left: 14px; }
.tr6-p:hover, .tr6-p.est-allume { border-color: var(--saison-texte); background: color-mix(in srgb, var(--saison-texte) 10%, var(--blanc)); }
.tr6-p[aria-pressed="true"] { border-color: var(--saison-texte); background: var(--saison-texte); color: var(--papier); }
.tr6-p:focus-visible { outline: 2px solid var(--saison-texte); outline-offset: 2px; }
.tr6-p.mv-presse { scale: .97; transition-duration: .06s; }
.tr6-v { flex: none; width: 36px; height: 36px; overflow: hidden; border-radius: 50%; background: var(--carte); }
.tr6-v img { width: 100%; height: 100%; object-fit: cover; }
.tr6-pt { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--saison-texte); }
.tr6-p[aria-pressed="true"] .tr6-pt { box-shadow: inset 0 0 0 2px var(--papier); }
.tr6-qui { display: grid; line-height: 1.2; }
.tr6-nom { font: 600 .95rem/1.2 var(--texte); }
.tr6-m { font-size: .8rem; color: var(--gris); }
.tr6-m span + span::before { content: " · "; }
.tr6-p:is(:hover, .est-allume) .tr6-m { color: var(--encre); }
.tr6-p[aria-pressed="true"] .tr6-m { color: inherit; }
@media (max-width: 700px) {
  section.bloc.troupe { contain-intrinsic-size: auto 3600px; }
  .tr6 { --g: 44px; }
  .tr6-coeur { width: 96px; margin-bottom: 6px; }
  .tr6-cat { grid-template-columns: minmax(0, 1fr); }
  .tr6-ic { width: 44px; height: 44px; font-size: 11px; }
  .tr6-p { min-width: 0; max-width: 100%; }
  .tr6-qui { min-width: 0; overflow-wrap: anywhere; }
}

/* ———— le contact, les pages légales ———— */
.champ { margin: 0 0 16px; }
.champ label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .92rem; }
.champ input, .champ textarea, .calcul input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--filet); border-radius: 6px; background: #fff; font: 400 1rem var(--sans); color: var(--encre); }
.champ input:focus, .champ textarea:focus, .calcul input:focus { border-color: var(--encre); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--magenta) 25%, transparent); }
.contact { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(28px, 6vw, 88px); align-items: start; }
.formulaire { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
.formulaire .large, .formulaire .case, .formulaire .calcul, .formulaire .envoi { grid-column: 1 / -1; }
.case { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; }
.case input { flex: none; width: 18px; height: 18px; margin: 4px 0 0; accent-color: var(--magenta); }
.case a { color: var(--magenta-texte); }
.calcul { display: flex; align-items: center; gap: 10px; margin: 0 0 20px; }
.calcul label { font-weight: 600; white-space: nowrap; }
.calcul input { width: 4.5em; padding: 8px 10px; }
.envoi { margin: 0; }
.coord { font-style: normal; line-height: 1.7; padding: 22px 24px; border-left: 3px solid var(--magenta); background: var(--papier-2); }
.legal { max-width: 78ch; overflow-wrap: anywhere; }
.legal h2 { margin: 1.6em 0 .5em; font: 500 1.6rem/1.2 var(--titre); }
.legal h2:first-child { margin-top: 0; }
.legal a { color: var(--magenta-texte); }

/* ———— l'espace pro (règles 16 et 21) : celui de la 05, l'aplat et la capitale, à la couleur de la saison ————
   #/espace-pro : sur l'aplat de la saison (la suite de l'en-tête), la ligne-tentacule, la grande capitale et son texte ; ses
   deux pages en grandes portes photographiques, chacune dans la couleur de son parcours (D.site.entrees) ; puis les trois
   espaces réservés en aplats numérotés (la saison, la saison profonde, la nuit). Ses deux pages (programmer, établissements
   scolaires) : le même en-tête d'aplat, dans la couleur du parcours, sa photo à droite et le retour vers l'espace pro. Les
   grandes capitales tiennent toujours dans leur boîte (cqi : leur mot le plus long y entre, quelle que soit la largeur). */
.ep-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* la ligne-tentacule de la 05 : une onde longue qui s'enroule au bout ; elle se trace à l'arrivée */
.ep-sep { display: flex; align-items: center; width: 100%; max-width: 440px; height: 26px; margin: 0 0 clamp(14px, 1.8vw, 24px); color: var(--ep-sep, var(--saison-texte)); transform-origin: 0 50%; }
.ep-sep svg { display: block; height: 26px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ep-sep path { vector-effect: non-scaling-stroke; }
.ep-sep .v { flex: 1 1 0; min-width: 0; }
.ep-sep .b { flex: none; width: 46px; }
.ep-sep[data-mv="trace"].mv-attente { transition: transform .8s var(--mv-courbe); }
/* l'en-tête : l'aplat (la saison ; sur ses deux pages, la couleur du parcours, --e) */
.ep-tete { position: relative; isolation: isolate; overflow: hidden; padding: clamp(36px, 4.6vw, 68px) 0 clamp(48px, 5.6vw, 84px); background: var(--e, var(--saison)); color: #fff; --ep-sep: #fff; }
.ep-tete :focus-visible, .ep-aplat :focus-visible, .ep-cta :focus-visible, .ep-portes :focus-visible { outline-color: #fff; }
.ep-tete-ph { position: absolute; top: 0; right: 0; bottom: 0; z-index: -1; width: min(48%, 680px); background: var(--e); }
.ep-tete-ph img { width: 100%; height: 100%; object-fit: cover; }
.ep-tete-ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, var(--e), color-mix(in srgb, var(--e) 0%, transparent) 62%); }
.ep-c { position: relative; container-type: inline-size; }
.ep-retour { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 clamp(16px, 2vw, 26px); color: #fff; font: 700 .8rem/1.3 var(--etiq); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
.ep-retour .fleche { scale: -1 1; }
.ep-retour:hover { text-decoration: underline; text-underline-offset: 4px; }
.ep-h1 { max-width: min(100%, 1100px); margin: 0; font: 700 min(clamp(38px, 6.6vw, 104px), 11.6cqi)/.94 var(--titre); letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.ep-lead { max-width: 40ch; margin: 18px 0 0; font: 400 clamp(1.15rem, 1rem + .6vw, 1.45rem)/1.45 var(--texte); }
/* ses raccourcis : des pièces blanches sur l'aplat */
.ep-rac { display: flex; flex-wrap: wrap; gap: 8px; margin: clamp(18px, 2.4vw, 28px) 0 0; padding: 0; list-style: none; }
.ep-rac button { padding: 8px 15px; border: 1.5px solid rgba(255, 255, 255, .62); border-radius: 999px; background: transparent; color: #fff; font: 700 .72rem/1.2 var(--etiq); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.ep-rac button:hover { border-color: #fff; background: #fff; color: var(--e, var(--saison)); }
/* ses deux pages : de grandes portes photographiques, la photo passée dans la couleur du parcours */
.ep-pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; }
.ep-porte { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; height: 100%; min-height: 230px;
  padding: clamp(22px, 2.4vw, 36px) clamp(20px, 2.4vw, 38px); background: var(--e); color: #fff; text-decoration: none; }
.ep-porte-ph { position: absolute; inset: 0; z-index: -1; background: var(--e); }
.ep-porte-ph img { width: 100%; height: 100%; object-fit: cover; transition: scale .9s var(--mv-courbe); }
.ep-porte-ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, color-mix(in srgb, var(--e) 70%, #000) 0%, transparent 70%); mix-blend-mode: multiply; }
.ep-porte-t { flex: 1 1 auto; min-width: 0; font: 700 clamp(24px, 2.5vw, 40px)/1.02 var(--titre); letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 1px 18px rgba(0, 0, 0, .35); }
.ep-porte-t small { display: block; margin-top: 10px; font: 700 clamp(.8rem, .72rem + .25vw, .95rem)/1.3 var(--etiq); letter-spacing: .08em; }
.ep-porte .fleche, .ep > .fleche { width: clamp(28px, 2.4vw, 40px); height: clamp(28px, 2.4vw, 40px); stroke-width: 1.6; transition: translate .2s var(--mv-courbe); }
.ep-porte:hover .ep-porte-ph img { scale: 1.05; }
.ep-porte:is(:hover, :focus-visible) .fleche { translate: 6px 0; }
.ep-porte:focus-visible { outline: 3px solid #fff; outline-offset: -8px; }
.ep-pages li + li .ep-porte { box-shadow: inset 2px 0 0 rgba(255, 255, 255, .55); }
.ep-porte.mv-presse .ep-porte-t, .ep:has(.ep-a.mv-presse) .ep-t { scale: .9 1; transition: scale .08s; }
.ep-porte-t, .ep-t { transform-origin: 0 50%; }
/* les trois espaces réservés : trois aplats numérotés (la saison, la saison profonde, la nuit) ; au survol, un voile clair
   balaie l'aplat, la capitale se serre, la flèche avance */
.ep-portes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; }
.ep { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; min-height: clamp(300px, 46vh, 460px);
  padding: clamp(24px, 2.6vw, 40px); background: var(--ep); color: #fff; container-type: inline-size; }
.ep + .ep { box-shadow: inset 2px 0 0 rgba(255, 255, 255, .55); }
.ep::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(255, 255, 255, .12); transform: translateX(-101%); transition: transform .2s var(--mv-courbe); pointer-events: none; }
.ep:is(:hover, :focus-within)::before { transform: none; }
.ep-n { font: 700 clamp(64px, 8vw, 128px)/.8 var(--titre); letter-spacing: -.04em; opacity: .28; }
.ep-t { margin: 0; font: 700 min(clamp(26px, 2.6vw, 42px), 9.6cqi)/1 var(--titre); letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; transition: scale .18s var(--mv-courbe); }
.ep:is(:hover, :focus-within) .ep-t { scale: .94 1; }
.ep-a { color: #fff; text-decoration: none; }
/* toute la pièce mène à l'espace : le lien s'étend sur elle (son titre reste son nom) */
.ep-a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.ep-a:focus-visible { outline: none; }
.ep:has(.ep-a:focus-visible) { outline: 3px solid #fff; outline-offset: -8px; }
html.ed-actif .ep-a::after { content: none; }
.ep-x { max-width: 36ch; margin: 0; font: 600 1.02rem/1.45 var(--texte); }
.ep:is(:hover, :focus-within) > .fleche { translate: 6px 0; }
/* les sections des deux pages : la ligne-tentacule, puis la grande capitale à la couleur de la saison */
.ep-sec { padding: clamp(60px, 7.6vw, 112px) 0; }
.ep-sec:not(.fond) + .ep-sec:not(.fond) { padding-top: 0; }
.ep-sec.fond { background: var(--papier-2); }
.ep-sec-t { margin: 0 0 clamp(26px, 3.4vw, 44px); color: var(--saison-texte); font: 700 min(clamp(32px, 4.4vw, 62px), 10.4cqi)/.94 var(--titre); letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.ep-sec > .wrap, .ep-aplat > .wrap { container-type: inline-size; }
