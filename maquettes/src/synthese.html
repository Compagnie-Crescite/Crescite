<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compagnie Crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Work+Sans:wght@400;500;600;700&family=Ubuntu:wght@500;700&family=Open+Sans:wght@400;700&family=Raleway:wght@600;700&family=Space+Grotesk:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Bodoni+Moda:wght@700&family=Anton&family=Grenze+Gotisch:wght@600&family=IM+Fell+English:ital@0;1&family=IM+Fell+French+Canon:ital@0;1&display=swap">
<style>
/* La synthèse : l'accueil et les cartes de la 06 (la tentacule comme thème), l'agenda de la 03 relié à la carte, les
   trois entrées nées des portes de la 04, et pour chaque spectacle un univers de compagnie (le dossier scolaire de
   Bérénice, les pages d'adrienvada.fr) où revient l'effet de la 10. Tout le texte visible vient de D, tel quel. */
:root {
  --papier: #f6f2eb; --papier-2: #ece5da; --carte: #e4dccf; --encre: #1d1418; --gris: #5f565a; --filet: #dcd3c6;
  --magenta: #bc3e80; --magenta-texte: #a3306b; --nuit: #1d1418; --blanc: #fffdf9; --magenta-vif: #bc3e80;
  --serif: "Spectral", Georgia, serif; --sans: "Work Sans", system-ui, sans-serif;
  --gout: clamp(16px, 4vw, 56px); --haut: 64px; --onglets: 0px;
  /* les tentacules (tentacules.js) : la pieuvre du logo guide ; ici elles ont la couleur et les ventouses des bras de la tournée */
  --tt-encre: #bc3e80; --tt-accent: #1d1418; --tt-neutre: #bc3e80; --tt-epaisseur: 2.4;
  /* l'édition sur place (EDITION) : la barre, la connexion et le panneau des dates sur le papier de la synthèse */
  --ed-fond: #fffdf9; --ed-encre: #1d1418; --ed-accent: #bc3e80; --ed-sur-accent: #ffffff;
  --ed-police: "Work Sans", system-ui, sans-serif; --ed-rayon: 10px; --ed-trait: #dcd3c6;
}
/* ———— la nuit (règle 19, THEME) : la salle quand la lumière baisse ————
   Le même papier, retourné : une aubergine presque noire, l'encre claire et chaude, la magenta de la compagnie (assez
   sombre pour porter un texte blanc, assez vive pour se lire sur la nuit), son texte plus clair ; la France devient une
   terre sombre où les bras gardent leurs couleurs. Les couleurs des spectacles s'éclaircissent (--sp-*, couleursSp), les
   univers clairs passent dans leur propre nuit (--un-*, uVars), les univers sombres restent eux-mêmes. AA partout :
   encre 15,8:1, gris 7,8:1, magenta-texte 7,3:1 sur le papier ; blanc sur magenta 4,7:1. */
html[data-theme="jour"] { color-scheme: light; }
html[data-theme="nuit"] {
  color-scheme: dark;
  --papier: #151014; --papier-2: #1e171c; --carte: #2b2128; --encre: #f2eae4; --gris: #b0a3aa; --filet: #352a31;
  --magenta: #c44386; --magenta-texte: #f07ab6; --nuit: #0c080b; --blanc: #211a1f; --magenta-vif: #e0559a;
  --tt-encre: #e0559a; --tt-accent: #f2eae4; --tt-neutre: #e0559a;
  --ed-fond: #211a1f; --ed-encre: #f2eae4; --ed-accent: #e0559a; --ed-sur-accent: #151014; --ed-trait: #3b2f37;
}
html[data-theme="nuit"] .evitement { background: var(--blanc); color: var(--encre); }
html[data-theme="nuit"] .champ input, html[data-theme="nuit"] .champ textarea, html[data-theme="nuit"] .calcul input { background: var(--blanc); }
/* l'entrée où l'on est s'allume de sa couleur vive, l'encre de nuit dessus */
html[data-theme="nuit"] :is(.entrees, .barre) .pt { background: var(--ev); }
html[data-theme="nuit"] :is(.entrees, .barre) a[aria-current="page"] { background: var(--ev); border-color: var(--ev); color: var(--papier); }
html[data-theme="nuit"] :is(.entrees, .barre) a[aria-current="page"] .pt { background: var(--papier); }
html[data-theme="nuit"] :is(.entrees, .barre) a[aria-current="true"] { border-color: var(--ev); }
html[data-theme="nuit"] footer { border-top: 1px solid var(--filet); }
/* ce qui s'écrit dans la couleur d'une entrée prend sa couleur vive (la sombre ne se lirait pas sur la nuit) */
html[data-theme="nuit"] .ct-k { color: var(--ev, var(--magenta-texte)); }
html[data-theme="nuit"] .et-rac button:hover { border-color: var(--ev); color: var(--ev); }
/* les fiches des spectacles se détachent de la nuit par un filet de leur univers */
html[data-theme="nuit"] .fu, html[data-theme="nuit"] .prog, html[data-theme="nuit"] .fe, html[data-theme="nuit"] .dos-appel { box-shadow: 0 0 0 1px color-mix(in srgb, var(--u-texte) 16%, transparent), 0 24px 44px -28px #000; }
/* les univers clairs dans leur nuit (leurs couleurs de D, retournées) ; ce qui reste sur papier blanc garde l'encre du jour */
html[data-theme="nuit"] .u.u-clair { --u-fond: var(--un-fond) !important; --u-fond2: var(--un-fond2) !important; --u-texte: var(--un-texte) !important;
  --u-texte2: var(--un-texte2) !important; --u-vif: var(--un-vif) !important; }
html[data-theme="nuit"] .u-paperboard .u-ouv-texte { --u-texte: var(--uj-texte); --u-texte2: var(--uj-texte2); --u-vif: var(--uj-vif); color: var(--u-texte); }
html[data-theme="nuit"] .u-arene .u-ouv { background: color-mix(in srgb, var(--u-accent) 72%, #1a0703); }
html[data-theme="nuit"] .u-arene .u-onglets { background: color-mix(in srgb, var(--u-fond) 90%, transparent); }
html[data-theme="nuit"] .u-arene .u-carton figcaption { background: var(--u-fond2); }
/* dans la nuit d'un univers clair, ce qui s'écrivait dans son accent (le rouge de Bérénice) prend sa couleur vive (le
   saumon), qui se lit sur le fond sombre ; les aplats gardent l'accent, et les feuilles blanches leurs encres du jour */
html[data-theme="nuit"] .u.u-clair { --ac: var(--u-vif); }
html[data-theme="nuit"] .u-clair .sheet { --ac: var(--u-accent); }
html[data-theme="nuit"] .u-arene .u-h2,
html[data-theme="nuit"] .u-arene .u-affirm,
html[data-theme="nuit"] .u-arene .u-cit p,
html[data-theme="nuit"] .u-arene .u-ac-type,
html[data-theme="nuit"] .u-arene .u-aside,
html[data-theme="nuit"] .u-arene .u-avec,
html[data-theme="nuit"] .u-arene .suivant b,
html[data-theme="nuit"] .u-arene .prog-t a,
html[data-theme="nuit"] .u-arene .fe-t a,
html[data-theme="nuit"] .u-arene .fe-type,
html[data-theme="nuit"] .u-arene .fu-t,
html[data-theme="nuit"] .u-arene .dos-h3,
html[data-theme="nuit"] .u-arene .dos-h4,
html[data-theme="nuit"] .u-arene .dos-fiche dt,
html[data-theme="nuit"] .u-arene .dos-fiche-t { color: var(--u-vif); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--haut) + 16px); }
body { margin: 0; background: var(--papier); color: var(--encre); font: 400 1.0625rem/1.6 var(--sans); }
main { display: block; overflow-x: clip; min-height: 100svh; }   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas */
a { color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.evitement { position: absolute; left: 8px; top: -80px; z-index: 80; background: #fff; padding: 8px 14px; border-radius: 6px; }
.evitement:focus { top: 8px; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 var(--gout); }
[hidden] { display: none !important; }

/* le motif : une onde qui s'enroule au bout, sous les titres ; elle se dessine à l'arrivée */
.trait { display: block; width: 92px; height: 16px; margin-top: 10px; overflow: visible; }
.trait path { fill: none; stroke: var(--c, var(--saison-texte)); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }
.page-titre .trait path, .une .trait path, .et .trait path { animation: dessine 1.1s .15s cubic-bezier(.45, 0, .2, 1) both; }
@keyframes dessine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* ———— l'en-tête : les trois entrées d'abord, le menu second à part ———— */
.top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--papier) 94%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--filet); }
.top-in { display: flex; align-items: center; gap: 18px; height: var(--haut); padding: 0 clamp(16px, 2vw, 32px); overflow: hidden; }
.marque { flex: none; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 1.1rem; letter-spacing: .01em; }
.marque .l { display: block; width: 34px; }
.marque svg { width: 100%; height: auto; display: block; }
.entrees { flex: none; display: flex; align-items: center; gap: 4px; margin-left: auto; }
.entrees a { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; border: 1.5px solid transparent; border-radius: 999px; color: var(--encre); text-decoration: none; font: 600 .95rem/1.2 var(--sans); white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.entrees .pt, .barre .pt { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ec); transition: background .2s; }
.entrees a:hover { background: color-mix(in srgb, var(--ev) 22%, var(--papier)); }
.entrees a[aria-current="page"] { background: var(--ec); border-color: var(--ec); color: #fff; }
.entrees a[aria-current="page"] .pt { background: #fff; }
.entrees a[aria-current="true"] { border-color: var(--ec); background: color-mix(in srgb, var(--ev) 14%, var(--papier)); }
.entrees .court { display: none; }
.top.serre .entrees .long { display: none; }
.top.serre .entrees .court { display: inline; }
.second { flex: none; display: flex; align-items: center; gap: 2px; padding-left: 14px; border-left: 1px solid var(--filet); }
.second a { padding: 6px 9px; color: var(--gris); text-decoration: none; font: 500 .85rem/1.2 var(--sans); white-space: nowrap; }
.second a:hover { color: var(--encre); }
.second a[aria-current="page"] { color: var(--encre); box-shadow: inset 0 -2px 0 var(--magenta); }
.menu { display: none; flex: none; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid var(--filet); border-radius: 999px; background: none; color: var(--encre); font: 600 .9rem var(--sans); cursor: pointer; }
.menu svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.top.replie .menu { display: inline-flex; }
.top.replie .second { display: none; position: absolute; right: clamp(16px, 2vw, 32px); top: calc(var(--haut) - 6px); flex-direction: column; align-items: stretch; min-width: 220px; padding: 8px; border: 1px solid var(--filet); border-radius: 12px; background: var(--papier); box-shadow: 0 18px 40px -18px rgba(29, 20, 24, .35); }
.top.replie.ouvert .second { display: flex; }
.top.replie .second a { padding: 11px 12px; border-radius: 8px; font-size: 1rem; }
.top.replie .second a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--magenta); }
.top.compact .top-in { gap: 10px; }
.top.compact #nom { display: none; }
.top.compact .entrees a { padding: 8px 10px; gap: 7px; font-size: .9rem; }
/* au téléphone : les entrées dans une barre fixe en bas, toujours à portée */
.barre { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--papier) 95%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--filet); }
.barre a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 50px; padding: 6px 4px; border: 1.5px solid transparent; border-radius: 10px; color: var(--encre); text-decoration: none; text-align: center; font: 600 .78rem/1.15 var(--sans); }
.barre .pt { width: 24px; height: 4px; border-radius: 2px; }
.barre a[aria-current="page"] { background: var(--ec); color: #fff; }
.barre a[aria-current="page"] .pt { background: #fff; }
.barre a[aria-current="true"] { border-color: var(--ec); background: color-mix(in srgb, var(--ev) 14%, var(--papier)); }
/* le menu par les saisons (règle 21) est toute la navigation : sans menu second, ni lui ni le bouton « Menu » */
.top.sans-second .second, .top.sans-second .menu { display: none !important; }
@media (max-width: 759px) { .top.sans-second .theme { margin-left: auto; } }

/* ———— blocs communs ———— */
section.bloc { padding: clamp(48px, 7vw, 96px) 0; border-top: 1px solid var(--filet); }
section.bloc.sans-filet { border-top: 0; padding-top: clamp(28px, 4vw, 48px); }
.page-titre { padding-top: clamp(36px, 5vw, 64px); padding-bottom: clamp(24px, 3vw, 40px); }
.page-titre h1 { margin: 0; font: italic 400 clamp(2.4rem, 1.6rem + 2.6vw, 3.6rem)/1.05 var(--serif); text-wrap: balance; }
.page-titre .trait { width: 120px; height: 20px; margin-top: 14px; }
.surtitre { margin: 0 0 14px; font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.surtitre a { text-decoration: none; }
.surtitre a:hover { color: var(--magenta-texte); }
.titre-bloc { margin: 0 0 30px; font: italic 400 clamp(2rem, 1.4rem + 1.8vw, 2.8rem)/1.05 var(--serif); text-wrap: balance; }
.rubrique { margin: 28px 0 10px; font: 600 .78rem/1.3 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--magenta-texte); }
.bouton { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; background: var(--encre); color: var(--papier); border: 1.5px solid var(--encre); text-decoration: none; font: 600 .97rem var(--sans); cursor: pointer; }
.bouton.second-b { background: transparent; color: var(--encre); }
.bouton:hover { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.bouton.e { background: var(--ec); border-color: var(--ec); color: #fff; }
.bouton.e:hover { background: var(--encre); border-color: var(--encre); }
.bouton.grand { padding: 15px 28px; font-size: 1.08rem; }
.boutons { display: flex; gap: 10px; flex-wrap: wrap; margin: 0; }
.fleche { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.plein-ico { fill: currentColor; stroke: none; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font: normal 600 .66rem/1.5 var(--sans); letter-spacing: .08em; text-transform: uppercase; vertical-align: .12em; }

/* ———— la carte des tournées : des bras effilés qui poussent depuis Rouen, une spirale au bout ———— */
.carte { display: block; width: 100%; height: auto; overflow: visible; }
/* la carte paraît d'un fondu (une couche, composée par la carte graphique) ; ses bras masqués poussent depuis Rouen */
.carte:not(.pousse) { opacity: 0; }
.carte.pousse { transition: opacity .45s var(--mv-courbe); }
.carte .pays { fill: var(--carte); }
.carte .voisin { fill: var(--papier-2); }
.carte .encart { fill: none; stroke: var(--gris); stroke-opacity: .5; stroke-dasharray: 3 4; }
.carte.serre { overflow: hidden; }
.carte .passe path { fill: none; stroke: color-mix(in srgb, var(--encre) 22%, transparent); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.carte .bras-trait { fill: none; stroke: var(--kc, var(--saison-texte)); stroke-width: 1.3px; vector-effect: non-scaling-stroke; stroke-linecap: round; opacity: .85; }
.carte .m { fill: none; stroke: #fff; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s cubic-bezier(.45, 0, .2, 1) var(--d, 0s); }
.carte.pousse .m { stroke-dashoffset: 0; }
.carte .bras { fill: var(--kc, var(--saison-texte)); }
.carte .bout { fill: none; stroke: var(--kc, var(--saison-texte)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s ease-out calc(var(--d, 0s) + .7s); }
.carte.pousse .bout { stroke-dashoffset: 0; }
.carte .point { fill: var(--kc, var(--saison-texte)); stroke: var(--papier); stroke-width: 1.2; opacity: 0; transition: opacity .3s calc(var(--d, 0s) + .6s); }
.carte.pousse .point { opacity: 1; }
/* une carte de beaucoup de communes : ses points paraissent avec elle (un seul fondu composé), pas un par un */
.carte.simple .point { opacity: 1; transition: none; }
.carte .cible { fill: transparent; }
.carte .carte-lieu { cursor: pointer; outline: none; transition: opacity .18s; }
.carte .carte-lieu:focus-visible .point { stroke: var(--encre); stroke-width: 2.6; }
.carte .carte-lieu.eteint { opacity: .12; }
.carte.surligne .carte-lieu:not(.on) { opacity: .18; }
.carte .rouen { fill: var(--encre); }
.carte .rouen-nom, .carte .nom { font: italic 500 calc(16px * var(--k, 1)) var(--serif); fill: var(--encre); paint-order: stroke; stroke: var(--papier); stroke-width: calc(4px * var(--k, 1)); stroke-linejoin: round; }
.carte .nom { display: none; font: 600 calc(13px * var(--k, 1)) var(--sans); }
/* (« Rouen » un peu à l'écart de son point, qui bat quand la carte attend : la même distance à l'écran, quelle que soit la
   taille de la carte) */
.carte .rouen-nom { transform: translate(calc(4px * var(--k, 1)), calc(-3px * var(--k, 1))); }
.carte .nom.on { display: inline; }
.carte.attente .rouen { transform-box: fill-box; transform-origin: center; animation: battement 2.2s ease-in-out infinite; }
@keyframes battement { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.9); } }
.carte.tout .point { stroke-width: .8; }
.bulle { position: absolute; left: 0; bottom: 3%; max-width: min(340px, 52%); margin: 0; padding: 10px 14px; background: color-mix(in srgb, var(--blanc) 95%, transparent); border: 1px solid var(--filet); border-left: 3px solid var(--magenta); font-size: .88rem; line-height: 1.4; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.bulle.on { opacity: 1; transform: none; }
.bulle b { display: block; font: italic 500 1.15rem var(--serif); }
.bulle ul { list-style: none; margin: 4px 0 0; padding: 0; }
.bulle li { display: flex; flex-wrap: wrap; gap: 0 8px; }
.bulle .t { font-weight: 600; }

/* ———— l'accueil, composé par le client : l'ouverture de la 04 devient la pieuvre de la 10, puis le menu, puis les spectacles
   un par écran (les chapitres de la 09), chacun avec l'effet de son motif ; puis la saison sur la carte, les donateurs ————
   Les couleurs de la saison (règle 22) viennent de D.site.couleurSaison, écrites par le script (couleursSaison) : --saison
   (la couleur, qui porte la pieuvre blanche), --saison-vive, --saison-texte (lisible sur le papier, de jour comme de nuit) et
   la nuit bleue de la scène (--sc-a, --sc-b, --sc-c ; --sc-terne : le blanc atténué, qui reste AA, photo comprise). Rien
   n'est écrit en dur : une nouvelle création colore l'accueil sans toucher au code. Dans l'accueil, plus de magenta. */
.acc { --magenta: var(--saison-texte); --magenta-texte: var(--saison-texte); --magenta-vif: var(--saison-vive); }
.acc .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* le premier écran : la nuit bleue de la saison, la pieuvre au milieu (une toile), les titres autour ; derrière elle, à peine,
   les photos des spectacles qui s'enchaînent en fondu (celle du spectacle qu'on regarde passe devant) */
.scene { position: relative; isolation: isolate; overflow: hidden; min-height: calc(100svh - var(--haut)); color: #fff; user-select: none; -webkit-user-select: none;
  background: radial-gradient(78% 88% at 50% 40%, var(--sc-a) 0%, var(--sc-b) 58%, var(--sc-c) 100%); }
.scene.sur-bras { cursor: pointer; }
.sc-diapo { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.sc-cadre { position: sticky; top: var(--haut); height: calc(100svh - var(--haut)); max-height: 100%; overflow: hidden; }
.sc-image { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
.sc-image.est-vu { opacity: .22; }
.sc-image img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; filter: saturate(.8) brightness(.8); transform: scale(1.07); transition: transform 9s linear; }
.sc-image.est-vu img { transform: none; }
/* (les bords restent la nuit de la scène : les titres s'y lisent) */
.sc-cadre::after { content: ""; position: absolute; inset: 0; background: radial-gradient(72% 78% at 50% 44%, transparent 28%, color-mix(in srgb, var(--sc-c) 72%, transparent) 100%); }
.sc-toile { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

.sc-pause { position: absolute; z-index: 4; right: var(--gout); top: 14px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1.5px solid color-mix(in srgb, #fff 60%, transparent); border-radius: 50%;

.sc-titres { list-style: none; margin: 0; padding: 0; }

/* le menu (règle 21), sous la scène : les quatre éléments de D.site.menu, chacun son petit dessin ; l'onde se trace au survol */
.acc-menu { position: relative; padding: clamp(36px, 5.5vw, 76px) 0; background: var(--papier); border-bottom: 1px solid var(--filet); }
.am-liste { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 24px); }
.am-a { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; height: 100%; min-height: 210px; padding: 22px 22px 18px; border: 1px solid var(--filet); border-radius: 10px;
