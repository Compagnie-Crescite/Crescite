/* ———————————— le mouvement (règle 15) : la pousse et le filet ; voir le bloc « Mouvement » en tête du script ————————————
   Une seule courbe (rapide puis posée), des durées courtes : survol 180 ms, pression 60 ms, page 300 ms, carte → en-tête 400 ms. */
:root { --mv-courbe: cubic-bezier(.2, .7, .2, 1); }
/* les pages : l'en-tête reste en place, la nouvelle page monte de 12 px (une animation composée de <main>, voir entrer()) ;
   la View Transition ne capture que ce qui se transforme : la carte qui devient l'en-tête, la pastille de l'onglet
   (la page entière n'est pas capturée : la capture d'un écran entier coûte, et rien n'y gagne) */
html { view-transition-name: none; }
/* la carte d'un spectacle (ou la porte d'une entrée) devient l'en-tête de sa page, et y revient */
::view-transition-group(mv-partage) { animation-duration: .4s; animation-timing-function: cubic-bezier(.3, .72, .12, 1); }
::view-transition-old(mv-partage) { animation: .14s ease-out both page-fondu; }
::view-transition-new(mv-partage) { animation: .22s var(--mv-courbe) both page-fondu-entre; }
/* d'un onglet à l'autre d'un spectacle : l'ouverture ne bouge pas, la pastille de l'onglet glisse */
html[data-mv-transition="onglet"] .u-onglets a[aria-current="page"] { view-transition-name: onglet-actif; }
::view-transition-group(onglet-actif) { animation-duration: .28s; animation-timing-function: var(--mv-courbe); }
@keyframes page-fondu { to { opacity: 0; } }
@keyframes page-fondu-entre { from { opacity: 0; } }
/* entre les onglets, le titre ne se réécrit pas */
.sp-une.deja .u-titre .ch, .sp-une.deja .ecrit .w { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
/* les filets se tracent de gauche à droite, à l'arrivée dans l'écran */
section.bloc { position: relative; border-top: 0; }
.filet { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--filet); transform-origin: 0 50%; pointer-events: none; }
.filet[data-mv="trace"].mv-attente { transition: transform .9s var(--mv-courbe); }
/* la pression : la pièce s'enfonce d'un rien, à l'instant même */
:is(.bouton, .bu, .puce, .idx-tout, .idx, .menu, .som-b, .et-rac button, .entrees a, .barre a, .second a, .dos-bt, .fu-a, .suivant, .u-onglets a, .rs-date, .rs-reserver, .rs-seance, .lc-b) { transition-property: background, color, border-color, box-shadow, scale; transition-duration: .18s, .18s, .18s, .18s, .12s; }
:is(.bouton, .bu, .puce, .idx-tout, .idx, .menu, .som-b, .et-rac button, .entrees a, .barre a, .second a, .dos-bt, .u-onglets a, .rs-date, .rs-reserver, .rs-seance, .lc-b).mv-presse { scale: .965; transition-duration: .06s; }
.fu:has(> .fu-a.mv-presse), .fp:has(.mv-presse:is(.fp-ph, .fp-t a)), .ac:has(.mv-presse:is(.ac-ph, .ac-t a)) { scale: .985; transition: scale .06s; }
.suivant.mv-presse .fleche { translate: 14px 0; }
.dates > li .t.mv-presse, .prochaines a.mv-presse { opacity: .75; }
/* ce qui vit : « en tournée » respire */
.fu-badge.tournee::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: .1em; animation: respire 2.4s ease-in-out infinite; }
@keyframes respire { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
/* une ligne vers laquelle la frise mène */
.dates > li.est-vise, .sa-dates > li.est-vise { animation: vise 1.2s var(--mv-courbe); }
@keyframes vise { 0%, 35% { background: color-mix(in srgb, var(--magenta) 18%, transparent); } }

/* les longs contenus se rendent par morceaux : ce qui est hors de l'écran n'est mis en page qu'à son arrivée */
.fp { content-visibility: auto; contain-intrinsic-size: auto 680px; }
.ac { content-visibility: auto; contain-intrinsic-size: auto 860px; }
article.u .chap { content-visibility: auto; contain-intrinsic-size: auto 1000px; }

/* ———— les frises (FRISE), sur le papier de la synthèse ———— */
.frise[data-frise] { --fr-fond: var(--papier); --fr-encre: var(--encre); --fr-trait: color-mix(in srgb, var(--encre) 26%, transparent); --fr-accent: var(--saison-texte);
  --fr-police: var(--sans); --fr-bulle-fond: var(--encre); --fr-bulle-encre: var(--papier); --fr-point: 11px; --fr-couloir: 17px; }
.frise .frise-mois-nom { font: 500 .92rem/1.1 var(--titre); }
.frise .frise-an { font: 500 .72rem/1.3 var(--sans); letter-spacing: .06em; }
.frise .frise-aujourdhui-nom { font: 600 .66rem/1 var(--etiq); letter-spacing: .12em; text-transform: uppercase; }
/* (« aujourd'hui » paraît avec sa frise, d'un fondu bref et sans attendre l'axe : il se lit dès que la frise est à l'écran) */
.frise[data-frise].est-vue .frise-aujourdhui { animation-duration: .25s; animation-delay: 0s; }
.frise .frise-bulle { font: 400 .86rem/1.4 var(--sans); box-shadow: 0 14px 30px -14px rgba(29, 20, 24, .55); }
.frise .frise-bulle b { font: 500 1.08rem/1.2 var(--titre); }
.frise .frise-grappe-n { font-family: var(--sans); }
.v-frise, .sa-frise, .e-frise { margin: 0 0 26px; }
/* la légende d'une frise de dates (règle 23) : les signes de ses repères, quand elle en mêle : tout public (le point),
   scolaire (le losange), résidence (le carré évidé de FRISE) */
.fr-legende { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 20px; margin: -12px 0 24px; padding: 0; font: 500 .84rem/1.3 var(--sans); color: var(--gris); }
.fr-legende li { display: inline-flex; align-items: center; gap: 8px; }
.fr-legende i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.fr-legende .fr-l-sco i { width: 9px; height: 9px; border-radius: 2px; rotate: 45deg; }
.fr-legende .fr-l-res i { border-radius: 2px; background: none; box-shadow: inset 0 0 0 2px currentColor; }
.u .fr-legende { color: var(--u-texte2); }
.u-frise + .fr-legende { margin-top: calc(-1 * clamp(14px, 2.4vw, 28px)); }
/* ———— la saison en cours (#/saisons, composée comme la 07 : le noir et la lumière) ————
   La tête de page en grand (la compagnie en capitales espacées, « Saisons » et une lueur de la saison derrière lui ; ses
   raccourcis, chacun sa lampe) ; la recherche soulignée d'un filet qui s'allume ; les spectacles en étiquettes droites, une
   lampe à leur couleur (choisi : le cadre s'allume). Puis la saison sous sa marque : son titre éclairé, la lampe de la
   saison, « la saison en cours », un filet de lumière ; sa frise (l'axe, un filet de lumière ; chaque date une lampe à la
   couleur de son spectacle, éteinte une fois jouée ; la prochaine bat ; « aujourd'hui », un trait de lumière) et sa légende ;
   ses prochaines dates et toutes ses dates (une lampe à la couleur du spectacle, le jour en grand, le titre dans la police
   de son univers), à côté de sa carte, qui écrit sous elle la commune survolée. La lumière est la couleur de la saison
   (--saison-vive), le noir celui de la synthèse. */
.s7-entete { padding: clamp(56px, 7vw, 96px) 0 clamp(18px, 2.5vw, 32px); background: radial-gradient(min(62rem, 150vw) min(34rem, 100vw) at 14% 0, color-mix(in srgb, var(--saison-vive) 13%, transparent), transparent 72%) no-repeat; }
.s7-sur { margin: 0; font: 600 .875rem/1.3 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
.s7-titre { margin: .9rem 0 0; font: 500 clamp(2.75rem, 1.5rem + 5.4vw, 6rem)/.98 var(--titre); letter-spacing: -.015em; text-wrap: balance; overflow-wrap: break-word;
  text-shadow: 0 0 44px color-mix(in srgb, var(--saison-vive) 24%, transparent); }
.s7-rac { list-style: none; display: flex; flex-wrap: wrap; gap: 0 clamp(18px, 2.6vw, 36px); margin: clamp(14px, 2vw, 24px) 0 0; padding: 0; }
.s7-rac button { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; color: color-mix(in srgb, var(--encre) 86%, transparent);
  font: 600 .95rem/1.2 var(--texte); text-align: left; cursor: pointer; transition: color .18s; }
.s7-rac button:hover { color: var(--encre); }
.s7-lampe { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--saison-vive); opacity: .55; transition: opacity .18s, box-shadow .18s; }
.s7-rac button:is(:hover, :focus-visible) .s7-lampe { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--saison-vive) 22%, transparent), 0 0 14px 3px color-mix(in srgb, var(--saison-vive) 55%, transparent); }
.s7-outils { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.1rem; padding-top: clamp(4px, 1vw, 10px); padding-bottom: 2rem; }
.s7-cherche { position: relative; display: block; max-width: 24rem; }
.s7-cherche svg { position: absolute; left: 2px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); fill: none; stroke: var(--gris); stroke-width: 1.6; stroke-linecap: round; }
.s7-cherche input { width: 100%; padding: .6rem .5rem .6rem 1.9rem; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--encre) 34%, transparent); border-radius: 0; background: transparent;
  font: 400 1rem var(--texte); color: var(--encre); -webkit-appearance: none; appearance: none; transition: border-color .18s, box-shadow .18s; }
.s7-cherche input::placeholder { color: var(--gris); opacity: 1; }
.s7-cherche input:focus { outline: none; border-bottom-color: var(--saison-vive); box-shadow: inset 0 -1px 0 var(--saison-vive), 0 12px 18px -14px var(--saison-vive); }
.s7-chips { display: flex; flex-wrap: wrap; gap: .5rem; min-width: 0; }
.s7-chip { display: inline-flex; align-items: center; gap: .55rem; min-height: 44px; padding: .38rem .85rem; border: 1px solid color-mix(in srgb, var(--encre) 30%, transparent); border-radius: 0; background: transparent;
  font: 600 .875rem/1.2 var(--texte); color: color-mix(in srgb, var(--encre) 86%, transparent); text-align: left; cursor: pointer; transition: border-color .18s, box-shadow .18s, color .18s; }
.s7-chip i { flex: none; width: .45rem; height: .45rem; border-radius: 50%; background: var(--c, var(--gris)); }
.s7-chip:hover { color: var(--encre); border-color: var(--c, var(--saison-vive)); }
.s7-chip[aria-pressed="true"] { color: var(--encre); border-color: var(--c, var(--saison-vive)); box-shadow: 0 0 18px color-mix(in srgb, var(--c, var(--saison-vive)) 30%, transparent), inset 0 0 0 1px var(--c, var(--saison-vive)); }

.s7-chip--lieu { --c: var(--saison-vive); }
/* (la pression : la lumière baisse sous le doigt) */
:is(.s7-chip, .s7-rac button).mv-presse { opacity: .72; scale: .985; transition: opacity .08s, scale .08s; }
.s7 { padding: clamp(1.5rem, 3vw, 2.5rem) 0 clamp(3.5rem, 7vw, 6rem); }
.s7-tete { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem 1.5rem; padding-bottom: 1.1rem; border-bottom: 1px solid var(--saison-vive); box-shadow: 0 14px 24px -22px var(--saison-vive); }
.s7-t { margin: 0; font: 500 clamp(2.25rem, 1.4rem + 3.4vw, 4.25rem)/1 var(--titre); letter-spacing: -.012em; text-shadow: 0 0 34px color-mix(in srgb, var(--saison-vive) 30%, transparent); }
.s7-k { display: flex; align-items: center; gap: .7rem; margin: 0; font: 600 .8125rem/1.3 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--saison-texte); }
.s7-gel { flex: none; width: .65rem; height: .65rem; border-radius: 50%; background: var(--saison-vive); box-shadow: 0 0 0 4px color-mix(in srgb, var(--saison-vive) 22%, transparent), 0 0 18px 4px color-mix(in srgb, var(--saison-vive) 55%, transparent); }
/* la frise de la saison : l'axe est un filet de lumière, chaque date une lampe qui rayonne à la couleur de son spectacle (éteinte
   une fois jouée ; une résidence, un carré évidé), quatre couloirs et aucune grappe ; la prochaine date bat ; « aujourd'hui »,
   un trait de lumière (sa place gardée : rien ne bouge quand elle paraît) */
.fs7 { margin-top: clamp(1.25rem, 2.5vw, 2rem); }
.s7 .v-frise { min-height: 146px; margin: 0; }
.s7 .frise[data-frise] { --fr-trait: color-mix(in srgb, var(--saison-vive) 45%, transparent); --fr-accent: var(--saison-vive); --fr-bulle-fond: var(--papier-2); --fr-bulle-encre: var(--encre);
  --fr-point: 12px; --fr-couloir: 18px; --fr-haut: 28px; --fr-taille: 12px; --fr-passe: .34; }
.s7 .frise[data-frise].frise--mois { --fr-pied: 46px; }
.s7 .frise[data-frise] .frise-axe { height: 1px; background: var(--saison-vive); box-shadow: 0 0 10px 1px color-mix(in srgb, var(--saison-vive) 40%, transparent); }
.s7 .frise[data-frise] .frise-point:not(.est-passe, .est-annule, .est-residence, .est-scolaire.est-duree) > .frise-repere::before { box-shadow: 0 0 0 2px var(--fr-fond), 0 0 14px 3px color-mix(in srgb, var(--fr-c, var(--saison-vive)) 55%, transparent); }
.s7 .frise[data-frise] .frise-point.est-residence:not(.est-duree) > .frise-repere::before { border-radius: 2px; background: var(--fr-fond);
  box-shadow: inset 0 0 0 2px var(--fr-c, var(--saison-vive)), 0 0 0 2px var(--fr-fond), 0 0 12px 2px color-mix(in srgb, var(--fr-c, var(--saison-vive)) 35%, transparent); }
.s7 .frise[data-frise] .frise-point.est-residence.est-passe:not(.est-duree) > .frise-repere::before { box-shadow: inset 0 0 0 2px var(--fr-c, var(--saison-vive)), 0 0 0 2px var(--fr-fond); }
.s7 .frise[data-frise] .frise-mois > li > span:first-child { top: 13px; }
.s7 .frise[data-frise] .frise-mois-nom { font: 500 .92rem/1.1 var(--titre); }
.s7 .frise[data-frise] .frise-an { font: 600 .72rem/1.3 var(--etiq); letter-spacing: .14em; color: var(--gris); }
.s7 .frise[data-frise] .frise-aujourdhui::before { width: 1px; background: var(--saison-vive); box-shadow: 0 0 12px 2px color-mix(in srgb, var(--saison-vive) 55%, transparent); opacity: 1; }
.s7 .frise[data-frise] .frise-aujourdhui-nom { font: 600 .68rem/1 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--saison-texte); }
.s7 .frise[data-frise] .frise-bulle { border: 1px solid color-mix(in srgb, var(--encre) 30%, transparent); border-radius: 0; box-shadow: 0 18px 44px rgba(0, 0, 0, .6), 0 0 30px color-mix(in srgb, var(--saison-vive) 14%, transparent); }
.s7 .frise[data-frise] .frise-bulle b { font: 500 1.1rem/1.2 var(--titre); }
.s7 .frise[data-frise] :is(.frise-point.est-passe + .frise-point:not(.est-passe), .frise-point:first-child:not(.est-passe)) > .frise-repere::after { content: ""; position: absolute; left: 50%; top: 50%;
  width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--fr-c, var(--saison-vive)); opacity: 0; animation: s7-prochaine 2.4s ease-out 1.2s infinite; pointer-events: none; }
@keyframes s7-prochaine { 0% { opacity: .6; scale: 1; } 80%, 100% { opacity: 0; scale: 2.8; } }
.s7 .frise[data-frise].est-filtre .frise-point { transition: opacity .2s; }
.s7 .frise[data-frise].est-filtre .frise-point:not(.est-sp) { opacity: .14; }
/* la légende : chaque spectacle, sa lampe, son titre et le nombre de ses dates (un spectacle écarté s'éteint) ; le losange des
   dates scolaires, le carré évidé des résidences */
.fs7-leg { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem 1.6rem; margin: .4rem 0 0; padding: 0; font: 400 .9375rem/1.4 var(--texte); }
.fs7-l { display: inline-flex; align-items: flex-start; gap: .55rem; color: color-mix(in srgb, var(--encre) 86%, transparent); cursor: default; }
.fs7-l i { flex: none; width: .6rem; height: .6rem; margin-top: calc((1lh - .6rem) / 2); border-radius: 50%; background: var(--c); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--c) 45%, transparent); }

.fs7-l.est-vide { color: var(--gris); }
.fs7-l.est-vide i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.fs7-sc i { width: .55rem; height: .55rem; border-radius: 1px; rotate: 45deg; background: var(--encre); box-shadow: none; }
.fs7-rs i { border-radius: 1px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--encre); }
/* les prochaines dates, puis toutes les dates de la saison, à côté de sa carte (qui suit la lecture) */
.ag7 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); grid-template-areas: "proch carte" "toutes carte"; grid-template-rows: auto 1fr; gap: 3rem clamp(2rem, 5vw, 5rem);
  align-items: start; margin-top: clamp(2rem, 4vw, 3rem); }
.ag7 > .ag-listes { display: contents; }
.ag7-proch { grid-area: proch; min-width: 0; }
.ag7-toutes { grid-area: toutes; min-width: 0; }
.s7-h { display: flex; align-items: center; gap: .8rem; margin: 0 0 1.25rem; font: 600 .875rem/1.3 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
.s7-h::after { content: ""; flex: 1; height: 1px; background: var(--filet); }
.d7-mois + .d7-mois { margin-top: 2.5rem; }
.d7-mois-t { margin: 0; padding-bottom: .8rem; font: 600 .875rem/1.3 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
.d7s { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--filet); }
.d7 { position: relative; display: grid; grid-template-columns: minmax(0, 12.5rem) minmax(0, 1fr); gap: .3rem 2rem; padding: 1.25rem 0 1.3rem 1.6rem; border-bottom: 1px solid var(--filet); transition: background-color .18s; }
.d7::before { content: ""; position: absolute; left: .15rem; top: 1.75rem; width: .5rem; height: .5rem; border-radius: 50%; background: var(--c); opacity: .6; transition: opacity .18s, box-shadow .18s; }
.d7:hover::before, .d7:is(.on, .est-allume)::before { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent), 0 0 16px 4px color-mix(in srgb, var(--c) 55%, transparent); }
.d7:is(.on, .est-allume) { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 11%, transparent), transparent 75%); }
.d7.est-vise { animation: vise 1.2s var(--mv-courbe); }
.d7 p { margin: 0; }
.d7-a, .d7-b { min-width: 0; }
.d7-quand { font: 500 1.375rem/1.15 var(--titre); }
.d7 :is(.d7-heure, .d7-ou) { margin-top: .25rem; font: 600 .9375rem/1.4 var(--texte); color: color-mix(in srgb, var(--encre) 86%, transparent); }
.d7 .d7-tag { display: inline-block; margin: .45rem .4rem 0 0; padding: .12rem .5rem; border: 1px solid color-mix(in srgb, var(--encre) 34%, transparent); font: 600 .6875rem/1.4 var(--etiq); letter-spacing: .14em; text-transform: uppercase; color: var(--gris); }
.d7 .d7-tag--rs { border-style: dashed; }
.d7 .d7-etat { margin-top: .4rem; font: 600 .72rem/1.3 var(--etiq); letter-spacing: .1em; text-transform: uppercase; color: var(--saison-texte); }
.d7-t { font-family: var(--u-titre-f, var(--titre)); font-weight: var(--u-titre-g, 500); font-size: 1.375rem; line-height: 1.2; }
.d7-t a { text-decoration: none; background: linear-gradient(var(--c), var(--c)) 0 100% / 0 1px no-repeat; transition: background-size .3s var(--mv-courbe); }
.d7-t a:hover { background-size: 100% 1px; }
.d7 .d7-lieu { margin-top: .25rem; font-weight: 600; }
.d7-lieu a { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--encre) 30%, transparent); text-underline-offset: 3px; }
.d7-lieu a:hover { text-decoration-color: var(--c); }
.d7 .det { margin-top: .3rem; }
.d7--suite { display: block; padding-top: .6rem; }
.d7.est-passe :is(.d7-quand, .d7-t, .d7-lieu, .d7-heure) { color: var(--gris); }
.d7.est-passe::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); opacity: 1; }
.auj7 { position: relative; display: flex; align-items: center; gap: .9rem; padding: 1rem 0 .9rem 1.6rem; font: 700 .75rem/1.2 var(--etiq); letter-spacing: .18em; text-transform: uppercase; color: var(--saison-texte); }
.auj7::before { content: ""; position: absolute; left: .1rem; top: 50%; width: .6rem; height: .6rem; margin-top: -.3rem; border-radius: 50%; background: var(--saison-vive);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--saison-vive) 22%, transparent), 0 0 16px 4px color-mix(in srgb, var(--saison-vive) 55%, transparent); }
.auj7::after { content: ""; flex: 1; height: 1px; background: var(--saison-vive); box-shadow: 0 0 10px 1px color-mix(in srgb, var(--saison-vive) 40%, transparent); }
/* la carte de la saison, une lueur derrière elle ; sous elle, la commune survolée (ou choisie) et ses dates */
.ag7-carte { grid-area: carte; position: sticky; top: calc(var(--haut) + 20px); isolation: isolate; margin: 0; min-width: 0; }
.ag7-carte::before { content: ""; position: absolute; inset: 0 -4% 22%; z-index: -1; background: radial-gradient(closest-side, color-mix(in srgb, var(--saison-vive) 9%, transparent), transparent); pointer-events: none; }
.ag7-carte .carte { max-height: calc(100svh - var(--haut) - 170px); }
.s7-legende { min-height: 5.25rem; margin-top: 1rem; padding-left: 1rem; border-left: 1px solid color-mix(in srgb, var(--encre) 30%, transparent); }
.s7-leg-nom { display: block; font: 500 clamp(1.375rem, 2vw, 1.75rem)/1.15 var(--titre); color: var(--encre); text-shadow: 0 0 22px color-mix(in srgb, var(--saison-vive) 35%, transparent); }
.s7-ll { display: flex; flex-wrap: wrap; gap: 0 .75rem; margin-top: .3rem; font-size: .9375rem; line-height: 1.45; color: color-mix(in srgb, var(--encre) 86%, transparent); }
.s7-lt { color: var(--gris); }
@media (max-width: 1000px) {
  .ag7 { grid-template-columns: minmax(0, 1fr); grid-template-areas: "proch" "carte" "toutes"; grid-template-rows: auto; }

}

  .s7-chips::-webkit-scrollbar { display: none; }
  .s7-chip, .s7-chips #choix-lieu { flex: none; }
  .s7-cherche { max-width: none; }
  .d7 { grid-template-columns: minmax(0, 1fr); padding-left: 1.4rem; }
  .fs7-leg { gap: .45rem 1.1rem; font-size: .875rem; }
  .ag7-carte .carte { max-height: 36vh; }
  .s7-legende { min-height: 0; }
}
.dates > li.est-allume, .sa-dates > li.est-allume, .prochaines li.est-allume a { background: color-mix(in srgb, var(--saison-texte) 9%, transparent); }
.carte .carte-lieu.est-allume .point { stroke: var(--encre); stroke-width: 2.4; }
/* la frise des saisons passées (la 04) : une arche par saison, plus ou moins haute, dans l'embrasure */
.frise-saisons { --fr-fond: var(--nuit); --fr-bande-h: 46px; --fr-haut: 22px; --fr-pied: 32px; }

.frise-saisons .frise-bande.est-passe .frise-bande-barre { opacity: .62; }

.frise-saisons .frise-bande-n { font: 600 .74rem var(--sans); color: var(--encre); }
.frise-saisons .frise-bande-nom { font: 500 .7rem var(--sans); color: var(--gris); }
.sai.est-allume > summary { background: color-mix(in srgb, var(--saison-vive) 9%, transparent); }
/* la diffusion d'un spectacle, saison par saison (programmer) */
.prog-frise { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--u-filet); }
.prog-frise .k, .u-diff .k { margin: 0 0 2px; font: 600 .76rem/1.4 var(--u-etiq); letter-spacing: .13em; text-transform: uppercase; color: var(--u-vif); }
.frise-diffusion { --fr-bande-h: 30px; --fr-haut: 16px; --fr-pied: 26px; --fr-taille: 11px; }
.frise-diffusion .frise-bande-barre { background: var(--u-vif); border-radius: 2px 2px 0 0; }
.frise-diffusion .frise-bande-nom { opacity: .8; letter-spacing: -.02em; }
.frise-diffusion .frise-bande.est-passe .frise-bande-barre { opacity: .78; }
.prog-frise .frise-diffusion { --fr-taille: 10px; }
/* dans une fiche étroite : le nom de la première et de la dernière saison ; celui des autres au survol et au focus */

.prog-frise .frise-bande:is(:hover, .est-allume, :focus-within) ~ .frise-bande:last-child .frise-bande-nom,
.prog-frise .frise-bandes:has(.frise-bande:is(:hover, :focus-within):not(:first-child)) .frise-bande:first-child .frise-bande-nom { opacity: .25; }
.frise-diffusion .frise-aujourdhui-nom { display: none; }
.u-diff { margin-top: clamp(26px, 4vw, 48px); }
.p-diff { margin: 4px 0 26px; max-width: 560px; }
.frise-compagnie { --fr-bande-h: 44px; --fr-haut: 18px; }
.frise-compagnie .frise-bande-barre { background: var(--ec, var(--magenta)); }
.u-diff .frise-diffusion { --fr-bande-h: 54px; --fr-taille: 12px; }
/* dans l'univers d'un spectacle */
.u .frise[data-frise] { --fr-fond: var(--u-fond); --fr-encre: var(--u-texte); --fr-trait: color-mix(in srgb, var(--u-texte) 30%, transparent); --fr-accent: var(--u-vif);
  --fr-bulle-fond: var(--u-texte); --fr-bulle-encre: var(--u-fond); --fr-police: var(--u-etiq); }
.u .frise .frise-mois-nom { font-family: var(--u-corps); font-style: normal; }

.u-frise { margin: 0 0 clamp(26px, 4vw, 44px); }
.u-frise .frise[data-frise] { --fr-point: 12px; }
/* la frise historique de la compagnie (la 06) : l'axe, un bras effilé à la couleur de la saison ; les titres en italique, en
   couloirs serrés (celui d'en bas passe devant le filet de celui d'au-dessus) */
.c-frise .frise[data-frise] { --fr-trait: var(--saison-texte); --fr-accent: var(--saison-texte); --fr-point: 12px; --fr-couloir: 22px; --fr-haut: 28px; --fr-passe: .42; }
.c-frise .frise-axe { height: 5px; margin-top: -2.5px; background: var(--fr-trait); clip-path: polygon(0 0, 100% 40%, 100% 60%, 0 100%); }
.c-frise .frise-point { z-index: calc(10 - var(--fr-y, 0)); }
.c-frise .frise-etiquette { max-width: 13.6em; padding: 0 .3em; margin: 0 -.3em; background: var(--fr-fond); font: italic 500 .95rem/1.2 var(--titre); }
.c-frise .frise-repere:hover .frise-etiquette, .c-frise .frise-repere:focus-visible .frise-etiquette { color: var(--saison-texte); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.c-frise .frise-mois-nom { font: italic 500 .9rem/1.1 var(--titre); }

/* ———— réserver une date, d'un geste (règle 17, RESERVER) ————
   La bande des prochaines dates (un bouton par date, l'horaire écrit dessus), la carte de la date choisie dans l'univers de
   son spectacle ; sur les saisons (#/saisons), chaque date de l'agenda ouvre sa carte sous sa ligne. Le geste
   évident de la carte : « Réserver », plein, de la couleur du spectacle. */
.rs-zone { position: relative; margin: 0 0 clamp(34px, 4.6vw, 60px); scroll-margin-top: calc(var(--onglets) + 6px); }
@media (pointer: coarse), (max-width: 640px) { .rs-defile, .rs-zone.rs-deborde .rs-defile { display: none; } }
.rs-tete { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 18px; margin: 0 0 12px; }
.rs-k-bande { margin: 0; font: 600 .74rem/1.3 var(--u-etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--u-vif); }
/* les flèches gardent leur place (rien ne bouge quand elles paraissent) */
.rs-defile { display: flex; gap: 8px; margin: 0; visibility: hidden; }
.rs-zone.rs-deborde .rs-defile { visibility: visible; }
.rs-defile button { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 1.5px solid var(--u-filet); border-radius: 50%; background: transparent; color: var(--u-texte); cursor: pointer; transition: border-color .18s, background .18s, opacity .18s; }
.rs-defile button:hover { border-color: var(--u-texte); background: color-mix(in srgb, var(--u-texte) 8%, transparent); }
.rs-defile button[disabled] { opacity: .3; cursor: default; }
.rs-defile svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rs-bande { gap: 10px; margin: 0 calc(-1 * var(--gout)); padding: 4px var(--gout) 20px; scroll-padding-inline: var(--gout); scrollbar-width: none; scroll-behavior: smooth;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--gout), #000 calc(100% - var(--gout)), transparent); mask-image: linear-gradient(90deg, transparent, #000 var(--gout), #000 calc(100% - var(--gout)), transparent); }
.rs-bande::-webkit-scrollbar { display: none; }
.rs-date { position: relative; min-width: 8.8rem; max-width: 13rem; padding: 12px 16px 14px; border: 1.5px solid var(--u-filet); border-radius: 12px; background: color-mix(in srgb, var(--u-texte) 5%, transparent); color: var(--u-texte); }
.rs-date:hover { border-color: color-mix(in srgb, var(--u-texte) 55%, transparent); }
.rs-date:focus-visible { outline: 2px solid var(--u-vif); outline-offset: 3px; }
.rs-q { display: block; white-space: nowrap; }
.rs-s { display: block; font: 600 .68rem/1.35 var(--u-etiq); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.rs-n { font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: 2.05rem; line-height: 1.08; }
.rs-m { font: 600 .9rem/1 var(--sans); }
.rs-h { display: block; margin-top: 8px; font: 700 1.02rem/1.25 var(--sans); font-variant-numeric: tabular-nums; }
.rs-h--sans { font: 500 .78rem/1.3 var(--sans); color: var(--u-texte2); }
.rs-o { display: block; max-width: 100%; margin-top: 3px; overflow: hidden; font-size: .82rem; line-height: 1.3; color: var(--u-texte2); white-space: nowrap; text-overflow: ellipsis; }
.rs-date[aria-pressed="true"] { background: var(--u-accent); border-color: var(--u-accent); color: var(--u-sur-accent); box-shadow: 0 16px 30px -18px color-mix(in srgb, var(--u-accent) 90%, transparent); }
.rs-date[aria-pressed="true"] :is(.rs-s, .rs-o, .rs-h--sans) { color: inherit; opacity: .85; }
.rs-date[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; border-radius: 0 0 3px 0; background: var(--u-accent); transform: translateX(-50%) rotate(45deg); }
.rs-date.est-allume:not([aria-pressed="true"]) { border-color: var(--u-vif); }
.rs-corps { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(22px, 4vw, 56px); align-items: start; margin-top: 2px; }
/* la carte : l'affiche d'une date, dans l'univers de son spectacle (--rs-bg : son fond, que l'encre reprend) */
.rs-carte { --rs-bg: var(--u-fond2); position: relative; isolation: isolate; overflow: hidden; min-height: 330px; border-radius: 14px; background: var(--rs-bg); color: var(--u-texte); font-family: var(--u-corps); box-shadow: 0 0 0 1px var(--u-filet), 0 34px 64px -40px rgba(0, 0, 0, .7); }

.u-clair .rs-photo, .rs-carte.u-clair .rs-photo { opacity: .3; }
.rs-encre { position: absolute; z-index: -2; border-radius: 50%; background: var(--rs-bg); pointer-events: none; }

/* ———————————— le scrollytelling (prévisualisation) : le défilement raconte ————————————
   La lecture fait avancer le récit, et rien d'autre : des animations liées au défilement (CSS, composées hors du fil
   principal, scrubbables : on remonte, le récit revient) là où le navigateur les a (@supports), sinon l'état d'avant
   (l'écriture mot à mot à l'arrivée, la carte qui pousse d'un coup). L'état de base est toujours l'état final, lisible :
   sans mouvement (html.still) ou l'animation retirée (le vérificateur), tout est posé. Les durées ne sont plus en
   millisecondes mais en hauteur d'écran : « entry » (ce qui entre par le bas), « exit » (ce qui sort par le haut),
   « cover » (toute la traversée). */
/* 1. le texte qui s'allume à la lecture : affirmation, citations, apartés (.lit, --n mots) : chaque mot passe de l'ombre à
   la lumière quand sa phrase traverse le milieu de l'écran, dans l'ordre, au rythme du lecteur ; en remontant, il s'éteint */
@supports (animation-timeline: view()) {
  html:not(.still):not(.sur-place) .lit { view-timeline: --lit block; }
  html:not(.still):not(.sur-place) .lit .w, html:not(.still):not(.sur-place) .lit.vu .w { opacity: 1; transform: none; filter: none;
    animation: mot-lu linear both; animation-timeline: --lit;
    animation-range: cover calc(18% + var(--w, 0) * 34% / var(--n, 20)) cover calc(30% + var(--w, 0) * 34% / var(--n, 20)); }
  @keyframes mot-lu { from { opacity: .18; transform: translateY(.08em); } to { opacity: 1; transform: none; } }
  /* 2. l'ouverture d'un spectacle prend de la profondeur : en la quittant, la photo reste en arrière (elle suit déjà la
     lecture, --p), le texte monte plus vite que la page et s'efface, la poursuite et le gobo s'éteignent : une scène, une salle */
  html:not(.still) .sp-une { view-timeline: --une block; }
  html:not(.still) .une-texte { animation: une-texte linear both; animation-timeline: --une; animation-range: exit 0% exit 100%; }
  html:not(.still) .une-lueur, html:not(.still) .une-motif { animation: une-lueur linear both; animation-timeline: --une; animation-range: exit 0% exit 100%; }
  @keyframes une-texte { from { translate: 0 0; opacity: 1; } to { translate: 0 -22%; opacity: .08; } }
  @keyframes une-lueur { from { opacity: 1; } to { opacity: 0; } }
  /* 3. la scène de l'accueil se retire : la pieuvre et ses titres glissent plus lentement que la page et s'éteignent sous le
     menu ; les cartes du menu montent à leur entrée, l'une après l'autre (--i) */
  html:not(.still) .scene { animation: scene-part linear both; animation-timeline: view(); animation-range: exit 0% exit 100%; }
  @keyframes scene-part { from { translate: 0 0; opacity: 1; } to { translate: 0 28%; opacity: .2; } }
  html:not(.still) .am { animation: carte-monte linear both; animation-timeline: view(); animation-range: entry calc(var(--i, 0) * 12%) entry calc(64% + var(--i, 0) * 12%); }
  @keyframes carte-monte { from { translate: 0 44px; opacity: 0; } to { translate: 0 0; opacity: 1; } }
  /* 4. le spectacle suivant monte : au bout de la page d'un spectacle, la photo du suivant se lève avec son bandeau */
  html:not(.still) .suivant-fond img { animation: suivant-monte linear both; animation-timeline: view(); animation-range: entry 0% entry 100%; }
  @keyframes suivant-monte { from { translate: 0 42%; opacity: 0; } to { translate: 0 0; opacity: .34; } }
  /* 5. l'histoire de la compagnie en chapitres : l'étape qui traverse le milieu de l'écran s'allume, les autres attendent */
  html:not(.still) .frise-l > li { animation: etape-lue linear both; animation-timeline: view(); animation-range: cover 0% cover 100%; }
  @keyframes etape-lue { 0%, 16% { opacity: .28; } 34%, 64% { opacity: 1; } 84%, 100% { opacity: .28; } }
  @media (max-width: 899px) {
    html:not(.still) .frise-l > li { animation-name: etape-lue-haut; }
    @keyframes etape-lue-haut { 0%, 8% { opacity: .28; } 18%, 44% { opacity: 1; } 56%, 100% { opacity: .28; } }
  }
}
/* 6. la tournée qui se dessine au fil des dates (le script : auFil, la ligne de lecture) : sur une carte épinglée à côté de sa
   liste (.au-fil), les bras attendent ; chacun pousse quand sa date franchit le milieu de l'écran, sans cascade (son tour est
   venu), la commune lue se nomme ; en remontant, les bras se retirent d'autant. La ligne lue est marquée (.lu), son repère
   sur la frise aussi */
.carte.au-fil .carte-lieu .m, .carte.au-fil .carte-lieu .bout, .carte.au-fil .carte-lieu .point { transition-delay: 0s; }
.carte.au-fil .carte-lieu:not(.est-pousse) .m, .carte.au-fil .carte-lieu:not(.est-pousse) .bout { stroke-dashoffset: 1; }
.carte.au-fil .carte-lieu:not(.est-pousse) .point { opacity: 0; }
.carte.au-fil .carte-lieu.est-pousse .bout { transition-delay: .55s; }
.carte.au-fil .carte-lieu.est-pousse .point { transition-delay: .45s; }
.carte.simple.au-fil .carte-lieu:not(.est-pousse) { opacity: .16; }
.carte.au-fil .carte-lieu.lu .point { stroke: var(--encre); stroke-width: 2.4; }
.carte.au-fil .nom.lu { display: inline; }
.dates > li.lu, .sa-dates > li.lu { background: color-mix(in srgb, var(--saison-texte) 8%, transparent); box-shadow: inset 3px 0 0 var(--c, var(--saison-texte)); transition: background .3s, box-shadow .3s; }
.u .dates > li.lu { background: color-mix(in srgb, var(--u-vif) 11%, transparent); box-shadow: inset 3px 0 0 var(--u-vif); }
.frise[data-frise] .frise-point.lu > .frise-repere::before { scale: 1.5; opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--fr-c, var(--fr-accent)) 30%, transparent); }
/* le bandeau du spectacle suivant, dans son univers : sa photo sous un voile, pour que son titre se lise */
.suivant { background: var(--u-fond); }
.suivant .u-sur .mo { width: 26px; height: 26px; }   /* (le petit motif de l'univers, à sa taille : sans elle, il emplissait le bandeau) */
.suivant::before { z-index: 1; }
.suivant > .wrap { z-index: 2; }
.suivant-fond { position: absolute; inset: 0; z-index: 0; overflow: clip; }   /* (clip : pas un conteneur de défilement, la photo garde la page pour ligne du temps) */
.suivant-fond img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; opacity: .34; filter: saturate(.85); }
.suivant-fond::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--u-fond) 0, color-mix(in srgb, var(--u-fond) 78%, transparent) 46%, color-mix(in srgb, var(--u-fond) 30%, transparent) 100%); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
/* l'ouverture, habillée (celle de la 04) : le logo blanc sur le dégradé de la saison ; la flèche à sa couleur vive.
   Moins d'animations : les photos de la scène changent quand même d'un fondu bref */
.intro.intro-synthese .intro-indice { color: var(--saison-vive); opacity: .9; }
@media (prefers-reduced-motion: reduce) { .sc-image { transition: opacity .35s ease !important; } }

<body>
<a class="evitement" href="#main">Aller au contenu</a>
<header class="top" id="top"><div class="top-in">
  <a class="marque" href="#/"><span class="l" id="marque" data-pieuvre aria-hidden="true"></span><span id="nom"></span></a>
  <nav class="entrees" id="entrees"></nav>
  <button class="menu" type="button" aria-expanded="false" aria-controls="second"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg><span id="menu-t"></span></button>
  <nav class="second" id="second"></nav>
</div></header>
<nav class="barre" id="barre"></nav>
<main id="main" tabindex="-1"></main>
<footer><div class="wrap pied" id="pied"></div></footer>
<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  /* Mouvement : la pousse et le filet. Le meilleur de la 06 (les bras de la tournée qui poussent de Rouen, la frise et la
     carte qui répondent ensemble) et de la 03 (la grille, les filets qui se tracent, les chiffres qui comptent), en plus
     sobre et plus rapide : une seule courbe, rapide puis posée ; survol 180 ms, pression 60 ms, page 300 ms, 450 ms au plus.
     1. Changer de page (MOUVEMENT.transition, View Transitions) : l'en-tête ne bouge pas ; l'ancienne page s'efface en
        remontant à peine, la nouvelle pousse de 14 px ; au retour, l'inverse. La carte d'un spectacle s'agrandit et devient
        l'en-tête de sa page (élément partagé), et y revient ; la porte d'une entrée devient le bandeau de sa page ; entre les
        onglets d'un spectacle, l'ouverture reste, seule la pastille de l'onglet glisse. Un geste interrompt la transition.
     2. Ouvrir une saison, le menu, le sommaire : les lignes arrivent en cascade, la carte de la saison pousse.
     3. Filtrer, chercher : les dates glissent à leur nouvelle place, celles qui partent s'effacent (MOUVEMENT.flip) ; les
        repères de la frise glissent aussi, les saisons de la frise changent de hauteur.
     4. Survol et focus : 180 ms, rien ne se soulève (aucun tremblement au bord), la photo s'approche d'un rien.
     5. Pression : la pièce s'enfonce d'un rien dès le pointerdown (.mv-presse).
     6. Défilement (MOUVEMENT.reveler) : les filets se tracent de gauche à droite, les titres montent, les fiches arrivent
        l'une après l'autre, les chiffres comptent ; les bras de la carte poussent depuis Rouen.
     7. Ce qui vit : « aujourd'hui » respire sur chaque frise, le point « en tournée » aussi.
     Les frises (FRISE) sont le calendrier de chaque page : la saison et les saisons passées sur #/saisons, la
     saison passée, la tournée d'un spectacle, les dates scolaires, la diffusion saison par saison, l'histoire de la
     compagnie ; survoler un repère allume sa ligne et sa commune, et inversement ; un clic y mène.
     Réserver une date (RESERVER, règle 17) : choisir une date, c'est la pousse jusque dans sa carte : la couleur du spectacle
     gagne la carte depuis le bouton choisi, sa photo se découvre, le filet se trace sous le titre, les lignes arrivent l'une
     après l'autre, et sur la carte de France le bras de la commune repousse depuis Rouen ; moins d'animations : un fondu bref.
     Les vidéos (LECTEUR, règle 18) arrivent en fondu quand elles sont prêtes ; « assombrir » éteint la page lentement (450 ms),
     la vidéo garde un filet et la lueur de son univers ; la page se rallume vite.
     La pieuvre : un seul moment, quand le dossier PDF d'un spectacle est prêt (la tentacule s'enroule autour du bouton).
     8. Le jour et la nuit (THEME) : la nuit s'ouvre en cercle depuis le bouton du menu (420 ms), la lune creuse le soleil.
     9. La troupe (TROUPE, la compagnie, celle de la 06) : quand elle arrive à l'écran, le bras qui descend de la pieuvre
        pousse une fois, puis ses branches vers les métiers, l'une après l'autre (Web Animations sur le masque qui les
        découvre) ; survoler une personne trace ses liens vers ses autres places, une lueur y court (offset-path) ; les
        icônes des métiers s'animent à leur arrivée et au survol.
     10. L'espace pro (celui de la 05) : la ligne-tentacule se trace, les grandes capitales montent, les portes et les fiches
        arrivent l'une après l'autre ; au survol, la photo d'une porte s'approche, un voile clair balaie l'aplat d'un espace
        réservé et sa capitale se serre, la flèche avance ; la porte cliquée devient l'en-tête de sa page (élément partagé).
     10. Le scrollytelling (prévisualisation) : le défilement raconte, et ce qu'il raconte se remonte. Le texte s'allume à la
        lecture (affirmation, citations : mot à mot, au rythme du lecteur) ; l'ouverture d'un spectacle prend de la
        profondeur en la quittant (la photo reste en arrière, le texte et le carton montent) ; la scène de l'accueil se retire
        sous le menu, dont les cartes montent ; chaque spectacle de l'accueil a son temps de lecture, épinglé (ses dates
        arrivent l'une après l'autre, son motif continue) ; la tournée se dessine au fil des dates (la date qui franchit le
        milieu de l'écran pousse son bras sur la carte épinglée, allume son repère sur la frise) ; le spectacle suivant monte
        au bout de la page ; l'histoire de la compagnie se lit en chapitres (une étape par date, le panneau épinglé prend la
        photo de son spectacle). Animations liées au défilement en CSS (composées), une ligne de lecture par
        IntersectionObserver pour la carte, la frise et le panneau : rien par image. Voir maquettes/SCROLLYTELLING.md.
     Moins d'animations demandé (ou ?anim=0) : tout est posé, rien ne bouge. */

  /* ---------- outils ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();
  const reduit = matchMedia('(prefers-reduced-motion: reduce)');
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  const motionOK = () => !reduit.matches && (!MV || MV.permis());
  const syncMotion = () => document.documentElement.classList.toggle('still', !motionOK());
  syncMotion(); reduit.addEventListener('change', syncMotion);
  const bientot = f => requestAnimationFrame(() => requestAnimationFrame(f));
  const main = $('#main');
  const vers0 = 'sur-place';
  let vue = '';

  /* ---------- les données : relues à chaque rendu, jamais figées (D peut changer, DONNEES) ---------- */
  let S, L, E, MENU, bySlug;
  function lire() {
    S = D.site; L = S.libelles;
    E = Object.fromEntries(S.entrees.map(e => [e.cle, e]));
    MENU = Object.fromEntries(S.menu.map(m => [m.id, m]));
    bySlug = Object.fromEntries(D.shows.map(s => [s.slug, s]));
  }
  // la mémoire de l'entrée : la dernière choisie sert de défaut aux pages de spectacle
  const MEMOIRE = 'crescite-entree';
  const retenue = () => { try { const v = sessionStorage.getItem(MEMOIRE); return v && E[v] ? v : null; } catch (e) { return null; } };
  const retenir = c => { try { sessionStorage.setItem(MEMOIRE, c); } catch (e) { /* stockage indisponible : pas de mémoire */ } };
  // un spectacle qui n'est plus en tournée (ni en tournée, ni en création) n'a qu'une page, sans onglets (règle 21)
  const fini = s => !!s && !s.enTournee && !s.statut;
  const lienSp = (slug, entree) => fini(bySlug[slug]) ? `#/spectacle/${slug}` : `#/spectacle/${slug}/${entreeSp(slug, entree || retenue() || 'voir')}`;
  // la couleur d'un spectacle (un point de date, un bras de carte, un repère de frise) : var(--sp-<slug>), qui change avec le
  // thème (couleursSp) ; le jour, celle qui se lit sur le papier clair ; la nuit et dans un univers sombre, la couleur de
  // scène, éclaircie jusqu'à se lire sur le papier de nuit
  const couleurDe = slug => (bySlug[slug] && /^[a-z0-9-]+$/.test(slug) ? `var(--sp-${slug}, var(--magenta))` : 'var(--magenta)');
  const feuilleSp = document.head.appendChild(document.createElement('style'));
  function couleursSp() {
    const hex = x => /^#[0-9a-f]{6}$/i.test(x || '');
    const eclaircie = (h, fond, cible = 4.6) => { let [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), c = h;
      for (let k = 0; k < 40 && contraste(c, fond) < cible; k++) { r += (255 - r) * .08; g += (255 - g) * .08; b += (255 - b) * .08; c = '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }
      return c; };
    const jour = [], nuit = [];
    D.shows.forEach(s => { if (!/^[a-z0-9-]+$/.test(s.slug || '')) return; const j = hex(s.couleurTexteClair) ? s.couleurTexteClair : null, v = hex(s.couleur) ? s.couleur : j;
      if (j) jour.push(`--sp-${s.slug}:${j}`); if (v) nuit.push(`--sp-${s.slug}:${eclaircie(v, '#1e171c')}`); });
    return `:root{${jour.join(';')}}html[data-theme="nuit"],.u:not(.u-clair){${nuit.join(';')}}`;
  }
  // l'édition sur place (EDITION) : chaque texte affiché qui vient de D porte son chemin dans D (data-edit), l'élément
  // contenant exactement la valeur ; les photos des spectacles (data-edit-photo) ; les lignes d'agenda (data-date-id)
  const ed = chemin => typeof chemin === 'string' && chemin ? ` data-edit="${esc(chemin)}"` : '';
  const edS = (s, ...k) => ed(['shows', s.slug, ...k].join('.'));
  const edP = (s, ...k) => ` data-edit-photo="${esc(['shows', s.slug, ...k].join('.'))}"`;
  const dateId = d => ` data-date-id="${esc(d && d.id != null ? d.id : '')}"`;
  const rangPh = (s, p) => (s.photos || []).indexOf(p);
  // un bloc HTML de D tel quel ; un texte nu devient un paragraphe (chemin : son chemin dans D ; un bloc qui porte déjà
  // sa balise, titre ou liste, est enveloppé pour que l'élément annoté contienne exactement la valeur)
  const BLOC = /^\s*<(h[1-6]|ul|ol|p|div|table|blockquote|figure)\b/i;
  const bloc = (h, chemin) => BLOC.test(h) ? (ed(chemin) ? `<div class="bl"${ed(chemin)}>${h}</div>` : h) : `<p${ed(chemin)}>${h}</p>`;
  const trait = c => `<svg class="trait" viewBox="0 0 120 20" aria-hidden="true"${c ? ` style="--c:${c}"` : ''}><path pathLength="1" d="M2 12 C 22 4, 38 4, 54 11 S 86 19, 100 10 C 108 5, 116 7, 115 13 C 114 17, 108 17, 107 13"/></svg>`;
  const FLECHE = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
  const BAS = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v15M6 13l6 6 6-6"/></svg>';
  const HAUT = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 15l6-6 6 6"/></svg>';
  const LECTURE = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="plein-ico" d="M8 5.5v13l10.5-6.5z"/></svg>';
  const CROIX = '<svg class="croix" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
  const ALERTE = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>';
  const CRAYON = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 16l1-4L13.5 3.5a1.8 1.8 0 0 1 2.5 0l.5.5a1.8 1.8 0 0 1 0 2.5L8 15z"/><path d="M11.5 5.5l3 3"/></svg>';

  // une mémoire des calculs coûteux (l'agenda passé, toutes les communes) : oubliée à chaque changement de D (refaire),
  // elle ne fige rien (règle 9 : chaque rendu relit D tel qu'il est)
  let versionD = 0;
  const memoire = new Map();
  const retenu = (cle, f) => { const m = memoire.get(cle); if (m && m.v === versionD) return m.x; const x = f(); memoire.set(cle, { v: versionD, x }); return x; };

  /* ---------- les lignes de date : découpées, jamais réécrites ---------- */
  const MOIS = 'janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre';
  const RE_MOIS = new RegExp(`^(.*?)\\s*((?:${MOIS})\\s+\\d{4})$`);
  // « 18 décembre 2026 » → ["18", "décembre 2026"] ; « mars 2027 » → ["mars", "2027"]
  const coupe = ligne => { const m = String(ligne || '').match(RE_MOIS); return !m ? [ligne || '', ''] : m[1] ? [m[1], m[2]] : m[2].split(/\s+/); };
  const moisDe = ligne => (String(ligne || '').match(RE_MOIS) || [])[2] || '';
  const quand = (ligneDate, iso) => { const [j, m] = coupe(ligneDate); return `<time${iso ? ` datetime="${iso}"` : ''}><b>${esc(j)}</b>${m ? `<small>${esc(m)}</small>` : ''}</time>`; };
  const details = Ls => Ls && Ls.length ? `<ul class="det">${Ls.map(x => { const t = typeof x === 'string' ? x : x.texte, h = typeof x === 'string' ? null : x.lien;
    return `<li>${h ? `<a href="${esc(h)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t)}</li>`; }).join('')}</ul>` : '';

  /* ---------- la carte : un bras par commune, de Rouen jusqu'à elle ---------- */
  const cadreVB = () => CARTE.viewBox.split(/\s+/).map(Number);
  const tous = () => { const VB = cadreVB(), dans = ([x, y]) => x >= VB[0] && x <= VB[0] + VB[2] && y >= VB[1] && y <= VB[1] + VB[3];
    return CARTE.lieux.map((p, l) => ({ l, ...p, xy: dans(p.xy) ? p.xy : CARTE.ENCART, encart: !dans(p.xy) })); };
  const etiquette = x => `${CARTE.nom(x)}${x.dates && x.dates.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
  let nC = 0, surPlaceRendu = false;
  // simple : sans masques (beaucoup de communes) ; fin : des bras plus fins
  function carte({ lieux = [], passe = [], titre = '', classe = '', couleurs = false, interactif = true, simple = false, fin = 1, serre = false } = {}) {
    const box = serre && lieux.length ? CARTE.cadre([...lieux, ...passe], { marge: 46, min: 260 }) : CARTE.viewBox, VB = box.split(/\s+/).map(Number), R = CARTE.rouen;
    const id = 'k' + (++nC), e = Math.max(VB[2], VB[3]) / 800, anime = motionOK() && !surPlaceRendu;
    const dist = x => Math.hypot(x.xy[0] - R[0], x.xy[1] - R[1]), dmax = Math.max(80, ...lieux.map(dist));
    const larg = x => Math.min(7.5, 2.2 + Math.sqrt((x.dates && x.dates.length) || x.n || 1) * 1.15) * e * fin;
    const delai = x => (dist(x) / dmax * .6).toFixed(2);
    const coul = x => couleurs && x.dates && x.dates[0] && x.dates[0].slug ? `;--kc:${couleurDe(x.dates[0].slug)}` : '';
    const encart = [...lieux, ...passe].some(x => x.encart);
    return `<svg class="carte${classe ? ' ' + classe : ''}${simple ? ' simple' : ''}${serre && lieux.length ? ' serre' : ''}${anime ? '' : ' pousse'}" viewBox="${box}" ${lieux.length && interactif ? '' : 'role="img" '}aria-label="${esc(titre)}">
      <defs>${simple ? '' : lieux.map((x, i) => `<mask id="${id}m${i}"><path class="m" pathLength="1" style="--d:${delai(x)}s;stroke-width:${(18 * e).toFixed(1)}" d="${CARTE.trait(x.xy)}"/></mask>`).join('')}</defs>
      <path class="voisin" d="${CARTE.fond.belgique}"/><path class="voisin" d="${CARTE.fond.luxembourg}"/><path class="pays" d="${CARTE.fond.pays}"/>
      ${encart ? `<circle class="encart" cx="${CARTE.ENCART[0]}" cy="${CARTE.ENCART[1]}" r="${24 * e}"/>` : ''}
      <g class="passe">${passe.map(x => `<path d="${CARTE.trait(x.xy)}"/>`).join('')}</g>
      <g class="lieux">${lieux.map((x, i) => { const [px, py] = x.xy, b = simple ? null : CARTE.bras(x.xy, { w0: larg(x), w1: .7 * e });
        // une carte de beaucoup de communes (simple) : des bras en traits fins, bien moins coûteux à dessiner qu'effilés
        const bras = simple ? (Math.hypot(px - R[0], py - R[1]) >= 6 ? `<path class="bras-trait" d="${CARTE.trait(x.xy)}"/>` : '') : b ? `<path class="bras" mask="url(#${id}m${i})" d="${b}"/><path class="bout" pathLength="1" d="${CARTE.bout(x.xy, { r: 4.6 * e })}"/>` : '';
        return `<g class="carte-lieu" data-l="${x.l}" style="--d:${delai(x)}s${coul(x)}"${interactif ? ` role="button" tabindex="0" aria-label="${esc(etiquette(x))}"` : ''}>${bras}<circle class="point" cx="${px}" cy="${py}" r="${((simple ? 2.8 : 3.6) * e).toFixed(1)}"/>${interactif ? `<circle class="cible" cx="${px}" cy="${py}" r="${(13 * e).toFixed(1)}"/>` : ''}</g>`; }).join('')}</g>
      <circle class="rouen" cx="${R[0]}" cy="${R[1]}" r="${(5.5 * e).toFixed(1)}"/><text class="rouen-nom" x="${R[0] + 9 * e}" y="${R[1] - 9 * e}">Rouen</text>
      <g class="noms">${lieux.map(x => { const g = x.xy[0] > VB[0] + VB[2] * .7; return `<text class="nom" data-l="${x.l}" x="${(x.xy[0] + (g ? -10 : 10) * e).toFixed(1)}" y="${(x.xy[1] + 4 * e).toFixed(1)}"${g ? ' text-anchor="end"' : ''}>${esc(CARTE.nom(x))}</text>`; }).join('')}</g>
    </svg>`;
  }
  // les bras poussent depuis Rouen (une fois) : les masques se déroulent, les tournées passées s'ouvrent en cercle
  function pousser(svg) {
    if (!svg || svg.classList.contains('pousse')) return;
    svg.classList.add('pousse');
  }
  const pousserVu = svg => { if (!svg) return; if (!('IntersectionObserver' in window) || !motionOK()) { pousser(svg); return; }
    const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { pousser(svg); io.disconnect(); } }, { threshold: .2 }); io.observe(svg); };
  function marquer(svg, l) {
    if (!svg) return;
    svg.classList.toggle('surligne', l != null);
    $$('.carte-lieu', svg).forEach(g => g.classList.toggle('on', l != null && +g.dataset.l === l));
    $$('.nom', svg).forEach(t => t.classList.toggle('on', l != null && +t.dataset.l === l));
  }
  // les noms gardent la même taille à l'écran, quelle que soit la largeur de la carte
  // (la largeur de chaque carte arrive par ResizeObserver, après la mise en page : aucune lecture forcée)
  const k = (svg, w) => { const vb = svg.viewBox && svg.viewBox.baseVal; if (w && vb && vb.width) svg.style.setProperty('--k', (vb.width / w).toFixed(3)); };
  const mesureCartes = 'ResizeObserver' in window ? new ResizeObserver(es => es.forEach(x => k(x.target, x.contentRect.width))) : null;
  function echelle() { $$('svg.carte').forEach(svg => { if (svg.__k) return; svg.__k = true; if (mesureCartes) mesureCartes.observe(svg); else k(svg, svg.getBoundingClientRect().width); }); }
  // les communes d'une carte (g.carte-lieu[data-l]) : survol, focus, clic, Entrée ; des écouteurs posés sur la carte
  // seulement (délégation), comme CARTE.lier, mais un seul jeu pour toutes les communes
  function lierCarte(svg, { survol = () => {}, choix = () => {} } = {}) {
    if (!svg) return;
    const lieu = e => { const g = e.target.closest && e.target.closest('.carte-lieu[data-l]'); return g && svg.contains(g) ? g : null; };
    let dessus = null;
    svg.addEventListener('pointerover', e => { const g = lieu(e); if (g && g !== dessus) { dessus = g; survol(+g.dataset.l); } }, { passive: true });
    svg.addEventListener('pointerout', e => { const g = lieu(e); if (g && !(e.relatedTarget && g.contains(e.relatedTarget))) { dessus = null; survol(null); } }, { passive: true });
    svg.addEventListener('focusin', e => { const g = lieu(e); if (g) survol(+g.dataset.l); });
    svg.addEventListener('focusout', e => { if (lieu(e)) survol(null); });
    svg.addEventListener('click', e => { const g = lieu(e); if (g) choix(+g.dataset.l); });
    svg.addEventListener('keydown', e => { const g = lieu(e); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); choix(+g.dataset.l); } });
  }
  // au doigt, pas de survol : un toucher (et ses évènements de souris de compatibilité, son focus) ne rallume pas toute la
  // carte de France, qu'il faudrait repeindre deux fois ; le geste reste léger. La souris et le clavier, si.
  let doigt = 0;
  document.addEventListener('pointerdown', e => { doigt = e.pointerType === 'touch' ? performance.now() : 0; }, { capture: true, passive: true });
  const auDoigt = () => doigt > 0 && performance.now() - doigt < 1200;
  const survolCarte = (svg, l) => { if (!auDoigt()) marquer(svg, l); };
  // relie une liste (li[data-l]) et une carte, dans les deux sens
  function relier(svg, liste, choix = () => {}) {
    const allume = l => $$('li[data-l]', liste).forEach(li => li.classList.toggle('on', l != null && +li.dataset.l === l));
    lierCarte(svg, { survol: l => { marquer(svg, l); allume(l); }, choix });
    liste.addEventListener('mouseover', e => { const li = e.target.closest('li[data-l]'); survolCarte(svg, li ? +li.dataset.l : null); });
    liste.addEventListener('mouseleave', () => survolCarte(svg, null));
    liste.addEventListener('focusin', e => { const li = e.target.closest('li[data-l]'); if (li) survolCarte(svg, +li.dataset.l); });
    return allume;
  }
  // une bulle qui suit la commune survolée
  function bulleSur(svg, bulle, contenu, choix = () => {}) {
    const montre = l => { marquer(svg, l); const html = l == null ? '' : contenu(l); bulle.innerHTML = html; bulle.classList.toggle('on', !!html); };
    lierCarte(svg, { survol: montre, choix });
    return montre;
  }

        <h2 class="df-titre${long ? ' long' : ''}" id="df-t-${esc(s.slug)}" style="--k:1">${titre}</h2>${m === 'annotations' ? SOULIGNE : ''}

    </article>`;
  }
  // le défilé, au fil de la lecture : --p (l'arrivée de l'écran), --r (sa lecture, épinglé), --q (recouvert par le suivant).
  // Au bureau, les écrans sont épinglés l'un après l'autre (sticky) : leur place se calcule depuis la pile, sans les lire un
  // par un ; ailleurs, chacun suit sa place dans l'écran. Seules les valeurs qui changent sont réécrites.
  let ecrans = [], dfM = null;
  function mesurerEcrans() {
    const e0 = ecrans[0];
    // (haut : là où les écrans s'épinglent, leur top ; le filet de l'en-tête n'en fait pas partie)
    const st = e0 && e0.isConnected ? getComputedStyle(e0) : null;
    dfM = st ? { pile: st.position === 'sticky', h: e0.offsetHeight, m: parseFloat(st.marginBottom) || 0,
      haut: (st.position === 'sticky' && parseFloat(st.top)) || ($('#top') || {}).offsetHeight || 64 } : null;
  }
  function defileEcrans() {
    if (!ecrans.length || !ecrans[0].isConnected) return;
    if (!dfM) mesurerEcrans();
    if (!dfM) return;
    const poser = (el, p, r, q) => { const v = `${p.toFixed(3)} ${r.toFixed(3)} ${q.toFixed(3)}`; if (el.__df === v) return; el.__df = v;
      el.style.setProperty('--p', p.toFixed(3)); el.style.setProperty('--r', r.toFixed(3)); el.style.setProperty('--q', q.toFixed(3)); };
    if (!motionOK()) { ecrans.forEach(el => poser(el, 1, 1, 0)); return; }
    const vh = innerHeight;
    if (dfM.pile) {
      const d = dfM.haut - ecrans[0].parentElement.getBoundingClientRect().top, Hs = Math.max(1, dfM.h), M = dfM.m;
      const ps = ecrans.map((el, i) => clamp((d - (i * (Hs + M) - Hs)) / Hs, 0, 1));
      ecrans.forEach((el, i) => poser(el, ps[i], M > 0 ? clamp((d - i * (Hs + M)) / M, 0, 1) : ps[i], ps[i + 1] || 0));
    } else ecrans.forEach(el => { const r = el.getBoundingClientRect(); if (r.bottom < -vh || r.top > 2 * vh) return;
      poser(el, clamp((vh - r.top) / (vh * .7), 0, 1), clamp((vh * .3 - r.top) / Math.max(1, r.height * .8), 0, 1), 0); });
  }
  // au clavier, dans la pile : l'écran du lien qui prend le focus vient à sa place, épinglé et pas encore recouvert (le dernier,
  // que rien ne recouvre, en haut) ; ailleurs, le navigateur amène déjà le lien dans l'écran
  function placerEcran(el) {
    const i = ecrans.indexOf(el);
    if (i < 0 || !motionOK()) return;
    if (!dfM) mesurerEcrans();
    if (!dfM || !dfM.pile) return;
    const d = dfM.haut - el.parentElement.getBoundingClientRect().top, a = i * (dfM.h + dfM.m), v = clamp(d, a, i < ecrans.length - 1 ? a + dfM.m : a);
    if (Math.abs(v - d) > .5) scrollTo({ top: Math.ceil(scrollY + v - d), behavior: 'instant' });   // (arrondi vers le bas de la page : épinglé)
  }

  /* ---------- l'agenda passé : toutes les dates publiées (D.saisons), saison par saison, de la plus récente à la plus ancienne ---------- */
  const MOIS_NOMS = MOIS.split('|');
  const MOIS_TOK = `${MOIS}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)
  const RE_JOUR = new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS_TOK})\\.?(?:\\s+(\\d{4}))?`, 'gi');
  const RE_MOIS_AN = new RegExp(`(${MOIS_TOK})\\.?\\s+(\\d{4})`, 'i');
  const RE_LIGNE = new RegExp(`^(.*?)\\s*((?:${MOIS_TOK})\\.?\\s+\\d{4})([\\s\\S]*)$`, 'i');
  const p2 = n => String(n).padStart(2, '0');
  // la date de fin d'une ligne, « 2020-03-04 » : iso/fin quand la base les a, sinon lue dans la ligne (le dernier jour cité)
  function cleDate(d, saison) {
    const fin = d.fin || d.iso; if (fin) return fin;
    const tete = String(d.ligne || '').split(/—|\s:\s/)[0], a0 = +saison.slice(0, 4), mois = x => { const t = x.toLowerCase(); return MOIS_NOMS.findIndex(n => n.startsWith(t) || t.startsWith(n.slice(0, 4))) + 1; };
    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];
    if (dern) { const mm = mois(dern[2]); return `${dern[3] ? +dern[3] : mm >= 9 ? a0 : a0 + 1}-${p2(mm)}-${p2(+dern[1])}`; }
    const ma = tete.match(RE_MOIS_AN);
    return ma ? `${ma[2]}-${p2(mois(ma[1]))}-31` : null;
  }
  // « 24 janvier 2020 à 20h — Théâtre en Seine, Duclair (76) » → { jour: « 24 », heure: « à 20h », lieu: « Théâtre en Seine, Duclair (76) » }
  function decoupe(ligne) {
    const t = String(ligne || ''), m = t.match(RE_LIGNE);
    if (!m) return { jour: '', heure: '', lieu: t.trim() };
    const reste = m[3], k = reste.indexOf('—'), c = reste.search(/\s:\s/);
    const [h, l] = k >= 0 ? [reste.slice(0, k), reste.slice(k + 1)] : c >= 0 ? [reste.slice(0, c), reste.slice(c + 3)] : ['', reste];
    const net = x => x.replace(/^[\s:,–-]+|[\s:]+$/g, '');
    return { jour: m[1] || m[2], heure: net(h), lieu: net(l) };
  }
  const titreMois = m => m ? `${MOIS_NOMS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '';
  // toutes les saisons passées : [{k, titre, rows: [{d, g, k, i, suite, cle, txt}], titres, lieux}], la plus récente d'abord
  // les lignes publiées d'une saison (D.saisons), dans l'ordre de D : leur date de fin (k), leur clé de repère (fid, aussi
  // celle de la frise), leur texte cherchable ; une ligne sans date suit celle d'avant (suite)
  // t : le début d'une ligne (l'ordre du temps : une période, une semaine de résidence, à son premier jour) ; an : une ligne
  // qui ne dit que son année (« 2020 — Rouen (76) »), rangée sous son année et non sous un mois
  const RE_AN_SEUL = /^\s*\d{4}\s*(?:—|$)/;
  function lignesSaison(saison) {
    const SA = D.saisons[saison], rows = []; let i = 0;
    ((SA && SA.spectacles) || []).forEach(g => {
      let prev = null, prevT = null, prevAn = false;
      (g.dates || []).forEach(d => {
        let k = cleDate(d, saison); const suite = !k; if (suite) k = prev; else prev = k;
        const t = suite ? prevT : (d.iso || k), an = suite ? prevAn : RE_AN_SEUL.test(String(d.ligne || ''));
        if (!suite) { prevT = t; prevAn = an; }
        const sp = g.slug && bySlug[g.slug], titre = sp ? sp.titre : g.titre;
        rows.push({ d, g, k: k || '', t: t || '', an, i, fid: cleLigne(d, saison, i++), suite, titre, cle: g.slug || `titre:${g.titre}`,
          txt: norm(`${titre} ${d.ligne} ${(d.details || []).map(y => y.texte).join(' ')} ${d.l != null && CARTE.lieux[d.l] ? CARTE.nom(CARTE.lieux[d.l]) : ''}`) });
      });
    });
    return rows;
  }
  // l'ordre du temps, par le début des lignes, puis leur fin (la ligne sans date reste après la sienne) ; le groupe d'une
  // ligne dans une liste par mois : le mois de son début, ou son année quand elle ne dit que son année
  const plusAncienne = (a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i;
  const plusRecente = (a, b) => a.t < b.t ? 1 : a.t > b.t ? -1 : a.k < b.k ? 1 : a.k > b.k ? -1 : a.i - b.i;
  const groupeDe = r => r.an ? r.t.slice(0, 4) : r.t.slice(0, 7);
  const titreGroupe = m => m.length === 4 ? m : titreMois(m);
  function agendaPasse() {
    const out = [];
    S.saisons.forEach(x => {
      const SA = D.saisons[x.saison]; if (!SA || x.saison > D.saison) return;
      const rows = lignesSaison(x.saison);
      const passees = (x.saison === D.saison ? rows.filter(r => r.k && r.k < D.aujourdhui) : rows).sort(plusRecente);
      if (!passees.length) return;
      out.push({ k: x.saison, titre: SA.titre, rows: passees, titres: [...new Set(passees.map(r => r.titre))], lieux: CARTE.saison(x.saison) });
    });
    return out;
  }
  // toutes les dates de la saison en cours, passées comprises, dans l'ordre du temps
  const lignesEnCours = () => lignesSaison(D.saison).sort(plusAncienne);
  // les spectacles qui ont des dates, à venir ou passées : [{cle, titre, slug}], les spectacles de la compagnie d'abord (et
  // parmi eux, ceux qui sont en tournée)
  function spectaclesAgenda(pub, passe) {
    const m = new Map();
    D.shows.forEach(s => { if (pub.some(d => d.slug === s.slug) || passe.some(p => p.rows.some(r => r.cle === s.slug))) m.set(s.slug, { cle: s.slug, titre: s.titre, slug: s.slug }); });
    passe.forEach(p => p.rows.forEach(r => { if (!m.has(r.cle)) m.set(r.cle, { cle: r.cle, titre: r.titre, slug: null }); }));
    // (règle 23) les spectacles en tournée d'abord, dans leur ordre, puis les autres
    const v = [...m.values()], enTournee = x => !!(x.slug && bySlug[x.slug] && bySlug[x.slug].enTournee);
    return [...v.filter(enTournee), ...v.filter(x => !enTournee(x))];
  }

  /* ---------- je viens voir un spectacle : les prochaines dates, puis l'agenda passé saison par saison ---------- */
  const etat = { voir: null };
  const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>';

  const DOUBLE_HAUT = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 11l6-5 6 5M6 18l6-5 6 5"/></svg>';
  // (pre : un préfixe de la clé de mouvement, quand la même ligne paraît deux fois dans la vue)
  const ligneAgenda = (r, pre = '', sansTitre = false) => {
    const { d, g } = r, sp = g.slug && bySlug[g.slug], p = decoupe(d.ligne);
    const titre = r.suite || sansTitre ? '' : sp ? `<a class="t" href="${lienSp(g.slug, 'voir')}">${esc(r.titre)}</a>` : `<span class="t">${esc(r.titre)}</span>`;
    const lieu = p.lieu ? (d.lien ? `<a class="ou" href="${esc(d.lien)}" target="_blank" rel="noopener">${esc(p.lieu)}</a>` : `<span class="ou">${esc(p.lieu)}</span>`) : '';
    return `<li data-date-id="${esc(d.id ?? '')}" data-frise-id="${esc(r.fid)}" data-mv-cle="${esc(pre + r.fid)}"${d.l != null ? ` data-l="${d.l}"` : ''}${r.suite ? ' class="suite"' : ''} style="--c:${couleurDe(g.slug)}">${r.suite ? '' : `<time${d.iso ? ` datetime="${d.iso}"` : ''}><b>${esc(p.jour)}</b>${p.heure ? `<small>${esc(p.heure)}</small>` : ''}</time>`}<div class="qui">${titre}${d.scolaire ? `<em class="tag">${esc(L.scolaire)}</em>` : ''}${d.residence ? `<em class="tag">${esc(L.residence)}</em>` : ''}${d.etat ? `<em class="etat">${esc(d.etat)}</em>` : ''}${lieu}${details(d.details)}</div></li>`;
  };

  // un dépôt du public (une alerte de tournée, une demande de devis) : il ne se dit enregistré que si la base l'a enregistré
  // (DONNEES.deposer rend { error }) ; sinon, la page propose d'écrire directement au contact diffusion des données
  const deposer = (table, ligne) => (typeof DONNEES !== 'undefined' && DONNEES.deposer ? DONNEES.deposer(table, ligne) : Promise.resolve({ error: { message: 'sans la base' } }));
  // un libellé de D.site.libelles à trous ({adresse}, {lien}…), rempli de morceaux déjà échappés
  const remplir = (gabarit, v) => esc(gabarit || '').replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  // un lien mailto: vers le contact diffusion des données, avec l'objet et le texte (son adresse, sans autre texte) ; ''
  // quand les données n'ont pas d'adresse
  const versContact = (texte, objet, corps = '') => {
    const c = contactPrg();
    return c && c.email ? `<a href="${esc(`mailto:${c.email}?subject=${encodeURIComponent(objet)}${corps ? `&body=${encodeURIComponent(corps)}` : ''}`)}">${esc(texte || c.email)}</a>` : '';
  };
  // l'alerte de tournée : elle ne compte qu'une fois confirmée depuis le courriel envoyé à l'adresse (le onzième script
  // SQL, la fonction crescite-courriel) ; la page le dit, et ne promet rien d'autre. Le secteur : la position (« Me
  // géolocaliser » : l'alerte vaut alors dans un rayon autour d'elle) avec sa commune, ou un code postal, ou une commune
  // cherchée par son nom (geo.api.gouv.fr) ; la base en déduit le département
  function initAlerteTournee() {
    const f = $('#f-alerte'); if (!f) return;
    const btnGeo = $('#btn-geo'), cp = $('#alerte-cp'), email = $('#alerte-email'), sp = $('#alerte-spectacle'), msg = $('#alerte-msg');
    let ici = null;      // la position prise, sa commune, son code postal, son département et le texte écrit dans le champ
    const geoTexte = t => { if (btnGeo) btnGeo.querySelector('span').textContent = t; };
    const oublierIci = () => { ici = null; if (btnGeo) { btnGeo.classList.remove('actif'); geoTexte(L.meGeolocaliser || 'Me géolocaliser'); } };
    if (btnGeo) {
      btnGeo.addEventListener('click', () => {
        if (!navigator.geolocation) { alert('La géolocalisation n’est pas disponible sur cet appareil.'); return; }
        btnGeo.classList.add('actif');
        geoTexte('Recherche…');
        navigator.geolocation.getCurrentPosition(async pos => {
          const lat = pos.coords.latitude, lon = pos.coords.longitude;
          let c = null;
          try {
            const res = await fetch(`https://geo.api.gouv.fr/communes?lat=${lat}&lon=${lon}&fields=nom,codesPostaux,codeDepartement`);
            const data = res.ok ? await res.json() : [];
            c = data && data[0] || null;
          } catch (e) { /* hors connexion : la position seule */ }
          cp.value = c ? `${c.nom} (${c.codeDepartement})` : 'Ma position';
          ici = { lat, lon, commune: c ? c.nom : null, code_postal: c && c.codesPostaux ? c.codesPostaux[0] || null : null,
                  departement: c ? c.codeDepartement || null : null, texte: cp.value };
          geoTexte('Localisé');
        }, err => {
          oublierIci();
          alert('Impossible de vous localiser : ' + (err.message || 'accès non autorisé'));
        }, { timeout: 10000 });
      });
    }
    // le champ retouché : la position n'est plus celle qu'il dit
    cp.addEventListener('input', () => { if (ici && cp.value !== ici.texte) oublierIci(); });
    // un secteur écrit : un code postal (« 76000 », « 76000 Rouen »), « Rouen (76) », ou le nom d'une commune ; rien de
    // trouvé : null
    async function secteurEcrit(t) {
      const code = (t.match(/(?:^|\D)(\d{5})(?:\D|$)/) || [])[1];
      if (code) return { code_postal: code, commune: t.replace(code, '').replace(/[(),]/g, ' ').replace(/\s+/g, ' ').trim() || null };
      const dep = (t.match(/\(\s*(\d{2,3}|2[AaBb])\s*\)/) || [])[1];
      if (dep) return { commune: t.replace(/\(.*\)/, '').trim() || null, departement: dep.toUpperCase() };
      try {
        const res = await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(t)}&fields=nom,codesPostaux,codeDepartement&boost=population&limit=1`);
        const c = (res.ok ? await res.json() : [])[0];
        if (c) return { code_postal: (c.codesPostaux || [])[0] || null, commune: c.nom, departement: c.codeDepartement || null };
      } catch (e) { /* hors connexion */ }
      return null;
    }
    const dire = (genre, html) => {
      msg.className = `alerte-msg ${genre}`;
      msg.setAttribute('role', genre === 'err' ? 'alert' : 'status');
      msg.innerHTML = html;
      msg.hidden = false;
    };
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const mailVal = email.value.trim(), cpVal = cp.value.trim(), spVal = sp.value;
      if (!mailVal || !cpVal) return;
      const btnSub = $('#btn-inscrire-alerte');
      if (btnSub) btnSub.disabled = true;
      msg.hidden = true;
      const s = spVal && bySlug[spVal] ? bySlug[spVal] : null;
      const secteur = ici ? { code_postal: ici.code_postal, commune: ici.commune, departement: ici.departement } : await secteurEcrit(cpVal);
      if (!secteur) {
        dire('err', esc(L.alerteSecteurInconnu || 'Ce secteur est introuvable : indiquez un code postal (5 chiffres), ou utilisez « Me géolocaliser ».'));
        if (btnSub) btnSub.disabled = false;
        cp.focus();
        return;
      }
      // confirme_le n'existe qu'avec le onzième script (la confirmation par courriel et l'envoi) : sans lui, la base refuse
      // l'alerte et la page ne promet rien. La base la dépose de toute façon en attente (jamais confirmée)
      const { error } = await deposer('crescite_alertes_tournee', {
        email: mailVal,
        ...secteur,
        spectacle_id: s && s.id != null ? s.id : null,
        lat: ici ? ici.lat : null,
        lon: ici ? ici.lon : null,
        confirme_le: null
      });
      if (error && error.code === 'PT429' && error.message) {
        // une limite de la base (cinq alertes par adresse) : son message dit laquelle
        dire('err', esc(error.message));
      } else if (error) {
        // rien n'est enregistré : on le dit, et on propose d'écrire au contact diffusion
        const lien = versContact(null, `${L.alerteTournee} – ${cpVal}`, [cpVal, s && s.titre].filter(Boolean).join(' · '));
        dire('err', `${esc(L.alerteNonEnregistree)}${lien ? ` ${lien}` : ''}`);
      } else {
        dire('ok', `✓ ${remplir(L.alerteInscrite, { adresse: esc(mailVal), secteur: esc(cpVal) })}`);
        f.reset();
        oublierIci();
      }
      if (btnSub) btnSub.disabled = false;
    });
  }
