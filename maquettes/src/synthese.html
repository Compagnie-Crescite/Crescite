  /* ---------- les saisons (règle 21) : tout l'agenda, sur une page ----------
     La compagnie a composé cette page de deux maquettes.
     La saison en cours est celle de la 07 (le noir et la lumière) : la tête en grand (la compagnie en capitales, « Saisons »,
     ses raccourcis, chacun sa lampe), la recherche et les spectacles à filtrer (ceux qui tournent d'abord, règle 23), puis la
     saison sous sa marque (son titre éclairé, la lampe de la couleur de saison, « la saison en cours ») ; sa frise, une seule
     ligne du temps où chaque date est une lampe à la couleur de son spectacle (aucune grappe : quatre couloirs ; les dates
     jouées éteintes, la prochaine qui bat, « aujourd'hui » un trait de lumière) ; sa légende (chaque spectacle et le nombre de
     ses dates que le filtre garde, le survoler isole ses repères ; les signes scolaire et résidence) ; ses prochaines dates
     (tout public : des boutons qui ouvrent leur carte de réservation sous leur ligne, règle 17 ; scolaires : marquées, sans
     bouton) puis toutes ses dates (les jouées éteintes, « aujourd'hui » entre elles), à côté de sa carte, qui écrit sous elle
     la commune survolée et ses dates.
     Les saisons passées sont celles de la 04 (trois portes), de la plus récente à la plus ancienne : la frise des saisons (une
     arche par saison, à la hauteur de sa densité), la bande des saisons qui reste en haut de l'écran (un onglet par saison et
     son nombre de dates, tout ouvrir ou tout fermer, les filtres actifs à effacer), puis chaque saison derrière sa porte,
     fermée (son contenu ne se dessine qu'à l'ouverture), sa petite carte dans l'arche ; ouverte, la porte s'efface, la lumière
     entre et ses dates arrivent en cascade à côté de sa carte. Enfin l'alerte de tournée. Le filtre par spectacle, la commune
     et la recherche portent sur toute la page. ouvrir : #/saisons/<saison>, la même page, cette saison ouverte et amenée à
     l'écran (le h1 ne change pas ; le titre du document prend celui de la saison). */
  function voir(q, surPlace, ouvrir = null) {
    vue = 'saisons';
    const M0 = menuDe('saisons') || { texte: L.saisons, href: '#/saisons' }, S0 = S.saisons[0];
    // la carte de la saison : ses communes à venir, en avant ; celles où elle est déjà passée, en retrait
    const lieux = CARTE.aVenir(), vusC = new Set(lieux.map(x => x.l)), passeC = CARTE.saison(D.saison).filter(x => !vusC.has(x.l));
    const tout = retenu('agendaPasse', agendaPasse), passe = tout.filter(s => s.k !== D.saison);
    const lignes = retenu('lignesEnCours', lignesEnCours), puces = spectaclesAgenda(D.dates, tout);
    const proch = D.dates.map(d => ({ d, cle: d.slug, l: d.l, id: cleProchaine(d), txt: norm(`${d.titre} ${d.ligne} ${(d.details || []).map(x => x.texte).join(' ')} ${CARTE.lieux[d.l] ? CARTE.nom(CARTE.lieux[d.l]) : ''}`) }));
    if (!surPlace || !etat.voir) { const l0 = q.get('l'); etat.voir = { q: '', slug: null, l: l0 !== null && [...lieux, ...passeC].some(x => x.l === +l0) ? +l0 : null, ouv: new Set(ouvrir ? [ouvrir] : []), avant: null, date: q.get('date') }; }
    else if (ouvrir) etat.voir.ouv.add(ouvrir);
    const F = etat.voir;
    if (F.slug && !puces.some(s => s.cle === F.slug)) F.slug = null;
    if (F.l !== null && !CARTE.lieux[F.l]) F.l = null;
    retenir('voir');
    const terme = () => norm(F.q).trim();
    const actif = () => !!(F.slug || F.l !== null || terme());
    const garde = r => (!F.slug || r.cle === F.slug) && (F.l === null || r.l === F.l || (r.d && r.d.l === F.l)) && (!terme() || r.txt.includes(terme()));
    const nAlerte = L.alerteTournee || 'Alertes proximité';
    // (les chiffres ne comptent pas les résidences, règle 23)
    const jouee = r => !r.d.residence;
    // la police de titre d'un spectacle (celle de son univers) : son titre s'écrit ainsi dans les dates de la saison (la 07)
    const police = slug => { const s = bySlug[slug], m = s && /--u-titre-f:([^;]+);--u-titre-g:([^;]+)/.exec(uVars(s)); return m ? `;--u-titre-f:${m[1]};--u-titre-g:${m[2]}` : ''; };
    // un intertitre de mois, seulement quand ses mots sont ceux d'une ligne du groupe (règle 1)
    const moisLu = (t, rs) => !!t && rs.some(r => norm(r.d.ligne).includes(norm(t)));
    // la frise de la saison : toutes ses dates, tout public et scolaires, à venir et déjà jouées (en retrait), chacune à la
    // couleur de son spectacle, et ses semaines de résidence (règle 23 : elles ne sont pas dans D.dates, passées ou à venir) ;
    // [[ligne, repère]] : la légende compte les repères de chaque spectacle
    const ptsSaison = g => [...proch.filter(g).map(r => [r, repereProchaine(r.d)]),
      ...lignes.filter(r => !r.suite && g(r) && (r.d.residence || (r.k && r.k < D.aujourdhui))).map(r => [r, repereLigne(r.d, D.saison, r.i, r.g.slug, r.titre)])].filter(([, p]) => p);
    const reperesSaison = () => ptsSaison(garde).map(([, p]) => p);
    // la légende de la frise (la 07) : chaque spectacle de la saison, dans l'ordre des filtres (ceux qui tournent d'abord),
    // sa lampe, son titre et le nombre de ses dates que le filtre garde (un spectacle écarté s'éteint ; ses résidences ne
    // comptent pas : un spectacle qui n'a qu'elles paraît sans nombre) ; puis le losange des dates scolaires et le carré
    // évidé des résidences, quand la saison en a
    function legende() {
      const tous = ptsSaison(() => true), n = new Map(), rs = new Map(), vus = new Map();
      ptsSaison(garde).forEach(([r, p]) => { const m = p.residence ? rs : n; m.set(r.cle, (m.get(r.cle) || 0) + 1); });
      tous.forEach(([r, p]) => { if (!vus.has(r.cle)) vus.set(r.cle, { cle: r.cle, titre: r.titre || r.d.titre, couleur: p.couleur }); });
      const rang = c => { const j = puces.findIndex(x => x.cle === c); return j < 0 ? 999 : j; };
      return [...vus.values()].sort((a, b) => rang(a.cle) - rang(b.cle)).map(x => { const k = n.get(x.cle) || 0, vide = !k && !rs.get(x.cle);
        return `<li class="fs7-l${vide ? ' est-vide' : ''}" data-cle="${esc(x.cle)}" style="--c:${x.couleur}"><i aria-hidden="true"></i><span>${esc(x.titre)}${k || vide ? `&nbsp;<b>${k}</b>` : ''}</span></li>`; }).join('')
        + (tous.some(([, p]) => p.scolaire) && L.scolaire ? `<li class="fs7-l fs7-sc"><i aria-hidden="true"></i><span>${esc(L.scolaire)}</span></li>` : '')
        + (tous.some(([, p]) => p.residence) && L.residence ? `<li class="fs7-l fs7-rs"><i aria-hidden="true"></i><span>${esc(L.residence)}</span></li>` : '');
    }
    main.innerHTML = `<header class="s7-entete mv-principal" data-mv-nom="entree-saisons"><div class="wrap">
        <p class="s7-sur"${ed('site.nom')}>${esc(S.nom)}</p>
        <h1 class="s7-titre" tabindex="-1">${esc(M0.texte)}</h1>
        <ul class="s7-rac">${[['v-saison', S0.titre], ['v-agenda', L.saisonsPassees], ['v-alerte', nAlerte]].map(([id, t]) => `<li><button type="button" data-va="${id}"><span class="s7-lampe" aria-hidden="true"></span>${esc(t)}</button></li>`).join('')}</ul>
      </div></header>
      <div class="wrap s7-outils">
        <label class="s7-cherche"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg><input id="cherche" type="search" placeholder="${esc(L.rechercher)}" aria-label="${esc(L.rechercher)}" autocomplete="off" value="${esc(F.q)}"></label>
        <div class="s7-chips" role="group" aria-label="${esc(L.spectacles)}">${puces.map(s => `<button class="s7-chip" type="button" data-s="${esc(s.cle)}" aria-pressed="false" style="--c:${s.slug ? couleurDe(s.slug) : 'var(--gris)'}"><i aria-hidden="true"></i>${esc(s.titre)}</button>`).join('')}<span id="choix-lieu"></span></div>

        fSaisons = frise($('#idx-frise'), { echelle: 'annees', debut: passe.length ? passe[passe.length - 1].k : D.saison, fin: D.saison, bandes: bandesSaisons(),
          libelle: L.saisonsPassees, classe: 'frise-saisons', anMin: 54, relier: { liste: racine }, choix: b => ouvrirSaison(b.id) });
      };
      if (maintenant) saisons(); else ensuite(saisons);
    }
    // ouvrir une saison (à la main, depuis la bande ou la frise des saisons, ou tout ouvrir) : la porte de son arche s'efface,
    // ses lignes arrivent en cascade
    const deplier = dt => { const c = $('.sai-liste', dt); if (c && MV) MV.cascade(c, { selecteur: '.p4-mois, .dl', max: 12, pas: 26, decalage: -8 }); };
    racine.addEventListener('toggle', ev => {
      const dt = ev.target; if (!dt.matches || !dt.matches('details.sai')) return;
      const k = dt.dataset.saison;
      if (dt.open) { F.ouv.add(k); if (remplir(dt)) deplier(dt); } else { F.ouv.delete(k); const c = $('.sai-corps', dt); if (c) c.innerHTML = ''; }
      const b = $(`[data-k="${k}"]`, index); if (b) b.setAttribute('aria-expanded', String(dt.open));
      const vis = visibles(), tout = vis.length > 0 && vis.every(({ s }) => F.ouv.has(s.k)), t = $('.idx-tout', index);
      if (t) { t.setAttribute('aria-expanded', String(tout)); t.innerHTML = tout ? DOUBLE_HAUT : DOUBLE; }
    }, true);
    // (la saison en cours, sur la frise des saisons, ramène à elle, en haut de la page)
    const ouvrirSaison = k => {
      if (k === D.saison) { vers('v-saison'); return; }
      const dt = $(`#sai-${k}`, racine); if (!dt) return;
      if (!dt.open) { dt.open = true; F.ouv.add(k); if (remplir(dt)) deplier(dt); }
      dt.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });
      montrerOnglet(k);
    };
    index.addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.classList.contains('idx-tout')) { const vis = visibles(); F.ouv = b.getAttribute('aria-expanded') === 'true' ? new Set() : new Set(vis.map(x => x.s.k)); dessine(true); return; }
      if (b.dataset.eff) { if (b.dataset.eff === 'q') F.q = ''; else if (b.dataset.eff === 's') F.slug = null; else F.l = null; dessine(true); return; }
      if (b.dataset.k) ouvrirSaison(b.dataset.k);
    });
    $('#choix-lieu').addEventListener('click', ev => { if (ev.target.closest('button')) { F.l = null; dessine(true); $('#cherche').focus(); } });
    $$('[data-s]', main).forEach(b => b.addEventListener('click', () => { F.slug = F.slug === b.dataset.s ? null : b.dataset.s; dessine(true); }));
    let tempo = 0;
    $('#cherche').addEventListener('input', ev => { F.q = ev.target.value; clearTimeout(tempo); tempo = setTimeout(() => dessine(true), 120); });
    // choisir une commune sur la carte filtre toute la page ; survoler l'une allume l'autre (dans les deux listes), et ses
    // repères sur la frise
    relier(svg, listes, l => { F.l = F.l === l ? null : l; dessine(true); });
    listes.addEventListener('mouseleave', () => marquer(svg, F.l));
    // sous la carte (la 07) : la commune survolée (sur la carte, dans les listes, sur la frise) et ses dates, trois au plus ;
    // sinon la commune choisie, ou celle de la prochaine date que le filtre garde
    const parC = new Map([...lieux, ...passeC].map(x => [x.l, x]));
    const defautC = () => { if (F.l !== null) return F.l; const r = proch.find(garde); return r ? r.d.l : null; };
    let legL;
    const legendeCarte = l => {
      const v = l ?? defautC(); if (!legC || v === legL) return; legL = v;
      const x = v != null ? parC.get(v) || (CARTE.lieux[v] ? { ...CARTE.lieux[v], dates: [] } : null) : null;
      legC.innerHTML = x ? `<span class="s7-leg-nom">${esc(CARTE.nom(x))}</span>${(x.dates || []).slice(0, 3).map(d => `<span class="s7-ll"><span>${esc(d.ligneDate || String(d.ligne || '').split(' — ')[0].trim())}</span><span class="s7-lt">${esc(d.titre || d.spectacle || '')}</span></span>`).join('')}` : '';
    };
    lierCarte(svg, { survol: legendeCarte });
    listes.addEventListener('mouseover', e => { const li = e.target.closest('li[data-l]'); legendeCarte(li ? +li.dataset.l : null); });
    listes.addEventListener('mouseleave', () => legendeCarte(null));
    dessine(false);
    legendeCarte(null);
    // la carte de réservation d'une date s'ouvre sous sa ligne (sans quitter l'agenda), se referme d'un second geste ou d'Échap ;
    // l'adresse garde la date ouverte (?date=…), le titre de la carte mène au spectacle sur cette même date
    if (RS) {
      rsVoir = RS.monter(liste, { dates: resV, carte: b => document.getElementById(idIci(b.getAttribute('data-reserver'))), choisie: F.date, basculer: true, roving: false, axe: 'hv', adresse: true,
        univers: x => uVars(x), carteOptions: d => ({ href: `${lienSp(d.slug, 'voir')}?date=${encodeURIComponent(RS.cle(d))}` }), effet: effetReserver(() => svg), surChoix: (d, k) => { F.date = k; if (!d) communeChoisie(svg, null); } });
      liste.addEventListener('keydown', ev => {
        if (ev.key !== 'Escape' || !rsVoir || rsVoir.cle() == null) return;
        const b = $(`[data-reserver="${CSS.escape(rsVoir.cle())}"]`, liste), li = b && b.closest('li');
        if (li && li.contains(ev.target)) { ev.preventDefault(); rsVoir.choisir(null); b.focus(); }
      });
      if (F.date && rsVoir.cle() && !surPlace) bientot(() => { const b = $(`[data-reserver="${CSS.escape(F.date)}"]`, liste); if (b) { b.scrollIntoView({ block: 'center' }); b.focus({ preventScroll: true }); } });
    }
    // la frise de la saison (la 07) : une seule ligne du temps, aucune grappe (quatre couloirs) ; un repère survolé allume sa
    // ligne, sa commune et l'écrit sous la carte ; un clic choisit sa date (ou mène à sa ligne)
    function poserFrise() {
      if (fSaison || !racine.isConnected) return;
      fSaison = frise($('#v-frise'), { echelle: 'saison', saison: D.saison, points: reperesSaison(), libelle: S0.titre, regrouper: 0, couloirs: 4, moisMin: 84, classe: 'frise-saison',
        relier: { liste: main, carte: l => { survolCarte(svg, l == null ? F.l : l); legendeCarte(l); } },
        choix: p => { const k = parFriseV.get(p.id); if (k && rsVoir && rsVoir.cle() !== k) rsVoir.choisir(k); allerLigne(p.id); } });
      if (fSaison) lierCarte(svg, { survol: l => { if (l == null) fSaison.eteindre(); else fSaison.allumer({ l }); } });
    }
    // la légende survolée : les dates de ce spectacle seules sur la frise
    let legOn = null;
    const isoler = li => {
      if (li === legOn || !fSaison) return;
      legOn = li;
      const el = fSaison.el; el.classList.toggle('est-filtre', !!li);
      const ids = li ? new Set(ptsSaison(garde).filter(([r]) => r.cle === li.dataset.cle).map(([, p]) => String(p.id))) : null;
      $$('.frise-point', el).forEach(x => x.classList.toggle('est-sp', !!ids && ids.has(x.dataset.id)));
    };
    fs7.addEventListener('pointerover', e => isoler(e.target.closest && e.target.closest('.fs7-l[data-cle]')), { passive: true });
    fs7.addEventListener('pointerleave', () => isoler(null), { passive: true });
    // la frise est dans le premier écran : posée tout de suite (rien ne saute) ; le reste, sous le pli (toutes les dates, les
    // saisons passées), dans la tâche suivante, sauf quand la vue se refait en place (D a changé), qu'un filtre est actif ou
    // qu'une saison est demandée (#/saisons/<saison>)
    poserFrise();
    if (surPlace || actif() || ouvrir) { dessineProchaines(true); dessineAgenda(true); } else ensuite(() => ensuite(() => dessineAgenda()));
    bientot(() => { pousser(svg); initAlerteTournee(); if (ouvrir && !surPlace) montrerOnglet(ouvrir); });
    // #/saisons/<saison> : quand les polices arrivent après le saut, ce qui est au-dessus de la saison se recompose ; elle est
    // recalée sous la bande, si l'on n'a pas bougé entre-temps
    if (ouvrir && !surPlace && document.fonts && document.fonts.status === 'loading') {
      let bouge = false;
      const geste = () => { bouge = true; }, gestes = ['wheel', 'touchstart', 'keydown', 'pointerdown'];
      gestes.forEach(t => addEventListener(t, geste, { passive: true, once: true }));
      document.fonts.ready.then(() => requestAnimationFrame(() => {
        gestes.forEach(t => removeEventListener(t, geste));
        const dt = $(`#sai-${ouvrir}`, racine);
        if (!bouge && dt && dt.isConnected && dt.open) { dt.scrollIntoView({ block: 'start', behavior: 'instant' }); montrerOnglet(ouvrir); }
      }));
    }
    const SA = ouvrir && D.saisons[ouvrir];
    return SA ? { titre: SA.titre, ancre: `sai-${ouvrir}` } : { titre: M0.texte };
  }

  /* ---------- je souhaite programmer (la 05) : l'en-tête d'aplat et le contact diffusion, le catalogue, l'accueil d'un

      <section class="ep-aplat" id="p-lieux" aria-labelledby="h-lieux"><div class="wrap ep-diff">
        <div class="ep-diff-t"><p class="ep-k"${ed('site.nom')}>${esc(S.nom)}</p><h2 class="ep-sec-t" id="h-lieux" data-mv="monte">${esc(L.lieuxDiffusion)}</h2>${SEP}
          <div class="p-diff" id="p-diff"></div>
          ${S.compagnie && S.compagnie.paragraphes && S.compagnie.paragraphes[1] ? bloc(S.compagnie.paragraphes[1], 'site.compagnie.paragraphes.1') : ''}
          <p class="ep-ecrire" id="p-ecrire"><a class="ep-bt" href="${S.ecrire.href}">${esc(L.ecrire)}${FLECHE}</a></p></div>
        <figure class="ep-diff-carte">${retenu(`carte-tout-${motionOK()}`, () => carte({ lieux, titre: L.lieuxDiffusion, classe: 'tout', simple: true, fin: .5 }))}<figcaption class="bulle" id="bulle"></figcaption></figure>
      </div></section>`;
    const svg = $('.ep-diff-carte svg', main);
    bulleSur(svg, $('#bulle'), l => { const x = lieux.find(y => y.l === l);
      return x ? `<b>${esc(CARTE.nom(x))}</b><ul>${[...new Set(x.dates.map(d => d.spectacle))].map(t => `<li><span class="t">${esc(t)}</span></li>`).join('')}</ul>` : ''; });
    // la diffusion de la compagnie, saison par saison (le nombre de ses dates) ; celle de chaque spectacle est dans sa fiche
    // (sa largeur attendue : la colonne de gauche de l'aplat au bureau, toute la largeur au téléphone)
    const ks = Object.keys(D.saisons || {}).filter(k => /^\d{4}-\d{4}$/.test(k) && k <= D.saison).sort();
    const lDiff = innerWidth > 980 ? Math.round((largeurWrap() + 28 - Math.min(80, Math.max(32, innerWidth * .044))) * 5 / 12) - 28 : largeurWrap();
    if (ks.length) frise($('#p-diff'), { echelle: 'annees', debut: ks[0], fin: ks[ks.length - 1], libelle: L.lieuxDiffusion, classe: 'frise-diffusion frise-compagnie', largeur: lDiff, anMin: 38,
      bandes: ks.map(k => bandeSaison(k, D.saisons[k].spectacles.reduce((a, g) => a + (g.dates || []).reduce((acc, dt) => acc + (dt.nb_representations != null ? +dt.nb_representations : (dt.representations ? dt.representations.length : 1)), 0), 0))) });
    frisesDiffusion(main);
    bientot(() => { pousser(svg); initSimulateurPro(); });
    return { titre: e.texte, entree: 'programmer' };
  }

  /* ---------- je représente un établissement scolaire (la 05) : l'en-tête d'aplat, la position de la compagnie sur les publics
     jeunes, la convention, l'action culturelle de chaque spectacle par lieu, le dossier scolaire, les actions culturelles, les
     dates scolaires à côté de leur carte, l'appel final ---------- */
  function etablissement() {
    vue = 'etablissement';

    const ordre = Ls => [...Ls.filter(s => s.dossier), ...Ls.filter(s => !s.dossier && !ac(s).statut), ...Ls.filter(s => !s.dossier && ac(s).statut)];
    const ber = D.shows.find(s => s.dossier && D.dossiers && D.dossiers[s.dossier] && D.dossiers[s.dossier].type);

              ${FLECHE}

      ${reste.length ? `<div class="ep-sec"><div class="wrap"><ul class="acs">${reste.map(ficheEtab).join('')}</ul></div></div>` : ''}
      ${ber ? `<section class="ep-sec" id="e-dossier" aria-labelledby="e-dossier-h"><div class="wrap"><a class="dos-appel ${uClasse(ber)}" style="${uVars(ber)}" href="${lienSp(ber.slug, 'etablissement')}">

      ${A ? `<section class="ep-sec fond" id="e-actions" aria-labelledby="e-actions-h"><div class="wrap ep-act">
        <div>${SEP}<h2 class="ep-sec-t" id="e-actions-h" data-mv="monte"${ed('site.actions.titre')}>${esc(A.titre)}</h2><div class="ep-prose">${A.blocs.map((h, i) => bloc(h.replace(/<(\/?)h2\b/g, '<$1h3'), `site.actions.blocs.${i}`)).join('')}</div></div>
        <figure class="ep-act-ph">${D.photos['actions-culturelles'] ? `<span class="g"><img src="${D.photos['actions-culturelles']}" alt="${esc(A.titre)}" loading="lazy"></span>` : ''}${petites.map(k => `<span class="p"><img src="${D.photos[k]}" alt="" loading="lazy"></span>`).join('')}${A.credit ? `<figcaption${ed('site.actions.credit')}>${esc(A.credit)}</figcaption>` : ''}</figure>

        <figure class="e-carte ep-carte">${carte({ lieux, titre: L.enEtablissement, serre: true })}</figure>

    const svg = $('.e-carte svg', main), liste = $('#e-liste', main);
    if (svg && liste) {
      relier(svg, liste, l => { const li = $(`li[data-l="${l}"]`, liste); if (li) li.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' }); });
      // la frise des dates scolaires à venir, du mois en cours à la dernière
      const fSco = frise($('#e-frise', main), { echelle: 'periode', debut: `${D.aujourdhui.slice(0, 7)}-01`, points: sco.map(repereProchaine), libelle: L.enEtablissement,
        relier: { liste, carte: l => marquer(svg, l) }, choix: p => allerLigne(p.id) });
      if (fSco) lierCarte(svg, { survol: l => { if (l == null) fSco.eteindre(); else fSco.allumer({ l }); } });
      pousserVu(svg);
      auFil(liste, svg, fSco);   // (scrollytelling) les dates scolaires se dessinent au fil de la lecture
    }
    bientot(() => { initEspaceScolaire(); });
    return { titre: e.texte, entree: 'etablissement' };
  }

  /* ---------- les spectacles : le sommaire de la 08 ----------
     La table des matières de tous les spectacles : une ligne chacun (sa vignette, son titre dans la police de son univers,
     son année en folio au bout d'un filet de conduite, son sous-titre, son état : « En création », « en tournée »), un lien
     vers sa page. À côté, épinglé, l'aperçu de celui qu'on survole ou qu'on choisit au clavier, dans son univers : sa photo,
     la carte de ses tournées, son lieu et son temps, sa création, son action culturelle, son accroche, sa prochaine date tout
     public (ou son annonce, en création) et le lien vers sa page. L'aperçu se relaie : un fondu, ses lignes arrivent l'une

  let tdmChoisi = null;

  const styleTdm = s => `${uVars(s)};--c:${couleurDe(s.slug)};--tk:${TK[((s.univers || {}).polices || {}).titre] || 1}`;

  /* ---------- la troupe (règle 20, TROUPE), celle de la 06 : les bras de la pieuvre, entre la présentation et les repères ----------
     La pieuvre de la compagnie en tête ; un bras effilé descend d'elle et pousse, de métier en métier, une branche vers chaque
     catégorie (son icône dans une ventouse, son titre) ; les personnes sont les ventouses du bras : une pastille, leur visage
     quand sa publication est accordée (sinon le nom seul), leur nom, leur métier précis. Une personne paraît dans chaque
     catégorie de ses métiers ; la survoler ou la choisir allume toutes ses places et les relie (TROUPE.relier, des liens à la
     couleur de la saison). Les bras poussent une fois, quand la troupe arrive à l'écran (Web Animations sur le masque qui les

  // une photo publiée qui ne se charge pas (le fichier manque) : sa place garde le nom seul, et les rendus suivants la savent absente

  function placeTroupe(x) {

    const ancre = aPhoto(x) ? `<span class="tr6-v" data-troupe-ancre><img src="${esc(x.photo)}" alt="" width="96" height="96" loading="lazy" decoding="async" data-troupe-photo></span>`
      : '<span class="tr6-pt" data-troupe-ancre></span>';
    return `<li><button type="button" class="tr6-p${aPhoto(x) ? ' a-photo' : ''}" data-troupe-place data-troupe-personne="${esc(x.personne)}" aria-pressed="false">${ancre}<span class="tr6-qui"><span class="tr6-nom">${x.prenom ? `<span>${esc(x.prenom)}</span> ` : ''}<span>${esc(x.nom)}</span></span>${metiers}</span></button></li>`;
  }
  function troupeHTML() {
    if (typeof TROUPE === 'undefined' || !S.troupe) return '';
    const cs = TROUPE.categories().filter(c => c.places.length);
    if (!cs.length) return '';
    // les visages d'abord, dans chaque catégorie ; le jeu, le plus nombreux, en dernier : la plus longue branche
    const jeu = cs.find(c => c.cle === 'jeu'), ordre = [...cs.filter(c => c !== jeu), ...(jeu ? [jeu] : [])];
    return `<section class="bloc sans-filet troupe" aria-labelledby="h-troupe"><div class="wrap">
      <h2 class="titre-bloc" id="h-troupe"${ed('site.troupe.titre')}>${esc(TROUPE.titre())}</h2>${trait()}

        <svg class="tr6-bras" aria-hidden="true" focusable="false"></svg>
        <div class="tr6-coeur" aria-hidden="true">${D.logo.octopus}</div>
        ${ordre.map(c => `<section class="tr6-cat${c === jeu ? ' tr6-jeu' : ''}" data-troupe-categorie="${esc(c.cle)}" aria-labelledby="tr6-h-${esc(c.cle)}">
          <h3 class="tr6-t" id="tr6-h-${esc(c.cle)}"><span class="tr6-ic">${TROUPE.icone(c.cle)}</span><span${ed(`site.troupe.categories.${c.i}.titre`)}>${esc(c.titre)}</span></h3>
          <ul class="tr6-places">${[...c.places.filter(aPhoto), ...c.places.filter(x => !aPhoto(x))].map(placeTroupe).join('')}</ul></section>`).join('')}
      </div></div></section>`;
  }
  // les bras : un tronc qui descend de la pieuvre le long du bord, une branche vers l'icône de chaque catégorie ; tracés d'après
  // la mise en page (lue à l'image qui suit, puis quand la troupe change de largeur), découverts par un masque. mode : 'pousse'
  // (ils poussent), 'cache' (pas encore à l'écran : masqués, en attendant de pousser), sinon posés
  function brasTroupe(tr, mode) {
    const svg = $('.tr6-bras', tr), coeur = $('.tr6-coeur', tr);
    if (!svg || !coeur || typeof TROUPE === 'undefined' || !tr.isConnected) return;
    const r0 = tr.getBoundingClientRect(), W = r0.width, H = r0.height;
    if (!W || !H) return;
    const c = coeur.getBoundingClientRect(), x0 = c.left - r0.left + c.width * .5, y0 = c.top - r0.top + c.height * .78;
    const ics = $$('.tr6-ic', tr).map(i => { const r = i.getBoundingClientRect(); return [r.left - r0.left, r.top - r0.top + r.height / 2]; });
    if (!ics.length) return;
    const xs = Math.max(10, Math.min(x0, ...ics.map(q => q[0])) - 30), yN = ics[ics.length - 1][1];

    const yb = Math.max(y0 + 24, Math.min(y0 + 90, ics[0][1] - 34));
    const tronc = TROUPE.lisse([[x0, y0], [x0 - (x0 - xs) * .5, y0 + (yb - y0) * .45], [xs, yb], [xs, Math.max(yN, yb + 1)]]);
    const branches = ics.map(([x, y]) => TROUPE.courbe([xs, y - 26], [x - 4, y], { courbe: .3 }));
    const f = n => n.toFixed(1);
    svg.setAttribute('viewBox', `0 0 ${f(W)} ${f(H)}`);
    svg.innerHTML = `<defs><mask id="tr6-masque" maskUnits="userSpaceOnUse" x="0" y="0" width="${f(W)}" height="${f(H)}">
        <path class="tr6-mq" pathLength="1" d="${tronc.d}"${mode === 'cache' ? ' style="stroke-dashoffset:1"' : ''}/>${branches.map(b => `<path class="tr6-mq" pathLength="1" d="${b.d}"${mode === 'cache' ? ' style="stroke-dashoffset:1"' : ''}/>`).join('')}</mask></defs>
      <g mask="url(#tr6-masque)"><path class="tr6-b" d="${TROUPE.effile(tronc, { w0: 14, w1: 4 })}"/>${branches.map(b => `<path class="tr6-b" d="${TROUPE.effile(b, { w0: 5, w1: 2 })}"/>`).join('')}</g>
      ${ics.map(([x, y]) => `<circle class="tr6-vent" cx="${f(x - 4)}" cy="${f(y)}" r="3.4"/>`).join('')}`;
    if (mode !== 'pousse' || !svg.animate) return;
    $$('.tr6-mq', svg).forEach((m, i) => m.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: i ? 520 : 900, delay: i ? 260 + i * 90 : 0, easing: 'cubic-bezier(.2, .7, .2, 1)', fill: 'backwards' }));
  }
  // la troupe prend vie : les liens entre les places d'une personne (au clavier aussi), les bras qui poussent à l'arrivée, les
  // icônes qui s'animent une fois à leur arrivée dans l'écran
  let troupeCtl = null, troupeIO = null, troupeRO = null;
  function vivreTroupe() {
    if (troupeCtl) { troupeCtl.detruire(); troupeCtl = null; }
    if (troupeIO) { troupeIO.disconnect(); troupeIO = null; }
    if (troupeRO) { troupeRO.disconnect(); troupeRO = null; }
    const tr = $('.tr6', main);
    if (!tr || typeof TROUPE === 'undefined') return;
    troupeCtl = TROUPE.relier(tr, { liens: true, clavier: true });
    let vu = !motionOK() || surPlaceRendu || !('IntersectionObserver' in window), largeur = 0;

      troupeIO = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return;

      troupeIO.observe(tr);

  /* ---------- l'espace pro (règles 16 et 21), celui de la 05 : sur l'aplat de la saison, la grande capitale et son texte ; ses

  function espacePro() {

  /* ---------- la page d'un spectacle, composée : l'univers de la 07, réserver et le bilan de la 10 ----------
     Un spectacle en tournée (ou en création) : l'ouverture de la 07 (sa photo principale plein cadre dans le noir de son
     univers, le titre, l'accroche, la prochaine date, l'appel de l'entrée ; son motif projeté comme un gobo), ses trois
     entrées en onglets (une lampe à la couleur de chacune), puis ses chapitres à côté d'un petit sommaire qui suit la
     lecture. Dans « voir », la présentation se lit en récit : le texte se découvre pas à pas à côté de ses photos (la
     principale d'abord, puis les autres dans l'ordre de D), épinglées, qui se relaient au fil de la lecture (un filet par
     photo dit où l'on en est) ; puis ses dates et la carte de réservation de la 10 (RESERVER, règle 17). Un spectacle qui
     n'est plus en tournée (règle 21) : la page de la 10 (son ouverture, ses chapitres, un sommaire qui suit la lecture),
     sa présentation d'abord, puis le bilan de ses dates passées, les actions culturelles menées en dernier, et seulement
     si elles ont un texte. Moins d'animations : rien n'est épinglé, le récit se lit d'un trait. */
  // les motifs en grand (ceux de la 10) : la signature de l'ouverture, qui suit la lecture (--p, de 0 à 1 en la quittant)
  const MOTIFS = {
    arene: '<g class="m-tourne"><circle cx="120" cy="120" r="106" stroke-width="5" stroke-dasharray=".1 12.3"/><circle cx="120" cy="120" r="94"/></g><circle cx="120" cy="120" r="66" stroke-width="1.4"/><path d="M120 103l15 8.5v17L120 137l-15-8.5v-17z"/>',
    jumeaux: '<g class="m-g"><circle cx="94" cy="134" r="48"/><path d="M64 88l9-24 11 15 10-21 10 21 11-15 9 24z"/></g><g class="m-d"><circle cx="146" cy="134" r="48"/><path d="M116 88l9-24 11 15 10-21 10 21 11-15 9 24z"/></g>',
    annotations: '<path class="m-ecrit" pathLength="1" d="M26 58c8-7 15 7 23 0s15 7 23 0 15 7 23 0 15 7 23 0"/><path class="m-ecrit" pathLength="1" d="M26 86c8-6 15 6 23 0s15 6 23 0 15 6 21 0"/><path class="m-ecrit" pathLength="1" d="M26 114c8-6 15 6 23 0s15 6 23 0"/><path class="m-ecrit" pathLength="1" d="M24 136c46 7 98 5 150-5"/><ellipse class="m-ecrit" pathLength="1" cx="176" cy="76" rx="36" ry="22" transform="rotate(-8 176 76)"/><path class="m-ecrit" pathLength="1" d="M120 196c22-26 46-38 76-44m-15-10 15 10-12 13"/>',
    paperboard: '<path d="M120 172v56M84 172l-26 58M156 172l26 58"/><rect x="52" y="34" width="136" height="138" rx="2"/><path d="M46 34h148" stroke-width="5"/><path class="m-ecrit" pathLength="1" d="M120 146c-34-20-36-50-13-53 7-1 13 4 13 11 0-7 6-12 13-11 23 3 21 33-13 53z"/><path class="m-ecrit" pathLength="1" d="M68 58h40M68 72h26"/><path class="m-ecrit" pathLength="1" d="M150 52l20 22m0-22-20 22"/>',
    nez: '<path d="M156 30c-24 4-40 22-42 54"/><g class="m-nez"><path d="M114 84c-12 16-40 32-70 44 18 8 46 10 66 12"/></g><path d="M110 140c-4 7 5 11-3 17 8 4 2 10 4 15 2 15 11 23 24 25 4 13 2 23-1 31"/><path d="M134 108c6-3 12-3 16 0" stroke-width="2.4"/>',
    horloge: '<circle cx="120" cy="120" r="98"/><circle cx="120" cy="120" r="86" stroke-width="9" stroke-dasharray="1.6 43.43"/><g class="m-heure"><path d="M120 120V74" stroke-width="5"/></g><g class="m-minute"><path d="M120 120V46" stroke-width="2.6"/></g><circle cx="120" cy="120" r="5" fill="currentColor" stroke="none"/>',
    fil: '<path class="m-ecrit" pathLength="1" d="M4 168C44 120 70 196 108 150c18-22 30-56 8-62s-30 32 2 42c30 10 44-30 70-26 22 3 30 30 48 18"/>',
    chronologie: '<path d="M20 140h200"/><path d="M20 126v28M60 132v16M100 132v16M140 132v16M180 132v16M220 126v28"/><text x="20" y="112">1850</text><text x="220" y="112" text-anchor="end">2077</text><circle class="m-curseur" cx="20" cy="140" r="8" fill="currentColor" stroke="none"/>',
  };
  const motifG = m => MOTIFS[m] ? `<svg class="sp-motif m-${m}" viewBox="0 0 240 240" aria-hidden="true" focusable="false">${MOTIFS[m]}</svg>` : '';
  // ce qui suit la lecture : l'ouverture (--p : le motif tourne, la photo s'éloigne d'un rien) ; le récit (la photo du moment,
  // le filet de chaque photo, le pas qu'on lit)
  const FX = {
    une(sec) {
      if (!motionOK()) return;
      sec.style.setProperty('--p', clamp(scrollY / Math.max(1, sec.offsetHeight * .85), 0, 1).toFixed(3));
    },
    recit(sec) {
      if (!motionOK()) return;
      const vh = innerHeight, r = sec.getBoundingClientRect();
      if (r.bottom < 0 || r.top > vh) return;
      const vis = sec.__vis || (sec.__vis = $('.rc-vis', sec)), pas = sec.__pas || (sec.__pas = $$('.rc-p', sec));
      const phs = sec.__phs || (sec.__phs = $$('.rc-ph', sec)), fil = sec.__fil || (sec.__fil = $$('.rc-fil i', sec));
      if (vis && phs.length) {
        // (le cadre épinglé : à sa place avant, collé sous l'en-tête pendant, en bas du récit après : de 0 à 1)
        const v = vis.getBoundingClientRect(), p = clamp((v.top - r.top) / Math.max(1, r.height - v.height), 0, 1);
        const n = phs.length, x = p * n, j = Math.min(n - 1, Math.floor(x));
        if (sec.__j !== j) { phs.forEach((f, i) => f.classList.toggle('on', i === j)); sec.__j = j; }
        fil.forEach((g, i) => g.style.setProperty('--f', i < j ? '1' : i > j ? '0' : clamp(x - j, 0, 1).toFixed(3)));
      }
      // le pas qu'on lit : le dernier dont le haut a passé les trois cinquièmes de l'écran
      let k = 0;
      pas.forEach((el, i) => { if (el.getBoundingClientRect().top < vh * .6) k = i; });
      if (sec.__k !== k) { pas.forEach((el, i) => el.classList.toggle('on', i === k)); sec.__k = k; }
    },
  };

  /* ---------- la page d'un spectacle : un univers, trois entrées ---------- */
  // un chapitre : il entre au sommaire (dans l'ordre de la page) ; cls : une classe de plus
  const chapitre = (chap, id, nom, html, cls = '') => { chap.push({ id, nom }); return `<section class="chap${cls ? ' ' + cls : ''}" id="c-${id}" data-chap="${esc(nom)}">${html}</section>`; };
  const titreChap = (t, attrs = '') => `<h2 class="chap-t" tabindex="-1" data-mv="monte"${attrs}>${t}</h2>`;
  // l'ouverture : celle de la 07 pour un spectacle en tournée (entree), celle de la 10 pour la page seule d'un spectacle qui
  // ne l'est plus ; la photo principale plein cadre, le titre qui se révèle lettre à lettre, l'accroche qui s'écrit mot à mot
  function ouverture(s, entree, pub) {
    const m = mo(s), tl = s.titreLignes && s.titreLignes.length ? s.titreLignes : null;
    const T = lettres(tl || [s.titre], tl ? tl.map((x, k) => edS(s, 'titreLignes', k)) : [edS(s, 'titre')]);
    const d0 = (T.fin + .1).toFixed(2), credit = s.creditPhotos || s.credit, foc = Number.isFinite(+s.focale) ? +s.focale : 50;
    const titre = `<h1 class="u-titre${T.n > 22 ? ' long' : ''}" tabindex="-1" aria-label="${esc(s.titre)}" style="--pas:${T.pas}ms"><span aria-hidden="true">${T.html}</span></h1>`;
    const st = s.sousTitre ? `<p class="une-st"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : '';
    const acc = s.accroche ? `<p class="une-acc ecrit" style="--d0:${d0}s"${edS(s, 'accroche')}>${ecrit(s.accroche)}</p>` : '';
    let texte;
    if (!entree) {
      // la 10 : le fil d'Ariane, la compagnie qui signe, le titre et son filet, la création et le lieu et le temps
      const sp = menuDe('spectacles') || { href: '#/spectacles', texte: L.spectacles };
      texte = `<p class="une-ariane"><a href="#/">${esc(S.accueil)}</a> / <a href="${esc(sp.href)}">${esc(sp.texte)}</a></p><p class="une-nom"${ed('site.nom')}>${esc(S.nom)}</p>${titre}${st}
        <p class="une-meta"><span${edS(s, 'creation')}>${esc(s.creation)}</span>${s.lieuTemps ? `<span${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</span>` : ''}</p>${acc}`;
    } else {
      // la 07 : la création, le lieu et le temps, le titre, « en tournée » qui respire, l'accroche ; dans « voir », la
      // prochaine date et l'invitation à réserver (elle mène à la bande des dates, règle 17) ; la bande-annonce se lit plus bas
      const res = entree === 'voir' && !s.statut && RS ? RS.dates(s.slug) : [], prochaine = entree === 'voir' && !s.statut ? res[0] || pub[0] : null;
      const cta = entree === 'voir' ? `${res.length ? `<button type="button" class="bu plein" data-va="rs-zone">${esc(L.reserver)}${BAS}</button>` : `<button type="button" class="bu plein" data-va="c-dates">${esc(!s.statut && !pub.length ? L.lieuxDiffusion : L.dates)}${BAS}</button>`}${lienVideo(s)}`
        : entree === 'programmer' ? `<a class="bu plein" href="${S.ecrire.href}">${esc(L.ecrire)}${FLECHE}</a>${lienVideo(s)}`
        : `${s.dossier ? `<button type="button" class="bu plein" data-va="c-dossier">${esc(L.dossierScolaire)}${BAS}</button>` : ''}<a class="bu${s.dossier ? '' : ' plein'}" href="${S.ecrire.href}">${esc(L.ecrire)}${FLECHE}</a>`;
      const etat = s.statut ? `<p class="une-statut"${edS(s, 'statut')}>${esc(s.statut)}</p>` : s.enTournee ? `<p class="une-statut">${esc(L.enTournee)}</p>` : '';
      texte = `<p class="une-sur"><span${edS(s, 'creation')}>${esc(s.creation)}</span>${s.lieuTemps ? `<span${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</span>` : ''}</p>${titre}${etat}${st}${acc}
        ${prochaine ? `<p class="une-date">${esc(prochaine.ligne)}</p>` : ''}<p class="u-cta">${cta}</p>`;
    }
    return `<section class="sp-une sp-une${entree ? 7 : 10} mv-principal${ouvDeja ? ' deja' : ''}" id="c-une" data-mv-nom="sp-${esc(s.slug)}" data-scrolly data-fx="une">
      <div class="une-ph"${edP(s, 'photo')}><img src="${D.photos[s.slug]}" alt="" style="object-position:${foc}% 38%" decoding="async"></div>
      <div class="une-ombre" aria-hidden="true"></div><div class="une-lueur" aria-hidden="true"></div>
      <div class="une-motif" aria-hidden="true">${motifG(m)}</div>
      <div class="wrap une-corps"><div class="une-texte">${texte}</div></div>
      ${credit ? `<p class="une-credit"${edS(s, s.creditPhotos ? 'creditPhotos' : 'credit')}>${esc(credit)}</p>` : ''}
    </section>`;
  }
  // les trois entrées du spectacle (la 07) : une lampe à la couleur de chacune, la courante allumée ; le texte entier quand la
  // place le permet, sinon le court
  const onglets = (s, entree) => `<nav class="u-onglets" aria-label="${esc(s.titre)}"><div class="wrap u-onglets-in">
      <span class="ut" aria-hidden="true">${esc(s.titre)}</span>
      ${S.entrees.filter(e => e.cle !== 'etablissement' || s.actionCulturelle).map(e => `<a href="#/spectacle/${s.slug}/${e.cle}" style="--e:${e.couleurVive || e.couleur}"${e.cle === entree ? ' aria-current="page"' : ''}><span class="pt" aria-hidden="true"></span><span class="long">${esc(e.texte)}</span><span class="court">${esc(e.court)}</span></a>`).join('')}
    </div><span class="u-progres" aria-hidden="true"></span></nav>`;
  // le petit sommaire qui suit la lecture, à gauche des chapitres : des filets (la 07), un bras et ses ventouses (la 10 : la
  // page seule ; au téléphone, des pastilles) ; et, au téléphone, le sommaire flottant d'un spectacle en tournée
  const sommaireSp = (s, entree, chap) => `<nav class="sp-som${entree ? '' : ' sp-som--seul'}" aria-label="${esc(entree ? `${s.titre} – ${E[entree].court}` : s.titre)}"><ol>${chap.map((c, i) => `<li style="--i:${i}"><button type="button" data-c="${c.id}">${esc(c.nom)}</button></li>`).join('')}</ol>${entree ? `<span class="sp-som-signe" aria-hidden="true">${motifG(mo(s))}</span>` : ''}</nav>`;
  const sommaire = (s, entree, chap) => `<nav class="som" aria-label="${esc(entree ? `${s.titre} – ${E[entree].court}` : s.titre)}">
      <ol class="som-l" id="som-l" hidden>${chap.map((c, i) => `<li><button type="button" data-c="${c.id}"><span class="n">${i + 1}</span>${esc(c.nom)}</button></li>`).join('')}</ol>
      <button type="button" class="som-b" aria-expanded="false" aria-controls="som-l"><span class="n" id="som-n">1/${chap.length}</span><span id="som-nom">${esc(chap[0].nom)}</span>${HAUT}</button>
    </nav>`;
  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu
  const portrait = ({ e, p, lignes }, credits) => {
    const nom = nomDe(p), k = `personnes.${e.personne}`;
    return `<figure class="u-pt"><span class="u-pt-cadre" data-edit-photo="${esc(k)}.photo"><span class="u-pt-mono" aria-hidden="true"><b>${esc(initiales(p))}</b></span>${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(nom)}" width="320" height="400" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span>
      <figcaption>${credits ? `<small class="u-pt-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="u-pt-nom"><span data-edit="${esc(k)}.prenom">${esc(p.prenom)}</span> <span data-edit="${esc(k)}.nom">${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="u-pt-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="u-pt-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];
    L.forEach((x, i) => {
      if (pris.has(i)) return; pris.add(i);
      const j = x.e.alternance ? L.findIndex((y, k) => !pris.has(k) && x.e.alternance.includes(nomDe(y.p))) : -1;   // « en alternance avec … » : par deux
      if (j < 0) blocs.push(`<li>${portrait(x, credits)}</li>`);
      else { pris.add(j); blocs.push(`<li class="u-paire">${portrait(x, credits)}${portrait(L[j], credits)}</li>`); }
    });
    return `<ul class="u-cast" style="--n:${L.length}">${blocs.join('')}</ul>`;
  }
  // la distribution (la 07) : les portraits, puis la fiche d'un côté, la durée, la production, les mentions et la compagnie qui
  // signe de l'autre (sansDuree : l'onglet programmer la dit déjà)
  function distribution(s, chap, entree, sansDuree = false) {
    const P = s.programmer || {}, eq = P.equipeCreation || [], fiche = eq.length ? [] : (s.fiche || []).map((f, i) => ({ f, i }));
    const tete = fiche.filter(x => !x.f.libelle), roles = fiche.filter(x => x.f.libelle);
    const cast = entree === 'voir' ? portraits(s) : '';
    return chapitre(chap, 'distribution', L.distribution, `<div class="wrap u-distrib">
      ${titreChap(esc(L.distribution))}
      ${tete.map(({ f, i }) => `<p class="u-d-tete"${edS(s, 'fiche', i, 'valeur')}>${f.valeur}</p>`).join('')}
      ${cast}
      <div class="u-distrib-g"><div>
        ${cast || !s.avec ? '' : `<p class="u-avec"><span class="k"${edS(s, 'avec', 'libelle')}>${esc(s.avec.libelle)}</span><span${edS(s, 'avec', 'valeur')}>${s.avec.valeur}</span></p>`}
        ${eq.map((l, i) => `<p class="u-avec"${edS(s, 'programmer', 'equipeCreation', i)}>${esc(l)}</p>`).join('')}
        ${roles.length ? `<dl class="u-fiche">${roles.map(({ f, i }) => `<div><dt${edS(s, 'fiche', i, 'libelle')}>${esc(f.libelle)}</dt><dd${edS(s, 'fiche', i, 'valeur')}>${f.valeur}</dd></div>`).join('')}</dl>` : ''}
      </div><div>
        ${s.duree && !sansDuree ? `<p class="u-duree-d"${edS(s, 'duree')}>${esc(s.duree)}</p>` : ''}
        ${(s.production || []).length ? `<div class="u-prod">${s.production.map((p, i) => bloc(p, `shows.${s.slug}.production.${i}`)).join('')}</div>` : ''}
        ${(s.mentions || []).map((x, i) => `<p class="u-mention"${edS(s, 'mentions', i)}>${x}</p>`).join('')}
        <p class="u-signe"${ed('site.nom')}>${esc(S.nom)}</p>
        ${s.creditPhotos ? `<p class="u-credit"${edS(s, 'creditPhotos')}>${esc(s.creditPhotos)}</p>` : ''}
      </div></div>
    </div>`);
  }
  const appel = s => `<section class="u-appel"><div class="wrap"><p class="u-signe"${ed('site.nom')}>${esc(S.nom)}</p><a class="bu plein" href="${S.ecrire.href}">${esc(L.ecrire)}${FLECHE}</a></div></section>`;
  const carteTournee = (s, lieux, passe) => lieux.length || passe.length ? carte({ lieux, passe, titre: s.titre }) : carte({ titre: s.titre, classe: 'attente', interactif: false });

  // le texte du spectacle, paragraphe par paragraphe (le premier, court, en chapeau) ; ses citations (un vers par ligne, ou une
  // réplique en prose)
  const texteSp = s => (s.texte || []).map((p, k) => k === 0 && p.length < 340 && !/^\s*</.test(p) ? `<p class="chapo"${edS(s, 'texte', k)}>${p}</p>` : bloc(p, `shows.${s.slug}.texte.${k}`));
  // (scrollytelling) la citation s'allume à la lecture, mot à mot (.lit, --n mots : chaque mot porte son rang --w)
  const citationSp = (s, c, ic) => { let k = 0; const n = (c.vers || []).reduce((a, v) => a + mots(v).length, 0);
    return `<figure class="sp-cit${c.prose ? ' prose' : ''}"><blockquote><p class="lit" style="--n:${n}">${(c.vers || []).map((v, j) => { const h = `<span class="v"${edS(s, 'citations', ic, 'vers', j)}>${ecrit(v, k)}</span>`; k += mots(v).length; return h; }).join(c.prose ? ' ' : '')}</p></blockquote>${c.source ? `<figcaption${edS(s, 'citations', ic, 'source')}>${esc(c.source)}</figcaption>` : ''}</figure>`; };
  // les photos du récit : la principale d'abord, puis les autres de la scène, dans l'ordre de D (pas celles d'un atelier ni
  // d'un établissement ; la principale, quand la liste la reprend, n'y revient pas)
  function photosRecit(s) {
    const p0 = D.photos[s.slug], out = p0 ? [{ src: p0, attr: edP(s, 'photo'), credit: s.creditPhotos || s.credit, kc: s.creditPhotos ? 'creditPhotos' : 'credit' }] : [];
    (s.photos || []).forEach((p, i) => {
      const src = D.photos[p.cle]; if (!src || p.etablissement || p.atelier || src === p0 || p.id === 'principale') return;
      out.push({ src, attr: edP(s, 'photos', i), p, i, credit: creditDe(s, p), kc: cleCredit(p) });
    });
    return out;
  }
  // le récit (voir) : la présentation, pas à pas (le cadre et la première affirmation, chaque paragraphe du texte, les autres
  // affirmations, les citations), à côté des photos qui se relaient, épinglées ; le texte reste du texte (il se lit, se
  // sélectionne, se parcourt au clavier) ; moins d'animations : rien n'est épinglé, il se lit d'un trait
  function recit(s, chap) {
    const [a0, ...autres] = s.affirmations || [], pas = [];
    // (scrollytelling) les affirmations s'allument à la lecture, mot à mot (.lit, --n mots)
    if (s.cadre || a0) pas.push(`${s.cadre ? `<p class="rc-cadre"${edS(s, 'cadre')}>${esc(s.cadre)}</p>` : ''}${a0 ? `<p class="rc-dit ecrit lit" style="--n:${mots(a0.texte).length}"${edS(s, 'affirmations', 0, 'texte')}>${ecrit(a0.texte)}</p>` : ''}`);
    texteSp(s).forEach(h => pas.push(`<div class="u-texte">${h}</div>`));
    autres.forEach((a, i) => pas.push(`<p class="rc-dit lit" style="--n:${mots(a.texte).length}"${edS(s, 'affirmations', i + 1, 'texte')}>${ecrit(a.texte)}</p>`));
    (s.citations || []).forEach((c, ic) => pas.push(citationSp(s, c, ic)));
    const phs = photosRecit(s);
    if (!pas.length) return '';
    const legende = x => (x.p && x.p.legende) || x.credit ? `<figcaption>${x.p && x.p.legende ? `<span${edS(s, 'photos', x.i, 'legende')}>${esc(x.p.legende)}</span>` : ''}${x.credit ? `<small${edS(s, x.kc)}>${esc(x.credit)}</small>` : ''}</figcaption>` : '';
    return chapitre(chap, 'spectacle', L.leSpectacle, `${titreChap(esc(L.leSpectacle))}
      <div class="rc${phs.length ? '' : ' rc--seul'}" data-scrolly data-fx="recit">
        <div class="rc-pas">${pas.map((h, i) => `<div class="rc-p${i ? '' : ' on'}"><div class="rc-in apparait">${h}</div></div>`).join('')}</div>
        ${phs.length ? `<div class="rc-vis"><div class="rc-photos">${phs.map((x, j) => `<figure class="rc-ph${j ? '' : ' on'}"${x.attr}><img src="${x.src}" alt=""${j ? ' loading="lazy"' : ''} decoding="async">${legende(x)}</figure>`).join('')}</div>
          ${phs.length > 1 ? `<div class="rc-fil" aria-hidden="true">${phs.map(() => '<i></i>').join('')}</div>` : ''}</div>` : ''}
      </div>`, 'rc-chap');
  }
  // les photos en cartons (la 07) : la première en large, les autres deux par deux, chacune sa légende en carton ; les crédits
  function photosSp(s, chap) {
    const phs = (s.photos || []).map((p, i) => ({ p, i })).filter(({ p }) => !p.etablissement && !p.atelier && D.photos[p.cle]);
    if (!phs.length) return '';
    const credits = [];
    phs.forEach(({ p }) => { const k = cleCredit(p); if (s[k] && !credits.some(c => s[c] === s[k])) credits.push(k); });
    return chapitre(chap, 'photos', L.photos, `<div class="wrap">${titreChap(esc(L.photos))}<div class="cartons7" data-mv="cascade">${phs.map(({ p, i }) => `<figure class="carton7"${edP(s, 'photos', i)}><img src="${D.photos[p.cle]}" alt="${esc(p.legende || s.titre)}" loading="lazy" decoding="async">${p.legende ? `<figcaption${edS(s, 'photos', i, 'legende')}>${esc(p.legende)}</figcaption>` : ''}</figure>`).join('')}</div>
      ${credits.map(k => `<p class="u-credit"${edS(s, k)}>${esc(s[k])}</p>`).join('')}</div>`);
  }
  // la présentation d'un spectacle qui n'est plus en tournée (la 10) : l'ouverture (le cadre, les affirmations), le spectacle
  // (son texte, ses citations), les photos, la vidéo
  function presentationSeule(s, chap) {
    const affs = s.affirmations || [], texte = texteSp(s).join('');
    let h = '';
    if (s.cadre || affs.length) h += chapitre(chap, 'ouverture', L.ouverture, `<div class="wrap">${titreChap(esc(L.ouverture))}${s.cadre ? `<p class="sp-cadre"${edS(s, 'cadre')}>${esc(s.cadre)}</p>` : ''}
      ${affs.map((a, k) => `<p class="sp-affirm lit${k ? '' : ' ecrit'}" style="--n:${mots(a.texte).length}"${edS(s, 'affirmations', k, 'texte')}>${ecrit(a.texte)}</p>`).join('')}</div>`);
    if (texte || (s.citations || []).length) h += chapitre(chap, 'spectacle', L.leSpectacle, `<div class="wrap">${titreChap(esc(L.leSpectacle))}<div class="u-texte">${texte}</div>
      ${(s.citations || []).map((c, ic) => citationSp(s, c, ic)).join('')}</div>`);
    return h + photosSp(s, chap) + videos(s, chap);
  }
  // les dates d'un spectacle (la 10) : la frise de toute sa tournée, puis réserver (règle 17) : ses prochaines dates en une bande
  // de boutons (l'horaire écrit sur chacun), la carte de la date choisie dessous, à côté de la carte de ses tournées ; une date
  // tout public qui ne se réserve pas (annulée) reste dessous, dans sa ligne ; puis toutes les dates de la saison. En création :
  // l'annonce de sa tournée ; sans date à venir : ses lieux de diffusion, la carte de ses tournées passées
  function datesSp(s, chap, pub) {
    const sl = s.slug, sp = CARTE.spectacle(sl), res = RS && !s.statut ? RS.dates(sl) : [], P = s.programmer || {};
    const av = sp.aVenir.map(x => ({ ...x, dates: x.dates.filter(d => !d.scolaire) })).filter(x => x.dates.length), vus = new Set(av.map(x => x.l));
    const titre = s.tournee && s.tournee.titre ? titreChap(esc(s.tournee.titre), edS(s, 'tournee', 'titre')) : titreChap(esc(L.actuellementEnTournee));
    const frise = `<div class="u-frise" data-tournee="${esc(sl)}"></div>`, vide = `<div data-agenda="${esc(sl)}"></div>`;
    const m = menuDe('saisons') || { href: '#/saisons' }, tout = `<p class="sp-tout"><a href="${esc(m.href)}">${esc(L.toutesLesDates)}${FLECHE}</a></p>`;
    if (s.statut) return chapitre(chap, 'dates', L.dates, `<div class="wrap">${titre}<div class="u-tournee"><div>${s.tournee && s.tournee.texte ? `<p class="u-annonce"${edS(s, 'tournee', 'texte')}>${esc(s.tournee.texte)}</p>` : ''}${vide}</div>
        <figure class="carte-sp">${carte({ titre: s.titre, classe: 'attente', interactif: false })}</figure></div></div>`);
    if (res.length) {
      const cles = new Set(res.map(RS.cle)), autres = pub.filter(d => !cles.has(RS.cle(d)));
      return chapitre(chap, 'dates', L.dates, `<div class="wrap">${titre}${frise}
        <div class="rs-zone" id="rs-zone"><div class="rs-tete"><p class="rs-k-bande" id="rs-k">${esc(L.choisirUneDate)}</p><p class="rs-defile" aria-hidden="true"><button type="button" tabindex="-1" data-defile="-1">${GAUCHE}</button><button type="button" tabindex="-1" data-defile="1">${DROITE}</button></p></div>
          ${RS.bande(res, { attributs: ` aria-labelledby="rs-k" data-agenda="${esc(sl)}"`, bouton: d => ({ attributs: ` data-date-id="${esc(d.id ?? '')}" data-frise-id="${esc(cleProchaine(d))}" data-l="${d.l ?? ''}"` }) })}
          <div class="rs-corps"><div class="rs-carte" id="rs-carte"></div><figure class="carte-sp">${carte({ lieux: av, passe: sp.passe.filter(x => !vus.has(x.l)), titre: s.titre, serre: true })}</figure></div></div>
        ${autres.length ? listeDates(autres, sl) : ''}${tout}</div>`);
    }
    if (pub.length) return chapitre(chap, 'dates', L.dates, `<div class="wrap">${titre}${frise}<div class="u-tournee"><div>${listeDates(pub, sl)}${tout}</div>
        <figure class="carte-sp">${carte({ lieux: av, passe: sp.passe.filter(x => !vus.has(x.l)), titre: s.titre })}</figure></div></div>`);
    return chapitre(chap, 'dates', L.lieuxDiffusion, `<div class="wrap">${titreChap(esc(L.lieuxDiffusion))}${frise}<div class="u-tournee"><div>${P.lieux ? `<p class="u-lieux"${edS(s, 'programmer', 'lieux')}>${esc(P.lieux)}</p>` : ''}${vide}</div>
        <figure class="carte-sp">${carteTournee(s, sp.passe, [])}</figure></div></div>`);
  }
  // « voir » : le récit, les photos, la vidéo, les dates, la distribution
  const ongletVoir = (s, chap, pub) => recit(s, chap) + photosSp(s, chap) + videos(s, chap) + datesSp(s, chap, pub) + distribution(s, chap, 'voir');
  /* ---------- la page d'un spectacle qui n'est plus en tournée (règle 21) : une seule page, sans onglets ----------
     Sa présentation (l'ouverture, le spectacle, les photos, la vidéo, la distribution), puis le bilan de ses dates passées
     (sa phrase de D, ses chiffres tirés des données seules : ses dates, ses communes, ses saisons ; la frise de sa tournée ;
     ses dates par saison, de la plus récente à la plus ancienne, à côté d'une grande carte de tous ses lieux), enfin les
     actions culturelles menées, seulement si elles ont un texte (sans paragraphe, le chapitre ne paraît pas, ni au sommaire),
     avec ses dates scolaires passées. */
  // ses dates passées, toutes saisons : [{ k, titre, rows }], la plus récente d'abord, et dans chaque saison de la plus récente
  // à la plus ancienne (une ligne sans date reste à la suite de la sienne)
  function datesPassees(s) {
    return Object.keys(D.saisons || {}).filter(k => /^\d{4}-\d{4}$/.test(k)).sort().reverse().map(k => ({ k, titre: D.saisons[k].titre,
      rows: lignesSaison(k).filter(r => r.g.slug === s.slug && (!r.k || r.k < D.aujourdhui)).sort(plusRecente) })).filter(x => x.rows.length);
  }
  function bilanSp(s, chap, G) {
    // (les chiffres ne comptent ni les dates annulées ni les résidences, règle 23 : elles paraissent dans ses dates, marquées)
    const jouee = r => !r.suite && !annulee(r.d) && !r.d.residence;
    const P = s.programmer || {}, jouees = G.flatMap(g => g.rows).filter(jouee), T = CARTE.spectacle(s.slug);
    const chiffres = [[jouees.length, L.dates], [new Set(jouees.map(r => r.d.l).filter(l => l != null)).size, L.communes],
      [G.filter(g => g.rows.some(jouee)).length, L.saisons]].filter(([n, l]) => n && l);
    return chapitre(chap, 'bilan', L.bilan, `<div class="wrap">${titreChap(esc(L.bilan))}
        ${P.representations ? `<p class="u-bilan-rep"${edS(s, 'programmer', 'representations')}>${esc(P.representations)}</p>` : ''}
        ${chiffres.length ? `<ul class="u-bilan-n">${chiffres.map(([n, l]) => `<li><b class="gros">${n}</b><span>${esc(l)}</span></li>`).join('')}</ul>` : ''}
        <div class="u-frise" data-tournee="${esc(s.slug)}"></div>
        <div class="u-bilan">
          <div class="u-bilan-dates dates-sp">${G.map(g => `<section class="u-bilan-s"><h3 class="mois"><a href="#/saisons/${g.k}">${esc(g.titre)}</a>${((n) => n ? ` <small>${n}</small>` : '')(g.rows.filter(r => !r.suite && !r.d.residence).length)}</h3><ul class="dates" data-agenda="${esc(s.slug)}">${g.rows.map(r => ligneAgenda(r, '', true)).join('')}</ul></section>`).join('')}</div>
          <figure class="carte-sp carte-bilan">${carte({ lieux: T.passe, titre: s.titre, serre: true, classe: 'bilan' })}</figure>
        </div>
      </div>`);
  }
  // les actions culturelles menées : son action culturelle, seulement si elle a un paragraphe de description (sans texte, le
  // chapitre ne paraît pas, ni au sommaire), et ses dates scolaires passées
  const aDuTexte = A => !!A && (A.textes || []).some(t => t && String(t.texte || '').replace(/<[^>]*>/g, '').trim());
  function actionsMenees(s, chap, G) {
    const A = s.actionCulturelle;
    if (!aDuTexte(A)) return '';
    const ac = (...k) => edS(s, 'actionCulturelle', ...k), sco = G.flatMap(g => g.rows).filter(r => r.d.scolaire);
    return chapitre(chap, 'actions', L.actionsMenees, `<div class="wrap">${titreChap(esc(L.actionsMenees))}
        ${A.type ? `<p class="u-ac-type"${ac('type')}>${esc(A.type)}</p>` : ''}
        ${A.public || A.lieu || A.statut ? `<ul class="u-ac-puces">${A.public ? `<li><span class="k">${esc(L.public)}</span><span${ac('public')}>${esc(A.public)}</span></li>` : ''}${A.lieu && L.lieu[A.lieu] ? `<li>${esc(L.lieu[A.lieu])}</li>` : ''}${A.statut ? `<li${ac('statut')}>${esc(A.statut)}</li>` : ''}</ul>` : ''}
        <div class="u-texte">${A.textes.map((t, i) => bloc(t.texte, `shows.${s.slug}.actionCulturelle.textes.${i}.texte`)).join('')}</div>
        ${A.formule && A.formule.length ? `<div class="u-formule">${A.formule.map((l, i) => `<p${ac('formule', i)}>${esc(l)}</p>`).join('')}</div>` : ''}
        ${A.dispositifs && A.dispositifs.length ? `<div class="u-disp"><h3 class="u-eti">${esc(L.dispositifs)}</h3><ul>${A.dispositifs.map((x, i) => `<li${ac('dispositifs', i)}>${x}</li>`).join('')}</ul></div>` : ''}
        ${sco.length ? `<h3 class="rubrique">${esc(L.enEtablissement)}</h3><ul class="dates" data-agenda="${esc(s.slug)}">${sco.map(r => ligneAgenda(r, 'a:', true)).join('')}</ul>` : ''}
      </div>`);
  }
  function pageSeule(s, chap) {
    const G = datesPassees(s);
    return presentationSeule(s, chap) + distribution(s, chap, 'voir') + (G.length ? bilanSp(s, chap, G) : '') + actionsMenees(s, chap, G);
  }
  function ongletProgrammer(s, chap) {
    const P = s.programmer || {}, sp = CARTE.spectacle(s.slug), vus = new Set(sp.aVenir.map(x => x.l));
    const pr = (...k) => edS(s, 'programmer', ...k);
    const faits = [P.representations && `<li${pr('representations')}>${nombre(P.representations)}</li>`, s.statut && `<li${edS(s, 'statut')}>${esc(s.statut)}</li>`, s.duree && `<li${edS(s, 'duree')}>${esc(s.duree)}</li>`, P.format && `<li${pr('format')}>${esc(P.format)}</li>`,
      P.jauge && `<li${pr('jauge')}>${esc(P.jauge)}</li>`, P.equipe && `<li${pr('equipe')}>${esc(P.equipe)}</li>`, P.actualite && `<li${pr('actualite')}>${esc(P.actualite)}</li>`].filter(Boolean);
    const [a0] = s.affirmations || [];
    let h = `<div class="u-contact">${contactHTML(s)}</div>`;
    h += chapitre(chap, 'spectacle', L.leSpectacle, `<div class="wrap">${titreChap(esc(L.leSpectacle))}<div class="u-prog">
        <div>${a0 ? `<p class="u-affirm ecrit lit" style="--n:${mots(a0.texte).length}"${edS(s, 'affirmations', 0, 'texte')}>${ecrit(a0.texte)}</p>` : ''}
          <div class="u-texte">${(s.texte || []).map((p, k) => bloc(p, `shows.${s.slug}.texte.${k}`)).join('')}</div></div>
        <ul class="u-faits">${faits.join('')}<li class="u-faits-liens">${s.video ? lienVideo(s) : ''}${dossierBouton(s.slug, 'bu plein')}</li></ul>
      </div></div>`);
    h += videos(s, chap);   // la bande-annonce se lit ici aussi (règle 18) : un programmateur la regarde avant d'écrire
    h += distribution(s, chap, 'programmer', true);
    h += chapitre(chap, 'lieux', L.lieuxDiffusion, `<div class="wrap">${titreChap(esc(L.lieuxDiffusion))}<div class="u-tournee"><div>
        ${P.representations ? `<p class="u-rep"${pr('representations')}>${nombre(P.representations)}</p>` : ''}${P.lieux ? `<p class="u-lieux"${pr('lieux')}>${esc(P.lieux)}</p>` : ''}
        ${s.statut && s.tournee && s.tournee.texte ? `<p class="u-annonce"${edS(s, 'tournee', 'texte')}>${esc(s.tournee.texte)}</p>` : ''}
        ${diffusion(s).some(b => b.n) ? `<div class="u-diff"><p class="k">${esc(L.dates)}</p><div data-diffusion="${esc(s.slug)}"></div></div>` : ''}</div>
        <figure class="carte-sp">${carteTournee(s, sp.aVenir, sp.passe.filter(x => !vus.has(x.l)))}</figure></div></div>`);
    const fts = docsDe(s, 'pros').filter(x => x.type === 'fiche_technique');
    // Bérénice : le détail du dossier, puis le PDF « fiche technique et plan » en lien
    if (P.ficheTechnique && s.dossier && (D.dossiers || {})[s.dossier] && D.dossiers[s.dossier].accueil) h += conditions(s, chap, 'technique', L.ficheTechnique, fts.length ? `<ul class="u-docs u-docs--ft">${fts.map(x => `<li>${PDF}${lienDoc(x)}</li>`).join('')}</ul>` : '');
    else {   // la fiche technique : un document déposé, sinon sur demande (jamais de rubrique vide)
      const href = mailPrg(`${L.ficheTechnique} – ${s.titre}`);
      h += chapitre(chap, 'technique', L.ficheTechnique, `<div class="wrap">${titreChap(esc(L.ficheTechnique))}
        <ul class="u-docs">${fts.length ? fts.map(x => `<li>${PDF}${lienDoc(x)}</li>`).join('') : `<li>${PDF}${href ? `<a href="${esc(href)}">${esc(L.ficheTechniqueSurDemande)}</a>` : `<span>${esc(L.ficheTechniqueSurDemande)}</span>`}</li>`}</ul></div>`);
    }
    h += chapitre(chap, 'telecharger', L.aTelecharger, `<div class="wrap">${titreChap(esc(L.aTelecharger))}
      <ul class="u-docs"><li>${dossierBouton(s.slug, 'bu')}</li>${docsDe(s, 'pros').map(x => `<li>${PDF}${lienDoc(x)}</li>`).join('')}</ul></div>`);
    return h + appel(s);
  }
  function ongletEtablissement(s, chap) {
    const A = s.actionCulturelle || {}, sco = D.dates.filter(d => d.slug === s.slug && d.scolaire), B = s.dossier && (D.dossiers || {})[s.dossier];
    const ac = (...k) => edS(s, 'actionCulturelle', ...k), aType = !(A.aCompleter || !A.type);
    let h = chapitre(chap, 'action', L.actionCulturelle, `<div class="wrap">
        <p class="u-eti">${petit(mo(s))}<span>${esc(L.actionCulturelle)}</span></p>
        <h2 class="u-ac-type" tabindex="-1"${aType ? ac('type') : ''}>${esc(aType ? A.type : L.aCompleter)}</h2>
        ${A.public || A.lieu || A.statut ? `<ul class="u-ac-puces">${A.public ? `<li><span class="k">${esc(L.public)}</span><span${ac('public')}>${esc(A.public)}</span></li>` : ''}${A.lieu && L.lieu[A.lieu] ? `<li>${esc(L.lieu[A.lieu])}</li>` : ''}${A.statut ? `<li${ac('statut')}>${esc(A.statut)}</li>` : ''}</ul>` : ''}
        ${(A.textes || []).length ? `<div class="u-texte">${A.textes.map((t, i) => bloc(t.texte, `shows.${s.slug}.actionCulturelle.textes.${i}.texte`)).join('')}</div>` : ''}
        ${A.formule && A.formule.length ? `<div class="u-formule">${A.formule.map((l, i) => `<p${ac('formule', i)}>${esc(l)}</p>`).join('')}</div>` : ''}
