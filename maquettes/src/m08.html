<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil - crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=Ubuntu:wght@700&family=Space+Grotesk:wght@600&family=Cormorant+Garamond:wght@600&family=Bodoni+Moda:wght@700&family=Anton&family=Grenze+Gotisch:wght@600&family=IM+Fell+English&family=IM+Fell+French+Canon&display=swap">
<style>
/* 08 — Le sommaire : papier ivoire, encre, filets fins. La liste à gauche, l'aperçu de ce qu'on survole à droite.
   Les trois entrées sont la navigation première ; chaque spectacle prend son univers (couleurs, police de titre, motif). */
:root{
  --ivoire:#f5f1ea;--encre:#191414;
  --paper:#f5f1ea;--paper2:#ece6dc;--ink:#191414;--ink2:#5d5450;
  --acc:#191414;--acc-s:#191414;--aplat:#191414;--sur-aplat:#f5f1ea;--lueur:transparent;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --titre:var(--serif);--titre-w:400;--titre-k:1;
  --t1:clamp(2.75rem,5vw,4.5rem);--t2:clamp(1.875rem,2.9vw,2.75rem);--t3:clamp(1.3rem,1.75vw,1.7rem);--t4:1.25rem;--t5:1.0625rem;--t6:.875rem;
  --hh:72px;--gx:clamp(16px,3.9vw,56px);--fade:220ms;--onglets:58px;
  --mv-courbe:cubic-bezier(.22,.8,.24,1);
  /* les tentacules (tentacules.js) : silencieuses ici (règle 15 A) ; le sommaire a son propre mouvement, celui de l'édition */
  --tt-encre:#191414;--tt-accent:#191414;--tt-neutre:#191414;--tt-epaisseur:1.9;
  --ed-fond:#f5f1ea;--ed-encre:#191414;--ed-accent:#a3202a;--ed-sur-accent:#f5f1ea;--ed-police:"DM Sans",system-ui,sans-serif;--ed-rayon:2px;--ed-trait:rgba(25,20,20,.3);
}
:root,.u{--rule:color-mix(in srgb,var(--ink) 15%,transparent);--rule-s:color-mix(in srgb,var(--ink) 34%,transparent)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper);color-scheme:light}
html.sombre{color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t5)/1.6 var(--sans);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .4s ease,color .4s ease}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:400}
p,ul,ol,figure,blockquote,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:1px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--gx);top:-60px;z-index:60;background:var(--encre);color:var(--ivoire);padding:10px 16px;text-decoration:none}
.skip:focus{top:12px}
.u{background:var(--paper);color:var(--ink)}
.kicker{display:block;font:600 .75rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.k-ent{display:flex;align-items:center;gap:10px;color:var(--ink)}
.ext{margin-left:.3em;font-size:.85em;text-decoration:none;display:inline-block}
.fl{display:inline-block;margin-left:.45em;transition:transform .25s ease}
a:hover>.fl{transform:translateX(4px)}
.ent-m{flex:none;display:inline-block;width:10px;height:10px;background:var(--e)}
.sp-t{font-family:var(--tf,var(--serif));font-weight:var(--tw,400);color:var(--ct,inherit)}
.aplat{background:var(--aplat);color:var(--sur-aplat)}
.aplat a{color:inherit}

/* ——— En-tête : la marque, les trois entrées (navigation première), puis le menu second, plus petit et à part ——— */
.site-head{position:sticky;top:0;z-index:40;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--rule);transition:background-color .4s ease,color .4s ease}
.tete{height:var(--hh);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(14px,1.6vw,36px);padding:0 clamp(16px,2.4vw,40px)}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:34px;height:34px;flex:none}
.brand-mark svg{display:block;width:100%;height:100%}
.brand-name{font:400 1.625rem/1 var(--serif);padding-bottom:3px}
.entrees{min-width:0;overflow:hidden;align-self:stretch}
.entrees ul{display:flex;justify-content:center;height:100%;gap:clamp(12px,1.5vw,34px)}
.ent{position:relative;display:flex;align-items:center;gap:8px;height:100%;font:600 1rem/1.15 var(--sans);text-decoration:none;white-space:nowrap}
.ent::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent;transition:background-color .2s ease}
.ent:hover::after{background:color-mix(in srgb,var(--e) 45%,transparent)}
.ent[aria-current]{color:var(--e)}
.ent[aria-current]::after{background:var(--e)}
.ent-c{display:none}
.entrees.court .ent-l{display:none}
.entrees.court .ent-c{display:inline}
.menu2{padding-left:clamp(12px,1.5vw,26px);border-left:1px solid var(--rule-s)}
.menu2 ul{display:flex;gap:clamp(10px,1.1vw,20px)}
.menu2 a{display:block;padding:8px 0;font:600 .71875rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-decoration:none;white-space:nowrap}
.menu2 a:hover{color:var(--ink)}
.menu2 a[aria-current="page"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.7em}
.menu-btn{display:none;align-items:center;gap:10px;font-weight:600;padding:10px 0 10px 12px}
.menu-ico{position:relative;width:18px;height:10px}
.menu-ico::before,.menu-ico::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .2s}
.menu-ico::before{top:0}.menu-ico::after{bottom:0}
.menu-open .menu-ico::before{transform:translateY(4.25px) rotate(45deg)}
.menu-open .menu-ico::after{transform:translateY(-4.25px) rotate(-45deg)}

/* ——— Le sommaire (accueil, Spectacles) ——— */
.som{display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr);min-height:calc(100svh - var(--hh))}
.som+.som{border-top:1px solid var(--rule)}
.toc{display:flex;flex-direction:column;padding:34px var(--gx) 48px;min-width:0}
.toc-h1{margin-bottom:24px}
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;padding:15px 0 11px;margin-bottom:10px;border-bottom:1px solid var(--rule-s);background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 6px/100% 1px no-repeat}
.mast-g,.mast-d{font:600 .8125rem/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.mast-d{color:var(--ink2);text-decoration:none}
.mast-d:hover{color:var(--ink);text-decoration:underline}
.toc-link{display:block;padding:9px 0 10px;text-decoration:none}
.toc-row{display:flex;align-items:last baseline;gap:14px}
.toc-title{font-size:calc(var(--t2) * var(--tk,1));line-height:1.04;letter-spacing:-.005em;text-wrap:balance;transition:color .16s ease}
/* le filet souligne : il se tire sous le titre, de gauche à droite et ligne après ligne */
.tt{background:linear-gradient(var(--c,currentColor),var(--c,currentColor)) 0 100%/0 3px no-repeat;transition:background-size .2s var(--mv-courbe)}
.toc-list .toc-title{color:var(--ink)}
.toc-lead{flex:1 1 auto;min-width:24px;height:1px;background:var(--rule-s);transform:translateY(-.42rem) scaleX(1);transform-origin:left}
.toc-year{flex:none;font:500 var(--t6)/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2)}
.toc-dek{display:flex;justify-content:space-between;align-items:baseline;gap:6px 18px;margin-top:5px;font-size:var(--t6);line-height:1.45;color:var(--ink2)}
.toc-tag{flex:none;font:600 .6875rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ct)}
.toc-link.is-active .toc-title{color:var(--ct)}
.toc-link.is-active .tt,.toc-link:focus-visible .tt{background-size:100% 3px}
.toc-extra{display:none}
.som.attend .toc-lead{transform:translateY(-.42rem) scaleX(0)}
.som.revele .toc-lead{transition:transform .75s cubic-bezier(.2,.7,.2,1) calc(var(--k,0) * 55ms + 120ms)}
/* les trois entrées, au cœur de l'accueil */
.som-e .toc-list{margin-top:18px}
.som-e .toc-link{padding:20px 0 22px;border-bottom:1px solid var(--rule)}
.som-e .toc-row{align-items:center}
.som-e .ent-m{width:16px;height:16px;align-self:center}
.som-e .toc-title{font:400 clamp(2.5rem,4.1vw,3.6rem)/1.02 var(--serif);letter-spacing:-.016em}
.som-e .toc-lead{transform:none;min-width:20px}
.toc-fl{flex:none;font-size:1.6rem;line-height:1;transition:transform .3s ease}
.som-e .toc-link{--c:var(--e)}
.som-e .toc-link.is-active .toc-title{color:var(--e)}
.som-e .toc-link.is-active .toc-fl{transform:translateX(6px);color:var(--e)}
.som-e.attend .toc-link{opacity:0;transform:translateY(14px)}
.som-e.revele .toc-link{transition:opacity .6s ease calc(var(--k,0) * 120ms + 80ms),transform .7s cubic-bezier(.2,.7,.2,1) calc(var(--k,0) * 120ms + 80ms)}

/* L'aperçu : chaque calque a son fond (la teinte de l'entrée, ou l'univers du spectacle) */
.pv{min-width:0;background:var(--paper2);transition:background-color var(--fade) ease}
.pv-in{position:sticky;top:var(--hh);height:calc(100svh - var(--hh));min-height:560px;display:grid}
.pv-layer{grid-area:1/1;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0;padding:34px var(--gx) 30px;opacity:0;visibility:hidden;transition:opacity .12s ease,visibility 0s linear .12s,transform .2s var(--mv-courbe)}
.pv-layer.is-on{opacity:1;visibility:visible;z-index:1;transition:opacity var(--fade) ease,visibility 0s}
.pv-e{background:color-mix(in srgb,var(--e) 10%,var(--paper))}
.pv-u{background:radial-gradient(90% 70% at 85% 10%,var(--lueur),transparent 70%) var(--paper)}
.pv-media{position:relative;z-index:1;flex:1 1 0;min-height:180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:22px}
.pv-media.solo{grid-template-columns:minmax(0,1fr)}
.pv-fig,.pv-map{position:relative;min-height:0}
.pv-fig img{position:absolute;left:0;top:0;width:100%;height:calc(100% - 24px);object-fit:cover;background:var(--rule)}
.pv-cap{position:absolute;right:0;bottom:0;font-size:.8125rem;line-height:20px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pv-map{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule-s);margin-bottom:24px}
.pv-map .cm{position:absolute;inset:8px 0}
.pv-map .cm-vue,.pv-map .cm-svg{width:100%;height:100%}
.som.attend .pv-layer.is-on .pv-fig img{clip-path:inset(0 0 100% 0)}
.som.revele .pv-fig img{transition:clip-path 1s cubic-bezier(.6,0,.2,1) .1s}
.pv-k{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:4px 0;font:600 .75rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-s)}
.pv-k>span+span::before{content:"·";margin:0 .7em;color:var(--ink2)}
.pv-t{position:relative;z-index:1;font:var(--titre-w) calc(var(--t2) * var(--titre-k))/1.02 var(--titre);color:var(--acc);text-wrap:balance}
.pv-lead{position:relative;z-index:1;font:italic 400 var(--t3)/1.32 var(--serif);text-wrap:pretty;max-width:40ch}
.pv-lead em{font-style:normal}
.pv-foot{position:relative;z-index:1;padding-top:14px;border-top:1px solid var(--rule-s);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 28px}
.pv-date{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;min-width:0}
.pv-ligne{font-weight:500}
.pv-link{font-weight:600;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:.3em}
.pv-e .pv-link{text-decoration-color:var(--e)}
.pv-link:hover{text-decoration-color:currentColor}
.pv-dates{position:relative;z-index:1;border-top:1px solid var(--ink)}
.pv-dates li{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,10rem) minmax(0,1fr);gap:4px 18px;align-items:baseline;padding:8px 0 9px;border-bottom:1px solid var(--rule)}
.pv-dd{font-weight:600}
.pv-dl{color:var(--ink2);font-size:var(--t6)}
.pv-dt{font-size:1.15rem;line-height:1.25}
.pv-tout .cm{inset:0}
.pv-titres{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 0;font-size:1.3rem;line-height:1.35}
.pv-titres .sp-t{font-size:calc(1.3rem * var(--tk,1))}
.pv-sep{margin:0 .55em;color:var(--rule-s);font-family:var(--sans)}
.pv-types{align-self:center;border-top:1px solid var(--ink)}
.pv-types li{display:flex;flex-direction:column;padding:8px 0 9px;border-bottom:1px solid var(--rule)}
.pv-ty{font:400 1.25rem/1.2 var(--serif)}
.pv-tys{font-size:.9375rem}

/* ——— Les motifs : la signature discrète de chaque univers ——— */
.motif{position:absolute;pointer-events:none;color:var(--acc);opacity:.22;z-index:0}
.motif svg{display:block;width:100%;height:auto;overflow:visible}
.motif svg *{fill:none;stroke:currentColor;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.motif .m-plein{fill:currentColor;fill-opacity:.32}
.motif .m-tir{stroke-dasharray:2 6}
.motif .m-epais{stroke-width:2.6}
.motif .m-feutre{stroke-width:6;stroke-opacity:.85}
.motif text{fill:currentColor;stroke:none;font:600 13px var(--sans);letter-spacing:.1em}
.motif .m-trot{transform-box:view-box;transform-origin:120px 120px;animation:trotteuse 60s steps(60) infinite}
@keyframes trotteuse{to{transform:rotate(360deg)}}
.motif-fil{opacity:.5}
.motif-chronologie{opacity:.5}
.pv-motif{right:-60px;top:-40px;width:340px;opacity:.16}
.pv-motif.motif-fil{left:0;right:0;top:auto;bottom:34%;width:auto;opacity:.4}
.pv-motif.motif-fil svg{height:110px}
.pv-motif.motif-chronologie{left:var(--gx);right:var(--gx);top:14px;width:auto;opacity:.45}

/* ——— La carte : des filets d'encre depuis Rouen ; les communes composées en marge, comme dans un magazine ——— */
.cm{position:relative;margin:0;--arm:var(--ink)}
.cm-vue{position:relative;overflow:hidden}
.cm-svg{display:block;width:100%;height:auto}
.cm-terre{fill:color-mix(in srgb,var(--ink) 5%,transparent);stroke:color-mix(in srgb,var(--ink) 50%,transparent);stroke-width:.8px}
.cm-voisin{fill:none;stroke:color-mix(in srgb,var(--ink) 24%,transparent);stroke-width:.8px}
.cm-encart{fill:none;stroke:color-mix(in srgb,var(--ink) 45%,transparent);stroke-width:.8px;vector-effect:non-scaling-stroke}
.cm-passe{fill:none;stroke:var(--ink);stroke-opacity:.28;stroke-width:var(--wp);stroke-dasharray:calc(var(--wp) * 2) calc(var(--wp) * 3)}
.cm-ppt{fill:var(--ink);fill-opacity:.34}
.cm-teinte{--arm:var(--c)}
.cm-passees{--arm:var(--ink)}
.cm-bras{fill:none;stroke:var(--arm);stroke-width:var(--wb);stroke-linecap:round;stroke-dasharray:1 2;transition:stroke-width .2s ease,stroke-opacity .2s ease}
.cm-bout{fill:none;stroke:var(--arm);stroke-width:calc(var(--wb) * .8);stroke-linecap:round;stroke-dasharray:1 2;transition:stroke-opacity .2s ease}
.cm-pt{fill:var(--arm);r:var(--rp);transition:r .2s ease}
.cm-halo{fill:transparent}
.cm-lieu.carte-lieu,.cm-etiq.carte-lieu,.cm-rouen.carte-lieu{cursor:pointer}
.cm-fil{fill:none;stroke:var(--ink);stroke-opacity:.36;stroke-width:.7px;vector-effect:non-scaling-stroke;transition:stroke-opacity .2s ease}
.cm-nom{font-family:var(--serif);font-size:var(--fs);fill:var(--ink);transition:fill .2s ease}
.cm-dep{font-family:var(--sans);font-weight:500;font-size:calc(var(--fs) * .6);fill:var(--ink2);letter-spacing:.06em}
.cm-etiq{transition:opacity .2s ease}
.cm-etiq:focus{outline:none}
.cm-etiq:focus-visible .cm-nom{text-decoration:underline}
.cm-r{fill:var(--paper);stroke:var(--ink);stroke-width:calc(var(--wb) * 1.3)}
.cm-r-nom{font-family:var(--sans);font-weight:600;font-size:calc(var(--fs) * .7);letter-spacing:.18em;text-transform:uppercase;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:calc(var(--fs) * .22);stroke-linejoin:round}
.cm-rouen:focus{outline:none}
.cm-rouen:focus-visible .cm-r-nom,.cm-rouen.is-on .cm-r-nom{text-decoration:underline}
.cm.a-actif .cm-bras:not(.is-on),.cm.a-actif .cm-bout:not(.is-on){stroke-opacity:.2}
.cm.a-actif .cm-etiq:not(.is-on){opacity:.4}
.cm .cm-bras.is-on{stroke:var(--ct);stroke-width:calc(var(--wb) * 2.2)}
.cm .cm-bout.is-on{stroke:var(--ct);stroke-width:calc(var(--wb) * 1.5)}
.cm .cm-lieu.is-on .cm-pt{fill:var(--ct);r:calc(var(--rp) * 1.7)}
.cm .cm-etiq.is-on .cm-nom{fill:var(--ct)}
.cm .cm-etiq.is-on .cm-fil{stroke:var(--ct);stroke-opacity:1}
.cm .cm-rouen.is-on .cm-r{fill:var(--ct)}
.cm-flot{opacity:0;transition:opacity .15s ease;pointer-events:none}
.cm-flot.is-on{opacity:1}
.cm-flot .cm-nom{fill:var(--ink);paint-order:stroke;stroke:var(--halo,var(--paper));stroke-width:calc(var(--fs) * .28);stroke-linejoin:round}
.cm-flot .cm-dep{paint-order:stroke;stroke:var(--halo,var(--paper));stroke-width:calc(var(--fs) * .2);stroke-linejoin:round}
.cm-flot .cm-fil{stroke:var(--ct);stroke-opacity:1}
.cm.attend .cm-bras,.cm.attend .cm-bout{stroke-dashoffset:1}
.cm.attend .cm-lieu,.cm.attend .cm-etiq,.cm.attend .cm-anciens{opacity:0}
.cm.anime .cm-bras{animation:cm-trace .7s cubic-bezier(.45,0,.2,1) var(--d,0ms) both}
.cm.anime .cm-bout{animation:cm-trace .45s ease-out calc(var(--d,0ms) + .55s) both}
.cm.anime .cm-lieu,.cm.anime .cm-etiq{animation:cm-fondu .45s ease calc(var(--d,0ms) + .4s) both}
.cm.anime .cm-anciens{animation:cm-fondu .8s ease .15s both}
.som.revele .pv-layer.is-on .cm-bras,.som:not(.attend) .pv-layer.is-on.vu .cm-bras{animation:cm-trace .65s cubic-bezier(.45,0,.2,1) calc(var(--d,0ms) * .6 + 80ms) both}
.som.revele .pv-layer.is-on .cm-bout,.som:not(.attend) .pv-layer.is-on.vu .cm-bout{animation:cm-trace .4s ease-out calc(var(--d,0ms) * .6 + .6s) both}
@keyframes cm-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cm-fondu{from{opacity:0}to{opacity:1}}
.cm-cap{position:absolute;left:0;bottom:0;width:min(27%,330px);padding-top:12px;border-top:1px solid var(--ink);font-size:.9375rem;line-height:1.45}
.cm-cap.dessous{position:static;width:auto;max-width:42rem;margin-top:22px}
.cm-cap:empty{display:none}
.cap-nom{font:400 var(--t3)/1.15 var(--serif);margin-bottom:6px}
.cap-dep{font:500 .8125rem var(--sans);letter-spacing:.06em;color:var(--ink2)}
.cap-l li{display:flex;flex-direction:column;padding:7px 0 8px;border-bottom:1px solid var(--rule)}
.cap-d{font-weight:600}
.cap-l a,.cap-l .cap-s{font-size:1.0625rem;line-height:1.3;text-decoration:none;align-self:flex-start}
.cap-l a:hover{text-decoration:underline}
.cm-index{display:none}

/* ——— Bandes et pages ——— */
.cb{padding:76px var(--gx) 84px;border-top:1px solid var(--rule)}
.cb-head,.bande-t{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px;padding-bottom:18px;margin-bottom:26px;border-bottom:1px solid var(--ink)}
.cb-head .kicker,.bande-t .kicker{margin-bottom:10px}
.band-title{font:400 var(--t2)/1.05 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.lien-fort{display:inline-flex;align-items:baseline;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em;padding:4px 0}
.merci{padding:40px var(--gx) 60px;border-top:1px solid var(--rule)}
.merci p{columns:2 26rem;column-gap:56px;font-size:.875rem;line-height:1.7;color:var(--ink2)}
.page{display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr)}
.page+.page,.page+.et-g,.et-g+.page,.et-g+.et-g,.page+.ag,.ag+.et-u,.et-u+.saisons-b{border-top:1px solid var(--rule)}
.pg-head{padding:56px var(--gx) 40px}
.pg-head-in{position:sticky;top:calc(var(--hh) + 40px)}
.pg-head .kicker{margin-bottom:14px}
.pg-body{padding:62px var(--gx) 96px;min-width:0;max-width:calc(64ch + 2 * var(--gx))}
.page-title{font:400 var(--t1)/1 var(--serif);letter-spacing:-.018em;text-wrap:balance}
.pt-2{font-size:var(--t2);line-height:1.05}
.pg-fig{margin-top:40px}
.pg-fig img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pg-fig figcaption{margin-top:8px;text-align:right;font-size:var(--t6);color:var(--ink2)}
.prose p+p,.prose p+ul,.prose ul+p,.prose ul+h2,.prose .pb+.pb,.prose p+.pb,.prose .pb+p{margin-top:1em}
.prose h2{margin:2.1em 0 .7em;font:400 var(--t3)/1.2 var(--serif)}
.prose h2:first-child,.prose .pb:first-child h2{margin-top:0}
.prose ul{margin-top:1em}
.prose li{position:relative;padding-left:24px}
.prose li+li{margin-top:.7em}
.prose li::before{content:"";position:absolute;left:0;top:.82em;width:12px;height:1px;background:var(--ink)}
.prose a{text-decoration-color:var(--rule-s)}
.prose a:hover{text-decoration-color:currentColor}
.prose-lede>p:first-child{font:400 var(--t3)/1.42 var(--serif)}
.prose-legal{font-size:.9375rem;overflow-wrap:anywhere}
.chrono a,.chrono .ch-r{display:flex;align-items:last baseline;gap:14px;padding:11px 0 12px;text-decoration:none;border-bottom:1px solid var(--rule)}
.chrono li:first-child>*{border-top:1px solid var(--ink)}
.ch-t{font-size:calc(var(--t3) * var(--tk,1));line-height:1.2;text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:.15em;transition:color .2s,text-decoration-color .2s}
.chrono .ch-t{color:var(--ink)}
.chrono a:hover .ch-t{color:var(--ct);text-decoration-color:var(--c)}
.ch-lead,.ss-lead{flex:1 1 auto;min-width:20px;height:1px;background:var(--rule-s);transform:translateY(-.35rem)}
.ch-a{flex:none;font:500 var(--t6)/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2)}
.dir-chapeau{margin-top:18px;font:italic 400 var(--t3)/1.35 var(--serif)}
.colophon{margin-top:44px;padding-top:16px;border-top:1px solid var(--ink);font-size:.9375rem;line-height:1.65;color:var(--ink2)}
.pg-t{padding:52px var(--gx) 34px;border-bottom:1px solid var(--rule)}
.pg-t .page-title{margin-top:14px;max-width:18ch}
.cta{display:block}
.cta-a{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:46px var(--gx);text-decoration:none}
.cta-t{font:400 var(--t2)/1.05 var(--serif);letter-spacing:-.01em}
.cta-fl{font-size:2rem;line-height:1;transition:transform .3s ease}
.cta-a:hover .cta-t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.15em}
.cta-a:hover .cta-fl{transform:translateX(8px)}
.part{padding:40px var(--gx);border-top:1px solid var(--rule)}
.part p{max-width:60rem;font-size:.9375rem;line-height:1.65;color:var(--ink2)}

/* ——— Formulaires d'origine ——— */
.form{display:grid;gap:24px;max-width:40rem}
.champs-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.champ label{display:block;font-weight:500;margin-bottom:4px}
.champ input,.champ textarea{display:block;width:100%;padding:9px 0 8px;border:0;border-bottom:1px solid var(--ink);background:transparent;border-radius:0}
.champ textarea{min-height:9rem;padding:10px 12px;border:1px solid var(--ink);resize:vertical}
.champ input:focus-visible,.champ textarea:focus-visible,.calcul input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.coche{display:flex;gap:12px;align-items:flex-start}
.coche input{flex:none;width:18px;height:18px;margin:4px 0 0;accent-color:var(--ink)}
.coche a{text-decoration-color:var(--rule-s)}
.calcul{display:flex;align-items:center;gap:14px;font-weight:500}
.calcul input{width:3.4em;padding:7px 8px;border:1px solid var(--ink);background:transparent;text-align:center;border-radius:0}
.btn{justify-self:start;padding:13px 28px;background:var(--encre);color:var(--ivoire);font-weight:600;letter-spacing:.02em}
.btn:hover{background:#3a3131}
.coord{margin-top:40px;font-style:normal;padding-top:16px;border-top:1px solid var(--ink);line-height:1.55}
.coord .co-nom{font:400 var(--t4)/1.3 var(--serif);margin-bottom:6px}
.coord .co-l{margin-top:14px;color:var(--ink2);font-size:var(--t6)}

/* ——— Agenda : la carte à gauche, la liste à droite ——— */
.ag{display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr)}
.ag-side{padding:44px var(--gx) 48px;border-right:1px solid var(--rule)}
.ag-side-in{position:sticky;top:calc(var(--hh) + 26px)}
.ag-side .kicker{margin-bottom:12px}
.ag-side .kicker a{text-decoration:none}
.ag-side .kicker a:hover{text-decoration:underline}
.ag-side .cm{margin-top:26px;padding-top:10px;border-top:1px solid var(--ink)}
.pastille-t{display:inline-block;margin-top:18px;padding:4px 12px;border:1px solid var(--e,var(--ink));font:600 .6875rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.filtre{margin-top:14px;display:inline-flex;align-items:center;gap:12px;padding:8px 16px;border:1px solid var(--ink);border-radius:999px;font-weight:600}
.filtre:hover{background:var(--ink);color:var(--paper)}
.filtre-x{font-size:1.15rem;line-height:1}
.ag-main{padding:44px var(--gx) 96px;min-width:0}
.ag-g+.ag-g{margin-top:52px}
.ag-mois{padding-bottom:10px;border-bottom:1px solid var(--ink);font:600 .8125rem/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.ag-it{display:grid;grid-template-columns:minmax(118px,10rem) minmax(0,1fr);gap:4px 26px;padding:17px 0 18px;border-bottom:1px solid var(--rule);transition:background-color .2s ease}
.ag-it.is-on{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--acc)) 18%,transparent),transparent 75%)}
.ag-j{display:block;font:400 var(--t3)/1.1 var(--serif);text-wrap:balance}
.ag-m{display:block;margin-top:3px;font-size:var(--t6);color:var(--ink2)}
.ag-d.sans-j .ag-m{margin-top:0;font:400 var(--t4)/1.2 var(--serif);color:var(--ink)}
.ag-b{min-width:0;overflow-wrap:anywhere}
.ag-lieu{font-weight:600}
.ag-sp a,.ag-sp span{font-size:calc(var(--t4) * var(--tk,1));line-height:1.3;text-decoration:none}
.ag-sp a:hover{text-decoration:underline}
.ag-det{margin-top:4px;color:var(--ink2);font-size:.9375rem;line-height:1.5}
.ag-det li+li{margin-top:2px}
.ag-det a{color:var(--ink);text-decoration-color:var(--rule-s)}
.a-etat .ag-lieu,.a-etat .ag-d{text-decoration:line-through}
/* l'agenda passé : le sommaire des saisons, fermées au départ ; un filet de Rouen vers chaque commune sur leur petite carte */
.ag-outils{display:grid;gap:14px;margin-bottom:34px}
.recherche{position:relative;display:block;max-width:26rem}
.recherche .ic{position:absolute;left:2px;top:50%;width:1.1rem;height:1.1rem;transform:translateY(-50%);color:var(--ink2)}
.recherche input{width:100%;padding:10px 6px 10px 30px;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;font:400 var(--t5)/1.4 var(--sans);color:var(--ink)}
.recherche input::placeholder{color:var(--ink2);opacity:1}
.recherche input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.cps{display:flex;flex-wrap:wrap;gap:8px}
.cp{padding:5px 14px;border:1px solid var(--rule-s);border-radius:999px;background:transparent;font:500 .875rem/1.35 var(--sans);color:var(--ink);cursor:pointer;text-align:left}
.cp:hover{border-color:var(--ink)}
.cp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cm .hors{opacity:.13}
.ag-passe{margin-top:76px}
.sp-h{font:400 var(--t2)/1.05 var(--serif);margin-bottom:22px}
.ag-index{position:sticky;top:var(--hh);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--paper);border-bottom:1px solid var(--ink)}
.ag-index ul{flex:1 1 auto;min-width:0;display:flex;gap:6px;padding:3px 2px;overflow-x:auto;scrollbar-width:none}
.ag-index li{flex:none}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule-s);background:transparent;color:var(--ink);font:500 .9375rem/1.3 var(--sans);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;cursor:pointer}
.idx{padding:5px 14px;border-radius:999px}
.idx small{font-size:.8125rem;color:var(--ink2)}
.idx:hover,.idx-tout:hover{border-color:var(--ink)}
.idx[aria-expanded="true"]{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.idx-actif{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.idx .ic{width:.7rem;height:.7rem}
.idx-tout{flex:none;justify-content:center;width:2.5rem;height:2.5rem;padding:0;border-radius:50%}
.idx-tout .ic{width:1.2rem;height:1.2rem}
.saisons-ag{padding-top:6px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 6px/100% 1px no-repeat;margin-top:10px}
.sai{border-bottom:1px solid var(--rule);scroll-margin-top:calc(var(--hh) + 70px)}
.sai>summary{display:flex;align-items:center;gap:clamp(12px,2vw,24px);padding:16px 4px;list-style:none;cursor:pointer;transition:background-color .2s}
.sai>summary::-webkit-details-marker{display:none}
.sai>summary:hover,.sai[open]>summary{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.sai-mini{flex:none;width:clamp(64px,7vw,96px);height:auto}
.mm-terre{fill:color-mix(in srgb,var(--ink) 9%,transparent);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mm-fil{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.mm-r{fill:var(--ink)}
.sai-c{flex:0 1 auto;min-width:0}
.sai-t{font:400 var(--t3)/1.1 var(--serif);letter-spacing:-.005em}
.sai-sp{display:block;margin-top:4px;font-size:var(--t6);line-height:1.45;color:var(--ink2)}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai>summary .ss-lead{flex:1 1 20px;min-width:16px;background:none;border-bottom:2px dotted var(--rule-s);height:0;align-self:flex-end;margin-bottom:.9rem;transform:none}
.sai-n{flex:none;display:inline-flex;align-items:center;gap:10px;font:400 var(--t3)/1 var(--serif);font-style:italic;font-variant-numeric:lining-nums tabular-nums}
.sai-n .chev{width:1.3rem;height:1.3rem;transition:transform .25s}
.sai[open] .sai-n .chev{transform:rotate(180deg)}
.sai-corps{padding:14px 4px 44px}
.sai-corps:empty{display:none}
.sai-corps:not(:empty){display:flex;flex-direction:column;gap:24px}
.sai-carte{order:-1;max-width:440px;width:100%}
.sai-liste .ag-g+.ag-g{margin-top:40px}
.ag-h{margin-top:0}
.sai-page{margin-top:24px}
.saisons-b{padding:56px var(--gx) 72px;display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr)}
.saisons-b h2{font:400 var(--t2)/1.05 var(--serif);padding-right:var(--gx)}
.saisons{padding-top:12px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 6px/100% 1px no-repeat}
.saisons a{display:flex;align-items:last baseline;gap:14px;padding:8px 0;text-decoration:none;font:400 var(--t4)/1.3 var(--serif)}
.saisons a:hover .ss-t{text-decoration:underline}
.ag-main .saisons{margin-top:76px}
.sa-g+.sa-g{margin-top:56px}
.sa-t{font-size:calc(var(--t2) * var(--tk,1));line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
.sa-t a{text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:3px;text-underline-offset:.13em}
.sa-t a:hover{text-decoration-color:var(--c)}
.sa-sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-top:8px;color:var(--ink2)}
.sa-crea{font:600 .75rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ct,var(--ink2))}
.sa-list{margin-top:16px;border-top:1px solid var(--ink)}
.sa-it{padding:11px 0 12px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere;transition:background-color .2s ease}
.sa-it.is-on{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--ink)) 18%,transparent),transparent 75%)}
.sa-d{font-weight:600}
.sa-l a{text-decoration-color:var(--rule-s)}
.sa-it.a-etat .sa-l{color:var(--ink2);text-decoration:line-through}
.sa-etat,.sa-scol{font:600 .6875rem/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#a3202a}
.sa-scol{color:var(--ink2)}

/* ——— Voir : les spectacles en tournée, chacun dans son univers ——— */
.et-u{padding:64px var(--gx) 72px}
.affiches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.affiche{position:relative;overflow:hidden}
.af-a{position:relative;display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);min-height:100%;text-decoration:none}
.af-ph img{width:100%;height:100%;min-height:240px;object-fit:cover}
.af-c{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:26px 26px 24px}
.af-k{font:600 .75rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-s)}
.af-t{font:var(--titre-w) calc(var(--t2) * .9 * var(--titre-k))/1.02 var(--titre);color:var(--acc)}
.af-ac{font:italic 400 1.0625rem/1.4 var(--serif)}
.af-d{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule-s);font-weight:600;font-size:.9375rem}
.af-go{font-weight:600;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:.3em}
.af-motif{right:-50px;bottom:-50px;width:230px;opacity:.14}
.af-motif.motif-fil{left:0;right:0;bottom:6px;width:auto;opacity:.32}
.af-motif.motif-chronologie{left:42%;right:12px;bottom:4px;width:auto;opacity:.32}

/* ——— Programmer : le catalogue, une fiche par spectacle dans son univers ——— */
.cat-som{display:flex;flex-wrap:wrap;align-items:baseline;margin-top:34px;padding-top:14px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 6px/100% 1px no-repeat}
.cat-som li{display:flex;align-items:baseline}
.cat-som li:not(:last-child)::after{content:"/";margin:0 14px;color:var(--rule-s);font-family:var(--sans)}
.cat-l{padding:4px 0;font-size:calc(1.4rem * var(--tk,1));line-height:1.3;text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:.2em}
.cat-l:hover{text-decoration-color:currentColor}
.cf{position:relative;display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr);overflow:clip;border-bottom:1px solid var(--rule)}
.cf-a{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:46px var(--gx) 44px}
.cf-k{display:flex;flex-wrap:wrap;gap:4px 14px;font:600 .75rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-s)}
.cf-statut{padding:0 10px;border:1px solid var(--acc-s)}
.cf-t{font:var(--titre-w) calc(var(--t2) * 1.08 * var(--titre-k))/1.02 var(--titre);color:var(--acc);text-wrap:balance}
.cf-t a{text-decoration:none}
.cf-t a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.12em}
.cf-sous{color:var(--ink2)}
.cf-ph{margin-top:auto;padding-top:16px}
.cf-ph img{width:100%;aspect-ratio:16/9;object-fit:cover}
.cf-b{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;padding:46px var(--gx) 44px;border-left:1px solid var(--rule)}
.cf-rep{font:400 var(--t3)/1.25 var(--serif)}
.nb{font-weight:inherit}
.cf-format .fi-l,.pr-format .fi-l{margin-right:8px}
.cf-faits,.pr-faits{border-top:1px solid var(--rule-s)}
.cf-faits li,.pr-faits li{padding:8px 0 9px;border-bottom:1px solid var(--rule)}
.cf-dist .kicker{margin-bottom:6px;color:var(--acc-s)}
.cf-fiche li{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:2px 16px;padding:5px 0;font-size:.9375rem;line-height:1.45}
.cf-fiche li.solo{grid-template-columns:minmax(0,1fr)}
.cf-avec{margin-top:8px;font-size:.9375rem}
.cf-liens{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center}
.cf-ba{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--ink);font-weight:600;text-decoration:none}
.cf-ba:hover{background:var(--ink);color:var(--paper)}
.cf-jeu{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.cf-go{display:inline-flex;align-items:baseline;font-weight:600;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:.3em}
details summary{cursor:pointer}
.cf-lieux{border-top:1px solid var(--rule-s);padding-top:10px}
.cf-lieux summary,.pli summary{font:600 .75rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.cf-lieux p{margin-top:8px;font-size:.9375rem;line-height:1.6;color:var(--ink2)}
.cf-motif{right:-70px;top:-70px;width:320px;opacity:.12}
.cf-motif.motif-fil{left:0;right:0;top:auto;bottom:14px;width:auto;opacity:.3}
.cf-motif.motif-chronologie{left:calc(45% + var(--gx));right:var(--gx);top:auto;bottom:14px;width:auto;opacity:.4}

/* ——— Établissement : les actions culturelles, le type bien lisible ——— */
.et-g{padding:56px var(--gx) 64px}
.acs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.acf{position:relative;overflow:clip;display:flex;flex-direction:column}
.acf-ph img{width:100%;aspect-ratio:21/9;object-fit:cover}
.acf-c{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;padding:26px 28px 28px;flex:1}
.acf-type{font:400 var(--t2)/1.04 var(--serif);text-wrap:balance}
.acf-t{font:var(--titre-w) calc(1.5rem * var(--titre-k))/1.15 var(--titre);color:var(--acc)}
.acf-t a{text-decoration:none}
.acf-t a:hover{text-decoration:underline}
.acf-x{font-size:.9375rem;line-height:1.6}
.acf-liens{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:10px 26px}
.acf-motif{right:-60px;bottom:-60px;width:240px;opacity:.12}
.acf-motif.motif-fil{left:0;right:0;bottom:8px;width:auto;opacity:.3}
.acf-motif.motif-chronologie{left:28px;right:28px;bottom:6px;width:auto;opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:5px 12px;border:1px solid var(--rule-s);font-size:.875rem;line-height:1.35}
.chip-l{font:600 .6875rem/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-s)}
.chip-statut{border-color:var(--acc-s);color:var(--acc-s);font-weight:600}
.formule{padding:16px 20px;font-weight:600;line-height:1.5}
.dispo .kicker{margin-bottom:6px}

/* ——— La page d'un spectacle : l'en-tête d'univers, la barre des entrées, le petit sommaire et les chapitres ——— */
.sh-tete{position:relative;display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr);min-height:min(calc(100svh - var(--hh) - var(--onglets)),860px);overflow:clip;background:radial-gradient(95% 85% at 12% 28%,var(--lueur),transparent 64%) var(--paper)}
.sh-g{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:52px var(--gx) 60px;min-width:0}
.sh-k{display:flex;flex-wrap:wrap;gap:4px 0;font:600 .75rem/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc-s)}
.sh-k>span+span::before{content:"·";margin:0 .7em;color:var(--ink2)}
.sh-titre{margin-top:22px;font:var(--titre-w) calc(var(--t1) * 1.1 * var(--titre-k))/.98 var(--titre);color:var(--acc);letter-spacing:-.01em;overflow-wrap:break-word}
.sh-ligne{display:block}
.sh-sous{margin-top:18px;font-size:var(--t4);line-height:1.4;color:var(--ink2)}
.sh-cadre{margin-top:10px;font-size:var(--t6);letter-spacing:.04em;color:var(--ink2)}
.sh-statut{align-self:flex-start;margin-top:16px;padding:4px 12px;border:1px solid var(--acc-s);color:var(--acc-s);font:600 .6875rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.sh-accroche{margin-top:30px;max-width:32ch;font:italic 400 var(--t3)/1.38 var(--serif);text-wrap:pretty}
.sh-photo{position:relative;z-index:1;min-height:360px;margin:0}
.sh-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh-photo .sh-flou{display:none}
.sh-photo.large{background:var(--encre)}
.sh-photo.large .sh-img{object-fit:contain}
.sh-photo.large .sh-flou{display:block;filter:blur(24px) brightness(.5) saturate(1.15);transform:scale(1.15)}
.sh-photo{overflow:hidden}
.sh-photo figcaption{position:absolute;right:12px;bottom:10px;padding:3px 9px;background:color-mix(in srgb,var(--paper) 84%,transparent);color:var(--ink);font-size:.75rem}
/* le titre se compose lettre à lettre, comme une ligne qu'on monte au composteur ; l'accroche se pose mot à mot */
.anim .l{animation:lettre .3s var(--mv-courbe) both;animation-delay:calc(var(--i) * 16ms + 40ms)}
.anim .w{animation:mot .36s ease both;animation-delay:calc(var(--i) * 16ms + 200ms)}
@keyframes lettre{from{opacity:0}to{opacity:1}}
@keyframes mot{from{opacity:0}to{opacity:1}}
.sh-motif{right:-4%;top:50%;width:min(470px,52%);transform:translateY(-50%);opacity:.17}
.sh-motif.motif-annotations{right:16px;top:30px;width:180px;transform:rotate(-4deg);opacity:.42}
.sh-motif.motif-paperboard{right:26px;top:auto;bottom:30px;width:190px;transform:none;opacity:.3}
.sh-motif.motif-nez{right:10px;top:auto;bottom:0;width:210px;transform:none;opacity:.3}
.sh-motif.motif-fil{left:0;right:0;top:auto;bottom:6px;width:auto;transform:none;opacity:.55}
.sh-motif.motif-fil svg{height:120px}
.sh-motif.motif-chronologie{left:var(--gx);right:var(--gx);top:auto;bottom:16px;width:auto;transform:none;opacity:.55}
.sh-onglets{position:sticky;top:var(--hh);z-index:20;background:var(--paper);border-top:1px solid var(--rule-s);border-bottom:1px solid var(--rule-s)}
.sh-onglets ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.sh-ong{position:relative;display:flex;align-items:center;gap:12px;height:var(--onglets);padding:0 var(--gx);font:600 1rem/1.2 var(--sans);text-decoration:none}
.sh-onglets li+li .sh-ong{border-left:1px solid var(--rule)}
.sh-ong::before{content:"";position:absolute;left:0;right:0;top:-1px;height:4px;background:transparent}
.sh-ong:hover::before{background:color-mix(in srgb,var(--e) 45%,transparent)}
.sh-ong[aria-current="page"]{color:var(--e);background:color-mix(in srgb,var(--e) 8%,var(--paper))}
.sh-ong[aria-current="page"]::before{background:var(--e)}
.sh-ong .ent-c{display:none}
.sh-corps{display:grid;grid-template-columns:minmax(0,36fr) minmax(0,64fr)}
.sh-som{padding:52px var(--gx) 64px;border-right:1px solid var(--rule)}
.som-ch{position:sticky;top:calc(var(--hh) + var(--onglets) + 30px)}
.som-k{display:flex;align-items:center;gap:10px;font:600 .75rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.som-ch ol{margin-top:14px;padding-top:10px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 6px/100% 1px no-repeat}
.ch-l{display:flex;align-items:last baseline;gap:12px;width:100%;padding:9px 0 10px;border-bottom:1px solid var(--rule);font:400 1.1875rem/1.25 var(--serif);text-decoration:none;transition:color .2s ease}
.ch-l .ch-lead{transition:background-color .2s ease}
.ch-l:hover .ch-lt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.ch-l.is-on{color:var(--acc)}
.ch-l.is-on .ch-lead{background:var(--acc);height:2px}
.ch-sous{padding-left:18px;font-size:1.0625rem}
.ch-ecrire{font-family:var(--sans);font-weight:600;font-size:1rem}
.sh-chs{min-width:0;padding:0 var(--gx) 24px;--c:var(--acc);--ct:var(--acc-s)}
.ch{max-width:70ch;padding:52px 0 60px;scroll-margin-top:calc(var(--hh) + var(--onglets) + 16px)}
.ch+.ch{border-top:1px solid var(--rule)}

.ch-h3{margin:0 0 16px;font:400 var(--t3)/1.2 var(--serif)}
.aff{display:grid;gap:22px;margin-bottom:36px}
.aff-t{padding-left:22px;border-left:4px solid var(--acc);font:400 var(--t3)/1.34 var(--serif);text-wrap:pretty}
.sh-texte>:first-child{font:400 1.3rem/1.5 var(--serif)}
.vers{display:grid;gap:30px;margin-top:44px}
.cit{padding-top:20px;border-top:3px solid var(--acc)}
.cit .v{display:block;font:italic 400 var(--t3)/1.42 var(--serif);text-wrap:pretty}
.cit-prose .v::before{content:"« "}
.cit-prose .v::after{content:" »"}
.cit cite{display:block;margin-top:12px;font:normal 600 .75rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-s)}
.galerie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 22px;align-items:start}
.galerie .gal-f:first-child{grid-column:1/-1}
.gal-f{margin:0}
.gal-f img{width:100%;aspect-ratio:3/2;object-fit:cover}
.carton{position:relative;margin:-24px 18px 0;padding:11px 16px 12px;background:var(--paper2);color:var(--ink);border:1px solid var(--rule-s);font:italic 400 1.0625rem/1.4 var(--serif)}
.carton .credit-in{display:block;margin-top:6px;font:normal 500 .8125rem/1.3 var(--sans);color:var(--ink2)}
.credit{margin-top:18px;font-size:var(--t6);color:var(--ink2)}
.ba{position:relative;display:grid;place-items:center;min-height:320px;overflow:hidden;background:#0d0b0b;color:#fff;text-decoration:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;transition:opacity .35s ease,transform .8s ease}
.ba:hover img{opacity:.38;transform:scale(1.03)}
.ba-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px;text-align:center}
.ba-jeu{display:grid;place-items:center;width:78px;height:78px;border:2px solid currentColor;border-radius:50%;box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 35%,transparent)}
.ba-jeu svg{width:30px;height:30px;margin-left:5px;fill:currentColor}
.ba-t{font:400 var(--t3)/1.25 var(--serif);max-width:28ch}
.tour-list{border-top:1px solid var(--ink)}
.tour-list:empty{border:0}
.tour-list .ag-it{grid-template-columns:minmax(110px,9rem) minmax(0,1fr)}
.ch .cm{margin-top:34px;--halo:var(--paper)}
.tour-texte{font:400 var(--t3)/1.35 var(--serif);max-width:26ch}
.fiche{border-top:1px solid var(--rule-s)}
.fiche li{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr);gap:2px 18px;padding:9px 0 10px;border-bottom:1px solid var(--rule);line-height:1.45}
.fiche li.solo{grid-template-columns:minmax(0,1fr)}

/* la distribution en portraits (D.personnes, show.equipe) : une planche sous un filet, la photo nue, ou une plaque à l'initiale ; ceux qui alternent, séparés d'un filet vertical */
.cast{--g:clamp(14px,2vw,28px);--pw:132px;--pmax:212px;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--pw),calc((100% - var(--g)) / 2)),1fr));gap:34px var(--g);max-width:calc(var(--n,4) * var(--pmax) + (var(--n,4) - 1) * var(--g));margin:0 0 36px;padding:16px 0 0;border-top:1px solid var(--rule-s)}
.cast>li{min-width:0}
.cast>.cast-paire{position:relative;grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.cast>.cast-paire::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule-s)}
.cast-pt{margin:0;min-width:0}
.cast-cadre{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;container-type:inline-size;background:var(--paper2);box-shadow:inset 0 0 0 1px var(--rule)}
.cast-cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.cast-mono{position:absolute;inset:8px;display:grid;place-items:center;border:1px solid var(--rule-s)}
.cast-mono b{font:400 2.6rem/1 var(--serif);font-size:30cqw;letter-spacing:.01em;text-transform:uppercase;color:var(--acc)}
.cast-cr{display:block;min-height:1.7em;padding-top:4px;font-size:.75rem;line-height:1.35;color:var(--ink2)}
.cast-nom{display:block;margin-top:10px;font:400 clamp(1.15rem,1rem + .5vw,1.35rem)/1.15 var(--serif);color:var(--ink);text-wrap:balance}
.cast-alt,.cast-role{display:block;margin-top:3px;font-size:.8125rem;line-height:1.5;color:var(--ink2)}
.cast-role{font:600 .6875rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-s)}
.prod{margin-top:28px;font-size:.9375rem;line-height:1.6;color:var(--ink2)}
.prod p+p,.prod .pb+.pb,.prod p+.pb,.prod .pb+p{margin-top:.55em}
.signe{margin-top:28px;font:600 .75rem/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc-s)}
.pr-statut{display:inline-block;padding:4px 12px;border:1px solid var(--acc-s);color:var(--acc-s);font:600 .75rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.pr-rep{font:400 var(--t2)/1.12 var(--serif);margin-bottom:18px;text-wrap:balance}
.pr-format{margin-bottom:14px}
.pr-format span:last-child{font-weight:600;letter-spacing:.06em}
.pr-faits+.pr-faits{margin-top:16px}
.pr-lieux{font-size:1rem;line-height:1.7}
/* le contact diffusion, le dossier PDF et les documents (règle 13) */
.cd{display:grid;gap:6px;max-width:640px;margin-top:30px;padding:26px 30px 24px;background:var(--encre);color:var(--ivoire)}
.cd .kicker{color:inherit;opacity:.74}
.cd-nom b{display:block;font:400 var(--t2)/1.06 var(--serif);letter-spacing:-.01em}

.cd-mail:hover{background:#fff}
.cd-mail .fl{transition:transform .25s}
.cd-mail:hover .fl{transform:translateX(5px)}
.cd-tel{font-weight:600;color:inherit}
html:not(.ed-actif) .cd-tel.vide{display:none}
.cd-cond{margin-top:12px;font-size:.875rem;opacity:.8}
.cd--s{max-width:none;margin-top:30px;padding:20px 24px 18px;background:var(--aplat);color:var(--sur-aplat)}
.cd--s .cd-nom b{display:inline;font-size:var(--t3)}

.cd--s .cd-liens{margin-top:12px}

.dos-bt{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--aplat);background:var(--aplat);color:var(--sur-aplat);font-weight:600;line-height:1.3;text-align:left;cursor:pointer;transition:background-color .25s,color .25s}
.dos-bt svg{flex:none;width:16px;height:16px}
.dos-bt:hover{background:transparent;color:var(--aplat)}
.dos-bt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor;opacity:0;transform:scaleX(0);transform-origin:left}
.dos-bt[aria-busy="true"]{cursor:progress}
.dos-bt[aria-busy="true"]::after{opacity:1;animation:filet 1.1s cubic-bezier(.5,0,.2,1) infinite}
@keyframes filet{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}50.01%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
@media (prefers-reduced-motion:reduce){.dos-bt[aria-busy="true"]::after{animation:none;transform:scaleX(.6)}}
.pr-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:26px}
.docs{display:grid;gap:12px}

.ft-bloc:first-child{grid-column:1/-1}
.ft-bloc h4{margin-bottom:10px;font:700 .75rem/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc-s)}
.ft-bloc li{position:relative;padding:3px 0 3px 16px;font-size:.9375rem;line-height:1.5}
.ft-bloc li::before{content:"";position:absolute;left:0;top:.85em;width:8px;height:1px;background:currentColor}
.ft-alerte{margin-top:16px;padding:16px 20px;line-height:1.5}
.ft-photo{margin-top:30px}
.ft-photo img{width:100%;aspect-ratio:16/9;object-fit:cover}
.ac-type{font:var(--titre-w) calc(var(--t1) * .92 * var(--titre-k))/1 var(--titre);color:var(--acc);text-wrap:balance}
.ac-vide{font-family:var(--serif);font-weight:400;color:var(--ink)}

.ac-bloc{margin-top:24px}
.dos-couv{position:relative;overflow:hidden;padding:34px 34px 36px}
.dos-type{font:700 .75rem/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase}
.dos-titre{margin-top:10px;font:var(--titre-w) calc(var(--t1) * var(--titre-k))/1 var(--titre);letter-spacing:.01em}
.dos-auteur{margin-top:6px;font:italic 400 var(--t4)/1.3 var(--serif)}

.tab-w{max-width:100%;overflow-x:auto}

.next-motif.motif-chronologie{left:var(--gx);right:280px;top:auto;bottom:6px;width:auto;opacity:.4}

/* ——— Pied de page ——— */
.site-foot{background:var(--encre);color:var(--ivoire);border-top:1px solid color-mix(in srgb,var(--ivoire) 18%,transparent)}
.foot-in{display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr)}
.foot-brand{padding:64px var(--gx)}
.foot-logo{display:block;width:150px;color:var(--ivoire)}
.foot-logo svg{display:block;width:100%;height:auto}
.foot-ent{margin-top:34px;display:grid;gap:4px}
.foot-ent a{font:400 1.25rem/1.35 var(--serif);text-decoration:none}
.foot-ent a:hover{text-decoration:underline}
.foot-cols{padding:64px var(--gx);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;font-size:.9375rem;line-height:1.6}
.foot-c p+p{margin-top:10px}
.foot-nom{font:400 var(--t4)/1.3 var(--serif)}
.site-foot a{color:inherit;text-decoration-color:rgba(245,241,234,.45)}
.site-foot a:hover{text-decoration-color:currentColor}
.site-foot :focus-visible{outline-color:var(--ivoire)}
.foot-d{color:#b9afa6}
.foot-leg{display:flex;flex-direction:column;gap:4px;margin-top:16px!important}
.btn-ed{display:inline-flex;align-items:center;gap:9px;margin-top:22px;padding:7px 14px 8px;border:1px solid rgba(245,241,234,.45);font:600 .75rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ivoire)}
.btn-ed svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.btn-ed:hover{background:var(--ivoire);color:var(--encre)}

/* ——— L'ouverture : papier et encre, un double filet en tête et en pied ——— */
.intro.m08-intro::before,.intro.m08-intro::after{content:"";position:absolute;left:clamp(16px,3.9vw,56px);right:clamp(16px,3.9vw,56px);height:7px;z-index:1;pointer-events:none;transition:opacity .35s ease;background:linear-gradient(currentColor,currentColor) 0 0/100% 3px no-repeat,linear-gradient(currentColor,currentColor) 0 6px/100% 1px no-repeat}
.intro.m08-intro::before{top:clamp(16px,3vw,34px)}
.intro.m08-intro::after{bottom:clamp(16px,3vw,34px);transform:scaleY(-1)}
.intro.m08-intro.part::before,.intro.m08-intro.part::after{opacity:0}
.intro.m08-intro .intro-indice{bottom:max(52px,env(safe-area-inset-bottom))}

/* ——— L'édition sur place, dans le style du sommaire : papier, double filet, encre rouge du correcteur ——— */
html .ed-barre{border-radius:0;border:1px solid #191414;padding-top:15px;background:linear-gradient(#191414,#191414) 0 0/100% 3px no-repeat,linear-gradient(#191414,#191414) 0 6px/100% 1px no-repeat,#f5f1ea;box-shadow:0 14px 34px rgba(25,20,20,.24)}
html .ed-barre .ed-etat{font:400 1.2rem/1 "DM Serif Display",Georgia,serif}
html .ed-bt{border-radius:0}
html .ed-panneau{border-radius:0;border-top:3px solid #191414}
html .ed-tete h2{font:400 1.35rem/1.2 "DM Serif Display",Georgia,serif}
html .ed-outils{border-radius:0}
html.sombre.ed-actif [data-edit],html.ed-actif .u.pv-u [data-edit]{outline-color:color-mix(in srgb,#ff9a8f 75%,transparent)}
html.ed-actif .ed-ajout{border-radius:0;margin:12px 0}

/* ——— Le mouvement (règle 15) : l'édition. Voir le bloc « Mouvement » en tête du script ———
   Une seule courbe, typographique : rapide, puis posée. Survol 160 ms, pression 60 ms, page 360 ms, 450 ms au plus. */
html{view-transition-name:none}
/* la ligne cliquée (un titre du sommaire, une fiche, une entrée) devient le titre de la page, et y revient */
::view-transition-group(mv-partage){animation-duration:.36s;animation-timing-function:cubic-bezier(.3,.75,.15,1)}
/* un titre devient un titre : l'image suit la largeur de la ligne (sans recadrage), l'ancienne cède à la nouvelle */
::view-transition-old(mv-partage),::view-transition-new(mv-partage){height:auto;width:100%;object-fit:fill}
::view-transition-old(mv-partage){animation:.2s ease-out both ed-efface}
::view-transition-new(mv-partage){animation:.2s ease-out both ed-pose}
.sh-titre,.page-title,.pv-t,.af-t,.cf-t,.acf-t,.next-t{width:fit-content;max-width:100%}
/* d'un onglet à l'autre d'un spectacle : l'en-tête ne bouge pas, seul le filet de l'onglet glisse */
.sh-ong-filet{position:absolute;left:0;right:0;top:-1px;height:4px;background:var(--e);pointer-events:none}
html[data-mv-transition="onglet"] .sh-ong-filet{view-transition-name:ed-filet}
::view-transition-group(ed-filet){animation-duration:.26s;animation-timing-function:var(--mv-courbe)}
@keyframes ed-efface{to{opacity:0}}
@keyframes ed-pose{from{opacity:0}}
/* au défilement : les titres de rubrique se composent (ils se découvrent de gauche à droite), les filets se tirent à la
   règle, les fiches se posent l'une après l'autre, les chiffres comptent */
.cb-head,.bande-t,.ag-mois{border-bottom:0;background:linear-gradient(var(--ink),var(--ink)) 0 100%/100% 1px no-repeat}
[data-mv="compose"].mv-attente{transition:clip-path .6s var(--mv-courbe) var(--mv-delai,0ms)}
[data-mv="compose"].mv-attente:not(.mv-vu){clip-path:inset(-.3em 100% -.35em -.15em)}
[data-mv="filet"].mv-attente{transition:background-size .8s var(--mv-courbe) var(--mv-delai,0ms)}
:is(.mast,.saisons-ag,.saisons,.cat-som,.ep-som)[data-mv="filet"].mv-attente:not(.mv-vu){background-size:0 3px,0 1px}
:is(.cb-head,.bande-t,.ag-mois)[data-mv="filet"].mv-attente:not(.mv-vu){background-size:0 1px}
/* l'aperçu se relaie : l'ancien s'efface en remontant d'un rien ; le nouveau monte, ligne après ligne, et sa photo se
   découvre de bas en haut, comme une épreuve qu'on tire */
.pv-layer:not(.is-on){transform:translateY(-6px)}
.pv-layer.is-on{transform:none;transition:opacity var(--fade) ease,visibility 0s,transform .26s var(--mv-courbe)}
/* le filet souligne : les titres des fiches, des affiches, du spectacle suivant, de la chronologie */
:is(.af-a,.next,.cf-t a,.acf-t a,.chrono a,.sa-t a):is(:hover,:focus-visible) .tt{background-size:100% 3px}
.cf-t a:hover,.acf-t a:hover,.sa-t a:hover,.next:hover .next-t{text-decoration:none}
.chrono a:hover .ch-t{text-decoration-color:transparent}
:is(.toc-fl,.cta-fl,.fl){transition:transform .18s var(--mv-courbe)}
/* la pression : à l'instant même, le filet s'épaissit et l'encre prend */
:is(.lien-fort,.cf-go,.af-go,.pv-link,.mast-d,.docs a,.cd-tel){transition:text-decoration-thickness .06s}
.mv-presse:is(.lien-fort,.cf-go,.pv-link,.mast-d,.docs a,.cd-tel){text-decoration-thickness:4px}
.af-a.mv-presse .af-go{text-decoration-thickness:4px}
.mv-presse:is(.cp,.idx,.idx-tout,.filtre,.cf-ba,.btn,.btn-ed,.cm-ix,.cat-l){background:var(--ink);border-color:var(--ink);color:var(--paper);transition:none}
.dos-bt.mv-presse{background:transparent;color:var(--aplat);transition:none}
.cd-mail.mv-presse{background:#fff;transition:none}
:is(.toc-link,.ep,.af-a,.next,.chrono a).mv-presse .tt{background-size:100% 5px;transition-duration:.06s}
.ent.mv-presse::after{height:5px;background:var(--e);transition:none}
.sh-ong.mv-presse::before{height:6px;background:var(--e)}
.menu2 a.mv-presse{color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.7em}
.cta-a.mv-presse .cta-t{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:.15em}
.sai>summary.mv-presse{background:color-mix(in srgb,var(--ink) 12%,transparent)}
/* ce qui vit : « EN TOURNÉE » respire ; sur une frise, la prochaine date et « Aujourd'hui » */
.vit::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;vertical-align:.12em;background:currentColor;animation:ed-respire 2.4s ease-in-out infinite}
@keyframes ed-respire{0%,100%{opacity:1}50%{opacity:.18}}
/* une ligne vers laquelle mène un repère de frise, un instant marquée au crayon */
.ag-it.est-vise,.sa-it.est-vise,.chrono li.est-vise>*{animation:ed-vise 1.3s var(--mv-courbe)}
@keyframes ed-vise{0%,40%{background-color:color-mix(in srgb,var(--c,var(--ink)) 22%,transparent)}}
.ag-it.est-allume,.sa-it.est-allume,.chrono li.est-allume>*{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--acc)) 18%,transparent),transparent 75%)}

/* ——— Les frises (FRISE) : la sobriété d'un livre. Un filet d'encre, des graduations fines, les mois en petites
   capitales ; un carré par date (plein à venir, au trait déjà jouée), « Aujourd'hui » en signet ——— */
.frise[data-frise]{--fr-fond:var(--paper);--fr-encre:var(--ink);--fr-trait:var(--rule-s);--fr-accent:var(--ink);--fr-police:var(--sans);
  --fr-bulle-fond:var(--paper);--fr-bulle-encre:var(--ink);--fr-point:9px;--fr-couloir:15px;--fr-haut:30px;--fr-taille:11px;--fr-pied:34px;--fr-passe:1}
.frise .frise-axe{background:var(--ink)}
.frise .frise-mois-nom{font:600 .625rem/1.2 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
.frise .frise-an{font:400 .6875rem/1.3 var(--sans);letter-spacing:.04em;color:var(--ink2);opacity:1}
.frise .frise-point>.frise-repere::before{border-radius:0;transition:scale .16s var(--mv-courbe),opacity .16s}
.frise .frise-point.est-passe>.frise-repere::before{background:var(--fr-fond);box-shadow:inset 0 0 0 1.5px var(--fr-c,var(--ink)),0 0 0 2px var(--fr-fond);opacity:.7}
.frise .frise-point.est-passe:is(.est-allume,.est-focus)>.frise-repere::before{opacity:1}
.frise .frise-point.est-duree>.frise-repere::before{height:4px;border-radius:0}
.frise .frise-point:is(.est-allume,.est-focus)>.frise-repere::before,.frise .frise-point>.frise-repere:hover::before{scale:1.4}
/* la prochaine date : un cadre fin qui respire autour de son carré */
.frise .frise-point.est-passe+.frise-point:not(.est-passe):not(.est-groupe):not(.est-duree)>.frise-repere::after,
.frise .frise-points>.frise-point:first-child:not(.est-passe):not(.est-groupe):not(.est-duree)>.frise-repere::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--fr-point) + 8px);height:calc(var(--fr-point) + 8px);margin:calc(var(--fr-point) / -2 - 4px) 0 0 calc(var(--fr-point) / -2 - 4px);box-shadow:inset 0 0 0 1px var(--fr-c,var(--ink));animation:ed-respire 2.4s ease-in-out infinite;pointer-events:none}
.frise .frise-grappe>span{border-radius:0;background:var(--fr-fond);box-shadow:inset 0 0 0 1.5px var(--ink)}
.frise .frise-grappe.est-passe>span{opacity:1;box-shadow:inset 0 0 0 1px var(--rule-s)}
.frise .frise-grappe.est-passe .frise-grappe-n{color:var(--ink2)}
.frise .frise-grappe-n{font:600 .625rem/1 var(--sans)}
.frise .frise-aujourdhui::before{width:1px;background:var(--ink);opacity:1}
.frise .frise-aujourdhui::after,.frise .frise-souffle{border-radius:0;width:7px;height:7px;left:-3.5px;bottom:-3.5px}
.frise .frise-aujourdhui-nom{font:600 .5625rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.frise .frise-bulle{border:1px solid var(--ink);border-radius:0;box-shadow:5px 5px 0 var(--rule);padding:9px 12px 10px;font:400 .875rem/1.4 var(--sans)}
.frise .frise-bulle b{font:400 1.0625rem/1.2 var(--serif)}
.frise .frise-bulle i{border-radius:0}
.frise .frise-bande-barre{background:var(--ink);opacity:.8;border-radius:0}
.frise .frise-bande.est-passe .frise-bande-barre{opacity:.8}
.frise .frise-bande:is(:hover,.est-allume) .frise-bande-barre{opacity:1;background:var(--bande-vive,var(--ink))}
.frise .frise-bande-n{font:600 .6875rem/1 var(--sans);font-variant-numeric:tabular-nums}
.frise .frise-bande-nom{font:500 .625rem/1 var(--sans);letter-spacing:.04em;color:var(--ink2)}
/* « Je viens voir un spectacle », une saison passée : le titre, puis la frise de la saison sur toute la largeur, comme
   un folio ; les saisons passées en barres, une par saison, à la hauteur de leurs dates */
.ag-tete{padding:44px var(--gx) 20px;border-bottom:1px solid var(--rule)}
.ag-tete .page-title{margin-top:12px}
.ag-tete .kicker a{text-decoration:none}
.ag-tete .kicker a:hover{text-decoration:underline}
.ag-tete+.ag .ag-side .cm{margin-top:0;padding-top:0;border-top:0}
.v-frise{margin:26px calc(-1 * var(--fr-marge,14px)) 0}
.ag-index{position:static;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 18px;padding:6px 0 4px;border-bottom:1px solid var(--ink)}
.ag-ix-outils{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding-bottom:30px}
.ag-ix-outils ul{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}
.frise-saisons{--fr-bande-h:36px;--fr-haut:18px;--fr-pied:28px;--bande-vive:var(--ent-voir)}
.frise-saisons .frise-bande-barre,.frise-diffusion .frise-bande-barre{margin:0 2px}
.sai.est-allume>summary{background:color-mix(in srgb,var(--ink) 7%,transparent)}
/* la diffusion d'un spectacle, saison par saison (le catalogue, l'onglet programmer) */
.cf-diff{padding-top:12px;border-top:1px solid var(--rule)}
.cf-diff .kicker,.sh-diff .kicker{color:var(--acc-s)}
.frise-diffusion{--fr-bande-h:30px;--fr-haut:14px;--fr-pied:24px;--fr-taille:10px;--bande-vive:var(--acc)}
.frise-diffusion .frise-bande-barre{background:var(--acc)}
.frise-diffusion .frise-aujourdhui-nom{display:none}
.sh-diff{margin:4px 0 30px}
.sh-frise,.e-frise{margin:0 0 26px}
.e-frise .frise[data-frise]{--fr-point:10px}
/* la frise historique de la compagnie, sur toute la largeur, sous la table des dates */
.c-frise{grid-column:1/-1;padding:0 var(--gx) 52px}
.c-frise .frise[data-frise]{--fr-point:11px;--fr-couloir:46px;--fr-haut:30px}
.c-frise .frise-etiquette{font:400 1.0625rem/1.2 var(--serif);max-width:11em;padding:0 4px 1px;margin-left:-4px;background:var(--fr-fond)}
/* une étiquette basse passe devant le filet d'une étiquette plus haute, comme dans une chronologie imprimée */
.c-frise .frise-point{z-index:calc(10 - var(--fr-y,0))}
.c-frise .frise-repere:is(:hover,:focus-visible) .frise-etiquette{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em}
/* ——— L'espace pro : trois portes, composées comme un sommaire ——— */
.ep-texte{margin-top:20px;max-width:30ch;font:italic 400 var(--t3)/1.35 var(--serif);color:var(--ink2)}
.ep-som{padding-top:12px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 6px/100% 1px no-repeat}
.ep{display:block;padding:22px 0 24px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.ep .toc-row{align-items:last baseline}
.ep-t{font:400 clamp(1.9rem,3vw,2.6rem)/1.06 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.ep-x{display:block;margin-top:10px;max-width:36rem;color:var(--ink2)}
.ep:is(:hover,:focus-visible) .tt{background-size:100% 3px}
.ep:is(:hover,:focus-visible) .toc-fl{transform:translateX(6px)}

@media (max-width:1279px){
  .ateliers{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px){
  .foot-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .affiches,.acs{grid-template-columns:minmax(0,1fr)}
  .sh-ong{font-size:.9375rem;gap:10px}
  .pv-dates li{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pv-dates .pv-dt{grid-column:1/-1}
}
@media (max-width:859px){
  :root{--hh:58px;--onglets:52px;--barre:calc(62px + env(safe-area-inset-bottom))}
  .sai-corps:not(:empty){display:flex;flex-direction:column}
  .sai-carte{position:static;order:-1;max-width:520px}
  .sai>summary{gap:12px;padding:12px 2px}
  .sai-mini{width:56px}
  .sai>summary .ss-lead{display:none}
  .sai-n{margin-left:auto}
  .sai-corps{padding:8px 2px 30px}
  .cps{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--gx));padding:2px var(--gx) 4px;scrollbar-width:none}
  .cp{flex:none}
  body{padding-bottom:var(--barre)}
  .tete{grid-template-columns:auto minmax(0,1fr) auto}
  .menu-btn{display:inline-flex;grid-column:3}
  .entrees{position:fixed;left:0;right:0;bottom:0;z-index:45;overflow:visible;background:var(--paper);border-top:1px solid var(--rule-s);padding-bottom:env(safe-area-inset-bottom)}
  .entrees ul{justify-content:stretch;gap:0;height:auto}
  .entrees li{flex:1 1 0;min-width:0}
  .entrees li+li .ent{border-left:1px solid var(--rule)}
  .ent{height:62px;flex-direction:column;justify-content:center;gap:6px;padding:0 6px;font-size:.8125rem;white-space:normal;text-align:center;line-height:1.15}
  .ent::after{top:-1px;bottom:auto}
  .entrees .ent-l{display:none}
  .entrees .ent-c{display:inline}
  .menu2{display:none;position:absolute;top:100%;left:0;right:0;padding:8px var(--gx) 20px;border-left:0;border-bottom:1px solid var(--rule);background:var(--paper);max-height:calc(100svh - var(--hh) - var(--barre));overflow-y:auto}
  .menu-open .menu2{display:block}
  .menu2 ul{flex-direction:column;gap:0}
  .menu2 li+li{border-top:1px solid var(--rule)}
  .menu2 a{padding:14px 0;font:400 1.5rem/1.2 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink)}
  .menu2 a[aria-current="page"]{text-decoration-thickness:2px;text-underline-offset:.2em}
  .som,.page,.ag,.foot-in,.saisons-b,.cf,.sh-tete,.sh-corps,.af-a{display:block}
  .pv{display:none}
  .som{min-height:0}
  .toc{padding:22px var(--gx) 36px}
  .toc-title{font-size:calc(2rem * var(--tk,1));line-height:1.08}
  .toc-link{padding:16px 0 18px;border-bottom:1px solid var(--rule)}
  .toc-lead{display:none}
  .toc-row{justify-content:space-between}
  .som-e .toc-title{font-size:2.1rem;line-height:1.05}
  .som-e .toc-row{justify-content:flex-start}
  .som-e .toc-fl{margin-left:auto}
  .toc-extra{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
  .toc-extra img{width:104px;aspect-ratio:4/5;object-fit:cover}
  .toc-x{display:flex;flex-direction:column;gap:6px;font-size:.9375rem;line-height:1.45;min-width:0}
  .toc-crea{font:600 .6875rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ct,var(--ink2))}
  .toc-next .kicker{margin-bottom:2px}
  .toc-link.is-active .tt{background-size:0 3px}
  .toc-list .toc-link.is-active .toc-title{color:var(--ink)}
  .som-e .toc-link.is-active .toc-title{color:var(--ink)}
  .som-e .toc-link.is-active .toc-fl{transform:none;color:inherit}
  .cb{padding:52px var(--gx) 56px}
  .ag-tete{padding:28px var(--gx) 14px}
  .ag-index{grid-template-columns:minmax(0,1fr)}
  .ag-ix-outils{justify-content:flex-start;padding-bottom:8px}
  .c-frise{padding:0 var(--gx) 36px}
  .ep-t{font-size:1.85rem}
  .cm-marges .cm-svg{width:calc(var(--ext,1) * 100%);margin-left:calc(var(--off,0) * -100%);max-width:none}
  .cm-marges .cm-etiqs{display:none}
  .cm-marges .cm-bras{stroke-width:calc(var(--wb) * 1.7)}
  .cm-marges .cm-pt{r:calc(var(--rp) * 1.6)}
  .cm-cap{position:static;width:auto;margin-top:16px}
  .cm-index{display:flex;flex-wrap:wrap;margin-top:18px;padding-top:10px;border-top:1px solid var(--ink)}
  .cm-ix{padding:6px 12px 6px 0;margin-right:12px;border-right:1px solid var(--rule);font:400 1.0625rem/1.3 var(--serif);text-align:left}
  .cm-ix-d{font:500 .75rem var(--sans);color:var(--ink2)}
  .cm-ix.is-on{color:var(--ct);text-decoration:underline}
  .merci{padding:32px var(--gx) 44px}
  .pg-head{padding:34px var(--gx) 0}
  .pg-head-in{position:static}
  .pg-body{padding:30px var(--gx) 64px}
  .page-title{font-size:2.6rem;line-height:1.03}
  .pt-2{font-size:2rem}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : l'édition. Le sommaire d'une revue : chaque geste compose la page comme on la met en pages. Une seule
     courbe, typographique (rapide, puis posée) ; survol 160 ms, pression 60 ms, page 360 ms, jamais plus de 450 ms.
     1. Changer de page (MOUVEMENT.transition, View Transitions) : on tourne la page, la suivante se compose ligne à ligne,
        dans l'ordre de lecture : les filets se tirent à la règle, le titre se découvre de gauche à droite, puis les lignes du
        premier écran se posent l'une sous l'autre. La ligne qu'on choisit devient le titre de la page (élément partagé) :
        le titre d'un spectacle, au sommaire, dans l'aperçu, sur une affiche ou une fiche, devient le titre de son en-tête ;
        une entrée de l'accueil devient le titre de sa page. D'un onglet à l'autre d'un spectacle, l'en-tête reste et seul
        le filet de l'onglet glisse. Un geste interrompt la transition.
     2. L'aperçu se relaie : survoler une ligne du sommaire relaie l'aperçu à droite ; l'ancien s'efface en remontant d'un
        rien, le nouveau monte ligne après ligne et sa photo se découvre de bas en haut, comme une épreuve qu'on tire.
     3. Ouvrir une saison, le menu : les lignes se composent l'une après l'autre (cascade).
     4. Filtrer, chercher : la page se recompose ; les lignes glissent à leur nouvelle place (MOUVEMENT.flip), celles qui
        partent s'effacent ; sur les frises, les repères glissent et les barres des saisons changent de hauteur.
     5. Survol et focus : le filet souligne, il se tire sous le titre de gauche à droite, ligne après ligne ; rien ne bouge.
     6. Pression (MOUVEMENT.presse) : à l'instant même, le filet s'épaissit, l'encre prend le bouton.
     7. Défilement (MOUVEMENT.reveler) : les filets se tirent, les titres de rubrique se composent, les fiches se posent
        l'une après l'autre, les chiffres comptent ; les bras de la carte se tracent depuis Rouen.
     8. Ce qui vit : « EN TOURNÉE » respire ; sur chaque frise, « Aujourd'hui », en signet, et la prochaine date.
     Les frises (FRISE) ont la sobriété d'un livre : un filet d'encre, des mois en petites capitales, un carré par date,
     plein quand elle est à venir, au trait quand elle est jouée. La saison et les saisons sur « Je viens voir un spectacle »
     (reliées à la liste et à la carte), la saison passée, la tournée d'un spectacle, les dates scolaires, la diffusion
     saison par saison (programmer), l'histoire de la compagnie. La pieuvre se tait : aucun moment de tentacule ici.

  const CLES = ['voir', 'programmer', 'etablissement'];
  // un spectacle sans action culturelle (Cassandres, pour l'instant) n'a pas d'onglet établissement : on le mène à « voir » (règle 14)
  const entreeSp = (slug, ent) => ent === 'etablissement' && !(show(slug) || {}).actionCulturelle ? 'voir' : ent;
  const IVOIRE = '#f5f1ea';
  const main = $('#main'), head = $('.site-head'), pied = $('.site-foot');
  let ANIMER = true;                 // faux pendant un rafraîchissement : aucune animation d'entrée n'est rejouée
  // le mouvement (MOUVEMENT) et les frises (FRISE), outils communs ; sans eux, la maquette reste entière, immobile
  const MV = typeof MOUVEMENT !== 'undefined' ? MOUVEMENT : null, FR = typeof FRISE !== 'undefined' ? FRISE : null;
  const motionOK = () => (MV ? MV.permis() : CARTE.mouvement());
  const COURBE = 'cubic-bezier(.22, .8, .24, 1)';
  // le visible d'abord : ce qui est sous le pli se dessine dans les tâches qui suivent l'image (chacune courte)

  // ce qui se branche après le rendu d'une vue (ses frises, ce qui se dessine plus tard) ; le titre qui se compose

  // dessiner quand on approche de l'écran (une seule fois) ; tout de suite si la vue se refait en place
  function paresseux(el, f) {
    if (!el) return;
    if (SUR_PLACE || !('IntersectionObserver' in window)) { f(); return; }
    const o = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { o.disconnect(); f(); } }, { rootMargin: '600px 0px' });
    o.observe(el);
  }
  // une mémoire des calculs coûteux (l'agenda passé) : oubliée à chaque changement de D, elle ne fige rien (règle 9)
  let versionD = 0;
  const memoire = new Map();
  const retenu = (cle, f) => { const m = memoire.get(cle); if (m && m.v === versionD) return m.x; const x = f(); memoire.set(cle, { v: versionD, x }); return x; };
  let etatVue = { som: {}, filtres: {} };

  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const brut = h => String(h ?? '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  const ed = chemin => chemin ? ` data-edit="${esc(chemin)}"` : '';          // l'édition sur place (edition.js)
  const P = s => `shows.${s.slug}`;
  const fleche = '<span class="fl" aria-hidden="true">→</span>';
  const ext = (href, html, cls = '') => `<a${cls ? ` class="${cls}"` : ''} href="${esc(href)}" target="_blank" rel="noopener">${html}<span class="ext" aria-hidden="true">↗</span></a>`;
  const photoSrc = cle => (D.photos || {})[cle] || '';
  const img = (cle, alt = '', attrs = '') => photoSrc(cle) ? `<img src="${esc(photoSrc(cle))}" alt="${esc(alt)}" decoding="async"${attrs}>` : '';
  const focale = s => ` style="object-position:${s.focale ?? 50}% 50%"`;
  // les proportions des photos, mesurées une fois : une case haute prend la photo la mieux cadrée (la principale, ou une
  // de la galerie), et une photo très large se montre entière dans l'en-tête du spectacle
  const RATIOS = new Map();
  const candidates = s => [s.slug, ...(s.photos || []).filter(p => !p.etablissement && !p.atelier).slice(0, 3).map(p => p.cle)].filter(photoSrc);
  function vignette(s, cible) {
    const ecart = c => { const r = RATIOS.get(c); return r ? Math.abs(Math.log(r / cible)) + (c === s.slug ? 0 : .3) : (c === s.slug ? .6 : 9); };

  const imgV = (s, cible, alt = '', attrs = '') => { const c = vignette(s, cible); return photoSrc(c) ? `<img src="${esc(photoSrc(c))}" alt="${esc(alt)}" decoding="async" data-vignette="${esc(s.slug)}" data-cible="${cible}"${c === s.slug ? focale(s) : ''}${attrs}>` : ''; };
  const LARGE = 2.3;
  function mesurer() {
    const cles = new Set();

    });

  }

  const para = (h, chemin, cls = '') => BLOC.test(h || '') ? `<div class="pb${cls ? ' ' + cls : ''}"${ed(chemin)}>${h}</div>` : `<p${cls ? ` class="${cls}"` : ''}${ed(chemin)}>${h ?? ''}</p>`;
  // « 779 représentations au 31 juillet 2026 » : le nombre (il compte au défilement) puis la suite, tels quels
  const nombre = t => { const m = String(t || '').match(/^(\d[\d   ]*?)(\s+\D[\s\S]*)$/); return m ? `<b class="nb">${esc(m[1])}</b>${esc(m[2])}` : esc(t); };
  const lienVideo = u => { let m; const s = String(u || ''); if ((m = s.match(/youtube\.com\/embed\/([\w-]+)/))) return `https://www.youtube.com/watch?v=${m[1]}`; if ((m = s.match(/player\.vimeo\.com\/video\/(\d+)/))) return `https://vimeo.com/${m[1]}`; return s; };
  const MOIS = /(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}/;
  // « 18 décembre 2026 » → « 18 » en grand, « décembre 2026 » dessous (les mots de la ligne, rien d'autre)
  const decoupe = t => { const s = String(t || ''), m = s.match(MOIS); return m ? { j: s.slice(0, m.index).trim(), m: s.slice(m.index) } : { j: '', m: s }; };
  function groupesMois(dates) {
    const g = [];
    dates.forEach(d => { const cle = String(d.iso || '').slice(0, 7); let x = g[g.length - 1]; if (!x || x.cle !== cle) g.push(x = { cle, t: (String(d.ligneDate || d.ligne).match(MOIS) || [d.ligneDate || ''])[0], dates: [] }); x.dates.push(d); });
    return g;
  }
  // la première phrase entière d'un paragraphe d'origine (HTML), balises refermées
  function premiere(html) {
    html = String(html || '');
    const re = /[.!?…](?=[\s  ]|<br|$)/g;
    let m;
    while ((m = re.exec(html))) {
      let fin = m.index + 1;
      const q = html.slice(fin).match(/^[\s  ]*[»”]/);
      if (q) fin += q[0].length;
      const h = html.slice(0, fin);
      if ((h.match(/</g) || []).length !== (h.match(/>/g) || []).length || brut(h).length < 24) continue;
      const pile = [];
      h.replace(/<(\/?)([a-z0-9]+)[^>]*>/gi, (t, f, n) => { if (/^(br|img|hr)$/i.test(n) || /\/>$/.test(t)) return t; if (f) pile.pop(); else pile.push(n); return t; });
      return h + pile.reverse().map(n => `</${n}>`).join('');

  }

  /* ——— Les couleurs : chaque univers reste lisible (AA) sur son fond, chaque spectacle reste lisible sur l'ivoire ——— */
  const hex6 = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : null;
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lum = h => { const f = v => (v /= 255) <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; const [r, g, b] = rgb(h); return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };

  const styleU = s => varsU(univers(s));
  // un spectacle sur l'ivoire : sa couleur (lisible), sa police de titre
  const styleIvoire = s => { const v = univers(s), c = s.couleur || v.titre; return `--c:${lisible(c, IVOIRE, 3)};--ct:${lisible(c, IVOIRE, 4.6)};--tf:${v.police};--tw:${v.graisse};--tk:${v.k}`; };

  // la page d'un spectacle prend son univers, en-tête compris ; les entrées gardent leur couleur, lisible sur ce fond

    const html = document.documentElement, st = html.style, v = s ? univers(s) : null;

    if (v) varsU(v).split(';').forEach(d => { const i = d.indexOf(':'); st.setProperty(d.slice(0, i), d.slice(i + 1)); });
    const fond = v ? v.fond : IVOIRE, clair = lum(fond) > .4;

  /* ——— Les motifs : arène, jumeaux, annotations, paperboard, nez, horloge, fil, chronologie ——— */
  const RAD = Math.PI / 180;

  /* ——— La carte : des filets d'encre depuis Rouen ; les communes composées en marge, comme dans un magazine ——— */
  const R = CARTE.rouen, EN = CARTE.ENCART;
  const loin = xy => Math.hypot(xy[0] - R[0], xy[1] - R[1]);

  {

  // les étiquettes d'une colonne, triées par hauteur : écartées d'un pas, centrées sur leurs communes
  function etaler(items, pas, haut, bas) {
    const blocs = [];
