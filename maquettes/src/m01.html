  /* ——— la planche : la carte gravée au trait, cadre à double filet gradué, numéros en marge ——— */
  const PL = new Map();
  let nPl = 0;
  const loin = x => Math.hypot(x.xy[0] - R[0], x.xy[1] - R[1]) >= 6;
  const etiquette = x => `${CARTE.nom(x)}${x.dates && x.dates.length ? ' : ' + x.dates.map(d => d.ligne).join(' ; ') : ''}`;
  function plate({ lieux = [], passe = [], semis = [], tout = [], num = new Map(), label = '' } = {}) {
    const id = 'pl' + (++nPl), f = v => v.toFixed(1);
    const tous = [...lieux, ...passe, ...tout];
    PL.set(id, { items: lieux.map(x => ({ l: x.l, num: num.get(x.l) ?? '', x: x.xy[0], y: x.xy[1] })),
      france: CARTE.viewBox.split(/\s+/).map(Number), serre: tous.length ? CARTE.cadre(tous, { marge: 40, min: 260 }).split(/\s+/).map(Number) : null });
    const trait = x => CARTE.trait(x.xy, { courbe: .2 });
    return `<svg class="pl" id="${id}" viewBox="${CARTE.viewBox}" ${lieux.length ? 'role="group"' : 'role="img"'} aria-label="${esc(label)}">
      <defs><clipPath id="${id}-c"><rect class="pl-clip"/></clipPath></defs>
      <rect class="pl-f1"/><rect class="pl-f2"/><path class="pl-tk"/>
      <g clip-path="url(#${id}-c)">
        <path class="pl-voisin" d="${CARTE.fond.belgique}"/><path class="pl-voisin" d="${CARTE.fond.luxembourg}"/><path class="pl-pays" d="${CARTE.fond.pays}"/>
        ${tous.some(x => x.encart) ? `<circle class="pl-encart" cx="${CARTE.ENCART[0]}" cy="${CARTE.ENCART[1]}" r="24"/>` : ''}
        ${tout.filter(x => loin(x) && !x.encart).map(x => `<path class="pl-fin" d="${trait(x)}"/>`).join('')}
        ${passe.filter(x => loin(x) && !x.encart).map(x => `<path class="pl-passe" d="${trait(x)}"/>`).join('')}
        ${[...semis, ...passe].map(x => `<circle class="pl-sm" cx="${x.xy[0]}" cy="${x.xy[1]}" r="1.3"/>`).join('')}
        ${tout.map(x => `<circle class="pl-sm2" cx="${x.xy[0]}" cy="${x.xy[1]}" r="2"><title>${esc(CARTE.nom(x))}</title></circle>`).join('')}
        ${lieux.filter(x => loin(x) && !x.encart).map((x, i) => `<path class="pl-route" data-l="${x.l}" pathLength="100" style="transition-delay:${i * 45}ms" d="${trait(x)}"/>`).join('')}
      </g>
      <g class="pl-rouen" aria-hidden="true"><circle class="pl-rr" cx="${R[0]}" cy="${R[1]}" r="4"/><circle class="pl-rd" cx="${R[0]}" cy="${R[1]}" r="1.4"/><text class="pl-rn" x="${f(R[0] + 22)}" y="${f(R[1] + 4)}" text-anchor="middle">Rouen</text></g>
      ${lieux.map(x => `<g class="carte-lieu pl-lieu" data-l="${x.l}" role="button" tabindex="0" aria-label="${esc(etiquette(x))}"><title>${esc(CARTE.nom(x))}</title><circle class="pl-hit" cx="${x.xy[0]}" cy="${x.xy[1]}" r="10"/><circle class="pl-pt" cx="${x.xy[0]}" cy="${x.xy[1]}" r="3"/></g>`).join('')}
    </svg>`;
  }

  /* la mise en page de la planche à sa taille réelle : traits en pixels, numéros posés près de leur commune,
     ou en marge avec un filet de rappel quand la place manque */
  const ANG = [-45, 0, -90, 45, -135, 180, 90, 135, -22.5, -67.5, 22.5, -112.5, -157.5, 157.5, 112.5, 67.5].map(a => a * Math.PI / 180);
  // toutes les planches d'une racine : leurs largeurs lues d'un coup (une seule mise en page), puis posées
  const poserTout = racine => { const svgs = [...racine.querySelectorAll('svg.pl')], ws = svgs.map(x => x.getBoundingClientRect().width); svgs.forEach((x, i) => poser(x, ws[i])); };
  function poser(svg, largeur) {
    const P = PL.get(svg.id);
    if (!P) return;
    const W = largeur ?? svg.getBoundingClientRect().width;
    if (!W) return;
    const cle = W < 560 && P.serre ? 'serre' : 'france';
    if (P.W === W && P.cle === cle) return;
    P.W = W; P.cle = cle;
    const [bx, by, bw, bh] = P[cle], u = bw / (W - 28), f = v => v.toFixed(1);
    const I = [bx - 6 * u, by - 6 * u, bw + 12 * u, bh + 12 * u], O = [I[0] - 6 * u, I[1] - 6 * u, I[2] + 12 * u, I[3] + 12 * u];
    svg.setAttribute('viewBox', [O[0] - 2 * u, O[1] - 2 * u, O[2] + 4 * u, O[3] + 4 * u].map(f).join(' '));
    const pose = (sel, r) => { const n = svg.querySelector(sel); ['x', 'y', 'width', 'height'].forEach((k, i) => n.setAttribute(k, f(r[i]))); };
    pose('.pl-f1', O); pose('.pl-f2', I); pose('.pl-clip', I);
    let tk = '';
    const pas = 18 * u;
    for (let x = I[0] + pas; x < I[0] + I[2] - pas / 2; x += pas) tk += `M${f(x)} ${f(O[1])}V${f(I[1])}M${f(x)} ${f(I[1] + I[3])}V${f(O[1] + O[3])}`;
    for (let y = I[1] + pas; y < I[1] + I[3] - pas / 2; y += pas) tk += `M${f(O[0])} ${f(y)}H${f(I[0])}M${f(I[0] + I[2])} ${f(y)}H${f(O[0] + O[2])}`;
    svg.querySelector('.pl-tk').setAttribute('d', tk);
    P.inner = [I[0] + 3 * u, I[1] + 3 * u, I[0] + I[2] - 3 * u, I[1] + I[3] - 3 * u];
    svg.style.setProperty('--u', u.toFixed(4));
    const fs = (W < 560 ? 11.5 : 12.5) * u, H = fs * .74, gap = 2.4 * u, pr = 2.9 * u, rr = 4.4 * u;
    svg.querySelectorAll('.pl-pt').forEach(c => c.setAttribute('r', f(pr)));
    svg.querySelectorAll('.pl-hit').forEach(c => c.setAttribute('r', f(11 * u)));
    svg.querySelectorAll('.pl-sm').forEach(c => c.setAttribute('r', (1.25 * u).toFixed(2)));
    svg.querySelectorAll('.pl-sm2').forEach(c => c.setAttribute('r', (1.7 * u).toFixed(2)));
    svg.querySelector('.pl-rr').setAttribute('r', f(rr));
    svg.querySelector('.pl-rd').setAttribute('r', (1.5 * u).toFixed(2));
    const [x0, y0, x1, y1] = P.inner;
    const pts = P.items.map(it => ({ x: it.x, y: it.y, r: pr + gap * .6 })).concat([{ x: R[0], y: R[1], r: rr + gap }]);
    const pris = [];
    const libre = b => b.x0 >= x0 && b.x1 <= x1 && b.y0 >= y0 && b.y1 <= y1
      && !pris.some(q => b.x0 < q.x1 + gap && b.x1 > q.x0 - gap && b.y0 < q.y1 + gap && b.y1 > q.y0 - gap)
      && !pts.some(p => Math.hypot(Math.max(b.x0, Math.min(p.x, b.x1)) - p.x, Math.max(b.y0, Math.min(p.y, b.y1)) - p.y) < p.r);
    const boite = (cx, cy, w, h) => ({ x0: cx - w / 2, x1: cx + w / 2, y0: cy - h / 2, y1: cy + h / 2 });
    function chercher(x, y, w, h, r0, anneaux) {
      for (let k = 0; k < anneaux; k++) {
        const rk = r0 + k * fs * .8;
        for (const a of ANG) {
          const cx = x + Math.cos(a) * (rk + w / 2), cy = y + Math.sin(a) * (rk + h / 2), b = boite(cx, cy, w, h);
          if (libre(b)) return { b, k, cx, cy };
        }
      }
      const cx = x + r0 + w / 2, cy = y - r0 - h / 2;
      return { b: boite(cx, cy, w, h), k: 0, cx, cy };
    }
    const fr = fs * .95, wr = fr * 3.3, hr = fr * .62, tr = chercher(R[0], R[1], wr, hr, rr + gap, 5);
    pris.push(tr.b);
    const rn = svg.querySelector('.pl-rn');
    rn.setAttribute('font-size', fr.toFixed(2)); rn.setAttribute('x', f(tr.cx)); rn.setAttribute('y', f(tr.cy + hr / 2));
    const ordre = P.items.filter(it => it.num !== '')
      .map(it => ({ it, c: P.items.filter(o => Math.hypot(o.x - it.x, o.y - it.y) < 4 * fs).length }))
      .sort((a, b) => b.c - a.c || a.it.num - b.it.num);
    for (const { it } of ordre) {
      const w = (String(it.num).length * .52 + .3) * fs, t = chercher(it.x, it.y, w, H, pr + gap * .8, 14);
      pris.push(t.b);
      const g = svg.querySelector(`.pl-lieu[data-l="${it.l}"]`);
      if (!g) continue;
      g.querySelectorAll('.pl-n,.pl-lead').forEach(n => n.remove());
      let s = '';
      if (t.k > 0) {
        const nx = Math.max(t.b.x0, Math.min(it.x, t.b.x1)), ny = Math.max(t.b.y0, Math.min(it.y, t.b.y1));
        const dx = nx - it.x, dy = ny - it.y, dd = Math.hypot(dx, dy) || 1, a1 = pr + .6 * u, a2 = dd - gap * .5;
        if (a2 > a1) s += `<line class="pl-lead" x1="${f(it.x + dx / dd * a1)}" y1="${f(it.y + dy / dd * a1)}" x2="${f(it.x + dx / dd * a2)}" y2="${f(it.y + dy / dd * a2)}"/>`;
      }
      s += `<text class="pl-n" x="${f(t.cx)}" y="${f(t.cy + H / 2)}" font-size="${fs.toFixed(2)}" text-anchor="middle">${it.num}</text>`;
      g.insertAdjacentHTML('beforeend', s);
    }
  }

  /* la planche reliée aux lignes de date : survoler met en avant, choisir épingle (ou filtre la liste) */
  function lier(scope, { filtre = false } = {}) {
    if (!scope) return;
    let survole = null, choisi = null;
    const chip = scope.querySelector('.flt');
    const marque = (cls, l) => {
      scope.querySelectorAll('.' + cls).forEach(n => n.classList.remove(cls));
      if (l != null) scope.querySelectorAll(`[data-l="${l}"]`).forEach(n => n.classList.add(cls));
    };
    const maj = () => {
      const l = survole ?? choisi;
      scope.classList.toggle('act', l != null);
      marque('on', l);
      if (!filtre) return;
      marque('sel', choisi);
      scope.classList.toggle('flt-on', choisi != null);
      scope.querySelectorAll('.grp').forEach(g => { g.hidden = choisi != null && !g.querySelector('.dl.sel'); });
      if (chip) { chip.hidden = choisi == null; chip.querySelector('.flt-t').textContent = choisi == null ? '' : CARTE.nom(K.lieux[choisi]); }
    };
    const svg = scope.querySelector('svg.pl');
    if (svg) CARTE.lier(svg, { survol: l => { survole = l; maj(); }, choix: l => { choisi = choisi === l ? null : l; survole = null; maj(); } });
    scope.querySelectorAll('li[data-l]').forEach(li => {
      const l = +li.dataset.l;
      li.addEventListener('mouseenter', () => { survole = l; maj(); });
      li.addEventListener('mouseleave', () => { survole = null; maj(); });
      li.addEventListener('focusin', () => { survole = l; maj(); });
      li.addEventListener('focusout', () => { survole = null; maj(); });
    });
    if (chip) chip.querySelector('button').addEventListener('click', () => { choisi = null; maj(); });
  }

  /* les traits de l'accueil se dessinent une fois, depuis Rouen, quand la planche paraît */
  let dessine = false;
  function tracer(svg) {
    if (!svg || dessine || !CARTE.mouvement() || !('IntersectionObserver' in window)) return;
    svg.classList.add('pl-attente');
    const lancer = () => {
      const io = new IntersectionObserver(es => {
        if (!es.some(x => x.isIntersecting) || INTRO.ouverte()) return;
        io.disconnect();
        dessine = true;
        requestAnimationFrame(() => requestAnimationFrame(() => { svg.classList.remove('pl-attente'); svg.classList.add('pl-trace'); }));
      }, { threshold: .3 });
      io.observe(svg);
    };
    if (INTRO.ouverte()) addEventListener('intro:fin', lancer, { once: true }); else lancer();
  }

  /* ——— les frises (FRISE) : le calendrier de chaque page, imprimé ; relues dans D à chaque rendu ——— */
  let FRISES = [];
  // la largeur d'une frise posée dans .wrap (sa piste garde 14 px de marge de chaque côté), calculée sans rien lire de la page
  const largeurWrap = () => Math.min(1120, innerWidth - 2 * Math.min(80, Math.max(16, innerWidth * .055))) - 28;
  function frise(conteneur, o) {
    if (!FR || !conteneur) return null;
    const f = FR.creer(conteneur, Object.assign({ aujourdhui: D.aujourdhui, immediat: EN_PLACE, largeur: largeurWrap() }, o));
    FRISES.push(f);
    return f;
  }
  // la clé d'un repère, posée aussi sur sa ligne (data-frise-id) : l'id de la base, sinon la date et le lieu (ou le rang dans la saison)
  const cleBase = d => d && d.id != null && d.id !== '' ? `d${d.id}` : null;
  const cleProchaine = d => cleBase(d) || `p|${d.slug || d.titre}|${d.iso}|${d.l}`;
  const cleLigne = (d, saison, i) => cleBase(d) || `l|${saison}|${i}`;
  const annulee = d => /annul/i.test(d.etat || '');
  // la couleur d'un spectacle sur le papier du programme (celle de son univers sur sa page)
  const couleurDe = slug => BY[slug] ? (document.body.classList.contains('u') ? teinte(BY[slug]).at : teinte(BY[slug]).kp) : '#7c746b';
  // une date à venir (D.dates), écrite comme l'agenda
  const repereProchaine = d => ({ id: cleProchaine(d), jour: d.iso, fin: d.fin, precision: d.precision, couleur: couleurDe(d.slug), titre: d.titre,
    quand: d.ligneDate, l: d.l, scolaire: !!d.scolaire, annulee: annulee(d), etat: d.etat });
  // une ligne de l'agenda (D.saisons) : sa date vient de la base (iso, fin) ou de la ligne elle-même (cleDate)
  const repereLigne = (d, saison, i, slug, titre) => { const k = d.iso || cleDate(d, saison);
    return k ? { id: cleLigne(d, saison, i), jour: k, fin: d.fin || k, precision: d.precision, couleur: couleurDe(slug), titre,
      quand: String(d.ligne || '').split(' — ')[0].trim(), l: d.l, scolaire: !!d.scolaire, annulee: annulee(d), etat: d.etat } : null; };
  // une saison en barre de frise ; son nom court, sous la barre, vient de ses années (« 16-17 »)
  const bandeSaison = (k, n) => ({ id: k, debut: `${k.slice(0, 4)}-09-01`, fin: `${k.slice(5)}-08-31`, titre: D.saisons[k].titre, n, etiquette: `${k.slice(2, 4)}-${k.slice(7, 9)}` });
  const saisonsPassees = () => Object.keys(D.saisons || {}).filter(k => /^\d{4}-\d{4}$/.test(k) && k <= D.saison).sort();
  // la diffusion d'un spectacle, saison par saison (le nombre de ses dates), de sa première saison à la saison en cours
  function diffusion(slug) {
    const ks = saisonsPassees(), n = k => (D.saisons[k].spectacles || []).filter(g => !slug || g.slug === slug).reduce((a, g) => a + (g.dates || []).length, 0);
    const premiere = ks.find(k => n(k));
    return premiere ? ks.filter(k => k >= premiere).map(k => bandeSaison(k, n(k))) : [];
  }
  // compacte : la frise est aussi large que la vie du spectacle (une barre de 72 px par saison au plus)
  const friseDiffusion = (c, slug, titre, o = {}, compacte = false) => { const bs = diffusion(slug);
    if (!bs.length || !c) return null;
    if (compacte) c.style.maxWidth = `${bs.length * 72 + 28}px`;
    return frise(c, Object.assign({ echelle: 'annees', debut: bs[0].id, fin: bs[bs.length - 1].id, bandes: bs, libelle: titre, classe: 'frise-diffusion', anMin: 30 }, o)); };
  // toutes les dates d'un spectacle, passées (D.saisons) et à venir (D.dates) ; une date passée mène à sa saison
  function reperesTournee(slug, titre, garde = () => true) {
    const passees = Object.entries(D.saisons || {}).flatMap(([k, SA]) => { let n = 0; return (SA.spectacles || []).flatMap(g => (g.dates || []).map(d => {
      const i = n++; if (g.slug !== slug || !garde(d)) return null; const p = repereLigne(d, k, i, slug, titre);
      return p && p.fin < D.aujourdhui ? Object.assign(p, { lien: k === D.saison ? null : `#/agenda/${k}` }) : null; })); }).filter(Boolean);
    return [...passees, ...D.dates.filter(d => d.slug === slug && garde(d)).map(repereProchaine)];
  }
  // un clic sur un repère mène à sa ligne (une saison fermée s'ouvre d'abord), qui reçoit un coup de surligneur
  function allerLigne(id) {
    let li = id ? main.querySelector(`[data-frise-id="${CSS.escape(id)}"]`) : null;
    if (!li && AG && AG.ouvrirPour) li = AG.ouvrirPour(id);
    if (!li) return;
    li.scrollIntoView({ behavior: bouge() ? 'smooth' : 'auto', block: 'center' });
    li.classList.remove('est-vise'); requestAnimationFrame(() => li.classList.add('est-vise'));
  }

  const chip = () => `<p class="flt" hidden><button type="button" class="flt-b" aria-pressed="true"><span class="flt-t"></span>${ICON.x}</button></p>`;
  const groupes = (rows, num, opts = {}) => parMois(rows).map(g => `<section class="grp">${g.t ? `<h3 class="mo" data-mv-cle="m:${esc(g.t)}">${esc(g.t)}</h3>` : ''}<ul class="dls" data-agenda="">${g.r.map(r => ligne(r, num, Object.assign({}, opts, { fid: opts.fidDe ? opts.fidDe(r) : null }))).join('')}</ul></section>`).join('');
  const saisonsNav = cur => `<nav class="sec seasons" aria-labelledby="h-saisons"><h2 class="sec-h" id="h-saisons">${esc(L.saisonsPrecedentes)}</h2><ul>${S.saisons.filter((x, i) => cur || i > 0).map((x, i) => `<li>${x.saison === cur ? `<span class="cur">${esc(x.titre)}</span>` : `<a href="${esc(x.saison === D.saison ? E.voir.href : x.href)}">${esc(x.titre)}</a>`}</li>`).join('')}</ul></nav>`;

  /* un spectacle hors de sa page : le cartouche, dans les couleurs de son univers */
  // haut : les petites lignes du cartouche, chacune [texte, champ du spectacle] (son chemin : shows.<slug>.<champ>)
  function cartouche(s, { cle = null, niveau = 3, haut = [], bas = '', gm = true, photo = false } = {}) {
    const k = haut.filter(t => t && t[0]);
    return `<div class="ct" style="${varsCartouche(s)}">
      ${photo ? `<span class="ct-ph"${edP(s, 'photo')}>${img(s.slug, '')}</span>` : ''}
      ${k.length ? `<p class="ct-k">${k.map(([t, c]) => `<span${edS(s, c)}>${esc(t)}</span>`).join('')}</p>` : ''}
      <h${niveau} class="ct-t"><a href="${lien(s, cle)}"${edS(s, 'titre')}>${esc(s.titre)}</a></h${niveau}>
      ${s.sousTitre ? `<p class="ct-s"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}
      ${bas}${gm ? gamme(s) : ''}
      <span class="ct-vg">${vignette(s.univers.motif)}</span>
    </div>`;
  }
  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu
  const portrait = ({ e, p, lignes }, credits) => {
    const nom = nomDe(p), k = `personnes.${e.personne}`;
    return `<figure class="cast-pt"><span class="cast-cadre" data-edit-photo="${esc(k)}.photo"><span class="cast-img"><span class="cast-mono" aria-hidden="true"><b>${esc(initiales(p))}</b></span>${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(nom)}" width="320" height="400" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span></span>
      <figcaption>${credits ? `<small class="cast-cr">${p.photo && p.credit ? esc(p.credit) : ''}</small>` : ''}<b class="cast-nom"><span${ed(`${k}.prenom`)}>${esc(p.prenom)}</span> <span${ed(`${k}.nom`)}>${esc(p.nom)}</span></b>${lignes.map(l => `${l.alternance ? `<span class="cast-alt">${esc(l.alternance)}</span>` : ''}${l.role ? `<span class="cast-role">${esc(l.role)}</span>` : ''}`).join('')}</figcaption></figure>`;
  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];
    L.forEach((x, i) => {
      if (pris.has(i)) return; pris.add(i);
      const j = x.e.alternance ? L.findIndex((y, k) => !pris.has(k) && x.e.alternance.includes(nomDe(y.p))) : -1;   // « en alternance avec … » : par deux
      if (j < 0) blocs.push(`<li>${portrait(x, credits)}</li>`);
      else { pris.add(j); blocs.push(`<li class="cast-paire">${portrait(x, credits)}${portrait(L[j], credits)}</li>`); }
    });
    const n = L.length, cols = n <= 6 ? n : n <= 8 ? 4 : 5;   // le nombre de colonnes, pour ne laisser personne seul sur sa ligne
    return `<ul class="cast" style="--n:${n};--cols:${cols}">${blocs.join('')}</ul>`;
  }
  const fiche = (s, { duree = true, avec = true } = {}) => (s.fiche || []).map((x, i) => `<p class="fi">${x.libelle ? `<span class="fi-l"${edS(s, 'fiche', i, 'libelle')}>${esc(x.libelle)}</span>` : ''}<span class="fi-v"${edS(s, 'fiche', i, 'valeur')}>${x.valeur}</span></p>`).join('')
    + (s.avec && avec ? `<p class="fi fi-sep"><span class="fi-l"${edS(s, 'avec', 'libelle')}>${esc(s.avec.libelle)}</span><span class="fi-v"${edS(s, 'avec', 'valeur')}>${s.avec.valeur}</span></p>` : '')
    + (duree && s.duree ? `<p class="fi fi-sep"${edS(s, 'duree')}>${esc(s.duree)}</p>` : '')
    + (s.mentions || []).map((m, i) => `<p class="fi fi-m${i ? '' : ' fi-sep'}"${edS(s, 'mentions', i)}>${m}</p>`).join('')
    + (s.production || []).map((m, i) => `<p class="fi fi-m${i ? '' : ' fi-sep'}"${edS(s, 'production', i)}>${m}</p>`).join('');
  const credits = (s, ph) => {
    const c = [];
    if (ph.some(p => p.source !== 'dossier') && s.creditPhotos) c.push([s.creditPhotos, 'creditPhotos']);
    if (ph.some(p => p.source === 'dossier') && s.creditDossier) c.push([s.creditDossier, 'creditDossier']);
    return c.length ? `<p class="cred">${c.map(([x, k]) => `<span${edS(s, k)}>${esc(x)}</span>`).join('')}</p>` : '';
  };
  const legende = (t, chemin) => t ? `<span class="lg"${ed(chemin)}>${esc(t)}</span>` : '';
  const galerie = (s, ph, cls = '') => ph.length ? `<div class="gal${cls ? ' ' + cls : ''}">${ph.map(p => { const r = rangPh(s, p);
    return `<figure${r >= 0 ? edP(s, 'photos', r) : ''}>${img(p.cle, p.legende || s.titre)}${p.legende ? `<figcaption>${legende(p.legende, r >= 0 ? `shows.${s.slug}.photos.${r}.legende` : null)}</figcaption>` : ''}</figure>`; }).join('')}</div>${credits(s, ph)}` : '';

  /* ——— les vues ——— */
  function accueil() {
    const num = numeroter(D.dates), av = CARTE.aVenir(), dia = S.diaporama, s0 = S.saisons[0];
    const deja = new Set(av.map(x => x.l));
    const semis = [...new Set(Object.values(K.parSaison).flat().map(([l]) => l))].filter(l => !deja.has(l) && K.lieux[l]).map(l => ({ l, ...K.lieux[l] }));
    const paras = S.compagnie.paragraphes;
    const de = slug => dia.find(d => d.slug === slug);
    // l'image et le crédit de chaque entrée, avec leurs chemins dans D (édition sur place)
    const rangDe = (slug, i) => { const j = dia.findIndex(d => d.slug === slug); return j < 0 ? i : j; }, iv = rangDe('berenice', 0), ip = rangDe('mon-royaume', 1);
    const IMAGE = {
      voir: { cle: dia[iv].slug, credit: dia[iv].credit, k: `site.diaporama.${iv}.credit`, s: BY[dia[iv].slug] },
      programmer: { cle: dia[ip].slug, credit: dia[ip].credit, k: `site.diaporama.${ip}.credit`, s: BY[dia[ip].slug] },
      etablissement: { cle: 'actions-culturelles', credit: S.actions.credit, k: 'site.actions.credit' }
    };
    const html = `<div class="wrap home">
      <div class="rh"><h1 class="rh-t" tabindex="-1"${ed('site.nom')}>${esc(S.nom)}</h1><a class="rh-s" href="${esc(E.voir.href)}">${esc(s0.titre)}</a></div>
      <ul class="choix">${S.entrees.map(e => `<li class="ch" style="--ec:var(--e-${e.cle})">
        <a class="ch-a" href="${esc(e.href)}"><span class="ch-t"><span>${esc(e.texte)}</span>${ICON.r}</span><span class="ch-ph"${IMAGE[e.cle].s ? edP(IMAGE[e.cle].s, 'photo') : ''}>${img(IMAGE[e.cle].cle, '')}</span></a>
        ${IMAGE[e.cle].credit ? `<p class="ch-cr"${ed(IMAGE[e.cle].k)}>${esc(IMAGE[e.cle].credit)}</p>` : ''}</li>`).join('')}</ul>
      <section class="bill grid" aria-labelledby="h-bill">
        <div class="bill-l">
          <h2 class="lab bill-h" id="h-bill">${esc(L.enTournee)}</h2>
          <ul class="bill-list">${dia.map((d, i) => { const s = BY[d.slug]; return `<li><a class="bill-a${i ? '' : ' on'}" href="${esc(d.href)}" data-i="${i}"${s ? ` style="${varsPapier(s)}"` : ''}><span class="bill-t">${d.titre.map((t, j) => `<span${ed(`site.diaporama.${i}.titre.${j}`)}>${esc(t)}</span>`).join('')}</span><span class="bill-d">${s ? `<span class="bill-vg" aria-hidden="true">${vignette(s.univers.motif)}</span>${gamme(s)}` : ''}<span>${esc(d.bouton)}${ICON.r}</span></span></a></li>`; }).join('')}</ul>
        </div>
        <figure class="bill-ph"${BY[dia[0].slug] ? edP(BY[dia[0].slug], 'photo') : ''}>${img(dia[0].slug, dia[0].titre.join(' '))}<figcaption${ed('site.diaporama.0.credit')}>${esc(dia[0].credit)}</figcaption></figure>
      </section>
      <section class="sec lk" id="carte" aria-labelledby="h-carte">
        <h2 class="sec-h" id="h-carte">${esc(L.actuellementEnTournee)}</h2>
        <div class="sec-b grid">
          <div class="home-pl">${plate({ lieux: av, semis, num, label: L.actuellementEnTournee })}</div>
          <ul class="notes" data-agenda="">${D.dates.map(r => `<li data-date-id="${esc(r.id ?? '')}"${r.l != null ? ` data-l="${r.l}"` : ''}><span class="nt-n" aria-hidden="true">${num.get(r.l) ?? ''}</span><span class="nt-t">${esc(r.ligne)}</span><a class="nt-s" href="${lien(BY[r.slug] || { slug: r.slug }, r.scolaire ? 'etablissement' : 'voir')}">${esc(r.titre)}</a>${r.scolaire ? `<span class="nt-k">${esc(L.scolaire)}</span>` : ''}</li>`).join('')}</ul>
        </div>
      </section>
      <section class="sec" aria-labelledby="h-co">
        <h2 class="sec-h" id="h-co"${ed('site.compagnie.titre')}>${esc(S.compagnie.titre)}</h2>
        <div class="sec-b grid"><p class="lead"${ed(`site.compagnie.paragraphes.${paras.length - 1}`)}>${paras[paras.length - 1]}</p><p class="more"><a href="#/compagnie">${esc(menuTexte('compagnie'))}${ICON.r}</a></p></div>

    return {
      titre: S.accueil, html,
      apres() {
        const fig = main.querySelector('.bill-ph'), im = fig.querySelector('img'), cap = fig.querySelector('figcaption');

        lier(main.querySelector('#carte'));

      }

  }

  /* ——— je viens voir un spectacle : les prochaines dates, puis le programme des saisons passées, une table des matières ——— */
  const MOIS_ALT = ML.join('|');
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();

        <div class="cps" role="group" aria-label="${esc(L.spectacles)}">${puces.map(s => `<button class="cp" type="button" data-s="${esc(s.cle)}" aria-pressed="${s.cle === F.slug}">${esc(s.titre)}</button>`).join('')}</div>
      </div>
      <div class="grid ag lk">
        <div class="ag-l">${chip()}<div id="ag-liste">${listeProchaines()}</div></div>
        <div class="ag-m">${plate({ lieux: lieuxProch, num, label: s0.titre })}</div>
      </div>
      <section class="sec" id="v-agenda" aria-labelledby="h-prec"><h2 class="sec-h" id="h-prec">${esc(L.saisonsPrecedentes)}</h2>
        <nav class="ag-index" id="ag-index" aria-labelledby="h-prec"><div class="fr fr-saisons" id="idx-frise"></div><div class="idx-outils" id="idx-outils">${outilsHtml(vis0)}</div></nav>
        <div class="sai-liste" id="ag-saisons"></div>
      </section>
      <section class="sec" aria-labelledby="h-sp"><h2 class="sec-h" id="h-sp">${esc(L.lesSpectacles)}</h2>
        <ul class="sec-b cartes">${tournee.map(carte).join('')}</ul>
      </section>
    </div>`, apres() { AG.brancher(); } };
  }

  // pour programmer : les représentations (ou le statut), puis les faits, chacun avec son chemin dans D
  const repDe = s => { const P = s.programmer || {}; return P.representations ? `<p class="fp-rep"${edS(s, 'programmer', 'representations')}>${esc(P.representations)}</p>` : s.statut ? `<p class="fp-rep"${edS(s, 'statut')}>${esc(s.statut)}</p>` : ''; };
  const faitsDe = s => { const P = s.programmer || {}, duree = P.duree || s.duree, pr = (...k) => edS(s, 'programmer', ...k);
    return [duree && `<li${P.duree ? pr('duree') : edS(s, 'duree')}>${esc(duree)}</li>`, P.format && `<li><span class="lb">${esc(L.format)}</span><span${pr('format')}>${esc(P.format)}</span></li>`,
      P.jauge && `<li${pr('jauge')}>${esc(P.jauge)}</li>`, P.equipe && `<li${pr('equipe')}>${esc(P.equipe)}</li>`, P.actualite && `<li${pr('actualite')}>${esc(P.actualite)}</li>`,
      ...(P.equipeCreation || []).map((x, i) => `<li${pr('equipeCreation', i)}>${esc(x)}</li>`)].filter(Boolean); };
  function programmer() {
    const e = E.programmer;
    const fp = s => {
      const P = s.programmer || {}, faits = faitsDe(s);
      return `<li class="fp">
        ${cartouche(s, { cle: 'programmer', niveau: 2, haut: [[s.statut, 'statut'], [s.creation, 'creation']], photo: true })}
        <div class="fp-b">
          ${repDe(s)}
          ${faits.length ? `<ul class="fp-f">${faits.join('')}</ul>` : ''}
          ${diffusion(s.slug).length ? `<div class="fr fr-diff" data-diffusion="${esc(s.slug)}"></div>` : ''}
          ${s.programmer && s.programmer.equipeCreation ? '' : `<div class="fp-fi">${fiche(s, { duree: false }).replace(/ fi-sep/g, '')}</div>`}
          ${P.lieux ? `<details class="lx"><summary>${esc(L.lieuxDiffusion)}</summary><p${edS(s, 'programmer', 'lieux')}>${esc(P.lieux)}</p></details>` : ''}
          <p class="fp-l">${dossierBouton(s.slug)}${s.video ? `<span class="go">${ext(s.video.url, esc(L.bandeAnnonce))}</span>` : ''}<a class="go" href="${lien(s, 'programmer')}" aria-label="${esc(L.decouvrir)} : ${esc(s.titre)}">${esc(L.decouvrir)}${ICON.r}</a></p>
          ${docsDe(s, 'pros').length ? `<div class="fp-dl"><p class="fp-lb">${esc(L.aTelecharger)}</p>${listeDocs(docsDe(s, 'pros'))}</div>` : ''}
        </div>
      </li>`;
    };
    return { titre: e.texte, entree: 'programmer', html: `<div class="wrap" style="--ec:var(--e-programmer)">
      <header class="pg-h pg-h--e"><h1 class="pg-t" tabindex="-1">${esc(e.texte)}</h1>${contactHtml(null)}</header>
      <ol class="cat">${D.shows.map(fp).join('')}</ol>
      <section class="sec" aria-labelledby="h-diff"><h2 class="sec-h" id="h-diff">${esc(L.lieuxDiffusion)}</h2>
        <div class="fr fr-cie" id="p-diff"></div>
        <div class="sec-b grid"><div class="pl-seul">${plate({ tout: CARTE.tout(), label: L.lieuxDiffusion })}</div></div>
      </section>
      <section class="sec" aria-labelledby="h-ecr"><h2 class="sec-h" id="h-ecr">${esc(S.nom)}</h2>
        <div class="sec-b grid"><p class="part"${ed('site.partenaires')}>${S.partenaires}</p></div>${ecrire()}
      </section>
    </div>`, apres() {
      // la diffusion de la compagnie, saison par saison ; celle de chaque spectacle dans sa fiche, créée quand elle approche
      friseDiffusion(main.querySelector('#p-diff'), null, L.lieuxDiffusion, { classe: 'frise-diffusion frise-cie', anMin: 38 });
      frisesDiffusion(main);
    } };
  }
  // les frises de diffusion des fiches : créées quand leur fiche arrive près de l'écran (le visible d'abord)
  let ioDiffusion = null;
  function frisesDiffusion(racine) {
    const creer = c => { const s = BY[c.dataset.diffusion]; if (s && c.isConnected && !c.firstElementChild) friseDiffusion(c, s.slug, `${s.titre} – ${L.dates}`, { largeur: Math.min(diffusion(s.slug).length * 72, largeurWrap() * .55) }, true); };
    const cs = [...racine.querySelectorAll('[data-diffusion]')];
    if (ioDiffusion) ioDiffusion.disconnect();
    if (EN_PLACE || !('IntersectionObserver' in window)) { cs.forEach(creer); return; }
    cs.slice(0, 2).forEach(creer);
    ioDiffusion = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { ioDiffusion.unobserve(x.target); creer(x.target); } }), { rootMargin: '400px 0px' });
    cs.slice(2).forEach(c => ioDiffusion.observe(c));
  }

  function etablissement() {
    const e = E.etablissement, rows = D.dates.filter(d => d.scolaire), num = numeroter(rows), A = S.actions;
    const fe = s => {
      const C = s.actionCulturelle || {}, T = teinte(s);
      const ac = (...k) => edS(s, 'actionCulturelle', ...k);
      const tags = [C.public && `<span><span class="lb">${esc(L.public)}</span><span${ac('public')}>${esc(C.public)}</span></span>`, C.statut && `<span${ac('statut')}>${esc(C.statut)}</span>`].filter(Boolean);
      const t0 = (C.textes || [])[0];
      return `<li class="fp">
        ${cartouche(s, { cle: 'etablissement', haut: [[s.creation, 'creation']], photo: true })}
        <div class="fp-b">
          ${C.type && !C.aCompleter ? `<p class="fe-type" style="--h2:${T.hp}"${ac('type')}>${esc(C.type)}</p>` : ''}
          ${tags.length ? `<p class="fe-tags">${tags.join('')}</p>` : ''}
          ${t0 ? `<p class="fe-x"${ac('textes', 0, 'texte')}>${t0.texte}</p>` : ''}
          ${(C.formule || []).length ? `<ul class="fo">${C.formule.map((x, i) => `<li${ac('formule', i)}>${esc(x)}</li>`).join('')}</ul>` : ''}
          ${(C.dispositifs || []).length ? `<div class="di"><p class="fp-lb">${esc(L.dispositifs)}</p><ul>${C.dispositifs.map((x, i) => `<li${ac('dispositifs', i)}>${x}</li>`).join('')}</ul></div>` : ''}
          <p class="fp-l"><a class="go" href="${lien(s, 'etablissement')}" aria-label="${esc(L.decouvrir)} : ${esc(s.titre)}">${esc(L.decouvrir)}${ICON.r}</a>${C.dossier ? `<a class="go" href="${lien(s, 'etablissement')}">${esc(L.dossierScolaire)}${ICON.r}</a>` : ''}</p>
        </div>
      </li>`;
    };
    const lieux = [['etablissement', L.lieu.etablissement], ['salle', L.lieu.salle]];
    const autres = D.shows.filter(s => s.actionCulturelle && !lieux.some(([k]) => s.actionCulturelle.lieu === k));   // sans action culturelle : pas ici (règle 14)
    const photosAC = ['actions-culturelles/g-1', 'actions-culturelles/g-2', 'actions-culturelles/g-3', 'actions-culturelles/g-4'].filter(k => D.photos[k]);
    return { titre: e.texte, entree: 'etablissement', html: `<div class="wrap" style="--ec:var(--e-etablissement)">
      <header class="pg-h pg-h--e"><h1 class="pg-t" tabindex="-1">${esc(e.texte)}</h1></header>
      <div class="grid sec-b"><p class="lead"${ed('site.ecole.texte')}>${esc(S.ecole.texte)}</p></div>
      ${lieux.map(([k, t]) => { const ss = D.shows.filter(s => (s.actionCulturelle || {}).lieu === k); return ss.length ? `<section class="sec" aria-labelledby="h-l-${k}"><h2 class="sec-h" id="h-l-${k}">${esc(t)}</h2><ol class="cat">${ss.map(fe).join('')}</ol></section>` : ''; }).join('')}
      ${autres.length ? `<section class="sec" aria-labelledby="h-l-x"><h2 class="sec-h" id="h-l-x">${esc(L.aCompleter)}</h2><ol class="cat">${autres.map(fe).join('')}</ol></section>` : ''}
      <section class="sec" aria-labelledby="h-ac"><h2 class="sec-h" id="h-ac"${ed('site.actions.titre')}>${esc(A.titre)}</h2>
        <div class="sec-b grid ac">
          <div class="ac-txt prose">${A.blocs.map((b, i) => sous(bloc(b, `site.actions.blocs.${i}`))).join('')}</div>
          <figure class="ac-ph">${img('actions-culturelles', A.titre)}${A.credit ? `<figcaption${ed('site.actions.credit')}>${esc(A.credit)}</figcaption>` : ''}</figure>
          ${photosAC.length ? `<div class="ac-g">${photosAC.map(k => img(k, A.titre)).join('')}</div>` : ''}
        </div>
      </section>
      ${rows.length ? `<section class="sec" aria-labelledby="h-sco"><h2 class="sec-h" id="h-sco">${esc(L.enEtablissement)}</h2>
        <div class="fr" id="e-frise"></div>
        <div class="grid ag lk" id="sco">
          <div class="ag-l">${chip()}${groupes(rows, num, { vers: 'etablissement', fidDe: cleProchaine })}</div>
          <div class="ag-m">${plate({ lieux: CARTE.aVenir('scolaire'), num, label: L.enEtablissement })}</div>
        </div></section>` : ''}
      ${ecrire()}
    </div>`, apres() {
      const sco = main.querySelector('#sco');
      lier(sco, { filtre: true });
      // la frise des dates scolaires à venir, du mois en cours à la dernière, reliée à la liste et à la planche
      if (sco) frise(main.querySelector('#e-frise'), { echelle: 'periode', debut: `${D.aujourdhui.slice(0, 7)}-01`, points: rows.map(repereProchaine), libelle: L.enEtablissement,
        relier: { liste: sco, carte: sco.querySelector('svg.pl') }, choix: p => allerLigne(p.id) });
    } };
  }

  function spectacles() {
    return { titre: menuTexte('spectacles'), onglet: 'spectacles', html: `<div class="wrap">
      <header class="pg-h"><h1 class="pg-t" tabindex="-1">${esc(L.spectacles)}</h1></header>
      <ul class="rep">${D.shows.map(s => `<li class="rp" style="${varsPapier(s)}">
        <span class="rp-ph"${edP(s, 'photo')}>${img(s.slug, '')}</span>
        <div class="rp-b">${s.statut ? `<p class="lab rp-k"${edS(s, 'statut')}>${esc(s.statut)}</p>` : ''}<h2 class="rp-t"><a href="${lien(s)}"${edS(s, 'titre')}>${esc(s.titre)}</a></h2>${s.sousTitre ? `<p class="rp-s"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}${s.lieuTemps ? `<p class="rp-lt"${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</p>` : ''}</div>
        <p class="rp-c"><span${edS(s, 'creation')}>${esc(s.creation)}</span>${gamme(s)}</p></li>`).join('')}</ul>
    </div>` };
  }

  function saison(id) {
    const Z = D.saisons[id], num = numeroter(Z.spectacles.flatMap(g => g.dates));
    // le rang de chaque ligne dans la saison (dans l'ordre de D) : la clé de son repère, comme dans l'agenda passé
    const rang = new Map(); let n = 0; Z.spectacles.forEach(g => (g.dates || []).forEach(d => rang.set(d, n++)));
    const titreDe = g => (g.slug && BY[g.slug] ? BY[g.slug].titre : g.titre);
    return { titre: Z.titre, entree: 'voir', etat: 'true', html: `<div class="wrap" style="--ec:var(--e-voir)">
      <header class="pg-h pg-h--e"><h1 class="pg-t" tabindex="-1">${esc(Z.titre)}</h1></header>
      <div class="fr fr-saison" id="sa-frise"></div>
      <div class="grid ag lk">
        <div class="ag-l">${chip()}
          ${Z.spectacles.map(g => `<section class="grp ss">
            <h2 class="ss-t">${g.slug && BY[g.slug] ? `<a href="${lien(BY[g.slug], 'voir')}">${esc(g.titre)}</a>` : esc(g.titre)}</h2>
            ${g.sousTitre ? `<p class="ss-st">${g.sousTitre}</p>` : ''}${g.creation ? `<p class="ss-c">${esc(g.creation)}</p>` : ''}
            <ul class="dls" data-agenda="">${g.dates.map(r => ligne(r, num, { show: false, fid: cleLigne(r, id, rang.get(r)) })).join('')}</ul></section>`).join('')}
        </div>
        <div class="ag-m">${plate({ lieux: CARTE.saison(id), num, label: Z.titre })}</div>
      </div>
      ${saisonsNav(id)}
    </div>`, apres() {
      const ag = main.querySelector('.ag');
      lier(ag, { filtre: true });
      // la frise de la saison : toutes ses dates (scolaires en losange creux, annulées barrées), reliées à la liste et à la planche
      const pts = Z.spectacles.flatMap(g => (g.dates || []).map(d => repereLigne(d, id, rang.get(d), g.slug, titreDe(g)))).filter(Boolean);
      frise(main.querySelector('#sa-frise'), { echelle: 'saison', saison: id, points: pts, libelle: Z.titre, moisMin: 88, relier: { liste: ag, carte: ag.querySelector('svg.pl') }, choix: p => allerLigne(p.id) });
    } };
  }

  /* ——— la page d'un spectacle : un en-tête d'univers commun, les trois onglets d'entrée ——— */
  function spectacle(s, cle) {
    const T = teinte(s), C = s.actionCulturelle || {}, sp = CARTE.spectacle(s.slug), motif = s.univers.motif;
    const k = [['statut', s.statut], ['creation', s.creation], ['lieuTemps', s.lieuTemps]].filter(x => x[1]).map(([c, t]) => `<span${edS(s, c)}>${esc(t)}</span>`).join('<span class="sep" aria-hidden="true">·</span>');
    const typeAC = C.aCompleter ? L.aCompleter : C.type, edAC = C.aCompleter ? '' : edS(s, 'actionCulturelle', 'type');
    const tete = `<header class="wrap show-h">
        <p class="lab show-k">${k}</p>
        <h1 class="show-t" tabindex="-1">${s.titreLignes.map((l, i) => `<span${edS(s, 'titreLignes', i)}>${esc(l)}</span>`).join('<br>')}</h1>
        ${s.sousTitre ? `<p class="show-st"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}
        ${s.genre && s.genre !== s.sousTitre ? `<p class="show-st"${edS(s, 'genre')}>${esc(s.genre)}</p>` : ''}
        ${s.cadre ? `<p class="show-cadre"${edS(s, 'cadre')}>${esc(s.cadre)}</p>` : ''}
        ${s.accroche ? `<p class="show-acc"${edS(s, 'accroche')}>${esc(s.accroche)}</p>` : ''}
        ${typeAC ? `<p class="show-ac"><span class="lab">${esc(L.actionCulturelle)}</span>${cle === 'etablissement' ? `<span${edAC}>${esc(typeAC)}</span>` : `<a href="${lien(s, 'etablissement')}"${edAC}>${esc(typeAC)}</a>`}</p>` : ''}
        <span class="show-vg${LARGE.has(motif) ? ' vg-large' : ''}">${vignette(motif)}</span>
      </header>
      <figure class="wrap show-ph"${edP(s, 'photo')}>${img(s.slug, s.titre)}${s.credit ? `<figcaption${edS(s, 'credit')}>${esc(s.credit)}</figcaption>` : ''}</figure>
      <nav class="wrap tabs" aria-label="${esc(s.titre)}"><ul>${S.entrees.filter(e => e.cle !== 'etablissement' || s.actionCulturelle).map(e => `<li><a href="${lien(s, e.cle)}"${e.cle === cle ? ' aria-current="page"' : ''}>${esc(e.court)}</a></li>`).join('')}</ul></nav>`;
    const corps = cle === 'programmer' ? ongletProgrammer(s, sp) : cle === 'etablissement' ? ongletEtablissement(s, sp) : ongletVoir(s, sp);
    const fin = `<div class="fin">${vignette(motif)}<p${ed('site.nom')}>${esc(S.nom)}</p></div>`;
    return { titre: cle === 'voir' ? s.titre : `${s.titre} - ${E[cle].court}`, entree: cle, etat: 'true', univers: s,
      html: `<article class="show">${tete}<div class="wrap corps-sp">${corps}${fin}</div></article>`,
      apres() {
        ['#tournee', '#sco', '#diff'].forEach(id => lier(main.querySelector(id), { filtre: false }));
        const relie = c => ({ liste: c.closest('.sec'), carte: c.closest('.sec').querySelector('svg.pl') });
        // voir : la frise de sa tournée, toutes ses dates, passées et à venir, et aujourd'hui
        const ft = main.querySelector('#t-frise'), pts = ft ? reperesTournee(s.slug, s.titre) : [];
        if (pts.length) frise(ft, { echelle: 'periode', points: pts, libelle: `${s.titre} – ${L.dates}`, relier: relie(ft), choix: p => allerLigne(p.id) });
        // programmer : sa diffusion au fil des saisons
        const fd = main.querySelector('#p-diff');
        if (fd) friseDiffusion(fd, s.slug, `${s.titre} – ${L.lieuxDiffusion}`, { classe: 'frise-diffusion frise-sp', anMin: 44 });
        // établissement : ses dates scolaires à venir
        const fs = main.querySelector('#s-frise'), sco = D.dates.filter(d => d.slug === s.slug && d.scolaire);
        if (fs && sco.length) frise(fs, { echelle: 'periode', debut: `${D.aujourdhui.slice(0, 7)}-01`, points: sco.map(repereProchaine), libelle: L.enEtablissement, relier: relie(fs), choix: p => allerLigne(p.id) });
      } };
  }

  function ongletVoir(s, sp) {
    const rows = D.dates.filter(d => d.slug === s.slug && !d.scolaire), num = numeroter(rows);
    const lieux = sp.aVenir.map(x => ({ ...x, dates: x.dates.filter(d => !d.scolaire) })).filter(x => x.dates.length);
    const ph = (s.photos || []).filter(p => !p.etablissement && !p.atelier);
    const af = (s.affirmations || []).length ? `<div class="af">${s.affirmations.map((a, i) => `<p${edS(s, 'affirmations', i, 'texte')}>${esc(a.texte)}</p>`).join('')}</div>` : '';
    const cit = (s.citations || []).length ? `<div class="sec-b grid"><div class="ci">${s.citations.map((c, i) => `<figure${c.prose ? ' class="pr"' : ''}><blockquote><p>${c.vers.map((v, j) => `<span class="v"${edS(s, 'citations', i, 'vers', j)}>${esc(v)}</span>`).join('')}</p></blockquote>${c.source ? `<figcaption${edS(s, 'citations', i, 'source')}>${esc(c.source)}</figcaption>` : ''}</figure>`).join('')}</div></div>` : '';
    const sansListe = `<div data-agenda="${esc(s.slug)}"></div>`;   // sans date à venir : en mode édition, on y ajoute la première
    let tour;
    if (rows.length) tour = `<section class="sec lk" id="tournee" aria-labelledby="h-tour"><h2 class="sec-h" id="h-tour"${(s.tournee || {}).titre ? edS(s, 'tournee', 'titre') : ''}>${esc((s.tournee || {}).titre || L.actuellementEnTournee)}</h2>
      <div class="fr fr-tournee" id="t-frise"></div>
      <div class="sec-b grid"><ul class="dls show-dls" data-agenda="${esc(s.slug)}">${rows.map(r => ligne(r, num, { show: false, fid: cleProchaine(r) })).join('')}</ul>
      <div class="show-pl">${plate({ lieux, passe: sp.passe, num, label: (s.tournee || {}).titre || L.actuellementEnTournee })}</div></div></section>`;
    else if (s.tournee && s.tournee.texte) tour = `<section class="sec" aria-labelledby="h-tour"><h2 class="sec-h" id="h-tour">${esc(L.dates)}</h2>
      <div class="sec-b grid"><p class="show-ann"><span class="lab"${edS(s, 'tournee', 'titre')}>${esc(s.tournee.titre)}</span><span${edS(s, 'tournee', 'texte')}>${esc(s.tournee.texte)}</span></p><div class="show-pl">${plate({ passe: sp.passe, label: s.tournee.titre })}</div></div>${sansListe}</section>`;
    else tour = `<section class="sec" aria-labelledby="h-tour"><h2 class="sec-h" id="h-tour">${esc(L.saisonsPrecedentes)}</h2>
      <div class="fr fr-tournee" id="t-frise"></div>
      <div class="sec-b grid"><div class="pl-seul">${plate({ passe: sp.passe, label: L.saisonsPrecedentes })}</div></div>${sansListe}</section>`;
    const cast = portraits(s);   // les portraits remplacent la ligne « avec »
    return `${af}
      <section class="sec" aria-labelledby="h-le"><h2 class="sec-h" id="h-le">${esc(L.leSpectacle)}</h2>
        <div class="sec-b grid"><div class="txt">${(s.texte || []).map((p, i) => `<p${edS(s, 'texte', i)}>${p}</p>`).join('')}${s.video ? `<p class="va">${ext(s.video.url, esc(L.bandeAnnonce))}</p>` : ''}</div></div>
        ${cit}
      </section>
      ${ph.length ? `<section class="sec" aria-labelledby="h-ph"><h2 class="sec-h" id="h-ph">${esc(L.photos)}</h2><div class="sec-b">${galerie(s, ph)}</div></section>` : ''}
      ${tour}

  /* ——— le cadre commun : la marque, les trois entrées, le menu second, le pied de page (refait si D change) ——— */
  const octo = document.getElementById('octo'), ent = document.getElementById('ent'), entL = document.getElementById('ent-l'), hdr = document.querySelector('.site-h');

  function cadre() {
    if (octo.dataset.src !== D.logo.octopus) {
      octo.dataset.src = D.logo.octopus;

    <div class="f-c"><p><span class="f-n"${ed('site.coordonnees.nom')}>${esc(co.nom)}</span>${co.adresse.map((a, i) => `<span class="f-a"${ed(`site.coordonnees.adresse.${i}`)}>${esc(a)}</span>`).join('')}</p></div>

  let hauteurTete = 118;
  const ajuster = () => { ent.classList.remove('court'); if ([...ent.querySelectorAll('.e-l')].some(t => t.offsetParent && t.scrollWidth > t.clientWidth + 1)) ent.classList.add('court'); hauteurTete = hdr.offsetHeight; };
  // le menu (téléphone) : ses lignes s'impriment l'une après l'autre à l'ouverture
  const menu = open => { const avant = nav.classList.contains('open'); nav.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); if (open && !avant && MV) MV.cascade(navL, { pas: 34, duree: 280, decalage: 0 }); };
  btn.addEventListener('click', () => menu(!nav.classList.contains('open')));

  document.getElementById('foot').addEventListener('click', e => { if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') EDITION.ouvrir(); });

  /* l'univers d'un spectacle habille toute la page : le papier, l'encre, l'accent, la lueur */
  function habiller(s) {
    const b = document.body;
    if (!s) { b.className = ''; b.setAttribute('style', couleursEntrees(PAPIER)); return; }
    const T = teinte(s);
    b.className = 'u ' + (T.clair ? 'u-clair' : 'u-sombre');
    b.setAttribute('style', `--paper:${T.f};--paper2:${T.f2};--ink:${T.t};--ink2:${T.t2};--rule:${T.rule};--mag:${T.at};--acc:${T.a};--titre:${T.h};--lueur:${T.l};${police(T)};color-scheme:${T.clair ? 'light' : 'dark'};${couleursEntrees(T.f)}`);
  }

  const VUES = { '': accueil, voir, programmer, etablissement, spectacles, compagnie, contact,
    'mentions-legales': () => legal('mentions-legales'), 'politique-de-confidentialite': () => legal('politique-de-confidentialite') };
  // enPlace : la même vue refaite après un changement de D (pas de retour en haut, pas de focus, pas d'animation d'entrée)
  let EN_PLACE = false;

  /* la page qu'on tourne : la nouvelle page se pose d'un rien de la droite (de la gauche au retour) pendant que le pli de la
     feuille passe dessus ; un geste (pointeur, clavier, molette) finit tout de suite ce qui bouge encore */
  let feuille = [];
  const finir = () => { const a = feuille; feuille = []; a.forEach(x => { try { x.finish(); } catch (err) { /* déjà finie */ } }); };
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => addEventListener(t, () => { if (feuille.length) finir(); }, { capture: true, passive: true }));
  function tourner(sens) {
    finir();
    if (!bouge() || !main.animate) return;
    const w = innerWidth, haut = innerWidth < 640 ? 61 : hauteurTete;
    const pli = document.createElement('div');
    pli.className = 'pli' + (sens < 0 ? ' pli-retour' : '');
    pli.setAttribute('aria-hidden', 'true');
    pli.style.top = `${haut}px`;
    document.body.appendChild(pli);
    const lw = Math.min(w * .3, 360), de = sens > 0 ? w : -lw, a = sens > 0 ? -lw : w;
    // la feuille se pose : son bord libre (à droite, à gauche au retour), encore levé, retombe à plat sur la page
    main.style.transformOrigin = `${sens > 0 ? 0 : w}px ${Math.round(innerHeight / 2)}px`;
    feuille = [
      main.animate([{ transform: `perspective(2400px) rotateY(${-9 * sens}deg)`, opacity: .3 }, { opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: 400, easing: 'cubic-bezier(.2,.7,.25,1)' }),
      pli.animate([{ transform: `translateX(${de}px)`, opacity: 1 }, { opacity: 1, offset: .65 }, { transform: `translateX(${a}px)`, opacity: 0 }], { duration: 380, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'both' }),
    ];
    const fin = () => pli.remove();
    feuille[1].onfinish = fin; feuille[1].oncancel = fin;
    feuille[0].onfinish = () => { main.style.transformOrigin = ''; };
  }
  /* après le rendu : les filets des rubriques se tireront à la règle, les intertitres s'encreront, les fiches s'imprimeront
     l'une après l'autre (MOUVEMENT.reveler) ; rien ne bouge quand la vue est refaite en place */
  function decorer(enPlace) {
    main.querySelectorAll('.sec, .fp').forEach(sec => { if (!sec.querySelector(':scope > .filet')) sec.insertAdjacentHTML('afterbegin', '<span class="filet" data-mv="trace" aria-hidden="true"></span>'); });
    main.querySelectorAll('.sec-h, .ss-t').forEach(h => { if (!h.closest('[data-mv]')) { h.setAttribute('data-mv', 'encre'); h.setAttribute('data-mv-delai', '160'); } });
    main.querySelectorAll('.cartes, .rep, .cast, .gal, .ac-g, .ep-toc, .choix').forEach(e => { if (!e.closest('[data-mv]')) e.setAttribute('data-mv', 'cascade'); });
    if (MV) MV.reveler(main, { immediat: enPlace });
  }
  // le sens de la lecture : en avant, ou en arrière quand on revient à la page d'avant
  const pile = [];
  let courant = null;
  function route(enPlace = false) {
    EN_PLACE = enPlace;
    relire();
    PL.clear();
    const brut = (location.hash || '#/').replace(/\/+$/, '');
    let path = brut.replace(/^#\/?/, '').split('?')[0];
    // une vue l'emporte sur une redirection de D (#/espace-pro, autrefois redirigé, est une page)
    if (Object.prototype.hasOwnProperty.call(S.redirections, brut) && !(path === 'espace-pro' && S.espacePro)) { location.replace(S.redirections[brut]); return; }
    try { path = decodeURIComponent(path); } catch (err) { path = '\u0000'; }
    const [a, b, c, d] = path.split('/');
    let v = null;
    FRISES.forEach(f => f.detruire()); FRISES = []; AG = null;
    if (a === 'spectacle' && BY[b] && !d) {
      if (!c) { location.replace(`#/spectacle/${b}/${entreeSp(BY[b], retenue() || 'voir')}`); return; }
      if (c === 'etablissement' && !BY[b].actionCulturelle) { location.replace(`#/spectacle/${b}/voir`); return; }   // sans action culturelle : « voir »
      if (E[c]) v = spectacle(BY[b], c);
    } else if (a === 'agenda' && b === D.saison && !c) { location.replace(E.voir.href); return; }
    else if (a === 'agenda' && b && D.saisons[b] && !c) v = saison(b);
    else if (!b && a === 'espace-pro' && S.espacePro) v = espacePro();
    else if (!b && Object.prototype.hasOwnProperty.call(VUES, a)) v = VUES[a]();
    if (!v) { v = accueil(); try { history.replaceState(null, '', '#/'); } catch (err) { /* adresse laissée telle quelle */ } }
    const h = location.hash || '#/', avant = courant;
    // d'un onglet à l'autre du même spectacle, l'en-tête ne se réimprime pas : seul le filet de l'onglet se tire
    const onglet = !enPlace && a === 'spectacle' && avant && avant !== h && avant.startsWith(`#/spectacle/${b}/`);
    let sens = 1;
    if (!enPlace) {
      const retour = pile.length > 1 && pile[pile.length - 2] === h;
      if (retour) { pile.pop(); sens = -1; } else if (pile[pile.length - 1] !== h) pile.push(h);
      if (pile.length > 60) pile.splice(0, pile.length - 60);
    }
    if (v.entree && !v.etat || v.univers) retenir(v.entree);
    habiller(v.univers || null);
    main.classList.toggle('en-place', enPlace);
    main.classList.toggle('meme-sp', !!onglet);
    main.innerHTML = v.html;
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    ent.querySelectorAll('a[data-e]').forEach(x => { if (x.dataset.e === v.entree) x.setAttribute('aria-current', v.etat || 'page'); else x.removeAttribute('aria-current'); });
    navL.querySelectorAll('a[data-id]').forEach(x => { if (x.dataset.id === v.onglet) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
    if (!enPlace) menu(false);
    if (v.apres) v.apres();
    decorer(enPlace);
    courant = h;
    if (enPlace) { poserTout(main); return; }
    // à l'image suivante, avant qu'elle soit peinte : les planches posées à leur taille (une seule mise en page, dans l'image),
    // la vue remonte en haut et son titre prend le focus
    requestAnimationFrame(() => { poserTout(main); window.scrollTo(0, 0); const h1 = main.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); });
    if (avant !== null && !onglet && !INTRO.ouverte()) tourner(sens);
  }

  /* la base a changé D : la vue courante est refaite en place. On garde la position de lecture, l'élément qui a le focus,
     ce qui a été saisi dans un formulaire et les volets ouverts ; ni l'ouverture ni les animations d'entrée ne sont rejouées. */
  const ZONES = ['#main', '.site-h', '.site-f'];
  function repere(el) {
    if (!el || el === document.body || !document.contains(el)) return null;
    if (el.id) return { id: el.id };
    const zone = ZONES.find(z => el.closest(z));
    if (!zone) return null;
    const attr = ['href', 'data-l', 'data-e', 'data-id', 'data-i', 'for'].find(x => el.hasAttribute(x));
    const val = attr ? el.getAttribute(attr) : '';
    const sel = el.tagName.toLowerCase() + (attr ? `[${attr}="${window.CSS && CSS.escape ? CSS.escape(val) : val.replace(/["\\]/g, '\\$&')}"]` : '');
    return { zone, sel, i: [...document.querySelector(zone).querySelectorAll(sel)].indexOf(el) };
  }
  function retrouver(k) {
    if (!k) return null;
    if (k.id) return document.getElementById(k.id);
    const zone = document.querySelector(k.zone);
    return zone ? zone.querySelectorAll(k.sel)[Math.max(0, k.i)] || null : null;
  }
  function rafraichir() {
    const actif = document.activeElement, k = repere(actif), x = window.scrollX, y = window.scrollY;
    const champs = [...main.querySelectorAll('input[id], textarea[id]')].map(f => ({ id: f.id, v: f.value, c: f.checked }));
    let sel = null;
    try { if (actif && actif.matches('input[id], textarea[id]') && actif.selectionStart != null) sel = [actif.selectionStart, actif.selectionEnd]; } catch (err) { sel = null; }
    const ouverts = [...main.querySelectorAll('details')].map(d => d.open);
    cacheAP = null;
    relire();
    cadre();
    route(true);
    champs.forEach(f => { const n = document.getElementById(f.id); if (n) { n.value = f.v; n.checked = f.c; } });
    main.querySelectorAll('details').forEach((d, i) => { if (ouverts[i]) d.open = true; });
    ajuster();
    window.scrollTo(x, y);
    const el = retrouver(k);
    if (el && el !== document.activeElement) {
      el.focus({ preventScroll: true });
      if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (err) { /* champ sans sélection */ }
    }
  }

  main.addEventListener('submit', e => e.preventDefault());
  document.querySelector('.skip').addEventListener('click', e => { e.preventDefault(); (main.querySelector('h1') || main).focus(); });
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) { e.preventDefault(); route(); }
  });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { ajuster(); poserTout(main); }, 120); });
  // les tentacules : aucune réaction aux gestes ni aux pages (règle 15) ; la pieuvre ne joue aucun moment, le tampon en tient lieu
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'trait', neutre: '#a8306f', clic: false, pages: false });
  // la pression : le foulage, dès le pointerdown
  if (MV) MV.presse(document);
  addEventListener('hashchange', () => route());
  relire();
  cadre();
  document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><path id="m01-pays" d="${CARTE.fond.pays}"/></defs></svg>`);
  route();
  ajuster();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);
  if (typeof DONNEES !== 'undefined' && DONNEES.surChangement) DONNEES.surChangement(rafraichir);
  // pendant les temps morts, l'agenda passé est lu d'avance
  ('requestIdleCallback' in window ? requestIdleCallback : f => setTimeout(f, 400))(() => agendaPasse());
  INTRO.ouvrir({ fond: '#f6f2ec', encre: '#1c1917', mot: true, classe: 'programme' });
})();
</script>
