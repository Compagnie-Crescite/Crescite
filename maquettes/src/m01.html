<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Space+Grotesk:wght@600&family=Cormorant+Garamond:wght@600&family=Bodoni+Moda:wght@700&family=Anton&family=Ubuntu:wght@700&family=Grenze+Gotisch:wght@600&family=IM+Fell+English&family=IM+Fell+French+Canon&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2ec;--paper2:#efe8dd;--paper-blanc:#fffdf8;--ink:#1c1917;--ink2:#57514a;--rule:#d8d0c4;--mag:#a8306f;
  --acc:#a8306f;--titre:#1c1917;--lueur:transparent;--ff:"Newsreader";--fw:400;
  --e-voir:#c2306f;--e-programmer:#8a6410;--e-etablissement:#127a6a;
  --m:clamp(16px,5.5vw,80px);--g:32px;
  --s1:.875rem;--s2:1.75rem;--s3:2.625rem;--s4:3.5rem;
  --sec:clamp(4rem,2.8rem + 4vw,7rem);
  --fs-s:1rem;--fs-b:1.125rem;--fs-m:1.5rem;--fs-l:2rem;
  --fs-xl:clamp(2rem,1.25rem + 2.4vw,3.25rem);
  --fs-pg:clamp(2.5rem,1.4rem + 3.6vw,5rem);
  --fs-show:clamp(2.75rem,1.4rem + 5vw,6.5rem);
  /* l'édition sur place (EDITION) : la barre, la connexion et le panneau des dates imprimés comme le programme */
  --ed-fond:#f6f2ec;--ed-encre:#1c1917;--ed-gris:#57514a;--ed-accent:#a8306f;--ed-sur-accent:#ffffff;
  --ed-police:"Newsreader",Georgia,"Times New Roman",serif;--ed-rayon:0px;--ed-trait:#cfc6b8;
  --ed-ombre:rgba(28,25,23,.3);--ed-ombre-forte:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* le papier : une couche fixe, peinte une fois ; sur toute la hauteur de la page, il se repeignait à chaque changement de
   page (plus de 200 ms au bureau) */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--paper2) 42%,transparent),transparent 72%),repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--ink) 1.3%,transparent) 3px 4px)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:var(--fs-b);line-height:1.75rem;font-weight:400;font-optical-sizing:auto;font-kerning:normal;font-variant-numeric:oldstyle-nums proportional-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
p,h1,h2,h3,h4,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:var(--rule)}
@media (hover:hover){a:hover{color:var(--mag);text-decoration-color:currentColor}.menu:hover,.brand:hover .brand-n{color:var(--mag)}}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
main:focus,h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--m);top:-4rem;background:var(--paper);padding:.5rem 0;z-index:60}
.skip:focus{top:.5rem}
.lab{font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520}
.ar{display:inline-block;flex:none;width:.9em;height:.5em;margin-left:.45em;vertical-align:.04em;fill:none;stroke:currentColor;stroke-width:1.2;overflow:visible}
.ar-ne{width:.5em;height:.5em;margin-left:.3em;vertical-align:.1em}
.ar-x{width:.55em;height:.55em;margin-left:.6em;vertical-align:.02em}
.wrap{width:min(1120px,100% - 2*var(--m));margin-inline:auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g)}
.sep{margin-inline:.45em}

/* les tentacules (tentacules.js) : la pieuvre du logo guide ; gravées, comme tout le programme : un trait à hachures à l'encre du moment (le papier d'un
   spectacle change l'encre), l'accent pour les empreintes */
body{--tt-encre:var(--ink);--tt-accent:var(--mag);--tt-epaisseur:2.2}

/* en-tête : la marque et le menu second, puis les trois entrées, comme les trois rubriques d'un programme */
.site-h{background:var(--paper);border-bottom:2px solid var(--ink);box-shadow:0 3px 0 var(--paper),0 4px 0 var(--rule)}
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:var(--g)}
.brand{grid-area:1/1;justify-self:start;display:flex;align-items:center;gap:.75rem;min-height:3.75rem;color:var(--ink);text-decoration:none}
.brand:hover{color:var(--ink)}
.octo{display:block;width:34px}
.octo svg{display:block;width:100%;height:auto}
.octo svg path{fill:currentColor}
.brand-n{font-weight:500}
.nav{grid-area:1/2}
.nav ul{display:flex;gap:1.75rem}
.nav a{display:inline-flex;align-items:center;min-height:2.75rem;padding:.5rem 0;font-size:var(--fs-s);line-height:1.5rem;font-variant-caps:all-small-caps;letter-spacing:.11em;font-weight:520;color:var(--ink2);text-decoration:none}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -1px 0 currentColor}
.menu{grid-area:1/2;display:none;align-items:center;min-height:2.75rem;font:inherit;font-variant-caps:all-small-caps;letter-spacing:.11em;font-weight:520;color:var(--ink);background:none;border:0;padding:.5rem .25rem;cursor:pointer}
.menu[aria-expanded="true"]{color:var(--mag)}
.ent{grid-area:2/1/3/3;border-top:1px solid var(--rule)}
.ent ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.ent li{display:flex;min-width:0}
.ent li + li{border-left:1px solid var(--rule)}
.ent a{position:relative;flex:1;min-width:0;min-height:2.75rem;display:flex;align-items:center;gap:.65rem;padding:.8rem 1.1rem .95rem;font-size:1.25rem;line-height:1.75rem;font-style:italic;color:var(--ink);text-decoration:none}
.ent li:first-child a{padding-left:0}
.ent li:last-child a{padding-right:0}
.ent a::before{content:"";flex:none;width:.5rem;height:.5rem;background:var(--ec)}
.ent .e-l,.ent .e-c{min-width:0;overflow:hidden;white-space:nowrap}
.ent .e-c,.ent.court .e-l{display:none}
.ent.court .e-c{display:block}
.ent a[aria-current]{color:var(--ec)}
.ent a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ec)}
@media (hover:hover){.ent a:hover{color:var(--ec)}}

/* titres de page */
.pg-h{padding-top:var(--sec)}
.pg-h--e::before{content:"";display:block;width:3rem;height:3px;margin-bottom:var(--s2);background:var(--ec)}
.pg-k{margin-bottom:var(--s1);color:var(--ec)}
.pg-t{font-size:var(--fs-pg);line-height:1.04;font-weight:400;letter-spacing:-.018em;text-wrap:balance}
.sec{margin-top:var(--sec);border-top:1px solid var(--ink);padding-top:var(--s1)}
.sec-h{font-size:var(--fs-m);line-height:2rem;font-weight:500;letter-spacing:.08em;font-variant-caps:all-small-caps}
.sec-b{margin-top:var(--s3)}
.lead{grid-column:1/span 8;font-size:var(--fs-m);line-height:2.25rem;text-wrap:pretty;hyphens:manual}
.cta{margin-top:var(--s3)}
.btn{display:inline-flex;align-items:center;min-height:2.75rem;font:inherit;font-variant-caps:all-small-caps;letter-spacing:.12em;font-weight:520;color:var(--ink);background:none;border:1px solid var(--ink);border-radius:0;padding:.45rem 1.6rem;cursor:pointer;text-decoration:none}
@media (hover:hover){.btn:hover{color:var(--paper);background:var(--ink)}}
/* le contact diffusion, le dossier PDF et les documents (règle 13) : un encart de programme imprimé */
.cd{display:grid;gap:.15rem;max-width:38rem;margin-top:var(--s3);padding-top:var(--s1);border-top:3px double var(--ink)}
.cd p{margin:0}
.cd-k{color:var(--ec,var(--mag))}
.cd-nom b{display:block;font-size:var(--fs-xl);line-height:1.08;font-weight:400;font-style:italic;letter-spacing:-.01em}
.cd-role{display:block;color:var(--ink2)}
.cd-liens{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem 1.75rem;margin-top:var(--s1)!important}
.cd-mail{background:var(--ink);color:var(--paper);overflow-wrap:anywhere}
@media (hover:hover){.cd-mail:hover{background:var(--paper);color:var(--ink)}}
.cd-tel{text-decoration:none;font-size:var(--fs-b)}
html:not(.ed-actif) .cd-tel.vide{display:none}
.cd-cond{margin-top:var(--s1)!important;font-size:var(--fs-s);font-style:italic;color:var(--ink2)}
.cd--s{max-width:none;margin-top:var(--s2);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:var(--s1) 0}
.cd--s .cd-nom b{display:inline;font-size:var(--fs-m);line-height:2rem}
.cd--s .cd-role{display:inline;margin-left:.6rem}
.cd--s .cd-liens{margin-top:.5rem!important}
.dos-bt{align-items:center;gap:.5em;text-align:left}
.dos-bt .ar-dl{margin-left:.2em}
.dos-pts{display:none;gap:.18em;align-items:baseline}
.dos-pts i{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:currentColor;opacity:.2}
.dos-bt[aria-busy="true"]{cursor:progress;color:var(--paper);background:var(--ink)}
.dos-bt[aria-busy="true"] .dos-pts{display:inline-flex}
.dos-bt[aria-busy="true"] .ar-dl{display:none}
.dos-bt[aria-busy="true"] .dos-pts i{animation:presse 1s ease-in-out infinite}
.dos-bt[aria-busy="true"] .dos-pts i:nth-child(2){animation-delay:.2s}
.dos-bt[aria-busy="true"] .dos-pts i:nth-child(3){animation-delay:.4s}
@keyframes presse{0%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dos-bt[aria-busy="true"] .dos-pts i{animation:none;opacity:1}}
.pr-act{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.75rem;margin-top:var(--s2)}
.pr-act .va{margin:0}
.docs{display:grid;gap:0;border-top:1px solid var(--rule)}
.docs li{padding:.5rem 0;border-bottom:1px solid var(--rule)}
.docs a{text-decoration:none}
.docs li.docs-b{padding:.7rem 0}
.dl-c{grid-column:1/span 8}
.ar-dl{width:.5em;height:.5em;margin-left:.35em;vertical-align:.05em}
.ft-dl{margin-top:var(--s2)}
.fp-dl{margin-top:var(--s2)}
.fp-dl .fp-lb{display:block;margin:0 0 .35rem}

/* la gamme d'un univers : la barre de contrôle des couleurs, comme sur une épreuve d'imprimeur */
.gm{display:inline-flex;vertical-align:middle;border:1px solid var(--rule);line-height:0}
.gm i{display:block;width:.7rem;height:.7rem}

/* les vignettes des univers, gravées au trait */
.vg{display:block;width:100%;height:auto;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.vg *{vector-effect:non-scaling-stroke}
.vg .vg-p{fill:currentColor;stroke:none}
.vg .vg-f{stroke-width:3.2}
.vg text{fill:currentColor;stroke:none;font:500 10px/1 "Newsreader",Georgia,serif;letter-spacing:.06em}

/* accueil */
.rh{margin-top:var(--s3);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 1.5rem;border-top:2px solid var(--ink);box-shadow:inset 0 3px 0 var(--paper),inset 0 4px 0 var(--ink);border-bottom:1px solid var(--ink);padding:.55rem 0 .4rem}
.rh-t,.rh-s{font-size:var(--fs-b);line-height:1.75rem;font-weight:520;font-variant-caps:all-small-caps;letter-spacing:.12em}
.rh-s{color:var(--ink2);text-decoration:none}
.choix{margin-top:var(--s4);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--g)}
.ch{border-top:3px solid var(--ec);box-shadow:inset 0 1px 0 var(--paper),inset 0 2px 0 var(--ec)}
.ch-a{display:block;color:var(--ink);text-decoration:none}
.ch-t{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;min-height:6.4rem;padding-top:.95rem;font-size:clamp(1.625rem,1.1rem + 1.2vw,2.375rem);line-height:1.12;font-style:italic;letter-spacing:-.01em;text-wrap:balance}
.ch-t .ar{color:var(--ec)}
.ch-ph{display:block;margin-top:var(--s1);padding:5px;border:1px solid var(--rule);background:var(--paper2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 16%,transparent);overflow:hidden}
.ch-ph img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover){.ch-a:hover .ch-t{color:var(--ec)}.ch-a:hover .ch-ph img{transform:scale(1.025)}}
.ch-a:focus-visible .ch-t{color:var(--ec)}
.ch-cr{margin-top:.45rem;font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.bill{margin-top:var(--sec);align-items:start}
.bill-l{grid-column:1/span 7}
.bill-h{color:var(--mag)}
.bill-list{margin-top:.5rem;border-top:2px solid var(--ink);box-shadow:inset 0 3px 0 var(--paper),inset 0 4px 0 var(--rule)}
.bill-list li{border-bottom:1px solid var(--rule)}
.bill-a{display:flex;align-items:baseline;justify-content:space-between;gap:1.5rem;padding:.85rem .55rem .95rem;color:var(--ink);text-decoration:none}
.bill-a.on{background:color-mix(in srgb,var(--f,var(--paper2)) 16%,var(--paper));box-shadow:inset 3px 0 0 var(--k,var(--mag))}
.bill-t{font-family:var(--ff),"Newsreader",Georgia,serif;font-weight:var(--fw);font-size:calc(var(--fs-xl) * var(--fz,1));line-height:1.1;color:var(--h,var(--ink));letter-spacing:-.005em}
.bill-t span{display:block}
.bill-d{flex:none;display:flex;align-items:center;gap:.85rem;font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;color:var(--ink2)}
.bill-vg{display:inline-block;width:1.6rem;color:var(--k,var(--ink2));opacity:.82}
.bill-a.on .bill-d{color:var(--mag)}
@media (hover:hover){.bill-a:hover .bill-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.12em}}
.bill-a:focus-visible .bill-t{text-decoration:underline}
.bill-ph{grid-column:9/span 4;margin-top:2.25rem}
.bill-ph img{width:100%;aspect-ratio:4/5;object-fit:cover;padding:6px;background:var(--paper2);border:1px solid var(--rule);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
figcaption{margin-top:.5rem;font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.home-pl{grid-column:3/span 8}
.notes{grid-column:1/-1;margin-top:var(--s3);padding-top:var(--s1);border-top:1px solid var(--rule);columns:3;column-gap:var(--g);font-size:var(--fs-s);line-height:1.5rem}
.notes li{break-inside:avoid;display:grid;grid-template-columns:2em minmax(0,1fr);padding-bottom:.65rem}
.nt-n{grid-row:span 3;font-style:italic;color:var(--ink2);font-variant-numeric:oldstyle-nums tabular-nums}
.nt-t{display:block}
.nt-s{font-style:italic;color:var(--ink2);justify-self:start}
.nt-k{color:var(--e-etablissement);font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520}
.more{grid-column:1/-1;margin-top:var(--s2)}
.more a{text-decoration:none}
.don{margin-top:var(--sec);padding-top:var(--s1);border-top:1px solid var(--rule);max-width:52rem;font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}

/* la planche : la carte gravée */
.pl{display:block;width:100%;height:auto;--u:1;overflow:visible}
.pl-f1{fill:none;stroke:var(--ink);stroke-width:calc(1.3*var(--u))}
.pl-f2{fill:none;stroke:var(--ink);stroke-width:calc(.6*var(--u))}
.pl-tk{fill:none;stroke:var(--ink);stroke-width:calc(.45*var(--u))}
.pl-pays{fill:none;stroke:var(--ink);stroke-width:calc(.8*var(--u));stroke-linejoin:round}
.pl-voisin{fill:none;stroke:var(--ink2);stroke-width:calc(.7*var(--u));stroke-dasharray:0 calc(2.6*var(--u));stroke-linecap:round}
.pl-passe{fill:none;stroke:var(--ink2);stroke-width:calc(.8*var(--u));stroke-dasharray:0 calc(3.2*var(--u));stroke-linecap:round}
.pl-fin{fill:none;stroke:var(--ink2);stroke-width:calc(.45*var(--u));opacity:.7}
.pl-encart{fill:none;stroke:var(--ink2);stroke-width:calc(.6*var(--u));stroke-dasharray:calc(2*var(--u)) calc(3*var(--u))}
.pl-sm{fill:var(--ink2)}
.pl-sm2{fill:var(--paper);stroke:var(--ink);stroke-width:calc(.7*var(--u))}
.pl-route{fill:none;stroke:var(--ink);stroke-width:calc(.85*var(--u));stroke-linecap:round;pointer-events:none}
.pl-attente .pl-route{stroke-dasharray:100 100;stroke-dashoffset:100}
.pl-trace .pl-route{stroke-dasharray:100 100;stroke-dashoffset:0;transition:stroke-dashoffset 1.5s cubic-bezier(.45,0,.2,1)}
.pl-rr{fill:var(--paper);stroke:var(--ink);stroke-width:calc(1*var(--u))}
.pl-rd{fill:var(--ink)}
.pl-rn{font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:560;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:calc(3.5*var(--u));stroke-linejoin:round}
.pl-lieu{cursor:pointer;outline:none}
.pl-hit{fill:transparent}
.pl-pt{fill:var(--paper);stroke:var(--ink);stroke-width:calc(.9*var(--u))}
.pl-n{font-style:italic;font-variant-numeric:oldstyle-nums tabular-nums;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:calc(3.2*var(--u));stroke-linejoin:round}
.pl-lead{stroke:var(--ink2);stroke-width:calc(.5*var(--u))}
.pl-lieu.on .pl-pt,.pl-lieu:focus-visible .pl-pt{stroke:var(--mag);stroke-width:calc(1.7*var(--u))}
.pl-lieu.on .pl-n,.pl-lieu:focus-visible .pl-n{fill:var(--mag)}
.pl-lieu.on .pl-lead{stroke:var(--mag)}
.pl-route.on{stroke:var(--mag);stroke-width:calc(1.3*var(--u))}
.lk.act .pl-route:not(.on){opacity:.18}
.lk.act .pl-lieu:not(.on){opacity:.32}
.lk.act .dl:not(.on),.lk.act .notes li:not(.on){opacity:.38}
.dl.on .dl-n,.notes li.on .nt-n{color:var(--mag)}
.lk.flt-on .dl:not(.sel){display:none}

/* lignes de date */
.ag{margin-top:var(--s4);align-items:start}
.ag-l{grid-column:1/span 7}
.ag-m{grid-column:8/span 5;position:sticky;top:var(--s2)}
.grp + .grp{margin-top:var(--s3)}
.mo{padding-bottom:.35rem;border-bottom:1px solid var(--ink);font-size:var(--fs-b);font-weight:520;letter-spacing:.1em;font-variant-caps:all-small-caps;color:var(--ec,var(--mag))}
.dl{display:grid;grid-template-columns:2.25rem minmax(0,1fr) minmax(0,1fr);column-gap:1rem;padding:.8rem 0 .85rem;border-bottom:1px solid var(--rule)}
.dl-n{font-style:italic;color:var(--ink2);font-variant-numeric:oldstyle-nums tabular-nums}
.dl-w,.dl-i{min-width:0}
.dl-d,.dl-p,.dl-e{display:block}
.dl-p{color:var(--ink2)}
.dl-e{font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520;color:var(--mag)}
.dl--x .dl-d,.dl--x .dl-p{text-decoration:line-through;text-decoration-thickness:1px}
.dl-s{font-style:italic}
.dl-x{font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2);overflow-wrap:anywhere}
.dl-s + .dl-x{margin-top:.2rem}
.dl-x li + li{margin-top:.2rem}
.flt{margin-bottom:var(--s2)}
.flt-b{display:inline-flex;align-items:center;min-height:2.75rem;font:inherit;color:var(--ink);background:none;border:1px solid var(--ink);border-radius:0;padding:.35rem .85rem;cursor:pointer}
.ss + .ss{margin-top:var(--s4)}
.ss-t{font-size:var(--fs-l);line-height:2.375rem;font-weight:400;font-style:italic;letter-spacing:-.005em}
.ss-t a{text-decoration:none}
.ss-st{margin-top:.25rem;color:var(--ink2)}
.ss-c{color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.08em}
.ss .dls{margin-top:var(--s1);border-top:1px solid var(--ink)}
.seasons ul{margin-top:var(--s2);columns:4;column-gap:var(--g)}
.seasons li{padding:.3rem 0;break-inside:avoid}
.seasons a{text-decoration:none}
.seasons .cur{color:var(--mag);font-weight:520}

/* l'agenda passé : le programme des saisons, en table des matières ; fermée au départ, chaque saison s'ouvre sur ses dates et sa planche */
.ag-outils{display:grid;gap:var(--s1);margin-top:var(--s3)}
.recherche{position:relative;display:block;max-width:24rem}
.recherche .ic{position:absolute;left:.1rem;top:50%;width:1.05rem;height:1.05rem;transform:translateY(-50%);fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round}
.recherche input{width:100%;min-height:2.75rem;padding:.45rem .5rem .45rem 1.7rem;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:inherit}
.recherche input::placeholder{color:var(--ink2);opacity:1}
.recherche input:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.cps{display:flex;flex-wrap:wrap;gap:.4rem .5rem}
.cp{display:inline-flex;align-items:center;min-height:2.75rem;font:inherit;font-size:var(--fs-s);line-height:1.25rem;padding:.35rem .85rem;border:1px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.cp:hover{border-color:var(--ink)}
.cp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pl-lieu.hors,.pl-route.hors{opacity:.16}
.pl-lieu.hors{pointer-events:none}
.ag-index{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:.5rem 1.5rem;margin-top:var(--s1);padding:0 0 .5rem;border-bottom:1px solid var(--ink)}
.ag-index .fr{margin-top:0;min-width:0}
.idx-outils{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.4rem .5rem;padding-bottom:1.9rem}
.idx-outils ul{display:flex;flex-wrap:wrap;gap:.4rem}
.idx,.idx-tout{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;font:inherit;font-size:var(--fs-s);line-height:1.25rem;font-variant-numeric:oldstyle-nums tabular-nums;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:0;cursor:pointer;white-space:nowrap}
.idx{padding:.35rem .8rem}
.idx small{font-size:.8125rem;color:var(--ink2)}
.idx:hover,.idx-tout:hover{border-color:var(--ink)}
.idx[aria-expanded="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ec,var(--mag))}
.idx-actif{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.idx-actif .ar-x{margin-left:.1rem}
.idx-tout{flex:none;justify-content:center;width:2.75rem;height:2.75rem;padding:0}
.idx-tout .ic{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.sai{border-bottom:1px solid var(--rule);scroll-margin-top:4rem}
.sai>summary{display:flex;align-items:center;gap:1.25rem;padding:1rem 0;list-style:none;cursor:pointer}
.sai>summary::-webkit-details-marker{display:none}
.sai-vg{flex:none;display:block;width:6.5rem;height:auto;--u:1}
.sai>summary:hover .pl-route,.sai[open] .pl-route{stroke:var(--mag)}
.sai-c{flex:0 1 auto;min-width:0}
.sai-t{font-size:var(--fs-l);line-height:2.375rem;font-weight:400;font-style:italic;letter-spacing:-.005em}
.sai-sp{display:block;margin-top:.1rem;font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.sai-sp span:not(:last-child)::after{content:"\00a0·"}
.sai-pt{flex:1 1 1.5rem;align-self:flex-end;min-width:1rem;margin-bottom:.55rem;border-bottom:2px dotted var(--ink2)}
.sai-n{flex:none;font-size:var(--fs-m);font-style:italic;font-variant-numeric:oldstyle-nums tabular-nums}
.sai[open]>summary .sai-t{color:var(--ec,var(--mag))}
.sai-corps{margin-top:0;padding:var(--s1) 0 var(--s4);align-items:start}
.sai-corps:empty{display:none}
.sai-corps .ag-m{top:calc(var(--s2) + 3.5rem)}
.sai-corps .grp + .grp{margin-top:var(--s3)}
.sai-corps .mo{font-size:var(--fs-b)}
.dl-k{margin-left:.6rem;font-style:normal;font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520;color:var(--ink2);border:1px solid currentColor;padding:0 .4rem}
.sai-page{margin-top:var(--s2)}
.sai-page a{color:var(--ec,var(--mag))}

/* un spectacle hors de sa page : le cartouche dans les couleurs de son univers */
.ct{position:relative;overflow:hidden;background:radial-gradient(130% 90% at 100% 0%,var(--l),transparent 62%),var(--f);color:var(--t);border-top:2px solid var(--a);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t) 16%,transparent);padding:1.15rem 1.25rem 1.25rem}
.ct-ph{display:block;margin:-1.15rem -1.25rem .95rem;border-bottom:1px solid color-mix(in srgb,var(--t) 22%,transparent);overflow:hidden;background:var(--f2)}
.ct-ph img{width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .6s cubic-bezier(.2,.6,.2,1)}
@media (hover:hover){.ct:hover .ct-ph img{transform:scale(1.025)}}
.ct-k{font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;color:var(--at)}
.ct-k span + span::before{content:"·";margin-inline:.45em}
.ct-t{margin-top:.35rem;max-width:88%;font-family:var(--ff),"Newsreader",Georgia,serif;font-weight:var(--fw);font-size:calc(clamp(1.75rem,1.25rem + 1.3vw,2.5rem) * var(--fz,1));line-height:1.05;color:var(--h);text-wrap:balance}
.ct-t a{color:inherit;text-decoration:none}
.ct-t a::after{content:"";position:absolute;inset:0}
.ct-s{margin-top:.5rem;max-width:80%;color:var(--t2);font-size:var(--fs-s);line-height:1.5rem}
.ct-vg{position:absolute;right:1rem;bottom:1rem;width:4.25rem;color:var(--a);opacity:.6;pointer-events:none}
.ct .gm{margin-top:var(--s1);border-color:color-mix(in srgb,var(--t) 30%,transparent)}
@media (hover:hover){.ct-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.12em}}

/* les spectacles */
.rep{margin-top:var(--s4);border-top:1px solid var(--ink)}
.rp{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:center;padding:var(--s1) 0;border-bottom:1px solid var(--rule)}
.rp-ph{grid-column:1/span 3;padding:7px;background:var(--f);border:1px solid var(--rule);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 16%,transparent)}
.rp-ph img{width:100%;aspect-ratio:3/2;object-fit:cover}
.rp-b{grid-column:4/span 6}
.rp-k{color:var(--k)}
.rp-t{font-family:var(--ff),"Newsreader",Georgia,serif;font-weight:var(--fw);font-size:calc(clamp(1.75rem,1.2rem + 1.5vw,2.625rem) * var(--fz,1));line-height:1.08;color:var(--h)}
.rp-t a{text-decoration:none;color:inherit}
.rp-t a::after{content:"";position:absolute;inset:0}
.rp-s{margin-top:.35rem;color:var(--ink2)}
.rp-lt{margin-top:.15rem;color:var(--k);font-style:italic}
.rp-c{grid-column:10/span 3;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.08em}
@media (hover:hover){.rp-t a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.12em}}

/* je viens voir : les spectacles en tournée */
.cartes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--g)}
.pc{display:flex;flex-direction:column}
.pc-ph{display:block;padding:6px;background:var(--paper2);border:1px solid var(--rule);border-bottom:0}
.pc-ph img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--rule)}
.pc .ct{flex:1;padding-bottom:5.5rem}
.pc-acc{margin-top:var(--s1);font-style:italic;line-height:1.625rem;max-width:34rem}
.pc-d{margin-top:var(--s1);color:var(--t2);font-size:var(--fs-s);line-height:1.5rem}
.pc-d span{display:block}
.pc-d .pc-dd{color:var(--t);font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520}

/* je souhaite programmer, je représente un établissement : une fiche par spectacle */
.cat{margin-top:var(--s4)}
.fp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);padding:var(--s2) 0;border-top:1px solid var(--ink);align-items:start}
.fp .ct{grid-column:1/span 5;min-height:15rem;padding-bottom:4.75rem}
.fp-b{grid-column:6/span 7;min-width:0}
.fp-rep{font-size:var(--fs-l);line-height:2.375rem;font-style:italic;letter-spacing:-.005em}
.fp-f{margin-top:var(--s1);border-top:1px solid var(--rule)}
.fp-f li{padding:.45rem 0;border-bottom:1px solid var(--rule)}
.fp-f .lb,.fp-lb{color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520;margin-right:.6em}
.fp-fi{margin-top:var(--s2);columns:2;column-gap:var(--g);font-size:var(--fs-s);line-height:1.5rem}
.fp-fi p{break-inside:avoid;padding-bottom:.45rem}
.fi-l{display:block;color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520}
.fp-l{margin-top:var(--s2);display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.75rem}
.fp-l a{text-decoration:none}
.lx{margin-top:var(--s2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.lx summary{cursor:pointer;padding:.55rem 0;font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;color:var(--ink)}
.lx summary::marker{color:var(--ink2)}
.lx p{padding:0 0 var(--s1);font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2);text-wrap:pretty}
.go{font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;text-decoration:none}
.fe-type{font-size:var(--fs-xl);line-height:1.08;font-style:italic;letter-spacing:-.012em;color:var(--h2,var(--ink));text-wrap:balance}
.fe-tags{margin-top:var(--s1);display:flex;flex-wrap:wrap;gap:.35rem 1.25rem;color:var(--ink2)}
.fe-tags .lb{font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520;margin-right:.45em}
.fe-x{margin-top:var(--s1);text-wrap:pretty;hyphens:auto;-webkit-hyphens:auto}
.fo{margin-top:var(--s2);border:1px solid var(--ink);padding:.9rem 1.1rem;font-size:var(--fs-m);line-height:2rem;font-style:italic}
.fo li + li{border-top:1px solid var(--rule)}
.di{margin-top:var(--s2);font-size:var(--fs-s);line-height:1.5rem}
.di li{margin-top:.35rem;color:var(--ink2)}
.part{grid-column:1/span 8;color:var(--ink2)}

/* page d'un spectacle, dans son univers */
.show{background:radial-gradient(70% 34rem at 82% 0%,var(--lueur),transparent 72%) no-repeat}
.show-h{position:relative;padding-top:var(--sec)}
.show-k{color:var(--mag);padding-right:clamp(5rem,14vw,10rem)}
.show-t{margin-top:var(--s1);padding-right:clamp(5rem,14vw,10rem);font-family:var(--ff),"Newsreader",Georgia,serif;font-weight:var(--fw);font-size:calc(var(--fs-show) * var(--fz,1));line-height:1.02;letter-spacing:-.012em;color:var(--titre);text-wrap:balance;animation:revele .9s cubic-bezier(.45,0,.2,1) both}
@keyframes revele{from{clip-path:inset(-25% 100% -25% 0)}to{clip-path:inset(-25% -6% -25% -2%)}}
.en-place .show-t,.meme-sp .show-t{animation:none}
.show-st{margin-top:var(--s2);font-size:var(--fs-m);line-height:2rem;color:var(--ink2);text-wrap:balance}
.show-st + .show-st{margin-top:.35rem}
.show-cadre{margin-top:var(--s1);color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.08em}
.show-acc{margin-top:var(--s3);max-width:44rem;font-size:var(--fs-m);line-height:2.25rem;font-style:italic;text-wrap:pretty}
.show-ac{margin-top:var(--s2);display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem 1rem}
.show-ac .lab{color:var(--ink2)}
.show-ac a{color:var(--mag);font-style:italic;text-decoration:none}
.show-vg{display:block;position:absolute;right:0;top:calc(var(--sec) + .25rem);width:clamp(4.5rem,11vw,8.5rem);color:var(--acc);opacity:.75}
.show-vg.vg-large{width:clamp(6rem,16vw,12rem)}
.show-ph{margin-top:var(--s4)}
.show-ph img{width:100%;aspect-ratio:16/9;object-fit:cover;padding:6px;background:var(--paper2);border:1px solid var(--rule);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.tabs{margin-top:var(--s3);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.tabs ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs li{display:flex;min-width:0}
.tabs li + li{border-left:1px solid var(--rule)}
.tabs a{position:relative;flex:1;min-width:0;min-height:2.75rem;display:flex;align-items:center;padding:.85rem 1rem .9rem;font-size:var(--fs-b);font-style:italic;line-height:1.5rem;color:var(--ink2);text-decoration:none}
.tabs li:first-child a{padding-left:0}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--acc)}
@media (hover:hover){.tabs a:hover{color:var(--mag)}}
.af{margin-top:var(--s4);max-width:52rem}
.af p{font-size:var(--fs-l);line-height:2.5rem;font-style:italic;letter-spacing:-.008em;text-wrap:pretty}
.af p::before{content:"";display:block;width:2.25rem;height:2px;margin-bottom:var(--s1);background:var(--acc)}
.af p + p{margin-top:var(--s3)}
.txt{grid-column:1/span 8;hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
.txt > p + p{margin-top:var(--s1)}
.va{margin-top:var(--s2);font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520}
.va a{text-decoration:none;color:var(--mag)}
.ci{grid-column:1/span 8}
.ci figure{padding:var(--s1) 0 var(--s2);border-top:1px solid var(--rule)}
.ci blockquote{font-size:var(--fs-m);line-height:2.125rem;font-style:italic}
.ci .v{display:block}
.ci .pr blockquote p::before{content:"« "}
.ci .pr blockquote p::after{content:" »"}
.ci figcaption{font-variant-caps:all-small-caps;letter-spacing:.06em}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--g);align-items:start}
.gal figure:first-child{grid-column:1/-1}
.gal img{width:100%;aspect-ratio:3/2;object-fit:cover;padding:5px;background:var(--paper2);border:1px solid var(--rule)}
.gal figure:first-child img{aspect-ratio:16/9}
.lg{display:block;font-style:italic}
.ft-ph .cr{display:block;margin-top:.35rem}
.cred{margin-top:var(--s2);font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.cred span{display:block}
.show-dls{grid-column:1/span 6;border-top:1px solid var(--ink);align-self:start}
.show-dls .dl{grid-template-columns:2.25rem minmax(0,1fr)}
.show-dls .dl-i{grid-column:2}
.show-pl{grid-column:7/span 6}
.show-ann{grid-column:1/span 5;font-size:var(--fs-m);line-height:2.125rem}
.show-ann .lab{display:block;color:var(--mag);font-size:var(--fs-b)}
.pl-seul{grid-column:3/span 8}
.fiche{grid-column:1/span 7;font-size:var(--fs-s);line-height:1.5rem}
.fiche .fi + .fi{margin-top:.6rem}
.fi-sep{margin-top:var(--s2)!important;padding-top:var(--s1);border-top:1px solid var(--rule)}
.fi-m{color:var(--ink2)}
/* la distribution en portraits (D.personnes, show.equipe) : le programme gravé ; chaque comédien en planche, la photo en noir et blanc tramée comme une gravure sous un double filet, ou une lettrine ; ceux qui alternent, séparés d'un filet */
.cast{--g:clamp(16px,2.4vw,32px);--pw:112px;--pmax:206px;--cols:4;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(max(var(--pw),calc((100% - (var(--cols) - 1) * var(--g)) / var(--cols))),calc((100% - var(--g)) / 2)),1fr));gap:2.25rem var(--g);max-width:calc(var(--cols) * var(--pmax) + (var(--cols) - 1) * var(--g));padding:0}
.cast>li{min-width:0}
.cast>.cast-paire{position:relative;grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.cast>.cast-paire::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule)}
.cast-pt{margin:0;min-width:0}
.cast-cadre{position:relative;display:block;aspect-ratio:4/5;container-type:inline-size;padding:6px;border:1px solid var(--ink)}
.cast-img{position:relative;display:block;width:100%;height:100%;overflow:hidden;isolation:isolate;border:1px solid var(--ink);background:var(--paper2)}
.cast-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(1) contrast(1.22) brightness(1.04)}
.cast-img::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 2px,color-mix(in srgb,var(--paper) 30%,transparent) 2px 3px)}
.cast-mono{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4cqw}
.cast-mono b{font-style:italic;font-weight:400;font-size:3rem;font-size:34cqw;line-height:1;letter-spacing:.01em;color:var(--ink)}
.cast-mono::after{content:"";width:24%;height:1px;background:var(--ink)}
.cast-cr{display:block;min-height:1.6rem;padding-top:.3rem;color:var(--ink2);font-size:.8125rem;line-height:1.25rem}
.cast-nom{display:block;margin-top:.55rem;font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;font-size:1.125rem;line-height:1.5rem;color:var(--ink)}
.cast-cr + .cast-nom{margin-top:0}
.cast-alt,.cast-role{display:block;color:var(--ink2);font-size:.9375rem;line-height:1.35rem}
.cast-alt{font-style:italic}
.cast-role{font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520;color:var(--acc)}
.fin{margin-top:var(--sec);display:flex;flex-direction:column;align-items:center;gap:.75rem;color:var(--acc)}
.fin .vg{width:3.75rem}
.fin p{color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.14em;font-weight:520}
.pf{grid-column:1/span 7}
.pf .fp-rep{font-size:var(--fs-xl);line-height:1.08}
.pf-c{grid-column:9/span 4;align-self:start;border-top:1px solid var(--ink);padding-top:var(--s1)}
.ft{grid-column:1/span 8}
.ft h3{margin-top:var(--s2);font-size:var(--fs-b);font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;color:var(--mag)}
.ft h3:first-child{margin-top:0}
.ft ul{margin-top:.35rem;border-top:1px solid var(--rule)}
.ft li{padding:.45rem 0;border-bottom:1px solid var(--rule)}
.ft-al{margin-top:var(--s2);padding:.9rem 1.1rem;border:1px solid var(--acc);border-left-width:4px}
.ft-ph{grid-column:9/span 4;align-self:start}
.ft-ph img{width:100%;aspect-ratio:4/5;object-fit:cover;padding:5px;background:var(--paper2);border:1px solid var(--rule)}
.ac-l{grid-column:1/span 7}
.ac-r{grid-column:9/span 4;align-self:start}
.ac-type{font-family:var(--ff),"Newsreader",Georgia,serif;font-weight:var(--fw);font-size:calc(var(--fs-xl) * var(--fz,1));line-height:1.08;color:var(--titre);text-wrap:balance}
.ac-tags{margin-top:var(--s1);display:flex;flex-wrap:wrap;gap:.35rem 1.25rem}
.ac-tags span{font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;color:var(--ink2)}
.ac-tags .lb{color:var(--mag);margin-right:.45em}
.ac-x{margin-top:var(--s2);hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
.ac-x p + p{margin-top:var(--s1)}
.ac-r .fo{margin-top:0}
.ac-r .di{margin-top:var(--s2)}
.ac-r .fp-lb{display:block;margin:0}
.gal-et{margin-top:var(--s3)}
.ds h3{margin-top:var(--s4);font-size:var(--fs-l);line-height:2.375rem;font-weight:400;font-style:italic;letter-spacing:-.005em;text-wrap:balance}
.ds h3:first-child{margin-top:0}
.ds h4{font-size:var(--fs-b);font-weight:560;line-height:1.75rem}
.pq{margin-top:var(--s2);max-width:46rem}
.pq section + section{margin-top:var(--s2)}
.pq p{margin-top:.35rem;hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
.tb-w{margin-top:var(--s2);overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:var(--fs-s);line-height:1.5rem}
.tb th,.tb td{text-align:left;vertical-align:top;padding:.6rem 1rem .6rem 0;border-bottom:1px solid var(--rule)}
.tb .tb-n th{padding-top:1.4rem;border-bottom:1px solid var(--ink);font-size:var(--fs-b);font-variant-caps:all-small-caps;letter-spacing:.12em;font-weight:560;color:var(--mag)}
.tb tbody:first-child .tb-n th{padding-top:.25rem}
.tb th[scope="row"]{width:18%;font-weight:560}
.tb .tb-i{width:38%;font-style:italic}
.cs{margin-top:var(--s2);max-width:46rem}
.cs > * + *{margin-top:var(--s1)}
.cs-n{display:inline-block;padding:.1rem .6rem;background:var(--acc);color:var(--paper2);font-size:var(--fs-s);letter-spacing:.12em;font-weight:600}
.cs-d{border-left:3px solid var(--acc);padding-left:1rem}
.cs-d li{padding:.2rem 0;font-weight:560;letter-spacing:.02em}
.cs-a li{position:relative;padding-left:1.4em;margin-top:.45rem}
.cs-a li::before{content:"";position:absolute;left:0;top:.85em;width:.75em;border-top:1px solid currentColor}
.at{margin-top:var(--s2);counter-reset:at}
.at > li{counter-increment:at;display:grid;grid-template-columns:3rem minmax(0,1fr);column-gap:var(--g);padding:var(--s2) 0;border-top:1px solid var(--rule)}
.at > li::before{content:counter(at);font-size:var(--fs-l);line-height:2rem;font-style:italic;font-variant-numeric:oldstyle-nums;color:var(--acc)}
.at-b{max-width:46rem}
.at-b > * + *{margin-top:var(--s1)}
.at-e{border-left:1px solid var(--rule);padding-left:1rem}
.at-e li + li{margin-top:var(--s1)}
.at-e p{margin-top:.25rem}
.at-p li{position:relative;padding-left:1.4em;margin-top:.45rem}
.at-p li::before{content:"";position:absolute;left:0;top:.85em;width:.75em;border-top:1px solid currentColor}

/* la compagnie, actions culturelles, mentions */
.co{margin-top:var(--s4);align-items:start}
.co-txt{grid-column:1/span 7;hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
.co-txt p + p{margin-top:var(--s1)}
.co-txt .co-1{font-size:var(--fs-m);line-height:2.25rem;hyphens:manual}
.co-d{grid-column:9/span 4;border-top:1px solid var(--ink);padding-top:var(--s1)}
.chrono{margin-top:var(--s1)}
.chrono li{display:grid;grid-template-columns:3.5em minmax(0,1fr);padding:.45rem 0;border-bottom:1px solid var(--rule)}
.yr{color:var(--ink2);font-variant-numeric:oldstyle-nums tabular-nums}
.ti{font-style:italic}
.ac{align-items:start}
.ac-txt{grid-column:1/span 7}
.ac-ph{grid-column:9/span 4}
.ac-ph img{width:100%;aspect-ratio:4/5;object-fit:cover;padding:5px;background:var(--paper2);border:1px solid var(--rule)}
.ac-g{grid-column:1/-1;margin-top:var(--s3);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--g)}
.ac-g img{width:100%;aspect-ratio:1;object-fit:cover;padding:4px;background:var(--paper2);border:1px solid var(--rule)}
.prose{hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty;overflow-wrap:break-word}
.prose h2,.prose h3{margin-top:var(--s3);padding-top:var(--s1);border-top:1px solid var(--ink);font-size:var(--fs-m);line-height:2rem;font-weight:500;letter-spacing:.06em;font-variant-caps:all-small-caps}
.prose h2:first-child,.prose h3:first-child{margin-top:0}
.prose p,.prose ul{margin-top:var(--s1)}
.prose li{position:relative;padding-left:1.4em;margin-top:.6rem}
.prose li::before{content:"";position:absolute;left:0;top:.85em;width:.75em;border-top:1px solid var(--ink)}
.legal{grid-column:1/span 8;margin-top:var(--s4);overflow-wrap:anywhere}

/* formulaires */
.frm{grid-column:1/span 7;margin-top:var(--s4)}
.frm > * + *{margin-top:var(--s2)}
.fld label{display:block;color:var(--ink2);font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:520}
.fld input,.fld textarea{display:block;width:100%;margin-top:.25rem;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:.35rem 0}
.fld textarea{border:1px solid var(--ink);padding:.5rem .65rem;resize:vertical}
.fld--calc{display:flex;align-items:baseline;gap:.75rem}
.fld--calc label{display:inline;color:var(--ink);font-variant-caps:normal;letter-spacing:0;font-weight:400}
.fld--calc input{display:inline-block;width:3.5rem;text-align:center}
.chk{display:flex;gap:.65rem;align-items:baseline}
.chk input{flex:none;width:1rem;height:1rem;margin:0;accent-color:var(--ink);transform:translateY(.15em)}
.ct-c{grid-column:9/span 4;margin-top:var(--s4);border-top:1px solid var(--ink);padding-top:var(--s1)}
.ct-n{font-weight:520}

/* pied de page */
.site-f{margin-top:var(--sec);border-top:2px solid var(--ink);box-shadow:inset 0 3px 0 var(--paper),inset 0 4px 0 var(--ink);padding-block:var(--s2) var(--s4);font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.site-f .grid{row-gap:var(--s2)}
.f-c{grid-column:span 3}
.f-c2{grid-column:span 2}
.f-p{grid-column:span 4}
.f-n{display:block;color:var(--ink);font-weight:520}
.f-a{display:block}
.f-c p + p,.f-c2 p + p{margin-top:var(--s1)}

/* « Modifier le site » : discret, sous les liens légaux du pied */
.f-mod{display:inline-flex;align-items:baseline;gap:.4em;padding:0;border:0;background:none;font:inherit;color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:var(--rule);cursor:pointer}
.f-mod .ar{width:.75em;height:.75em;margin:0;vertical-align:-.05em}
@media (hover:hover){.f-mod:hover{color:var(--mag);text-decoration-color:currentColor}}
/* un texte de bloc de D qui porte sa balise (titre, liste) : une enveloppe pour l'édition, sans effet sur la page */
.prose .bl > h2:first-child,.prose .bl > h3:first-child{margin-top:var(--s3)}
.prose > .bl:first-child > :first-child{margin-top:0}
/* l'édition sur place, imprimée comme le programme : papier, encre, double filet, petites capitales, angles droits
   (couleurs sur :root via --ed-* : sur la page d'un spectacle, le papier et l'encre de la page prennent ceux de l'univers ;
   préfixe html : l'outil ajoute ses styles après ceux-ci) */
.ed-actif .ct-t a::after,.ed-actif .rp-t a::after{display:none}
.ed-boite[hidden],.ed-boite [hidden]{display:none!important}
html .ed-barre{border-radius:0;border:1px solid var(--ed-encre);box-shadow:0 0 0 4px var(--ed-fond),0 0 0 5px var(--ed-encre),0 18px 40px var(--ed-ombre)}
html .ed-barre .ed-etat{font-weight:520;font-variant-caps:all-small-caps;letter-spacing:.12em;font-size:1.1rem}
html .ed-barre .ed-etat::before{width:7px;height:7px;border-radius:0;background:var(--ed-accent)}
html .ed-boite .ed-bt,html .ed-bt.ed-boite{border-radius:0;border-color:var(--ed-encre);font-variant-caps:all-small-caps;letter-spacing:.1em;font-weight:520;font-size:1.02rem;padding:4px 14px 6px}
html .ed-bt.ed-plein{background:var(--ed-encre);border-color:var(--ed-encre);color:var(--ed-fond)}
html .ed-bt.ed-plein:hover{background:var(--ed-accent);border-color:var(--ed-accent);color:var(--ed-sur-accent)}
html .ed-panneau{border-radius:0;border:1px solid var(--ed-encre);box-shadow:0 0 0 5px var(--ed-fond),0 0 0 6px var(--ed-encre),0 24px 70px var(--ed-ombre-forte)}
.ed-panneau .ed-tete{border-bottom:2px solid var(--ed-encre)}
.ed-panneau .ed-tete h2{font-weight:400;font-size:1.75rem;line-height:1.1;letter-spacing:-.01em}
.ed-panneau .ed-pied{border-top:2px solid var(--ed-encre)}
.ed-panneau .ed-champ > span:first-child{font-weight:520;font-size:1rem;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--ed-gris)}
html .ed-boite input[type],html .ed-boite select,html .ed-boite textarea,html .ed-boite .ed-riche,html .ed-seg,html .ed-item,html .ed-apercu,html .ed-sugg,html .ed-outils,html .ed-outils button{border-radius:0}
html .ed-boite input[type],html .ed-boite select,html .ed-boite textarea,html .ed-boite .ed-riche{background:var(--paper-blanc)}
html .ed-annonce{border-radius:0;background:var(--ed-encre);box-shadow:0 0 0 3px var(--ed-fond),0 0 0 4px var(--ed-encre),0 8px 28px var(--ed-ombre)}
.ed-bt.ed-plein.ed-ajout{display:flex;width:fit-content;margin:.8rem 0 1rem;background:var(--ed-fond);border:1px solid var(--ed-encre);color:var(--ed-encre);box-shadow:0 0 0 3px var(--ed-fond),0 0 0 4px var(--ed-encre)}
.ed-bt.ed-plein.ed-ajout:hover{background:var(--ed-encre);color:var(--ed-fond)}

/* l'ouverture, habillée en couverture de programme */
.intro.programme::after{content:"";position:absolute;inset:clamp(10px,2.4vw,30px);border:2px solid currentColor;outline:1px solid currentColor;outline-offset:-7px;pointer-events:none}
.intro.programme.part::after{opacity:0;transition:opacity .2s}
.intro.programme .intro-indice{bottom:calc(clamp(10px,2.4vw,30px) + 16px)}
.intro.programme .intro-indice svg{animation:none;stroke-width:1.2}

@media (max-width:1023px){
  :root{--g:24px}
  .bill-l,.bill-ph,.home-pl,.ag-l,.ag-m,.txt,.ci,.fiche,.show-dls,.show-pl,.show-ann,.pl-seul,.co-txt,.co-d,.ac-txt,.ac-ph,.frm,.ct-c,.legal,.lead,.part,.pf,.pf-c,.ft,.ft-ph,.ac-l,.ac-r,.dl-c{grid-column:1/-1}
  .bill-ph{grid-row:1;margin:0 0 var(--s2)}
  .bill-ph img,.ac-ph img{aspect-ratio:3/2}
  .ag-m{grid-row:1;position:static;margin-bottom:var(--s3)}

  .show-pl{margin-top:var(--s3)}

  .ft-ph img{aspect-ratio:3/2}
  .rp-ph{grid-column:1/span 4}
  .rp-b{grid-column:5/span 8}
  .rp-c{grid-column:5/span 8;justify-self:start;flex-direction:row;align-items:center;margin-top:.5rem}
  .fp .ct{grid-column:1/-1;min-height:0}
  .fp-b{grid-column:1/-1;margin-top:var(--s2)}
  .seasons ul{columns:3}
  .sai-corps .ag-m{position:static}

}
@media (max-width:639px){
  :root{--g:16px}
  body{padding-bottom:calc(4.25rem + env(safe-area-inset-bottom))}
  .menu{display:inline-flex}
  .nav{display:none;grid-area:2/1/3/3}
  .nav.open{display:block}
  .nav ul{flex-direction:column;gap:0;padding-bottom:.5rem}
  .nav li{border-top:1px solid var(--rule)}
  .nav a{display:flex;padding:.65rem 0;font-size:var(--fs-b)}
  .nav a[aria-current="page"]{box-shadow:none;color:var(--mag)}
  .ent{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--ink);box-shadow:0 -3px 0 -1px var(--paper),0 -4px 0 -1px var(--ink)}
  .ent a,.ent li:first-child a,.ent li:last-child a{flex-direction:column;justify-content:center;gap:.3rem;padding:.55rem .35rem calc(.6rem + env(safe-area-inset-bottom));text-align:center;font-size:.9375rem;line-height:1.15rem}
  .ent a::before{width:.4rem;height:.4rem}
  .ent .e-l,.ent.court .e-l{display:none}
  .ent .e-c,.ent.court .e-c{display:block;white-space:normal}
  .ent a::after{top:-1px;bottom:auto}
  .choix{grid-template-columns:minmax(0,1fr);row-gap:var(--s2)}
  .ch-a{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem;column-gap:1rem;align-items:start}
  .ch-t{min-height:0;font-size:1.625rem}
  .ch-ph{margin-top:.85rem}
  .ch-ph img{aspect-ratio:1}
  .bill-a{flex-direction:column;gap:.15rem}
  .notes{columns:1}
  .dl{grid-template-columns:2rem minmax(0,1fr)}
  .dl-i{grid-column:2}
  .dl-s{margin-top:.15rem}
  .rp{align-items:start}
  .rp-ph{grid-column:1/-1}
  .rp-b,.rp-c{grid-column:1/-1}
  .rp-b{margin-top:var(--s1)}
  .cartes{grid-template-columns:minmax(0,1fr)}
  .fp-fi{columns:1}
  .seasons ul{columns:2}

  .sai-vg{width:4.25rem}

  .sai-n{margin-left:auto}
  .cps{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1 * var(--m));padding:2px var(--m) 4px;scrollbar-width:none}
  .cp{flex:none}
  .f-c,.f-c2,.f-p{grid-column:1/-1}

  .show-ph figcaption{padding-inline:var(--m)}

  .show-vg.vg-large{width:7rem}
  .tabs a,.tabs li:first-child a{justify-content:center;padding:.7rem .4rem .75rem;font-size:.9375rem;line-height:1.2rem;text-align:center}
  .at > li{grid-template-columns:minmax(0,1fr)}
  .ac-g{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ——— le mouvement : l'imprimerie (voir le bloc « Mouvement » en tête du script) ———
   Trois gestes de l'atelier, et seulement eux : le filet tiré à la règle (vitesse égale, il part d'un bord et finit à l'autre),
   l'encre qui se pose (un léger flou qui se resserre), la page qu'on tourne (la feuille se pose, son pli passe) ; et le tampon. */
:root{--m-regle:cubic-bezier(.62,0,.3,1);--m-encre:cubic-bezier(.25,.6,.3,1);--m-pose:cubic-bezier(.2,.72,.18,1)}
html{view-transition-name:none}
body{overflow-x:clip}
main{display:block;min-height:100svh}   /* sa place est gardée pendant la lecture de D : le pied de page ne saute pas */
/* les filets des rubriques : tirés à la règle quand ils arrivent à l'écran (un double filet : deux traits, l'un après l'autre) */
.sec{position:relative;border-top:0}
.filet{position:absolute;left:0;right:0;top:0;height:1.5px;background:var(--ink);transform-origin:0 50%;pointer-events:none}
.filet::after{content:"";position:absolute;left:0;right:0;top:3.5px;height:1px;background:var(--rule)}
.filet.mv-attente{transition:transform .72s var(--m-regle);transition-delay:var(--mv-delai,0ms)}
.fp{position:relative;border-top:0}
.fp > .filet{background:var(--ink)}
/* l'encre qui se pose : le titre de la page, net en un instant ; les intertitres après leur filet */
@keyframes m-encre{from{opacity:0;filter:blur(3px)}55%{opacity:1}to{opacity:1;filter:blur(0)}}
.pg-t,.rh-t{animation:m-encre .56s var(--m-encre) both}
.en-place .pg-t,.en-place .rh-t{animation:none}
[data-mv="encre"].mv-attente{transition:opacity .5s var(--m-encre),filter .5s var(--m-encre);transition-delay:var(--mv-delai,0ms)}
[data-mv="encre"].mv-attente:not(.mv-vu){opacity:0;filter:blur(2.5px)}
/* les fiches, les portraits, les cartouches : imprimés l'un après l'autre (sans glisser : l'encre ne bouge pas) */
[data-mv="cascade"].mv-attente>*{transition:opacity .42s var(--m-encre);transition-delay:calc(var(--mv-delai,0ms) + min(var(--mv-i,0),12) * 55ms)}
[data-mv="cascade"].mv-attente:not(.mv-vu)>*{opacity:0;transform:none}
/* la page qu'on tourne : la nouvelle page se pose, le pli de la feuille passe dessus et s'efface */
.pli{position:absolute;z-index:35;top:0;height:100vh;left:0;width:min(30vw,360px);pointer-events:none;opacity:0;
  background:linear-gradient(to right,transparent 0,color-mix(in srgb,var(--ink) 3%,transparent) 50%,color-mix(in srgb,var(--ink) 9%,transparent) 92%,transparent 100%)}
.pli-retour{transform:scaleX(-1)}
/* le filet de l'entrée choisie, tiré sous son libellé ; au survol, un trait fin */
.ent a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ec);transform:scaleX(0);transform-origin:0 50%;transition:transform .46s var(--m-regle)}
.ent a[aria-current]::after{transform:none}
.ent .e-l,.ent .e-c{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .2s var(--m-regle)}
@media (hover:hover){.ent a:not([aria-current]):hover .e-l,.ent a:not([aria-current]):hover .e-c{background-size:100% 1px}}
.tabs a::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--acc);transform:scaleX(0);transform-origin:0 50%;transition:transform .46s var(--m-regle)}
.tabs a[aria-current="page"]::before{transform:none}
.nav a{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:color .18s,background-size .22s var(--m-regle)}
.nav a[aria-current="page"]{box-shadow:none;background-size:100% 1px}
@media (hover:hover){.nav a:hover{background-size:100% 1px}}
.pg-h--e::before{transform-origin:0 50%;animation:m-regle .6s var(--m-regle) .08s both}
.en-place .pg-h--e::before{animation:none}
@keyframes m-regle{from{transform:scaleX(0)}}
/* la pression : le foulage, la presse mord le papier, l'encre s'étale d'un rien */
:is(.btn,.cp,.idx,.idx-tout,.flt-b,.menu,.f-mod,.ent a,.nav a,.tabs a,.go,.ch-a,.bill-a,.rp-t a,.ct-t a,.ep-a,.sai>summary,.lx summary,.va a,.ss-t a,.dl-s a,.nt-s){transition-property:color,background-color,border-color,box-shadow,background-size,translate,text-shadow;transition-duration:.18s}
:is(.btn,.cp,.idx,.idx-tout,.flt-b,.dos-bt).mv-presse{translate:0 1px;box-shadow:inset 0 2px 0 color-mix(in srgb,var(--ink) 22%,transparent);transition-duration:.05s}
:is(.ent a,.nav a,.tabs a,.go,.ch-a,.bill-a,.rp-t a,.ct-t a,.ep-a,.sai>summary,.lx summary,.va a,.ss-t a,.dl-s a,.nt-s,.f-mod,.menu).mv-presse{translate:0 1px;text-shadow:0 0 .7px currentColor;transition-duration:.05s}
/* une ligne vers laquelle mène la frise : un coup de surligneur, qui sèche */
@keyframes m-vise{0%,30%{background-size:100% 100%;background-color:color-mix(in srgb,var(--mag) 13%,transparent)}100%{background-size:100% 100%;background-color:transparent}}
.dl.est-vise{animation:m-vise 1.4s var(--m-encre)}
.dl.est-allume .dl-n,.notes li.est-allume .nt-n{color:var(--mag)}
.dl.est-allume{background:color-mix(in srgb,var(--mag) 6%,transparent)}
.pl-lieu.est-allume .pl-pt{stroke:var(--mag);stroke-width:calc(1.7*var(--u))}
.pl-lieu.est-allume .pl-n{fill:var(--mag)}
.sai.est-allume>summary .sai-t{color:var(--mag)}
.sai>summary .sai-pt{transition:border-color .18s}
@media (hover:hover){.sai>summary:hover .sai-pt{border-bottom-color:var(--ink)}}
/* le tampon : le dossier composé reçoit la marque de la compagnie, frappée à l'encre */
.dos-bt{position:relative}
.tampon{position:absolute;z-index:2;right:-2.1rem;top:-2rem;width:3.5rem;height:3.5rem;display:grid;place-items:center;border:2px solid var(--mag);border-radius:50%;color:var(--mag);pointer-events:none;rotate:-14deg;opacity:0;
  background:color-mix(in srgb,var(--paper) 55%,transparent);box-shadow:inset 0 0 0 2.5px color-mix(in srgb,var(--paper) 80%,transparent),inset 0 0 0 3.5px var(--mag);mix-blend-mode:multiply}
.tampon svg{width:68%;height:auto}
.tampon svg path{fill:currentColor}
.tampon.frappe{animation:m-tampon 1.9s var(--m-encre) both}
@keyframes m-tampon{0%{opacity:0;scale:1.9}14%{opacity:.95;scale:.96}20%{scale:1}70%{opacity:.9}100%{opacity:0;scale:1}}

/* ——— les frises (FRISE), imprimées : un filet, des petites capitales, des puces typographiques ——— */
.fr{margin-top:var(--s3)}
.fr-saison .frise[data-frise]{--fr-couloir:11px}
.frise[data-frise]{--fr-fond:var(--paper);--fr-encre:var(--ink);--fr-trait:color-mix(in srgb,var(--ink) 58%,transparent);--fr-accent:var(--mag);
  --fr-police:"Newsreader",Georgia,serif;--fr-point:9px;--fr-couloir:15px;--fr-haut:48px;--fr-taille:13px;--fr-pied:42px;--fr-passe:.3;
  --fr-bulle-fond:var(--paper-blanc);--fr-bulle-encre:var(--ed-encre);--fr-courbe:var(--m-regle)}
.u .frise[data-frise]{--fr-bulle-fond:var(--paper2);--fr-bulle-encre:var(--ink)}
.frise .frise-axe{background:var(--ink)}
.frise .frise-axe::after{content:"";position:absolute;left:0;right:0;top:3px;height:1px;background:var(--ink);opacity:.28}
.frise .frise-mois>li{border-left-color:var(--ink)}
.frise .frise-mois>li>span:first-child{top:10px;left:6px}
.frise .frise-mois-nom{font-weight:520;font-variant-caps:all-small-caps;letter-spacing:.1em;font-size:14px}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  /* Mouvement : l'imprimerie. Le programme de salle bouge comme on l'imprime et comme on le lit, rien de numérique : pas de
     glissement d'écran, pas de rebond, pas de morphose ; l'encre, le filet, la feuille, le tampon. Une seule vitesse d'atelier :
     le filet tiré à la règle (cubic-bezier(.62, 0, .3, 1), régulier, il part d'un bord et finit à l'autre), l'encre qui se pose
     (un flou de 3 px qui se resserre en 0,5 s), la feuille qui se pose (0,38 s). Survol 0,18 s, pression 0,05 s.
     1. Changer de page : la page qu'on tourne. La nouvelle page se pose d'un rien de la droite (de la gauche au retour) et le
        pli de la feuille passe dessus et s'efface ; entre les onglets d'un même spectacle, l'en-tête reste : seule la page du
        dessous se tourne. Le filet de l'entrée choisie se tire sous son libellé ; le titre de la page s'encre.
     2. Ouvrir une saison, le menu : les lignes s'impriment l'une après l'autre (MOUVEMENT.cascade, sans glisser) ; la planche
        de la saison se grave depuis Rouen.
     3. Filtrer, chercher : les lignes gagnent leur nouvelle place (MOUVEMENT.flip), celles qui partent pâlissent ; les puces de
        la frise glissent sur le filet.
     4. Survol et focus : un trait fin se tire sous le lien, la couleur passe à l'encre magenta, 0,18 s ; rien ne se soulève.
     5. Pression : le foulage. La presse mord le papier : la pièce s'enfonce d'un pixel, l'encre s'étale d'un rien (.mv-presse).
     6. Défilement (MOUVEMENT.reveler) : les filets des rubriques se tirent à la règle, les intertitres s'encrent, les fiches et
        les portraits s'impriment l'un après l'autre ; les chiffres ne comptent pas : ils sont imprimés.
     7. Ce qui vit : sur chaque frise, « aujourd'hui » est un tampon dateur frappé à l'encre, dont le repère respire.
     Les frises (FRISE) sont imprimées : un filet doublé d'un trait fin, les mois en petites capitales, les dates en losanges
     typographiques à la couleur de leur spectacle (creux pour une date scolaire), les saisons en barres gravées de hachures.
     Le tampon : quand le dossier d'un spectacle est composé, la marque de la compagnie y est frappée. La pieuvre ne bouge
     pas : aucune tentacule (TENTACULES réglé sans clic ni pages, aucun moment joué).
     Moins d'animations demandé (ou ?anim=0) : tout est imprimé d'avance, rien ne bouge. */

  function relire() {
    S = D.site; L = S.libelles; K = D.carte; R = K.rouen;
    BY = Object.fromEntries(D.shows.map(s => [s.slug, s]));
    E = Object.fromEntries(S.entrees.map(e => [e.cle, e]));
    TEINTES.clear();
  }
  const main = document.getElementById('main');
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ML = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const ICON = {
    r: '<svg class="ar" viewBox="0 0 18 10" aria-hidden="true" focusable="false"><path d="M0 5h16.6M12.4 .8 16.6 5l-4.2 4.2"/></svg>',
    ne: '<svg class="ar ar-ne" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1 9 9 1M2.6 1H9v6.4"/></svg>',
    x: '<svg class="ar ar-x" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>'
  };
  const PLUME = '<svg class="ar" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M1.5 10.5l.8-2.6L8.6 1.6a1.1 1.1 0 0 1 1.6 0l.2.2a1.1 1.1 0 0 1 0 1.6L4.1 9.7z"/><path d="M7.4 2.8l1.8 1.8"/></svg>';
  const ext = (href, html, cls = '') => `<a${cls ? ` class="${cls}"` : ''} href="${esc(href)}" target="_blank" rel="noopener">${html}${ICON.ne}</a>`;
  const menuTexte = id => (S.menu.find(m => m.id === id) || {}).texte || '';
  // l'édition sur place (EDITION) : chaque texte affiché qui vient de D porte son chemin dans D (data-edit), l'élément
  // contenant exactement la valeur ; les photos des spectacles (data-edit-photo) ; les lignes d'agenda (data-date-id)
  const ed = chemin => typeof chemin === 'string' && chemin ? ` data-edit="${esc(chemin)}"` : '';

  const rangPh = (s, p) => (s.photos || []).indexOf(p);

  // balise, titre ou liste, est enveloppé pour que l'élément annoté contienne exactement la valeur)
  const BLOC = /^\s*<(h2|h3|ul|ol|p|div|blockquote)\b/i;

  const img = (cle, alt = '', cls = '') => D.photos[cle] ? `<img${cls ? ` class="${cls}"` : ''} src="${D.photos[cle]}" alt="${esc(alt)}" decoding="async">` : '';
  const ecrire = () => `<p class="cta"><a class="btn" href="${esc(S.ecrire.href)}">${esc(L.ecrire)}${ICON.r}</a></p>`;
  // un spectacle sans action culturelle (Cassandres, pour l'instant) n'a pas d'onglet établissement : on le mène à « voir » (règle 14)
  const entreeSp = (s, cle) => cle === 'etablissement' && !s.actionCulturelle ? 'voir' : cle;
  const lien = (s, cle) => `#/spectacle/${esc(s.slug)}${cle ? '/' + entreeSp(s, cle) : ''}`;
  const PAPIER = '#f6f2ec';

  /* « Je souhaite programmer » : ce qu'il faut à un programmateur (règle 13), relu dans D à chaque rendu */
  const contactPrg = () => ((D.site || {}).programmation || {}).contact || null;
  const mailPrg = objet => { const c = contactPrg(); return c && c.email ? `mailto:${c.email}?subject=${encodeURIComponent(objet)}` : ''; };
  const docsDe = (s, pour) => (D.documents || []).filter(x => x.spectacle === s.slug && x.pour === pour && x.url);
  const ICON_DL = '<svg class="ar ar-dl" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 .8v7.6M1.4 5.2 5 8.8l3.6-3.6"/></svg>';
  const lienDoc = x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titre)}${ICON_DL}</a>`;

  // le dossier du spectacle en PDF, composé à la demande (dossier.js) : pendant ce temps le bouton est occupé (aria-busy), trois points s'y composent comme à la presse, puis il redevient actif
  const OCCUPES = new Set();
  const dossierBouton = slug => `<button type="button" class="btn dos-bt" data-dossier="${esc(slug)}"${OCCUPES.has(slug) ? ' aria-busy="true" disabled' : ''}><span>${esc(L.dossierPdf)}</span><span class="dos-pts" aria-hidden="true"><i></i><i></i><i></i></span>${ICON_DL}</button>`;

  // le tampon : le dossier est composé, la marque de la compagnie (la pieuvre du logo) y est frappée à l'encre, puis s'efface
  function tamponner(b) {

  /* ——— les couleurs : contrastes, teintes d'univers ——— */
  const rgb = h => { let x = String(h).replace('#', ''); if (x.length === 3) x = x.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); };
  const hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
  const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const mele = (a, b, t) => { const A = rgb(a), B = rgb(b); return hex(A.map((v, i) => v + (B[i] - v) * t)); };
  const ajuste = (c, fond, cible = 4.6) => { const vers = lum(fond) > .35 ? '#000000' : '#ffffff'; for (let t = 0; t <= 1.001; t += .04) { const x = mele(c, vers, t); if (cr(x, fond) >= cible) return x; } return vers; };
  const ECHELLE = { 'Anton': .9, 'Space Grotesk': .92, 'Ubuntu': .94, 'Bodoni Moda': .95, 'Cormorant Garamond': 1.06, 'IM Fell French Canon': .98 };
  const TEINTES = new Map();
  function teinte(s) {
    if (TEINTES.has(s.slug)) return TEINTES.get(s.slug);

    const at = [c.accent, c.scene, c.accent2].find(x => ok(x, 4.5)) || ajuste(c.accent, c.fond);
    const T = {
      f: c.fond, f2: c.fond2, t: c.texte, t2: c.texte2, l: c.lueur, at,

      h: [c.scene, c.accent].find(x => ok(x, 3)) || c.texte,                 // le titre
      rule: mele(c.fond, c.texte, s.univers.clair ? .2 : .26),
      ff: P.titre, fw: P.titreGraisse, fz: ECHELLE[P.titre] || 1, clair: !!s.univers.clair,

    };

  }
  const police = T => `--ff:'${T.ff}';--fw:${T.fw};--fz:${T.fz}`;
  const varsCartouche = s => { const T = teinte(s); return `--f:${T.f};--f2:${T.f2};--t:${T.t};--t2:${T.t2};--a:${T.a};--at:${T.at};--h:${T.h};--l:${T.l};${police(T)}`; };
  const varsPapier = s => { const T = teinte(s); return `--f:${T.f};--h:${T.hp};--k:${T.kp};${police(T)}`; };
  const couleursEntrees = fond => S.entrees.map(e => `--e-${e.cle}:${[e.couleur, e.couleurVive].find(x => cr(x, fond) >= 4.5) || ajuste(e.couleur, fond)}`).join(';');
  const gamme = s => { const c = s.univers.couleurs; return `<span class="gm" aria-hidden="true">${[c.fond, c.fond2, c.texte, c.texte2, c.accent, c.accent2].map(x => `<i style="background:${x}"></i>`).join('')}</span>`; };

  /* ——— les motifs des univers : de petites vignettes gravées au trait ——— */
  function vignette(motif) {
    const f = v => v.toFixed(1);
    const P = (r, a, cx = 50, cy = 50) => { const t = a * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
    const p = (r, a, cx, cy) => P(r, a, cx, cy).map(f).join(' ');
    let vb, b = '';
    switch (motif) {
      case 'arene': {   // l'arène vue d'en haut : trois gradins, le tapis, le polygone au centre, les trois pieds de lumière
        vb = '-2 -2 104 104';
        for (let k = 0; k < 3; k++) {
          const a1 = 102 + 120 * k, a2 = 198 + 120 * k, [px, py] = P(45, 90 + 120 * k);
          b += `<path d="M${p(45, a1)}A45 45 0 0 1 ${p(45, a2)}L${p(35, a2)}A35 35 0 0 0 ${p(35, a1)}Z"/><path d="M${p(40, a1 + 2)}A40 40 0 0 1 ${p(40, a2 - 2)}"/><circle class="vg-p" cx="${f(px)}" cy="${f(py)}" r="1.9"/>`;
        }
        b += '<circle cx="50" cy="50" r="24"/><path d="M50 45.5l3.9 2.25v4.5L50 54.5l-3.9-2.25v-4.5z"/>';
        break;
      }
      case 'jumeaux':     // deux formes jumelles, une seule couronne
        vb = '0 0 100 66';
        b = '<circle cx="37" cy="40" r="22"/><circle cx="63" cy="40" r="22"/><path d="M41.5 15.5l2-8.5 4 5.5 2.5-8 2.5 8 4-5.5 2 8.5z"/>';
        break;
      case 'annotations': // des notes à la main dans la marge

          + '<path d="M70 12c12-9 34-5 38 7s-12 20-28 17-20-14-8-23"/><path d="M58 54c12 7 30 6 44-3"/><path d="M95 47.5l7.5 3.5-6.5 5"/>';
        break;
      case 'paperboard':  // la feuille et le feutre

          + '<path class="vg-f" d="M22 22c6-6 11 5 17 0s11-5 17 0"/><path class="vg-f" d="M22 34h24"/><path class="vg-f" d="M22 45h31"/>';
        break;
      case 'nez':         // le profil
        vb = '0 0 86 106';
        b = '<path d="M30 2C36 12 37 22 35 31C38 35 43 38 50 43C60 50 74 56 80 61C73 66 58 65 47 64C49 67 47 70 45 71C48 73 47 76 44 77C46 82 45 88 38 92C35 95 33 99 32 104"/><path d="M37 37.5c2.2 1.4 4.6 1.4 6.6 0"/>';
        break;
      case 'horloge': {   // le temps du huis clos
        vb = '0 0 64 64';
        b = '<circle cx="32" cy="32" r="28"/>';
        for (let k = 0; k < 12; k++) b += `<path d="M${p(k % 3 ? 25 : 22, k * 30, 32, 32)}L${p(28, k * 30, 32, 32)}"/>`;
        b += `<path d="M32 32L${p(14, -120, 32, 32)}"/><path d="M32 32L${p(21, -94, 32, 32)}"/><circle class="vg-p" cx="32" cy="32" r="1.8"/>`;

  }
  const LARGE = new Set(['fil', 'chronologie', 'annotations']);

  /* ——— la mémoire de l'entrée ——— */
  const MEM = 'crescite-entree';

  const retenir = v => { try { sessionStorage.setItem(MEM, v); } catch (err) { /* stockage indisponible : pas de mémoire */ } };

  /* les numéros des communes, appelés en marge comme des notes : dans l'ordre où les lignes de date les nomment */
  function numeroter(lignes) {
    const m = new Map();
    lignes.forEach(r => { if (r.l != null && K.lieux[r.l] && !m.has(r.l)) m.set(r.l, m.size + 1); });

  /* les dates groupées par mois : un intertitre formé des mots des lignes */
  function parMois(rows) {
    const G = [];
    rows.forEach(r => {
      const [y, m] = String(r.iso || '').split('-').map(Number), t = y ? `${ML[m - 1]} ${y}` : '';
      let g = G[G.length - 1];
      if (!g || g.t !== t) G.push(g = { t, r: [] });
      g.r.push(r);
    });
    G.forEach(g => { if (!g.r.some(r => r.ligne.includes(g.t))) g.t = ''; });
    return G;
  }

  /* une ligne de date : le numéro en marge, la date et le lieu (la ligne d'origine découpée), le spectacle, les détails */
  function ligne(r, num, { show = true, vers = null, fid = null } = {}) {
    let d = r.ligneDate, p = r.ligneLieu;
    if (d == null) { const i = r.ligne.indexOf(' — '); d = i < 0 ? r.ligne : r.ligne.slice(0, i); p = i < 0 ? '' : r.ligne.slice(i + 3); }
    const det = r.details || [];
    const lieu = p ? (r.lien && !det.some(x => x.lien) ? ext(r.lien, esc(p)) : esc(p)) : '';
