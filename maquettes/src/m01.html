          ${(C.dispositifs || []).length ? `<div class="di"><p class="fp-lb">${esc(L.dispositifs)}</p><ul>${C.dispositifs.map((x, i) => `<li${ac('dispositifs', i)}>${x}</li>`).join('')}</ul></div>` : ''}
          <p class="fp-l"><a class="go" href="${lien(s, 'etablissement')}" aria-label="${esc(L.decouvrir)} : ${esc(s.titre)}">${esc(L.decouvrir)}${ICON.r}</a>${C.dossier ? `<a class="go" href="${lien(s, 'etablissement')}">${esc(L.dossierScolaire)}${ICON.r}</a>` : ''}</p>
        </div>
      </li>`;
    };
    const lieux = [['etablissement', L.lieu.etablissement], ['salle', L.lieu.salle]];
    const autres = D.shows.filter(s => !lieux.some(([k]) => (s.actionCulturelle || {}).lieu === k));
    const photosAC = ['actions-culturelles/g-1', 'actions-culturelles/g-2', 'actions-culturelles/g-3', 'actions-culturelles/g-4'].filter(k => D.photos[k]);
    return { titre: e.texte, entree: 'etablissement', html: `<div class="wrap" style="--ec:var(--e-etablissement)">
      <header class="pg-h pg-h--e"><h1 class="pg-t" tabindex="-1">${esc(e.texte)}</h1></header>
      <div class="grid sec-b"><p class="lead"${ed('site.ecole.texte')}>${esc(S.ecole.texte)}</p></div>
      ${lieux.map(([k, t]) => { const ss = D.shows.filter(s => (s.actionCulturelle || {}).lieu === k); return ss.length ? `<section class="sec" aria-labelledby="h-l-${k}"><h2 class="sec-h" id="h-l-${k}">${esc(t)}</h2><ol class="cat">${ss.map(fe).join('')}</ol></section>` : ''; }).join('')}
      ${autres.length ? `<section class="sec" aria-labelledby="h-l-x"><h2 class="sec-h" id="h-l-x">${esc(L.aCompleter)}</h2><ol class="cat">${autres.map(fe).join('')}</ol></section>` : ''}
      <section class="sec" aria-labelledby="h-ac"><h2 class="sec-h" id="h-ac"${ed('site.actions.titre')}>${esc(A.titre)}</h2>
        <div class="sec-b grid ac">
          <div class="ac-txt prose">${A.blocs.map((b, i) => sous(bloc(b, `site.actions.blocs.${i}`))).join('')}</div>
          <figure class="ac-ph">${img('actions-culturelles', A.titre)}${A.credit ? `<figcaption${ed('site.actions.credit')}>${esc(A.credit)}</figcaption>` : ''}</figure>
          ${photosAC.length ? `<div class="ac-g">${photosAC.map(k => img(k, A.titre)).join('')}</div>` : ''}
        </div>
      </section>
      ${rows.length ? `<section class="sec" aria-labelledby="h-sco"><h2 class="sec-h" id="h-sco">${esc(L.enEtablissement)}</h2>
        <div class="grid ag lk" id="sco">
          <div class="ag-l">${chip()}${groupes(rows, num, { vers: 'etablissement' })}</div>
          <div class="ag-m">${plate({ lieux: CARTE.aVenir('scolaire'), num, label: L.enEtablissement })}</div>
        </div></section>` : ''}
      ${ecrire()}
    </div>`, apres() { lier(main.querySelector('#sco'), { filtre: true }); } };
  }

  function spectacles() {
    return { titre: menuTexte('spectacles'), onglet: 'spectacles', html: `<div class="wrap">
      <header class="pg-h"><h1 class="pg-t" tabindex="-1">${esc(L.spectacles)}</h1></header>
      <ul class="rep">${D.shows.map(s => `<li class="rp" style="${varsPapier(s)}">
        <span class="rp-ph"${edP(s, 'photo')}>${img(s.slug, '')}</span>
        <div class="rp-b">${s.statut ? `<p class="lab rp-k"${edS(s, 'statut')}>${esc(s.statut)}</p>` : ''}<h2 class="rp-t"><a href="${lien(s)}"${edS(s, 'titre')}>${esc(s.titre)}</a></h2>${s.sousTitre ? `<p class="rp-s"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}${s.lieuTemps ? `<p class="rp-lt"${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</p>` : ''}</div>
        <p class="rp-c"><span${edS(s, 'creation')}>${esc(s.creation)}</span>${gamme(s)}</p></li>`).join('')}</ul>
    </div>` };
  }

  function saison(id) {
    const Z = D.saisons[id], num = numeroter(Z.spectacles.flatMap(g => g.dates));
    return { titre: Z.titre, entree: 'voir', etat: 'true', html: `<div class="wrap" style="--ec:var(--e-voir)">
      <header class="pg-h pg-h--e"><h1 class="pg-t" tabindex="-1">${esc(Z.titre)}</h1></header>
      <div class="grid ag lk">
        <div class="ag-l">${chip()}
          ${Z.spectacles.map(g => `<section class="grp ss">
            <h2 class="ss-t">${g.slug && BY[g.slug] ? `<a href="${lien(BY[g.slug], 'voir')}">${esc(g.titre)}</a>` : esc(g.titre)}</h2>
            ${g.sousTitre ? `<p class="ss-st">${g.sousTitre}</p>` : ''}${g.creation ? `<p class="ss-c">${esc(g.creation)}</p>` : ''}
            <ul class="dls" data-agenda="">${g.dates.map(r => ligne(r, num, { show: false })).join('')}</ul></section>`).join('')}
        </div>
        <div class="ag-m">${plate({ lieux: CARTE.saison(id), num, label: Z.titre })}</div>
      </div>
      ${saisonsNav(id)}
    </div>`, apres() { lier(main.querySelector('.ag'), { filtre: true }); } };
  }

  /* ——— la page d'un spectacle : un en-tête d'univers commun, les trois onglets d'entrée ——— */
  function spectacle(s, cle) {
    const T = teinte(s), C = s.actionCulturelle || {}, sp = CARTE.spectacle(s.slug), motif = s.univers.motif;
    const k = [['statut', s.statut], ['creation', s.creation], ['lieuTemps', s.lieuTemps]].filter(x => x[1]).map(([c, t]) => `<span${edS(s, c)}>${esc(t)}</span>`).join('<span class="sep" aria-hidden="true">·</span>');
    const typeAC = C.aCompleter ? L.aCompleter : C.type, edAC = C.aCompleter ? '' : edS(s, 'actionCulturelle', 'type');
    const tete = `<header class="wrap show-h">
        <p class="lab show-k">${k}</p>
        <h1 class="show-t" tabindex="-1">${s.titreLignes.map((l, i) => `<span${edS(s, 'titreLignes', i)}>${esc(l)}</span>`).join('<br>')}</h1>
        ${s.sousTitre ? `<p class="show-st"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : ''}
        ${s.genre && s.genre !== s.sousTitre ? `<p class="show-st"${edS(s, 'genre')}>${esc(s.genre)}</p>` : ''}
        ${s.cadre ? `<p class="show-cadre"${edS(s, 'cadre')}>${esc(s.cadre)}</p>` : ''}
        ${s.accroche ? `<p class="show-acc"${edS(s, 'accroche')}>${esc(s.accroche)}</p>` : ''}
        ${typeAC ? `<p class="show-ac"><span class="lab">${esc(L.actionCulturelle)}</span>${cle === 'etablissement' ? `<span${edAC}>${esc(typeAC)}</span>` : `<a href="${lien(s, 'etablissement')}"${edAC}>${esc(typeAC)}</a>`}</p>` : ''}
        <span class="show-vg${LARGE.has(motif) ? ' vg-large' : ''}">${vignette(motif)}</span>
      </header>
      <figure class="wrap show-ph"${edP(s, 'photo')}>${img(s.slug, s.titre)}${s.credit ? `<figcaption${edS(s, 'credit')}>${esc(s.credit)}</figcaption>` : ''}</figure>
      <nav class="wrap tabs" aria-label="${esc(s.titre)}"><ul>${S.entrees.map(e => `<li><a href="${lien(s, e.cle)}"${e.cle === cle ? ' aria-current="page"' : ''}>${esc(e.court)}</a></li>`).join('')}</ul></nav>`;
    const corps = cle === 'programmer' ? ongletProgrammer(s, sp) : cle === 'etablissement' ? ongletEtablissement(s, sp) : ongletVoir(s, sp);
    const fin = `<div class="fin">${vignette(motif)}<p${ed('site.nom')}>${esc(S.nom)}</p></div>`;
    return { titre: cle === 'voir' ? s.titre : `${s.titre} - ${E[cle].court}`, entree: cle, etat: 'true', univers: s,
      html: `<article class="show">${tete}<div class="wrap">${corps}${fin}</div></article>`,
      apres() { ['#tournee', '#sco', '#diff'].forEach(id => lier(main.querySelector(id), { filtre: false })); } };
  }

  function ongletVoir(s, sp) {
    const rows = D.dates.filter(d => d.slug === s.slug && !d.scolaire), num = numeroter(rows);
    const lieux = sp.aVenir.map(x => ({ ...x, dates: x.dates.filter(d => !d.scolaire) })).filter(x => x.dates.length);
    const ph = (s.photos || []).filter(p => !p.etablissement && !p.atelier);
    const af = (s.affirmations || []).length ? `<div class="af">${s.affirmations.map((a, i) => `<p${edS(s, 'affirmations', i, 'texte')}>${esc(a.texte)}</p>`).join('')}</div>` : '';
    const cit = (s.citations || []).length ? `<div class="sec-b grid"><div class="ci">${s.citations.map((c, i) => `<figure${c.prose ? ' class="pr"' : ''}><blockquote><p>${c.vers.map((v, j) => `<span class="v"${edS(s, 'citations', i, 'vers', j)}>${esc(v)}</span>`).join('')}</p></blockquote>${c.source ? `<figcaption${edS(s, 'citations', i, 'source')}>${esc(c.source)}</figcaption>` : ''}</figure>`).join('')}</div></div>` : '';
    const sansListe = `<div data-agenda="${esc(s.slug)}"></div>`;   // sans date à venir : en mode édition, on y ajoute la première
    let tour;
    if (rows.length) tour = `<section class="sec lk" id="tournee" aria-labelledby="h-tour"><h2 class="sec-h" id="h-tour"${(s.tournee || {}).titre ? edS(s, 'tournee', 'titre') : ''}>${esc((s.tournee || {}).titre || L.actuellementEnTournee)}</h2>
      <div class="sec-b grid"><ul class="dls show-dls" data-agenda="${esc(s.slug)}">${rows.map(r => ligne(r, num, { show: false })).join('')}</ul>
      <div class="show-pl">${plate({ lieux, passe: sp.passe, num, label: (s.tournee || {}).titre || L.actuellementEnTournee })}</div></div></section>`;
    else if (s.tournee && s.tournee.texte) tour = `<section class="sec" aria-labelledby="h-tour"><h2 class="sec-h" id="h-tour">${esc(L.dates)}</h2>
      <div class="sec-b grid"><p class="show-ann"><span class="lab"${edS(s, 'tournee', 'titre')}>${esc(s.tournee.titre)}</span><span${edS(s, 'tournee', 'texte')}>${esc(s.tournee.texte)}</span></p><div class="show-pl">${plate({ passe: sp.passe, label: s.tournee.titre })}</div></div>${sansListe}</section>`;
    else tour = `<section class="sec" aria-labelledby="h-tour"><h2 class="sec-h" id="h-tour">${esc(L.saisonsPrecedentes)}</h2>
      <div class="sec-b grid"><div class="pl-seul">${plate({ passe: sp.passe, label: L.saisonsPrecedentes })}</div></div>${sansListe}</section>`;
    return `${af}
      <section class="sec" aria-labelledby="h-le"><h2 class="sec-h" id="h-le">${esc(L.leSpectacle)}</h2>
        <div class="sec-b grid"><div class="txt">${(s.texte || []).map((p, i) => `<p${edS(s, 'texte', i)}>${p}</p>`).join('')}${s.video ? `<p class="va">${ext(s.video.url, esc(L.bandeAnnonce))}</p>` : ''}</div></div>
        ${cit}
      </section>
      ${ph.length ? `<section class="sec" aria-labelledby="h-ph"><h2 class="sec-h" id="h-ph">${esc(L.photos)}</h2><div class="sec-b">${galerie(s, ph)}</div></section>` : ''}
      ${tour}
      <section class="sec" aria-labelledby="h-dist"><h2 class="sec-h" id="h-dist">${esc(L.distribution)}</h2>
        <div class="sec-b grid"><div class="fiche">${((s.programmer || {}).equipeCreation || []).map((x, i) => `<p class="fi"${edS(s, 'programmer', 'equipeCreation', i)}>${esc(x)}</p>`).join('') || fiche(s)}</div></div>
      </section>`;
  }

  function ongletProgrammer(s, sp) {
    const P = s.programmer || {}, dos = s.dossier && D.dossiers[s.dossier], faits = faitsDe(s);
    const rows = D.dates.filter(d => d.slug === s.slug), num = numeroter(rows);
    const A = dos && dos.accueil, imp = (s.photos || []).find(p => p.id === 'd-implantation-1');
    const ea = (...k) => ed(['dossiers', s.dossier, 'accueil', ...k].join('.'));
    return `<section class="sec" aria-labelledby="h-pr"><h2 class="sec-h" id="h-pr">${esc(L.leSpectacle)}</h2>
        <div class="sec-b grid">
          <div class="pf">
            ${repDe(s)}
            ${faits.length ? `<ul class="fp-f">${faits.join('')}</ul>` : ''}
            ${s.video ? `<p class="va">${ext(s.video.url, esc(L.bandeAnnonce))}</p>` : ''}
          </div>
          ${(P.equipeCreation || []).length ? '' : `<div class="pf-c fiche">${fiche(s, { duree: false })}</div>`}
        </div>
      </section>
      ${A ? `<section class="sec" aria-labelledby="h-ft"><h2 class="sec-h" id="h-ft"${ea('fiche')}>${esc(A.fiche)}</h2>
        <div class="sec-b grid">
          <div class="ft"><h3${ea('titre')}>${esc(A.titre)}</h3>${A.blocs.map((b, i) => `${b.titre ? `<h3${ea('blocs', i, 'titre')}>${esc(b.titre)}</h3>` : ''}<ul>${b.lignes.map((x, j) => `<li${ea('blocs', i, 'lignes', j)}>${x}</li>`).join('')}</ul>`).join('')}
            ${A.alerte ? `<p class="ft-al"${ea('alerte')}>${A.alerte}</p>` : ''}</div>
          ${imp ? `<figure class="ft-ph"${edP(s, 'photos', rangPh(s, imp))}>${img(imp.cle, imp.legende || s.titre)}${imp.legende || s.creditDossier ? `<figcaption>${legende(imp.legende, `shows.${s.slug}.photos.${rangPh(s, imp)}.legende`)}${s.creditDossier ? `<span class="cr"${edS(s, 'creditDossier')}>${esc(s.creditDossier)}</span>` : ''}</figcaption>` : ''}</figure>` : ''}
        </div></section>` : ''}
      <section class="sec lk" id="diff" aria-labelledby="h-lx"><h2 class="sec-h" id="h-lx">${esc(L.lieuxDiffusion)}</h2>
        <div class="sec-b grid">
          <div class="pl-seul">${plate({ lieux: sp.aVenir, passe: sp.passe, num, label: L.lieuxDiffusion })}</div>
        </div>
        ${rows.length ? `<ul class="notes" data-agenda="${esc(s.slug)}">${rows.map(r => `<li data-date-id="${esc(r.id ?? '')}" data-l="${r.l}"><span class="nt-n" aria-hidden="true">${num.get(r.l) ?? ''}</span><span class="nt-t">${esc(r.ligne)}</span>${r.scolaire ? `<span class="nt-k">${esc(L.scolaire)}</span>` : ''}</li>`).join('')}</ul>` : ''}
        ${P.lieux ? `<details class="lx"><summary>${esc(L.lieuxDiffusion)}</summary><p${edS(s, 'programmer', 'lieux')}>${esc(P.lieux)}</p></details>` : ''}
      </section>
      ${ecrire()}`;
  }

  function ongletEtablissement(s, sp) {
    const C = s.actionCulturelle || {}, dos = s.dossier && D.dossiers[s.dossier];
    const rows = D.dates.filter(d => d.slug === s.slug && d.scolaire), num = numeroter(rows);
    const lieux = sp.aVenir.map(x => ({ ...x, dates: x.dates.filter(d => d.scolaire) })).filter(x => x.dates.length);
    const phE = (s.photos || []).filter(p => p.etablissement), phA = (s.photos || []).filter(p => p.atelier);
    const ak = (...k) => edS(s, 'actionCulturelle', ...k);
    const tags = [C.lieu && L.lieu[C.lieu] && `<span>${esc(L.lieu[C.lieu])}</span>`, C.public && `<span><span class="lb">${esc(L.public)}</span><span${ak('public')}>${esc(C.public)}</span></span>`, C.statut && `<span${ak('statut')}>${esc(C.statut)}</span>`].filter(Boolean);
    const ac = `<section class="sec" aria-labelledby="h-ac"><h2 class="sec-h" id="h-ac">${esc(L.actionCulturelle)}</h2>
      <div class="sec-b grid">
        <div class="ac-l">
          <p class="ac-type"${!C.aCompleter && C.type ? ak('type') : ''}>${esc(C.aCompleter ? L.aCompleter : C.type || L.aCompleter)}</p>
          ${tags.length ? `<p class="ac-tags">${tags.join('')}</p>` : ''}
          ${(C.textes || []).length ? `<div class="ac-x">${C.textes.map((t, i) => `<p${ak('textes', i, 'texte')}>${t.texte}</p>`).join('')}</div>` : ''}
        </div>
        ${(C.formule || []).length || (C.dispositifs || []).length ? `<div class="ac-r">
          ${(C.formule || []).length ? `<ul class="fo">${C.formule.map((x, i) => `<li${ak('formule', i)}>${esc(x)}</li>`).join('')}</ul>` : ''}
          ${(C.dispositifs || []).length ? `<div class="di"><p class="fp-lb">${esc(L.dispositifs)}</p><ul>${C.dispositifs.map((x, i) => `<li${ak('dispositifs', i)}>${x}</li>`).join('')}</ul></div>` : ''}
        </div>` : ''}
      </div>
      ${phE.length ? `<div class="gal-et">${galerie(s, phE)}</div>` : ''}
    </section>`;
    const dates = rows.length ? `<section class="sec" aria-labelledby="h-sco"><h2 class="sec-h" id="h-sco">${esc(L.enEtablissement)}</h2>
      <div class="sec-b grid lk" id="sco"><ul class="dls show-dls" data-agenda="${esc(s.slug)}">${rows.map(r => ligne(r, num, { show: false })).join('')}</ul>
      <div class="show-pl">${plate({ lieux, num, label: L.enEtablissement })}</div></div></section>` : '';
    let ds = '';
    if (dos) {
      const Q = dos.pourquoi, G = dos.programmes, Cs = dos.consignes, At = dos.ateliers, eD = (...k) => ed(['dossiers', s.dossier, ...k].join('.'));
      ds = `<section class="sec ds" aria-labelledby="h-ds"><h2 class="sec-h" id="h-ds">${esc(L.dossierScolaire)}</h2>
        <div class="sec-b">
          <h3 id="h-pq"${eD('pourquoi', 'titre')}>${esc(Q.titre)}</h3>
          <div class="pq">${Q.sections.map((x, i) => `<section><h4${eD('pourquoi', 'sections', i, 'titre')}>${esc(x.titre)}</h4><p${eD('pourquoi', 'sections', i, 'texte')}>${x.texte}</p></section>`).join('')}</div>
          <h3 id="h-prog"${eD('programmes', 'titre')}>${esc(G.titre)}</h3>
          <div class="tb-w"><table class="tb" aria-labelledby="h-prog">${G.niveaux.map((n, ni) => `<tbody><tr class="tb-n"><th colspan="3" scope="rowgroup"${eD('programmes', 'niveaux', ni, 'niveau')}>${esc(n.niveau)}</th></tr>${n.lignes.map((x, i) => { const lg = (...k) => eD('programmes', 'niveaux', ni, 'lignes', i, ...k);
            return `<tr><th scope="row"${lg('matiere')}>${esc(x.matiere)}</th><td class="tb-i"${lg('intitule')}>${esc(x.intitule)}</td><td${lg('objectif')}>${esc(x.objectif)}</td></tr>`; }).join('')}</tbody>`).join('')}</table></div>
          <h3${eD('consignes', 'titre')}>${esc(Cs.titre)}</h3>
          <div class="cs">
            <p><span class="cs-n"${eD('consignes', 'note')}>${esc(Cs.note)}</span></p>
            <p${eD('consignes', 'intro')}>${esc(Cs.intro)}</p>
            <ul class="cs-d">${Cs.demandes.map((x, i) => `<li${eD('consignes', 'demandes', i)}>${esc(x)}</li>`).join('')}</ul>
            <p${eD('consignes', 'apres')}>${Cs.apres}</p>
            <ul class="cs-a">${Cs.axes.map((x, i) => `<li${eD('consignes', 'axes', i)}>${x}</li>`).join('')}</ul>
            <p${eD('consignes', 'atelier')}>${Cs.atelier}</p>
          </div>
          <h3${eD('ateliers', 'titre')}>${esc(At.titre)}</h3>
          <ol class="at">${At.liste.map((a, i) => { const ak2 = (...k) => eD('ateliers', 'liste', i, ...k);
            return `<li><div class="at-b">
            <h4${ak2('titre')}>${a.titre}</h4>
            ${(a.paragraphes || []).map((p, j) => `<p${ak2('paragraphes', j)}>${p}</p>`).join('')}
            ${(a.etapes || []).length ? `<ul class="at-e">${a.etapes.map((x, j) => `<li><p${ak2('etapes', j, 'titre')}>${x.titre}</p><p${ak2('etapes', j, 'texte')}>${x.texte}</p></li>`).join('')}</ul>` : ''}
            ${(a.points || []).length ? `<ul class="at-p">${a.points.map((x, j) => `<li${ak2('points', j)}>${x}</li>`).join('')}</ul>` : ''}
          </div></li>`; }).join('')}</ol>
          ${phA.length ? `<div class="gal-et">${galerie(s, phA, 'gal-at')}</div>` : ''}
        </div>
      </section>`;
    }
    return `${ac}${dates}${ds}${ecrire()}`;
  }

  function compagnie() {
    const C = S.compagnie, Dr = C.directeur;
    return { titre: menuTexte('compagnie'), onglet: 'compagnie', html: `<div class="wrap">
      <header class="pg-h"><h1 class="pg-t" tabindex="-1"${ed('site.compagnie.titre')}>${esc(C.titre)}</h1></header>
      <div class="grid co">
        <div class="co-txt">${C.paragraphes.map((p, i) => `<p${i ? '' : ' class="co-1"'}${ed(`site.compagnie.paragraphes.${i}`)}>${p}</p>`).join('')}</div>
        <aside class="co-d" aria-labelledby="h-dates"><h2 class="lab" id="h-dates"${ed('site.compagnie.datesTitre')}>${esc(C.datesTitre)}</h2>
          <ol class="chrono">${C.dates.map((d, i) => `<li><span class="yr"${ed(`site.compagnie.dates.${i}.annee`)}>${esc(d.annee)}</span><span class="ti"${ed(`site.compagnie.dates.${i}.titre`)}>${esc(d.titre)}</span></li>`).join('')}</ol></aside>
      </div>
      ${Dr ? `<section class="sec" aria-labelledby="h-dir"><h2 class="sec-h" id="h-dir"${ed('site.compagnie.directeur.titre')}>${esc(Dr.titre)}</h2>
        <div class="sec-b grid"><div class="co-txt">${Dr.chapeau ? `<p class="co-1"${ed('site.compagnie.directeur.chapeau')}>${esc(Dr.chapeau)}</p>` : ''}${Dr.paragraphes.map((p, i) => `<p${ed(`site.compagnie.directeur.paragraphes.${i}`)}>${p}</p>`).join('')}</div></div>
      </section>` : ''}
      <div class="sec grid"><p class="part"${ed('site.partenaires')}>${S.partenaires}</p></div>
    </div>` };
  }

  function contact() {
    const C = S.contact, co = S.coordonnees, pol = S.liensLegaux[S.liensLegaux.length - 1];
    const types = ['text', 'email', 'tel', 'text'], auto = ['name', 'email', 'tel', 'address-level2'];
    const champs = C.champs.map((c, i) => i === C.champs.length - 1
      ? `<p class="fld"><label for="ct-${i}">${esc(c)}</label><textarea id="ct-${i}" rows="6"></textarea></p>`
      : `<p class="fld"><label for="ct-${i}">${esc(c)}</label><input id="ct-${i}" type="${types[i] || 'text'}" autocomplete="${auto[i] || 'off'}"></p>`).join('');
    const k = C.consentement.toLowerCase().indexOf(pol.texte.toLowerCase());
    const accord = k < 0 ? `<a href="${esc(pol.href)}">${esc(C.consentement)}</a>`
      : `${esc(C.consentement.slice(0, k))}<a href="${esc(pol.href)}">${esc(C.consentement.slice(k, k + pol.texte.length))}</a>${esc(C.consentement.slice(k + pol.texte.length))}`;
    return { titre: menuTexte('contact'), onglet: 'contact', html: `<div class="wrap">
      <header class="pg-h"><h1 class="pg-t" tabindex="-1"${ed('site.contact.titre')}>${esc(C.titre)}</h1></header>
      <div class="grid">
        <form class="frm" action="#" novalidate>
          ${champs}
          <p class="chk"><input id="ct-ok" type="checkbox"><label for="ct-ok">${accord}</label></p>
          <p class="fld fld--calc"><label for="ct-calc">${esc(C.calcul)}</label><input id="ct-calc" inputmode="numeric" maxlength="2" autocomplete="off"></p>
          <p><button class="btn" type="submit">${esc(C.bouton)}</button></p>
        </form>
        <aside class="ct-c"><p class="ct-n"${ed('site.coordonnees.nom')}>${esc(co.nom)}</p><p>${co.adresse.map((x, i) => `<span${ed(`site.coordonnees.adresse.${i}`)}>${esc(x)}</span>`).join('<br>')}</p></aside>
      </div>
    </div>` };
  }

  function legal(id) {
    const Lg = S.legal[id];
    return { titre: Lg.titre, html: `<div class="wrap">
      <header class="pg-h"><h1 class="pg-t" tabindex="-1"${ed(`site.legal.${id}.titre`)}>${esc(Lg.titre)}</h1></header>
      <div class="grid"><div class="legal prose">${Lg.blocs.map((b, i) => /Conception et réalisation/i.test(b) ? '' : bloc(b, `site.legal.${id}.blocs.${i}`)).join('')}</div></div>
    </div>` };
  }

  /* ——— le cadre commun : la marque, les trois entrées, le menu second, le pied de page (refait si D change) ——— */
  const octo = document.getElementById('octo'), ent = document.getElementById('ent'), entL = document.getElementById('ent-l');
  const navL = document.getElementById('nav-l'), nav = document.getElementById('nav'), btn = document.getElementById('menu');
  const ico = document.createElement('link');
  ico.rel = 'icon';
  document.head.appendChild(ico);
  const POSES = new WeakMap();
  const remplir = (n, html) => { if (POSES.get(n) !== html) { POSES.set(n, html); n.innerHTML = html; } };   // ne touche pas à ce qui n'a pas changé
  function cadre() {
    if (octo.dataset.src !== D.logo.octopus) {
      octo.dataset.src = D.logo.octopus;
      octo.innerHTML = D.logo.octopus;
      const lsvg = octo.querySelector('svg');
      if (lsvg) { lsvg.setAttribute('aria-hidden', 'true'); lsvg.setAttribute('focusable', 'false'); lsvg.removeAttribute('role'); lsvg.removeAttribute('aria-label'); }
    }
    document.getElementById('brand-n').textContent = S.nom;
    const icone = 'data:image/svg+xml,' + encodeURIComponent(D.logo.mark);
    if (ico.getAttribute('href') !== icone) ico.setAttribute('href', icone);
    remplir(entL, S.entrees.map(e => `<li><a href="${esc(e.href)}" data-e="${esc(e.cle)}" style="--ec:var(--e-${esc(e.cle)})"><span class="e-l">${esc(e.texte)}</span><span class="e-c">${esc(e.court)}</span></a></li>`).join(''));
    remplir(navL, S.menu.map(m => `<li><a href="${esc(m.href)}" data-id="${esc(m.id)}">${esc(m.texte)}</a></li>`).join(''));
    nav.setAttribute('aria-label', L.menu);
    btn.textContent = L.menu;
    const co = S.coordonnees;
    remplir(document.getElementById('foot'), `
    <div class="f-c"><p><span class="f-n"${ed('site.coordonnees.nom')}>${esc(co.nom)}</span>${co.adresse.map((a, i) => `<span class="f-a"${ed(`site.coordonnees.adresse.${i}`)}>${esc(a)}</span>`).join('')}</p></div>
    <div class="f-c2"><p><a href="${esc(S.ecrire.href)}">${esc(S.ecrire.texte)}</a></p><p>${S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : esc(S.facebook.texte)}</p></div>
    <div class="f-p"><p${ed('site.partenaires')}>${S.partenaires}</p></div>
    <div class="f-c"><p>${co.legal.map((x, i) => `<span class="f-a"${ed(`site.coordonnees.legal.${i}`)}>${esc(x)}</span>`).join('')}</p><p>${S.liensLegaux.map(x => `<a href="${esc(x.href)}">${esc(x.texte)}</a>`).join('<br>')}${typeof EDITION !== 'undefined' && L.modifierSite ? `<br><button type="button" class="f-mod" data-modifier>${PLUME}<span>${esc(L.modifierSite)}</span></button>` : ''}</p></div>`);
  }
  // sur ordinateur, le libellé entier si la place le permet, sinon le court
  const ajuster = () => { ent.classList.remove('court'); if ([...ent.querySelectorAll('.e-l')].some(t => t.offsetParent && t.scrollWidth > t.clientWidth + 1)) ent.classList.add('court'); };
  const menu = open => { nav.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); };
  btn.addEventListener('click', () => menu(!nav.classList.contains('open')));
  // « Modifier le site » : la connexion puis l'édition sur place (EDITION, commun aux maquettes)
  document.getElementById('foot').addEventListener('click', e => { if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') EDITION.ouvrir(); });
  nav.addEventListener('click', e => { if (e.target.closest('a')) menu(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && nav.classList.contains('open')) { menu(false); btn.focus(); } });

  /* l'univers d'un spectacle habille toute la page : le papier, l'encre, l'accent, la lueur */
  function habiller(s) {
    const b = document.body;
    if (!s) { b.className = ''; b.setAttribute('style', couleursEntrees(PAPIER)); return; }
    const T = teinte(s);
    b.className = 'u ' + (T.clair ? 'u-clair' : 'u-sombre');
    b.setAttribute('style', `--paper:${T.f};--paper2:${T.f2};--ink:${T.t};--ink2:${T.t2};--rule:${T.rule};--mag:${T.at};--acc:${T.a};--titre:${T.h};--lueur:${T.l};${police(T)};color-scheme:${T.clair ? 'light' : 'dark'};${couleursEntrees(T.f)}`);
  }

  const VUES = { '': accueil, voir, programmer, etablissement, spectacles, compagnie, contact,
    'mentions-legales': () => legal('mentions-legales'), 'politique-de-confidentialite': () => legal('politique-de-confidentialite') };
  // enPlace : la même vue refaite après un changement de D (pas de retour en haut, pas de focus, pas d'animation d'entrée)
  let EN_PLACE = false;
  function route(enPlace = false) {
    EN_PLACE = enPlace;
    relire();
    PL.clear();
    const brut = (location.hash || '#/').replace(/\/+$/, '');
    if (Object.prototype.hasOwnProperty.call(S.redirections, brut)) { location.replace(S.redirections[brut]); return; }
    let path = brut.replace(/^#\/?/, '').split('?')[0];
    try { path = decodeURIComponent(path); } catch (err) { path = '\u0000'; }
    const [a, b, c, d] = path.split('/');
    let v = null;
    if (a === 'spectacle' && BY[b] && !d) {
      if (!c) { location.replace(`#/spectacle/${b}/${retenue() || 'voir'}`); return; }
      if (E[c]) v = spectacle(BY[b], c);
    } else if (a === 'agenda' && b === D.saison && !c) { location.replace(E.voir.href); return; }
    else if (a === 'agenda' && b && D.saisons[b] && !c) v = saison(b);
    else if (!b && Object.prototype.hasOwnProperty.call(VUES, a)) v = VUES[a]();
    if (!v) { v = accueil(); try { history.replaceState(null, '', '#/'); } catch (err) { /* adresse laissée telle quelle */ } }
    if (v.entree && !v.etat || v.univers) retenir(v.entree);
    habiller(v.univers || null);
    main.classList.toggle('en-place', enPlace);
    main.innerHTML = v.html;
    document.title = `${v.titre} - ${S.titreSuffixe}`;
    ent.querySelectorAll('a[data-e]').forEach(x => { if (x.dataset.e === v.entree) x.setAttribute('aria-current', v.etat || 'page'); else x.removeAttribute('aria-current'); });
    navL.querySelectorAll('a[data-id]').forEach(x => { if (x.dataset.id === v.onglet) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
    if (!enPlace) { menu(false); window.scrollTo(0, 0); }
    main.querySelectorAll('svg.pl').forEach(poser);
    if (v.apres) v.apres();
    if (!enPlace) { const h1 = main.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
  }

  /* la base a changé D : la vue courante est refaite en place. On garde la position de lecture, l'élément qui a le focus,
     ce qui a été saisi dans un formulaire et les volets ouverts ; ni l'ouverture ni les animations d'entrée ne sont rejouées. */
  const ZONES = ['#main', '.site-h', '.site-f'];
  function repere(el) {
    if (!el || el === document.body || !document.contains(el)) return null;
    if (el.id) return { id: el.id };
    const zone = ZONES.find(z => el.closest(z));
    if (!zone) return null;
    const attr = ['href', 'data-l', 'data-e', 'data-id', 'data-i', 'for'].find(x => el.hasAttribute(x));
    const val = attr ? el.getAttribute(attr) : '';
    const sel = el.tagName.toLowerCase() + (attr ? `[${attr}="${window.CSS && CSS.escape ? CSS.escape(val) : val.replace(/["\\]/g, '\\$&')}"]` : '');
    return { zone, sel, i: [...document.querySelector(zone).querySelectorAll(sel)].indexOf(el) };
  }
  function retrouver(k) {
    if (!k) return null;
    if (k.id) return document.getElementById(k.id);
    const zone = document.querySelector(k.zone);
    return zone ? zone.querySelectorAll(k.sel)[Math.max(0, k.i)] || null : null;
  }
  function rafraichir() {
    const actif = document.activeElement, k = repere(actif), x = window.scrollX, y = window.scrollY;
    const champs = [...main.querySelectorAll('input[id], textarea[id]')].map(f => ({ id: f.id, v: f.value, c: f.checked }));
    let sel = null;
    try { if (actif && actif.matches('input[id], textarea[id]') && actif.selectionStart != null) sel = [actif.selectionStart, actif.selectionEnd]; } catch (err) { sel = null; }
    const ouverts = [...main.querySelectorAll('details')].map(d => d.open);
    relire();
    cadre();
    route(true);
    champs.forEach(f => { const n = document.getElementById(f.id); if (n) { n.value = f.v; n.checked = f.c; } });
    main.querySelectorAll('details').forEach((d, i) => { if (ouverts[i]) d.open = true; });
    ajuster();
    window.scrollTo(x, y);
    const el = retrouver(k);
    if (el && el !== document.activeElement) {
      el.focus({ preventScroll: true });
      if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (err) { /* champ sans sélection */ }
    }
  }

  main.addEventListener('submit', e => e.preventDefault());
  document.querySelector('.skip').addEventListener('click', e => { e.preventDefault(); (main.querySelector('h1') || main).focus(); });
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) { e.preventDefault(); route(); }
  });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { ajuster(); main.querySelectorAll('svg.pl').forEach(poser); }, 120); });
  // les tentacules : gravées (un trait à hachures), à l'encre du programme ; les pages sans couleur reprennent le magenta du programme
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ style: 'trait', neutre: '#a8306f', entrees: 'couleur' });
  addEventListener('hashchange', () => route());
  relire();
  cadre();
  route();
  ajuster();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);
  if (typeof DONNEES !== 'undefined' && DONNEES.surChangement) DONNEES.surChangement(rafraichir);
  INTRO.ouvrir({ fond: '#f6f2ec', encre: '#1c1917', mot: true, classe: 'programme' });
})();
</script>
</body>
</html>
