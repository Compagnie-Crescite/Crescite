<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compagnie Crescite — théâtre à Rouen</title>
<meta name="description" content="Compagnie Crescite, théâtre à Rouen : spectacles, agenda de la saison, la compagnie.">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2ec;--ink:#1c1917;--ink2:#57514a;--rule:#d8d0c4;--mag:#a8306f;
  --m:clamp(20px,5.5vw,80px);--g:32px;
  --s1:.875rem;--s2:1.75rem;--s3:2.625rem;--s4:3.5rem;
  --sec:clamp(4.375rem,3rem + 4vw,7rem);
  --fs-s:1rem;--fs-b:1.125rem;--fs-m:1.5rem;--fs-l:2rem;
  --fs-hero:clamp(2rem,1.2rem + 2.6vw,3rem);
  --fs-show:clamp(3rem,1.5rem + 5.4vw,6.5rem);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:var(--fs-b);line-height:1.75rem;font-weight:400;font-optical-sizing:auto;font-kerning:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
p,h1,h2,h3,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:var(--rule)}
@media (hover:hover){a:hover{color:var(--mag);text-decoration-color:currentColor}.menu:hover,.brand:hover .brand-n,.pg-next:hover .lbl{color:var(--mag)}}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
main:focus,section:focus,footer:focus,h1[tabindex="-1"]:focus{outline:none}
sup{font-size:.62em;line-height:0;vertical-align:.52em;margin-left:.02em}
i i,em i,.ix-t i,.exergue i,.door-t i{font-style:normal}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--m);top:-4rem;background:var(--paper);padding:.5rem 0;z-index:2}
.skip:focus{top:.5rem}
.sc,.lbl,.sec-h,.c-pub,.ag thead th,.facts dt,.f-l{font-variant-caps:all-small-caps;letter-spacing:.07em;font-weight:520}
.ac{font-variant-caps:all-small-caps;letter-spacing:.04em;font-weight:500}
.nw{white-space:nowrap}
.af{font-style:italic;color:var(--ink2)}
.ar{display:inline-block;width:.9em;height:.5em;vertical-align:.03em;fill:none;stroke:currentColor;stroke-width:1.2;overflow:visible}
.ar-ne{width:.5em;height:.5em;vertical-align:.12em}

.wrap{width:min(1120px,100% - 2*var(--m));margin-inline:auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g)}

.site-h{border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:4.375rem;column-gap:var(--g)}
.brand{display:flex;align-items:center;gap:.75rem;color:var(--ink);text-decoration:none}
.brand:hover{color:var(--ink)}
.octo{display:block;width:34px}
.octo svg{display:block;width:100%;height:auto}
.brand-n{font-weight:500;letter-spacing:.005em}
.nav{align-self:stretch;margin-bottom:-1px}
.nav ul{display:flex;gap:2.25rem;height:100%}
.nav li{display:flex}
.nav a{display:flex;align-items:center;text-decoration:none}
.nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--mag)}
.menu{display:none;font:inherit;color:var(--ink);background:none;border:0;padding:.5rem 0;cursor:pointer}

.hero{padding-top:var(--sec)}
.hero-t{grid-column:1/span 9;font-size:var(--fs-hero);line-height:1.15;letter-spacing:-.012em;text-wrap:balance}
.hero-m{grid-column:1/span 9;margin-top:var(--s3);color:var(--ink2);font-variant-numeric:tabular-nums}

.pg-h{padding-top:var(--sec)}
.pg-t{grid-column:1/-1;font-size:var(--fs-show);line-height:1.02;font-weight:400;letter-spacing:-.018em;text-wrap:balance}
.pg-l{grid-column:1/span 8;margin-top:var(--s3);font-size:var(--fs-m);line-height:2.125rem;color:var(--ink2);text-wrap:pretty}
.pg-l a{color:var(--ink)}

.sec{margin-top:var(--sec);border-top:1px solid var(--ink);padding-top:var(--s1)}
.sec-h{display:flex;align-items:baseline;font-size:var(--fs-m);line-height:2rem;font-weight:500;letter-spacing:.08em}
.sec-h .num{flex:none;min-width:calc((100% + var(--g)) / 12);padding-right:.5em;color:var(--mag)}
.sec-b{margin-top:var(--s4)}
.sec--m{margin-top:var(--s4)}
.sec--m1{margin-top:var(--sec)}
.sec--m .sec-b{margin-top:var(--s2)}
.more{margin-top:var(--s2)}
.more a,.door-a a,.pg-back{text-decoration:none}
.intro{max-width:40em;color:var(--ink2)}

.ag{display:block;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums}
.ag caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ag thead,.ag tbody{display:block}
.ag tr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:start;padding-block:var(--s1);border-top:1px solid var(--rule)}
.ag thead tr{border-top:0;padding-top:0;padding-bottom:var(--s1)}
.ag tbody:last-child tr:last-child{border-bottom:1px solid var(--rule)}
.ag th,.ag td{display:block;padding:0;text-align:left;font-weight:400;min-width:0}
.ag thead th{color:var(--ink2);font-weight:500}
.ag--nh thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.c-date{grid-column:1/span 3}
.c-show{grid-column:4/span 3}
.c-place{grid-column:7/span 4}
.c-pub{grid-column:11/span 2;color:var(--ink2);font-weight:500}
.ag--one .c-place{grid-column:4/span 5}
.ag--one .c-pub{grid-column:9/span 4}
.d1{display:block;white-space:nowrap}
.wd{display:inline-block;width:2.2em}
.dn{display:inline-block;width:1.1em;text-align:right}
.d2,.p2{display:block;color:var(--ink2)}
.p1,.d2{display:block}
.c-show a{font-style:italic}

.ix-list{grid-column:1/span 9;border-bottom:1px solid var(--rule)}
.ix-list li{border-top:1px solid var(--rule)}
.ix{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"t s m";column-gap:1.25rem;align-items:baseline;padding-block:var(--s1);color:var(--ink);text-decoration:none}
.ix:hover{color:var(--ink)}
.ix-t{grid-area:t;font-size:var(--fs-l);line-height:2.625rem;font-style:italic;letter-spacing:-.005em}
.ix-st{grid-area:s;color:var(--ink2);min-width:0}
.ix-m{grid-area:m;display:flex;color:var(--ink2);font-variant-numeric:tabular-nums lining-nums}
.ix-y{width:2.6em}
.ix-d{width:3.3em;text-align:right}
.ix-ph{display:none}
.ix-note{grid-column:1/span 9;margin-top:var(--s2);color:var(--ink2)}
@media (hover:hover) and (pointer:fine) and (min-width:1024px){
  .ix:hover,.ix:hover .ix-st,.ix:hover .ix-m,.ix:focus-visible,.ix:focus-visible .ix-st,.ix:focus-visible .ix-m{color:var(--mag)}
  .ix:hover .ix-ph,.ix:focus-visible .ix-ph{display:block;position:absolute;left:calc(100% + var(--g));top:50%;width:200px;transform:translateY(-50%);pointer-events:none}
  .ix-ph img{width:100%;aspect-ratio:3/2;object-fit:cover}
}

.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--g)}
.door{display:grid;grid-template-rows:subgrid;grid-row:span 3;align-content:start}
.doors--c .door{grid-row:span 4}
.door-t{font-size:var(--fs-m);line-height:2rem;font-style:italic;font-weight:400;margin-bottom:var(--s1)}
.door .door-a{margin-top:var(--s2)}
.door .kv{margin-top:var(--s1)}
.door p + p{margin-top:var(--s1)}

.co-text{grid-column:1/span 6}
.co-part{grid-column:9/span 4}
.co-lead{font-size:var(--fs-m);line-height:2.125rem;text-wrap:pretty}
.co-g,.show-b{align-items:baseline}
.kv2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:var(--g);margin-top:var(--s3)}
.kv2 div{display:grid;grid-template-columns:subgrid;grid-column:1/-1}
.kv2 div + div{margin-top:var(--s1)}
.kv2 dt{grid-column:1/span 2;font-variant-caps:all-small-caps;letter-spacing:.07em;font-weight:520;color:var(--ink2)}
.kv2 dd{grid-column:3/span 4;margin:0}
.lbl{display:block;color:var(--ink2)}
.plain li + li{margin-top:0}
.kv div + div{margin-top:var(--s1)}
.kv dt{font-variant-caps:all-small-caps;letter-spacing:.07em;font-weight:520;color:var(--ink2)}
.kv dd{margin:0}

.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--g);row-gap:var(--s2)}
.figs li{border-top:1px solid var(--rule);padding-top:var(--s1)}
.fig-n{display:block;font-size:var(--fs-hero);line-height:1.15;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.fig-l{display:block;margin-top:.5rem;color:var(--ink2)}
.src{margin-top:var(--s2);font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.cast{margin-top:var(--s3);columns:3;column-gap:var(--g)}
.cast li{break-inside:avoid;padding-bottom:var(--s1)}
.cast-n{display:block}
.cast-s{display:block;font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}

.site-f{margin-top:var(--sec);border-top:1px solid var(--rule);padding-block:var(--s2) var(--s4);font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.site-f .grid{row-gap:var(--s2)}
.f-c{grid-column:span 3}
.f-l{display:block;color:var(--ink);font-weight:520}
.f-c p + p{margin-top:var(--s1)}

.crumb{margin-top:var(--s4);color:var(--ink2)}
.crumb a{text-decoration:none}
.crumb .sep{margin-inline:.45em}
.show-t{margin-top:var(--s3);font-size:var(--fs-show);line-height:1.02;font-style:italic;font-weight:400;letter-spacing:-.018em;text-wrap:balance}
.show-st{margin-top:var(--s1);font-size:var(--fs-m);line-height:2rem;color:var(--ink2);text-wrap:balance}
.show-ph{margin-top:var(--s4)}
.show-ph img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--rule)}
.show-ph figcaption{margin-top:.5rem;font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2)}
.show-b{margin-top:var(--s4)}
.show-txt{grid-column:1/span 6}
.exergue{font-size:var(--fs-m);line-height:2.125rem;font-style:italic;text-wrap:pretty}
.prose{margin-top:var(--s2);hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;text-wrap:pretty}
.mentions{margin-top:var(--s3);padding-top:var(--s1);border-top:1px solid var(--rule);font-size:var(--fs-s);line-height:1.5rem;color:var(--ink2);hyphens:auto;-webkit-hyphens:auto}
.mentions p + p{margin-top:.5rem}
.facts-col{grid-column:9/span 4}
.kf3{display:flex;flex-wrap:wrap;column-gap:var(--g);row-gap:var(--s1)}
.kf3 + .crs{margin-top:var(--s2);padding-top:var(--s1);border-top:1px solid var(--rule)}
.crs div + div{margin-top:var(--s1)}
.facts dt{color:var(--ink2)}
.facts dd{margin:0}
.pager{margin-top:var(--sec);border-top:1px solid var(--ink);padding-top:var(--s1);align-items:start}
.pg-back{grid-column:1/span 4}
.pg-next{grid-column:9/span 4;text-decoration:none}
.pg-next .lbl{color:var(--ink2)}
.pg-t2{display:block;margin-top:.25rem;font-size:var(--fs-l);line-height:2.625rem;font-style:italic}

@media (max-width:1023px){
  :root{--g:24px}
  .hero-t,.hero-m,.pg-l{grid-column:1/span 11}
  .ix-list,.ix-note{grid-column:1/-1}
  .ix{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t m" "s s"}
  .co-text{grid-column:1/span 7}
  .co-part{grid-column:8/span 5}
  .show-txt{grid-column:1/span 7}
  .facts-col{grid-column:9/span 4}
  .cast{columns:2}
  .f-c{grid-column:span 6}
}
@media (max-width:759px){
  :root{--g:16px}
  .menu{display:block}
  .nav{display:none;flex-basis:100%;align-self:auto;margin-bottom:0}
  .nav.open{display:block}
  .nav ul{flex-direction:column;gap:0;height:auto;padding-bottom:var(--s1)}
  .nav li{display:block;border-top:1px solid var(--rule)}
  .nav a{display:block;padding-block:.625rem}
  .nav a[aria-current="page"]{box-shadow:none;color:var(--mag);font-weight:520}
  .hero-t,.hero-m,.pg-l{grid-column:1/-1}
  .sec-h .num{min-width:3.25em}
  .sec-b{margin-top:var(--s3)}
  .ag thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ag tr{grid-template-columns:minmax(0,1fr) auto;column-gap:var(--s1)}
  .ag .c-date{grid-column:1;grid-row:1}
  .ag .c-pub,.ag--one .c-pub{grid-column:2;grid-row:1;text-align:right}
  .ag .c-show,.ag .c-place,.ag--one .c-place{grid-column:1/-1}
  .ag .c-show{margin-top:.25rem}
  .ag--one .c-place{margin-top:.25rem}
  .ix{grid-template-columns:minmax(0,1fr);grid-template-areas:"t" "s" "m"}
  .ix-t{font-size:var(--fs-m);line-height:2rem}
  .ix-y,.ix-d{width:auto}
  .ix-y:not(:empty) + .ix-d:not(:empty)::before{content:"\00a0·\00a0"}
  .doors{grid-template-columns:minmax(0,1fr)}
  .door{display:block}
  .door + .door{margin-top:var(--s3)}
  .door .door-a{margin-top:var(--s1)}
  .figs{grid-template-columns:minmax(0,1fr)}
  .cast{columns:1}
  .co-text,.co-part,.show-txt,.facts-col,.f-c,.pg-back,.pg-next,.exergue,.prose,.mentions{grid-column:1/-1}
  .show-txt{display:contents}
  .facts-col{order:1}
  .mentions{order:2}
  .co-part,.facts-col{margin-top:var(--s3)}
  .show-ph{margin-inline:calc(-1 * var(--m))}
  .show-ph figcaption{padding-inline:var(--m)}
  .pg-next{margin-top:var(--s2)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const NB = ' ', FN = ' ';
  const WD = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  const MO = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const ML = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const ROM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  const NUMW = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze'];
  const AR = {
    r: '<svg class="ar" viewBox="0 0 18 10" aria-hidden="true" focusable="false"><path d="M0 5h16.6M12.4 .8 16.6 5l-4.2 4.2"/></svg>',
    l: '<svg class="ar" viewBox="0 0 18 10" aria-hidden="true" focusable="false"><path d="M18 5H1.4M5.6 .8 1.4 5l4.2 4.2"/></svg>',
    ne: '<svg class="ar ar-ne" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M1 9 9 1M2.6 1H9v6.4"/></svg>'
  };
  const AF = '<span class="af">à fournir</span>';
  const WORKS = ['Cyrano de Bergerac', 'Roméo et Juliette', 'Rodogune', 'Hamlet', 'Roi Lear', 'Macbeth'];
  const C = D.company;
  const SHOWS = D.shows;
  const BY = Object.fromEntries(SHOWS.map(s => [s.slug, s]));
  const isPiece = s => !!(s.annee || (s.distribution && s.distribution.length));
  const PIECES = SHOWS.filter(isPiece);
  const main = document.getElementById('main');
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cap = v => v.charAt(0).toUpperCase() + v.slice(1);
  function fr(v, works) {
    let h = esc(v)
      .replace(/«\s*/g, '«' + NB).replace(/\s*»/g, NB + '»')
      .replace(/\s+:/g, NB + ':')
      .replace(/\s+([;!?])/g, FN + '$1')
      .replace(/ – /g, NB + '– ')
      .replace(/(\d) (?=\d)/g, '$1' + NB)
      .replace(/(\d) (?=[a-zàâçéèêëîïôûùüÿœ])/g, '$1' + NB)
      .replace(/(\d{5}) (?=\p{Lu})/gu, '$1' + NB)
      .replace(/(^|\s)([àaAÀyô]) /g, '$1$2' + NB)
      .replace(/([IVXLC]+)e(?= siècle)/g, '<span class="ac">$1</span><sup>e</sup>');
    if (works) for (const w of WORKS) h = h.replace(new RegExp('(^|[^\\p{L}>])(' + w + ')(?!\\p{L})', 'gu'), '$1<i>$2</i>');
    return h;
  }
  function subt(v) {
    if (!v) return '';
    let m = v.match(/^(.+), (d’après .+)$/);
    if (m) return '<i>' + fr(m[1]) + '</i>, ' + fr(m[2]);
    m = v.match(/^d’après (.+) (de |d’)(\p{Lu}.*)$/u);
    if (m && /^\p{Lu}/u.test(m[1])) return 'd’après <i>' + fr(m[1]) + '</i> ' + m[2] + fr(m[3]);
    return fr(v);
  }
  function arrowed(text, dir, before) {
    const t = String(text);
    if (before) {
      const i = t.indexOf(' ');
      return '<span class="nw">' + AR[dir] + NB + fr(i < 0 ? t : t.slice(0, i)) + '</span>' + (i < 0 ? '' : fr(t.slice(i)));
    }
    const i = t.lastIndexOf(' ');
    return fr(i < 0 ? '' : t.slice(0, i + 1)) + '<span class="nw">' + fr(i < 0 ? t : t.slice(i + 1)) + NB + AR[dir] + '</span>';
  }
  const ext = (href, text, sr) => `<a href="${esc(href)}" target="_blank" rel="noopener">${arrowed(text, 'ne')}<span class="sr"> (${sr || 'nouvel onglet'})</span></a>`;
  const mail = () => `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`;

  const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dn = n => n === 1 ? '1<sup>er</sup>' : String(n);
  const timeOf = r => /^\d{1,2}\s?h\s?\d{0,2}$/i.test(r.lieu || '') ? r.lieu.replace(/\s/g, '') : '';
  const isNote = r => /^diptyque$/i.test(r.lieu || '');
  const venue = r => (r.lieu && !timeOf(r) && !isNote(r)) ? r.lieu : '';
  const commune = r => fr(r.commune) + NB + '(' + esc(r.dep) + ')';

  function days(r) {
    const a = pd(r.iso), b = pd(r.fin);
    if (r.iso === r.fin) return [a.getDate()];
    if (a.getMonth() !== b.getMonth() || a.getFullYear() !== b.getFullYear()) return null;
    const head = String(r.label || '').split(' ' + ML[a.getMonth()])[0];
    const n = (head.match(/\d+/g) || []).map(Number);
    return n.length > 1 && n[0] === a.getDate() && n[n.length - 1] === b.getDate() ? n : [a.getDate(), b.getDate()];
  }
  function dateCell(r) {
    const a = pd(r.iso), b = pd(r.fin), t = timeOf(r);
    let d1, d2 = '';
    if (r.precision === 'month') {
      d1 = `<span class="wd"></span><span class="dn"></span>${NB}<span class="mo">${ML[a.getMonth()]}</span>`;
      d2 = 'jour à préciser';
    } else {
      d1 = `<span class="wd">${WD[a.getDay()]}</span><span class="dn">${dn(a.getDate())}</span>${NB}<span class="mo">${MO[a.getMonth()]}</span>`;
      const ds = r.precision === 'range' ? null : days(r);
      if (r.iso !== r.fin && !ds) d2 = `jusqu’au ${WD[b.getDay()]}${NB}${dn(b.getDate())}${NB}${MO[b.getMonth()]}`;
      else if (ds && ds.length > 1) {
        const rest = ds.slice(1).map(n => WD[new Date(a.getFullYear(), a.getMonth(), n).getDay()] + NB + dn(n));
        d2 = (rest.length === 1 ? 'et ' + rest[0] : 'puis ' + rest.slice(0, -1).join(', ') + ' et ' + rest[rest.length - 1]) + NB + MO[a.getMonth()];
      }
    }
    if (t) d2 = d2 ? d2 + ', ' + t : 'à ' + t;
    return `<span class="d1">${d1}</span>${d2 ? `<span class="d2">${d2}</span>` : ''}`;
  }
  function placeCell(r) {
    const v = venue(r);
    const first = v ? (r.lien ? ext(r.lien, v, 'site du lieu, nouvel onglet') : fr(v)) : (r.lien ? `<a href="${esc(r.lien)}" target="_blank" rel="noopener"><span class="nw">${commune(r)}${NB}${AR.ne}</span><span class="sr"> (site du lieu, nouvel onglet)</span></a>` : commune(r));
    const second = v ? commune(r) : (isNote(r) ? 'en diptyque' : '');
    return `<span class="p1">${first}</span>${second ? `<span class="p2">${second}</span>` : ''}`;
  }
  const pub = r => r.public === 'Scolaire' ? 'scolaire' : 'tout public';
  function row(r, one) {
    return `<tr role="row"><td role="cell" class="c-date">${dateCell(r)}</td>${one ? '' : `<td role="cell" class="c-show"><a href="#/spectacle/${esc(r.slug)}">${fr(r.titre)}</a></td>`}<td role="cell" class="c-place">${placeCell(r)}</td><td role="cell" class="c-pub">${pub(r)}</td></tr>`;
  }
  function agenda(rows, { one = false, caption = '', head = true } = {}) {
    const th = `<thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col" class="c-date">Date</th>${one ? '' : '<th role="columnheader" scope="col" class="c-show">Spectacle</th>'}<th role="columnheader" scope="col" class="c-place">Lieu</th><th role="columnheader" scope="col" class="c-pub">Public</th></tr></thead>`;
    return `<table class="ag${one ? ' ag--one' : ''}${head ? '' : ' ag--nh'}" role="table"><caption>${esc(caption)}</caption>${th}<tbody role="rowgroup">${rows.map(r => row(r, one)).join('')}</tbody></table>`;
  }

  const sec = (id, num, title, body, cls) => `<section class="sec${cls ? ' ' + cls : ''}" id="${id}" aria-labelledby="h-${id}"><h2 class="sec-h" id="h-${id}">${num ? `<span class="num" aria-hidden="true">${num}</span>` : ''}<span>${title}</span></h2><div class="sec-b">${body}</div></section>`;
  const pageHead = (title, lead) => `<div class="pg-h grid"><h1 class="pg-t" tabindex="-1">${title}</h1>${lead ? `<p class="pg-l">${lead}</p>` : ''}</div>`;

  function indexRow(s) {
    return `<li><a class="ix" href="#/spectacle/${esc(s.slug)}"><span class="ix-t">${fr(s.titre)}</span><span class="ix-st">${subt(s.sousTitre)}</span><span class="ix-m"><span class="ix-y">${s.annee ?? ''}</span><span class="ix-d">${s.duree ? fr(s.duree) : ''}</span></span><span class="ix-ph" aria-hidden="true"><img src="${D.photos[s.slug]}" alt="" decoding="async" style="object-position:${Number(s.focale ?? 50)}% 50%"></span></a></li>`;
  }
  const index = list => `<ol class="ix-list">${list.map(indexRow).join('')}</ol>`;

  const DOOR_LINKS = {
    voir: ['#/agenda', 'Toutes les dates'],
    programmer: ['#/spectacles', 'Le répertoire'],
    etablissement: BY['actions-culturelles'] ? ['#/spectacle/actions-culturelles', 'Les actions culturelles'] : ['#/spectacles', 'Le répertoire']
  };
  function doors(contact) {
    return `<div class="doors${contact ? ' doors--c' : ''}">${D.doors.map(d => {
      const [href, label] = DOOR_LINKS[d.key] || ['#/spectacles', 'Le répertoire'];
      return `<div class="door"><h3 class="door-t">${fr(d.titre)}</h3><p>${fr(d.texte)}</p>${contact ? `<dl class="kv"><div><dt>Contact</dt><dd>${AF}</dd></div></dl>` : ''}<p class="door-a"><a href="${href}">${arrowed(label, 'r')}</a></p></div>`;
    }).join('')}</div>`;
  }

  function homeView() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const up = D.dates.filter(r => pd(r.fin) >= today);
    const next = (up.length ? up : D.dates).slice(0, 5);
    return `<div class="wrap">
      <section class="hero grid" aria-labelledby="h-home">
        <h1 class="sr" id="h-home" tabindex="-1">${esc(C.nom)}</h1>
        <p class="hero-t">${fr(C.presentation)}</p>
        <p class="hero-m">Saison ${esc(D.saison)} · <a href="#/agenda">${D.stats.datesSaison}${NB}dates</a> · <a href="#/spectacles">${PIECES.length}${NB}spectacles</a></p>
      </section>
      ${sec('a-venir', 'I.', 'À venir', agenda(next, { caption: 'Les prochaines dates' }) + `<p class="more"><a href="#/agenda">${arrowed('Tout l’agenda', 'r')}</a></p>`)}
      ${sec('portes', 'II.', 'Vous êtes…', doors(false))}
    </div>`;
  }

  function spectaclesView() {
    const ac = SHOWS.filter(s => !isPiece(s));
    const ys = PIECES.map(s => s.annee).filter(Boolean);
    const n = PIECES.length;
    const byOne = n && PIECES.every(s => (s.equipe || []).some(([r, w]) => /^mise en scène/i.test(r) && w === C.miseEnScene));
    const lead = `${cap(NUMW[n] || String(n))} spectacles${byOne ? ' mis en scène par ' + fr(C.miseEnScene) : ''}${ys.length ? `, créés entre ${Math.min(...ys)} et ${Math.max(...ys)}` : ''}${ac.length ? ', et des actions culturelles' : ''}.`;
    return `<div class="wrap">
      ${pageHead('Le répertoire', lead)}
      ${sec('spectacles', 'I.', 'Les spectacles', `<div class="grid">${index(PIECES)}</div>`)}
      ${ac.length ? sec('eac', 'II.', 'L’éducation artistique', `<div class="grid">${index(ac)}${ac.filter(s => s.accroche).map(s => `<p class="ix-note">${fr(s.accroche)}</p>`).join('')}</div>`) : ''}
    </div>`;
  }

  function agendaView() {
    const all = D.dates;
    const sco = all.filter(r => r.public === 'Scolaire').length;
    const by = new Map();
    all.forEach(r => { const a = pd(r.iso), k = a.getFullYear() * 12 + a.getMonth(); if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
    const months = [...by].map(([k, list], i) => {
      const y = Math.floor(k / 12), m = k % 12;
      return sec(`m-${y}-${m + 1}`, (ROM[i] || i + 1) + '.', cap(ML[m]) + ' ' + y, agenda(list, { caption: `Dates de ${ML[m]} ${y}`, head: i === 0 }), i ? 'sec--m' : 'sec--m sec--m1');
    }).join('');
    const lead = `Saison ${esc(D.saison)}${NB}: ${all.length}${NB}dates${sco ? `, dont ${sco}${NB}scolaires` : ''}. Le signe${NB}${AR.ne}<span class="sr"> (flèche)</span> renvoie au site du lieu.`;
    return `<div class="wrap">${pageHead('L’agenda', lead)}${months}</div>`;
  }

  function compagnieView() {
    const st = D.stats;
    const cast = new Map();
    PIECES.forEach(s => (s.distribution || []).forEach(v => String(v).split(/\s+ou\s+/).forEach(n => {
      n = n.trim();
      if (!n) return;
      if (!cast.has(n)) cast.set(n, []);
      if (!cast.get(n).includes(s)) cast.get(n).push(s);
    })));
    const sur = n => n.split(' ').slice(1).join(' ') || n;
    const names = [...cast.keys()].sort((a, b) => sur(a).localeCompare(sur(b), 'fr', { sensitivity: 'base' }) || a.localeCompare(b, 'fr'));
    const figs = [
      [st.representationsCourt, `représentations depuis ${st.depuis}`],
      [st.parAnMin, `représentations par an au moins, depuis ${st.parAnDepuis}`],
      [st.pays, `pays${NB}: ${st.paysListe.join(', ')}`]
    ];
    return `<div class="wrap">
      ${pageHead('La compagnie', fr(C.presentation))}
      ${sec('projet', 'I.', 'Le projet', `<div class="grid co-g">
        <div class="co-text">
          <p class="co-lead">${fr(C.intention)}</p>
          <dl class="kv2">
            <div><dt>Mise en scène</dt><dd>${fr(C.miseEnScene)}</dd></div>
            <div><dt>Implantation</dt><dd>${fr(C.ville)}, depuis ${C.depuis}</dd></div>
            <div><dt>Répertoire</dt><dd><a href="#/spectacles">${PIECES.length}${NB}spectacles</a></dd></div>
            <div><dt>Éducation artistique</dt><dd>${st.heuresEAC}${NB}heures en 2023-2024</dd></div>
          </dl>
        </div>
        <div class="co-part"><h3 class="lbl">Partenaires</h3><ul class="plain">${C.partenaires.map(p => `<li>${fr(p)}</li>`).join('')}</ul></div>
      </div>`)}
      ${sec('chiffres', 'II.', 'En chiffres', `<ul class="figs">${figs.map(([v, l]) => `<li><span class="fig-n">${fr(String(v))}</span><span class="fig-l">${fr(l)}</span></li>`).join('')}</ul><p class="src">Source${NB}: ${fr(st.source)}.</p>`)}
      ${sec('plateau', 'III.', 'Au plateau', `<p class="intro">Les interprètes des spectacles du répertoire, par ordre alphabétique.</p><ul class="cast">${names.map(n => `<li><span class="cast-n">${fr(n)}</span><span class="cast-s">${cast.get(n).map(s => `<i>${fr(s.titre)}</i>`).join(', ')}</span></li>`).join('')}</ul>`)}
    </div>`;
  }

  function contactView() {
    const [rue, ville] = String(C.adresse).split(/,\s*/);
    return `<div class="wrap">
      ${pageHead('Contact', `${esc(C.nom)}, ${fr(rue)}${ville ? ', ' + fr(ville) : ''}.<br>${mail()}`)}
      ${sec('vous', 'I.', 'Vous êtes…', doors(true))}
      ${sec('lettre', 'II.', 'La lettre d’information', `<p>Inscription${NB}: ${AF}</p>`)}
    </div>`;
  }

  function list(arr) { return arr.map(x => fr(x)).join('<br>'); }
  function when(p) { return p.precision === 'day' && p.iso === p.fin ? p.joursemLong + ' ' + p.label : p.label; }
  function where(p) { const v = venue(p); return (v ? fr(v) + ', ' : '') + commune(p); }

  function showView(s) {
    const piece = isPiece(s);
    const dates = D.dates.filter(d => d.slug === s.slug);
    const n = (s.distribution || []).length;
    const kf = [], cr = [];
    if (piece) {
      kf.push(['Création', s.annee ? String(s.annee) : AF], ['Durée', s.duree ? fr(s.duree) : AF], ['Au plateau', n ? `${n}${NB}comédien${n > 1 ? 's' : ''}` : AF]);
      if (n) cr.push(['Avec', list(s.distribution)]);
      (s.equipe || []).forEach(([role, who]) => cr.push([fr(role), fr(who)]));
    } else {
      cr.push(['Éducation artistique', `${D.stats.heuresEAC}${NB}heures en 2023-2024`]);
      if (s.soutiens) cr.push(['Soutiens', fr(s.soutiens)]);
    }
    const pairs = l => l.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('');
    const facts = (kf.length ? `<dl class="facts kf3">${pairs(kf)}</dl>` : '') + (cr.length ? `<dl class="facts crs">${pairs(cr)}</dl>` : '');
    const mentions = piece ? [s.coproduction && `<p>Coproduction${NB}: ${fr(s.coproduction)}.</p>`, s.soutiens && `<p>Soutiens${NB}: ${fr(s.soutiens)}.</p>`].filter(Boolean).join('') : '';

    const nx = dates[0];
    const voir = dates.length
      ? `<p>${dates.length === 1 ? 'Une date' : dates.length + NB + 'dates'} cette saison. Prochaine${NB}: ${fr(when(nx))}, ${where(nx)}.</p>` +
        (nx.lien ? `<p>${ext(nx.lien, 'Réserver auprès du lieu', 'site du lieu, nouvel onglet')}</p>` : '')
      : `<p>Aucune date annoncée pour l’instant.</p><p>Écrire à la compagnie${NB}: ${mail()}</p>`;
    const prog = piece
      ? `<dl class="kv"><div><dt>Fiche technique</dt><dd>${AF}</dd></div><div><dt>Dossier de diffusion</dt><dd>${AF}</dd></div>${s.video ? `<div><dt>Vidéo</dt><dd>${ext(s.video, 'Voir la vidéo', 'nouvel onglet')}</dd></div>` : ''}<div><dt>Contact</dt><dd>${mail()}</dd></div></dl>`
      : `<dl class="kv"><div><dt>Programme des ateliers</dt><dd>${AF}</dd></div><div><dt>Contact</dt><dd>${mail()}</dd></div></dl>`;
    const etab = `<p>${fr(s.etablissement ? s.etablissement.texte : '') || AF}</p>` +
      ((s.passCulture || s.cred76) ? `<dl class="kv">${s.passCulture ? '<div><dt>Pass Culture</dt><dd>Offre collective</dd></div>' : ''}${s.cred76 ? `<div><dt>Guide du CRED de Seine-Maritime</dt><dd>${ext(s.cred76, 'Voir la fiche', 'nouvel onglet')}</dd></div>` : ''}</dl>` : '');
    const doorT = k => fr((D.doors.find(d => d.key === k) || {}).titre || '');

    const i = PIECES.indexOf(s);
    const next = PIECES[(i + 1) % PIECES.length] || PIECES[0];

    return `<article class="wrap show">
      <nav class="crumb" aria-label="Fil d’Ariane"><a href="#/spectacles">Le répertoire</a><span class="sep" aria-hidden="true">/</span><span aria-current="page"><i>${fr(s.titre)}</i></span></nav>
      <h1 class="show-t" tabindex="-1">${fr(s.titre)}</h1>
      <p class="show-st">${subt(s.sousTitre)}</p>
      <figure class="show-ph"><img src="${D.photos[s.slug]}" alt="Photo de ${esc(s.titre)}" style="object-position:${Number(s.focale ?? 50)}% 50%">${s.credit ? `<figcaption>${fr(s.credit)}</figcaption>` : ''}</figure>
      <div class="grid show-b">
        <div class="show-txt">
          <p class="exergue">${fr(s.accroche, true)}</p>
          <p class="prose">${fr(s.texte, true)}</p>
          ${mentions ? `<div class="mentions">${mentions}</div>` : ''}
        </div>
        <div class="facts-col">${facts}</div>
      </div>
      ${sec('dates', '', 'Dates', dates.length ? agenda(dates, { one: true, caption: `Dates de ${s.titre}, saison ${D.saison}` }) : '<p>Aucune date annoncée pour l’instant.</p>')}
      ${sec('selon', '', 'Selon que vous…', `<div class="doors">
        <div class="door"><h3 class="door-t">${doorT('voir')}</h3><div>${voir}</div><div></div></div>
        <div class="door"><h3 class="door-t">${doorT('programmer')}</h3><div>${prog}</div><div></div></div>
        <div class="door"><h3 class="door-t">${doorT('etablissement')}</h3><div>${etab}</div><div></div></div>
      </div>`)}
      <nav class="pager grid" aria-label="Autres spectacles">
        <a class="pg-back" href="#/spectacles">${arrowed('Tout le répertoire', 'l', true)}</a>
        ${next && next !== s ? `<a class="pg-next" href="#/spectacle/${esc(next.slug)}"><span class="lbl">Spectacle suivant${NB}${AR.r}</span><span class="pg-t2">${fr(next.titre)}</span></a>` : ''}
      </nav>
    </article>`;
  }

  function footer() {
    const [rue, ville] = String(C.adresse).split(/,\s*/);
    return `<div class="f-c"><p><span class="f-l">${esc(C.nom)}</span>${fr(rue)}${ville ? '<br>' + fr(ville) : ''}</p></div>
      <div class="f-c"><p><span class="f-l">Écrire</span>${mail()}</p></div>
      <div class="f-c"><p><span class="f-l">Partenaires</span>${C.partenaires.map(p => fr(p)).join('<br>')}</p></div>
      <div class="f-c"><p><span class="f-l">Siret</span>${fr(C.siret)}</p><p><span class="f-l">Licence</span>${esc(C.licence)}</p></div>`;
  }

  const octo = document.getElementById('octo');
  octo.innerHTML = D.logo.octopus;
  const svg = octo.querySelector('svg');
  if (svg) { svg.setAttribute('aria-hidden', 'true'); svg.removeAttribute('role'); svg.removeAttribute('aria-label'); }
  document.getElementById('foot').innerHTML = footer();
  const ico = document.createElement('link');
  ico.rel = 'icon';
  ico.href = 'data:image/svg+xml,' + encodeURIComponent(D.logo.mark);
  document.head.appendChild(ico);

  const btn = document.querySelector('.menu'), nav = document.getElementById('nav');
  const setMenu = open => { nav.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); btn.textContent = open ? 'Fermer' : 'Menu'; };
  btn.addEventListener('click', () => setMenu(!nav.classList.contains('open')));
  nav.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });

  const TABS = {
    '': [homeView, ''],
    spectacles: [spectaclesView, 'Le répertoire'],
    agenda: [agendaView, 'L’agenda'],
    compagnie: [compagnieView, 'La compagnie'],
    contact: [contactView, 'Contact']
  };
  const ALIAS = { repertoire: 'spectacles', portes: '', accueil: '' };
  const links = [...nav.querySelectorAll('a')];
  let first = true;
  function route() {
    const h = location.hash;
    let path = h.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
    try { path = decodeURIComponent(path); } catch (e) { path = ''; }
    const m = path.match(/^spectacle\/([^/]+)/);
    const s = m ? BY[m[1]] : null;
    let key = s ? 'spectacles' : has(ALIAS, path) ? ALIAS[path] : path;
    if (!s && !has(TABS, key)) key = '';
    if (!s && h && !h.startsWith('#/')) { try { history.replaceState(null, '', key ? '#/' + key : '#/'); } catch (e) { /* adresse laissée telle quelle */ } }
    if (s) {
      main.innerHTML = showView(s);
      document.title = s.titre + ' · ' + C.nom;
    } else {
      const [view, label] = TABS[key];
      main.innerHTML = view();
      document.title = label ? label + ' · ' + C.nom : C.nom + ' — théâtre à ' + C.ville;
    }
    links.forEach(a => { if (key && a.getAttribute('href') === '#/' + key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    setMenu(false);
    window.scrollTo(0, 0);
    if (!first) (main.querySelector('h1') || main).focus({ preventScroll: true });
    first = false;
  }
  document.querySelector('.skip').addEventListener('click', e => { e.preventDefault(); (main.querySelector('h1') || main).focus(); });
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) { e.preventDefault(); route(); }
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
