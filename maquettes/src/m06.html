<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil - crescite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Maquette 06 · « Les bras de la tournée ».
   La tentacule devient un thème : les tournées partent de Rouen vers chaque commune où la compagnie joue.
   L'ouverture : la pieuvre magenta sur l'encre ; quand elle a grossi et révélé l'accueil, ses bras deviennent ceux
   de la carte, qui poussent depuis Rouen. La saison en cours en magenta, les saisons passées à l'encre, le réseau
   de toutes les tournées en gris ; chaque saison passée a sa carte. Tout le texte vient de D (le site d'origine). */
:root {
  --papier: #f6f2eb; --papier-2: #ece5da; --terre: #e3d9ca; --encre: #1d1418; --gris: #5f565a; --filet: #dcd3c6;
  --magenta: #bc3e80; --magenta-texte: #a3306b; --nuit: #1d1418;
  --serif: "Spectral", Georgia, serif; --sans: "Work Sans", system-ui, sans-serif;
  --gout: clamp(16px, 4vw, 56px);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body { margin: 0; background: var(--papier); color: var(--encre); font: 400 1.0625rem/1.6 var(--sans); }
a { color: inherit; }
img { display: block; max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; }
h1[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--gout); }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* le motif : une onde qui s'enroule au bout, comme la pointe d'une tentacule */
.trait { display: block; width: 110px; height: 18px; margin-top: 12px; overflow: visible; }
.trait path { fill: none; stroke: var(--c, var(--magenta)); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.fleche { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
a:hover .fleche { transform: translateX(4px); }

/* en-tête : la marque et les six onglets */
.top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--papier) 93%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--filet); }
.barre { display: flex; align-items: center; gap: 20px; height: 64px; max-width: 1600px; margin: 0 auto; padding: 0 var(--gout); }
.marque { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 600 1.2rem/1 var(--sans); letter-spacing: .01em; }
.marque .l { width: 38px; }
.marque svg { display: block; width: 100%; height: auto; }
.nav { margin-left: auto; display: flex; gap: 2px; }
.nav a { padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: 500; font-size: .98rem; color: var(--gris); white-space: nowrap; }
.nav a:hover { color: var(--encre); background: var(--papier-2); }
.nav a[aria-current="page"] { color: var(--encre); text-decoration: underline 2px var(--magenta); text-underline-offset: 9px; }
.menu { display: none; margin-left: auto; align-items: center; gap: 8px; padding: 7px 15px; border: 1px solid var(--filet); border-radius: 999px; background: none; font-weight: 600; cursor: pointer; }
.menu svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
@media (max-width: 1279.98px) {
  .menu { display: inline-flex; }
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; gap: 0; padding: 6px var(--gout) 22px; background: var(--papier); border-bottom: 1px solid var(--filet); box-shadow: 0 18px 30px -18px rgb(29 20 24 / .35); }
  .top.ouvert .nav { display: flex; }
  .nav a { padding: 13px 2px; border-radius: 0; border-bottom: 1px solid var(--filet); font-size: 1.12rem; }
  .nav a:hover { background: none; }
  .nav a[aria-current="page"] { text-underline-offset: 6px; }
}

main { display: block; min-height: 60vh; padding-bottom: clamp(56px, 7vw, 104px); }
main:has(> .suivant:last-child) { padding-bottom: 0; }

/* ---------- la carte des tournées ---------- */
.carte { --c: var(--magenta); position: relative; margin: 0; }
.carte svg { --k: 1; display: block; width: 100%; height: auto; }
.carte .pays { fill: var(--terre); }
.carte .voisin { fill: color-mix(in srgb, var(--terre) 45%, var(--papier)); }
.carte .encart { fill: none; stroke: color-mix(in srgb, var(--encre) 35%, transparent); stroke-width: calc(var(--k) * 1px); stroke-dasharray: calc(var(--k) * 3px) calc(var(--k) * 3px); }
.carte .reseau { transition: opacity .3s; }
.carte .reseau path { fill: color-mix(in srgb, var(--encre) 16%, transparent); }
.carte .reseau .point { r: calc(var(--k) * 1.9px); fill: color-mix(in srgb, var(--encre) 40%, transparent); }
.carte .reseau .cible { r: calc(var(--k) * 6px); fill: transparent; }
.carte-sp .reseau path { fill: color-mix(in srgb, var(--encre) 30%, transparent); }
.carte-sp .reseau .point { fill: color-mix(in srgb, var(--encre) 55%, transparent); }
.carte .reseau .actif .point { r: calc(var(--k) * 3.4px); fill: var(--encre); }
.carte .bras { fill: var(--c); transition: opacity .25s; }
.carte .bras.actif { stroke: var(--c); stroke-width: calc(var(--k) * 1.3px); stroke-linejoin: round; }
.carte .bout { fill: none; stroke: var(--c); stroke-width: calc(var(--k) * 1.4px); stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s cubic-bezier(.3, .7, .3, 1), opacity .25s; }
.carte .bout.arrive { stroke-dashoffset: 0; }
.carte .carte-lieu { cursor: pointer; outline: none; }
.carte .vif .cible { r: calc(var(--k) * 11px); fill: transparent; }
.carte .vif .point { r: calc(var(--k) * 3.8px); fill: var(--c); stroke: var(--papier); stroke-width: calc(var(--k) * 1.4px); transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform .5s cubic-bezier(.3, 1.7, .5, 1); }
.carte .vif .arrive .point { transform: scale(1); }
.carte .vif .actif .point, .carte .vif .carte-lieu:focus-visible .point, .carte .vif .choisi .point { r: calc(var(--k) * 5.6px); stroke: var(--encre); stroke-width: calc(var(--k) * 1.8px); }
.carte.survole .bras:not(.actif), .carte.survole .bout:not(.actif) { opacity: .22; }
.carte.survole .reseau { opacity: .55; }
.carte .nom { font: italic 500 calc(var(--k) * 12.5px) var(--serif); fill: var(--encre); paint-order: stroke; stroke: var(--papier); stroke-width: calc(var(--k) * 3.2px); stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .45s; }
.carte .nom.arrive:not(.cache) { opacity: 1; }
.carte.survole .nom:not(.actif) { opacity: .2; }
.carte .nom.actif { opacity: 1; font-weight: 600; }
.carte .rouen-g { pointer-events: none; }
.carte .rouen { r: calc(var(--k) * 5.5px); fill: var(--encre); }
.carte .rouen-nom { font: italic 600 calc(var(--k) * 15px) var(--serif); fill: var(--encre); paint-order: stroke; stroke: var(--terre); stroke-width: calc(var(--k) * 3.5px); stroke-linejoin: round; }
.carte .onde { r: calc(var(--k) * 5px); fill: none; stroke: var(--c); stroke-width: 1.6; vector-effect: non-scaling-stroke; opacity: 0; transform-box: fill-box; transform-origin: center; }
.carte.pousse .onde { animation: onde 1.6s cubic-bezier(.2, .6, .3, 1); }
.carte.attend .onde { animation: onde 2.8s cubic-bezier(.2, .6, .3, 1) infinite; }
@keyframes onde { from { transform: scale(1); opacity: .9; } to { transform: scale(10); opacity: 0; } }
.bulle { position: absolute; z-index: 6; width: max-content; max-width: min(300px, 86%); padding: 10px 14px 11px; border-radius: 10px; background: var(--encre); color: var(--papier); font-size: .86rem; line-height: 1.4; pointer-events: none; box-shadow: 0 14px 30px -14px rgb(29 20 24 / .55); }
.bulle.epinglee { pointer-events: auto; }
.bulle b { display: block; margin-bottom: 4px; font: italic 500 1.12rem/1.2 var(--serif); }
.bulle ul { list-style: none; margin: 0; padding: 0; }
.bulle li { padding: 4px 0; border-top: 1px solid rgb(255 255 255 / .14); }
.bulle li span { display: block; font-weight: 600; }
.bulle a { color: #f3a6cd; }
.bulle em { color: #d9ced3; }

/* la frise des saisons : chacune redessine les bras de la carte */
.ruban { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: .86rem; }
.ruban .lib { margin-right: 8px; font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.ruban a { padding: 4px 9px; border: 1px solid transparent; border-radius: 999px; color: var(--gris); text-decoration: none; font-variant-numeric: tabular-nums; white-space: nowrap; transition: background .2s, color .2s; }
.ruban a:hover, .ruban a:focus-visible, .ruban a.vu { color: var(--encre); border-color: var(--filet); background: var(--papier-2); }
.ruban a.courante { color: #fff; border-color: var(--magenta-texte); background: var(--magenta-texte); }

/* ---------- accueil : la carte en grand ---------- */
.une { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); grid-template-areas: "titre carte" "dates carte" "dates ruban"; grid-template-rows: auto 1fr auto; column-gap: clamp(28px, 4vw, 72px); max-width: 1600px; margin: 0 auto; padding: clamp(14px, 2.2vw, 30px) var(--gout) clamp(40px, 5vw, 72px); }
.une-titre { grid-area: titre; padding-top: clamp(10px, 4vh, 56px); }
.une-carte { grid-area: carte; }
.une-carte svg { max-height: calc(100svh - 150px); }
.une-ruban { grid-area: ruban; margin-top: 10px; }
.une-dates { grid-area: dates; }
.une h1 { margin: 0; font: italic 400 clamp(2.6rem, 1.4rem + 3.3vw, 4.7rem)/1 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
.une h1 small { display: block; margin: 0 0 18px; font: 600 .8rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.une .trait { width: 128px; height: 22px; margin-top: 18px; }
.prochaines { list-style: none; margin: 30px 0 0; padding: 0; border-top: 1px solid var(--encre); }
.prochaines a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 16px; padding: 11px 8px 11px 0; border-bottom: 1px solid var(--filet); text-decoration: none; transition: background .25s, padding .25s; }
.prochaines .q { font-weight: 600; }
.prochaines .o { grid-column: 1; color: var(--gris); }
.prochaines .t { grid-column: 2; grid-row: 1 / span 2; align-self: center; max-width: 15ch; text-align: right; font: italic 500 1.12rem/1.15 var(--serif); }
.prochaines li.actif a, .prochaines a:hover { padding-left: 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--magenta) 13%, transparent), transparent); }
.suite { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; font-weight: 600; color: var(--magenta-texte); text-decoration: none; }
.portes-s, .bandeau-s { padding: clamp(40px, 6vw, 88px) 0 0; }
.portes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2vw, 24px); }
.porte { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 196px; padding: 22px 24px 24px; border-radius: 16px; background: var(--papier-2); text-decoration: none; transition: background .3s; }
.porte-bras { width: 160px; height: 48px; overflow: visible; }
.porte-bras path { fill: none; stroke: var(--dc); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 0; }
.porte:hover .porte-bras path, .porte:focus-visible .porte-bras path { animation: dessine 1s cubic-bezier(.3, .7, .3, 1); }
@keyframes dessine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.porte .bas { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.porte .bas span { font: italic 500 clamp(1.5rem, 1.1rem + 1.1vw, 2.05rem)/1.12 var(--serif); text-wrap: balance; }
.porte .fleche { width: 1.6rem; height: 1.6rem; color: var(--dc); }
.porte:hover { background: color-mix(in srgb, var(--dc) 13%, var(--papier)); }
.bandeau { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.bandeau a { position: relative; display: block; overflow: hidden; border-radius: 14px; background: var(--nuit); color: #fff; text-decoration: none; }
.bandeau figure { margin: 0; aspect-ratio: 3 / 4; }
.bandeau img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s; }
.bandeau a:hover img { transform: scale(1.05); }
.bandeau a::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(20 10 15 / 0) 38%, rgb(20 10 15 / .86)); pointer-events: none; }
.bandeau figcaption { position: absolute; top: 10px; right: 12px; z-index: 1; font-size: .7rem; color: rgb(255 255 255 / .88); text-shadow: 0 1px 3px rgb(0 0 0 / .7); }
.bandeau .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1; display: grid; gap: 6px; }
.bandeau .sur { font-size: .7rem; font-weight: 600; letter-spacing: .12em; color: #f3a6cd; }
.bandeau .ti { font: italic 500 1.4rem/1.1 var(--serif); }
.bandeau .btn { justify-self: start; margin-top: 6px; padding: 4px 12px; border: 1px solid rgb(255 255 255 / .7); border-radius: 999px; font-size: .84rem; font-weight: 600; transition: background .2s, border-color .2s; }
.bandeau a:hover .btn { border-color: var(--magenta); background: var(--magenta); }
.donateurs p { margin: clamp(40px, 5vw, 64px) 0 0; padding-top: 20px; border-top: 1px solid var(--filet); max-width: 120ch; font-size: .84rem; line-height: 1.65; color: var(--gris); }
@media (max-width: 1099.98px) {
  .une { grid-template-columns: minmax(0, 1fr); grid-template-areas: "titre" "carte" "ruban" "dates"; grid-template-rows: none; }
  .une-titre { padding: 8px 0 18px; }
  .une-carte svg { max-height: none; }
  .bandeau { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(210px, 38%); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .bandeau li { scroll-snap-align: start; }
}

/* ---------- pages ---------- */
.page-titre { padding-top: clamp(34px, 5vw, 64px); padding-bottom: clamp(26px, 3.4vw, 44px); }
.page-titre h1 { margin: 0; font: italic 400 clamp(2.4rem, 1.5rem + 2.8vw, 3.9rem)/1.05 var(--serif); text-wrap: balance; }
.page-titre .trait { width: 120px; height: 20px; margin-top: 16px; }
.page-titre .ruban { margin-top: 26px; }
.fil { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 14px; font-size: .9rem; color: var(--gris); }
.fil a { text-decoration: none; }
.fil a:hover { text-decoration: underline; }
.texte p, .texte li { max-width: 70ch; }
.texte h2 { margin: 1.6em 0 .5em; font: italic 500 clamp(1.5rem, 1.2rem + 1vw, 2rem)/1.2 var(--serif); }
.texte h2:first-child { margin-top: 0; }
.texte ul { padding-left: 1.2em; }
.texte li { margin: .55em 0; }
.texte a { color: var(--magenta-texte); }

/* les spectacles */
.cartes-sp { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 38px 22px; }
.cartes-sp a { display: block; text-decoration: none; }
.cartes-sp figure { position: relative; margin: 0 0 14px; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 12px; background: var(--papier-2); }
.cartes-sp img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.cartes-sp a:hover img { transform: scale(1.04); }
.cartes-sp h2 { margin: 0; font: italic 500 1.45rem/1.15 var(--serif); }
.cartes-sp a:hover h2 { color: var(--ct); }
.cartes-sp .trait { width: 78px; height: 14px; margin-top: 8px; }
.cartes-sp .st { margin: 8px 0 0; font-size: .95rem; color: var(--gris); }
.cr { margin: 4px 0 0; font-size: .78rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--gris); }
.statut { display: inline-block; padding: 4px 11px; border-radius: 999px; background: var(--ct, var(--magenta)); color: #fff; font-size: .74rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.cartes-sp .statut { position: absolute; left: 12px; top: 12px; }

/* l'agenda : la liste, et la carte de la saison à côté */
.agenda, .tournee-g { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-areas: "titre carte" "liste carte"; grid-template-rows: auto 1fr; column-gap: clamp(28px, 5vw, 72px); align-items: start; }
.agenda > .page-titre, .tournee-titre { grid-area: titre; }
.agenda > .liste, .tournee-g > .liste { grid-area: liste; }
.agenda-carte, .tournee-g > .carte { grid-area: carte; position: sticky; top: 84px; padding-top: clamp(16px, 2.5vw, 36px); }
.agenda-carte svg { max-height: calc(100svh - 110px); }
.mois { margin: 38px 0 4px; font: italic 500 1.55rem/1.2 var(--serif); }
.mois::first-letter { text-transform: uppercase; }
.liste > .groupe:first-of-type .mois { margin-top: 0; }
.dates, .lignes { list-style: none; margin: 0; padding: 0; }
.date { --c: var(--magenta); display: grid; grid-template-columns: 6.8rem minmax(0, 1fr); gap: 4px 18px; padding: 14px 6px 14px 0; border-top: 1px solid var(--filet); transition: opacity .2s, background .2s; }
.date .quand { margin: 0; }
.date .j { display: block; font: 500 1.45rem/1.1 var(--serif); }
.date .j.mo { font-size: 1.15rem; }
.date .m { display: block; margin-top: 2px; font-size: .82rem; color: var(--gris); }
.date .sp { display: inline-block; font: italic 500 1.25rem/1.2 var(--serif); text-decoration: none; }
.date .sp::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 50%; background: var(--c); vertical-align: .12em; }
.date .sp:hover { color: var(--magenta-texte); }
.date .lieu { display: block; font-weight: 600; }
.det { list-style: none; margin: 2px 0 0; padding: 0; font-size: .94rem; color: var(--gris); }
.det a { color: var(--magenta-texte); }
.liste.survole .date:not(.actif), .liste.survole .ligne:not(.actif) { opacity: .3; }
.date.actif, .ligne.actif { background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--magenta)) 13%, transparent), transparent 75%); }
.filtre { display: flex; align-items: center; gap: 6px; margin: 0 0 18px; }
.filtre span { padding: 4px 0; font: italic 500 1.35rem var(--serif); }
.filtre button { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--filet); border-radius: 50%; background: var(--papier-2); cursor: pointer; }
.filtre svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.passees { margin-top: clamp(48px, 6vw, 88px); padding-top: clamp(30px, 4vw, 52px); border-top: 1px solid var(--filet); }
.minis { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 30px 22px; }
.mini a { display: block; text-decoration: none; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .pays { fill: var(--terre); }
.mini .encart { fill: none; stroke: color-mix(in srgb, var(--encre) 30%, transparent); stroke-width: 3; stroke-dasharray: 8 8; }
.mini .bras { fill: color-mix(in srgb, var(--encre) 74%, transparent); transition: fill .3s; }
.mini .rouen { fill: var(--encre); }
.mini span { display: block; margin-top: 8px; font: italic 500 1.12rem/1.2 var(--serif); }
.mini a:hover .bras, .mini a:focus-visible .bras { fill: var(--magenta); }
.mini a:hover span { color: var(--magenta-texte); }
.sp-saison { --c: var(--gris); padding: 22px 0 26px; border-top: 1px solid var(--encre); }
.liste > .sp-saison:first-of-type { border-top: 0; padding-top: 0; }
.sp-saison h2 { margin: 0; font: italic 500 clamp(1.4rem, 1.15rem + .9vw, 1.9rem)/1.15 var(--serif); }
.sp-saison h2 a { text-decoration: none; }
.sp-saison h2 a:hover { color: var(--magenta-texte); }
.sp-saison .st { margin: 4px 0 0; color: var(--gris); }
.sp-saison .cr { margin-bottom: 12px; }
.ligne { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 2px 16px; padding: 9px 6px 9px 0; border-top: 1px solid var(--filet); font-size: .95rem; transition: opacity .2s; }
.ligne .lq { font-weight: 600; }
.ligne .lo a { color: var(--magenta-texte); }
.ligne .det, .ligne .etat-t { grid-column: 2; }
.ligne.etat .lq, .ligne.etat .lo { text-decoration: line-through; color: var(--gris); }

@media (max-width: 1000px) {
  .corps .wrap, .tete .wrap, .actions, .contact { grid-template-columns: minmax(0, 1fr); }

}

<script>const D = /*__DATA__*/null;</script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const S = D.site, L = S.libelles, main = $('#main');
  const bySlug = Object.fromEntries(D.shows.map(s => [s.slug, s]));
  const onglet = id => (S.menu.find(m => m.id === id) || {}).texte || '';
  const SAISON = S.saisons[0];
  const mouvement = CARTE.mouvement;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const sortie = t => 1 - (1 - t) ** 3, douce = t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2;
  const bloc = b => /^\s*<(h\d|ul|ol|p|div|blockquote)\b/i.test(b) ? b : `<p>${b}</p>`;
  // « 8, 10 et 11 décembre 2026 » → ['8, 10 et 11', 'décembre 2026'] ; « mars 2027 » → ['', 'mars 2027']
  const coupe = s => { const m = String(s).match(/^(.*?)\s*(\S+\s+\d{4})$/); return m ? [m[1], m[2]] : ['', String(s)]; };
  const externe = (href, html) => href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${html}</a>` : html;
  const trait = c => `<svg class="trait" viewBox="0 0 120 20" aria-hidden="true"${c ? ` style="--c:${c}"` : ''}><path d="M2 12 C 22 4, 38 4, 54 11 S 86 19, 100 10 C 108 5, 116 7, 115 13 C 114 17, 108 17, 107 13"/></svg>`;
  const fleche = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
  const croix = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  /* ---------- en-tête, pied de page, fond de carte commun ---------- */
  $('.marque .l').innerHTML = D.logo.mark;
  $('.marque .mq').textContent = S.titreSuffixe;
  $('.menu span').textContent = L.menu;
  const nav = $('#nav');
  nav.setAttribute('aria-label', L.menu);
  nav.innerHTML = S.menu.map(m => `<a href="${m.href}">${esc(m.texte)}</a>`).join('');
  const C = S.coordonnees;
  $('#pied').innerHTML = `
    <div><p class="nm">${esc(C.nom)}</p>${trait()}<p>${C.adresse.map(esc).join('<br>')}</p><p class="lg">${C.legal.map(esc).join('<br>')}</p></div>
    <div><a class="ecrire" href="${S.ecrire.href}">${esc(S.ecrire.texte)}${fleche}</a><p>${S.facebook.href ? `<a href="${esc(S.facebook.href)}">${esc(S.facebook.texte)}</a>` : esc(S.facebook.texte)}</p></div>
    <div class="part"><p>${S.partenaires}</p></div>
    <div class="bas">${S.liensLegaux.map(l => `<a href="${l.href}">${esc(l.texte)}</a>`).join('')}</div>`;
  document.body.insertAdjacentHTML('afterbegin', `<svg class="defs" aria-hidden="true" focusable="false"><defs><path id="fr-pays" d="${CARTE.fond.pays}"/><path id="fr-be" d="${CARTE.fond.belgique}"/><path id="fr-lu" d="${CARTE.fond.luxembourg}"/></defs></svg>`);

  /* ---------- la carte : un bras par commune, de Rouen jusqu'à elle ---------- */
  const R = CARTE.rouen, VB = CARTE.viewBox.split(/\s+/).map(Number);
  const ENCART = [66, 706];   // l'outre-mer, hors du cadre : un encart au large, en bas à gauche
  const hors = xy => xy[0] < VB[0] || xy[1] < VB[1] || xy[0] > VB[0] + VB[2] || xy[1] > VB[1] + VB[3];
  const dehors = x => x.encart || hors(x.xy);   // CARTE ramène déjà l'outre-mer dans l'encart (x.encart)
  const ou = x => dehors(x) ? ENCART : x.xy;
  const loin = x => { const p = ou(x); return Math.hypot(p[0] - R[0], p[1] - R[1]); };
  const largeur = n => Math.min(8, 2.4 + Math.sqrt(n) * 1.25);
  // la forme d'un bras (la courbe de CARTE.bras) qui pousse : la courbe de Rouen jusqu'à g (0 → 1), effilée jusqu'à
  // sa pointe ; tant qu'il pousse il ondule un peu (onde), puis se pose
  function forme([x, y], w0, w1 = .5, g = 1, onde = 0) {
    const [rx, ry] = R, dx = x - rx, dy = y - ry;
    if (g <= 0 || Math.hypot(dx, dy) < 6) return '';
    const qx = (rx + x) / 2 - dy * .24, qy = (ry + y) / 2 + dx * .24;
    const ax = rx + (qx - rx) * g, ay = ry + (qy - ry) * g;
    const bx = (1 - g) ** 2 * rx + 2 * (1 - g) * g * qx + g * g * x, by = (1 - g) ** 2 * ry + 2 * (1 - g) * g * qy + g * g * y;
    const W0 = w0 * (.35 + .65 * g), N = 24, G = [], Dr = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N, a = (1 - t) ** 2, b = 2 * (1 - t) * t, c = t * t;
      let px = a * rx + b * ax + c * bx, py = a * ry + b * ay + c * by;
      let tx = 2 * (1 - t) * (ax - rx) + 2 * t * (bx - ax), ty = 2 * (1 - t) * (ay - ry) + 2 * t * (by - ay);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const o = onde * Math.sin((t * 2.4 - g * 2) * Math.PI) * t;
      px -= ty * o; py += tx * o;
      const w = (W0 * (1 - t) + w1 * t) / 2;
      G.push(`${(px - ty * w).toFixed(1)} ${(py + tx * w).toFixed(1)}`); Dr.push(`${(px + ty * w).toFixed(1)} ${(py - tx * w).toFixed(1)}`);
    }
    return `M${G.join('L')}L${Dr.reverse().join('L')}Z`;
  }
  const etiquette = x => `${CARTE.nom(x)} : ${x.dates.map(d => d.ligne).join(' ; ')}`;
  const ligneBulle = d => d.ligneDate
    ? `<li><span>${esc(d.ligneDate)}</span><a href="#/spectacle/${d.slug}">${esc(d.titre)}</a></li>`
    : `<li>${esc(d.ligne)}${d.spectacle ? ` <em>${esc(d.spectacle)}</em>` : ''}</li>`;
  // toutes les communes de toutes les saisons : le réseau gris de l'accueil
  let reseau = null;
  const RESEAU = () => reseau || (reseau = (() => {
    const m = new Map();
    S.saisons.forEach(s => CARTE.saison(s.saison).forEach(x => { const e = m.get(x.l); if (e) { e.n += x.n; e.dates.push(...x.dates); } else m.set(x.l, { ...x, dates: [...x.dates] }); }));
    return [...m.values()];
  })());

  const REG = new Map(), ANIM = new Set();
  const RO = window.ResizeObserver ? new ResizeObserver(es => es.forEach(e => { echelle(e.target); const b = $('.bulle', e.target); if (b && !b.classList.contains('epinglee')) b.hidden = true; })) : null;
  let nCarte = 0;
  // lieux : les communes en avant (en couleur, nommées, au clavier) ; passe : le réseau en retrait, en gris
  function carte({ lieux = [], passe = [], couleur = 'var(--magenta)', titre = '', classe = '', bulle = false, pousse = true, cadre = CARTE.viewBox } = {}) {
    const id = 'carte' + (++nCarte), vide = pousse && mouvement() && lieux.length > 0;
    REG.set(id, { lieux, passe, bulle, vide, par: new Map(), box: cadre.split(/\s+/).map(Number) });
    const encart = [...lieux, ...passe].some(dehors);
    return `<figure class="carte ${classe}" id="${id}" style="--c:${couleur}">
      <svg viewBox="${cadre}" ${lieux.length ? 'role="group"' : 'role="img"'} aria-label="${esc(titre)}">
        <defs><clipPath id="${id}-clip"><circle class="clip" cx="${R[0]}" cy="${R[1]}" r="${vide && passe.length ? 0 : 1200}"/></clipPath></defs>
        <use href="#fr-be" class="voisin"/><use href="#fr-lu" class="voisin"/><use href="#fr-pays" class="pays"/>
        ${encart ? `<circle class="encart" cx="${ENCART[0]}" cy="${ENCART[1]}" r="24"/>` : ''}
        <g class="reseau" clip-path="url(#${id}-clip)"></g><g class="vif"></g>
        <g class="rouen-g" aria-hidden="true"><circle class="onde" cx="${R[0]}" cy="${R[1]}"/><circle class="rouen" cx="${R[0]}" cy="${R[1]}"/><text class="rouen-nom" x="${R[0] + 9}" y="${R[1] - 8}">Rouen</text></g>
      </svg>${bulle ? '<div class="bulle" hidden></div>' : ''}</figure>`;
  }
  // l'échelle de l'écran, pour garder les noms, les points et les traits à la même taille en pixels
  function echelle(fig) {
    const svg = $('svg', fig), m = svg && svg.getScreenCTM();
    const k = m && m.a > 0 ? 1 / m.a : (svg ? svg.viewBox.baseVal.width : VB[2]) / ((svg && svg.clientWidth) || VB[2]);
    if (svg) svg.style.setProperty('--k', k.toFixed(3));
    return k;
  }
  function activer(fig) {
    const reg = REG.get(fig.id), k = echelle(fig), lw = k * .9;
    const rn = $('.rouen-nom', fig);
    rn.setAttribute('x', (R[0] + 9 * k).toFixed(1)); rn.setAttribute('y', (R[1] - 8 * k).toFixed(1));
    $('.reseau', fig).innerHTML = reg.passe.map(x => `<path d="${forme(ou(x), largeur(x.n) * .5 * lw, .3)}"/>`).join('') +
      reg.passe.map(x => { const [px, py] = ou(x); return `<g class="carte-lieu" data-l="${x.l}"><circle class="cible" cx="${px}" cy="${py}"/><circle class="point" cx="${px}" cy="${py}"/><title>${esc(CARTE.nom(x))}</title></g>`; }).join('');
    CARTE.lier($('.reseau', fig), { survol: l => survoler(fig, l), choix: l => choisir(fig, l) });
    garnir(fig, reg.lieux, { vide: reg.vide });
    if (RO) RO.observe(fig);
  }
  // les noms des communes : les plus lointaines d'abord, à droite du point ou à gauche, sans se chevaucher
  function noms(tri, k, a, [bx, by, bw, bh] = VB) {
    const fs = 12.5 * k, h = fs * 1.2, ecart = 7 * k;
    const boites = [[R[0] + 8 * k, R[1] - 22 * k, 46 * k, 17 * k]];
    const libre = b => b[0] > bx + 4 * k && b[0] + b[2] < bx + bw - 4 * k && b[1] > by + 4 * k && b[1] + b[3] < by + bh - 4 * k &&
      boites.every(c => b[0] >= c[0] + c[2] || c[0] >= b[0] + b[2] || b[1] >= c[1] + c[3] || c[1] >= b[1] + b[3]);
    return tri.map(x => {
      const [px, py] = ou(x), w = x.c.length * fs * .47;
      let gauche = false, b = [px + ecart, py - h / 2, w, h];
      if (!libre(b)) { gauche = true; b = [px - ecart - w, py - h / 2, w, h]; }
      const ok = loin(x) > 10 && libre(b);
      if (ok) boites.push(b);
      return `<text class="nom${ok ? '' : ' cache'}${a}" data-l="${x.l}" x="${(gauche ? px - ecart : px + ecart).toFixed(1)}" y="${(py + fs * .34).toFixed(1)}"${gauche ? ' text-anchor="end"' : ''}>${esc(x.c)}</text>`;

    main.innerHTML = `
      <div class="wrap page-titre"><h1 tabindex="-1">${esc(G.titre)}</h1>${trait()}</div>
      <section class="wrap legal texte">${G.blocs.filter(b => !/envoilauneidee/i.test(b)).map(bloc).join('')}</section>`;
    return G.titre;
  }

  /* ---------- page d'un spectacle : sa fiche, puis ses bras ---------- */
  const icVideo = '<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 8.5v9l7.5-4.5z" fill="currentColor"/></svg>';
  const icAudio = '<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 11h3l4-3.5v11L11 15H8z" fill="currentColor"/></svg>';
  function spectacle(slug) {
    const s = bySlug[slug], nx = D.shows[(D.shows.indexOf(s) + 1) % D.shows.length];
    const T = CARTE.spectacle(slug), avenir = D.dates.filter(d => d.slug === slug);
    const groupes = [];
    s.medias.forEach(m => { const g = groupes[groupes.length - 1]; if (g && g.nom === m.groupe) g.items.push(m); else groupes.push({ nom: m.groupe, items: [m] }); });
    const medias = s.medias.length ? `<div class="medias">${groupes.map(g => `${g.nom ? `<h3>${esc(g.nom)}</h3>` : ''}<ul>${g.items.map(m => `<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${m.type === 'audio' ? icAudio : icVideo}<span>${esc(m.titre || m.url)}</span></a>${m.par ? `<small>${esc(m.par)}</small>` : ''}</li>`).join('')}</ul>`).join('')}</div>` : '';
    const extraits = s.extraits ? `<div class="extraits">${s.extraits.map(e => `<blockquote><p>${esc(e.citation)}</p><footer>${esc(e.source)}</footer></blockquote>`).join('')}</div>` : '';
    const fiche = [
      ...s.fiche.map(f => `<p class="f">${f.libelle ? `<span class="lib">${esc(f.libelle)}</span> ` : ''}<span>${f.valeur}</span></p>`),
      s.avec ? `<p class="f"><span class="lib">${esc(s.avec.libelle)}</span> <span>${s.avec.valeur}</span></p>` : '',
      s.duree ? `<p class="duree">${esc(s.duree)}</p>` : '',
      ...s.mentions.map(m => `<p class="mention">${m}</p>`),
      ...s.production.map(p => `<p class="prod">${p}</p>`)].join('');
    let tournee = '';
    if (s.statut) tournee = `<section class="tournee"><div class="wrap tournee-g"><div class="tournee-titre"><h2>${esc(s.tournee.titre)}</h2><p>${esc(s.tournee.texte)}</p></div>
      ${carte({ couleur: s.couleurTexteClair, titre: s.tournee.titre, classe: 'carte-sp attend' })}</div></section>`;
    else if (avenir.length) tournee = `<section class="tournee"><div class="wrap tournee-g"><div class="tournee-titre"><h2>${esc(s.tournee.titre)}</h2></div><div class="liste">${filtreHTML()}<ul class="dates">${avenir.map(d => ligneDate(d, true)).join('')}</ul></div>
      ${carte({ lieux: T.aVenir, passe: T.passe, couleur: s.couleurTexteClair, titre: s.tournee.titre, classe: 'carte-sp', bulle: true })}</div></section>`;
    else if (T.passe.length) tournee = `<section class="tournee"><div class="wrap">${carte({ lieux: T.passe, couleur: 'var(--encre)', titre: s.titre, classe: 'carte-sp seule', bulle: true, cadre: CARTE.cadre(T.passe.filter(x => !dehors(x)), { marge: 50, min: 240 }) })}</div></section>`;
    main.innerHTML = `
      <section class="tete" style="--ct:${s.couleurTexteClair}"><div class="wrap">
        <div><p class="fil"><a href="#/">${esc(S.accueil)}</a><span aria-hidden="true">/</span><a href="#/spectacles">${esc(onglet('spectacles'))}</a></p>
          ${s.statut ? `<p class="statut">${esc(s.statut)}</p>` : ''}
          <h1 tabindex="-1">${s.titreLignes.map(l => `<span>${esc(l)}</span>`).join('')}</h1>${trait(s.couleurTexteClair)}
          <p class="cr">${esc(s.creation)}</p><p class="st">${s.sousTitre}</p>${s.cadre ? `<p class="cadre">${esc(s.cadre)}</p>` : ''}</div>
        <figure class="tete-photo"><img src="${D.photos[slug]}" alt="${esc(s.titre)}" style="object-position:${s.focale}% 50%">${s.credit ? `<figcaption>${esc(s.credit)}</figcaption>` : ''}</figure>
      </div></section>
      <section class="corps" style="--ct:${s.couleurTexteClair}"><div class="wrap">
        <div class="texte">${s.texte.map(p => `<p>${p}</p>`).join('')}${extraits}${medias}</div>
        <div class="fiche">${fiche}</div>
      </div></section>
      ${tournee}
      <a class="suivant" href="#/spectacle/${nx.slug}" style="--ct:${nx.couleurTexteClair}"><span class="wrap"><b>${esc(nx.titre)}</b>${fleche}</span></a>`;
    const fig = $('.carte-sp', main);
    if (fig) { activer(fig); const liste = $('.tournee .liste', main); if (liste) relier(fig, liste); pousser(fig); }
    return s.titre;
  }

  /* ---------- navigation : une vue par onglet ---------- */
  const VUES = { '': accueil, spectacles, agenda, compagnie, 'actions-culturelles': actions, 'espace-pro': pro, contact,
    'mentions-legales': () => legal('mentions-legales'), 'politique-de-confidentialite': () => legal('politique-de-confidentialite') };
  const haut = $('.top'), btn = $('.menu');
  const fermer = () => { haut.classList.remove('ouvert'); btn.setAttribute('aria-expanded', 'false'); };
  function route() {
    const chemin = location.hash.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
    ANIM.forEach(f => cancelAnimationFrame(f._raf)); ANIM.clear(); REG.clear();
    if (RO) RO.disconnect();
    const sp = chemin.match(/^spectacle\/([\w-]+)$/), sa = chemin.match(/^agenda\/([\d-]+)$/);
    let titre, actif;
    if (sp && bySlug[sp[1]]) { titre = spectacle(sp[1]); actif = '#/spectacles'; }
    else if (sa && D.saisons[sa[1]]) { titre = saison(sa[1]); actif = '#/agenda'; }
    else if (Object.prototype.hasOwnProperty.call(VUES, chemin)) { titre = VUES[chemin](); actif = `#/${chemin}`; }
    else { titre = accueil(); actif = '#/'; }
    document.title = `${titre} - ${S.titreSuffixe}`;
    $$('a', nav).forEach(a => { if (a.getAttribute('href') === actif) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    fermer();
    scrollTo(0, 0);
    const h1 = $('h1', main);
    if (h1) h1.focus({ preventScroll: true });
  }
  btn.addEventListener('click', () => { const o = haut.classList.toggle('ouvert'); btn.setAttribute('aria-expanded', String(o)); });
  nav.addEventListener('click', e => { if (e.target.closest('a')) fermer(); });
  document.addEventListener('click', e => { if (!e.target.closest('.carte-lieu, .bulle')) depingler(); if (!e.target.closest('.top')) fermer(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { fermer(); depingler(); } });

  // l'ouverture : la pieuvre magenta sur l'encre ; quand elle a révélé l'accueil, les bras de la carte poussent depuis Rouen
  INTRO.ouvrir({ degrade: [[0, '#3a1c2c'], [.55, '#1d1418'], [1, '#0f090c']], encre: '#cf4a8e', classe: 'ouverture-06',
    apres: () => { const f = $('.une-carte', main); if (f && !f.dataset.poussee) pousser(f); } });
  route();
  addEventListener('hashchange', route);
})();
</script>
</body>
</html>
