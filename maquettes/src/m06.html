.rs-photo { width: 48%; opacity: .3; -webkit-mask-image: linear-gradient(90deg, transparent, #000 75%); mask-image: linear-gradient(90deg, transparent, #000 75%); }
.rs-c { position: relative; display: grid; justify-items: start; gap: 6px; max-width: 36rem; padding: 26px clamp(18px, 2.4vw, 28px) 24px; }

<script>
(() => {
  /* Mouvement : la croissance. Tout pousse comme un bras de la tournée : de Rouen vers les communes, d'un bord de l'écran à
     l'autre, de gauche à droite sur une frise. Une courbe qui part vite et se pose (cubic-bezier(.3, .7, .25, 1)) ; 450 ms au
     plus pour ce qui accompagne un geste ; seuls transform et opacity bougent (les bras d'une carte exceptés : ils sont des
     tracés, et ne poussent qu'une fois, vite).
     1. Changer de page : sous l'en-tête, un bras à la couleur de la page qui arrive (la couleur de la saison, celle de
        l'univers du spectacle) pousse d'un bord à l'autre, effilé, sa pointe enroulée ; la page se pose dessous à la tâche
        suivante et monte derrière lui ; au retour, le bras pousse de droite à gauche. La photo d'une carte de spectacle devient
        la grande photo de sa page (élément partagé : elle vole de la carte à sa place, transform seul, sans View Transition qui
        retarderait l'image du geste) ; d'un onglet à l'autre, l'en-tête reste et les chapitres montent. Un nouveau geste
        interrompt tout (les animations sont annulées). Le petit bras de l'élément du menu se dessine sous la main.
     2. Ouvrir une saison : les bras de sa carte poussent depuis Rouen, ses dates arrivent en cascade.
     3. Filtrer, chercher : les dates glissent à leur nouvelle place (MOUVEMENT.flip) ; puis la frise et la carte répondent
        ensemble : les repères glissent, les bras des communes gardées repoussent depuis Rouen.
     4. Survol et focus : 160 à 200 ms ; une ligne survolée allume son bras sur la carte et son repère sur la frise, et
        inversement.
     5. Pression : la pièce se tasse, comme une ventouse qui prend, dès le pointerdown (MOUVEMENT.presse).
     6. Défilement (MOUVEMENT.reveler) : les titres montent, le trait sous eux se dessine, les cartes viennent l'une après
        l'autre ; les bras d'une carte poussent quand elle arrive à l'écran.
     7. Ce qui vit : « EN TOURNÉE » respire, « aujourd'hui » respire sur chaque frise, la ventouse de la prochaine date bat.
     Réserver une date (règle 17, RESERVER) : le bras pousse jusqu'à la commune. Choisir une date fait pousser son bras de Rouen
     jusqu'à sa commune sur la carte d'à côté, pendant que sa carte de réservation se déroule : un bras effilé, à la couleur du
     spectacle, la traverse de gauche à droite et la découvre ; « Réserver » se pose en dernier.
     Les vidéos (règle 18, LECTEUR) : la vidéo s'ouvre en cercle depuis le bouton de lecture, comme les bras s'ouvrent autour
     de Rouen ; la page s'éteint en fondu, se rallume plus vite. Le jour et la nuit (règle 19, THEME) : le cercle de l'outil.
     La troupe (règle 20, TROUPE) : la pieuvre de la compagnie au cœur, un bras vers chaque métier, qui pousse quand la troupe
     arrive à l'écran ; une personne survolée relie toutes ses places.
     Les frises (FRISE) sont des bras : l'axe effilé pousse de gauche à droite, chaque date une ventouse à la couleur de son
     spectacle : la saison (toutes ses dates, reliées aux listes et à la carte), les saisons passées (leur densité), la tournée
     d'un spectacle, son bilan, les dates scolaires, la diffusion saison par saison (programmer, chaque fiche, l'onglet
     programmer), l'histoire de la compagnie.
     La pieuvre (TENTACULES) : deux moments, tous deux la tournée. À l'ouverture, ses bras deviennent ceux de la carte ; quand
     on choisit une commune sur la carte de la saison, une tentacule part de la pieuvre et s'y pose. Rien d'autre.
     Moins d'animations demandé (ou ?anim=0) : tout est posé, rien ne bouge. */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    quand: d.ligneDate, l: d.l, scolaire: d.scolaire, annulee: annulee(d), etat: d.etat });
  const repereLigne = (d, saison, i, slug, titre, couleur) => { const k = d.iso || cleDate(d, saison);
    return k ? { id: cleLigne(d, saison, i), jour: k, fin: d.fin || k, couleur: couleur || couleurDe(slug), titre,

  /* ---------- le bras de la page : il pousse sous l'en-tête d'un bord à l'autre, la page monte derrière lui ---------- */

  /* ---------- les saisons (#/saisons, règle 21) : tout l'agenda sur une page ----------
     La saison en cours, sous sa marque à la couleur de la saison (règle 22) : sa frise (toutes ses dates sur une seule ligne du
     temps, à la couleur de leur spectacle, et leur légende), ses prochaines dates (règle 17 : une date tout public est un bouton
     qui ouvre sa carte de réservation sous sa ligne ; une date scolaire est marquée, sans bouton), toutes ses dates, passées en
     retrait, et sa carte ; puis les saisons passées, de la plus récente à la plus ancienne, chacune fermée sous sa petite carte
     (ses bras), son contenu dessiné à l'ouverture. Le filtre par spectacle, la recherche et le choix d'une commune portent sur
     toute la page. #/saisons/<saison> : la même page, cette saison ouverte et amenée à l'écran. */
  const norm = s => String(s || '').replace(/<[^>]+>/g, ' ').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘]/g, "'").toLowerCase();
  const MOIS_RE = 'janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre';
  const MOIS_NOMS = MOIS_RE.split('|');
  const MOIS_TOK = `${MOIS_RE}|janv|févr|avr|juil|sept|oct|nov|déc`;   // les mois, entiers ou abrégés (« 26 sept – 4 oct 2016 »)
  const RE_JOUR = new RegExp(`(\\d{1,2})(?:er)?\\s+(${MOIS_TOK})\\.?(?:\\s+(\\d{4}))?`, 'gi');
  const RE_MOIS_AN = new RegExp(`(${MOIS_TOK})\\.?\\s+(\\d{4})`, 'i');
  const RE_LIGNE = new RegExp(`^(.*?)\\s*((?:${MOIS_TOK})\\.?\\s+\\d{4})([\\s\\S]*)$`, 'i');
  const p2 = n => String(n).padStart(2, '0');
  const moisDe = x => { const t = x.toLowerCase(); return MOIS_NOMS.findIndex(n => n.startsWith(t) || t.startsWith(n.slice(0, 4))) + 1; };
  // la date de fin d'une ligne, « 2020-03-04 » : iso/fin quand la base les a, sinon lue dans la ligne (le dernier jour cité)
  function cleDate(d, saison) {
    const fin = d.fin || d.iso; if (fin) return fin;
    const tete = String(d.ligne || '').split(/—|\s:\s/)[0], a0 = +saison.slice(0, 4);
    const ms = [...tete.matchAll(RE_JOUR)], dern = ms[ms.length - 1];
    if (dern) { const mm = moisDe(dern[2]); return `${dern[3] ? +dern[3] : mm >= 9 ? a0 : a0 + 1}-${p2(mm)}-${p2(+dern[1])}`; }
    const ma = tete.match(RE_MOIS_AN);

  /* ---------- la compagnie : sa présentation, ses dates sur un bras qui s'enroule, son directeur ---------- */
  // l'histoire de la compagnie : ses années sur une frise (un bras, chaque année une ventouse et son titre), puis leur liste
  const listeAnnees = dates => `<ol class="frise-l" style="--n:${dates.length}">${dates.map((d, i) => `<li><span class="an"${ed(`site.compagnie.dates.${i}.annee`)}>${esc(d.annee)}</span><span class="ti"${ed(`site.compagnie.dates.${i}.titre`)}>${esc(d.titre)}</span></li>`).join('')}</ol>`;
  /* ---------- la troupe (règle 20, TROUPE) : les bras de la pieuvre ----------
     La pieuvre de la compagnie en tête ; un bras effilé descend d'elle et pousse, de métier en métier, une branche vers chaque
     catégorie (son icône dans une ventouse, son titre) ; les personnes sont les ventouses du bras : une pastille, leur visage
     quand sa publication est accordée (sinon le nom seul), leur nom, leur métier précis. Une personne paraît dans chaque
     catégorie de ses métiers ; la survoler ou la choisir allume toutes ses places et les relie (TROUPE.relier, des liens à la
     couleur de la saison). Les bras poussent une fois, quand la troupe arrive à l'écran (Web Animations sur le masque qui les
     découvre) ; moins d'animations : posés. Relue dans D à chaque rendu. */
  const TR = typeof TROUPE !== 'undefined' ? TROUPE : null;
  let troupeCtl = null, troupeIO = null, troupeRO = null;
  function placeTroupe(x) {
    const metiers = !x.evident && x.metiers.length ? `<span class="tr6-m">${x.metiers.map(m => `<span>${esc(m)}</span>`).join('')}</span>` : '';
    const ancre = x.photo ? `<span class="tr6-v" data-troupe-ancre><img src="${esc(x.photo)}" alt="" width="96" height="96" loading="lazy" decoding="async" data-troupe-photo></span>`
      : '<span class="tr6-pt" data-troupe-ancre></span>';
    return `<li><button type="button" class="tr6-p${x.photo ? ' a-photo' : ''}" data-troupe-place data-troupe-personne="${esc(x.personne)}" aria-pressed="false">${ancre}<span class="tr6-qui"><span class="tr6-nom">${x.prenom ? `<span>${esc(x.prenom)}</span> ` : ''}<span>${esc(x.nom)}</span></span>${metiers}</span></button></li>`;
  }
  function troupeHtml() {
    if (!TR || !S.troupe) return '';
    const cs = TR.categories().filter(c => c.places.length);
    if (!cs.length) return '';
    // les visages d'abord, dans chaque catégorie (le jeu, le plus nombreux, en dernier : la plus longue branche)
    const jeu = cs.find(c => c.cle === 'jeu'), ordre = [...cs.filter(c => c !== jeu), ...(jeu ? [jeu] : [])];
    return `<section class="wrap troupe-s" aria-labelledby="h-troupe"><h2 class="titre-s" id="h-troupe"${ed('site.troupe.titre')}>${esc(TR.titre())}</h2>${trait()}
      <div class="tr6" data-troupe>
        <svg class="tr6-bras" aria-hidden="true" focusable="false"></svg>
        <div class="tr6-coeur" aria-hidden="true">${D.logo.octopus}</div>
        ${ordre.map(c => `<section class="tr6-cat${c === jeu ? ' tr6-jeu' : ''}" data-troupe-categorie="${esc(c.cle)}" aria-labelledby="tr6-h-${esc(c.cle)}">
          <h3 class="tr6-t" id="tr6-h-${esc(c.cle)}"><span class="tr6-ic">${TR.icone(c.cle)}</span><span${ed(`site.troupe.categories.${c.i}.titre`)}>${esc(c.titre)}</span></h3>
          <ul class="tr6-places">${[...c.places.filter(x => x.photo), ...c.places.filter(x => !x.photo)].map(placeTroupe).join('')}</ul></section>`).join('')}
      </div></section>`;
  }
  // les bras de la troupe : un tronc qui descend de la pieuvre, une branche vers l'icône de chaque catégorie ; tracés d'après la
  // mise en page (lue à l'image qui suit, puis quand la troupe change de taille), découverts par un masque qui pousse
  function brasTroupe(tr, pousse) {
    const svg = $('.tr6-bras', tr), coeur = $('.tr6-coeur', tr); if (!svg || !coeur || !TR) return;
    const r0 = tr.getBoundingClientRect(), W = r0.width, H = r0.height;
    if (!W || !H) return;
    const c = coeur.getBoundingClientRect(), x0 = c.left - r0.left + c.width * .5, y0 = c.top - r0.top + c.height * .78;
    const ics = $$('.tr6-ic', tr).map(i => { const r = i.getBoundingClientRect(); return [r.left - r0.left, r.top - r0.top + r.height / 2]; });
    if (!ics.length) return;
    const xs = Math.max(10, Math.min(x0, ...ics.map(p => p[0])) - 30), yN = ics[ics.length - 1][1];
    // le tronc : de la pieuvre jusqu'à la hauteur de la dernière catégorie, le long du bord gauche ; puis une branche par catégorie
    const yb = Math.max(y0 + 24, Math.min(y0 + 90, ics[0][1] - 34));   // le tronc a rejoint le bord avant la première branche
    const tronc = TR.lisse([[x0, y0], [x0 - (x0 - xs) * .5, y0 + (yb - y0) * .45], [xs, yb], [xs, Math.max(yN, yb + 1)]]);
    const branches = ics.map(([x, y]) => TR.courbe([xs, y - 26], [x - 4, y], { courbe: .3 }));
    const f = n => n.toFixed(1);
    svg.setAttribute('viewBox', `0 0 ${f(W)} ${f(H)}`);
    svg.innerHTML = `<defs><mask id="tr6-masque" maskUnits="userSpaceOnUse" x="0" y="0" width="${f(W)}" height="${f(H)}">
        <path class="tr6-mq" pathLength="1" d="${tronc.d}"/>${branches.map(b => `<path class="tr6-mq" pathLength="1" d="${b.d}"/>`).join('')}</mask></defs>
      <g mask="url(#tr6-masque)"><path class="tr6-b" d="${TR.effile(tronc, { w0: 14, w1: 4 })}"/>${branches.map(b => `<path class="tr6-b" d="${TR.effile(b, { w0: 5, w1: 2 })}"/>`).join('')}</g>
      ${ics.map(([x, y]) => `<circle class="tr6-vent" cx="${f(x - 4)}" cy="${f(y)}" r="3.4"/>`).join('')}`;
    if (!pousse || !bouge() || !svg.animate) return;
    $$('.tr6-mq', svg).forEach((m, i) => m.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: i ? 520 : 900, delay: i ? 260 + i * 90 : 0, easing: COURBE, fill: 'backwards' }));
  }
  // la troupe prend vie : les liens entre les places d'une personne, les bras qui poussent et les icônes qui s'animent à l'arrivée
  function vivreTroupe() {
    if (troupeCtl) { troupeCtl.detruire(); troupeCtl = null; }
    if (troupeIO) { troupeIO.disconnect(); troupeIO = null; }
    if (troupeRO) { troupeRO.disconnect(); troupeRO = null; }
    const tr = $('.tr6', main);
    if (!tr || !TR) return;
    troupeCtl = TR.relier(tr, { liens: true, clavier: true });
    let vu = !bouge(), largeur = 0;
    requestAnimationFrame(() => brasTroupe(tr, false));
    if ('ResizeObserver' in window) { troupeRO = new ResizeObserver(es => { const w = Math.round(es[0].contentRect.width); if (w !== largeur) { largeur = w; requestAnimationFrame(() => brasTroupe(tr, false)); } }); troupeRO.observe(tr); }
    if (!vu && 'IntersectionObserver' in window) {
      troupeIO = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return;
        if (x.target === tr && !vu) { vu = true; brasTroupe(tr, true); }
        else if (x.target !== tr) { troupeIO.unobserve(x.target); x.target.classList.add('est-vivant'); setTimeout(() => x.target.classList.remove('est-vivant'), 1600); } }), { rootMargin: '0px 0px -12% 0px' });
      troupeIO.observe(tr);
      $$('.troupe-icone', tr).forEach(i => troupeIO.observe(i));
    }
    // une photo publiée qui ne se charge pas (le fichier manque) : sa place garde le nom seul
    tr.addEventListener('error', e => {
      const i = e.target; if (!i || !i.matches || !i.matches('img[data-troupe-photo]')) return;
      const a = i.closest('[data-troupe-ancre]'), b = i.closest('.tr6-p');
      if (a) a.className = 'tr6-pt'; if (b) b.classList.remove('a-photo');
      i.remove();
    }, true);
  }
  function compagnie() {
    const P = S.compagnie, Dr = P.directeur;
    main.innerHTML = `
      <div class="wrap page-titre"><h1 tabindex="-1"${ed('site.compagnie.titre')}>${esc(P.titre)}</h1>${trait()}</div>
      <section class="wrap compagnie"><div class="texte">${P.paragraphes.map((p, i) => `<p${i ? '' : ' class="grand"'}${ed(`site.compagnie.paragraphes.${i}`)}>${p}</p>`).join('')}</div></section>

      <section class="wrap frise-s"><h2${ed('site.compagnie.datesTitre')}>${esc(P.datesTitre)}</h2><div class="histoire" id="c-frise"></div>${listeAnnees(P.dates)}</section>
      ${Dr ? `<section class="wrap directeur"><div><h2${ed('site.compagnie.directeur.titre')}>${esc(Dr.titre)}</h2>${trait()}<p class="chapeau"${ed('site.compagnie.directeur.chapeau')}>${esc(Dr.chapeau)}</p></div><div class="texte">${Dr.paragraphes.map((p, i) => `<p${ed(`site.compagnie.directeur.paragraphes.${i}`)}>${p}</p>`).join('')}</div></section>` : ''}
      <section class="wrap partenaires-s"><p${ed('site.partenaires')}>${S.partenaires}</p></section>`;
    const ans = (P.dates || []).map(d => +d.annee).filter(Boolean);
    if (ans.length) frise($('#c-frise', main), { echelle: 'periode', debut: `${Math.min(...ans)}-01-01`, fin: `${Math.max(...ans)}-12-31`, etiquettes: true, couloirs: 3, anMin: 64,
      largeurCar: 8.4, largeurMax: 190, libelle: P.datesTitre, classe: 'frise-compagnie', choix: () => {},
      points: P.dates.map((d, i) => { const s = D.shows.find(x => String(x.annee) === String(d.annee)); return { id: `c${i}`, annee: d.annee, titre: d.titre, lien: s ? lienSp(s.slug) : null, couleur: s ? couleurDe(s.slug) : 'var(--bras)' }; }) });
    // la troupe (sous la présentation) : vivante quand elle est posée
    apres(vivreTroupe);

  /* ---------- la page d'un spectacle, dans son univers : un en-tête commun ; en tournée (ou en création), trois onglets d'entrée ;

  const h2u = (id, t, chemin) => `<h2 class="h2u" id="h-${id}" tabindex="-1"${ed(chemin)}>${esc(t)}</h2>`;

  // (une adresse qui n'est ni YouTube ni Vimeo : un lien, sur une photo du spectacle)

  /* les vidéos, lues dans la page (règle 18, LECTEUR) : la bande-annonce sur la grande photo du spectacle, puis ses autres

  function videosHtml(s, id = `lc-${s.slug}`) {

  }

      // la vue remonte en haut et son titre prend le focus à l'image suivante (avant qu'elle soit peinte)
      requestAnimationFrame(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        if (!INTRO.ouverte()) { const h1 = $('h1', main); if (h1) h1.focus({ preventScroll: true }); }
        if (de) photoVole(de, $('.tete-photo img', main));
      });
      monter(type);
    };
    // la première vue (et sous l'ouverture) : tout de suite ; ensuite, le bras de la page part dès l'image du geste et la page se
    // pose dessous à la tâche suivante (la photo d'une carte vole jusqu'à sa place : photoVole)
    if (enPlace || premiere || !MV || INTRO.ouverte()) faire();
    else { brasDePage(type, couleur); requestAnimationFrame(() => setTimeout(faire, 0)); }
  }
  // la photo d'une carte de spectacle devient la grande photo de sa page : une copie part de la carte et se pose à sa place
  // (transform seul, au-dessus de tout) ; un nouveau geste l'arrête
  let vol = null;
  function photoVole(de, cible) {
    if (vol) { try { vol.cancel(); } catch (e) { /* fini */ } vol = null; }
    if (!de || !cible || !de.width || !bouge() || !document.body.animate) return;
    const a = cible.getBoundingClientRect();
    if (!a.width || !a.height) return;
    const img = document.createElement('img');
    img.src = cible.currentSrc || cible.src; img.alt = ''; img.className = 'photo-vole'; img.setAttribute('aria-hidden', 'true');
    img.style.cssText = `left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;object-position:${cible.style.objectPosition || '50% 50%'}`;
    document.body.appendChild(img);
    cible.style.visibility = 'hidden';
    const fin = () => { img.remove(); cible.style.visibility = ''; if (vol === anim) vol = null; };
    const anim = img.animate([{ transform: `translate(${(de.left - a.left).toFixed(1)}px, ${(de.top - a.top).toFixed(1)}px) scale(${(de.width / a.width).toFixed(4)}, ${(de.height / a.height).toFixed(4)})` }, { transform: 'none' }],
      { duration: 420, easing: COURBE });
    anim.onfinish = fin; anim.oncancel = fin;
    vol = anim;
  }
  // « Modifier le site » : la connexion puis l'édition sur place (EDITION, commun aux maquettes)
  pied.addEventListener('click', e => { if (e.target.closest('[data-modifier]') && typeof EDITION !== 'undefined') EDITION.ouvrir(); });
  document.addEventListener('click', e => { if (!e.target.closest('.carte-lieu, .bulle')) depingler(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') depingler(); });

  // la pieuvre : aucune réponse aux clics ni aux pages ; deux moments seulement, la tournée (l'ouverture, une commune choisie)
  if (typeof TENTACULES !== 'undefined') TENTACULES.regler({ clic: false, pages: false, style: 'encre' });
  // la pression : la pièce se tasse dès le pointerdown
  if (MV) MV.presse(document);
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  // l'ouverture : la pieuvre blanche sur sa tache, à la couleur de la saison (règle 22), sur l'encre teintée de la saison ; quand elle a
  // révélé l'accueil, les bras de la carte poussent depuis Rouen
  couleurs();
  const th = couleurSaison(), fondO = th ? melange(th.jour, '#000000', .55) : '#1d1418';
  INTRO.ouvrir({ degrade: [[0, fondO], [.55, '#120d10'], [1, '#08060a']], encre: '#ffffff', tache: true, classe: 'ouverture-06',
    apres: () => { const f = $('.une-carte', main); if (f && !f.dataset.poussee) pousser(f); } });
  route();
  addEventListener('hashchange', () => route());
  // l'agenda passé et tous les lieux de la compagnie : calculés d'avance, quand le navigateur est libre (le geste n'a plus qu'à les lire)
  const davance = () => { relire(); retenu('agendaPasse', agendaPasse); TOUT(); };
  if ('requestIdleCallback' in window) requestIdleCallback(davance, { timeout: 1500 }); else setTimeout(davance, 600);
  // la base de la compagnie : à chaque enregistrement, D change en place et la vue courante est refaite en place
  // (une vidéo chargée, règle 18 : la vue ne se refait pas sous elle, elle s'arrêterait ; on y revient quand elle ne l'est plus)
  let plusTard = 0;
  const refaire = () => { clearTimeout(plusTard); if (LC && LC.actif()) { plusTard = setTimeout(refaire, 2500); return; } route(true); };
  if (typeof DONNEES !== 'undefined') DONNEES.surChangement(refaire);
})();
</script>
