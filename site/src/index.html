.sp-som button::before { content: ""; flex: none; width: 1.25rem; height: 1px; background: currentColor; transition: width var(--k-page) var(--k-doux), height var(--k-page) var(--k-doux), background-color var(--k-survol) var(--k-doux); }
.sp-som button:hover, .sp-som li.on button { color: var(--u-texte); }
.sp-som li.on button::before { width: 2.5rem; height: 2px; background: var(--u-vif); box-shadow: 0 0 10px var(--u-lueur); }
.sp-som-signe { display: block; width: 4.5rem; margin-top: 28px; color: var(--u-vif); opacity: .6; }
/* (plus étroit, le sommaire flottant attend qu'on ait quitté l'ouverture : il en couvrirait l'appel) */
.sp-tournee.une-vu .som:not(:focus-within) { opacity: 0; visibility: hidden; transition: opacity var(--k-survol) var(--k-doux), visibility 0s var(--k-survol); }
@media (min-width: 1000px) {
  .sp-grille { grid-template-columns: 11.5rem minmax(0, 1fr); column-gap: clamp(32px, 5vw, 80px); }
  .sp-som { display: block; position: sticky; top: calc(var(--haut) + var(--onglets) + 32px); align-self: start; }
  .sp .som { display: none; }
}
/* la page seule (la 10) : le sommaire, un bras et ses ventouses (celle du chapitre lu, pleine) ; au téléphone, des pastilles ;
   un filet entre les chapitres */
.sp-som--seul { display: block; margin: 0 0 26px; }
.sp-som--seul ol { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.sp-som--seul button { width: auto; min-height: 36px; padding: 5px 13px; border: 1.5px solid var(--u-filet); border-radius: 999px; font: 500 .86rem/1.3 var(--sans); letter-spacing: 0; text-transform: none; }
.sp-som--seul button::before { display: none; }
.sp-som--seul li.on button { border-color: var(--u-vif); }

.dos-demandes li::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 12px; border-radius: 50%; background: #fff; vertical-align: .1em; }
.dos-axes { padding-left: 1.2em; }
.dos-axes li { margin-bottom: .5em; }
.dos-ateliers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 26px; align-items: start; }
.atelier { position: relative; padding: clamp(22px, 3vw, 32px); border-top: 4px solid var(--u-accent); border-radius: 8px; background: var(--u-fond2); }
.atelier p { margin: 0 0 .9em; line-height: 1.65; }
.atelier-n { position: absolute; right: 18px; top: 12px; font: 700 2.6rem/1 var(--u-titre-f); color: color-mix(in srgb, var(--u-accent) 22%, transparent); }
.atelier > .dos-h4:first-of-type { margin-top: 0; padding-right: 48px; font-size: .98rem; }
.etape { margin: 14px 0 0; padding: 14px 16px; border-radius: 6px; background: var(--u-fond); }
.etape h4 { margin: 0 0 6px; font: 600 .98rem/1.4 var(--u-corps); color: var(--u-texte); }
.etape p { margin: 0; }
.atelier ul { margin: .6em 0 0; padding-left: 1.1em; }
.atelier li { margin-bottom: .5em; line-height: 1.55; }
.atelier-ph img { width: 100%; border-radius: 8px; }
.dos-accueil { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
.dos-fiche-t { margin: 0 0 10px !important; font: 700 1.3rem/1.2 var(--u-titre-f); color: var(--u-accent); text-transform: uppercase; }
.dos-alerte { display: flex; gap: 14px; align-items: flex-start; margin: 0 0 22px; padding: 18px 20px; border: 2px solid var(--u-accent); border-radius: 8px; background: var(--u-fond2); }
.dos-alerte svg { flex: none; width: 26px; height: 26px; color: var(--u-accent); }



/* ———————————— le mouvement (règle 15) : l'organique, rangé (la 10) ; voir le bloc « Mouvement » en tête du script ————————————
   Une famille de courbes souples (--k-doux ; --k-souple, un rien de rebond, jamais de secousse) ; survol 180 ms, pression
   60 ms, page 440 ms au plus ; tout monte de 10 px. Aucune View Transition : l'encre, la floraison et le menu qui glisse font
   la page (la capture d'un écran entier coûte, et rien n'y gagne). */
html { view-transition-name: none; }
/* l'encre d'un spectacle (Encre) : une toile fixe au-dessus de tout ; tant qu'elle couvre l'écran, c'est elle qu'on touche */
.encre-page { position: fixed; inset: 0; z-index: 90; width: 100%; height: 100%; pointer-events: none; }
.encre-page.couvre { pointer-events: auto; }
/* une page qui arrive : son titre fleurit (il se dépose), le bras d'encre arrive du bord de l'écran, le souligne et s'enroule */
.fleur { position: relative; display: inline-block; padding-bottom: 22px; --trait: var(--saison-vive); }
.fleur::after { content: ""; position: absolute; left: -100vw; right: 29px; bottom: 2px; height: 3px; border-radius: 2px; background: var(--trait); }
.fleur::before { content: ""; position: absolute; right: 0; bottom: -1px; width: 30px; height: 30px; background: var(--trait);
  -webkit-mask: var(--boucle) 0 0 / 100% 100% no-repeat; mask: var(--boucle) 0 0 / 100% 100% no-repeat; }
main.arrive .fleur { animation: k-fleurit .36s var(--k-doux) both; }
main.arrive .fleur::after { transform-origin: 0 50%; animation: k-bras .42s var(--k-doux) .02s both; }
main.arrive .fleur::before { animation: k-boucle .24s var(--k-souple) .2s both; }
@keyframes k-fleurit { from { opacity: .15; transform: translateY(var(--k-monte)); } }
@keyframes k-bras { from { transform: scaleX(0); } }
@keyframes k-boucle { from { opacity: 0; transform: scale(.2) rotate(-120deg); } }
/* entre les onglets d'un spectacle, l'ouverture ne rejoue rien */
.sp-une.deja .u-titre .ligne, .sp-une.deja .une-acc { animation: none !important; }
/* au défilement (MOUVEMENT.reveler) : les titres se déposent, les lignes et les fiches se déroulent l'une après l'autre, les
   filets et les petits bras sous les titres se tracent */
[data-mv].mv-attente { transition: opacity .44s var(--k-doux), transform .44s var(--k-doux), clip-path .5s var(--k-doux); transition-delay: var(--mv-delai, 0ms); }
[data-mv="monte"].mv-attente:not(.mv-vu) { transform: translateY(var(--k-monte)); }
[data-mv="cascade"].mv-attente > * { transition: opacity .4s var(--k-doux), transform .44s var(--k-doux); transition-delay: calc(var(--mv-delai, 0ms) + min(var(--mv-i, 0), 12) * 40ms); }
[data-mv="cascade"].mv-attente:not(.mv-vu) > * { transform: translateY(var(--k-monte)); }
svg[data-mv="trace"].mv-attente [pathLength] { transition: stroke-dashoffset var(--k-lent) var(--k-doux) var(--mv-delai, 0ms); }
section.bloc { position: relative; border-top: 0; }
.filet { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--filet); transform-origin: 0 50%; pointer-events: none; }
.filet[data-mv="trace"].mv-attente { transition: transform var(--k-lent) var(--k-doux); }
/* la pression : une ventouse se pose sous le doigt (.succion, à la couleur de ce qu'on presse), la pièce s'enfonce d'un rien */
.succion { position: fixed; z-index: 95; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; pointer-events: none;
  border: 2.5px solid var(--sc, var(--saison-vive)); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--sc, var(--saison-vive)) 22%, transparent); opacity: 0; }
:is(.bouton, .bu, .puce, .idx-tout, .idx, .som-b, .entrees a, .dos-bt, .fu-a, .suivant, .u-onglets a, .rs-date, .rs-reserver, .rs-seance, .lc-b, .s7-chip, .s7-rac button, .ep-bt, .ep-rac button) {
  transition-property: background-color, color, border-color, box-shadow, scale; transition-duration: var(--k-survol), var(--k-survol), var(--k-survol), var(--k-survol), .12s; transition-timing-function: var(--k-doux); }
:is(.bouton, .bu, .puce, .idx-tout, .idx, .som-b, .entrees a, .dos-bt, .u-onglets a, .rs-date, .rs-reserver, .rs-seance, .lc-b, .s7-chip, .s7-rac button, .ep-bt, .ep-rac button, .tr6-p).mv-presse { scale: .96; transition-duration: var(--k-presse); }
:is(.fu-a, .tdm-a, .ep-porte, .fp-ph, .ac-ph, .dos-appel, .sai > summary).mv-presse { scale: .985; transition: scale var(--k-presse); }
.suivant.mv-presse .fleche { translate: 6px 0; }
.dates > li .t.mv-presse, .prochaines a.mv-presse { opacity: .75; }
/* ce qui vit : « en tournée » respire comme une ventouse (elle se creuse et se gonfle) */
.fu-badge.tournee::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: .1em; animation: respire 2.2s ease-in-out infinite; }
@keyframes respire { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
/* une ligne vers laquelle mène un repère de frise s'allume un instant */
.dates > li.est-vise, .sa-dates > li.est-vise { animation: vise 1.4s var(--k-doux); }
@keyframes vise { 0%, 35% { background: color-mix(in srgb, var(--saison-vive) 16%, transparent); } }

/* les longs contenus se rendent par morceaux : ce qui est hors de l'écran n'est mis en page qu'à son arrivée */
.fp { content-visibility: auto; contain-intrinsic-size: auto 680px; }
.ac { content-visibility: auto; contain-intrinsic-size: auto 860px; }
article.u .chap { content-visibility: auto; contain-intrinsic-size: auto 1000px; }

/* ———— les frises (FRISE), sur le papier de la synthèse, dans la langue de la 10 : un bras d'encre et ses ventouses ————
   L'axe est un bras qui s'effile (épais au départ, fin au bout) ; chaque date, une ventouse à la couleur de son spectacle
   (pleine à venir, vidée une fois jouée) ; « aujourd'hui », une goutte d'encre dont le cœur bat ; les saisons et la
   diffusion, des bras qui poussent du grand bras, longs comme le nombre de leurs dates. Survolée, une ventouse se gonfle,
   souple (--fr-courbe). Les scolaires gardent leur losange, les résidences leur carré évidé (la légende, règle 23). */
.frise[data-frise] { --fr-fond: var(--papier); --fr-encre: var(--encre); --fr-trait: color-mix(in srgb, var(--encre) 26%, transparent); --fr-accent: var(--saison-texte);
  --fr-police: var(--sans); --fr-bulle-fond: var(--encre); --fr-bulle-encre: var(--papier); --fr-point: 12px; --fr-couloir: 18px; --fr-courbe: var(--k-souple);
  --fr-bras: color-mix(in srgb, var(--encre) 62%, transparent); }
.frise[data-frise] .frise-axe { height: 7px; margin-top: -3.5px; border-radius: 4px; background: var(--fr-bras); clip-path: polygon(0 0, 100% 38%, 100% 62%, 0 100%); }
.frise[data-frise].frise--v .frise-axe { width: 7px; height: auto; margin: 0 0 0 -3.5px; clip-path: polygon(0 0, 100% 0, 62% 100%, 38% 100%); }
.frise[data-frise] .frise-point:not(.est-scolaire, .est-annule, .est-duree, .est-residence) > .frise-repere::before {
  background: radial-gradient(circle, var(--fr-c, currentColor) 0 2.4px, var(--fr-fond) 2.9px 3.9px, var(--fr-c, currentColor) 4.4px); }
.frise[data-frise] .frise-point.est-passe:not(.est-scolaire, .est-annule, .est-duree, .est-residence) > .frise-repere::before {
  background: radial-gradient(circle, var(--fr-fond) 0 3.6px, var(--fr-c, currentColor) 4.2px); }
.frise[data-frise] .frise-point > .frise-repere::before { transition: scale var(--k-survol) var(--k-souple), opacity .16s; }
.frise[data-frise] .frise-point > .frise-repere:is(:hover, :focus-visible)::before { scale: 1.4; }
.frise[data-frise] .frise-point.est-duree > .frise-repere:is(:hover, :focus-visible)::before { scale: 1 1.6; }
.frise[data-frise] .frise-aujourdhui::before { opacity: .45; }
.frise[data-frise] .frise-aujourdhui::after { left: -7px; bottom: -6px; width: 14px; height: 14px; border-radius: 50% 0 50% 50%; rotate: -45deg; background: var(--saison-vive); box-shadow: 0 0 0 2px var(--fr-fond); }
.frise[data-frise] .frise-souffle { left: -7px; bottom: -6px; width: 14px; height: 14px; background: var(--saison-vive); }
.frise[data-frise].est-vue:not(.est-immobile) .frise-souffle { animation: k-coeur 1.8s ease-out 1s infinite; }
.frise[data-frise].frise--v .frise-aujourdhui::after, .frise[data-frise].frise--v .frise-souffle { left: calc(var(--fr-axe) - 7px); top: -7px; bottom: auto; }
@keyframes k-coeur { 0% { opacity: 0; scale: 1; } 8% { opacity: .55; scale: 1.9; } 18% { opacity: 0; scale: 2.3; } 26% { opacity: .45; scale: 2; } 40%, 100% { opacity: 0; scale: 2.8; } }
.frise[data-frise] .frise-bande-barre { border-radius: 999px 999px 2px 2px / 14px 14px 2px 2px; }
.frise[data-frise] .frise-bande > .frise-repere:is(:hover, :focus-visible) .frise-bande-barre, .frise[data-frise] .frise-bande.est-allume .frise-bande-barre { scale: 1.08 1.05; }
.frise[data-frise] .frise-bande-barre { transition: transform .3s var(--k-souple), scale var(--k-survol) var(--k-souple), opacity .16s; }
.frise .frise-mois-nom { font: 500 .92rem/1.1 var(--titre); }
.frise .frise-an { font: 500 .72rem/1.3 var(--sans); letter-spacing: .06em; }
.frise .frise-aujourdhui-nom { font: 600 .66rem/1 var(--etiq); letter-spacing: .12em; text-transform: uppercase; }
/* (« aujourd'hui » paraît avec sa frise, d'un fondu bref et sans attendre l'axe : il se lit dès que la frise est à l'écran) */
.frise[data-frise].est-vue .frise-aujourdhui { animation-duration: .25s; animation-delay: 0s; }
.frise .frise-bulle { font: 400 .86rem/1.4 var(--sans); box-shadow: 0 14px 30px -14px rgba(29, 20, 24, .55); }
.frise .frise-bulle b { font: 500 1.08rem/1.2 var(--titre); }
.frise .frise-grappe-n { font-family: var(--sans); }
.v-frise, .sa-frise, .e-frise { margin: 0 0 26px; }
/* la légende d'une frise de dates (règle 23) : les signes de ses repères, quand elle en mêle : tout public (le point),
   scolaire (le losange), résidence (le carré évidé de FRISE) */
.fr-legende { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 20px; margin: -12px 0 24px; padding: 0; font: 500 .84rem/1.3 var(--sans); color: var(--gris); }
.fr-legende li { display: inline-flex; align-items: center; gap: 8px; }
.fr-legende i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.fr-legende .fr-l-sco i { width: 9px; height: 9px; border-radius: 2px; rotate: 45deg; }
.fr-legende .fr-l-res i { border-radius: 2px; background: none; box-shadow: inset 0 0 0 2px currentColor; }
.u .fr-legende { color: var(--u-texte2); }
.u-frise + .fr-legende { margin-top: calc(-1 * clamp(14px, 2.4vw, 28px)); }
/* ———— la saison en cours (#/saisons, composée comme la 07, dans la langue de la 10) ————
   La tête de page en grand (la compagnie en capitales espacées, « Saisons » sur un lavis de la saison ; ses raccourcis,
   chacun sa ventouse) ; la recherche soulignée d'un filet qui prend l'encre ; les spectacles en étiquettes droites, une
   pastille à leur couleur (choisi : le cadre s'encre). Puis la saison sous sa marque : son titre, la ventouse de la saison,
   « la saison en cours », un filet ; sa frise (le bras de la saison, ses ventouses, « aujourd'hui » une goutte qui bat) et sa
   légende ; ses prochaines dates et toutes ses dates (une ventouse à la couleur du spectacle, le jour en grand, le titre dans
   la police de son univers), à côté de sa carte, qui écrit sous elle la commune survolée. L'encre vive est la couleur de la
   saison (--saison-vive), le noir celui de la synthèse. */
.s7-entete { padding: clamp(56px, 7vw, 96px) 0 clamp(18px, 2.5vw, 32px); background: radial-gradient(min(62rem, 150vw) min(34rem, 100vw) at 14% 0, color-mix(in srgb, var(--saison-vive) 13%, transparent), transparent 72%) no-repeat; }
.s7-sur { margin: 0; font: 600 .875rem/1.3 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
.s7-titre { margin: .9rem 0 0; font: 500 clamp(2.75rem, 1.5rem + 5.4vw, 6rem)/.98 var(--titre); letter-spacing: -.015em; text-wrap: balance; overflow-wrap: break-word; }
.s7-rac { list-style: none; display: flex; flex-wrap: wrap; gap: 0 clamp(18px, 2.6vw, 36px); margin: clamp(14px, 2vw, 24px) 0 0; padding: 0; }
.s7-rac button { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; color: color-mix(in srgb, var(--encre) 86%, transparent);
  font: 600 .95rem/1.2 var(--texte); text-align: left; cursor: pointer; }
.s7-rac button:hover { color: var(--encre); }
.s7-lampe { flex: none; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle, var(--saison-vive) 0 2px, var(--papier) 2.5px 3.3px, var(--saison-vive) 3.8px);
  transition: scale var(--k-survol) var(--k-souple); }
.s7-rac button:is(:hover, :focus-visible) .s7-lampe { scale: 1.4; }
.s7-outils { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.1rem; padding-top: clamp(4px, 1vw, 10px); padding-bottom: 2rem; }
.s7-cherche { position: relative; display: block; max-width: 24rem; }
.s7-cherche svg { position: absolute; left: 2px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); fill: none; stroke: var(--gris); stroke-width: 1.6; stroke-linecap: round; }
.s7-cherche input { width: 100%; padding: .6rem .5rem .6rem 1.9rem; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--encre) 34%, transparent); border-radius: 0; background: transparent;
  font: 400 1rem var(--texte); color: var(--encre); -webkit-appearance: none; appearance: none; transition: border-color var(--k-survol) var(--k-doux), box-shadow var(--k-survol) var(--k-doux); }
.s7-cherche input::placeholder { color: var(--gris); opacity: 1; }
.s7-cherche input:focus { outline: none; border-bottom-color: var(--saison-vive); box-shadow: inset 0 -1px 0 var(--saison-vive); }
.s7-chips { display: flex; flex-wrap: wrap; gap: .5rem; min-width: 0; }
.s7-chip { display: inline-flex; align-items: center; gap: .55rem; min-height: 44px; padding: .38rem .85rem; border: 1px solid color-mix(in srgb, var(--encre) 30%, transparent); border-radius: 0; background: transparent;
  font: 600 .875rem/1.2 var(--texte); color: color-mix(in srgb, var(--encre) 86%, transparent); text-align: left; cursor: pointer; }
.s7-chip i { flex: none; width: .45rem; height: .45rem; border-radius: 50%; background: var(--c, var(--gris)); }
.s7-chip:hover { color: var(--encre); border-color: var(--c, var(--saison-vive)); }
.s7-chip[aria-pressed="true"] { color: var(--encre); border-color: var(--c, var(--saison-vive)); background: color-mix(in srgb, var(--c, var(--saison-vive)) 12%, transparent); box-shadow: inset 0 0 0 1px var(--c, var(--saison-vive)); }
.s7-chip .croix { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.s7-chip--lieu { --c: var(--saison-vive); }
.s7 { padding: clamp(1.5rem, 3vw, 2.5rem) 0 clamp(3.5rem, 7vw, 6rem); }
.s7-tete { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem 1.5rem; padding-bottom: 1.1rem; border-bottom: 1px solid var(--saison-vive); }
.s7-t { margin: 0; font: 500 clamp(2.25rem, 1.4rem + 3.4vw, 4.25rem)/1 var(--titre); letter-spacing: -.012em; }
.s7-k { display: flex; align-items: center; gap: .7rem; margin: 0; font: 600 .8125rem/1.3 var(--etiq); letter-spacing: .16em; text-transform: uppercase; color: var(--saison-texte); }
.s7-gel { flex: none; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle, var(--saison-vive) 0 2.4px, var(--papier) 2.9px 3.9px, var(--saison-vive) 4.4px); }
/* la saison d'un regard : la frise des mois et, à côté, la carte qui s'approche de la ville de la date (la loupe), puis les
   prochaines dates et toutes les dates de la saison sous la frise, la carte épinglée à côté (elle suit la lecture). Au
   téléphone, la frise défile au doigt (aimantée aux mois, posée sur le mois en cours), la loupe en carte sous elle */
.ag7 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); grid-template-areas: "frise carte" "proch carte" "toutes carte"; grid-template-rows: auto auto 1fr;
  gap: 2.75rem clamp(2rem, 4vw, 4rem); align-items: start; margin-top: clamp(1.25rem, 2.5vw, 2rem); }
.fs7 { grid-area: frise; min-width: 0; }
/* le sous-menu de la saison (comme celui des univers d'un spectacle) : une seule ligne, arrimée sous le menu flottant quand on
   descend ; chaque spectacle qui tourne dans la saison (et lui seul), sa vignette (sa photo, cadrée sur sa zone d'intérêt)
   cerclée de sa couleur, celle de ses dates sur la frise, son titre et le nombre de ses dates. En survoler un isole ses dates,
   le choisir filtre la page (le choisir encore la rend) ; arrimé, le nom de la saison paraît à gauche. Le spectacle choisi
   teinte la bande et prend le fond de la saison : sa photo, à peine, sous un voile de sa couleur qui se fond dans la nuit.
   Les saisons passées ont leur rangée, de leurs spectacles, à leur place (elle ne s'arrime pas : leur bande des saisons, si) */
.s7, .p4 { position: relative; isolation: isolate; }
.s7 { --sm7-h: 66px; }
.sm7 { --sm-fond: var(--papier); position: sticky; top: calc(var(--haut) - 8px); z-index: 24; margin: 0 0 clamp(1rem, 2vw, 1.75rem); background: transparent; }
.sm7.est-choisi { --sm-fond: color-mix(in srgb, var(--sc, var(--saison-vive)) 14%, var(--papier)); }
.sm7.colle { background: var(--sm-fond); box-shadow: 0 1px 0 var(--filet), 0 0 0 100vmax var(--sm-fond); clip-path: inset(calc(-1 * var(--haut)) 0 -1px 0); }
.sm7-in { display: flex; align-items: center; gap: 14px; min-height: var(--sm7-h); }
.sm7-nom { flex: none; max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; font: 500 1.06rem/1.2 var(--titre); color: var(--encre);
  transition: max-width var(--k-page) var(--k-doux), opacity var(--k-survol) var(--k-doux); }
.sm7.colle .sm7-nom { max-width: 14rem; opacity: 1; }
/* (la rangée déborde : un fondu au bord où il reste à voir, posé par le défilement (.a-gauche, .a-droite) ; au bureau, deux
   flèches rondes sur ces bords, chacune cachée quand on est au bout ; elle s'aimante à une vignette ; au clavier, les flèches
   gauche et droite, Début et Fin, vont d'un spectacle à l'autre) */
@property --sm7-fg { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --sm7-fd { syntax: '<length>'; inherits: false; initial-value: 0px; }

.rs-defile button { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 1.5px solid var(--u-filet); border-radius: 50%; background: transparent; color: var(--u-texte); cursor: pointer; transition: border-color var(--k-survol) var(--k-doux), background-color var(--k-survol) var(--k-doux), opacity var(--k-survol) var(--k-doux); }
.rs-defile button:hover { border-color: var(--u-texte); background: color-mix(in srgb, var(--u-texte) 8%, transparent); }
.rs-defile button[disabled] { opacity: .3; cursor: default; }
.rs-defile svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rs-bande { gap: 10px; margin: 0 calc(-1 * var(--gout)); padding: 4px var(--gout) 20px; scroll-padding-inline: var(--gout); scrollbar-width: none; scroll-behavior: smooth;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--gout), #000 calc(100% - var(--gout)), transparent); mask-image: linear-gradient(90deg, transparent, #000 var(--gout), #000 calc(100% - var(--gout)), transparent); }
.rs-bande::-webkit-scrollbar { display: none; }
.rs-date { position: relative; min-width: 8.8rem; max-width: 13rem; padding: 12px 16px 14px; border: 1.5px solid var(--u-filet); border-radius: 12px; background: color-mix(in srgb, var(--u-texte) 5%, transparent); color: var(--u-texte); }
.rs-date:hover { border-color: color-mix(in srgb, var(--u-texte) 55%, transparent); }
.rs-date:focus-visible { outline: 2px solid var(--u-vif); outline-offset: 3px; }
.rs-q { display: block; white-space: nowrap; }
.rs-s { display: block; font: 600 .68rem/1.35 var(--u-etiq); letter-spacing: .14em; text-transform: uppercase; color: var(--u-texte2); }
.rs-n { font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: 2.05rem; line-height: 1.08; }
.rs-m { font: 600 .9rem/1 var(--sans); }
.rs-h { display: block; margin-top: 8px; font: 700 1.02rem/1.25 var(--sans); font-variant-numeric: tabular-nums; }
.rs-h--sans { font: 500 .78rem/1.3 var(--sans); color: var(--u-texte2); }
.rs-o { display: block; max-width: 100%; margin-top: 3px; overflow: hidden; font-size: .82rem; line-height: 1.3; color: var(--u-texte2); white-space: nowrap; text-overflow: ellipsis; }
.rs-date[aria-pressed="true"] { background: var(--u-accent); border-color: var(--u-accent); color: var(--u-sur-accent); box-shadow: 0 16px 30px -18px color-mix(in srgb, var(--u-accent) 90%, transparent); }
.rs-date[aria-pressed="true"] :is(.rs-s, .rs-o, .rs-h--sans) { color: inherit; opacity: .85; }
.rs-date[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; border-radius: 0 0 3px 0; background: var(--u-accent); transform: translateX(-50%) rotate(45deg); }
.rs-date.est-allume:not([aria-pressed="true"]) { border-color: var(--u-vif); }
.rs-corps { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(22px, 4vw, 56px); align-items: start; margin-top: 2px; }
/* la carte : l'affiche d'une date, dans l'univers de son spectacle (--rs-bg : son fond, que l'encre reprend) */
.rs-carte { --rs-bg: var(--u-fond2); position: relative; isolation: isolate; overflow: hidden; min-height: 330px; border-radius: 14px; background: var(--rs-bg); color: var(--u-texte); font-family: var(--u-corps); box-shadow: 0 0 0 1px var(--u-filet), 0 34px 64px -40px rgba(0, 0, 0, .7); }
.rs-photo { z-index: -1; inset: 0 0 0 auto; width: 50%; height: 100%; object-fit: cover; opacity: .55; -webkit-mask-image: linear-gradient(90deg, transparent, #000 55%); mask-image: linear-gradient(90deg, transparent, #000 55%); }
.u-clair .rs-photo, .rs-carte.u-clair .rs-photo { opacity: .3; }
/* l'encre qui s'ouvre (effetReserver) : une tache organique aux bords d'encre vive, partie de la ventouse choisie ; elle
   s'étale sur la carte et s'y dissout (transform et opacité seuls) */
.rs-tache { position: absolute; z-index: 0; border-radius: var(--blob, 50%); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--u-vif) 26%, transparent) 64%, color-mix(in srgb, var(--u-vif) 0%, transparent)); box-shadow: inset 0 0 0 3px var(--u-vif); }
.rs-c { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; max-width: 28rem; padding: clamp(24px, 3.2vw, 40px); }
.rs-sp { margin: 0; font-family: var(--u-titre-f); font-weight: var(--u-titre-g); font-size: clamp(1.6rem, 1.15rem + 1.5vw, 2.5rem); line-height: 1.02; color: var(--u-texte); text-wrap: balance; }
.u-arene .rs-sp, .rs-carte.u-arene .rs-sp { text-transform: uppercase; color: var(--u-accent); }
html[data-theme="nuit"] :is(.u-arene .rs-sp, .rs-carte.u-arene .rs-sp) { color: var(--u-vif); }   /* le rouge du titre, dans la nuit de Bérénice : sa couleur vive */
.rs-sp a { color: inherit; text-decoration: none; }
.rs-sp a:hover { color: var(--u-vif); }
.rs-sp::after { content: ""; display: block; width: 72px; height: 2px; margin: 14px 0 12px; border-radius: 2px; background: var(--u-vif); transform-origin: 0 50%; }
.rs-quand { margin: 0; font: 600 clamp(1.1rem, 1rem + .4vw, 1.3rem)/1.3 var(--sans); }

.rs-ou { margin: 4px 0 0; font-size: 1rem; line-height: 1.45; color: var(--u-texte2); }
.rs-lieu { color: var(--u-texte); font-weight: 600; }
.rs-lieu::after { content: " ·"; color: var(--u-texte2); font-weight: 400; }
.rs-det { list-style: none; margin: 8px 0 0; padding: 0; font: 400 .88rem/1.45 var(--sans); color: var(--u-texte2); }

a.rs-seance:hover { border-color: var(--u-vif); background: color-mix(in srgb, var(--u-vif) 12%, transparent); }

.rs-sh { font: 700 1.5rem/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* les saisons (#/saisons, la 07) : la date d'une ligne de l'agenda est un bouton, un cadre droit qui prend l'encre de son

/* ———————————— le défilement raconte (le scrollytelling), dans la langue de la 10 ————————————
   La lecture fait avancer le récit, et rien d'autre : des animations liées au défilement (CSS, composées hors du fil
   principal, scrubbables : on remonte, le récit revient) là où le navigateur les a (@supports), sinon la floraison à
   l'arrivée. L'état de base est toujours l'état final, lisible : sans mouvement (html.still) ou l'animation retirée (le
   vérificateur), tout est posé. Ici les durées sont en hauteur d'écran : « entry » (ce qui entre par le bas), « exit » (ce qui
   sort par le haut), « cover » (toute la traversée) ; ce qu'un script pose au franchissement d'une ligne de lecture (la
   carte, les frises, le panneau de la compagnie) prend les courbes de la 10. Une animation liée au défilement ne garde jamais
   son état final au-delà de sa plage (backwards, jamais both ni forwards, règle 15 C) : l'état de base est déjà l'état final,
   ou ce qui l'a passé est hors de l'écran ; et quand une animation composée garde son état final hors de sa plage, Chrome
   n'arrive plus à capturer la page pour une transition (le changement de page gelait 4 s depuis une page défilée). */
/* 1. l'encre prend à la lecture : affirmations, citations (.lit, --n mots) : chaque mot passe du gris à l'encre quand sa
   phrase traverse le milieu de l'écran, dans l'ordre, au rythme du lecteur ; en remontant, il pâlit */
@property --lit { syntax: '<number>'; inherits: true; initial-value: 1; }   /* (la lecture du bloc, 0 → 1 ; posée à 1 : tout se lit) */
@supports (animation-timeline: view()) {
  /* une seule animation par bloc (pas une par mot : la page d'un spectacle en compte une centaine, elle resterait sous
     son budget de rendu), qui fait avancer --lit ; chaque mot en tire son encre (--e) d'après son rang */
  html:not(.still):not(.sur-place) .lit { animation: lit-lu linear backwards; animation-timeline: view(); animation-range: cover 18% cover 64%; }
  @keyframes lit-lu { from { --lit: 0; } to { --lit: 1; } }
  html:not(.still):not(.sur-place) .lit .w { --e: clamp(0, calc((var(--lit) * (var(--n, 20) + 3) - var(--w, 0)) / 3), 1);
    opacity: calc(.18 + var(--e) * .82); translate: 0 calc((1 - var(--e)) * .08em); }
  /* (la phrase qui s'allume à la lecture ne fleurit pas en plus d'un bloc à son arrivée) */
  html:not(.still):not(.sur-place) .lit.ecrit:not(.vu) { opacity: 1; transform: none; }
  /* 2. l'ouverture d'un spectacle prend de la profondeur : en la quittant, la photo reste en arrière (elle suit déjà la
     lecture, --p), le texte monte plus vite que la page et pâlit, la lueur et le motif s'éteignent */
  html:not(.still) .sp-une { view-timeline: --une block; }
  html:not(.still) .une-texte { animation: une-texte linear backwards; animation-timeline: --une; animation-range: exit 0% exit 100%; }
  html:not(.still) .une-lueur, html:not(.still) .une-motif { animation: une-lueur linear backwards; animation-timeline: --une; animation-range: exit 0% exit 100%; }
  @keyframes une-texte { from { translate: 0 0; opacity: 1; } to { translate: 0 -22%; opacity: .08; } }
  @keyframes une-lueur { from { opacity: 1; } to { opacity: 0; } }
  /* 3. la scène de l'accueil se retire : la pieuvre et ses titres glissent plus lentement que la page et pâlissent, pendant
     que le menu, posé sous elle, monte s'arrimer en haut de l'écran. Ce qui glisse, c'est la pieuvre (sa toile) et ses
     titres, chacun son calque, et non toute la scène ; elle pâlit sous un voile de la couleur de la page (un seul calque),
     et non par son opacité : une scène entière en mouvement ou pâlie se recompose à part, avec la page sous elle, à chaque
     image (au défilement, et au premier geste de l'accueil) */
  html:not(.still) .scene { view-timeline: --scene block; }
  html:not(.still) :is(.sc-toile, .sc-h, .sc-t) { animation: scene-part linear backwards; animation-timeline: --scene; animation-range: exit 0% exit 100%; }
  html:not(.still) .scene::after { content: ""; position: absolute; inset: 0; z-index: 9; background: var(--papier); opacity: 0; pointer-events: none;
    animation: scene-voile linear backwards; animation-timeline: --scene; animation-range: exit 0% exit 100%; }
  @keyframes scene-part { from { translate: 0 0; } to { translate: 0 28svh; } }
  @keyframes scene-voile { from { opacity: 0; } to { opacity: .8; } }
  /* (au téléphone, la scène est une liste plus haute que l'écran : rien n'y glisse, chaque titre se lit jusqu'à quitter
     l'écran, et le voile ne vient qu'à la fin, quand le menu, sous le dernier titre, monte s'arrimer) */
  html:not(.still) .scene.mobile :is(.sc-toile, .sc-h, .sc-t) { animation: none; }
  html:not(.still) .scene.mobile::after { animation-range: exit 55% exit 100%; }

      out.push({ k: x.saison, titre: SA.titre, rows: passees, titres: [...new Set(passees.map(r => r.titre))], lieux: CARTE.saison(x.saison) });
    });
    return out;
  }
  // toutes les dates de la saison en cours, passées comprises, dans l'ordre du temps
  const lignesEnCours = () => sansResidences(lignesSaison(D.saison)).sort(plusAncienne);
  // les spectacles qui ont des dates, à venir ou passées : [{cle, titre, slug}], les spectacles de la compagnie d'abord (et
  // parmi eux, ceux qui sont en tournée)
  function spectaclesAgenda(pub, passe) {
    const m = new Map();
    D.shows.forEach(s => { if (pub.some(d => d.slug === s.slug) || passe.some(p => p.rows.some(r => r.cle === s.slug))) m.set(s.slug, { cle: s.slug, titre: s.titre, slug: s.slug }); });
    passe.forEach(p => p.rows.forEach(r => { if (!m.has(r.cle)) m.set(r.cle, { cle: r.cle, titre: r.titre, slug: null }); }));
    // (règle 23) les spectacles en tournée d'abord, dans leur ordre, puis les autres
    const v = [...m.values()], enTournee = x => !!(x.slug && bySlug[x.slug] && bySlug[x.slug].enTournee);
    return [...v.filter(enTournee), ...v.filter(x => !enTournee(x))];
  }

  const ligneAgenda = (r, pre = '', sansTitre = false) => {

    return `<li data-date-id="${esc(d.id ?? '')}" data-frise-id="${esc(r.fid)}" data-mv-cle="${esc(pre + r.fid)}"${d.l != null ? ` data-l="${d.l}"` : ''}${r.suite ? ' class="suite"' : ''} style="--c:${couleurDe(g.slug)}">${r.suite ? '' : `<time${d.iso ? ` datetime="${d.iso}"` : ''}><b>${esc(p.jour)}</b>${p.heure ? `<small>${esc(p.heure)}</small>` : ''}</time>`}<div class="qui">${titre}${d.scolaire ? `<em class="tag">${esc(L.scolaire)}</em>` : ''}${d.residence ? `<em class="tag">${esc(L.residence)}</em>` : ''}${d.etat ? `<em class="etat">${esc(d.etat)}</em>` : ''}${lieu}${details(d.details)}</div></li>`;
  };

  /* ---------- chantiers 1, 2, 3, 4 : alertes, simulateur, convention, schema.org ---------- */

            },

          },
          ...(d.lien ? { 'offers': { '@type': 'Offer', 'url': d.lien, 'availability': 'https://schema.org/InStock' } } : {})
        };

  }

  // un dépôt du public (une alerte de tournée, une demande de devis) : il ne se dit enregistré que si la base l'a enregistré
  // (DONNEES.deposer rend { error }) ; sinon, la page propose d'écrire directement au contact diffusion des données
  const deposer = (table, ligne) => (typeof DONNEES !== 'undefined' && DONNEES.deposer ? DONNEES.deposer(table, ligne) : Promise.resolve({ error: { message: 'sans la base' } }));
  // un libellé de D.site.libelles à trous ({adresse}, {lien}…), rempli de morceaux déjà échappés
  const remplir = (gabarit, v) => esc(gabarit || '').replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  // un lien mailto: vers le contact diffusion des données, avec l'objet et le texte (son adresse, sans autre texte) ; ''
  // quand les données n'ont pas d'adresse
  const versContact = (texte, objet, corps = '') => {
    const c = contactPrg();
    return c && c.email ? `<a href="${esc(`mailto:${c.email}?subject=${encodeURIComponent(objet)}${corps ? `&body=${encodeURIComponent(corps)}` : ''}`)}">${esc(texte || c.email)}</a>` : '';
  };
  // l'alerte de tournée : elle ne compte qu'une fois confirmée depuis le courriel envoyé à l'adresse (le onzième script
  // SQL, la fonction crescite-courriel) ; la page le dit, et ne promet rien d'autre. Le secteur : la position (« Me
  // géolocaliser » : l'alerte vaut alors dans un rayon autour d'elle) avec sa commune, ou un code postal, ou une commune
  // cherchée par son nom (geo.api.gouv.fr) ; la base en déduit le département
  function initAlerteTournee() {
    const f = $('#f-alerte'); if (!f) return;
    const btnGeo = $('#btn-geo'), cp = $('#alerte-cp'), email = $('#alerte-email'), sp = $('#alerte-spectacle'), msg = $('#alerte-msg');
    let ici = null;      // la position prise, sa commune, son code postal, son département et le texte écrit dans le champ
    const geoTexte = t => { if (btnGeo) btnGeo.querySelector('span').textContent = t; };
    const oublierIci = () => { ici = null; if (btnGeo) { btnGeo.classList.remove('actif'); geoTexte(L.meGeolocaliser || 'Me géolocaliser'); } };
    if (btnGeo) {
      btnGeo.addEventListener('click', () => {
        if (!navigator.geolocation) { alert('La géolocalisation n’est pas disponible sur cet appareil.'); return; }
        btnGeo.classList.add('actif');
        geoTexte('Recherche…');
        navigator.geolocation.getCurrentPosition(async pos => {
          // au kilomètre près (deux décimales) : ni le service des communes ni la base ne reçoivent la position exacte
          const lat = Math.round(pos.coords.latitude * 100) / 100, lon = Math.round(pos.coords.longitude * 100) / 100;
          let c = null;
          try {
            const res = await fetch(`https://geo.api.gouv.fr/communes?lat=${lat}&lon=${lon}&fields=nom,codesPostaux,codeDepartement`);
            const data = res.ok ? await res.json() : [];
            c = data && data[0] || null;
          } catch (e) { /* hors connexion : la position seule */ }
          cp.value = c ? `${c.nom} (${c.codeDepartement})` : 'Ma position';
          ici = { lat, lon, commune: c ? c.nom : null, code_postal: c && c.codesPostaux ? c.codesPostaux[0] || null : null,
                  departement: c ? c.codeDepartement || null : null, texte: cp.value };
          geoTexte('Localisé');
        }, err => {
          oublierIci();
          alert('Impossible de vous localiser : ' + (err.message || 'accès non autorisé'));
        }, { timeout: 10000 });
      });
    }
    // le champ retouché : la position n'est plus celle qu'il dit
    cp.addEventListener('input', () => { if (ici && cp.value !== ici.texte) oublierIci(); });
    // un secteur écrit : un code postal (« 76000 », « 76000 Rouen »), « Rouen (76) », ou le nom d'une commune ; rien de
    // trouvé : null
    async function secteurEcrit(t) {
      const code = (t.match(/(?:^|\D)(\d{5})(?:\D|$)/) || [])[1];
      if (code) return { code_postal: code, commune: t.replace(code, '').replace(/[(),]/g, ' ').replace(/\s+/g, ' ').trim() || null };
      const dep = (t.match(/\(\s*(\d{2,3}|2[AaBb])\s*\)/) || [])[1];
      if (dep) return { commune: t.replace(/\(.*\)/, '').trim() || null, departement: dep.toUpperCase() };
      try {
        const res = await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(t)}&fields=nom,codesPostaux,codeDepartement&boost=population&limit=1`);
        const c = (res.ok ? await res.json() : [])[0];
        if (c) return { code_postal: (c.codesPostaux || [])[0] || null, commune: c.nom, departement: c.codeDepartement || null };
      } catch (e) { /* hors connexion */ }
      return null;
    }
    const dire = (genre, html) => {
      msg.className = `alerte-msg ${genre}`;
      msg.setAttribute('role', genre === 'err' ? 'alert' : 'status');
      msg.innerHTML = html;
      msg.hidden = false;
    };
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const mailVal = email.value.trim(), cpVal = cp.value.trim(), spVal = sp.value;
      if (!mailVal || !cpVal) return;
      const btnSub = $('#btn-inscrire-alerte');
      if (btnSub) btnSub.disabled = true;
      msg.hidden = true;
      const s = spVal && bySlug[spVal] ? bySlug[spVal] : null;
      const secteur = ici ? { code_postal: ici.code_postal, commune: ici.commune, departement: ici.departement } : await secteurEcrit(cpVal);
      if (!secteur) {
        dire('err', esc(L.alerteSecteurInconnu || 'Ce secteur est introuvable : indiquez un code postal (5 chiffres), ou utilisez « Me géolocaliser ».'));
        if (btnSub) btnSub.disabled = false;
        cp.focus();
        return;
      }
      // confirme_le n'existe qu'avec le onzième script (la confirmation par courriel et l'envoi) : sans lui, la base refuse
      // l'alerte et la page ne promet rien. La base la dépose de toute façon en attente (jamais confirmée)
      const { error } = await deposer('crescite_alertes_tournee', {
        email: mailVal,
        ...secteur,
        spectacle_id: s && s.id != null ? s.id : null,
        lat: ici ? ici.lat : null,
        lon: ici ? ici.lon : null,
        confirme_le: null
      });
      if (error && error.code === 'PT429' && error.message) {
        // une limite de la base (cinq alertes par adresse) : son message dit laquelle
        dire('err', esc(error.message));
      } else if (error) {
        // rien n'est enregistré : on le dit, et on propose d'écrire au contact diffusion
        const lien = versContact(null, `${L.alerteTournee} – ${cpVal}`, [cpVal, s && s.titre].filter(Boolean).join(' · '));
        dire('err', `${esc(L.alerteNonEnregistree)}${lien ? ` ${lien}` : ''}`);
      } else {
        dire('ok', `✓ ${remplir(L.alerteInscrite, { adresse: esc(mailVal), secteur: esc(cpVal) })}`);
        f.reset();
        oublierIci();
      }
      if (btnSub) btnSub.disabled = false;
    });
  }

  /* la demande de proposition de cession : le spectacle choisi et ses conditions d'accueil telles que D les donne (format,
     durée, jauge, équipe ; sa fiche technique déposée, sinon sur demande), le lieu et son plateau, puis le formulaire. Rien

  function initSimulateurPro() {

  /* ---------- les spectacles : le sommaire de la 08 ----------

     son année en folio au bout d'un filet de conduite, son sous-titre, son état : « En création », « en tournée »), un lien
     vers sa page. À côté, épinglé, l'aperçu de celui qu'on survole ou qu'on choisit au clavier, dans son univers : sa photo,
     la carte de ses tournées, son lieu et son temps, sa création, son action culturelle, son accroche, sa prochaine date tout
     public (ou son annonce, en création) et le lien vers sa page. L'aperçu se relaie : un fondu, ses lignes arrivent l'une
     après l'autre (MOUVEMENT.cascade) et, la première fois qu'il paraît, les bras de sa carte poussent depuis Rouen. Au
     téléphone (jusqu'à 899 px), la pile d'affiches (afficheTdm, lierPile) : les huit tranches dans l'écran, l'affiche dépliée
     d'une touche, avec sa fiche et la carte de sa tournée ; une touche de plus, n'importe où sur elle, ouvre sa page. Relu dans
     D à chaque rendu ; le spectacle de l'aperçu, comme
     l'affiche dépliée, sont gardés d'une visite à l'autre (et quand D change, la vue se refait sur eux). */

    const lerp = (a, b, t) => a + (b - a) * t, lisse = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const c = CREATURE.creer({ encre: getComputedStyle($('.tr6-coeur', tr) || tr).color, placerChaqueImage: true, vie: 2.4, onde: 4.5, rythme: 1.7, lueur: true, sillage: true,

        // d'autre de son milieu, autant qu'il y a de place (elle fait 54 ou 90 px de large). Quelqu'un est choisi : elle se
        // poste à la hauteur de ses places visibles
        const yTete = r.top + g.yc, yFin = r.top + g.yN, demi = (mobile ? 54 : 90) / 2, ampX = Math.max(0, g.xg - demi - 4), ampY = mobile ? 54 : 80;
        const visibles = troupeTenues.filter(p => p.isConnected).map(p => p.getBoundingClientRect()).filter(b => b.bottom > 8 && b.top < innerHeight - 8);
        let base = clamp(innerHeight * .42, yTete, yFin), tient = false;
        if (visibles.length) { base = clamp(visibles.reduce((a, b) => a + b.top + b.height / 2, 0) / visibles.length, yTete, yFin); tient = true; }
        // là où elle va : un point choisi à sa portée, gardé 1,2 à 3,4 s, puis un autre (en tenant quelqu'un, elle reste
        // posée, et se balance à peine)
        if (!but || t > tBut) {

          const xMax = zone && Math.random() < .55 ? zone.x1 - demi - g.xg : ampX;

        // puis bondit vers sa cible, étirée dans le sens du bond, d'autant plus loin qu'elle en est loin ; près du but, les
        // impulsions se font petites : elle flotte

  // ce qui suit la lecture : l'ouverture (--p : le motif tourne, la photo s'éloigne d'un rien) ; le récit (la photo du moment,

    une(sec) {

      const h = sec.__h || (sec.__h = sec.offsetHeight), v = clamp(scrollY / Math.max(1, h * .85), 0, 1).toFixed(3);
      if (sec.__p === v) return null;

      const phs = sec.__phs || (sec.__phs = $$('.rc-ph', sec)), fil = sec.__fil || (sec.__fil = $$('.rc-fil i', sec));
      let j = -1, x = 0;

        const v = vis.getBoundingClientRect(), p = clamp((v.top - r.top) / Math.max(1, r.height - v.height), 0, 1);
        x = p * phs.length; j = Math.min(phs.length - 1, Math.floor(x));

  /* ---------- la page d'un spectacle : un univers, trois entrées ---------- */
  // un chapitre : il entre au sommaire (dans l'ordre de la page) ; cls : une classe de plus
  const chapitre = (chap, id, nom, html, cls = '') => { chap.push({ id, nom }); return `<section class="chap${cls ? ' ' + cls : ''}" id="c-${id}" data-chap="${esc(nom)}">${html}</section>`; };
  const titreChap = (t, attrs = '') => `<h2 class="chap-t" tabindex="-1" data-mv="monte"${attrs}>${t}</h2>`;
  // l'ouverture : celle de la 07 pour un spectacle en tournée (entree), celle de la 10 pour la page seule d'un spectacle qui
  // ne l'est plus ; la photo principale plein cadre ; le titre fleurit ligne à ligne sous l'encre qui s'ouvre, l'accroche à sa
  // suite (la 10)
  function ouverture(s, entree, pub) {
    const m = mo(s), tl = s.titreLignes && s.titreLignes.length ? s.titreLignes : null, lignes = tl || [s.titre];
    const credit = s.creditPhotos || s.credit, foc = Number.isFinite(+s.focale) ? +s.focale : 50, n = lignes.join('').replace(/\s/g, '').length;
    const titre = `<h1 class="u-titre${n > 22 ? ' long' : ''}" tabindex="-1">${lignes.map((l, k) => `<span class="ligne" style="--k:${k}"${tl ? edS(s, 'titreLignes', k) : edS(s, 'titre')}>${esc(l)}</span>`).join(' ')}</h1>`;
    const st = s.sousTitre ? `<p class="une-st"${edS(s, 'sousTitre')}>${s.sousTitre}</p>` : '';
    const acc = s.accroche ? `<p class="une-acc"${edS(s, 'accroche')}>${esc(s.accroche)}</p>` : '';
    let texte;
    if (!entree) {
      // la 10 : le fil d'Ariane, la compagnie qui signe, le titre et son filet, la création et le lieu et le temps
      const sp = menuDe('spectacles') || { href: '#/spectacles', texte: L.spectacles };
      texte = `<p class="une-ariane"><a href="#/">${esc(S.accueil)}</a> / <a href="${esc(sp.href)}">${esc(sp.texte)}</a></p><p class="une-nom"${ed('site.nom')}>${esc(S.nom)}</p>${titre}${st}
        <p class="une-meta"><span${edS(s, 'creation')}>${esc(s.creation)}</span>${s.lieuTemps ? `<span${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</span>` : ''}</p>${acc}`;
    } else {
      // la 07 : la création, le lieu et le temps, le titre, « en tournée » qui respire, l'accroche ; dans « voir », la
      // prochaine date et l'invitation à réserver (elle mène à la bande des dates, règle 17) ; la bande-annonce se lit plus bas
      const res = entree === 'voir' && !s.statut && RS ? RS.dates(s.slug) : [], prochaine = entree === 'voir' && !s.statut ? res[0] || pub[0] : null;
      const cta = entree === 'voir' ? `${res.length ? `<button type="button" class="bu plein" data-va="rs-zone">${esc(L.reserver)}${BAS}</button>` : `<button type="button" class="bu plein" data-va="c-dates">${esc(!s.statut && !pub.length ? L.lieuxDiffusion : L.dates)}${BAS}</button>`}${lienVideo(s)}`
        : entree === 'programmer' ? `<a class="bu plein" href="${S.ecrire.href}">${esc(L.ecrire)}${FLECHE}</a>${lienVideo(s)}`
        : `${s.dossier ? `<button type="button" class="bu plein" data-va="c-dossier">${esc(L.dossierScolaire)}${BAS}</button>` : ''}<a class="bu${s.dossier ? '' : ' plein'}" href="${S.ecrire.href}">${esc(L.ecrire)}${FLECHE}</a>`;
      const etat = s.statut ? `<p class="une-statut"${edS(s, 'statut')}>${esc(s.statut)}</p>` : s.enTournee ? `<p class="une-statut">${esc(L.enTournee)}</p>` : '';
      texte = `<p class="une-sur"><span${edS(s, 'creation')}>${esc(s.creation)}</span>${s.lieuTemps ? `<span${edS(s, 'lieuTemps')}>${esc(s.lieuTemps)}</span>` : ''}</p>${titre}${etat}${st}${acc}

    }

  // les trois entrées du spectacle (la 07), son sous-menu : une ventouse à la couleur de chacune, la courante pleine ; le texte entier quand la
  // place le permet, sinon le court
  const onglets = (s, entree) => `<nav class="u-onglets" aria-label="${esc(s.titre)}"><div class="wrap u-onglets-in">
      <span class="ut" aria-hidden="true">${esc(s.titre)}</span>
      ${S.entrees.filter(e => e.cle !== 'etablissement' || s.actionCulturelle).map(e => `<a href="#/spectacle/${s.slug}/${e.cle}" style="--e:${e.couleurVive || e.couleur}"${e.cle === entree ? ' aria-current="page"' : ''}><span class="pt" aria-hidden="true"></span><span class="long">${esc(e.texte)}</span><span class="court">${esc(e.court)}</span></a>`).join('')}

  const sommaireSp = (s, entree, chap) => `<nav class="sp-som${entree ? '' : ' sp-som--seul'}" aria-label="${esc(entree ? `${s.titre} – ${E[entree].court}` : s.titre)}"><ol>${chap.map((c, i) => `<li style="--i:${i}"><button type="button" data-c="${c.id}">${esc(c.nom)}</button></li>`).join('')}</ol>${entree ? `<span class="sp-som-signe" aria-hidden="true">${motifG(mo(s))}</span>` : ''}</nav>`;

  /* la distribution en portraits : les comédiens (categorie « jeu ») de show.equipe, avec leur fiche D.personnes ; relus à chaque rendu */
  const nomDe = p => `${p.prenom} ${p.nom}`;
  const initiales = p => [p.prenom, p.nom].map(x => [...String(x || '').trim()][0] || '').join('');
  const comediens = s => { const vus = new Map(); (s.equipe || []).forEach(e => { const p = (D.personnes || {})[e.personne]; if (e.categorie !== 'jeu' || !p) return; if (vus.has(e.personne)) vus.get(e.personne).lignes.push(e); else vus.set(e.personne, { e, p, lignes: [e] }); }); return [...vus.values()]; };   // un portrait par personne, même avec deux lignes de jeu

  };
  function portraits(s) {
    const L = comediens(s); if (!L.length) return '';
    const credits = L.some(x => x.p.photo && x.p.credit), pris = new Set(), blocs = [];

  function distribution(s, chap, entree, sansDuree = false) {
    const P = s.programmer || {}, eq = P.equipeCreation || [], fiche = eq.length ? [] : (s.fiche || []).map((f, i) => ({ f, i }));

      ${tete.map(({ f, i }) => `<p class="u-d-tete"${edS(s, 'fiche', i, 'valeur')}>${f.valeur}</p>`).join('')}

  const carteTournee = (s, lieux, passe) => lieux.length || passe.length ? carte({ lieux, passe, titre: s.titre }) : carte({ titre: s.titre, classe: 'attente', interactif: false });

  // le texte du spectacle, paragraphe par paragraphe (le premier, court, en chapeau) ; ses citations (un vers par ligne, ou une
  // réplique en prose)
  const texteSp = s => (s.texte || []).map((p, k) => k === 0 && p.length < 340 && !/^\s*</.test(p) ? `<p class="chapo"${edS(s, 'texte', k)}>${p}</p>` : bloc(p, `shows.${s.slug}.texte.${k}`));
  // (scrollytelling) la citation s'allume à la lecture, mot à mot (.lit, --n mots : chaque mot porte son rang --w)
  const citationSp = (s, c, ic) => { let k = 0; const n = (c.vers || []).reduce((a, v) => a + mots(v).length, 0);

  // les photos du récit : la principale d'abord, puis les autres de la scène, dans l'ordre de D (pas celles d'un atelier ni
  // d'un établissement ; la principale, quand la liste la reprend, n'y revient pas)
  function photosRecit(s) {
    const p0 = D.photos[s.slug], out = p0 ? [{ src: p0, attr: edP(s, 'photo'), credit: s.creditPhotos || s.credit, kc: s.creditPhotos ? 'creditPhotos' : 'credit' }] : [];
    (s.photos || []).forEach((p, i) => {
      const src = D.photos[p.cle]; if (!src || p.etablissement || p.atelier || src === p0 || p.id === 'principale') return;

    return out;
  }
  // le récit (voir) : la présentation, pas à pas (le cadre et la première affirmation, chaque paragraphe du texte, les autres
  // affirmations, les citations), à côté des photos qui se relaient, épinglées ; le texte reste du texte (il se lit, se
  // sélectionne, se parcourt au clavier) ; moins d'animations : rien n'est épinglé, il se lit d'un trait
  function recit(s, chap) {

    const legende = x => (x.p && x.p.legende) || x.credit ? `<figcaption>${x.p && x.p.legende ? `<span${edS(s, 'photos', x.i, 'legende')}>${esc(x.p.legende)}</span>` : ''}${x.credit ? `<small${edS(s, x.kc)}>${esc(x.credit)}</small>` : ''}</figcaption>` : '';
    return chapitre(chap, 'spectacle', L.leSpectacle, `${titreChap(esc(L.leSpectacle))}
      <div class="rc${phs.length ? '' : ' rc--seul'}" data-scrolly data-fx="recit">
        <div class="rc-pas">${pas.map((h, i) => `<div class="rc-p${i ? '' : ' on'}"><div class="rc-in apparait">${h}</div></div>`).join('')}</div>
        ${phs.length ? `<div class="rc-vis"><div class="rc-photos">${phs.map((x, j) => `<figure class="rc-ph${j ? '' : ' on'}"${x.attr}><img src="${x.src}" alt=""${j ? ' loading="lazy"' : ''} decoding="async">${legende(x)}</figure>`).join('')}</div>

  function photosSp(s, chap) {

      ${credits.map(k => `<p class="u-credit"${edS(s, k)}>${esc(s[k])}</p>`).join('')}</div>`);
  }
  // la présentation d'un spectacle qui n'est plus en tournée (la 10) : l'ouverture (le cadre, les affirmations), le spectacle
  // (son texte, ses citations), les photos, la vidéo
  function presentationSeule(s, chap) {

      ${affs.map((a, k) => `<p class="sp-affirm lit${k ? '' : ' ecrit'}" style="--n:${mots(a.texte).length}"${edS(s, 'affirmations', k, 'texte')}>${ecrit(a.texte)}</p>`).join('')}</div>`);

  }
  // les dates d'un spectacle (la 10) : la frise de toute sa tournée, puis réserver (règle 17) : ses prochaines dates en une bande
  // de boutons (l'horaire écrit sur chacun), la carte de la date choisie dessous, à côté de la carte de ses tournées ; une date
  // tout public qui ne se réserve pas (annulée) reste dessous, dans sa ligne ; puis toutes les dates de la saison. En création :
  // l'annonce de sa tournée ; sans date à venir : ses lieux de diffusion, la carte de ses tournées passées
  function datesSp(s, chap, pub) {
    const sl = s.slug, sp = CARTE.spectacle(sl), res = RS && !s.statut ? RS.dates(sl) : [], P = s.programmer || {};
    const av = sp.aVenir.map(x => ({ ...x, dates: x.dates.filter(d => !d.scolaire) })).filter(x => x.dates.length), vus = new Set(av.map(x => x.l));
    const titre = s.tournee && s.tournee.titre ? titreChap(esc(s.tournee.titre), edS(s, 'tournee', 'titre')) : titreChap(esc(L.actuellementEnTournee));

  // « voir » : le récit, les photos, la vidéo, les dates, la distribution

  /* ---------- la page d'un spectacle qui n'est plus en tournée (règle 21) : une seule page, sans onglets ----------

  // l'historique d'un spectacle (règle 23, demande de la compagnie) : ses dates passées et ses semaines de résidence, saison

  function historiqueSp(s) {
    const G = datesPassees(s); if (!G.length || !L.historique) return '';

  function listeHistorique(G, slug, compte = false) {

  const pile = [];

  function habiterCreature() {
