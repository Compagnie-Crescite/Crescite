<title>La Générale Crescite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prise en main de l’espace de l’équipe Crescite : onze gestes à faire sur un téléphone de démonstration.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : la consigne à gauche, le téléphone de démonstration à droite ; une barre fine en tête (l'avancement).
   Couleurs et polices de l'espace de l'équipe. */
:root {
  --papier: #f6f2eb; --surface: #fffdf9; --surface-2: #efe8dd; --surface-3: #e3d9cb;
  --encre: #1d1418; --gris: #5f565a; --filet: #ded4c6;
  --magenta: #a3306b; --magenta-fonce: #87245a; --magenta-doux: #f5e4ec; --sur-magenta: #fff;
  --ok: #1d6f47; --ok-doux: #e3f3ea; --alerte: #a4231b; --alerte-doux: #fbe7e5; --option: #7a5a10; --option-doux: #f8efd9;
  --chassis: #1d1418; --sur-u: #fff;
  --u-cyrano: #44464d; --u-cleophene: #b9533f; --u-berenice: #6b3fa0; --u-macbeth: #8e1b1b;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #141016; --surface: #1f1921; --surface-2: #2a222d; --surface-3: #3a3040;
    --encre: #f4eef2; --gris: #b9aeb6; --filet: #3a3140;
    --magenta: #f08cc0; --magenta-fonce: #f7aed3; --magenta-doux: #3a1f30; --sur-magenta: #1a1014;
    --ok: #74d6a6; --ok-doux: #19352a; --alerte: #ff8f86; --alerte-doux: #3d1f1d; --option: #f0c66b; --option-doux: #3a2f17;
    --chassis: #000; --sur-u: #fff;
    --u-cyrano: #5b5e68; --u-cleophene: #b9533f; --u-berenice: #7a4cb3; --u-macbeth: #a12a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #141016; --surface: #1f1921; --surface-2: #2a222d; --surface-3: #3a3040;
  --encre: #f4eef2; --gris: #b9aeb6; --filet: #3a3140;
  --magenta: #f08cc0; --magenta-fonce: #f7aed3; --magenta-doux: #3a1f30; --sur-magenta: #1a1014;
  --ok: #74d6a6; --ok-doux: #19352a; --alerte: #ff8f86; --alerte-doux: #3d1f1d; --option: #f0c66b; --option-doux: #3a2f17;
  --chassis: #000; --sur-u: #fff;
  --u-cyrano: #5b5e68; --u-cleophene: #b9533f; --u-berenice: #7a4cb3; --u-macbeth: #a12a2a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--papier); color: var(--encre); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--magenta); }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; border-radius: 6px; }
main:focus, main:focus-visible { outline: none; }
.ecran-lecteur { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.pieuvre { display: inline-block; width: 1.84em; height: 1em; fill: currentColor; vertical-align: -.12em; }
.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ------------------------------------------------------------------ la barre */
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--filet);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.barre-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px 24px; padding-block: 12px; }
.marque { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--encre); margin-right: auto; }
.marque svg.pieuvre { color: var(--magenta); font-size: 1.4rem; }
.marque b { font: 600 1.15rem/1 var(--serif); }
.marque small { font: 600 .7rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.avance { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--gris); font-variant-numeric: tabular-nums; }
.avance .rail { width: 120px; height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.avance .rail span { display: block; height: 100%; background: var(--magenta); transition: width .5s ease; }
.lien-plan { font-weight: 600; text-decoration: none; font-size: .92rem; }
@media (max-width: 560px) { .avance .rail { width: 64px; } .marque small { display: none; } }

/* ------------------------------------------------------------------ commun */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; }
.page { max-width: 1100px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; }
.surtitre { font: 600 .74rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); margin: 0 0 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--filet); background: var(--surface); color: var(--encre);
  border-radius: 10px; padding: 11px 18px; font-weight: 600; text-decoration: none; transition: background .2s; }
.btn:hover { background: var(--surface-2); }
.btn.principal { background: var(--magenta); border-color: var(--magenta); color: var(--sur-magenta); }
.btn.principal:hover { background: var(--magenta-fonce); border-color: var(--magenta-fonce); }
.lien-btn { background: none; border: 0; padding: 4px 0; color: var(--magenta); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.exemple { font: 600 .6rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--option); background: var(--option-doux); padding: 3px 5px; border-radius: 4px; vertical-align: .15em; }
.copie { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .92rem; }
.copie code { font: 500 .9rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); padding: 4px 8px; border-radius: 6px; user-select: all; }
.copie button { font-size: .82rem; border: 1px solid var(--filet); background: var(--surface); border-radius: 8px; padding: 4px 9px; }

/* ------------------------------------------------------------------ l'accueil */
.accueil { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 56px; align-items: center; }
.accueil h1 { font: 600 clamp(2rem, 4.4vw, 3.1rem)/1.08 var(--serif); margin: 0 0 16px; }
.accueil .chapeau { font-size: 1.1rem; max-width: 32em; margin: 0 0 24px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.accueil .note { color: var(--gris); font-size: .9rem; margin: 14px 0 0; }
.plateau-accueil { display: grid; justify-items: center; }
.legende { font-size: .8rem; color: var(--gris); text-align: center; margin: 10px auto 0; max-width: 24em; }
.atouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin: 56px 0 0; padding-top: 24px; border-top: 1px solid var(--filet); }
.atouts h3 { font: 600 1.05rem/1.25 var(--sans); margin: 0 0 4px; }
.atouts p { margin: 0; color: var(--gris); font-size: .95rem; }
@media (max-width: 900px) { .accueil { grid-template-columns: minmax(0, 1fr); gap: 32px; } .atouts { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

/* ------------------------------------------------------------------ le plan */
.plan { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 48px; align-items: start; }
.plan h1, .profil h1, .fin h1 { font: 600 clamp(1.8rem, 3.6vw, 2.4rem)/1.1 var(--serif); margin: 0 0 8px; }
.plan .aide { color: var(--gris); margin: 0 0 28px; }
.groupe { margin: 0 0 28px; }
.groupe h2 { font: 600 .74rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); margin: 0 0 6px; }
.etapes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--filet); }
.etapes a { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--filet); text-decoration: none; color: var(--encre); }
.etapes a:hover { background: var(--surface); }
.etapes .num { font: 500 .9rem/1 var(--sans); color: var(--gris); font-variant-numeric: tabular-nums; }
.etapes .t { font-weight: 600; display: block; }
.etapes .s { font-size: .88rem; color: var(--gris); }
.etapes .etat { font-size: .82rem; color: var(--gris); display: flex; align-items: center; gap: 4px; }
.etapes .fait .etat { color: var(--ok); }
.etapes .suivante .num { color: var(--magenta); font-weight: 700; }
.cote { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 16px; }
.encart { padding: 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--filet); }
.encart p { margin: 0 0 12px; }
.encart p:last-child { margin: 0; }
.encart .chiffre { font: 600 1.6rem/1 var(--serif); margin: 0 0 4px; }
@media (max-width: 900px) { .plan { grid-template-columns: minmax(0, 1fr); } .cote { position: static; } }

/* ------------------------------------------------------------------ le profil */
.profil { max-width: 640px; margin: 0 auto; }
.profil fieldset { border: 0; padding: 0; margin: 0 0 24px; }
.profil legend { font-weight: 600; margin: 0 0 10px; padding: 0; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.options button { text-align: left; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--surface); display: grid; gap: 2px; }
.options button:hover { border-color: var(--gris); }
.options button[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-doux); }
.options b { font-weight: 600; }
.options small { color: var(--gris); font-size: .88rem; }
@media (max-width: 480px) { .options { grid-template-columns: minmax(0, 1fr); } }

/* ------------------------------------------------------------------ une étape */
.scene-vue { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); grid-template-areas: "tete plateau" "defi plateau" "detail plateau"; gap: 0 56px; align-items: start; }
.sv-tete { grid-area: tete; }
.sv-defi { grid-area: defi; }
.sv-detail { grid-area: detail; }
.sv-plateau { grid-area: plateau; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; justify-items: center; gap: 10px; }
.retour { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; font-weight: 500; margin: 0 0 16px; }
.sv-tete h1 { font: 600 clamp(1.8rem, 3.8vw, 2.5rem)/1.1 var(--serif); margin: 0 0 10px; }
.essentiel { font-size: 1.08rem; margin: 0 0 22px; max-width: 34em; }
.defi { padding: 18px 20px; border-radius: 12px; background: var(--surface); border: 1px solid var(--filet); margin: 0 0 14px; }
.defi h2 { margin: 0 0 6px; font: 600 .74rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.defi .consigne { font-weight: 600; font-size: 1.05rem; margin: 0 0 12px; }
.coches { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.coches li { display: flex; gap: 10px; align-items: center; color: var(--gris); font-size: .95rem; }
.coches li .case { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1.5px solid var(--surface-3); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.coches li .case svg { width: 11px; height: 11px; stroke: var(--sur-magenta); stroke-width: 3; fill: none; opacity: 0; transition: opacity .2s; }
.coches li.fait { color: var(--encre); }
.coches li.fait .case { background: var(--ok); border-color: var(--ok); }
.coches li.fait .case svg { opacity: 1; }
.question { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--filet); }
.question p { margin: 0 0 10px; font-weight: 600; }
.reponses { display: flex; flex-wrap: wrap; gap: 8px; }
.reponses button { border: 1.5px solid var(--filet); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.reponses button:hover { border-color: var(--gris); }
.reponses button.juste { background: var(--ok-doux); border-color: var(--ok); color: var(--ok); }
.reponses button.non { background: var(--alerte-doux); border-color: var(--alerte); color: var(--alerte); }
.etapes-chips { display: grid; gap: 8px; margin-top: 12px; }
.etapes-chips button { text-align: left; border: 1.5px solid var(--filet); background: var(--surface); border-radius: 8px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; }
.etapes-chips button .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 .78rem/1 var(--sans); flex: none; }
.etapes-chips button.fait { border-color: var(--ok); color: var(--ok); }
.etapes-chips button.fait .n { background: var(--ok); color: var(--surface); }
.segment { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); gap: 3px; margin-top: 4px; }
.segment button { border: 0; background: transparent; border-radius: 8px; padding: 7px 14px; font-weight: 600; color: var(--gris); }
.segment button[aria-pressed="true"] { background: var(--surface); color: var(--encre); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.termine { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--filet); }
.termine .ok { display: flex; gap: 6px; align-items: center; color: var(--ok); font-weight: 600; }
.aides { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin: 0 0 14px; }
.indice { margin: 0 0 18px; padding: 12px 14px; border-left: 3px solid var(--option); background: var(--option-doux); border-radius: 0 8px 8px 0; font-size: .95rem; }
.sv-detail p { margin: 0 0 10px; max-width: 38em; color: var(--gris); }
.sv-detail details { margin-top: 6px; }
.sv-detail summary { cursor: pointer; font-weight: 600; color: var(--magenta); padding: 4px 0; }
.pasapas { margin: 6px 0 14px; padding-left: 1.3em; display: grid; gap: 4px; max-width: 38em; }
.navig { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .scene-vue { grid-template-columns: minmax(0, 1fr); grid-template-areas: "tete" "defi" "plateau" "detail"; }
  .sv-plateau { position: static; margin: 0 0 24px; }
}

/* ------------------------------------------------------------------ la fin */
.fin { max-width: 640px; margin: 0 auto; }
.fin .chapeau { font-size: 1.08rem; margin: 0 0 24px; }
.fin .encart { margin: 0 0 16px; }

/* ------------------------------------------------------------------ le téléphone (l'espace de l'équipe, en petit) */
.tel { width: 320px; max-width: 100%; height: 620px; border-radius: 44px; background: var(--chassis); padding: 11px; box-shadow: 0 30px 60px -20px rgba(29, 20, 24, .5), inset 0 0 0 2px #3b2c33; position: relative; }
.tel::before { content: ""; position: absolute; top: 19px; left: 50%; width: 92px; height: 24px; margin-left: -46px; border-radius: 20px; background: #000; z-index: 5; }
.ecran { position: relative; height: 100%; border-radius: 34px; overflow: hidden; background: var(--papier); isolation: isolate; }
.app { --u: var(--magenta); position: absolute; inset: 0; display: flex; flex-direction: column; font-size: 13px; line-height: 1.4; color: var(--encre); background: var(--papier); user-select: none; -webkit-user-select: none; }
.app input, .app textarea { user-select: text; -webkit-user-select: text; }
.app-statut { display: flex; justify-content: space-between; padding: 14px 26px 0; height: 40px; font: 600 12px/1 var(--sans); font-variant-numeric: tabular-nums; flex: none; }
.app-statut .barres { letter-spacing: 1px; font-size: 9px; }
.app-haut { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 8px; flex: none; border-bottom: 1px solid var(--filet); }
.app-marque { display: flex; gap: 6px; align-items: center; }
.app-marque svg.pieuvre { color: var(--u); font-size: 17px; transition: color .5s; }
.app-marque b { font: 600 15px/1 var(--serif); }
.app-marque small { font: 700 8px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--u); transition: color .5s; }
.app-cloche { position: relative; border: 0; background: transparent; padding: 4px; color: var(--encre); display: grid; }
.app-cloche .badge { position: absolute; top: -2px; right: -4px; min-width: 16px; height: 16px; border-radius: 9px; background: var(--magenta); color: var(--sur-magenta); font: 700 9px/16px var(--sans); text-align: center; padding: 0 4px; }
.app-zone { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 16px; position: relative; overscroll-behavior: contain; }
.app-onglets { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--filet); background: var(--surface); padding: 6px 4px 18px; }
.app-onglets span { display: grid; justify-items: center; gap: 2px; font-size: 9.5px; color: var(--gris); font-weight: 500; position: relative; }
.app-onglets span .ic { width: 20px; height: 20px; }
.app-onglets span.actif { color: var(--u); font-weight: 700; }
.app-onglets span.actif::before { content: ""; position: absolute; top: -7px; width: 24px; height: 3px; border-radius: 3px; background: var(--u); }
.app-onglets span.vise { animation: vise 1.2s ease-in-out infinite; }
@keyframes vise { 50% { color: var(--magenta); transform: translateY(-2px); } }
.a-h { font: 600 18px/1.15 var(--serif); margin: 2px 0 10px; }
.a-sous { font: 700 9px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--gris); margin: 14px 0 8px; }
.a-btn { display: flex; width: 100%; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--filet); background: var(--surface); border-radius: 12px; padding: 10px; font-weight: 600; font-size: 13px; }
.a-btn.principal { background: var(--magenta); color: var(--sur-magenta); border-color: var(--magenta); }
.a-btn.petit { width: auto; padding: 6px 10px; font-size: 12px; border-radius: 9px; }
.a-lien { border: 0; background: none; color: var(--magenta); text-decoration: underline; font-size: 12px; padding: 4px 0; }
.a-msg { font-size: 12px; padding: 8px 10px; border-radius: 10px; margin: 0 0 10px; }
.a-msg.info { background: var(--magenta-doux); }
.a-msg.erreur { background: var(--alerte-doux); color: var(--alerte); }
.a-toast { position: absolute; left: 12px; right: 12px; bottom: 72px; z-index: 8; background: var(--encre); color: var(--papier); padding: 10px 12px; border-radius: 12px; font-size: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, .3); animation: monte .3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes monte { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pose { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.pose { animation: pose .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes glisseg { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glissed { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* la porte */
.porte { padding: 22px 20px; flex: 1; overflow-y: auto; }
.porte .pm { display: flex; gap: 6px; align-items: center; margin: 4px 0 16px; }
.porte .pm svg.pieuvre { color: var(--magenta); font-size: 22px; }
.porte .pm b { font: 600 17px/1 var(--serif); }
.porte .pm small { font: 700 8px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
.porte h3 { font: 600 21px/1.12 var(--serif); margin: 0 0 6px; }
.porte .intro { color: var(--gris); margin: 0 0 14px; font-size: 12.5px; }
.porte label { display: block; font-weight: 600; font-size: 12px; margin: 8px 0 4px; }
.porte input { width: 100%; border: 1px solid var(--filet); background: var(--surface); border-radius: 10px; padding: 9px 10px; font-size: 13px; }
.porte input.faux { border-color: var(--alerte); }
.porte .ou { text-align: center; color: var(--gris); font-size: 11px; margin: 10px 0; }
.porte .a-btn.principal { margin-top: 12px; }
.secoue { animation: secoue .4s cubic-bezier(.36, .07, .19, .97); }
@keyframes secoue { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.mail { position: absolute; top: 44px; left: 10px; right: 10px; z-index: 9; text-align: left; border: 0; border-radius: 18px; padding: 10px 12px; background: var(--surface); box-shadow: 0 12px 30px rgba(0, 0, 0, .28); display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; animation: descend .5s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes descend { from { transform: translateY(-120%); } to { transform: none; } }

            <label for="ret-txt" class="ecran-lecteur">Message</label><textarea id="ret-txt" maxlength="280">Bouchons à la sortie de Rouen, arrivée vers 9 h 20.</textarea><div class="cpt" data-cpt></div>
            <button type="button" class="a-btn principal" data-env style="margin-top:6px">Envoyer l’alerte</button>`);
          const tx = $('#ret-txt', g), cpt = () => { $('[data-cpt]', g).textContent = `${tx.value.length} / 280`; };
          tx.addEventListener('input', cpt); cpt();
          $('[data-env]', g).addEventListener('click', () => {
            if (!tx.value.trim()) { toast(t, 'Saisissez un message.'); return; }
            fermerFeuille(t); toast(t, `${ic('check')} Alerte envoyée à l’équipe de la date.`); a.coche(2); setTimeout(() => a.gagne(), 900);
          });
        }));
      };
      $$('[data-b]', t).forEach(b => {
        b.style.touchAction = 'none';
        appuiLong(b, () => ouvrir(+b.dataset.b));
        b.addEventListener('click', () => { if (b.dataset.court) { delete b.dataset.court; toast(t, 'Maintenez l’appui plus longtemps.'); } });
        b.addEventListener('keydown', e => { if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); ouvrir(+b.dataset.b); } });
      });
    },

    balayage(t, a) {
      let i = 0, arrive = false;
      t.innerHTML = appli('saison', '', { u: `var(--u-${DATES[0].u})` });
      const zone = $('[data-zone]', t); zone.style.touchAction = 'pan-y';
      const peindre = sens => {
        const d = DATES[i];
        $('.app', t).style.setProperty('--u', `var(--u-${d.u})`);
        zone.innerHTML = `<div class="pose" style="animation-name:${sens ? 'glisse' + sens : 'pose'}">${pageDate(d)}</div>
          <div class="nav-dates"><button type="button" class="a-btn petit" data-prec ${i === 0 ? 'disabled' : ''}>${ic('fleche-g')}Date précédente</button><button type="button" class="a-btn petit" data-suiv ${i === DATES.length - 1 ? 'disabled' : ''}>Date suivante${ic('fleche-d')}</button></div>
          <p style="text-align:center;font-size:10.5px;color:var(--gris);margin:10px 0 0">${i + 1} / ${DATES.length} · balaie de côté</p>`;
        $('[data-prec]', zone).addEventListener('click', prec); $('[data-suiv]', zone).addEventListener('click', suiv);
        if (!arrive && d.u === 'cleophene') {
          arrive = true; a.coche(0);
          a.question({ q: 'À quelle heure est la séance du soir à Pont-Audemer ?', choix: ['18 h', '20 h', '20 h 30'], bonne: 1, ok: () => { a.coche(1); a.gagne(); }, non: 'Voir les séances de Cléophène.' });
        }
      };
      const suiv = () => { if (i < DATES.length - 1) { i++; peindre('g'); } };
      const prec = () => { if (i > 0) { i--; peindre('d'); } };
      balayer(zone, suiv, prec);
      t.tabIndex = 0; t.setAttribute('aria-label', 'Téléphone : flèches gauche et droite pour changer de date');
      t.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); suiv(); } if (e.key === 'ArrowLeft') { e.preventDefault(); prec(); } });
      peindre();
    },

    frais(t, a) {
      let total = 23.6;
      const eur = v => v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
      t.innerHTML = appli('moi', `<div class="fiche-moi"><i>${ic('moi')}</i><div><b>Ma fiche</b><br><small style="color:var(--gris)">Fiche, agenda (.ics), réglages</small></div></div>
        <p class="a-sous">Notes de frais <span class="exemple">exemple</span></p>
        <div class="total" data-total><span>En attente de validation</span><b data-somme>${eur(total)}</b></div>
        <div class="ligne"><span>Repas · Saint-Lô</span><b>18,00 €</b></div><div class="ligne"><span>Parking · Rouen</span><b>5,60 €</b></div>
        <button type="button" class="a-btn principal" data-nouv style="margin-top:10px">${ic('plus')}Nouvelle note de frais</button>`, { vise: 'moi' });
      $('[data-nouv]', t).addEventListener('click', () => {
        let nature = null, photo = false;
        const f = feuille(t, `<p style="margin:0 0 8px;font-weight:700">Nouvelle note de frais</p>
          <span style="font-size:11.5px;color:var(--gris)">Nature</span><div class="puces">${['Repas', 'Péage', 'Carburant', 'Train', 'Parking'].map(n => `<button type="button" aria-pressed="false" data-nat="${n}">${n}</button>`).join('')}</div>
          <label for="fr-mt" style="font-size:11.5px;color:var(--gris)">Montant (€)</label><input id="fr-mt" inputmode="decimal" placeholder="0,00">
          <div data-ph style="margin-top:10px"><button type="button" class="a-btn" data-photo>${ic('photo')}Photographier le justificatif</button></div>
          <button type="button" class="a-btn principal" data-env style="margin-top:10px">Envoyer</button><p data-err class="a-msg erreur" hidden style="margin:8px 0 0"></p>`);
        const mt = $('#fr-mt', f), err = $('[data-err]', f);
        const val = () => parseFloat(mt.value.replace(/\s/g, '').replace(',', '.').replace('€', ''));
        mt.addEventListener('input', () => { if (Math.abs(val() - 12.4) < .001) a.coche(1); });
        $$('[data-nat]', f).forEach(b => b.addEventListener('click', () => { nature = b.dataset.nat; $$('[data-nat]', f).forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); if (nature === 'Péage') a.coche(0); }));
        $('[data-photo]', f).addEventListener('click', () => { photo = true; a.coche(2); $('[data-ph]', f).innerHTML = `<div class="ticket" data-ticket>PÉAGE<br>A28<br>--------<br>CL. 1<br><b>12,40 EUR</b><br>MERCI</div>`; });
        $('[data-env]', f).addEventListener('click', () => {
          const dire = m => { err.hidden = false; err.textContent = m; };
          if (nature !== 'Péage') return dire('Choisissez la nature : péage.');
          if (!(Math.abs(val() - 12.4) < .001)) return dire('Le montant attendu est 12,40.');
          if (!photo) return dire('Ajoutez la photo du justificatif.');
          a.coche(3);
          const tk = $('[data-ticket]', f), app = $('.app', t), rA = app.getBoundingClientRect(), rT = tk.getBoundingClientRect(), rS = $('[data-somme]', t).getBoundingClientRect();
          const vol = tk.cloneNode(true); vol.classList.add('vole'); vol.style.left = `${rT.left - rA.left}px`; vol.style.top = `${rT.top - rA.top}px`; app.appendChild(vol);
          fermerFeuille(t);
          requestAnimationFrame(() => { vol.style.transform = `translate(${rS.left - rT.left - 20}px, ${rS.top - rT.top - 30}px) scale(.2) rotate(30deg)`; vol.style.opacity = '0'; });
          setTimeout(() => {
            vol.remove(); const t0 = performance.now(), de = total; total += 12.4; const el = $('[data-somme]', t), tot = $('[data-total]', t); tot.classList.add('luit');
            const pas = now => { const k = Math.min(1, (now - t0) / 600); el.textContent = eur(de + 12.4 * k); if (k < 1) requestAnimationFrame(pas); else { toast(t, `${ic('check')} Note envoyée : elle attend la validation.`); setTimeout(() => a.gagne(), 700); } };
            requestAnimationFrame(pas);
          }, reduit() ? 10 : 820);
        });
      });
    },
  };
  const melange = (arr, ordre) => ordre.map(i => arr[i]);

  // ============================================================================================ les vues
  let minuteries = [];
  const nettoyer = () => { minuteries.forEach(clearInterval); minuteries.forEach(clearTimeout); minuteries = []; };
  const COCHE = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function listeEtapes() {
    const suiv = prochaine();
    return GROUPES.map((g, gi) => `<section class="groupe"><h2>${esc(g)}</h2><ol class="etapes">${SCENES.map((s, i) => s.groupe !== gi ? '' : `<li>
      <a href="#etape-${s.id}" class="${S.faits[s.id] ? 'fait' : ''}${suiv && suiv.id === s.id ? ' suivante' : ''}"><span class="num">${i + 1}</span>
        <span><span class="t">${esc(s.titre)}</span><span class="s">${esc(s.sous)}</span></span>
        <span class="etat">${S.faits[s.id] ? `${ic('check')}Fait` : ''}</span></a></li>`).join('')}</ol></section>`).join('');
  }

  function vueAccueil() {
    const reprise = nbFaits() > 0;
    $('#vue').innerHTML = `<div class="page">
      <section class="accueil">
        <div>
          <p class="surtitre">Compagnie Crescite · Espace de l’équipe</p>
          <h1>Votre tournée, sur votre téléphone.</h1>
          <p class="chapeau">Dates, horaires, feuille de route, textes, disponibilités, notes de frais. Onze gestes à faire ici, sur un téléphone de démonstration. Rien n’est envoyé.</p>
          <div class="actions">
            ${reprise ? `<a class="btn principal" href="#etape-${(prochaine() || SCENES[0]).id}">Reprendre</a><a class="btn" href="#plan">Voir le plan</a>`
              : `<a class="btn principal" href="#profil">Commencer</a><a class="btn" href="#plan">Voir le plan</a>`}
          </div>
          <p class="note">Environ dix minutes. La progression reste sur cet appareil.</p>
        </div>
        <div class="plateau-accueil">
          <div class="tel"><div class="ecran" data-tel-accueil></div></div>
          <p class="legende">L’onglet Saison, avec la prochaine date réelle : Ci-gisait Cyrano, à Eu.</p>
        </div>
      </section>
      <section class="atouts">
        <div><h3>La bonne feuille de route</h3><p>Toujours la dernière version, en web et en PDF.</p></div>
        <div><h3>Les changements, aussitôt</h3><p>Un horaire bouge : une notification, même application fermée.</p></div>
        <div><h3>Sans réseau</h3><p>La dernière saison consultée reste lisible.</p></div>
      </section></div>`;
    const t = $('[data-tel-accueil]'); t.innerHTML = appli('saison', saison(), { badge: 3 }); rebours(t);
  }

  function vueProfil() {
    const opt = (cle, v, b, s) => `<button type="button" data-cle="${cle}" data-v="${v}" aria-pressed="${S[cle] === v}"><b>${esc(b)}</b><small>${esc(s)}</small></button>`;
    $('#vue').innerHTML = `<div class="profil"><p class="surtitre">Avant de commencer</p><h1>Deux questions.</h1>
      <p style="color:var(--gris);margin:0 0 24px">Elles règlent le niveau de détail.</p>
      <fieldset><legend>Les applications sur téléphone</legend><div class="options">
        ${opt('niveau', 'detail', 'Pas à pas', 'Chaque étape expliquée.')}${opt('niveau', 'essentiel', 'L’essentiel', 'Consignes courtes ; les étapes connues se passent.')}</div></fieldset>
      <fieldset><legend>Votre compte</legend><div class="options">
        ${opt('compte', 'oui', 'Il est ouvert', 'J’ai reçu le courriel d’invitation.')}${opt('compte', 'non', 'Pas encore', 'Ou je ne sais pas.')}</div></fieldset>
      <p data-note-compte ${S.compte === 'non' ? '' : 'hidden'} style="margin:-8px 0 24px;color:var(--gris)">L’administration ouvre les comptes : <b>${CONTACT}</b>. Le guide se suit sans compte.</p>
      <div class="actions"><button type="button" class="btn principal" data-go>Commencer</button></div></div>`;
    $$('[data-cle]').forEach(b => b.addEventListener('click', () => {
      S[b.dataset.cle] = b.dataset.v; sauver();
      $$(`[data-cle="${b.dataset.cle}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
      $('[data-note-compte]').hidden = S.compte !== 'non';
    }));
    $('[data-go]').addEventListener('click', () => { if (!S.niveau) { S.niveau = 'detail'; sauver(); } location.hash = `etape-${(prochaine() || SCENES[0]).id}`; });
  }

  function vuePlan() {
    const n = nbFaits(), suiv = prochaine();
    $('#vue').innerHTML = `<div class="page plan">
      <div><p class="surtitre">Le plan</p><h1>Onze étapes.</h1><p class="aide">Dans l’ordre ou non. Une minute chacune.</p>
        ${listeEtapes()}
        <p><button type="button" class="lien-btn" data-raz>Tout recommencer</button></p></div>
      <aside class="cote">
        <div class="encart"><p class="chiffre">${n} / ${SCENES.length}</p><p style="color:var(--gris)">${n === SCENES.length ? 'Toutes les étapes sont faites.' : 'étapes faites'}</p>
          ${n === SCENES.length ? `<p><a class="btn principal" href="#fin">Terminer</a></p>` : suiv ? `<p><a class="btn principal" href="#etape-${suiv.id}">${n ? 'Continuer' : 'Commencer'} : ${esc(suiv.titre)}</a></p>` : ''}</div>
        ${espaceReel()}
      </aside></div>`;
    const raz = $('[data-raz]');
    raz.addEventListener('click', () => {
      if (raz.dataset.sur) { S = neuf(); sauver(); majBarre(); location.hash = ''; return; }
      raz.dataset.sur = '1'; raz.textContent = 'Confirmer : effacer la progression'; setTimeout(() => { if (raz.isConnected) { delete raz.dataset.sur; raz.textContent = 'Tout recommencer'; } }, 4000);
    });
    brancherCopie();
  }

  function espaceReel() {
    return `<div class="encart"><p><b>L’espace de l’équipe</b><br><span style="color:var(--gris)">À ouvrir sur votre téléphone, puis à installer.</span></p>
      <p><a class="btn principal" href="${ESPACE}" target="_blank" rel="noopener">Ouvrir l’espace</a></p>
      <div class="copie"><code>${ESPACE.replace('https://', '')}</code><button type="button" data-copie="${ESPACE}">Copier</button></div>
      <p style="margin:14px 0 6px;font-size:.9rem;color:var(--gris)">Pas de compte : écrire à l’administration.</p>
      <div class="copie"><code>${CONTACT}</code><button type="button" data-copie="${CONTACT}">Copier</button></div></div>`;
  }
  function brancherCopie() {
    $$('[data-copie]').forEach(b => b.addEventListener('click', async () => {
      const v = b.dataset.copie;
      try { await navigator.clipboard.writeText(v); b.textContent = 'Copié'; }
      catch (e) { const c = b.previousElementSibling; const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Sélectionné'; }
      setTimeout(() => { if (b.isConnected) b.textContent = 'Copier'; }, 1800);
    }));
  }

  function vueScene(id) {
    const s = parId(id); if (!s) { location.hash = 'plan'; return; }
    const i = indexDe(id), detaille = S.niveau !== 'essentiel';
    let gagnee = false;
    const detailHtml = `<p>${s.detail.map(esc).join('</p><p>')}</p>`;
    const pasapasHtml = `<ol class="pasapas">${s.pasapas.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`;
    const detail = detaille ? `<p class="surtitre" style="margin-top:6px">Pas à pas</p>${pasapasHtml}${detailHtml}` : `<details><summary>En savoir plus</summary>${detailHtml}${pasapasHtml}</details>`;
    const suivante = i < SCENES.length - 1 ? SCENES[i + 1] : null;
    $('#vue').innerHTML = `<div class="page scene-vue">
      <div class="sv-tete"><a class="retour" href="#plan">${ic('fleche-g')}Plan</a>
        <p class="surtitre">Étape ${i + 1} sur ${SCENES.length} · ${esc(GROUPES[s.groupe])}${S.faits[s.id] ? ' · Faite' : ''}</p>
        <h1>${esc(s.titre)}</h1><p class="essentiel">${esc(s.essentiel)}</p></div>
      <div class="sv-defi">
        <div class="defi"><h2>À faire</h2><p class="consigne">${esc(s.consigne)}</p>
          <ul class="coches">${s.coches.map(c => `<li><span class="case">${COCHE}</span>${esc(c)}</li>`).join('')}</ul>
          <div data-extra></div><div data-question></div><div data-termine></div></div>
        <div class="aides"><button type="button" class="lien-btn" data-indice>Indice</button>${detaille ? '' : '<button type="button" class="lien-btn" data-connu>Déjà connu, passer</button>'}</div>
        <p class="indice" data-texte-indice hidden></p>
      </div>
      <div class="sv-plateau"><div class="tel"><div class="ecran" data-tel></div></div><p class="legende">Démonstration : rien n’est envoyé.</p></div>
      <div class="sv-detail">${detail}
        <div class="navig">${i > 0 ? `<a class="btn" href="#etape-${SCENES[i - 1].id}">${ic('fleche-g')}Précédente</a>` : '<span></span>'}${suivante ? `<a class="btn" href="#etape-${suivante.id}">Suivante${ic('fleche-d')}</a>` : `<a class="btn" href="#fin">Terminer${ic('fleche-d')}</a>`}</div></div>
    </div>`;
    const t = $('[data-tel]'), texteIndice = $('[data-texte-indice]');
    const indiquer = msg => { texteIndice.hidden = false; texteIndice.textContent = msg || s.indice; };
    $('[data-indice]').addEventListener('click', () => indiquer());
    const terminer = () => {
      if (gagnee) return; gagnee = true;
      S.faits[s.id] = true; sauver(); majBarre();
      $$('.coches li').forEach(li => li.classList.add('fait'));
      const suiv = prochaine(i);
      $('[data-termine]').innerHTML = `<div class="termine"><span class="ok">${ic('check')}Étape faite.</span>${suiv ? `<a class="btn principal" href="#etape-${suiv.id}">Étape suivante : ${esc(suiv.titre)}</a>` : `<a class="btn principal" href="#fin">Terminer</a>`}</div>`;
      const lien = $('[data-termine] .btn'); lien.focus({ preventScroll: true });
      if (matchMedia('(max-width: 900px)').matches) $('[data-termine]').scrollIntoView({ behavior: reduit() ? 'auto' : 'smooth', block: 'center' });
    };
    const api = {
      coche: k => { const li = $$('.coches li')[k]; if (li) li.classList.add('fait'); },
      souffler: indiquer,
      question: cfg => {
        const box = $('[data-question]');
        box.innerHTML = `<div class="question"><p>${esc(cfg.q)}</p><div class="reponses">${cfg.choix.map((c, k) => `<button type="button" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>`;
        $$('button', box).forEach(b => b.addEventListener('click', () => {
          if (+b.dataset.k === cfg.bonne) { b.classList.add('juste'); $$('button', box).forEach(x => x.disabled = true); cfg.ok(); }
          else { b.classList.add('non'); indiquer(cfg.non); }
        }));
        if (matchMedia('(max-width: 900px)').matches) box.scrollIntoView({ behavior: reduit() ? 'auto' : 'smooth', block: 'center' });
      },
      gagne: terminer,
    };
    MONTER[s.id](t, api, $('[data-extra]'));
    $('[data-connu]')?.addEventListener('click', terminer);
  }

  function vueFin() {
    const manquent = SCENES.filter(s => !S.faits[s.id]);
    $('#vue').innerHTML = `<div class="fin"><p class="surtitre">Fin</p>
      <h1>${manquent.length ? `Il reste ${manquent.length} étape${manquent.length > 1 ? 's' : ''}.` : 'Vous avez fait le tour.'}</h1>
      <p class="chapeau">${manquent.length ? manquent.map(s => `<a href="#etape-${s.id}">${esc(s.titre)}</a>`).join(', ') + '.' : 'Ouvrez maintenant l’espace sur votre téléphone, connectez-vous et installez-le.'}</p>
      ${espaceReel()}
      <p style="margin-top:16px"><a class="btn" href="#plan">Revoir le plan</a></p></div>`;
    brancherCopie();
  }

  // ============================================================================================ l'aiguillage
  function aller() {
    nettoyer();
    const h = location.hash.slice(1);
    if (h === 'profil') vueProfil();
    else if (h === 'plan') vuePlan();
    else if (h === 'fin') vueFin();
    else if (h.startsWith('etape-')) vueScene(h.slice(6));
    else vueAccueil();
    majBarre();
    window.scrollTo({ top: 0 });
    $('#vue').focus({ preventScroll: true });
  }
  addEventListener('hashchange', aller);
  aller();
})();
</script>
