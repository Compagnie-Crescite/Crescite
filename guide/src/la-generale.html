<title>La Générale Crescite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="La répétition générale de l’espace de l’équipe Crescite : onze scènes pour prendre en main sa tournée sur son téléphone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une loge de théâtre. Le texte de la scène à gauche, le téléphone (le plateau) à droite, la barre de la
   loge en tête (ampoules, applaudissements, rôle). Couleurs et polices de l'espace de l'équipe, l'or des ampoules en plus. */
:root {
  --papier: #f6f2eb; --surface: #fffdf9; --surface-2: #efe8dd; --surface-3: #e3d9cb;
  --encre: #1d1418; --gris: #5f565a; --filet: #ded4c6;
  --magenta: #a3306b; --magenta-fonce: #87245a; --magenta-doux: #f5e4ec; --sur-magenta: #fff;
  --ampoule: #f2b544; --ampoule-lueur: rgba(242, 181, 68, .55); --ampoule-eteinte: #d6cbbd;
  --cadre: #2a1a22; --cadre-2: #43293a; --miroir: #fbf8f3;
  --ok: #1d6f47; --ok-doux: #e3f3ea; --alerte: #a4231b; --alerte-doux: #fbe7e5; --option: #7a5a10; --option-doux: #f8efd9;
  --chassis: #1d1418; --sur-u: #fff;
  --u-cyrano: #44464d; --u-cleophene: #b9533f; --u-berenice: #6b3fa0; --u-macbeth: #8e1b1b;
  --ombre: 0 1px 2px rgba(29, 20, 24, .06), 0 10px 30px rgba(29, 20, 24, .10);
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #141016; --surface: #1f1921; --surface-2: #2a222d; --surface-3: #3a3040;
    --encre: #f4eef2; --gris: #b9aeb6; --filet: #3a3140;
    --magenta: #f08cc0; --magenta-fonce: #f7aed3; --magenta-doux: #3a1f30; --sur-magenta: #1a1014;
    --ampoule: #f5c45e; --ampoule-lueur: rgba(245, 196, 94, .5); --ampoule-eteinte: #40364a;
    --cadre: #0b080c; --cadre-2: #2c2130; --miroir: #1b161d;
    --ok: #74d6a6; --ok-doux: #19352a; --alerte: #ff8f86; --alerte-doux: #3d1f1d; --option: #f0c66b; --option-doux: #3a2f17;
    --chassis: #000; --sur-u: #fff;
    --u-cyrano: #5b5e68; --u-cleophene: #b9533f; --u-berenice: #7a4cb3; --u-macbeth: #a12a2a;
    --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #141016; --surface: #1f1921; --surface-2: #2a222d; --surface-3: #3a3040;
  --encre: #f4eef2; --gris: #b9aeb6; --filet: #3a3140;
  --magenta: #f08cc0; --magenta-fonce: #f7aed3; --magenta-doux: #3a1f30; --sur-magenta: #1a1014;
  --ampoule: #f5c45e; --ampoule-lueur: rgba(245, 196, 94, .5); --ampoule-eteinte: #40364a;
  --cadre: #0b080c; --cadre-2: #2c2130; --miroir: #1b161d;
  --ok: #74d6a6; --ok-doux: #19352a; --alerte: #ff8f86; --alerte-doux: #3d1f1d; --option: #f0c66b; --option-doux: #3a2f17;
  --chassis: #000; --sur-u: #fff;
  --u-cyrano: #5b5e68; --u-cleophene: #b9533f; --u-berenice: #7a4cb3; --u-macbeth: #a12a2a;
  --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--papier); color: var(--encre); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--magenta); }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; border-radius: 6px; }
main:focus, main:focus-visible { outline: none; }
.ecran-lecteur { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.pieuvre { display: inline-block; width: 1.84em; height: 1em; fill: currentColor; vertical-align: -.12em; }
.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ------------------------------------------------------------------ la barre de la loge */
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--filet);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.barre-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px 20px; padding-block: 10px; flex-wrap: wrap; }
.marque { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--encre); margin-right: auto; }
.marque svg.pieuvre { color: var(--magenta); font-size: 1.5rem; }
.marque b { font: 600 1.2rem/1 var(--serif); }
.marque small { font: 700 .66rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
.rampe { display: flex; gap: 5px; align-items: center; }
.rampe i { width: 10px; height: 10px; border-radius: 50%; background: var(--ampoule-eteinte); transition: background .4s, box-shadow .4s; }
.rampe i.allumee { background: var(--ampoule); box-shadow: 0 0 8px var(--ampoule-lueur); }
.compteur { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.compteur b { font: 700 1.05rem/1 var(--sans); }
.compteur span { font-size: .82rem; color: var(--gris); }
.role { font: 600 .74rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px; border-radius: 99px; background: var(--magenta-doux); color: var(--magenta-fonce); border: 0; text-decoration: none; white-space: nowrap; }
.son { border: 1px solid var(--filet); background: transparent; border-radius: 99px; padding: 6px 10px; font-size: .8rem; color: var(--gris); display: flex; gap: 6px; align-items: center; }
.son[aria-pressed="true"] { color: var(--magenta-fonce); border-color: var(--magenta); }
@media (max-width: 560px) { .compteur span, .son .lib { display: none; } .rampe i { width: 8px; height: 8px; } .barre-in { gap: 10px 12px; } }

/* ------------------------------------------------------------------ mise en page générale */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.page { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; }
.surtitre { font: 700 .72rem/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--magenta); margin: 0 0 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--filet); background: var(--surface); color: var(--encre);
  border-radius: 14px; padding: 12px 18px; font-weight: 600; text-decoration: none; transition: transform .15s, background .2s, box-shadow .2s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn.principal { background: var(--magenta); border-color: var(--magenta); color: var(--sur-magenta); box-shadow: 0 6px 18px rgba(163, 48, 107, .25); }
.btn.principal:hover { background: var(--magenta-fonce); }
.btn.grand { padding: 15px 24px; font-size: 1.05rem; }
.lien-btn { background: none; border: 0; padding: 4px 0; color: var(--magenta); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.chip { display: inline-block; font: 600 .68rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; background: var(--surface-2); color: var(--gris); }
.chip.pourtoi { background: var(--option-doux); color: var(--option); }
.chip.ok { background: var(--ok-doux); color: var(--ok); }
.exemple { font: 600 .6rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--option); background: var(--option-doux); padding: 3px 5px; border-radius: 4px; vertical-align: .15em; }

/* ------------------------------------------------------------------ l'accueil */
.accueil { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 40px; align-items: center; }
.accueil h1 { font: 600 clamp(2.2rem, 5.4vw, 3.9rem)/1.04 var(--serif); margin: 0 0 18px; letter-spacing: -.01em; }
.accueil h1 em { font-style: italic; color: var(--magenta); }
.accueil .chapeau { font-size: 1.14rem; max-width: 34em; margin: 0 0 26px; color: var(--encre); }
.accueil .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.accueil .note { color: var(--gris); font-size: .9rem; margin: 16px 0 0; max-width: 36em; }
.accueil .plateau-accueil { display: flex; justify-content: center; position: relative; }
.legende { font-size: .8rem; color: var(--gris); text-align: center; margin: 10px auto 0; max-width: 24em; }
.trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 56px 0 0; }
.trois > div { border-top: 2px solid var(--encre); padding-top: 14px; }
.trois h3 { font: 600 1.22rem/1.2 var(--serif); margin: 0 0 6px; }
.trois p { margin: 0; color: var(--gris); }
.programme { margin: 56px 0 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.programme h2, .bloc-titre { font: 600 1.7rem/1.15 var(--serif); margin: 0 0 14px; }
.actes-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.actes-liste li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 12px; }
.actes-liste .num { font: italic 600 1.1rem/1.3 var(--serif); color: var(--magenta); }
.actes-liste b { display: block; font-weight: 600; }
.actes-liste span { color: var(--gris); font-size: .94rem; }
@media (max-width: 900px) { .accueil, .programme { grid-template-columns: minmax(0, 1fr); } .trois { grid-template-columns: minmax(0, 1fr); } }

/* ------------------------------------------------------------------ la loge : le miroir et ses ampoules */
.loge { position: relative; padding: 22px; background: linear-gradient(160deg, var(--cadre-2), var(--cadre)); border-radius: 18px; box-shadow: var(--ombre); }
.miroir { position: relative; background: var(--miroir); border-radius: 10px; padding: 18px 14px; min-height: 180px; overflow: hidden; }
.miroir::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .25) 48%, transparent 56%); pointer-events: none; }
.miroir h3 { margin: 0 0 12px; font: 600 1rem/1.2 var(--serif); text-align: center; color: var(--encre); }
.accessoires { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px 6px; }
.acc { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: .7rem; line-height: 1.2; color: var(--gris); }
.acc .rond { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--ampoule-eteinte); color: var(--ampoule-eteinte); }
.acc .rond .ic { width: 22px; height: 22px; }
.acc.gagne { color: var(--encre); }
.acc.gagne .rond { border: 0; background: var(--magenta-doux); color: var(--magenta-fonce); }
.acc.neuf .rond { animation: tombe .7s cubic-bezier(.3, 1.6, .5, 1) both; }
.ampoules i { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--ampoule-eteinte); transform: translate(-50%, -50%); transition: background .5s, box-shadow .5s; }
.ampoules i.allumee { background: radial-gradient(circle at 40% 35%, #fff6d8, var(--ampoule) 60%); box-shadow: 0 0 10px 3px var(--ampoule-lueur), 0 0 24px 6px var(--ampoule-lueur); }
.ampoules i.neuve { animation: grésille 1s steps(1) both; }
@keyframes grésille { 0%, 30%, 60% { opacity: 1; } 15%, 45% { opacity: .2; } }
@keyframes tombe { from { transform: translateY(-30px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ------------------------------------------------------------------ l'audition */
.audition { max-width: 720px; margin: 0 auto; }
.audition h1 { font: 600 clamp(1.8rem, 4.4vw, 2.6rem)/1.1 var(--serif); margin: 0 0 10px; }
.audition .aide { color: var(--gris); margin: 0 0 24px; }
.points-audition { display: flex; gap: 6px; margin: 0 0 22px; }
.points-audition i { height: 4px; flex: 1; border-radius: 4px; background: var(--surface-3); }
.points-audition i.fait { background: var(--magenta); }
.choix { display: grid; gap: 12px; }
.choix button { text-align: left; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 16px 18px; border-radius: 16px;
  border: 1.5px solid var(--filet); background: var(--surface); transition: border-color .2s, background .2s, transform .15s; }
.choix button:hover { border-color: var(--magenta); }
.choix button[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-doux); }
.choix .pic { grid-row: span 2; width: 2.6rem; height: 2.6rem; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--magenta); }
.choix b { font-weight: 600; }
.choix small { color: var(--gris); font-size: .9rem; }
.audition .champ-nom { width: 100%; font: 500 1.5rem/1.2 var(--serif); padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--filet); background: var(--surface); }
.audition .champ-nom:focus { border-color: var(--magenta); outline: none; box-shadow: 0 0 0 3px var(--magenta-doux); }
.audition .suite { display: flex; gap: 12px; align-items: center; margin-top: 24px; flex-wrap: wrap; }
.verdict { padding: 22px; border-radius: 18px; background: var(--surface); border: 1px solid var(--filet); margin: 0 0 22px; }
.verdict p { margin: 0 0 10px; }
.verdict p:last-child { margin: 0; }

/* ------------------------------------------------------------------ la conduite */
.conduite { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 36px; align-items: start; }
.conduite h1 { font: 600 clamp(1.9rem, 4vw, 2.7rem)/1.1 var(--serif); margin: 0 0 8px; }
.conduite .aide { color: var(--gris); margin: 0 0 26px; max-width: 40em; }
.acte { margin: 0 0 30px; }
.acte h2 { font: 600 1.35rem/1.2 var(--serif); margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.acte h2 .num { font-style: italic; color: var(--magenta); }
.acte > p { margin: 0 0 12px; color: var(--gris); font-size: .94rem; }
.scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.carte-scene { position: relative; text-align: left; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; padding: 14px; border-radius: 16px;
  border: 1px solid var(--filet); background: var(--surface); text-decoration: none; color: var(--encre); transition: transform .2s, box-shadow .2s, border-color .2s; }
.carte-scene:hover { transform: translateY(-2px); box-shadow: var(--ombre); }
.carte-scene .rond { grid-row: span 3; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--gris); }
.carte-scene.jouee .rond { background: var(--magenta-doux); color: var(--magenta-fonce); }
.carte-scene .t { font-weight: 600; line-height: 1.25; }
.carte-scene .s { font-size: .86rem; color: var(--gris); line-height: 1.35; }
.carte-scene .etiquettes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.carte-scene.poursuite { border-color: var(--ampoule); box-shadow: 0 0 0 3px var(--ampoule-lueur), var(--ombre); }
.carte-scene.poursuite::before { content: "À toi"; position: absolute; top: -10px; right: 12px; font: 700 .66rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
  background: var(--ampoule); color: #2a1a05; padding: 5px 8px; border-radius: 99px; }
.cote { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 18px; }
.carte-role { padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--filet); }
.carte-role .nom-role { font: italic 600 1.6rem/1.1 var(--serif); margin: 2px 0 6px; color: var(--magenta-fonce); }
.carte-role .prochain { color: var(--gris); font-size: .9rem; margin: 0 0 14px; }
.jauge { display: grid; gap: 6px; font-size: .84rem; }
.jauge .rail { height: 8px; border-radius: 8px; background: var(--surface-3); overflow: hidden; }
.jauge .rail span { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--alerte), var(--ampoule)); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.jauge .lignes { display: flex; justify-content: space-between; color: var(--gris); }
.vrai-espace { padding: 18px; border-radius: 18px; background: var(--magenta-doux); }
.vrai-espace p { margin: 0 0 12px; }
.copie { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .92rem; }
.copie code { font: 500 .92rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); padding: 4px 8px; border-radius: 6px; user-select: all; }
.copie button { font-size: .82rem; border: 1px solid var(--filet); background: var(--surface); border-radius: 8px; padding: 4px 9px; }
@media (max-width: 980px) { .conduite { grid-template-columns: minmax(0, 1fr); } .cote { position: static; order: -1; } }

/* ------------------------------------------------------------------ une scène */
.scene-vue { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); grid-template-areas: "tete plateau" "defi plateau" "detail plateau"; gap: 0 48px; align-items: start; }
.sv-tete { grid-area: tete; }
.sv-defi { grid-area: defi; }
.sv-detail { grid-area: detail; }
.sv-plateau { grid-area: plateau; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; justify-items: center; gap: 12px; }
.retour { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; font-weight: 500; margin: 0 0 18px; }
.sv-tete h1 { font: 600 clamp(2rem, 4.6vw, 3rem)/1.05 var(--serif); margin: 0 0 12px; }
.essentiel { font-size: 1.15rem; margin: 0 0 22px; max-width: 34em; }
.defi { position: relative; padding: 20px 20px 18px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--encre); margin: 0 0 18px; }
.defi h2 { margin: 0 0 6px; font: 700 .74rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--magenta); display: flex; gap: 8px; align-items: center; }
.defi .consigne { font: 500 1.2rem/1.35 var(--serif); margin: 0 0 12px; }
.coches { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.coches li { display: flex; gap: 10px; align-items: flex-start; color: var(--gris); }
.coches li .case { width: 22px; height: 22px; flex: none; border-radius: 7px; border: 1.5px solid var(--surface-3); display: grid; place-items: center; transition: background .25s, border-color .25s; }
.coches li .case svg { width: 14px; height: 14px; stroke: var(--sur-magenta); stroke-width: 3; fill: none; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .1s; }
.coches li.fait { color: var(--encre); }
.coches li.fait .case { background: var(--magenta); border-color: var(--magenta); }
.coches li.fait .case svg { stroke-dashoffset: 0; }
.question { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--filet); }
.question p { margin: 0 0 10px; font-weight: 600; }
.reponses { display: flex; flex-wrap: wrap; gap: 8px; }
.reponses button { border: 1.5px solid var(--filet); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 600; transition: border-color .2s, background .2s; }
.reponses button:hover { border-color: var(--magenta); }
.reponses button.juste { background: var(--ok-doux); border-color: var(--ok); color: var(--ok); }
.reponses button.non { background: var(--alerte-doux); border-color: var(--alerte); color: var(--alerte); }
.etapes-chips { display: grid; gap: 8px; margin-top: 12px; }
.etapes-chips button { text-align: left; border: 1.5px solid var(--filet); background: var(--surface); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
.etapes-chips button .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 .8rem/1 var(--sans); flex: none; }
.etapes-chips button.fait { border-color: var(--ok); background: var(--ok-doux); color: var(--ok); }
.etapes-chips button.fait .n { background: var(--ok); color: var(--surface); }
.segment { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); gap: 3px; margin-top: 4px; }
.segment button { border: 0; background: transparent; border-radius: 9px; padding: 7px 14px; font-weight: 600; color: var(--gris); }
.segment button[aria-pressed="true"] { background: var(--surface); color: var(--encre); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.aides { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 0 0 18px; }
.souffleur { display: inline-flex; gap: 8px; align-items: center; border: 1px dashed var(--gris); background: transparent; border-radius: 99px; padding: 8px 14px; color: var(--encre); font-weight: 500; }
.souffleur.psst { animation: psst 1.6s ease-in-out 3; border-color: var(--magenta); color: var(--magenta-fonce); }
@keyframes psst { 0%, 100% { transform: none; } 20% { transform: rotate(-3deg); } 40% { transform: rotate(3deg); } 60% { transform: none; } }
.souffle { position: relative; margin: 0 0 18px; padding: 14px 16px 14px 48px; border-radius: 14px; background: var(--option-doux); color: var(--encre); font-style: italic; font-family: var(--serif); font-size: 1.06rem; }
.souffle::before { content: "« "; position: absolute; left: 16px; top: 8px; font-size: 2rem; color: var(--option); font-style: normal; }
.quiz { padding: 18px; border-radius: 16px; border: 1.5px solid var(--magenta); background: var(--magenta-doux); margin: 0 0 18px; }
.quiz p { margin: 0 0 10px; }
.quiz .q { font: 500 1.12rem/1.35 var(--serif); }
.sv-detail p { margin: 0 0 12px; max-width: 38em; }
.sv-detail details { border-top: 1px solid var(--filet); padding-top: 10px; margin-top: 6px; }
.sv-detail summary { cursor: pointer; font-weight: 600; color: var(--magenta); padding: 4px 0; }
.pasapas { margin: 10px 0 14px; padding-left: 1.3em; display: grid; gap: 6px; max-width: 38em; }
.navig { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .scene-vue { grid-template-columns: minmax(0, 1fr); grid-template-areas: "tete" "defi" "plateau" "detail"; }
  .sv-plateau { position: static; margin: 0 0 24px; }
}

/* ------------------------------------------------------------------ le téléphone (l'espace de l'équipe, en petit) */
.tel { width: 320px; max-width: 100%; height: 620px; border-radius: 44px; background: var(--chassis); padding: 11px; box-shadow: 0 30px 60px -20px rgba(29, 20, 24, .5), inset 0 0 0 2px #3b2c33; position: relative; }
.tel::before { content: ""; position: absolute; top: 19px; left: 50%; width: 92px; height: 24px; margin-left: -46px; border-radius: 20px; background: #000; z-index: 5; }
.ecran { position: relative; height: 100%; border-radius: 34px; overflow: hidden; background: var(--papier); isolation: isolate; }
.app { --u: var(--magenta); position: absolute; inset: 0; display: flex; flex-direction: column; font-size: 13px; line-height: 1.4; color: var(--encre); background: var(--papier); user-select: none; -webkit-user-select: none; }
.app input, .app textarea { user-select: text; -webkit-user-select: text; }
.app-statut { display: flex; justify-content: space-between; padding: 14px 26px 0; height: 40px; font: 600 12px/1 var(--sans); font-variant-numeric: tabular-nums; flex: none; }
.app-statut .barres { letter-spacing: 1px; font-size: 9px; }
.app-haut { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 8px; flex: none; border-bottom: 1px solid var(--filet); }
.app-marque { display: flex; gap: 6px; align-items: center; }
.app-marque svg.pieuvre { color: var(--u); font-size: 17px; transition: color .5s; }
.app-marque b { font: 600 15px/1 var(--serif); }
.app-marque small { font: 700 8px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--u); transition: color .5s; }
.app-cloche { position: relative; border: 0; background: transparent; padding: 4px; color: var(--encre); display: grid; }
.app-cloche .badge { position: absolute; top: -2px; right: -4px; min-width: 16px; height: 16px; border-radius: 9px; background: var(--magenta); color: var(--sur-magenta); font: 700 9px/16px var(--sans); text-align: center; padding: 0 4px; }
.app-zone { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 16px; position: relative; overscroll-behavior: contain; }
.app-onglets { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--filet); background: var(--surface); padding: 6px 4px 18px; }
.app-onglets span { display: grid; justify-items: center; gap: 2px; font-size: 9.5px; color: var(--gris); font-weight: 500; position: relative; }
.app-onglets span .ic { width: 20px; height: 20px; }
.app-onglets span.actif { color: var(--u); font-weight: 700; }
.app-onglets span.actif::before { content: ""; position: absolute; top: -7px; width: 24px; height: 3px; border-radius: 3px; background: var(--u); }
.app-onglets span.vise { animation: vise 1.2s ease-in-out infinite; }
@keyframes vise { 50% { color: var(--magenta); transform: translateY(-2px); } }
.a-h { font: 600 18px/1.15 var(--serif); margin: 2px 0 10px; }
.a-sous { font: 700 9px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--gris); margin: 14px 0 8px; }
.a-btn { display: flex; width: 100%; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--filet); background: var(--surface); border-radius: 12px; padding: 10px; font-weight: 600; font-size: 13px; }
.a-btn.principal { background: var(--magenta); color: var(--sur-magenta); border-color: var(--magenta); }
.a-btn.petit { width: auto; padding: 6px 10px; font-size: 12px; border-radius: 9px; }
.a-lien { border: 0; background: none; color: var(--magenta); text-decoration: underline; font-size: 12px; padding: 4px 0; }
.a-msg { font-size: 12px; padding: 8px 10px; border-radius: 10px; margin: 0 0 10px; }
.a-msg.info { background: var(--magenta-doux); }
.a-msg.erreur { background: var(--alerte-doux); color: var(--alerte); }
.a-toast { position: absolute; left: 12px; right: 12px; bottom: 72px; z-index: 8; background: var(--encre); color: var(--papier); padding: 10px 12px; border-radius: 12px; font-size: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, .3); animation: monte .3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes monte { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pose { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.pose { animation: pose .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes glisseg { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glissed { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* la porte */
.porte { padding: 22px 20px; flex: 1; overflow-y: auto; }
.porte .pm { display: flex; gap: 6px; align-items: center; margin: 4px 0 16px; }
.porte .pm svg.pieuvre { color: var(--magenta); font-size: 22px; }
.porte .pm b { font: 600 17px/1 var(--serif); }
.porte .pm small { font: 700 8px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
.porte h3 { font: 600 21px/1.12 var(--serif); margin: 0 0 6px; }
.porte .intro { color: var(--gris); margin: 0 0 14px; font-size: 12.5px; }
.porte label { display: block; font-weight: 600; font-size: 12px; margin: 8px 0 4px; }
.porte input { width: 100%; border: 1px solid var(--filet); background: var(--surface); border-radius: 10px; padding: 9px 10px; font-size: 13px; }
.porte input.faux { border-color: var(--alerte); }
.porte .ou { text-align: center; color: var(--gris); font-size: 11px; margin: 10px 0; }
.porte .a-btn.principal { margin-top: 12px; }
.secoue { animation: secoue .4s cubic-bezier(.36, .07, .19, .97); }
@keyframes secoue { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.mail { position: absolute; top: 44px; left: 10px; right: 10px; z-index: 9; text-align: left; border: 0; border-radius: 18px; padding: 10px 12px; background: var(--surface); box-shadow: 0 12px 30px rgba(0, 0, 0, .28); display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; animation: descend .5s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes descend { from { transform: translateY(-120%); } to { transform: none; } }
.mail .ico { grid-row: span 3; width: 34px; height: 34px; border-radius: 9px; background: #2f7cf6; color: #fff; display: grid; place-items: center; }
.mail small { color: var(--gris); font-size: 10.5px; }
.mail b { font-size: 12.5px; }
.mail span { font-size: 12px; color: var(--gris); }

/* la saison */
.heros { --u: var(--u-cyrano); position: relative; display: grid; gap: 2px; width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 14px 14px 12px; color: var(--sur-u); overflow: hidden;
  background: radial-gradient(120% 90% at 100% 0%, rgba(255, 255, 255, .22), transparent 55%), var(--u); box-shadow: 0 10px 22px -10px var(--u); }
.heros::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; border: 18px solid rgba(255, 255, 255, .08); }
.heros .et { font: 700 8.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.heros .ti { font: 600 21px/1.1 var(--serif); margin: 4px 0 2px; }
.heros .qd { font-weight: 600; }
.heros .ou { opacity: .9; font-size: 12px; }
.heros .compte { display: flex; gap: 10px; align-items: baseline; margin-top: 10px; font-variant-numeric: tabular-nums; }
.heros .compte b { font: 700 26px/1 var(--sans); letter-spacing: -.02em; }
.heros .compte span { font: 600 12px/1 var(--sans); opacity: .9; }
.heros .lampe { position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: #ffd56a; box-shadow: 0 0 10px #ffd56a; animation: respire 2.4s ease-in-out infinite; }
@keyframes respire { 50% { opacity: .45; } }
.roule { display: inline-block; animation: roule .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes roule { from { transform: translateY(-60%); opacity: 0; } to { transform: none; opacity: 1; } }
.billet { --u: var(--u-cyrano); position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; align-items: center; border: 1px solid var(--filet); border-radius: 14px; background: var(--surface); padding: 9px 10px 9px 14px; margin: 0 0 8px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.billet::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--u); }
.billet::after { content: ""; position: absolute; right: 54px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--papier); border: 1px solid var(--filet); }
.billet .bd { text-align: center; line-height: 1; }
.billet .bd b { display: block; font: 700 18px/1 var(--sans); }
.billet .bd small { font-size: 10px; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; }
.billet .bs { font-weight: 700; display: block; }
.billet .bl { display: block; color: var(--gris); font-size: 11.5px; }
.billet .be { display: inline-block; font-size: 10px; font-weight: 600; margin-top: 3px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--gris); }
.billet.presse { transform: scale(.98); }
.anneau { position: absolute; inset: 0; pointer-events: none; border-radius: 14px; background: conic-gradient(var(--magenta) calc(var(--p, 0) * 1turn), transparent 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 2.5px; }

/* une date */
.d-tete { --u: var(--u-cyrano); margin: -12px -14px 12px; padding: 12px 14px 14px; background: var(--u); color: var(--sur-u); transition: background .5s; }
.d-tete .ti { font: 600 19px/1.1 var(--serif); margin: 2px 0; }
.d-tete small { font: 700 8.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.d-tete .qd { font-weight: 600; font-size: 12.5px; }
.ligne { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--filet); }
.ligne:last-child { border-bottom: 0; }
.carte-mini { position: relative; border-radius: 14px; overflow: hidden; background: var(--surface); border: 1px solid var(--filet); }
.carte-mini svg { display: block; width: 100%; height: auto; }
.km { position: absolute; left: 10px; bottom: 8px; background: var(--surface); border-radius: 8px; padding: 4px 8px; font: 700 12px/1 var(--sans); font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.qui { display: flex; gap: 10px; flex-wrap: wrap; }
.qui span { display: grid; justify-items: center; gap: 2px; font-size: 10px; color: var(--gris); }
.qui i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--sans); font-style: normal; background: var(--surface-2); color: var(--encre); }
.qui span:first-child i { background: var(--magenta); color: var(--sur-magenta); }
.nav-dates { display: flex; justify-content: space-between; gap: 8px; margin: 12px 0 0; }

/* le jour J */
.frise { position: relative; list-style: none; margin: 0; padding: 0 0 0 18px; }
.frise::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--surface-3); }
.frise li { position: relative; padding: 6px 8px 6px 8px; border-radius: 10px; transition: background .3s, opacity .3s; }
.frise li::before { content: ""; position: absolute; left: -17px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--surface-3); }
.frise li b { font-variant-numeric: tabular-nums; margin-right: 6px; }
.frise li.passee { opacity: .5; }
.frise li.encours { background: var(--magenta-doux); }
.frise li.encours::before { border-color: var(--magenta); background: var(--magenta); box-shadow: 0 0 0 4px var(--magenta-doux); }
.frise li .dans { display: block; font-size: 10.5px; color: var(--magenta-fonce); font-weight: 600; }
.horloge { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--filet); margin: 0 0 12px; }
.horloge b { font: 700 20px/1 var(--sans); font-variant-numeric: tabular-nums; }
.horloge input { width: 100%; accent-color: var(--magenta); }

/* planning */
.prop { border: 1.5px solid var(--u-macbeth); border-radius: 14px; padding: 10px 12px; background: var(--surface); margin: 0 0 10px; }
.prop .ti { font: 600 15px/1.2 var(--serif); }
.prop .boutons { display: flex; gap: 6px; margin-top: 8px; }
.prop .boutons .a-btn { padding: 7px; font-size: 12px; }
.prop.repondue { border-color: var(--ok); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal .j { font-size: 9px; color: var(--gris); font-weight: 700; padding: 2px 0; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 8px; background: var(--surface); font-size: 11.5px; font-variant-numeric: tabular-nums; position: relative; padding: 0; }
.cal button.tournee { background: var(--u-cyrano); color: #fff; font-weight: 700; }
.cal button.pris { background: repeating-linear-gradient(-45deg, var(--alerte-doux) 0 4px, var(--surface) 4px 8px); color: var(--alerte); font-weight: 700; outline: 1.5px solid var(--alerte); outline-offset: -1.5px; }
.cal button.vide { visibility: hidden; }
.feuille { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 14px 20px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); animation: monteFeuille .32s cubic-bezier(.2, .8, .2, 1) both; max-height: 86%; overflow-y: auto; }
.feuille::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 4px; background: var(--surface-3); margin: 0 auto 10px; }
@keyframes monteFeuille { from { transform: translateY(100%); } to { transform: none; } }
.voile { position: absolute; inset: 0; z-index: 6; background: rgba(20, 12, 16, .35); animation: fondu .25s both; }
@keyframes fondu { from { opacity: 0; } }
.feuille .act { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: transparent; padding: 10px 4px; border-bottom: 1px solid var(--filet); text-align: left; font-size: 13px; }
.feuille .act:last-child { border-bottom: 0; }
.feuille .act .ic { color: var(--magenta); }
.feuille .act.vise { background: var(--option-doux); border-radius: 10px; }
.feuille input, .feuille textarea { width: 100%; border: 1px solid var(--filet); border-radius: 10px; padding: 8px 10px; background: var(--papier); font-size: 13px; }
.feuille textarea { min-height: 70px; resize: none; }
.feuille .cpt { text-align: right; font-size: 10.5px; color: var(--gris); font-variant-numeric: tabular-nums; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.puces button { border: 1px solid var(--filet); background: var(--papier); border-radius: 99px; padding: 5px 10px; font-size: 12px; }
.puces button[aria-pressed="true"] { background: var(--magenta); color: var(--sur-magenta); border-color: var(--magenta); }

/* spectacles et fichiers */
.spec { --u: var(--u-cyrano); display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; border: 0; border-radius: 14px; padding: 12px; margin: 0 0 8px; color: var(--sur-u); background: var(--u); }
.spec .ti { font: 600 16px/1.1 var(--serif); display: block; }
.spec small { opacity: .88; font-size: 11px; }
.fic { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--filet); margin: 0 0 6px; }
.fic .ic { color: var(--magenta); }
.fic div { flex: 1; min-width: 0; }
.fic b { display: block; font-size: 12.5px; }
.fic small { color: var(--gris); font-size: 10.5px; }
.partage-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; text-align: center; font-size: 10.5px; }
.partage-apps button { border: 0; background: transparent; display: grid; justify-items: center; gap: 4px; font-size: 10.5px; }
.partage-apps i { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--encre); font-style: normal; }

/* notifications */
.notif { position: relative; border-radius: 14px; margin: 0 0 8px; overflow: hidden; touch-action: pan-y; }
.notif .fond { position: absolute; inset: 0; background: var(--ok); color: #fff; display: flex; align-items: center; padding-left: 14px; font-weight: 700; font-size: 12px; }
.notif .corps { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 2px 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--filet); border-radius: 14px; transition: transform .25s, opacity .3s; user-select: none; -webkit-user-select: none; }
.notif .corps .pt { grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; background: var(--magenta-doux); color: var(--magenta-fonce); display: grid; place-items: center; }
.notif .corps b { font-size: 12.5px; }
.notif .corps span { font-size: 11.5px; color: var(--gris); }
.notif.non-lue .corps::after { content: ""; position: absolute; right: 10px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); }
.notif.lue .corps { opacity: .55; }

/* moi : les notes de frais */
.fiche-moi { display: flex; gap: 10px; align-items: center; margin: 0 0 12px; }
.fiche-moi i { width: 44px; height: 44px; border-radius: 50%; background: var(--magenta); color: var(--sur-magenta); display: grid; place-items: center; font: 700 15px/1 var(--sans); font-style: normal; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--filet); margin: 0 0 8px; }
.total b { font: 700 20px/1 var(--sans); font-variant-numeric: tabular-nums; }
.total.luit { box-shadow: 0 0 0 3px var(--ampoule-lueur); transition: box-shadow .4s; }
.ticket { width: 70px; height: 86px; margin: 6px auto 10px; background: #fff; color: #333; border-radius: 3px; box-shadow: 0 4px 12px rgba(0, 0, 0, .2); font: 9px/1.3 ui-monospace, Menlo, monospace; padding: 6px; transform: rotate(-4deg);
  -webkit-mask: radial-gradient(circle at 50% 100%, transparent 3px, #000 3.5px) 0 0 / 8px 100%; mask: radial-gradient(circle at 50% 100%, transparent 3px, #000 3.5px) 0 0 / 8px 100%; }
.ticket.vole { position: absolute; z-index: 12; margin: 0; transition: transform .8s cubic-bezier(.5, -.3, .4, 1), opacity .8s; }

/* l'écran d'accueil du téléphone et le navigateur */
.navigateur { display: flex; flex-direction: column; height: 100%; }
.url { margin: 0 12px 8px; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); font-size: 11.5px; color: var(--gris); display: flex; justify-content: space-between; align-items: center; }
.barre-safari { display: flex; justify-content: space-around; padding: 8px 0 22px; border-top: 1px solid var(--filet); background: var(--surface); color: #2f7cf6; }
.barre-safari .vise, .vise-ici { animation: vise 1.2s ease-in-out infinite; color: var(--magenta) !important; }
.accueil-tel { position: absolute; inset: 0; padding: 60px 22px; background: linear-gradient(170deg, #5b3a6e, #a3306b 60%, #e0806b); display: grid; grid-template-columns: repeat(4, 1fr); align-content: start; gap: 20px 12px; }
.accueil-tel span { display: grid; justify-items: center; gap: 4px; color: #fff; font-size: 9.5px; }
.accueil-tel i { width: 48px; height: 48px; border-radius: 13px; background: rgba(255, 255, 255, .28); display: grid; place-items: center; }
.accueil-tel .crescite i { background: #fffdf9; color: #a3306b; animation: tombe .7s cubic-bezier(.3, 1.6, .5, 1) .2s both; font-size: 24px; }
.dialogue { position: absolute; left: 18px; right: 18px; top: 34%; z-index: 9; background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, .35); animation: pose .3s both; }
.dialogue p { margin: 0 0 10px; }

/* ------------------------------------------------------------------ le bravo */
.bravo { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20, 10, 16, .55); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fondu .3s both; }
.bravo-carte { width: min(460px, 100%); background: var(--surface); border-radius: 24px; padding: 26px 24px 22px; text-align: center; box-shadow: 0 30px 80px rgba(0, 0, 0, .4); animation: pose .45s cubic-bezier(.2, 1.2, .4, 1) both; max-height: 100%; overflow-y: auto; }
.bravo-titre { font: italic 600 clamp(2.4rem, 9vw, 3.4rem)/1 var(--serif); color: var(--magenta); margin: 0 0 8px; }
.bravo .gain-points { font: 700 1.25rem/1.2 var(--sans); margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.bravo .bonus { color: var(--option); font-weight: 600; margin: 0 0 14px; }
.bravo .gain { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 12px; border-radius: 14px; background: var(--surface-2); margin: 0 0 12px; text-align: left; }
.bravo .gain .rond { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--magenta-doux); color: var(--magenta-fonce); animation: tombe .7s cubic-bezier(.3, 1.6, .5, 1) .25s both; }
.bravo .monte { font: 600 1.05rem/1.3 var(--serif); margin: 0 0 14px; padding: 10px; border-radius: 12px; background: var(--option-doux); color: var(--encre); }
.bravo .actions { display: grid; gap: 10px; }
#petales { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ------------------------------------------------------------------ le rappel : l'affiche */
.rappel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.affiche { position: relative; background: var(--cadre); color: #f6eef2; border-radius: 6px; padding: 34px 28px 30px; text-align: center; box-shadow: var(--ombre); overflow: hidden; }
.affiche::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(242, 181, 68, .5); border-radius: 3px; pointer-events: none; }
.affiche .pres { font: 700 .7rem/1.4 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--ampoule); margin: 0 0 18px; }
.affiche .nom { font: 700 clamp(2.6rem, 8vw, 4.4rem)/.95 var(--serif); margin: 0; word-break: break-word; text-transform: uppercase; letter-spacing: .02em; }
.affiche .dans { font: italic 500 1.2rem/1.2 var(--serif); margin: 12px 0 4px; color: #e9c9d8; }
.affiche .tournee { font: 600 1.6rem/1.15 var(--serif); margin: 0 0 18px; }
.affiche .villes { font-size: .82rem; letter-spacing: .06em; color: #d9c6cf; margin: 0 0 22px; }
.affiche .tampon { display: inline-block; transform: rotate(-6deg); border: 2.5px solid var(--ampoule); color: var(--ampoule); padding: 6px 14px; border-radius: 8px; font: 700 .9rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
.affiche svg.pieuvre { color: #f08cc0; font-size: 2.4rem; margin: 0 0 10px; }
.rappel h1 { font: 600 clamp(2rem, 4.6vw, 3rem)/1.05 var(--serif); margin: 0 0 12px; }
@media (max-width: 900px) { .rappel { grid-template-columns: minmax(0, 1fr); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

  function appuiLong(el, fait, { duree = 520 } = {}) {
    let minuterie = null, debut = 0, raf = 0, anneau = null, dernier = 0;
    const lancer = () => { if (performance.now() - dernier < 900) return; dernier = performance.now(); vibrer(); fait(); };
    const stop = () => { clearTimeout(minuterie); cancelAnimationFrame(raf); el.classList.remove('presse'); anneau?.remove(); anneau = null; };
    const tourne = () => { if (!anneau) return; anneau.style.setProperty('--p', Math.min(1, (performance.now() - debut) / duree)); raf = requestAnimationFrame(tourne); };
    el.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      debut = performance.now(); el.classList.add('presse');
      anneau = document.createElement('span'); anneau.className = 'anneau'; el.appendChild(anneau); tourne();
      minuterie = setTimeout(() => { stop(); lancer(); }, duree);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, () => { if (minuterie && performance.now() - debut < duree) el.dataset.court = '1'; stop(); }));

      <div class="sv-plateau"><div class="tel"><div class="ecran" data-tel></div></div><p class="legende">Une répétition : rien n’est envoyé pour de vrai.</p></div>
      <div class="sv-detail">${detail}
        <div class="navig">${i > 0 ? `<a class="btn" href="#scene-${SCENES[i - 1].id}">${ic('fleche-g')}${esc(SCENES[i - 1].titre)}</a>` : '<span></span>'}${i < SCENES.length - 1 ? `<a class="btn" href="#scene-${SCENES[i + 1].id}">${esc(SCENES[i + 1].titre)}${ic('fleche-d')}</a>` : `<a class="btn" href="#rappel">Le rappel${ic('fleche-d')}</a>`}</div></div>
    </div>`;
    const t = $('[data-tel]'), souffle = $('[data-souffle]'), bSouffleur = $('[data-souffleur]');
    const souffler = msg => { souffleUtilise = true; souffle.hidden = false; souffle.textContent = msg || s.souffle; bSouffleur.classList.remove('psst'); };
    bSouffleur.addEventListener('click', () => souffler());
    const api = {
      coche: k => { const li = $$('.coches li')[k]; if (li) li.classList.add('fait'); },
      souffler,
      question: cfg => {
        const box = $('[data-question]');
        box.innerHTML = `<div class="question pose"><p>${esc(cfg.q)}</p><div class="reponses">${cfg.choix.map((c, k) => `<button type="button" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>`;
        $$('button', box).forEach(b => b.addEventListener('click', () => {
          if (+b.dataset.k === cfg.bonne) { b.classList.add('juste'); $$('button', box).forEach(x => x.disabled = true); cfg.ok(); }
          else { b.classList.add('non'); souffler(cfg.non); }
        }));
        if (matchMedia('(max-width: 900px)').matches) box.scrollIntoView({ behavior: reduit() ? 'auto' : 'smooth', block: 'center' });
      },
      gagne: (mode = 'joue') => {
        if (gagnee) return; gagnee = true;
        celebrer(s, mode, mode === 'joue' && !souffleUtilise);
      },
    };
    MONTER[s.id](t, api, $('[data-extra]'));
    // le souffleur fait signe à qui découvre, au bout d'un moment
    if (niv === 'decouvre') minuteries.push(setTimeout(() => { if (!gagnee && bSouffleur.isConnected && !souffleUtilise) bSouffleur.classList.add('psst'); }, 12000));
    $('[data-prouve]')?.addEventListener('click', () => {
      const q = s.quiz, box = $('[data-quiz]');
      box.innerHTML = `<div class="quiz pose"><p class="surtitre" style="margin:0 0 6px">Prouve-le</p><p class="q">${esc(q.q)}</p><div class="reponses">${q.choix.map((c, k) => `<button type="button" data-k="${k}">${esc(c)}</button>`).join('')}</div><p data-pq style="margin:10px 0 0" hidden></p></div>`;
      $$('.reponses button', box).forEach(b => b.addEventListener('click', () => {
        $$('.reponses button', box).forEach(x => x.disabled = true);
        const pq = $('[data-pq]', box); pq.hidden = false;
        if (+b.dataset.k === q.bonne) { b.classList.add('juste'); pq.textContent = q.pourquoi; setTimeout(() => api.gagne('prouve'), 900); }
        else { b.classList.add('non'); $$('.reponses button', box)[q.bonne].classList.add('juste'); pq.innerHTML = `${esc(q.pourquoi)} <b>Joue la scène sur le téléphone : c’est plus parlant.</b>`; }
      }));
      box.scrollIntoView({ behavior: reduit() ? 'auto' : 'smooth', block: 'nearest' });
    });
  }

  // ============================================================================================ les récompenses
  const BRAVOS = ['Bravo !', 'Quel aplomb !', 'Superbe entrée !', 'Pas une fausse note.', 'Standing ovation !', 'Rappel !', 'Quelle présence !', 'Du grand art.', 'Juste et précis.', 'La salle est debout !', 'Chapeau bas.'];
  let dernierGain = null;
  function celebrer(s, mode, sansSouffleur) {
    const avant = nbFaits(), deja = S.faits[s.id];
    let pts = 0, bonus = 0;
    if (!deja) { dernierGain = s.id; pts = mode === 'prouve' ? 40 : 60; bonus = sansSouffleur ? 20 : 0; S.faits[s.id] = { mode, pts: pts + bonus }; S.points += pts + bonus; sauver(); }
    const apres = nbFaits(), monte = roleDe(apres).nom !== roleDe(avant).nom ? roleDe(apres) : null;
    majBarre();
    const suiv = prochaine(indexDe(s.id));
    const fini = apres === SCENES.length;
    const b = $('#bravo');
    b.innerHTML = `<div class="bravo" role="dialog" aria-modal="true" aria-labelledby="bravo-t"><div class="bravo-carte">
      <p class="bravo-titre" id="bravo-t">${BRAVOS[indexDe(s.id) % BRAVOS.length]}</p>
      ${deja ? `<p class="gain-points">Scène rejouée</p><p class="bonus" style="color:var(--gris)">Les applaudissements sont déjà dans ta loge.</p>`
        : `<p class="gain-points">+<span data-cpte>0</span> applaudissements</p><p class="bonus">${bonus ? 'Dont 20 de bonus : sans souffleur !' : mode === 'prouve' ? 'Prouvé en une question.' : 'Avec l’aide du souffleur. La prochaine, sans lui ?'}</p>`}
      <div class="gain"><span class="rond">${ic(s.acc[0])}</span><span><b>${esc(s.acc[1])}</b><br><span style="color:var(--gris);font-size:.92rem">${deja ? 'est déjà dans ta loge.' : 'rejoint ta loge. Une ampoule de plus s’allume.'}</span></span></div>
      ${monte ? `<p class="monte">Tu passes <b>${esc(monte.nom)}</b> !</p>` : ''}
      <div class="actions">${fini ? `<a class="btn principal grand" href="#rappel" data-ferme>Le rappel : ton affiche</a>` : suiv ? `<a class="btn principal grand" href="#scene-${suiv.id}" data-ferme>Scène suivante : ${esc(suiv.titre)}</a>` : ''}
        <a class="btn" href="#conduite" data-ferme>Voir ma loge</a></div></div></div>`;
    b.hidden = false;
    const p = $('.btn.principal', b) || $('.btn', b); p.focus();
    $$('[data-ferme]', b).forEach(x => x.addEventListener('click', () => { b.hidden = true; b.innerHTML = ''; }));
    b.onkeydown = e => { if (e.key === 'Escape') { b.hidden = true; b.innerHTML = ''; location.hash = 'conduite'; } };
    const cpte = $('[data-cpte]', b);
    if (cpte) { const total = pts + bonus, t0 = performance.now(); const pas = now => { const k = Math.min(1, (now - t0) / 900); cpte.textContent = Math.round(total * k); if (k < 1) requestAnimationFrame(pas); }; requestAnimationFrame(pas); }
    if (!deja) { petales(fini ? 160 : 70); applaudir(fini ? 3 : 1.6); }
  }

  // les roses qu'on lance sur scène
  function petales(n) {
    if (reduit()) return;
    const c = $('#petales'), x = c.getContext('2d'), dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
    const COUL = ['#a3306b', '#bc3e80', '#f08cc0', '#f2b544', '#e0806b', '#fff1f6'];
    const P = Array.from({ length: n }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 1.6, vy: 1.6 + Math.random() * 2.6,
      r: 5 + Math.random() * 7, a: Math.random() * 6.3, va: (Math.random() - .5) * .2, c: COUL[Math.floor(Math.random() * COUL.length)], w: Math.random() * 6.3 }));
    const t0 = performance.now();
    const pas = now => {
      x.clearRect(0, 0, innerWidth, innerHeight);
      let vivants = 0;
      P.forEach(p => { p.w += .05; p.x += p.vx + Math.sin(p.w) * .8; p.y += p.vy; p.a += p.va; if (p.y < innerHeight + 30) vivants++;
        x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.scale(1, .55 + .45 * Math.sin(p.w * 2)); x.fillStyle = p.c; x.beginPath(); x.ellipse(0, 0, p.r, p.r * .62, 0, 0, Math.PI * 2); x.fill(); x.restore(); });
      if (vivants && now - t0 < 6000) requestAnimationFrame(pas); else x.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(pas);
  }
  // des applaudissements de synthèse (seulement si le son est mis)
  let audio = null;
  function applaudir(sec) {
    if (!S.son) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audio, len = Math.floor(ctx.sampleRate * .05), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len / 7));
      const n = Math.floor(sec * 38);
      for (let i = 0; i < n; i++) {
        const t = ctx.currentTime + Math.random() * sec * (Math.random() < .7 ? .7 : 1);
        const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = .7 + Math.random() * .7;
        const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 1600; f.Q.value = .9;
        const g = ctx.createGain(); g.gain.value = .12 + Math.random() * .2;
        s.connect(f).connect(g).connect(ctx.destination); s.start(t);
      }
    } catch (e) { /* pas de son : tant pis */ }
  }

  function vueRappel() {
    const n = nbFaits(), complet = n === SCENES.length, manquent = SCENES.filter(s => !S.faits[s.id]);
    $('#vue').innerHTML = `<div class="page rappel">
      <div class="affiche" role="img" aria-label="L’affiche : ${esc(S.prenom || 'toi')}, dans la tournée 2026-2027">
        ${pieuvre()}<p class="pres">La compagnie Crescite présente</p>
        <p class="nom">${esc(S.prenom || 'Toi')}</p><p class="dans">dans</p><p class="tournee">La tournée 2026-2027</p>
        <p class="villes">${VILLES_AFFICHE}</p>
        <span class="tampon">${complet ? 'Bon pour la tournée' : `${n} / ${SCENES.length} scènes`}</span>
      </div>
      <div>
        <p class="surtitre">Le rappel</p>
        <h1>${complet ? `${S.prenom ? esc(S.prenom) + ', l' : 'L'}a tournée t’attend.` : 'Encore quelques scènes avant la tournée.'}</h1>
        <p style="font-size:1.1rem;margin:0 0 18px">${complet ? `Onze scènes, ${S.points} applaudissements, une loge tout allumée. Tête d’affiche, rien de moins. Il ne reste qu’à ouvrir ton vrai espace.`
          : `Il te manque ${manquent.length} scène${manquent.length > 1 ? 's' : ''} pour allumer toute ta loge : ${manquent.map(s => `<a href="#scene-${s.id}">${esc(s.titre)}</a>`).join(', ')}.`}</p>
        ${loge()}
        <div style="margin-top:18px">${espaceReel()}</div>
        <p style="margin-top:18px"><a class="btn" href="#conduite">Revoir la conduite</a></p>
      </div></div>`;
    brancherCopie();
    if (complet && !reduit()) setTimeout(() => petales(90), 300);
  }

  // ============================================================================================ l'aiguillage
  function aller() {
    nettoyer();
    const b = $('#bravo'); if (!b.hidden) { b.hidden = true; b.innerHTML = ''; }
    const h = location.hash.slice(1);
    if (h === 'audition') { etapeAudition = 0; vueAudition(); }
    else if (h === 'conduite') vueConduite();
    else if (h === 'rappel') vueRappel();
    else if (h.startsWith('scene-')) vueScene(h.slice(6));
    else vueAccueil();
    majBarre();
    window.scrollTo({ top: 0 });
    $('#vue').focus({ preventScroll: true });
  }
  $('#son').addEventListener('click', () => { S.son = !S.son; sauver(); majBarre(); if (S.son) applaudir(.8); });
  addEventListener('hashchange', aller);
  aller();
})();
</script>
