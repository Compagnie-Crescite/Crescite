<style>
/* L'espace de l'équipe, en application : d'abord pour le téléphone (on le lit en tournée, sur un quai de gare), aussi clair
   qu'un billet de train. Papier, encre et magenta de la compagnie ; la couleur de l'univers de chaque spectacle en accent
   (--u : la couleur telle quelle, pour les filets ; --u-texte : la même, ajustée jusqu'à un contraste de 4,6:1 sur le fond
   clair ou sombre). Au téléphone une barre d'onglets en bas, à l'ordinateur une colonne à gauche ; le mode sombre suit le
   réglage de l'appareil. */
:root {
  --papier: #f6f2eb; --surface: #fffdf9; --surface-2: #efe8dd; --surface-3: #e6ddd0; --encre: #1d1418; --gris: #5f565a;
  --filet: #ded4c6; --bord-champ: #8c8085; --voile: rgba(29, 20, 24, .5);
  --magenta: #a3306b; --magenta-fonce: #87245a; --magenta-doux: #f5e4ec; --magenta-vif: #bc3e80; --action: #a3306b; --sur-action: #fff;
  --option: #7a5a10; --option-doux: #f8efd9; --alerte: #a4231b; --alerte-doux: #fbe7e5; --ok: #1d6f47; --ok-doux: #e3f3ea;
  --sco: #1e4f8a; --sco-doux: #e6eefa;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --rayon: 18px; --rayon-s: 12px;
  --ombre: 0 1px 2px rgba(29, 20, 24, .05), 0 10px 30px -18px rgba(29, 20, 24, .28);
  --ombre-haute: 0 2px 6px rgba(29, 20, 24, .08), 0 24px 48px -24px rgba(29, 20, 24, .45);
  --gout: 16px; --large: 860px; --barre-bas: 64px; --rail: 232px; --haut: 56px;
  --hs: env(safe-area-inset-top, 0px); --bs: env(safe-area-inset-bottom, 0px); --gs: env(safe-area-inset-left, 0px); --ds: env(safe-area-inset-right, 0px);
  /* les tentacules (../admin/tentacules.js) : à l'encre, empreintes et confirmations au magenta */
  --tt-encre: var(--encre); --tt-accent: var(--magenta); --tt-neutre: var(--gris); --tt-fond: var(--surface); --tt-epaisseur: 2.2;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --papier: #141016; --surface: #1f1921; --surface-2: #2a222d; --surface-3: #342a38; --encre: #f4eef2; --gris: #b9aeb6;
    --filet: #3a3140; --bord-champ: #8a7f8c; --voile: rgba(0, 0, 0, .6);
    --magenta: #f08cc0; --magenta-fonce: #f7aed3; --magenta-doux: #3a1f30; --magenta-vif: #e05a9f; --action: #f08cc0; --sur-action: #1a1014;
    --option: #f0c66b; --option-doux: #3a2f17; --alerte: #ff8f86; --alerte-doux: #3d1f1d; --ok: #74d6a6; --ok-doux: #19352a;
    --sco: #8db8f0; --sco-doux: #1c2a3d;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .7);
    --ombre-haute: 0 2px 6px rgba(0, 0, 0, .35), 0 24px 48px -24px rgba(0, 0, 0, .8);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--haut) + var(--hs) + 12px); -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--papier); color: var(--encre); font: 400 1rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word; overscroll-behavior-y: contain; }
a { color: var(--magenta); text-underline-offset: .18em; }
a:hover { color: var(--magenta-fonce); }
button, input, textarea, select { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
.sr { position: absolute !important; width: 1px !important; height: 1px !important; min-height: 0 !important; margin: -1px !important; padding: 0 !important; border: 0 !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; clip-path: inset(50%) !important; white-space: nowrap !important; }
.evitement { position: absolute; left: 8px; top: -80px; z-index: 90; padding: 10px 14px; border-radius: 8px; background: var(--encre); color: var(--papier); font-weight: 600; }
.evitement:focus { top: calc(8px + var(--hs)); color: var(--papier); }
.ic { width: 20px; height: 20px; flex: none; }

/* ———— la coquille : colonne (barre du haut, contenu) et navigation (barre du bas au téléphone, colonne à l'ordinateur) ———— */
.appli { min-height: 100dvh; }
.colonne { min-height: 100dvh; padding-bottom: calc(var(--barre-bas) + var(--bs) + 24px); }
.barre-haut { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 6px; height: calc(var(--haut) + var(--hs)); padding: var(--hs) max(8px, var(--ds)) 0 max(8px, var(--gs)); background: color-mix(in srgb, var(--papier) 86%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.barre-haut.defile { border-bottom-color: var(--filet); }
.barre-haut .marque-mini { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; color: var(--encre); text-decoration: none; font: 600 1.18rem/1 var(--serif); }
.barre-haut .marque-mini small { font: 700 .66rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); padding-top: 3px; }
.barre-titre { flex: 1; min-width: 0; margin: 0; font: 600 1.06rem/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
.barre-haut.defile .barre-titre, .barre-haut.sous .barre-titre { opacity: 1; transform: none; }
.barre-haut.sous .marque-mini { display: none; }
.bouton-rond { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--encre); cursor: pointer; text-decoration: none; }
.bouton-rond:hover { background: var(--surface-2); color: var(--encre); }
.bouton-rond .ic { width: 22px; height: 22px; }
.barre-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.pieuvre { display: inline-block; flex: none; width: 30px; height: 25px; color: var(--magenta-vif); }
.pieuvre:empty { display: none; }
.pieuvre svg { display: block; width: 100%; height: 100%; overflow: visible; }

.nav-appli { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: flex; align-items: stretch; justify-content: space-around; height: calc(var(--barre-bas) + var(--bs)); padding: 0 max(2px, var(--ds)) var(--bs) max(2px, var(--gs)); background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(16px); backdrop-filter: saturate(1.5) blur(16px); border-top: 1px solid var(--filet); }
.nav-marque, .nav-pied { display: none; }
.nav-item { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 0 4px; color: var(--gris); text-decoration: none; font: 600 .7rem/1.1 var(--sans); letter-spacing: -.005em; }
.nav-item:hover { color: var(--encre); }
.nav-icone { position: relative; display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background-color .25s, color .25s; }
.nav-icone .ic { width: 24px; height: 24px; }
.nav-item[aria-current] { color: var(--encre); }
.nav-item[aria-current] .nav-icone { background: var(--magenta-doux); color: var(--magenta); }
.nav-lib-long { display: none; }
.nav-lib { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pastille-nb { position: absolute; top: -3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--alerte); color: #fff; font: 700 .68rem/18px var(--sans); text-align: center; box-shadow: 0 0 0 2px var(--surface); }
@media (prefers-color-scheme: dark) { .pastille-nb { color: #1a1014; } }
.pastille-nb:empty, .pastille-nb[data-n="0"] { display: none; }
@media (prefers-reduced-motion: no-preference) { .pastille-nb.nouvelle { animation: pastille .5s cubic-bezier(.3, 1.6, .5, 1); } @keyframes pastille { from { transform: scale(.2); } } }

@media (min-width: 760px) {
  .colonne { margin-left: var(--rail); padding-bottom: 48px; }
  .nav-appli { top: 0; right: auto; width: var(--rail); height: auto; flex-direction: column; justify-content: flex-start; gap: 4px; padding: calc(18px + var(--hs)) 14px 18px max(14px, var(--gs)); border-top: 0; border-right: 1px solid var(--filet); background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .nav-marque { display: flex; align-items: center; gap: 10px; margin: 0 6px 22px; color: var(--encre); text-decoration: none; }
  .nav-marque .marque-nom { font: 600 1.38rem/1 var(--serif); }
  .nav-marque small { font: 700 .68rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
  .nav-marque .pieuvre { width: 36px; height: 30px; }
  .nav-item { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 14px; font-size: .97rem; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item[aria-current] { background: var(--magenta-doux); color: var(--magenta); }
  .nav-item[aria-current] .nav-icone { background: none; }
  .nav-icone { width: 24px; height: 24px; }
  .nav-lib-court { display: none; }
  .nav-lib-long { display: inline; }
  .pastille-nb { position: static; margin-left: auto; box-shadow: none; }
  .nav-item .nav-lib { flex: 1; }
  .nav-pied { display: block; margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--filet); color: var(--gris); font-size: .86rem; }
  .barre-haut { padding-left: max(16px, var(--gs)); }
  .barre-haut .marque-mini { display: none; }
}

/* ———— le contenu ———— */
main { display: block; max-width: var(--large); margin: 0 auto; padding: 8px max(var(--gout), var(--ds)) 32px max(var(--gout), var(--gs)); }
.titre-vue { margin: 6px 0 18px; }
.titre-vue h1 { font: 600 clamp(1.75rem, 7vw, 2.3rem)/1.08 var(--serif); letter-spacing: -.01em; }
.titre-vue .sous { margin: 6px 0 0; color: var(--gris); }
.titre-section { margin: 30px 0 12px; font: 700 .76rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); display: flex; align-items: center; gap: 10px; }
.titre-section::after { content: ""; flex: 1; height: 1px; background: var(--filet); }
.mois { margin: 20px 4px 8px; font: 700 .9rem/1.2 var(--sans); color: var(--encre); text-transform: capitalize; }
.pile { display: grid; gap: 12px; }
.pied-vue { margin: 30px 0 0; color: var(--gris); font-size: .88rem; text-align: center; }
.bandeau-etat { max-width: var(--large); margin: 0 auto; padding: 0 max(var(--gout), var(--ds)) 0 max(var(--gout), var(--gs)); }
.bandeau-etat .message { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.attente { margin: 6px 0 0; color: var(--gris); font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) { .attente { animation: paraitre .2s .8s both; } @keyframes paraitre { from { opacity: 0; } } }

/* ———— boutons, champs, messages ———— */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 18px; border: 1.5px solid var(--filet); border-radius: 999px; background: var(--surface); color: var(--encre); font: 600 .97rem/1.2 var(--sans); text-decoration: none; text-align: center; cursor: pointer; transition: transform .12s, background-color .2s; }
.btn:hover { background: var(--surface-2); color: var(--encre); }
.btn:active { transform: scale(.97); }
.btn.principal { background: var(--action); border-color: var(--action); color: var(--sur-action); }
.btn.principal:hover { background: var(--magenta-fonce); border-color: var(--magenta-fonce); color: var(--sur-action); }
.btn.petit { min-height: 38px; padding: 6px 14px; font-size: .92rem; }
.btn.large { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; transform: none; }
.lien-btn { display: inline; min-height: 0; padding: 4px 2px; border: 0; background: none; color: var(--magenta); font-weight: 600; text-decoration: underline; text-underline-offset: .18em; cursor: pointer; }
.insecable { white-space: nowrap; }
.champ { display: grid; gap: 6px; margin: 0 0 16px; }
.champ > label { font-weight: 600; }
.aide { margin: 0; color: var(--gris); font-size: .9rem; }
input[type=email], input[type=password], input[type=text], input[type=tel], textarea {
  width: 100%; min-height: 48px; padding: 11px 14px; border: 1.5px solid var(--bord-champ); border-radius: 14px; background: var(--surface); color: var(--encre); font-size: 1rem; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
input:focus-visible, textarea:focus-visible { outline: 3px solid var(--magenta); outline-offset: 1px; border-color: var(--magenta); border-radius: 14px; }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--alerte); }
.erreur-champ { color: var(--alerte); font-size: .92rem; font-weight: 600; margin: 0; }
.mdp { position: relative; }
.mdp input { padding-right: 96px; }
.mdp .voir { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); min-height: 36px; padding: 4px 12px; border: 0; border-radius: 999px; background: none; color: var(--magenta); font-weight: 600; font-size: .92rem; cursor: pointer; }
.mdp .voir:hover { background: var(--magenta-doux); }
.message { margin: 0 0 18px; padding: 12px 14px; border-radius: var(--rayon-s); border: 1px solid; font-weight: 500; }
.message.erreur { background: var(--alerte-doux); border-color: color-mix(in srgb, var(--alerte) 35%, transparent); color: var(--alerte); }
.message.info { background: var(--ok-doux); border-color: color-mix(in srgb, var(--ok) 30%, transparent); color: var(--ok); }
.message.conseil { background: var(--surface); border-color: var(--filet); color: var(--encre); }
.message.horsligne { background: var(--option-doux); border-color: color-mix(in srgb, var(--option) 30%, transparent); color: var(--option); }
.chargement { margin: 0; padding: 70px 20px; color: var(--gris); text-align: center; }
.vide { margin: 0; padding: 22px 18px; border: 1.5px dashed var(--filet); border-radius: var(--rayon); color: var(--gris); text-align: center; }

/* les squelettes : la forme de ce qui arrive */
.squelette { position: relative; overflow: hidden; border-radius: var(--rayon); background: var(--surface-2); }
.squelette.ligne { height: 14px; border-radius: 7px; margin: 10px 0; }
@media (prefers-reduced-motion: no-preference) {
  .squelette::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 60%, transparent), transparent); animation: lueur 1.3s infinite; }
  @keyframes lueur { to { transform: translateX(100%); } }
}

/* ———— le héros : la prochaine date, en grand, dans l'univers du spectacle ———— */
.heros { position: relative; display: block; overflow: hidden; border-radius: 26px; background: var(--h-fond, #1d1418); color: var(--h-texte, #fff); text-decoration: none; box-shadow: var(--ombre-haute); isolation: isolate; }
.heros:hover { color: var(--h-texte, #fff); }
.heros-photo { position: absolute; inset: 0 0 auto 0; height: 62%; background: var(--h-fond) center/cover no-repeat; z-index: -2; }
.heros-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--h-fond) 10%, transparent) 0%, color-mix(in srgb, var(--h-fond) 55%, transparent) 55%, var(--h-fond) 100%); }
.heros-motif { position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--h-accent, #bc3e80) 40%, transparent), transparent 70%); z-index: -1; opacity: .8; }
.heros-corps { position: relative; display: grid; gap: 10px; padding: 132px 20px 20px; }
.heros-haut { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: absolute; top: 14px; left: 16px; right: 16px; }
.etiquette-verre { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--h-fond) 62%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--h-texte); font: 700 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.heros-titre { font: 600 clamp(2rem, 9vw, 2.9rem)/1.02 var(--h-police, var(--serif)); font-weight: var(--h-graisse, 600); letter-spacing: -.01em; color: var(--h-texte); text-wrap: balance; }
.heros-quand { margin: 0; font: 600 1.06rem/1.35 var(--sans); }
.heros-ou { margin: 0; display: flex; align-items: center; gap: 7px; opacity: .92; }
.heros-ou .ic { color: var(--h-accent); }
.decompte-grand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 2px; }
.decompte-grand .chiffre { font: 700 clamp(2.6rem, 13vw, 3.6rem)/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.03em; color: var(--h-accent); }
.decompte-grand .unite { font: 600 1.05rem/1.2 var(--sans); }
.horaires-heros { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 0; padding: 0; list-style: none; }
.horaires-heros li { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 12px; border-radius: 14px; background: color-mix(in srgb, var(--h-texte) 12%, transparent); font-weight: 600; }
.horaires-heros b { font: 700 1.2rem/1 var(--sans); font-variant-numeric: tabular-nums; }
.horaires-heros .annulee b { text-decoration: line-through; opacity: .7; }
.heros-pied { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
.heros .btn { background: var(--h-texte); border-color: var(--h-texte); color: var(--h-fond); }
.heros .btn.verre { background: color-mix(in srgb, var(--h-texte) 14%, transparent); border-color: color-mix(in srgb, var(--h-texte) 30%, transparent); color: var(--h-texte); }
.heros-actions { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 2; }
.lien-etendu::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.heros .lien-etendu { color: inherit; text-decoration: none; }
@media (min-width: 760px) { .heros-corps { padding: 170px 32px 28px; } .heros-photo { height: 70%; } }

/* ———— le jour J : le planning de la feuille de route, en frise ———— */
.jourj { margin: 16px 0 0; padding: 18px 18px 8px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--filet); box-shadow: var(--ombre); }
.jourj h2 { display: flex; align-items: center; gap: 8px; font: 700 .76rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--magenta); margin-bottom: 12px; }
.frise { list-style: none; margin: 0; padding: 0 0 0 4px; position: relative; }
.frise::before { content: ""; position: absolute; left: 70px; top: 6px; bottom: 6px; width: 2px; background: var(--filet); border-radius: 2px; }
.frise li { position: relative; display: grid; grid-template-columns: 58px 1fr; gap: 0 26px; padding: 6px 0 12px; }
.frise .h { font: 700 1rem/1.4 var(--sans); font-variant-numeric: tabular-nums; text-align: right; }
.frise .t { font-weight: 600; line-height: 1.35; }
.frise .s { display: block; color: var(--gris); font-size: .9rem; font-weight: 400; }
.frise li::before { content: ""; position: absolute; left: 62px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--filet); }
.frise li.passe { opacity: .55; }
.frise li.passe::before { background: var(--filet); }
.frise li.maintenant::before { background: var(--magenta); border-color: var(--magenta); box-shadow: 0 0 0 5px var(--magenta-doux); }
.frise li.maintenant .t::after { content: " · en ce moment"; color: var(--magenta); font-weight: 700; }
.frise li.accent .t { color: var(--u-texte, var(--magenta)); }
.frise .jour-frise { display: block; grid-column: 1 / -1; margin: 4px 0 6px 84px; font: 700 .78rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.frise li.jour { padding: 0; }
.frise li.jour::before { display: none; }
@media (prefers-reduced-motion: no-preference) { .frise li.maintenant::before { animation: battement 1.8s ease-in-out infinite; } @keyframes battement { 50% { box-shadow: 0 0 0 9px transparent; } } }

/* ———— les chiffres de la saison, la carte de la tournée ———— */
.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0 0; padding: 0; list-style: none; }
.chiffres li { padding: 14px 12px 12px; border-radius: var(--rayon-s); background: var(--surface); border: 1px solid var(--filet); }
.chiffres b { display: block; font: 700 clamp(1.4rem, 6.4vw, 1.9rem)/1.05 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.chiffres span { display: block; margin-top: 4px; color: var(--gris); font-size: .84rem; line-height: 1.25; }
.carte-tournee { margin: 12px 0 0; padding: 12px 12px 8px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--filet); }
.carte-tournee svg { display: block; width: 100%; height: auto; max-height: 460px; }
.carte-tournee .pays { fill: var(--surface-2); stroke: var(--filet); stroke-width: 1.2; }
.carte-tournee .voisin { fill: var(--papier); stroke: var(--filet); stroke-width: 1; }
.carte-tournee .rouen { fill: var(--magenta-vif); stroke: var(--surface); stroke-width: 2; }
.carte-tournee .rouen-nom, .carte-tournee .lieu-nom-carte { font: 700 13px var(--sans); fill: var(--encre); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.carte-tournee .bras { fill: var(--c); opacity: .9; }
.carte-tournee .bras.passe { opacity: .3; }
.carte-tournee .point { fill: var(--surface); stroke: var(--c); stroke-width: 2.4; }
.carte-tournee .point.passe { stroke-width: 1.4; opacity: .5; }
.carte-tournee figcaption { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 4px 2px; color: var(--gris); font-size: .86rem; }
.carte-tournee .legende { display: inline-flex; align-items: center; gap: 6px; }
.carte-tournee .legende i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }

/* ———— le billet : une date de tournée (dans la liste : la carte qui s'ouvre en sa page) ———— */
.billet { position: relative; background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); box-shadow: var(--ombre); overflow: hidden; transition: transform .15s, box-shadow .2s; }
.billet::before { content: ""; position: absolute; z-index: 1; left: 0; top: 0; bottom: 0; width: 6px; background: var(--u, var(--magenta)); }
a.billet, .billet .lien-etendu { color: inherit; text-decoration: none; }
.billet:has(.lien-etendu:hover) { box-shadow: var(--ombre-haute); }
.billet:has(.lien-etendu:active) { transform: scale(.985); }
.billet-haut { padding: 14px 44px 14px 22px; }
.billet-titre { display: grid; gap: 2px; }
.billet-spectacle { font: 600 1.3rem/1.15 var(--serif); color: var(--u-texte, var(--magenta)); }
.billet-quand { font: 600 1rem/1.35 var(--sans); color: var(--encre); }
.billet .chevron { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--gris); z-index: 0; }
.billet .etat { margin: 8px 0 0; }
.etat { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 700 .78rem/1.35 var(--sans); background: var(--surface-2); color: var(--encre); }
.etat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.etat.option { background: var(--option-doux); color: var(--option); }
.etat.annulee { background: var(--alerte-doux); color: var(--alerte); }
.etat.reportee { background: var(--sco-doux); color: var(--sco); }
.billet.annulee::before, .billet.reportee::before { background: repeating-linear-gradient(-45deg, var(--u, var(--magenta)) 0 5px, transparent 5px 9px); }
.billet.annulee .billet-spectacle, .billet.reportee .billet-spectacle { color: var(--gris); }
.billet.annulee .heure, .billet.reportee .heure { color: var(--gris); text-decoration: line-through; text-decoration-thickness: 2px; }
.horaires { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.horaires li { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 2px 14px; }
.horaires.jours li { grid-template-columns: 5.4em auto minmax(0, 1fr); gap: 2px 10px; }
.h-plus { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.h-plus:empty { display: none; }
.h-jour { font-weight: 600; color: var(--gris); white-space: nowrap; }
.heure { min-width: 3.4em; font: 700 1.3rem/1.15 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.billet .horaires .heure.vague, .page-date .horaires .heure.vague { min-width: 0; font: 600 1rem/1.35 var(--sans); letter-spacing: 0; color: var(--gris); white-space: normal; }
.horaires li.sans-heure { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.horaires.jours li.sans-heure .h-jour { min-width: 5.4em; }
.public { padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--encre); font-size: .86rem; font-weight: 600; }
.public.sco { background: var(--sco-doux); color: var(--sco); }
.horaires .annulee .heure { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--gris); }
.horaires .annulee .h-jour { color: var(--gris); }
.horaires .note { color: var(--gris); font-size: .9rem; }
.horaires .etat { font-size: .74rem; padding: 1px 8px; }
.sans-horaire { margin: 10px 0 0; color: var(--gris); }
.billet-ou { display: flex; align-items: flex-start; gap: 7px; margin: 10px 0 0; line-height: 1.35; }
.billet-ou .ic { width: 18px; height: 18px; margin-top: 1px; color: var(--u-texte, var(--magenta)); }
.vague { color: var(--gris); }
.precisions { margin: 8px 0 0; padding: 0; list-style: none; color: var(--gris); font-size: .93rem; }
.precisions a { position: relative; z-index: 2; }
.billet-pied { position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 18px 12px 22px; border-top: 2px dashed var(--filet); }
.billet-pied::before, .billet-pied::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--papier); border: 1px solid var(--filet); }
.billet-pied::before { left: -11px; }
.billet-pied::after { right: -11px; }
.f-lib { font: 700 .72rem/1.3 var(--sans); letter-spacing: .11em; text-transform: uppercase; color: var(--gris); }
.f-version { color: var(--gris); font-size: .9rem; }
.mini-equipe { display: flex; align-items: center; margin-left: auto; }
.mini-equipe .avatar { width: 30px; height: 30px; font-size: .72rem; margin-left: -8px; box-shadow: 0 0 0 2px var(--surface); }
.mini-equipe .plus { margin-left: 6px; color: var(--gris); font-size: .84rem; font-weight: 600; }
.billet.passee { box-shadow: none; }
.billet.passee .billet-spectacle { font-size: 1.12rem; }
.billet.passee .heure { font-size: 1.05rem; }

/* ———— la page d'une date ———— */
.page-date .heros-corps { padding-top: 150px; }
.bloc { margin: 14px 0 0; padding: 16px 18px; border-radius: var(--rayon); background: var(--surface); border: 1px solid var(--filet); }
.bloc h2 { font: 700 .76rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.bloc .liens { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0 0; }
.lieu-nom { font-weight: 700; margin: 0; }
.lieu-adresse { margin: 2px 0 0; }
.compte-nb { color: var(--gris); font-weight: 600; letter-spacing: 0; text-transform: none; }
.portraits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 10px; }
.portraits li { display: flex; align-items: center; gap: 10px; min-width: 0; }
.portraits .qui { min-width: 0; line-height: 1.25; }
.portraits .qui b { display: block; font-weight: 600; }
.portraits .qui span { display: block; color: var(--gris); font-size: .86rem; }
.portraits .qui em { display: block; color: var(--gris); font-size: .84rem; }
.avatar { position: relative; display: inline-grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: var(--a-fond, var(--surface-2)); color: var(--a-texte, var(--encre)); font: 700 .95rem/1 var(--sans); letter-spacing: .02em; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.avatar.moi-meme { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--magenta); }
.vous { display: inline-block; margin-left: 4px; padding: 0 7px; border-radius: 999px; background: var(--magenta-doux); color: var(--magenta); font: 700 .72rem/1.6 var(--sans); vertical-align: 1px; }
.puces-docs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.puce-doc { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 14px; border: 1.5px solid var(--filet); border-radius: 999px; background: var(--surface); color: var(--encre); font: 600 .93rem/1.2 var(--sans); text-decoration: none; cursor: pointer; text-align: left; }
.puce-doc:hover { border-color: var(--u, var(--magenta)); color: var(--encre); }
.puce-doc .ic { width: 16px; height: 16px; color: var(--u-texte, var(--magenta)); }

/* ———— les saisons passées ———— */
.saisons { display: grid; gap: 10px; }
.saison { border: 1px solid var(--filet); border-radius: var(--rayon); background: color-mix(in srgb, var(--surface) 60%, var(--papier)); }
.saison > summary { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; min-height: 52px; cursor: pointer; list-style: none; border-radius: var(--rayon); }
.saison > summary::-webkit-details-marker { display: none; }
.saison > summary::before { content: ""; flex: none; width: 9px; height: 9px; margin: 8px 2px 0 0; border-right: 2px solid var(--gris); border-bottom: 2px solid var(--gris); transform: rotate(-45deg); transition: transform .15s; }
.saison[open] > summary::before { transform: rotate(45deg); }
.s-texte { display: grid; gap: 1px; }
.s-nom { font: 600 1.12rem/1.2 var(--serif); }
.s-compte { color: var(--gris); font-size: .92rem; }
.saison-corps { display: grid; gap: 12px; padding: 0 12px 14px; }

/* ———— l'agenda, l'installation, les cartes d'action ———— */
.carte-action { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 14px 0 0; padding: 14px 16px; border: 1px solid var(--filet); border-radius: var(--rayon); background: var(--surface); }
.carte-action .aide { flex: 1 1 220px; }
.carte-action .ic-rond { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--magenta-doux); color: var(--magenta); }
.etapes { margin: 10px 0 0; padding-left: 22px; }
.etapes li { margin: 4px 0; }

/* ———— les documents ———— */
.groupe-docs + .groupe-docs { margin-top: 24px; }
.groupe-tete { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.groupe-tete h2 { font: 600 1.25rem/1.2 var(--serif); color: var(--u-texte, var(--encre)); }
.pastille { width: 12px; height: 12px; flex: none; border-radius: 50%; background: var(--u, var(--magenta)); }
.liste-docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.doc { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; width: 100%; min-height: 62px; padding: 12px 16px; border: 1px solid var(--filet); border-left: 5px solid var(--u, var(--magenta)); border-radius: var(--rayon-s); background: var(--surface); color: var(--encre); text-decoration: none; text-align: left; cursor: pointer; font: inherit; transition: transform .12s; }
.doc:hover { border-color: color-mix(in srgb, var(--u, var(--magenta)) 60%, var(--filet)); border-left-color: var(--u, var(--magenta)); color: var(--encre); }
.doc:active { transform: scale(.985); }
.doc .ic { width: 24px; height: 24px; color: var(--u-texte, var(--magenta)); }
.doc-texte { display: grid; gap: 1px; min-width: 0; }
.doc-type { font: 700 .72rem/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.doc-titre { font-weight: 600; line-height: 1.3; }
.doc-src { color: var(--gris); font-size: .86rem; white-space: nowrap; }
@media (max-width: 420px) { .doc { grid-template-columns: auto minmax(0, 1fr); } .doc-src { grid-column: 2; white-space: normal; } }

/* ———— les feuilles de route ———— */
.liste-feuilles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feuille-item { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 14px 16px; border: 1px solid var(--filet); border-left: 5px solid var(--u); border-radius: var(--rayon-s); background: var(--surface); }
.feuille-item .ic-rond { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--u-fond); color: var(--u-texte); }
.feuille-item b { display: block; font: 600 1.08rem/1.2 var(--serif); color: var(--u-texte); }
.feuille-item span { display: block; color: var(--gris); font-size: .9rem; }
.feuille-item .btn { position: relative; z-index: 2; }
.feuille-item .jourj-badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--magenta); color: var(--sur-action); font: 700 .7rem/1.6 var(--sans); vertical-align: 2px; }
.retour { margin: 0 0 12px; }
.vue-feuille { max-width: 800px; margin: 0 auto; }
.barre-feuille { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 16px; }
.barre-feuille .f-version { margin: 0; }
.feuille-tete { position: relative; padding: 16px 18px 16px 24px; margin: 0 0 18px; background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); overflow: hidden; }
.feuille-tete::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--u, var(--magenta)); }
.feuille-tete h1 { font: 600 clamp(1.5rem, 5.6vw, 1.95rem)/1.15 var(--serif); }
.feuille-tete .sur { margin: 0 0 4px; font: 700 .74rem/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--u-texte, var(--magenta)); }
.feuille-tete p { margin: 6px 0 0; }
.feuille-cadre { min-width: 0; }

/* ———— les notifications ———— */
.notifs-jour { margin: 22px 4px 8px; font: 700 .78rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.notifs-jour:first-child { margin-top: 4px; }
.liste-notifs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.notif { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; width: 100%; padding: 14px 16px; border: 1px solid var(--filet); border-radius: var(--rayon-s); background: var(--surface); color: var(--encre); text-align: left; text-decoration: none; cursor: pointer; font: inherit; transition: transform .12s, background-color .2s; }
.notif:hover { color: var(--encre); background: color-mix(in srgb, var(--surface) 80%, var(--surface-2)); }
.notif:active { transform: scale(.985); }
.notif.non-lue { background: color-mix(in srgb, var(--magenta-doux) 55%, var(--surface)); border-color: color-mix(in srgb, var(--magenta) 30%, var(--filet)); }
.notif .ic-rond { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; background: var(--n-fond, var(--surface-2)); color: var(--n-encre, var(--encre)); }
.notif .n-titre { font-weight: 700; line-height: 1.3; }
.notif .n-texte { grid-column: 2; color: var(--gris); font-size: .93rem; line-height: 1.4; }
.notif .n-heure { color: var(--gris); font-size: .8rem; white-space: nowrap; padding-top: 2px; }
.notif .point-non-lu { position: absolute; right: 12px; bottom: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--magenta); }
.n-feuille { --n-fond: var(--magenta-doux); --n-encre: var(--magenta); }
.n-horaires { --n-fond: var(--option-doux); --n-encre: var(--option); }
.n-date { --n-fond: var(--sco-doux); --n-encre: var(--sco); }
.n-document { --n-fond: var(--ok-doux); --n-encre: var(--ok); }
.n-equipe { --n-fond: var(--surface-2); --n-encre: var(--encre); }
.n-message { --n-fond: var(--alerte-doux); --n-encre: var(--alerte); }
.bandeau-notif { position: fixed; z-index: 70; left: 50%; top: calc(10px + var(--hs)); transform: translate(-50%, -140%); width: min(480px, calc(100% - 20px)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 12px 12px 14px; border-radius: 20px; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--filet); box-shadow: var(--ombre-haute); color: var(--encre); text-decoration: none; transition: transform .45s cubic-bezier(.2, 1.2, .3, 1); }
.bandeau-notif.visible { transform: translate(-50%, 0); }
.bandeau-notif:hover { color: var(--encre); }
.bandeau-notif .n-titre { font-weight: 700; }
.bandeau-notif .n-texte { grid-column: 2; color: var(--gris); font-size: .9rem; }

/* ———— moi ———— */
.carte { background: var(--surface); border: 1px solid var(--filet); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 18px 18px 6px; }
.carte + .carte { margin-top: 14px; }
.carte h2 { font: 600 1.2rem/1.2 var(--serif); margin: 0 0 4px; }
.carte > p { margin: 0 0 14px; }
.carte .intro { color: var(--gris); }
.identite { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; padding-bottom: 18px; }
.identite .avatar { width: 72px; height: 72px; font-size: 1.4rem; grid-row: span 2; }
.identite .nom { margin: 0; font: 600 1.55rem/1.15 var(--serif); }
.identite .metiers { margin: 0; color: var(--gris); }
.identite .roles, .identite .compte-mel, .identite .aide { grid-column: 1 / -1; }
.roles { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.roles li { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; background: var(--surface-2); font-size: .92rem; }
.roles b { font-weight: 600; }
.compte-mel { display: grid; gap: 2px; margin: 12px 0 0; padding: 12px 14px; border-radius: var(--rayon-s); background: var(--surface-2); }
.compte-mel dt { font-weight: 600; font-size: .88rem; color: var(--gris); }
.compte-mel dd { margin: 0; font-weight: 600; word-break: break-all; }
.pied-form { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 4px 0 16px; }
.etat-form { color: var(--gris); font-size: .93rem; }
.etat-form.ok { color: var(--ok); font-weight: 600; }
.etat-form.sale { color: var(--option); font-weight: 600; }
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 4px 0 14px; cursor: pointer; }
.interrupteur .lib { font-weight: 600; }
.interrupteur .lib small { display: block; color: var(--gris); font-weight: 400; font-size: .9rem; }
.bascule { position: relative; flex: none; width: 52px; height: 32px; border: 0; border-radius: 999px; background: var(--surface-3); cursor: pointer; transition: background-color .2s; }
.bascule::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.bascule[aria-checked="true"] { background: var(--action); }
.bascule[aria-checked="true"]::after { transform: translateX(20px); }
.bascule[disabled] { opacity: .5; cursor: default; }
@media (min-width: 640px) { .deux-champs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; } .carte { padding: 22px 24px 8px; } }

/* ———— écrans seuls : connexion, mot de passe, compte sans fiche ———— */
